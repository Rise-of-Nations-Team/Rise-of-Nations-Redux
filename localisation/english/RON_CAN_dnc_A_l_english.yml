l_english:

#Focuses
 CANDNC_the_question_of_1899: "The Question of 1899"
 CANDNC_the_question_of_1899_desc: "In October 1899 an order in council sent a contingent to South Africa with no vote of the Commons. Laurier calls it no precedent. Every cabinet after him will call it one."
 CANDNC_the_crown_commits: "The Crown Commits"
 CANDNC_the_crown_commits_desc: "The executive engages the country and tells the House afterwards. Troops sail, the orders from London follow, and Quebec learns that it can be put at war without being asked."
 CANDNC_the_commons_must_vote: "The Commons Must Vote"
 CANDNC_the_commons_must_vote_desc: "No man and no dollar leaves the country until the House has voted it. The Dominion keeps its own hands, and loses the contracts, the credit and the chair that come with obedience."
 CANDNC_the_school_of_the_minority: "The School of the Minority"
 CANDNC_the_school_of_the_minority_desc: "Ottawa writes the guarantee itself: the Catholic and French minority keeps its own schools wherever a new province is made. The West calls it a law imposed from the Saint Lawrence."
 CANDNC_the_school_of_the_province: "The School of the Province"
 CANDNC_the_school_of_the_province_desc: "Education belongs to the province and to nobody else. Ottawa keeps its pen in its pocket, the West is satisfied, and what is not written into the constitution now will never be written."
 CANDNC_government_by_order_in_council: "Government by Order in Council"
 CANDNC_government_by_order_in_council_desc: "What the Commons would debate for a session, the council settles in an afternoon. The orders of 8 January and 3 June 1908 shut a door that no member ever voted to close."
 CANDNC_the_bishops_of_the_west: "The Bishops of the West"
 CANDNC_the_bishops_of_the_west_desc: "Archbishop Adelard Langevin of Saint-Boniface and the episcopate want the school regime of the North-West Territories Act of 1875 back: Catholic schools fully funded and taught in French."
 CANDNC_the_census_of_1901: "The Census of 1901"
 CANDNC_the_census_of_1901_desc: "31 March 1901: 5,371,315 people. Montreal 267,730, Toronto 208,040, Winnipeg 42,340, Vancouver 27,010. Quebec keeps its 65 seats as the fixed denominator of section 51."
 CANDNC_the_ordinance_of_1901: "The Ordinance of 1901"
 CANDNC_the_ordinance_of_1901_desc: "The territorial school ordinance is consolidated. English is the language of instruction, French tolerated in the first years only, and religious teaching pushed to one hour at the end of the day."
 CANDNC_the_motion_of_the_member_for_labelle: "The Member for Labelle"
 CANDNC_the_motion_of_the_member_for_labelle_desc: "13 March 1900: Henri Bourassa, back by acclamation after resigning in protest, moves that the contingent be held to be no precedent. Laurier answers that each case will be decided separately."
 CANDNC_the_proclamation_of_edward_vii: "The Proclamation of Edward VII"
 CANDNC_the_proclamation_of_edward_vii_desc: "22 January 1901: Victoria dies after 63 years and 7 months and Edward VII is proclaimed king in Canada. The royal title, the prerogative and the naming of the governor general do not change."
 CANDNC_the_guarantee_of_1867: "The Guarantee of 1867"
 CANDNC_the_guarantee_of_1867_desc: "The bargain of Confederation protected the minority school where it already stood. The bishops ask that the guarantee travel west with the settlers. The Orange lodges answer that it stops at the Red River."
 CANDNC_the_redistribution_of_1903: "The Redistribution of 1903"
 CANDNC_the_redistribution_of_1903_desc: "The seats are recut on the census. Voted in 1903 and applied at the poll of 1904, it takes Ontario from 92 members down to 86 while Quebec keeps its guaranteed 65 and the West gains."
 CANDNC_the_school_belongs_to_the_province: "The School Belongs to the Province"
 CANDNC_the_school_belongs_to_the_province_desc: "Education is a provincial head of power and the Liberals have fought twenty years for provincial rights. To write a school clause into a federal statute is to unsay everything they have said."
 CANDNC_each_case_decided_separately: "Each Case Decided Separately"
 CANDNC_each_case_decided_separately_desc: "Laurier answers the House that the contingent binds nobody and that every future call will be weighed on its own. A doctrine that keeps the caucus whole and settles nothing at all."
 CANDNC_the_governor_generals_commission: "The Governor General's Commission"
 CANDNC_the_governor_generals_commission_desc: "10 December 1904: Earl Grey succeeds Lord Minto for seven years. The letters patent and the commission carry the command in chief, and the Crown's man at Ottawa is still chosen in London."
 CANDNC_a_school_law_written_in_ottawa: "A School Law Written in Ottawa"
 CANDNC_a_school_law_written_in_ottawa_desc: "Clause sixteen as Laurier and Charles Fitzpatrick drafted it, laid before the House on 21 February 1905: separate schools guaranteed by federal statute in any new province."
 CANDNC_the_poll_of_1904: "The Poll of 1904"
 CANDNC_the_poll_of_1904_desc: "3 November 1904: the Liberals take 137 seats of 214 with 50.88 per cent. Ontario, six seats lighter, still returns 44 Conservatives to 37 Liberals; Quebec sends 53 Liberals out of 65."
 CANDNC_the_province_writes_its_own_law: "The Province Writes Its Own Law"
 CANDNC_the_province_writes_its_own_law_desc: "The clause is rewritten with Sifton and Fitzpatrick: the new provinces inherit the territorial ordinance of 1901, not the act of 1875. The party is saved, the minority of the West is not."
 CANDNC_no_man_and_no_dollar: "No Man and No Dollar"
 CANDNC_no_man_and_no_dollar_desc: "Supply is the oldest weapon of the Commons. Nothing sails and nothing is paid for until the estimates are voted, whatever the Colonial Office asks and however quickly it asks it."
 CANDNC_the_royal_tour_of_1901: "The Royal Tour of 1901"
 CANDNC_the_royal_tour_of_1901_desc: "16 September to 21 October 1901: the Duke and Duchess of Cornwall and York cross the country by special train from Quebec to the Pacific coast and back in a little over five weeks."
 CANDNC_the_apostolic_delegate: "The Apostolic Delegate"
 CANDNC_the_apostolic_delegate_desc: "Monsignor Donatus Sbarretti speaks for Rome at Ottawa and presses for the schools of the minority. A cabinet that answers him loses the West; a cabinet that ignores him loses its own bench."
 CANDNC_the_quebec_of_parent: "The Quebec of Parent"
 CANDNC_the_quebec_of_parent_desc: "3 October 1900: Simon-Napoleon Parent takes the province after the death of Felix-Gabriel Marchand on 25 September, and keeps the mayoralty of Quebec City as well. Two offices, one pair of hands."
 CANDNC_the_orange_order_and_the_west: "The Orange Order and the West"
 CANDNC_the_orange_order_and_the_west_desc: "Protestant Ontario and the settlers beyond the Red River will not take a Catholic school system written for them at Ottawa. Sifton speaks for them at the council table, then leaves it in February 1905."
 CANDNC_the_nationalist_league: "The Nationalist League"
 CANDNC_the_nationalist_league_desc: "1 March 1903 at Montreal: Olivar Asselin and Armand Lavergne found the Ligue nationaliste on three articles, autonomy in the Empire, autonomy of the provinces, a Canadian economic policy."
 CANDNC_the_outside_service_stays_ours: "The Outside Service Stays Ours"
 CANDNC_the_outside_service_stays_ours_desc: "Post offices, customs houses and wharf work are the currency of a member's re-election. The inside service at Ottawa may go to examination; the country appointments stay with the minister."
 CANDNC_the_autonomy_bills: "The Autonomy Bills"
 CANDNC_the_autonomy_bills_desc: "21 February 1905: Laurier lays before the Commons the bills that will make provinces out of the North-West Territories. One article of them will very nearly break his cabinet."
 CANDNC_the_opposition_bench: "The Opposition Bench"
 CANDNC_the_opposition_bench_desc: "Robert Laird Borden has led the Conservatives since 1901. An opposition able to force a division keeps a government honest and keeps it slow, and both are the price of a Parliament that decides."
 CANDNC_the_precedent_of_the_dominion: "The Precedent of the Dominion"
 CANDNC_the_precedent_of_the_dominion_desc: "A custom, not a statute: once a cabinet has committed the country without the House, the precedent belongs to every cabinet after it. It will be cited in 1914, at Chanak in 1922 and in 1939."
 CANDNC_the_province_of_buffalo: "The Province of Buffalo"
 CANDNC_the_province_of_buffalo_desc: "Frederick Haultain asks for one province out of the Territories, owning its own land, and would call it Buffalo. About 440,000 people in 1906, fewer than 400,000 in 1905, and one voice for the West."
 CANDNC_two_provinces_on_a_meridian: "Two Provinces on a Meridian"
 CANDNC_two_provinces_on_a_meridian_desc: "Alberta and Saskatchewan, cut apart by a line of longitude. Ottawa divides the political weight of the West in the same act by which it keeps the land of the West, and both provinces know it."
 CANDNC_the_house_will_decide: "The House Will Decide"
 CANDNC_the_house_will_decide_desc: "Four words that bind every cabinet after this one. A government that has demanded the vote cannot later do without it, unless it admits that the last war was fought without warrant."
 CANDNC_the_price_of_the_precedent: "The Price of the Precedent"
 CANDNC_the_price_of_the_precedent_desc: "Quebec has learned that it can be put at war without being consulted, and it will not forget. The recruiting sergeant gains what the province loses, and the account stays open until 1917."
 CANDNC_haultain_takes_office: "Haultain Takes Office"
 CANDNC_haultain_takes_office_desc: "The premier of the Territories is called to form the first government of the new West instead of being shut out of it. The provincial rights movement enters Confederation with a seal and an office."
 CANDNC_the_lieutenant_governors_call: "The Lieutenant Governor's Call"
 CANDNC_the_lieutenant_governors_call_desc: "G. H. V. Bulyea at Edmonton and A. E. Forget at Regina, both named by Ottawa, call Liberals to office before a single vote is cast. The West is taught that federalism is first of all a party machine."
 CANDNC_the_price_of_the_vote: "The Price of the Vote"
 CANDNC_the_price_of_the_vote_desc: "London places its orders where the answer comes quickly. A Dominion that will promise nothing in advance is not invited to the table where the promises are made."
 CANDNC_the_provincial_rights_movement: "The Provincial Rights Movement"
 CANDNC_the_provincial_rights_movement_desc: "What the Territories learned in fighting Ottawa becomes a federal argument. Provincial rights stop being a western grievance and start being a doctrine with members in the House."
 CANDNC_two_liberal_governments: "Two Liberal Governments"
 CANDNC_two_liberal_governments_desc: "A. C. Rutherford in Alberta, Walter Scott in Saskatchewan, installed before any election and confirmed at the polls of November and December 1905. Ottawa has made itself two friendly capitals."
 CANDNC_the_lands_the_mines_and_the_forests: "The Lands, the Mines and the Forests"
 CANDNC_the_lands_the_mines_and_the_forests_desc: "The Alberta Act and the Saskatchewan Act are assented on 20 July 1905 and the provinces exist on 1 September. Land, mines, timber and water stay federal, with a yearly subsidy instead."
 CANDNC_a_federal_police_for_the_west: "A Federal Police for the West"
 CANDNC_a_federal_police_for_the_west_desc: "On 24 June 1904 the North-West Mounted Police is granted the royal prefix. One federal force covers the West and the Yukon, and the new legislatures set neither its mandate nor its doctrine."
 CANDNC_the_lieutenant_governor: "The Lieutenant Governor"
 CANDNC_the_lieutenant_governor_desc: "In every province the Crown keeps a servant appointed at Ottawa. He may reserve a bill instead of signing it, and the bill then waits upon the pleasure of the governor general."
 CANDNC_the_new_legislatures: "The New Legislatures"
 CANDNC_the_new_legislatures_desc: "Edmonton on 1 September and Regina on 4 September 1905, opened with Laurier and Earl Grey in attendance. Two houses sit where a territorial assembly used to send petitions."
 CANDNC_the_power_of_disallowance: "The Power of Disallowance"
 CANDNC_the_power_of_disallowance_desc: "A provincial statute can be killed outright by the governor in council within a year of its passing. British Columbia's exclusion acts are disallowed or reserved right through the decade."
 CANDNC_the_judicial_committee_decides: "The Judicial Committee Decides"
 CANDNC_the_judicial_committee_decides_desc: "Leave the provinces to the courts. The Judicial Committee of the Privy Council in London will settle who may legislate upon what, and it will settle it for the provinces until 1949."
 CANDNC_the_veto_of_ottawa: "The Veto of Ottawa"
 CANDNC_the_veto_of_ottawa_desc: "The federal cabinet uses the instrument while it still can. Every statute struck down buys a year of uniformity and a decade of provincial memory."
 CANDNC_the_lords_day_act: "The Lord's Day Act"
 CANDNC_the_lords_day_act_desc: "Assented 13 July 1906 under the federal criminal law power and in force on 1 March 1907, carried by the Lord's Day Alliance. Prosecutions are left to the provincial attorneys general."
 CANDNC_the_provinces_win_in_london: "The Provinces Win in London"
 CANDNC_the_provinces_win_in_london_desc: "The board that hears the appeals sits three thousand miles away and reads the act of 1867 as a treaty between provinces. Ottawa legislates knowing exactly where its statutes go to die."
 CANDNC_the_quebec_of_gouin: "The Quebec of Gouin"
 CANDNC_the_quebec_of_gouin_desc: "23 March 1905: Lomer Gouin takes the province after three ministers, himself among them, turn on Simon-Napoleon Parent over patronage and held offices. The party purges itself in public."
 CANDNC_the_national_battlefields_commission: "The National Battlefields Commission"
 CANDNC_the_national_battlefields_commission_desc: "17 March 1908: a federal commission is created to buy and lay out the Plains of Abraham for the tercentenary. The first great national historic park is made out of a French defeat."
 CANDNC_the_ontario_of_whitney: "The Ontario of Whitney"
 CANDNC_the_ontario_of_whitney_desc: "25 January 1905: James Pliny Whitney's Conservatives end thirty-four years of Liberal government at Toronto. The province becomes an economic actor and a cultural arbiter in the same session."
 CANDNC_the_timber_limits_of_quebec: "The Timber Limits of Quebec"
 CANDNC_the_timber_limits_of_quebec_desc: "The nationalists attack the granting of forest limits and the party answers by changing its leader. Gouin keeps the office and concedes in public that his accusers were right."
 CANDNC_the_tercentenary_of_quebec: "The Tercentenary of Quebec"
 CANDNC_the_tercentenary_of_quebec_desc: "20 to 31 July 1908: twelve days of naval procession and open air pageants for three centuries, with the Prince of Wales, the governor general and French, British and American delegations."
 CANDNC_the_provincial_university: "The Provincial University"
 CANDNC_the_provincial_university_desc: "1906: Ontario gives the University of Toronto a board of governors separate from the government, and Alberta passes its own university act. Higher learning leaves the churches for the treasury."
 CANDNC_the_member_for_saint_jacques: "The Member for Saint-Jacques"
 CANDNC_the_member_for_saint_jacques_desc: "8 June 1908: Henri Bourassa beats the premier in Saint-Jacques. Lomer Gouin, also a candidate in Portneuf, keeps that seat and his government, and now debates his critic every week."
 CANDNC_the_civil_service_commission: "The Civil Service Commission"
 CANDNC_the_civil_service_commission_desc: "20 July 1908: a commission is created and the inside service at Ottawa goes to competitive examination. The outside service, where the local member needs the appointments, is left alone."
 CANDNC_the_bishop_of_london: "The Bishop of London"
 CANDNC_the_bishop_of_london_desc: "1909: Michael Francis Fallon is named bishop of London in Ontario. Hostile to bilingual schools, he becomes the most effective adversary the Franco-Ontarians have inside their own church."
 CANDNC_the_nationalists_in_the_assembly: "The Nationalists in the Assembly"
 CANDNC_the_nationalists_in_the_assembly_desc: "Bourassa and Armand Lavergne sit at Quebec and turn the criticism of the federal alliance into a weekly proceeding. The weekly of 1904 will become a daily in 1910 and be called Le Devoir."
 CANDNC_the_commission_of_conservation: "The Commission of Conservation"
 CANDNC_the_commission_of_conservation_desc: "Assented 19 May 1909. Federal ministers, provincial ministers and university men sit together upon resources, public health and planning. It may inquire and publish; it may not decide."
 CANDNC_the_circular_in_preparation: "The Circular in Preparation"
 CANDNC_the_circular_in_preparation_desc: "Ontario is drafting the instruction circular that will come in 1912 and carry the number seventeen. About 158,000 Franco-Ontarians were counted in 1901 and near 200,000 will be counted next."
 CANDNC_the_constitution_of_a_dominion: "The Constitution of a Dominion"
 CANDNC_the_constitution_of_a_dominion_desc: "Who commits the country, who writes the school law, and who owns the West. Three answers given between 1900 and 1909, and not one of the three can be given a second time."

#Ideas
 CAN_the_royal_prerogative: "The Royal Prerogative"
 CAN_the_royal_prerogative_desc: "The Crown declares and the cabinet answers. Men and money can be found in a week, and the province that was never asked keeps the count."
 CAN_parliament_decides: "Parliament Decides"
 CAN_parliament_decides_desc: "Every commitment passes through a division of the House. The country is calm and slow, and the orders from London go to a Dominion that answers faster."
 CAN_rule_by_order_in_council: "Rule by Order in Council"
 CAN_rule_by_order_in_council_desc: "Policy made in council needs no majority and no debate. It is quick, it is quiet, and every use of it teaches the House that it is not needed."
 CAN_the_separate_school_guarantee: "The Separate School Guarantee"
 CAN_the_separate_school_guarantee_desc: "Two school systems paid for out of one treasury, and a federal statute standing over a provincial head of power. Quebec is quiet, the West is not, and the bill comes in twice."
 CAN_one_school_one_language: "One School, One Language"
 CAN_one_school_one_language_desc: "A single school in a single language assimilates the West cheaply. The Catholic clergy and the French minorities pay the difference, and they will send the bill in 1912."
 CAN_the_nationalist_press: "The Nationalist Press"
 CAN_the_nationalist_press_desc: "Le Nationaliste appears on 6 March 1904 as the paper of the League. Its polemic finds a public, and its authors find the libel suits that come with one."
 CAN_the_patronage_of_the_service: "The Patronage of the Service"
 CAN_the_patronage_of_the_service_desc: "Every appointment in the country service belongs to the member who won the seat. It buys loyalty by the wharf and it staffs the Dominion with men chosen for their votes."
 CAN_the_standing_precedent: "The Standing Precedent"
 CAN_the_standing_precedent_desc: "The order in council of 1899 is now the rule of the house. No future cabinet has to ask, and no future cabinet can pretend that it was ever obliged to."
 CAN_the_word_of_the_house: "The Word of the House"
 CAN_the_word_of_the_house_desc: "Nothing is undertaken until the Commons has spoken. The country cannot be surprised into a war, and it cannot be ready for one either."
 CAN_the_price_of_the_precedent: "The Price of the Precedent"
 CAN_the_price_of_the_precedent_desc: "One province keeps the account of every commitment made over its head. The depot fills, the counter climbs, and it will be presented in full in 1917."
 CAN_no_seat_at_the_table: "No Seat at the Table"
 CAN_no_seat_at_the_table_desc: "A Dominion that refuses to promise is not consulted. The imperial contracts go elsewhere and so does the credit, and the chair at the conference stays empty."
 CAN_the_lands_the_mines_and_the_forests: "The Lands, the Mines and the Forests"
 CAN_the_lands_the_mines_and_the_forests_desc: "The land, mines, timber and water of the new provinces stay in Ottawa's hands, with a subsidy in exchange. Not one acre will be handed over before 1930, and the West counts the years."
 CAN_the_veto_of_ottawa: "The Veto of Ottawa"
 CAN_the_veto_of_ottawa_desc: "The governor in council can strike a provincial act dead within the year. Used often it makes the federation uniform; used at all it makes the federation resentful."
 CAN_the_lords_day: "The Lord's Day"
 CAN_the_lords_day_desc: "One day of rest guaranteed by criminal law. The workman gains a Sunday; the mill loses a shift, and Quebec, the Jewish community and the manufacturers all read a confessional statute."
 CAN_the_judicial_committee: "The Judicial Committee"
 CAN_the_judicial_committee_desc: "A board in London decides the reach of every Canadian statute, and it decides for the provinces. Ottawa drafts with one eye on an appeal it cannot win."
 CAN_the_provincial_universities: "The Provincial Universities"
 CAN_the_provincial_universities_desc: "Toronto, Alberta and Saskatchewan build state universities out of provincial revenue. The churches lose the teaching of the elite and the treasury pays for the buildings."
 CAN_the_merit_of_the_inside_service: "The Merit of the Inside Service"
 CAN_the_merit_of_the_inside_service_desc: "Examinations at Ottawa, patronage everywhere else. The departments gain clerks who can count and the members lose the half of the list that they used to sell."
 CAN_the_school_of_the_circular: "The School of the Circular"
 CAN_the_school_of_the_circular_desc: "Ontario will settle the language of its classrooms by departmental instruction rather than by statute. It is quick, it is deniable, and it makes a national quarrel out of a school inspection."
 CAN_the_settled_constitution: "The Settled Constitution"
 CAN_the_settled_constitution_desc: "The custom of the country is fixed: who commits it, who teaches its children, who owns its West. A settled constitution governs cheaply and cannot be argued with later."
