l_english:

 #Consequence events for the R (regional) and ECO (economic) focus branches
 auh_nat_crisis.1.t:0 "The Wall on the Leitha"
 auh_nat_crisis.1.d:0 "The autonomous tariff has put a customs line where the two halves used to trade on one schedule, and the line is already worth more open than shut. Grain wagons cross the bridges under manifests nobody checks twice, cattle swim the shallows after dark, and the frontier officers on both banks have worked out between themselves which convoys not to see. Vienna wants the leak stopped before the Delegations ask why the new wall collects less than it was promised to."
 auh_nat_crisis.1.a:0 "'Post the army along the bridges.'"
 auh_nat_crisis.1.b:0 "'Let the district officers keep their arrangement.'"
 auh_nat_crisis.1.c:0 "'Try the biggest ring in open court.'"

 auh_nat_crisis.2.t:0 "A Run on the Provincial Chests"
 auh_nat_crisis.2.d:0 "The new bank has hardly opened its ledgers before a rumour starts in a Moravian market town that the small savings banks behind it will be made to answer for Vienna's debts before their own depositors'. Within a week the queues outside three provincial chests stretch past the church door. The tellers have specie for perhaps two days at this rate, and the bank in Vienna can cover the shortfall only by drawing down the reserve it was founded to protect."
 auh_nat_crisis.2.a:0 "'Cover the provincial banks from the central reserve.'"
 auh_nat_crisis.2.b:0 "'Let the small banks fail; the reserve is not theirs to spend.'"
 auh_nat_crisis.2.c:0 "'Suspend specie payment for thirty days and let tempers cool.'"

 auh_nat_crisis.3.t:0 "The Price of the Loaf"
 auh_nat_crisis.3.d:0 "The great roller mills of Budapest are running at a pace the Vienna bakers say is starving their own ovens of flour, and the price of a loaf in the capital has moved twice this month. The bakers' guild wants an export stop on milled flour; the millers, whose machines are the pride of the kingdom, call it an act of war on their own trade. Every household in the city reads the bread price before it reads anything else in the paper."
 auh_nat_crisis.3.a:0 "'Stop flour exports at the Cisleithanian border.'"
 auh_nat_crisis.3.b:0 "'Let the millers sell where they please.'"
 auh_nat_crisis.3.c:0 "'Buy the difference into a state granary and hold the price down.'"

 auh_nat_crisis.4.t:0 "Vitkovice Answers the Compromise"
 auh_nat_crisis.4.d:0 "The nine-hour bill was meant to settle the works, but the ironmasters at Vitkovice read it as a ceiling and the men read it as a floor. When the works posts nine hours as the new minimum shift rather than the promised maximum, the furnace crews walk out together, Czech and German foremen alike, and the ironworks that supplies half the realm's rolled steel banks its fires for the first time in a decade."
 auh_nat_crisis.4.a:0 "'Force the letter of the law on the company.'"
 auh_nat_crisis.4.b:0 "'Let the works interpret its own contract.'"
 auh_nat_crisis.4.c:0 "'Send the case to the new arbitration board.'"

 auh_nat_crisis.5.t:0 "The Derricks Fall Silent"
 auh_nat_crisis.5.d:0 "Boryslaw and Drohobycz between them drill more oil than the rest of the crownland combined, and the men who drill it -- Polish, Ruthenian and Jewish crews sharing the same derricks and the same wages -- have struck together over the price cut the refiners announced the same week the field's new order was gazetted. It is the one thing in Galicia the newspapers agree unites the peoples: not the register, not the diet, but a shared wage packet."
 auh_nat_crisis.5.a:0 "'Meet the wage demand out of the state's new share.'"
 auh_nat_crisis.5.b:0 "'Send the gendarmerie to reopen the field.'"
 auh_nat_crisis.5.c:0 "'Let the refiners and the men settle it between themselves.'"

 auh_nat_crisis.6.t:0 "The Line at the San Is Tested"
 auh_nat_crisis.6.d:0 "The new administrative line has hardly been surveyed before it is being walked by men with their own ideas of where it should run. A Polish manor east of the river finds its harvest crews turned back at what a Ruthenian peasant council now calls its own frontier, and the estate's overseer has wired for gendarmes before the district office has even printed the new maps."
 auh_nat_crisis.6.a:0 "'Uphold the new line and send gendarmes to the estate.'"
 auh_nat_crisis.6.b:0 "'Order the harvest crews through regardless of the line.'"
 auh_nat_crisis.6.c:0 "'Garrison the crossing until the survey is finished.'"

 auh_nat_crisis.7.t:0 "The Bailiffs Go Up the Valley"
 auh_nat_crisis.7.d:0 "With the Club's men back in the ministries, the estate owners in the Sejm have asked for the bailiffs to collect what the last two harvests left owing, in coin or in days of unpaid labour on the manor's own land. The peasant leagues that grew out of the last strike have not disbanded; they have met the bailiffs at the village boundary twice already and sent them home without their books."
 auh_nat_crisis.7.a:0 "'Back the estates; send gendarmerie with the bailiffs.'"
 auh_nat_crisis.7.b:0 "'Suspend the collection until the next harvest.'"
 auh_nat_crisis.7.c:0 "'Let the estates and the leagues negotiate a schedule.'"

 auh_nat_crisis.8.t:0 "The Signs Come Down in the Old Town"
 auh_nat_crisis.8.d:0 "The municipal council's ruling on which language the street signs and the schoolhouse doors may carry has reached the old town overnight: ladders against half the corner posts, hammers against the other half. One society calls it an eviction from a city its grandfathers built; the other calls it the first honest signpost the old town has had. The gendarmerie has orders to keep the two processions from meeting at the cathedral square."
 auh_nat_crisis.8.a:0 "'Uphold the council's ruling as printed.'"
 auh_nat_crisis.8.b:0 "'Split the difference: bilingual signs, one schoolhouse for each.'"
 auh_nat_crisis.8.c:0 "'Let the gendarmerie clear the square before the processions meet.'"
