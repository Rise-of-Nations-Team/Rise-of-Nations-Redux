l_english:

 #Admin/diplomatic branch consequence events (auh_admin_crisis)

 auh_admin_crisis.1.t:0 "The Twelve Peoples Read the Compromise"
 auh_admin_crisis.1.d:0 "The rescript proclaiming the Compromise as the constitution has gone out from the Hofburg, and both halves' parliaments have confirmed the two state peoples in their old place. The Czech National Council in Prague and the Croatian and Slovene clubs have answered with a joint memorandum: if German and Magyar are once again the sole tongues of empire and kingdom, they ask, what exactly was promised to the other ten peoples of the register. The memorandum is polite. It is also signed by every deputy who might otherwise have voted the government's estimates."
 auh_admin_crisis.1.a:0 "Answer with a rescript of reassurance."
 auh_admin_crisis.1.b:0 "Let the memorandum go unanswered."
 auh_admin_crisis.1.c:0 "Refer it to a future Crown Council on nationality law."
 AUH_ac_1a_tt:0 "The reassurance is read out in Prague and Zagreb, and costs the crown nothing but a little more of its patience."
 AUH_ac_1b_tt:0 "Silence is itself an answer, and the clubs who signed the memorandum hear it plainly."
 AUH_ac_1c_tt:0 "A council is promised for some unspecified year to come; nobody in the register is fooled, but nobody is provoked either."

 auh_admin_crisis.2.t:0 "The Czech Club Answers by Obstruction"
 auh_admin_crisis.2.d:0 "Paragraph Fourteen let the ministry pass this year's budget without the Reichsrat's vote, and the Young Czechs have replied in the only coin the chamber allows them: procedural motions read aloud for nine hours at a stretch, quorum calls timed to the minute, a stack of amendments nobody intends to see debated. The government can grind through the obstruction, buy it off with a concession, or answer decree with a fresh decree — but next year's session calendar is already being written around whichever it chooses."
 auh_admin_crisis.2.a:0 "Let the obstruction run its course."
 auh_admin_crisis.2.b:0 "Offer the Czech Club a concession on court language."
 auh_admin_crisis.2.c:0 "Answer the walkout with a fresh round of decrees."
 AUH_ac_2b_tt:0 "Prague reads the concession as a small victory; the German Club reads it as the first crack."
 AUH_ac_2c_tt:0 "The Young Czechs are told plainly that the paragraph will be used again if it must be."

 auh_admin_crisis.3.t:0 "The New Chamber Cannot Agree on a Chairman"
 auh_admin_crisis.3.d:0 "The first election under the new franchise has returned more than thirty parties to the House of Deputies, several of them a single member strong, and none of them speaking for a working majority. Three weeks in, the Chamber has yet to settle its own standing orders, let alone the government's estimates. The old curial elite calls it the predictable wages of universal manhood suffrage; the new deputies call it democracy learning to walk. Either way, nothing is being passed."
 auh_admin_crisis.3.a:0 "Let the parties fight it out on the floor."
 auh_admin_crisis.3.b:0 "Govern by Paragraph Fourteen regardless of the new Chamber."
 auh_admin_crisis.3.c:0 "Buy a working majority with patronage and offices."
 AUH_ac_3a_tt:0 "The new deputies note that the government let them fight it out honestly, whatever it cost the session."
 AUH_ac_3b_tt:0 "The franchise reform is a year old and already answered with the old paragraph; the reformers do not forget it."
 AUH_ac_3c_tt:0 "A majority is assembled out of offices and favours, and everyone in the lobby knows the price of every vote in it."

 auh_admin_crisis.4.t:0 "The Counties Answer the Gendarmes"
 auh_admin_crisis.4.d:0 "News of the scene in the Chamber — the opposition benches cleared by soldiers so the new standing orders could be carried — has reached the county assemblies before the official gazette did. A dozen county committees have voted resolutions of protest and instructed their sheriffs to look the other way if Budapest's circulars go unread. It is the same passive defiance the counties once used against Vienna, turned now against Budapest's own government."
 auh_admin_crisis.4.a:0 "Let the counties resolve and rage."
 auh_admin_crisis.4.b:0 "Send royal commissioners to overawe the defiant counties."
 auh_admin_crisis.4.c:0 "Reopen the Chamber and let the Speaker apologise."
 AUH_ac_4b_tt:0 "Commissioners sit in county hall after county hall, and the counties will not forget who sent them."
 AUH_ac_4c_tt:0 "An apology from the chair mends fences in the counties, and looks like weakness everywhere else."

 auh_admin_crisis.5.t:0 "Trieste Reads the Proclamation"
 auh_admin_crisis.5.d:0 "The courts-martial sit now in the Littoral under the state of exception, and the first sentences have gone out this week: modest fines for most of the men rounded up, a handful of prison terms for the newspapermen who printed the wrong editorial. Rome has not protested through the embassy, but the irredentist press in Trieste and Trento has printed the sentences in full, alongside the name of every judge who signed them."
 auh_admin_crisis.5.a:0 "Let the courts-martial run their course."
 auh_admin_crisis.5.b:0 "Quietly release the lesser prisoners."
 auh_admin_crisis.5.c:0 "Answer Rome's silence with a formal note of firmness anyway."
 AUH_ac_5a_tt:0 "The sentences stand, and the Littoral's Italian-speakers read them as confirmation of exactly what they feared."
 AUH_ac_5b_tt:0 "The lesser men go home quietly, and the newspapermen stay in their cells."
 AUH_ac_5c_tt:0 "Rome is told, unasked, that the courts-martial are the monarchy's own affair; the ally hears it as an affront."

 auh_admin_crisis.6.t:0 "The Delegations Ask What Rome Signed"
 auh_admin_crisis.6.d:0 "The renewed treaty is filed at the Ballhausplatz and toasted at the German embassy, but the Delegations' own foreign affairs committee has quietly asked to see the Italian annexes — the ones touching the Adriatic and the Balkans — before it votes the ministry's budget. Nobody doubts Berlin's word. Rome's is a different question, and everyone in the room remembers why."
 auh_admin_crisis.6.a:0 "Trust the treaty at face value; the committee is told to close the file."
 auh_admin_crisis.6.b:0 "Quietly reinforce the southern frontier against Italy anyway."
 auh_admin_crisis.6.c:0 "Publish the annexes to still the committee's doubts."
 AUH_ac_6b_tt:0 "The works on the southern frontier are not announced, but Rome's military attaché reports them within the month."
 AUH_ac_6c_tt:0 "The annexes are read aloud in committee, and the coast's own deputies do not much like what an ally's price for friendship turns out to be."

 auh_admin_crisis.7.t:0 "The Free Hand Is Debated Behind Closed Doors"
 auh_admin_crisis.7.d:0 "The declaration leaves the monarchy's Balkan policy unbound from Berlin's for the first time in a generation, and the general staff wants to know what exactly the freedom is meant to buy. The Delegations' military committee is split between those who read it as licence for the first opportunity south of the Sava, and those who would rather bank it and say nothing at all."
 auh_admin_crisis.7.a:0 "Use the free hand at once."
 auh_admin_crisis.7.b:0 "Bank the free hand and say nothing."
 auh_admin_crisis.7.c:0 "Reassure Rome the free hand is not aimed at Albania."
 AUH_ac_7a_tt:0 "The free hand is exercised south of the Sava within the season, and Belgrade's own Serbs in the realm take note of exactly whose hand it was."
 AUH_ac_7c_tt:0 "Rome is told the free hand stops well short of Albania; the coast's Italian-speakers are the ones who hear the reassurance land."

 auh_admin_crisis.8.t:0 "The Old Hands Ask to Be Heard"
 auh_admin_crisis.8.d:0 "Aehrenthal's mission to press an active policy at Petersburg has not been announced in the Delegations, only felt: two career men who served the standing-still tradition for twenty years have asked for an audience before they submit their resignations. They are not blocking the new course. They want it said, once, in a room with the minister in it, that Petersburg was warned nothing had changed — and that both halves will be paying for it if that warning was wrong."
 auh_admin_crisis.8.a:0 "Back Aehrenthal fully; let the cautious resign."
 auh_admin_crisis.8.b:0 "Rein him in — no more surprises without the Delegations' knowledge."
 auh_admin_crisis.8.c:0 "Let the Delegations grill him in closed session."
 AUH_ac_8a_tt:0 "The old hands resign as they said they would, and Petersburg is left reading the active policy as a settled fact rather than a trial balloon."
 AUH_ac_8c_tt:0 "Aehrenthal answers three hours of questions behind closed doors, and Budapest's delegates leave satisfied that at least they were asked."

 auh_admin_crisis.9.t:0 "Budapest Asks What Standing Still Costs"
 auh_admin_crisis.9.d:0 "Goluchowski keeps his desk at the Ballhausplatz, and the Hungarian delegation's press has taken to calling him, in print, the minister who does not move. It is meant as an insult; it is also becoming an argument, aired openly ahead of the next Delegations budget session, that a ministry which moves for nobody should not be paid for by both halves equally."
 auh_admin_crisis.9.a:0 "Ride it out — the minister keeps his desk."
 auh_admin_crisis.9.b:0 "Trim the Ballhausplatz budget to appease Budapest."
 auh_admin_crisis.9.c:0 "Promise Budapest the next vacancy at the Ballhausplatz."
 AUH_ac_9a_tt:0 "The minister stays, the mockery continues, and Budapest's delegates file it away for the next budget fight."
 AUH_ac_9b_tt:0 "The common ministry's budget is trimmed at Budapest's insistence, and the career men at the Ballhausplatz notice exactly who asked for it."
 AUH_ac_9c_tt:0 "A promise of the next vacancy buys Budapest's patience for now, and commits the crown to a choice it has not yet made."
