#Focuses
 CANDNC_d_not_one_more_man_for_the_transvaal: "Not One More Man for the Transvaal"
 CANDNC_d_not_one_more_man_for_the_transvaal_desc: "The order in council of 14 October 1899 put a thousand men on the Sardinian without a vote. Laurier answers Bourassa that it will not be done twice: no contingent, no transport, no Canadian pay. Minto is told before the cable goes."
 CANDNC_d_the_motion_of_13_march_carried: "The Motion of 13 March Carried"
 CANDNC_d_the_motion_of_13_march_carried_desc: "Bourassa, returned for Labelle by acclamation in January 1900, moves that the sending of troops be held no precedent. This time the House divides and the motion carries. Laurier signs what he spent the winter refusing to say."
 CANDNC_d_a_private_regiment_refused: "A Private Regiment Refused"
 CANDNC_d_a_private_regiment_refused_desc: "In February 1900 Lord Strathcona offers to raise and pay six hundred horsemen out of Manitoba and the Territories. Ottawa answers that no private man levies soldiers in Canada. The money stays in London and the riders stay home."
 CANDNC_d_the_contingent_comes_home: "The Contingent Comes Home"
 CANDNC_d_the_contingent_comes_home_desc: "Otter's Royal Canadians lay sixty-five yards from Cronje's trenches on the morning of 27 February 1900. Ottawa recalls them by the next sailing. They land at Halifax with a battle honour and nobody following them out."
 CANDNC_d_the_sting_of_the_alaska_award: "The Sting of the Alaska Award"
 CANDNC_d_the_sting_of_the_alaska_award_desc: "London, 20 October 1903: Alverstone votes with the three Americans, Skagway stays American, and Jette and Aylesworth refuse to sign. On the 23rd Laurier tells the Commons the fault is that Canada cannot make a treaty."
 CANDNC_d_denounce_the_arbitration: "Denounce the Arbitration"
 CANDNC_d_denounce_the_arbitration_desc: "The Hay-Herbert convention of 24 January 1903 was signed at Washington by Britain, and Canada was never a party to it. Ottawa says so aloud: an award Canada did not sign binds no Canadian surveyor on the Lynn Canal."
 CANDNC_d_the_power_to_treat: "The Power to Treat"
 CANDNC_d_the_power_to_treat_desc: "Laurier writes to the Colonial Office what he said in the House on 23 October 1903: Canada will negotiate and sign for itself, or take nothing more at another man's hand. Downing Street has the despatch before Christmas."
 CANDNC_d_the_yukon_field_force_returns: "The Yukon Field Force Returns"
 CANDNC_d_the_yukon_field_force_returns_desc: "The Field Force marched out of Dawson in 1900 when the gold was thinning. Ottawa sends it back over the Stikine with the Mounted Police, to stand where the surveyors were told in 1903 that the line now runs."
 CANDNC_d_dundonald_goes_home: "Dundonald Goes Home"
 CANDNC_d_dundonald_goes_home_desc: "The Earl of Dundonald attacks Sydney Fisher over a list of Eastern Townships officers and is dismissed on 14 June 1904. The Militia Act follows: a Council under a minister, no British general, the Halifax clause repealed."
 CANDNC_d_if_london_refuses_we_sign_anyway: "If London Refuses, We Sign Anyway"
 CANDNC_d_if_london_refuses_we_sign_anyway_desc: "Fielding and Brodeur go to Paris in September 1907 with no British plenipotentiary behind them and sign the commercial treaty in Canada's name alone. The Colonial Office reads of it in the newspapers."
 CANDNC_d_the_commercial_treaty_power: "The Commercial Treaty Power"
 CANDNC_d_the_commercial_treaty_power_desc: "London concedes what it can spare: Canada may negotiate its own tariff conventions. Fielding carries the intermediate column of his 1907 tariff to Paris as a bargaining chip that is now his own to spend."
 CANDNC_d_the_line_at_the_chilkoot: "The Line at the Chilkoot"
 CANDNC_d_the_line_at_the_chilkoot_desc: "The Mounted Police held the Chilkoot and White Pass summits with a Maxim gun through the rush of 1898 and never came down. The posts are built in stone, and Ottawa marks its own boundary where the award drew none."
 CANDNC_d_the_keys_of_halifax_and_esquimalt: "The Keys of Halifax and Esquimalt"
 CANDNC_d_the_keys_of_halifax_and_esquimalt_desc: "The last imperial garrisons march out of the Citadel and Work Point in 1905 and 1906. Canada takes both fortresses with their guns, their coal and their accounts, and is the only power standing on its own coasts."
 CANDNC_d_agents_before_ambassadors: "Agents Before Ambassadors"
 CANDNC_d_agents_before_ambassadors_desc: "Canada keeps commercial agents in Paris and a minister nowhere. Ottawa gives them cyphers, written instructions and the right to speak for the Dominion, and the Colonial Office is informed rather than consulted."
 CANDNC_d_skagway_in_the_sights: "Skagway in the Sights"
 CANDNC_d_skagway_in_the_sights_desc: "The heads of the Lynn Canal are Canadian on every map printed before 1903. The claim is entered in the Dominion's own statute book and a road is surveyed from Bennett Lake down to tidewater at Skagway."
 CANDNC_d_the_fisheries_protection_fleet_armed: "The Fisheries Protection Fleet Armed"
 CANDNC_d_the_fisheries_protection_fleet_armed_desc: "Brodeur's Marine and Fisheries owns the Canada and the Vigilant, cutters that chase trawlers off Nova Scotia. Guns are fitted at Halifax and the Dominion has warships without having asked the Admiralty for one."
 CANDNC_d_the_treaty_habit: "The Treaty Habit"
 CANDNC_d_the_treaty_habit_desc: "Paris in 1907, then a dozen tariff conventions in three years. The habit of signing is worth more than the power: after the third treaty nobody in Whitehall thinks to ask under whose seal the thing was done."
 CANDNC_d_the_loyalists_protest: "The Loyalists Protest"
 CANDNC_d_the_loyalists_protest_desc: "The Orange Grand Lodge and the Toronto News answer Ottawa in July: a country that will not send one man to the Transvaal has left the Empire in all but name. Twenty thousand march past the King's statue in Queen's Park."
 CANDNC_d_the_independence_resolution: "The Independence Resolution"
 CANDNC_d_the_independence_resolution_desc: "The Commons resolve that Canada is a nation and ask Westminster to say so in a statute. It carries on the votes of Quebec and the West with Ontario shouting, and the address goes out in the Governor General's bag."
 CANDNC_d_the_second_resolution: "The Second Resolution"
 CANDNC_d_the_second_resolution_desc: "London has refused once. The House passes the same address a second time, word for word, and adds that it will not be presented a third. Laurier tells Earl Grey the answer is wanted before the session rises."
 CANDNC_d_negotiate_alone_with_washington: "Negotiate Alone With Washington"
 CANDNC_d_negotiate_alone_with_washington_desc: "The Boundary Waters Treaty of 11 January 1909 was signed by James Bryce because no Canadian could sign it. The next one is carried to Elihu Root by a Canadian, and the British embassy hears of the appointment afterwards."
 CANDNC_d_negotiate_alone_with_london: "Negotiate Alone With London"
 CANDNC_d_negotiate_alone_with_london_desc: "Canada treats with Britain as with any other power: preference, shipping, the fisheries and the fortress accounts in one negotiation. Fielding crosses in October and puts his own name at the head of the paper."
 CANDNC_d_the_naval_militia: "The Naval Militia"
 CANDNC_d_the_naval_militia_desc: "On 29 March 1909 the Commons voted a Canadian naval service without a dissenting voice. The fishermen of Lunenburg and Gaspe are enrolled for winter drill, paid out of Ottawa and sworn to no other flag."
 CANDNC_d_the_imperial_preference_lapses: "The Imperial Preference Lapses"
 CANDNC_d_the_imperial_preference_lapses_desc: "Fielding gave the British preference freely in 1897 and can take it back the same way. Finance lets it lapse and prices Sheffield steel like any other. Montreal's importers count the difference inside a week."
 CANDNC_d_the_loan_denied_in_london: "The Loan Denied in London"
 CANDNC_d_the_loan_denied_in_london_desc: "The Grand Trunk Pacific bonds carried a Dominion guarantee the City honoured without asking questions. Lombard Street now declines the new issue, and the Transcontinental has a payroll due on Saturday."
 CANDNC_d_external_affairs_with_ambassadors: "External Affairs, With Ambassadors"
 CANDNC_d_external_affairs_with_ambassadors_desc: "The Act of 19 May 1909 gave Joseph Pope a handful of clerks above a shop on Bank Street. Ottawa gives him ministers as well: legations at Washington, Paris and London, with cyphers and a vote of their own."
 CANDNC_d_tokyo_treats_directly: "Tokyo Treats Directly"
 CANDNC_d_tokyo_treats_directly_desc: "Lemieux went to Tokyo in 1907 with a British ambassador at his elbow and came back with four hundred men a year. The renewal is negotiated at Ottawa, by Canadians, with a Japanese minister who presents his letters here."
 CANDNC_d_otters_general_staff: "Otter's General Staff"
 CANDNC_d_otters_general_staff_desc: "William Otter, the first Canadian-born chief of the general staff since 1908, is given what the Militia Act only promised: a staff college, an intelligence branch and mobilisation tables written for Canadian ground."
 CANDNC_d_a_navy_from_esquimalt: "A Navy From Esquimalt"
 CANDNC_d_a_navy_from_esquimalt_desc: "The Admiralty offered fleet units at London in July 1909; New Zealand paid for a battle cruiser, Australia and Canada refused the cheque. Esquimalt lays down cruisers of Canadian design, and the Pacific coast has an owner."
 CANDNC_d_the_silver_dart_bought: "The Silver Dart Bought"
 CANDNC_d_the_silver_dart_bought_desc: "McCurdy flew off the ice of Baddeck Bay on 23 February 1909 and broke his machine on the sand at Petawawa in August. The militia bought nothing. Ottawa buys two aeroplanes and keeps Baldwin's shop open."
 CANDNC_d_marquis_wheat: "Marquis Wheat"
 CANDNC_d_marquis_wheat_desc: "Charles Saunders crossed Red Fife with Hard Red Calcutta at the Central Experimental Farm and won back a week of the northern season. The seed goes to Indian Head in 1909 and then to every homestead Ottawa can reach."
 CANDNC_d_alaska_by_force: "Alaska by Force"
 CANDNC_d_alaska_by_force_desc: "The line of 1903 was drawn by a British judge in a London hotel. Ottawa proposes to redraw it on the ground with the Yukon militia and the Field Force, against a neighbour of ninety millions and with no ally anywhere."
 CANDNC_d_the_kingdom_of_canada: "The Kingdom of Canada"
 CANDNC_d_the_kingdom_of_canada_desc: "The Fathers wrote Kingdom into the drafts of 1866 and Lord Monck struck it out to spare Washington's feelings. The word goes back in: one crown over two realms, and a sovereign advised from Ottawa alone."
 CANDNC_d_the_republic_of_canada: "The Republic of Canada"
 CANDNC_d_the_republic_of_canada_desc: "The oath of allegiance is struck from the statutes and the Governor General's commission is left to expire. What Papineau and Mackenzie lost under arms in 1837 is carried in the Commons on a show of hands."
 CANDNC_d_newfoundland_by_money: "Newfoundland by Money"
 CANDNC_d_newfoundland_by_money_desc: "The island refused Confederation in 1869 and again in 1895, when Ottawa would not assume its railway debt. This time the offer is that debt itself, in cash at St John's, and an answer is wanted inside sixty days."
 CANDNC_d_the_governor_general_named_in_ottawa: "The Governor General Named in Ottawa"
 CANDNC_d_the_governor_general_named_in_ottawa_desc: "Earl Grey was chosen in Downing Street in 1904 and Ottawa was told afterwards. His successor is named by the Canadian ministry and the King signs the commission as advised, which is the whole of the difference."
 CANDNC_d_a_flag_of_our_own: "A Flag of Our Own"
 CANDNC_d_a_flag_of_our_own_desc: "The Red Ensign with the shield flew over merchant ships by an Admiralty warrant of 1892 and nowhere else by right. A flag is voted for Parliament, the legations and the ships, and it carries no other country's canton."
 CANDNC_d_the_first_president: "The First President"
 CANDNC_d_the_first_president_desc: "The Commons elect a head of state for seven years from among men who have sat in the House. Laurier is asked and declines, saying a first president should not be a party chief. The vote is taken in January."
 CANDNC_d_the_kingdom_of_canada_proclaimed: "The Kingdom of Canada Proclaimed"
 CANDNC_d_the_kingdom_of_canada_proclaimed_desc: "Proclaimed on Parliament Hill before the Commons, the Senate and the judges of the Supreme Court. A Canadian crown, cruisers at Esquimalt, ministers abroad, and a treasury that borrows where it still can."
 CANDNC_d_the_republic_of_canada_proclaimed: "The Republic of Canada Proclaimed"
 CANDNC_d_the_republic_of_canada_proclaimed_desc: "Proclaimed on Parliament Hill, the oath sworn to the constitution and not to a person. Seven million people, two coasts held by their own ships, no guarantee from anyone, and four thousand miles of open border."

#Focus tooltips
 CANDNC_d_london_will_answer_tt: "The Colonial Office will answer, and what it answers decides what Canada may do next."
 CANDNC_d_roosevelt_will_answer_tt: "Washington will answer the denunciation. Troops on the Lynn Canal are one of the answers available to it."
 CANDNC_d_paris_will_answer_tt: "Paris will say whether it receives Canadian plenipotentiaries or waits for a British signature."
 CANDNC_d_root_will_answer_tt: "The Secretary of State will decide whether a Canadian minister is received at Washington or sent back to the embassy."
 CANDNC_d_tokyo_will_answer_tt: "Tokyo will say whether it treats with Ottawa directly or only through the Foreign Office in London."
 CANDNC_d_alone_against_ninety_millions_tt: "No British guarantee, no British credit, and ninety millions on the other side of the line."
 CANDNC_d_sixty_days_for_st_johns_tt: "The money is on the table at St John's. London answers within sixty days, and the island comes in or it does not."
 CANDNC_d_three_capitals_will_answer_tt: "London, Paris and Washington each answer a republic in North America in their own way."
 CANDNC_d_end_kingdom_tt: "The era closes with a Canadian crown, a fleet of its own, ministers abroad, and the credit of the City slowly returning."
 CANDNC_d_end_republic_tt: "The era closes with a republic on the Saint Lawrence: no crown, no guarantee, no imperial credit, and every treaty its own."
 CANDNC_d_london_hardens_tt: "London will remember the refusal at every later request. The Colonial Office is harder to move from here on."
 CANDNC_d_garrisons_withdrawn_tt: "The imperial garrisons sail for home at once, and Canada pays for every gun that stays."
 CANDNC_d_crown_offered_tt: "London would rather crown Canada than lose it. The offer stands if the Kingdom is proclaimed."
 CANDNC_d_annexation_talk_tt: "The annexation press in the border states has its subject back, and Ottawa knows it."
 CANDNC_d_fisheries_fleet_bonus: "Fisheries Protection Fleet"
 CANDNC_d_esquimalt_bonus: "The Esquimalt Yards"
 CANDNC_d_silver_dart_bonus: "The Canadian Aerodrome Company"
 CANDNC_d_alaska_threat: "Canadian troops on the Alaska panhandle"

#Ideas
 CAN_d_the_refusal_of_1900: "The Refusal of 1900"
 CAN_d_the_refusal_of_1900_desc: "Not one man for the Transvaal, and the Empire has been told so in writing. Quebec is satisfied, Ontario is not, and every British house of business has read the despatch."
 CAN_d_the_lesson_of_alverstone: "The Lesson of Alverstone"
 CAN_d_the_lesson_of_alverstone_desc: "A British judge gave away Canadian ground to keep an American friendship. The country has learned that nobody will negotiate for it, and has not yet the means to negotiate for itself."
 CAN_d_the_dominion_chastened: "The Dominion Chastened"
 CAN_d_the_dominion_chastened_desc: "Westminster has refused the address and said so in terms fit for a colony. The ministry is smaller than it was on Monday, and the country is angrier than the ministry."
 CAN_d_the_treaty_habit: "The Treaty Habit"
 CAN_d_the_treaty_habit_desc: "Canadian agents negotiate, Canadian ministers sign, and the practice hardens into a right nobody granted. It costs a minister abroad for every treaty at home."
 CAN_d_the_treaty_of_paris_1907: "The Treaty of Paris, 1907"
 CAN_d_the_treaty_of_paris_1907_desc: "Fielding and Brodeur signed the French commercial treaty in September 1907. The wine, silk and machinery come in cheaper, and the Colonial Office has filed a protest it cannot enforce."
 CAN_d_the_pacific_convention: "The Pacific Convention"
 CAN_d_the_pacific_convention_desc: "Tokyo treats with Ottawa directly, and the four hundred a year of the Lemieux understanding are written into a Canadian instrument. British Columbia calls it a surrender in a Canadian hand."
 CAN_d_the_preference_kept: "The Preference Kept"
 CAN_d_the_preference_kept_desc: "The British preference of 1897 stands, and with it the shipping and the insurance that follow the flag. The nationalists count it a leash that a sovereign country has agreed to wear."
 CAN_d_fieldings_three_columns: "Fielding's Three Columns"
 CAN_d_fieldings_three_columns_desc: "Preferential, intermediate and general, and the middle column is what Ottawa takes abroad. Bargaining power bought by giving the manufacturers their protection back at home."
 CAN_d_no_credit_in_london: "No Credit in London"
 CAN_d_no_credit_in_london_desc: "Lombard Street will not underwrite a country that has quarrelled with the Crown. The railways build slower, and Ottawa discovers what its guarantee was really worth."
 CAN_d_no_credit_anywhere: "No Credit Anywhere"
 CAN_d_no_credit_anywhere_desc: "London is shut, New York is watching, and Paris wants eight per cent. Every mile of line is now paid for out of the customs house, and the country learns to use what it stands on."
 CAN_d_new_york_money: "New York Money"
 CAN_d_new_york_money_desc: "Wall Street underwrites what the City refused, at a rate the City would have blushed at. The building goes on, and a second creditor takes an interest in Canadian politics."
 CAN_d_the_credit_returns_slowly: "The Credit Returns Slowly"
 CAN_d_the_credit_returns_slowly_desc: "The brokers have decided that a sovereign Canada pays its coupons like any other. The issues are taken up again, at a spread that will take a decade to close."
 CAN_d_a_nation_among_nations: "A Nation Among Nations"
 CAN_d_a_nation_among_nations_desc: "No governor to reserve a bill, no ambassador to sign in Canada's place, and no squadron on call. The country answers for itself in everything, and pays for everything it answers for."
 CAN_d_otters_general_staff: "Otter's General Staff"
 CAN_d_otters_general_staff_desc: "A staff college, an intelligence branch and mobilisation tables drawn for Canadian ground rather than for an imperial reserve. The estimates carry it, and the estimates are already tight."
 CAN_d_the_naval_militia: "The Naval Militia"
 CAN_d_the_naval_militia_desc: "Fishermen from Lunenburg to Gaspe drill through the winter and sail their own coast in summer. Every man on a gun deck is a man not in the militia camps."
 CAN_d_a_navy_of_our_own: "A Navy of Our Own"
 CAN_d_a_navy_of_our_own_desc: "Cruisers built at Esquimalt to a Canadian design, manned by Canadians, answering to Ottawa. The yards are full and the estimates are ruinous."
 CAN_d_the_ninety_millions: "The Ninety Millions"
 CAN_d_the_ninety_millions_desc: "The border is four thousand miles long and the other side of it has ninety million people. Everything from Victoria to Halifax is planned around that fact, and it is not cheap."
 CAN_d_marquis_wheat: "Marquis Wheat"
 CAN_d_marquis_wheat_desc: "A week of season won back moves the wheat line north by a hundred miles. The West fills with men who will not go into a factory, and the country eats and exports."
 CAN_d_the_kingdom_of_canada: "The Kingdom of Canada"
 CAN_d_the_kingdom_of_canada_desc: "A crown of its own reconciles the loyalists to a sovereign country and keeps the Ontario regiments in their armouries. It also keeps their enthusiasm for anything the crown does not ask."
 CAN_d_the_republic_of_canada: "The Republic of Canada"
 CAN_d_the_republic_of_canada_desc: "The oath is to the constitution and the head of state is elected. The Orange lodges and half the bench regard the thing as a usurpation, and say so every week."

#Events
 can_dnc_d.1.t: "Ottawa Sends No One"
 can_dnc_d.1.d: "The Colonial Office has the Canadian answer in one paragraph. There will be no second contingent, no transports found at Quebec, no Canadian pay beyond the water. The order in council of 14 October 1899 is declared by its own author to be no precedent, and the member for Labelle has been given in writing what he asked for on the floor of the House. Australia is sending bushmen, New Zealand is sending horse, and the largest of the self-governing colonies is sending a despatch. Mr Chamberlain must decide what the Empire does with a refusal it cannot punish."
 can_dnc_d.1.a: "Let the Dominion have its answer."
 can_dnc_d.1.b: "A despatch of reproof, and the estimates reviewed."
 can_dnc_d.1.c: "Then Canada may pay for its own garrisons."
 can_dnc_d.2.t: "Whitehall Says Nothing"
 can_dnc_d.2.d: "No reply comes beyond an acknowledgement of receipt. The Colonial Office has decided that a quarrel with Canada in the middle of a South African war would cost more than the men are worth, and Ottawa learns the useful fact that a refusal can simply be made."
 can_dnc_d.2.a: "It can be done, then."
 can_dnc_d.3.t: "A Despatch of Reproof"
 can_dnc_d.3.d: "Eleven pages arrive by the Allan mail. The Secretary of State regrets the Canadian decision, doubts that it represents the sentiment of the Dominion, and observes that the defence of Canada has never been charged to Canada. It is read aloud in the House to a full gallery."
 can_dnc_d.3.a: "Read it into the record, and answer nothing."
 can_dnc_d.4.t: "The Garrisons Become a Bill"
 can_dnc_d.4.d: "The War Office replies in figures. The imperial garrisons of Halifax and Esquimalt, the coal, the guns and the stores are set out with a total at the bottom, and a note that a Dominion which will not send men abroad may reasonably keep men at home at its own charge."
 can_dnc_d.4.a: "Then we shall keep them at our own charge."
 can_dnc_d.8.t: "Ottawa Denounces the Award"
 can_dnc_d.8.d: "The President has the Canadian note. Ottawa holds that the Hay-Herbert convention of January 1903 was a British instrument, that Canada was not a party to it, and that the award of 20 October, carried by Lord Alverstone's vote against the two Canadian commissioners who refused to sign, therefore binds nobody in Canada. The heads of the Lynn Canal are claimed as before, and Canadian police stand on the summits above them. Mr Hay is dead these three months and Mr Root has the file."
 can_dnc_d.8.a: "Send the infantry up to Skagway."
 can_dnc_d.8.b: "The award is the award. Let them shout."
 can_dnc_d.8.c: "Let them come to Washington and say it here."
 can_dnc_d.9.t: "Soldiers at the Head of the Lynn Canal"
 can_dnc_d.9.d: "Two American companies are landed at Skagway and camp where the tramway climbs out of the town. The Mounted Police at the Chilkoot summit report the fact by heliograph and are told to hold their post and fire on nobody. Ottawa spends the winter counting what it has north of Vancouver."
 can_dnc_d.9.a: "Hold the summits. Count the rifles."
 can_dnc_d.10.t: "Washington Is Silent"
 can_dnc_d.10.d: "Nothing comes back at all. The State Department has the line it wanted and sees no advantage in discussing it with a government that cannot sign a treaty. The Toronto papers observe that a protest nobody answers is a protest nobody heard."
 can_dnc_d.10.a: "Noted, and remembered."
 can_dnc_d.11.t: "An Invitation to Washington"
 can_dnc_d.11.d: "Mr Root writes that the Secretary of State would receive Canadian representatives on the boundary question, adding without emphasis that he assumes they will come furnished with the proper authority. The sentence is read in Ottawa as the sharpest thing said to Canada since the award."
 can_dnc_d.11.a: "Then we shall get ourselves the proper authority."
 can_dnc_d.15.t: "Canada Asks for the Power to Treat"
 can_dnc_d.15.d: "The despatch from Ottawa is short and its meaning is not. Canada asks that His Majesty issue full powers to Canadian ministers to negotiate and sign treaties touching Canadian interests, and states that after the Alaska award it cannot again accept a signature it did not control. The Colonial Office knows what is at stake: the plenipotentiary power is the whole of the difference between a colony and a state, and Australia, New Zealand and the Cape will all read the answer that is given here."
 can_dnc_d.15.a: "The Crown treats. Colonies advise."
 can_dnc_d.15.b: "Commercial conventions only, and under our seal."
 can_dnc_d.15.c: "Give them full powers and be done with it."
 can_dnc_d.16.t: "The Answer Is No"
 can_dnc_d.16.d: "The treaty power is one and indivisible and resides in the Crown, advised by His Majesty's ministers in London. Canada may be consulted, may send counsel, may even see the drafts. It may not sign. The despatch is tabled in the Commons and the galleries are cleared twice."
 can_dnc_d.16.a: "Then we shall sign without them."
 can_dnc_d.17.t: "Commerce Only"
 can_dnc_d.17.d: "Canada may negotiate and conclude commercial conventions in its own name, provided the instruments issue under the King's seal and copies go to the Foreign Office. Political treaties remain in London. Fielding has what he wanted and Laurier has less than he asked."
 can_dnc_d.17.a: "Begin with France."
 can_dnc_d.18.t: "A Plenipotentiary of Its Own"
 can_dnc_d.18.d: "Full powers are issued to Canadian ministers, in the ordinary form used for British plenipotentiaries, with no reservation but the King's signature at the end. Sir Joseph Pope keeps the first commission in his own desk for a week before it goes into the file."
 can_dnc_d.18.a: "The country can sign its name."
 can_dnc_d.19.t: "Ottawa Proposes to Sign in Its Own Name"
 can_dnc_d.19.d: "The Quai d'Orsay has a proposal from Ottawa for a commercial treaty on the lines of September 1907, with one change: the Canadian ministers will carry their own powers and no British plenipotentiary will be present at the signature. The advantage to France is obvious, and so is the difficulty. To sign is to recognise, in a small way and on paper, that there is a state on the Saint Lawrence with which one deals directly. London will notice within the week."
 can_dnc_d.19.a: "Receive the Canadian plenipotentiaries."
 can_dnc_d.19.b: "Only with the British signature beside theirs."
 can_dnc_d.20.t: "Signed at the Quai d'Orsay"
 can_dnc_d.20.d: "The treaty is signed by Canadian ministers alone, with the French text and the English text of equal force. Paris gains a market and the pleasure of the thing. Ottawa gains a precedent that no despatch can now take back."
 can_dnc_d.20.a: "Wine for silk, and a precedent for both."
 can_dnc_d.21.t: "Under British Cover, Again"
 can_dnc_d.21.d: "France will sign, but with the British ambassador present and his name above the Canadian ones, exactly as in 1907. The tariff schedules are as good as before and the paper says the same thing it always said about who Canada is."
 can_dnc_d.21.a: "Take the schedules. The signature will come later."
 can_dnc_d.22.t: "The Militia Act Reaches Whitehall"
 can_dnc_d.22.d: "The Colonial Office and the War Office read the Canadian Militia Act together. A Militia Council presided over by a minister; the requirement that a British officer command struck out; the clause giving Halifax command in war repealed; the Permanent Force doubled toward four thousand men. The Earl of Dundonald, dismissed on 14 June for attacking a minister in public, is in London telling anyone who will listen that the Dominion has taken its army out of the Empire's hand."
 can_dnc_d.22.a: "Let them command their own militia."
 can_dnc_d.22.b: "Disallow the Act."
 can_dnc_d.22.c: "Then they may have the fortresses as well, and the bill."
 can_dnc_d.23.t: "A Canadian at the Head of the Militia"
 can_dnc_d.23.d: "The Act stands as passed. The Militia Council sits with the minister in the chair, the staff appointments are made at Ottawa, and for the first time since 1867 no officer in Canada holds his command by a warrant written abroad."
 can_dnc_d.23.a: "The department is our own."
 can_dnc_d.24.t: "The Act Is Disallowed"
 can_dnc_d.24.d: "For the first time since Confederation the Crown disallows a Canadian statute. The Militia Act is void, the Council does not sit, and the Governor General is instructed to inform his ministers. The instruction is read to a House that listens in complete silence and then rises to its feet."
 can_dnc_d.24.a: "We shall pass it again, and again after that."
 can_dnc_d.25.t: "The Garrisons Sail Home"
 can_dnc_d.25.d: "The War Office does not argue. The regiments at Halifax and Work Point are ordered home, the stores are inventoried and priced, and Canada is invited to take possession by the first of the month. The bill for the guns arrives before the last transport clears the harbour."
 can_dnc_d.25.a: "Take the keys and pay the bill."
 can_dnc_d.26.t: "Toronto Answers Ottawa"
 can_dnc_d.26.d: "The Orange Grand Lodge, the Toronto News and the greater part of the Ontario bar have found the same words in the same week: a country that will not send one man to the Transvaal, that denounces the King's arbitration and asks to sign its own treaties, has left the Empire without saying so. Twenty thousand march past the King's statue in Queen's Park. Petitions to His Majesty are being signed in eleven counties, and the ministry must decide what to say to men who are not wrong about the facts."
 can_dnc_d.26.a: "Give the lodges the King's word, in the King's name."
 can_dnc_d.26.b: "Let them petition. The Speaker will answer them."
 can_dnc_d.26.c: "Read the petition into the record and move on."
 can_dnc_d.27.t: "The Resolution Reaches Westminster"
 can_dnc_d.27.d: "The address of the Canadian Commons lies on the table of the House of Lords. It asks, in terms of the most careful courtesy, for a statute declaring that Canada is a nation, competent to make its own treaties, to keep its own forces and to be bound by no engagement to which its Parliament has not agreed. It does not ask to leave the King. The Cabinet has three answers and no good one: to refuse and hold a Dominion by a form of words it has already broken; to grant and show the Cape, Australia and Ireland the road; or to offer a crown of its own and hope the word satisfies the thing."
 can_dnc_d.27.a: "Let them go, and keep them as friends."
 can_dnc_d.27.b: "Refuse, and remind them who guarantees them."
 can_dnc_d.27.c: "Offer them a crown of their own instead."
 can_dnc_d.28.t: "The Statute Passes at Westminster"
 can_dnc_d.28.d: "It goes through both Houses in eleven days, because the Cabinet wants it done before anyone thinks about it. Canada is declared a nation, competent to treat, bound by nothing it has not voted. The Governor General reads the King's message on Parliament Hill and the bells go on until midnight."
 can_dnc_d.28.a: "A country, then, and everything that costs."
 can_dnc_d.29.t: "London Refuses"
 can_dnc_d.29.d: "The answer is a lecture. The unity of the Empire is not a matter for a colonial resolution, the interests of Canada have never been better served than by the Crown, and His Majesty's government cannot advise legislation of the kind proposed. The despatch is tabled at four in the afternoon and by six the crowd on Wellington Street will not go home."
 can_dnc_d.29.a: "Then the House will resolve a second time."
 can_dnc_d.30.t: "A Crown Offered in Place of a Statute"
 can_dnc_d.30.d: "The Cabinet will not pass the statute, but it will do something that has never been done: raise the Dominion to a kingdom, with the King as King of Canada, advised in Canadian matters by Canadian ministers and by nobody else. It concedes the substance and keeps the word Empire. Ottawa is invited to think about it."
 can_dnc_d.30.a: "Keep the offer on the table."
 can_dnc_d.32.t: "The Door Closes on Fielding"
 can_dnc_d.32.d: "There is no answer from Downing Street and none intended. The preference question is referred to a committee that will not report, the shipping question to another, and the fortress accounts to the Treasury. Fielding comes home with a folder of receipts and the certainty that the City has been spoken to."
 can_dnc_d.32.a: "We shall borrow where we can."
 can_dnc_d.33.t: "A Guarantee From Washington"
 can_dnc_d.33.d: "The Secretary of State receives the Canadian minister, and the President goes further than the minister asked: the United States will regard the integrity of Canadian territory as a matter of American concern. It is a friendly sentence with a long shadow, and every officer in Ottawa reads it twice."
 can_dnc_d.33.a: "Thank him, and read it again in the morning."
 can_dnc_d.34.t: "A Canadian Minister at Washington"
 can_dnc_d.34.d: "A Canadian presents himself at the State Department with letters from Ottawa and no British ambassador at his elbow. Mr Root has to decide what he is. To receive him is to treat Canada as a state, which is a great deal for a neighbour that shares four thousand miles of border, most of the Great Lakes and a boundary dispute in the north-west. To send him to the British embassy is to keep the fiction and to make an enemy of the only government in the world that can settle the fisheries, the waterways and the panhandle."
 can_dnc_d.34.a: "Receive him. Exchange ministers."
 can_dnc_d.34.b: "We deal with the British embassy, as always."
 can_dnc_d.34.c: "Receive him, and guarantee the boundary."
 can_dnc_d.35.t: "Ministers Exchanged"
 can_dnc_d.35.d: "The legations are opened within the year, one on Connecticut Avenue and one three streets from Parliament Hill. The waterways, the fisheries and the tariff pass out of the British embassy's hands and into a correspondence conducted in two capitals that can both answer for themselves."
 can_dnc_d.35.a: "The border has two governments now."
 can_dnc_d.36.t: "Through the Embassy, As Before"
 can_dnc_d.36.d: "The Canadian minister is treated with perfect courtesy and told that communications should come through His Majesty's ambassador. He dines at the embassy that evening and writes to Ottawa that the answer was decided before he arrived."
 can_dnc_d.36.a: "We are not a country until we are treated as one."
 can_dnc_d.37.t: "Canada Negotiates in Its Own Name"
 can_dnc_d.37.d: "For the first time Britain is asked to sit down with Canada as with a foreign power: the preference, the shipping trade, the Atlantic fisheries and the accounts of Halifax and Esquimalt, all in a single negotiation, with Fielding at the head of the Canadian side and no Colonial Office in the room. The Board of Trade wants the wheat and the market. The Colonial Office wants to know what happens to the other Dominions when this one is seen bargaining. The Palace has raised a third question, quietly."
 can_dnc_d.37.a: "Keep the preference. Trade is trade."
 can_dnc_d.37.b: "End the preference, and offer them a crown."
 can_dnc_d.37.c: "Nothing. Let them find their own market."
 can_dnc_d.38.t: "The Preference Is Kept"
 can_dnc_d.38.d: "The British preference stands, the shipping conference rates hold, and the two treasuries settle the fortress accounts over a fortnight. Fielding comes home with a document that reads like a treaty between equals, and the nationalist papers ask what a sovereign country is doing giving anyone a preference at all."
 can_dnc_d.38.a: "Trade first. The rest follows trade."
 can_dnc_d.39.t: "A Crown, and No Preference"
 can_dnc_d.39.d: "The tariff talks end without result, and the real offer is made over the table afterwards: no preference, no quarrel either, and the King is willing to be King of Canada in his own right. Fielding writes it down that night in a hotel on Northumberland Avenue."
 can_dnc_d.39.a: "Bring the offer home to the Cabinet."
 can_dnc_d.40.t: "The Loan Is Refused in the City"
 can_dnc_d.40.d: "The new Dominion issue has been declined. No syndicate will take it, the brokers are polite, and one of them explains without being asked that a country which has quarrelled with the Crown is a country whose guarantee has to be thought about. There is eleven million on the Transcontinental account, a payroll in the Shield camps on Saturday, and the harvest to be moved in six weeks."
 can_dnc_d.40.a: "Then New York, at whatever they ask."
 can_dnc_d.40.b: "Then Paris, at eight per cent."
 can_dnc_d.40.c: "Then nowhere. We build with what the customs house takes."
 can_dnc_d.41.t: "Ottawa Proposes to Treat With Tokyo"
 can_dnc_d.41.d: "In 1907 Rodolphe Lemieux came to Tokyo with a British ambassador at his side and went home with an understanding: four hundred labourers a year, limited by Japan itself, and the honour of the decision left in Japanese hands. Ottawa now proposes to renew it as a convention between Canada and Japan, signed at Ottawa, with a Japanese minister accredited there. The Foreign Ministry sees a Pacific power that is not Britain, owns Esquimalt and Prince Rupert, and has no fleet worth the name."
 can_dnc_d.41.a: "Sign with Ottawa. The understanding stands."
 can_dnc_d.41.b: "Canada is not a party. London signs, as before."
 can_dnc_d.41.c: "Sign, and ask what the yard at Esquimalt is building."
 can_dnc_d.42.t: "The Convention of Tokyo"
 can_dnc_d.42.d: "The convention is signed at Ottawa by a Japanese minister and a Canadian one, the figure of four hundred kept and the language made civil on both sides. Vancouver calls it the Lemieux surrender written out in a Canadian hand, and Tokyo has a treaty with a country that did not exist in the Foreign Ministry's files last year."
 can_dnc_d.42.a: "Signed at Ottawa, by us."
 can_dnc_d.43.t: "Tokyo Answers Through London"
 can_dnc_d.43.d: "The Japanese reply is addressed to the Foreign Office and copied to Ottawa as a courtesy. Japan is allied to Great Britain and will discuss emigration with the government of Great Britain. British Columbia gets its four hundred a year and Canada gets a lesson in what an ally of an ally is worth."
 can_dnc_d.43.a: "Then we are still a province of somebody."
 can_dnc_d.45.t: "Tokyo Asks About the Dockyard"
 can_dnc_d.45.d: "The convention is signed, and the Japanese minister asks a question over the brandy: what exactly is being laid down at Esquimalt, and against whom. He is answered civilly and goes away with the answer he came for. The Naval Service estimates are read in Tokyo before they are voted in Ottawa."
 can_dnc_d.45.a: "Signed, and watched."
 can_dnc_d.44.t: "Canadian Columns Move on the Panhandle"
 can_dnc_d.44.d: "The Yukon militia and the Field Force are moving down the Chilkoot and White Pass trails toward tidewater, and Ottawa has published a claim to the heads of the Lynn Canal. The garrison at Skagway is two companies and a customs house. The nearest American regiment is a month away by sea; the nearest Canadian one is four days on foot. Nobody in Washington believes Canada means it, and nobody wants to be the man who was wrong."
 can_dnc_d.44.a: "The Pacific squadron sails for Puget Sound."
 can_dnc_d.44.b: "Offer arbitration once more, and mean it this time."
 can_dnc_d.44.c: "Ignore them. Let the militia winter up there."
 can_dnc_d.46.t: "Ninety Millions on the Other Side"
 can_dnc_d.46.d: "The squadron is at Puget Sound in nine days and the Washington militia is called out along the Fraser. Ottawa counts what it has: two cruisers, a militia of paper battalions, no ally, no guarantee and a border four thousand miles long. The country has never been so united or so exposed."
 can_dnc_d.46.a: "Hold the passes. Nothing else can be held."
 can_dnc_d.47.t: "Washington Offers Arbitration Again"
 can_dnc_d.47.d: "The President proposes a fresh commission, with a neutral chairman this time and no British judge anywhere near it. It is not a surrender and everyone knows it, but it is the first time the United States has offered Canada a tribunal instead of a line."
 can_dnc_d.47.a: "A tribunal we help choose. That is new."
 can_dnc_d.49.t: "No Answer From Washington"
 can_dnc_d.49.d: "Nothing comes. The State Department has decided that a column of militia in the mountains in October is a problem the weather will solve. The men dig in above Skagway, the snow closes the passes in three weeks, and the claim stands where the soldiers stand."
 can_dnc_d.49.a: "Then we hold what we stand on."
 can_dnc_d.48.t: "Canada Marches Alone"
 can_dnc_d.48.d: "The Colonial Office learns from the Ottawa papers that Canadian troops are moving on the Alaska panhandle. There is no consultation, no request and no obligation: Canada has taken the treaty power and this is what the treaty power looks like in the field. The Foreign Office has spent eight years building the American friendship that the award of 1903 was designed to buy. The question is whether Britain now says one word to Washington on behalf of a country that refused its advice."
 can_dnc_d.48.a: "Not a word. They chose this."
 can_dnc_d.48.b: "A word to Washington, for the last time."
 can_dnc_d.50.t: "No Guarantee From London"
 can_dnc_d.50.d: "The reply, when it comes, is one sentence: His Majesty's government has not been consulted and assumes no responsibility. It is printed in every paper on the continent within two days, and read in Washington as an invitation."
 can_dnc_d.50.a: "We are alone. We knew that when we began."
 can_dnc_d.52.t: "London Speaks Once More for Canada"
 can_dnc_d.52.d: "The ambassador at Washington calls at the State Department and says, without instructions he will admit to, that His Majesty's government would view a general war on the Canadian border with the gravest concern. It commits Britain to nothing and it changes the arithmetic in the room."
 can_dnc_d.52.a: "Old habits, and useful ones."
 can_dnc_d.51.t: "St John's Is Offered a Price"
 can_dnc_d.51.d: "Canada has put money on the table at St John's: the whole of the Newfoundland railway debt, in cash, in exchange for the island's entry. The colony refused Confederation in 1869 and again in 1895 when Ottawa would not touch that debt. This time the debt is the offer. London holds the answer, because the terms of union must pass at Westminster, and because a colony that leaves for a country which has just left is a precedent nobody in the Cabinet wants to sign. Sixty days."
 can_dnc_d.51.a: "Let the island go. The debt is not ours either."
 can_dnc_d.51.b: "Newfoundland is a colony, not a chattel."
 can_dnc_d.53.t: "Newfoundland Comes In"
 can_dnc_d.53.d: "The terms pass at Westminster in a thin House and are read at St John's from the courthouse steps. The Grand Banks, the Labrador coast and the iron of Bell Island come in together, and the Nova Scotia steel men who have bought that ore for a decade now buy it at home."
 can_dnc_d.53.a: "The Atlantic coast is finished."
 can_dnc_d.54.t: "The Island Says No"
 can_dnc_d.54.d: "The Colonial Secretary answers that Newfoundland's future is a matter for Newfoundland and His Majesty's government, and that the offer will not be transmitted. Most of the money comes back to the Receiver General. The merchants of Water Street had been counting on it, and they say so loudly."
 can_dnc_d.54.a: "Leave the offer open. They will be back."
 can_dnc_d.55.t: "The Crown Is Struck From the Statutes"
 can_dnc_d.55.d: "The oath of allegiance is to be removed from every statute, every commission and every courtroom in the country, and the Governor General's commission left to expire on its own date. The judges of Ontario have asked what they are to swear on Monday. The regiments have asked whose colours they carry. The answer must be given this week, and it will be remembered for fifty years."
 can_dnc_d.55.a: "The oath is to the constitution. Swear it and sit down."
 can_dnc_d.55.b: "Let him go with honours, and keep the regimental colours."
 can_dnc_d.56.t: "A Republic on the Saint Lawrence"
 can_dnc_d.56.d: "The Quai d'Orsay has the proclamation of the Canadian republic on its desk, and the Chamber will ask about it on Thursday. A republic of seven millions, half of them speaking French, standing on the northern half of a continent and no longer answering to London: the sentiment in Paris is obvious and the calculation is not. Recognition costs nothing and is worth a great deal in a country where French is a language of state, but the Entente with Britain is four years old and is the whole of French policy in Europe."
 can_dnc_d.56.a: "Recognise at once, and send an ambassador."
 can_dnc_d.56.b: "Recognise quietly, and say nothing in London."
 can_dnc_d.57.t: "France Recognises the Republic"
 can_dnc_d.57.d: "The recognition is voted in the Chamber with a speech about the two Frances of the world, and an ambassador is on the water within a month. In Quebec the news is read from pulpits that have not agreed with a French government since 1789."
 can_dnc_d.57.a: "The first embassy in Ottawa is French."
 can_dnc_d.58.t: "A Quiet Recognition From Paris"
 can_dnc_d.58.d: "The recognition is published in the Journal Officiel between a customs schedule and a colonial appointment, and no speech is made. A charge d'affaires arrives without ceremony. It is exactly as much as Paris can do without explaining itself in London, and it is enough."
 can_dnc_d.58.a: "Quietly, then. It counts the same."
 can_dnc_d.59.t: "A Republic on the Northern Border"
 can_dnc_d.59.d: "There is a republic on the northern border for the first time since 1867, and the Cabinet has spent the morning on it. The annexation press in Michigan and New York has already begun; the President is not among its readers. Recognition is certain. The question is what goes with it. A guarantee would end the northern question forever and bind the United States to a quarrel with Britain if one ever came. Reciprocity would open the whole continent to Canadian wheat and Canadian wheat to the millers of Minneapolis. Or Washington can say nothing and wait, because a country with no fleet, no credit and a border like that may not need to be taken at all."
 can_dnc_d.59.a: "Recognise, and guarantee the border."
 can_dnc_d.59.b: "Recognise, and offer reciprocity."
 can_dnc_d.59.c: "Recognise, and wait for the fruit to fall."
 can_dnc_d.60.t: "A Guarantee From the Republic"
 can_dnc_d.60.d: "The United States guarantees the territorial integrity of Canada, in a message to Congress, in the plainest language the State Department can write. Ottawa has in one afternoon what London withheld for a decade, and has it from the only country that could ever have taken the ground."
 can_dnc_d.60.a: "Our neighbour is our guarantee. Sleep on that."
 can_dnc_d.61.t: "Reciprocity Offered"
 can_dnc_d.61.d: "Recognition comes with a draft reciprocity agreement attached: natural products free both ways, manufactures negotiable. The Ontario manufacturers who spent thirty years building a tariff read it in the morning papers and take the first train to Ottawa."
 can_dnc_d.61.a: "Read it carefully. Every line of it."
 can_dnc_d.63.t: "Washington Waits"
 can_dnc_d.63.d: "Recognition is extended in eleven words and nothing else is offered. The annexation papers of the border states have their subject back and print it every day. Ottawa understands the message, which is that a country with no fleet, no credit and no friends can be waited out."
 can_dnc_d.63.a: "Then we shall be harder to wait out."
 can_dnc_d.62.t: "The King Is Told"
 can_dnc_d.62.d: "The King is informed that the Dominion of Canada has proclaimed itself a republic, that the oath of allegiance has been struck from its statutes, and that his Governor General has been thanked and sent home. The Cabinet must now decide whether to recognise it. Canada owes the City a great deal of money, buys most of what it manufactures in Britain, and sits astride the sea road to the Pacific. It has also just shown the Cape, Australia and Ireland that a Dominion may leave and nothing happens to it."
 can_dnc_d.62.a: "Recognise it. Keep the trade and the debt."
 can_dnc_d.62.b: "No recognition, no credit, no preference."
 can_dnc_d.64.t: "London Recognises"
 can_dnc_d.64.d: "The recognition is grudging, brief and complete. Trade continues, the debts are honoured on both sides, and a British minister presents his letters in Ottawa to a president. The Colonial Office begins a file on the constitutional position of the remaining Dominions."
 can_dnc_d.64.a: "Business, in the end, is business."
 can_dnc_d.65.t: "Neither Recognition Nor Credit"
 can_dnc_d.65.d: "The republic is not recognised, the preference is withdrawn, and every Canadian security in London is quietly marketed by houses that were underwriting them last year. The Admiralty is asked what force would be needed on the North Atlantic station. Ottawa reads the market columns before the despatches."
 can_dnc_d.65.a: "We shall pay cash and build slowly."

