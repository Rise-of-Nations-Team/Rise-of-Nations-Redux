l_english:
#Focuses
 CANDNC_the_colonial_conference_of_1902: "The Colonial Conference of 1902"
 CANDNC_the_colonial_conference_of_1902_desc: "London, 30 June to 11 August. Joseph Chamberlain asks the self-governing colonies for three things: a permanent imperial council, a standing contribution to imperial defence, and a customs union of the Empire."
 CANDNC_no_permanent_imperial_council: "No Permanent Imperial Council"
 CANDNC_no_permanent_imperial_council_desc: "The first refusal. A council sitting in London would bind Ottawa to policies written elsewhere. We keep our budget and our militia, and we keep no chair at the table either."
 CANDNC_the_unilateral_preference: "The Unilateral British Preference"
 CANDNC_the_unilateral_preference_desc: "The one thing granted at the conference. Canada keeps a preferential tariff for British goods, given freely and withdrawable at will. London gets no treaty out of it and Canadian mills get British competition."
 CANDNC_no_imperial_zollverein: "No Imperial Zollverein"
 CANDNC_no_imperial_zollverein_desc: "The third refusal. A customs union of the Empire would set Canadian duties in London and end the National Policy. Chamberlain sails home with nothing but the preference he already had."
 CANDNC_the_imperial_conference_of_1907: "The Imperial Conference of 1907"
 CANDNC_the_imperial_conference_of_1907_desc: "London, 15 April to 14 May 1907. The gathering is renamed, made quadrennial, and held between prime ministers. The Colonial Office opens a department to handle the Dominions apart from the Crown colonies."
 CANDNC_the_title_of_dominion: "The Title of Dominion"
 CANDNC_the_title_of_dominion_desc: "The self-governing colonies become Dominions. It is a change of title and very little else: foreign policy stays in London, and rank without power is still only rank."
 CANDNC_deakins_secretariat: "Deakin's Secretariat"
 CANDNC_deakins_secretariat_desc: "Alfred Deakin of Australia wants a permanent imperial secretariat. Laurier blocks it once more. Refusing it avoids the obligation that comes with it, and denies Canada the one room where it might have pushed."
 CANDNC_the_dominions_department: "The Dominions Department"
 CANDNC_the_dominions_department_desc: "A branch of the Colonial Office now files Ottawa under a heading of its own. It is filing, not policy, and after 1903 filing is not nothing."
 CANDNC_the_treaty_with_france: "The Treaty with France"
 CANDNC_the_treaty_with_france_desc: "Paris, 19 September 1907. Fielding and Brodeur sign a commercial treaty with France, the first substantial agreement negotiated by Canadian ministers, still under British cover. Sovereignty arrives by tariff first."
 CANDNC_the_fisheries_protection_service: "The Fisheries Protection Service"
 CANDNC_the_fisheries_protection_service_desc: "The Department of Marine and Fisheries keeps the only armed vessels the country owns. Unarmoured cruisers chasing poachers off the banks are the whole navy, and the school where its first seamen learn the coast."
 CANDNC_the_imperial_fortresses: "Halifax and Esquimalt"
 CANDNC_the_imperial_fortresses_desc: "In 1905 London agrees to hand over the imperial fortresses, and the last British garrisons sail the year after. Independence in fact, and the bill for works, guns and garrisons moves to the Canadian estimates."
 CANDNC_the_cheque_to_the_admiralty: "The Cheque to the Admiralty"
 CANDNC_the_cheque_to_the_admiralty_desc: "Pay London and let the Royal Navy answer for both oceans. Ontario will read loyalty, Quebec will read the antechamber of conscription, and no Canadian yard will ever cut a keel. There is no going back on this."
 CANDNC_a_naval_service_of_our_own: "A Naval Service of Our Own"
 CANDNC_a_naval_service_of_our_own_desc: "Raise ships under Canadian flag and Canadian law, as Australia is doing. The country gets an instrument it commands and a bill it cannot carry, and both camps will call it a joke. There is no going back on this."
 CANDNC_a_regular_contribution: "A Regular Contribution"
 CANDNC_a_regular_contribution_desc: "The standing payment Chamberlain asked for in 1902, voted at last. The Admiralty estimates gain a Canadian line, and the Commons lose the argument that the Empire costs this country nothing."
 CANDNC_the_admiralty_guarantee: "The Admiralty Guarantee"
 CANDNC_the_admiralty_guarantee_desc: "In exchange the Royal Navy answers for the Atlantic and the Pacific approaches. Canadian trade sails behind the best escort in the world, and Canadian yards quietly forget how to build."
 CANDNC_a_voice_at_the_imperial_table: "A Voice at the Imperial Table"
 CANDNC_a_voice_at_the_imperial_table_desc: "Money buys consultation. Ottawa is heard on imperial defence, which is more than any refusal ever bought, and being heard is still not the same thing as deciding."
 CANDNC_the_halifax_station: "The North Atlantic Station"
 CANDNC_the_halifax_station_desc: "Halifax stays an imperial station, coaled and garrisoned to Admiralty account. The yard works to British orders and the town lives on British pay."
 CANDNC_the_esquimalt_station: "The Pacific Station"
 CANDNC_the_esquimalt_station_desc: "Esquimalt keeps its imperial character on a coast that has no other defence. British Columbia sleeps easier for it and pays for none of it."
 CANDNC_monk_refuses_the_estimates: "Monk Refuses the Estimates"
 CANDNC_monk_refuses_the_estimates_desc: "Frederick Monk will not vote a dollar of naval expenditure, and he speaks for a province. The Conservative caucus splits along the Ottawa river before a single ship is ordered."
 CANDNC_imperial_naval_stores: "Imperial Naval Stores"
 CANDNC_imperial_naval_stores_desc: "Coal, shell and pattern stores come out of British depots at British prices. Supply is certain, it is cheap, and it lies entirely outside Canadian control."
 CANDNC_no_yard_of_our_own: "No Yard of Our Own"
 CANDNC_no_yard_of_our_own_desc: "The money votes itself to the Clyde. There will be no naval industry on the St Lawrence, no armour plate and no gun shop, and nothing to convert when a war finally comes."
 CANDNC_the_ligue_nationaliste: "The Ligue Nationaliste"
 CANDNC_the_ligue_nationaliste_desc: "Montreal, 1 March 1903. Olivar Asselin and Armand Lavergne found the league with Bourassa's backing. Three articles: autonomy of Canada within the Empire, autonomy of the provinces, an economic policy made here."
 CANDNC_ready_aye_ready: "Ready, Aye, Ready"
 CANDNC_ready_aye_ready_desc: "Loyalist Ontario has what it asked for: the Empire defended without argument and without delay. The drill halls fill in Toronto and stay very quiet in Trois-Rivieres."
 CANDNC_the_battlecruiser_subscription: "A Battlecruiser for the Admiralty"
 CANDNC_the_battlecruiser_subscription_desc: "New Zealand offered to pay for one in March 1909 and the imperialist press wants Canada to match it. A capital ship given away is not Canadian, and it will never become Canadian."
 CANDNC_le_nationaliste: "Le Nationaliste"
 CANDNC_le_nationaliste_desc: "Olivar Asselin launches his weekly on 6 March 1904, organ of the league and a paper of combat. The libel suits that follow are part of the business plan."
 CANDNC_a_dominion_that_pays: "A Dominion That Pays"
 CANDNC_a_dominion_that_pays_desc: "Canada has bought a guarantee, a seat and a quarrel. Both oceans are covered by somebody else's fleet, and the bill for that arrangement is presented in Quebec at every election."
 CANDNC_the_cruiser_canada: "The Cruiser Canada"
 CANDNC_the_cruiser_canada_desc: "Built for the Fisheries Protection Service and at sea from 1904, she patrols the banks and carries cadets. The first Canadian warship is a fishery cruiser, and that is precisely where the navy begins."
 CANDNC_take_over_the_dockyards: "Take Over the Dockyards"
 CANDNC_take_over_the_dockyards_desc: "With the fortresses come the yards. Halifax and Esquimalt pass to Canadian charge, with their basins, their sheds and their empty pay chests."
 CANDNC_the_halifax_yard: "The Halifax Yard"
 CANDNC_the_halifax_yard_desc: "The Atlantic yard is refitted for Canadian work. Every repair done here is a repair no longer begged from the Admiralty, and every fitter kept on is a trade the country did not have."
 CANDNC_the_esquimalt_yard: "The Esquimalt Yard"
 CANDNC_the_esquimalt_yard_desc: "The Pacific yard is kept alive on a coast three thousand miles from Ottawa and rather closer to Yokohama. Nobody in the capital has ever seen it."
 CANDNC_officers_of_our_own: "Officers of Our Own"
 CANDNC_officers_of_our_own_desc: "Canadian cadets trained in Canadian ships. The doctrine, the signal books and the gunnery tables remain British, and for a generation so will the instructors."
 CANDNC_the_fisheries_patrol_expanded: "Extend the Fisheries Patrol"
 CANDNC_the_fisheries_patrol_expanded_desc: "More cruisers on the banks and in the gulf. Sovereignty gets exercised where it is cheapest to exercise, and every foreign schooner arrested is a small treaty enforced."
 CANDNC_a_yard_on_the_st_lawrence: "A Yard on the St Lawrence"
 CANDNC_a_yard_on_the_st_lawrence_desc: "Plate, frames and engines ordered at home. The first Canadian-built hulls cost more than British ones and leave the money, the trade and the men inside the country."
 CANDNC_the_naval_militia: "A Naval Militia"
 CANDNC_the_naval_militia_desc: "Fishermen and lake sailors enrolled as a reserve. The Atlantic and Pacific ports furnish crews that no permanent force of this size could ever afford to keep on the books."
 CANDNC_the_tin_pot_navy: "The Tin-Pot Navy"
 CANDNC_the_tin_pot_navy_desc: "Ontario calls it derisory, Quebec calls it a machine for sending Canadians to imperial wars, and the crews go on drilling between the two. Both insults are printed in the same week."
 CANDNC_the_australian_precedent: "The Australian Precedent"
 CANDNC_the_australian_precedent_desc: "Melbourne raises a fleet unit of its own rather than write a cheque. On the naval question Ottawa is not isolated: it is aligned with Australia against contribution in money."
 CANDNC_two_oceans_one_budget: "Two Oceans, One Budget"
 CANDNC_two_oceans_one_budget_desc: "Halifax and Esquimalt are a continent apart and there is one estimate to cover both. Whatever is stationed on the Atlantic is not on the Pacific, and British Columbia counts the funnels."
 CANDNC_the_new_zealand_cheque: "The New Zealand Cheque"
 CANDNC_the_new_zealand_cheque_desc: "In March 1909 New Zealand offers to pay for a battlecruiser for the Admiralty. Wellington buys gratitude in London; Ottawa would rather buy hulls it can order about."
 CANDNC_a_fleet_of_our_own: "A Fleet of Our Own"
 CANDNC_a_fleet_of_our_own_desc: "Small, ours, and detested on both flanks at once. The country owns an instrument at last, and the argument about what it is for has barely started."
 CANDNC_the_hay_pauncefote_treaty: "The Hay-Pauncefote Treaty"
 CANDNC_the_hay_pauncefote_treaty_desc: "Washington, 18 November 1901. Britain hands the United States the right to build and control an isthmian canal. Canada is not consulted, and learns what British diplomacy costs when Washington sits opposite."
 CANDNC_the_hay_herbert_convention: "The Hay-Herbert Convention"
 CANDNC_the_hay_herbert_convention_desc: "Washington, 24 January 1903. Six impartial jurists of repute, three named by each side, are to settle the Alaska boundary. Canada is not a signatory: this is a British treaty about Canadian ground."
 CANDNC_the_canadian_commissioners: "Jette and Aylesworth"
 CANDNC_the_canadian_commissioners_desc: "Sir Louis-Amable Jette and Allen Bristol Aylesworth sit for Canada, Aylesworth replacing Sir John Douglas Armour, who dies during the case. The third British seat goes to the Lord Chief Justice of England."
 CANDNC_the_alverstone_award: "The Alverstone Award"
 CANDNC_the_alverstone_award_desc: "20 October 1903. Lord Alverstone votes with the three Americans, four to two. The heads of the Lynn Canal stay American. Canada keeps Pearse and Wales islands; Sitklan and Kannaghunut go to the United States."
 CANDNC_protest_and_submit: "Protest and Submit"
 CANDNC_protest_and_submit_desc: "Jette and Aylesworth withhold their signatures, which has no legal effect whatever, and the line is drawn. The grievance is banked and the imperial connection survives it. There is no going back on this."
 CANDNC_denounce_the_arbitration: "Denounce the Arbitration"
 CANDNC_denounce_the_arbitration_desc: "Repudiate the award in public and refuse the line, as the Ontario press demands. The sentence binds Britain and will stand; what changes is that Ottawa has quarrelled with London in front of Roosevelt."
 CANDNC_the_power_to_treat: "The Power to Treat"
 CANDNC_the_power_to_treat_desc: "In the Commons on 23 October 1903 Laurier says the humiliation comes of Canada having no power to make treaties, and that one day it must be asked for. Asking for it means facing Washington alone."
 CANDNC_the_yukon_without_a_port: "The Yukon Without a Port"
 CANDNC_the_yukon_without_a_port_desc: "Skagway and Dyea are American, so every ounce of Klondike gold and every sack of flour crosses American soil. The one Canadian territory with a boom has no Canadian door."
 CANDNC_the_great_lakes_limits: "The Rush-Bagot Limits"
 CANDNC_the_great_lakes_limits_desc: "The agreement of 1817 still caps the armed vessels either side may keep on the Great Lakes. The longest border in the world is held by a piece of paper, and both governments prefer it that way."
 CANDNC_the_boundary_waters_treaty: "The Boundary Waters Treaty"
 CANDNC_the_boundary_waters_treaty_desc: "Washington, 11 January 1909. George Gibbons negotiates for Canada; James Bryce, His Majesty's ambassador, signs with Elihu Root. Equal standing on the water, and still no Canadian name at the bottom of it."
 CANDNC_the_international_joint_commission: "The International Joint Commission"
 CANDNC_the_international_joint_commission_desc: "Six members, three from each country, with authority over the use and diversion of boundary waters. A power ten times our size accepts an equal vote, which in 1909 is worth more than a signature."
 CANDNC_the_department_of_external_affairs: "The Department of External Affairs"
 CANDNC_the_department_of_external_affairs_desc: "Sanctioned 19 May 1909, in force on 1 June. Charles Murphy is the minister responsible, Sir Joseph Pope the first under-secretary. A department with no embassies and no treaty power, built so that one day it can serve."
 CANDNC_a_room_on_bank_street: "A Room on Bank Street"
 CANDNC_a_room_on_bank_street_desc: "The entire foreign service of seven million people: an under-secretary and a handful of clerks in rented rooms over a shop. Sorting the imperial correspondence is the whole of the first year's work."
 CANDNC_the_foster_resolution: "The Foster Resolution"
 CANDNC_the_foster_resolution_desc: "29 March 1909. The Commons adopt George Eulas Foster's resolution, amended with the government's agreement, for a Canadian naval service rather than a contribution in money. Not one member votes against it."
 CANDNC_the_imperial_defence_conference: "The Imperial Defence Conference"
 CANDNC_the_imperial_defence_conference_desc: "London, July and August 1909, called after the German naval scare. Brodeur and Frederick Borden attend and the Admiralty offers fleet units. New Zealand pays for a battlecruiser; Australia raises a fleet of its own."
 CANDNC_two_readings_of_one_vote: "Two Readings of One Vote"
 CANDNC_two_readings_of_one_vote_desc: "Unanimity was bought by letting each side hear what it wished. Ontario read a contribution to the Empire, Quebec read a refusal to contribute, and the reckoning is only postponed."
#Ideas
 CAN_autonomy_without_a_seat: "Autonomy Without a Seat"
 CAN_autonomy_without_a_seat_desc: "Ottawa answers to nobody on defence and is consulted by nobody either. The estimates stay ours; the Admiralty schools that trained our officers are shut to us."
 CAN_the_british_preference: "The Unilateral British Preference"
 CAN_the_british_preference_desc: "A tariff advantage granted to Britain for nothing in return. Manchester goods land cheap in Montreal, which pleases every household and closes a mill a year."
 CAN_dominion_in_name: "Dominion in Name"
 CAN_dominion_in_name_desc: "A title that carries rank and no power. The country is addressed as an equal and still cannot sign for itself, and the men who wanted more are louder every year."
 CAN_the_french_commercial_treaty: "The Commercial Treaty with France"
 CAN_the_french_commercial_treaty_desc: "Canadian ministers negotiating in Paris under a British signature. The trade is real, and every week spent on it is a week of quarrel with the Colonial Office."
 CAN_the_fisheries_protection_service: "The Fisheries Protection Service"
 CAN_the_fisheries_protection_service_desc: "Unarmoured cruisers on the banks, and the only sea service the country has. The yards that keep them running are yards not building anything else."
 CAN_the_imperial_fortresses: "The Imperial Fortresses"
 CAN_the_imperial_fortresses_desc: "Halifax and Esquimalt are ours: works, batteries, magazines and the whole payroll that goes with them. London kept the guns warm for a century and has handed over the bill."
 CAN_the_admiralty_guarantee: "The Admiralty Guarantee"
 CAN_the_admiralty_guarantee_desc: "The Royal Navy answers for both oceans and the country need not think about the sea. Nothing is built here, nobody is trained here, and the guarantee lasts exactly as long as London finds it convenient."
 CAN_the_quebec_grievance: "The Quebec Grievance"
 CAN_the_quebec_grievance_desc: "A province that reads every naval dollar as the first instalment on conscription. The recruiting sergeant is not welcome and the member for Jacques-Cartier says so in the House."
 CAN_no_yard_of_our_own: "No Yard of Our Own"
 CAN_no_yard_of_our_own_desc: "The naval vote is spent on the Clyde. Canadian taxpayers get cheaper government and Canadian workmen get nothing, and no keel will be laid here when it is needed."
 CAN_the_ligue_nationaliste: "The Ligue Nationaliste"
 CAN_the_ligue_nationaliste_desc: "A movement that is bilingual, pan-Canadian and utterly opposed to paying for other people's wars. It costs the government a vote a week and a province in the long run."
 CAN_the_nationaliste_press: "Le Nationaliste"
 CAN_the_nationaliste_press_desc: "The league now has a newspaper, and the newspaper has a talent for libel actions it usually survives. Every naval estimate is fought twice, once in the House and once on the front page."
 CAN_ready_aye_ready: "Ready, Aye, Ready"
 CAN_ready_aye_ready_desc: "Loyalist Ontario answers before it is asked. The militia fills, the drill is keen, and the half of the country that was not consulted is watching."
 CAN_the_naval_service_of_canada: "The Naval Service of Canada"
 CAN_the_naval_service_of_canada_desc: "Ships under Canadian flag, Canadian law and Canadian pay. A navy is the most expensive thing a country of seven million can decide to want."
 CAN_two_oceans_one_budget: "Two Oceans, One Budget"
 CAN_two_oceans_one_budget_desc: "A single estimate stretched from the Grand Banks to Juan de Fuca. The ships learn to steam a long way and there are never enough of them in either place."
 CAN_a_fleet_of_our_own: "A Fleet of Our Own"
 CAN_a_fleet_of_our_own_desc: "Small, Canadian, and paid for in full every year whether or not anybody threatens the coast. It is an instrument the country commands, which is the whole of the argument for it."
 CAN_the_alaska_award: "The Alaska Award"
 CAN_the_alaska_award_desc: "A British judge voted with three Americans and the country found out what its opinion is worth. Nobody in Ottawa will forget October 1903."
 CAN_bound_by_london: "Bound by London"
 CAN_bound_by_london_desc: "The award stands, the connection holds, and Canadian interests remain in the keeping of a plaintiff whose first business is friendship with Washington."
 CAN_the_alaska_grievance: "The Alaska Grievance"
 CAN_the_alaska_grievance_desc: "A dominion that has publicly repudiated its own Empire's arbitration. The country is united in anger and trusted by nobody at either end of the wire."
 CAN_the_rush_bagot_agreement: "The Rush-Bagot Agreement"
 CAN_the_rush_bagot_agreement_desc: "Armed vessels on the Great Lakes have been limited since 1817 and the saving is enormous. Should the arrangement ever fail, there is nothing on the lakes to fail with."
 CAN_the_international_joint_commission: "The International Joint Commission"
 CAN_the_international_joint_commission_desc: "Three Canadians and three Americans with an equal vote over the boundary waters. Arbitration is cheap, it works, and a country that lives by it cannot pick a quarrel quickly."
 CAN_the_department_of_external_affairs: "The Department of External Affairs"
 CAN_the_department_of_external_affairs_desc: "An under-secretary, a few clerks and the imperial correspondence. It cannot make a treaty and it unsettles everyone who thinks Ottawa should not be trying to."
 CAN_two_readings_of_one_vote: "Two Readings of One Vote"
 CAN_two_readings_of_one_vote_desc: "A resolution carried without a dissenting voice because nobody agreed on what it said. The bill for that convenience falls due at the next general election."
