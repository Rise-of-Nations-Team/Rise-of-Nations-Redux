 QIN_smuggling_weapons: "Weapon Smuggling"
 QIN_smuggling_weapons_desc: "The Boxer Peace Protocol does not allow us to manufacture weapons. This situation is unbearable, as an empire such as ours, needs weapons for its protection. By smuggling weapons, we might be able to stockpile equipment in secret, However, we need to make sure this remains unremarked by the Foreign Powers\n\n Foreign Suspicion is [QIN_GetForeignSuspicion]\n\n§gIf the Foreign Suspicion is too High, this might trigger an Foreign Intervention to enforce the Treaty§!\n[GetInvestigationStatus]"
