 china_influence_sphere: "Foreign Influence in China"
 china_influence_sphere_desc: "Foreign Influence in Zones of [QIN.GetName]!\nThis section tracks foreign influence within different zones of your nation. Maintaining control is crucial for national stability and autonomy.\n\nW- **Zone Name**: [QIN_GetZoneName]!\n The specific zone where foreign influence is detected.\n\n- **Influence Level**: [?zone_influence_level]%\n Degree of foreign control or influence in china.\n\n- **Resistance Level**: [?zone_resistance_level]%\n Local resistance to foreign influence in china.\n\n- **Economic Impact**: [?zone_economic_impact]%\n Impact of our market on china's economy.\n\n- **Military Presence**: [?zone_military_presence] units\n Number of foreign units stationed in china.\n\n- **Cultural Influence**: [?zone_cultural_influence]%\n Extent of foreign cultural impact in china.\n"
