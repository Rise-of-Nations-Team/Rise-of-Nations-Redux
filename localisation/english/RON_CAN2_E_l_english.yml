l_english:

 #Focuses - the veldt
 CANDNC_the_trenches_at_paardeberg: "The Trenches at Paardeberg"
 CANDNC_the_trenches_at_paardeberg_desc: "Before dawn on 27 February 1900 Otter's men dig in sixty-five yards from Cronje's laager. The Boer general surrenders at breakfast, and Ottawa reads in the cables what one battalion is worth."
 CANDNC_a_third_contingent_by_order: "A Third Contingent, By Order"
 CANDNC_a_third_contingent_by_order_desc: "No vote, no debate, no session. An order in council raises more mounted rifles for the veldt, as October 1899 raised the first, and the member for Labelle counts the men nobody asked for."
 CANDNC_let_lord_strathcona_pay: "Let Lord Strathcona Pay"
 CANDNC_let_lord_strathcona_pay_desc: "Donald Smith equips six hundred horsemen out of his own pocket, hands them to Sam Steele and ships them from Halifax on 17 March 1900. The estimates are untouched and the House is not sitting."
 CANDNC_not_one_man_more: "Not One Man More"
 CANDNC_not_one_man_more_desc: "Bourassa's motion of 13 March becomes the word of the government: not a man and not a dollar without a vote of the Commons. Counterfactual, and Laurier knows what it costs him in Toronto."
 CANDNC_the_constabulary_drafts: "The Constabulary Drafts"
 CANDNC_the_constabulary_drafts_desc: "Twelve hundred Canadians sign for the South African Constabulary and reach the veldt after Vereeniging. They police a peace they did not win, and the grievance outlives the war that made it."
 CANDNC_a_regiment_one_man_owns: "A Regiment One Man Owns"
 CANDNC_a_regiment_one_man_owns_desc: "Strathcona's Horse comes home to a levee at Ottawa and leaves behind a precedent nobody meant to write: a private subject may raise, arm and ship a regiment while Parliament is prorogued."
 CANDNC_the_summons_from_downing_street: "The Summons from Downing Street"
 CANDNC_the_summons_from_downing_street_desc: "Chamberlain wants the answer in writing. The Colonial Office reminds Ottawa who pays for the garrisons on Citadel Hill and at Esquimalt, and that an account which was opened can be closed."
 CANDNC_the_men_come_home_from_africa: "The Men Come Home from Africa"
 CANDNC_the_men_come_home_from_africa_desc: "Two hundred and seventy dead, most of them of enteric fever, and for the first time a class of instructors who have been shot at. Frederick Borden has never had such men to put in the schools."

 #Focuses - the militia act
 CANDNC_four_edward_seven_chapter_twenty_three: "4 Edward VII, Chapter 23"
 CANDNC_four_edward_seven_chapter_twenty_three_desc: "Session of 1904: a Militia Council under the minister, no requirement that a British officer command, the Halifax war clause struck out, and engineers, signals and medical services authorised."
 CANDNC_dismiss_the_earl_of_dundonald: "Dismiss the Earl of Dundonald"
 CANDNC_dismiss_the_earl_of_dundonald_desc: "14 June 1904. The general commanding denounces Sydney Fisher from a public platform for striking Eastern Townships names off a cavalry list. The minister wins the quarrel and keeps the list."
 CANDNC_the_general_officer_commanding_stays: "The General Officer Commanding Stays"
 CANDNC_the_general_officer_commanding_stays_desc: "Counterfactual: the War Office wins June 1904 and its general holds the militia out of the minister's reach. Promotion boards sit at Halifax, and no member of Parliament writes a commission."
 CANDNC_the_militia_council_sits: "The Militia Council Sits"
 CANDNC_the_militia_council_sits_desc: "Borden takes the chair his own act built. Adjutant general, quartermaster and master general of ordnance answer to a minister in Ottawa, and the commissions still go where friendship goes."
 CANDNC_the_syllabus_from_aldershot: "The Syllabus from Aldershot"
 CANDNC_the_syllabus_from_aldershot_desc: "Kingston teaches what the War Office prints. Gunnery, drill and the promotion boards come from England, the pay comes from Ottawa, and no minister signs a name onto an officers' list again."
 CANDNC_four_thousand_regulars: "Four Thousand Regulars"
 CANDNC_four_thousand_regulars_desc: "The Permanent Force doubles to about four thousand men, enough to take over the barracks the British are leaving. It is not an army. It is the only body of soldiers the country pays daily."
 CANDNC_the_continental_establishment: "The Continental Establishment"
 CANDNC_the_continental_establishment_desc: "Counterfactual: Ottawa buys a standing army on the European pattern, barracks, cadres and a class called up every year. A country of wheat farmers is asked for its sons in seeding time."
 CANDNC_sir_william_otter_takes_the_staff: "Sir William Otter Takes the Staff"
 CANDNC_sir_william_otter_takes_the_staff_desc: "1908. The man who dug in at Paardeberg becomes Chief of the General Staff, the first born in this country to hold it. The doctrine, the schools and the cartridges are still made in England."
 CANDNC_the_rifle_made_at_quebec: "The Rifle Made at Quebec"
 CANDNC_the_rifle_made_at_quebec_desc: "Sir Charles Ross builds his straight-pull rifle in a plant on the Plains of Abraham. It wins at Bisley, it is ours, and nobody has yet fired it for a week in mud with a bayonet fixed."
 CANDNC_the_ross_stays_ours: "The Ross Stays Ours"
 CANDNC_the_ross_stays_ours_desc: "Every militiaman carries a rifle made in this country and a cartridge made at Quebec. The reports from the ranges about the bolt coming back into a man's eye are filed where reports are filed."
 CANDNC_the_pattern_from_enfield: "The Pattern from Enfield"
 CANDNC_the_pattern_from_enfield_desc: "Buy the short Lee-Enfield and the tools to make it, and let Sir Charles sell his rifle to target shooters. The plant on the Plains keeps its ammunition contract and loses everything else."

 #Focuses - the coast
 CANDNC_eight_thousand_miles_of_coast: "Eight Thousand Miles of Coast"
 CANDNC_eight_thousand_miles_of_coast_desc: "1900. The whole navy of the Dominion is the Fisheries Protection Service: a few armed cutters, a revenue cruiser, and the settled certainty that the Royal Navy will be there when it matters."
 CANDNC_take_the_two_fortresses: "Take the Two Fortresses"
 CANDNC_take_the_two_fortresses_desc: "1905, and London offers Halifax and Esquimalt. Accepting puts Canadian gunners on Citadel Hill and a line on the estimates for every barrack, every shell and every man of the garrison."
 CANDNC_let_london_keep_the_keys: "Let London Keep the Keys"
 CANDNC_let_london_keep_the_keys_desc: "Refuse the transfer. The imperial garrisons stay where they are, the Admiralty holds both dockyards, and the Dominion pays nothing and commands nothing on either of its own coasts."
 CANDNC_the_last_redcoats_sail: "The Last Redcoats Sail"
 CANDNC_the_last_redcoats_sail_desc: "1906, and the imperial garrisons go home. The Royal Canadian Garrison Artillery mans the guns above the harbour at last. Independence arrives in the shape of an invoice from the War Office."
 CANDNC_the_fisheries_protection_service: "The Fisheries Protection Service"
 CANDNC_the_fisheries_protection_service_desc: "Brodeur's department owns four armed cutters and a hydrographic survey. It is not a navy, but it is the only office in Ottawa that has ever given an order to a ship and had it obeyed."
 CANDNC_the_three_demands_of_mr_chamberlain: "Mr Chamberlain's Three Demands"
 CANDNC_the_three_demands_of_mr_chamberlain_desc: "London, 30 June 1902. A permanent imperial council, a regular contribution to defence, a customs union of the Empire. Laurier is asked for all three in a room where only he can refuse."
 CANDNC_officers_lent_by_the_admiralty: "Officers Lent by the Admiralty"
 CANDNC_officers_lent_by_the_admiralty_desc: "Ask London for the men who know the trade: two commanders, a gunnery lieutenant, an engineer. What they teach they may one day be asked to command, and both sides understand that."
 CANDNC_a_college_of_our_own_at_halifax: "A College of Our Own at Halifax"
 CANDNC_a_college_of_our_own_at_halifax_desc: "Counterfactual: the naval college opens in 1903 instead of 1911. Boys off Ontario farms learn navigation eight years early, and the men who would have been cadets in 1914 are lieutenants."
 CANDNC_the_survey_of_the_two_coasts: "The Survey of the Two Coasts"
 CANDNC_the_survey_of_the_two_coasts_desc: "Charts of the approaches to Halifax, of the Gulf and of the inside passage, drawn by Canadians for the first time. Whoever ends up defending this coast will at least know where the rocks are."
 CANDNC_the_fishermens_reserve: "The Fishermen's Reserve"
 CANDNC_the_fishermens_reserve_desc: "Lunenburg and Gaspe hold more seamen than the Admiralty has berths for. Enrol them, drill them a month a year, and the country owns crews before it owns a single ship to put them aboard."
 CANDNC_the_estimates_of_the_marine_department: "The Estimates of the Marine Department"
 CANDNC_the_estimates_of_the_marine_department_desc: "Louis-Philippe Brodeur brings the naval line of his estimates to cabinet. Everyone at the table knows that whatever is written on it will not be unwritten by any government that follows."

 #Focuses - the fork that broke Laurier
 CANDNC_a_service_of_our_own: "A Service of Our Own"
 CANDNC_a_service_of_our_own_desc: "Counterfactual: the naval service is voted in 1902, not 1910. Yards, officers and our own flag on the water eight years before the German alarm and twelve before the war that will test it."
 CANDNC_the_money_goes_to_london: "The Money Goes to London"
 CANDNC_the_money_goes_to_london_desc: "The Admiralty can lay down a battleship faster than this country can lay down a tug. Send the cheque, keep the quarrel out of Quebec, and let the Empire hold the sea it has always held."

 #Focuses - a navy of our own
 CANDNC_the_yard_at_esquimalt: "The Yard at Esquimalt"
 CANDNC_the_yard_at_esquimalt_desc: "The old imperial dockyard on Vancouver Island takes its first Canadian keel. Island timber, plate shipped round from Sydney, and a workforce that has never built anything longer than a ferry."
 CANDNC_the_steel_from_sydney: "The Steel from Sydney"
 CANDNC_the_steel_from_sydney_desc: "The Dominion Iron and Steel furnaces on Cape Breton burn Bell Island ore and Cape Breton coal. Ship plate is a different trade from rail, and the federal bounty pays the difference."
 CANDNC_build_the_hulls_at_home: "Build the Hulls at Home"
 CANDNC_build_the_hulls_at_home_desc: "Every rivet driven in Canada, at twice the price and four years late. The Vickers men come to Montreal as employees, and at the end of it the country owns a trade rather than two cruisers."
 CANDNC_order_them_from_barrow: "Order Them from Barrow"
 CANDNC_order_them_from_barrow_desc: "Vickers lays them down and they arrive complete in eighteen months. The money leaves the country, the slips at Halifax stay empty, and there is a navy this year instead of in 1912."
 CANDNC_the_ancient_colony: "The Ancient Colony"
 CANDNC_the_ancient_colony_desc: "St John's lies nearer Halifax than Halifax lies to Montreal, its Bell Island ore feeds Sydney, and its men crew half the Grand Banks. It asked to come in once, in 1895, and was refused over money."
 CANDNC_the_first_squadron: "The First Squadron"
 CANDNC_the_first_squadron_desc: "Two cruisers and four destroyers, one squadron on each ocean, a wireless station at Camperdown. Not a fleet: the first time Ottawa has been able to order a ship to sea and be obeyed."
 CANDNC_pay_the_colonys_debt: "Pay the Colony's Debt"
 CANDNC_pay_the_colonys_debt_desc: "Assume the railway debt of Newfoundland, guarantee its bonds, and the terms Ottawa refused in 1895 become terms St John's can accept. Sir Robert Bond will want the fisheries written in."
 CANDNC_leave_the_ancient_colony: "Leave the Ancient Colony"
 CANDNC_leave_the_ancient_colony_desc: "Newfoundland keeps its legislature, its debt and its fish, and Canada keeps its money. The Grand Banks stay a foreign shore off our own coast and the French Shore quarrel stays London's."
 CANDNC_the_wireless_chain: "The Wireless Chain"
 CANDNC_the_wireless_chain_desc: "Marconi's masts at Glace Bay talk to Poldhu in Cornwall, and the same trade can talk to a cruiser off Sable Island. Eight coast stations, and an Admiralty that would like to read them."
 CANDNC_the_union_of_the_two_dominions: "The Union of the Two Dominions"
 CANDNC_the_union_of_the_two_dominions_desc: "Counterfactual: the tenth province arrives forty years early. St John's votes on terms, Whitehall assents, and the Grand Banks, the Bell Island ore and eight thousand seamen come with it."
 CANDNC_the_patrol_of_the_grand_banks: "The Patrol of the Grand Banks"
 CANDNC_the_patrol_of_the_grand_banks_desc: "Gloucester schooners fish inside the headlands and the modus vivendi of 1888 settles nothing. Send the cruisers, board the trespassers, and let Washington complain to a Canadian officer."
 CANDNC_the_award_of_twenty_october: "The Award of 20 October"
 CANDNC_the_award_of_twenty_october_desc: "Lord Alverstone votes with the three Americans and the heads of the Lynn Canal stay American. Jette and Aylesworth refuse to sign. The Dominion cannot make a treaty and cannot stop one."
 CANDNC_the_seamen_of_two_colonies: "The Seamen of Two Colonies"
 CANDNC_the_seamen_of_two_colonies_desc: "Halifax, Lunenburg, St John's and Gaspe on one roll. The reserve fills faster than hulls come off the slips, which is the pleasantest problem the Marine Department has ever had."
 CANDNC_the_column_to_skagway: "The Column to Skagway"
 CANDNC_the_column_to_skagway_desc: "Counterfactual: the militia goes up the Lynn Canal in place of the lawyers going to London. Two battalions, the Yukon Field Force and a gunboat, and Washington is told where the line runs."
 CANDNC_swallow_the_award: "Swallow the Award"
 CANDNC_swallow_the_award_desc: "Take the two islands at the mouth of the Portland Canal, print the protest and remember it. Laurier tells the House on 23 October that the humiliation is having no power to treat at all."
 CANDNC_a_fleet_that_can_weigh_in_1914: "A Fleet That Can Weigh in 1914"
 CANDNC_a_fleet_that_can_weigh_in_1914_desc: "Twelve years of estimates, two yards, a college and a reserve. Whatever comes in August 1914, this country meets it with ships of its own and officers taught in its own schools."

 #Focuses - the cheque
 CANDNC_the_dreadnought_fund: "The Dreadnought Fund"
 CANDNC_the_dreadnought_fund_desc: "New Zealand offers a battle cruiser to the Admiralty in March 1909 and Australia answers by laying down a fleet of its own. Toronto asks aloud what the richest dominion means to offer."
 CANDNC_pay_for_a_battle_ship: "Pay for a Battle Ship"
 CANDNC_pay_for_a_battle_ship_desc: "One capital ship, given outright, flying the White Ensign and manned from Portsmouth. Ontario cheers, Quebec reads the vote as the first instalment of conscription, and Bourassa has his issue."
 CANDNC_not_a_ship_and_not_a_dollar: "Not a Ship and Not a Dollar"
 CANDNC_not_a_ship_and_not_a_dollar_desc: "Counterfactual: Monk wins the argument outright. No cheque, no cruisers, no yards, no college. The Dominion keeps its money and hands its coast to whoever else will trouble to guard it."
 CANDNC_the_white_ensign_at_halifax: "The White Ensign at Halifax"
 CANDNC_the_white_ensign_at_halifax_desc: "The gift is acknowledged in the Lords and the ship is a Royal Navy ship. Canadians may serve in her if they enlist under the Naval Discipline Act, which is to say under London."
 CANDNC_the_militia_takes_the_coast_guns: "The Militia Takes the Coast Guns"
 CANDNC_the_militia_takes_the_coast_guns_desc: "If there are to be no ships there must at least be guns. Garrison artillery at Halifax and Esquimalt, submarine mining companies, and a coast defended from the beach inward and no further."
 CANDNC_a_seat_at_the_committee: "A Seat at the Committee"
 CANDNC_a_seat_at_the_committee_desc: "The price is paid, so ask for the return: a Canadian minister at the Committee of Imperial Defence whenever the Dominion is discussed. Deakin has asked since 1902 and was given a title."
 CANDNC_the_fishermen_go_to_the_americans: "The Fishermen Go to the Americans"
 CANDNC_the_fishermen_go_to_the_americans_desc: "With no cruisers on the banks the Gloucester fleet works inside the headlands as it pleases and the Nova Scotia crews sign American articles. A coast without ships stops being a coast."
 CANDNC_brodeur_goes_to_whitehall: "Brodeur Goes to Whitehall"
 CANDNC_brodeur_goes_to_whitehall_desc: "London, July 1909, called after the German alarm. The Admiralty offers fleet units to the Dominions, and Brodeur and Frederick Borden are asked what Canada intends to put on the water."
 CANDNC_a_cheque_and_a_promise: "A Cheque and a Promise"
 CANDNC_a_cheque_and_a_promise_desc: "Sign for the contribution and let the resolution of 29 March stand as it is, unanimous and unnumbered. Ontario reads it as an offering, Quebec reads it as a refusal, and both are right."
 CANDNC_monk_breaks_the_alliance: "Monk Breaks the Alliance"
 CANDNC_monk_breaks_the_alliance_desc: "Frederick Monk will not vote a dollar to the Admiralty and takes the Quebec Conservatives out with him. Borden loses a province, Laurier loses a flank, and the House loses its unanimity."

 #Tooltips
 CANDNC_e_tt_no_going_back: "This choice cannot be taken back."

 #Events
 can_dnc_e.1.t: "Cronje Surrenders at Paardeberg"
 can_dnc_e.1.d: "The cables from the Modder River name a colonial battalion in the first line. Nine days of shelling, a night advance, trenches at sixty-five yards, and four thousand Boers laid down their arms at dawn."
 can_dnc_e.1.a: "Colonials, and they held."
 can_dnc_e.2.t: "The Reply to the Member for Labelle"
 can_dnc_e.2.d: "Lord Minto forwards the despatch himself. The Colonial Office understands that His Majesty's government in Canada now requires a vote of its Parliament before a single man leaves the Dominion."
 can_dnc_e.2.a: "Let the despatch stand as written."
 can_dnc_e.2.b: "A private word to Lord Minto."
 can_dnc_e.3.t: "An Account That Can Be Closed"
 can_dnc_e.3.d: "Chamberlain does not threaten. He observes that the garrisons at Halifax and Esquimalt cost the imperial treasury a great deal, and that a Dominion which sends no men may wish to pay for its own."
 can_dnc_e.3.a: "Then we will man the Citadel ourselves."
 can_dnc_e.3.b: "Ask for terms."
 can_dnc_e.4.t: "Disallowance Is Considered"
 can_dnc_e.4.d: "The law officers in London read the new Militia Act and find that a Dominion has quietly taken command of its own soldiers. Disallowance is on the table, and so is a quieter way out of it."
 can_dnc_e.4.a: "Amend the letters patent."
 can_dnc_e.4.b: "Let them disallow it, if they dare."
 can_dnc_e.5.t: "The Counties Answer"
 can_dnc_e.5.d: "The Grain Growers meet at Indian Head and the county members bring the same letter to Ottawa: the barracks take the sons who bring in the crop, and the crop is what pays for the barracks."
 can_dnc_e.5.a: "Exempt the harvest counties."
 can_dnc_e.5.b: "The class of this year will report."
 can_dnc_e.6.t: "Mr Chamberlain Asks Three Times"
 can_dnc_e.6.d: "A permanent council of the Empire. A yearly sum toward its defence. One tariff wall around all of it. The Australians are willing, the New Zealanders are eager, and the room turns to Laurier."
 can_dnc_e.6.a: "The council, and nothing else."
 can_dnc_e.6.b: "The money, and nothing said about a council."
 can_dnc_e.6.c: "No to all three."
 can_dnc_e.7.t: "A Dominion Lays Down Warships"
 can_dnc_e.7.d: "Ottawa votes a naval service of its own. The Admiralty calls it a useful auxiliary, the Navy League calls it a distraction, and in Washington somebody asks who now owns the guns on the Great Lakes approaches."
 can_dnc_e.7.a: "A flag of its own on the water."
 can_dnc_e.8.t: "The Vote at St John's"
 can_dnc_e.8.d: "The Assembly divides on the terms and Sir Robert Bond carries them by a margin that will be argued about for fifty years. Whitehall has not yet said whether it will let the ancient colony go."
 can_dnc_e.8.a: "Whitehall assents."
 can_dnc_e.8.b: "Put the naval brigade ashore."
 can_dnc_e.8.c: "The terms are too dear."
 can_dnc_e.9.t: "Washington Answers"
 can_dnc_e.9.d: "Roosevelt has said before that he would run the line himself with troops if it came to that. The customs posts above Skagway are Canadian this morning, and the question is whether they are Canadian tonight."
 can_dnc_e.9.a: "Hold the passes."
 can_dnc_e.9.b: "Fall back below the summits."
 can_dnc_e.10.t: "The House Divides on the Cheque"
 can_dnc_e.10.d: "Foster's men cheer the gift and Monk's men will not stand for it. Bourassa has the galleries and the Ontario press has the front pages, and the vote has to be taken all the same."
 can_dnc_e.10.a: "Carry it on Ontario votes."
 can_dnc_e.10.b: "Hold the vote over to the session."

 #Ideas
 CAN2E_the_men_of_paardeberg: "The Men of Paardeberg"
 CAN2E_the_men_of_paardeberg_desc: "Seven thousand three hundred and sixty-eight served in South Africa and the survivors now teach in the schools of instruction. Every one of them is also an argument Bourassa uses on a platform."
 CAN2E_a_quarrel_with_downing_street: "A Quarrel with Downing Street"
 CAN2E_a_quarrel_with_downing_street_desc: "The despatches are still courteous and the contracts are not. Loans are dearer, the Colonial Office answers slowly, and the technical missions that used to come from Woolwich have stopped coming."
 CAN2E_the_farmers_in_uniform: "The Farmers in Uniform"
 CAN2E_the_farmers_in_uniform_desc: "A class called up each year from a country where the harvest is done by hand. The barracks fill, the sections fill, and half the Prairie counties have written to their member about it."
 CAN2E_the_gunners_of_halifax: "The Gunners of Halifax"
 CAN2E_the_gunners_of_halifax_desc: "The Royal Canadian Garrison Artillery holds Citadel Hill and the batteries above Esquimalt. The guns are British, the ammunition is British, and the pay sheets at last are ours."
 CAN2E_a_yard_at_esquimalt: "A Yard at Esquimalt"
 CAN2E_a_yard_at_esquimalt_desc: "Slips, a graving dock and a machine shop on Vancouver Island, and a payroll the Marine Department did not have last year. What comes off the ways is slow, dear and entirely Canadian."
 CAN2E_the_officers_of_the_naval_service: "The Officers of the Naval Service"
 CAN2E_the_officers_of_the_naval_service_desc: "A college, a term of cadets a year, and a list of Canadian lieutenants that grows without asking Portsmouth for anybody. It costs a great deal and shows nothing for eight years."
 CAN2E_the_admiralty_cheque: "The Admiralty Cheque"
 CAN2E_the_admiralty_cheque_desc: "The money is voted, the ship is laid down at Barrow and it flies the White Ensign. Nothing is built here, nothing is learned here, and the Empire is very pleased with us."
 CAN2E_a_coast_without_ships: "A Coast Without Ships"
 CAN2E_a_coast_without_ships_desc: "Eight thousand miles of it, four armed cutters, and an understanding with the Admiralty that has never been written down. The trade goes on because nobody has yet decided to interfere with it."
 CAN2E_the_quebec_rifle_works: "The Quebec Rifle Works"
 CAN2E_the_quebec_rifle_works_desc: "Sir Charles Ross has his plant, his contract and his patents, and the country has a rifle it can make without asking. The reports from the ranges go into the file and stay there."
