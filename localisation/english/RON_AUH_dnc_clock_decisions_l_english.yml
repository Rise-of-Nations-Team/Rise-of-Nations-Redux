l_english:
 AUH_dnc_delegations_cat:0 "The Delegations"
 AUH_dnc_serbia_ladder_cat:0 "The Ladder Against Belgrade"
 AUH_dnc_county_instruments_cat:0 "The Instruments Against the Counties"
 AUH_dnc_heirs_chancellery_cat:0 "The Heir's Chancellery"
 AUH_dnc_memoranda_cat:0 "The Memoranda"
 AUH_del_carry_the_common_estimates:0 "Carry the Common Estimates"
 AUH_del_carry_the_common_estimates_desc:0 "Sixty men from Vienna and sixty from Budapest, meeting in the same city and never in the same room, exchanging notes like duellists' seconds. If the common estimates are carried without a scene, the year is already half won."
 AUH_del_press_the_quota_upward:0 "Press the Quota Upward"
 AUH_del_press_the_quota_upward_desc:0 "The common charge is divided by a number nobody loves. Instruct the delegation to argue, table by table, that the Kingdom has grown rich enough to pay like it."
 AUH_del_quota_room_up_tt:0 "There is still room to press: the Kingdom's share stands below forty in the hundred."
 AUH_del_let_the_quota_slip:0 "Let the Quota Slip"
 AUH_del_let_the_quota_slip_desc:0 "A point conceded on the quota is the cheapest good temper Budapest sells. The finance ministers will grumble; the delegations will vote."
 AUH_del_quota_room_down_tt:0 "There is something left to concede: the Kingdom's share stands above thirty in the hundred."
 AUH_del_the_credits_for_the_common_army:0 "The Credits for the Common Army"
 AUH_del_the_credits_for_the_common_army_desc:0 "Rifles, remounts and fortress guns are the one shopping list both delegations can sign without reading. Ask for the credits while the mood holds."
 AUH_serb_the_tariff_wall:0 "Raise the Tariff Wall"
 AUH_serb_the_tariff_wall_desc:0 "Nine-tenths of what Serbia sells crosses our frontier on the hoof. Post the new schedule at the customs houses and let arithmetic do the arguing."
 AUH_serb_tariff_wall_tt:0 "The tariff wall stands for six months, and the ladder's next rung comes within reach."
 AUH_serb_the_pig_war:0 "Close the Frontier to the Pig"
 AUH_serb_the_pig_war_desc:0 "The tariff pinched; the closure starves. Not a hog, not a plum, not a hide crosses until Belgrade remembers who buys them. The chancelleries of Europe will call it a pig war, and they will not be wrong."
 AUH_serb_tariff_first_tt:0 "The tariff wall must be standing before the frontier can be closed."
 AUH_serb_pig_war_tt:0 "The frontier is closed to Serbian goods for two years, and every legation in Europe files a report about pigs."
 AUH_serb_the_pig_war_threat:0 "The frontier closed against Serbia"
 AUH_serb_the_loan_is_blocked:0 "The Loan Is Blocked"
 AUH_serb_the_loan_is_blocked_desc:0 "Belgrade is shopping for money in Paris to spend on guns elsewhere. A word from the Ballhausplatz to the right banks, and the terms on offer become instructive."
 AUH_serb_loan_blocked_tt:0 "The Serbian loan waits in the antechambers of the banks, and the waiting is worth something in Vienna."
 AUH_serb_the_hand_reopened:0 "Reopen the Hand"
 AUH_serb_the_hand_reopened_desc:0 "Ladders are for climbing down as well as up. Lift the schedules, receive the trade delegation, and let the pig cross the frontier as an ambassador of good sense."
 AUH_serb_hand_reopened_tt:0 "The schedules are lifted and the frontier trade resumes."
 AUH_cty_the_royal_commissioners:0 "Send the Royal Commissioners"
 AUH_cty_the_royal_commissioners_desc:0 "Where a county assembly will not administer the law, a commissioner is named who will. He arrives with a warrant, a clerk and no friends, and the offices open in the morning."
 AUH_cty_ledger_up_tt:0 "§RThe ledger of the counties' grievances grows longer.§!"
 AUH_cty_the_gendarmes_ride_out:0 "The Gendarmes Ride Out"
 AUH_cty_the_gendarmes_ride_out_desc:0 "The resolutions are brave until the gendarmerie is billeted on the county seat. Order is restored, and remembered."
 AUH_cty_the_taxes_by_the_bayonet:0 "Collect the Taxes by the Bayonet"
 AUH_cty_the_taxes_by_the_bayonet_desc:0 "What the county will not remit, the army will escort. The arrears arrive to the kreuzer, and the receipt is written in a hand the counties will not forgive."
 AUH_cty_the_instruments_rest:0 "Let the Instruments Rest"
 AUH_cty_the_instruments_rest_desc:0 "A season without commissioners, without escorts, without new names on the warrant. The assemblies notice what is absent sooner than they ever noticed what was sent."
 AUH_cty_ledger_live_tt:0 "The counties must have grievances on the ledger for the resting to be noticed."
 AUH_cty_ledger_down_tt:0 "§GA page of the counties' grievances is quietly retired.§!"
 AUH_hc_a_card_on_every_desk:0 "A Card on Every Desk"
 AUH_hc_a_card_on_every_desk_desc:0 "Every prefect, colonel and editor of consequence gets a card in the index: who he owes, what he wants, which way he will jump. The next reign is being staffed in advance, alphabetically."
 AUH_hc_a_minister_is_marked:0 "A Minister Is Marked"
 AUH_hc_a_minister_is_marked_desc:0 "One name in the cabinet is underlined in the Belvedere's ink. His successor has already been to dinner."
 AUH_hc_minister_marked_tt:0 "A serving minister is marked in the card index for the day after."
 AUH_hc_the_generals_are_briefed:0 "The Generals Are Briefed"
 AUH_hc_the_generals_are_briefed_desc:0 "Quiet rooms, large maps, no minutes. The commanders who matter learn what the heir intends, and the heir learns which of them can be told."
 AUH_hc_the_word_dropped_at_court:0 "The Word Dropped at Court"
 AUH_hc_the_word_dropped_at_court_desc:0 "Three cards from the index, played at the right levee, buy a favour the government never learns it granted."
 AUH_hc_cards_to_spend_tt:0 "There must be at least five cards in the index worth playing."
 AUH_hc_dossier_spent_tt:0 "Cards are played from the index, and the dossier for the next reign grows thinner."
 AUH_mem_the_press_bureau_is_funded:0 "Fund the Press Bureau"
 AUH_mem_the_press_bureau_is_funded_desc:0 "The Ballhausplatz keeps a room of men who write for other men's newspapers. Their subject is the southern Slav question; their sources are the files; their salaries are now paid."
 AUH_mem_ledger_up_tt:0 "The file of documents of doubtful provenance grows thicker."
 AUH_mem_the_documents_of_provenance:0 "The Documents of Provenance"
 AUH_mem_the_documents_of_provenance_desc:0 "Minutes of meetings that may have happened, subscriptions to societies that certainly exist, signatures of an unusual fluency. The legation at Belgrade forwards them without comment."
 AUH_mem_the_coalition_stands_accused:0 "The Coalition Stands Accused"
 AUH_mem_the_coalition_stands_accused_desc:0 "The documents are entered into evidence and names are read into the record. The trial will hold as long as nobody looks too hard at the ink."
 AUH_mem_ledger_ready_tt:0 "The file must hold at least three documents fit to be sworn to."
 AUH_mem_ledger_spent_tt:0 "The documents are spent in open court, and the file grows thin."
 AUH_mem_the_trial_read_abroad:0 "A political trial read in every capital"
 AUH_mem_the_papers_are_burned:0 "The Papers Are Burned"
 AUH_mem_the_papers_are_burned_desc:0 "A cold grate, a match, and a file that can no longer embarrass anyone. Some victories are subtractions."
 AUH_mem_ledger_exists_tt:0 "There must be something left in the file to burn."
 AUH_mem_ledger_burned_tt:0 "§GThe file of doubtful documents is two pieces thinner.§!"
