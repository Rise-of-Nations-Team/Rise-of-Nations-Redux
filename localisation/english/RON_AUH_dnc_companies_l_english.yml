l_english:

 #DNC Austria-Hungary - industrial concerns
 AUH_witkowitz:0 "Witkowitzer Bergbau- und Eisenhuettengewerkschaft"
 AUH_witkowitz_desc:0 "The northern basin in one balance sheet: its own coal, its own coke, its own ore trains and the only plant in the realm that rolls armour thick enough for a capital ship. Rothschild money and the Gutmann family own it between them, and neither of them has ever been told a price by this ministry."
 AUH_poldi_huette:0 "Poldihuette"
 AUH_poldi_huette_desc:0 "Crucible and tool steel out of Kladno, and the first electric arc furnace turning anywhere in the realm. It is a small works with a laboratory attached, and what it learns in the laboratory reaches the other works within the year."
 AUH_boehler:0 "Gebrueder Boehler & Co."
 AUH_boehler_desc:0 "The special steels of the mountain valleys: gun steel, tool steel, spring steel, sold on a certificate rather than a price. Barrels made from it do not open up, and every artillery office in Europe knows it."
 AUH_alpine_montan:0 "Oesterreichisch-Alpine Montangesellschaft"
 AUH_alpine_montan_desc:0 "The ore mountain and the works below it, held as one estate. It digs its own iron, burns its own coal and sells pig to half the foundries of the western half. Where the ore goes short, this company decides who goes short with it."
 AUH_ostrava_karvina:0 "Ostrava-Karvina Coal Company"
 AUH_ostrava_karvina_desc:0 "Coking coal of the northern basin, the fuel that makes steel rather than heat. The pits, the coke ovens and the works stand on the same few kilometres of ground, which is the whole of their advantage and the whole of their danger."
 AUH_bruex_lignite:0 "Bruex Lignite Mining Company"
 AUH_bruex_lignite_desc:0 "Brown coal of the northern Bohemian seams, cut in the open and carried cheap. It is poor fuel and there is a great deal of it: it heats the towns, runs the gasworks and feeds the boilers that better coal is too expensive to feed."
 AUH_carpathian_field:0 "The Carpathian Field Companies"
 AUH_carpathian_field_desc:0 "The wells of the Carpathian field and the refineries of the towns below them, held by a crowd of small companies with foreign capital behind most of them. The realm has oil of its own, which is more than most powers can say, and no minister has yet decided who it belongs to."
 AUH_ganz:0 "Ganz & Co., Budapest"
 AUH_ganz_desc:0 "Electrical machines, three-phase traction, meters, turbines and the mills that made the house before the dynamos did. It electrifies a line faster than the state can survey one, and it takes its orders in Magyar."
 AUH_laurin_klement:0 "Laurin & Klement"
 AUH_laurin_klement_desc:0 "A Bohemian cycle works that began building motors and did not stop. The first series-built motor car of the realm came out of its sheds; the ministry noticed when it was already being sold abroad."
 AUH_nesselsdorfer:0 "Nesselsdorfer Wagenbau-Fabriks-Gesellschaft"
 AUH_nesselsdorfer_desc:0 "Carriages, then railway carriages, then motor carriages, from a works that has never once built the same thing for two decades running. It keeps the rolling stock of the northern lines moving and charges what it likes for it."
 AUH_puch:0 "Johann Puch, Graz"
 AUH_puch_desc:0 "Cycles, then motorcycles, then cars, built by a man who cannot read a drawing and does not need to. Cheap machines, made in quantity, in a town nobody in Vienna thinks of as an industrial one."
 AUH_oesterreichischer_lloyd:0 "Oesterreichischer Lloyd"
 AUH_oesterreichischer_lloyd_desc:0 "The subsidised mail steamers of Trieste, flying the house flag from the Levant to the East Indies. The subsidy is voted by two parliaments that agree on nothing else, and the stokers who keep the boats at sea have been shot at on the quay for asking to be paid."
 AUH_oesterreichisch_ungarische_bank:0 "Oesterreichisch-ungarische Bank"
 AUH_oesterreichisch_ungarische_bank_desc:0 "One note bank with two head offices, two governing bodies and banknotes printed in two languages on two sides of the same paper. Its privilege runs out on a date both parliaments know, and neither will say in advance what it intends to do about it."
 AUH_creditanstalt:0 "k.k. priv. Oesterreichische Credit-Anstalt"
 AUH_creditanstalt_desc:0 "The Rothschild house on the Ring, and behind it the iron, the coal and the railways of half the realm. It does not lend to the state so much as sit beside it, and when it declines a scheme the scheme does not happen."
 AUH_pesti_kereskedelmi:0 "Pesti Magyar Kereskedelmi Bank"
 AUH_pesti_kereskedelmi_desc:0 "The commercial bank of the Kingdom: grain, mills, sugar, waterworks and the municipal loans of every county town that wants a tramway. Hungarian capital, lent in Hungary, and its board says so at every opportunity."
 AUH_state_ironworks:0 "The State Ironworks"
 AUH_state_ironworks_desc:0 "The works the treasury owns outright, in the uplands and Transylvania: rails, plate, shell steel and gun forgings, made where the ministry says and sold at the price the ministry sets. They are never the cheapest supplier and they are the only one that cannot refuse an order."
 #DNC Austria-Hungary - materiel manufacturers
 AUH_skoda:0 "Skoda Works, Pilsen"
 AUH_skoda_desc:0 "Quick-firing field guns, mountain batteries and siege mortars that no fortress in Europe has yet been built to survive, all out of one town in Bohemia. The guns are the best money can buy and the ministry is reminded of that on every invoice."
 AUH_artilleriearsenal_wien:0 "k.u.k. Artilleriearsenal Wien"
 AUH_artilleriearsenal_wien_desc:0 "The state arsenal, pouring bronze barrels at a price no private house can match and to a design the private houses abandoned. Every gun is cheap, reliable and outranged, and the batteries that carry them will find that out in the field rather than on the proving ground."
 AUH_steyr_oewg:0 "Oesterreichische Waffenfabriks-Gesellschaft"
 AUH_steyr_oewg_desc:0 "The rifle works on the Enns: straight-pull Mannlichers by the hundred thousand, clip loading, and the Schwarzlose machine gun - a short barrel and an unlocked breech held shut by a toggle and its own inertia, which is crude, cheap and refuses to break."
 AUH_weiss_manfred:0 "Weiss Manfred, Csepel"
 AUH_weiss_manfred_desc:0 "Cartridges, shells, fuzes, rolling mills, tinned rations and the field kitchens that carry them, on an island below the Hungarian capital. It is the second industrial house of the realm and every round the army fires passes through it."
 AUH_feg_frommer:0 "Fegyver- es Gepgyar"
 AUH_feg_frommer_desc:0 "The arms and machine works of the Hungarian capital, and the long-recoil pistol its chief designer will not stop improving. Small arms made in the Kingdom, for the Kingdom's own establishment, with a design office that answers to Budapest."
 AUH_austro_daimler:0 "Oesterreichische Daimler-Motoren-Gesellschaft"
 AUH_austro_daimler_desc:0 "Engines first and vehicles afterwards, out of Wiener Neustadt: staff cars, lorries, road trains that pull a battery over ground no horse team will cross, and a wheeled armoured vehicle the army has already declined to buy."
 #DNC Austria-Hungary - naval manufacturers
 AUH_stabilimento_tecnico_triestino:0 "Stabilimento Tecnico Triestino"
 AUH_stabilimento_tecnico_triestino_desc:0 "The private yard at Trieste, and the only slipways in the realm long enough for a battleship. It builds the big hulls well, it builds them slowly, and it names its own price because there is nowhere else to go."
 AUH_seearsenal_pola:0 "Seearsenal Pola"
 AUH_seearsenal_pola_desc:0 "The navy's own establishment: docks, workshops, magazines, boats and the refits that keep the fleet at sea. It laid down an armoured cruiser and took four and a half years to hand her over, and nobody in the Marinesektion pretends otherwise."
 AUH_danubius_fiume:0 "Danubius Yard, Fiume"
 AUH_danubius_fiume_desc:0 "The yard the Kingdom demanded and the Kingdom's votes paid for, built at the Hungarian port to take the Hungarian share of the hulls. It turns out torpedo craft and destroyers in numbers; the prestige ships stay at Trieste, which was the bargain."
 AUH_whitehead_fiume:0 "Whitehead & Co., Fiume"
 AUH_whitehead_fiume_desc:0 "The torpedo works, and with it the gyroscope that finally makes a torpedo run where it is aimed. It sells to every navy that asks, including the ones our fleet is built against, and no minister has found a way to say so politely."
 #DNC Austria-Hungary - aircraft manufacturers
 AUH_etrich:0 "Etrich, Oberaltstadt"
 AUH_etrich_desc:0 "A Bohemian linen-mill family that took the seed of a climbing gourd, copied the shape of its wing and built a monoplane that flies itself. It is stable to the point of obstinacy: it will not fall out of the sky and it will not turn quickly either."
 AUH_lohner:0 "Jacob Lohner & Co., Vienna"
 AUH_lohner_desc:0 "Court carriage builders who went from coachwork to electric wheel-hub motors and are now bending ash and doping linen into airframes. The joinery is beautiful, the structures are heavy, and no other works in the realm can finish a fuselage like it."
 trade_concern:0 "Trade Concern"
