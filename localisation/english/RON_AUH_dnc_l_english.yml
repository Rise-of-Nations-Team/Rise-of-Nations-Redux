 AUH_air_the_common_army_gains_an_arm_tt:0 "The common army gains a whole arm, and the case for common institutions with it."
 AUH_air_one_more_common_arm_tt:0 "One more arm of the common army, paid for by both halves: [?AUS_support|%0] [?HUN_support|%0]"
 AUH_air_no_ordinance_has_been_written_for_it_tt:0 "The one arm for which no language ordinance has ever been written: [?CZE_support|%0]"
 AUH_air_a_troop_of_the_line_tt:0 "A troop of the line, with companies and a commander of its own."
 AUH_air_budapest_reads_a_new_common_arm_tt:0 "Budapest reads a new common arm and answers in the Diet: [?HUN_support|%0]"
 AUH_air_the_troop_has_machines_tt:0 "The new troop has machines of its own to fly on the day it is formed."
 AUH_air_the_troop_has_ships_tt:0 "The new troop has a ship of its own to fly on the day it is formed."
 AUH_air_the_estimates_are_shut_tt:0 "The aeronautical line is refused; the credits cannot be moved until the ministry is turned."
 AUH_air_the_chief_of_staff_backs_it_tt:0 "The Chief of the General Staff puts his own credit behind the establishment."
 AUH_air_the_motor_is_ordered_at_home_tt:0 "The motor is ordered inside the Monarchy, and the Monarchy has never built one this light."
 AUH_air_the_works_learns_its_trade_tt:0 "When the motor works has learned its trade, its aviation department is ours."
 AUH_air_the_metal_shop_tt:0 "A metal shop is fitted out beside the hall to roll and rivet the sheet."
 AUH_air_friedrichshafen_keeps_it_tt:0 "The position abroad is left standing, and we buy our ships finished."
 AUH_air_the_licence_leaves_tt:0 "The licence and the drawings go abroad, and the buyers there are grateful."
 AUH_air_a_station_beyond_the_leitha_tt:0 "A second station on the Hungarian side of the river: [?HUN_support|%0] [?AUS_support|%0]"
 AUH_air_the_works_stay_where_they_are_tt:0 "The establishment stays where the works are, and the Diet is told why: [?HUN_support|%0]"
 AUH_air_pischof_tt:0 "The engineer come home from France is available as a theorist."
 AUH_air_werner_pfleiderer_tt:0 "A Vienna engineering works takes him on and is available as an aircraft designer."
 AUH_air_the_bohemian_shed_keeps_the_money_tt:0 "The money stays with the Bohemian workshop, which is the better bet."
 AUH_air_german_of_service_tt:0 "German of service, as in every other arm: [?AUS_support|%0] [?HUN_support|%0] [?CRO_support|%0] [?CZE_support|%0]"
 AUH_air_the_troop_drills_in_its_own_tongues_tt:0 "The troop drills in its own tongues: [?CRO_support|%0] [?CZE_support|%0] [?HUN_support|%0] [?AUS_support|%0]"
 AUH_air_the_gemeinsamkeit_holds_tt:0 "The common institutions hold one more argument together."
 auh_dnc.750.t:0 "The Minister Calls It Superfluous"
 auh_dnc.750.d:0 "The Minister of War writes to the Chief of the General Staff that the flying machine is a curiosity for exhibitions, that the common army has guns and rifles to buy before it buys gasbags, and that he does not intend to stand before the Delegations and defend a line for balloons. The Chief of the General Staff answers that an officer in a basket can see a corps march, and that no cavalry patrol in Europe can do as much. The establishment waits at the Arsenal for one of them to win."
 auh_dnc.750.a:0 "Let the Minister have his way; the guns come first."
 auh_dnc.750.b:0 "Put the Chief of the General Staff behind the establishment."
 auh_dnc.751.t:0 "The Engine from Stuttgart"
 auh_dnc.751.d:0 "The engine ordered light comes off the train heavy. It weighs nearly twice what the works promised and gives less power than the contract says, so the airframe must be strengthened to carry it and the whole machine gains half its weight again. The reservoir above Vienna will freeze over within the month. The committee's money is spent, the constructor wants to fly anyway, and the society's lawyers want to know what a contract is for."
 auh_dnc.751.a:0 "Strengthen the airframe and fly it anyway."
 auh_dnc.751.b:0 "Refuse delivery and go to law with the works."
 auh_dnc.751.c:0 "Order the motor inside the Monarchy instead."
 auh_dnc.752.t:0 "The Wing Touched the Water"
 auh_dnc.752.d:0 "The taxiing trials went well, and on the fourth attempt the machine was turned tight to keep clear of the dam. The reservoir was too small for the turn. A wing went into the water, the machine capsized and went down in eleven metres, and the constructor was pulled out unhurt. The engine was not recovered in any condition worth the salvage. There is nothing left to show a subscriber."
 auh_dnc.752.a:0 "The lesson stands; the machine does not."
 auh_dnc.753.t:0 "The Drawings in Vienna"
 auh_dnc.753.d:0 "The dead constructor's drawings are with his estate in Vienna, the principle is public, and the ship it produced is documented down to its rivets. A firm on the far shore of a foreign lake holds the position and the goodwill; the aluminium sheet is rolled in that same country, because there is no smelter in the Monarchy and there will not be one in our lifetimes. The estate will talk to whoever arrives with a commission in his hand."
 auh_dnc.753.a:0 "Commission the hull here, to his principle."
 auh_dnc.753.b:0 "Let the foreign firm keep the position and buy the finished ships."
 auh_dnc.753.c:0 "Withdraw at Berlin's request and take a place in their programme."
 auh_dnc.754.t:0 "Two Words for the Same Field"
 auh_dnc.754.d:0 "The Hungarian delegation asks why the common estimates are building a hall on the Danube below Vienna and leasing a field south of it, while Transleithania's share of the aeronautical line appears in the accounts and nowhere on the ground. The member who asks is a balloonist himself and knows exactly what a hall costs. He would like to know in which of the two halves the newest arm of the common army intends to live."
 auh_dnc.754.a:0 "A second station on the Hungarian side of the river."
 auh_dnc.754.b:0 "The establishment stays where the works are."
 auh_dnc.755.t:0 "The Engineer Comes Home"
 auh_dnc.755.d:0 "A Viennese engineer who studied in France writes to the establishment. He has visited the brothers who build biplanes outside Paris, built a glider and then a machine of his own there, and flown a monoplane at a French field with a partner. He would rather draw at home, if there is a firm at home that will let him. There is one, on the edge of the city, which builds bread machinery and would like to build something else."
 auh_dnc.755.a:0 "Hire him, and the firm with him."
 auh_dnc.755.b:0 "Keep the money for the Bohemian workshop."
 auh_dnc.756.t:0 "In What Language Does the Troop Drill?"
 auh_dnc.756.d:0 "The new troop's first company is a designer's son from a Bohemian mill town, a pilot from Lower Austria, an engineer-major from Croatia and a chemist from the Hungarian half. The establishment asks the Ministry for a language ordinance, because it has never had one and nobody thought to write one for a service of thirty men. Whatever is answered will be quoted in every diet in the Monarchy within a fortnight."
 auh_dnc.756.a:0 "German of service, as in every other arm of the common army."
 auh_dnc.756.b:0 "The troop drills in what the flier speaks; flight orders stay in German."
 auh_dnc.757.t:0 "Under Another Cockade"
 auh_dnc.757.d:0 "The Bohemian constructor could not sell his monoplane at home. He was told the establishment buys gasbags, that a machine which has flown forty metres is not a machine, and that the estimates are closed. The drawings, the licence and the man's patience have gone north and south. His dove will be built under a German cockade and an Italian one, and we shall buy it back later at a price set by somebody else."
 auh_dnc.757.a:0 "We bought gasbags. Somebody else bought the aeroplane."
 AUH_air_the_estimates_are_reopened_tt:0 "The aeronautical line is put back before the Delegations, over the Ministry's head."
 AUH_air_the_estimates_stay_shut_tt:0 "The line stays out of the estimates, and the establishment lives on what a club will lend it."
 auh_dnc.758.t:0 "The Line Comes Back to the Table"
 auh_dnc.758.d:0 "The establishment has spent long enough borrowing baskets from a club and gas from an observatory, and the General Staff asks a second time for a line of its own. The Ministry has not changed its mind and will not be moved by argument; it can only be gone round, before both Delegations, at the cost of every favour the government still holds there. The Chief of the General Staff will put his name to the demand if we will put our credit behind it. Otherwise the file goes back in the drawer and the fliers stay guests of whoever will have them."
 auh_dnc.758.a:0 "Force the line through over the Ministry's head."
 auh_dnc.758.b:0 "Leave the file in the drawer; the guns come first."
 AUH_arm_the_staffs_frustration:0 "The Staff Has Been Refused"
 AUH_tb_the_common_regulations:0 "The Common Regulations"
 AUH_tb_the_staff_rides:0 "The Staff Rides"
 AUH_tb_the_inspections:0 "The Inspections"
 AUH_tb_the_offensive_regulations:0 "The Offensive Regulations"
 AUH_tb_the_defensive_regulations:0 "The Defensive Regulations"
 AUH_tb_the_deployment_studies:0 "The Deployment Studies"
 AUH_tb_the_manoeuvre_season:0 "The Manoeuvre Season"
 AUH_tb_the_widened_intake:0 "The Widened Intake"
 AUH_tb_the_works_of_the_passes:0 "The Works of the Passes"
 AUH_tb_the_armoured_works:0 "The Armoured Works"
 AUH_tb_the_works_of_the_save:0 "The Works of the Save"
 AUH_tb_the_reserve_classes:0 "The Reserve Classes"
 AUH_tb_the_regimental_languages:0 "The Regimental Languages"
 AUH_tb_the_courses_of_the_corps:0 "The Courses of the Corps"
 AUH_tb_the_technical_academy:0 "The Technical Academy"
 AUH_tb_the_extraordinary_credit:0 "The Extraordinary Credit"
 AUH_tb_the_straight_pull_repeater:0 "The Straight-Pull Repeater"
 AUH_tb_two_guns_to_a_battalion:0 "Two Guns to a Battalion"
 AUH_tb_the_artillery_commission:0 "The Artillery Commission"
 AUH_tb_the_barrel_we_can_pour:0 "The Barrel We Can Pour"
 AUH_tb_the_nickel_steel_barrel:0 "The Nickel-Steel Barrel"
 AUH_tb_the_quick_firing_field_gun:0 "The Quick-Firing Field Gun"
 AUH_tb_the_siege_howitzers:0 "The Siege Howitzers"
 AUH_tb_the_mountain_establishment:0 "The Mountain Establishment"
 AUH_tb_the_new_establishment:0 "The New Establishment"
 AUH_arm_the_northern_frontier_left_open:0 "The northern frontier is left as it stands"
 AUH_arm_the_southern_frontier_left_open:0 "The river frontier is left as it stands"
 AUH_arm_the_alpine_frontier_left_open:0 "The passes are left as they stand"
 AUH_arm_three_establishments_tt:0 "Three establishments are carried on one budget. Nothing above the Army Bill will give us more men."
 AUH_arm_the_frozen_contingent_tt:0 "The old military law stands until a new one is laid before both parliaments."
 AUH_arm_the_inspector_of_the_army_tt:0 "The inspector of the army takes the review of all three establishments."
 AUH_arm_beck_at_the_staff_tt:0 "The chief of the General Staff may now be taken into the Crown's own military counsel."
 AUH_arm_the_chief_deepens_tt:0 "The chief we kept is confirmed in the defensive school, and the regulations are written to his hand."
 AUH_arm_the_interior_plan_tt:0 "The staff is instructed to draw a deployment for the interior of the realm."
 AUH_arm_potiorek_tt:0 "The inspector who has never asked for a war and never lost an inspection takes the staff."
 AUH_arm_conrad_two_roles_tt:0 "The Belvedere's man takes the staff, and his tactics manual becomes the school text."
 AUH_arm_brosch_tt:0 "The heir's military chancellery is opened to the common army's officers."
 AUH_arm_urbanski_tt:0 "The evidence bureau's chief is attached to the deployment section."
 AUH_arm_schemua_tt:0 "The school's best logistician is taken into the high command."
 AUH_arm_krobatin_tt:0 "The artillery inspector is placed at the head of the standing commission."
 AUH_arm_the_war_minister_tt:0 "The common War Minister takes the extraordinary credit before the Delegations."
 AUH_arm_the_sword_carries_the_memoranda_tt:0 "The chief is ours already; the vision of the sword carries what he costs."
 AUH_arm_the_sword_carries_the_plans_tt:0 "The deployments are already the sword's own business; the branch supplies only the studies."
 AUH_arm_the_sword_carries_the_train_tt:0 "The train itself is ordered on the sword's account; the branch supplies only the pieces."
 AUH_arm_the_sword_carries_the_barrier_tt:0 "The barrier is the sword's own programme; the branch pays only for the works."
 AUH_arm_the_attaches_watch_tt:0 "Every foreign attache in Europe is in the field with us, and writes home about what he sees."
 AUH_arm_two_frontiers_left_open_tt:0 "Two frontiers in three spend this decade exactly as they are."
 AUH_arm_the_bocche_batteries_stand_tt:0 "The fleet's bunkers over the bay stand; we mount the land batteries behind them and build nothing twice."
 AUH_arm_the_bosnian_approaches_tt:0 "If the occupied land is ours to garrison, the approaches are put in order with it."
 AUH_arm_the_language_of_service_tt:0 "The words of command are not ours to change. The language of service in the regiment is."
 AUH_arm_hun_reads_the_limit_tt:0 "Budapest reads the limit as a refusal and prices the next military bill accordingly."
 AUH_arm_hun_is_paid_tt:0 "Budapest has been paid, and will say so at the next Settlement."
 AUH_arm_the_bohemian_order_tt:0 "The realm's largest ordnance order goes to the Bohemian works, and the German parties of Bohemia read it as a defeat."
 AUH_arm_the_ruthenian_roads_tt:0 "The Polish contractors are paid and the eastern deputies read the new roads as roads for somebody else's garrison."
 AUH_arm_belgrade_reads_the_works_tt:0 "Belgrade reads the fortified crossings; Zagreb reads the garrisons and the pay."
 AUH_arm_the_frustration_rises_tt:0 "The chief of the General Staff has been refused again, and the staff is counting."
 AUH_arm_the_frustration_falls_tt:0 "The staff's account with this government is closed and reopened at zero."
 AUH_arm_the_hand_down_tt:0 "The superseded pieces go down to the Landwehr and Honved batteries. They are not replaced with new ones."
 AUH_arm_the_very_heavy_piece_tt:0 "The very heavy piece is ordered as a development. It will not be delivered in this government's time."
 AUH_arm_the_badge_of_the_edelweiss_tt:0 "The mountain regiments receive an establishment, a gun and a badge of their own."
 AUH_arm_the_contingent_cleared_tt:0 "The old military law is superseded, not shaved. Whatever is left of the frozen contingent goes with it."
 AUH_arm_the_bill_before_both_parliaments_tt:0 "The bill goes to both parliaments, and what it costs depends on who is carrying it."
 AUH_arm_the_counties_are_told_tt:0 "The Hungarian counties are not asked. They are informed."
 AUH_arm_the_diets_carry_it_tt:0 "The bill is carried through the strengthened diets, and the German bloc reads a Slav army bill."
 auh_dnc.600.t:0 "The Word at the Manoeuvres"
 auh_dnc.600.d:0 "The coalition has asked for the words of command in its own tongue, and the whole field is waiting for the answer. The staff has drafted three. One holds the line at the language of service and gives nothing further. One holds the same line and follows it with a rescript soft enough to be read as a promise. One concedes the language of service as the coalition asks it, and the Crown has been told what the Czechs and the Croats will ask the next morning."
 auh_dnc.600.a:0 "The service language, and not a word more."
 auh_dnc.600.b:0 "Send the conciliatory rescript after it."
 auh_dnc.600.c:0 "Concede the language of service as the coalition asks it."
 auh_dnc.601.t:0 "A Parliament Fells a Minister"
 auh_dnc.601.d:0 "A national parliament has brought down a common minister over a military bill, and it will do it again. We may take the resignation and put a quartermaster in his place, or keep him and carry the credit over the chamber's head. The second road exists only in one half of the realm: the other has no article of emergency and no intention of writing one."
 auh_dnc.601.a:0 "Accept the resignation and name his successor."
 auh_dnc.601.b:0 "Keep him, and carry the credit by ordinance."
 auh_dnc.602.t:0 "The Plan in the Drawer"
 auh_dnc.602.d:0 "The staff has delivered the deployment for the interior: corps, railways, timetables, and the counties named in order. It is a complete piece of work and it has never been meant for use. We may seal it and say nothing, or rehearse a part of it at the autumn manoeuvres and let the counties draw their own conclusions."
 auh_dnc.602.a:0 "File it, and tell no one."
 auh_dnc.602.b:0 "Rehearse it at the autumn manoeuvres."
 auh_dnc.603.t:0 "The Chief Asks for His War"
 auh_dnc.603.d:0 "The chief of the General Staff has submitted the paper again. The moment is favourable, the army is ready, the southern kingdom is not, and every year we wait the arithmetic gets worse. The Foreign Ministry says the opposite in the same number of pages, and the heir has read both."
 auh_dnc.603.a:0 "We negotiate. Tell him the answer is no."
 auh_dnc.603.b:0 "Let him have it."
 auh_dnc.604.t:0 "The Chief and the Heir"
 auh_dnc.604.d:0 "The chief has been refused in public twice and is now writing to the Belvedere instead of to us. The heir will not have a chief who campaigns against his own government, and the chief will not have a government that will not fight. One of the two has to go, and only one of them can be dismissed."
 auh_dnc.604.a:0 "Replace the chief."
 auh_dnc.604.b:0 "Keep him, and take the next war he offers."
 auh_dnc.605.t:0 "The Works Run Over"
 auh_dnc.605.d:0 "The rock is not what the survey said it was. The contractors want a supplementary credit that nobody voted and the responsible minister has offered his resignation in advance. We may pay again and finish the works, or stop where they stand and let the frontier commission explain the line of surveyed pits."
 auh_dnc.605.a:0 "Vote the supplementary credit."
 auh_dnc.605.b:0 "Leave them as they stand."
 auh_dnc.606.t:0 "The Price of the Bill"
 auh_dnc.606.d:0 "Budapest will vote the military law and has named its price. It will take the share of common expenditure, or the next governor of the common bank, or the language of service in its own regiments. It will take exactly one of them and it will ask for the other two at the next renewal of the Settlement."
 auh_dnc.606.a:0 "The share of the common expenditure."
 auh_dnc.606.b:0 "The bank."
 auh_dnc.606.c:0 "The language."
 AUH_arm_the_minister_goes_tt:0 "The sitting common War Minister leaves the Ring, and his room is given to his successor."
 AUH_arm_the_minister_carries_it_tt:0 "The minister who costed the works carries them out of the ministry with him. His room stands empty."
 AUH_arm_auffenberg_tt:0 "The commission takes the artillerist who has spent his service arguing about barrels, and gives him the file."
 AUH_arm_the_concession_already_stands_tt:0 "The regiments already answer in their own tongue. There is nothing left here to concede."
 AUH_bp_credit_tt:0 "Every bargain the house closes abroad is entered in the credit of the Ballhausplatz."
 AUH_bp_two_new_peoples_tt:0 "The consular registers now count the Slovenes of the Littoral and the Italians of the coast among the peoples of the realm."
 AUH_bp_root_support_tt:0 "Vienna is content that the ministry is common. Budapest counts one more affair it does not control."
 AUH_bp_the_cipher_room:0 "The Cipher Room"
 AUH_bp_the_black_cabinet:0 "The Reading of the Post"
 AUH_bp_goluchowski_tt:0 "The Galician count who has held the house for a decade is confirmed in it, and the standing instruction to the embassies is renewed unchanged."
 AUH_bp_a_pole_at_the_ballhausplatz_tt:0 "The Polish Club reads the appointment as its own: the first affair of the realm is held by one of theirs."
 AUH_bp_budapest_wants_the_office_tt:0 "Budapest answers that a common minister who is not Hungarian is a minister the kingdom did not appoint."
 AUH_bp_the_consular_reports:0 "The Consular Reports"
 AUH_bp_the_landing_party_tt:0 "A naval landing company of the realm marches with the columns of five other powers, and the newspapers of Vienna print the roll."
 AUH_bp_the_landing_company:0 "The Landing Company"
 AUH_bp_the_coast_reads_the_treaty_tt:0 "The Italian deputies of the coast are told their kingdom has signed with us, and for a season they behave as if it mattered."
 AUH_bp_the_slovenes_read_the_treaty_tt:0 "The Slovene clubs of the Littoral hear only that Rome has been paid in their coin."
 AUH_bp_the_third_partner_tt:0 "The cipher room is instructed to read everything our third partner sends to a fourth capital."
 AUH_bp_the_alpine_staff_talks:0 "The Staff Talks of the Alliance"
 AUH_bp_the_neoslavs_approve_tt:0 "The Czech and Slovene clubs read an understanding with Petersburg as proof that the realm can be Slav abroad as well as at home."
 AUH_bp_the_tsar_is_the_enemy_tt:0 "Budapest remembers the Cossacks who put down its revolution; the Polish Club remembers everything else."
 AUH_bp_the_civil_agents:0 "The Civil Agents"
 AUH_bp_the_kingdoms_levant_line_tt:0 "The kingdom's own Levant company is chartered under its own law and sails from its own port."
 AUH_bp_the_merchants_of_the_coast_tt:0 "The Italian merchant houses of the imperial port take the freight and, for the moment, take the flag with it."
 AUH_bp_credit_up_tt:0 "The credit of the house rises by one."
 AUH_bp_the_oriental_academy:0 "The Oriental Academy"
 AUH_bp_the_levant_lines:0 "The Lines of the Levant"
 AUH_bp_the_neighbouring_concession_tt:0 "The concession next to ours flies the tricolour, and our Italian subjects are asked which council they would rather sit on."
 AUH_bp_a_harbour_of_our_own_tt:0 "Vienna is told the realm holds ground on a river nine thousand miles away, and Vienna is pleased."
 AUH_bp_the_long_passage:0 "The Long Passage"
 AUH_bp_the_station_guard:0 "The Guard of the Station"
 AUH_bp_the_window_is_open_tt:0 "Petersburg is fighting and cannot answer a note in the Balkans. The window is open, and it will not stay open."
 AUH_bp_the_window_is_shut_tt:0 "Petersburg is at peace and will read every note twice. The free hand is a paper right and nothing more."
 AUH_bp_the_free_hand_is_read_tt:0 "The clause about the Adriatic partner is not published, and within a season every irredentist club has read it."
 AUH_bp_the_southern_files:0 "The Files for the South"
 AUH_bp_the_slavs_of_the_south_watch_tt:0 "The Slav clubs of the realm are told that our officers are protecting Slav villages, and for once they believe it."
 AUH_bp_belgrade_reads_the_districts_tt:0 "Belgrade reads the new district boundaries and finds its own claims drawn out of them."
 AUH_bp_the_mountain_patrols:0 "The Patrols in the Mountains"
 AUH_bp_the_district_maps:0 "The Maps of the Districts"
 AUH_bp_the_provinces_pay_for_the_survey_tt:0 "The occupied provinces are drawn one notch closer to the common administration, because the survey has to be paid for out of somebody's budget."
 AUH_bp_the_lodge_is_dead_tt:0 "The understanding of the hunting lodge is dead the day the concession is announced, and both chancelleries know it before the newspapers do."
 AUH_bp_the_exporters_cheer_tt:0 "The exporters of both halves are promised the Aegean, and the Serb notables of the south are promised nothing."
 AUH_bp_credit_up2_tt:0 "The credit of the house rises by one."
 AUH_bp_no_land_in_the_strip_tt:0 "No yard of the strip is claimed, garrisoned as our own or promised to anyone: the concession is a survey and a right of way."
 AUH_bp_the_mountain_survey:0 "The Survey in the Mountains"
 AUH_bp_the_narrow_gauge:0 "The Narrow Gauge"
 AUH_bp_goluchowski_stays_tt:0 "The resignation is refused, the standing instruction is renewed, and the house on the square keeps the man who wrote it."
 AUH_bp_standing_still_pleases_the_slavs_tt:0 "The Slav clubs are content: a realm that takes nothing in the south is a realm that is not fighting their cousins."
 AUH_bp_budapest_wants_movement_tt:0 "Budapest asks what the common ministry is for, if it is for nothing."
 AUH_bp_the_archives_of_the_house:0 "The Archives of the House"
 AUH_bp_aehrenthal_tt:0 "The ambassador recalled from the Tsar's court takes the common foreign ministry, and the standing instruction to the embassies is torn up on his first morning."
 AUH_bp_berchtold_at_petersburg_tt:0 "A Moravian magnate goes out to the Tsar's court in his place, and takes his country house with him into the business of the realm."
 AUH_bp_budapest_likes_movement_tt:0 "Budapest approves of a common ministry that finally intends to do something, and reserves the right to send the bill back."
 AUH_bp_the_neoslavs_are_dismayed_tt:0 "The Czech and Slovene clubs understand at once that an active policy in the south is a policy against Slavs."
 AUH_bp_the_files_on_the_south:0 "The Files on the South"
 AUH_bp_the_agrarians_are_paid_tt:0 "The agrarian leagues of the plain are paid in a closed market, and they will remember it at the next vote on the common estimate."
 AUH_bp_the_south_slavs_read_the_order_tt:0 "The Serb and Croat notables of the realm read a health regulation and see a blockade."
 AUH_bp_the_trade_goes_west_tt:0 "Their cattle find a road to the west, their loan finds a bank in Paris and their next order for guns finds a French works."
 AUH_bp_the_veterinary_service:0 "The Veterinary Service"
 AUH_bp_the_south_slavs_are_answered_tt:0 "The Serb and Croat notables of the realm are shown a treaty instead of a customs wall, and the coalition of the south loses its best argument."
 AUH_bp_the_agrarians_are_told_no_tt:0 "The agrarian leagues of the plain are told that a neighbour's goodwill outranks their livestock prices, and they answer at the next division."
 AUH_bp_the_orders_stay_with_our_works:0 "The Orders Stay With Our Works"
 AUH_bp_izvolsky_tt:0 "The Russian minister comes to a Moravian country house at our ambassador's invitation, and leaves it convinced he has been promised the Straits."
 AUH_bp_the_honest_meeting_tt:0 "The old minister brings a clerk, the clerk writes everything down, and both governments sign the record before dinner."
 AUH_bp_no_minutes_tt:0 "No clerk, no record, and two ministers who will each remember a different afternoon."
 AUH_bp_credit_up3_tt:0 "The credit of the house rises by one."
 AUH_bp_the_question_of_the_straits:0 "The Question of the Straits"
 AUH_bp_the_provinces_are_ours_tt:0 "The condominium is abolished by rescript and the four provincial districts pass to the common finance ministry."
 AUH_bp_no_cores_tt:0 "The inhabitants receive a provincial belonging of their own and remain foreign in both halves of the realm: the districts are held, never incorporated."
 AUH_bp_somebody_to_sign_with_tt:0 "The confessional autonomies were granted first, so there are notables in the provinces with authority to sign the rescript's receipt."
 AUH_bp_nobody_to_sign_with_tt:0 "There is no body in the provinces entitled to accept anything, so the rescript is delivered to nobody and read by everybody."
 AUH_bp_the_serbs_of_the_realm_tt:0 "Every Serb reading room in the realm is now a national committee, and the police report says so in the first week."
 AUH_bp_both_capitals_cheer_tt:0 "Both capitals cheer a rescript neither parliament was shown."
 AUH_bp_the_minutes_help_tt:0 "The record signed at the country house is produced, and the crisis is halved before it begins."
 AUH_bp_the_crisis_is_entire_tt:0 "There is nothing to produce, and every capital in Europe is free to say it was deceived."
 AUH_bp_the_bosniaken:0 "The Regiments of the Provinces"
 AUH_bp_ferdinand_tt:0 "The prince at Sofia is told the day and the hour, and asks in return only that he be allowed to go first."
 AUH_bp_bulow_tt:0 "Berlin is asked whether it will stand behind the rescript, and the German chancellor answers that he will put the question at Petersburg himself."
 AUH_bp_the_blame_is_shared_tt:0 "Half the indignation of Europe is spent on a Balkan prince, and the realm reads its own newspapers with relief."
 AUH_bp_the_two_announcements:0 "The Two Announcements"
 AUH_bp_the_consul_at_scutari_tt:0 "A consul who speaks the mountain dialects is installed on the northern coast, with a school fund and no garrison whatever."
 AUH_bp_no_albanian_state_tt:0 "There is no state on that coast to befriend, so the subsidy goes to the clans, the seminaries and the consular schools instead."
 AUH_bp_rome_answers_on_the_coast_tt:0 "Rome answers with schools of its own on the same coast, and our Italian subjects are asked to choose a flag again."
 AUH_bp_the_catholic_south_tt:0 "The Croat clergy read a Catholic protectorate on the Adriatic as their own errand, and say so from the pulpit."
 AUH_bp_credit_up4_tt:0 "The credit of the house rises by one."
 AUH_bp_the_mission_schools:0 "The Mission Schools"
 AUH_bp_the_credit_of_the_house:0 "The Credit of the House"
 auh_dnc.500.t:0 "The Delegations Ask What Was Signed"
 auh_dnc.500.d:0 "Sixty deputies from each half sit in separate rooms and send each other notes, and both rooms have arrived at the same question: what, precisely, has the common ministry undertaken in our name? The instructions left for the embassies three weeks ago. The minister observes that a foreign policy debated in two languages is a foreign policy read in every capital before it is executed."
 auh_dnc.500.a:0 "Lay a summary before them, and keep the annexes."
 auh_dnc.500.b:0 "The instructions have already left."
 AUH_bp_500a_tt:0 "The Delegations receive four pages and vote the estimate; the annexes stay in the house."
 AUH_bp_500b_tt:0 "The Delegations are informed that the question is not properly before them."
 auh_dnc.501.t:0 "The Bands in the Vilayets"
 auh_dnc.501.d:0 "The internal committee has burned three villages in our reform sector and hanged a Greek schoolmaster in a fourth, and the Sultan's troops arrived a week later to burn the rest. Our civil agent reports that the district boundaries we drew are being made true by massacre rather than by census. The two emperors' programme was written to prevent exactly this, and it has no clause that covers it."
 auh_dnc.501.a:0 "Press the Porte to draw the districts as we agreed."
 auh_dnc.501.b:0 "Our officers will pay their own informers."
 auh_dnc.501.c:0 "Shut the strip to the committees and their couriers."
 AUH_bp_the_informers:0 "The Informers of the Sector"
 AUH_bp_501a_tt:0 "The Porte is reminded in writing, twice, and moves one boundary."
 AUH_bp_501b_tt:0 "Our sector acquires a network of paid informers and a reputation the powers do not discuss."
 AUH_bp_501c_tt:0 "The mountain tracks through the strip are patrolled, and the couriers go round by another kingdom."
 auh_dnc.502.t:0 "A Major Is Shot Above Uskub"
 auh_dnc.502.d:0 "One of our officers has been shot from a ridge while inspecting a gendarmerie post, and the killers were over the frontier before the escort reached the body. The Porte offers regrets and an investigation that will find nobody. Our reform sector has now cost us four officers and the newspapers of the realm have printed the name of none of them."
 auh_dnc.502.a:0 "A coffin, and no communique."
 auh_dnc.502.b:0 "A court, an indemnity, or we withdraw."
 auh_dnc.502.c:0 "Withdraw the officers from the district."
 AUH_bp_502a_tt:0 "The body comes home by rail at night and the ministry says nothing at all."
 AUH_bp_502b_tt:0 "The Porte is handed a note with a term attached, and the term is short."
 AUH_bp_502c_tt:0 "Our majors come out of the mountains and the reform of the vilayets continues without us."
 auh_dnc.503.t:0 "What Was Said at the Country House"
 auh_dnc.503.d:0 "The Russian minister has left, and within a week he is telling three capitals that he consented to a European conference and received a promise on the Straits. Our minister's recollection is that he consented to the rescript and asked for nothing that was refused. There is no record. Whatever we do now, one of the two governments is about to be called a liar by the other."
 auh_dnc.503.a:0 "Publish our own record of the conversation."
 auh_dnc.503.b:0 "Take him at his word and say nothing."
 auh_dnc.503.c:0 "Offer him the conference he says he asked for."
 AUH_bp_503a_tt:0 "Our version is printed first, which settles nothing and ends the friendship."
 AUH_bp_503b_tt:0 "Nothing is published and nothing is denied, and the misunderstanding is left to ripen."
 AUH_bp_503c_tt:0 "A conference is offered, and the rescript will have to survive being discussed."
 auh_dnc.504.t:0 "The Porte Presents Its Bill"
 auh_dnc.504.d:0 "The Sultan's government does not dispute the rescript; it disputes the price. It asks compensation for a sovereignty it has not exercised in a generation, and it has instructed its merchants to refuse our goods until it is paid. The boycott is costing our exporters more each week than the sum demanded. The Delegations would like to know why we are paying for something we have already taken."
 auh_dnc.504.a:0 "Pay the sum and print no receipt."
 auh_dnc.504.b:0 "Refuse, and let the boycott run its course."
 auh_dnc.504.c:0 "Pay in kind: the garrisons in the strip come out."
 AUH_bp_504a_tt:0 "The sum is voted as an extraordinary credit and no figure is ever laid before either chamber."
 AUH_bp_504b_tt:0 "The boycott holds through the season and our shipping lines carry the loss."
 AUH_bp_504c_tt:0 "The strip is evacuated and the survey concession dies with the garrisons."
 auh_dnc.505.t:0 "Berlin Puts the Question at Petersburg"
 auh_dnc.505.d:0 "Our ally proposes to go to the Tsar's government himself and demand a plain yes or no on the rescript, warning that events would then take their course. He does not ask our permission; he asks whether we wish him to. If he goes and they yield, the crisis ends in a fortnight and every chancellery in Europe learns which of the two of us decides. If we answer Petersburg ourselves, we answer alone."
 auh_dnc.505.a:0 "Let him put the question."
 auh_dnc.505.b:0 "We will answer Petersburg ourselves."
 AUH_bp_505a_tt:0 "Petersburg yields within the week, the southern kingdom signs its recognition, and the realm is from that day the second signature on its ally's policy."
 AUH_bp_505b_tt:0 "The note goes out over our own signature, and the general staff is asked how many corps stand between the San and the frontier."
 auh_dnc.506.t:0 "Belgrade Answers"
 auh_dnc.506.d:0 "Their prime minister has been in Paris. A loan is being negotiated there against the security of the very livestock we refused to admit, their next artillery order is being placed with a French works, and abattoirs are going up on their side of the river to cure what we will not buy. He tells his skupstina that the frontier taught his kingdom to live without us. He is not entirely wrong, and he is entirely pleased."
 auh_dnc.506.a:0 "The frontier stays shut. Let them learn what the west pays."
 auh_dnc.506.b:0 "Reopen the frontier for the artillery order alone."
 auh_dnc.506.c:0 "Offer them the road to the sea as well."
 AUH_bp_the_order_recovered:0 "The Order Recovered"
 AUH_bp_506a_tt:0 "The loan is signed in Paris, the guns are ordered in France, and our lever on Belgrade is gone for the rest of the reign."
 AUH_bp_506b_tt:0 "The certificate is issued for one consignment and the agrarian leagues are told it was a technical matter."
 AUH_bp_506c_tt:0 "Their goods are given transit and warehouse rights to our imperial port, and their kingdom is inside our economy again."
 AUH_bp_no_subject_to_annex_tt:0 "There is no administration left in the provinces to abolish, so the four districts are simply entered in the register of the realm."
 AUH_bp_the_upper_counties_pay_tt:0 "The closed market is a triumph of the plain, and the Slovak counties of the north are congratulated on it in a language their villages do not read."
 AUH_bp_the_upper_counties_spared_tt:0 "The agrarian leagues are beaten on the treaty, and every county they do not own breathes out."
 AUH_eco_AUS_up_tt:0 "§GThe German benches of the Reichsrat count this as theirs.§!"
 AUH_eco_AUS_down_tt:0 "§RThe German benches of the Reichsrat count this against us.§!"
 AUH_eco_HUN_up_tt:0 "§GThe chamber of the Kingdom books this to our credit.§!"
 AUH_eco_HUN_down_tt:0 "§RThe chamber of the Kingdom books this against us.§!"
 AUH_eco_CZE_up_tt:0 "§GThe Bohemian clubs read the decision as a gain.§!"
 AUH_eco_CZE_down_tt:0 "§RThe Bohemian clubs read the decision as a loss.§!"
 AUH_eco_CRO_up_tt:0 "§GZagreb reads the decision as a gain.§!"
 AUH_eco_CRO_down_tt:0 "§RZagreb reads the decision as a loss.§!"
 AUH_eco_POL_up_tt:0 "§GThe Polish Club reads the decision as a gain.§!"
 AUH_eco_POL_down_tt:0 "§RThe Polish Club reads the decision as a loss.§!"
 AUH_eco_UKR_up_tt:0 "§GThe Ruthene benches read the decision as a gain.§!"
 AUH_eco_UKR_down_tt:0 "§RThe Ruthene benches read the decision as a loss.§!"
 AUH_eco_ROM_up_tt:0 "§GThe Romanian national committee reads the decision as a gain.§!"
 AUH_eco_ROM_down_tt:0 "§RThe Romanian national committee reads the decision as a loss.§!"
 AUH_eco_SLV_up_tt:0 "§GThe Slovene diets read the decision as a gain.§!"
 AUH_eco_SLV_down_tt:0 "§RThe Slovene diets read the decision as a loss.§!"
 AUH_eco_SER_up_tt:0 "§GThe Serb notables read the decision as a gain.§!"
 AUH_eco_SER_down_tt:0 "§RThe Serb notables read the decision as a loss.§!"
 AUH_eco_BOS_up_tt:0 "§GThe notables of the occupied land read the decision as a gain.§!"
 AUH_eco_SLO_up_tt:0 "§GThe northern counties read the decision as a gain.§!"
 AUH_eco_SLO_down_tt:0 "§RThe northern counties read the decision as a loss.§!"
 AUH_eco_ITA_up_tt:0 "§GThe Italian councils of the Littoral read the decision as a gain.§!"
 AUH_eco_ITA_down_tt:0 "§RThe Italian councils of the Littoral read the decision as a loss.§!"
 AUH_eco_quote_up_tt:0 "§RThe Kingdom's share of the common charge rises.§!"
 AUH_eco_quote_down_tt:0 "§GThe Kingdom's share of the common charge falls.§!"
 AUH_eco_gemein_up_tt:0 "§GWhat the two halves hold in common is worth more this morning than it was last night.§!"
 AUH_eco_gemein_down_tt:0 "§RWhat the two halves hold in common is worth less this morning than it was last night.§!"
 AUHFX_the_common_market_bonus:0 "The Common Market"
 AUHFX_the_autonomous_tariff_bonus:0 "The Autonomous Tariff"
 AUHFX_the_commercial_treaties_bonus:0 "The Commercial Treaties"
 AUHFX_the_great_mills_bonus:0 "The Great Mills"
 AUHFX_the_refineries_bonus:0 "The Refineries"
 AUHFX_the_universal_banks_bonus:0 "The Universal Banks"
 AUHFX_the_provincial_savings_bonus:0 "The Savings of the Provinces"
 AUHFX_the_capital_offensive_bonus:0 "The Loans and the Concessions"
 AUHFX_the_carpathian_field_bonus:0 "The Carpathian Field"
 AUHFX_the_new_lines_bonus:0 "The New Lines"
 AUHFX_the_tunnels_bonus:0 "The Mountain Tunnels"
 AUHFX_the_white_coal_bonus:0 "The White Coal"
 AUHFX_the_two_seaports_bonus:0 "The Two Seaports"
 AUHFX_the_river_and_the_gates_bonus:0 "The River and the Gates"
 AUHFX_the_iron_estate_bonus:0 "The Iron Estate"
 AUHFX_the_ordnance_of_the_realm_bonus:0 "The Ordnance of the Realm"
 AUHFX_the_promotion_acts_bonus:0 "The Promotion Acts"
 AUHFX_the_motor_works_bonus:0 "The Motor Works"
 AUHFX_the_works_schools_bonus:0 "The Schools Inside the Works"
 AUHFX_the_estimate_bonus:0 "The Estimate That Balances"
 AUH_eco_the_protected_market:0 "Behind the Schedule"
 AUH_eco_the_line_is_worked:0 "The Line Is Worked by the State"
 AUH_eco_the_quay_is_finished:0 "The Quay Is Finished"
 AUH_eco_the_industrial_estate:0 "On the Realm's Books"
 AUH_eco_the_two_treasuries_tt:0 "The quota counter and the counter of common feeling are opened. Everything this branch decides will move one of them."
 AUH_eco_beck_unlocked_tt:0 "§YMax Wladimir von Beck§! may be appointed to the cabinet as an economic organiser."
 AUH_eco_the_wall_tt:0 "§RThe treaty road is closed for this era. The schedule is a wall and not a bargaining table.§!"
 AUH_eco_frontier_already_shut_tt:0 "§YThe frontier is already shut by the political settlement. The ministry keeps the money and spares itself the second quarrel.§!"
 AUH_eco_the_paper_behind_the_wall_tt:0 "§RThe loans went out before the door was shut. They are now on our banks' books behind our own schedule.§!"
 AUH_eco_the_capital_road_is_shut_tt:0 "§RThe Ring's capital offensive in the southern kingdoms is closed for good.§!"
 AUH_eco_daranyi_unlocked_tt:0 "§YIgnac Daranyi§! may be appointed to the cabinet for agriculture."
 AUH_eco_the_roller_mill_tt:0 "The roller mill is built in the Kingdom's own engineering works. The patent stays here and so does the trade."
 AUH_eco_the_household_price_tt:0 "§GThe price of sugar in the realm's own kitchens falls the week the bounty is withdrawn.§!"
 AUH_eco_the_bankverein_tt:0 "§YWiener Bankverein§! may be taken into the industrial concerns of the realm."
 AUH_eco_the_curia_door_tt:0 "§RIf the franchise is made general, the curia's power goes with it and this spirit is replaced by a weaker one.§!"
 AUH_eco_two_banks_tt:0 "§RThe Kingdom already has a bank of its own. The money column of this branch runs on two banks and one coin.§!"
 AUH_eco_bilinski_unlocked_tt:0 "§YLeon von Bilinski§! may be appointed to the cabinet for the finances of the realm."
 AUH_eco_popovics_unlocked_tt:0 "§YSandor Popovics§! may be appointed to the cabinet later in the era."
 AUH_eco_creditanstalt_tt:0 "§YThe Credit-Anstalt of Vienna§! may be taken into the industrial concerns of the realm."
 AUH_eco_pesti_tt:0 "§YThe Pest Hungarian Commercial Bank§! may be taken into the industrial concerns of the realm."
 AUH_eco_lanczy_tt:0 "§YLeo Lanczy§! may be appointed to the cabinet for finance."
 AUH_eco_the_housing_lever_tt:0 "§GThe realm now owns the undertakings a rent law would have to be written against. A housing act becomes possible.§!"
 AUH_eco_the_rent_question_tt:0 "§RThe tenement question will come back, and it will keep coming back while the concession runs.§!"
 AUH_eco_the_credit_unions_tt:0 "§YThe provincial credit unions§! may be taken into the concerns of the realm. The Bohemian and Slovene roads reach the same institution by their own focuses."
 AUH_eco_the_southern_credit_tt:0 "§GThe southern kingdoms are on our books. A political settlement below the Save may now be bought instead of imposed.§!"
 AUH_eco_the_field_tt:0 "§YThe Carpathian field§! may be taken into the concerns of the realm. It will shortly produce more than the realm can move."
 AUH_eco_the_discount_tt:0 "No rate is printed in this order. The bank sets it and the ministry answers for it."
 AUH_eco_wittek_unlocked_tt:0 "§YHeinrich Ritter von Wittek§! may be taken into the high command for the railways of the realm."
 AUH_eco_wickenburg_unlocked_tt:0 "§YMaximilian von Wickenburg§! may be appointed to the cabinet for transport."
 AUH_eco_the_board_in_paris_tt:0 "§RThe foreign board keeps its coupons. Every tariff quarrel on that line is now settled abroad.§!"
 AUH_eco_the_southern_company_tt:0 "The road to the sea is settled one way or the other. It will not be reopened this era."
 AUH_eco_the_corridor_already_voted_tt:0 "§YThe corridor is already voted as a political act. This order is the engineering that follows it, and the Kingdom has already been paid off.§!"
 AUH_eco_derschatta_unlocked_tt:0 "§YJulius Derschatta von Standhalt§! may be taken into the high command for the railways."
 AUH_eco_ganz_tt:0 "§YGanz and Company§! may be taken into the concerns of the realm."
 AUH_eco_kando_tt:0 "§YKalman Kando§! may be taken on as a scientist of the realm."
 AUH_eco_no_dockyard_here_tt:0 "The commercial quay is the realm's business here. The naval harbour, the yard and the arsenal belong to the fleet's own estimates."
 AUH_eco_the_rebate_tt:0 "§YThe rebate schedule is the whole of this decision. Nothing is built that was not going to be built; the cargo simply changes quay.§!"
 AUH_eco_rebate_already_granted_tt:0 "§YThe rebate is already granted by the Kingdom's own road. Only the feeder lines are added here.§!"
 AUH_eco_licence_already_sold_tt:0 "§YThe emigration act is already on the Kingdom's statute book. Only the traffic and the dues are settled here.§!"
 AUH_eco_the_flag_is_not_ours_tt:0 "§RThe only licence granted runs under a foreign flag. Our subjects sail, and another realm's register grows.§!"
 AUH_eco_the_licence_written_off_tt:0 "§RThe licence the Kingdom sold is written off in the same session it is cancelled. Somebody in Budapest signed for it.§!"
 AUH_eco_the_canal_was_voted_tt:0 "§GThe northern waterway is already voted. The dredgers and the survey staff are transferred to the river and something is finally built with them.§!"
 AUH_eco_the_works_catch_up_tt:0 "§GThe realm's works are no longer strangers to a modern hull. The fleet's own estimates will finish what this order begins.§!"
 AUH_eco_the_iron_houses_tt:0 "§YWitkowitz§!, §YBoehler§!, §YPoldihuette§!, the §Ystate ironworks and the Banat works§! and the §YOstrava-Karvina§! collieries may be taken into the concerns of the realm."
 AUH_eco_krupp_tt:0 "§YArthur Krupp of Berndorf§! may be appointed to the cabinet as a captain of industry."
 AUH_eco_the_three_works_tt:0 "§YSkoda§!, §YSteyr§! and §YWeiss Manfred of Csepel§! take the realm's orders. Their designs belong to the army's own estimates."
 AUH_eco_hordliczka_tt:0 "§YEugen Hordliczka§! may be appointed to the cabinet as a war industrialist."
 AUH_eco_weiss_tt:0 "§YManfred Weiss§! may be appointed to the cabinet as a war industrialist."
 AUH_eco_the_magyar_share_tt:0 "§YThe Kingdom's benches carry this government, and the new works are placed where they will be seen.§!"
 AUH_eco_the_acts_do_not_stack_tt:0 "§RThe Kingdom's development acts already run. The two regimes are the two halves of one policy and they do not stack: the works are built, the spirit is not added.§!"
 AUH_eco_kossuth_tt:0 "§YFerenc Kossuth§! may be appointed to the cabinet as a captain of industry."
 AUH_eco_the_motor_houses_tt:0 "§YAustro-Daimler§!, §YLaurin and Klement§!, §YNesselsdorf§! and §YJohann Puch§! may be taken into the concerns of the realm as civil houses."
 AUH_dnc_branch_slot_tt:0 "§YThe realm endows one new chair in the era. If another ministry has already endowed it, this order buys books and a stipend instead.§!"
 AUH_eco_the_workshop_clause_tt:0 "§RThe workshop clause ruins the master artisans, and the master artisans are somebody's electorate.§!"
 AUH_eco_the_middle_tt:0 "§YNo bench gains and no bench loses. This is what the middle costs.§!"
 AUH_eco_the_statistics_office_tt:0 "The labour statistics office already sits and already counts. What this order changes is that the ministry now reads it."
 AUH_eco_the_precedent_is_on_the_books_tt:0 "§YThe railwaymen have already been called to the colours once. The precedent is on the books and nobody needs to be told twice.§!"
 AUH_eco_bohm_bawerk_tt:0 "§YEugen von Boehm-Bawerk§! joins the realm as its theorist of the estimate. He will refuse things you want."
 AUH_eco_the_wall_costs_the_sheet_tt:0 "§RThe schedule wall has kept the customs receipts down for the whole era, and the sheet shows it.§!"
 AUH_eco_the_ring_is_audited_tt:0 "§GThe ordnance ring is audited. Its price falls and its friends in both chambers are counted.§!"
 auh_dnc.700.t:0 "The Pit Stops"
 auh_dnc.700.d:0 "The northern coal basin has stopped. The demands are more pay, pay by the week and the dismissed men back at the face, and they are the same demands in three languages. The company will not sit down, the district governor wants a battalion, and the arbitration board has not been convened because nobody wants to be the man who convened it. Every furnace in the realm burns what these men dig."
 auh_dnc.700.1:0 "'Concede the weekly pay.'"
 auh_dnc.700.2:0 "'Open the pit with the gendarmerie.'"
 auh_dnc.700.3:0 "'Print the returns and let the board sit.'"
 auh_dnc.701.t:0 "The Bore Goes Through"
 auh_dnc.701.d:0 "Gas and water in the mountain heading, and men are dead. The contractor wants the schedule held and the inspectorate wants the face shored before another shift goes in. The opposition already has the casualty figures and will have them in the chamber by the end of the week. The calendar for the whole programme runs through this one heading."
 auh_dnc.701.1:0 "'Drive on.'"
 auh_dnc.701.2:0 "'Slow down and shore up.'"
 auh_dnc.702.t:0 "The Minister Does Not Survive the Estimate"
 auh_dnc.702.d:0 "The geological overruns are on the table and somebody has to answer for them. The railway minister put the programme through the chamber on figures the mountain has since refused to honour. He has offered to go. The alternative is to carry the whole programme past the chamber by ordinance and let the ministry keep its man."
 auh_dnc.702.1:0 "'Take his resignation.'"
 auh_dnc.702.2:0 "'Cover him with an ordinance.'"
 AUH_eco_one_more_ordinance_tt:0 "§ROne more thing carried over the chamber's head. The count is kept.§!"
 auh_dnc.703.t:0 "The Money of the World Turns Round"
 auh_dnc.703.d:0 "Credit is contracting in every market that matters and the bank has asked the ministry a plain question: does it defend the coin or the works? Holding the exchange means a hard discount for as long as it takes, and the first men to feel it are the ones who borrowed to sow. Letting it go means the works keep turning and every contract we have abroad is repriced against us. Departures for America will collapse either way and nobody in this room will say so aloud."
 auh_dnc.703.1:0 "'Raise the discount and hold the coin.'"
 auh_dnc.703.2:0 "'Let the exchange go and keep the works turning.'"
 auh_dnc.704.t:0 "The Field Runs Over"
 auh_dnc.704.d:0 "The eastern field is producing more than the refineries, the tank wagons and the market can take together, and the price is going through the floor. The small drillers are ruined at this price and a foreign house with a deep pocket is buying their leases as they fail. The state railways and the fleet burn oil and could burn a great deal more of it. Somebody is going to own this field by the end of the year."
 auh_dnc.704.1:0 "'The realm buys the surplus for its railways and its fleet.'"
 auh_dnc.704.2:0 "'Let the price fall; the strong wells will survive.'"
 auh_dnc.705.t:0 "The Best Gun Is Not Ours"
 auh_dnc.705.d:0 "A neighbouring kingdom has ordered its field artillery from a foreign house instead of ours, on a foreign loan secured against its own livestock. The battery it is buying is better than the one our ring would have sold it, and cheaper. The tender question is open again in both chambers and the three works have already sent their deputies to explain why it should not be."
 auh_dnc.705.1:0 "'Keep the ring closed; the works are ours and so is the money.'"
 auh_dnc.705.2:0 "'Open the tender to foreign houses.'"
 auh_dnc.705.3:0 "'Offer the kingdom our credit and take the order back.'"
 AUH_eco_the_guns_stay_dear_tt:0 "§RThe ring is untouched and the batteries stay dearer than anyone else's.§!"
 auh_dnc.706.t:0 "The Refineries Ask for the Bounty Back"
 auh_dnc.706.d:0 "The refiners' association has come to the ministry with its books open and its deputies behind it. Without the bounty, they say, the foreign market closes and the beet counties go back to rye. Their books also show what the household has been paying to make the foreign sale possible, and the ministry has read that page too. There is a third road, which is to break the syndicate outright and let the refineries find out what they are worth."
 auh_dnc.706.1:0 "'The abolition stands.'"
 auh_dnc.706.2:0 "'Restore the bounty and protect the cartel.'"
 auh_dnc.706.3:0 "'Break the cartels outright.'"
 auh_dnc.707.t:0 "The Quay Stops"
 auh_dnc.707.d:0 "The stokers of the subsidised line have stopped, and the gasworks, the butchers, the bakers and the trams have stopped with them. The garrison is drawn up at the governor's palace and the crowd is coming up from the sea front. The arbitration board can sit this evening if it is called this afternoon. The port that the fleet and half the realm's export trade depend on is standing still while we decide which order to give first."
 auh_dnc.707.1:0 "'Let the arbitration board sit first.'"
 auh_dnc.707.2:0 "'Clear the square.'"
 auh_dnc.707.3:0 "'Concede the watch of ten hours.'"
 AUH_eco_the_square_remembers_tt:0 "§RThe port the fleet depends on has a martyrology now, and it is a short walk from the arsenal.§!"
 auh_dnc.708.t:0 "The Rent and the House-Owners"
 auh_dnc.708.d:0 "The town has grown faster than its tenements. The sub-tenants sleep in shifts, the mortality in the new districts is on the statistician's desk and in nobody's speech, and the house-owners' association will not hear of a rent law. The concession we signed took the one instrument a municipality could have used out of its hands. The socialists are holding meetings about it and they are filling halls."
 auh_dnc.708.1:0 "'A rent law and municipal dwellings.'"
 auh_dnc.708.2:0 "'Nothing: the concession is signed and the rents are not our business.'"
 auh_dnc.708.3:0 "'Buy the wire back at the concessionaire's price.'"
 AUHFX_the_chambers_of_commerce_bonus:0 "The Chambers of Commerce"
 AUHFX_the_state_railways_bonus:0 "The State Railway Administration"
 AUHFX_the_southern_company_bonus:0 "The Road to the Sea"
 AUH_eco_the_quays_are_open_tt:0 "§GThe consulates obtain berthing for our bottoms in the ports of the Levant and of the British trade.§!"
 AUH_eco_the_river_is_open_tt:0 "§GThe lower riparian state opens its reaches and its winter harbours to our barges.§!"
 auh_dnc.709.t:0 "The Curia Is Watched"
 auh_dnc.709.d:0 "The ministry keeps a standing note on the commercial benches and on what a general franchise would do to them."
 auh_dnc.709.a:0 "Keep the note open."
 auh_dnc.710.t:0 "The Curia Falls"
 auh_dnc.710.d:0 "The general franchise is law and the commercial curia is not in it. The chambers keep their registers, their arbitrations and their commercial courts, and they have lost the bench that voted our budgets without being asked twice. Their president writes that the trade of the realm will now be represented by whoever the towns happen to elect, and that he expects the ministry to notice the difference within the year. He is right, and there is nothing in the constitution to be done about it."
 auh_dnc.710.a:0 "'Let them be a trade body and nothing more.'"
 auh_dnc.710.b:0 "'Give them a nominated bench upstairs.'"
 AUH_eco_the_curia_is_gone_tt:0 "§RThe commercial curia is dissolved. The chambers survive as a trade body only.§!"
