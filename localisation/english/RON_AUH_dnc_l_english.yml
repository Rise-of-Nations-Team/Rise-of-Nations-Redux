 AUH_tb_the_barrage_that_closes_it:0 "The Barrage That Closes It"
 AUH_tb_a_big_hull_of_our_own:0 "A Big Hull of Our Own"
 AUH_tb_the_lecture_and_the_model:0 "The Lecture and the Model"
 AUH_tb_a_fleet_on_paper:0 "A Fleet on Paper"
 AUH_tb_six_boats_to_be_ordered:0 "Six Boats to Be Ordered"
 AUH_tb_the_second_squadron:0 "The Second Squadron"
 AUH_tb_plate_and_ordnance:0 "Plate and Ordnance"
 AUH_tb_a_squadron_in_the_water:0 "A Squadron in the Water"
 AUH_tb_all_big_guns:0 "All Big Guns"
 AUH_tb_the_first_true_hull:0 "The First True Hull"
 AUH_tb_the_section_writes_the_doctrine:0 "The Section Writes the Doctrine"
 AUH_tb_ships_before_votes:0 "Ships Before Votes"
 AUH_tb_the_floating_dock:0 "The Floating Dock"
 AUH_tb_the_guns_of_the_bocche:0 "The Guns of the Bocche"
 AUH_tb_six_boats_three_designs:0 "Six Boats, Three Designs"
 AUH_tb_the_account_of_the_fleet:0 "The Account of the Fleet"
 AUH_tb_the_boat_that_hides:0 "The Boat That Hides"
 AUH_nav_the_common_fleet:0 "The Common Fleet"
 AUH_nav_the_common_fleet_desc:0 "The fleet is the one common institution that must be voted twice a year, in two capitals, by men who disagree about whether it should exist at all. It gets its estimates late, in instalments, and never in full."
 AUH_nav_the_school_of_the_narrow_sea:0 "The School of the Narrow Sea"
 AUH_nav_the_school_of_the_narrow_sea_desc:0 "Torpedo craft, mines and shore batteries, bought out of the ordinary estimates and defended by everyone who wants the money elsewhere: the Kingdom's Delegation, the land army, the strategic railways of the north-east. A cheap navy that cannot leave its gulf."
 AUH_nav_the_school_of_the_open_sea:0 "The School of the Open Sea"
 AUH_nav_the_school_of_the_open_sea_desc:0 "The fleet is built to leave the Adriatic and the money is found afterwards, tranche by tranche, from two Delegations that were not consulted. The army's best cadets go to sea and the Kingdom begins to count what it is paying for a coast it does not have."
 AUH_nav_the_subsidised_lines:0 "The Subsidised Lines"
 AUH_nav_the_subsidised_lines_desc:0 "The mail contracts and the route subsidies keep a merchant marine we did not have to build, and its hulls are ours the day we ask. The subsidy sits on the budget every year, and the Littoral's ports quarrel about who deserves it."
 AUH_nav_the_flag_on_the_river:0 "The Flag on the River"
 AUH_nav_the_flag_on_the_river_desc:0 "A concession on a foreign river, a consul, a marine detachment at the legation and one cruiser that never comes home. It buys us a seat among the powers that have such things and costs us the only modern ship we could spare."
 AUH_nav_the_naval_academy:0 "The Academy and the Institute"
 AUH_nav_the_naval_academy_desc:0 "Charts, tides and sailing directions printed at the naval port; officers trained at the Kingdom's port. The fleet no longer buys either from abroad. The regiments lose the best cadets in the realm and say so every year in the estimates."
 AUH_nav_the_flotilla_estimates:0 "The Flotilla Estimates"
 AUH_nav_the_flotilla_estimates_desc:0 "Twenty boats at once eat the whole naval vote while they are building. Nothing larger than a destroyer will get a slip until they are delivered."
 AUH_nav_the_torpedo_and_the_barrage:0 "The Torpedo and the Barrage"
 AUH_nav_the_torpedo_and_the_barrage_desc:0 "The two weapons a poor navy can afford, made at home and improved at home. The works also sells to everybody who asks, including the only serious navy in this sea, and everybody knows it."
 AUH_nav_a_fleet_that_stays_at_home:0 "A Fleet That Stays at Home"
 AUH_nav_a_fleet_that_stays_at_home_desc:0 "Written into the estimates and into both chambers' journals: this navy defends the coast and nothing else. No capital hull will be laid down while it stands, because one would cost five times what it is worth. Nobody across the sea is frightened of us any more."
 AUH_nav_four_years_and_a_half:0 "Four Years and a Half"
 AUH_nav_four_years_and_a_half_desc:0 "The honest rate of the state yard, keel to commissioning, written into every estimate that follows. The yard learns its trade on the realm's money and at the realm's pace."
 AUH_nav_the_fleet_association:0 "A League for the Fleet"
 AUH_nav_the_fleet_association_desc:0 "Lectures, model ships, a monthly magazine and members in both parliaments, so that the estimates arrive half voted. The society also asks for one more ship every single year, in public, whether or not there is money for it."
 AUH_nav_the_programme_nobody_voted:0 "The Programme Nobody Voted"
 AUH_nav_the_programme_nobody_voted_desc:0 "A whole fleet printed in one document and voted in none: ships of the line, cruisers, scouts, destroyers, torpedo craft and six boats that go under. Every tranche of it must be torn out of two Delegations, one of which has no coast to defend."
 AUH_nav_the_second_squadron:0 "The Second Squadron"
 AUH_nav_the_second_squadron_desc:0 "Three more ships of the line on the ordinary estimates, with plate from Moravia and guns from Bohemia. Good ships, ordered against a standard that is about to be abolished."
 AUH_nav_the_last_ordinary_squadron:0 "The Last Ordinary Squadron"
 AUH_nav_the_last_ordinary_squadron_desc:0 "The last series this realm will finance out of the ordinary budget: three heavy hulls with the heaviest secondary battery afloat, laid down without asking anybody for a new credit. The design office is tied up building yesterday's ship."
 AUH_nav_the_empty_slips:0 "The Empty Slips"
 AUH_nav_the_empty_slips_desc:0 "The technical committee works and the slips do not. Nothing is being built, the yards are idle, and the Delegations are asked to keep paying for a fleet that is visibly not appearing."
 AUH_nav_the_marine_section:0 "The Marine Section"
 AUH_nav_the_marine_section_desc:0 "The fleet drafts its own estimates and writes its own doctrine, in its own section of the common war ministry, and the man who commands at sea signs both. The general staff loses an argument it will keep making, and the best officers."
 AUH_nav_the_credit_of_the_delegations:0 "The Credit of the Delegations"
 AUH_nav_the_credit_of_the_delegations_desc:0 "Every keel in this realm is a bargain struck twice in the same session with two bodies that answer to different parliaments. When the Kingdom's loyalty falls, the yards feel it before anybody else does."
 AUH_nav_the_share_of_the_orders:0 "The Share of the Orders"
 AUH_nav_the_share_of_the_orders_desc:0 "A guaranteed share of every naval order goes to the Kingdom's own yard, with the plate and the guns shared out to match. The yard has to be built before it can build, and the Cisleithanian firms are told exactly what they have lost."
 AUH_nav_the_loan_nobody_voted:0 "The Loan Nobody Voted"
 AUH_nav_the_loan_nobody_voted_desc:0 "The whole programme raised at once as a special loan on the Crown's own responsibility, placed with the banks of both capitals. The ships appear. So does the debt service, and so does the constitutional question, which nobody can now avoid."
 AUH_nav_the_naval_port:0 "The Naval Port"
 AUH_nav_the_naval_port_desc:0 "Slips, cranes, a floating dock and a torpedo depot under the Marine Section: the fleet refits itself and waits behind nobody. The town around it is run as a closed military port and its citizens are counted as a garrison population."
 AUH_nav_the_submarine_station:0 "The Submarine Station"
 AUH_nav_the_submarine_station_desc:0 "Six boats of three designs, a basin of their own and crews taken permanently out of the torpedo flotillas. Two of the three designs were paid for in full and will never be built again."
 AUH_nav_a_sea_we_can_close:0 "A Sea We Can Close"
 AUH_nav_a_sea_we_can_close_desc:0 "Batteries on every headland, barrages across every channel, boats in every bay: nobody enters this sea and nothing of ours leaves it. The Kingdom is delighted to keep paying for it, and it will still be true when the era ends."
 AUH_nav_the_adriatic_is_ours:0 "The Adriatic Is Ours"
 AUH_nav_the_adriatic_is_ours_desc:0 "A battle fleet in a sea with one other battle fleet in it, and that fleet belongs to our formal ally. Everyone on the far shore now plans against us, and the alliance is worth a little less every year we keep building."
 AUH_nav_the_ships_of_yesterday:0 "The Ships of Yesterday"
 AUH_nav_the_ships_of_yesterday_desc:0 "Every heavy hull we own, and every heavy hull we have ordered, was designed against a standard that no longer exists. The crews know it, the Delegations know it, and the estimates still have to be voted."
 AUH_nav_the_new_yard_at_fiume:0 "The New Yard at the Kingdom's Port"
 AUH_nav_the_new_yard_at_fiume_desc:0 "The yard that was bought with the Kingdom's vote has to be built before it can build. Every order placed there in the meantime is delivered late."
 AUH_nav_the_losing_designs:0 "The Losing Designs"
 AUH_nav_the_losing_designs_desc:0 "Four of the six boats are from designs we will never build again, and all six were paid for at the contract price."
 AUH_nav_the_design_office_is_busy:0 "The Design Office Is Busy"
 AUH_nav_the_design_office_is_busy_desc:0 "Every draughtsman in the technical committee is working on hulls that are already out of date. Nothing else is being drawn."
 AUH_nav_the_slips_are_empty:0 "The Slips Are Empty"
 AUH_nav_the_slips_are_empty_desc:0 "We are waiting on purpose. The yards are idle, the fitters are being paid off, and nothing at all is coming down the ways."
 AUH_nav_the_contingent_gets_the_credit:0 "The Contingent Gets the Credit"
 AUH_nav_the_contingent_gets_the_credit_desc:0 "The money the fleet will not spend is voted to the recruit contingent instead, and the general staff has it in writing. The coast keeps its batteries and loses its ambitions."
 AUH_nav_the_tranche_deferred:0 "The Tranche Deferred"
 AUH_nav_the_tranche_deferred_desc:0 "The instalment was not voted this session. The yard has the plate, the slip and the men, and no order to put them together."
 AUH_nav_the_estimates_carried:0 "The Estimates Carried"
 AUH_nav_the_estimates_carried_desc:0 "The credit went through before anybody could organise against it. The yards start at once and the chambers will have their revenge in another session."
 AUH_nav_the_yard_learns:0 "The Yard Learns Its Trade"
 AUH_nav_the_yard_learns_desc:0 "Our own yard is doing something it has never done before, at our expense and at its own pace. The work is late and the lesson is permanent."
 auh_dnc.650.t:0 "The Memorandum in the Roman Press"
 auh_dnc.650.d:0 "A newspaper on the far shore has printed our naval memorandum entire, with the tonnages, the yards and the dates of delivery. Their ministry of marine has asked, politely, whether it is authentic. Our own Delegations are reading it in translation this morning, before either of them was shown a copy. We can deny it, print it ourselves, or cut it back to what has actually been voted."
 auh_dnc.650.a:0 "Deny it and print nothing."
 auh_dnc.650.b:0 "Publish the programme ourselves, so that both parliaments read it first."
 auh_dnc.650.c:0 "Cut the programme back to what has already been voted."
 auh_dnc.651.t:0 "The Delegation Will Not Sit"
 auh_dnc.651.d:0 "The Hungarian Delegation has adjourned itself rather than take the naval tranche, and the Austrian one will not vote alone. The Marine Section has a keel booked at a yard that has already ordered its plate. We can buy the vote with orders, carry the estimate by the Crown's own prerogative, or strike the ship out and tell the yard why."
 auh_dnc.651.a:0 "Pay for it in hulls: a share of the order goes to the Kingdom's yard."
 auh_dnc.651.b:0 "Carry the estimate by the Crown's prerogative and let them protest."
 auh_dnc.651.c:0 "Strike the ship from the estimates and tell the yard why."
 auh_dnc.652.t:0 "Four Years and a Half"
 auh_dnc.652.d:0 "The state yard has reported on the armoured cruiser. Keel to commissioning will be four years and a half, and the yard says plainly that it cannot be done faster with the plant it has. Foreign yards quote us three. The Delegations will be shown this figure whatever we decide, and every estimate we draft afterwards will be judged against it."
 auh_dnc.652.a:0 "Pay the yard its premium and buy the plant it says it needs."
 auh_dnc.652.b:0 "Accept the rate and write it into the estimates as it stands."
 auh_dnc.652.c:0 "Order the next hull from a foreign yard and let ours read about it."
 auh_dnc.653.t:0 "The Boats Come Out of the Basin"
 auh_dnc.653.d:0 "The six boats have finished their comparative trial in our own water and the committee has reported. The single-hull design dives and steers best; the boats from the northern yard are longer and better armed; the pair built at the Kingdom's torpedo works are the cheapest and can be repeated tomorrow. We build one of the three and pay off the other two designers."
 auh_dnc.653.a:0 "The single-hull boats: they dive best and their designer stays on our payroll."
 auh_dnc.653.b:0 "The boats from the northern yard: longest, best armed, and not ours."
 auh_dnc.653.c:0 "The boats built at the torpedo works: ours, cheap, and repeatable."
 auh_dnc.654.t:0 "The Ship on the Other Side of the World"
 auh_dnc.654.d:0 "The cruiser on the eastern station is due for relief and there is nothing modern to relieve her with. The legation wants her kept; the Marine Section wants her home, where she is a quarter of our effective strength. The consul points out that the concession without a warship in the river is a street with our name on it and nothing else."
 auh_dnc.654.a:0 "She stays. The station is worth a cruiser."
 auh_dnc.654.b:0 "She comes home; a gunboat and the marines keep the flag flying."
 auh_dnc.654.c:0 "The consular service takes the station over and the marines stay at the legation."
 auh_dnc.655.t:0 "The Ship That Made Every Other Ship Old"
 auh_dnc.655.d:0 "A foreign yard has commissioned a ship of the line carrying nothing but heavy guns, turbine driven, faster than anything of her size afloat. Every other battleship in every other navy is now the wrong kind of ship, including ours, including the ones still on the slips."
 auh_dnc.655.a:0 "Read the naval attache's report."
 auh_dnc.656.t:0 "Every Heavy Hull We Own"
 auh_dnc.656.d:0 "The attache's report is on the table and the Marine Section has done the arithmetic. Three ships in commission, three more on the slips, and a whole squadron ordered against a standard that no longer exists. The Delegations will still be asked to vote the instalments. The only question left is what we tell them."
 auh_dnc.656.a:0 "Tell them the truth: the squadron we are paying for is already old."
 auh_dnc.656.b:0 "Tell them nothing and keep the instalments coming."
 auh_dnc.657.t:0 "The Estimates Are Recounted"
 auh_dnc.657.d:0 "The Marine Section reads the Kingdom's temper and adjusts what it expects from the yards."
 auh_dnc.657.a:0 "Very well."
 AUH_nav_tt_avail_new_commander:0 "The office at the head of the fleet has not yet changed hands; the programme waits on the man who will sign it."
 AUH_nav_tt_avail_no_cap:0 "No promise has been given to the clubs, and no vision has frozen the fleet at its present format."
 AUH_nav_tt_avail_all_big_gun:0 "A ship carrying nothing but heavy guns has been launched abroad, and every design office in Europe knows it."
 AUH_nav_tt_avail_not_capped:0 "The Slav clubs have not been promised that this capital-ship race would never be entered."
 AUH_nav_tt_ordinance_count_up:0 "One more estimate carried over a Delegation instead of through it, and the tally of them is kept."
 AUH_nav_tt_station_gunboat:0 "The cruiser sails for home and a gunboat takes her billet: the flag stays, the strength comes back."
 AUH_nav_tt_station_consular:0 "The consul administers the ground and the marines keep the legation; the fleet withdraws from both."
 AUH_nav_tt_foreign_designers:0 "Three designers not our own are paid to build against one another in our own water."
 AUH_nav_tt_lake_retained:0 "The foreign engineer whose boats won stays on the payroll while the trial lasts, at his own price."
