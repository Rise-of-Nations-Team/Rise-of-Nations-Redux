 AUH_h_cosmetic_union_tt:0 "The two kingdoms take their own styles, their own colours and their own army lists."
 AUH_h_ev300_a_tt:0 "A common minister has fallen to a national parliament, and everyone has noticed."
 AUH_h_ev300_b_tt:0 "The bills sit on the table while the minister and the Chamber argue."
 auh_dnc.300.t:0 "The Common War Minister Resigns"
 auh_dnc.300.d:0 "The minister for war has read the language clause in the military bills and has asked to be relieved. He will not put his name to a statute that concedes the tongue of a regiment to a national parliament, and he says as much in writing to the Crown. A national parliament has never before brought down a common minister. If we accept the resignation the precedent is made in one afternoon; if we refuse it, he will fight the Chamber from the bench and the bills will sit there until he loses."
 auh_dnc.300.a:0 "Accept his resignation and let the precedent stand."
 auh_dnc.300.b:0 "Refuse it. He will fight the Chamber from the bench."
 AUH_h_nat_CZE_up_tt:0 "Loyalty of the Czechs rises."
 AUH_h_ev_concede_tt:0 "Another establishment receives its own language of service, and coordination falls again."
 AUH_h_ev_refuse_tt:0 "The obstruction resumes in the other chamber and the next common law costs a quarter more."
 auh_dnc.301.t:0 "The Regiments Ask the Same"
 auh_dnc.301.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Bohemian regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.301.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.301.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 auh_dnc.302.t:0 "The Regiments Ask the Same"
 auh_dnc.302.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Croatian regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.302.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.302.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 AUH_h_nat_POL_up_tt:0 "Loyalty of the Poles rises."
 AUH_h_nat_POL_down_tt:0 "Loyalty of the Poles falls."
 auh_dnc.303.t:0 "The Regiments Ask the Same"
 auh_dnc.303.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Galician regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.303.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.303.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 AUH_h_ev304_a_tt:0 "The cabinet is formed on the coalition's own programme."
 AUH_h_ev304_b_tt:0 "The word of command is postponed for a year and the counties hear about it."
 auh_dnc.304.t:0 "The Audience"
 auh_dnc.304.d:0 "The leaders of the victorious coalition are received. They have their military programme in their hands and they will not enter a cabinet without it. The Crown may name them on their terms, which is what this whole method was built to make possible, or it may demand that the word of command be dropped first and see whether they blink. They have not blinked in four years of obstruction."
 auh_dnc.304.a:0 "Name them with their programme."
 auh_dnc.304.b:0 "Demand the word of command be dropped first."
 AUH_h_ev305_withdraw_tt:0 "The order is withdrawn before it is read out, and the corridor is cleared by the ushers."
 auh_dnc.305.t:0 "The Honved Is Ordered to the Chamber"
 auh_dnc.305.d:0 "The Chamber will not disperse and the government has run out of parliamentary instruments. The royal commissioner, who is the Kingdom's own minister for the Honved, is instructed to clear the house with the Kingdom's own guard. Every officer in that corridor swore an oath whose two clauses we ourselves wrote down and put in that order. We are about to find out which clause they read first."
 auh_dnc.305.a:0 "Give the order."
 auh_dnc.305.b:0 "Withdraw the order. The guard is not an argument."
 AUH_h_ev305_obey_tt:0 "The officers obey. The sitting ends, and the house is cleared by force."
 AUH_h_ev305_refuse_tt:0 "The officers hesitate. The order is not executed, and the staff college of an army that would not obey will get no chair."
 AUH_h_ev306_a_tt:0 "The party of the settlement secedes; nothing now stands between this road and its end."
 AUH_h_ev306_b_tt:0 "The majority holds. The declaration of a personal union stays out of reach until the question returns."
 auh_dnc.306.t:0 "The Party of the Settlement Walks Out"
 auh_dnc.306.d:0 "The men who signed the settlement cannot sit in a cabinet founded on a separate bank of issue, and they have said so and gone. They take a third of the majority with them and the whole of the Monarchy's confidence in this government. We may let them go and govern with what is left, which is a majority for one programme and one only. Or we may buy them back with a seat at the table, and buy back with them everything they will refuse to sign."
 auh_dnc.306.a:0 "Let them go."
 auh_dnc.306.b:0 "Buy them back with a seat in the cabinet."
 AUH_h_ev307_a_tt:0 "Nothing is decided for eight months and everything is signed."
 AUH_h_ev307_b_tt:0 "The bank question is settled on the Kingdom's terms and the price is on the estimates for good."
 auh_dnc.307.t:0 "Eight Months Without a Government"
 auh_dnc.307.d:0 "The bank question has taken the cabinet down and there is nobody who can replace it. The ministers have resigned and remain at their desks signing what cannot wait, which is most things. Credit is drying up in both halves while the Chamber argues about whose name goes on the notes. We may hold the line with a caretaker and let the argument exhaust itself, or concede the bank entirely and buy a majority at whatever it costs."
 auh_dnc.307.a:0 "Hold the line and govern with a caretaker."
 auh_dnc.307.b:0 "Concede the bank fully and buy a majority."
 AUH_h_ev308_a_tt:0 "The neighbour finds other buyers, other lenders and other gunmakers."
 AUH_h_ev308_b_tt:0 "The frontier stays open and the plain sends its complaints to the capital."
 auh_dnc.308.t:0 "The Frontier Closes on the Livestock"
 auh_dnc.308.d:0 "The agrarians of the Kingdom want the southern frontier shut to live pigs and cattle, and with a tariff of our own we can shut it. The neighbour across the river sells us almost nothing else. If we close, Belgrade will buy its guns in France, build its own abattoirs with French money and be free of us inside three years. If we keep it open we shall be told in every county assembly of the plain that the government feeds a hostile kingdom."
 auh_dnc.308.a:0 "Close the frontier."
 auh_dnc.308.b:0 "Keep it open against a commercial treaty."
 AUH_h_ev309_a_tt:0 "The chancellery goes on recruiting, and the file grows."
 AUH_h_ev309_b_tt:0 "The heir's clients are pushed into open opposition, and his organisation is halved for two years."
 auh_dnc.309.t:0 "The Programme of the Next Reign"
 auh_dnc.309.d:0 "The heir's military chancellery is drafting the reign that follows this one, and every draft begins by undoing the settlement of the two armies. It is recruiting where we are weakest, in the Transylvanian counties, the uplands and the coast, and it is promising each of them what it refuses the Kingdom. We may watch and do nothing, which is what the King prefers. Or we may move against a chancellery that is not, formally, doing anything wrong."
 auh_dnc.309.a:0 "Watch them and do nothing."
 auh_dnc.309.b:0 "Move against the chancellery."
 AUH_h_ev310_a_tt:0 "The eastern deployment is written down and the alliance keeps its value."
 AUH_h_ev310_b_tt:0 "Their staff begins planning without the Monarchy's eastern army."
 auh_dnc.310.t:0 "Berlin Asks About the Word of Command"
 auh_dnc.310.d:0 "Our ally asks, through its military attache and then through its ambassador, what the common army is now worth. It was allied to an establishment that manoeuvred as one body, and the newspapers of two capitals have just told it that no such body exists. We may reassure Berlin with a written convention on the eastern deployment, which costs us the price of writing it down. Or we may say that the internal law of the Monarchy is our own affair and let their staff plan without us."
 auh_dnc.310.a:0 "Reassure Berlin with a written convention."
 auh_dnc.310.b:0 "Tell Berlin it is our affair."
 AUH_h_ev311_a_tt:0 "The understanding holds, and the Romanian loss is halved."
 auh_dnc.311.t:0 "Bucharest Reads the Order of the Day"
 auh_dnc.311.d:0 "The kingdom beyond the passes has read our order of the day, our new garrisons and our new batteries, and has drawn the obvious conclusion. Its king is bound to us by an understanding almost nobody in his own country knows about, and he cannot defend it against a press that prints our Transylvanian statutes in full. A private reassurance costs us political capital and buys us his silence. Saying nothing costs nothing today."
 auh_dnc.311.a:0 "Send a private reassurance to the King in Bucharest."
 auh_dnc.311.b:0 "Say nothing."
 AUH_h_ev312_a_tt:0 "The provinces stay outside both halves, and the ambiguity is preserved on purpose."
 AUH_h_ev312_b_tt:0 "A promise is made that nobody intends to keep, and it is written into the minutes."
 auh_dnc.312.t:0 "Budapest Asks for the Third Land"
 auh_dnc.312.d:0 "The Kingdom has paid half the bill for the occupied provinces since the day the army marched in, and it now asks what it has bought. Its ministry wants the provinces attached to the Crown of Saint Stephen, and its press has already drawn the map. The other half of the Monarchy will not hear of it and the provinces themselves have not been asked. We refuse, or we promise a decision at some later date and let the promise ripen into a scandal."
 auh_dnc.312.a:0 "Refuse, and keep the provinces outside both halves."
 auh_dnc.312.b:0 "Promise a decision at a later date."
 auh_dnc.313.t:0 "The Seam at the Manoeuvres"
 auh_dnc.313.d:0 "The two establishments take the field together in front of the attaches of six powers. Orders pass from one staff to the other by written convention, translated, timed and countersigned. If the seam holds, we shall have proved that a Monarchy can field two armies and command them as one. If it opens, it will open in front of the men who write the reports their governments act on."
 auh_dnc.313.a:0 "Hold the manoeuvres."
 AUH_h_ev313_good_tt:0 "The two staffs mesh, and a part of the coordination malus is written off for good."
 AUH_h_ev313_bad_tt:0 "The seam opens in front of the attaches, and the offensive doctrine is locked for two years."
 AUH_h_advisor_klobucar_tt:0 "The general from the coast takes the command of the Kingdom's army."
 auh_dnc.314.t:0 "The Commander of the Honved Dies"
 auh_dnc.314.d:0 "The commander-in-chief of the Kingdom's army is dead and the succession is on the King's desk. The seniority list gives the command to a general born on the coast, which the coast would notice and the capital would resent. Behind him stands an archduke of the Hungarian line, of middle rank and no particular distinction, whom the Chamber would receive with a standing ovation. One of these choices is correct and the other is useful."
 auh_dnc.314.a:0 "Name the general the seniority list gives."
 auh_dnc.314.b:0 "Pass him over for the archduke of the Hungarian line."
 AUH_h_ev315_a_tt:0 "The campaign is answered and the damage abroad is halved."
 auh_dnc.315.t:0 "The Publicist Takes Up the Uplands"
 auh_dnc.315.d:0 "A Scottish publicist named Seton-Watson has spent a summer in the northern counties and has published what he found there. The examination in the state language, the schools, the gendarmerie and the recruiting rolls are all in his book, and the book is being read in London and Paris. We may answer him in the foreign press, which concedes that a foreigner may lecture us on our internal law. Or we may refuse to answer at all, which concedes the field."
 auh_dnc.315.a:0 "Answer him in the foreign press."
 auh_dnc.315.b:0 "Refuse to answer a foreign lecture on our internal law."
 AUH_h_the_uplands_question:0 "The Question of the Uplands"
 AUH_h_ev316_a_tt:0 "The reform stands, and the governing benches are thinner by half."
 AUH_h_ev316_b_tt:0 "The bill survives with its teeth drawn, and everyone concerned knows it."
 auh_dnc.316.t:0 "The Gentry Splits Over the Ballot"
 auh_dnc.316.d:0 "The reform is real and the men who carried the coalition have worked out what it does to their seats. Half the governing benches will leave rather than vote it. We may hold the reform and let them go, which costs us the majority and keeps the new electors. Or we may water it down in committee until it is safe, which keeps the majority and tells every county that our promises are drafting exercises."
 auh_dnc.316.a:0 "Hold the reform and let them go."
 auh_dnc.316.b:0 "Water it down in committee."
 AUH_h_ev317_a_tt:0 "The squares are cleared and the day enters the calendar of the labour associations."
 AUH_h_ev317_b_tt:0 "The question is promised a second hearing and the squares empty by evening."
 auh_dnc.317.t:0 "The Streets Answer the Plural Ballot"
 auh_dnc.317.d:0 "A hundred thousand men are in the squares of the capital, and they are not asking for the vote in general but for a vote that weighs the same as anybody else's. The gendarmerie is in the side streets waiting for a word. We may let it clear the squares, which will work today and be quoted for a generation. Or we may receive a delegation and promise that the question will be reopened, which will cost us a promise we may not be able to keep."
 auh_dnc.317.a:0 "Let the police clear the squares."
 auh_dnc.317.b:0 "Receive the delegation."
 AUH_h_ev318_a_tt:0 "The threat is held over the Chamber and never carried out."
 AUH_h_ev318_c_tt:0 "The Crown declines to threaten a parliament with an electorate, and the Chamber is told so."
 auh_dnc.318.t:0 "The Franchise Held Over the Kingdom"
 auh_dnc.318.d:0 "The interior minister offers the Crown a weapon: decree a universal male franchise for the Kingdom, with the social democrats and the nationality parties behind it, and the Chamber that obstructs us disappears at the next election. It would break the obstruction in one act and it would spend, in that same act, the entire consent we have spent this decade buying. We may brandish it and not use it, which is what a threat is for. We may decree it. Or we may refuse to hold it over a parliament at all."
 auh_dnc.318.a:0 "Brandish it and do not use it."
 auh_dnc.318.b:0 "Decree it."
 auh_dnc.318.c:0 "Refuse to hold it over the Chamber at all."
 AUH_h_ev318_b_tt:0 "The Kingdom's consent, which is this whole method's currency, is spent in a single act and the counter returns to nothing."
 auh_dnc.319.t:0 "The Crisis Finds Two Armies"
 auh_dnc.319.d:0 "The provinces have been declared ours, the neighbour across the river has mobilised its opinion, and a partial mobilisation is ordered against it. Two establishments must now move on one timetable, with two staffs, two gazetteers, two survey grids and a convention between them. Everything this settlement has cost is about to be measured on a railway platform instead of in a tooltip."
 auh_dnc.319.a:0 "Order the mobilisation."
 AUH_h_ev319_good_tt:0 "It goes off on time. The neighbour capitulates and the settlement has passed its examination."
 AUH_h_ev319_bad_tt:0 "The two establishments mobilise on two timetables. The neighbour is emboldened and Berlin has seen everything."
 AUH_h_the_kingdom_consents:0 "What Budapest Has Been Given"
 AUH_h_price_paid_tt:0 "What Budapest has been given rises, and the common army holds together a little less well."
 AUH_h_gemein_down_tt:0 "The sense of common affairs weakens."
 AUH_h_gemein_up_tt:0 "The sense of common affairs is repaired a little."
 AUH_h_quota_up_tt:0 "The Kingdom's share of the common charges rises."
 AUH_h_cores_of_the_crown_tt:0 "Every state of the Crown of Saint Stephen becomes Hungarian ground in law as well as in name."
