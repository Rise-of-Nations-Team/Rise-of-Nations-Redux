 AUH_r_seats_up_tt:0 "Votes behind the ministry rise."
 AUH_r_seats_down_tt:0 "Votes behind the ministry fall."
 AUH_r_seats_held_tt:0 "The count holds."
 AUH_r_counter_opened_tt:0 "The ministry begins with no bench of its own: the count of votes behind it stands at nothing."
 AUH_r_ordinance_taken_tt:0 "One more emergency ordinance is entered in the ledger."
 AUH_r_ordinance_price_tt:0 "Each ordinance already taken makes the next one dearer in stability and in credit."
 AUH_r_ordinance_price_doubled_tt:0 "Having accepted the committee's finding, every future ordinance costs twice what it did."
 AUH_r_segment_b_opened_tt:0 "The clubs may now be enrolled one by one."
 AUH_r_segment_d_opened_tt:0 "The crownland settlements may now be opened."
 AUH_r_segment_e_opened_tt:0 "The other half will now send its account."
 AUH_r_corridor_closed_tt:0 "The Alpine corridor and the second axis to the sea are closed for this era."
 AUH_r_fleet_capped_tt:0 "The fleet is held at the coast-defence format; the battle line and the semi-dreadnought are closed for this era."
 AUH_r_the_vacuum_tt:0 "The lands of the kingdom are administered under a legal vacuum by two hostile services."
 AUH_r_the_court_goes_north_tt:0 "The court's patronage moves to the kingdom's capital."
 AUH_r_the_count_is_visible_tt:0 "The count of votes behind the ministry, and its tier, are now public."
 AUH_r_unattached_decision_tt:0 "Unattached deputies may now be courted two at a time, at a rising price in political power."
 AUH_r_statute_or_nothing_tt:0 "Nothing will be settled outside the chamber again."
 AUH_r_bank_governor_tt:0 "A Galician Pole takes the governorship of the note-issuing bank."
 AUH_r_the_promise_has_a_term_tt:0 "The promise of a language statute carries a term the Czech clubs are counting."
 AUH_r_the_curial_house_holds_tt:0 "These nineteen votes exist only while the curial house does."
 AUH_r_cooperatives_tt:0 "The Slovene credit unions are recognised in law."
 AUH_r_defection_roll_tt:0 "The Christian Socials will count their price again whenever the gavel is used or the bishops are refused."
 AUH_r_the_city_is_contested_tt:0 "The port city becomes a place where every appointment is a national question."
 AUH_r_the_promise_of_the_bill_tt:0 "A franchise bill is promised in the chamber, by name; breaking that word will cost these eleven votes."
 AUH_r_tier_read_tt:0 "The tier of the ministry's support is read from the count."
 AUH_r_committee_will_report_tt:0 "The committee will report only in the second half of this era, and the ministry has undertaken to accept its finding."
 AUH_r_both_roads_open_tt:0 "The gavel and the ballot are both now open to the crown."
 AUH_r_strike_counter_tt:0 "The general-strike counter rises."
 AUH_r_strike_frozen_tt:0 "The general-strike counter is reset."
 AUH_r_the_word_broken_tt:0 "The word given to the workers is broken and their eleven votes go with it."
 AUH_r_gavel_roll_tt:0 "The closure will be put to the house. Success needs German loyalty above fifty-five, stability above forty-five in the hundred, and the count above the majority."
 AUH_r_gavel_conditions_met_tt:0 "The conditions for carrying the closure are met."
 AUH_r_gavel_conditions_failed_tt:0 "The conditions for carrying the closure are not met; the ministry is gambling."
 AUH_r_vacuum_narrowed_tt:0 "The legal vacuum in the kingdom narrows."
 AUH_r_vacuum_ended_tt:0 "The legal vacuum in the kingdom is closed."
 AUH_r_no_defection_roll_tt:0 "The Polish Club's sixty-five votes are held without a defection roll."
 AUH_r_army_locked_tt:0 "The common army is not to be touched: the army branch's reform of the staff college and its concession on the language of command are closed to this ministry."
 AUH_r_heirs_candidate_cheaper_tt:0 "The heir's candidate for the general staff is cheaper to appoint."
 AUH_r_heirs_candidate_dear_tt:0 "The heir's candidate for the general staff now needs a costly reconciliation; the old chief remains available."
 AUH_r_heirs_candidate_locked_tt:0 "The heir's candidate for the general staff is closed to this ministry; the old chief remains available."
 AUH_r_estates_consulted_tt:0 "The estates expect to be consulted before every statute that touches the land."
 AUH_r_claim_is_hollow_tt:0 "The count stands below the majority and the claim is heard as a boast."
 AUH_r_eighty_four_lost_tt:0 "The Polish Club walks out and the landowners' bench goes with the curial house: eighty-four votes."
 AUH_r_counter_rebased_tt:0 "The whole house is re-elected; the ministry's own benches in the new chamber number one hundred and thirty-one of five hundred and sixteen."
 AUH_r_tier_refreshed_tt:0 "The tier of the ministry's support is read again against the new majority of two hundred and fifty-nine."
 AUH_r_price_list_torn_up_tt:0 "The price list of the Galician delegation is torn up."
 AUH_r_polish_societies_arm_tt:0 "The Polish national societies begin arming in the province."
 AUH_r_estates_estranged_tt:0 "The estates of the kingdom are estranged from the ministry."
 AUH_r_mayor_locked_tt:0 "The clerical party and the workers' party will not carry one budget: the mayor's benches are closed for this era."
 AUH_r_the_register_is_changed_tt:0 "The Polish and Galician claims are struck from the register of the two eastern states."
 AUH_r_both_capped_tt:0 "Neither nation of the province may be brought past a bare tolerance while the viceroy holds the balance."
 AUH_r_chains_unclosable_tt:0 "Both violence chains in the province run for the rest of the era and neither can be closed."
 AUH_r_credibility_spent_tt:0 "The state enters the southern crisis with its own credibility spent."
 AUH_r_statute_roll_tt:0 "The statute will be put to a division. Success needs the workers' bench paid, the count above two hundred and fifty-eight, and stability above forty in the hundred."
 AUH_r_statute_conditions_met_tt:0 "The conditions for carrying the statute are met."
 AUH_r_statute_conditions_failed_tt:0 "The conditions for carrying the statute are not met; the ministry is gambling against the record."
 AUH_r_precedent_cited_tt:0 "The Moravian precedent is on the table of the house."
 AUH_r_thirty_six_months_tt:0 "If the settlement of the kingdom is not carried within three years, the Czech clubs will read the citation back to the ministry."
 AUH_r_silesian_decision_tt:0 "The diet of the duchy may now be asked for its own settlement."
 AUH_r_obstruction_in_the_diet_tt:0 "German loyalty is too low: the obstruction moves into the diet itself."
 AUH_r_every_land_asks_tt:0 "Every other land will ask for a minister of its own within the year."
 AUH_r_secession_reset_tt:0 "The German secession movement loses its subscribers and returns to its first stage."
 AUH_r_secession_last_stage_tt:0 "The German secession movement runs to its last stage."
 AUH_r_littoral_command_tt:0 "A Littoral corps command is given to an officer of the province, with no claim on a third crown attached."
 AUH_r_moravian_guarantee_holds_tt:0 "The Moravian guarantee holds."
 AUH_r_moravian_guarantee_wobbles_tt:0 "The Moravian guarantee is withdrawn by its own diet."
 AUH_r_two_bodies_tt:0 "Two professorial bodies that no longer speak to one another, and a bill that arrives every year."
 AUH_r_the_electrical_works_tt:0 "The electrical works of the kingdom take the current contracts."
 AUH_r_agrarian_benches_ask_tt:0 "The agrarian benches will ask what became of the river works."
 AUH_r_organised_miners_tt:0 "The arbitration makes a generation of organised miners."
 AUH_r_field_under_the_club_tt:0 "The field is worked under the Polish administration, and how much of it answers to the ministry is its decision."
 AUH_r_the_margin_stays_tt:0 "The refining margin stays inside the province."
 AUH_r_uprising_severity_tt:0 "The licensed societies are the cadres of any rising that follows a broken ring."
 AUH_r_the_balloon_officer_tt:0 "The balloon officer of the military aeronautical institute takes the detachment."
 AUH_r_quote_up_tt:0 "The other half's share of the common budget is cut and ours is raised."
 AUH_r_gemeinsamkeit_down_tt:0 "What the two halves still hold in common is worn a little thinner."
 AUH_r_gemeinsamkeit_up_tt:0 "What the two halves still hold in common is a little easier to defend."
 AUH_r_credits_dearer_tt:0 "The army and navy credits are dearer for the rest of the era."
 AUH_r_contingent_frozen_tt:0 "The Hungarian delegation refuses the credits and the contingent stays frozen."
 AUH_r_southern_roll_tt:0 "There is no advocate in this capital for outbidding the other half over the south; the address will usually be returned."
 AUH_r_address_returned_tt:0 "The address is returned to the diet that sent it."
 AUH_r_ex_lex_starts_tt:0 "The other half's chamber answers with obstruction and the ex-lex begins."
 AUH_r_interior_deployment_rehearsal_tt:0 "The army's deployment for the interior may be rehearsed and held over the other half as a standing threat. It is written, filed, and never executed."
 AUH_r_south_is_lost_tt:0 "The southern deputies go over to the other half's opposition; every later southern decision costs more."
 AUH_r_confessional_schools_tt:0 "The confessional schools of the other half's nationalities may now be funded, twice, to halve what is coming."
 AUH_r_school_law_is_coming_tt:0 "The other half will answer with a school law this crown has no instrument to stop."
 AUH_r_we_cannot_protect_them_tt:0 "The crown has heard them and cannot protect them."
 AUH_r_parity_board_tt:0 "The parity board doubles the cost of every economic decision."
 AUH_r_wear_tier_worse_tt:0 "The wear on the settlement is one step worse than any other course reaches."
 AUH_r_no_mediation_tt:0 "German mediation in any internal question is refused by standing instruction."
 AUH_r_a_congress_of_conservatives_tt:0 "On the road of historic right it is a congress of conservatives, and costs half as much abroad."
 AUH_r_the_police_are_instructed_tt:0 "The police of the province are instructed which schoolmasters to leave alone."
 AUH_r_never_claim_unification_tt:0 "This monarchy never claims the German unification."
 AUH_r_bought_once_only_tt:0 "The ally across the water has a separate understanding elsewhere; his friendship cannot be bought twice."
 AUH_r_no_european_crisis_tt:0 "The annexation is carried without a European crisis."
 AUH_r_renewal_dearer_tt:0 "The renewal of the settlement is dearer by one step."
 AUH_r_neighbour_does_not_sign_tt:0 "The understanding was never bought: the neighbour does not sign and the staff demands a war."
 AUH_r_no_dependence_tt:0 "This monarchy owes the ally nothing for its exit from the crisis."
 AUH_r_largest_divergence_tt:0 "This is the largest thing the reign has ever been asked to unsay."
 AUH_r_associations_mobilise_tt:0 "The German associations of the kingdom mobilise for the day of the ceremony."
 AUH_r_benches_boycott_tt:0 "The workers' and agrarian benches boycott the ceremony."
 AUH_r_agrarian_bench_paid_again_tt:0 "The estranged agrarian bench must be paid again before it will elect the deputation."
 AUH_r_nobility_absent_tt:0 "The nobility that would have crowned the king will not attend."
 AUH_r_the_guarantee_holds_tt:0 "The guarantee holds: the German deputies attend under protest and the ceremony passes."
 AUH_r_the_cores_are_lost_tt:0 "German Bohemia refuses: the crown ceases to hold the Sudeten lands as its own, and they must be pacified or lost."
 AUH_r_settlements_permanent_tt:0 "The crownland settlements are permanent for the rest of the game."
 AUH_r_settlements_void_tt:0 "The crownland settlements are void."
 AUH_r_g5_unlocked_tt:0 "The ring is broken; if it is not re-formed, the chamber will be adjourned and the era ended by ordinance."
 AUH_r_the_chain_repeats_tt:0 "The count is too low: the galleries fill again and the chain repeats."
 AUH_r_ruthenian_road_open_tt:0 "The Ruthenian benches may now be taken as partners."
 AUH_r_river_works_only_tt:0 "River and canal works inside the kingdom and the province only."
 AUH_r_corridor_stays_closed_tt:0 "No Alpine, no port axis and no dockyard is restored, and the corridor stays closed."
 AUH_r_surveys_published_later_tt:0 "The surveys will be published in two years and the loss will be doubled."
 AUH_r_nothing_is_decided_tt:0 "The professor is moved and no principle is decided."
 AUH_r_conversions_accelerate_tt:0 "The movement loses its leader and the conversions accelerate."
 AUH_r_nothing_spent_tt:0 "Nothing is spent now; the last stage will fire at the ceremony."
 AUH_r_straits_cheaper_tt:0 "The understanding at Petersburg makes the bargain at the Straits cheaper."
 AUH_r_the_crisis_is_ours_tt:0 "The proclamation comes first and the crisis with it."
 AUH_r_ceremony_postponed_tt:0 "The ceremony is postponed and the Czech clubs are counting again."
 AUH_r_statute_withdrawn_tt:0 "The statute is withdrawn and the ministry governs on the budget alone."
 auh_dnc.200.t:0 "Which Bench Do We Pay First?"
 auh_dnc.200.d:0 "The cabinet is formed and the lobby is full before the first sitting. The Galician delegation wants its promise in writing; the Czech clubs want the language question named in the address from the throne; the Alpine Catholics want the schools clause and nothing else. Each will wait if it is paid second. None will wait if it is paid third."
 auh_dnc.200.a:0 "The Poles, and the province is left to its diet."
 auh_dnc.200.b:0 "The Czechs, and the language question first."
 auh_dnc.200.c:0 "The Catholics, and the schools first."
 auh_dnc.201.t:0 "The Order of the Gavel"
 auh_dnc.201.d:0 "The closure is voted at four in the morning with the galleries cleared and the German deputies carried out by ushers. By noon the capital is in the streets, the social democrats have joined an obstruction they had stayed out of for a decade, and the mayor's party is in a back room counting what it can now demand. The garrison commander is asking for instructions and will not ask twice."
 auh_dnc.201.a:0 "Hold, and proclaim martial law in the capital."
 auh_dnc.201.b:0 "Hold, and let the police stand aside."
 auh_dnc.201.c:0 "Withdraw the order; the ministry cannot carry it."
 auh_dnc.202.t:0 "The Mayor Counts His Price"
 auh_dnc.202.d:0 "The mayor of the capital receives our whip in his own office, keeps him standing, and reads out a list. The municipal undertakings are not enough now; he wants the schools clause enforced in the universities, an appointment in the ministry of worship, and an undertaking about the next election that no honest government could give. He deserted the last ministry that needed him."
 auh_dnc.202.a:0 "Pay what he asks."
 auh_dnc.202.b:0 "Let him go, and count without him."
 auh_dnc.203.t:0 "Budapest Answers"
 auh_dnc.203.d:0 "The other half's chamber resolves within the week that no arrangement in this half may prejudice the settlement, and adds a demand of its own: the language of service in its own regiments, as the price of its silence about the kingdom. The crown always said that if it gave the Czechs their rolls, the Magyars would send in a bill the next morning. The crown was right."
 auh_dnc.203.a:0 "Refuse the regiments, and pay in the quota."
 auh_dnc.203.b:0 "Refuse, and pay in nothing at all."
 auh_dnc.203.c:0 "Concede the language of service in their regiments."
 auh_dnc.204.t:0 "The Club Walks Out"
 auh_dnc.204.d:0 "The Galician delegation meets for one hour and walks out of the majority in a body. Its majorities were built on curiae we are abolishing and its leaders say so without embarrassment: they were never a party, they were an arrangement. Sixty-five votes cross the floor together and the eastern province's administration goes with them."
 auh_dnc.204.a:0 "Let them go, and take the Ruthenian benches instead."
 auh_dnc.204.b:0 "Offer to leave the province's curiae untouched."
 auh_dnc.205.t:0 "A Shot at Lemberg"
 auh_dnc.205.d:0 "A Ruthenian peasant is shot dead by gendarmes at a polling place in the eastern districts and the coroner's finding is written before the body is cold. Weeks later a student walks into the viceroy's residence and kills the crown's lieutenant in the province. The province waits to see which law he is tried under, and both nations in it will read the answer as a verdict on themselves."
 auh_dnc.205.a:0 "Try him under the ordinary law and commute the sentence."
 auh_dnc.205.b:0 "Try him summarily, and let the sentence stand."
 auh_dnc.205.c:0 "Open the Ruthenian body now, over the viceroy's head."
 auh_dnc.206.t:0 "The Canal or the Rails"
 auh_dnc.206.d:0 "The agrarian benches want to know, in the chamber and on the record, whether the river works voted with the branch lines have been cut, or whether the money has quietly gone into the junction at the capital of the kingdom. The surveys exist. The estimates exist. Twelve votes are waiting for the answer and the minister of railways has gone very carefully through his notes."
 auh_dnc.206.a:0 "Dig the river works in the kingdom and the province."
 auh_dnc.206.b:0 "Shelve them, and say so in the chamber."
 auh_dnc.206.c:0 "Shelve them, and say nothing."
 auh_dnc.207.t:0 "The Professor and the Bishops"
 auh_dnc.207.d:0 "A professor of canon law publishes an essay on free science and the duty of the state to protect it. Within a month the bishops have written to the ministry of worship, the confessional partner has raised it in the club, and the students of two universities are holding meetings about a man most of them had never heard of. Twenty-nine votes are attached to the answer."
 auh_dnc.207.a:0 "Remove him."
 auh_dnc.207.b:0 "Move him to another university and settle nothing."
 auh_dnc.207.c:0 "Keep him, and say why."
 auh_dnc.208.t:0 "A German State and Nothing Else"
 auh_dnc.208.d:0 "The German national associations declare that this realm is a German state and that a ministry resting on Slav clubs is a foreign government. Their societies open subscription lists in every Sudeten town, their newspapers print the roll of officials who have sat the language examination, and their leaders are careful to stay one sentence inside the law. The public prosecutor has drafted an indictment and is waiting."
 auh_dnc.208.a:0 "Buy the bloc."
 auh_dnc.208.b:0 "Prosecute the leaders."
 auh_dnc.208.c:0 "Ignore them."
 auh_dnc.209.t:0 "The Conversions"
 auh_dnc.209.d:0 "The conversions continue: whole parishes leaving the church of the dynasty for the church of the neighbouring empire, with a band and a photographer. It is a political act dressed as a religious one and everybody understands it. The bishops want a counter-mission funded from the ordinary estimates; the treasury wants to know for how many years."
 auh_dnc.209.a:0 "Fund the counter-mission."
 auh_dnc.209.b:0 "Let them go."
 auh_dnc.210.t:0 "The Other Half Asks What It Receives"
 auh_dnc.210.d:0 "The leading statesman of the other half recalls, in a speech everyone was invited to, that a crowning at Prague was killed once before and by whom. He then asks the only question that matters: what is the other half to receive? Zagreb has sent the same question in a politer envelope."
 auh_dnc.210.a:0 "Nothing. The kingdom's rights are its own affair."
 auh_dnc.210.b:0 "The quota, and a portfolio in the common ministry."
 auh_dnc.210.c:0 "Postpone the ceremony until the question cools."
 auh_dnc.211.t:0 "German Bohemia Will Not Kneel"
 auh_dnc.211.d:0 "The route from the station to the cathedral is settled, the regalia are in the cathedral, and the German deputies of the kingdom have announced that they will not attend a ceremony that crowns a Czech state. In the frontier towns the associations are drilling in the open. The governor of the land asks whether he is to have troops on the day, and how many."
 auh_dnc.211.a:0 "Proclaim martial law over the German districts."
 auh_dnc.211.b:0 "Go through with it and garrison nothing."
 auh_dnc.211.c:0 "Take the oath in the capital of the realm instead."
 auh_dnc.211.e:0 "The guarantee holds; proceed."
 auh_dnc.212.t:0 "The Ring Marches Again"
 auh_dnc.212.d:0 "They come down the ring road again, in columns of six, in their Sunday coats, without a single window broken. There are more of them than last year and they have stopped shouting at the ministry; they shout at the curiae. The police president reports that a ban would be obeyed and that obeying it would cost us more than the march."
 auh_dnc.212.a:0 "Let them march and shoot nothing."
 auh_dnc.212.b:0 "Ban the march."
 auh_dnc.212.c:0 "Concede the further body now."
 auh_dnc.213.t:0 "Petersburg Offers a Bargain"
 auh_dnc.213.d:0 "The eastern power's foreign minister sends word through the congress that he is willing to discuss the southern provinces and the Straits in the same conversation, before anything is proclaimed. It is an offer to settle in a country house what would otherwise be settled by six chancelleries and a mobilisation. It also means paying for what we already occupy."
 auh_dnc.213.a:0 "Take the understanding, and buy the sovereignty first."
 auh_dnc.213.b:0 "Proclaim first and argue afterwards."
 auh_dnc.214.t:0 "The Committee Reports"
 auh_dnc.214.d:0 "The constitutional committee reports at last on the emergency ordinances of the language crisis: twenty-two regular, twenty-four unconstitutional but excused by necessity, thirty grossly unconstitutional. It asks for no impeachment and no repeal. It merely writes the numbers down, and this ministry undertook in advance to accept whatever it wrote."
 auh_dnc.214.a:0 "Accept the finding, as we undertook to."
 auh_dnc.214.b:0 "Table it, and take the next ordinance anyway."
 auh_dnc.215.t:0 "The Statute Goes to a Vote"
 auh_dnc.215.d:0 "The language statute is called for division in a chamber of five hundred and sixteen. The German benches have a fortnight of speeches ready, the galleries are full, and the workers' bench is being counted twice by both sides. Nobody in this house has ever seen a statute of this kind carried by a vote. The clerks are told to expect a long sitting."
 auh_dnc.215.a:0 "Sit through it and divide."
 auh_dnc.215.b:0 "Withdraw the statute and govern on the budget."
 auh_dnc.215.c:0 "Take it by ordinance after all."
 auh_dnc.216.t:0 "The State Pays the Schoolmaster"
 auh_dnc.216.d:0 "The other half answers the reception at the Hofburg with a school law of its own: the state will pay the village schoolmaster, and the state's language will be taught in every school it pays for. The Slovak and Romanian schools that were the last institutions of two nations begin closing one district at a time. This crown has no instrument to stop it and said so in advance."
 auh_dnc.216.a:0 "There is nothing we can do for them."
 auh_dnc.216.b:0 "The confessional schools we funded will hold some of them."
