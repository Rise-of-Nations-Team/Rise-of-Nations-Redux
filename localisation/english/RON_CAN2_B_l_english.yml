#Focuses
 CANDNC_the_longest_frontier: "The Longest Frontier"
 CANDNC_the_longest_frontier_desc: "Four thousand miles from Passamaquoddy Bay to the Strait of Juan de Fuca, and not a fort worth the name on either side of it. Ottawa keeps no man in Washington who answers to Ottawa."
 CANDNC_the_six_impartial_jurists: "The Hay-Herbert Convention"
 CANDNC_the_six_impartial_jurists_desc: "Washington, 24 January 1903: six impartial jurists of repute will settle the panhandle. The paper is British, the signature is British, and the coast in dispute is Canadian."
 CANDNC_a_canadian_plenipotentiary: "A Canadian Plenipotentiary"
 CANDNC_a_canadian_plenipotentiary_desc: "No British counsel will plead a Canadian shore. Send a man from Ottawa with full powers, or let the boundary stand unsettled until they send for one. Laurier thought it; he never dared demand it."
 CANDNC_the_alverstone_vote: "The Alverstone Vote"
 CANDNC_the_alverstone_vote_desc: "20 October 1903, four voices to two. The Lord Chief Justice of England crosses to the Americans, Skagway and Dyea stay American, and the two Canadian commissioners walk out of the committee room."
 CANDNC_the_lynn_canal_garrison: "The Lynn Canal Garrison"
 CANDNC_the_lynn_canal_garrison_desc: "The Yukon Field Force marches down to tidewater and pitches camp above Skagway before the tribunal has reported. Roosevelt had already moved troops to that coast. Ottawa never moved its own."
 CANDNC_the_treaty_power_demanded: "The Power to Treat"
 CANDNC_the_treaty_power_demanded_desc: "Laurier tells the Commons on 23 October that the humiliation is not the line but the incapacity. Canada cannot make a treaty in its own name. He asks London for the power, and means to keep asking."
 CANDNC_the_price_of_the_award: "The Price of the Empire"
 CANDNC_the_price_of_the_award_desc: "Swallow the award, say nothing in public, and present the bill in Whitehall: Halifax and Esquimalt handed over, the garrisons withdrawn, a dominion paid in fortresses for the coast it lost."
 CANDNC_the_summit_customs_houses: "The Summit Customs Houses"
 CANDNC_the_summit_customs_houses_desc: "If the heads of the inlets are American, the passes above them are not. Posts go up at the White Pass and the Chilkoot, and every ton bound for Dawson pays Ottawa before it reaches the Yukon."
 CANDNC_gibbons_goes_to_washington: "Gibbons Goes to Washington"
 CANDNC_gibbons_goes_to_washington_desc: "George Gibbons crosses over to argue about diversions at Niagara, the Saint Mary and the Milk. Elihu Root will bargain in good faith, and the pen at the end of it still belongs to a British ambassador."
 CANDNC_halifax_and_esquimalt_handed_over: "The Imperial Fortresses"
 CANDNC_halifax_and_esquimalt_handed_over_desc: "The last British garrisons march out of Halifax and Esquimalt and hand over the keys, the guns and the coal bill. Independence arrives in the form of an invoice."
 CANDNC_the_defence_of_the_inlets: "What the Militia Could Hold"
 CANDNC_the_defence_of_the_inlets_desc: "Otter is asked what could actually be held north of Vancouver. The answer is a list of things that do not exist: no siege train, no mountain battery, no road, and one telegraph line that runs through Skagway."
 CANDNC_parity_on_the_boundary_waters: "The International Joint Commission"
 CANDNC_parity_on_the_boundary_waters_desc: "Six commissioners, three from each side, equal voices over every river that crosses the line. A country of seven millions is given parity with one of ninety, and takes it without argument."
 CANDNC_a_canadian_signature_or_none: "A Canadian Signature or None"
 CANDNC_a_canadian_signature_or_none_desc: "Gibbons negotiated it, so let Gibbons sign it. The Colonial Office is told in writing that no British name will go on a Canadian water treaty. In life, James Bryce signed it on 11 January 1909."
 CANDNC_the_skagway_ultimatum: "Thirty Days"
 CANDNC_the_skagway_ultimatum_desc: "A note goes to Washington demanding bonded Canadian traffic through the inlet within the month. The militia concentrates at Atlin. The frontier that carried no garrison suddenly carries two."
 CANDNC_the_bank_street_department: "Above the Barber Shop on Bank Street"
 CANDNC_the_bank_street_department_desc: "1 June 1909: Joseph Pope, a handful of clerks and a rented floor over a shop. It cannot sign a treaty or open a legation, but at last somebody in Ottawa reads the mail addressed to Canada."
 CANDNC_the_army_of_the_lakes: "The Army of the Lakes"
 CANDNC_the_army_of_the_lakes_desc: "Otter's staff drafts what no Canadian staff had drafted before: a scheme for the ground between Windsor and Kingston, written on the assumption that the enemy is south of it."
 CANDNC_the_dominion_that_signs: "The Dominion That Signs"
 CANDNC_the_dominion_that_signs_desc: "London concedes the point it refused after the panhandle. A Canadian commission, a Canadian seal, and treaties that bind Canada because Canada signed them and not because Westminster did."
 CANDNC_the_panhandle_campaign: "The Panhandle Campaign"
 CANDNC_the_panhandle_campaign_desc: "Columns out of Atlin and up the Stikine toward Skagway and Dyea, in weather that kills more men than the garrison does. The coast the tribunal gave away is taken back by militia. It never happened."
 CANDNC_the_walkerville_bargain: "The Walkerville Bargain"
 CANDNC_the_walkerville_bargain_desc: "17 August 1904, across the river from Detroit: Gordon McGregor incorporates Ford of Canada, builds a few dozen cars, and proves that American capital will jump a tariff wall rather than pay it."
 CANDNC_the_branch_plant_bargain: "Let Them Build Here"
 CANDNC_the_branch_plant_bargain_desc: "Any American house that wants the imperial preference must raise its plant in Ontario and hire in Ontario. The wages stay, the patents go home to Detroit, and nobody in the House objects out loud."
 CANDNC_the_wall_at_the_river: "The Wall at the River"
 CANDNC_the_wall_at_the_river_desc: "No charter for a foreign-controlled company, no bounty for a foreign mill, no coal contract across the river. Ontario stays Canadian and grows slower for it. No such bill ever reached the House."
 CANDNC_the_sudbury_matte: "The Sudbury Matte"
 CANDNC_the_sudbury_matte_desc: "International Nickel swallows the Canadian Copper Company in 1902 and ships every ton of matte to New Jersey. Ontario is offered the mine or the refinery, and takes the mine and the wages."
 CANDNC_the_crown_land_condition: "The Manufacturing Condition"
 CANDNC_the_crown_land_condition_desc: "Toronto extends to pulpwood the rule already laid on saw logs: cut on Crown land, milled in the province, or not cut at all. The buyer in Watertown may move his mill or find another forest."
 CANDNC_the_intermediate_column: "The Intermediate Column"
 CANDNC_the_intermediate_column_desc: "Fielding rules three rates for every line of the tariff: the British preference, a general rate, and a middle column he may trade away. Canada acquires a currency it can spend in Paris or Washington."
 CANDNC_the_cobalt_silver: "Silver on the Temiskaming Line"
 CANDNC_the_cobalt_silver_desc: "The railway cuts past a lake in August 1903 and McKinley, Darragh and the blacksmith LaRose find silver in the rock. Ontario keeps the royalty; the money that sinks the shafts comes up from Buffalo."
 CANDNC_the_pulpwood_embargo: "The Price of Newsprint"
 CANDNC_the_pulpwood_embargo_desc: "No log leaves for Watertown until it has been through a Canadian mill. The New York papers answer with a tariff campaign, and the cost of a broadsheet becomes a question between governments."
 CANDNC_the_reciprocity_draft: "The Draft Schedules"
 CANDNC_the_reciprocity_draft_desc: "Fielding and the State Department draw up the lists a decade before they were drawn: free grain, free lumber, free fish, implements cut. Laurier waited until 1911, and it finished him."
 CANDNC_the_preference_deepened: "A Gift, Not a Bargain"
 CANDNC_the_preference_deepened_desc: "Answer Washington by widening the door to Britain instead. A third off the general rate, granted freely and asked of nobody. Chamberlain wanted a treaty; Laurier gives a present and keeps the discretion."
 CANDNC_the_grain_growers_look_south: "The Grain Growers Look South"
 CANDNC_the_grain_growers_look_south_desc: "Motherwell's men at Indian Head do not care whose flag flies over the elevator. Minneapolis pays cash for hard red wheat and does not lecture them about the duty on binder twine."
 CANDNC_the_ontario_lodges: "The Lodges and the Manufacturers"
 CANDNC_the_ontario_lodges_desc: "The Orange order and the Canadian Manufacturers' Association find one platform between them for the first time: no market that is not the King's market. Whitney's Toronto is listening."
 CANDNC_the_continental_market: "North and South"
 CANDNC_the_continental_market_desc: "Wheat goes down the Soo instead of down the lakes, cattle cross at Emerson, and the pull of the valleys begins to beat the east-west railway that Ottawa mortgaged the country to build."
 CANDNC_the_empire_market: "Cold Storage at Halifax"
 CANDNC_the_empire_market_desc: "A fast line to Liverpool, refrigerated holds, and a bounty on every quarter of Canadian beef landed in Britain. The freight runs against the grain of the continent, and the Treasury pays it to."
 CANDNC_the_loyalist_panic: "The Map on the Front Page"
 CANDNC_the_loyalist_panic_desc: "Toronto hears annexation in every clause of the schedules. Veterans of 1866 are brought out for platform duty, the Mail and Empire prints the union in colour, and Ontario decides it is being sold."
 CANDNC_the_zollverein_accepted: "The Zollverein Accepted"
 CANDNC_the_zollverein_accepted_desc: "The customs union Laurier refused to Chamberlain in 1902, taken at last: a common outer tariff, free trade inside the Empire, and one voice among many at a table in London. He never signed it."
 CANDNC_the_question_of_the_continent: "The Question of the Continent"
 CANDNC_the_question_of_the_continent_desc: "The water treaty is signed, the department is open, and the thing Ottawa has avoided since Confederation is standing in the middle of the cabinet room. Nobody wants to be the man who answers it."
 CANDNC_the_annexation_manifesto: "The Annexation Manifesto"
 CANDNC_the_annexation_manifesto_desc: "The Montreal document of 1849 is printed again with new names under it. The market is south, the capital is south, and the flag is beginning to look like a freight charge."
 CANDNC_the_british_connection_reaffirmed: "The British Connection"
 CANDNC_the_british_connection_reaffirmed_desc: "Grey gets his answer at last. Both Houses resolve that the Dominion will treat separately with nobody on anything that touches the defence of the Empire, and the resolution is cabled the same night."
 CANDNC_a_republic_on_the_lakes: "A Republic on the Lakes"
 CANDNC_a_republic_on_the_lakes_desc: "Neither Windsor nor Washington. The nationalist press of Montreal and the Grit farmers of the west discover they want the same thing, and there is no King anywhere in it. Nobody ever put it to a vote."
 CANDNC_the_plebiscite_of_the_provinces: "The Plebiscite of the Provinces"
 CANDNC_the_plebiscite_of_the_provinces_desc: "Nine ballots and nine legislatures, one question printed in English and in French. Quebec is voting on whether its schools survive the answer, and knows it."
 CANDNC_flemings_all_red_route: "The All Red Route"
 CANDNC_flemings_all_red_route_desc: "Fast steamers out of Halifax and Vancouver, the Pacific cable already landed at Bamfield, and mail that touches no foreign soil between London and Sydney. Sandford Fleming's line, finished."
 CANDNC_the_constituent_convention: "The Convention at Ottawa"
 CANDNC_the_constituent_convention_desc: "Delegates argue for six weeks over a senate, a supreme court that does not sit in London, and what to call the thing. Bourassa demands the school guarantees in writing before he will take a seat."
 CANDNC_the_forty_ninth_parallel_erased: "The Forty-Ninth Parallel Erased"
 CANDNC_the_forty_ninth_parallel_erased_desc: "The customs houses come down between Emerson and Pembina. Ottawa keeps its parliament and loses its foreign policy, and the Jack comes off the post offices inside a year."
 CANDNC_deakins_standing_council: "The League of Dominions"
 CANDNC_deakins_standing_council_desc: "Deakin asked for it at every conference and Laurier refused every time: a standing council of the self-governing dominions, meeting without the Colonial Office in the chair."
 CANDNC_the_flag_without_a_crown: "The Flag Without a Crown"
 CANDNC_the_flag_without_a_crown_desc: "The oath is struck from the statute book and the Governor General is handed his passage home. London will not concede a republic in North America without first saying something about it."
 CANDNC_the_plan_in_the_drawer: "The Plan in the Drawer"
 CANDNC_the_plan_in_the_drawer_desc: "A militia staff study, twelve pages, no distribution list: flying columns to Albany, Minneapolis and Seattle, held only until the Royal Navy arrives. It stays in the drawer, and the drawer is locked."
 CANDNC_the_border_county_militia: "The Border Counties"
 CANDNC_the_border_county_militia_desc: "Essex, Welland and Stormont get their drill sheds and their ranges, and the farmers who cross to Detroit for work every week are taught to shoot in the direction they came from."
 CANDNC_the_river_batteries_above_quebec: "The River Batteries"
 CANDNC_the_river_batteries_above_quebec_desc: "Guns above Quebec and at the narrows below Montreal, sited by the engineers who took over from the British in 1906. The river that carries every bushel is treated as a frontier for the first time."
 CANDNC_the_lake_flotilla: "The Lake Flotilla"
 CANDNC_the_lake_flotilla_desc: "The agreement of 1817 allows each side one small vessel on each lake. The gunboats are ordered anyway and Washington is left to complain, which is how that arrangement was always going to end."
 CANDNC_esquimalt_without_a_squadron: "Esquimalt Without a Squadron"
 CANDNC_esquimalt_without_a_squadron_desc: "A dockyard with no fleet in front of it is a dockyard waiting for somebody else's. Batteries on the approaches, a base up the coast, and a coal reserve that is not sitting at Nanaimo."
 CANDNC_the_continental_settlement: "The Continental Settlement"
 CANDNC_the_continental_settlement_desc: "Whatever was decided is decided. The border is drawn, the tariff is fixed, the flag is chosen, and the next generation will inherit the quarrel only as something it reads about."
 CANDNC_the_monroe_doctrine_invoked: "Under the Doctrine"
 CANDNC_the_monroe_doctrine_invoked_desc: "Washington's guarantee costs nothing and is worth a fleet. Ottawa stops paying for coast defence and starts paying for elevators, and every chancery in Europe notes where Canada now stands."
 CANDNC_the_two_oceans_alone: "Two Oceans Alone"
 CANDNC_the_two_oceans_alone_desc: "No guarantee from anybody. Halifax, Esquimalt and the river armed on Canadian money, a militia of the whole male population, and a naval estimate that will bring down whoever lays it on the table."
 CANDNC_the_continental_alliance: "The Treaty of Ottawa"
 CANDNC_the_continental_alliance_desc: "A signed alliance instead of a doctrine: joint staff, joint coast defence, and a clause saying neither party makes war in North America without the other. Root drafts it in an afternoon."
 CANDNC_the_borderless_market: "No Customs Line"
 CANDNC_the_borderless_market_desc: "No alliance, no garrison, only the removal of every duty between the lakes and the gulf. The manufacturers of Montreal are given ten years to prepare and told the date is not negotiable."
 CANDNC_the_valcartier_arsenal: "The Arsenal at Quebec"
 CANDNC_the_valcartier_arsenal_desc: "Rifles, shell and cordite made at Valcartier instead of bought at Enfield. A dependent country can be defended but it cannot be armed, and Ottawa decides to learn the difference in peacetime."
 CANDNC_the_continental_staff_talks: "The Staff Talks"
 CANDNC_the_continental_staff_talks_desc: "Officers from Ottawa and Washington sit down over the same maps their predecessors used to plot invasion routes, and settle who holds the lakes if a European fleet ever enters the gulf."
 CANDNC_the_north_atlantic_bridge: "The North Atlantic Bridge"
 CANDNC_the_north_atlantic_bridge_desc: "Halifax, Saint John and Sydney rebuilt as the western end of a sea lane the Admiralty cannot man alone. Canada supplies the hulls, the coal and the crews, and asks for a voice in return."
 CANDNC_the_verdict_of_the_frontier: "The Verdict of the Frontier"
 CANDNC_the_verdict_of_the_frontier_desc: "A generation after the panhandle, the question Laurier spent fifteen years postponing has an answer that can be printed on a map. Nobody in 1900 would have guessed which one."

#Events
 can_dnc_b.1.t: "Two Names Withheld"
 can_dnc_b.1.d: "The instrument of the award lies on the table at the Foreign Office and Alverstone has already signed with the three Americans. Aylesworth tells Jette he will not put his hand to a judgment that was never judged, and Jette agrees with him."
 can_dnc_b.1.a: "Let the record show two blank spaces."
 can_dnc_b.1.b: "Sign it, and remember it."
 can_dnc_b.2.t: "Tidewater"
 can_dnc_b.2.d: "The field force is camped above Skagway with two Maxims and a customs flag, and the American collector has wired Washington twice since Tuesday. Four hundred men on the beach, and no instruction from Ottawa about what happens next."
 can_dnc_b.2.a: "Hold the ground and let them protest."
 can_dnc_b.2.b: "Fall back to the summits before somebody fires."
 can_dnc_b.3.t: "Canadian Troops on the Beach"
 can_dnc_b.3.d: "The War Department reports armed men of the Dominion militia inside the disputed zone at the head of the Lynn Canal. The President is reminded that he ordered troops to that coast himself, and that the tribunal has not yet reported."
 can_dnc_b.3.a: "Send the infantry north."
 can_dnc_b.3.b: "Let the lawyers finish first."
 can_dnc_b.4.t: "The Colonial Office Replies"
 can_dnc_b.4.d: "The despatch is courteous and immovable. No dominion has ever held a plenipotentiary commission; His Majesty's ambassador at Washington signs for the whole Empire, and the Dominion may advise him as often as it pleases."
 can_dnc_b.4.a: "Advise him that we will not be advised."
 can_dnc_b.4.b: "Let Bryce hold the pen."
 can_dnc_b.5.t: "Ottawa Gives Washington Thirty Days"
 can_dnc_b.5.d: "The note demands bonded Canadian traffic through the inlet inside the month. It was handed over without London being told, and the cable to the Colonial Office arrived after the newspapers did."
 can_dnc_b.5.a: "The frontier has a garrison at last."
 can_dnc_b.5.b: "The Dominion has forgotten who defends it."
 can_dnc_b.5.c: "Two English-speaking nations and one cold shore."
 can_dnc_b.6.t: "The Draft Convention"
 can_dnc_b.6.d: "Fielding brings back schedules initialled in Washington: grain, lumber, fish and cattle free both ways, implements cut. Every line of it buys a farmer and sells a manufacturer, and the House meets in five weeks."
 can_dnc_b.6.a: "Table it and let the country decide."
 can_dnc_b.6.b: "Keep it in the safe until after the election."
 can_dnc_b.7.t: "No Truck nor Trade"
 can_dnc_b.7.d: "Eighteen Toronto men who have voted Liberal all their lives sign the same manifesto as the lodges. The Mail and Empire prints the union in colour on the front page, and the word annexation is in every second paragraph."
 can_dnc_b.7.a: "Face them down from the platform."
 can_dnc_b.7.b: "Withdraw the schedules and say nothing more."
 can_dnc_b.8.t: "The Manifesto Reprinted"
 can_dnc_b.8.d: "The Montreal document of 1849 comes off the press again with new names beneath it. The signatures are not merchants this time but grain men, editors and two members of the House, and not one has been asked to withdraw."
 can_dnc_b.8.a: "Let it circulate and see who signs."
 can_dnc_b.8.b: "Have the printers before a magistrate."
 can_dnc_b.9.t: "The Provinces Vote"
 can_dnc_b.9.d: "Nine ballots and one question, printed in English and in French. Quebec votes on whether its schools survive the answer, the Maritimes on whether the freight rate falls, Ontario on whether it can bear a foreign capital."
 can_dnc_b.9.a: "The count is the count."
 can_dnc_b.9.b: "A dominion cannot vote itself away."
 can_dnc_b.9.c: "The map of North America is redrawn by a show of hands."
 can_dnc_b.10.t: "Six Weeks at Ottawa"
 can_dnc_b.10.d: "The delegates cannot agree on a senate, on a supreme court that does not sit in London, or on a name. Bourassa will not take his seat until the school guarantees are in the text, and the western men want their resources back."
 can_dnc_b.10.a: "A federation, with the provinces guaranteed."
 can_dnc_b.10.b: "One legislature and one law."
 can_dnc_b.11.t: "Twelve Pages, No Distribution List"
 can_dnc_b.11.d: "The study is bound in grey card and marked for the minister alone. Flying columns to Albany, Minneapolis and Seattle; hold what can be held until the Royal Navy is in the gulf; burn the bridges behind you coming home."
 can_dnc_b.11.a: "Put it back in the drawer."
 can_dnc_b.11.b: "Send officers to look at the ground."

#Ideas
 CAN2B_demand_for_treaty_power: "The Demand for the Treaty Power"
 CAN2B_demand_for_treaty_power_desc: "Every despatch from Ottawa now ends with the same paragraph. The country that could not defend its own coast in a courtroom intends to be heard the next time, and says so in writing to Whitehall."
 CAN2B_the_unsigned_award: "The Unsigned Award"
 CAN2B_the_unsigned_award_desc: "Two blank spaces on a legal instrument are worth nothing in law and a great deal in politics. Every schoolroom map of the panhandle is now a recruiting poster."
 CAN2B_branch_plant_economy: "The Branch Plant Economy"
 CAN2B_branch_plant_economy_desc: "The plants go up fast because somebody else drew the plans, tooled the line and owns the patent. Ontario gets the payroll, Detroit gets the drawings, and nobody here learns to design anything."
 CAN2B_the_wall_at_the_river: "The Wall at the River"
 CAN2B_the_wall_at_the_river_desc: "No foreign charter, no foreign bounty, no foreign director. The mills that are built are Canadian and there are fewer of them, and every board of trade west of Kingston says so at every annual meeting."
 CAN2B_imperial_preference_deepened: "The Deepened Preference"
 CAN2B_imperial_preference_deepened_desc: "A third off the general rate for the mother country, given freely and asked of no one. It buys goodwill in London that cannot be spent anywhere else, and it makes every American quotation dearer."
 CAN2B_continental_reciprocity: "Reciprocity"
 CAN2B_continental_reciprocity_desc: "Grain, lumber, fish and cattle move across the line without a duty. The farmer is richer by the season and the manufacturer of Montreal counts the years he has left."
 CAN2B_the_lumber_war: "The Lumber War"
 CAN2B_the_lumber_war_desc: "The New York papers have found a cause and the Canadian mills have found a customer who will not pay. Every ton of newsprint crossing the line is now argued over by two governments."
 CAN2B_the_american_guarantee: "The American Guarantee"
 CAN2B_the_american_guarantee_desc: "The coast is defended by a fleet that flies another flag and costs nothing. The saving is real, and so is the discovery that a country protected by somebody else stops arguing with them."
 CAN2B_armed_north: "Armed and Alone"
 CAN2B_armed_north_desc: "Two coasts, one river and a frontier of four thousand miles, all of it paid for out of a revenue of seventy millions. The estimates are read out to a silent House every spring."

#Threats, bonuses and tooltips
 CAN2B_alaska_grievance: "The Alaska Grievance"
 CAN2B_panhandle_ultimatum: "The Panhandle Ultimatum"
 CAN2B_continental_union_threat: "The Continental Union"
 CAN2B_republic_proclaimed_threat: "The Republic Proclaimed"
 CAN2B_frontier_reconnaissance: "Officers on the Frontier"
 CAN2B_boundary_waters_bonus: "Waterworks of the Boundary"
 CAN2B_river_batteries_bonus: "Gunnery of the River"
 CAN2B_lake_flotilla_bonus: "Gunboats for the Lakes"
 CAN2B_valcartier_arsenal_bonus: "Small Arms at Quebec"
 CAN2B_frontier_verdict_bonus: "Industry of a Settled Frontier"
 CAN2B_lakes_frontier_doctrine: "Scheme for the Lakes Frontier"
 CAN2B_frontier_plan_doctrine: "The Frontier Study"
 CAN2B_question_of_the_continent_tt: "The cabinet must answer at last: Washington, London, or neither."
 CAN2B_continental_settlement_tt: "The border, the tariff and the flag are settled for a generation."
 CAN2B_verdict_of_the_frontier_tt: "The frontier question is closed, and the answer is printed on the map."
 CAN2B_republican_party: "Republicans"
 CAN2B_republican_party_long: "Republican Party of Canada"
 CAN2B_continental_league: "Continental League"
