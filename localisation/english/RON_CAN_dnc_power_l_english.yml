 CAN_r_the_contingent_sails:0 "The Contingent Sails"
 CAN_r_the_contingent_sails_desc:0 "Strathcona's Horse sails for the war under the imperial flag. Recruiting offices are full in Toronto and quiet in Montreal."
 CAN_r_the_defence_estimates:0 "The Defence Estimates"
 CAN_r_the_defence_estimates_desc:0 "The Admiralty has named the price of the imperial shield and the Treasury finds it. A line in the budget buys the Empire's gratitude and costs the Dominion its spare change."
 CAN_r_canadian_crews_admiralty_hulls:0 "Canadian Crews on Admiralty Hulls"
 CAN_r_canadian_crews_admiralty_hulls_desc:0 "Canadian seamen take Admiralty ships at Halifax, paid from Ottawa and commanded from London. The Dominion earns its place in the line without a fleet of its own."
 CAN_r_the_tariff_reform_wait:0 "Waiting on Birmingham"
 CAN_r_the_tariff_reform_wait_desc:0 "Our tariff rides on a British election no Canadian may vote in. The government can only wait, and the manufacturers only worry."
 CAN_r_the_squadron_on_station:0 "The Squadron on Station"
 CAN_r_the_squadron_on_station_desc:0 "The imperial squadron keeps its coal, its dockyard and its guns at Halifax, and Ottawa pays the upkeep. The finest fleet afloat, rented by the year."
 CAN_r_the_libel_suits:0 "The Libel Suits"
 CAN_r_the_libel_suits_desc:0 "Asselin is prosecuted and his paper comes out late and thin. Every issue sells out on rue Saint-Denis."
 CAN_r_the_sydney_contracts:0 "The Sydney Contracts"
 CAN_r_the_sydney_contracts_desc:0 "With imperial orders on the books, the furnaces at Sydney roll armour plate instead of rails. Cape Breton coal and Bell Island ore feed a war industry the Empire pays for."
 CAN_r_the_french_battalions:0 "The French Battalions"
 CAN_r_the_french_battalions_desc:0 "French Canada serves the Empire in its own language, officered by its own and sworn to the King."
 CAN_r_the_imperial_tercentenary:0 "The Tercentenary Pageant"
 CAN_r_the_imperial_tercentenary_desc:0 "Champlain lands again below the Citadel with a British squadron in the basin. Three centuries of French Quebec are dressed in the Empire's colours."
 CAN_r_the_empires_nerves:0 "The Empire's Nerves"
 CAN_r_the_empires_nerves_desc:0 "The Pacific cable and the Marconi station at Glace Bay put two of the Empire's nerves in Canadian hands. Messages from London to Australia pass through Ottawa's keeping."
 CAN_r_the_payne_aldrich_ultimatum:0 "The Payne-Aldrich Ultimatum"
 CAN_r_the_payne_aldrich_ultimatum_desc:0 "Washington threatens its maximum column against any country that favours another, and the imperial preference is exactly that. The Dominion stands by the Empire and pays in trade."
 CAN_r_the_imperial_yards:0 "The Imperial Yards"
 CAN_r_the_imperial_yards_desc:0 "Vickers comes to Montreal and the Admiralty to Halifax. The first plates cut in Canada for a King's ship are cut here, and the skilled trades come with them."
 CAN_r_the_empire_settlement_scheme:0 "The Empire Settlement"
 CAN_r_the_empire_settlement_scheme_desc:0 "Assisted passages, free homestead land and a bonus for every family out of the British Isles, with the imperial exchequer paying half the fare."
 CAN_r_the_doukhobor_villages:0 "The Doukhobor Villages"
 CAN_r_the_doukhobor_villages_desc:0 "The villages hold their land in common and swear no oath. The letter of the homestead law is bent to keep the settlers the West so badly needs."
 CAN_r_the_western_gate:0 "The Western Gate"
 CAN_r_the_western_gate_desc:0 "Canadian garrison artillery holds the batteries above Esquimalt and the Pacific dockyard is open again. The guns face west, toward whatever is coming across that ocean."
 CAN_r_the_empires_reservoir:0 "The Empire's Reservoir"
 CAN_r_the_empires_reservoir_desc:0 "The Dominion is the manpower of the Empire in fact as well as in speeches. Every militia roll is an imperial roll, and every budget a contribution."
 CAN_r_the_reserve_called_out:0 "The Reserve Called Out"
 CAN_r_the_reserve_called_out_desc:0 "The naval reserve mans the squadron in the basin, and the fishermen of two coasts answer the Admiralty's signal before their own government's."
 CAN_dnc_c_continental_market:0 "The Continental Market"
 CAN_dnc_c_continental_market_desc:0 "Every schedule signed in Washington pulls the country's trade a little further south. The market grows with each step; so does Washington's hand on our terms."
 CAN_r_c_continental_market_opens_tt:0 "§YThe Continental Market§! opens: its modifiers grow with every continental focus"
 CAN_r_c_panhandle_claim_dropped_tt:0 "Our claim on the §YPanhandle§! is withdrawn for good"
 CAN_r_c_loyalist_anger_one_tt:0 "§RLoyalist anger§! rises by §R1§!"
 CAN_r_c_loyalist_calm_one_tt:0 "§GLoyalist anger§! falls by §G1§!"
 CAN_r_c_fracture_plus_one_tt:0 "§RThe fracture between the two Canadas§! widens by §R1§!"
 CAN_r_c_fracture_plus_two_tt:0 "§RThe fracture between the two Canadas§! widens by §R2§!"
 CAN_r_c_fracture_minus_one_tt:0 "§GThe fracture between the two Canadas§! narrows by §G1§!"
 CAN_r_c_window_on_the_pacific_tt:0 "Prince Rupert is the Dominion's §Ywindow on the Pacific§!"
 CAN_r_c_bridge_collapse_tt:0 "The span folds into the St Lawrence: §Rinfrastructure in Quebec is damaged§! before the rebuilding begins"
 CAN_r_c_lodges_in_the_street_tt:0 "§RThe lodges are in the street§!: the loyalist anger is already past bearing"
 CAN_r_c_dominions_offended_tt:0 "Every other Dominion of the Crown takes offence"
 CAN_r_c_dominions_reassured_tt:0 "The other Dominions of the Crown are reassured"
 CAN_r_c_loyalists_stand_down_tt:0 "§GThe Orange lodges stand down§!; Ontario is no longer roused against us"
 CAN_r_c_double_majority_costs_tt:0 "§RThe double majority§! promised to Quebec costs the Yes vote §R10§!"
 CAN_r_c_double_majority_tt:0 "Quebec is promised a §Ydouble majority§!: the Yes vote will pay for it on the night"
 CAN_r_c_unions_for_yes_tt:0 "The international unions campaign for Yes: §G+5§! to the Yes vote"
 CAN_r_c_growers_for_yes_tt:0 "The Grain Growers campaign for Yes: §G+5§! to the Yes vote"
 CAN_r_c_lodges_against_tt:0 "The Orange lodges campaign for No: §R-5§! to the Yes vote"
 CAN_r_c_the_west_is_ready_tt:0 "The American West is ready for the question"
 CAN_r_c_market_folded_tt:0 "§YThe Continent Is the Market§! is folded into the settled spirit of the Dominion"
 CAN_r_c_us_army_mission_tt:0 "An §YAmerican army mission§! will be received at Ottawa"
 CAN_r_c_fort_william_idle_tt:0 "§RThe elevators at Fort William stand empty§!"
 CAN_r_c_stones_through_windows_tt:0 "§RStones go through windows in the loyalist towns of Ontario§!"
 CAN_r_c_debt_assumed_tt:0 "Washington offers to assume the §YDominion debt§! under the terms"
 CAN_r_c_washington_asked_again_tt:0 "Washington is asked for the natural products schedule alone"
 CAN_r_c_guarantee_steadies_tt:0 "§GWashington's guarantee§! steadies the country while London decides"
 CAN_r_c_french_clauses_tt:0 "The §YFrench clauses§! of the terms will cost votes on the Hill"
 CAN_r_c_english_clauses_tt:0 "The §YEnglish terms§! please the Senate and enrage Quebec"
 CAN_r_c_conciliation_holds_tt:0 "The §GLemieux Act§! keeps the international strikes off the street"
 CAN_r_c_fortresses_garrisoned_tt:0 "The Militia Department raises its own §Ygarrison artillery§! at Halifax and Esquimalt"
 CAN_r_c_hydro_at_niagara_tt:0 "The shared waters of §YNiagara§! may be harnessed for Ontario's power"
 CAN_r_c_cobalt_on_broad_street_tt:0 "The silver camps will answer to §YNew York§! promoters"
 CAN_r_c_whitney_hydro_tt:0 "Whitney's answer to the continental course is §Ypublic power§! for Ontario"
 CAN_r_c_west_for_union_tt:0 "The prairie, filled with Americans, already leans south"
 CAN_r_c_unrestricted_reciprocity_bonus:0 "Unrestricted Reciprocity"
 CAN_r_c_the_dollar_comes_north_bonus:0 "The Dollar Comes North"
 CAN_r_c_natural_products_bonus:0 "The Treaty of Natural Products"
 CAN_r_c_dingley_wall_bonus:0 "The Dingley Wall"
 CAN_r_c_hays_line_bonus:0 "Hays's Line"
 CAN_r_c_international_unions_bonus:0 "The International Unions"
 CAN_r_c_hills_lines_bonus:0 "Hill's Lines"
 CAN_r_c_north_coast_port_bonus:0 "The North Coast Port"
 CAN_r_c_american_settlers_bonus:0 "The Last Best West"
 CAN_r_c_quebec_bridge_bonus:0 "The Quebec Bridge Inquiry"
 CAN_r_c_cobalt_silver_bonus:0 "The Silver of Cobalt"
 CAN_r_c_grain_growers_bonus:0 "The Grain Growers' Company"
 CAN_r_c_portland_line_bonus:0 "The Portland Line"
 CAN_r_c_sintaluta_bonus:0 "The Sintaluta Judgment"
 CAN_r_c_fortresses_bonus:0 "The Fortresses Are Ottawa's"
 CAN_r_c_customs_union_bonus:0 "The Customs Union"
 CAN_r_c_boundary_waters_bonus:0 "The Boundary Waters Treaty"
 CAN_r_c_reciprocity_again_bonus:0 "Reciprocity without the Union"
 CAN_r_c_continental_dominion_bonus:0 "The Continental Dominion"
 CAN_r_c_continental_rails_bonus:0 "Rails of the Continental Dominion"
 CAN_r_c_junior_partner_bonus:0 "A Common Defence"
 CAN_r_c_grain_by_duluth_bonus:0 "Grain by Duluth"
 CAN_r_swallowing_alverstone:0 "Swallowing the Award"
 CAN_r_swallowing_alverstone_desc:0 "The tribunal has given the Panhandle away and the Government has thanked it. English Canada is not grateful; Washington is."
 CAN_r_the_investment_rush:0 "The Investment Rush"
 CAN_r_the_investment_rush_desc:0 "American capital is pouring over the line to sit behind our tariff. Plants rise quickly; the profits go home by the same road."
 CAN_r_the_one_point_surtax:0 "The One-Point Surtax"
 CAN_r_the_one_point_surtax_desc:0 "A single point on the general tariff, raised in answer to Congress, and a note in the House that the door is bolted, not bricked."
 CAN_r_the_pacific_wager:0 "The Pacific Wager"
 CAN_r_the_pacific_wager_desc:0 "A harbour on Kaien Island, laid out for the trade of Asia before the rails have reached it. The Dominion's credit is staked on the Pacific."
 CAN_r_the_idle_lake_fleet:0 "The Idle Lake Fleet"
 CAN_r_the_idle_lake_fleet_desc:0 "The lake boats lie at Port Arthur with nothing to carry. The crop goes south by rail, and the Montreal houses have written the West off their ledgers."
 CAN_r_the_royal_commission_on_the_bridge:0 "The Royal Commission on the Bridge"
 CAN_r_the_royal_commission_on_the_bridge_desc:0 "Engineers from three countries sit over the wreck at Quebec. Every Dominion work is checked twice while they sit, and the lesson is dearly bought."
 CAN_r_the_cobalt_rush:0 "The Cobalt Rush"
 CAN_r_the_cobalt_rush_desc:0 "Silver on the Temiskaming grade, and every train north is full. The camps are lawless, the ore is rich, and the shares are traded in New York."
 CAN_r_the_winter_trade_through_maine:0 "The Winter Trade through Maine"
 CAN_r_the_winter_trade_through_maine_desc:0 "While the Maritimes sit in ice, our winter exports leave by Portland. The Grand Trunk is pleased; Halifax and Saint John are not."
 CAN_r_the_doctrine_asked:0 "The Doctrine Asked"
 CAN_r_the_doctrine_asked_desc:0 "We have asked the White House whether the eagle shelters us. While it decides, the naval estimates are held back and the imperialists howl."
 CAN_r_the_upkeep_of_the_fortresses:0 "The Upkeep of the Fortresses"
 CAN_r_the_upkeep_of_the_fortresses_desc:0 "Halifax and Esquimalt are ours, with their guns, their barracks and their bills. The Militia learns to keep a fortress, and the Treasury learns what one costs."
 CAN_r_the_orange_cry:0 "No Truck nor Trade"
 CAN_r_the_orange_cry_desc:0 "The lodges have raised the old cry and Ontario has answered it. The province that pays the tariff will not be sold to Washington without a fight."
 CAN_r_the_riot_on_the_coast:0 "The Riot on the Coast"
 CAN_r_the_riot_on_the_coast_desc:0 "Powell Street is broken glass and Tokyo is asking questions. The coast has had its riot, and the statute that follows is copied from California."
 CAN_r_the_reserved_bill:0 "The Reserved Bill"
 CAN_r_the_reserved_bill_desc:0 "The Colonial Office reserved the bill and we repealed it ourselves. The veto stands, the Commons knows it, and the Government has chosen to bow."
 CAN_r_the_painter_cut:0 "The Painter Cut at Ottawa"
 CAN_r_the_painter_cut_desc:0 "The summons from London lies unanswered on the table. A Parliament that sets its own tariff has made itself, and the Empire must decide what to do about it."
 CAN_r_the_last_question:0 "The Last Question"
 CAN_r_the_last_question_desc:0 "The Cabinet sits past midnight on how a country that has stopped being a colony is to stop being a country. Every paper in the Dominion knows the question is open."
 CAN_r_the_lodges_stand_down:0 "The Lodges Stand Down"
 CAN_r_the_lodges_stand_down_desc:0 "Queen's Park has been told the Crown stays and the flag stays, and has chosen to believe it. The loyalist storm blows itself out over Ontario."
 CAN_r_the_ballot_is_printed:0 "The Ballot Is Printed"
 CAN_r_the_ballot_is_printed_desc:0 "One line on a ballot and a simple majority to decide it. Until the polls close, nothing else in the Dominion can be governed."
 CAN_r_over_the_heads_of_the_voters:0 "Over the Heads of the Voters"
 CAN_r_over_the_heads_of_the_voters_desc:0 "Two governments negotiate the end of a country the way Texas once did, and the people are not asked. The bargain may be good; the method will not be forgiven."
 CAN_r_the_threshold_not_crossed:0 "The Threshold Not Crossed"
 CAN_r_the_threshold_not_crossed_desc:0 "Free trade, a common defence and an American guarantee, and the flag over the East Block never lowered. The junior partner of a giant, and still unmistakably Canada."
 CAN_r_the_union_campaign:0 "The Union Campaign"
 CAN_r_the_union_campaign_desc:0 "Six months of tents and halls from Sydney to Victoria. Bourassa has Quebec, the lodges have Ontario, the Grain Growers have the prairie, and the Government has no peace."
 CAN_r_the_commissioners_abroad:0 "The Commissioners Abroad"
 CAN_r_the_commissioners_abroad_desc:0 "Our commissioners argue on Pennsylvania Avenue over the debt, the treaties and the schools. The country is bargained clause by clause, and the country is not in the room."
 CAN_r_the_country_holds_its_breath:0 "The Country Holds Its Breath"
 CAN_r_the_country_holds_its_breath_desc:0 "The returning officers wire Ottawa through the night, the prairie first and the Maritimes last. Nothing is decided until the count is in."
 CAN_r_sixty_days_on_the_hill:0 "Sixty Days on the Hill"
 CAN_r_sixty_days_on_the_hill_desc:0 "The fate of the Dominion rests with a chamber in which Canada has no voice. Our commissioners sit in the gallery and count senators."
 can_dnc_r.301.t:0 "The Award Read in the House"
 can_dnc_r.301.d:0 "The clerk reads the tribunal's award into the record and the Government moves that it be received without debate. The opposition benches want to know whether the Chief Justice of England was paid in dollars, and whether Ottawa means to say nothing at all."
 can_dnc_r.301.a:0 "We signed. There is nothing more to say."
 can_dnc_r.301.b:0 "Let the House say of London what the Government cannot."
 can_dnc_r.302.t:0 "The Manufacturers Protest"
 can_dnc_r.302.d:0 "The Canadian Manufacturers' Association comes to Ottawa with a memorial as long as a tariff schedule. The farm has its American market; the factory wants to know what it is to get for the wall it has just watched lowered on every side but its own."
 can_dnc_r.302.a:0 "The schedule stands. The farm has waited long enough."
 can_dnc_r.302.b:0 "Give the manufacturers a drawback on their machinery."
 can_dnc_r.303.t:0 "The Contract with Hays"
 can_dnc_r.303.d:0 "Hays wants the Dominion to build the eastern division from Moncton to Winnipeg, lease it to the Grand Trunk for a song, and guarantee the bonds of the mountain section besides. The Finance Minister observes that the country is being asked to underwrite a railway it will never own."
 can_dnc_r.303.a:0 "Guarantee the bonds. The line must be built."
 can_dnc_r.303.b:0 "Hays finds his own money, or he does not build."
 can_dnc_r.304.t:0 "Hill Comes to Ottawa"
 can_dnc_r.304.d:0 "James J. Hill sits in the Railway Committee room with a map of the border and a list of charters he wants for branch lines north of it. He promises rates the Canadian Pacific cannot match and elevators at every siding. He does not promise that the grain will ever come back."
 can_dnc_r.304.a:0 "Grant the charters."
 can_dnc_r.304.b:0 "The Railway Commission will set his rates."
 can_dnc_r.305.t:0 "The Tsimshian Land"
 can_dnc_r.305.d:0 "The harbour on Kaien Island sits on land the Tsimshian have fished from for longer than there has been a Dominion. The Grand Trunk wants the reserve cleared for its townsite; the Indian Department wants to know who is to pay for it."
 can_dnc_r.305.a:0 "Pay for Kaien Island, and pay fairly."
 can_dnc_r.305.b:0 "The harbour is a Dominion work. Take it."
 can_dnc_r.306.t:0 "Fort William Stands Empty"
 can_dnc_r.306.d:0 "The lake season opens and the elevators at the Lakehead are half full. The boats that should be carrying the crop to Montreal lie at Port Arthur, and the owners ask the Government whether it means to let the Canadian route die."
 can_dnc_r.306.a:0 "Subsidise the lake boats."
 can_dnc_r.306.b:0 "Let the lake fleet find other cargo."
 can_dnc_r.307.t:0 "The Promoters of New York"
 can_dnc_r.307.d:0 "The Cobalt shares are traded on Broad Street before the Toronto exchange has heard of half the claims. The promoters want the Ontario royalty waived for a term of years; the province wants its cut of every ounce that crosses the line."
 can_dnc_r.307.a:0 "Let the shares trade on Broad Street."
 can_dnc_r.307.b:0 "A Dominion royalty on every ounce."
 can_dnc_r.308.t:0 "Blair Resigns"
 can_dnc_r.308.d:0 "The Minister of Railways will not put his name to a winter terminus in Maine. He walks out of Council with his resignation written, and the Maritime members ask whether the Government has any further use for the provinces down by the sea."
 can_dnc_r.308.a:0 "Accept the resignation."
 can_dnc_r.308.b:0 "Beg him to stay at Railways."
 can_dnc_r.309.t:0 "The Last Redcoats March Out"
 can_dnc_r.309.d:0 "The Royal Garrison Artillery parades for the last time on the Citadel and the Imperial flag comes down over Esquimalt. The Militia Department now has two fortresses, sixty heavy guns, and very few men who have ever fired one."
 can_dnc_r.309.a:0 "Keep the Royal gunners on contract for a season."
 can_dnc_r.309.b:0 "Canadians will man Canadian guns."
 can_dnc_r.310.t:0 "Bryce Holds the Pen"
 can_dnc_r.310.d:0 "The Boundary Waters Treaty is Gibbons's work from first clause to last, and the British Ambassador signs it. The papers ask why a treaty about our own rivers carries no Canadian name, and the Prime Minister has no good answer."
 can_dnc_r.310.a:0 "Swallow it. The treaty is a good one."
 can_dnc_r.310.b:0 "Next time a Canadian signs, or nobody does."
 can_dnc_r.311.t:0 "Quebec Asks for Its Own Count"
 can_dnc_r.311.d:0 "Bourassa rises in the Commons with a simple proposal: that no province be voted out of its country by the majority of another. A double majority, he says, or the French Canadians will treat the ballot as a fraud. The English members call it a veto by the back door."
 can_dnc_r.311.a:0 "One country, one count."
 can_dnc_r.311.b:0 "No province shall be voted out of its country against its will."
 can_dnc_r.312.t:0 "The Cabinet Stops at the Threshold"
 can_dnc_r.312.d:0 "The draft of the ballot lies on the Council table and nobody reaches for it. Free trade, a common defence and an American guarantee are enough, the Prime Minister says; the flag over the East Block stays where it is. Some ministers look relieved. Some look as if they had been cheated."
 can_dnc_r.312.a:0 "Canada stays Canada."
 can_dnc_r.312.b:0 "Leave the door open a crack."
 can_dnc_r.313.t:0 "The Empire Club Dinner"
 can_dnc_r.313.d:0 "The Prime Minister tells the Empire Club that a Dominion may face two ways at once and be loyal in both. The toast to the King is drunk standing, and the toast to the American market is drunk sitting, and the room cannot decide which it meant more."
 can_dnc_r.313.a:0 "Loyal in both directions."
 can_dnc_r.313.b:0 "Let them grumble. The ledger is what matters."
 CAN_r_crown_leaves_tt:0 "§YThe Crown leaves the country quietly§!: the Dominion ends, and Ottawa signs in its own name"
 CAN_r_ledger_step_tt:0 "§YThe Continental Ledger§!: factory output §G+3%§!, consumer goods §G-1%§!, trade opinion §G+5%§!, political power §R-3%§!"
 CAN_r_ledger_unwind_tt:0 "§YThe Continental Ledger§!: political power §G+5%§!, trade opinion §R-5%§!"
 CAN_r_ledger_settled_tt:0 "§YThe Continental Ledger§!: the political price is settled — the malus on political power is wiped"
 CAN_r_ledger_closed_tt:0 "§YThe Continental Ledger§! is closed with the country"
 CAN_r_address_to_congress_tt:0 "§YThe address goes to Congress§! with the poll of every county attached"
 CAN_r_prairie_carries_the_address_tt:0 "The prairie counties carry the address: the §YYes§! share rises"
 CAN_r_no_crown_to_object_tt:0 "There is no Crown left to object: the §YYes§! share rises"
 CAN_r_prairie_secession_tt:0 "§RThe prairie petitions Washington over our heads§!"
 CAN_r_prairie_already_american_tt:0 "The prairie is already American in everything but the flag: the §YYes§! share rises"
 CAN_r_federal_money_arrives_tt:0 "§GFederal money arrives in every state§!: infrastructure in each core state"
 CAN_r_junior_partner_by_default_tt:0 "§RThe Senate would not have us§!: independent in name, American in every fact that matters"
 CAN_r_northern_associate_tt:0 "§YThe Northern Associate§!: an independent Canada inside the American customs line and under the American guarantee"
 CAN_r_one_dollar_tt:0 "§YOne dollar for the continent§!: every till and treasury counts in the American dollar"
 CAN_r_banks_protest_tt:0 "§RThe Bank of Montreal protests§! that its note issue is its lifeblood"
 CAN_r_banks_will_answer_tt:0 "§YThe chartered banks will answer§! the offer of national charters"
 CAN_r_border_states_tt:0 "§GThe posts come down along the line§!: infrastructure in the border provinces"
 CAN_r_hills_lines_absorbed_tt:0 "§YHill's lines are absorbed§! into the Wall Street system"
 CAN_r_proceeds_of_the_sale_tt:0 "§YThe proceeds of the sale§! must be allotted"
 CAN_r_continental_division_tt:0 "§YA new division template§!: the Continental Division, on the American pattern"
 CAN_r_us_army_mission_available_tt:0 "§YThe United States Army Mission§! becomes available as a theorist"
 CAN_r_customs_union_kept_tt:0 "§YThe customs union stands§!: prosperity without absorption"
 CAN_r_two_flags_tt:0 "§YA Continent, Two Flags§!: one market, one dollar, one open border — and two parliaments"
 CAN_r_alaska_claim_dropped_tt:0 "§YOur claim on the Alaska Panhandle is withdrawn§!"
 CAN_r_alaska_standoff_ends_tt:0 "§GThe stand-off on the Alaska line ends§!"
 CAN_r_treaty_of_relations_tt:0 "§YThe Treaty of Relations§!: their guarantee against any power beyond the seas, our promise to contract no alliance without their consent"
 CAN_r_no_alliance_without_consent_tt:0 "§RWe may neither create nor join a faction§! while the consent clauses stand"
 CAN_r_garrisons_raised_tt:0 "§GTwo garrison brigades are raised§! at Halifax and Esquimalt"
 CAN_r_garrisons_argue_for_us_tt:0 "§GThe garrisons argue for us§!: the league cannot call a coast we man ourselves a leash"
 CAN_r_dockyard_argues_against_us_tt:0 "§RThe leased dockyard argues against us§!: the league points at the stars and stripes over Esquimalt"
 CAN_r_league_must_be_answered_tt:0 "§YThe league must be answered§!"
 CAN_r_leash_to_ladder_tt:0 "§YThe leash becomes a ladder§!: the Treaty of Relations is offered up as the first installment of union"
 CAN_r_lease_reopened_tt:0 "§YThe Esquimalt lease is reopened§!: docking rights are withdrawn"
 CAN_r_debt_refunded_tt:0 "§GThe debt is refunded in our own name§!"
 CAN_r_guarantee_outgrown_tt:0 "§YThe Guarantee Outgrown§!: the guarantee survives as an alliance, the consent clauses are ash"
 CAN_r_consent_clauses_burned_tt:0 "§GWe may again create and join factions§!"
 CAN_r_north_votes_together_tt:0 "§YThe North votes together§!: wheat, waterways, the tariff on implements, the Quebec clause"
 CAN_r_loyalists_calmed_tt:0 "§GThe roused loyalists of Ontario stand down§!"
 CAN_r_ships_chartered_tt:0 "§YThe ships are chartered§!: assisted passage for those who cannot live under the stars"
 CAN_r_entrenchment_precedent_tt:0 "§GThe schools guarantee is a precedent the court must weigh§!"
 CAN_r_provincial_precedent_tt:0 "§RThe provincial schools settlement is a precedent against us§!"
 CAN_r_long_way_tt:0 "§YThe long way to the union§!: the delegations merge, the schedules become statutes, admission is voted province by province"
 CAN_r_admission_by_province_tt:0 "§YAdmission is open§!: each province asks in its own season, and the §YYes§! share rises"
 CAN_r_president_north_tt:0 "§YA President from the North§!: the republic we joined now answers, in part, to us"
 CAN_r_installments_complete_tt:0 "§GThe installments are complete§!"
 CAN_r_northern_states_vote_as_one_tt:0 "§YThe northern states vote as one§!"
 CAN_r_no_canadian_party_tt:0 "§GThere is no Canadian party for the nativists to point at§!"
 CAN_r_colours_laid_up_tt:0 "§YThe old regiments' colours are laid up with honour§!"
 CAN_r_newfoundland_delegation_tt:0 "§YThe Newfoundland delegation§! is received in Ottawa and its case carried to Washington"
 CAN_r_arbitration_written_in_tt:0 "§YArbitration is written in for every quarrel§!: neither partner can cheaply leave"
 CAN_r_northern_program_tt:0 "§GThe northern program§!: an extra building slot in every northern state"
 CAN_r_american_patterns_bonus:0 "American Patterns"
 CAN_r_branch_plant_patterns_bonus:0 "Branch Plant Patterns"
 CAN_r_the_continental_dollar_bonus:0 "The Continental Dollar"
 CAN_r_a_generation_ahead_bonus:0 "A Generation Ahead"
 CAN_r_two_flags_bonus:0 "A Continent, Two Flags"
 CAN_r_our_own_credit_bonus:0 "Canada's Own Credit"
 CAN_r_her_own_name_army_bonus:0 "Her Own Name Among Nations"
 CAN_r_her_own_name_navy_bonus:0 "Her Own Name at Sea"
 CAN_r_committee_chairs_bonus:0 "The Committee Chairs"
 CAN_r_the_norths_program_bonus:0 "The North's Program"
 CAN_dnc_continental_ledger:0 "The Continental Ledger"
 CAN_dnc_continental_ledger_desc:0 "Every schedule, charter and open post binds the two economies a little closer. The market grows; the treasury answers to it."
 can_dnc_r.351.t:0 "The Crown Leaves Quietly"
 can_dnc_r.351.d:0 "Rideau Hall is shut and the King's name has come off the Canadian writs without a shot or a speech. The Colonial Office must decide how the Empire treats a child that has simply walked out of the house — and what the other dominions are to read in its answer."
 can_dnc_r.351.a:0 "The Empire does not keep its children by force"
 can_dnc_r.351.b:0 "Strike them from the preference and the loan lists"
 can_dnc_r.351.c:0 "Recall every officer, close every dockyard"
 can_dnc_r.352.t:0 "Newfoundland Asks to Follow"
 can_dnc_r.352.d:0 "St. John's has watched Ottawa's continental terms and wants them, and Ottawa asks London to let the oldest colony pass under its wing. The Colonial Office weighs a loyal island against a continental system it can no longer shape."
 can_dnc_r.352.a:0 "Let the oldest colony follow the eldest"
 can_dnc_r.352.b:0 "Newfoundland stays a Crown colony"
 can_dnc_r.353.t:0 "The League Fills the Theatres"
 can_dnc_r.353.d:0 "Bourassa's nationalists and the Orange lodges share a platform for the first time in living memory, and the platform is against the Treaty of Relations. The government must answer them from the stage, clear the halls, or concede the argument."
 can_dnc_r.353.a:0 "Answer them from the platform"
 can_dnc_r.353.b:0 "Let the Mounted Police clear the halls"
 can_dnc_r.353.c:0 "Concede the argument — the treaty must change"
 can_dnc_r.354.t:0 "The Proceeds of the Sale"
 can_dnc_r.354.d:0 "Hill and Morgan's money sits in the Receiver General's account, the largest sum the Dominion has ever held at once. The Cabinet must decide whether it buys back the debt, builds the Hudson Bay line, or arms the Militia."
 can_dnc_r.354.a:0 "Set it against the public debt"
 can_dnc_r.354.b:0 "Build the Hudson Bay line with it"
 can_dnc_r.354.c:0 "Let the Militia have the money"
 can_dnc_r.355.t:0 "The Stars and Stripes at Esquimalt"
 can_dnc_r.355.d:0 "The first American squadron coals at Esquimalt and the dockyard that the white ensign abandoned hums again. Victoria is divided between the shopkeepers who count the sailors' pay and the old colonists who count the flags."
 can_dnc_r.355.a:0 "Let the dockyard hum"
 can_dnc_r.355.b:0 "Victoria protests"
 can_dnc_r.356.t:0 "A President Born Under the Old Flag"
 can_dnc_r.356.d:0 "A man born a British subject in one of the northern states swears the oath on the Capitol steps. Whitehall must decide whether the eldest dominion, lost to the republic, has given the Empire a friend in the White House or an embarrassment."
 can_dnc_r.356.a:0 "Congratulate the President — the King's former subject"
 can_dnc_r.356.b:0 "A cold cable from Whitehall"
 can_dnc_r.357.t:0 "The Chartered Banks Answer"
 can_dnc_r.357.d:0 "The offer of national charters under Washington's banking law divides St. James Street from Bay Street. The Bank of Montreal will not fight the currency it counts in; Toronto's banks suspect a charter from Washington is a leash from Washington."
 can_dnc_r.357.a:0 "Montreal takes the charter"
 can_dnc_r.357.b:0 "Toronto holds out"
 can_dnc_r.358.t:0 "Washington Reads the New Pact"
 can_dnc_r.358.d:0 "Ottawa's rewritten treaty reaches the Senate: the guarantee survives as an alliance between equals, and the consent clauses are gone. The administration must decide whether an equal is worth more than a client, or whether a client has simply slipped the leash."
 can_dnc_r.358.a:0 "An equal is worth more than a client"
 can_dnc_r.358.b:0 "The Senate grumbles at the loss of the leash"
 CAN_r_the_first_commission:0 "The First Commission"
 CAN_r_the_first_commission_desc:0 "The Prime Minister signs commissions no viceroy countersigns, and every office in the country learns, for a season, that it answers to Ottawa alone."
 CAN_r_the_address_to_congress:0 "The Address to Congress"
 CAN_r_the_address_to_congress_desc:0 "The address lies before Congress and the country holds its breath. Nothing is decided at home while everything is decided abroad."
 CAN_r_the_prairie_secession:0 "The Prairie Conventions"
 CAN_r_the_prairie_secession_desc:0 "Three provinces petition Washington over our heads. The Dominion is cracked along its oldest fault, and no militia order is obeyed west of the Lakehead without a second thought."
 CAN_r_the_northern_states:0 "The Northern States"
 CAN_r_the_northern_states_desc:0 "Nine new states arrive with their debts, their treaties and their grievances. The republic gains a continent of wheat and timber, and a delegation that votes together."
 CAN_r_national_charters:0 "National Charters"
 CAN_r_national_charters_desc:0 "The chartered banks take charters under the American national banking law. Credit flows north as never before, and a panic on Wall Street is henceforth a panic on St. James Street."
 CAN_r_the_frontier_on_the_map:0 "A Frontier Only on the Map"
 CAN_r_the_frontier_on_the_map_desc:0 "The customs houses are shut and the inspectors sent to the seaports. Goods, settlers and money cross the line as freely as a county road, and nothing stands on it to be defended."
 CAN_r_roads_run_from_st_paul:0 "Roads Run from St. Paul"
 CAN_r_roads_run_from_st_paul_desc:0 "The Grand Trunk and the Canadian Northern answer to boardrooms in St. Paul and New York. The lines are built faster than any Canadian syndicate could manage, on timetables we no longer write."
 CAN_r_the_continental_scheme:0 "The Continental Scheme"
 CAN_r_the_continental_scheme_desc:0 "Common patterns of arms, common plans for both coasts, and officers of the United States Army inspecting our camps as freely as our own. The general plan is written in Washington."
 CAN_r_the_ripening_zollverein:0 "The Ripening Zollverein"
 CAN_r_the_ripening_zollverein_desc:0 "Common schedules beget common law and common law begets common institutions. We walk with the current, and the current runs south."
 CAN_r_survey_parties_on_the_passes:0 "Survey Parties on the Passes"
 CAN_r_survey_parties_on_the_passes_desc:0 "Joint survey parties mark the passes and a wagon road with a railway behind it runs from our Yukon to their tidewater. Engineers cure what a tribunal poisoned."
 CAN_r_newfoundlands_cause:0 "Newfoundland's Cause"
 CAN_r_newfoundlands_cause_desc:0 "Our good offices are pledged to St. John's and our credit in Washington is spent on its behalf. The oldest colony waits at the door while we argue its case."
 CAN_r_the_grand_banks_arrangement:0 "The Grand Banks Arrangement"
 CAN_r_the_grand_banks_arrangement_desc:0 "The Atlantic approaches, the fisheries and the Grand Banks sit inside one arrangement. Newfoundland's bargain is ours to defend, and its schooners sail under our schedules."
 CAN_r_the_leased_dockyard:0 "The Leased Dockyard"
 CAN_r_the_leased_dockyard_desc:0 "The stars and stripes coal at Esquimalt on a lease politely renewed and never surrendered. Their squadron costs us nothing in gold and a great deal in appearances."
 CAN_r_the_league_in_the_theatres:0 "The League Against the Treaty"
 CAN_r_the_league_in_the_theatres_desc:0 "Bourassa's men and the Orange halls fill theatres from Quebec to Toronto demanding the whole loaf of union or the whole loaf of independence. A protectorate that must argue for itself is already losing."
 CAN_r_gratitude_and_gold:0 "Gratitude and Gold"
 CAN_r_gratitude_and_gold_desc:0 "Clause by clause the treaty is bought back with thanks and with money. The treasury pays for a signature's freedom, and Washington counts every dollar."
 CAN_r_the_loyal_mourners:0 "The Loyal Mourners"
 CAN_r_the_loyal_mourners_desc:0 "The old flag flies on the old anniversaries and the King's portrait hangs undisturbed in the halls. Grief is not sedition, and the state pays for its patience in time and in authority."
 CAN_r_the_empty_pews:0 "The Empty Pews"
 CAN_r_the_empty_pews_desc:0 "The most loyal subjects of the old Crown sail for Britain and the antipodes on ships we chartered. The counties are quiet, and the pews they leave behind stay empty."
 CAN_r_the_brief_before_the_court:0 "The Brief Before the Court"
 CAN_r_the_brief_before_the_court_desc:0 "The whole standing of the French fact rests on nine judges. Every parish from Manchester to Manitoba holds its breath, and the government argues instead of governing."
 CAN_r_the_debt_retired:0 "The Debt Retired"
 CAN_r_the_debt_retired_desc:0 "The proceeds of the railway sale are set against the public debt. The interest bill falls and the treasury breathes, but no new line is surveyed with the money."
 CAN_r_the_imperial_cold_shoulder:0 "The Imperial Cold Shoulder"
 CAN_r_the_imperial_cold_shoulder_desc:0 "London strikes us from the preference and from the loan lists. The Empire does not keep its children by force, but it does not lend to them either."
 CAN_dnc_sovereign_standing:0 "Standing Alone"
 CAN_dnc_sovereign_standing_desc:0 "Every act the Dominion takes in its own name is entered here. London's displeasure costs us trade and credit; the habit of deciding for ourselves pays in political authority and in the speed with which the nation can be brought to a cause."
 CAN_r_standing_alone_tt:0 "§YStanding Alone§! is established: the ledger of everything Canada does without asking. Each sovereign act adds to it, for good and for ill."
 CAN_r_standing_alone_grows_tt:0 "§YStanding Alone§! is modified:"
 CAN_d_the_refusal_of_1900:0 "The Refusal of the Contingent"
 CAN_d_the_refusal_of_1900_desc:0 "Not a man, not a transport, not a dollar. The ministry has refused the Empire its war, and the country is divided over it: Quebec and the West applaud, the Orange lodges fume, and every British house that buys our wheat has noticed."
 CAN_fx_commons_holds_the_sword:0 "The Commons Holds the Sword"
 CAN_fx_commons_holds_the_sword_desc:0 "No soldier leaves the country for a war without a vote of the House. The people know that their sons will not be spent in their absence, and the country's defence is the more willingly borne for it; but a ministry that must ask first cannot move quickly."
 CAN_d_the_lesson_of_alverstone:0 "The Lesson of Alverstone"
 CAN_d_the_lesson_of_alverstone_desc:0 "A British judge gave away the Panhandle and the Canadian commissioners would not sign. The country has learned that a treaty signed for us is a treaty signed against us, and it wants the pen in its own hand, whatever London thinks of the idea."
 CAN_fx_conventions_of_our_own:0 "Conventions of Our Own"
 CAN_fx_conventions_of_our_own_desc:0 "London has conceded the tariff conventions. It is a narrow door: we may bargain over duties in our own name, but over nothing else, and the Colonial Office reads every draft. We mean to walk through it and widen it."
 CAN_d_the_treaty_habit:0 "The Treaty Habit"
 CAN_d_the_treaty_habit_desc:0 "Our agents abroad carry cyphers, instructions and the right to speak. They are not ambassadors and every foreign ministry knows it, but they are listened to, and the habit of being listened to is the beginning of a foreign policy. It is paid for out of a thin treasury."
 CAN_d_the_treaty_of_paris_1907:0 "The Treaty of Paris"
 CAN_d_the_treaty_of_paris_1907_desc:0 "Paris first, then a dozen conventions in three years. The Dominion signs as a matter of routine and the world has stopped asking under whose seal. Every market that opens costs a ministry its attention, and some of its authority at home."
 CAN_d_a_nation_among_nations:0 "A Nation Among Nations"
 CAN_d_a_nation_among_nations_desc:0 "Canada answers to no Parliament but its own. The authority of the state has never been greater, nor its people more willing to be led; but the Empire's markets, the City's credit and the Admiralty's ships are no longer ours to count on, and the factories feel it first."
 CAN_d_no_credit_anywhere:0 "No Credit Anywhere"
 CAN_d_no_credit_anywhere_desc:0 "Lombard Street has closed its books to us and New York has not opened its own. Every railway, every dock and every public work is paid for out of the year's revenue, and the year's revenue is not enough."
 CAN_d_no_credit_in_london:0 "No Credit in London"
 CAN_d_no_credit_in_london_desc:0 "The City declines the new issue. What London will not lend, Ottawa must raise at home or borrow dearer elsewhere, and the bond houses of New York and Paris know exactly how much we need."
 CAN_d_fieldings_three_columns:0 "Fielding's Three Columns"
 CAN_d_fieldings_three_columns_desc:0 "Three columns in the tariff: general, intermediate and preferential, and Britain no longer in the third by right. Every country that wants our market bargains for it, and the Finance Minister has a price for each. Montreal pays more for Sheffield steel, and says so."
 CAN_d_the_naval_militia:0 "The Naval Militia"
 CAN_d_the_naval_militia_desc:0 "The fishermen of Lunenburg and Gaspe drill through the winter under Canadian officers and are sworn to no flag but ours. They are the first sailors the Dominion has ever paid, and the militia regiments resent every dollar spent on them."
 CAN_fx_legations_abroad:0 "Legations Abroad"
 CAN_fx_legations_abroad_desc:0 "Ministers at Washington, Paris and London, with cyphers and a voice of their own. A country that keeps its own envoys abroad is a country no one can call a colony, and it pays for the privilege in rents, salaries and the Finance Minister's temper."
 CAN_d_otters_general_staff:0 "Otter's General Staff"
 CAN_d_otters_general_staff_desc:0 "A Canadian chief of staff, a staff college, an intelligence branch and mobilisation tables written for Canadian ground. The army plans its own wars now. The staff costs money the militia would rather spend on rifles."
 CAN_d_a_navy_of_our_own:0 "A Navy of Our Own"
 CAN_d_a_navy_of_our_own_desc:0 "Esquimalt lays down cruisers of Canadian design and the Admiralty's cheque goes back uncashed. The yards work as they never have. The ships are ours to build, ours to name and ours to pay for, and the taxpayer has noticed the last part."
 CAN_d_marquis_wheat:0 "Marquis Wheat"
 CAN_d_marquis_wheat_desc:0 "A wheat that ripens a week before the frost is worth a province of new land. The homesteads push north, the elevators fill, and the country eats well and cheaply; the mills and factories of the East complain that every hand has gone west."
 CAN_d_the_kingdom_of_canada:0 "The Kingdom of Canada"
 CAN_d_the_kingdom_of_canada_desc:0 "One crown over two realms, a sovereign advised from Ottawa and Ottawa alone. The loyalists have their King and the nationalists their country, and the ministry that gave them both is secure. A kingdom, however, does not rush to war."
 CAN_d_the_republic_of_canada:0 "The Republic of Canada"
 CAN_d_the_republic_of_canada_desc:0 "No oath, no Governor General, no crowned head across the sea. The republic is sworn to its own constitution and to nothing else. It has the energy of a young state and the enemies of one: the loyalists have not forgiven it, and the Empire's markets have not forgotten."
 CAN_fx_crown_advised_at_home:0 "The Crown Advised at Home"
 CAN_fx_crown_advised_at_home_desc:0 "The King signs the commission as Ottawa advises him, which is the whole of the difference and the whole of the point. The Crown's man in Canada is now Canada's choice, and no one abroad can reach the government through him."
 CAN_r_signed_in_our_own_name:0 "Signed in Our Own Name"
 CAN_r_signed_in_our_own_name_desc:0 "Fielding and Brodeur signed at Paris with no British plenipotentiary at their backs, and the Colonial Office read of it in the newspapers. Every foreign ministry now knows that Canada can sign. Whitehall knows it too, and has not forgotten."
 CAN_r_conventions_widened:0 "The Door Widened"
 CAN_r_conventions_widened_desc:0 "What began as a narrow concession over tariffs has become a general treaty power by use. After the third convention no one in Whitehall thinks to ask under whose seal it was done. The Dominion bargains for its markets and gets them."
 CAN_r_a_militia_of_our_own:0 "A Militia of Our Own"
 CAN_r_a_militia_of_our_own_desc:0 "The British general is gone and the Militia Act leaves no room for another. A council under a Canadian minister commands, and a Canadian officer may rise to the top of his own army. The War Office answers our letters more slowly than it did."
 CAN_r_the_line_in_the_snow:0 "The Line in the Snow"
 CAN_r_the_line_in_the_snow_desc:0 "The Mounted Police hold the passes in stone posts with a Maxim gun and never come down. Where the award drew no line, our men have drawn one with their boots, and they have learned to live on it through the winter. The posts are provisioned at a price."
 CAN_r_the_keys_of_the_fortresses:0 "The Fortresses Are Ours"
 CAN_r_the_keys_of_the_fortresses_desc:0 "Halifax and Esquimalt, with their guns, their coal and their accounts, belong to the Dominion. Canada is the only power that guards its own coasts. It also pays for every gun that stays, and the imperial garrison cost rather more than the Admiralty ever let on."
 CAN_r_the_fisheries_fleet:0 "The Fisheries Protection Fleet"
 CAN_r_the_fisheries_fleet_desc:0 "Revenue cutters, quietly armed at Halifax, flying our flag and no other. The Dominion has warships without once asking the Admiralty for one, and a body of officers who have learned the sea in Canadian service. The Admiralty calls it a coastguard. We do not correct them."
 CAN_r_the_winter_session:0 "The Winter Session"
 CAN_r_the_winter_session_desc:0 "The House sits late and divides often. A ministry that has just told the Empire no has the country's attention and must keep it, and every bill carries the weight of the great one."
 CAN_r_the_sting_of_alaska:0 "The Sting of the Award"
 CAN_r_the_sting_of_alaska_desc:0 "The Panhandle is gone and the country knows who gave it away. The press is angry, the House is angrier, and for a season no argument for arming the Dominion falls on deaf ears."
 CAN_r_the_lynn_canal_crisis:0 "The Lynn Canal Crisis"
 CAN_r_the_lynn_canal_crisis_desc:0 "We have said aloud that an award we did not sign binds no Canadian surveyor. Washington has heard. While the crisis lasts, the country will follow the ministry almost anywhere on the northern frontier, and the merchants who trade south hold their breath."
 CAN_r_the_orange_marches:0 "The Orange Marches"
 CAN_r_the_orange_marches_desc:0 "Twenty thousand past the King's statue, petitions in eleven counties, and a loyalist press that calls the ministry traitors every morning. The government is not wrong about the facts, and neither are they. The country is angrier than it has been in a generation."
 CAN_r_the_address_goes_out:0 "The Address Goes Out"
 CAN_r_the_address_goes_out_desc:0 "The Commons have asked the mother country, in the plainest words, to set her grown child free. The address is in the Governor General's bag. Until London answers, nothing else in the country is talked about."
 CAN_r_the_first_days_of_the_nation:0 "The First Days of the Nation"
 CAN_r_the_first_days_of_the_nation_desc:0 "The flag is the same and the streets are the same, and everything is different. The ministry can do what it likes for a season, because a nation that has just been born will forgive its founders almost anything. Almost."
 CAN_r_talks_at_washington:0 "Talks at Washington"
 CAN_r_talks_at_washington_desc:0 "A Canadian carries the treaty to the Secretary of State, and the British embassy learns of the appointment afterward. While the talks run, every merchant on the border watches the telegraph, and the ministry spends its days on them."
 CAN_r_a_minister_from_tokyo:0 "A Minister From Tokyo"
 CAN_r_a_minister_from_tokyo_desc:0 "A Japanese minister presents his letters at Ottawa, and the Pacific trade opens on terms settled here. Vancouver's merchants are delighted and Vancouver's exclusion leagues are not."
 CAN_r_lombard_street_shut:0 "Lombard Street Shut"
 CAN_r_lombard_street_shut_desc:0 "The City has declined the new issue and the Transcontinental has a payroll due on Saturday. Every contractor in the country is waiting to be paid, and every editor is asking what independence was for."
 CAN_r_the_yukon_front:0 "The Yukon Front"
 CAN_r_the_yukon_front_desc:0 "The militia is on the passes and the border is wherever it is standing. Against ninety millions, with no ally in sight, the country has decided to dig. The posts are supplied over a single mountain road at a price the treasury feels every month."
 CAN_r_coronation_in_ottawa:0 "A Crown of Our Own"
 CAN_r_coronation_in_ottawa_desc:0 "The word the founders wanted is back in the statute. The loyalists have a King and the nationalists a Kingdom, and for a season the country is at peace with itself. The ceremonies are not cheap."
 CAN_r_the_constitution_sworn:0 "The Constitution Sworn"
 CAN_r_the_constitution_sworn_desc:0 "The oath of allegiance is struck from the statutes and the Governor General's commission has expired. The republic is a year old and its founders may do as they please, so long as they do it quickly; the lodges are already organising."
 CAN_r_the_money_on_the_table:0 "The Money on the Table"
 CAN_r_the_money_on_the_table_desc:0 "The railway debt of the oldest colony, in cash, on a table at St John's. Until the island answers, the sum is out of the treasury's hands and every other vote must wait for it."
 CAN_r_the_dominions_disapprove_tt:0 "The other Dominions take note of Canada's course. Their opinion of us falls."
 CAN_r_the_dominions_approve_tt:0 "The other Dominions take note of a crowned Canada. Their opinion of us rises."
 CAN_r_the_men_stay_home_tt:0 "The men who would have sailed stay in the militia rolls instead."
 CAN_r_the_commons_holds_the_sword_tt:0 "From this day the Crown may not spend Canadian blood without the Commons' word."
 CAN_r_strathconas_horse_enrolled_tt:0 "Strathcona's six hundred horsemen are enrolled by the state, as a regiment of the Canadian militia and no one's private levy."
 CAN_r_otter_learns_tt:0 "Otter brings the Royal Canadians home with a battle honour and the lessons of the veldt."
 CAN_r_the_commissioners_tt:0 "The commissioners' refusal to sign is read into the record. The country decides what the lesson is worth."
 CAN_r_surveyors_on_the_lynn_canal_tt:0 "Canadian surveyors go back to the Lynn Canal. The claim is kept alive on the ground."
 CAN_r_treaty_answers_tt:0 "London may refuse the treaty power outright, concede it for tariffs only, or concede it whole. Each answer opens a different road."
 CAN_r_field_force_north_tt:0 "The Field Force stands on the ground the tribunal gave away. The posts on the passes will be the stronger for it."
 CAN_r_dundonald_sent_home_tt:0 "§RLord Dundonald§! is sent home and will command nothing in Canada again."
 CAN_r_whitehall_reads_the_papers_tt:0 "The Colonial Office learns of the treaty from the newspapers. How the ministry handles the silence that follows is its own affair."
 CAN_r_treaty_power_refused_tt:0 "§RLondon refused us the treaty power, and we have used it anyway.§! The Colonial Office will not forget."
 CAN_r_the_dominions_bargain_tt:0 "The other Dominions are offered the same convention on the same terms."
 CAN_r_a_narrow_door_tt:0 "§YThe door is narrow.§! London conceded tariffs only; every further treaty will be a quarrel."
 CAN_r_the_door_is_wide_tt:0 "§GLondon conceded the treaty power whole.§! The conventions go through without a quarrel."
 CAN_r_posts_in_stone_tt:0 "The Mounted Police posts on the passes are rebuilt in stone and held through the winter."
 CAN_r_the_garrison_accounts_tt:0 "The garrisons' coal, guns and stores are taken over with the fortresses."
 CAN_r_agents_abroad_tt:0 "Our agents at Paris, Washington and Tokyo receive cyphers and written instructions, and are treated as envoys in all but name."
 CAN_r_the_claim_in_statute_tt:0 "The heads of the Lynn Canal are entered in the Dominion's statute book as Canadian territory."
 CAN_r_the_cutters_armed_tt:0 "The fishery cutters are fitted with guns at Halifax and commissioned as the Dominion's first armed vessels."
 CAN_r_a_dozen_conventions_tt:0 "A dozen tariff conventions follow Paris. Every power that wants our market bargains for it in Ottawa."
 CAN_r_ontario_roused_tt:0 "§RThe Ontario loyalists are already roused.§! The marches are larger and angrier than they would otherwise be."
 CAN_r_the_world_takes_note_tt:0 "The great powers take note of a nation that answers to no Parliament but its own."
 CAN_r_the_empire_takes_note_tt:0 "The Empire takes note, and not kindly."
 CAN_r_the_address_twice_tt:0 "The address is passed a second time, word for word, with a note that there will be no third."
 CAN_r_standoff_shadows_talks_tt:0 "§RThe standoff on the Lynn Canal shadows the talks.§! Washington bargains harder."
 CAN_r_the_fortress_accounts_tt:0 "The fortress accounts, the preference, the shipping and the fisheries are all on the table at once."
 CAN_r_sworn_to_no_flag_but_ours_tt:0 "The naval militia is sworn to the Dominion alone. The Admiralty is informed, not consulted."
 CAN_r_montreal_feels_the_difference_tt:0 "§RMontreal's houses feel the difference within the week.§!"
 CAN_r_payroll_on_saturday_tt:0 "§RThe Transcontinental has a payroll due on Saturday and the City will not honour the issue.§!"
 CAN_r_washington_already_recognises_tt:0 "§GWashington already receives our minister.§! The legation opens without a quarrel."
 CAN_r_a_foreign_service_tt:0 "Every great power not at war with us receives a Canadian legation."
 CAN_r_external_affairs_helps_tt:0 "§GThe Department of External Affairs conducts the renewal itself.§!"
 CAN_r_a_staff_for_canadian_ground_tt:0 "Mobilisation tables are written for Canadian ground, and the staff college opens at Kingston."
 CAN_r_the_cheque_refused_tt:0 "§RThe Admiralty's cheque goes back uncashed.§! London is not pleased."
 CAN_r_cutters_to_cruisers_tt:0 "§GThe officers of the fisheries fleet take the first cruisers to sea.§!"
 CAN_r_baldwins_workshop_tt:0 "Baldwin's workshop at Baddeck stays open on the Dominion's account, and the first two aeroplanes in the Empire are ours."
 CAN_r_a_week_of_the_northern_season_tt:0 "A week won back from the frost. The homesteads push north and the elevators fill."
 CAN_r_the_border_redrawn_by_hand_tt:0 "§RWe will redraw the border ourselves, on the ground, against a neighbour of ninety millions and with no ally in sight.§!"
 CAN_r_the_standoff_is_already_on_tt:0 "§YThe militia is already standing on the Lynn Canal.§! The march north begins from the passes, not from Ottawa."
 CAN_r_one_crown_two_realms_tt:0 "One crown over two realms. The King will be asked to consent to a Kingdom of Canada advised from Ottawa alone."
 CAN_r_no_crowned_head_tt:0 "The oath of allegiance is struck from the statutes and the Governor General's commission is allowed to expire."
 CAN_r_the_promise_broken_tt:0 "§RThe lodges were promised the King's word, in the King's name. The promise is broken.§!"
 CAN_r_if_st_johns_accepts_tt:0 "§YIf St John's accepts:§!"
 CAN_r_a_crowned_canada_for_the_island_tt:0 "§GA crowned Canada is an easier bargain for the island.§!"
 CAN_r_a_republic_for_the_island_tt:0 "§RA republic is a harder bargain for the oldest colony.§!"
 CAN_r_the_kings_man_is_ours_tt:0 "The next Governor General is named by the Canadian ministry and the King signs the commission as we advise."
 CAN_r_london_offered_the_crown_tt:0 "§GLondon offered the Crown rather than lose us. The Kingdom is proclaimed with Whitehall's blessing.§!"
 CAN_r_the_veterans_of_paardeberg_bonus:0 "The Veterans of Paardeberg"
 CAN_r_the_militia_council_bonus:0 "The Militia Council"
 CAN_r_paris_tariff_bonus:0 "Machinery at Preference"
 CAN_r_tariff_conventions_bonus:0 "The Tariff Conventions"
 CAN_r_chilkoot_bonus:0 "The Posts on the Passes"
 CAN_r_the_fortress_guns_bonus:0 "The Fortress Guns"
 CAN_r_the_cypher_office_bonus:0 "The Cypher Office"
 CAN_r_armed_cutters_bonus:0 "Armed Cutters"
 CAN_r_a_dozen_conventions_bonus:0 "A Dozen Conventions"
 CAN_r_a_nation_among_nations_bonus:0 "A Nation Among Nations"
 CAN_r_the_fortress_accounts_bonus:0 "The Fortress Accounts"
 CAN_r_the_naval_militia_bonus:0 "The Naval Militia"
 CAN_r_otters_staff_college:0 "The Staff College at Kingston"
 CAN_r_cruisers_of_canadian_design_bonus:0 "Cruisers of Canadian Design"
 CAN_r_baddeck_ice_bonus:0 "Off the Baddeck Ice"
 CAN_r_experimental_farms_bonus:0 "The Experimental Farms"
 CAN_r_guns_for_the_yukon_bonus:0 "Guns for the Yukon"
 CAN_r_raised_at_home_bonus:0 "Raised at Home"
 CAN_r_root_and_the_waters_bonus:0 "The Boundary Waters"
 can_dnc_r.401.a:0 "Print the dissent in every paper in the Dominion."
 can_dnc_r.401.b:0 "Make the lesson a policy: no treaty without a Canadian pen."
 can_dnc_r.401.c:0 "Send the surveyors back to the Lynn Canal anyway."
 can_dnc_r.401.t:0 "The Commissioners Refuse to Sign"
 can_dnc_r.401.d:0 "The two Canadian members of the tribunal have declined to put their names to the award, and their dissent is in the hands of every editor in the country before the ink is dry. The British member voted with the Americans. The House wants to know what the ministry proposes to do with a lesson that has cost the Dominion a coastline, and the ministry must decide whether the lesson is to be shouted, studied or acted upon."
 can_dnc_r.402.a:0 "Let them read it. We sign what we please."
 can_dnc_r.402.b:0 "Send a courtesy copy, a week late, with our compliments."
 can_dnc_r.402.c:0 "Announce the next treaty in the same breath."
 can_dnc_r.402.t:0 "Whitehall Reads It in the Newspapers"
 can_dnc_r.402.d:0 "The treaty is signed at Paris in Canada's name alone, and the first the Colonial Office hears of it is a paragraph in the morning papers. No despatch has gone, no courtesy copy, no request for leave. The silence from Downing Street is a week old and growing louder. The ministry must decide how the Dominion carries itself now that the thing is done."
 can_dnc_r.403.a:0 "Post the notice and mark the line."
 can_dnc_r.403.b:0 "Survey quietly, and publish nothing yet."
 can_dnc_r.403.t:0 "The Survey Party at Tidewater"
 can_dnc_r.403.d:0 "The survey party has come down the pass to the head of the Lynn Canal and is running its chain along the shore at Skagway under the eyes of the American customs house. The claim is in the statute book; it is now also on the ground. The party's leader asks by telegraph whether he is to post the Dominion's notice on the wharf, or pack his instruments and publish nothing."
 can_dnc_r.404.a:0 "Answer Toronto from the floor of the House."
 can_dnc_r.404.b:0 "Promise Ontario that the Crown stays, whatever the statute says."
 can_dnc_r.404.c:0 "Let the West and Quebec answer Ontario themselves."
 can_dnc_r.404.t:0 "Ontario Shouts"
 can_dnc_r.404.d:0 "Quebec and the West carried the resolution and Ontario shouted through every division. The Toronto papers call it treason; the Orange lodges are drafting an address of their own; three Ontario members have crossed the floor. The Governor General's bag has gone with the Commons' request for a nation, and the ministry must decide what it says to the province that did not ask for one."
 can_dnc_r.405.a:0 "Recognise the new nation and receive its minister."
 can_dnc_r.405.b:0 "Watch, and wait for London's view."
 can_dnc_r.405.c:0 "Let the annexation press have its subject back."
 can_dnc_r.405.t:0 "A Nation to the North"
 can_dnc_r.405.d:0 "The Dominion of Canada has passed its address a second time and Britain has let her go. There is now an independent state along the whole northern border, with a militia, a fisheries fleet and an appetite for treaties of its own. The Department of State must decide whether it receives a Canadian minister, waits for London's view, or lets the annexation press in the border states have its subject back."
 can_dnc_r.406.a:0 "Let her go, and keep the trade."
 can_dnc_r.406.b:0 "Let her go, and close the City to her."
 can_dnc_r.406.c:0 "Offer a Crown rather than lose her."
 can_dnc_r.406.t:0 "The Second Address"
 can_dnc_r.406.d:0 "The Canadian Commons have passed the same address a second time, word for word, and added that there will be no third. Earl Grey has sent it on with a note that the ministry will not wait past the end of the session. The Cabinet must decide whether the oldest Dominion is to be let go with the trade intact, let go and shut out of the City, or offered a Crown rather than lost."
 can_dnc_r.407.a:0 "The King consents."
 can_dnc_r.407.b:0 "The King consents, and the City reopens its books."
 can_dnc_r.407.c:0 "Whitehall objects to the novelty."
 can_dnc_r.407.t:0 "A Crown Over Two Realms"
 can_dnc_r.407.d:0 "Ottawa asks the King to consent to a Kingdom of Canada: one crown over two realms, the sovereign advised in Canadian matters by Canadian ministers and by no one else. The Colonial Office calls it a constitutional novelty; the Palace calls it a family matter. The Cabinet must advise His Majesty whether to consent, to consent and reopen the City to Canadian loans, or to object."
 can_dnc_r.408.a:0 "Sign the commission."
 can_dnc_r.408.b:0 "Sign, and note the precedent with regret."
 can_dnc_r.408.t:0 "The Commission Signed as Advised"
 can_dnc_r.408.d:0 "The Canadian ministry has named the next Governor General and submitted the commission for the King's signature, as it would submit any other instrument of state. Downing Street was told afterward. The Cabinet must advise His Majesty to sign, and decide whether to note, for the record, that the precedent is one it regrets."
 can_dnc_r.451.t:0 "The Design of the Flag"
 can_dnc_r.451.d:0 "The committee of the Commons has three drawings on the table. One is a single red leaf on a white field, plain enough for a child to draw. One quarters the leaf with the lily of Quebec, so that neither people can say the other owns the flag. The third is the old Red Ensign with its canton simply cut away, which costs the customs houses nothing and says, to anyone who looks, exactly what we have done."
 can_dnc_r.451.a:0 "A single red leaf on white"
 can_dnc_r.451.b:0 "The leaf quartered with the lily"
 can_dnc_r.451.c:0 "The Red Ensign, stripped of its canton"
 can_dnc_r.452.t:0 "The Office Above the Parties"
 can_dnc_r.452.d:0 "Laurier has declined, and his refusal has made the presidency something no party chief may hold. Three names remain. A judge of the Supreme Court, who has never sought a vote in his life. General Otter, whose name every militiaman knows and whose politics nobody does. And a grandee of the Senate who will cost the treasury nothing, offend nobody, and be forgotten by the end of his term."
 can_dnc_r.452.a:0 "A judge of the Supreme Court takes the oath"
 can_dnc_r.452.b:0 "General Otter, the soldier-president"
 can_dnc_r.452.c:0 "A grandee of the Senate, for seven quiet years"
 can_dnc_r.453.t:0 "A Crown on the Saint Lawrence"
 can_dnc_r.453.d:0 "Ottawa has proclaimed a Kingdom of Canada before its Commons, its Senate and its judges, with a crown of its own, cruisers at Esquimalt and ministers in foreign capitals. The realm asks for recognition as a kingdom among kingdoms and for the City's credit on a kingdom's terms. The Colonial Office is divided between those who see a King's cousin and those who see a colony that has helped itself."
 can_dnc_r.453.a:0 "Recognise the realm; a King's cousin is a King's cousin"
 can_dnc_r.453.b:0 "Recognise it coldly, and count the cost to the Admiralty"
 can_dnc_r.453.c:0 "The Admiralty withdraws the squadron from Halifax"
 can_dnc_r.454.t:0 "A Republic to the North"
 can_dnc_r.454.d:0 "The Dominion has proclaimed itself a republic, sworn to a constitution and to no living person, with no guarantee from any power and its own ships on two coasts. The State Department notes that the continent now holds two republics and one open border. The Senate is already talking, as it always does, of one flag."
 can_dnc_r.454.a:0 "The first to recognise; send a minister to Ottawa"
 can_dnc_r.454.b:0 "Recognise, and wait to see what they become"
 can_dnc_r.454.c:0 "The Senate talks of one flag on the continent"
 can_dnc_r.455.t:0 "The Price of the Wall"
 can_dnc_r.455.d:0 "The new schedules have been in force for a season and the bills have come due. The manufacturers' association sends its thanks and its subscription. The farmers' delegations send the price of a binder, before and after. The ministers must decide whether the wall stands entire, whether a gate is cut for the implements of the West, or whether the bounties are raised until the factories outrun the complaints."
 can_dnc_r.455.a:0 "Hold the schedules; let them pay"
 can_dnc_r.455.b:0 "Exempt the farmer's implements"
 can_dnc_r.455.c:0 "Exempt nothing, and raise the bounties"
 can_dnc_r.456.t:0 "The Silver Dollar Rings"
 can_dnc_r.456.d:0 "The first bars from Cobalt are stacked in the vaults at Ottawa and the Mint waits for instructions. The Minister of Finance may coin boldly and let the new dollars run ahead of the old rules; he may stack the metal and wait for the price; or he may sell bullion to New York for gold and let the Americans carry the risk."
 can_dnc_r.456.a:0 "Coin it boldly"
 can_dnc_r.456.b:0 "Stack the bars and wait"
 can_dnc_r.456.c:0 "Sell bullion to New York for gold"
 can_dnc_r.457.t:0 "The Marconi Board Protests"
 can_dnc_r.457.d:0 "The Marconi company's London board has learned that the Dominion has bought out Mr. Fessenden's patents and is raising its own masts from Cape Breton to the Queen Charlottes, to carry Canadian traffic and no one else's. The board asks the Colonial Office what the Empire's cables are for, if a dominion may simply talk over them."
 can_dnc_r.457.a:0 "Let the patents go; we hold the cables"
 can_dnc_r.457.b:0 "Deny the Dominion every cable-landing right"
 can_dnc_r.457.c:0 "Buy the masts ourselves and share the traffic"
 can_dnc_r.458.t:0 "Where the First Garrison Stands"
 can_dnc_r.458.d:0 "General Otter has the estimates for one permanent work this year and asks where it goes. The Niagara frontier faces the nearest American corps. Winnipeg holds the only line that binds the West to the East. Esquimalt guards the Pacific gate and the only dock on that ocean that we can call our own."
 can_dnc_r.458.a:0 "The Niagara frontier"
 can_dnc_r.458.b:0 "Winnipeg and the Red River"
 can_dnc_r.458.c:0 "Esquimalt and the Pacific gate"
 can_dnc_r.459.t:0 "Neutrality on the Long Border"
 can_dnc_r.459.d:0 "Ottawa has proclaimed armed neutrality: not one man for foreign wars, not one dollar for foreign fleets, every rifle and every keel for Canadian soil alone. The State Department observes that no British squadron will ever again use the Lakes or Halifax against us. The War Department observes that armed is armed, and asks whom the rifles are for."
 can_dnc_r.459.a:0 "No British fleet on the Lakes is a good neighbour"
 can_dnc_r.459.b:0 "Armed is armed; watch them"
 can_dnc_r.459.c:0 "The War Department asks for a plan"
 can_dnc_r.460.t:0 "Rifles Above the Hearth"
 can_dnc_r.460.d:0 "The militia law on the Swiss pattern is passed and the Militia Council asks how it is to be kept. A Ross to every household would arm the nation overnight and empty the arsenal. Ranges and cadet corps in every county would make riflemen slowly and cheaply. And from Quebec come the first reports of parishes that will furnish the men but not the rifle, and of curés who ask what the rifle is for."
 can_dnc_r.460.a:0 "A Ross to every household"
 can_dnc_r.460.b:0 "Ranges and cadet corps in every county"
 can_dnc_r.460.c:0 "Let the parishes furnish the men and keep the peace"
 can_dnc_r.461.t:0 "Torpedo Boats on the Lakes"
 can_dnc_r.461.d:0 "The Navy Department reports that the yards of Sorel and Toronto are launching torpedo boats, minelayers and gunboats by the score, and that some of them are on the Lakes. The old agreement that kept the Lakes unarmed has not been denounced; it has simply been outgrown. The Secretary asks whether the Republic answers with boats of its own or lets a swarm of small hulls go unremarked."
 can_dnc_r.461.a:0 "The old agreement is dead; build our own"
 can_dnc_r.461.b:0 "Protest, and let it lie"
 can_dnc_r.461.c:0 "Small boats for small ports; ignore them"
 can_dnc_r.462.t:0 "The Folder Marked Blue"
 can_dnc_r.462.d:0 "Through the same loose-tongued officer who sold the Americans their folder, the War Office learns that the Militia Council in Ottawa keeps a second one, marked Blue: a worked-out defence against coercion by the Royal Navy, with the coaling stations marked and the approaches to Halifax mined in pencil. A dominion that plans against the fleet that once called itself its own has, the First Lord observes, at least been paying attention."
 can_dnc_r.462.a:0 "An insult to the Crown"
 can_dnc_r.462.b:0 "Every dominion keeps such folders"
 can_dnc_r.462.c:0 "Ask the Admiralty for a folder of our own"
 can_dnc_r.463.t:0 "The Winter Estimates"
 can_dnc_r.463.d:0 "The fortress is finished and the bill for keeping it comes every winter. The Minister of Finance lays three ways of paying it before the cabinet. The shops can wait another year while the works and the camps are paid first. The summer camps can be cut this year and the shops filled. Or the railways and the banks can be made to pay, and every charter in the country sends its lawyer to Ottawa."
 can_dnc_r.463.a:0 "The shops can wait another winter"
 can_dnc_r.463.b:0 "Cut the summer camps this year"
 can_dnc_r.463.c:0 "Tax the railways and the banks"
 can_dnc_r.464.t:0 "The Trains from Lowell"
 can_dnc_r.464.d:0 "The first trains from New England have arrived and the agents report thousands more with tickets in hand. The Department of the Interior must say where they go. Lots in the clay belts would people the interior and clear the bush. Posts in the mills of Montreal would fill the factories the wall has built. Or the gate can simply stand open and the country take them as they come."
 can_dnc_r.464.a:0 "Lots in the clay belts"
 can_dnc_r.464.b:0 "Posts in the mills of Montreal"
 can_dnc_r.464.c:0 "Let them come as they please"
 can_dnc_r.465.t:0 "The Farmers March on Ottawa"
 can_dnc_r.465.d:0 "The delegations from the West have filled the galleries with petitions taller than a man. They demand a breach in the wall for their wheat, honest weights at the elevators and a door to the sea that owes nothing to Montreal. The government has refused all three in the House; it must now decide how the refusal is enforced, and what it is willing to give so that the West consents to live behind the wall."
 can_dnc_r.465.a:0 "Whip the House and hold every seat"
 can_dnc_r.465.b:0 "Break the farmers' company at the polls"
 can_dnc_r.465.c:0 "Concede one door, at Churchill"
 can_dnc_r.466.t:0 "A Sector Drawn to the Pole"
 can_dnc_r.466.d:0 "The Dominion of Canada has written into statute a claim to every island and every sea between two lines drawn from its coasts to the Pole. No chancellery has a pigeonhole for such a claim. The Foreign Ministry notes that the Empire also has an Arctic coast, and that the precedent of a sector, once admitted, may be drawn from Archangel and Vladivostok as easily as from Halifax."
 can_dnc_r.466.a:0 "Note the precedent; draw our own lines"
 can_dnc_r.466.b:0 "Protest at Ottawa"
 can_dnc_r.466.c:0 "Ignore a country without a fleet"
 can_dnc_r.467.t:0 "Bernier Winters in the Ice"
 can_dnc_r.467.d:0 "Captain Bernier's ship has frozen in for the winter at the far end of the archipelago, with coal, wireless and a cairn of proclamations. His message asks for instructions. He may claim the whole archipelago from the deck and plant the flag on every sound. He may licence the whalers and collect the dues, which pays for the coal. Or he may bring the ship home the moment the ice opens, and the North can wait another year."
 can_dnc_r.467.a:0 "Claim the whole archipelago from the deck"
 can_dnc_r.467.b:0 "Licence the whalers and collect the dues"
 can_dnc_r.467.c:0 "Bring the ship home before the ice closes"
 can_dnc_r.468.t:0 "A Treaty of Good Fences"
 can_dnc_r.468.d:0 "The Dominion has declared itself the Switzerland of the North: armed, neutral, owing nobody anything and buying from nobody if it can help it. Ottawa offers Washington a plain undertaking that neither country will attack the other, and nothing more. The State Department must decide whether a hermit makes a good neighbour, whether good fences need a treaty at all, or whether a wall deserves a wall."
 can_dnc_r.468.a:0 "Sign the undertaking"
 can_dnc_r.468.b:0 "Good fences need no treaty"
 can_dnc_r.468.c:0 "A hermit is a hermit; raise the tariff"
 can_dnc_r.469.t:0 "The Sector on the Map"
 can_dnc_r.469.d:0 "Sector law, police posts, wireless and the wake of one stubborn ship have made the Canadian archipelago a governed country, and the world is weary of arguing. The Colonial Office must decide whether to acquiesce. The Dominion adds a request: that the interior of Labrador, which Newfoundland has never governed and Canada already polices, be transferred to Ottawa with the rest of the North."
 can_dnc_r.469.a:0 "Acquiesce, and cede the interior of Labrador"
 can_dnc_r.469.b:0 "Acquiesce, and say nothing of Labrador"
 can_dnc_r.469.c:0 "Refuse; the Crown's ice is the Crown's"
 CAN_dnc_fortress_modifier:0 "The Fortress of the North"
 CAN_dnc_fortress_modifier_desc:0 "Every work of the wall and the garrison adds to the fortress, and every one of them is paid for at home. The modifier grows with the path and shows what the country has become."
 CAN_dnc_fortress_init_tt:0 "§YThe Fortress of the North§! begins to take shape: a national modifier that grows with every work of the wall and the garrison."
