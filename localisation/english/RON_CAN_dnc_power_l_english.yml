 CANDNC_r_hermit_bonus:0 "The Hermit Dominion"
 CAN_r_the_flag_raised:0 "The Flag Raised"
 CAN_r_the_flag_raised_desc:0 "A flag with no other country in its corner flies over Parliament, the legations and the fleet. For a season the whole country looks up at it, and the parties keep their quarrels indoors."
 CAN_r_a_flag_without_a_canton:0 "A Flag Without a Canton"
 CAN_r_a_flag_without_a_canton_desc:0 "The Red Ensign is furled. A nation that refuses to fly a borrowed flag has decided what it is, and the fleet, the customs houses and the schools all answer to the same colours."
 CAN_r_the_first_president:0 "The Office Above the Parties"
 CAN_r_the_first_president_desc:0 "The head of state is chosen for seven years from among the Commons and stands above every party from the first day. The office is respected at home and watched with interest in Washington and Paris; the soldiers, who swore to a person, must learn to swear to a constitution."
 CAN_r_the_crown_of_canada:0 "The Crown of Canada"
 CAN_r_the_crown_of_canada_desc:0 "A Kingdom of Canada with its own crown, its own cruisers and its own ministers in foreign capitals. The realm is respected and its credit returns; but a country proclaimed at peace has promised its people a quiet reign, and the militia estimates show it."
 CAN_r_the_republic_proclaimed:0 "The Republic Proclaimed"
 CAN_r_the_republic_proclaimed_desc:0 "The oath is sworn to the constitution and to no living person. No crown, no guarantee from any power, four thousand miles of open border: the republic arms itself, makes its own quarrels quickly, and finds the counting houses of the old world colder than before."
 CAN_r_the_wall:0 "The Wall Against Both"
 CAN_r_the_wall_desc:0 "Manchester cloth and Pittsburgh steel pay the same toll at our ports. Canada buys from Canada: the factories fill, the mines are worked for the home market, and the consumer pays the price that pride is known to cost."
 CAN_r_the_silver_standard:0 "The Silver Standard"
 CAN_r_the_silver_standard_desc:0 "The silver camps of Cobalt belong to the Crown and the Mint strikes a dollar backed in metal we dig ourselves. The public debt is paid without a lender in London or New York; the bankers of both cities remember the insult, and silver money buys a little less each year."
 CAN_r_the_fessenden_stations:0 "The Fessenden Stations"
 CAN_r_the_fessenden_stations_desc:0 "Mr. Fessenden's patents belong to the Dominion and his masts stand on our own headlands. The country's word crosses the air beyond the reach of any cable-landing right, the staff plans faster, and the treasury pays for every mast."
 CAN_r_the_home_table:0 "The Home Table"
 CAN_r_the_home_table_desc:0 "Marquis wheat north of the Saskatchewan, cold storage at the railway towns, sugar from our own beets. The harvest goes to the home table first and the export trade takes what is left; the country eats well, grows, and sells abroad a little less."
 CAN_r_the_frontier_army:0 "The Frontier Army"
 CAN_r_the_frontier_army_desc:0 "Permanent garrisons along the line from Esquimalt to Halifax by way of Winnipeg and the Niagara frontier: a standing force that watches south and east alike. Both Washington and London draw the inference, and the militia estimates are the largest item of the budget."
 CAN_r_the_arsenal_monopoly:0 "The Arsenal Monopoly"
 CAN_r_the_arsenal_monopoly_desc:0 "Shell, fuse, cordite, gun-carriage and harness are all struck at home and the contracts of Birmingham and Bridgeport are closed to us by our own hand. The army's every want goes to Canadian shops, which charge what a monopoly charges."
 CAN_r_waiting_for_canadian_shops:0 "Waiting for Canadian Shops"
 CAN_r_waiting_for_canadian_shops_desc:0 "The foreign contracts are closed and the home shops are not yet ready. For a time the army waits for what the country cannot yet build, and the factories learn their trade on the job."
 CAN_r_the_ross_proved:0 "The Ross Proved"
 CAN_r_the_ross_proved_desc:0 "The Ross is rebored, resighted and proved in mud and frost on our own ranges before it is trusted with a single life. The arsenals arm the nation from breech to bayonet, artillery included."
 CAN_r_the_price_of_pride:0 "The Price of Pride"
 CAN_r_the_price_of_pride_desc:0 "The schedules hold and the shops of Montreal and Toronto charge what the wall allows. The public grumbles at the prices, the manufacturers subscribe to the party, and the government finds it has money and fewer friends."
 CAN_r_the_silver_rush:0 "The Silver Rush"
 CAN_r_the_silver_rush_desc:0 "The new dollar rings on every counter and the camps of Cobalt draw prospectors from every province. The rock gives up more than silver, and the stores at the railhead charge silver prices."
 CAN_r_the_cables_cut:0 "The Cable-Landing Rights Denied"
 CAN_r_the_cables_cut_desc:0 "The Marconi board has its answer from the Colonial Office: no cable of the Empire shall land a Canadian message on favourable terms. The Dominion speaks by air or pays the full rate."
 CAN_r_the_trains_from_lowell:0 "The Trains from Lowell"
 CAN_r_the_trains_from_lowell_desc:0 "Our agents in Lowell, Woonsocket and Manchester hand out paid tickets north and a guaranteed post or lot at the end of the line. The mill hands come home by the trainload, and the treasury pays every fare."
 CAN_r_the_plough_marches_north:0 "The Plough Marches North"
 CAN_r_the_plough_marches_north_desc:0 "The settlement bonus goes to the clay belts, the Abitibi and the Peace: deep country, hard country, beyond the reach of any invader. The nation grows thick instead of long, and the roads north are paid for by everyone."
 CAN_r_the_bare_shops:0 "The Bare Shops"
 CAN_r_the_bare_shops_desc:0 "The barracks are superb and the shops are bare. This winter the estimates go to the works and the camps, and the shopkeepers and their customers are asked to wait."
 CAN_r_the_railway_levy:0 "The Railway Levy"
 CAN_r_the_railway_levy_desc:0 "The railways and the banks pay for the garrison this winter. The camps are kept, the shops are spared, and every company with a charter sends its lawyer to Ottawa."
 CAN_r_the_west_sulks:0 "The West Sulks"
 CAN_r_the_west_sulks_desc:0 "The farmers' company is broken on the floor and at the polls, and the Prairies answer by staying home. The bonus lands find fewer takers, the petitions stop, and Ottawa governs a quieter, angrier West."
 CAN_r_the_tariff_answered:0 "The Tariff Answered"
 CAN_r_the_tariff_answered_desc:0 "Washington answers the hermit with a schedule of its own. For a year the wall has a wall in front of it, and both sides pay for the view."
 CAN_r_dominion_steel_trust:0 "The Dominion Steel Trust"
 CAN_r_dominion_steel_trust_desc:0 "Sydney, the Soo and Hamilton are welded into one trust, gorged with bounties and ordered to roll rails, guns and ship plate before a single ingot goes abroad. Canadian steel serves Canadian ends first and profit last, and the bounties come from the taxpayer."
 CAN_r_paid_in_full:0 "Paid in Full"
 CAN_r_paid_in_full_desc:0 "The wall has held against both empires, the bins are full of our own wheat, the lamps burn on our own current and the dollar rings on Cobalt silver. The world calls us sullen; we call ourselves paid in full."
 CAN_dnc_two_nations_modifier:0 "The Question of the Two Races"
 CAN_dnc_two_nations_modifier_desc:0 "The fracture between French and English Canada and the anger of the Orange lodges weigh on the Dominion. Each point of fracture costs stability and recruitable population; each point of loyalist anger costs political power."
 CAN_r_two_nations_modifier_tt:0 "The question of the two races now weighs directly on the Dominion: each point of fracture costs 1.5% stability and 1% recruitable population, each point of loyalist anger costs 1.5% political power."
 CAN_r_fracture_m2_tt:0 "The fracture between the two nations closes by 2."
 CAN_r_le_devoir_coming_tt:0 "Bourassa is hunting for presses. A nationalist daily will answer the ledger in the next era."
 CAN_r_gouins_programme_bonus:0 "Gouin's Programme"
 CAN_r_naval_question_bonus:0 "The Naval Question"
 CAN_r_economic_policy_made_in_canada_bonus:0 "An Economic Policy Made in Canada"
 CAN_r_professors_from_france_bonus:0 "Instructing Officers From France"
 CAN_r_the_precedent_bonus:0 "The Precedent of the Contingent"
 CAN_r_english_schoolhouse_bonus:0 "The English Schoolhouse"
 CAN_r_harbour_works_bonus:0 "The Harbour Works"
 CAN_r_militia_regulations_bonus:0 "Regulations in Both Tongues"
 CAN_r_french_drill_bonus:0 "French Words of Command"
 CAN_r_compact_bonus:0 "The Compact of Two Nations"
 CAN_r_nationalist_canada_bonus:0 "A Nationalist Canada"
 CAN_r_admiralty_cheque_bonus:0 "The Admiralty's Designs"
 CAN_r_one_tongue_bonus:0 "The Estimates Carry a Fleet"
 CAN_r_yards_at_levis_bonus:0 "The Yards at Levis"
 CAN_r_quiet_province_bonus:0 "The Quiet Province"
 can_dnc_r.501.t:0 "The Lodges Answer the Compact"
 can_dnc_r.501.d:0 "The Grand Orange Lodge of British America sits at Toronto and resolves that a Dominion of two nations is a Dominion of one too many. Two hundred thousand members in Ontario and the West are told that the government has made a Frenchman the equal of a Briton by order in council. The resolution asks us, in so many words, which of the two nations we belong to."
 can_dnc_r.501.a:0 "We belong to the Dominion. Let them resolve what they like."
 can_dnc_r.501.b:0 "Send a minister to the Grand Lodge with assurances on the schools."
 can_dnc_r.501.c:0 "Answer them in French, from Quebec, and let Toronto read it."
 can_dnc_r.502.t:0 "Quebec Reads the Ordinance"
 can_dnc_r.502.d:0 "The Assembly at Quebec sits through the night over a school rule written at Regina for the whole Dominion. Bourassa asks from the gallery whether the Confederation bargain has a clause about the classroom, and the premier cannot find one. The parishes are told, from the pulpit, that their children west of the Red River will be schooled in a tongue not their own."
 can_dnc_r.502.a:0 "The majority pays for the schools. The majority sets the rule."
 can_dnc_r.502.b:0 "Let the early grades keep their French. The rest stands."
 can_dnc_r.503.t:0 "The Forest Concessions Come Out"
 can_dnc_r.503.d:0 "Gouin has the premiership and the file that won it: the timber limits, the names, the prices paid and the prices that should have been. He offers to publish the lot and govern clean, or to keep the file in his desk and govern as before. Either way the nationalists were right, and either way the province now belongs to him."
 can_dnc_r.503.a:0 "Publish it. A clean province is worth a bad season."
 can_dnc_r.503.b:0 "Keep the file. Gouin will know what it is for."
 can_dnc_r.504.t:0 "Drafted at the Department of Justice"
 can_dnc_r.504.d:0 "The draft of a written status for one province lies on the Minister's desk. French in the federal courts and the post office, the schools guaranteed, a share of the estimates fixed by law. Fitzpatrick warns that no Dominion has passed such a thing and that Westminster may be asked to say whether one can. The House sits in three weeks and the draft must go as it is, or go back."
 can_dnc_r.504.a:0 "Lay it before the House as drafted."
 can_dnc_r.504.b:0 "Strike the estimates clause. The rest goes forward."
 can_dnc_r.505.t:0 "Montreal Learns Arithmetic"
 can_dnc_r.505.d:0 "The Board of Trade at Montreal calls on the government to say whether the harbour works, the Grand Trunk shops and the tariff on the Saint Lawrence are measures the province has blocked. The answer is that they are not, and that the province will find out what it has blocked when the estimates are read. Saint James Street understands arithmetic. It is Saint-Jacques that worries us."
 can_dnc_r.505.a:0 "Let the province learn it. The estimates are the estimates."
 can_dnc_r.505.b:0 "Offer the harbour works back, to the Board of Trade and not the Assembly."
 can_dnc_r.506.t:0 "The Statute Read at Toronto"
 can_dnc_r.506.d:0 "The Act naming one province the home of a nation is read aloud at Massey Hall to a house that has come to boo it. The Mail and Empire prints it in full with the French clauses in heavier type. The lodges resolve, the boards of trade petition, and the member for Toronto Centre asks whether Ontario may also be a nation, and if not, why not."
 can_dnc_r.506.a:0 "The Act is the Act. Ontario is a province, and a great one."
 can_dnc_r.506.b:0 "Send a minister to explain it, and a vote for Toronto's harbour with him."
 can_dnc_r.507.t:0 "What English Canada Agreed To"
 can_dnc_r.507.d:0 "The compact is written, the statute is passed and not a warship has been laid down. Bourassa has what he asked the Commons for at the start of the decade. The Orange lodges have a grievance and a membership, and they mean to carry both into the next war the Empire finds. The question before us is not whether the compact holds. It is what English Canada thinks it signed."
 can_dnc_r.507.a:0 "It signed a partnership. We will govern as if it believes that."
 can_dnc_r.507.b:0 "It signed nothing. We will give it a fleet to feel better about."
 can_dnc_r.508.t:0 "Half the Clerks Fail"
 can_dnc_r.508.d:0 "The Civil Service Commission has held its first sitting in both languages and reports that half the clerks of the Dominion cannot pass it. The Post Office offers to grandfather its men; the Railway Commission offers to resign in a body; the Auditor General asks who will pay for the tutors. The rule is sound. The service is not yet."
 can_dnc_r.508.a:0 "The rule stands. Pay for the tutors."
 can_dnc_r.508.b:0 "Grandfather the clerks. The next generation will pass."
 can_dnc_r.509.t:0 "Ottawa Answers Over Its Own Signature"
 can_dnc_r.509.d:0 "The Dominion has informed the Colonial Office that no man, ship or dollar will be voted at Ottawa because London asks for it, and that no treaty will again be signed under an ambassador's cover. The despatch is courteous and is signed by the Canadian Prime Minister alone. Their Lordships must decide whether a colony has just declared something, and if so, what."
 can_dnc_r.509.a:0 "Take note, and say nothing the Dominion can quote."
 can_dnc_r.509.b:0 "Reply that the Empire's wars are the Dominion's whether Ottawa votes or not."
 can_dnc_r.510.t:0 "The Empire's First Defeat"
 can_dnc_r.510.d:0 "Toronto calls it the Empire's first defeat at the hands of one of its own children and holds a rally to say so. The Ligue governs, its weekly reads like a gazette, and the Dominion answers the Colonial Office over its own signature in both languages. The loyalists are in the street, not the parishes. Whatever we have made, it is a nationalist Canada, and Ontario must be told what place it has in one."
 can_dnc_r.510.a:0 "The same place as Quebec: a province of a country, not a county of an Empire."
 can_dnc_r.510.b:0 "Give Toronto the arsenal and the Grand Trunk shops. Loyalty has a payroll too."
 can_dnc_r.511.t:0 "A Majority's Dominion"
 can_dnc_r.511.d:0 "Whatever remains of Quebec's difference is administered in English and the estimates carry a fleet. Ontario has precisely what it asked of us at the start of the decade, and the lodges have asked for nothing since. The two-nations question is buried under a majority. It is the government's business to decide whether the grave is to be watched."
 can_dnc_r.511.a:0 "Watch it. Keep the militia districts of the Saint Lawrence at strength."
 can_dnc_r.511.b:0 "Let it lie. A quiet province is quiet because it has been answered."
 can_dnc_r.512.t:0 "Asselin Prints the Payroll"
 can_dnc_r.512.d:0 "Le Nationaliste gives its front page to a list: the concessions, the harbour works, the bridge contracts and the names against each, with the sum beside the name. Gouin says the list is accurate and the works are needed. Both things are true. The province reads the list over breakfast and decides, as it always does, whether to be ashamed or grateful."
 can_dnc_r.512.a:0 "Sue the paper. The writs are an advertisement, but so is silence."
 can_dnc_r.512.b:0 "Answer with a second list: the wages paid and the men at work."
 can_dnc_r.513.t:0 "The Lawn for the Pageants"
 can_dnc_r.513.d:0 "The Battlefields Commission has the deed to the Plains and the Governor General has a programme of pageants for them. Quebec asks whether the story told on the field is to stop at the Conquest or pass through it. The Commission asks for a grant either way."
 can_dnc_r.513.a:0 "An imperial pageant, with the Prince of Wales on the field."
 can_dnc_r.513.b:0 "A park for the city, and the pageant may stop where Quebec likes."
 can_dnc_r.514.t:0 "The Ledger Read Aloud"
 can_dnc_r.514.d:0 "The province ends the decade with no status, no fleet and no quarrel, and the Auditor General has added up what the quiet cost. Bourassa has found his presses; the first number of a nationalist daily will carry the ledger on its front page. Quiet is not the same as content, and the government must decide what to say when the bill is read in the House."
 can_dnc_r.514.a:0 "Say that the works are there to be seen, and the province is at peace."
 can_dnc_r.514.b:0 "Say nothing, and place the next contracts before the paper appears."
 CAN_r_dominion_economy:0 "The Dominion Economy"
 CAN_r_dominion_economy_desc:0 "Every tariff we set, every rail we lay and every settler we land changes the shape of the Dominion's economy. This is the sum of those choices."
 CAN_r_modify_dominion_economy_tt:0 "§YThe Dominion Economy§! is modified:"
 CAN_r_canadian_aviation:0 "Canadian Aviation"
 CAN_r_canadian_aviation_desc:0 "From a kite on the Bras d'Or to a corps with its own roundel, this is what the Dominion has made of the flying machine."
 CAN_r_modify_canadian_aviation_tt:0 "§YCanadian Aviation§! is modified:"
 CAN_r_homestead_survey_bonus:0 "The Homestead Survey"
 CAN_r_settlers_will_come_tt:0 "The first trainloads of settlers will reach the prairie within the month."
 CAN_r_imperial_granary_bonus:0 "Wheat for the Empire"
 CAN_r_liverpool_will_answer_tt:0 "The Liverpool millers will name their price within the month."
 CAN_r_continental_granary_bonus:0 "Wheat for the Continent"
 CAN_r_tariff_war_grain_tt:0 "§RThe tariff war with the republic holds our grain at the line.§!"
 CAN_r_sheepskin_bonus:0 "The Men in Sheepskin Coats"
 CAN_r_sifton_contradicts_tt:0 "§RThe West was promised to Britons; the open door now contradicts that promise.§!"
 CAN_r_the_west_will_answer_tt:0 "The older settlers of the West will have their say within the season."
 CAN_r_british_west_bonus:0 "A British West"
 CAN_r_door_reversed_tt:0 "§RThe door we threw open is now shut again, and the agents we paid are left holding their pamphlets.§!"
 CAN_r_harvest_will_come_tt:0 "The first Marquis harvest will come in within the season."
 CAN_r_steel_excavation_bonus:0 "Ore for the Furnaces"
 CAN_r_furnaces_will_answer_tt:0 "The first bounty claims will reach the treasury within the season."
 CAN_r_pacific_railways_bonus:0 "Three Roads to the Pacific"
 CAN_r_hill_competes_tt:0 "§RHill's lines from St. Paul already carry the western trade south; our new roads must fight them for every car.§!"
 CAN_r_grand_trunk_will_ask_tt:0 "The Grand Trunk will come back to the treasury for more within the year."
 CAN_r_one_road_bonus:0 "The Intercolonial Way"
 CAN_r_roads_already_built_tt:0 "§RThe second and third roads are already mortgaged; the minister resigns over a deed already done.§!"
 CAN_r_minister_will_resign_tt:0 "The Minister of Railways will tender his resignation within the week."
 CAN_r_rail_regulation_bonus:0 "The Board of Railway Commissioners"
 CAN_r_hydro_electric_bonus:0 "The Power of the Falls"
 CAN_r_promoters_are_american_tt:0 "§RThe syndicates we dispossess are financed in New York, and the continental partnership makes the quarrel dearer.§!"
 CAN_r_promoters_will_sue_tt:0 "The dispossessed promoters will go to court within the season."
 CAN_r_towns_will_complain_tt:0 "The towns will learn the syndicate's rates within the season."
 CAN_r_shield_mining_bonus:0 "The Ore Road North"
 CAN_r_refined_by_our_own_current_tt:0 "§GOur own cheap current refines the metal at home instead of shipping it raw to New Jersey.§!"
 CAN_r_the_rush_will_come_tt:0 "The rush to the silver camps will begin within the month."
 CAN_r_wall_against_the_partner_tt:0 "§RWe keep a wall against the very partner we court in Washington.§!"
 CAN_r_tariff_wall_bonus:0 "Behind the Customs House"
 CAN_r_wall_meets_wall_tt:0 "§RThe republic already answers our duties with its own; the higher wall makes the war of tariffs worse.§!"
 CAN_r_farmers_will_petition_tt:0 "The western farmers will send their petition against the implement duty within the season."
 CAN_r_road_south_bonus:0 "The Continental Market"
 CAN_r_reciprocity_already_tt:0 "§GReciprocity already stands with the republic; the road south is simply widened.§!"
 CAN_r_tariff_war_eases_tt:0 "§GThe war of tariffs with the republic eases as the road opens.§!"
 CAN_r_bankers_will_come_tt:0 "The general managers of the chartered banks will come to Ottawa within the month."
 CAN_r_private_credit_bonus:0 "Credit on Main Street"
 CAN_r_a_nations_money_tt:0 "§GA sovereign nation prints its own money; the Dominion note is a symbol as much as a currency.§!"
 CAN_r_dollar_already_continental_tt:0 "§ROur dollar already follows the American one; a public note fights the tide.§!"
 CAN_r_vaults_will_fill_tt:0 "The treasury will begin building its gold reserve within the season."
 CAN_r_harvest_credit_bonus:0 "Credit for the Crop"
 CAN_r_dominion_notes_carry_it_tt:0 "§GThe Dominion note carries the harvest without a banker's leave.§!"
 CAN_r_banks_meet_the_pinch_tt:0 "§GThe chartered banks meet the pinch from their own reserves.§!"
 CAN_r_new_york_money_frozen_tt:0 "§RThe New York houses that lend to us are frozen by the panic.§!"
 CAN_r_panic_will_test_us_tt:0 "The panic on Wall Street will test the Canadian banks within the month."
 CAN_r_aea_airframe_bonus:0 "The Association's Machines"
 CAN_r_bell_available_tt:0 "§YDr. Bell§! becomes available as a theorist."
 CAN_r_dart_already_bought_tt:0 "§GWe already own a flying machine; the association builds on what it knows.§!"
 CAN_r_bell_will_write_tt:0 "Dr. Bell will write to the government within the fortnight."
 CAN_r_own_doctrine_reduction:0 "A Doctrine of Our Own"
 CAN_r_imperial_air_doctrine:0 "The Empire's Doctrine"
 CAN_r_sovereign_wing_tt:0 "§RA sovereign nation lending its air to another crown sits ill with the men who made it sovereign.§!"
 CAN_r_lift_and_structure_bonus:0 "Lift and Structure"
 CAN_r_workshop_learns_tt:0 "§GBell's workshop is still open, and the kites teach it faster.§!"
 CAN_r_first_flight_bonus:0 "The First Flight"
 CAN_r_baldwin_available_tt:0 "§YCasey Baldwin§! becomes available as chief of the air service."
 CAN_r_the_dart_will_fly_tt:0 "The Silver Dart will make its flight within the week."
 CAN_r_petawawa_bonus:0 "The Aeroplane Before the Army"
 CAN_r_council_watches_tt:0 "§GThe Militia Council sends its own officers to watch the trial.§!"
 CAN_r_army_will_decide_tt:0 "The generals will give their verdict on the flying machine within the fortnight."
 CAN_r_militia_air_doctrine:0 "The Militia Takes to the Air"
 CAN_r_mccurdy_available_tt:0 "§YJ. A. D. McCurdy§! becomes available as chief of the air service."
 CAN_r_londons_standard_tt:0 "§GThe branch is raised to London's standard, and London approves.§!"
 CAN_r_estimate_well_spent_bonus:0 "Rifles Before Wings"
 CAN_r_canadian_art_abandoned_tt:0 "§RThe Canadian art of flight we promised to keep is left to the sportsmen.§!"
 CAN_r_our_men_abroad_tt:0 "Word of our airmen abroad will reach Ottawa within the season."
 CAN_r_corps_airframes_bonus:0 "Machines for the Corps"
 CAN_r_own_corps_doctrine:0 "The Corps Writes Its Own Book"
 CAN_r_sovereign_roundel_tt:0 "§GA sovereign nation with its own air arm: the roundel is a flag in the sky.§!"
 CAN_r_wing_becomes_corps_tt:0 "§YThe wing we promised the Empire becomes a corps of our own.§!"
 CAN_r_corps_will_need_machines_tt:0 "The new corps will need machines, and the question of where to buy them will come to cabinet within the month."
 CAN_r_imperial_wing_doctrine:0 "One Standard, One Design"
 CAN_r_art_folded_in_tt:0 "§YThe Canadian art of flight is folded into the Empire's service.§!"
 CAN_r_men_for_another_flag_bonus:0 "Lessons Learned Abroad"
 CAN_r_empire_gets_our_pilots_tt:0 "§YThe Empire's air service gains our pilots.§!"
 CAN_r_names_will_come_back_tt:0 "The first Canadian names will appear in the imperial squadron lists within the season."
 can_dnc_r.801.t:0 "The Sod-Busters Arrive"
 can_dnc_r.801.d:0 "The colonist cars are unloading at Winnipeg faster than the land office can stamp an entry. Families from Iowa and Nebraska, from Glasgow and Lemberg, sleep in the immigration sheds and walk out in the morning to find their quarter section. The city asks for inspectors and a hospital; the Interior Department asks only for more trains."
 can_dnc_r.801.a:0 "Open the sheds and let them walk to the land."
 can_dnc_r.801.b:0 "Hold them at the port for inspection and a medical."
 can_dnc_r.802.t:0 "The Liverpool Price"
 can_dnc_r.802.d:0 "The millers of Liverpool name their price for the season's wheat: a known figure, a little below what Minneapolis pays, and good for every bushel we can ship before the ice closes the river. The Grain Growers say we could do better on the open market; the Mother Country says the preference is worth more than a few cents a bushel."
 can_dnc_r.802.a:0 "A known price is worth the difference. Accept the Liverpool terms."
 can_dnc_r.802.b:0 "Hold the crop for a better market and let Liverpool bid again."
 can_dnc_r.803.t:0 "The Minneapolis Terms"
 can_dnc_r.803.d:0 "The milling houses of Minneapolis and Duluth will take every car the prairie can load, at a price set on their own exchange and subject to the American duty. The elevator companies have already signed; the Winnipeg board complains that the grade is judged in another country. The Americans offer to run the cars south all winter if we ask nothing about the tariff."
 can_dnc_r.803.a:0 "Take the American price and ask nothing about the tariff."
 can_dnc_r.803.b:0 "Subsidise the lake route to Fort William so the West has a second door."
 can_dnc_r.804.t:0 "Strangers on the Plains"
 can_dnc_r.804.d:0 "The Orange lodges of Manitoba and the Anglican synods of the Territories send their resolutions to Ottawa: the West is being filled with peoples who do not speak English, do not attend the public school and vote as their priest tells them. The Interior Minister answers that a Galician in a sheepskin coat breaks more sod than a clerk from Birmingham, and that the schools will make Canadians of the children."
 can_dnc_r.804.a:0 "Stand by the Minister. The land needs men, and the schools will do the rest."
 can_dnc_r.804.b:0 "Tighten the inspection at the ports and turn back the weakest."
 can_dnc_r.805.t:0 "The Marquis Harvest"
 can_dnc_r.805.d:0 "The new wheat comes in a full week ahead of the frost and grades No. 1 Northern across the whole parkland. The elevators at Saskatoon and Edmonton are full before the old belt has finished cutting. The cerealist who bred it asks for nothing but seed money for the next cross; the Grain Growers ask that the government hold seed back for the dry belt."
 can_dnc_r.805.a:0 "Hold seed back for the dry belt and let the north fill."
 can_dnc_r.805.b:0 "Sell every bushel and let the price speak for the West."
 can_dnc_r.806.t:0 "The Bounty Cheque at Sydney"
 can_dnc_r.806.d:0 "The Dominion Iron and Steel Company presents its first claim: so many tons of pig iron and steel ingot smelted at Sydney, so many dollars owing under the bounty act. The sum is larger than the estimate. The company says the furnaces will go cold without it; the Finance Minister says a bounty that grows with the output was exactly the bargain, and wonders aloud what the Soo and Hamilton will claim."
 can_dnc_r.806.a:0 "Pay the bounty in full. We said we would raise a steel industry."
 can_dnc_r.806.b:0 "Pay on the estimate and let the company carry the rest."
 can_dnc_r.807.t:0 "The Grand Trunk Asks More"
 can_dnc_r.807.d:0 "The Grand Trunk Pacific reports that the mountain sections cost more than its engineers allowed, that the bond market in London is cool, and that the Dominion's guarantee on its paper must be widened or the line stops at the foothills. The Canadian Northern, hearing of it, sends a similar letter the same week."
 can_dnc_r.807.a:0 "Widen the guarantee. The line must reach the Pacific."
 can_dnc_r.807.b:0 "Refuse. Let the companies find their own money."
 can_dnc_r.808.t:0 "The Minister Walks Out"
 can_dnc_r.808.d:0 "The Minister of Railways lays his resignation on the table rather than mortgage the Dominion to a second and a third Pacific road. He is half right and he knows the other half: the country will want those rails one day, and will pay more for them later. The Prime Minister can accept the letter with thanks, or let the press know that the minister left over a question of patronage."
 can_dnc_r.808.a:0 "Accept it with thanks and say he was right."
 can_dnc_r.808.b:0 "Let the papers hear another story."
 can_dnc_r.809.t:0 "The Promoters Go to Court"
 can_dnc_r.809.d:0 "The syndicate that held the Niagara franchise files for an injunction against the Hydro-Electric Commission and briefs counsel in London for the appeal. Their case is that a public body selling current at cost is confiscation by another name. The towns along the new transmission line have already strung their wires and do not intend to take them down."
 can_dnc_r.809.a:0 "Fight the injunction to the Privy Council if need be."
 can_dnc_r.809.b:0 "Buy the franchise out and let the syndicate keep a share for a time."
 can_dnc_r.810.t:0 "Current at the Market Rate"
 can_dnc_r.810.d:0 "The syndicate publishes its tariff for the Niagara current: one rate for the great consumers on the river, another for the towns and a third for the householder. The manufacturers of Toronto are content. The councils of the smaller towns say they were promised cheap power and have received an invoice, and a member from the north rises to ask whether the falls belong to the people or to a board of directors."
 can_dnc_r.810.a:0 "The market sets the rate. The manufacturers are served."
 can_dnc_r.810.b:0 "Fix a maximum rate for the towns and let the syndicate absorb it."
 can_dnc_r.811.t:0 "Silver at Cobalt"
 can_dnc_r.811.d:0 "The railway blacksmith who threw a hammer at a fox has found a vein of native silver, and the whole of the Temiskaming line is staked within the month. Prospectors are sleeping in the station. The Ontario government can let the rush run and tax the output, or reserve the richest ground for the Crown and lease it."
 can_dnc_r.811.a:0 "Let the rush run. The camps will bring the men north."
 can_dnc_r.811.b:0 "Reserve the best claims for the Crown and lease them."
 can_dnc_r.812.t:0 "The Western Farmers Petition"
 can_dnc_r.812.d:0 "The Grain Growers' associations of the three prairie provinces bring their petition to the bar of the House: the duty on implements, on binder twine and on lumber makes every acre cost more to farm, and the manufacturer in Ontario takes the difference. They do not ask for the wall to come down, only for a gate where the farmer can pass."
 can_dnc_r.812.a:0 "The wall stands whole. The manufacturer is the nation's ally."
 can_dnc_r.812.b:0 "Cut the implement duty and let the farmer through."
 can_dnc_r.813.t:0 "Ottawa Opens the Road South"
 can_dnc_r.813.d:0 "The Canadian government lowers its duties on the whole line of natural products and asks that we do the same. The farmers of the Northwest would buy their implements in Chicago and sell their wheat in Minneapolis; the milling and lumber interests of the border states want the trade, and the manufacturers of the East see a market of six millions opening. The Senate protectionists see a precedent."
 can_dnc_r.813.a:0 "Meet them at the line. Open the gate."
 can_dnc_r.813.b:0 "We keep our wall. Let them keep theirs."
 can_dnc_r.814.t:0 "Washington Opens the Gate"
 can_dnc_r.814.d:0 "The American answer is yes. The schedules are exchanged, the customs houses along the line receive their new tables, and the first cars of Canadian wheat and American implements cross within the week. The continent is one market for everything that grows."
 can_dnc_r.814.a:0 "The continent is one market."
 can_dnc_r.815.t:0 "Washington Keeps Its Wall"
 can_dnc_r.815.d:0 "The American answer is no. The protectionists in the Senate have decided that a gate cut for Canada is a gate cut for the world, and the President will not spend himself on it. Our duties are lowered and theirs are not; the farmer buys cheaper and the manufacturer is exposed for nothing."
 can_dnc_r.815.a:0 "We have opened our door to a closed one."
 can_dnc_r.816.t:0 "The Bankers Come to Ottawa"
 can_dnc_r.816.d:0 "The general managers of the chartered banks take the train from Montreal to sit with the Finance Minister over the revision. They ask for a wider note issue, a freer hand in the West and no public audit of their reserves. In return they offer to carry the Dominion's loans at a better rate than London and to open a branch in every prairie town with a grain elevator."
 can_dnc_r.816.a:0 "Give them the wider hand and take the better rate."
 can_dnc_r.816.b:0 "Hold them to the audit and let them grumble."
 can_dnc_r.817.t:0 "Gold in the Vaults"
 can_dnc_r.817.d:0 "The Receiver General reports that the Dominion note is circulating faster than the government's gold is accumulating behind it. To keep the public's faith the treasury must either buy gold on the London market at a price, or print against the credit of the country and trust that no one asks for specie all at once."
 can_dnc_r.817.a:0 "Buy the gold. Public money must be good money."
 can_dnc_r.817.b:0 "Print against the credit of the country."
 can_dnc_r.818.t:0 "The Panic Stops at the Line"
 can_dnc_r.818.d:0 "The New York trust companies are closing their doors and the American banks are paying out in scrip. In Canada not a single chartered bank has suspended; the emergency circulation carries the crop and the branches in the West pay in full. American depositors along the border are moving their balances north."
 can_dnc_r.818.a:0 "Take the deposits and say nothing unkind about the republic."
 can_dnc_r.818.b:0 "Lend the surplus back to New York at a panic rate."
 can_dnc_r.819.t:0 "A Letter from Baddeck"
 can_dnc_r.819.d:0 "Dr. Bell writes to the Militia Department. His association has an engine, a workshop and four young men who will fly anything that leaves the ground. He asks for no subsidy, only that an officer be detailed to watch the trials and that the Department say, in writing, that it is interested. Mrs. Bell, he adds, is paying for the rest."
 can_dnc_r.819.a:0 "Detail an officer and say we are interested."
 can_dnc_r.819.b:0 "Thank him and keep the Department's name out of it."
 can_dnc_r.820.t:0 "Ottawa Asks a Place in the Empire's Air"
 can_dnc_r.820.d:0 "The Canadian government asks that its infant aviation be tied to the imperial effort: designs and doctrine from the War Office, Canadian officers attached to the Balloon Factory and a promise of a place for Dominion airmen in whatever service the Empire raises. It costs us drawings and a few places at Farnborough, and it binds a Dominion closer."
 can_dnc_r.820.a:0 "Send the drawings and open Farnborough to them."
 can_dnc_r.820.b:0 "Aviation is an imperial matter. Thank them and keep it in London."
 can_dnc_r.821.t:0 "London Opens Farnborough"
 can_dnc_r.821.d:0 "The War Office answers with a set of drawings, a place for two Canadian officers at the Balloon Factory and a letter that speaks of the Dominion's airmen as part of the Empire's air. It is more than we asked for and less than a service of our own."
 can_dnc_r.821.a:0 "We take the drawings and the places."
 can_dnc_r.822.t:0 "London Answers Coolly"
 can_dnc_r.822.d:0 "The War Office thanks the Dominion for its interest and regrets that the aeroplane is an imperial question best left to the imperial authorities. No drawings are sent. Our airmen may apply to the British service as individuals, like anyone else."
 can_dnc_r.822.a:0 "Then we are individuals, like anyone else."
 CAN_r_farnborough_bonus:0 "The Drawings from Farnborough"
 can_dnc_r.823.t:0 "The Dart Lifts Off the Ice"
 can_dnc_r.823.d:0 "The Silver Dart runs along the ice of Baddeck Bay, lifts, and holds the air for half a mile before it settles again. A heavier-than-air machine has flown in the Empire, and it has flown here. The newspapers have it by nightfall. Dr. Bell asks whether the government will now buy the machine; the Militia Department asks whether it can carry a rifle."
 can_dnc_r.823.a:0 "Let the country enjoy it. The flight is its own reward."
 can_dnc_r.823.b:0 "Buy the machine and put it in the militia's hands."
 can_dnc_r.824.t:0 "The Generals at Petawawa"
 can_dnc_r.824.d:0 "The machine flies twice before the assembled officers and breaks a wheel in the sand on the third run. The generals have seen enough: it is a fragile thing, blind in weather, useless over ground the cavalry already scouts, and it has just been wrecked by a camp road. The Minister of Militia, who watched from the same hill, saw a machine fly."
 can_dnc_r.824.a:0 "The generals have spoken. The cavalry will do."
 can_dnc_r.824.b:0 "The Minister overrules them. Give the flyers another machine."
 can_dnc_r.825.t:0 "Our Men at Brooklands"
 can_dnc_r.825.d:0 "Word comes back from England and from Dayton: three young Canadians have taken their certificates at Brooklands and two more are at the Wright school. They write to ask whether there is any service at home that wants them. There is not. The Militia Department can wish them well, or pay their passage home and find them a shed."
 can_dnc_r.825.a:0 "Wish them well under whatever flag will have them."
 can_dnc_r.825.b:0 "Pay their passage home and find them a shed."
 can_dnc_r.826.t:0 "The Roundel on the Wing"
 can_dnc_r.826.d:0 "The corps exists on paper and needs machines. The Canadian Aerodrome Company at Baddeck can build them to order, slowly and dear; the British and American makers can ship them faster and cheaper, with another maker's name on the rudder. The first roundel will go on whichever wing we choose."
 can_dnc_r.826.a:0 "Order from Baddeck. The corps flies Canadian wings."
 can_dnc_r.826.b:0 "Buy abroad and fly sooner."
 can_dnc_r.827.t:0 "Ottawa Offers a Wing"
 can_dnc_r.827.d:0 "The Dominion offers to raise Canadian squadrons inside the imperial flying service, trained to our standard and flying our design, to be at the Empire's disposal from the first day of any war. They ask that the squadrons keep their Canadian name and a Canadian officer at their head. It is a gift of men and machines with a flag attached."
 can_dnc_r.827.a:0 "Accept the wing with its name and its officer."
 can_dnc_r.827.b:0 "Take the men into our own squadrons and let the name go."
 can_dnc_r.828.t:0 "London Accepts the Wing"
 can_dnc_r.828.d:0 "The War Office accepts the Canadian wing as offered: Canadian squadrons, a Canadian officer commanding, the imperial design and the imperial standard. Our airmen serve together and under their own name, inside a service large enough to matter."
 can_dnc_r.828.a:0 "A Canadian wing in the Empire's air."
 can_dnc_r.829.t:0 "London Takes the Men, Not the Wing"
 can_dnc_r.829.d:0 "The War Office will gladly take Canadian airmen into the imperial service, one by one, on the same terms as any other subject of the King. A separate Canadian wing with its own officer is a complication the service does not need. The men we trained will fly; the name we wanted will not."
 can_dnc_r.829.a:0 "We gave them a wing and they took the feathers."
 can_dnc_r.830.t:0 "A Canadian Name in a Foreign Squadron List"
 can_dnc_r.830.d:0 "The first Canadian names appear in the imperial squadron lists, and one of them has been mentioned for a feat of airmanship that the London papers call British. His home town in Ontario writes to Ottawa to ask why the government did not mention him first. The cheapest air policy there is turns out to have a price after all."
 can_dnc_r.830.a:0 "Let the Empire have the credit. It is the Empire's service."
 can_dnc_r.830.b:0 "Name him in the House and make the point that he is ours."
 CANDNC_p_the_other_ocean_tt:0 "§YThe Dominion turns its face west.§! The Pacific commerce becomes a national modifier that grows with every Pacific focus."
 CANDNC_p_the_other_ocean_bonus:0 "The Other Ocean"
 CANDNC_p_umbrella_holds_tt:0 "Britain and Japan stand in one camp: no one in London can call our courtship disloyal."
 CANDNC_p_umbrella_thin_tt:0 "London has not yet bound itself to Tokyo: the umbrella is thin, and we shall have to hold it up ourselves."
 CANDNC_p_silk_tea_bonus:0 "Silk, Tea and Steamers"
 CANDNC_p_silk_trains_bonus:0 "The Silk Trains"
 CANDNC_p_cpr_runs_the_specials_tt:0 "The Canadian Pacific runs the silk specials on its own steel:"
 CANDNC_p_no_cpr_contract_tt:0 "Without the Canadian Pacific under contract, the specials run on whatever steel will take them."
 CANDNC_p_legations_already_tt:0 "We already keep our own men abroad; Tokyo is one more capital that hears our voice:"
 CANDNC_p_treaty_bonus:0 "The Treaty in Force"
 CANDNC_p_treaty_in_our_name_tt:0 "The treaty bears our name alone, and the customs houses obey it:"
 CANDNC_p_treaty_under_the_empire_tt:0 "The treaty is countersigned for the Empire, and London takes a share of the credit:"
 CANDNC_p_treaty_in_force_tt:0 "§YThe Japanese treaty is in force.§! Our wheat, lumber and salmon enter Japan on the best terms Tokyo gives any flag."
 CANDNC_p_specie_bonus:0 "The Yokohama Specie Bank"
 CANDNC_p_money_has_no_accent_tt:0 "The City's premium no longer governs what we can build; yen takes up the paper Lombard Street refuses:"
 CANDNC_p_yokohama_bank_tt:0 "§YThe Yokohama Specie Bank opens on Hastings Street.§! Our great works are financed by whichever capital believes in them."
 CANDNC_p_prince_rupert_bonus:0 "Five Hundred Miles Closer"
 CANDNC_p_grand_trunk_steel_tt:0 "The Grand Trunk's steel reaches the harbour ahead of the engineers' promises:"
 CANDNC_p_yen_pays_the_dredges_tt:0 "Yen subscriptions pay for the dredges and the elevators:"
 CANDNC_p_city_pays_the_dredges_tt:0 "The City prices the dredges like a punishment, and the Treasury pays it:"
 CANDNC_p_league_wants_the_tax_tt:0 "The League points to the head tax and demands it be turned on Japan as well:"
 CANDNC_p_league_broken_tt:0 "§YThe Exclusion League is broken.§! The King's peace covers Japanese subjects as fully as any others, and British Columbia will remember who enforced it."
 CANDNC_p_quiet_word_tt:0 "Tokyo understands, without a line on paper, that fewer steerage tickets would spare us both."
 CANDNC_p_league_will_answer_tt:0 "§YBritish Columbia will answer.§!"
 CANDNC_p_the_pacific_gateway_tt:0 "§YCanada is the Pacific's northern gateway§! — British in name and Pacific in fact. The era closes on a Dominion that trades, builds and speaks across the other ocean."
 CANDNC_p_gateway_bonus:0 "The Pacific Gateway"
 CANDNC_p_cruisers_keep_our_coast_tt:0 "Japanese cruisers keep our coast, and Tokyo binds itself to defend it:"
 CANDNC_p_our_own_keels_tt:0 "Our own keels keep our coast, and the Kure school finishes their officers:"
 CANDNC_p_entrepot_bonus:0 "The Entrepôt of the North Pacific"
 CANDNC_p_bonded_at_prince_rupert_tt:0 "The bonded warehouses rise beside the dredged harbour at Prince Rupert:"
 CANDNC_p_two_markets_tt:0 "§YTwo markets, one Dominion.§! Wheat to Liverpool under preference, salmon to Yokohama under treaty, and no invitation to choose between them accepted. The era closes."
 CANDNC_p_two_markets_bonus:0 "Two Markets, One Dominion"
 CANDNC_p_no_quarrel_left_tt:0 "The Hayashi understanding has quieted the coast; there is no quarrel left to belong to:"
 CANDNC_p2_powell_bonus:0 "A Battalion from Powell Street"
 CANDNC_p2_powell_battalion_tt:0 "§YThe Powell Street Battalion§! is gazetted and drills superbly: a Coast Militia Brigade stands at Vancouver."
 CANDNC_p2_hose_waits_tt:0 "Walter Hose is not yet on our list: a Naval Service of our own would give the squadron its commander."
 CANDNC_p2_compact_bonus:0 "The Pacific Defence Compact"
 CANDNC_p2_compact_blessed_tt:0 "London has blessed the Compact, and the Admiralty comes to Esquimalt as a guest with good grace:"
 CANDNC_p2_compact_tolerated_tt:0 "London tolerates the Compact without blessing it; the Admiralty comes as a guest who did not ask to be invited:"
 CANDNC_p2_vancouver_conference_tt:0 "§YCanada is a recognized Pacific power.§! Every flag on the rim sends a plenipotentiary to Vancouver, and the chair at the head of the table is ours."
 CANDNC_p2_conference_bonus:0 "The Vancouver Conference"
 CANDNC_p2_open_door_guaranteed_tt:0 "The open door in China is written into the conference act, and we put our name to keeping it:"
 CANDNC_p2_empire_at_the_table_tt:0 "The Empire sits at our table as our guest, and London is grateful for the seat:"
 CANDNC_p2_our_own_chair_tt:0 "No one sits at our table for the Empire; the chair is ours alone:"
 CANDNC_p2_belligerents_come_tt:0 "The Tsar and the Mikado are at war, and both send their plenipotentiaries to our harbour:"
 CANDNC_p2_no_war_to_end_tt:0 "There is no war in Manchuria to end; the conference settles fisheries and cables, and the world notes who hosted it:"
 CANDNC_p2_peace_of_victoria_tt:0 "§YThe Peace of Victoria§! is signed under our roof: the war in Manchuria ends with our name as witness."
 CANDNC_p2_agreement_already_tt:0 "Immigration is already honoured by a gentlemen's agreement; the Understanding writes it into three capitals:"
 CANDNC_p2_fleet_announced_tt:0 "Under the Ottawa Understanding the fleet's movements are notified in advance; the courtesy is at least a courtesy:"
 CANDNC_p2_fleet_unannounced_tt:0 "No one told us the fleet was coming; the batteries learn of it from the smoke on the horizon:"
 CANDNC_p2_white_fleet_tt:0 "§YThe Militia must choose between the parade ground and the battery.§!"
 CANDNC_p2_hold_the_line_bonus:0 "Hold the Line"
 CANDNC_p2_garrison_tt:0 "§YThe Esquimalt Garrison§! entrains for the coast and mans the new batteries above the harbour."
 CANDNC_p2_commissioners_tt:0 "Incidents are referred to joint commissioners before they reach the newspapers:"
 CANDNC_p2_commissioners_already_tt:0 "The joint commissioners already sit; the memorandum gives them the Pacific as well:"
 CANDNC_p2_panhandle_bargain_tt:0 "§YWashington may sell, refuse, or take offence:§! the Panhandle's fate is decided in the White House, and our credit is pledged either way."
 CANDNC_p2_yen_backs_cheque_tt:0 "Japanese banks stand behind the cheque, and the burden on the Treasury is shortened:"
 CANDNC_p2_award_denounced_tt:0 "We denounced the boundary award; the country wants the coast back and will pay for it:"
 CANDNC_p2_award_accepted_tt:0 "We accepted the boundary award; the offer is made in good faith and the country takes it calmly:"
 CANDNC_p2_panhandle_province_tt:0 "§YThe coast is whole from Portland Canal to Icy Strait.§! The Panhandle is organized as Canada's newest province — bought, not bled for."
 CANDNC_p2_panhandle_bonus:0 "The Panhandle Province"
 CANDNC_p2_neutrality_kept_tt:0 "Our Pacific neutrality was the price of the purchase, and we keep it."
 CANDNC_p2_silk_trains_bonus:0 "Ninety Hours to New York"
 CANDNC_p2_yen_line_bonus:0 "The Yen Finishes the Line"
 CANDNC_p2_yen_closes_the_books_tt:0 "Japanese subscriptions close the books that Lombard Street kept open at a premium:"
 CANDNC_p2_empress_bonus:0 "The Empress Run"
 CANDNC_p2_skeena_bonus:0 "Villages on the Skeena"
 CANDNC_p2_league_rages_tt:0 "The Exclusion League rages in Vancouver at every charter signed:"
 CANDNC_p2_two_tongues_bonus:0 "A Province in Two Tongues"
 CANDNC_p2_company_coast_bonus:0 "The Company Coast"
 CANDNC_p2_all_silk_bonus:0 "All the Silk of Asia"
 CANDNC_p2_rate_war_won_tt:0 "The rate war is won; San Francisco's shipping men count their losses while ours count silk:"
 CANDNC_p2_golden_corridor_tt:0 "§YThe Golden Corridor.§! From a godown in Shanghai to a vault on Wall Street, the richest trade route on earth runs under our flag or our freight-bills, tolled in Canadian dollars."
 CANDNC_p2_corridor_bonus:0 "The Golden Corridor"
 CANDNC_p2_tills_louder_than_guns_tt:0 "The modus vivendi holds, and Washington prefers the tills to the guns:"
 CANDNC_p2_grievance_buried_tt:0 "The tolls of the corridor bury the Panhandle grievance:"
 CAN_dnc_pacific_commerce:0 "The Pacific Commerce"
 CAN_dnc_pacific_commerce_desc:0 "The Dominion's trade across the other ocean, grown focus by focus: silk, tea, wheat and yen."
 CAN_dnc_pacific_squadron:0 "The Pacific Station"
 CAN_dnc_pacific_squadron_desc:0 "The ships, yards and officers that keep our own ocean west of the Rockies."
 can_dnc_r.601.t:0 "The Dominion Turns West"
 can_dnc_r.601.d:0 "Ottawa's new policy reaches us through the consul at Vancouver: the Canadians mean to find their future on the Pacific, and they mean to find it with us. Their wheat and timber are welcome; their intentions are worth weighing."
 can_dnc_r.601.a:0 "Welcome the Dominion as a customer and a friend"
 can_dnc_r.601.b:0 "Customers are welcome; friends are chosen slowly"
 can_dnc_r.601.c:0 "A dominion speaks for London, not for itself"
 can_dnc_r.602.t:0 "A Canadian in Yokohama"
 can_dnc_r.602.d:0 "The Dominion has posted a trade commissioner to Yokohama with samples in his trunk and the tariff schedule by heart. He is not an ambassador, Ottawa assures us, whatever he may resemble."
 can_dnc_r.602.a:0 "A trade agent, nothing more"
 can_dnc_r.602.b:0 "Remind Ottawa of the Foreign Office's prerogative"
 can_dnc_r.602.c:0 "Let the Ambassador keep an eye on him"
 can_dnc_r.603.t:0 "Broken Glass on Powell Street"
 can_dnc_r.603.d:0 "A mob has marched through Vancouver behind the Exclusion League's banners and broken the windows of our subjects' shops. The treaty we signed with the Dominion governs its customs houses; whether it governs its streets is now the question."
 can_dnc_r.603.a:0 "Demand an apology and compensation"
 can_dnc_r.603.b:0 "Wait and see what Ottawa does"
 can_dnc_r.603.c:0 "Trust the Dominion to keep its own peace"
 can_dnc_r.605.t:0 "British Columbia Answers the Open Door"
 can_dnc_r.605.d:0 "The Exclusion League has filled the Vancouver opera house and every provincial member is on the platform. They demand a head tax, a dictation test, anything with a polite name. We can govern anyway, or we can give them a statute to take home."
 can_dnc_r.605.a:0 "We govern anyway"
 can_dnc_r.605.b:0 "A literacy test, and nothing more"
 can_dnc_r.606.t:0 "Canada Orders from Kure"
 can_dnc_r.606.d:0 "The Dominion has ordered its Pacific flotilla from the Japanese yards at Kure and taken Japanese instructors aboard. The Admiralty is not accustomed to being undersold by an ally in its own dominion."
 can_dnc_r.606.a:0 "Offer British hulls at cost before the contracts close"
 can_dnc_r.606.b:0 "Protest the precedent"
 can_dnc_r.606.c:0 "Let them buy what they please"
 can_dnc_r.607.t:0 "A Legation in Tokyo"
 can_dnc_r.607.d:0 "Ottawa has raised its commissioner to a minister plenipotentiary and opened the first Canadian legation anywhere on earth — not in London, not in Washington, but in Tokyo. The precedence tables are in some disorder."
 can_dnc_r.607.a:0 "Let the tables be rewritten"
 can_dnc_r.607.b:0 "Protest formally and privately"
 can_dnc_r.607.c:0 "The Ambassador holds precedence, and the Canadians are told so"
 can_dnc_r.608.t:0 "The Gateway of the Pacific"
 can_dnc_r.608.d:0 "The silk lands at Prince Rupert, the wheat sails for Yokohama, and the Colonial Office's despatches go unanswered for weeks because there is nothing left in them we need. The Governor General asks, politely, what the Dominion now calls itself."
 can_dnc_r.608.a:0 "British in name"
 can_dnc_r.608.b:0 "Pacific in fact"
 can_dnc_r.609.t:0 "Hayashi's Reply"
 can_dnc_r.609.d:0 "Ottawa asks what no statute may say aloud: that we ourselves limit the men we send to the Dominion, and keep the honour of the choosing. No exclusion act would stain the treaty; no mob would rule their ports."
 can_dnc_r.609.a:0 "We will choose our own emigrants"
 can_dnc_r.609.b:0 "Agreed, at a price in the tariff"
 can_dnc_r.609.c:0 "Our subjects are not cargo to be counted"
 can_dnc_r.611.t:0 "The Pacific Compact"
 can_dnc_r.611.d:0 "Ottawa and Tokyo have guaranteed the status quo of the North Pacific between them: no coast changes hands and no port closes without answer from both their navies. The Dominion calls it the peace of its ocean. The Navy Department calls it impertinence."
 can_dnc_r.611.a:0 "Impertinence, and we shall say so"
 can_dnc_r.611.b:0 "Note it coldly"
 can_dnc_r.611.c:0 "Two navies watching our coast is two fewer we must build"
 can_dnc_r.612.t:0 "Over Ottawa's Seal"
 can_dnc_r.612.d:0 "The Dominion has published its Pacific Compact over its own seal and receives the ambassadors' notes in Ottawa. No counter-signature was asked of us. Britain, they say, is their mother and not their keeper."
 can_dnc_r.612.a:0 "Accept the fait accompli"
 can_dnc_r.612.b:0 "The Admiralty's contracts can go elsewhere"
 can_dnc_r.612.c:0 "The Governor General will make our displeasure known"
 can_dnc_r.613.t:0 "The Vancouver Conference"
 can_dnc_r.613.d:0 "Every flag on the Pacific rim has sent a plenipotentiary, and the chair at the head of the table is ours. Boundaries, fisheries, cables and the open door are on the agenda; we may press hardest on whichever we please."
 can_dnc_r.613.a:0 "The fisheries line"
 can_dnc_r.613.b:0 "The Pacific cables"
 can_dnc_r.613.c:0 "The open door"
 can_dnc_r.614.t:0 "Tokyo Does Not Forget"
 can_dnc_r.614.d:0 "The peace signed at Victoria reads, in its coaling clauses and its fisheries line, a shade better for us than for Petersburg. The Canadians tipped the scales and said nothing. We know, and we do not forget."
 can_dnc_r.614.a:0 "Open our coaling stations to their squadron"
 can_dnc_r.614.b:0 "A railway concession for their northern line"
 can_dnc_r.614.c:0 "Our thanks, and our discretion"
 can_dnc_r.615.t:0 "Sixteen White Battleships"
 can_dnc_r.615.d:0 "Sixteen white battleships steam past the harbour mouth, bands playing, guns run out in courtesy. The message is addressed to Tokyo but the envelope bears our name. The batteries above Esquimalt want to know whether to salute or to load."
 can_dnc_r.615.a:0 "Return the courtesy, gun for gun"
 can_dnc_r.615.b:0 "Keep the guns manned and the bands silent"
 can_dnc_r.615.c:0 "Wire London"
 can_dnc_r.616.t:0 "The Canadians Do Not Blink"
 can_dnc_r.616.d:0 "The Dominion's Militia has entrained for the coast, the new batteries above Esquimalt track the fleet, and not one Canadian tariff schedule has changed by a comma. If the cruise was meant to frighten Ottawa, Ottawa has misjudged nothing."
 can_dnc_r.616.a:0 "The fleet sails on"
 can_dnc_r.616.b:0 "Press the tariff bill in Congress"
 can_dnc_r.616.c:0 "Concede the point with good grace"
 can_dnc_r.617.t:0 "Ottawa Bids for the Panhandle"
 can_dnc_r.617.d:0 "The Dominion stands at Washington's door with Japanese banks behind its cheque and asks the republic to name its price for the Alaska Panhandle. Our own embarrassment over the boundary award is, Ottawa implies, part of the collateral."
 can_dnc_r.617.a:0 "Back the cheque with the Treasury's name"
 can_dnc_r.617.b:0 "An embarrassed silence"
 can_dnc_r.617.c:0 "Warn Ottawa against provoking the republic"
 can_dnc_r.619.t:0 "Two Tongues in the House"
 can_dnc_r.619.d:0 "The north coast has returned its first member, and his petition to take the oath is printed in two languages. The House may seat him now, or find a reason to wait."
 can_dnc_r.619.a:0 "Seat the member"
 can_dnc_r.619.b:0 "Refer the petition to committee"
 CAN_r_the_cadres_of_the_acjc:0 "The Cadres of the ACJC"
 CAN_r_the_cadres_of_the_acjc_desc:0 "The Jesuits' youth league trains the men the Ligue will need in twenty years. They read Le Nationaliste and they do not read the recruiting posters."
 CAN_r_the_pulpits_of_sixty_five_ridings:0 "The Pulpits of Sixty-Five Ridings"
 CAN_r_the_pulpits_of_sixty_five_ridings_desc:0 "The delegate has been received and the episcopate is content. The parishes are quiet and the government is reminded, every Sunday, who made them so."
 CAN_r_the_opposition_on_the_floor:0 "The Opposition on the Floor"
 CAN_r_the_opposition_on_the_floor_desc:0 "Bourassa and Lavergne sit in the Assembly at Quebec and cross-examine every estimate. The province has found its voice and Ottawa has found its critic."
 CAN_r_separate_schools_guaranteed:0 "Separate Schools Guaranteed"
 CAN_r_separate_schools_guaranteed_desc:0 "The new provinces keep the schools the minority was promised. Sifton has gone and his settlers come slower; French Canada keeps faith with Ottawa."
 CAN_r_the_french_fact_in_the_west:0 "The French Fact in the West"
 CAN_r_the_french_fact_in_the_west_desc:0 "French beyond the early grades and separate schools funded across the prairie. The bishops have what they asked and Regina has a grievance to last a generation."
 CAN_r_the_tercentenary_fete:0 "The Tercentenary Fete"
 CAN_r_the_tercentenary_fete_desc:0 "Champlain lands again below the Citadel and the French delegation has pride of place. The province is in a festival mood and the pageants are paid from the estimates."
 CAN_r_the_precedent_admitted:0 "The Precedent Admitted"
 CAN_r_the_precedent_admitted_desc:0 "The House has said that the order sending the contingent binds the Dominion. The militia takes it as a promise and Quebec takes it as a warning."
 CAN_r_the_lords_day_act:0 "The Lord's Day Act"
 CAN_r_the_lords_day_act_desc:0 "A Protestant sabbath under the federal criminal law. The lodges approve, the mills stand idle one day in seven, and the parishes keep their own calendar out of spite."
 CAN_r_the_boards_of_trade_petition:0 "The Boards of Trade Petition"
 CAN_r_the_boards_of_trade_petition_desc:0 "Toronto asks why one province is a divisor and theirs is merely counted. The petition is on every desk at Ottawa and in every column at Quebec."
 CAN_r_the_quarrel_in_the_church:0 "The Quarrel in the Church"
 CAN_r_the_quarrel_in_the_church_desc:0 "An Irish bishop against the bilingual schools of his own flock. The lodges are delighted, the government is spared a fight, and the Ottawa valley is not."
 CAN_r_the_federal_majority:0 "The Federal Majority"
 CAN_r_the_federal_majority_desc:0 "Every measure Quebec blocked goes through without it. The House is efficient and the province is counted, not consulted."
 CAN_r_the_gilded_estimates:0 "The Gilded Estimates"
 CAN_r_the_gilded_estimates_desc:0 "Harbour works, bridges and contracts flow to the Saint Lawrence. The yards are busy, the press is quiet and the Treasury pays for both."
 CAN_r_french_words_of_command:0 "French Words of Command"
 CAN_r_french_words_of_command_desc:0 "The Carabiniers serve in their own language under their own officers, and the Militia Council prints in both tongues. French Canada enlists; the staff college grumbles."
 CAN_r_quebecs_veto:0 "Quebec's Veto"
 CAN_r_quebecs_veto_desc:0 "Not a keel is laid until the Assembly at Quebec has voted for it. The estimates go ashore, the province is content and the Admiralty has stopped writing."
 CAN_r_not_a_man_not_a_ship:0 "Not a Man, Not a Ship"
 CAN_r_not_a_man_not_a_ship_desc:0 "Nothing is voted at Ottawa because London asked for it. The rule is understood in every capital, and the Dominion is slower to every quarrel for it."
 CAN_r_the_cheque_voted:0 "The Cheque Voted"
 CAN_r_the_cheque_voted_desc:0 "The Admiralty has its contribution. Ontario is proud of it, the Treasury is short by it, and Quebec has not forgotten who voted it."
 CAN_r_the_separatist_crisis:0 "The Separatist Crisis"
 CAN_r_the_separatist_crisis_desc:0 "The Assembly resolves that a province taxed against its consent is not governed by it. The militia districts are warned and the word is on the order paper."
 CAN_r_the_militia_in_the_streets:0 "The Militia in the Streets"
 CAN_r_the_militia_in_the_streets_desc:0 "The Champ de Mars is held by soldiers. Nobody enlists in a town where the militia reads proclamations, and nobody forgets which regiment read them."
 CAN_r_the_payroll_answers_the_press:0 "The Payroll Answers the Press"
 CAN_r_the_payroll_answers_the_press_desc:0 "Asselin prints the scandal and Gouin prints the cheques. The province is content, the Treasury is not, and the ledger is being kept for later."
 CAN_r_the_battlefields_park:0 "The Battlefields Park"
 CAN_r_the_battlefields_park_desc:0 "The field where Montcalm and Wolfe fell is a lawn for pageants. The Empire approves of the grass, and Quebec is asked not to read what lies under it."
 CAN_r_the_yards_stand_ready:0 "The Yards Stand Ready"
 CAN_r_the_yards_stand_ready_desc:0 "Levis and Sorel are paid to be ready for ships that are not voted. It is a slow way to build a navy and a fast way to keep a province quiet."
 CAN_r_the_homestead_rush:0 "The Homestead Rush"
 CAN_r_the_homestead_rush_desc:0 "Every train west carries a new township. The land office cannot stamp the entries fast enough, and the price of everything a settler needs climbs with him."
 CAN_r_the_continental_granary:0 "The Continental Granary"
 CAN_r_the_continental_granary_desc:0 "The harvest runs south to the mills of Minneapolis and Duluth. The price is good and the cars run all winter, but the price is set in another man's capital."
 CAN_r_the_sheepskin_settlers:0 "The Men in Sheepskin Coats"
 CAN_r_the_sheepskin_settlers_desc:0 "Galician, Doukhobor and Ruthenian break the land no Englishman would touch. They are many and they are strong, and the older Canada does not yet know what to make of them."
 CAN_r_marquis_granary:0 "The Marquis Granary"
 CAN_r_marquis_granary_desc:0 "A wheat that ripens a week ahead of the frost throws the parkland and the dry belt open to the plough. The Dominion becomes a granary first and a workshop second."
 CAN_r_the_bumper_crop:0 "The Bumper Crop"
 CAN_r_the_bumper_crop_desc:0 "The elevators overflow and every siding on the prairie is a wall of grain cars. For one season the whole Dominion eats and sells on the harvest."
 CAN_r_the_steel_bounty:0 "The Steel Bounty"
 CAN_r_the_steel_bounty_desc:0 "The treasury pays on every ton smelted on Canadian soil. The furnaces at Sydney, the Soo and Hamilton answer, and the taxpayer carries the smoke."
 CAN_r_the_railway_boom:0 "The Railway Boom"
 CAN_r_the_railway_boom_desc:0 "Three lines race for the Pacific trade on the Dominion's credit. Every town wants a station, every contractor wants a bond, and the interest comes due long before the traffic."
 CAN_r_the_iron_horse_under_the_law:0 "The Iron Horse Under the Law"
 CAN_r_the_iron_horse_under_the_law_desc:0 "A board above the railways fixes their rates, orders their crossings and hears the shipper's complaint. The roads build less freely and the farmer pays less dearly."
 CAN_r_the_syndicate_at_the_falls:0 "The Syndicate at the Falls"
 CAN_r_the_syndicate_at_the_falls_desc:0 "Private capital harnesses Niagara and sells the current at what the market will bear. The lines go up fast, and the bill goes to every household."
 CAN_r_the_treasure_house_of_the_shield:0 "The Treasure House of the Shield"
 CAN_r_the_treasure_house_of_the_shield_desc:0 "Silver at Cobalt, nickel under Sudbury, a clay belt and forests without end. The Shield is no longer a barrier but the Dominion's strongbox, and the camps that open it are rough places."
 CAN_r_the_cobalt_silver_rush:0 "The Silver Rush"
 CAN_r_the_cobalt_silver_rush_desc:0 "Every train north is full of men with a pick and a claim form. The camps swell, the ore road is never empty, and the law arrives a season behind the prospectors."
 CAN_r_the_national_policy:0 "The National Policy"
 CAN_r_the_national_policy_desc:0 "The factory in Montreal and the mill in Ontario grow up behind the customs house. The manufacturer prospers, and everything the farmer buys costs more than it would across the line."
 CAN_r_the_tariff_wall:0 "The Tariff Wall"
 CAN_r_the_tariff_wall_desc:0 "The customs wall stands higher with a gate cut in it for British goods alone. The manufacturer is our firm ally; the western farmer, who buys dear, is our standing grievance."
 CAN_r_the_decennial_compact:0 "The Decennial Compact"
 CAN_r_the_decennial_compact_desc:0 "The chartered banks hold their renewed charter for a decade. Credit flows on known terms, and a handful of houses on St. James Street decide who gets it."
 CAN_r_the_chartered_banks:0 "The Chartered Banks"
 CAN_r_the_chartered_banks_desc:0 "The nation's money rests with the chartered houses whose branches reach every main street. They know their business; in a bad year they also know how to call a loan."
 CAN_r_the_credit_boom:0 "The Credit Boom"
 CAN_r_the_credit_boom_desc:0 "The banks lend freely on land, on rails, on anything with a prospectus. Every town has a new block going up and a new mortgage behind it."
 CAN_r_notes_for_the_harvest:0 "Notes for the Harvest"
 CAN_r_notes_for_the_harvest_desc:0 "The banks swell their issue past the old limit to carry the crop to port. The grain moves, the elevators pay, and the vaults are thinner than the law once allowed."
 CAN_r_bells_workshop:0 "Bell's Workshop at Baddeck"
 CAN_r_bells_workshop_desc:0 "On the shore of the Bras d'Or a handful of young engineers build whatever will lift a man. Every failure teaches more than a library."
 CAN_r_a_canadian_art:0 "A Canadian Art of Flight"
 CAN_r_a_canadian_art_desc:0 "The machines, the men and the patents stay here and answer to Ottawa. It is a small aviation and a dear one."
 CAN_r_a_wing_of_the_empire:0 "A Wing of the Empire's Air"
 CAN_r_a_wing_of_the_empire_desc:0 "Our designs and our doctrine come from London, and our airmen hold a place in the larger service. What we fly is decided elsewhere."
 CAN_r_first_in_the_empire_to_fly:0 "First in the Empire to Fly"
 CAN_r_first_in_the_empire_to_fly_desc:0 "A heavier-than-air machine lifts off the ice of Baddeck Bay and holds the air. We have flown before Britain, before them all, and every young man with nerve wants a seat in it."
 CAN_r_the_militia_aviation_branch:0 "The Militia Aviation Branch"
 CAN_r_the_militia_aviation_branch_desc:0 "A handful of officers, a shed and a machine or two, carried on the militia estimate. When the aeroplane matters, we will not be starting from nothing."
 CAN_r_the_estimate_well_spent:0 "The Estimate Well Spent"
 CAN_r_the_estimate_well_spent_desc:0 "Not a dollar of the defence vote goes to a flying toy. The rifles are newer and the guns are more, and whoever learns to fly does it at his own expense."
 CAN_r_wings_built_at_home:0 "Wings Built at Home"
 CAN_r_wings_built_at_home_desc:0 "McCurdy and Baldwin build machines to order at Baddeck, the first aeroplane works in the country. The contract keeps them here, and the contract is paid for."
 CAN_r_the_canadian_flying_corps:0 "The Canadian Flying Corps"
 CAN_r_the_canadian_flying_corps_desc:0 "Our own machines, our own officers, our own roundel on the wing. It answers to Ottawa alone, and Ottawa pays for every rib and wire of it."
 CAN_r_a_canadian_wing_of_the_flying_corps:0 "A Canadian Wing of the Flying Corps"
 CAN_r_a_canadian_wing_of_the_flying_corps_desc:0 "Canadian squadrons inside the imperial flying service, trained to one standard and flying one design. We take the strength of numbers over the pride of a flag, and London writes the orders."
 CAN_r_men_for_another_flag:0 "Men for Another Flag"
 CAN_r_men_for_another_flag_desc:0 "Our airmen sign on with the imperial service and carry Canadian names into a foreign squadron list. It is the cheapest air policy there is, and the emptiest."
 CAN_r_speaking_warmly_of_tokyo:0 "Speaking Warmly of Tokyo"
 CAN_r_speaking_warmly_of_tokyo_desc:0 "Our ministers speak of Tokyo warmly and often, and cite the alliance chapter and verse. The Militia lobby finds fewer ears."
 CAN_r_the_steamer_subsidy:0 "The Steamer Subsidy"
 CAN_r_the_steamer_subsidy_desc:0 "The public purse doubles the sailings. Every bale landed on our wharves is an argument, and every voyage is a bill."
 CAN_r_samples_in_his_trunk:0 "Samples in His Trunk"
 CAN_r_samples_in_his_trunk_desc:0 "A resident commissioner sells Canadian wheat, timber and salmon door to door in Yokohama, with the tariff schedule by heart."
 CAN_r_the_silk_timetable:0 "The Silk Timetable"
 CAN_r_the_silk_timetable_desc:0 "Silk rots and silk pays, so silk shall not wait. The specials have the right of way over every train on the line, and the line builds to keep up."
 CAN_r_a_minister_abroad:0 "A Minister Abroad"
 CAN_r_a_minister_abroad_desc:0 "A minister of the Crown is across the Pacific with a brief far wider than his instructions admit. Cabinet is one chair short and Tokyo is one friend richer."
 CAN_r_the_forms_observed:0 "The Forms Observed"
 CAN_r_the_forms_observed_desc:0 "The forms of the Empire are observed while the substance is entirely our own. Proper clothes are slow to put on."
 CAN_r_the_storm_from_london:0 "The Storm from London"
 CAN_r_the_storm_from_london_desc:0 "London has read of the treaty in the morning papers. The City sulks, the Colonial Office thunders, and the country rather enjoys it."
 CAN_r_the_familiar_premium:0 "The Familiar Premium"
 CAN_r_the_familiar_premium_desc:0 "We pay the familiar premium for the familiar peace. The works go slower, the Empire's purse-strings stay closed to no one, and nobody in Whitehall loses sleep."
 CAN_r_powell_street_riot:0 "The Riot on Powell Street"
 CAN_r_powell_street_riot_desc:0 "A mob has marched behind the Exclusion League's banners and broken the windows of Powell Street. Tokyo watches to see whether the treaty governs the country."
 CAN_r_the_militia_on_powell_street:0 "The Militia on Powell Street"
 CAN_r_the_militia_on_powell_street_desc:0 "The ringleaders are in the dock and the Militia is posted on Powell Street. Votes are lost in British Columbia, and we lose them with our eyes open."
 CAN_r_the_glass_paid_for:0 "The Glass Paid For"
 CAN_r_the_glass_paid_for_desc:0 "We pay for the broken glass of Powell Street in full and praise the treaty in public. It is not heroic; it is government."
 CAN_r_guests_of_the_rising_sun:0 "Guests of the Rising Sun"
 CAN_r_guests_of_the_rising_sun_desc:0 "The Imperial Japanese Navy coals and docks at Esquimalt and counts our coast within its station. Our crews learn from theirs, and British Columbia watches the flags."
 CAN_r_the_first_legation:0 "The First Legation"
 CAN_r_the_first_legation_desc:0 "The first Canadian legation anywhere on earth is open in Tokyo. The precedence tables of the Empire make of it what they will, and the rent is ours."
 CAN_r_the_gateway_boom:0 "The Gateway Boom"
 CAN_r_the_gateway_boom_desc:0 "Silk, wheat and money move through the western gate faster than the towns can build to hold them. Everything is for sale and nothing is finished."
 CAN_r_quiet_with_whitehall:0 "Quiet with Whitehall"
 CAN_r_quiet_with_whitehall_desc:0 "London has our assurance that the Japanese treaty is a ledger, not an alliance. No coaling rights, no staff talks, no politics in the cargo."
 CAN_r_full_manifests:0 "Full Manifests"
 CAN_r_full_manifests_desc:0 "No alliance, no squadron, no scandal — only manifests, and all of them full."
 CAN_r_the_pacific_squadron:0 "The Pacific Squadron"
 CAN_r_the_pacific_squadron_desc:0 "Kure-pattern cruisers, Canadian crews, and gunnery scores that would make the Channel Fleet blush. A squadron worthy of the name stands out to sea under our flag west of the Rockies, and the Treasury pays its coal."
 CAN_r_over_our_own_seal:0 "Over Our Own Seal"
 CAN_r_over_our_own_seal_desc:0 "The Compact is published over our own seal and the ambassadors' notes are received in Ottawa. Britain is our mother, not our keeper, and the City prices the difference."
 CAN_r_whitehalls_cold_shoulder:0 "Whitehall's Cold Shoulder"
 CAN_r_whitehalls_cold_shoulder_desc:0 "The Admiralty's coal contracts go elsewhere and the Colonial Office answers our despatches by return of the slowest packet."
 CAN_r_the_conference_season:0 "The Conference Season"
 CAN_r_the_conference_season_desc:0 "Plenipotentiaries fill the hotels of Vancouver, and every chancellery on the ocean keeps a clerk in the city. The bills are considerable, and so is the standing."
 CAN_r_plenipotentiaries_at_victoria:0 "Plenipotentiaries at Victoria"
 CAN_r_plenipotentiaries_at_victoria_desc:0 "The delegations of the Tsar and the Mikado are under our roof, and Mr. Roosevelt is reading about it in the newspapers."
 CAN_r_the_tsars_grievance:0 "The Tsar's Grievance"
 CAN_r_the_tsars_grievance_desc:0 "Petersburg suspects the scales were tipped and cannot prove it. Russian orders go elsewhere, and the Militia rather likes having an enemy."
 CAN_r_the_ottawa_understanding:0 "The Ottawa Understanding"
 CAN_r_the_ottawa_understanding_desc:0 "A Pacific Non-Aggression Understanding, drafted in Ottawa and initialed by three flags: fleets notified of their movements, no fortifying of new islands, immigration honoured by gentlemen. We are the clearing-house for peace, and peace is slow to justify a war."
 CAN_r_coast_defence_drive:0 "The Coast Defence Drive"
 CAN_r_coast_defence_drive_desc:0 "The batteries above Esquimalt track the horizon and the Militia entrains for the coast. The estimates are what they are."
 CAN_r_the_tariff_bill:0 "The Tariff Bill"
 CAN_r_the_tariff_bill_desc:0 "Congress has reached for the tariff, and our goods pay for the pleasure of having stood our ground."
 CAN_r_the_panhandle_cheque:0 "The Panhandle Cheque"
 CAN_r_the_panhandle_cheque_desc:0 "A fortune in gold is pledged at Washington's door. Until it is paid or refused, every estimate in the Dominion is written in its shadow."
 CAN_r_yen_subscriptions:0 "Yen Subscriptions"
 CAN_r_yen_subscriptions_desc:0 "Japanese subscriptions close the northern line's books years ahead of the engineers' promises, and a Tokyo banker holds the maul at the last spike."
 CAN_r_villages_on_the_skeena:0 "Villages on the Skeena"
 CAN_r_villages_on_the_skeena_desc:0 "Company charters and quiet agreements with Tokyo plant fishing villages and sawmill towns along the northern coast, surveyed, schooled and flying our flag."
 CAN_r_the_rate_war:0 "The Rate War"
 CAN_r_the_rate_war_desc:0 "Freight rates are cut to the bone and San Francisco dared to follow us down. The Empresses sail full, the subsidy bleeds, and Washington's shipping men scream."
 CAN_r_the_shipping_cartel:0 "The Shipping Cartel"
 CAN_r_the_shipping_cartel_desc:0 "The lines divide the ocean like gentlemen: Hawaii and the southern crossings to the Americans, the great circle to us, and rates held where everyone makes money and nobody builds."
 CAN_r_contract_labour:0 "Contract Labour"
 CAN_r_contract_labour_desc:0 "The company's workers are sojourners under contract, not settlers with a vote. The coast is profitable, orderly and cold."
 CAN_r_the_corridor_boom:0 "The Corridor Boom"
 CAN_r_the_corridor_boom_desc:0 "The banks, the bonded warehouses and the railway towns grow faster than anyone can count them. Everyone is getting rich and nobody is quite sure of their neighbour."
 CAN_r_a_literacy_test:0 "A Literacy Test"
 CAN_r_a_literacy_test_desc:0 "A statute with a polite name and an ugly purpose: the door is open, but only to those who can read the notice on it. Tokyo reads it too."
