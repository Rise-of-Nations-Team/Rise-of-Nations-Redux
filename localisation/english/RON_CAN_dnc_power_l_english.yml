 CANDNC_r_b_secretariat_bonus:0 "The Imperial Secretariat"
 CANDNC_r_b_guarantee_bonus:0 "The Admiralty's Guarantee"
 CANDNC_r_b_tenth_province_bonus:0 "The Tenth Province"
 CANDNC_r_b_esquimalt_bonus:0 "Esquimalt Manned by Canadians"
 CANDNC_r_b_terms_of_union_bonus:0 "The Terms of Union"
