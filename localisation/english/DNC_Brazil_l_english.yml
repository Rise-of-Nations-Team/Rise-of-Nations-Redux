 BRA_DNC_sao_paulo_industrial_complex: "[501.GetName] Industrial Complex"
#FOCUS
 BRA_DNC_economic_development: "Economic Development"
 BRA_DNC_economic_development_desc: "The economy of the Republic of the United States of Brazil, is far from ideal. Inflation and unemployment make life harder than ever before. If we want changes, we must start implementing them now."
 BRA_DNC_industrialization_efforts: "Build New Factories"
 BRA_DNC_industrialization_efforts_desc: "Lack of good, modern factories is a real problem of the industry. If we can find funds to build and modernise the existing ones, our economy will only benefit. It will also help with our unemployment problem."
 BRA_DNC_state_controlled_industry: "State-Controlled Industry"
 BRA_DNC_state_controlled_industry_desc: "Our industry developed so slowly because a significant part of it belonged to local oligarchs. If we nationalize the industry, we will be able to modernize it more effectively."
 BRA_DNC_five_year_inds_plan: "The Five Year Plan"
 BRA_DNC_five_year_inds_plan_desc: "To get our economy back on its feet, the government announced the start of The Five Year Plan - a five-year program, to boost our industry and construct new factories. Experts are optimistic about this project, saying that it will reduce unemployment to the lowest rate in our history."
 BRA_DNC_state_housing_project: "State Housing Project"
 BRA_DNC_state_housing_project_desc: "Building new housing estates financed by the state will be a great way of convincing people to move to our country. Good weather, cheap houses, lots of job opportunities… Our country is becoming a paradise for workers!"
 BRA_DNC_public_private_partnerships: "Public-Private Partnerships"
 BRA_DNC_public_private_partnerships_desc: "The government cannot pay for all of the new industry development in our country. If we’ll be able to find some private partners, we will be able to split the costs with them. Their funds with our workers together will mean new factories and a great boost for our economy."
 BRA_DNC_sao_paulo_inds_complex: "Support the [501.GetName] Industrial Complex"
 BRA_DNC_sao_paulo_inds_complex_desc: "The new factories popping up in Sao Paulo greatly improved our economy. If we openly support the complex, more people might move there looking for employment. The development of the city will also help in further expansion of industry."
 BRA_DNC_research_grants_for_industry: "New Research Grant"
 BRA_DNC_research_grants_for_industry_desc: "If we will fund scholarships and financial support for universities and promising students, our country will get more advanced specialists in the future. It will help in our country’s development, as well as drop the illiteracy rates down. "
 BRA_DNC_national_steel_production: "National Steel Production"
 BRA_DNC_national_steel_production_desc: "Investing in the national steel industry will help us in production of new tools and weapons. The Minas Gerais province will be an ideal spot for the factories. The steel also will be a great export resource, to further improve our trade relationships."
 BRA_DNC_foreign_investments_industry: "Attract Foreign Investors"
 BRA_DNC_foreign_investments_industry_desc: "Our economy is really suffering, and there isn’t much we can do by ourselves. If we were to attract foreigners to invest in our country and companies, we can start boosting the economy, as well as limit the influence of the oligarchic elements."
 BRA_DNC_foreign_loans_for_growth: "Take Out International Loans"
 BRA_DNC_foreign_loans_for_growth_desc: "The treasury of our country is suffering due to a lack of capital. If we take loans in foreign currency, we will be able to start fighting inflation and investing in the development of our industry."
 BRA_DNC_tax_breaks_for_investors: "Tax Breaks for Investors"
 BRA_DNC_tax_breaks_for_investors_desc: "Potential investors are deterred by the level of taxes in our country. If we introduced reduced taxes for people investing in our country, it could encourage more people to invest in us. Despite the initial decrease in earnings, it will bring more benefits due to the growth of industry and the economy in general."
 BRA_DNC_petrobras_initiative: "Petrobras Initiative"
 BRA_DNC_petrobras_initiative_desc: "There is a small oil company called ,,Petrobras”. Our government can buy it and transform it into a big, national oil company, which will help us make more use of our natural oil reserves. Deposits of this resource lay hidden, but with enough determination we can find, extract and make use of it."
