#DECISIONS
 BRA_DNC_suppres_the_unions: "Suppress Workers' Dissent"
 BRA_DNC_suppres_the_unions_desc: "The workers are threatening us with strikes if we do not improve their working conditions. We will have to 'negotiate' with them so that they start being more grateful for the opportunity to work that we give them. Everyone should be grateful that they can work for the good of the state, we cannot tolerate any dissent..."
#EVENTS
 dnc_brazil.1.title: "The Question of Economic Growth"
 dnc_brazil.1.desc: "The economy of our country is in shambles, we need to decide what attempts we will make to fix it. We can use money from the state budget to invest in various sectors of the economy. It will cost a lot, but in the long term it will bring more profits. We can also hire private companies - we will have certainty that the task will be carried out efficiently and well, but it will bring us less income. The last option would be to encourage foreign investors to our country - in this way we will not have to spend large sums from the state budget, and the industry will get a big boost. However, this may bring foreign influence over sectors of our economy. What will we choose?"
 dnc_brazil.1.a: "Pursue State Control"
 dnc_brazil.1.b: "Help Out the Private Sector"
 dnc_brazil.1.c: "Get Big Foreign Money"
