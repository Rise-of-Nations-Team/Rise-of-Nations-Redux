#Leader Description
 OTT_abdul_hamid_ii_desc: "Padishah Abdülhamid II, son of the reformist Abdülmecit I, is the most controversial Ottoman sultan of the modern age. Originally the one who promulgated the first modern Ottoman constitution (though it still gave him large powers over the parlimentarist system and its members) he soon turned his back on his fathers footsteps and instead chose to continue his uncles adventures into absolutism. Using the Russo-Turkish War of 1878 as an excuse, he disbanded the parliment and has been ruling assisted by a system of secret police and severe censorship. He is regarded as both a modernizer thanks to his investments into the development of railways and communications but also as an egoistic lunatic thanks to strange behaviours like banning words that might offend his person from being used in media."
#Ideas
 OTT_the_hamidian_regime_ns: "The Hamidian Regime"
 OTT_the_hamidian_regime_ns_desc: "Established by Padishah Abdülhamid II using the Crimean War, The Hamidian Regime is the nickname given to the Sultans autocratic and absolutist regine of fear. All forms of opposition or support for parlimentarism is swiftly crushed and soldiers swear their oaths to the Sultan in a state resembling the regime of the French Sun-King over two centuries ago. And while this leads to enforced political regression in an age of progress, it does allow the Sultan to maneuver politically unopposed."
 OTT_the_osman_caliphate_ns: "The Osman Caliphate"
 OTT_the_osman_caliphate_ns_desc: "While the House of Osman has held the title of Caliph of Islam ever since the days of Padishah Yavuz, it hadnt seen much use outside of warfare before Abdülhamid II. Who made the title and the policy of pan-Islamism (the idea that Muslims must work towards political unification and cooperation) and integral part of his government mostly as a countermeasure against the rising nationalism in the Arabian Peninsula ever since the French revolution. This has also lead to the further institutionalization of Islam in all matters of politics and society."
 OTT_rule_thourgh_intrigue_ns: "Rule Through Intrigue"
 OTT_rule_thourgh_intrigue_ns_desc: "Considered an extension of The Hamidian Regime, one defining aspect of Abdülhamid II' rule is the establishement of a veritable security state : Liquidity is spent funding both internal and external intelligence assets, arbitrary arrests and torture is common in the police force and the Ottoman Empire is host to the worlds largest censoring agency, combing through every little bit of published text to find even a simple word that might offend the Sultan."
 OTT_persecution_of_intelectuals_ns: "Persecution of the Inteligencia"
 OTT_persecution_of_intelectuals_ns_desc: "The class of intellectuals, writers, teachers and poets that was created thanks to the efforts of the Tanzimat Era have come to be the biggest political headache for Abdülhamid II. Resisting not through firearms but paper, the educated class of the Ottoman Empire have been fighting a gradual battle against the supression of their work and the Ottoman thought, wherever they are in exile in Europe or poisoning the Padishahs subjects with their “enlightement”, these men must either be compromised or dealt with eventually unless the foundations of Abdülhamid's regime dissolves."
 OTT_persecution_of_intelectuals_ns_tt: "§YInteligencia§! may periodically §Rattack§! our regime."
 OTT_outdated_military_ns: "Ordu-yu Hümayun"
 OTT_outdated_military_ns_desc: "Outdated in all matter including, but not limited to, tactics, equipment, training and even uniforms, the state of the once mighty Ottoman Army have made it into a laughingstock in the European continent even during the days of Selim III. Though limited amount of reform have been conducted thanks to help from Western Powers, the Ottoman Army is underprepared for the great wars of the coming decades."
 OTT_purged_naval_forces_ns: "Donanma-yı Humâyûn"
 OTT_purged_naval_forces_ns_desc: "Last having seen its glory days with Captain Barbarossa, the Ottoman Navy is a sorry sight of incompetency and mismanagement. Originally expanded through bought European vessels during the rule of Padishah Abdülaziz. Much of the navy expansion programs were abandoned with Abdülaziz' untimely death, and whatever vessels were bought were left to literally rot as sailors were exiled to Eastern Anatolia over Abdülhamid's fear of a coup by a large navy. With any threat gone however, perhaps the Padishah can reinvest into dockyards once the time is right."
 OTT_the_public_debt_administration_ns: "The Public Debt Administration"
 OTT_the_public_debt_administration_ns_desc: "The OPDA is most likely the biggest failure of Abdülhamid's regime. Forced on the Padishah by the Western Powers due to his own inability to pay even the interests of the ever increasing debt, the Admininstration has pretty much a de facto dominance over the already struggling finances of the Ottoman Empire and is so a sham orginzation to enforce the unequal treaties thats been plaguing the empire for decades. And unless we manage to renogtiate or find a way to bypass the status of this organization, it will stop us from entering the new century."
 OTT_mass_illiteracy_ns: "Mass Illiteracy"
 OTT_mass_illiteracy_ns_desc: "With a mostly rural population and a lack of education facilities outside of big cities, most of the Ottoman Empires population remains unable to write or even read. Any amount of modernization plans the Padishah has in mind first requires a population that can actually read said plans with their own eyes."
