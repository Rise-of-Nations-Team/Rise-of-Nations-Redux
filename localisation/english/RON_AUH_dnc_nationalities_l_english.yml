l_english:

 #DNC Austria-Hungary - the register of the nationalities
 AUH_dnc_nationalities_cat:0 "The Register of the Nationalities"
 AUH_dnc_nationalities_cat_desc:0 "The Crown keeps a column for every people it governs. What stands in the column is what the ministry may still ask of it."

 #Bands of the register
 AUH_nat_restless:0 "Restless Province"
 AUH_nat_restless_desc:0 "The people of this province no longer take the Monarchy for their own. The offices are obeyed slowly and the recruiting sergeant is met at the parish door."
 AUH_nat_refuses_the_levy:0 "The Levy Is Refused"
 AUH_nat_refuses_the_levy_desc:0 "The county will not deliver its contingent. The lists come back unsigned and the gendarmerie fetches what it can."
 AUH_nat_in_revolt:0 "The Province Is in Revolt"
 AUH_nat_in_revolt_desc:0 "The Crown holds the roads and nothing else. The province is governed by whoever is standing in the square."
 AUH_nat_the_register_strained:0 "The Register Is Strained"
 AUH_nat_the_register_strained_desc:0 "Too many columns of the register stand below the line at once. Every hour of the Council goes on the nationalities and none on the realm."

 #Conciliation
 AUH_nat_room_to_give_tt:0 "There is still something left to concede."

 #The twelve columns
 AUH_nat_AUS_up_tt:0 "German Austria is conciliated: [?AUS_support|%0]"
 AUH_nat_AUS_down_tt:0 "German Austria is further estranged: [?AUS_support|%0]"
 AUH_nat_HUN_up_tt:0 "The Magyars are conciliated: [?HUN_support|%0]"
 AUH_nat_HUN_down_tt:0 "The Magyars are further estranged: [?HUN_support|%0]"
 AUH_nat_CZE_up_tt:0 "The Czechs are conciliated: [?CZE_support|%0]"
 AUH_nat_CZE_down_tt:0 "The Czechs are further estranged: [?CZE_support|%0]"
 AUH_nat_POL_up_tt:0 "The Poles of Galicia are conciliated: [?POL_support|%0]"
 AUH_nat_POL_down_tt:0 "The Poles of Galicia are further estranged: [?POL_support|%0]"
 AUH_nat_CRO_up_tt:0 "The Croats are conciliated: [?CRO_support|%0]"
 AUH_nat_CRO_down_tt:0 "The Croats are further estranged: [?CRO_support|%0]"
 AUH_nat_ROM_up_tt:0 "The Romanians of Transylvania are conciliated: [?ROM_support|%0]"
 AUH_nat_ROM_down_tt:0 "The Romanians of Transylvania are further estranged: [?ROM_support|%0]"
