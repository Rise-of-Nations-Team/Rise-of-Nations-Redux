 AUH_nat_restless:0 "Restless"
 AUH_nat_restless_desc:0 "This people's column in the register has fallen below 40. Nothing has broken yet, but the margin is thin — conciliate before it slips further."
 AUH_nat_refuses_the_levy:0 "Refuses the Levy"
 AUH_nat_refuses_the_levy_desc:0 "This people's column has fallen below 25. The gendarmerie is asking for the army now, not later — a rising is a real possibility if nothing changes."
 AUH_nat_in_revolt:0 "In Revolt"
 AUH_nat_in_revolt_desc:0 "This people's column has fallen below 10. The state is no longer governed, only occupied. See The Register, Read Aloud in the national spirits for every people's current standing."
 AUH_nat_the_register_strained:0 "The Register Is Strained"
 AUH_nat_the_rising_breaks_tt:0 "§RThe districts are held by the army, and the realm pays for it.§!"
 AUH_nat_rising_ends_tt:0 "No people of the realm is in open revolt."
 AUH_nat_concede_dearer_tt:0 "§YEvery hearing granted makes the next one dearer and worth less, down to a floor of four.§!"
 AUH_nat_seesaw_AUS_tt:0 "§RThe Czechs read every concession to Vienna as a retreat from Prague: [?CZE_support|0]§!"
 AUH_nat_seesaw_HUN_tt:0 "§RWhat Budapest is granted, Transylvania, Upper Hungary and the Triune Kingdom are made to pay: [?ROM_support|0] / [?SLO_support|0] / [?CRO_support|0]§!"
 AUH_nat_seesaw_CZE_tt:0 "§RGerman Austria reads every concession to Prague as a language ordinance against itself: [?AUS_support|0]§!"
 AUH_nat_seesaw_POL_tt:0 "§RThe Ruthenes count what the Polish club is given: [?UKR_support|0]§!"
 AUH_nat_seesaw_UKR_tt:0 "§RThe Polish club counts what the Ruthenes are given: [?POL_support|0]§!"
 AUH_nat_seesaw_ROM_tt:0 "§RBudapest resents every school returned to Transylvania: [?HUN_support|0]§!"
 AUH_nat_seesaw_CRO_tt:0 "§RBudapest and the Serbs of the Triune Kingdom both read the Croatian settlement against themselves: [?HUN_support|0] / [?SER_support|0]§!"
 AUH_nat_seesaw_SER_tt:0 "§RThe Croats and the Muslim notables read every Serb gain as their own loss: [?CRO_support|0] / [?BOS_support|0]§!"
 AUH_nat_seesaw_BOS_tt:0 "§RThe Serbs of the province resent every privilege confirmed to the Muslim notables: [?SER_support|0]§!"
 AUH_nat_seesaw_SLV_tt:0 "§RThe Italians of the Littoral resent every Slovene gain: [?ITA_support|0]§!"
 AUH_nat_seesaw_ITA_tt:0 "§RThe Slovenes of the Littoral resent every Italian gain: [?SLV_support|0]§!"
 AUH_nat_seesaw_SLO_tt:0 "§RBudapest resents everything granted over its head in Upper Hungary: [?HUN_support|0]§!"
