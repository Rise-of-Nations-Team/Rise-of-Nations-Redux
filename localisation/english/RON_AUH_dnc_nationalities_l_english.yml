 #The conciliation decisions
 AUH_conciliate_AUS:0 "Hear the German Notables"
 AUH_conciliate_AUS_desc:0 "The ministry receives the German clubs, hears the grievance of the Alpine and Sudeten districts, and grants what the offices can grant without a law."
 AUH_conciliate_HUN:0 "Receive the Magyar Delegation"
 AUH_conciliate_HUN_desc:0 "The Crown receives the delegation of the Kingdom, concedes a point on the common estimates, and sends it home able to say it has won something."
 AUH_conciliate_CZE:0 "Sit with the Bohemian Clubs"
 AUH_conciliate_CZE_desc:0 "The government sits down with the Czech clubs of the kingdom of Bohemia. Chairs, offices and the language of the inner service are on the table; the constitution is not."
 AUH_conciliate_POL:0 "Confirm the Polish Club in Office"
 AUH_conciliate_POL_desc:0 "The Polish Club keeps its ministry, its patronage and the running of the crownland. Vienna asks only that Galicia vote with the government."
 AUH_conciliate_CRO:0 "Answer the Sabor"
 AUH_conciliate_CRO_desc:0 "The Crown answers the address of the Sabor: the Ban is heard, the Croatian offices are staffed from Zagreb, and the settlement across the river is left standing."
 AUH_conciliate_ROM:0 "Talk to the Romanian Committee"
 AUH_conciliate_ROM_desc:0 "The government opens talks with the Romanian committee on schools, seats and the county administration. Nothing is signed, and the talking is itself the concession."
 AUH_conciliate_UKR:0 "Endow the Ruthenian Chairs"
 AUH_conciliate_UKR_desc:0 "Chairs, seminaries and a share of the Galician offices are endowed for the Ruthenes, over the objection of the crownland's landed gentlemen."
 AUH_conciliate_SER:0 "Reopen the Serb Church Congress"
 AUH_conciliate_SER_desc:0 "The Congress of the Serb church is allowed to sit again and to administer its own schools and funds. The Crown prefers a congress in session to a committee in secret."
 AUH_conciliate_BOS:0 "Convene the Bosnian Notables"
 AUH_conciliate_BOS_desc:0 "The joint ministry convenes the notables of the occupied land, confirms the standing of the three confessions, and lets the landowners be heard on the tenancy question."
 AUH_conciliate_SLV:0 "Grant the Slovene Schools"
 AUH_conciliate_SLV_desc:0 "Slovene classes are granted in the Littoral and the Alpine crownlands, and the parallel courses at Graz are paid for out of the state budget."
 AUH_conciliate_ITA:0 "Answer the Italian Deputies"
 AUH_conciliate_ITA_desc:0 "The Italian deputies of the Littoral and the Trentino are answered: municipal rights, courts in their own tongue, and a faculty promised somewhere it will offend nobody."
 AUH_conciliate_SLO:0 "Ease the Upper Hungarian Counties"
 AUH_conciliate_SLO_desc:0 "The Crown leans on Budapest to ease the county administration of the Uplands, and quietly funds the Slovak reading societies the Kingdom has closed."
