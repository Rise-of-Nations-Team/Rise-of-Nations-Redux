 AUH_nat_restless:0 "Restless"
 AUH_nat_restless_desc:0 "This people's column in the register has fallen below 35. Nothing has broken yet, but the margin is thin — conciliate before it slips further."
 AUH_nat_refuses_the_levy:0 "Refuses the Levy"
 AUH_nat_refuses_the_levy_desc:0 "This people's column has fallen below 20. The gendarmerie is asking for the army now, not later — a rising is a real possibility if nothing changes."
 AUH_nat_in_revolt:0 "In Revolt"
 AUH_nat_in_revolt_desc:0 "This people's column has fallen below 5. The state is no longer governed, only occupied. See The Register, Read Aloud in the national spirits for every people's current standing."
 AUH_nat_the_register_strained:0 "The Register Is Strained"
 AUH_nat_the_rising_breaks_tt:0 "§RThe districts are held by the army, and the realm pays for it.§!"
 AUH_nat_rising_ends_tt:0 "No people of the realm is in open revolt."
