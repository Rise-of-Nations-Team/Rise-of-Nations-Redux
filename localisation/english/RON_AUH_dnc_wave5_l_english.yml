l_english:
 AUH_dnc_twilight_cat:0 "The Twilight of the Monarchy"
 AUH_dnc_twilight_cat_desc:0 "The instruments of a state fighting from the floor. Secessions standing: §[GetAUHSecessionColor][?AUH_z_secessions]§!. Corps that answer the roll: §[GetAUHCorpsColor][?AUH_z_corps]§!. Strain on the treasury: §[GetAUH_strainColor][?AUH_treasury_strain]§!.\n\nEverything here is paid for twice - once in money and once on the register."
 AUH_dnc_reconquest_cat:0 "The Marches on the Crownlands"
 AUH_dnc_reconquest_cat_desc:0 "One column, one crownland, one at a time. A march may be ordered only while no other march is running, it costs the treasury and the ledger of coercion, and the chancelleries of Europe read every one of them.\n\nA crownland whose people stands at §Y20§! or above will fold when the column arrives. A crownland below it will fight, and then it is a war like any other."
 AUH_z_place_CZE:0 "Prague"
 AUH_z_place_GAL:0 "Lemberg"
 AUH_z_place_UKR:0 "Czernowitz"
 AUH_z_place_CRO:0 "Agram"
 AUH_z_place_BOS:0 "Sarajevo"
 AUH_z_place_SLV:0 "Laibach"
 AUH_z_place_SLO:0 "Pressburg"
 AUH_z_place_HUN:0 "Budapest"
 AUH_z_place_none:0 "the province"
 AUH_z_gemeinsamkeit_capped_tt:0 "§RWith two banks of issue, what the halves hold in common cannot rise above 30.§!"
 AUH_z_scar_all_tt:0 "Every column's scar is rewritten. A scar written upward narrows the band inside which a people erodes and raises the ceiling it can recover to; a scar written downward does the opposite."
 AUH_z_the_loyal_levy_tt:0 "§GThe loyal crownlands send men: Austria, Upper Austria, Salzburg, Tyrol, Carinthia and the Waldviertel.§!"
 AUH_z_the_march_is_paid_for_tt:0 "§REvery march is paid for out of the same exhausted treasury.§!"
 AUH_z_settlement_of_the_columns_tt:0 "§GEvery surviving column of the register is converted into a settled member of the federation.§!"
 AUH_z_threat_the_column_marches:0 "A column marches on a crownland"
 AUHDNC_z_the_twilight:0 "The Twilight"
 AUHDNC_z_the_twilight_desc:0 "There is a morning on which the Ballhausplatz stops writing memoranda about the crisis and starts writing memoranda about the end. Nobody signs anything. The word is not used in the chamber and it is used in every corridor. What changes is not the situation but the honesty of the men who administer it, and honesty buys something: a government that has admitted it is falling may at last spend the last of its credit on the three or four things that actually decide whe"
 AUH_z_the_twilight_tt:0 "§YThe instruments of the twilight are opened. The crown has admitted to itself what the register has been saying for years.§!"
 AUHDNC_z_the_loyal_crownlands:0 "The Loyal Crownlands"
 AUHDNC_z_the_loyal_crownlands_desc:0 "Not every province is leaving. The Alpine lands, the Waldviertel and the country that has looked to Vienna since before there was an empire send their men without being asked twice, and they send them to a dynasty rather than to a state. We govern for those provinces now, openly, and we stop pretending the same order carries the same weight in Prague or Agram. It is a smaller realm than the one we had on paper, and it is a realm that answers."
 AUH_z_the_loyal_crownlands_tt:0 "§GThe crownlands that never left are cleared of unrest and send their levy. What the halves still hold in common rises.§!"
 AUHDNC_z_the_war_economy_of_necessity:0 "The War Economy of Necessity"
 AUHDNC_z_the_war_economy_of_necessity_desc:0 "The estimates are rewritten in one night by four men, and the public works are the first thing struck out. The harbour, the schools, the canal and the roads through the Carpathians stop where they stand, and every crown they were drinking goes into powder, boots and barrels. It is a cheap way to pay for an army and a ruinous way to govern a country, and it is the only ledger that balances. We tell the provinces it is for a year."
 AUH_z_the_estimates_of_necessity_tt:0 "§RThe public works stop where they stand.§! §GWhat they were costing stops with them, and the difference goes into powder.§!"
 AUHDNC_z_the_price_of_the_creditors:0 "The Price of the Creditors"
 AUHDNC_z_the_price_of_the_creditors_desc:0 "The houses of Paris and London will take the arrears at once and in full, and they name their price in the same sentence: the customs, the tobacco monopoly and a chair at the table when the estimates are drawn. It is money today against sovereignty on a date nobody writes down. The officials are paid, the suspension is lifted, the treasury breathes - and from that morning there is a foreign gentleman in the room who does not have to raise his voice to be obeyed."
 AUH_z_the_price_of_the_creditors_tt:0 "§GThe houses of Paris and London settle the arrears at once.§! §RThey take the customs, the tobacco and a seat at the estimates, and what they take they do not hand back.§!"
 AUHDNC_z_the_generals_who_stayed:0 "The Generals Who Stayed"
 AUHDNC_z_the_generals_who_stayed_desc:0 "Half the corps commanders have gone home to capitals that did not exist last spring, and they took their regiments with them. Some did not. The men who stayed are not the cleverest we had and they are the ones who read the oath as a thing said to a person rather than to a parliament, and in this year that is worth more than a staff college."
 AUH_z_the_generals_who_stayed_tt:0 "§GGeneral Josef Roth is confirmed in command. The regiments that were answering two flags answer one again.§!"
 AUHDNC_z_the_capital_holds:0 "The Capital Holds"
 AUHDNC_z_the_capital_holds_desc:0 "Everything else can be argued about later. A ring of works goes up around Vienna, the Landsturm is called out by street and by parish, and the men who dig are the men who will stand in what they dug. It is not a modern fortress and it is not meant to be one; it is meant to make the taking of the capital cost more than any of our neighbours has decided to spend. A capital that has not fallen is an argument no chancellery in Europe has an answer to."
 AUH_z_the_capital_holds_tt:0 "§GVienna is ringed and garrisoned, and the Landsturm is called out by parish.§!"
 AUHDNC_z_the_column_that_kept_its_oath:0 "The Column That Kept Its Oath"
 AUHDNC_z_the_column_that_kept_its_oath_desc:0 "The register is not only a list of who is leaving. Somewhere in it there is a column that did not rise when it had every reason to, and until now we have thanked it by leaving it alone. We stop doing that. Its deputies get what they have asked for since the settlement, its language goes into the word of command, and in exchange its districts raise regiments under our colours. A people written upward is worth more in the field than three we are holding down."
 AUH_z_the_column_that_kept_its_oath_tt:0 "§GThe strongest column that did not rise is written upward and put under arms, and the roll of the corps is taken again.§!"
 AUHDNC_z_the_army_from_the_floor:0 "The Army from the Floor"
 AUHDNC_z_the_army_from_the_floor_desc:0 "What is left is counted honestly for the first time: the Kaiserjaeger brigades that walked out of the mountains still in formation, the Landsturm regiments raised by parish, and a stockpile that will carry them for one campaign and not two. It is not the army of the manoeuvres and it will not be. It is an army that exists, that is paid, and that stands where it is told, and there has not been one of those in this monarchy for eighteen months."
 AUH_z_the_army_from_the_floor_tt:0 "§GThe floor army is raised again: the Kaiserjaeger brigades, the Landsturm regiments and the stockpile to carry them.§!"
 AUH_z_tb_the_emergency_estimates:0 "The Emergency Estimates"
 AUH_z_tb_the_ring_of_the_capital:0 "The Ring of the Capital"
 AUH_z_tb_the_army_from_the_floor:0 "The Army from the Floor"
 AUHDNC_z_the_columns_are_called:0 "The Columns Are Called"
 AUHDNC_z_the_columns_are_called_desc:0 "The Common Army has gone home to its provinces, so the Kriegsministerium writes to the Landsturm districts that still answer letters. Werndl rifles out of the district stores, men of the third levy, retired majors handed a battalion and a map. It is not an army that can hold a frontier.\n\nIt is an army that can walk into a crownland and be believed, which is a different trade and for the moment the only one the Monarchy is still in."
 AUHDNC_z_the_road_to_prague:0 "The Road to Prague"
 AUHDNC_z_the_road_to_prague_desc:0 "Bohemia declared itself in the Rudolfinum and has governed from it since, with a treasury of its own and a militia of Sokol gymnasts who have never been shot at. The Elbe road is good, the distance is short, and the column can stand at the Moldau bridges inside a fortnight.\n\nWhether Prague folds when it sees them is not a question the General Staff can answer; it depends on what the Czech people still believes it is owed."
 AUHDNC_z_the_column_into_galicia:0 "The Column into Galicia"
 AUHDNC_z_the_column_into_galicia_desc:0 "Galicia is the province the Monarchy could least afford to lose and can least afford to retake. The oil at Boryslav would pay for the war needed to hold it, which is a circular argument the Finance Ministry has stopped making out loud.\n\nBeyond the Zbrucz sits a Russian army that reads the Vienna papers, and every kilometre gained is a kilometre nearer the one war the Monarchy cannot fight twice."
 AUHDNC_z_the_column_into_the_south:0 "The Column into the South"
 AUHDNC_z_the_column_into_the_south_desc:0 "Agram, Sarajevo, Laibach, Pressburg - whichever of them is still keeping its own accounts when the column crosses the Save. The south is where the Monarchy has the least road, the worst maps, and the most neighbours with an opinion about the outcome.\n\nBelgrade will read the march as a rehearsal for its own turn and Rome will read it as the Adriatic question reopened. Both of them will be right."
 AUHDNC_z_the_crown_of_saint_stephen:0 "The Crown of Saint Stephen"
 AUHDNC_z_the_crown_of_saint_stephen_desc:0 "Budapest is not a crownland and never was. It is the other half, and the column that goes down the Danube goes to compel a coronation rather than an annexation - a distinction the Kriegsministerium is careful about and the Honved is not.\n\nThe crown is offered back before a shot is fired. Take it, and the Monarchy keeps a kingdom that resents it and an army that answers Vienna."
 AUHDNC_z_the_danubian_federation:0 "The Danubian Federation"
 AUHDNC_z_the_danubian_federation_desc:0 "Popovici drew the map in exile and nobody in the Ballhausplatz would sign it while the Monarchy was still solvent. It is signed now, because the alternative is sitting in the next room with a timetable.\n\nEvery column of the register still standing becomes a member state with its own diet, its own schools and its own share of the common army. The Emperor keeps the crown, the customs union and the foreign ministry, and gives away everything that can be given away."
 AUHDNC_z_the_reconquest:0 "The Reconquest"
 AUHDNC_z_the_reconquest_desc:0 "The crownlands were taken back by the army and the army is what will hold them. There is no settlement to write because there was no negotiation - only garrisons, courts-martial sitting in permanent session, and a Statthalter in every provincial capital who reports to the Kriegsministerium and not to a diet.\n\nIt is a colder empire than the one that fell, and a smaller one in every measure that is not square kilometres. It will hold for a generation."
 AUHDNC_z_the_rump_endures:0 "The Rump Endures"
 AUHDNC_z_the_rump_endures_desc:0 "There will be no federation and no reconquest. What is left is Austria proper, the Alpine lands, and the loyalty of people nobody thought to ask whether they wished to be the last of it.\n\nThe service is paid at last, the mountain regiments hold the passes they have always held, and the Monarchy goes on being a state - a small one, with an oversized court and a longer memory than its neighbours would prefer."
 AUH_z_threat_the_columns_are_called:0 "Vienna calls out the Landsturm"
 AUH_z_threat_the_road_to_prague:0 "A column takes the road to Prague"
 AUH_z_threat_the_column_into_galicia:0 "A column moves into Galicia"
 AUH_z_threat_the_column_into_the_south:0 "A column moves into the south"
 AUH_z_threat_the_crown_of_saint_stephen:0 "Vienna marches on Budapest"
 AUH_z_threat_the_federation_settles:0 "The Danube settles its own quarrel"
 AUH_z_threat_the_empire_is_whole:0 "The Monarchy is whole again, and armed"
 AUH_z_threat_the_rump_endures:0 "Austria withdraws into its mountains"
 AUH_z_the_columns_are_called_tt:0 "§GThe Landsturm districts answer, and the marches on the crownlands may be ordered.§!"
 AUH_z_the_road_to_prague_tt:0 "§RPetersburg reads the march as proof that the Monarchy is not finished with the Slavs.§!"
 AUH_z_the_column_into_galicia_tt:0 "§RThe column moves toward a frontier the Russian army watches as closely as we do.§!"
 AUH_z_the_column_into_the_south_tt:0 "§RBelgrade and Rome both take the march as notice.§!"
 AUH_z_terms_offered_tt:0 "§GThe crown is offered back before the guns. If Budapest folds, Hungary returns as a kingdom under the Monarchy and not as a conquered province.§!"
 AUH_z_the_crown_of_saint_stephen_tt:0 "§RBerlin asks what is left of the ally it signed with.§!"
 AUH_z_prestige_up_tt:0 "The standing of the House rises."
 AUH_z_a_crown_was_bargained_tt:0 "§GOne crown came back by treaty rather than by storm, and the register remembers the difference.§!"
 AUH_z_federation_era_end_tt:0 "The era of the question ends: the Monarchy is a federation of the Danube, and the register is a settlement."
 AUH_z_reconquest_era_end_tt:0 "The era of the question ends: the crownlands are held, and the army is what holds them."
 AUH_z_rump_era_end_tt:0 "The era of the question ends: the Monarchy survives, and very little else does."
