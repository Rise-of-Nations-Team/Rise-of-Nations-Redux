#Focuses
 CANDNC_e_two_peoples_one_order_in_council: "Two Peoples, One Order in Council"
 CANDNC_e_two_peoples_one_order_in_council_desc: "There is a fifth answer to the war question that no one has yet dared speak: two peoples were bound by a single stroke of the pen, and one of them was never asked. The quarrel is not only over the Empire — it is over whether this Dominion is one nation or two."
 CANDNC_e_a_country_of_two_nations: "A Country of Two Nations"
 CANDNC_e_a_country_of_two_nations_desc: "We will build a nationalism that is bilingual and pan-Canadian: two peoples, one Dominion, and neither the servant of the other. Let Toronto hear a Frenchman define the Empire for once. Canada is a partnership of two founding nations, or it is nothing that will last."
 CANDNC_e_one_language_for_one_dominion: "One Language for One Dominion"
 CANDNC_e_one_language_for_one_dominion_desc: "What Regina already does, the whole Dominion shall do: teach in English from the Red River to the Rockies. One country, one language of the classroom, and the school question settled by the majority that pays for the schools. The other nation may keep its tongue at home."
 CANDNC_e_the_ligue_nationaliste_is_founded: "The Ligue Nationaliste Is Founded"
 CANDNC_e_the_ligue_nationaliste_is_founded_desc: "Asselin and Lavergne set down a programme in three articles with Bourassa behind them: autonomy within the Empire, autonomy of the provinces, an economic policy made in Canada. It is a doctrine, not a party — and doctrines outlast parties. We give French Canada a creed to carry for generations."
 CANDNC_e_le_nationaliste_and_the_acjc: "Le Nationaliste and the ACJC"
 CANDNC_e_le_nationaliste_and_the_acjc_desc: "Asselin's weekly names ministers, forest concessions and railway lawyers on its front page, and the Jesuits found a youth league the same month. One arms the press, the other trains the cadres. We are building the machinery of a national movement that will outlive every man now in it."
 CANDNC_e_gouin_takes_quebec: "Gouin Takes Quebec"
 CANDNC_e_gouin_takes_quebec_desc: "Gouin brings down the old premier over the forest concessions and takes his chair. The party has purged itself to answer the nationalists — and in doing so has proved them right about the scandal all along. Quebec's Liberals will govern henceforth with the nationalist critique on their own conscience."
 CANDNC_e_the_delegate_apostolic: "The Delegate Apostolic"
 CANDNC_e_the_delegate_apostolic_desc: "The apostolic delegate presses us on the school clauses, and the Archbishop writes from the West. Rome cannot disallow a Canadian statute — and need not, holding the pulpits of sixty-five ridings. On the schools of French Canada, the Church is a power we must reckon with directly."
 CANDNC_e_bourassa_beats_gouin_in_saint_jacques: "Bourassa Beats Gouin in Saint-Jacques"
 CANDNC_e_bourassa_beats_gouin_in_saint_jacques_desc: "Bourassa turns the premier out of his own Montreal seat, and Lavergne comes in beside him. Gouin keeps his government on a safer riding, but the Assembly has gained a cross-examiner it cannot silence. The nationalists are no longer a newspaper — they are an opposition, on the floor of the House."
 CANDNC_e_the_naval_question_comes_to_quebec: "The Naval Question Comes to Quebec"
 CANDNC_e_the_naval_question_comes_to_quebec_desc: "The naval question lands in Quebec's lap: Monk will grant neither ships nor a cheque until the electors have spoken. The province is asked, for the first time, to name its price for the Empire. Whatever Quebec answers here will decide how far the Dominion can go to war at all."
 CANDNC_e_the_motion_of_13_march_carried: "The Motion of 13 March Carried"
 CANDNC_e_the_motion_of_13_march_carried_desc: "The House votes that no contingent sails without its leave, and Bourassa has his doctrine in the journals. Toronto reads it as a surrender to the member for Labelle. We have written French Canada's condition into the law of the land — and handed English Canada a grievance it will nurse for years."
 CANDNC_e_the_ligues_programme: "The Ligue's Programme"
 CANDNC_e_the_ligues_programme_desc: "The three articles of the Ligue become the policy of the government itself: autonomy within the Empire, autonomy of the provinces, an economic policy of our own. What began as a manifesto in a Montreal weekly now carries the arms of the Dominion. The nationalists have not joined the state — the state has joined them."
 CANDNC_e_clause_sixteen_as_written: "Clause Sixteen as Written"
 CANDNC_e_clause_sixteen_as_written_desc: "The autonomy bills go forward with the schools clause untouched — separate schools as the minority was promised, not as the Territories later whittled them down. Sifton waits in the corridor with his resignation. We keep faith with French and Catholic Canada in the new provinces, whatever it costs us in the West."
 CANDNC_e_french_from_the_red_river_west: "French From the Red River West"
 CANDNC_e_french_from_the_red_river_west_desc: "The Archbishop gets what the bishops asked: French beyond the early grades and separate schools funded across the prairie. Neither Regina nor Edmonton was consulted, and both mean to say so loudly. We plant the French fact west of the Red River — and dare the new provinces to uproot it."
 CANDNC_e_an_opening_to_paris: "An Opening to Paris"
 CANDNC_e_an_opening_to_paris_desc: "We send our own man to the Quai d'Orsay to ask for what no tariff can buy: teachers, instructing officers, a French consulate at Quebec. France is the older mother, and French Canada has never forgotten her. We reopen a tie the Conquest cut — quietly, and to London's certain displeasure."
 CANDNC_e_the_sixty_five_seats_locked: "The Sixty-Five Seats Locked"
 CANDNC_e_the_sixty_five_seats_locked_desc: "We lock Quebec's sixty-five seats as the fixed divisor of the whole House, beyond the reach of any census. Ontario will lose members and Quebec will not, and the Toronto papers will howl. It is the constitutional guarantee of the French fact — one province's weight fixed forever in the count."
 CANDNC_e_the_tercentenary_of_1608_a_french_fete: "The Tercentenary as a French Fete"
 CANDNC_e_the_tercentenary_of_1608_a_french_fete_desc: "Champlain lands again below the Citadel, the pageants stopping short of the Conquest, and the French delegation is given pride of place. The Prince of Wales watches the founding of a city that was never his. We make three centuries of Quebec a French festival, and remind the Empire whose ground it stands on."
 CANDNC_e_the_answer_voted_down: "The Answer Voted Down"
 CANDNC_e_the_answer_voted_down_desc: "The motion is put, and it is lost. The Commons will not say that the order sending the contingent binds nothing, and the member for Labelle sits down in a Dominion that has just confessed its own precedent. English Canada has held the line — and told French Canada, in a division, exactly where it stands."
 CANDNC_e_the_regina_ordinance_for_all: "The Regina Ordinance for All"
 CANDNC_e_the_regina_ordinance_for_all_desc: "The Territories' school ordinance becomes the rule from the Red River to the Rockies: English the language of the classroom, French tolerated in the early years, religion taught after four o'clock. We settle the schools of the West on the majority's terms — and settle, with them, what kind of country the West will be."
 CANDNC_e_the_nationalist_press_sued: "The Nationalist Press Sued"
 CANDNC_e_the_nationalist_press_sued_desc: "The ministers Le Nationaliste names take Asselin to court one by one, and he answers each writ with a fresh issue. The costs are ruinous; the circulation climbs with every hearing. We teach Quebec that the surest way to sell a nationalist paper is to be sued by the government for printing it."
 CANDNC_e_the_sunday_law_enforced: "The Sunday Law Enforced"
 CANDNC_e_the_sunday_law_enforced_desc: "The Lord's Day Act takes effect, and we press Quebec's attorneys to enforce it. A Protestant sabbath is read into Catholic parishes that keep their own holy days by another calendar. On the smallest things — a Sunday, a streetcar — the two nations discover how little they share, and how much it grates."
 CANDNC_e_the_tercentenary_as_an_imperial_fete: "The Tercentenary as an Imperial Fete"
 CANDNC_e_the_tercentenary_as_an_imperial_fete_desc: "The Prince of Wales heads the water pageant, the Plains of Abraham pass to a royal commission, and Wolfe's victory is played out before the city that lost it. We dress the founding of French Quebec in imperial scarlet. Bourassa watches from the crowd, and marks every flag that is not the one he wants."
 CANDNC_e_the_sixty_five_seats_questioned: "The Sixty-Five Seats Questioned"
 CANDNC_e_the_sixty_five_seats_questioned_desc: "Ontario has lost seats and Quebec has lost none, and Toronto's boards of trade ask why one province is a constitutional divisor while theirs is merely counted. We put the same question to the Colonial Office. The guarantee that shields the French fact is coming to look, to English Canada, like a privilege to be broken."
 CANDNC_e_the_representation_act_amended: "The Representation Act Amended"
 CANDNC_e_the_representation_act_amended_desc: "With Westminster's leave we make Quebec's sixty-five members a number like any other, counted on population as Nova Scotia is. Bourassa calls it the breaking of the Confederation bargain, in exactly those words. We untie the knot that fixed the French weight in the House — and cannot say what comes loose with it."
 CANDNC_e_fallons_church: "Fallon's Church"
 CANDNC_e_fallons_church_desc: "Bishop Fallon turns the Irish clergy of Ontario against the bilingual schools of the Ottawa valley, and the Franco-Ontarians find their deadliest enemy is a Catholic bishop of their own Church. The quarrel of the two nations has moved inside the Church itself — where we can neither command it nor calm it."
 CANDNC_e_a_special_status_for_quebec: "A Special Status for Quebec"
 CANDNC_e_a_special_status_for_quebec_desc: "We take the second article of the programme and apply it to one province alone: a written status for Quebec, drafted at the Department of Justice, to be laid before the House this session. Not autonomy for all the provinces — a special place in law for the one that is a nation. It is a door no one has opened before."
 CANDNC_e_the_nationalist_ministry: "The Nationalist Ministry"
 CANDNC_e_the_nationalist_ministry_desc: "We offer Bourassa, Lavergne and Asselin's friends portfolios instead of pamphlets. The Ligue takes office at Ottawa rather than at Quebec, and a doctrine written for a weekly becomes the policy of a Dominion. The nationalists sit in Cabinet now — and the country will be governed by the creed they preached for a decade."
 CANDNC_e_coerce_quebec: "Coerce Quebec"
 CANDNC_e_coerce_quebec_desc: "Quebec holds sixty-five seats out of two hundred and twenty-one, and shall be governed as the minority it is. Every measure the province has blocked goes through without it, and Montreal learns what a federal majority is for. We answer the two-nations doctrine with arithmetic — and dare Quebec to make something of it."
 CANDNC_e_the_gilded_minority: "The Gilded Minority"
 CANDNC_e_the_gilded_minority_desc: "Quebec is not to be beaten but bought. Gouin gets the harbour works, the contracts, the Plains of Abraham; English stays the language of the Dominion. We answer the nationalists with a public-works estimate. A minority gilded is a minority quiet — and quiet, we have found, is cheaper than compromise."
 CANDNC_e_the_statute_of_quebec: "The Statute of Quebec"
 CANDNC_e_the_statute_of_quebec_desc: "An act of Parliament names one province the home of a nation: French in the federal courts and the post office, its schools guaranteed, its share of the estimates set down in law. No Dominion has ever passed such a thing. We do not merely tolerate the two nations — we write the second one into the statute book."
 CANDNC_e_a_french_regiment_of_the_line: "A French Regiment of the Line"
 CANDNC_e_a_french_regiment_of_the_line_desc: "The Carabiniers Mont-Royal go on the permanent establishment with French words of command and their own officers, and the Militia Council prints its regulations in both tongues. French Canada will serve under arms in its own language or not at all — and we would rather it served, and proudly."
 CANDNC_e_no_navy_without_quebecs_assent: "No Navy Without Quebec's Assent"
 CANDNC_e_no_navy_without_quebecs_assent_desc: "Not a keel is laid until the Assembly at Quebec has voted for it, and the naval estimates are spent ashore in the yards at Levis instead. Monk has his way: the Dominion builds no fleet the French province has not consented to. Quebec has won a veto over Canada's navy, and means to keep it."
 CANDNC_e_the_compact_of_two_nations: "The Compact of Two Nations"
 CANDNC_e_the_compact_of_two_nations_desc: "Two peoples, one Dominion, a written status and not a single warship. Bourassa has what he asked the Commons for at the decade's start. The Orange lodges have a grievance they mean to carry into the next war. We have built a compact of two nations — and left English Canada wondering what it agreed to."
 CANDNC_e_bourassa_at_the_interior: "Bourassa at the Interior"
 CANDNC_e_bourassa_at_the_interior_desc: "The department Sifton built to fill the West with strangers passes to the member for Labelle. Now the agents are paid for Bretons and Walloons, Catholics and French-speakers, and the great Slavic tide is turned off at the tap. We choose the character of the West's people over their sheer number."
 CANDNC_e_the_bilingual_civil_service: "The Bilingual Civil Service"
 CANDNC_e_the_bilingual_civil_service_desc: "Every department at Ottawa will answer in the language it is written to, from the Post Office to the Railway Commission. The Civil Service Commission examines the clerks, and half of them fail at the first sitting. We make the Dominion's own offices speak both its languages — and learn how few of its servants can."
 CANDNC_e_autonomy_in_the_empire: "Autonomy in the Empire"
 CANDNC_e_autonomy_in_the_empire_desc: "The first article of the programme, carried out to the letter: not a man, not a ship, not a dollar voted at Ottawa because London asked for it, and no treaty ever again signed under a British ambassador's cover. Autonomy within the Empire is no longer a slogan — it is the standing rule of our foreign policy."
 CANDNC_e_a_nationalist_canada: "A Nationalist Canada"
 CANDNC_e_a_nationalist_canada_desc: "The Ligue governs, its weekly reads like an official gazette, and the Dominion answers the Colonial Office over its own signature. Toronto calls it the Empire's first defeat at the hands of one of its own children. We have made a nationalist Canada — French and English both, and bending the knee to no one across the sea."
 CANDNC_e_the_naval_contribution_over_quebecs_head: "The Contribution Over Quebec's Head"
 CANDNC_e_the_naval_contribution_over_quebecs_head_desc: "Where the House voted unanimously for a service of its own, the government now votes the Admiralty a cheque instead. Monk and the sixty-five members from Quebec are counted in the division list and ignored. We overrule the French province on the Empire's demand — and hand the nationalists the very grievance that made them."
 CANDNC_e_the_separatist_crisis: "The Separatist Crisis"
 CANDNC_e_the_separatist_crisis_desc: "The Assembly resolves that a province taxed for a fleet its own members voted against is not governed by consent. Gouin cannot hold his benches, Lavergne demands a mandate, and the despatch goes to three capitals. We have pushed Quebec past patience — and the word no Dominion dares speak is on the order paper."
 CANDNC_e_the_riot_act_in_montreal: "The Riot Act in Montreal"
 CANDNC_e_the_riot_act_in_montreal_desc: "The militia is called out to the Champ de Mars, and an officer reads the proclamation from the courthouse steps. The crowd has one hour to disperse; after it, they are rioters at law, and the militia has its orders. We answer the streets of Montreal with the Riot Act — and pray it is read only once."
 CANDNC_e_one_dominion_one_tongue: "One Dominion, One Tongue"
 CANDNC_e_one_dominion_one_tongue_desc: "Whatever remains of Quebec's difference is administered in English, the estimates carry a fleet, and no second nation appears anywhere in the statute book. Ontario has precisely what it asked of us at the decade's start. We have made one Dominion with one tongue — and buried the two-nations question under a majority."
 CANDNC_e_gouins_machine: "Gouin's Machine"
 CANDNC_e_gouins_machine_desc: "The premier who took Quebec by denouncing patronage is now paid in it. Concessions, harbour works and bridge contracts flow through Ottawa, and Asselin's front page is answered every week with a payroll. We govern the French province the old way, with contracts — and hope the money speaks louder than the newspaper."
 CANDNC_e_the_plains_of_abraham_bought: "The Plains of Abraham Bought"
 CANDNC_e_the_plains_of_abraham_bought_desc: "The Battlefields Commission buys the ground where Montcalm and Wolfe both fell and gives it to the city as a park. Quebec keeps the field and loses the right to tell its own story on it. We turn the site of the Conquest into a lawn for imperial pageants, and trust that grass grows over memory."
 CANDNC_e_the_navy_deferred_the_contracts_placed: "The Navy Deferred, the Contracts Placed"
 CANDNC_e_the_navy_deferred_the_contracts_placed_desc: "Not one ship is voted — yet the yards at Levis and Sorel are paid to stand ready for the ships that are not voted. Brodeur's estimates buy silence in the Quebec press for roughly the price of a second-class cruiser. We defer the navy and place the contracts anyway. The quiet, it turns out, has a line in the budget."
 CANDNC_e_the_quiet_province: "The Quiet Province"
 CANDNC_e_the_quiet_province_desc: "Quebec ends the decade with no status, no fleet and no quarrel — the contracts came cheaper than the guarantees. Bourassa is hunting for presses to start a daily paper. We have bought the province's silence for a season, and the ledger that paid for it will be read aloud soon enough. Quiet is not the same as content."
