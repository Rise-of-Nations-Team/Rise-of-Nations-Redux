 CAN_r_dominion_notes_bonus:0 "The Dominion Note"
 CAN_r_naval_service_bonus:0 "A Naval Service of Our Own"
 CAN_r_fleet_unit_doctrine_bonus:0 "The Fleet Unit"
 CAN_r_seven_million_bonus:0 "The Dominion at Seven Million"
 CAN_r_dominion_waits_bonus:0 "The Dominion Waits"
 CAN_r_transcontinental_bonus:0 "The National Transcontinental"
 CAN_r_grand_trunk_bonus:0 "The Grand Trunk Pacific"
 CAN_r_credit_buildings_5_tt:0 "The Dominion's Credit: construction speed §G+5%§!"
 CAN_r_blair_bonus:0 "The Intercolonial Extended"
 CAN_r_winter_port_bonus:0 "The Winter Port"
 CAN_r_the_question_before_the_house:0 "The Question Before the House"
 CAN_r_the_question_before_the_house_desc:0 "Every party, every province and every newspaper is arguing over who sends Canadians to war. The debate fills the House and empties the galleries of patience."
 CAN_r_paardeberg_veterans:0 "Paardeberg's Veterans"
 CAN_r_paardeberg_veterans_desc:0 "The men who held the line before Cronje's laager are home, and every armoury wants one of them as its sergeant. Their pensions and their honours are a charge on the Treasury."
 CAN_r_the_three_noes:0 "The Three Noes"
 CAN_r_the_three_noes_desc:0 "No council, no cheque, no customs union. Ottawa goes home with its freedom intact and a cooler welcome in Whitehall."
 CAN_r_the_fortresses_are_ours:0 "The Fortresses Are Ours"
 CAN_r_the_fortresses_are_ours_desc:0 "Two imperial fortresses now answer to Ottawa, with their guns, their barracks and their bills. For the first time the Dominion holds its own coasts and pays for the privilege."
 CAN_r_the_hydro_commission:0 "The Hydro-Electric Commission"
 CAN_r_the_hydro_commission_desc:0 "Power from the falls flows to the towns at cost. The ratepayer has a light he can afford and the Toronto syndicate has a grievance it can afford to press."
 CAN_r_the_coast_in_uproar:0 "The Coast in Uproar"
 CAN_r_the_coast_in_uproar_desc:0 "Powell Street is wrecked, the consuls are writing to their capitals, and every merchant on the Pacific is counting the cost of a mob."
 CAN_r_dominion_status:0 "Dominion Status"
 CAN_r_dominion_status_desc:0 "Canada meets the mother country as a government and not as a subject. Status is taken gladly; obligation is declined just as gladly."
 CAN_r_credit_frozen:0 "Credit Is Frozen"
 CAN_r_credit_frozen_desc:0 "New York has stopped lending and the chartered banks have stopped answering their telephones. Nothing moves until the wheat does."
 CAN_r_the_tercentenary_pageant:0 "The Tercentenary Pageant"
 CAN_r_the_tercentenary_pageant_desc:0 "Champlain lands again below the Citadel and three centuries of Quebec are staged as the story of one Dominion. The pageant costs money and buys, for a season, a shared past."
 CAN_r_the_baddeck_airmen:0 "The Airmen of Baddeck"
 CAN_r_the_baddeck_airmen_desc:0 "McCurdy and Baldwin fly off the ice of the Bras d'Or and offer the militia their machines. The Dominion buys a place at the dawn of flight and pays for their patience."
 CAN_r_the_naval_service_act:0 "The Naval Service Act"
 CAN_r_the_naval_service_act_desc:0 "A navy of our own, voted by a House that cannot agree what it is for. Ontario hears loyalty, Quebec hears independence, and the Treasury hears the bill."
 CAN_r_the_fleet_unit:0 "The Fleet Unit"
 CAN_r_the_fleet_unit_desc:0 "A cruiser and her escorts under our flag and our command, paid for by our Treasury and argued over in our House."
 CAN_r_the_loyal_dominion:0 "The Loyal Dominion"
 CAN_r_the_loyal_dominion_desc:0 "Loyal, prosperous and unbound. The Dominion has given the Empire a navy on paper, kept its militia its own, and left every question of the Transvaal open for the next war to answer."
 CAN_r_the_quiet_dominion:0 "The Quiet Dominion"
 CAN_r_the_quiet_dominion_desc:0 "Three railways, a militia council, an office on Bank Street, and not a single warship. The silence keeps the peace in Quebec and wears it thin in Ontario."
 CAN_r_no_ships_no_cheque:0 "Neither Ships Nor Cheque"
 CAN_r_no_ships_no_cheque_desc:0 "The naval resolution dies quietly on the order paper. Quebec is grateful, the Admiralty is not, and the ships that were promised are never laid down."
 CAN_r_the_silence_kept:0 "The Silence Kept"
 CAN_r_the_silence_kept_desc:0 "Monk carries Quebec and Bourassa cheers him from the gallery. Both flanks are held quiet by promising nothing to either."
 CAN_r_the_winter_port:0 "Halifax, the Winter Port"
 CAN_r_the_winter_port_desc:0 "The winter grain and the mails leave through Halifax, not through Maine. The dockyard grows and the Maritimes remember why they joined."
 CAN_r_the_bridge_inquiry:0 "The Bridge Inquiry"
 CAN_r_the_bridge_inquiry_desc:0 "Seventy-five men are dead in the river and a royal commission is checking every sum a distant engineer approved. Canadian hands learn the arithmetic of steel the hard way."
 CAN_r_the_provincial_telephones:0 "The Provincial Telephones"
 CAN_r_the_provincial_telephones_desc:0 "The provinces have bought out Bell and strung the wire to the homestead. The West has discovered it can build a public utility, and has borrowed to do it."
 CAN_r_regina_says_no:0 "Regina Says No"
 CAN_r_regina_says_no_desc:0 "Haultain governs Buffalo with no debt to Ottawa and no love for it. Every federal request now arrives in Regina as an opening bid."
 CAN_r_the_gentlemens_word:0 "The Gentleman's Word"
 CAN_r_the_gentlemens_word_desc:0 "Japan itself limits the men it sends, and keeps the honour of the choosing. Quiet on the coast is bought with a word rather than an insult in the statute book."
 CAN_r_the_opium_commission:0 "The Opium Commission"
 CAN_r_the_opium_commission_desc:0 "A commission sent to pay for a riot has written the first federal drug law instead. A whole new field of law opens almost by accident."
 CAN_r_the_coast_governs_itself:0 "The Coast Governs Itself"
 CAN_r_the_coast_governs_itself_desc:0 "British Columbia's language test stands and Ottawa disallows nothing. The alliance with Japan is Downing Street's burden now."
 CAN_r_the_statute_stands:0 "The Statute Stands"
 CAN_r_the_statute_stands_desc:0 "The exclusion lives in the statute book and London has let it live. The coast is quiet, its docks are white, and its trade across the Pacific pays for both."
 CAN_r_the_imperial_veto:0 "The Imperial Veto"
 CAN_r_the_imperial_veto_desc:0 "Downing Street has struck the act down and the coast knows it. Ottawa must bow, or pass the law again and dare the Colonial Office to disallow a Dominion."
 CAN_r_work_stopped_on_the_line:0 "Work Stopped on the Line"
 CAN_r_work_stopped_on_the_line_desc:0 "The camps have downed tools and the contractors are waiting for Ottawa to blink. Not a rail is laid while the two sides count each other's patience."
 CAN_r_modify_militia_modifier_tt:0 "Modify §YThe Canadian Militia§!:"
 CAN_r_modify_naval_service_modifier_tt:0 "Modify §YThe Naval Service§!:"
 CAN_dnc_militia_modifier:0 "The Canadian Militia"
 CAN_dnc_militia_modifier_desc:0 "The force the Dominion raises from its own citizens, shaped by every reform the government votes for it. Each step of the militia programme leaves its mark here."
 CAN_dnc_naval_service_modifier:0 "The Naval Service"
 CAN_dnc_naval_service_modifier_desc:0 "What the Dominion keeps afloat under its own flag, and how well it keeps it. Every naval decision the government takes is written into this service."
 CAN_fx_shield_of_our_own_homes:0 "A Shield for Our Own Homes"
 CAN_fx_shield_of_our_own_homes_desc:0 "The militia may be called out to defend the Dominion and no further. The country trusts a force it knows will never cross an ocean, and digs in behind it; but a shield is not a sword, and no one abroad fears it."
 CAN_fx_no_ships_without_the_people:0 "No Ships Without the People"
 CAN_fx_no_ships_without_the_people_desc:0 "No keel is laid until the electors have spoken. The cabinet is spared a quarrel and the treasury a bill; the slipways stand empty and the sea remains somebody else's business."
 CAN_fx_built_on_canadian_ways:0 "Built on Canadian Ways"
 CAN_fx_built_on_canadian_ways_desc:0 "Every hull the Dominion orders is laid on its own slips at Halifax and Esquimalt. The skill stays in Canadian ports and the repairs are done at home; the shipwrights are drawn from the mills and the ships come slower than they would from the Clyde."
 CAN_r_the_veldt_veterans:0 "The Veldt Veterans"
 CAN_r_the_veldt_veterans_desc:0 "The men who marched to Paardeberg are back in the village companies, and the militia drills harder for having them. Their lobby in the Commons is loud and expects to be heard."
 CAN_r_a_canadian_command:0 "A Canadian Command"
 CAN_r_a_canadian_command_desc:0 "The militia answers to a Militia Council and a Canadian at its head. The force is ours to run; the War Office no longer lends its officers cheaply, and every general we make must be made at home."
 CAN_r_the_imperial_goc:0 "The Imperial General Officer"
 CAN_r_the_imperial_goc_desc:0 "A British regular commands the militia and answers to soldiers, not to the floor of the Commons. The instruction of the finest army in the world comes cheap; the minister finds that his own army does not always take his orders."
 CAN_r_liable_to_serve_abroad:0 "Liable to Serve Abroad"
 CAN_r_liable_to_serve_abroad_desc:0 "Every man enrolled may be sent wherever the Crown has need of him. The force can march the day it is called; the parishes that never chose the quarrel have not forgotten the clause."
 CAN_r_kingston_graduates:0 "The Kingston Graduates"
 CAN_r_kingston_graduates_desc:0 "The Royal Military College turns out engineers, gunners and staff-trained officers of its own. The country no longer rents its technical heads from Sandhurst."
 CAN_r_the_general_staff:0 "The General Staff"
 CAN_r_the_general_staff_desc:0 "A Chief of the General Staff and a staff whose whole work is the plan, the map and the mobilization. The defence of the Dominion is thought through in advance; the staff quarrels with the department and eats the minister's time."
 CAN_r_the_ocean_gates:0 "The Ocean Gates"
 CAN_r_the_ocean_gates_desc:0 "Halifax and Esquimalt are manned, fed and drilled by the Dominion itself. The coast batteries are ours, and so is the bill for keeping them."
 CAN_r_the_strathcona_trust:0 "The Strathcona Trust"
 CAN_r_the_strathcona_trust_desc:0 "Drill, physical training and the rifle are taught in the public schools on Lord Strathcona's endowment. Every boy learns to stand in a rank and hold a foresight steady before any sergeant sees him."
 CAN_r_the_services:0 "The Services That Make an Army"
 CAN_r_the_services_desc:0 "Engineers, signallers, medical and service corps and ordnance men keep the fighting line fed and in touch. The army is whole; the trades take their men from the ranks."
 CAN_r_camp_petawawa:0 "Camp Petawawa"
 CAN_r_camp_petawawa_desc:0 "The great camp on the Ottawa sand plains ranges the guns at their true distances and manoeuvres brigades as brigades. The militia trains together; the camp must be paid for every summer."
 CAN_r_the_imperial_pattern:0 "The Imperial Pattern"
 CAN_r_the_imperial_pattern_desc:0 "The militia carries the Lee-Enfield, interchangeable to the last cartridge with every army it would fight beside. Supply is simple and the rifle is sound; the plant that would have built a rifle of our own is never raised."
 CAN_r_cartridges_by_the_million:0 "Cartridges by the Million"
 CAN_r_cartridges_by_the_million_desc:0 "The Dominion Arsenal turns out cartridges, cordite, cases and caps under its own roof. Whatever rifle the militia carries, the round behind it is Canadian."
 CAN_r_a_nation_of_marksmen:0 "A Nation of Marksmen"
 CAN_r_a_nation_of_marksmen_desc:0 "Rifle associations in every town, the ranges busy on Saturdays, a whole people competent with a trigger. It is cheaper than barracks and truer to what we are; it is also an army that has never stood in a brigade."
 CAN_r_the_permanent_force:0 "The Permanent Force"
 CAN_r_the_permanent_force_desc:0 "Cavalry, artillery and infantry kept under arms the year round to instruct the militia, hold the fortresses and be ready on the first day. The professional soldier is worth the name, and the treasury pays for him."
 CAN_r_fisheries_protection:0 "The Fisheries Protection Service"
 CAN_r_fisheries_protection_desc:0 "Armed cruisers on both oceans chase poachers off the banks and sealers out of our waters. Every gun mounted on a fishery cruiser is the first plank of a navy."
 CAN_r_a_navy_under_our_own_flag:0 "A Navy Under Our Own Flag"
 CAN_r_a_navy_under_our_own_flag_desc:0 "Warships under the Dominion's flag, crewed by its own men and answerable to Ottawa. The yards are busy and the service learns fast; the estimates come out of the same purse as the railways."
 CAN_r_the_common_fleet:0 "A Share in the Common Fleet"
 CAN_r_the_common_fleet_desc:0 "The Dominion's cheque buys a hull in the fleet that already rules the sea. Protection comes at once and London is grateful; there is no navy of our own in which a Canadian can learn his trade."
 CAN_r_ordered_from_the_clyde:0 "Ordered From the Clyde"
 CAN_r_ordered_from_the_clyde_desc:0 "The Dominion's hulls are laid at Barrow and on the Clyde and delivered within the year. The ships come sooner and cheaper; the builders stay in Britain."
 CAN_r_a_seat_at_the_admiralty:0 "A Seat at the Admiralty Table"
 CAN_r_a_seat_at_the_admiralty_desc:0 "A Canadian is heard when the Admiralty plans the dispositions of the fleet. The Dominion pays in pounds and is answered in a voice at the table."
 CAN_r_the_prairie_not_the_sea:0 "The Prairie, Not the Sea"
 CAN_r_the_prairie_not_the_sea_desc:0 "The money that would have bought cruisers opens the west instead. The rails push out and the towns fill; the Royal Navy keeps the stations it has always held and the Dominion has no sailors of its own."
 CAN_r_charts_of_our_own_waters:0 "Charts of Our Own Waters"
 CAN_r_charts_of_our_own_waters_desc:0 "The Dominion's own vessels have sounded the channels and printed the charts from the Gulf to the Inside Passage. A navy begins with knowing the water it floats on."
 CAN_r_the_marconi_chain:0 "The Marconi Chain"
 CAN_r_the_marconi_chain_desc:0 "A chain of wireless stations along both coasts lets Ottawa speak to any hull at sea. The masts are as much a part of the service as the guns."
 CAN_r_the_naval_reserve:0 "The Naval Reserve"
 CAN_r_the_naval_reserve_desc:0 "Fishermen, lakemen and dock hands drilled in the off-season give the Dominion its crews at a fraction of the cost. The navy sleeps in the ports and wakes, slowly, when it is wanted."
 CAN_r_the_permanent_naval_service:0 "The Permanent Naval Service"
 CAN_r_the_permanent_naval_service_desc:0 "A professional force kept under the Dominion's flag the year round, commanded by a Canadian risen in the Royal Navy. The fleet is ready the day before the war; the cost in patronage and pay is borne every year."
 CAN_r_the_naval_service_of_canada:0 "The Naval Service of Canada"
 CAN_r_the_naval_service_of_canada_desc:0 "A Naval Service in law: a department, a board and a director answerable to Parliament. The Dominion owns a navy and must answer for it, to the imperialists who call it a tin-pot fleet and to the nationalists who call it a tribute."
 CAN_r_cadets_at_sea:0 "Cadets at Sea"
 CAN_r_cadets_at_sea_desc:0 "Two old cruisers, one on each ocean, and the cadets learning the sea in them. The ships are not new and the crews are green."
 CAN_r_the_naval_college:0 "The Royal Naval College of Canada"
 CAN_r_the_naval_college_desc:0 "Cadets are taken in at Halifax and raised into Canadian officers. The men who will one day command are schooled at home."
 CAN_r_a_fleet_unit_of_our_own:0 "A Fleet Unit of Our Own"
 CAN_r_a_fleet_unit_of_our_own_desc:0 "A self-contained cruiser squadron that keeps the sea on its own account. It is a navy in the full meaning of the word, and it draws the yards and the treasury hard."
 CAN_r_a_share_in_the_battle_line:0 "A Share in the Battle Line"
 CAN_r_a_share_in_the_battle_line_desc:0 "The Dominion's money buys dreadnoughts for the common fleet under one command. London is bound to us and we to it; the yards at home stand idle and Quebec remembers the bill."
 CAN_r_the_ross_in_the_mud:0 "The Ross in the Mud"
 CAN_r_the_ross_in_the_mud_desc:0 "The finest target rifle in the world jams when the mud comes. The men have learned to kick the bolt open and carry on; they do not love the rifle."
 CANDNC_army_rmc_doctrine:0 "Royal Military College"
 CANDNC_army_ross_mark_bonus:0 "The Ross Mark II"
 CANDNC_navy_fisheries_bonus:0 "Fisheries Protection Service"
 CANDNC_navy_yards_bonus:0 "The Yards at Halifax and Esquimalt"
 CANDNC_navy_plough_bonus:0 "The Coast Left to the Admiralty"
 CANDNC_navy_fleet_unit_screens_bonus:0 "A Fleet Unit of Our Own"
 CANDNC_navy_admiralty_doctrine:0 "A Seat at the Admiralty Table"
 CANDNC_navy_service_doctrine:0 "The Naval Service Act"
 CANDNC_navy_rnc_doctrine:0 "The Royal Naval College"
 CAN_r_no_veterans_tt:0 "No contingent sailed, and no veterans come home to drill the companies."
 CAN_r_fortresses_already_ours_tt:0 "The keys to the fortresses are already in our hands; the garrisons settle in at once."
 CAN_r_home_service_contradiction_tt:0 "§RWe have already bound the militia to every war of the King. The country notices the contradiction.§!"
 CAN_r_rifle_associations_tt:0 "Rifle associations recruit in §Yevery core state§!: §G+1,500 manpower§! each"
 CAN_r_ross_lines_tt:0 "The Arsenal tools for the §YRoss§! cartridge on a second line"
 CAN_r_admiralty_yard_tt:0 "The Admiralty's yard comes with its slipways already laid"
 CAN_r_plebiscite_tt:0 "The naval question goes to the electors; their answer will come in time"
 CAN_r_whitehall_answers_tt:0 "Whitehall will have something to say about a navy it does not command"
 CAN_r_mud_tt:0 "The rifle will be judged when the mud comes"
 CAN_r_ocean_gates_units_tt:0 "Garrisons are raised for §YHalifax§! and §YEsquimalt§!"
 army_artillery_attack_factor_tt:0 " $MODIFIER_ARMY_ARTILLERY_ATTACK_FACTOR$: $RIGHT|+=%1$"
 can_dnc_r.701.t:0 "The Dundonald Affair"
 can_dnc_r.701.d:0 "The General Officer Commanding, a peer of the realm and a professional soldier, has taken the new Militia Act as a personal affront. He has told a dinner in Montreal, with reporters present, that the militia is being run by politicians for politicians. The minister wants him gone on the next steamer; the imperialist press wants him made a martyr."
 can_dnc_r.701.a:0 "He may go home on the next steamer."
 can_dnc_r.701.b:0 "Keep him on as an adviser, and swallow the speech."
 can_dnc_r.702.t:0 "The War Office Offers Instructors"
 can_dnc_r.702.d:0 "London is pleased to find its General Officer still at the head of the Canadian militia, and the War Office writes to ask how it may help. A party of regular instructors can be spared for the summer camps, or, if the Dominion prefers, a consignment of guns from the imperial reserve."
 can_dnc_r.702.a:0 "Send the instructors."
 can_dnc_r.702.b:0 "Send the guns."
 can_dnc_r.703.t:0 "Quebec Answers the Militia Law"
 can_dnc_r.703.d:0 "The clause making every militiaman liable to serve beyond the seas has reached the parishes. The nationalist press calls it conscription by another name; a meeting in the Champ de Mars has burned the minister in effigy. The government must either stand by the clause or carve an exception for the province that never chose the quarrel."
 can_dnc_r.703.a:0 "The law is the law, in every province."
 can_dnc_r.703.b:0 "Exempt the Quebec regiments from overseas service."
 can_dnc_r.704.t:0 "The Ross in the Mud"
 can_dnc_r.704.d:0 "The reports from the wet camps are in. The Ross shoots better than any rifle in the Empire on a dry range and jams on the third round in the mud, and its bolt can be assembled backwards. The men have learned to kick the bolt open with a boot heel. The company at Quebec swears the next mark will cure it."
 can_dnc_r.704.a:0 "It is our rifle. The men will learn it."
 can_dnc_r.704.b:0 "Pay for the next mark and fix the bolt."
 can_dnc_r.705.t:0 "Whitehall Writes"
 can_dnc_r.705.d:0 "The Admiralty has read of the Dominion's intention to keep warships under its own flag and has written, with great courtesy, to ask under whose orders those ships will sail in a war. The letter suggests that a navy which does not place itself under the Admiralty in wartime is a navy the Empire cannot count on."
 can_dnc_r.705.a:0 "Our ships, our command."
 can_dnc_r.705.b:0 "They will be placed at the Admiralty's disposal in war."
 can_dnc_r.706.t:0 "The Electors Answer"
 can_dnc_r.706.d:0 "The naval question has gone to the country and the returns are in. The ridings along both coasts and in Ontario have voted for ships; the prairie and Quebec have voted against them, and their majorities are larger. The government promised to be bound by the answer."
 can_dnc_r.706.a:0 "No ships. The people have spoken."
 can_dnc_r.706.b:0 "The question was badly put. We build anyway."
 can_dnc_r.707.t:0 "The Tin-Pot Navy"
 can_dnc_r.707.d:0 "The Naval Service Act is law and both oppositions are furious. The imperialists call it a tin-pot navy that insults the Royal Navy; the nationalists call it a tribute fleet that will be handed to London the day a war begins. The minister must say, plainly, whose navy it is."
 can_dnc_r.707.a:0 "It is Canada's navy and it answers to this House."
 can_dnc_r.707.b:0 "It will serve with the Royal Navy in any war of the Empire."
 can_dnc_r.708.t:0 "Niobe Aground"
 can_dnc_r.708.d:0 "Niobe has run onto the ledges off Cape Sable in fog with a cadet at the chart and the pilot below. She is off the rocks but her bottom is open and her engines are shifted. The Halifax yard can make her whole again at a price; or she can be left at her buoy as a depot ship and the cadets sent to Rainbow."
 can_dnc_r.708.a:0 "Dock her at Halifax and make her whole."
 can_dnc_r.708.b:0 "Leave her at her buoy as a depot ship."
 can_dnc_r.709.t:0 "The Fleet Unit Puts to Sea"
 can_dnc_r.709.d:0 "The cruiser squadron is commissioned and the Naval Service must decide where it keeps its weight. Halifax faces the Atlantic and the convoy routes of the Empire; Esquimalt faces a Pacific that grows less quiet every year. The yards cannot serve both equally."
 can_dnc_r.709.a:0 "The Atlantic station."
 can_dnc_r.709.b:0 "The Pacific station."
 can_dnc_r.710.t:0 "The Emergency Contribution"
 can_dnc_r.710.d:0 "The bill voting the money for dreadnoughts is before the House and the Senate has threatened to throw it out. Quebec asks why a province with no ships should pay for three that will never enter the Gulf; Ontario asks why it should pay for less. The contribution can be made outright, or hedged with conditions that London will not love."
 can_dnc_r.710.a:0 "Pay in full. The battle line is ours too."
 can_dnc_r.710.b:0 "A conditional loan, repayable if the ships are ever sold."
 CAN_dnc_imperial_ledger:0 "The Imperial Ledger"
 CAN_dnc_imperial_ledger_desc:0 "Every contribution the Dominion makes to the Empire is entered in the ledger: what London owes Ottawa in goodwill and preference, and what Ottawa pays for it in estimates."
 can_dnc_r.201.t:0 "The Admiralty Names the Figure"
 can_dnc_r.201.d:0 "The Admiralty's letter arrives by the Allan liner. It thanks the Dominion for its resolution, names a yearly sum for the imperial shield, and adds that Canadian crews would be accepted in place of part of it. Fielding reads it twice and asks how the House is to be told."
 can_dnc_r.201.a:0 "Pay it in full this year"
 can_dnc_r.201.b:0 "Spread it over the estimates"
 can_dnc_r.201.c:0 "Offer crews instead of gold"
 can_dnc_r.202.t:0 "Strathcona's Horse Comes Home"
 can_dnc_r.202.d:0 "The troopers land at Halifax with their colours cased and their horses sold. Toronto wants a parade, the Militia Department wants them kept on the establishment, and the Monument-National in Montreal wants to know what the war was for."
 can_dnc_r.202.a:0 "Parade them through Ottawa"
 can_dnc_r.202.b:0 "Keep them on the permanent establishment"
 can_dnc_r.202.c:0 "Let the Ligue have its say"
 can_dnc_r.203.t:0 "The Meeting at the Monument-National"
 can_dnc_r.203.d:0 "Asselin has hired the hall and Bourassa will speak. The police chief asks whether the meeting is to be allowed, the Archbishop asks whether the government means to answer it, and the Quebec members ask whether there is money for the classical colleges this session."
 can_dnc_r.203.a:0 "Face it down: the police clear the hall"
 can_dnc_r.203.b:0 "Buy it off: a grant for the classical colleges"
 can_dnc_r.203.c:0 "Let it set the limit: no new pledge this session"
 can_dnc_r.204.t:0 "Bourassa Leaves the Party"
 can_dnc_r.204.d:0 "Bourassa crosses the floor and sits below the gangway with the Ligue's members behind him. He will not return while the schools clause stands. The whips ask whether to let him go or to find him something he cannot refuse."
 can_dnc_r.204.a:0 "Let him go"
 can_dnc_r.204.b:0 "Offer him a portfolio he cannot take"
 can_dnc_r.205.t:0 "The Secretariat's First Circular"
 can_dnc_r.205.d:0 "The new imperial secretariat sends its first paper to the Dominions: a scheme of defence that asks each of them to earmark a contingent for the Empire's wars, trained to the War Office pattern and ready to sail on the cable. The seat at the council comes with a sword."
 can_dnc_r.205.a:0 "Earmark a division for the Empire"
 can_dnc_r.205.b:0 "Reserve the right of Parliament"
 can_dnc_r.206.t:0 "The Barr Colonists Land"
 can_dnc_r.206.d:0 "Two thousand colonists from the British Isles come off the ships at Saint John and take the train west. Half of them are clerks and shopmen who have never held a plough. The land agents ask whether to sort them at the railhead or let the prairie do it."
 can_dnc_r.206.a:0 "Townsmen on the prairie"
 can_dnc_r.206.b:0 "Send agents to sort the farmers from the clerks"
 can_dnc_r.207.t:0 "The Dominion Pays the Empire's Bill"
 can_dnc_r.207.d:0 "Ottawa has paid for the Empire's ships, seated its members at Westminster and written its tariff in London. The Colonial Office asks what the Dominion is to be given in return: a voice on the Committee of Imperial Defence, or a letter of thanks."
 can_dnc_r.207.a:0 "A voice on the Committee of Imperial Defence"
 can_dnc_r.207.b:0 "Thank the Dominion and bank the cheque"
 can_dnc_r.208.t:0 "The Dominion's Squadron Reports"
 can_dnc_r.208.d:0 "The Canadian squadron under the White Ensign reports to the Admiralty for orders. Ottawa built it and mans it; London commands it. The Sea Lords must decide whether it stays on the Canadian station or joins the Home Fleet."
 can_dnc_r.208.a:0 "Leave the squadron on the Canadian station"
 can_dnc_r.208.b:0 "Order it to the Home Fleet"
 CANDNC_r_b_ledger_opened_tt:0 "The Imperial Ledger is opened: every contribution to the Empire is entered, in goodwill and in estimates."
 CANDNC_r_b_contingent_returns_tt:0 "Strathcona's Horse comes home within the year, and the country must decide what to make of it."
 CANDNC_r_b_minister_in_london_tt:0 "A minister of the Crown sits at the council in London with a vote in his hand."
 CANDNC_r_b_admiralty_figure_tt:0 "The Admiralty names its figure within the week."
 CANDNC_r_b_dominions_at_the_table_tt:0 "Australia, New Zealand and the Cape take their chairs beside ours."
 CANDNC_r_b_both_coasts_guarded_tt:0 "The Royal Navy guards both coasts, and Quebec reads the total in the papers."
 CANDNC_r_b_colonies_never_asked_tt:0 "Every colony never asked watches from below the gangway."
 CANDNC_r_b_birmingham_carries_tt:0 "Our tariff rides on a British election no Canadian may vote in."
 CANDNC_r_b_rent_the_royal_navy_tt:0 "We would sooner rent the Royal Navy than build our own."
 CANDNC_r_b_the_ligue_meets_tt:0 "The Ligue hires the Monument-National, and the government must answer the meeting."
 CANDNC_r_b_liable_to_the_admiralty_tt:0 "The reserve is liable to the Admiralty on the day of mobilisation."
 CANDNC_r_b_forty_million_mouths_tt:0 "The Prairies feed forty million imperial mouths behind one tariff wall."
 CANDNC_r_b_loyalty_not_terms_tt:0 "The Empire takes our loyalty but not our terms."
 CANDNC_r_b_press_quiets_tt:0 "The nationalist press loses its best grievance."
 CANDNC_r_b_quebec_paid_in_its_coin_tt:0 "Quebec is paid in the one coin it values, and the West is sent the bill."
 CANDNC_r_b_bourassa_leaves_tt:0 "Bourassa leaves the party for good within the week."
 CANDNC_r_b_on_the_kings_contracts_tt:0 "The Dominion's steel is built on the strength of the King's contracts."
 CANDNC_r_b_a_better_price_tt:0 "The prairie is bound to the Empire with the surest cord there is: a better price."
 CANDNC_r_b_the_general_column_tt:0 "Goods from Buffalo and Detroit pay the general column."
 CANDNC_r_b_no_majority_can_undo_tt:0 "A promise no English majority can ever undo."
 CANDNC_r_b_rue_saint_denis_tt:0 "Every issue sells out on rue Saint-Denis; Quebec learns to read the paper more closely."
 CANDNC_r_b_before_australia_does_tt:0 "The Empire's hour of need, and Canada's chance to answer it before Australia does."
 CANDNC_r_b_from_the_ore_up_tt:0 "The Empire's armour will be Canadian from the ore up."
 CANDNC_r_b_woven_into_the_line_tt:0 "Not a navy set apart from the Empire's, but a squadron woven into it."
 CANDNC_r_b_another_province_to_the_larder_tt:0 "Science, quietly, is worth another province to the imperial larder."
 CANDNC_r_b_washington_sets_a_date_tt:0 "Washington has set a date, and the Dominion stands by the Empire until it passes."
 CANDNC_r_b_in_its_own_language_tt:0 "French Canada serves the Empire in its own language, and is proud to."
 CANDNC_r_b_past_in_the_empires_colours_tt:0 "The past is dressed in the Empire's colours, and not everyone in Quebec applauds."
 CANDNC_r_b_through_ottawas_keeping_tt:0 "Messages from London to Australia now pass through Ottawa's keeping."
 CANDNC_r_b_the_largest_gift_tt:0 "The largest gift a colony ever made its mother; the Admiralty mans her as it pleases."
 CANDNC_r_b_arm_the_empire_tt:0 "We arm the Empire, and arm ourselves in the doing of it."
 CANDNC_r_b_first_plates_cut_tt:0 "The first plates cut in Canada for a King's ship are cut here."
 CANDNC_r_b_paid_in_years_tt:0 "We choose an imperial prairie over a crowded one, and pay for the choice in years."
 CANDNC_r_b_whatever_the_names_tt:0 "The West fills fast, whatever the Orange press makes of the names."
 CANDNC_r_b_the_seat_comes_with_the_sword_tt:0 "The secretariat's first circular arrives within the fortnight, and the seat comes with the sword."
 CANDNC_r_b_on_londons_money_tt:0 "The Barr colonists land within the month, on London's money and our land."
 CANDNC_r_b_bend_the_letter_tt:0 "The letter of the homestead law is bent to keep the settlers we so badly need."
 CANDNC_r_b_an_obligation_in_writing_tt:0 "The defence of Canadian waters is an obligation in writing rather than a courtesy at pleasure."
 CANDNC_r_b_the_oldest_colony_tt:0 "The Empire that made us both can surely make us one."
 CANDNC_r_b_our_own_western_gate_tt:0 "We man our own western gate, and lean on the Empire's fleet to hold the sea beyond it."
 CANDNC_r_b_the_tenth_province_joined_tt:0 "Newfoundland and Labrador enter Confederation as the tenth province."
 CANDNC_r_b_whitehall_answers_the_paymaster_tt:0 "Whitehall decides what the Empire's paymaster is owed in return."
 CANDNC_r_b_two_destroyers_from_the_admiralty_tt:0 "The Admiralty spares two destroyers for the Canadian station."
 CANDNC_r_b_the_admiralty_disposes_tt:0 "The Sea Lords decide where the Dominion's squadron will serve."
