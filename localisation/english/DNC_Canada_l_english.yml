l_english:
#Focuses
 CANDNC_the_precedent_of_1899: "The Transvaal Precedent"
 CANDNC_the_precedent_of_1899_desc: "A thousand men were sent to fight in South Africa, and Parliament was never asked. The question can no longer be dodged: when the Empire calls Canada to war, who answers — London, the Cabinet, or the House? Every answer we give builds a different country."
 CANDNC_a_every_case_on_its_own_merits: "Every Case on Its Own Merits"
 CANDNC_a_every_case_on_its_own_merits_desc: "We will not bind ourselves to a rule. Each imperial demand will be weighed on its own merits when it comes, and no sooner. While the great question waits, wheat, rail and settlers do the talking, and no one is forced to choose a side."
 CANDNC_a_paardebergs_battle_honour: "Paardeberg's Battle Honour"
 CANDNC_a_paardebergs_battle_honour_desc: "Our men held their ground through the night before Cronje's trenches and took his surrender at dawn. Canada has earned a battle honour with its own dead — proof that the Dominion can field soldiers the Empire will remember, and that we may one day fight for ourselves."
 CANDNC_a_the_coronation_conference: "The Coronation Conference"
 CANDNC_a_the_coronation_conference_desc: "Chamberlain lays three demands before the premiers: a standing imperial council, a Canadian cheque for imperial defence, an Empire customs union. We give ground on none of them. Canada came to a coronation, not to sign away the right to decide its own affairs."
 CANDNC_a_the_alaska_award: "The Alaska Award"
 CANDNC_a_the_alaska_award_desc: "A British judge has sided with Washington and handed away the Panhandle, and our own commissioners refused to sign. The lesson is written on the map: while Canada cannot make its own treaties, London will trade our coast for its own peace."
 CANDNC_a_the_five_hundred_dollar_head_tax: "The Five Hundred Dollar Head Tax"
 CANDNC_a_the_five_hundred_dollar_head_tax_desc: "British Columbia would bar the Chinese outright; we would rather price the door than close it. Five hundred dollars — two years of a labourer's wages — will be taken from every arrival, and the Treasury will keep the difference. Revenue now, and the quarrel with the coast postponed."
 CANDNC_a_dundonald_goes_home: "Dundonald Goes Home"
 CANDNC_a_dundonald_goes_home_desc: "The British general has crossed his minister once too often, and we send him home. Command of the militia passes to a council under a Canadian minister. The Dominion's army will take its orders in Ottawa, not from a seconded earl who forgets whose country this is."
 CANDNC_a_the_autonomy_bills: "The Autonomy Bills"
 CANDNC_a_the_autonomy_bills_desc: "The new provinces of the West will be born with their school question already answered. We rewrite the schools clause, Sifton walks out over it, and the prairie is set to be taught in English. We buy the loyalty of the West, and pay for it in Quebec's trust."
 CANDNC_a_the_keys_of_halifax_and_esquimalt: "The Keys of Halifax and Esquimalt"
 CANDNC_a_the_keys_of_halifax_and_esquimalt_desc: "The last imperial garrisons march out of Halifax and Esquimalt, and the keys are ours. With the fortresses come their guns, their barracks and their upkeep. For the first time Canada holds its own coasts — and learns what holding them will cost."
 CANDNC_a_niagara_at_cost: "Niagara at Cost"
 CANDNC_a_niagara_at_cost_desc: "Power from Niagara will flow to the towns at cost, not at whatever rent a Toronto syndicate cares to charge. A public commission takes the current in hand. The men who owned the best of the falls lose their monopoly to the province, and the ratepayer gains a light he can afford."
 CANDNC_a_the_lemieux_act: "The Lemieux Act"
 CANDNC_a_the_lemieux_act_desc: "No strike or lockout in a mine, railway or utility may begin until a board of three has heard both sides and reported. We do not forbid the quarrel — we force it into daylight before it starts. Labour and capital both lose the weapon of surprise, and the coal keeps moving."
 CANDNC_a_the_riot_on_powell_street: "The Riot on Powell Street"
 CANDNC_a_the_riot_on_powell_street_desc: "A mob has wrecked Vancouver's Chinatown and turned on the Japanese quarter. We answer two ways at once — a chequebook to pay the damage, and a mission to Tokyo to stop the ships — before the next riot writes our foreign policy for us."
 CANDNC_a_the_imperial_conference_of_1907: "The Imperial Conference"
 CANDNC_a_the_imperial_conference_of_1907_desc: "At the conference the colonies become Dominions, meeting the mother country as governments and not as subjects. We take the higher title gladly, and kill the permanent secretariat that would have bound us to a standing imperial policy. Status, yes; obligation, never."
 CANDNC_a_fieldings_three_columns: "Fielding's Three Columns"
 CANDNC_a_fieldings_three_columns_desc: "Fielding rewrites the tariff in three columns — British, intermediate, general — and the middle one is a bargaining chip. We spend it in Paris, signing a commercial treaty of our own under British cover. A Dominion is learning to trade its own tariff for its own gain."
 CANDNC_a_the_panic_of_1907: "The Panic on Wall Street"
 CANDNC_a_the_panic_of_1907_desc: "New York's credit has frozen and the harvest sits in the Winnipeg elevators with no money to move it. There is no central bank to turn to. We issue Dominion notes against the grain itself and race to get the wheat to port before a chartered bank goes down."
 CANDNC_a_the_tercentenary_of_quebec: "The Tercentenary of Quebec"
 CANDNC_a_the_tercentenary_of_quebec_desc: "Champlain lands again below the Citadel while London, Paris and Washington look on. We turn three centuries of Quebec into the pageant of a single Dominion and take the Plains of Abraham into public hands — a shared past, staged to bind a present that does not yet agree on anything."
 CANDNC_a_the_boundary_waters_treaty: "The Boundary Waters Treaty"
 CANDNC_a_the_boundary_waters_treaty_desc: "Every river the border crosses will be judged by a joint commission, three from each side, sitting as equals. Ottawa negotiates it even where London still holds the pen. It is a small sovereignty, quietly taken — the Dominion learning to manage its own frontier."
 CANDNC_a_external_affairs_above_a_shop_on_bank_street: "External Affairs, Above a Shop on Bank Street"
 CANDNC_a_external_affairs_above_a_shop_on_bank_street_desc: "A department of our own to handle the imperial correspondence — a minister, an under-secretary, and a handful of clerks above a barber's shop on Bank Street. It is a humble beginning. But a country that files its own foreign papers has taken the first step toward writing them."
 CANDNC_a_the_silver_dart_flies: "The Silver Dart Flies"
 CANDNC_a_the_silver_dart_flies_desc: "McCurdy lifts the Silver Dart off the ice at Baddeck — the first flight in the whole Empire — and the airmen offer to sell the militia two machines. We can buy Canada a place at the dawn of flight, or let the aeroplane stay a rich man's toy on a frozen bay."
 CANDNC_a_a_naval_service_of_our_own: "A Naval Service of Our Own"
 CANDNC_a_a_naval_service_of_our_own_desc: "The House votes without a dissenting voice for a naval service of our own rather than a cheque to the Admiralty. Ontario hears loyalty in it and Quebec hears independence, and both go home content. On that useful ambiguity we lay the keel of a Canadian navy."
 CANDNC_a_the_fleet_unit_promised: "The Fleet Unit Promised"
 CANDNC_a_the_fleet_unit_promised_desc: "The Admiralty offers the Dominions fleet units of their own — a cruiser and her escorts under our flag and our command. New Zealand buys a battlecruiser for the Royal Navy; we take the harder road and build a Canadian squadron rather than write a cheque and be done."
 CANDNC_a_the_dominion_at_seven_million: "The Dominion at Seven Million"
 CANDNC_a_the_dominion_at_seven_million_desc: "Seven million people, three transcontinentals abuilding, a militia council, a foreign office and a navy still on paper. We have chosen nothing and lost nothing, a Dominion balanced between Empire and continent. But the reckoning is only deferred, and the bill falls due soon enough."
 CANDNC_a_neither_ships_nor_cheque: "Neither Ships Nor Cheque"
 CANDNC_a_neither_ships_nor_cheque_desc: "Monk will grant neither a navy nor a cheque until the people have voted on it, and we let the naval resolution die quietly on the order paper. Quebec is grateful and the question is buried for another session — and the ships that were promised are never built."
 CANDNC_a_monks_motion: "Monk's Motion"
 CANDNC_a_monks_motion_desc: "Monk carries Quebec's Conservatives and Bourassa cheers him from the gallery, while Ontario's Tories wonder aloud what their party is for. We hold both flanks quiet by promising nothing to either. The Dominion keeps its peace by keeping its silence — for now."
 CANDNC_a_the_dominion_waits: "The Dominion Waits"
 CANDNC_a_the_dominion_waits_desc: "Three railways, a militia council, an office on Bank Street — and not a single warship. The Atlantic squadron has sailed for home and left our coasts bare. We have bought ourselves another year of doing nothing, and Ontario has counted the cost and will remember it."
 CANDNC_a_the_national_transcontinental: "The National Transcontinental"
 CANDNC_a_the_national_transcontinental_desc: "The state will build the road from Moncton to Winnipeg and lease it to the Grand Trunk, while the company drives on to the Pacific on bonds we guarantee. It is a gamble with the Dominion's credit that Blair resigned rather than sign — a third railway across a country that may not fill it."
 CANDNC_a_the_grand_trunk_pacific: "The Grand Trunk Pacific"
 CANDNC_a_the_grand_trunk_pacific_desc: "Hays drives his rails toward a Pacific harbour that exists only on a survey. Prince Rupert is a name on paper, and Ottawa has guaranteed every bond that will build it. We back a private empire-builder with public credit, and trust the West to grow into the steel."
 CANDNC_a_camps_on_the_line: "Camps on the Line"
 CANDNC_a_camps_on_the_line_desc: "The railway is dug through the Shield by the immigrants who landed at Quebec this spring. The line advances mile by mile — and the camps, crowded and underpaid, are learning what a strike is. We are building a country and a labour movement in the same trench."
 CANDNC_a_the_bridge_falls_at_quebec: "The Bridge Falls at Quebec"
 CANDNC_a_the_bridge_falls_at_quebec_desc: "The great bridge at Quebec has folded into the river and taken seventy-five men with it, a third of them Mohawk ironworkers from Kahnawake. A distant engineer approved the loads that killed them. We will raise it again — and this time Canadian hands will check the sums."
 CANDNC_a_the_blair_plan: "The Blair Plan"
 CANDNC_a_the_blair_plan_desc: "Blair wins the argument: extend the state-owned Intercolonial, use the track we already have, and help a single new line west. Hays keeps his terminus at Portland. We spare the Dominion's credit a second transcontinental, and spare ourselves the gamble Laurier wanted to take."
 CANDNC_a_halifax_the_winter_port: "Halifax, the Winter Port"
 CANDNC_a_halifax_the_winter_port_desc: "Canada's winter grain and mail will leave through Halifax, not through Portland in Maine. The dockyard grows, the Maritimes remember why they joined Confederation, and an American port loses its Canadian trade. We keep our commerce on our own soil and let Washington hear the grievance."
 CANDNC_a_the_board_of_railway_commissioners: "The Board of Railway Commissioners"
 CANDNC_a_the_board_of_railway_commissioners_desc: "Rates, tolls and crossings will be fixed by a tribunal, not by a minister trading favours. The Cabinet loses a patronage lever it prized; the Western farmer gains, for the first time, somewhere to appeal against the railway. We tie our own hands, and the prairie thanks us for it."
 CANDNC_a_mackenzie_and_mann_reach_edmonton: "Mackenzie and Mann Reach Edmonton"
 CANDNC_a_mackenzie_and_mann_reach_edmonton_desc: "We back the Canadian Northern into Edmonton, the one new line we chose to help. The northern prairie has its second railway, and the Dominion has one more guaranteed debt it can count to the dollar. We wager that the settlers will follow the steel, and that the bonds will come good."
 CANDNC_a_two_provinces_by_a_meridian: "Two Provinces by a Meridian"
 CANDNC_a_two_provinces_by_a_meridian_desc: "Two provinces, not one, split along a meridian — and Ottawa keeps their land, their mines, their forests and their water. We call premiers to office before a single vote is cast. The West is made in Ottawa's image, and taught early who holds the purse."
 CANDNC_a_rutherford_and_scott: "Rutherford and Scott"
 CANDNC_a_rutherford_and_scott_desc: "The new provinces confirm the Liberal governments we installed, and the West is ours for a decade. It learns the first lesson of federalism: that a province is, before all else, a party machine. We hold the prairie — for exactly as long as the prairie chooses to let us."
 CANDNC_a_the_provinces_take_the_telephones: "The Provinces Take the Telephones"
 CANDNC_a_the_provinces_take_the_telephones_desc: "Let the provinces buy out Bell and string the wire to the farms the company never wanted. The telephone reaches the homestead, and the province shoulders the debt for it. Ottawa stands aside while the West builds a public utility of its own — and discovers that it can."
 CANDNC_a_strathcona_and_saskatoon: "Strathcona and Saskatoon"
 CANDNC_a_strathcona_and_saskatoon_desc: "The new West will have universities of its own, at Strathcona and Saskatoon, with agriculture built into them from the first day. Forty-five students are a small start. But a prairie that trains its own men will not long remain a colony of Ontario's colleges."
 CANDNC_a_the_province_of_buffalo: "The Province of Buffalo"
 CANDNC_a_the_province_of_buffalo_desc: "Haultain gets what Ottawa denied the others: one great province between Manitoba and the Rockies, owning its land and minerals outright. He names it Buffalo and forms its first government. We have handed the West a master of its own — and made ourselves a rival on the prairie."
 CANDNC_a_haultain_forms_the_government: "Haultain Forms the Government"
 CANDNC_a_haultain_forms_the_government_desc: "Haultain governs Buffalo from Regina with no debt to Ottawa and no love for it. The West has found one conservative voice that answers only to itself. Our western caucus sits in opposition in a province we never dreamed of losing, and the prairie has learned that it can say no."
 CANDNC_a_the_land_belongs_to_buffalo: "The Land Belongs to Buffalo"
 CANDNC_a_the_land_belongs_to_buffalo_desc: "The land, the mines and the forests pass to Buffalo now, not a generation hence. Homestead entry becomes a provincial affair and Ottawa's great immigration machine loses its lever. The West will grow on its own account, and on its own terms, whether we like the terms or not."
 CANDNC_a_the_west_speaks_with_one_voice: "The West Speaks with One Voice"
 CANDNC_a_the_west_speaks_with_one_voice_desc: "Buffalo returns a solid bloc against us and our majority shrinks. The West has learned to bargain as one province instead of pleading as three. The price of the prairie has gone up, and every session from now will be a negotiation where once it was a command."
 CANDNC_a_the_lemieux_mission: "The Lemieux Mission"
 CANDNC_a_the_lemieux_mission_desc: "Lemieux sails for Tokyo to ask what no Canadian law dares say aloud: that Japan itself limit the men it sends us, and keep the honour of the choosing. We buy quiet on the coast with a gentleman's word rather than an insult in the statute book. The alliance holds; the docks stay calm."
 CANDNC_a_the_continuous_journey: "The Continuous Journey"
 CANDNC_a_the_continuous_journey_desc: "No immigrant may land who has not come by one continuous journey from the country of his birth — and no ship sails direct from Calcutta. We name no race and bar a whole one. The door is shut with a timetable, and Downing Street need never be embarrassed by the word we did not use."
 CANDNC_a_the_opium_act: "The Opium Act"
 CANDNC_a_the_opium_act_desc: "Sent to pay for a riot, King finds two opium factories asking to be compensated — and writes instead the first drug prohibition in Canada. The import and sale of opium for smoking are forbidden. A commission of inquiry becomes, almost by accident, a whole new field of federal law."
 CANDNC_a_a_natal_act_for_british_columbia: "A Natal Act for British Columbia"
 CANDNC_a_a_natal_act_for_british_columbia_desc: "British Columbia has written its language test into law again, and this time we let it stand and ask London to do the same. The alliance with Japan is Downing Street's burden; the coast is ours to govern. We disallow nothing, and answer for nothing."
 CANDNC_a_the_door_shut_by_statute: "The Door Shut by Statute"
 CANDNC_a_the_door_shut_by_statute_desc: "If London has let the exclusion live, the coast has its answer in the statute book. If Downing Street has struck it down, we must choose: bow to the imperial veto, or pass the law again and dare them to disallow a Dominion. The decision is no longer London's alone to make."
 CANDNC_a_the_asiatic_exclusion_league_triumphant: "The Asiatic Exclusion League Triumphant"
 CANDNC_a_the_asiatic_exclusion_league_triumphant_desc: "The Exclusion League now sits on Vancouver's council and in Victoria's House. The coast is quiet, its docks are white, and its trade with Japan pays the price of that quiet. We have let the province write its own race law into power — and must now govern with the men it produced."
#Focus tooltips
 CANDNC_a_head_tax_tt: "The Treasury collects five hundred dollars a head; Chinese immigration falls to a trickle."
 CANDNC_a_fracture_tt: "The schools compromise wounds the French minority of the West: the fracture between the two peoples deepens by one."
 CANDNC_a_era_end_navy_tt: "The Dominion ends the era loyal, prosperous and unbound: a naval service resolved, the imperial fortresses held, the militia its own, the West settled, and every question of the Transvaal still open."
 CANDNC_a_era_end_wait_tt: "The Dominion ends the era loyal and prosperous, with two coasts and not one ship. Quebec is quiet, Ontario is not, and the Admiralty will ask again."
 CANDNC_a_monks_motion_tt: "The Quebec Conservatives follow Monk; the Ontario Conservatives follow the Toronto News."
 CANDNC_a_continuous_journey_tt: "The Pacific door is shut by regulation, without a statute for London to disallow or a race to name; one day a ship of British subjects will anchor off Vancouver."
 CANDNC_a_naval_service_bonus: "Naval Service"
 CANDNC_a_prairie_universities_bonus: "Prairie Universities"
 CANDNC_a_engineering_bonus: "Federal Engineering Service"
 CANDNC_a_aerodrome_bonus: "Canadian Aerodrome Company"
 CAN_a_state_buffalo: "Buffalo"
 CAN_a_state_buffalo_north: "Buffalo North"
#Ideas
 CAN_a_the_middle_way: "The Middle Way"
 CAN_a_the_middle_way_desc: "Each imperial request is weighed as it comes, and none of them binds the next. Laurier gives the Empire what it asks and the country what it wants, and buys the difference with time."
 CAN_a_the_lesson_of_alverstone: "The Lesson of Alverstone"
 CAN_a_the_lesson_of_alverstone_desc: "A British judge gave away Canadian ground to keep an American friend. The country has learned that no one negotiates for it but itself, and has not yet acquired the means."
 CAN_a_the_militia_council: "The Militia Council"
 CAN_a_the_militia_council_desc: "A minister presides, a Canadian may command, and the services of supply, engineering, medicine and ordnance are the Dominion's own. The Permanent Force is doubled and a general staff is coming."
 CAN_a_the_compromise_of_1905: "The Schools Compromise"
 CAN_a_the_compromise_of_1905_desc: "The rewritten clause sixteen saved the Liberal party and cost the French minority of the West its schools. The party is united and the grievance is filed for later."
 CAN_a_the_lemieux_act: "The Lemieux Act"
 CAN_a_the_lemieux_act_desc: "In mines, railways and utilities no strike or lockout may begin until a board of three has reported. The public keeps its coal and its trains; the unions keep a hearing and lose the moment."
 CAN_a_the_intermediate_tariff: "The Intermediate Tariff"
 CAN_a_the_intermediate_tariff_desc: "Fielding's middle column gives Ottawa something to bargain with abroad without touching the general tariff at home. The manufacturers accept the flexibility for the protection."
 CAN_a_the_office_on_bank_street: "The Office on Bank Street"
 CAN_a_the_office_on_bank_street_desc: "Joseph Pope and a handful of clerks file the imperial correspondence above a barber's shop. It settles nothing yet, and it is where a foreign policy will one day be kept."
 CAN_a_three_transcontinentals: "Three Transcontinentals"
 CAN_a_three_transcontinentals_desc: "The Grand Trunk Pacific, the Canadian Northern and the state's own National Transcontinental are all building at once for six million people. Everything is faster and everything is on credit."
 CAN_a_the_camps_on_the_line: "The Camps on the Line"
 CAN_a_the_camps_on_the_line_desc: "The Transcontinental is dug through the Shield by immigrant navvies in company camps. The line advances by the mile, and the camps are learning to organise."
 CAN_a_the_intercolonial_way: "The Intercolonial Way"
 CAN_a_the_intercolonial_way_desc: "The state railway is the trunk, one new operator is helped, and Ottawa's credit is not pledged to a second and third transcontinental. Slower building, and no bill in 1917."
 CAN_a_the_railway_commission: "The Board of Railway Commissioners"
 CAN_a_the_railway_commission_desc: "Rates and cars are fixed by a tribunal, not by a minister. The West has an appeal against the Canadian Pacific, and the Cabinet has lost a lever."
 CAN_a_ottawa_keeps_the_land: "Ottawa Keeps the Land"
 CAN_a_ottawa_keeps_the_land_desc: "The public lands, mines, forests and waters of Alberta and Saskatchewan remain the Dominion's, with a subsidy in compensation. The immigration machine keeps its instrument and the two provinces know their rank."
 CAN_a_the_buffalo_bloc: "The Buffalo Bloc"
 CAN_a_the_buffalo_bloc_desc: "One province from Manitoba to the Rockies, governed by Haultain and owning its own resources, speaks for the West with one voice, and that voice is not Laurier's."
 CAN_a_buffalos_own_land: "Buffalo's Own Land"
 CAN_a_buffalos_own_land_desc: "Homestead entry, coal royalties and timber dues go to Regina, twenty-five years early. Buffalo builds on its own account, and Ottawa's hand on the West is lighter than it meant to be."
 CAN_a_the_exclusion_league: "The Asiatic Exclusion League"
 CAN_a_the_exclusion_league_desc: "The League that marched on Powell Street now sits in council chambers and legislatures. British Columbia is quiet, and every cargo to Yokohama pays for the quiet."
 CAN_a_the_yokohama_tariff: "The Yokohama Tariff"
 CAN_a_the_yokohama_tariff_desc: "Japan has answered the statute with its schedule of duties. Lumber, flour and fish from the Pacific coast find the Japanese market dearer than it was."
 CAN_a_coal_famine: "Coal Famine on the Prairies"
 CAN_a_coal_famine_desc: "The Lethbridge pits are idle and the winter is not. Settlers burn fence posts and granary floors, and blame Ottawa for the frost."
 CAN_a_credit_is_scarce: "Credit Is Scarce"
 CAN_a_credit_is_scarce_desc: "The Sovereign Bank has suspended and the other banks are hoarding their notes. The West's paper is discounted, building slows, and the shops price it in."
 CAN_a_the_coal_towns_remember: "The Coal Towns Remember"
 CAN_a_the_coal_towns_remember_desc: "The militia was sent against strikers at Glace Bay in aid of a company. Cape Breton and Springhill will remember it for a generation, and will not send their sons willingly."
 CAN_a_the_district_recognized: "The District Recognized"
 CAN_a_the_district_recognized_desc: "The Dominion Coal Company was left without troops and had to talk to District 26. The mining towns are steadier, the company is sulkier, and a precedent has been set that Winnipeg will read in 1919."
 CAN_a_undefended_coasts: "Coasts Without a Squadron"
 CAN_a_undefended_coasts_desc: "The North America squadron has gone home and nothing has replaced it. Halifax and Esquimalt have forts, dockyards and no ships, and every editor in Ontario knows it."
#Events
 can_dnc_a.1.t: "Every Answer Is a Country"
 can_dnc_a.1.d: "Bourassa has sat down and the House waits for the Prime Minister. Five answers are possible to the member for Labelle, and each of them is a different Canada. Laurier may weigh each case as it comes, and buy time with wheat and rail. He may say that the Sardinian was the first of many, and make the Dominion the King's reservoir. He may look south, where the market is, and ask Washington for reciprocity. He may say that not one more man goes to the Transvaal without a vote, and take the quarrel with London that follows. Or he may say aloud what the order of 14 October never said: that two peoples were engaged by one stroke of the pen, and that one of them was not asked."
 can_dnc_a.1.a: "The House will hear all five."
 can_dnc_a.2.t: "Mr. Chamberlain Reads the Canadian Answer"
 can_dnc_a.2.d: "The Colonial Secretary has his three questions back from Sir Wilfrid Laurier: no permanent council, no standing contribution to defence, no imperial Zollverein. Canada offers to keep the preference it already grants of its own free will, and nothing that can be entered in a minute book. Chamberlain has the Australians and the New Zealanders waiting to see what London does with a refusal."
 can_dnc_a.2.a: "We regret it, and keep the preference."
 can_dnc_a.2.b: "We shall ask again at the next conference."
 can_dnc_a.2.c: "Then talk of preference ends here."
 can_dnc_a.3.t: "A Regret From Downing Street"
 can_dnc_a.3.d: "Chamberlain regrets the Canadian answer in a despatch of eleven pages and lets the matter drop. The British preference stands, Laurier comes home to a country that has noticed nothing, and the Colonial Office files the three noes for another day."
 can_dnc_a.3.a: "Time bought."
 can_dnc_a.4.t: "Chamberlain Will Ask Again"
 can_dnc_a.4.d: "The Colonial Secretary tells the Commons that the Dominions were not ready, and that the next conference will find them readier. Sir Wilfrid Laurier reads the speech in Ottawa and understands that the questions of 1902 have been adjourned, not withdrawn."
 can_dnc_a.4.a: "Five years is a long time in a young country."
 can_dnc_a.4.tt: "Lord Elgin will press the secretariat harder at the next Imperial Conference."
 can_dnc_a.5.t: "Then Talk of Preference Ends Here"
 can_dnc_a.5.d: "Chamberlain answers a refusal with a refusal. Britain will hear no more of tariff preference from a colony that gives nothing for it, and Fielding's gift of 1897 becomes a gift with no return. Montreal's exporters read the despatch once and Toronto's imperialists read it twice."
 can_dnc_a.5.a: "We gave it freely. We keep it freely."
 can_dnc_a.6.t: "The Militia Act Reaches Whitehall"
 can_dnc_a.6.d: "The Canadian Militia Act of 1904 lies before the Colonial Office and the War Office together. A Militia Council presided over by a minister; no obligation that a British officer command; the Halifax clause repealed; a Permanent Force doubled toward four thousand men. The Judge Advocate General finds nothing illegal in it. The generals find a great deal they dislike. Disallowance is possible; it has not been used against a Canadian statute since Confederation."
 can_dnc_a.6.a: "Accept it, on two conditions."
 can_dnc_a.6.b: "Accept it outright."
 can_dnc_a.6.c: "Disallow it."
 can_dnc_a.7.t: "Accepted, on Two Conditions"
 can_dnc_a.7.d: "London will not disallow the Militia Act, provided the letters patent of the Governor General and his commission are amended to make plain that the command in chief remains vested in the Crown. Ottawa concedes the wording and keeps the substance: the Militia Council sits, and Sir Frederick Borden presides."
 can_dnc_a.7.a: "The form is theirs. The militia is ours."
 can_dnc_a.8.t: "Accepted Outright"
 can_dnc_a.8.d: "The War Office grumbles and the Colonial Office signs. The Militia Act stands as passed, and the Canadian minister of Militia and Defence commands his own department for the first time. Sir Frederick Borden orders champagne for the Militia Council."
 can_dnc_a.8.a: "A good day for the department."
 can_dnc_a.9.t: "The Militia Act Is Disallowed"
 can_dnc_a.9.d: "For the first time since Confederation the Crown disallows a Canadian statute. The Militia Act is void, Lord Dundonald's friends at the War Office have won, and the Governor General is asked to inform his ministers. Sir Wilfrid Laurier has a Parliament that will do what he asks and a Colonial Office that has told it not to."
 can_dnc_a.9.a: "Withdraw the Council. There will be another session."
 can_dnc_a.9.b: "Pass it again, word for word."
 can_dnc_a.10.t: "Three Questions Before the Closing"
 can_dnc_a.10.d: "Colonial Office, July 1902. Chamberlain has put his three questions to the premiers: a permanent imperial council, a standing contribution to imperial defence, a customs union of the Empire. Barton is tempted, Seddon is willing, and everyone waits for Canada. Sir Wilfrid Laurier has until the conference rises on 11 August to answer, and the Governor General has already been asked twice what he will say."
 can_dnc_a.10.a: "No, no, and no."
 can_dnc_a.10.b: "No to all three, and Canada will take Halifax and Esquimalt off the War Office's hands."
 can_dnc_a.10.c: "Say nothing until the conference rises."
 can_dnc_a.10.tt: "The transfer of the imperial fortresses will cost less when it comes."
 can_dnc_a.11.t: "The Conference Rises Without an Answer"
 can_dnc_a.11.d: "The premiers go home. Sir Wilfrid Laurier has said nothing to Chamberlain that could be written down, and Chamberlain has written down that Canada said nothing. The three noes now go by cable from Ottawa, which is a poorer way to say them, and the Colonial Office remembers a premier who let a conference close on his silence."
 can_dnc_a.11.a: "Cable the three noes from Ottawa."
 can_dnc_a.12.t: "The Grain Growers Sue the CPR"
 can_dnc_a.12.d: "Sintaluta, Assiniboia, December 1902. The Territorial Grain Growers' Association has laid an information against the Canadian Pacific's agent for handing out cars in defiance of the Manitoba Grain Act. The magistrate convicts. The company appeals to Ottawa in every sense of the word: to the courts, and to the ministers who need it to build the second transcontinental."
 can_dnc_a.12.a: "The Grain Act stands. Let the conviction be upheld."
 can_dnc_a.12.b: "Let the company appeal, and appeal again."
 can_dnc_a.13.t: "The President Reads the Award"
 can_dnc_a.13.d: "The White House has the award of the Alaska tribunal: four to two, Lord Alverstone with the Americans, the heads of the Lynn Canal American, and the two Canadian commissioners refusing to sign. Roosevelt had the line already; what he wants now is a Canada that stops sulking about it. Hay suggests a gracious note. Root suggests nothing at all."
 can_dnc_a.13.a: "A gracious note to Ottawa."
 can_dnc_a.13.b: "The award is the award."
 can_dnc_a.14.t: "A Gracious Note From Washington"
 can_dnc_a.14.d: "Secretary Hay writes to Ottawa, through the British ambassador as he must, that the President regards the boundary as settled and the friendship of the two countries as strengthened by it. It costs Washington nothing and it is read in Ottawa for what it is: a hand offered after the pocket has been picked."
 can_dnc_a.14.a: "We shall shake it. We shall remember."
 can_dnc_a.15.t: "The Award Is the Award"
 can_dnc_a.15.d: "Nothing comes from Washington. The President has the line he wanted and sees no reason to say anything about it. Ottawa notes that the United States, having won, does not trouble to be gracious, and that Britain, having yielded, does not trouble to be sorry."
 can_dnc_a.15.a: "Noted."
 can_dnc_a.15.tt: "The lesson of Alverstone is remembered."
 can_dnc_a.16.t: "Sifton Walks Out"
 can_dnc_a.16.d: "27 February 1905. Clifford Sifton, eight years the maker of the West, resigns from the Interior over clause sixteen of the Autonomy Bills. He will not constitutionalise separate schools in provinces he peopled. Fitzpatrick offers to redraft the clause with him around the ordinance of 1901; Frank Oliver of the Edmonton Bulletin waits in the corridor for the department."
 can_dnc_a.16.a: "Fitzpatrick redrafts, and Sifton reads it first."
 can_dnc_a.16.b: "Frank Oliver takes the Interior."
 can_dnc_a.16.tt: "Oliver ends the paid recruiting of continental Europeans; the camps will be smaller and quieter."
 can_dnc_a.17.t: "The Pits at Lethbridge Are Idle"
 can_dnc_a.17.d: "March 1906. The United Mine Workers of District 18 are out at Lethbridge against the Alberta Railway and Irrigation Company, and the pits that heat the southern Prairies are silent. Spring is no time to notice. By October it will be, and the settlers of Saskatchewan and Alberta will burn fence posts. Lemieux proposes to send Mackenzie King, the deputy minister of Labour, to arbitrate."
 can_dnc_a.17.a: "Send Mackenzie King to Lethbridge."
 can_dnc_a.17.b: "The company and the union must settle it themselves."
 can_dnc_a.17.c: "Wait. The frost will concentrate minds."
 can_dnc_a.18.t: "Winter Comes to the Prairies"
 can_dnc_a.18.d: "November 1906 and the pits are still idle. There is no coal at Medicine Hat, none at Moose Jaw, and the Bulletin prints letters from farmers burning their granary floors. The strike that was a company's affair in March is a government's affair now, and it will cost more to end."
 can_dnc_a.18.a: "Send King now, and pay for the delay."
 can_dnc_a.18.b: "The Prairies will burn what they can find."
 can_dnc_a.19.t: "The Ontario Bank Falls"
 can_dnc_a.19.d: "October 1906. The Ontario Bank has been speculating with its depositors' money on the New York exchange and has lost it. There is no central bank and no deposit guarantee; there is the Bank of Montreal, which offers to take over the Ontario's liabilities to stop a run on every branch bank in the country. Fielding can let it, or he can pledge the Treasury."
 can_dnc_a.19.a: "Let the Bank of Montreal absorb it."
 can_dnc_a.19.b: "Guarantee the depositors from the Treasury."
 can_dnc_a.20.t: "The Bridge Falls at Quebec"
 can_dnc_a.20.d: "29 August 1907, 5.32 in the afternoon. The south cantilever arm of the Quebec Bridge buckles at the compression chords and goes into the St. Lawrence with the men on it: seventy-five dead, thirty-three of them Mohawk ironworkers from Kahnawake. The Dominion guaranteed the company's bonds and never checked Theodore Cooper's calculations. The Royal Commission will say so."
 can_dnc_a.20.a: "A federal engineering service will check every guaranteed work."
 can_dnc_a.20.b: "The commission reports; the company rebuilds."
 can_dnc_a.21.t: "King Sits in Vancouver"
 can_dnc_a.21.d: "October 1907. Mackenzie King opens two royal commissions in Vancouver, one for the Chinese losses of 7 September and one for the Japanese. The Chinese claims come to about 27,000 dollars, the Japanese to about 9,000. Tokyo has an ambassador in London to press its bill; Peking has nobody. King also finds, among the claimants, two opium factories asking to be paid for their stock."
 can_dnc_a.21.a: "Pay both: 27,000 to the Chinese, 9,000 to the Japanese."
 can_dnc_a.21.b: "Pay the Japanese. Peking has no ambassador in London."
 can_dnc_a.21.c: "Vancouver pays for its own riot."
 can_dnc_a.22.t: "Powell Street Holds"
 can_dnc_a.22.d: "The Foreign Ministry has the consul's report from Vancouver: a white mob marching under a banner of the Asiatic Exclusion League, Chinatown wrecked, and Powell Street held by Japanese residents who were warned and armed. More than eight thousand Japanese have landed in Canada this year. Hayashi must answer a British Dominion under a British alliance, without giving Vancouver the excuse it wants."
 can_dnc_a.22.a: "Protest through the Embassy in London."
 can_dnc_a.22.b: "Accept the Dominion's amends."
 can_dnc_a.22.c: "Suspend the emigration companies' licences."
 can_dnc_a.23.t: "Tokyo Protests Through London"
 can_dnc_a.23.d: "The Japanese ambassador calls at the Foreign Office, the Foreign Office writes to the Colonial Office, and the Colonial Office writes to Lord Grey. By the time the protest reaches Ottawa it has three seals on it and one meaning: the alliance of 1902 is worth more to London than the peace of Vancouver, and Ottawa is expected to know it."
 can_dnc_a.23.a: "We shall answer London, and Tokyo will read it."
 can_dnc_a.24.t: "Tokyo Accepts the Amends"
 can_dnc_a.24.d: "Hayashi tells the Diet that the Canadian government has punished nobody and paid everybody, and that Japan's honour is satisfied. It is not entirely true and it is entirely convenient. Ottawa is grateful to have been let off, and does not ask why."
 can_dnc_a.24.a: "A friend in Tokyo is worth more than a statute in Victoria."
 can_dnc_a.25.t: "Tokyo Closes Its Own Tap"
 can_dnc_a.25.d: "The Foreign Ministry suspends the licences of the emigration companies that filled the ships to Vancouver. Nothing is said to Ottawa and nothing is asked. Japan will not be legislated against; it will legislate itself, and keep the honour of the decision."
 can_dnc_a.25.a: "Better than any statute of ours."
 can_dnc_a.26.t: "Mr. Lemieux Calls at Kasumigaseki"
 can_dnc_a.26.d: "Rodolphe Lemieux, Canada's Postmaster General, has come to Tokyo with Joseph Pope and an introduction from the British ambassador. He asks Count Hayashi for an understanding no treaty will record: that Japan itself limit the emigration of labourers to Canada, so that Ottawa need pass no law that London would have to disallow. He suggests four hundred a year."
 can_dnc_a.26.a: "Four hundred a year, and Japan keeps the tap."
 can_dnc_a.26.b: "Japan's honour forbids it."
 can_dnc_a.26.c: "A thousand a year, or nothing."
 can_dnc_a.27.t: "Four Hundred a Year"
 can_dnc_a.27.d: "Hayashi and Lemieux exchange notes in December 1907. Japan will restrict emigration to Canada to about four hundred labourers and domestics a year, of its own accord and by its own regulations, families and returning residents apart. Canada passes no law. Vancouver gets its result and Tokyo keeps its face, and every Canadian government will live by the arrangement until 1928."
 can_dnc_a.27.a: "The gentleman's agreement."
 can_dnc_a.28.t: "Japan's Honour Forbids It"
 can_dnc_a.28.d: "Count Hayashi is courteous and immovable: the Empire of Japan does not undertake to keep its subjects at home to spare a colony the trouble of excluding them. Lemieux sails home with nothing, and the Asiatic Exclusion League holds a meeting in Vancouver that ends outside the Japanese consulate."
 can_dnc_a.28.a: "The League will not wait."
 can_dnc_a.29.t: "A Thousand a Year, or Nothing"
 can_dnc_a.29.d: "Hayashi will restrict, but not to four hundred: a thousand labourers a year, or Japan will restrict nothing. Lemieux cables Ottawa. A thousand is more than Vancouver will thank Laurier for and less than the ships now carry, and there is no third answer."
 can_dnc_a.29.a: "Take the thousand."
 can_dnc_a.29.b: "Then nothing."
 can_dnc_a.30.t: "Victoria's Natal Act Reaches the Colonial Office"
 can_dnc_a.30.d: "British Columbia has passed, once again, an act on the Natal model excluding any immigrant who cannot write out a passage in a European language, and this time Ottawa has declined to disallow it. The Colonial Office knows the act is aimed at Japan and India, and so does the Japanese ambassador, who has already called. The alliance of 1902 was renewed only two years ago."
 can_dnc_a.30.a: "Disallow it. The alliance stands."
 can_dnc_a.30.b: "Let it live a session, and see."
 can_dnc_a.31.t: "The Colonial Office Disallows"
 can_dnc_a.31.d: "Lord Elgin's despatch reaches Government House: the British Columbia act is disallowed as repugnant to imperial policy and to a treaty of His Majesty. Victoria receives it as it has received the last three, and Ottawa is asked to explain why it did not act first."
 can_dnc_a.31.a: "So be it, for now."
 can_dnc_a.31.tt: "The Door Shut by Statute will let Ottawa bow, or let Victoria pass the act again."
 can_dnc_a.32.t: "London Lets It Live"
 can_dnc_a.32.d: "The Colonial Office reserves its opinion and takes no action; the act stands for the session and perhaps for longer. Nobody in Whitehall says the alliance is worth less than it was. Everybody in Vancouver believes it, and the docks are quiet."
 can_dnc_a.32.a: "The coast has its statute."
 can_dnc_a.32.tt: "The exclusion act stands; The Door Shut by Statute will read this."
 can_dnc_a.33.t: "The Dominion Legislates Against Japanese Subjects"
 can_dnc_a.33.d: "The Foreign Ministry has the text of the British Columbia act and Ottawa's refusal to disallow it. Whether or not London acts, the Dominion has chosen the statute over the understanding, and Japanese subjects are named by a British legislature. Hayashi can protest to the ally, answer with the tariff, or say nothing and let the alliance carry the insult."
 can_dnc_a.33.a: "Protest through London."
 can_dnc_a.33.b: "Answer with the tariff."
 can_dnc_a.33.c: "Say nothing. The alliance is worth more."
 can_dnc_a.34.t: "Tokyo Protests Through London"
 can_dnc_a.34.d: "The Japanese note reaches the Foreign Office within the week and the Colonial Office within the month, and Lord Elgin forwards it to Ottawa with a covering letter that is colder than the note. Japan is offended and Britain is embarrassed, and both hold Ottawa responsible for the second."
 can_dnc_a.34.a: "The coast comes first."
 can_dnc_a.35.t: "Japan Answers With Its Tariff"
 can_dnc_a.35.d: "Tokyo raises its duties on Canadian lumber, flour and fish, and the Yokohama agents stop buying. British Columbia, which wanted the statute, discovers what it exported to the country it excluded. The Board of Trade in Vancouver asks Ottawa to do something, and Ottawa has nothing to do."
 can_dnc_a.35.a: "The price of the statute."
 can_dnc_a.36.t: "Tokyo Says Nothing"
 can_dnc_a.36.d: "No note comes from Tokyo. The Japanese ambassador in London does not call, the Foreign Ministry summons no one, and the emigration companies quietly stop selling passages to Vancouver. Japan has decided that its alliance is worth a colony's insult, and will remember who insulted it."
 can_dnc_a.36.a: "Silence, and a memory."
 can_dnc_a.36.tt: "Japan remembers the statute."
 can_dnc_a.37.t: "Mr. Deakin's Secretariat"
 can_dnc_a.37.d: "Imperial Conference, Downing Street, April 1907. Alfred Deakin of Australia wants a permanent imperial secretariat, an office that would prepare the conference's business and follow up its resolutions between meetings. Sir Wilfrid Laurier will not have it: no standing body may bind Ottawa between conferences. Lord Elgin must find something to give Deakin without giving Laurier a reason to leave the room."
 can_dnc_a.37.a: "A Dominions Department at the Colonial Office instead."
 can_dnc_a.37.b: "Press Ottawa once more."
 can_dnc_a.38.t: "A Dominions Department Instead"
 can_dnc_a.38.d: "The Colonial Office creates a Dominions Department within itself, staffed by its own clerks and answerable to its own Secretary of State. It is not Deakin's secretariat and it is not nothing. The self-governing colonies are Dominions from this session, the conference will meet every four years, and Canada has agreed to nothing it did not already do."
 can_dnc_a.38.a: "A title taken, an obligation refused."
 can_dnc_a.39.t: "Lord Elgin Presses Once More"
 can_dnc_a.39.d: "Elgin asks Laurier privately whether Canada might accept at least a standing committee of correspondence, and reminds him that Chamberlain's questions of 1902 were adjourned rather than answered. Laurier can give the committee and keep the peace, or refuse and let London draw its own conclusion about the Dominion that always says no."
 can_dnc_a.39.a: "Concede a standing committee of correspondence."
 can_dnc_a.39.b: "No secretariat, and no more letters."
 can_dnc_a.40.t: "Fielding and Brodeur in Paris"
 can_dnc_a.40.d: "Two Canadian ministers, William Stevens Fielding and Louis-Philippe Brodeur, are at the Quai d'Orsay with a draft commercial treaty: Canada's intermediate tariff for French wines, silks and soaps, France's minimum tariff for Canadian wheat, lumber and fish. The British ambassador will countersign, as the forms require. Pichon may sign now, or let the Chamber's protectionists have a season with it."
 can_dnc_a.40.a: "Sign with Fielding and Brodeur, under British cover."
 can_dnc_a.40.b: "Delay a season."
 can_dnc_a.41.t: "The Treaty of Paris Is Signed"
 can_dnc_a.41.d: "Paris, 19 September 1907. Fielding and Brodeur sign a treaty of commerce with France, the first substantial agreement between Canada and a European power negotiated by Canadian ministers. The British ambassador's signature is under theirs, and everyone at the table knows which of the three did the work."
 can_dnc_a.41.a: "Sovereignty arrives by the tariff."
 can_dnc_a.42.t: "Paris Waits a Season"
 can_dnc_a.42.d: "Pichon is friendly and the Chamber is not. The treaty is sent to committee, where the wine-growers of the Midi discover an interest in Canadian tariff schedules. Fielding sails home; Brodeur stays on at the Hotel Meurice to wait them out."
 can_dnc_a.42.a: "Leave Brodeur in Paris until they sign."
 can_dnc_a.43.t: "The Call Loans Stop"
 can_dnc_a.43.d: "October 1907. The Knickerbocker Trust has closed in New York and the call loans have stopped; the Canadian banks that lent there cannot get their money out. In Winnipeg the harvest is in the elevators and no bank will advance the paper to move it. There is no lender of last resort. Fielding can advance Dominion notes to the banks against securities, an expedient the Bank Act does not foresee, or let the weakest bank go and hope the rest hold."
 can_dnc_a.43.a: "Advance Dominion notes to the banks."
 can_dnc_a.43.b: "Let the Sovereign Bank fall."
 can_dnc_a.43.c: "Wait for New York to steady."
 can_dnc_a.43.tt: "The harvest moves; the Treasury's credit is lent to private banks."
 can_dnc_a.44.t: "The Sovereign Bank Suspends"
 can_dnc_a.44.d: "January 1908. The Sovereign Bank of Canada suspends payment and a consortium of the larger banks takes over its paper. New York did not steady in time. The wheat has moved late and dear, and Fielding must now decide, forty-five days after he could have decided cheaply."
 can_dnc_a.44.a: "Advance the notes now, and pay more."
 can_dnc_a.44.b: "Let the other banks take its paper."
 can_dnc_a.45.t: "Mr. Root and the Boundary Waters"
 can_dnc_a.45.d: "The State Department has the draft that George Gibbons negotiated for Canada and that James Bryce will sign for the King: an International Joint Commission of six, three American and three Canadian, with equal votes on every use and diversion of the waters that cross the border. Root can sign it, or let the Senate's friends of the Chicago Drainage Canal have their say first."
 can_dnc_a.45.a: "Sign with Bryce."
 can_dnc_a.45.b: "Hold it for the Senate."
 can_dnc_a.46.t: "Parity With a Power Ten Times Our Size"
 can_dnc_a.46.d: "Washington, 11 January 1909. Bryce and Root sign the Boundary Waters Treaty. On the International Joint Commission Canada will have three seats and the United States three, and nothing moves on the Niagara, the St. Mary or the Milk without both. It is signed by a British ambassador, and it is the first equal bargain Canada has struck with its neighbour."
 can_dnc_a.46.a: "Three votes to three."
 can_dnc_a.47.t: "The Senate Holds the Treaty"
 can_dnc_a.47.d: "Root is willing and the Senate is not, yet. The Chicago sanitary district has friends who want the Great Lakes to run downhill toward Illinois, and they ask for hearings. Bryce is told to wait a season; Gibbons goes back to London, Ontario, and waits with him."
 can_dnc_a.47.a: "The Senate will come round."
 can_dnc_a.48.t: "Two Machines for the Militia"
 can_dnc_a.48.d: "Petawawa, August 1909. The Silver Dart has flown four times for the officers of the militia and broken its undercarriage on the sand. McCurdy and Baldwin, of the Canadian Aerodrome Company at Baddeck, offer to sell the Department two machines and teach two officers to fly them. The Master General of the Ordnance sees no military use in the thing."
 can_dnc_a.48.a: "Buy two machines from McCurdy and Baldwin."
 can_dnc_a.48.b: "The militia sees no use for it."
 can_dnc_a.49.t: "Two Readings of One Resolution"
 can_dnc_a.49.d: "29 March 1909. George Eulas Foster's resolution, amended with the government's consent, passes the House without a division: Canada should organise a naval service of her own rather than contribute money to the Admiralty. The Toronto News reads it as Canada's answer to the German menace. Le Canada reads it as Canada's refusal to pay for Britain's. Both are printed the same morning."
 can_dnc_a.49.a: "Read it as Ontario does: a fleet for the Empire."
 can_dnc_a.49.b: "Read it as Quebec does: a fleet, and no cheque."
 can_dnc_a.49.c: "Let each member keep his reading."
 can_dnc_a.50.t: "The Admiralty Proposes Fleet Units"
 can_dnc_a.50.d: "Imperial Defence Conference, London, July 1909. Fisher's Admiralty offers the Dominions fleet units: a battle cruiser, three light cruisers, six destroyers and submarines, built to Admiralty designs and manned toward Admiralty standards. New Zealand has already offered a battle cruiser outright. Australia will build a unit. Brodeur and Borden say Canada wants a navy of its own, and ask what the Admiralty can spare to start it."
 can_dnc_a.50.a: "A fleet unit for Canada, as for Australia."
 can_dnc_a.50.b: "A dreadnought would serve better."
 can_dnc_a.51.t: "A Fleet Unit for Canada"
 can_dnc_a.51.d: "The Admiralty agrees that Canada, like Australia, may build toward a fleet unit of its own on the two coasts, and offers two cruisers to train the men in the meantime: the Niobe, an old Diadem, and the Rainbow, an old Apollo. Brodeur accepts both. They will be commissioned in 1910, and the Naval Service Bill will follow them."
 can_dnc_a.51.a: "Niobe and Rainbow, for the new navy."
 can_dnc_a.51.tt: "HMS Niobe and HMS Rainbow are promised to the Canadian naval service."
 can_dnc_a.52.t: "A Dreadnought Would Serve Better"
 can_dnc_a.52.d: "McKenna tells Brodeur, kindly, that a Canadian cruiser squadron would be of little use in the North Sea, and that a dreadnought paid for by Canada and stationed with the Home Fleet would be of a great deal. New Zealand has done it. Canada may build its own navy on its own yards, and the Admiralty will still sell it two old cruisers to learn on; or Canada may promise a ship for 1910 and be thanked in the Commons."
 can_dnc_a.52.a: "A Canadian navy, on Canadian yards."
 can_dnc_a.52.b: "Promise a ship to the Admiralty."
 can_dnc_a.52.tt: "A ship is promised to the Admiralty; Quebec will hear of it."
 can_dnc_a.53.t: "Ottawa Sends Neither Ships Nor Cheque"
 can_dnc_a.53.d: "The Canadian delegation has left the Imperial Defence Conference without promising a ship, a squadron or a shilling. Sir Wilfrid Laurier has let the naval resolution die on the order paper, and Mr. Monk of Jacques-Cartier says the electors will be asked before anyone is. Fisher observes that the North America and West Indies squadron was withdrawn from Halifax in 1905, and that nobody has asked what defends the coast."
 can_dnc_a.53.a: "Disappointment, nothing more."
 can_dnc_a.53.b: "The North America squadron will not be replaced."
 can_dnc_a.54.t: "Disappointment, Nothing More"
 can_dnc_a.54.d: "The Admiralty regrets the Canadian decision in one paragraph and moves on to Australia's in three. Ottawa is neither punished nor persuaded. The Toronto papers print the paragraph in full, and the Montreal papers print the fact that it was only a paragraph."
 can_dnc_a.54.a: "We shall be asked again."
 can_dnc_a.55.t: "The North America Squadron Will Not Be Replaced"
 can_dnc_a.55.d: "The Admiralty informs the Governor General that the cruisers withdrawn from Halifax and Esquimalt in 1905 will not be replaced, and that the defence of the Canadian coasts is a matter for the Canadian government, whenever it should decide to have one. Halifax has a dockyard, a fort and no ships. Esquimalt has less."
 can_dnc_a.55.a: "Two coasts and nothing on them."
 can_dnc_a.56.t: "The Sheriff Asks for Troops"
 can_dnc_a.56.d: "Glace Bay, July 1909. The men of District 26 are out against the Dominion Coal Company, which will not recognise the United Mine Workers, and thousands of them have marched from Glace Bay to Dominion behind a band. The sheriff of Cape Breton County has requisitioned troops in aid of the civil power, as the Militia Act allows him to. The company has asked for them by name. Sir Frederick Borden has a week before the march reaches the pithead."
 can_dnc_a.56.a: "Send the militia in aid of the civil power."
 can_dnc_a.56.b: "Refuse, and refer the parties to a Lemieux board."
 can_dnc_a.56.c: "Tell the sheriff to hold his hand a week."
 can_dnc_a.57.t: "The March Reaches Dominion"
 can_dnc_a.57.d: "The week is up. The march has reached the Dominion pithead and the company police have fired over the men's heads. The sheriff has renewed his requisition, the company has telegraphed every Nova Scotia member, and the Halifax papers want to know why the Militia Department was waiting."
 can_dnc_a.57.a: "The troops go tonight."
 can_dnc_a.57.b: "The company will have to talk."
 can_dnc_a.58.t: "The Marquis Wheat Goes Out"
 can_dnc_a.58.d: "Ottawa, spring 1909. Charles Saunders of the Central Experimental Farm sends out the seed of his Marquis wheat, a cross of Red Fife and Hard Red Calcutta that has ripened at Indian Head a week ahead of anything else on the Prairies. A week is the difference between a crop and a frost from Brandon to Edmonton."
 can_dnc_a.58.a: "A week ahead of the frost."
 can_dnc_a.59.t: "The Governor General's Cup"
 can_dnc_a.59.d: "Toronto, 4 December 1909. Earl Grey has given a cup for the amateur football championship of Canada, and the University of Toronto has beaten Toronto Parkdale for it, 26 to 6, on a frozen field at Rosedale. The representative of the King has invented something Canadian, and it will outlast the office that invented it."
 can_dnc_a.59.a: "Twenty-six to six."
 can_dnc_a.60.t: "Otter Takes the General Staff"
 can_dnc_a.60.d: "Ottawa, 1908. Sir William Otter, who commanded the Royal Canadians at Paardeberg, is to be Chief of the General Staff, the first officer born in Canada to hold the post. The Militia Council has the appointment before it. The alternative is one more imperial officer on loan from the War Office, which would please London and cost nothing."
 can_dnc_a.60.a: "Otter, of Paardeberg."
 can_dnc_a.60.b: "An imperial officer for one more term."
 can_dnc_a.61.t: "Submit, or Pass It Again"
 can_dnc_a.61.d: "The Colonial Office has struck down British Columbia's exclusion act. Victoria wants to pass it again next session, as it has passed it before, and Ottawa must decide whether to let it and answer London a second time. Bow, and the coast is quiet in the way it was before 7 September; defy, and Vancouver cheers while Elgin drafts another despatch."
 can_dnc_a.61.a: "Submit to the disallowance."
 can_dnc_a.61.b: "Victoria passes it again next session."
#Focuses
 CANDNC_b_one_flag_one_fleet_one_throne: "One Flag, One Fleet, One Throne"
 CANDNC_b_one_flag_one_fleet_one_throne_desc: "We answer the nationalists with the imperialists' own creed: one flag, one fleet, one throne. Strathcona's Horse sails for the war, and the Dominion offers itself as the reservoir the Empire has always wanted. Canada's greatness will be found inside the Empire, not apart from it."
 CANDNC_b_the_coronation_conference_three_yeses: "Three Yeses at the Coronation"
 CANDNC_b_the_coronation_conference_three_yeses_desc: "Where the others haggle, we say yes — to a standing council, to a defence contribution, to an imperial customs union, all three. Let the Colonial Office see that one Dominion at least means to build the Empire rather than merely belong to it."
 CANDNC_b_a_seat_on_the_imperial_council: "A Seat on the Imperial Council"
 CANDNC_b_a_seat_on_the_imperial_council_desc: "The council is no longer a courtesy kept warm by a High Commissioner. We send a minister of the Crown to sit at it with a vote in his hand. Canada will help decide imperial policy from now on, not merely receive it by cable."
 CANDNC_b_the_defence_contribution: "The Defence Contribution"
 CANDNC_b_the_defence_contribution_desc: "The Admiralty has named the price of the imperial shield: a yearly sum, or Canadian crews for imperial hulls. We will pay it before the estimates reach the House. The Dominion's safety is worth a line in the budget — and worth the Empire's gratitude."
 CANDNC_b_the_imperial_zollverein: "The Imperial Zollverein"
 CANDNC_b_the_imperial_zollverein_desc: "One tariff wall around the whole Empire: Regina's wheat enters Liverpool free, Manchester's cottons enter Montreal free. Ontario's manufacturers read the schedule twice and swallow hard. We trade the home market for the largest market on earth."
 CANDNC_b_the_imperial_council_sits: "The Imperial Council Sits"
 CANDNC_b_the_imperial_council_sits_desc: "Canada, Australia, New Zealand and the Cape take their chairs at a table that keeps a secretary and minutes. What such a council may decide is still an open question — and we mean to open it wide, until the Empire is governed by its Dominions and not merely for them."
 CANDNC_b_the_cheque_to_the_admiralty: "The Cheque to the Admiralty"
 CANDNC_b_the_cheque_to_the_admiralty_desc: "No Canadian yard, no Canadian flag — a plain cheque to the Admiralty, and the Royal Navy guards both our coasts. It is the cheapest safety a country ever bought. Quebec reads the total in the papers and asks what kind of Dominion pays another navy to defend it."
 CANDNC_b_ships_under_the_white_ensign: "Ships Under the White Ensign"
 CANDNC_b_ships_under_the_white_ensign_desc: "Not money but men: Canadian crews will take Admiralty hulls at Halifax, paid from Ottawa and commanded from London under the White Ensign. Our sailors serve the King's navy directly, and Canada earns its place in the line of battle without the cost of a fleet of its own."
 CANDNC_b_members_for_canada_at_westminster: "Members for Canada at Westminster"
 CANDNC_b_members_for_canada_at_westminster_desc: "If Canada is to pay the imperial estimates, then Canada will vote them — from seats of our own in the Commons at Westminster. Ireland watches from below the gangway, and so does every colony never asked. We reach for the boldest prize of all: a voice at the very centre of the Empire."
 CANDNC_b_chamberlain_goes_to_the_country: "Chamberlain Goes to the Country"
 CANDNC_b_chamberlain_goes_to_the_country_desc: "Chamberlain leaves the Cabinet to preach tariff reform to the British electors, and our Zollverein now rides on a vote no Canadian may cast. We have staked our tariff on another country's election. All we can do is wait, and hope Birmingham carries the day."
 CANDNC_b_the_squadron_stays_at_halifax: "The Squadron Stays at Halifax"
 CANDNC_b_the_squadron_stays_at_halifax_desc: "The imperial squadron was to sail for home; our money buys it back. Its coal, its dockyard and its guns stay at Halifax, and Ottawa pays the upkeep. We would sooner rent the Royal Navy than build our own, and keep the finest fleet afloat on our own station."
 CANDNC_b_the_ligue_nationaliste_marches: "The Ligue Nationaliste Marches"
 CANDNC_b_the_ligue_nationaliste_marches_desc: "Asselin's Ligue and Bourassa's speeches are filling the streets of Montreal against every imperial commitment we make. The nationalist tide is rising in Quebec, and we must decide whether to face it down, buy it off, or let it set the limit of how far into the Empire Canada may go."
 CANDNC_b_the_royal_naval_reserve_of_canada: "The Royal Naval Reserve of Canada"
 CANDNC_b_the_royal_naval_reserve_of_canada_desc: "The fishermen of Lunenburg and Gaspe are enrolled, drilled through the winter, and made liable to the Admiralty on the day of mobilisation. A naval reserve in a country with no navy — Canada's seamen pledged to the King's ships before we have laid a single keel of our own."
 CANDNC_b_the_empires_granary: "The Empire's Granary"
 CANDNC_b_the_empires_granary_desc: "With preference carried in Britain, the Prairies feed forty million imperial mouths. Elevators at Fort William, terminals at Saint John, every bushel sold behind one tariff wall. We make Canada the granary of the Empire, and tie the West's fortune to the imperial connection."
 CANDNC_b_the_free_traders_hold: "The Free Traders Hold"
 CANDNC_b_the_free_traders_hold_desc: "The British electors keep their cheap loaf and the Zollverein dies in Birmingham. Our preference to Britain stands, unanswered and unpaid, and Fielding must explain to Montreal why we gave and got nothing. The Empire, it seems, will take our loyalty but not our terms."
 CANDNC_b_buy_quebec_with_the_schools: "Buy Quebec With the Schools"
 CANDNC_b_buy_quebec_with_the_schools_desc: "We keep the separate schools written into the new provinces' charter, whatever it costs us in the West. Sifton resigns and Ontario grumbles, but Quebec is paid in the one coin it values. A Dominion held together needs French votes as much as English steel."
 CANDNC_b_the_orange_majority_governs: "The Orange Majority Governs"
 CANDNC_b_the_orange_majority_governs_desc: "We rewrite the schools clause, school the West in English, and let the Orange Lodges of Ontario carry the government. Bourassa leaves the party for good, and Quebec learns its place in an English Dominion. We have chosen one nation's loyalty over the other's, with our eyes open."
 CANDNC_b_the_furnaces_of_sydney: "The Furnaces of Sydney"
 CANDNC_b_the_furnaces_of_sydney_desc: "With imperial orders on the books, the furnaces at Sydney roll armour plate instead of rails. Cape Breton coal and Bell Island ore feed a war industry the Empire will need and pay for. We build the Dominion's steel on the strength of the King's contracts."
 CANDNC_b_wheat_for_liverpool_at_preference: "Wheat for Liverpool at Preference"
 CANDNC_b_wheat_for_liverpool_at_preference_desc: "Prairie grain moves by rail and lake and ocean into Liverpool at the preferential rate, and the Grain Growers pocket the difference. The imperial tariff pays the Western farmer directly. We bind the prairie to the Empire with the surest cord there is — a better price."
 CANDNC_b_hold_the_imperial_tariff_anyway: "Hold the Imperial Tariff Anyway"
 CANDNC_b_hold_the_imperial_tariff_anyway_desc: "Britain has refused the Zollverein, and we hold the imperial preference regardless. Goods from Buffalo and Detroit pay the general column, and the Grand Trunk's American traffic pays for the principle. We keep faith with the Empire even when the Empire will not keep faith with us."
 CANDNC_b_the_sixty_five_seats_guaranteed: "The Sixty-Five Seats Guaranteed"
 CANDNC_b_the_sixty_five_seats_guaranteed_desc: "Quebec's sixty-five seats are written into the imperial bargain, beyond the reach of any redistribution. Gouin carries the guarantee to the Assembly and calls it the price of the fleet. We buy French Canada's consent to Empire with a promise no English majority can ever undo."
 CANDNC_b_the_nationalist_press_sued: "The Nationalist Press Sued"
 CANDNC_b_the_nationalist_press_sued_desc: "We prosecute Asselin for libel and ask costs we know he cannot pay, and his paper comes out late and thin. Yet every issue sells out on rue Saint-Denis. Silencing the nationalist press only teaches Quebec to read it more closely — a lesson we may come to regret."
 CANDNC_b_the_naval_scare_of_1909: "The Naval Scare"
 CANDNC_b_the_naval_scare_of_1909_desc: "Westminster is warned that Germany is laying keels faster than the returns admit, and New Zealand offers a battlecruiser within the week. The Admiralty turns to Ottawa. Here is the Empire's hour of need — and Canada's chance to answer it before Australia does."
 CANDNC_b_sudbury_refines_at_home: "Sudbury Refines at Home"
 CANDNC_b_sudbury_refines_at_home_desc: "Our nickel matte crosses the border to be refined into an American war metal. An export duty stops it, and Sudbury refines it at home under imperial contract. The Empire's armour will be Canadian from the ore up, and the profit will stay on our side of the line."
 CANDNC_b_the_fleet_unit_under_the_white_ensign: "The Fleet Unit Under the White Ensign"
 CANDNC_b_the_fleet_unit_under_the_white_ensign_desc: "The Admiralty offers each Dominion a fleet unit — a cruiser, light cruisers, destroyers — and we ask for ours under the White Ensign. Canadian ships in the imperial line, flying the Royal Navy's flag: not a navy set apart from the Empire's, but a squadron woven into it."
 CANDNC_b_marquis_wheat_for_the_empire: "Marquis Wheat for the Empire"
 CANDNC_b_marquis_wheat_for_the_empire_desc: "Saunders's new Marquis wheat ripens a week sooner and pushes the grain frontier north into land that never grew a crop. Spread across the prairie, it makes the Empire's granary larger still. Science, quietly, is worth another province to the imperial larder."
 CANDNC_b_the_payne_aldrich_scare: "The Payne-Aldrich Scare"
 CANDNC_b_the_payne_aldrich_scare_desc: "The new American tariff threatens its maximum column against any country that favours another — and our imperial preference is exactly that. Washington has set a date. We must decide whether to bend to our neighbour's ultimatum or stand by the Empire and pay for it in trade."
 CANDNC_b_a_french_battalion_for_the_king: "A French Battalion for the King"
 CANDNC_b_a_french_battalion_for_the_king_desc: "We answer the meetings at the Monument-National not with a prosecution but with a regiment: the Voltigeurs de Quebec, drilled in French, officered by their own, and sworn to the King. French Canada shall serve the Empire in its own language, and be proud to."
 CANDNC_b_the_tercentenary_as_an_imperial_fete: "The Tercentenary as an Imperial Fete"
 CANDNC_b_the_tercentenary_as_an_imperial_fete_desc: "Champlain lands again below the Citadel with a British squadron in the basin and the Prince of Wales looking on. We turn three centuries of French Quebec into an imperial pageant, and the Plains of Abraham into a park of the Crown. The past is dressed in the Empire's colours."
 CANDNC_b_the_pacific_cable_and_marconi: "The Pacific Cable and Marconi"
 CANDNC_b_the_pacific_cable_and_marconi_desc: "The Pacific cable and the Marconi station at Glace Bay put two of the Empire's nerves in Canadian hands. We paid our share of the wire that girdles the world, and messages from London to Australia now pass through Ottawa's keeping. Communication, too, is a kind of power."
 CANDNC_b_a_dreadnought_for_the_king: "A Dreadnought for the King"
 CANDNC_b_a_dreadnought_for_the_king_desc: "The Admiralty has named its price and the House must vote it: a dreadnought laid on the Clyde, paid for out of Ottawa, named for the Dominion and manned as the Admiralty pleases. One great ship, given outright to the King's navy — the largest gift a colony ever made its mother."
 CANDNC_b_the_imperial_munitions_contracts: "The Imperial Munitions Contracts"
 CANDNC_b_the_imperial_munitions_contracts_desc: "The War Office places its orders in Canada — small arms at Quebec, shell at Montreal, cordite at Beloeil. The Ross rifle finds a buyer at last, and the Dominion learns what it costs to keep an arsenal. We arm the Empire, and arm ourselves in the doing of it."
 CANDNC_b_canadian_yards_for_imperial_hulls: "Canadian Yards for Imperial Hulls"
 CANDNC_b_canadian_yards_for_imperial_hulls_desc: "Vickers comes to Montreal and the Admiralty to Halifax; slips and cranes and a graving dock rise on the harbour. The first plates cut in Canada for a King's ship are cut here. We would build the Empire's hulls on our own water, and keep the skilled trades that come with them."
 CANDNC_b_a_british_west: "A British West"
 CANDNC_b_a_british_west_desc: "Oliver trades Sifton's numbers for blood: assisted passages from Liverpool and Glasgow, the agents withdrawn from the Continent. The West fills with Britons, and fills a great deal more slowly. We choose an imperial prairie over a crowded one, and pay for the choice in years."
 CANDNC_b_siftons_agents_keep_paying: "Sifton's Agents Keep Paying"
 CANDNC_b_siftons_agents_keep_paying_desc: "We keep paying the bonus for every farmer landed, and the ships come in from Hamburg and Antwerp full of Galicians, Ruthenians and Doukhobors. The West fills fast, whatever the Orange press makes of the names. A prairie broken and sown is worth more to us than a prairie kept pure."
 CANDNC_b_the_imperial_secretariat: "The Imperial Secretariat"
 CANDNC_b_the_imperial_secretariat_desc: "Deakin asks for a permanent imperial secretariat, and we second him. The Dominions gain a standing office at the centre of the Empire — and with it a share in every war the King declares. We buy our seat at the council knowing the seat comes with the sword."
 CANDNC_b_the_empire_settlement: "The Empire Settlement"
 CANDNC_b_the_empire_settlement_desc: "Assisted passages, free homestead land, and a bonus for every family out of the British Isles, with the imperial exchequer paying half the fare. Barr's colonists are the model. We people the West with Britons on London's money, and make the prairie an imperial creation."
 CANDNC_b_the_doukhobors_are_left_alone: "The Doukhobors Are Left Alone"
 CANDNC_b_the_doukhobors_are_left_alone_desc: "Verigin has his colonies in hand, and we let the villages hold their land in common and swear no oath. Some seven thousand souls stay on the Territories instead of walking west in protest. We bend the letter of the homestead law to keep the settlers we so badly need."
 CANDNC_b_the_admiraltys_guarantee: "The Admiralty's Guarantee"
 CANDNC_b_the_admiraltys_guarantee_desc: "We have paid the imperial bill, and Whitehall answers in kind: the defence of Canadian waters becomes an obligation in writing rather than a courtesy at pleasure. We asked for the paper, and the paper was not free — but a Dominion guarded by treaty sleeps easier than one guarded by goodwill."
 CANDNC_b_the_tenth_province: "The Tenth Province"
 CANDNC_b_the_tenth_province_desc: "Newfoundland has stood outside Confederation for two generations, its treasury still broken by an old bank crash. We ask Downing Street to name the terms on which the oldest colony would come in. The Empire that made us both can surely make us one, and give Canada its tenth province."
 CANDNC_b_esquimalt_manned_by_canadians: "Esquimalt Manned by Canadians"
 CANDNC_b_esquimalt_manned_by_canadians_desc: "The last imperial gunners leave Work Point, and Canadian garrison artillery takes the batteries above Esquimalt. The Pacific dockyard reopens and the guns face west, toward whatever is coming across that ocean. We man our own western gate — while still leaning on the Empire's fleet to hold the sea beyond it."
 CANDNC_b_the_terms_of_union_with_newfoundland: "The Terms of Union With Newfoundland"
 CANDNC_b_the_terms_of_union_with_newfoundland_desc: "The colony's railway debt, its fishery and its Labrador boundary all lie on the table at Downing Street. We assume the debt, St John's keeps its courts, and the Dominion gains its tenth province at last. A generous bargain — but a whole colony won by consent is cheap at the price."
 CANDNC_b_the_treasury_of_the_empire: "The Treasury of the Empire"
 CANDNC_b_the_treasury_of_the_empire_desc: "Canadian money pays for the Empire's ships, Canadian members sit at Westminster, and our tariff is written in London. Seven million people have bought themselves a seat at the imperial table. Whether we have joined the Empire or been absorbed by it is a question for a later century."
 CANDNC_b_the_empires_squadron: "The Empire's Squadron"
 CANDNC_b_the_empires_squadron_desc: "Halifax and Esquimalt are Canadian-manned, the yards are cutting plate, and a squadron under the White Ensign lies in the basin. The Dominion has built a fleet and does not command it. We have poured our strength into the Empire's line, and must trust the Empire to spend it well."
#Focus tooltips
 CANDNC_b_fracture_plus_one_tt: "The fracture between the two peoples deepens by one."
 CANDNC_b_fracture_plus_two_tt: "The fracture between the two peoples deepens by two."
 CANDNC_b_fracture_minus_one_tt: "The fracture between the two peoples closes by one."
 CANDNC_b_loyalist_plus_one_tt: "The loyalist anger of the Protestant West rises by one."
 CANDNC_b_london_will_answer_tt: "London answers the three yeses within forty-two days."
 CANDNC_b_cheque_or_ships_tt: "Ottawa must choose: a cheque to the Admiralty, or Canadian crews on the Empire's hulls."
 CANDNC_b_asks_for_powers_tt: "The advisory council asks Whitehall for powers, and London answers within thirty days."
 CANDNC_b_washington_berlin_answer_tt: "Washington and Berlin answer the imperial schedule within the month."
 CANDNC_b_admiralty_hulls_tt: "The Admiralty decides what it can spare for Canadian crews."
 CANDNC_b_westminster_answers_tt: "Westminster decides whether to seat Canadian members."
 CANDNC_b_country_votes_tt: "The British electors decide the Zollverein within a hundred days."
 CANDNC_b_schools_fork_tt: "The schools of the new provinces must be settled: guarantee them, or govern with the Orange majority."
 CANDNC_b_no_other_side_tt: "There is no imperial customs union left to belong to; the preference stands alone."
 CANDNC_b_admiralty_bill_tt: "The Admiralty will name its price for the largest Dominion."
 CANDNC_b_ninety_days_tt: "The House has ninety days to vote the Admiralty's figure. After that the offer lapses."
 CANDNC_b_fleet_unit_asked_tt: "The Admiralty decides what a Dominion fleet unit will contain."
 CANDNC_b_washington_answers_tt: "Washington decides whether the imperial rate is discrimination."
 CANDNC_b_west_fork_tt: "The West must be filled: with Britons alone, or with whoever the agents can find."
 CANDNC_b_into_the_faction_tt: "Canada enters the faction led by the United Kingdom."
 CANDNC_b_newfoundland_asked_tt: "Downing Street will name the terms for Newfoundland."
 CANDNC_b_terms_open_tt: "The terms of union stay open for sixty days."
 CANDNC_b_terms_dear_tt: "The terms stay open for sixty days, and the price is doubled."
 CANDNC_b_terms_lapse_tt: "The terms lapse. Newfoundland remains a colony of the Crown."
 CANDNC_b_end_treasury_tt: "Canada ends the era as the treasury of the Empire: a seat at the table, ships paid for, and its own tariff written in London."
 CANDNC_b_end_squadron_tt: "Canada ends the era as the arsenal of the Empire: yards, coasts and a squadron of its own, every one of them answering to the Admiralty."
 CANDNC_b_federation_yes_tt: "Canada accepts the Imperial Federation."
 CANDNC_b_federation_later_tt: "Canada leaves the Federation to the next Parliament."
#Research bonuses
 CANDNC_b_fleet_unit_bonus: "Admiralty Fleet Unit"
 CANDNC_b_wireless_bonus: "Glace Bay and Bamfield"
 CANDNC_b_admiralty_drawings: "Admiralty Drawings"
#Ideas
 CAN_b_the_kings_reservoir: "The King's Reservoir"
 CAN_b_the_kings_reservoir_desc: "The Dominion undertakes to find men for the Empire's wars as a matter of course. Ontario enlists gladly, the Militia Department gets a standing establishment, and nobody in Quebec was asked."
 CAN_b_the_imperial_council: "The Imperial Council"
 CAN_b_the_imperial_council_desc: "A standing council in Whitehall with a secretary, minutes and resolutions that must be answered. Canada is heard on imperial policy for the first time, and can now be outvoted on it."
 CAN_b_an_advisory_council: "An Advisory Council"
 CAN_b_an_advisory_council_desc: "It is consulted and it does not decide. Ottawa has bought a chair in a room where nothing is settled, and pays a contribution voted by a Parliament it does not sit in."
 CAN_b_the_imperial_zollverein: "The Imperial Zollverein"
 CAN_b_the_imperial_zollverein_desc: "One tariff wall from Liverpool to Vancouver. Canadian wheat and lumber move free inside it, and the goods a farmer buys cost more because Chicago and Hamburg are on the far side."
 CAN_b_seats_at_westminster: "Seats at Westminster"
 CAN_b_seats_at_westminster_desc: "Canadian members vote the imperial estimates in the Commons where they are laid. The Dominion has a hand on the Empire's business, and has admitted that the Empire has a hand on its own."
 CAN_b_the_naval_subsidy: "The Naval Subsidy"
 CAN_b_the_naval_subsidy_desc: "A yearly sum to the Admiralty, and the Royal Navy holds both Canadian coasts. It is the cheapest defence in the world and it buys not one Canadian yard, hull, or officer."
 CAN_b_the_royal_naval_reserve: "The Royal Naval Reserve of Canada"
 CAN_b_the_royal_naval_reserve_desc: "Fishermen out of Lunenburg and Gaspe, drilled in winter and paid a retainer, liable to the Admiralty when it calls. The Maritimes gain a trade and the militia loses the same men."
 CAN_b_the_nationalist_press: "The Nationalist Press"
 CAN_b_the_nationalist_press_desc: "Le Nationaliste prints the imperial estimates in full every week, with the Quebec share worked out at the bottom of the column. Bourassa fills halls that no government speaker can fill."
 CAN_b_the_protestant_west_protests: "The Protestant West Protests"
 CAN_b_the_protestant_west_protests_desc: "Separate schools are guaranteed in Alberta and Saskatchewan and the Orange Lodges take it as a defeat inflicted from Quebec. The French battalions fill; the Liberal caucus does not."
 CAN_b_a_province_governed_against_itself: "A Province Governed Against Itself"
 CAN_b_a_province_governed_against_itself_desc: "The English majority carries the schools, the tariff and the fleet over Quebec's sixty-five members. The government is strong, and a third of the country has stopped believing the House is its own."
 CAN_b_wheat_at_preference: "Wheat at Preference"
 CAN_b_wheat_at_preference_desc: "Prairie grain enters Liverpool free and the elevators, the lake boats and the terminals are built to carry it. The West is rich, and tied to one market and one freight rate."
 CAN_b_the_preference_kept_alone: "The Preference Kept Alone"
 CAN_b_the_preference_kept_alone_desc: "Britain gives nothing back and Canada keeps the preference anyway. The goodwill is real, the return is nil, and Fielding explains the arithmetic to the Montreal Board of Trade twice a year."
 CAN_b_the_tariff_war: "The Tariff War"
 CAN_b_the_tariff_war_desc: "The maximum column falls on Canadian lumber, fish and print paper, and Ottawa answers in kind. The mills work behind the wall, and everything a Canadian buys arrives dearer."
 CAN_b_the_nickel_of_the_empire: "The Nickel of the Empire"
 CAN_b_the_nickel_of_the_empire_desc: "The matte of Sudbury is refined at Sudbury and the metal is spoken for in London before it leaves the smelter. International Nickel's New Jersey works, and Washington, take the point."
 CAN_b_the_dreadnought_bill: "The Dreadnought Bill"
 CAN_b_the_dreadnought_bill_desc: "The whole cost of a capital ship falls on a revenue of eighty millions in a single set of estimates. Officers get their sea training, and every other vote in the budget is cut to pay for it."
 CAN_b_the_dreadnought_canada: "HMS Canada"
 CAN_b_the_dreadnought_canada_desc: "A ship of the newest design, paid for out of Ottawa, named for the Dominion and stationed wherever the Admiralty wants her. The country is proud of a vessel it may never see."
 CAN_b_the_last_best_west_for_britons: "The Last Best West for Britons"
 CAN_b_the_last_best_west_for_britons_desc: "Assisted passages out of Liverpool and Glasgow, and the agents in Galicia paid off. The prairie towns are loyal to the last man, and there are fewer men on the prairie every year than there might be."
 CAN_b_the_agents_keep_paying: "The Agents Keep Paying"
 CAN_b_the_agents_keep_paying_desc: "A bonus for every farmer landed at Quebec, whatever language he speaks. The homesteads fill faster than the schools, the churches or the police can follow them."
 CAN_b_in_every_war_of_the_king: "In Every War of the King"
 CAN_b_in_every_war_of_the_king_desc: "The secretariat settled it: when the King is at war, Canada is at war, and the House is informed rather than asked. The army is never short of a reason, and the country is never asked for one."
 CAN_b_newfoundlands_debt: "Newfoundland's Debt"
 CAN_b_newfoundlands_debt_desc: "The railway bonds of the oldest colony pass to the Canadian Treasury with the iron of Bell Island. The ore is worth having; the annual charge is felt in every estimate for years."
 CAN_b_the_treasury_of_the_empire: "The Treasury of the Empire"
 CAN_b_the_treasury_of_the_empire_desc: "Canadian revenue pays for the line of battle and Canadian credit is imperial credit. London answers Ottawa's despatches by return, and Ottawa no longer decides what is in them."
 CAN_b_the_empires_squadron: "The Empire's Squadron"
 CAN_b_the_empires_squadron_desc: "Yards at Halifax and Montreal, batteries on two coasts, and a squadron under the White Ensign manned by Canadians. On the day of a war it belongs to the Admiralty, and everyone aboard knows it."
#Events
 can_dnc_b.1.t: "Canada Says Yes Three Times"
 can_dnc_b.1.d: "Sir Wilfrid Laurier has answered the three questions in the affirmative: a permanent imperial council, a standing contribution to defence, and a customs union of the Empire. No Dominion has ever said yes to all three, and the Colonial Secretary has forty-two days before the conference rises. Mr Balfour and the Treasury would rather no answer were given at all."
 can_dnc_b.1.a: "Take all three. The Empire will not be offered them twice."
 can_dnc_b.1.b: "Council and defence now. The tariff must wait for the electors."
 can_dnc_b.1.c: "Thank Sir Wilfrid, and promise nothing in writing."
 can_dnc_b.2.t: "The Whole Programme"
 can_dnc_b.2.d: "The despatch reaches Ottawa in September 1902. Chamberlain accepts the Canadian offer entire: a standing council with Canadian members, a naval contribution to be settled with the Admiralty, and a schedule of imperial preference to be laid before both Parliaments. Laurier reads it to the Cabinet, and Fielding begins rewriting the tariff that afternoon."
 can_dnc_b.2.a: "Then we build it."
 can_dnc_b.3.t: "The Tariff Must Wait for the Electors"
 can_dnc_b.3.d: "Chamberlain will have the council and the contribution, but the Zollverein must be carried in Britain before it can be written into any schedule. The cheap loaf is still the strongest argument in an English constituency, and the Colonial Secretary knows it better than anyone alive. Ottawa gets two of the three, and a promise on the third."
 can_dnc_b.3.a: "Two now, and Birmingham for the third."
 can_dnc_b.4.t: "Mr Balfour Prefers Nothing in Writing"
 can_dnc_b.4.d: "The Prime Minister thanks Sir Wilfrid Laurier for his loyalty and declines to bind the Imperial Government to a council with powers. There will be a standing committee that may be consulted, and that is the whole of it. Chamberlain accepts the decision of the Cabinet in public and is heard on the matter in the corridor."
 can_dnc_b.4.a: "An advisory body, then. We shall make it more."
 can_dnc_b.5.t: "The Advisory Council Asks for Powers"
 can_dnc_b.5.d: "The council has met four times in Whitehall and resolved nothing that binds anybody. The Canadian member asks that its resolutions on defence and trade be laid before Parliament and answered there. Grant it, and the Dominions have a hand on imperial policy. Refuse, and the room is a debating society with good carpets."
 can_dnc_b.5.a: "Give it powers. Better a council that binds than a Dominion that drifts."
 can_dnc_b.5.b: "It advises. That was the whole of the bargain."
 can_dnc_b.6.t: "The Council Is Made Real"
 can_dnc_b.6.d: "An Order in Council gives the Imperial Council a secretary, a permanent staff and the right to have its resolutions answered at Westminster. Canada's member sits with Australia, New Zealand and the Cape, and for the first time the Dominions may be outvoted on something that matters to them."
 can_dnc_b.6.a: "A vote is worth what it can lose."
 can_dnc_b.7.t: "Advisory It Stays"
 can_dnc_b.7.d: "Whitehall answers that the council will be consulted and will not decide. Ottawa has paid a contribution and taken a chair in a room where nothing is settled, and Le Nationaliste has the whole of the arithmetic on its front page within the week."
 can_dnc_b.7.a: "We have bought a chair and no table."
 can_dnc_b.8.t: "An Imperial Wall on the Forty-Ninth Parallel"
 can_dnc_b.8.d: "Ottawa has entered a customs union of the British Empire. American manufactures crossing at Windsor and Niagara pay the general column while Manchester goods enter free, and half the Canadian trade of the United States now stands on the wrong side of a tariff wall built in London. Secretary Root has the returns on his desk."
 can_dnc_b.8.a: "Answer the wall with a wall."
 can_dnc_b.8.b: "Wait. Canada will find out what a preference costs."
 can_dnc_b.8.c: "Then close the inshore fishery and the lumber schedule."
 can_dnc_b.9.t: "Ninety Days From Washington"
 can_dnc_b.9.d: "A note from the State Department gives Ottawa ninety days to exempt American goods from the imperial schedule. If the schedule stands, the maximum rates of the United States tariff fall on Canadian wheat, lumber and fish, and the men who ship south will hear of it long before the men who ship east."
 can_dnc_b.9.a: "The schedule stands. Let them apply the maximum."
 can_dnc_b.9.b: "Take Canada out of the Zollverein."
 can_dnc_b.10.t: "Mr Root Counsels Patience"
 can_dnc_b.10.d: "Elihu Root tells the press that the United States has no quarrel with a British tariff and every confidence in Canadian farmers, who will discover soon enough what a preference on wheat is worth against a market four hundred miles away. No retaliation is ordered, and the Boston fish dealers are told to be quiet."
 can_dnc_b.10.a: "Patience is cheaper than a tariff war."
 can_dnc_b.11.t: "The Fishery and the Lumber Schedule"
 can_dnc_b.11.d: "Washington answers narrowly: the inshore fishery is closed to Canadian vessels and rough lumber loses its rate. New Brunswick and Nova Scotia carry the whole of the American answer while Ontario carries none of it, and the Maritime members say so in the House at length."
 can_dnc_b.11.a: "The Maritimes pay for Birmingham."
 can_dnc_b.12.t: "Berlin Reads the Canadian Schedule"
 can_dnc_b.12.d: "Since 1898 Germany has answered the Canadian preference to Britain with its general tariff. Now Ottawa has gone into an imperial customs union outright. Berlin must decide whether to punish a Dominion of seven million people or to keep a supply of wheat that does not have to sail through the Baltic."
 can_dnc_b.12.a: "The general tariff, and no exceptions for a British colony."
 can_dnc_b.12.b: "An intermediate rate. Wheat matters more than a point of doctrine."
 can_dnc_b.13.t: "The General Tariff on Canadian Goods"
 can_dnc_b.13.d: "German customs apply the full general rate to Canadian flour, cheese and implements. Montreal's exporters lose a market they had rebuilt since 1898, and the Board of Trade asks Ottawa what the Empire proposes to do about it. Whitehall replies that the matter is under consideration."
 can_dnc_b.13.a: "Under consideration, in Whitehall."
 can_dnc_b.14.t: "An Intermediate Rate From Berlin"
 can_dnc_b.14.d: "Berlin quietly extends its conventional rate to Canadian grain while refusing it to Canadian manufactures. The wheat of the Prairies goes to Hamburg and the implement works of Brantford stay shut out, and the Germans have split the country's exporters with one line of a schedule."
 can_dnc_b.14.a: "They have bought our wheat and divided our trade."
 can_dnc_b.15.t: "Tariff Reform Goes to the Country"
 can_dnc_b.15.d: "Chamberlain has left the Cabinet and taken imperial preference to the constituencies. Birmingham is his and Lancashire is not. A hundred days of meetings, and at the end of them the British electors decide whether the wheat of Saskatchewan enters Liverpool free, and whether Canada's yes of 1902 bought anything at all."
 can_dnc_b.15.a: "Fight it on the Empire. A loaf of bread will not decide one."
 can_dnc_b.15.b: "The cheap loaf will beat us. Do not stake the government on it."
 can_dnc_b.16.t: "Tariff Reform Carries"
 can_dnc_b.16.d: "The electors return a majority for preference and the imperial schedule becomes law at Westminster. Canadian wheat, cheese and lumber enter Britain free of duty behind a wall raised against the American and the German article. In Winnipeg the grain exchange opens on the news and does not close until evening."
 can_dnc_b.16.a: "The Empire trades inside one wall."
 can_dnc_b.17.t: "The Free Traders Hold"
 can_dnc_b.17.d: "The cheap loaf carries England and the Zollverein dies in Birmingham with its author. Canada has given the preference, taken the seat and paid the contribution, and receives in exchange a resolution of thanks. Fielding must explain to the Montreal Board of Trade what exactly the country bought."
 can_dnc_b.17.a: "We paid in full for two thirds of a bargain."
 can_dnc_b.18.t: "What the Admiralty Wants From Canada"
 can_dnc_b.18.d: "The estimates laid before the Commons in March 1909 show Germany laying keels faster than the returns of 1906 allowed for. New Zealand has already offered a battle cruiser and Australia is building a navy of its own. The Admiralty must now name a figure for the largest Dominion, which has undertaken to pay whatever figure is named."
 can_dnc_b.18.a: "One ship, as New Zealand has given."
 can_dnc_b.18.b: "Two. Canada is not New Zealand."
 can_dnc_b.18.c: "Money, and we shall build where the slips are free."
 can_dnc_b.19.t: "One Ship, as New Zealand Has Given"
 can_dnc_b.19.d: "The Admiralty asks Canada for a single capital ship of the newest design, laid down in a British yard, paid for out of Ottawa and maintained thereafter on the Canadian estimates. The letter reaches the Marine Department in the first week of April. Ninety days are given for the House to vote it."
 can_dnc_b.19.a: "Ninety days to find the money."
 can_dnc_b.20.t: "Two, and the Dominion Will Be Noticed"
 can_dnc_b.20.d: "Whitehall asks Canada for two ships of the Dreadnought type, arguing that seven million people and a revenue of eighty millions can carry what a colony of a million cannot. Frederick Borden sets the figure beside the whole militia estimate and finds it the larger of the two. Ninety days."
 can_dnc_b.20.a: "Ninety days, and a bill no Canadian Parliament has ever voted."
 can_dnc_b.21.t: "Money, Not a Keel"
 can_dnc_b.21.d: "Rather than a named ship the Admiralty will take an annual sum toward a fleet unit for North American waters, built where the slips are free and manned where the men can be found. It is the cheaper answer and the one that buys the least glory. Ninety days to vote it."
 can_dnc_b.21.a: "Ninety days, and no ship to show for it."
 can_dnc_b.22.t: "The Ninety Days Are Gone"
 can_dnc_b.22.d: "The estimates were never brought in and the session has ended. Whitehall is told that the Canadian contribution has not been voted, and the Admiralty's memorandum on the defence of the North Atlantic is redrafted without a Canadian ship anywhere in it. Ontario reads the despatch in the morning papers."
 can_dnc_b.22.a: "We asked for the bill and then would not pay it."
 can_dnc_b.23.t: "Ottawa Will Man Ships of the Empire"
 can_dnc_b.23.d: "Canada has chosen crews over cash: Canadian seamen aboard Admiralty hulls at Halifax, flying the White Ensign, paid out of Ottawa and under the orders of the Commander-in-Chief on the North America and West Indies station. The Admiralty must decide what to give a Dominion that has asked for ships instead of money."
 can_dnc_b.23.a: "Send two cruisers to Halifax and let them learn on those."
 can_dnc_b.23.b: "Let the estimates pass first. Drawings before hulls."
 can_dnc_b.24.t: "Two Cruisers at Halifax"
 can_dnc_b.24.d: "The Proserpine and the Dido come up the harbour in the autumn and are handed over at the dockyard with their guns and their books. Canadian ratings out of Lunenburg and Saint John go aboard with British petty officers over them, and the Halifax papers print the ships' companies by name."
 can_dnc_b.24.a: "Two hulls and a school."
 can_dnc_b.25.t: "Drawings Before Hulls"
 can_dnc_b.25.d: "Whitehall sends the Marine Department a case of Admiralty drawings, gunnery manuals and dockyard specifications, and no ships at all. Brodeur's officers now know exactly how a King's cruiser is built and kept, and have nothing whatever to practise on until the House votes the money."
 can_dnc_b.25.a: "We have the plans of a navy we do not own."
 can_dnc_b.26.t: "A Fleet Unit for the Dominion"
 can_dnc_b.26.d: "The Imperial Defence Conference of July 1909 has offered the Dominions fleet units: an armoured cruiser, three light cruisers and six destroyers, manned locally and passing to the Admiralty on the outbreak of war. Canada has asked for one and will fly the White Ensign over it. The question is whether the ships can be spared."
 can_dnc_b.26.a: "Give them the whole unit. A squadron that comes to us in war is cheap."
 can_dnc_b.26.b: "Two cruisers now. The rest when the yards catch up."
 can_dnc_b.27.t: "The Fleet Unit Arrives"
 can_dnc_b.27.d: "The Good Hope leads three light cruisers and six destroyers into Halifax. On the outbreak of any war of the King they pass under the Admiralty without a vote of the Canadian Parliament, and every officer on the dockyard knows the clause by heart. Ontario cheers the squadron; Quebec reads the clause."
 can_dnc_b.27.a: "A squadron, and a clause with it."
 can_dnc_b.28.t: "Two Cruisers Only"
 can_dnc_b.28.d: "The Topaze and the Hermes are all the Admiralty can spare with the North Sea to cover. They come out to Halifax with reduced complements to be filled from Canadian reserves. It is a squadron on paper and a training flotilla in fact, and Brodeur says so to the House."
 can_dnc_b.28.a: "We shall fill them ourselves."
 can_dnc_b.29.t: "A Dominion Lays a Keel"
 can_dnc_b.29.d: "A country of seven million people on the far side of the Atlantic has voted a capital ship into the British line of battle. The Naval Office calculates what the self-governing Dominions could add to the Royal Navy if the practice spread, and finds the figure disagreeable. The question is whether to answer it or ignore it."
 can_dnc_b.29.a: "Colonial theatre. Note it and say nothing."
 can_dnc_b.29.b: "Then we lay one more, and let the Reichstag hear why."
 can_dnc_b.30.t: "One More Keel at Kiel"
 can_dnc_b.30.d: "The German supplementary estimate goes to the Reichstag with the Canadian vote quoted in the explanatory memorandum. Ottawa's ship has been answered by name from Berlin, and the Toronto papers reprint the German document with satisfaction. The Dominion has been noticed by an enemy for the first time in its life."
 can_dnc_b.30.a: "We are in the reckoning now."
 can_dnc_b.31.t: "A Dreadnought Named Canada"
 can_dnc_b.31.d: "The ship is laid down in a British yard and named for the Dominion that paid for her. She will fly the White Ensign, carry a British admiral's flag if she is ordered to, and may never enter a Canadian port under Canadian orders at all. In Toronto the news is a coronation; in Quebec it is a receipt."
 can_dnc_b.31.a: "Paid for out of Ottawa, commanded from Whitehall."
 can_dnc_b.31.b: "The Dominions are paying for the line of battle."
 can_dnc_b.31.c: "The Empire is buying its ships with colonial money."
 can_dnc_b.32.t: "Ottawa Asks for Newfoundland"
 can_dnc_b.32.d: "The oldest colony has refused Confederation since 1869 and has not balanced a budget since the bank crash of 1894. Ottawa, which now pays for the Empire's ships, asks Downing Street to name the terms on which St John's might come in as a tenth province. Whitehall must weigh a solvent Dominion against a loyal colony."
 can_dnc_b.32.a: "Name the terms. Let Ottawa carry the railway debt."
 can_dnc_b.32.b: "Newfoundland is a colony of the Crown and will remain one."
 can_dnc_b.32.c: "Name the terms, and double them."
 can_dnc_b.33.t: "The Terms From Downing Street"
 can_dnc_b.33.d: "The colony's railway debt, its customs revenue, its fishery and the Labrador boundary are set out in a schedule of eleven clauses. Ottawa assumes the debt and the annual charge; St John's keeps its courts, its schools and its Legislature. Sixty days are allowed for an answer."
 can_dnc_b.33.a: "Put the terms before the House."
 can_dnc_b.33.b: "Let them lapse. The price is a navy's worth."
 can_dnc_b.34.t: "The Colony Stays a Colony"
 can_dnc_b.34.d: "Whitehall answers that Newfoundland's own Legislature has not asked to enter Confederation and that the Imperial Government will not press it. The colony's premier is thanked for his loyalty in the same despatch. Ottawa asked for a province and has been given a lecture on the rights of a self-governing colony."
 can_dnc_b.34.a: "We asked too early and were told so."
 can_dnc_b.35.t: "The Terms, Doubled"
 can_dnc_b.35.d: "Downing Street names a price on the assumption that Canada can pay it: the whole railway debt, a permanent subsidy, the Labrador award left open, and compensation to the colony's creditors in London. It is Confederation on the terms of a bondholder. Sixty days."
 can_dnc_b.35.a: "Pay it. A province is worth a bad bargain."
 can_dnc_b.35.b: "Not at that figure. Let the terms lapse."
 can_dnc_b.36.t: "The Maximum and the Minimum"
 can_dnc_b.36.d: "The tariff act of 1909 gives the President a maximum column, twenty-five per cent above the general rate, to be applied to any country that discriminates against American goods. Canada's imperial schedule is discrimination by the plain words of the act, and the President must decide whether to say so out loud."
 can_dnc_b.36.a: "Apply the maximum. The law leaves no discretion."
 can_dnc_b.36.b: "Find that the imperial rate is not discrimination, and be done with it."
 can_dnc_b.37.t: "The Maximum Applied"
 can_dnc_b.37.d: "The proclamation is signed and the maximum column falls on Canadian lumber, fish, print paper and hay. The mills of the Ottawa valley and the sawn lumber of British Columbia lose their market in a fortnight, and the boards of trade of both provinces send delegations to Ottawa in the same week."
 can_dnc_b.37.a: "We knew the price and voted for it."
 can_dnc_b.38.t: "Washington Finds No Discrimination"
 can_dnc_b.38.d: "Fielding goes to Washington and comes back with a form of words: the imperial rate is a preference and not a penalty, and the minimum column stands. It is signed in the spring by a President with no wish to fight a tariff war along the Canadian border in an election year."
 can_dnc_b.38.a: "A form of words is worth a fleet."
 can_dnc_b.39.t: "Sifton Resigns"
 can_dnc_b.39.d: "Clifford Sifton leaves the Interior on 27 February 1905 rather than defend a clause guaranteeing separate schools in Alberta and Saskatchewan. He takes with him the immigration machine he built, the confidence of the Protestant West, and a following in the Liberal caucus that Laurier will not get back."
 can_dnc_b.39.a: "The West has lost its minister."
 can_dnc_b.40.t: "The King Is at War"
 can_dnc_b.40.d: "The Empire is at war with a great power, and by the arrangement of 1907 Canada is at war with it as a matter of course and not of choice. There is no debate to be had in the House and every member in it knows so. The only questions left are what Ottawa sends, and how loudly Quebec is told about it."
 can_dnc_b.40.a: "Raise a contingent. The Royal Canadians sail as they did for the Transvaal."
 can_dnc_b.40.b: "Pay the contribution, and send no men this time."
 can_dnc_b.41.t: "The Federation Proclaimed"
 can_dnc_b.41.d: "The arrangement built since the coronation is to be given a name and a constitution: a federal Parliament of the Empire, with Canadian members, Canadian revenues and Canadian ships inside it. Nothing Ottawa has done since 1902 makes sense outside it, and nothing done afterwards can be undone."
 can_dnc_b.41.a: "Canada goes in, with everything it has built."
 can_dnc_b.41.b: "Not yet. Let the next Parliament settle it."
 can_dnc_b.42.t: "Newfoundland Enters Confederation"
 can_dnc_b.42.d: "The terms of union are proclaimed and the oldest colony becomes the tenth province. The railway debt passes to Ottawa, the fishery and the Labrador coast pass to Canada, and the customs house at St John's begins collecting a Canadian tariff on the last day of the year."
 can_dnc_b.42.a: "Ten provinces, from the Atlantic to the Pacific."
 can_dnc_b.42.b: "The oldest colony is a Canadian province."
 can_dnc_b.42.c: "Canada has grown by an island and a coast."
 can_dnc_b.43.t: "Members for Canada at Westminster"
 can_dnc_b.43.d: "Ottawa asks that Canadian members be seated in the Commons at Westminster, on the plain ground that the Dominion pays for ships whose estimates it cannot vote. The claim is unanswerable and its consequences are enormous: what is granted to Canada cannot be refused to Australia, and cannot be refused to Ireland."
 can_dnc_b.43.a: "Seat them. A Parliament of the Empire has to start somewhere."
 can_dnc_b.43.b: "Seat them, and answer Mr Redmond when he rises."
 can_dnc_b.44.t: "Welcomed to the House"
 can_dnc_b.44.d: "Twelve members for Canada take the oath at the table and are cheered from both sides. They may speak on imperial supply, imperial defence and imperial trade, and on nothing else whatever. It is a smaller thing than it looked from Ottawa, and a larger thing than any colony has ever held."
 can_dnc_b.44.a: "Twelve votes on the estimates we pay."
 can_dnc_b.45.t: "Mr Redmond Rises"
 can_dnc_b.45.d: "John Redmond asks the House why a Dominion four thousand miles away may sit in it while Ireland may not govern itself, and the government front bench has no answer that survives being read aloud the next morning. Canada's seats have reopened the Irish question, and Ottawa is blamed in both islands."
 can_dnc_b.45.a: "We wanted a vote, not a constitutional crisis."
#Focuses
 CANDNC_c_unrestricted_reciprocity: "Unrestricted Reciprocity"
 CANDNC_c_unrestricted_reciprocity_desc: "Our note goes to Washington, not to London: hay, cattle, lumber and grain to cross the line free both ways. The last man who asked for this lost an election on it — but the continent, not the Empire, is where Canada's future is bought and sold."
 CANDNC_c_accept_the_award_with_grace: "Accept the Award with Grace"
 CANDNC_c_accept_the_award_with_grace_desc: "A British judge has given the Panhandle to Washington, and we could rage at London for it. Instead we sign, thank the tribunal, and say nothing of Skagway. Quarrelling with the Empire wins us nothing; keeping the Americans content may win us a great deal more."
 CANDNC_c_the_dollar_comes_north: "The Dollar Comes North"
 CANDNC_c_the_dollar_comes_north_desc: "The tariff we built to keep American goods out is bringing American factories in instead. Ford opens across the river from Detroit, and the capital follows. We let the dollar come north and put down roots — branch plants, American money, and the jobs that come with both."
 CANDNC_c_the_treaty_of_natural_products: "The Treaty of Natural Products"
 CANDNC_c_the_treaty_of_natural_products_desc: "Fielding and Root fix the schedule in Washington: the farm, the forest, the mine and the sea cross free; the factory does not. Every farmer between Brandon and Lethbridge has begged for this for years. We give the West its American market, and keep the manufacturer his wall."
 CANDNC_c_the_dingley_wall_holds: "The Dingley Wall Holds"
 CANDNC_c_the_dingley_wall_holds_desc: "Congress keeps its wall where it stands and tells us to come back when an administration needs the farm vote. We raise the general tariff a single point in reply, and tell the House the door is only bolted, not bricked over. Reciprocity waits on Washington's convenience, not ours."
 CANDNC_c_hayss_line_to_prince_rupert: "Hays's Line to Prince Rupert"
 CANDNC_c_hayss_line_to_prince_rupert_desc: "The state builds from Moncton to Winnipeg and leases the road to Hays, whose rails run on to a harbour on the Skeena no surveyor has yet walked. It is a wager on the Pacific trade with the Dominion's credit — a second transcontinental aimed at Asia, not at Britain."
 CANDNC_c_the_international_unions: "The International Unions"
 CANDNC_c_the_international_unions_desc: "Our labour takes its charters from the American Federation of Labor, and the Vancouver locals answer to a hall in Washington. Canadian workingmen are joining a continental movement, not an imperial one. We let the international unions in, and with them a loyalty that crosses the border more easily than ours."
 CANDNC_c_hills_lines_from_st_paul: "Hill's Lines from St Paul"
 CANDNC_c_hills_lines_from_st_paul_desc: "Hill runs his branch lines north to the border and pulls our grain down to Duluth at rates the Canadian Pacific cannot match. The prairie is learning which way its wheat wants to travel — and it is south. We may fight the pull, or admit that geography has already chosen for us."
 CANDNC_c_the_north_coast_port: "The North Coast Port"
 CANDNC_c_the_north_coast_port_desc: "The Grand Trunk lays out a harbour on Kaien Island, five hundred miles nearer Yokohama than Vancouver. Prince Rupert has a name won by competition and almost nothing else yet. We build the Dominion's window on the Pacific, and dare the Asian trade to come to it."
 CANDNC_c_the_last_best_west_for_americans: "The Last Best West for Americans"
 CANDNC_c_the_last_best_west_for_americans_desc: "Our agents work the Dakotas and Minnesota with the same pamphlets that once emptied Galicia. The settlers who cross at Emerson bring capital, machinery and no memory of the Queen. We fill the West with seasoned American farmers — and with a people who feel the border less with every year."
 CANDNC_c_grain_goes_by_duluth: "Grain Goes by Duluth"
 CANDNC_c_grain_goes_by_duluth_desc: "The cars turn south and the elevators at Fort William stand empty; Duluth and Minneapolis take the crop, and the lake fleet lies idle at Port Arthur. The Montreal houses warn that the West has slipped off the country's ledger. Our own harvest now leaves through another nation's ports."
 CANDNC_c_the_bridge_falls_at_quebec: "The Bridge Falls at Quebec"
 CANDNC_c_the_bridge_falls_at_quebec_desc: "The great bridge at Quebec folds into the river in fifteen seconds and takes seventy-five men, a third of them Mohawks from Kahnawake. An engineer in New York approved a span he never saw. We will raise it again — and reckon, quietly, how much of our building is designed abroad."
 CANDNC_c_the_silver_of_cobalt: "The Silver of Cobalt"
 CANDNC_c_the_silver_of_cobalt_desc: "Silver is struck on the Temiskaming grade, and the rush is on. Ontario keeps the royalties — but the smelters, the promoters and most of the shares are in New York. We dig the ore and they take the profit. A colony's wealth, once more, refined on another's account."
 CANDNC_c_the_winnipeg_exchange_loses_its_grip: "The Winnipeg Exchange Loses Its Grip"
 CANDNC_c_the_winnipeg_exchange_loses_its_grip_desc: "Partridge's Grain Growers' Company buys a seat on the Exchange, the Exchange takes it back, and a provincial government puts the company on the floor by law. The farmer is learning to organise, and the state to take his side. The old grain monopoly's grip is broken."
 CANDNC_c_the_winter_port_at_portland: "The Winter Port at Portland"
 CANDNC_c_the_winter_port_at_portland_desc: "The Grand Trunk keeps its winter terminus at Portland in Maine, and our winter trade leaves the country through an American port while the Maritimes sit locked in ice. Blair resigns rather than bless it. We tie our commerce to a foreign harbour, for the sake of a railway's convenience."
 CANDNC_c_the_sintaluta_judgment: "The Sintaluta Judgment"
 CANDNC_c_the_sintaluta_judgment_desc: "The Territorial Grain Growers haul the railway's agent before a country magistrate over the car allotment, and win — and the conviction stands on appeal. The prairie farmer has beaten the Canadian Pacific in a courtroom, and will not forget that the law, well used, is a weapon he can wield."
 CANDNC_c_under_the_monroe_doctrine: "Under the Monroe Doctrine"
 CANDNC_c_under_the_monroe_doctrine_desc: "We put the question no Dominion has dared ask the White House: does the Monroe Doctrine shelter a British colony north of the lakes? Roosevelt has just answered it for Santo Domingo. If the eagle will guard us, we need the lion's fleet a good deal less than London would like."
 CANDNC_c_the_fortresses_are_ottawas: "The Fortresses Are Ottawa's"
 CANDNC_c_the_fortresses_are_ottawas_desc: "The last imperial garrisons march out, and Halifax and Esquimalt pass to our own Militia Department with their guns and their upkeep. We hold our coasts ourselves now — one more tie to London quietly cut, one more reason the Empire's protection means less to a continental Canada."
 CANDNC_c_no_truck_nor_trade: "No Truck nor Trade"
 CANDNC_c_no_truck_nor_trade_desc: "Whitney sweeps Ontario, and the Orange lodges raise the old cry: no truck nor trade with the Yankees. The province that pays the tariff will not be sold to Washington. Here is the wall our continental course must climb — English Canada's dread of being swallowed by its neighbour."
 CANDNC_c_the_coast_follows_washingtons_line: "The Coast Follows Washington's Line"
 CANDNC_c_the_coast_follows_washingtons_line_desc: "After the riot on the coast, we stop asking London how to keep the Pacific white and start copying the statutes of California. The exclusion the Empire forbids, the American states have already written. On Asian immigration, our neighbour and not our mother shows us the way."
 CANDNC_c_the_customs_union: "The Customs Union"
 CANDNC_c_the_customs_union_desc: "One tariff schedule around both countries, the receipts divided by head. Chamberlain offered the Empire just such a union and we refused it — this one comes from Washington, and it is far harder to refuse. A single market of a hundred millions, with Canada the junior clerk at the counter."
 CANDNC_c_bow_to_london: "Bow to London"
 CANDNC_c_bow_to_london_desc: "The Colonial Office has reserved the bill and given us sixty days. We walk into the Commons and move the repeal ourselves, and the wire to London goes before the division bells fall silent. The imperial veto still binds us — and we choose, this time, to bow rather than to break."
 CANDNC_c_defy_london: "Defy London"
 CANDNC_c_defy_london_desc: "The summons is read at the table and left lying there. We answer that a Parliament which cannot set its own tariff is no Parliament at all, and ask the Colonial Secretary what he means to do about it. Let London learn whether its veto is a law, or merely a habit we may drop."
 CANDNC_c_the_boundary_waters_treaty: "The Boundary Waters Treaty"
 CANDNC_c_the_boundary_waters_treaty_desc: "Gibbons negotiates it, but Bryce must sign because Canada has no power to sign its own treaties, and Root signs for the Americans. Six commissioners share the Great Lakes between them. Even settling our own frontier, we watch London hold the pen — a humiliation we do not mean to suffer forever."
 CANDNC_c_reciprocity_without_the_union: "Reciprocity without the Union"
 CANDNC_c_reciprocity_without_the_union_desc: "The imperial union is dead, but the American schedule need not die with it. We go back to Washington for the natural products alone, and keep our tariff and our Crown both. Reciprocity in wheat and lumber, yes — but Canada stays Canada, and the deeper question is left for another day."
 CANDNC_c_the_question_of_union: "The Question of Union"
 CANDNC_c_the_question_of_union_desc: "London has washed its hands of us, and our trade is already American. The Cabinet sits till three in the morning on the last question of all: how a country that has stopped being a colony is to stop being a country. The continental road has led us to its edge, and we must look over it."
 CANDNC_c_the_loyalists_answered: "The Loyalists Answered"
 CANDNC_c_the_loyalists_answered_desc: "We tell Whitney at Queen's Park what he needs to hear: the Crown stays, the flag stays, the schedule is a tariff and nothing more. The Orange lodges stand down, and the loyalist storm blows itself out. We take the American market and swear, hand on heart, that it buys nothing but trade."
 CANDNC_c_the_plebiscite_on_union: "The Plebiscite on Union"
 CANDNC_c_the_plebiscite_on_union_desc: "The question goes to the whole country on a single line of a ballot, a simple majority to decide it. Quebec remembers what became of the majority that once voted the nation dry. We put the fate of Canada to a vote — and cannot be sure the vote will hand us back the answer we want."
 CANDNC_c_the_treaty_of_union: "The Treaty of Union"
 CANDNC_c_the_treaty_of_union_desc: "No ballot. Two governments negotiate terms the way Texas once did, and the American Senate is asked for its two thirds. We would join the Union by treaty, over the heads of the voters. Root will say within a fortnight whether Washington will even sit down to talk of it."
 CANDNC_c_the_associate_not_the_state: "The Associate, Not the State"
 CANDNC_c_the_associate_not_the_state_desc: "At the very threshold, the Cabinet stops. Free trade, a common defence, an American guarantee — but the ballot is never printed and the flag over the East Block is never lowered. Canada will be the junior partner of a giant, and it will still, unmistakably, be Canada."
 CANDNC_c_the_continental_dominion: "The Continental Dominion"
 CANDNC_c_the_continental_dominion_desc: "The decade ends with the King's head on the coins, his writ in the courts, and the whole trade of the country running south. We tell the Empire Club that a Dominion may face two ways at once and be loyal in both. Crown to the east, commerce to the south — a delicate balance we mean to keep."
 CANDNC_c_the_campaign: "The Campaign"
 CANDNC_c_the_campaign_desc: "Six months of tents and halls and pamphlets from Sydney to Victoria. Bourassa takes Quebec, the lodges take Ontario, the Grain Growers take the prairie, and stones go through windows in the loyalist towns. We have put union to the people — and set every region of the country against the others."
 CANDNC_c_the_terms_of_union: "The Terms of Union"
 CANDNC_c_the_terms_of_union_desc: "The commissioners argue on Pennsylvania Avenue over the debt, the Indian treaties, the school clauses, the French language. Every article settled in Washington is an article no Canadian Parliament will ever vote. We are bargaining away the country clause by clause — and the country is not in the room."
 CANDNC_c_the_junior_partner_of_a_giant: "The Junior Partner of a Giant"
 CANDNC_c_the_junior_partner_of_a_giant_desc: "We ask Washington for what New Zealand asks London: protection without absorption. But the Americans have never granted it to anyone north of the Rio Grande, and we cannot say what a refusal would leave us holding. To lean on the giant is one thing; to keep our feet while we do it, another."
 CANDNC_c_the_vote: "The Vote"
 CANDNC_c_the_vote_desc: "The polls close and the returning officers wire Ottawa through the night — the prairie first, the Maritimes last. By two in the morning the East Block knows what the country has decided about its own existence. Whatever the tally, Canada will not be the same country when the sun comes up."
 CANDNC_c_the_senate_votes: "The Senate Votes"
 CANDNC_c_the_senate_votes_desc: "Sixty days on Capitol Hill decide us. The Southern bloc counts the senators the north would send, the protectionists count our lumber, and our commissioners sit in the gallery unable to say a word. The fate of the Dominion now rests with a chamber in which Canada has no voice at all."
 CANDNC_c_the_governor_general_goes_home: "The Governor General Goes Home"
 CANDNC_c_the_governor_general_goes_home_desc: "Earl Grey's train leaves Ottawa without a guard of honour, Rideau Hall is shut, and the King's name comes off the writs. The Prime Minister signs the first commission no viceroy ever countersigned. The Crown has left the country quietly — and a thing that was a Dominion is now something else."
 CANDNC_c_admission_to_the_union: "Admission to the Union"
 CANDNC_c_admission_to_the_union_desc: "The address goes to Congress with the poll of every county attached. Oklahoma came in as a single state; we ask to enter as nine, dragging our debts and our treaties behind us. Canada petitions to become a corner of the American republic — the boldest surrender, or the boldest bargain, in our history."
 CANDNC_c_the_west_goes_south: "The West Goes South"
 CANDNC_c_the_west_goes_south_desc: "The country voted No and the prairie voted Yes. Conventions at Saskatoon and Calgary petition Washington over our heads, and we must choose: negotiate the loss of three provinces, or send the Mounted Police to hold them. The continental dream has cracked the Dominion along its oldest fault."
 CANDNC_c_nine_new_states: "Nine New States"
 CANDNC_c_nine_new_states_desc: "The Senate has consented and the terms are law. Nine stars go on the flag, our Militia becomes a department of the Army, and the Dominion of Canada ends a lifetime after Charlottetown. We have voted ourselves into the great republic — and closed, with our own hands, the book of a separate country."
 CANDNC_c_the_junior_partner_by_default: "The Junior Partner by Default"
 CANDNC_c_the_junior_partner_by_default_desc: "The Senate would not have us. The commissioners come home to a country stripped of its Crown, its treaty and its own tariff, and Washington offers the one thing that costs it nothing — a guarantee. We reached for union and grasped dependence: independent in name, American in every fact that matters."
 CANDNC_c_the_northern_associate: "The Northern Associate"
 CANDNC_c_the_northern_associate_desc: "The decade ends with an independent Canada inside the American customs line and under the American guarantee. The flag is our own; the market is not; and every despatch from Ottawa is read in Washington before it is answered. We are nobody's colony now — and not quite our own masters either."
#Ideas
 CAN_c_the_continent_is_the_market: "The Continent Is the Market"
 CAN_c_the_continent_is_the_market_desc: "Ottawa has stopped waiting for London to open a market and started asking Washington. The customs houses at Windsor and Emerson matter more than the cable to Poldhu, and the Ontario manufacturers know it."
 CAN_c_branch_plants: "Branch Plants"
 CAN_c_branch_plants_desc: "American firms climb the tariff wall instead of paying it. The works go up at Walkerville, Windsor and Hamilton, the wages are Canadian, the patents and the dividends are not."
 CAN_c_reciprocity_in_natural_products: "Reciprocity in Natural Products"
 CAN_c_reciprocity_in_natural_products_desc: "The farm, the forest, the mine and the fishery cross the line free; the factory still pays. The prairie gets the Minneapolis price and the eastern manufacturer gets nothing but the freight bill."
 CAN_c_the_dingley_wall: "The Dingley Wall"
 CAN_c_the_dingley_wall_desc: "Congress kept the rates of 1897 and Ottawa answered in kind. The home market is safe behind two tariffs, and the exporters are shut inside it with everyone else."
 CAN_c_hayss_debt: "Hays's Debt"
 CAN_c_hayss_debt_desc: "The Dominion guarantees the bonds of a railway across muskeg nobody has surveyed. The grade advances a mile a day and the Finance Department signs for every mile of it."
 CAN_c_hills_lines: "Hill's Lines"
 CAN_c_hills_lines_desc: "The branch lines come up from St Paul and the rates fall wherever they reach. The prairie ships cheaper and ships south, and Ottawa learns that a foreign railway sets the price of Canadian wheat."
 CAN_c_grain_by_duluth: "Grain by Duluth"
 CAN_c_grain_by_duluth_desc: "The crop turns south at Emerson for the head of Lake Superior. The growers are paid more and the Fort William elevators, the lake fleet and the Montreal export houses are paid nothing."
 CAN_c_the_portland_terminus: "The Portland Terminus"
 CAN_c_the_portland_terminus_desc: "The winter traffic goes out through Maine because the ice does not reach it. The through rate is the cheapest in the country and every Maritime member in the House says so at every session."
 CAN_c_the_international_unions: "The International Unions"
 CAN_c_the_international_unions_desc: "The locals hold American charters and strike when the international says strike. The trades are organised as they have never been, and the strike fund is voted in a hall the Dominion cannot reach."
 CAN_c_the_american_prairie: "The American Prairie"
 CAN_c_the_american_prairie_desc: "The settlers cross at Emerson and North Portal with implements, seed money and experience of the same soil. They fill the townships fast and they did not come north to be counted as British subjects."
 CAN_c_the_silver_camps: "The Silver Camps"
 CAN_c_the_silver_camps_desc: "Cobalt sends out ore that was worth a few hundred thousand ounces in 1904 and millions by 1909. Ontario takes the royalty, and the refining, the promoting and the profit are done elsewhere."
 CAN_c_the_grain_growers_company: "The Grain Growers' Company"
 CAN_c_the_grain_growers_company_desc: "The farmers sell their own crop through their own company and keep the commission. The Exchange, the banks and the line elevator men treat every ministry that helped them as an enemy."
 CAN_c_the_exclusion_line: "The Exclusion Line"
 CAN_c_the_exclusion_line_desc: "British Columbia gets the statutes it has demanded since 1900 and the Pacific trade gets the bill. The mills have their quiet coast and the shipping agents at Yokohama stop calling."
 CAN_c_the_eagles_wing: "The Eagle's Wing"
 CAN_c_the_eagles_wing_desc: "Washington has guaranteed the northern frontier and the House has read the despatch. The militia estimates are cut the same session, because nobody votes money for a danger the Americans have taken away."
 CAN_c_the_esquimalt_station: "The Esquimalt Station"
 CAN_c_the_esquimalt_station_desc: "American colliers coal at the dockyard the British garrison left, under a lease of ninety-nine years. The yard works again, and there is a foreign ensign flying over Vancouver Island."
 CAN_c_the_customs_union: "The Customs Union"
 CAN_c_the_customs_union_desc: "One tariff wall around both countries, the receipts divided by population, and no customs house between Windsor and Detroit. The market is continental and the Dominion no longer sets a single rate."
 CAN_c_the_continental_dominion: "The Continental Dominion"
 CAN_c_the_continental_dominion_desc: "The Zollverein was withdrawn and the trade stayed. Ottawa keeps the Crown, keeps its tariff schedule, and keeps a market it can no longer bargain over."
 CAN_c_the_junior_partner: "The Junior Partner"
 CAN_c_the_junior_partner_desc: "The country is free to say anything it likes and free to be ignored. Its goods move, its ministers are received at the State Department, and no despatch leaves Ottawa without a guess at Washington's temper."
 CAN_c_the_imperial_boycott: "The Imperial Boycott"
 CAN_c_the_imperial_boycott_desc: "The Empire preference is withdrawn, the Liverpool houses close their Canadian accounts, and the insurance rates on the St Lawrence double. The country is united in resentment and short of everything else."
