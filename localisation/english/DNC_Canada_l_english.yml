 CAN_dnc_dominion_credit_modifier:0 "The Dominion's Credit"
 CAN_dnc_dominion_credit_modifier_desc:0 "Every bond Ottawa guarantees builds a railway and mortgages a harvest. The Dominion's credit is spent on steel and repaid in consumer goods."
 can_dnc_r.101.t:0 "A Strike in the Camps"
 can_dnc_r.101.d:0 "The navvies on the Shield have downed their picks. The camps are crowded, the pay is late, the contractor's store charges what it likes, and the men who landed at Quebec this spring have learned the word strike in three languages. The contractors ask Ottawa for police; the men ask Ottawa for wages. The line does not advance while either waits."
 can_dnc_r.101.a:0 "Pay them and get the rails moving."
 can_dnc_r.101.b:0 "Send the Mounted Police to the camps."
 can_dnc_r.101.c:0 "It is the contractor's quarrel, not ours."
 can_dnc_r.102.t:0 "Buffalo Sends Its Bloc"
 can_dnc_r.102.d:0 "The members for Buffalo have arrived in Ottawa as one delegation with one list: freight rates, the tariff on implements, a branch line north of the river, and a seat at the Cabinet table for the prairie. They vote together and they have counted our majority to the man. We may pay the West's price, or remind it who holds the purse."
 can_dnc_r.102.a:0 "Bargain. The prairie has earned its terms."
 can_dnc_r.102.b:0 "Face them down. A province is not a party."
 can_dnc_r.103.t:0 "The Bill Falls Due"
 can_dnc_r.103.d:0 "The Toronto press has counted the cost of a year of doing nothing: two coasts, no ships, and an Admiralty that will ask again at the next conference. Ontario's members want a naval bill promised for the coming session. Quebec's members want the silence kept. We can promise the one and lose the other, or keep our peace and let Ontario remember."
 can_dnc_r.103.a:0 "Promise a naval bill for the next session."
 can_dnc_r.103.b:0 "Keep the silence. Quebec is quiet; let it stay so."
 can_dnc_r.104.t:0 "The Reckoning Deferred"
 can_dnc_r.104.d:0 "Seven million people, three transcontinentals abuilding, a militia council, a foreign office above a barber's shop and a navy still on paper. The Dominion has chosen nothing and lost nothing. The Admiralty's next request is already drafted, and the question of who sends Canadians to war is no nearer an answer than it was when the first contingent sailed."
 can_dnc_r.104.a:0 "We have chosen nothing and lost nothing. Let it stand."
 can_dnc_r.104.b:0 "Lay a keel before the Admiralty asks again."
 CAN_r_two_ledgers_tt:0 "§YTwo ledgers open for the era:§! the §Rfracture§! between the two peoples, and the §Ranger of the Ontario loyalists§!. Every path writes in both."
 CAN_r_empire_at_war_tt:0 "§YThe Empire is at war.§! The contingent's dead are fresh and the country is listening."
 CAN_r_otter_of_paardeberg_tt:0 "§YWilliam Otter§!, who led the Regiment at Paardeberg, gains a skill level."
 CAN_r_other_colonies_watch_tt:0 "The other self-governing colonies watch Ottawa refuse, and take note:"
 CAN_r_panhandle_lost_tt:0 "§RThe Panhandle is lost.§! The Dominion turns to the coast it still holds."
 CAN_r_lake_at_the_council_tt:0 "§YPercy Lake§! takes the chief of staff's chair at the Militia Council:"
 CAN_r_garrisons_relieved_tt:0 "§YThe imperial garrisons march out;§! Canadian garrisons take the keys:"
 CAN_r_king_at_labour_tt:0 "§YLemieux§! carries the act his deputy King drafted, and the coal keeps moving:"
 CAN_r_head_tax_pays_the_damage_tt:0 "§YThe head-tax ledger pays the damage§! and the quarrel with the coast is postponed again."
 CAN_r_secretariat_killed_tt:0 "§YThe permanent imperial secretariat is killed§! before it is born. Status, yes; obligation, never."
 CAN_r_fielding_signs_in_paris_tt:0 "§YFielding§! signs a commercial treaty of our own in Paris under British cover:"
 CAN_r_panic_credit_heavy_tt:0 "§RThe Dominion's credit is already mortgaged to the railways;§! the panic bites longer."
 CAN_r_notes_against_the_grain_tt:0 "§YDominion notes are issued against the grain itself§! and the wheat races to port."
 CAN_r_fracture_minus_one_tt:0 "§GThe fracture between the two peoples narrows by one.§!"
 CAN_r_loyalist_anger_plus_one_tt:0 "§RThe anger of the Ontario loyalists rises by one.§!"
 CAN_r_loyalist_anger_plus_two_tt:0 "§RThe anger of the Ontario loyalists rises by two.§!"
 CAN_r_loyalist_anger_minus_one_tt:0 "§GThe anger of the Ontario loyalists falls by one.§!"
 CAN_r_plains_of_abraham_tt:0 "§YThe Plains of Abraham pass into public hands§! and the militia parades on them."
 CAN_r_joint_commission_tt:0 "§YA joint commission of three from each side§! judges every river the border crosses."
 CAN_r_pope_under_secretary_tt:0 "§YJoseph Pope§! becomes the first under-secretary of the new department:"
 CAN_r_dominion_writes_its_own_papers_tt:0 "§YA Dominion that files its own foreign papers§! has taken the first step toward writing them."
 CAN_r_bell_and_mccurdy_tt:0 "§YBell and McCurdy§! offer the militia their machines and their counsel:"
 CAN_r_militia_council_buys_tt:0 "§YThe Militia Council§! finds the money for two machines."
 CAN_r_kingsmill_tt:0 "§YRear-Admiral Kingsmill§! is named director of the naval service:"
 CAN_r_coasts_bare_tt:0 "§RThe Atlantic squadron has sailed for home§! and the coasts are bare."
 CAN_r_bourassa_in_the_gallery_tt:0 "§YBourassa§! cheers from the gallery and the nationalist press takes heart:"
 CAN_r_credit_begins_tt:0 "§YThe Dominion's credit is pledged.§! Every guaranteed bond now builds faster and costs the household more:"
 CAN_r_credit_infra_5_tt:0 "The Dominion's Credit: infrastructure construction speed §G+5%§!"
 CAN_r_credit_infra_15_tt:0 "The Dominion's Credit: infrastructure construction speed §G+15%§!"
 CAN_r_credit_goods_2_tt:0 "The Dominion's Credit: consumer goods §R+2%§!"
 CAN_r_credit_goods_5_tt:0 "The Dominion's Credit: consumer goods §R+5%§!"
 CAN_r_credit_goods_m2_tt:0 "The Dominion's Credit: consumer goods §G-2%§!"
 CAN_r_credit_pp_5_tt:0 "The Dominion's Credit: political power gain §G+5%§!"
 CAN_r_blair_resigns_tt:0 "§RBlair resigns rather than sign§! the guarantee."
 CAN_r_prince_rupert_tt:0 "§YPrince Rupert§! is surveyed as the Pacific terminus of a line that exists only on paper."
 CAN_r_hays_empire_tt:0 "§YHays drives his rails toward a harbour that exists only on a survey§!, on bonds we guarantee:"
 CAN_r_kahnawake_dead_tt:0 "§RSeventy-five men are dead, a third of them Mohawk ironworkers of Kahnawake.§!"
 CAN_r_hays_keeps_portland_tt:0 "§YHays keeps his terminus at Portland§! and the Dominion keeps its credit."
 CAN_r_somewhere_to_appeal_tt:0 "§YThe Western farmer has somewhere to appeal§! against the railway; the Minister of Trade and Commerce answers for the tribunal:"
 CAN_r_patronage_lever_lost_tt:0 "§RThe Cabinet loses a patronage lever it prized;§! the Western farmer gains somewhere to appeal."
 CAN_r_canadian_northern_tt:0 "§YMackenzie and Mann§! drive the Canadian Northern into Edmonton on bonds we guarantee:"
 CAN_r_dominion_lands_kept_tt:0 "§YOttawa keeps the land, the mines, the forests and the water§! of the new provinces."
 CAN_r_west_is_ours_tt:0 "§YRutherford and Scott§! confirm the governments we installed; the West is ours for a decade."
 CAN_r_bell_bought_out_tt:0 "§YThe provinces buy out Bell§! and string the wire to the homestead:"
 CAN_r_forty_five_students_tt:0 "§YForty-five students§! are a small start. A prairie that trains its own men will not long remain a colony of Ontario's colleges."
 CAN_r_wire_to_the_college_tt:0 "§YThe provincial telephone reaches the new colleges.§!"
 CAN_r_haultain_names_it_tt:0 "§YHaultain names his province Buffalo§! and forms its first government."
 CAN_r_opposition_in_buffalo_tt:0 "§ROur western caucus sits in opposition§! in a province we never dreamed of losing."
 CAN_r_homestead_provincial_tt:0 "§YHomestead entry becomes a provincial affair;§! Ottawa's immigration machine loses its lever."
 CAN_r_price_of_the_prairie_tt:0 "§RThe price of the prairie has gone up.§! Every session from now is a negotiation."
 CAN_r_lemieux_in_tokyo_tt:0 "§YLemieux§! sails for Tokyo and brings back a gentleman's word:"
 CAN_r_tokyo_not_named_tt:0 "§YJapan is not named§! and the gentleman's word holds."
 CAN_r_first_drug_law_tt:0 "§YThe first federal drug law§! forbids the import and sale of opium for smoking:"
 CAN_r_disallow_nothing_tt:0 "§YWe disallow nothing and answer for nothing.§! The coast is ours to govern; the alliance is London's to keep."
 CAN_r_natal_disallowed_tt:0 "§RDowning Street has struck the act down.§! The coast waits for Ottawa's answer."
 CAN_r_league_in_victoria_tt:0 "§RThe Exclusion League sits on Vancouver's council and in Victoria's House.§!"
 CAN_r_transvaal_lessons_bonus:0 "Lessons of the Veldt"
