 CAN_r_the_contingent_sails:0 "The Contingent Sails"
 CAN_r_the_contingent_sails_desc:0 "Strathcona's Horse sails for the war under the imperial flag. Recruiting offices are full in Toronto and quiet in Montreal."
 CAN_r_the_defence_estimates:0 "The Defence Estimates"
 CAN_r_the_defence_estimates_desc:0 "The Admiralty has named the price of the imperial shield and the Treasury finds it. A line in the budget buys the Empire's gratitude and costs the Dominion its spare change."
 CAN_r_canadian_crews_admiralty_hulls:0 "Canadian Crews on Admiralty Hulls"
 CAN_r_canadian_crews_admiralty_hulls_desc:0 "Canadian seamen take Admiralty ships at Halifax, paid from Ottawa and commanded from London. The Dominion earns its place in the line without a fleet of its own."
 CAN_r_the_tariff_reform_wait:0 "Waiting on Birmingham"
 CAN_r_the_tariff_reform_wait_desc:0 "Our tariff rides on a British election no Canadian may vote in. The government can only wait, and the manufacturers only worry."
 CAN_r_the_squadron_on_station:0 "The Squadron on Station"
 CAN_r_the_squadron_on_station_desc:0 "The imperial squadron keeps its coal, its dockyard and its guns at Halifax, and Ottawa pays the upkeep. The finest fleet afloat, rented by the year."
 CAN_r_the_libel_suits:0 "The Libel Suits"
 CAN_r_the_libel_suits_desc:0 "Asselin is prosecuted and his paper comes out late and thin. Every issue sells out on rue Saint-Denis."
 CAN_r_the_sydney_contracts:0 "The Sydney Contracts"
 CAN_r_the_sydney_contracts_desc:0 "With imperial orders on the books, the furnaces at Sydney roll armour plate instead of rails. Cape Breton coal and Bell Island ore feed a war industry the Empire pays for."
 CAN_r_the_french_battalions:0 "The French Battalions"
 CAN_r_the_french_battalions_desc:0 "French Canada serves the Empire in its own language, officered by its own and sworn to the King."
 CAN_r_the_imperial_tercentenary:0 "The Tercentenary Pageant"
 CAN_r_the_imperial_tercentenary_desc:0 "Champlain lands again below the Citadel with a British squadron in the basin. Three centuries of French Quebec are dressed in the Empire's colours."
 CAN_r_the_empires_nerves:0 "The Empire's Nerves"
 CAN_r_the_empires_nerves_desc:0 "The Pacific cable and the Marconi station at Glace Bay put two of the Empire's nerves in Canadian hands. Messages from London to Australia pass through Ottawa's keeping."
 CAN_r_the_payne_aldrich_ultimatum:0 "The Payne-Aldrich Ultimatum"
 CAN_r_the_payne_aldrich_ultimatum_desc:0 "Washington threatens its maximum column against any country that favours another, and the imperial preference is exactly that. The Dominion stands by the Empire and pays in trade."
 CAN_r_the_imperial_yards:0 "The Imperial Yards"
 CAN_r_the_imperial_yards_desc:0 "Vickers comes to Montreal and the Admiralty to Halifax. The first plates cut in Canada for a King's ship are cut here, and the skilled trades come with them."
 CAN_r_the_empire_settlement_scheme:0 "The Empire Settlement"
 CAN_r_the_empire_settlement_scheme_desc:0 "Assisted passages, free homestead land and a bonus for every family out of the British Isles, with the imperial exchequer paying half the fare."
 CAN_r_the_doukhobor_villages:0 "The Doukhobor Villages"
 CAN_r_the_doukhobor_villages_desc:0 "The villages hold their land in common and swear no oath. The letter of the homestead law is bent to keep the settlers the West so badly needs."
 CAN_r_the_western_gate:0 "The Western Gate"
 CAN_r_the_western_gate_desc:0 "Canadian garrison artillery holds the batteries above Esquimalt and the Pacific dockyard is open again. The guns face west, toward whatever is coming across that ocean."
 CAN_r_the_empires_reservoir:0 "The Empire's Reservoir"
 CAN_r_the_empires_reservoir_desc:0 "The Dominion is the manpower of the Empire in fact as well as in speeches. Every militia roll is an imperial roll, and every budget a contribution."
 CAN_r_the_reserve_called_out:0 "The Reserve Called Out"
 CAN_r_the_reserve_called_out_desc:0 "The naval reserve mans the squadron in the basin, and the fishermen of two coasts answer the Admiralty's signal before their own government's."
 CAN_dnc_c_continental_market:0 "The Continental Market"
 CAN_dnc_c_continental_market_desc:0 "Every schedule signed in Washington pulls the country's trade a little further south. The market grows with each step; so does Washington's hand on our terms."
 CAN_r_c_continental_market_opens_tt:0 "§YThe Continental Market§! opens: its modifiers grow with every continental focus"
 CAN_r_c_panhandle_claim_dropped_tt:0 "Our claim on the §YPanhandle§! is withdrawn for good"
 CAN_r_c_loyalist_anger_one_tt:0 "§RLoyalist anger§! rises by §R1§!"
 CAN_r_c_loyalist_calm_one_tt:0 "§GLoyalist anger§! falls by §G1§!"
 CAN_r_c_fracture_plus_one_tt:0 "§RThe fracture between the two Canadas§! widens by §R1§!"
 CAN_r_c_fracture_plus_two_tt:0 "§RThe fracture between the two Canadas§! widens by §R2§!"
 CAN_r_c_fracture_minus_one_tt:0 "§GThe fracture between the two Canadas§! narrows by §G1§!"
 CAN_r_c_window_on_the_pacific_tt:0 "Prince Rupert is the Dominion's §Ywindow on the Pacific§!"
 CAN_r_c_bridge_collapse_tt:0 "The span folds into the St Lawrence: §Rinfrastructure in Quebec is damaged§! before the rebuilding begins"
 CAN_r_c_lodges_in_the_street_tt:0 "§RThe lodges are in the street§!: the loyalist anger is already past bearing"
 CAN_r_c_dominions_offended_tt:0 "Every other Dominion of the Crown takes offence"
 CAN_r_c_dominions_reassured_tt:0 "The other Dominions of the Crown are reassured"
 CAN_r_c_loyalists_stand_down_tt:0 "§GThe Orange lodges stand down§!; Ontario is no longer roused against us"
 CAN_r_c_double_majority_costs_tt:0 "§RThe double majority§! promised to Quebec costs the Yes vote §R10§!"
 CAN_r_c_double_majority_tt:0 "Quebec is promised a §Ydouble majority§!: the Yes vote will pay for it on the night"
 CAN_r_c_unions_for_yes_tt:0 "The international unions campaign for Yes: §G+5§! to the Yes vote"
 CAN_r_c_growers_for_yes_tt:0 "The Grain Growers campaign for Yes: §G+5§! to the Yes vote"
 CAN_r_c_lodges_against_tt:0 "The Orange lodges campaign for No: §R-5§! to the Yes vote"
 CAN_r_c_the_west_is_ready_tt:0 "The American West is ready for the question"
 CAN_r_c_market_folded_tt:0 "§YThe Continent Is the Market§! is folded into the settled spirit of the Dominion"
 CAN_r_c_us_army_mission_tt:0 "An §YAmerican army mission§! will be received at Ottawa"
 CAN_r_c_fort_william_idle_tt:0 "§RThe elevators at Fort William stand empty§!"
 CAN_r_c_stones_through_windows_tt:0 "§RStones go through windows in the loyalist towns of Ontario§!"
 CAN_r_c_debt_assumed_tt:0 "Washington offers to assume the §YDominion debt§! under the terms"
 CAN_r_c_washington_asked_again_tt:0 "Washington is asked for the natural products schedule alone"
 CAN_r_c_guarantee_steadies_tt:0 "§GWashington's guarantee§! steadies the country while London decides"
 CAN_r_c_french_clauses_tt:0 "The §YFrench clauses§! of the terms will cost votes on the Hill"
 CAN_r_c_english_clauses_tt:0 "The §YEnglish terms§! please the Senate and enrage Quebec"
 CAN_r_c_conciliation_holds_tt:0 "The §GLemieux Act§! keeps the international strikes off the street"
 CAN_r_c_fortresses_garrisoned_tt:0 "The Militia Department raises its own §Ygarrison artillery§! at Halifax and Esquimalt"
 CAN_r_c_hydro_at_niagara_tt:0 "The shared waters of §YNiagara§! may be harnessed for Ontario's power"
 CAN_r_c_cobalt_on_broad_street_tt:0 "The silver camps will answer to §YNew York§! promoters"
 CAN_r_c_whitney_hydro_tt:0 "Whitney's answer to the continental course is §Ypublic power§! for Ontario"
 CAN_r_c_west_for_union_tt:0 "The prairie, filled with Americans, already leans south"
