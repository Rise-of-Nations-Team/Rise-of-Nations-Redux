#Ideas
 CAN_e_the_question_of_the_two_races: "The Question of the Two Races"
 CAN_e_the_question_of_the_two_races_desc: "Ottawa has said out loud that the Dominion contains two peoples and that one of them was engaged without being asked. Every file on the desk is now the same file, and nothing can be settled quietly again."
 CAN_e_the_compact_of_two_nations: "A Country of Two Nations"
 CAN_e_the_compact_of_two_nations_desc: "The government holds that neither people is the servant of the other. Quebec is quiet and will stay quiet; the militia camps at Niagara and London are thin, and no minister dares say the word contingent."
 CAN_e_anglo_conformity: "One Language for One Dominion"
 CAN_e_anglo_conformity_desc: "English is the language of the Dominion, its schools and its service, and Ontario and the West will give it whatever it asks for. A quarter of the country is being administered in a language it does not speak at home."
 CAN_e_the_nationalist_press: "The Nationalist Press"
 CAN_e_the_nationalist_press_desc: "Asselin's weekly reaches the presbyteries and the colleges before it reaches the ministers it names. A government that reads it a day early governs better; a government that appears in it governs worse."
 CAN_e_sifton_walks_out: "Sifton Walks Out"
 CAN_e_sifton_walks_out_desc: "The man who filled the West sits behind the government instead of in it. The North Atlantic Trading Company's agents are unpaid, the pamphlets stop going out, and Ottawa keeps a cabinet it can finally control."
 CAN_e_quebec_particular_status: "The Particular Status of Quebec"
 CAN_e_quebec_particular_status_desc: "One province has guarantees written into a statute of Canada: its language in the federal service, its schools, its share of the estimates. It costs a standing quarrel with Ontario and a militia that will not be filled."
 CAN_e_a_statute_half_kept: "A Statute Half Kept"
 CAN_e_a_statute_half_kept_desc: "The schools clauses survive and everything else was struck out to appease the lodges. Quebec keeps something and knows exactly what it lost, and the government is trusted by neither side of the river."
 CAN_e_a_statute_wrung_out: "A Statute Wrung Out"
 CAN_e_a_statute_wrung_out_desc: "The guarantees were conceded under advice from abroad and with a crowd in the street, which everyone in the country knows. Quebec is quiet, and no foreign office will ever again believe that Ottawa settles its own affairs."
 CAN_e_a_bilingual_interior: "A Bilingual Interior"
 CAN_e_a_bilingual_interior_desc: "The immigration agents recruit in Brittany, Normandy and Wallonia instead of Galicia and Bukovina, and the West is settled slowly by families who keep the language of the parish that sent them."
 CAN_e_the_bilingual_civil_service: "The Bilingual Civil Service"
 CAN_e_the_bilingual_civil_service_desc: "Every department answers in the language it is written to. It costs establishment, examinations and a decade of translators' salaries, and it makes the federal government legible to a quarter of the country for the first time."
 CAN_e_professors_and_officers_from_france: "Professors and Officers From France"
 CAN_e_professors_and_officers_from_france_desc: "Agreges for the colleges and two instructing officers of the Republic for the militia. Ottawa learns a good deal about modern gunnery and pays for it in every conversation it has with the Colonial Office."
 CAN_e_a_province_held: "A Province Held"
 CAN_e_a_province_held_desc: "Quebec is administered by a majority it did not elect and garrisoned by a militia it will not join. The Dominion is united on paper, and one man in four is counted as a security problem by his own government."
 CAN_e_the_lost_province: "The Lost Province"
 CAN_e_the_lost_province_desc: "The Saint Lawrence is a frontier and the Maritimes are on the far side of somebody else's customs house. What remains of Canada is of one mind at last, and a great deal smaller than it was in 1899."
 CAN_e_the_ligue_in_arms: "The Ligue in Arms"
 CAN_e_the_ligue_in_arms_desc: "A militia of students, printers and parish men who know every road between Sorel and Trois-Rivieres, with no arsenal, no foundry and no officer above the rank of major who has ever commanded anything."
 CAN_e_the_quiet_province: "The Quiet Province"
 CAN_e_the_quiet_province_desc: "Quebec has been bought rather than convinced: harbour works, bridge contracts and a park at Quebec. The province is quiet, the estimates carry it every year, and nothing whatever has been settled."
#Events
 can_dnc_e.1.t: "One Stroke of the Pen, Two Peoples"
 can_dnc_e.1.d: "Bourassa has sat down. The order in council of 14 October 1899 sent a thousand men to South Africa without a vote of the Commons, and the member for Labelle asks the House to declare that it binds nothing. There are four answers already on the order paper and a fifth that nobody has yet said aloud in this chamber: that the order engaged two peoples with one signature, and that only one of them was consulted. Say it, and the schools, the seats, the census and the ships all become the same question, and it will not be answered in this Parliament or the next."
 can_dnc_e.1.a: "Then let the House say which of the two it means to be."
 can_dnc_e.2.t: "The Delegate Apostolic Asks to Be Received"
 can_dnc_e.2.d: "Mgr Donatus Sbarretti, apostolic delegate at Ottawa, has asked for an interview on the school clauses, and Mgr Adelard Langevin writes from Saint-Boniface in the same week. Rome cannot disallow a Canadian statute and has no need to. The delegate speaks to the bishops, the bishops speak from the pulpit, and sixty-five ridings hear it on a Sunday morning. What is said in the interview will not be minuted; what follows from it will be counted at the next general election."
 can_dnc_e.2.a: "Receive him, and hear the episcopate out."
 can_dnc_e.2.b: "Receive him, and remind him that Parliament legislates."
 can_dnc_e.2.c: "The delegate may address himself to the Colonial Office."
 can_dnc_e.2.e: "Receive him privately, and concede nothing in writing."
 can_dnc_e.3.t: "Saint-Jacques Turns Out Its Premier"
 can_dnc_e.3.d: "Montreal, 8 June 1908. Henri Bourassa stands against Lomer Gouin in Saint-Jacques and beats him in his own city. Gouin, who had prudently entered a second time at Portneuf, keeps that seat and his government; Armand Lavergne comes in with him. The premier of Quebec will now be cross-examined every sitting week by the man who has spent five years accusing his party of selling the forests, and the reporters' gallery at Quebec has never had to turn people away before."
 can_dnc_e.3.a: "Let him speak. Every word is reprinted in Ontario as well."
 can_dnc_e.3.b: "Find Gouin the members to answer him."
 can_dnc_e.4.t: "The Lord's Day Act Reaches the Parishes"
 can_dnc_e.4.d: "Assented on 13 July 1906 and in force from 1 March 1907, the Act closes shops, trains and amusements on Sunday under the federal criminal law, and leaves every prosecution to the provincial attorneys general. The Lord's Day Alliance that carried it is Protestant and Ontarian. The parishes of the Saint Lawrence keep a Sunday of their own, with the market held after high mass and the tavern open behind a curtain. Quebec's attorney general has the file on his desk and no intention of opening it."
 can_dnc_e.4.a: "Quebec will prosecute at Quebec, or not at all."
 can_dnc_e.4.b: "The criminal law is one law. Press the province."
 can_dnc_e.4.c: "Instruct the province to prosecute, and count the convictions."
 can_dnc_e.4.e: "Let it sleep in Quebec. There are better quarrels."
 can_dnc_e.5.t: "Sixty-Five, and the Rest Divided By It"
 can_dnc_e.5.d: "Section 51 of the British North America Act fixes Quebec at sixty-five members and makes that number the divisor for every other province. The redistribution after the census of 1901 cost Ontario six seats and Quebec none, and the census of 1911 will cost it more. Whether the figure is a bargain of Confederation or an accident of arithmetic, only the Parliament at Westminster can amend it, and Westminster has never been asked to amend it by anybody."
 can_dnc_e.5.a: "Tell London the sixty-five are not open to discussion."
 can_dnc_e.5.b: "Ask the Colonial Office what it would take to reopen section 51."
 can_dnc_e.6.t: "Sifton Puts His Resignation on the Table"
 can_dnc_e.6.d: "Clifford Sifton has held the Interior for eight years and three months and has filled the West with the settlers he chose himself. On 27 February 1905 he resigns rather than sit in a cabinet that guarantees separate schools on the model of 1875. He will not cross the floor. He will sit behind the government and speak on the West whenever the West is mentioned, which is worse for a ministry than an enemy on the other side."
 can_dnc_e.6.a: "Keep the clause. Let him go."
 can_dnc_e.6.b: "Bring him back. The clause can be worded again."
 can_dnc_e.7.t: "Foster's Resolution, and the Member for Jacques-Cartier"
 can_dnc_e.7.d: "George Eulas Foster's resolution comes before the House on 29 March 1909: a naval service of Canada's own rather than a contribution in money to the Admiralty. The government has amended it until every man in the chamber can read it as he pleases, Ontario as a contribution to the Empire and Quebec as a refusal to contribute. Frederick Monk, member for Jacques-Cartier, will not accept the ambiguity, and says so twice: nothing at all until the electors have been asked."
 can_dnc_e.7.a: "Whip it through. Unanimity is worth the price."
 can_dnc_e.7.b: "Give Monk thirty days and a free vote."
 can_dnc_e.8.t: "The Free Vote on the Naval Service"
 can_dnc_e.8.d: "Thirty days have run and the whips are off. Monk has spent them in the Quebec ridings and the Toronto News has spent them counting French-speaking members and printing the totals. However the House divides tonight, the division list will be published in both languages tomorrow and read in both provinces as a census of loyalty rather than a vote on a fleet."
 can_dnc_e.8.a: "The House votes as Quebec asked, and London is told so."
 can_dnc_e.8.b: "The House votes the Empire's way, and Quebec is counted."
 can_dnc_e.10.t: "A Petition From Toronto on Section 51"
 can_dnc_e.10.d: "The Colonial Office has before it a petition from Ontario editors, boards of trade and two hundred municipal councils. The sixty-five seats of section 51 give one province a veto on the arithmetic of the whole Dominion, and only the Parliament at Westminster can amend the British North America Act. The difficulty is that the Canadian ministry has just declared the figure closed. To hear the petition is to overrule a Dominion government on a question of race, in public."
 can_dnc_e.10.a: "The Act is theirs to live with. File it."
 can_dnc_e.10.b: "It will be read at the table. Let Ottawa explain itself."
 can_dnc_e.11.t: "Ottawa Asks Us to Reopen the Act"
 can_dnc_e.11.d: "A Canadian ministry formally requests that Westminster amend section 51 of the British North America Act and end the guarantee of sixty-five Quebec seats. The request is regular in form, and it is the first time a Dominion has asked the imperial Parliament to reduce the representation of one of its own peoples. Every colony that contains a minority will read the answer with attention. Ireland will read it first, and South Africa the week after."
 can_dnc_e.11.a: "Refuse. We do not legislate for one race against another."
 can_dnc_e.11.b: "The Colonial Office will hear a revision."
 can_dnc_e.12.t: "Westminster Will Not Touch the Act"
 can_dnc_e.12.d: "The reply runs to four lines. The British North America Act stands as it is, the representation of Quebec is not a matter on which the imperial Parliament proposes to legislate, and the petition is filed. Every parish paper in the province prints the despatch entire, and Quebec understands that its sixty-five members are guaranteed by the same Crown it is being asked to build ships for."
 can_dnc_e.12.a: "The guarantee is worth exactly what it always was."
 can_dnc_e.13.t: "The Request Is Refused"
 can_dnc_e.13.d: "Downing Street will not amend section 51. The despatch is courteous, mentions the Quebec Act of 1774 in passing, and observes that no Dominion has previously invited the imperial Parliament to reduce the representation of a minority within its own borders. Ottawa has spent its credit in London and been given a lesson in constitutional history in exchange for it."
 can_dnc_e.13.a: "Then we shall govern with the sixty-five."
 can_dnc_e.14.t: "Quebec Learns That London Will Hear It"
 can_dnc_e.14.d: "The news that Westminster has agreed to read the Ontario petition reaches Montreal before it reaches the Prime Minister. Le Nationaliste prints the names of the two hundred councils that signed it, in columns, over four numbers. If the guarantee of sixty-five members can be debated in another country then it is not a guarantee at all, and the province would like to know what its government proposes to do while the imperial Parliament makes up its mind."
 can_dnc_e.14.a: "Say nothing, and let the ninety days pass."
 can_dnc_e.14.b: "Send Fitzpatrick to London to be heard against it."
 can_dnc_e.15.t: "The Petition Lapses at Westminster"
 can_dnc_e.15.d: "Ninety days, two questions in the Commons at Westminster, no bill and no debate. The session ends, the petition dies on the table, and the sixty-five seats stand. Quebec has watched its own constitution discussed in a foreign capital and survive the discussion. Ontario has learned that the Colonial Office will not do its counting for it."
 can_dnc_e.15.a: "It stands. And everybody now knows it is only a custom."
 can_dnc_e.16.t: "The Colonial Office Will Hear a Revision"
 can_dnc_e.16.d: "Whitehall replies that an amendment to section 51 is not impossible, provided it comes up as a formal address from the Parliament of Canada and provided the Canadian ministry accepts the consequences of it. Ottawa now has leave to do what no Dominion government has ever done: legislate down the weight of one of its own peoples, with imperial assistance and in the light of day."
 can_dnc_e.16.a: "Draw the address. The Representation Act will be amended."
 can_dnc_e.16.b: "We have the leave. We shall not use it this session."
 can_dnc_e.17.t: "Quebec City Answers the Cut"
 can_dnc_e.17.d: "The Assembly sits through the night, the Quebec Chronicle and L'Evenement print the same figure for once in their lives, and by morning there are ten thousand people on the Esplanade in the rain. Seats gone by a statute passed at Ottawa with London's leave. Lavergne calls it the end of the bargain of 1867 and Bourassa, who contradicts him on principle, does not contradict him."
 can_dnc_e.17.a: "Let them shout. The Act is passed."
 can_dnc_e.17.b: "Promise the province a hearing before the next redistribution."
 can_dnc_e.20.t: "The Canadians Come to the Quai d'Orsay"
 can_dnc_e.20.d: "Fielding and Brodeur signed a commercial treaty at Paris on 19 September 1907 under the cover of His Britannic Majesty's ambassador. This delegation asks for more than schedules and asks for itself: agreges for the colleges of the West, officers to instruct a French-speaking militia, a consulate at Quebec with a man of rank in it. It is a colony of the King asking the Republic for cadres, and the British embassy in the rue du Faubourg Saint-Honore has not been informed."
 can_dnc_e.20.a: "There are a million and a half cousins over there. Give them what they ask."
 can_dnc_e.20.b: "The treaty, and nothing London could call a scandal."
 can_dnc_e.20.c: "Let them ask through their own government first."
 can_dnc_e.21.t: "Paris Answers With Both Hands"
 can_dnc_e.21.d: "The Republic sends what was asked for and a little more: agreges for the colleges, two officers of instruction for the militia, and a consul general at Quebec of ministerial rank. The Havas despatch calls it the return of France to the Saint Lawrence after a hundred and forty-six years, a phrase chosen by somebody who knew it would be read in London before it was read in Montreal."
 can_dnc_e.21.a: "Let it be read in London."
 can_dnc_e.22.t: "The Treaty, and Nothing More"
 can_dnc_e.22.d: "Paris signs the schedules and declines the rest. There will be reductions on wine, silk and machinery, and there will be no professors, no instructing officers and no consulate of rank. The Quai d'Orsay has no wish to be caught recruiting inside the British Empire in the fifth year of an understanding with it."
 can_dnc_e.22.a: "Trade, then. It is more than we had on Monday."
 can_dnc_e.23.t: "London First, Say the French"
 can_dnc_e.23.d: "The Quai d'Orsay receives the Canadians with every courtesy and refers them to the Foreign Office. The Republic will discuss nothing with a Dominion that has not been announced through the British embassy. The delegation comes home having learned precisely what a colony is worth at a European ministry, which was not what it was sent to find out."
 can_dnc_e.23.a: "We are not a country until somebody treats us as one."
 can_dnc_e.24.t: "Ottawa Asks France for Emigrants"
 can_dnc_e.24.d: "The Interior wants the West settled by families who will keep its language: Bretons, Normans, Walloons, the French of Lorraine, with agents paid by the head exactly as Sifton paid them for Galicians. France loses some twenty thousand souls a year to emigration and believes she can spare none of them. Her own countryside is emptying into her own cities, and her regiments are short."
 can_dnc_e.24.a: "Let those who wish to go, go, and give them the agents."
 can_dnc_e.24.b: "France has no men to give away."
 can_dnc_e.25.t: "The Sailings From Le Havre"
 can_dnc_e.25.d: "Offices open at Le Havre, Rennes and Nancy, and the first sailings put farmers ashore at Quebec for Saint-Boniface and the valley of the Saskatchewan. It is not a flood and it does not need to be. Fifteen thousand French-speaking settlers west of the Red River change what a school ordinance is an argument about."
 can_dnc_e.25.a: "Fifteen thousand, and a reason to keep the schools."
 can_dnc_e.26.t: "France Keeps Her Peasants"
 can_dnc_e.26.d: "The reply is a lecture on depopulation with the figures attached. The Republic will not encourage emigration while its own classes of recruits are thin, and suggests that the Dominion apply to Belgium. A year of negotiation has produced a courteous refusal and a table of French birth rates for the Ottawa files."
 can_dnc_e.26.a: "Belgium, then. Or the parishes of Quebec."
 can_dnc_e.30.t: "The Grand Lodge Gives Ottawa Sixty Days"
 can_dnc_e.30.d: "The Grand Orange Lodge of British America resolves that a statute of the Parliament of Canada naming one province the home of a nation is the Conquest repealed by act of Parliament. There are two hundred thousand members in Ontario and the West, a great many of them Liberal voters and a considerable number of them militia officers. Ottawa has sixty days to withdraw the statute, or the lodges will run candidates of their own in every riding west of the Ottawa river."
 can_dnc_e.30.a: "Amend it. Keep the schools, strike out the rest."
 can_dnc_e.30.b: "The statute stands. Let them find their candidates."
 can_dnc_e.30.c: "Say nothing for sixty days."
 can_dnc_e.31.t: "The Sixty Days Run Out"
 can_dnc_e.31.d: "The lodges march on the twelfth of July in numbers nobody has seen in thirty years, and in four Ontario towns the militia is confined to barracks because too many of its officers are in the procession. There is no more silence to be had. The government amends the statute now, or it governs against the province that pays a third of its customs revenue and elects a fifth of its members."
 can_dnc_e.31.a: "Then we govern against them."
 can_dnc_e.31.b: "Amend it. Late, and at the full price."
 can_dnc_e.35.t: "Montreal in the Street"
 can_dnc_e.35.d: "The cheque for the Admiralty was voted on a Thursday. By Saturday the students of Laval and the printers of Saint-Jacques have the Champ de Mars, the windows of the Star are out on Saint James Street, and the mayor has telegraphed for troops. The militia at Montreal is the 65th Carabiniers Mont-Royal, and its men live in the streets the mayor wants cleared."
 can_dnc_e.35.a: "Call out the Carabiniers and let them face their own."
 can_dnc_e.35.b: "No troops. The constables, and patience."
 can_dnc_e.36.t: "A Canadian Cheque at the Admiralty"
 can_dnc_e.36.d: "Ottawa has voted a contribution over the heads of its French-speaking members, which is more than New Zealand's cruiser cost and quite unlike anything Australia has offered, since Australia means to build her own. Their Lordships must decide what to give for it. A ship in Canadian colours would make the money look like a partnership. Asking for more of it would make the money look like tribute, which is what Bourassa is calling it in print this week."
 can_dnc_e.36.a: "Transfer a cruiser. Let them see something for the money."
 can_dnc_e.36.b: "Thank them, and ask what they will vote next year."
 can_dnc_e.37.t: "A Cruiser Comes Over"
 can_dnc_e.37.d: "The Admiralty transfers a light cruiser to the Dominion, with a British crew to bring her across and Canadian ratings to be trained aboard her at Halifax. She comes up the harbour to a great deal of noise in Toronto and complete silence in Quebec, where the papers print her cost in dollars per ton and never once print her name."
 can_dnc_e.37.a: "Halifax has a ship of its own at last."
 can_dnc_e.38.t: "The Admiralty Asks What Comes Next"
 can_dnc_e.38.d: "Their Lordships are grateful, observe that the sum is rather less than a Dreadnought costs to build, and inquire what the Dominion proposes to vote in the coming estimates. Ottawa has paid a political price at home for a cheque, and the cheque has bought a request for another cheque."
 can_dnc_e.38.a: "Tell them we shall consider it, and hope they forget."
 can_dnc_e.40.t: "The Resolution of the Legislative Assembly"
 can_dnc_e.40.d: "At Quebec, in the Assembly: a province taxed for a fleet its members voted against is not governed by its own consent, and its representatives will consider by what means that consent may be recovered. Gouin does not vote. Lavergne asks for a mandate on the question and gets a cheer instead of an answer. The word used in the text is autonomy. Every newspaper outside the province prints the word separation."
 can_dnc_e.40.a: "Answer nothing. It is a resolution, not a rifle."
 can_dnc_e.40.b: "Warn the militia districts and count the rifles."
 can_dnc_e.41.t: "The Quebec Resolution Reaches Whitehall"
 can_dnc_e.41.d: "A provincial legislature of the senior Dominion has questioned by what right it is governed, and the occasion of it is a contribution to His Majesty's Navy. The Committee of Imperial Defence would like the ships. The Colonial Office would like no precedent of a Dominion coming apart over the price of them, seven years after South Africa was put together at such expense."
 can_dnc_e.41.a: "Stand by the Canadian government, and say so publicly."
 can_dnc_e.41.b: "Advise Ottawa to concede, and say so quietly."
 can_dnc_e.42.t: "London Stands by Ottawa"
 can_dnc_e.42.d: "The despatch is published in full: His Majesty's Government has entire confidence in its Canadian ministers and regards the internal arrangements of the Dominion as the Dominion's own affair. A garrison battalion is put ashore at Halifax at imperial expense in the same week, which the despatch does not mention and which every editor in Montreal mentions twice."
 can_dnc_e.42.a: "The Empire has taken a side."
 can_dnc_e.43.t: "Whitehall Counsels Concessions"
 can_dnc_e.43.d: "The despatch is confidential and perfectly clear. A statute of guarantees for Quebec would cost less this winter than a militia in the streets of Montreal would cost in an election year, and the Admiralty can wait a season for its money. Ottawa is being advised by London to buy off its own province, in writing, over a signature it will have to keep."
 can_dnc_e.43.a: "Take the advice. Draw the statute."
 can_dnc_e.43.b: "We are not governed from Downing Street."
 can_dnc_e.44.t: "The Quebec Question at the White House"
 can_dnc_e.44.d: "There are close to a million people of French-Canadian descent in New England, and their newspapers at Fall River and Manchester have discovered the resolution of the Assembly. The State Department is asked what the United States would do if a province of Canada declared itself. There is a boundary waters treaty signed this January, a tariff negotiation coming, and a congressional election next year."
 can_dnc_e.44.a: "It is a domestic affair of the British Empire. Say so."
 can_dnc_e.44.b: "Offer our good offices to both parties."
 can_dnc_e.44.c: "A free people may be recognised."
 can_dnc_e.45.t: "Washington Says Nothing"
 can_dnc_e.45.d: "The Secretary of State observes that the internal arrangements of the Dominion of Canada are no business of the United States, and declines to receive the delegation from Fall River. Ottawa is relieved and files the note carefully, in a drawer where it can be found again in a hurry."
 can_dnc_e.45.a: "One frontier we need not watch."
 can_dnc_e.46.t: "Washington Offers Its Good Offices"
 can_dnc_e.46.d: "The offer is made privately and is in the New York papers within the week: the United States would be glad to see the parties reconciled and stands ready to be of assistance. Nothing in the world is more likely to make Ottawa settle its own quarrel than the prospect of settling it in front of Washington."
 can_dnc_e.46.a: "Settle it ourselves, and settle it quickly."
 can_dnc_e.46.b: "Decline, and thank them coldly."
 can_dnc_e.47.t: "The Republic Would Recognise a Free Quebec"
 can_dnc_e.47.d: "It is said at a dinner and printed in the Boston papers three days later: a Quebec that declared itself would find a minister received at Washington. No note is sent, and none is needed. The Assembly reads it, the Colonial Office reads it, and the line from Rouses Point to Beebe Plain stops being a customs arrangement and becomes a military problem."
 can_dnc_e.47.a: "Then we have two questions, and one of them is a frontier."
 can_dnc_e.48.t: "The Resolution Read in Paris"
 can_dnc_e.48.d: "Le Temps prints the text of the Assembly's resolution and three deputies ask in the Chamber what France owes the descendants of her colonists. The Republic is five years into an understanding with Great Britain and has Morocco on its hands. Sympathy costs nothing. Anything beyond sympathy costs the Entente, and the Quai d'Orsay knows the exact price."
 can_dnc_e.48.a: "Sympathy in the press, and nothing at the ministry."
 can_dnc_e.48.b: "A word to the British ambassador. A careful one."
 can_dnc_e.48.c: "Subscriptions and volunteers are not acts of state."
 can_dnc_e.49.t: "The French Press Takes an Interest"
 can_dnc_e.49.d: "For a fortnight the Paris papers are full of the Saint Lawrence: the fidelity of a people abandoned in 1763, the schools of Manitoba, a portrait of Bourassa in Le Temps with his arms folded. Nothing is sent and nothing is promised, and every word of it is reprinted in Montreal within three weeks at a cent a copy."
 can_dnc_e.49.a: "Words cross the ocean cheaply."
 can_dnc_e.50.t: "A Word at the Foreign Office"
 can_dnc_e.50.d: "The French ambassador mentions, in the course of a conversation about something else, that opinion at home follows the Canadian schools question with feeling. The Foreign Office notes it and passes it to Ottawa, and Ottawa learns that a domestic quarrel has become an item in somebody else's diplomatic correspondence."
 can_dnc_e.50.a: "We are a paragraph in the Entente file."
 can_dnc_e.51.t: "Subscriptions and Volunteers"
 can_dnc_e.51.d: "The government of the Republic does nothing and permits everything. A committee in Paris opens a subscription, a shipping agent at Le Havre finds berths for men who do not state their trade, and the customs at Quebec begin opening crates consigned to a rifle club at Trois-Rivieres."
 can_dnc_e.51.a: "The government of France has done nothing. Officially."
 can_dnc_e.52.t: "Sixty Days at the Assembly"
 can_dnc_e.52.d: "The sixty days are up and the Assembly meets. What it does with them depends on what Ottawa has done in the meantime and on how far the two nations have already been driven apart. The galleries are full, the militia districts have been warned, and the telegraph office at Quebec has put on extra clerks for the night."
 can_dnc_e.52.a: "The statute is on the table. The resolution is withdrawn."
 can_dnc_e.52.b: "Nothing has been conceded. The Assembly votes for a convention of the people."
 can_dnc_e.52.c: "The resolution stands, and the province waits another season."
 can_dnc_e.53.t: "The Saint Lawrence"
 can_dnc_e.53.d: "Who holds Montreal and Quebec."
 can_dnc_e.53.a: "Continue."
 can_dnc_e.54.t: "Montreal Falls"
 can_dnc_e.54.d: "The Milice Nationale holds the Champ de Mars for eleven days and the bridges for four more. When the Foot Guards come into Place Jacques-Cartier the Assembly has already dispersed itself and Bourassa is not found in the city. The province is administered from Ottawa by a commissioner, and the word province is used in every despatch with particular care."
 can_dnc_e.54.a: "It is held. It will have to be held for a generation."
 can_dnc_e.55.t: "The Winter of Independence"
 can_dnc_e.55.d: "There is no more army to send and no more will to send it. Ottawa signs what nobody in the House of March 1900 believed would ever be signed: Quebec is a state, the Saint Lawrence is a frontier, and the Maritimes are on the far side of another country's customs house. The Intercolonial timetable is reprinted with two international stops on it."
 can_dnc_e.55.a: "Sign it. There is nothing else left to sign."
 can_dnc_e.56.t: "Ottawa Recognises Us"
 can_dnc_e.56.d: "The instrument is read from the balcony of the Parliament at Quebec and the crowd on the Grande Allee is still there at three in the morning. A people engaged by an order in council in 1899 without being asked is now asked for nothing by anybody. There is no treasury, no army worth the name and no doubt whatever."
 can_dnc_e.56.a: "Now we have to learn to govern."
 can_dnc_e.57.t: "Quebec Rises"
 can_dnc_e.57.d: "Troops are moving on Montreal. The Legislative Assembly of Quebec has declared the province no longer bound to a Parliament that taxed it for a fleet its members voted against, and the Dominion of Canada has answered with the militia. The despatches out of Halifax are three days old, the ones out of Montreal are censored, and the New England papers are printing subscription lists."
 can_dnc_e.57.a: "The senior Dominion of the Empire is at war with itself."
 can_dnc_e.58.t: "The Riot Act Is Read"
 can_dnc_e.58.d: "The proclamation is read from the courthouse steps and the hour is timed on a subaltern's watch. At the end of the hour the Champ de Mars is fuller than it was at the beginning. The order to fire is given at twenty past four in the afternoon. By nightfall the Assembly has voted itself the government of a state, and the militia of two nations is in the field between Montreal and the border."
 can_dnc_e.58.a: "Then it is a war, and we began it."
#Leaders
 POLITICS_HENRI_BOURASSA_DESC: "Member for Labelle, founder in spirit of the Ligue nationaliste, and the man who asked the Commons whether a people may be engaged by an order in council. He wanted two nations inside one Dominion and was given a state instead."
 #DNC Canada - thematic branches (army / navy / economy)
 CANDNC_army_the_south_african_contingents: "The State of the Militia"
 CANDNC_army_the_south_african_contingents_desc: "We take stock of the force we have: sixty thousand part-time men, a scatter of village companies drilled a fortnight a year under officers who answer to no one in particular. It is not an army — not yet. Everything that follows begins here, with the decision to make one."
 CANDNC_army_the_militia_act: "The Militia Act"
 CANDNC_army_the_militia_act_desc: "We rewrite the militia law. No longer must the man at the head of our forces be a British regular seconded to us — the command may fall to a Canadian, and a Militia Council of ministers and soldiers will govern the force in his stead. We take the running of our own army into our own hands."
 CANDNC_army_keep_the_general_officer_commanding: "Keep the General Officer Commanding"
 CANDNC_army_keep_the_general_officer_commanding_desc: "We leave the command where it has always sat — with a British General Officer seconded from the imperial establishment, a professional soldier who answers to soldiers and not to the floor of the Commons. Ottawa keeps a steadying hand from London on its militia, and buys the instruction of the finest army in the world at the price of a little of its own independence."
 CANDNC_army_service_within_the_dominion: "Service Within the Dominion"
 CANDNC_army_service_within_the_dominion_desc: "We bind the militia to the ground it stands on. A man enrolled may be called out to defend the Dominion and its borders, and no further — not to a quarrel across an ocean he never chose. The force we build is a shield for our own homes, and the country trusts it the more for knowing exactly where it will and will not be sent."
 CANDNC_army_liable_to_serve_abroad: "Liable to Serve Abroad"
 CANDNC_army_liable_to_serve_abroad_desc: "We strike the words that chain the militia to the shoreline. A man enrolled is liable to serve wherever the Crown has need of him, ocean or no ocean. We ask more of the citizen than his fathers were ever asked — and in return we hold a force that can march the day the Empire calls."
 CANDNC_army_the_royal_military_college: "The Royal Military College"
 CANDNC_army_the_royal_military_college_desc: "We fill the benches at Kingston and mean the diplomas to count. The Royal Military College will turn out engineers, gunners, and staff-trained officers fit to stand beside any Sandhurst man, and we will stop borrowing every technical head we need. We commit to growing our own officer corps rather than renting one."
 CANDNC_army_the_first_canadian_chief_of_staff: "A Canadian Chief of Staff"
 CANDNC_army_the_first_canadian_chief_of_staff_desc: "We plant a General Staff on Canadian soil and set a Chief of the General Staff at its head — a mind whose whole work is the plan, the map, and the mobilization, not the daily paper-shuffle of the department. For the first time the country's defence is thought through in advance rather than improvised on the day. We commit to soldiering as a profession of planning."
 CANDNC_army_take_over_the_imperial_fortresses: "Take Over the Imperial Fortresses"
 CANDNC_army_take_over_the_imperial_fortresses_desc: "The imperial garrisons sail for home, and the keys to Halifax and Esquimalt pass to us. We man the coast batteries ourselves, feed and drill the gunners ourselves, and answer for the two ocean gates of the Dominion. The fortresses are ours now — and so is every consequence of losing them."
 CANDNC_army_the_strathcona_trust: "The Strathcona Trust"
 CANDNC_army_the_strathcona_trust_desc: "Lord Strathcona's gift endows drill, physical training, and the rifle in the public schools, and we take the endowment gladly. Let every boy learn to stand in a rank and hold a foresight steady long before any sergeant sees him. We commit to raising marksmen from the schoolroom up."
 CANDNC_army_the_services_of_an_army: "The Services That Make an Army"
 CANDNC_army_the_services_of_an_army_desc: "An army is not its rifles alone. We stand up the engineers, the signallers, the medical and army service corps, and the ordnance men who keep the whole in the field — the unglamorous trades without which the fighting line starves and falls silent. We commit to building a whole army, not merely its front rank."
 CANDNC_army_concentrate_at_petawawa: "Concentrate the Force at Petawawa"
 CANDNC_army_concentrate_at_petawawa_desc: "We buy the sand plains on the Ottawa and make Petawawa the great camp of the force — room enough to range the guns at their true distances and manoeuvre brigades as brigades, not as scattered village companies. The militia will train together or not at all. We commit the money to a permanent ground where an army can learn its trade."
 CANDNC_army_the_ross_rifle: "Adopt the Ross Rifle"
 CANDNC_army_the_ross_rifle_desc: "We arm the militia with the Ross — a straight-pull rifle designed and made on Canadian soil, in a Canadian plant, beholden to no British contract. It is the finest target rifle in the world and the country will build every one of them itself. We take our small arms into our own hands, and we will answer for how they behave when the mud comes."
 CANDNC_army_the_lee_enfield: "Order the Lee-Enfield"
 CANDNC_army_the_lee_enfield_desc: "We put the proven service rifle in our men's hands — the Lee-Enfield the whole Empire carries, sound in the mud and the cold and the rapid fire, and interchangeable to the last cartridge with the armies we would fight beside. We buy reliability off the imperial shelf rather than gamble on a rifle of our own. Our men will shoot what works."
 CANDNC_army_the_dominion_arsenal: "The Cartridge Factory at Quebec"
 CANDNC_army_the_dominion_arsenal_desc: "We will not fire a shot we cannot make ourselves. The Dominion Arsenal at Quebec is set to turning out cartridges by the million, and the cordite and the cases and the caps are made under our own roof. Whatever rifle sits on our men's shoulders, the ammunition behind it will be Canadian."
 CANDNC_army_a_nation_of_marksmen: "A Nation of Marksmen"
 CANDNC_army_a_nation_of_marksmen_desc: "We stake the defence of the Dominion on the citizen who shoots. Rifle associations in every town, the ranges busy on Saturdays, a whole people quietly competent with a foresight and a trigger — this is cheaper than barracks and truer to what we are. We choose the armed citizen over the standing soldier."
 CANDNC_army_a_permanent_force_worth_the_name: "A Permanent Force Worth the Name"
 CANDNC_army_a_permanent_force_worth_the_name_desc: "The citizen militia is brave and untaught; we will pay for a permanent force that is neither. A real standing cadre — cavalry, artillery, and infantry kept under arms the year round — to instruct the militia, hold the fortresses, and be ready on the first day rather than the ninetieth. We choose the professional soldier, and we open the treasury to keep him."
 CANDNC_navy_the_fisheries_protection_service: "The Fisheries Protection Service"
 CANDNC_navy_the_fisheries_protection_service_desc: "We already keep armed cruisers on the Atlantic and Pacific to chase poachers off the banks and sealers out of our waters. Let them be more than a customs patrol — let them be the seed of a service. Every gun we mount on a fishery cruiser is the first plank of a navy."
 CANDNC_navy_a_navy_under_our_own_flag: "A Navy Under Our Own Flag"
 CANDNC_navy_a_navy_under_our_own_flag_desc: "A dominion that cannot guard its own harbours is not yet a nation. We will lay down warships under our own flag, crewed by our own men, answerable to Ottawa and not to Whitehall. The hulls will be Canadian, and so will the command."
 CANDNC_navy_the_new_zealand_example: "The New Zealand Example"
 CANDNC_navy_the_new_zealand_example_desc: "New Zealand writes a cheque and the Empire lays a battlecruiser; we can do the same. A gift to the common fleet buys protection at once, without the price of a yard or a college. We contribute to the navy that already rules the sea rather than build a lesser one beside it."
 CANDNC_navy_no_naval_policy_without_the_people: "No Naval Policy Without the People"
 CANDNC_navy_no_naval_policy_without_the_people_desc: "No ship shall be laid down until the people have spoken at the polls. We will not commit the country to fleets and estimates on the word of a cabinet alone. The naval question goes to the electors, and until they answer it, we build nothing."
 CANDNC_navy_the_yards_at_halifax_and_esquimalt: "The Yards at Halifax and Esquimalt"
 CANDNC_navy_the_yards_at_halifax_and_esquimalt_desc: "The Admiralty offers us its dockyards at Halifax and Esquimalt; we take them, and we build in them. A ship built on Canadian ways employs Canadian hands and leaves the skill in Canadian ports. It costs us more and comes slower, but the industry stays home."
 CANDNC_navy_order_from_the_british_yards: "Order From the British Yards"
 CANDNC_navy_order_from_the_british_yards_desc: "Why raise a yard from nothing when the Clyde and Barrow can deliver a finished hull within the year? We order abroad, take the ships sooner and cheaper, and spare ourselves the price of building the builders. The steel is British, but the ensign is ours."
 CANDNC_navy_a_seat_at_the_admiralty_table: "A Seat at the Admiralty Table"
 CANDNC_navy_a_seat_at_the_admiralty_table_desc: "The cheque is not charity — it buys us a chair. In return for what we give, a Canadian is heard when the Admiralty plans the dispositions of the fleet. We pay in pounds and are answered in a voice at the table."
 CANDNC_navy_the_coast_left_to_the_admiralty: "The Coast Left to the Admiralty"
 CANDNC_navy_the_coast_left_to_the_admiralty_desc: "With no navy to fund, the estimate is freed for the plough and the rail. The money that would have bought cruisers opens the west instead, and the Royal Navy keeps the stations it has always held. We guard the prairie and leave the sea to London."
 CANDNC_navy_the_hydrographic_survey: "The Hydrographic Survey"
 CANDNC_navy_the_hydrographic_survey_desc: "We cannot defend a coast we have not charted. Our own vessels will sound the channels, mark the shoals and print the charts, from the Gulf to the Inside Passage. A navy begins with knowing the water it floats on."
 CANDNC_navy_the_coastal_wireless_stations: "The Coastal Wireless Stations"
 CANDNC_navy_the_coastal_wireless_stations_desc: "A ship beyond the horizon is a ship we cannot reach. We string a chain of wireless stations along both coasts so that Ottawa can speak to any hull at sea. The Marconi masts are as much a part of the service as the guns."
 CANDNC_navy_a_naval_militia: "A Naval Militia"
 CANDNC_navy_a_naval_militia_desc: "We need not a standing fleet to man a few ships, but a reserve we can call. Fishermen, lakemen and dock hands drilled in the off-season give us crews at a fraction of the cost. The navy sleeps in the ports and wakes when it is wanted."
 CANDNC_navy_a_permanent_naval_service: "A Permanent Naval Service"
 CANDNC_navy_a_permanent_naval_service_desc: "A ship half-manned by weekend sailors is a ship half-lost. We will keep a permanent professional force, and we bring home a Canadian risen in the Royal Navy to command it. The cost in patronage and pay we accept; the fleet must be ready the day before the war, not the day after."
 CANDNC_navy_the_naval_service_act: "The Naval Service Act"
 CANDNC_navy_the_naval_service_act_desc: "One act to bind it all: a Naval Service of Canada, a department, a board, and a director answerable to Parliament. What was a scatter of fishery cruisers and good intentions becomes a service in law. From this day the country owns a navy, and must answer for it."
 CANDNC_navy_niobe_and_rainbow: "Niobe and Rainbow"
 CANDNC_navy_niobe_and_rainbow_desc: "Two cruisers to begin — Niobe for the Atlantic, Rainbow for the Pacific — one ensign on each ocean. They are not new and they are not many, but they are ours, and cadets will learn the sea in them. Every navy starts with the first two ships it can crew."
 CANDNC_navy_the_royal_naval_college: "The Royal Naval College"
 CANDNC_navy_the_royal_naval_college_desc: "Ships without officers are hulls without minds. We open a college at Halifax and take in cadets to raise Canadian officers from our own boys, not borrow them from the fleet. The men who will one day command must be schooled at home."
 CANDNC_navy_a_fleet_unit_of_our_own: "A Fleet Unit of Our Own"
 CANDNC_navy_a_fleet_unit_of_our_own_desc: "We finish what we began: a self-contained fleet unit, a cruiser squadron that can keep the sea on its own account. It is dear, and it draws the yards and the treasury hard, but it is a navy in the full meaning of the word. Canada will answer for her own coasts."
 CANDNC_navy_dreadnoughts_for_the_empire: "Dreadnoughts for the Empire"
 CANDNC_navy_dreadnoughts_for_the_empire_desc: "The North Sea, not the North Atlantic, is where the war will be decided, and a scatter of cruisers cannot weigh there. We vote the money to the common fleet and let it buy dreadnoughts under one command. Better a share in a battle line than a squadron of our own that fights alone."
 CANDNC_eco_the_last_best_west: "The Last Best West"
 CANDNC_eco_the_last_best_west_desc: "We throw the gates of the prairie open and paper Europe and the American Midwest with one promise — a hundred and sixty free acres to any man who will break the sod. We ask no pedigree, only that the land be farmed. This commits us to filling the West faster than any government has ever filled a frontier."
 CANDNC_eco_wheat_for_the_empire: "Wheat for the Empire"
 CANDNC_eco_wheat_for_the_empire_desc: "We turn the prairie harvest east across the Atlantic, to the millers of Liverpool and the tables of the Empire. The Mother Country takes our wheat at a known price and asks little in return. This binds the West's fortune to the imperial market rather than the mills of Minnesota."
 CANDNC_eco_wheat_for_the_continent: "Wheat for the Continent"
 CANDNC_eco_wheat_for_the_continent_desc: "We send the harvest to the nearest and hungriest buyer — the milling cities of the American Northwest, where the price is set and the cars run south all winter. The continent pays better than the Empire ever will. This ties the West's prosperity to a market that sits in another man's capital."
 CANDNC_eco_the_sheepskin_coat_men: "The Men in Sheepskin Coats"
 CANDNC_eco_the_sheepskin_coat_men_desc: "We want the stalwart peasant in the sheepskin coat, born to the soil, whose forefathers have been farmers for ten generations. Galician, Doukhobor, Ruthenian — we ask only that they break land no Englishman would touch. This fills the West with strangers, and commits us to making Canadians of them afterward."
 CANDNC_eco_a_british_west: "A British West"
 CANDNC_eco_a_british_west_desc: "We hold the West for the British race and the American farmer who is half-British already. Better a slower filling than a Babel on the plains — we shut the door on the peoples who will not melt. This keeps the prairie loyal and English, and forgoes the sheer numbers the open door would bring."
 CANDNC_eco_the_marquis_wheat: "Marquis Wheat"
 CANDNC_eco_the_marquis_wheat_desc: "Our cerealist crosses Red Fife with an early Indian strain until he holds a wheat that ripens a full week ahead of the frost. Marquis throws the northern parkland and the dry belt open to the plough. This makes a granary of ground the last generation wrote off as wasteland."
 CANDNC_eco_bounties_of_iron_and_steel: "Bounties of Iron and Steel"
 CANDNC_eco_bounties_of_iron_and_steel_desc: "We pay a bounty on every ton of pig iron and steel smelted on Canadian soil, and the furnaces answer at Sydney, at the Soo, at Hamilton. We would sooner subsidise our own smoke than buy another nation's rails. This commits the treasury to raising a steel industry from nothing."
 CANDNC_eco_three_roads_to_the_pacific: "Three Roads to the Pacific"
 CANDNC_eco_three_roads_to_the_pacific_desc: "One railway to the Pacific is not enough for a nation of this width. We back the Grand Trunk Pacific and the Canadian Northern both, and let three lines race for the western trade. This ties the Dominion's credit to a web of rails it may not need for fifty years."
 CANDNC_eco_one_road_is_enough: "One Road Is Enough"
 CANDNC_eco_one_road_is_enough_desc: "My railway minister resigns rather than mortgage the Dominion to a second and third Pacific road, and I let him go knowing he is half right. One good line, and what the state builds with its own hands, will serve. This holds the country back from a debt the next generation would curse us for."
 CANDNC_eco_the_railway_commission: "The Railway Commission"
 CANDNC_eco_the_railway_commission_desc: "We set a board above the railways with power to fix their rates, order their crossings, and hear the shipper's complaint. The roads have grown too great to be left bargaining alone with the farmer. This puts the iron horse under the law at last."
 CANDNC_eco_power_at_cost: "Power at Cost"
 CANDNC_eco_power_at_cost_desc: "The water-power of Niagara belongs to the people, and we will carry it to every town and workshop at the cost of making it — not a cent for the promoter. A public commission strings the lines and reads the meters. This commits the province to owning its own current against the men who would sell it for profit."
 CANDNC_eco_the_syndicate_at_the_falls: "The Syndicate at the Falls"
 CANDNC_eco_the_syndicate_at_the_falls_desc: "Let the men with capital harness the falls and sell the current at whatever the market will bear. Private money builds faster than any commission and asks nothing of the treasury. This hands the greatest waterpower on the continent to a syndicate, and trusts the rich to electrify the nation."
 CANDNC_eco_new_ontario: "New Ontario"
 CANDNC_eco_new_ontario_desc: "Beyond the farmed south lies New Ontario — silver spilling out of the rock at Cobalt, nickel under Sudbury, a clay belt and forests without end. We drive the survey line and the ore road north, and with our own cheap current we will refine our metal at home instead of shipping it raw to New Jersey. This turns the Shield from a barrier into the Dominion's treasure house."
 CANDNC_eco_the_national_policy: "The National Policy"
 CANDNC_eco_the_national_policy_desc: "The tariff that Macdonald raised to shelter Canadian industry, we keep. The factory in Montreal and the mill in Ontario grew up behind the customs house, and we will not expose them now. This commits the Dominion to building its wealth behind a wall."
 CANDNC_eco_the_tariff_wall: "The Tariff Wall"
 CANDNC_eco_the_tariff_wall_desc: "We build the customs wall higher and cut a gate in it for British goods alone. The manufacturer thrives, the Empire trades within the family, and the foreigner pays to come in. This makes the factory owner our firm ally and the western farmer, who buys dear, our grievance to answer."
 CANDNC_eco_the_road_south: "The Road South"
 CANDNC_eco_the_road_south_desc: "We open the road south and let goods cross the line both ways at last. The farmer buys his implements cheap and sells his wheat dear; the continent becomes one market. This lowers the wall the manufacturer hides behind, and stakes our prosperity on trade with the republic."
 CANDNC_eco_the_bank_act_revision: "The Bank Act Revision"
 CANDNC_eco_the_bank_act_revision_desc: "Every ten years the banks' charter comes back to Parliament, and we weigh again how much rope to give the men who hold the nation's money. We renew the compact that lets a handful of chartered houses run our credit. This sets the terms of Canadian money for a decade to come."
 CANDNC_eco_leave_it_to_the_chartered_banks: "Leave It to the Chartered Banks"
 CANDNC_eco_leave_it_to_the_chartered_banks_desc: "We trust the nation's money to the chartered banks, whose branches reach every main street from Halifax to Victoria. They know their business better than any minister could. We ask for no public bank and hold no public reserve of our own. This leaves the Dominion's credit in private hands, for the good years and the bad alike."
 CANDNC_eco_a_public_currency: "A Public Currency"
 CANDNC_eco_a_public_currency_desc: "We will not leave every dollar to a banker's private promise. The Dominion note, backed by the government's gold, shall carry more of the nation's trade — public money for a public trust. This begins to take the printing of currency back from the chartered banks."
 CANDNC_eco_the_emergency_circulation: "Notes for the Harvest"
 CANDNC_eco_the_emergency_circulation_desc: "The crop must move each autumn though the vaults run dry, and this year the panic on Wall Street makes the pinch far worse. We let the banks swell their note issue past the old limit to carry the harvest to port. This patches the money system for the crop season and spares us the runs that are breaking the American banks."
 CANDNC_air_the_aerial_experiment_association: "The Aerial Experiment Association"
 CANDNC_air_the_aerial_experiment_association_desc: "Dr Bell gathers his young engineers on the shore at Baddeck — McCurdy, Baldwin, a builder of motors — and we lend the association a corner of our interest. Powered flight is coming, and it may as well come out of a Canadian workshop. We plant the seed of an air service before anyone believes there will be one."
 CANDNC_air_a_service_for_the_country: "A Service for the Country"
 CANDNC_air_a_service_for_the_country_desc: "Whatever flies from these experiments will fly for Canada first. The machines, the men, the patents — we mean to keep them here, a Canadian art answering to Ottawa. We commit to an aviation of our own before it is even worth owning."
 CANDNC_air_a_service_for_the_empire: "A Service for the Empire"
 CANDNC_air_a_service_for_the_empire_desc: "The aeroplane will be a weapon of the Empire, and Canada's part is to feed it men and machines. We tie our infant aviation to the imperial effort, take our designs and doctrine from London, and ask for a place in the larger service. We build a wing of the Empire's air, not an air force of our own."
 CANDNC_air_the_tetrahedral_kites: "The Tetrahedral Kites"
 CANDNC_air_the_tetrahedral_kites_desc: "Bell flies his great tetrahedral kites off the Bras d'Or, lifting a man on a lattice of red silk cells — ungainly, and pointing the way. The work teaches us more of lift and structure than any textbook can. We fund the strange science, trusting that the kite is the grandfather of the aeroplane."
 CANDNC_air_the_silver_dart: "The Silver Dart"
 CANDNC_air_the_silver_dart_desc: "The Silver Dart lifts off the ice of Baddeck Bay and holds the air for half a mile — the first flight of a heavier-than-air machine anywhere in the Empire, and it is ours. We have flown before Britain, before them all. We commit to standing at the birth of the age of flight, not arriving late to it."
 CANDNC_air_the_petawawa_trials: "The Petawawa Trials"
 CANDNC_air_the_petawawa_trials_desc: "We bring the Silver Dart to the militia camp at Petawawa and fly it before the soldiers, to prove the aeroplane can serve an army. The sand breaks a wheel and the generals are unimpressed — but the case is made in the open, before witnesses. We put the flying machine to the army's test, and let the army decide what it saw."
 CANDNC_air_a_militia_aviation_branch: "A Militia Aviation Branch"
 CANDNC_air_a_militia_aviation_branch_desc: "We will not let the aeroplane fall between the stools. A small aviation branch of the militia is stood up — a handful of officers, a shed, a machine or two — so that when the aeroplane matters, we are not starting from nothing. We commit the army to the air while the air is still a curiosity."
 CANDNC_air_no_use_for_the_aeroplane: "No Use for the Aeroplane"
 CANDNC_air_no_use_for_the_aeroplane_desc: "The Militia Council weighs the aeroplane and finds it a toy — fragile, blind in weather, useless over ground the cavalry already scouts. We spend no money on it, and the machines are left to the sportsmen and the showmen. We put our defence estimate where it does some good, and let others learn to fly at their own expense."
 CANDNC_air_the_canadian_aerodrome_company: "The Canadian Aerodrome Company"
 CANDNC_air_the_canadian_aerodrome_company_desc: "McCurdy and Baldwin set up the Canadian Aerodrome Company at Baddeck and build machines to order — the first aeroplane works in the country. We give them a contract and a reason to stay. Canada will build its own wings, not import every one."
 CANDNC_air_the_flying_canadians: "The Flying Canadians"
 CANDNC_air_the_flying_canadians_desc: "With no service at home, our best young men take their nerve abroad — to Brooklands, to the Wright school, to any flag that will teach them to fly. They will be Canada's aviators in all but the uniform. We lose the men we would not pay for, and watch them make their names under another crest."
 CANDNC_air_a_flying_corps_of_our_own: "A Flying Corps of Our Own"
 CANDNC_air_a_flying_corps_of_our_own_desc: "We raise a flying corps under the Canadian flag — our own machines, our own officers, our own roundel on the wing. It is small and it is dear, but it answers to Ottawa alone. We commit to a Canadian air arm, distinct from any imperial formation."
 CANDNC_air_the_royal_flying_corps_canada: "A Canadian Wing of the Flying Corps"
 CANDNC_air_the_royal_flying_corps_canada_desc: "Rather than a corps apart, we raise Canadian squadrons inside the imperial flying service — trained to one standard, flying one design, ready to slot into the Empire's air on the first day of a war. We fold our airmen into the larger service, and take the strength of numbers over the pride of a flag."
 CANDNC_air_men_for_another_flag: "Men for Another Flag"
 CANDNC_air_men_for_another_flag_desc: "The corps we would not raise, others will. Our airmen sign on with the imperial service and carry Canadian names into a foreign squadron list. We furnish the Empire its pilots and keep none of the credit — the cheapest air policy there is, and the emptiest."
 CAN_dnc_slot_tt: "§YThe nation gains a research slot — once per era, whatever the path.§!"
 #DNC Canada - continental and isolationist expansions
 CANDNC_c2_the_permanent_tariff_board: "The Permanent Tariff Board"
 CANDNC_c2_the_permanent_tariff_board_desc: "The joint tariff board no longer adjourns: it sits in permanence, alternating between Ottawa and Washington, with a staff, a seal, and a habit of being obeyed. What began as a negotiation has quietly become an institution that binds two treasuries. We commit the customs revenue of Canada to machinery we only half control — and wager that half is enough."
 CANDNC_c2_a_zollverein_and_no_more: "A Zollverein and No More"
 CANDNC_c2_a_zollverein_and_no_more_desc: "Every pamphleteer reminds us what the German customs union grew into, and we give our answer: not here. The market may be continental, but the Crown, the militia oath and the flag over the customs house remain ours. We commit ourselves to holding the halfway house forever — prosperity without absorption, whatever Washington expects the fruit to do."
 CANDNC_c2_let_the_zollverein_ripen: "Let the Zollverein Ripen"
 CANDNC_c2_let_the_zollverein_ripen_desc: "We stop pretending the customs union is only about customs. Common schedules beget common law, common law begets common institutions, and we choose to walk with the current instead of against it. We commit Canada to letting the economic union bear whatever political fruit it will."
 CANDNC_c2_the_treaty_made_perpetual: "The Treaty Made Perpetual"
 CANDNC_c2_the_treaty_made_perpetual_desc: "The commercial treaty is renewed without term: no expiry clause, no denunciation on notice, arbitration written in for every quarrel. London breathes out, Washington shrugs, and our manufacturers plan a generation ahead. We commit both countries to a partnership neither can cheaply leave — and neither can cheaply deepen."
 CANDNC_c2_the_continental_delegations: "The Continental Delegations"
 CANDNC_c2_the_continental_delegations_desc: "Members of Congress and members of Parliament now sit together twice a year as the Continental Delegations — first over tariffs, then over railways, then over whatever either house sends them. Nobody calls it a parliament, and everybody watches it learn to act like one. We commit our legislature to sharing a table from which, history suggests, no one goes home unchanged."
 CANDNC_c2_a_continent_two_flags: "A Continent, Two Flags"
 CANDNC_c2_a_continent_two_flags_desc: "One market, one dollar in every till, one border a farmer crosses without slowing his team — and still two anthems, two parliaments, two flags. We have taken everything the continent offers and paid nothing in allegiance, and we intend to keep the books exactly so. We commit Canada to being the neighbour, the partner, and never the possession."
 CANDNC_c2_the_continental_secretariat: "The Continental Secretariat"
 CANDNC_c2_the_continental_secretariat_desc: "The commissions have multiplied — waters, fisheries, railways, gold — and we now give them a common roof and a common staff. Clerks in Ottawa and Washington answer the same letters and keep the same registry: a civil service that serves two governments and admits it. We commit the daily business of two countries to one set of filing cabinets."
 CANDNC_c2_the_alaska_scar_healed: "The Alaska Scar Healed"
 CANDNC_c2_the_alaska_scar_healed_desc: "The boundary that humiliated us becomes a working seam: joint survey parties mark the passes, and a wagon road with a railway behind it runs from our Yukon to their tidewater. What a tribunal poisoned, engineers quietly cure. We commit ourselves to treating the Alaska line as a street between neighbours, not a wound between rivals."
 CANDNC_c2_newfoundland_at_the_door: "Newfoundland at the Door"
 CANDNC_c2_newfoundland_at_the_door_desc: "St. John's has watched our terms and wants them: the same market, the same dollar, the same tribunal for its fish. A premier and his delegation arrive asking whether the continental house has one more room. We commit our good offices to Newfoundland's cause — and our credit with Washington to pay for it."
 CANDNC_c2_the_oldest_colony_comes_in: "The Oldest Colony Comes In"
 CANDNC_c2_the_oldest_colony_comes_in_desc: "The Gloucester men fight to the last schooner, but the schedules are signed and the oldest colony enters the continental system on our terms. The Atlantic approaches, the fisheries and the Grand Banks now sit inside one arrangement. We commit ourselves to standing behind Newfoundland's bargain as if it were our own — because it now is."
 CANDNC_c2_the_treaty_of_relations: "The Treaty of Relations"
 CANDNC_c2_the_treaty_of_relations_desc: "The understanding with Washington is written down at last: their guarantee against any power beyond the seas, our promise to contract no alliance and grant no base without their consent. It reads politely, and it binds like iron. We commit Canada's safety to American honour — and Canada's freedom of action to American patience."
 CANDNC_c2_the_esquimalt_lease: "The Esquimalt Lease"
 CANDNC_c2_the_esquimalt_lease_desc: "The white ensign left the dockyard within living memory; now the stars and stripes ask to coal there, on a lease politely renewed and never surrendered. Their squadron on our Pacific coast costs us nothing in gold and a great deal in appearances. We commit our western harbour to another nation's navy, and call the rent security."
 CANDNC_c2_the_garrison_remains_ours: "The Garrison Remains Ours"
 CANDNC_c2_the_garrison_remains_ours_desc: "The guarantee is welcome; the garrisons are not for hire. We man Halifax and Esquimalt with our own militia, buy our own guns, and let Washington protect a coast it never lands upon. We commit the treasury to the price of dignity — and dignity, in an associate, is the last property worth keeping."
 CANDNC_c2_the_league_against_the_treaty: "The League Against the Treaty"
 CANDNC_c2_the_league_against_the_treaty_desc: "Bourassa's men and the Orange halls, who agree on nothing else, agree that the Treaty of Relations is a leash. Their league fills theatres from Quebec to Toronto demanding the whole loaf of union or the whole loaf of independence — anything but this half-life. We commit ourselves to answering them, because a protectorate that must argue for itself is already losing."
 CANDNC_c2_ask_for_the_stars: "Ask for the Stars"
 CANDNC_c2_ask_for_the_stars_desc: "If we are to live under the eagle's wing, we will live as equals under it: we instruct our commissioners to ask for admission, for seats, for the whole constitution. Better citizens than clients, better congressmen than petitioners. We commit Canada to seeking statehood on negotiated terms — and to accepting what the Senate does with the request."
 CANDNC_c2_take_back_the_treaty: "Take Back the Treaty"
 CANDNC_c2_take_back_the_treaty_desc: "The guarantee has served its season; the leash has not. Clause by clause we reopen the Treaty of Relations — the base provisions, the consent provisions, the debts — trading gratitude and gold for our own signature's freedom. We commit ourselves to unwinding the protectorate without losing the friendship that made it bearable."
 CANDNC_c2_the_advisers_go_home_desc: "The gentlemen from New York who supervised our loans sail south with our sincere thanks and our final payment. The debt is refunded in our own name, the customs receipts are ours to pledge, and no foreign signature validates our budget. We commit Canada's credit to Canada's own word — and dare the market to price it."
 CANDNC_c2_the_guarantee_outgrown_desc: "The treaty that once guaranteed and confined us is rewritten as a pact between equals: the guarantee survives as an alliance, the consent clauses are ash. We walked into the eagle's shadow for safety, and we walk out with the safety kept and the shadow shed. We commit Canada to the full weight and full risk of her own name among nations."
 CANDNC_c2_the_stars_sewn_on: "The Stars Sewn On"
 CANDNC_c2_the_stars_sewn_on_desc: "The proclamations are read from Halifax to Victoria, the new state governments raise the new flag, and our members take the oath in Washington — in English and, from Quebec, pointedly in French. A country has not died; it has changed its address. We commit ourselves to making these northern stars count for something in the republic that now contains us."
 CANDNC_c2_the_northern_bloc: "The Northern Bloc"
 CANDNC_c2_the_northern_bloc_desc: "Our senators and congressmen caucus as one delegation, whatever party bought their tickets: wheat, waterways, the tariff on implements, the Quebec clause — the North votes together or not at all. Washington learns that the new states arrive with a common memory. We commit our politics to sectional discipline, and accept that the republic will call it a faction."
 CANDNC_c2_party_men_not_a_bloc: "Party Men, Not a Bloc"
 CANDNC_c2_party_men_not_a_bloc_desc: "We scatter ourselves into the republic's quarrels on purpose: Grits to one convention, Tories to the other, and no 'Canadian party' for the nativists to point at. Influence will come the American way — through committee chairs, not grievances. We commit our people to becoming ordinary Americans in politics, and extraordinary ones everywhere else."
 CANDNC_c2_the_loyalists_reconciled: "The Loyalists Reconciled"
 CANDNC_c2_the_loyalists_reconciled_desc: "To the Orange lodges and the Loyalist parlours we offer everything short of the impossible: the old flag on the old anniversaries, the King's portrait undisturbed in the halls, their regiments' colours laid up with honour, and full standing in the new order. Grief is not sedition, and we refuse to treat it as such. We commit the state's patience to winning the mourners, however long the mourning."
 CANDNC_c2_free_passage_for_the_irreconcilables: "Free Passage for the Irreconcilables"
 CANDNC_c2_free_passage_for_the_irreconcilables_desc: "For those who cannot live under the stars, we charter the ships ourselves: assisted passage to Britain, Australia or New Zealand, their property sold at a fair price and their pensions paid to the gangway. Better an honest farewell than a smouldering county. We commit ourselves to letting the most loyal subjects of the old Crown go — and to living with the empty pews they leave behind."
 CANDNC_c2_the_quebec_clause_at_the_court: "The Quebec Clause at the Court"
 CANDNC_c2_the_quebec_clause_at_the_court_desc: "A schools case from a prairie state carries the Quebec clause to the Supreme Court, and every French parish from Manchester to Manitoba holds its breath. We brief Louisiana's precedents, marshal the treaty text, and remind the republic that its signature bought the entrenchment. We commit the whole standing of our French fact to nine judges — because the clause is only worth what a court will enforce."
 CANDNC_c2_the_long_way_to_the_union: "The Long Way to the Union"
 CANDNC_c2_the_long_way_to_the_union_desc: "Not by conquest and not in one treaty, but by installments the union arrives: the delegations merge, the schedules become statutes, and admission is voted province by province as each chooses to ask. The old prophecy of annexation by installments completes itself a paper at a time. We commit what remains of Canada's separate sovereignty to the slowest, surest road into the republic — the one with no single moment to shoot at."
 CANDNC_c2_a_president_from_the_north: "A President from the North"
 CANDNC_c2_a_president_from_the_north_desc: "A man born under the old flag stands on the Capitol steps and swears the oath as President of the United States, while veterans of the annexation debates weep in the crowd for opposite reasons. The republic we joined now answers, in part, to us. We commit the northern states to leading the union they entered — and to proving that a country can end without its people ever losing."
 CANDNC_d2_the_doctrine_of_armed_neutrality: "The Doctrine of Armed Neutrality"
 CANDNC_d2_the_doctrine_of_armed_neutrality_desc: "We proclaim before the Commons what the arbitration taught us: no empire will ever bleed for Canada, so Canada will bleed for no empire. Not one man for foreign wars, not one dollar for foreign fleets — every rifle, every battery, every keel for our own soil alone. We commit this country to fight nowhere on earth, and everywhere at home."
 CANDNC_d2_a_militia_after_the_swiss_pattern: "A Militia After the Swiss Pattern"
 CANDNC_d2_a_militia_after_the_swiss_pattern_desc: "Let the Swiss teach us what the British never would: a free people under arms is the cheapest fortress ever built. Every able man keeps a rifle above his hearth, marches to summer camp, and learns his ground from officers born on it. We commit every parish in the Dominion to furnish soldiers — and every harvest to spare them."
 CANDNC_d2_the_permanent_force_of_the_fortress: "The Permanent Force of the Fortress"
 CANDNC_d2_the_permanent_force_of_the_fortress_desc: "A nation of week-end riflemen cannot hold Halifax's casemates or serve the guns of Esquimalt through a winter gale. We raise instead a compact professional force, drilled the year round, garrisoning the works that guard our two oceans. We commit the treasury to fewer soldiers — and better ones."
 CANDNC_d2_the_ross_perfected: "The Ross Perfected"
 CANDNC_d2_the_ross_perfected_desc: "An army that answers only to Ottawa must shoot a rifle made only in Canada — and shoot it until every vice of chamber and sight is found and burned out on our own ranges. The Ross is rebored, resighted, and proved in mud and frost before it is trusted with a single life. We commit our arsenals to arm the nation from breech to bayonet, artillery included."
 CANDNC_d2_the_mosquito_flotilla: "The Mosquito Flotilla"
 CANDNC_d2_the_mosquito_flotilla_desc: "They demand dreadnoughts or a cheque; we answer with neither. From the yards of Sorel and Toronto we launch torpedo boats, minelayers and gunboats by the score — small hulls that make every approach to our estuaries a gamble no admiral will price. We commit our coasts to the sting of the swarm, not the parade of the battle line."
 CANDNC_d2_the_fessenden_net: "The Fessenden Net"
 CANDNC_d2_the_fessenden_net_desc: "A Canadian voice first crossed the ether on continuous waves; that voice will now bind the fortress together. Our own stations, our own patents, our own operators, from ocean to ocean and northward into the ice — no British cable, no American company between an order and its execution. We commit the Dominion to own every word that crosses this country by air."
 CANDNC_d2_schemes_red_and_blue: "Schemes Red and Blue"
 CANDNC_d2_schemes_red_and_blue_desc: "In a locked room of the Militia Council two folders grow thick: Red, against raids from the republic to the south; Blue, against coercion from the fleet that once called itself ours. To plan against both parents is scandal — and simple prudence for a child both have already sold. We commit our staff to think the unthinkable, and to keep it locked."
 CANDNC_d2_the_garrison_state: "The Garrison State"
 CANDNC_d2_the_garrison_state_desc: "The fortress is finished and the fortress is us: every man a soldier six weeks a year, every harbour behind mines, every plan already written. The barracks are superb and the shops are bare, and each winter costs more than the last — but no power on earth can cross our line unbled. We commit this country to be, before all else, a garrison."
 CANDNC_d2_emparons_nous_de_lindustrie: "Emparons-nous de l'industrie"
 CANDNC_d2_emparons_nous_de_lindustrie_desc: "A librarian of Parliament has written what our merchants dared not think: seize the factory, or remain hewers of wood in our own country. We give him a bureau, a budget and the ear of the cabinet, and his book becomes the industrial plan of the Dominion. We commit the state itself to be founder, shareholder and schoolmaster of Canadian industry."
 CANDNC_d2_the_white_coal_of_the_people: "The White Coal of the People"
 CANDNC_d2_the_white_coal_of_the_people_desc: "Our rivers fall with more power than all the coal we ever begged from Pennsylvania, and not one kilowatt more shall cross the line. Public commissions harness the Saint Lawrence, the Ottawa and the Saguenay, and sell the current at cost to the Canadian shop floor. We commit every drop of falling water to turn a wheel on our own side of the wall."
 CANDNC_d2_nitrogen_from_the_falls: "Nitrogen from the Falls"
 CANDNC_d2_nitrogen_from_the_falls_desc: "Bread and gunpowder hang from the same thread, and that thread runs today to nitrate ships any blockade can cut. At Niagara and Shawinigan the current itself now fixes nitrogen — fertilizer for our fields, precursor for our powder, from nothing but air and falling water. We commit the fortress to grow its wheat and fill its shells without owing the sea a single cargo."
 CANDNC_d2_the_trust_of_three_forges: "The Trust of Three Forges"
 CANDNC_d2_the_trust_of_three_forges_desc: "Sydney smokes, the Soo has fallen into riot and receivership, Hamilton hungers for ore — three half-empires of steel, each too weak alone. The state takes the wreck and welds it into one trust, gorged with bounties, ordered to roll rails, guns and ship plate before a single ingot goes abroad. We commit Canadian steel to serve Canadian ends first, and profit last."
 CANDNC_d2_a_bank_upon_silver: "A Bank upon Silver"
 CANDNC_d2_a_bank_upon_silver_desc: "The veins of Cobalt pour out a treasure London cannot embargo and New York cannot recall. We charter the Bank of the Dominion upon that silver, coin it boldly, and let the new dollars run ahead of the old rules — canals, railways and arsenals paid in metal from our own rock. We commit the currency itself to the building of the fortress, and accept that bold money runs hot."
 CANDNC_d2_a_bank_upon_gold: "A Bank upon Gold"
 CANDNC_d2_a_bank_upon_gold_desc: "A fortress that frightens its own creditors has built its first breach itself. The Bank of the Dominion is chartered upon gold brought home from New York's vaults, every note covered, every loan patriotic and internal, raised through the postal savings of our own people. We commit our credit to be slower than our ambitions — and unshakable."
 CANDNC_d2_bring_home_the_mill_hands: "Bring Home the Mill Hands"
 CANDNC_d2_bring_home_the_mill_hands_desc: "A million of our own toil in the cotton mills of New England because we once had no work to offer them; that excuse is dead. Our agents open offices in Lowell, Woonsocket and Manchester with a paid ticket north and a guaranteed post or lot at the end of it. We commit the wall to keep one gate, opened inward, for every Canadian who comes home."
 CANDNC_d2_the_narrow_door: "The Narrow Door"
 CANDNC_d2_the_narrow_door_desc: "A country that trusts no empire cannot let empires choose who walks through its ports. We tear up every adhesion signed in London's name, end every recruiting scheme paid from Ottawa, and reduce entry to a door so narrow one clerk can watch it. We commit ourselves to grow from within alone — and to face, without a chaperon, every power our door offends."
 CANDNC_d2_the_public_elevators: "The Public Elevators"
 CANDNC_d2_the_public_elevators_desc: "Sintaluta has shown the farmer what the courts can do; we will show him what the state can. The Dominion builds and operates the elevators itself, grades the grain honestly, and lets no railway weigh a poor man's wheat on the company's scale again. We commit the treasury to the Prairies' trust — for the wall stands only if the West consents to live behind it."
 CANDNC_d2_the_grain_growers_defied: "The Grain Growers Defied"
 CANDNC_d2_the_grain_growers_defied_desc: "The delegations from the West fill our galleries with petitions taller than a man, demanding we breach our own wall for their wheat. We refuse, whip the House, and break the farmers' company on the floor and at the polls. We commit the fortress to hold its wall against its own children — and to pay whatever loyalty that costs."
 CANDNC_d2_the_hudson_bay_railway: "The Hudson Bay Railway"
 CANDNC_d2_the_hudson_bay_railway_desc: "The West demands a door to the sea that owes nothing to Montreal, less to New York, and nothing at all to any foreign flag. We drive the rails north to Churchill through muskeg and frost, and give the wheat of the Prairies its own salt water. We commit the treasure of the Dominion to one great artery — and it points north."
 CANDNC_d2_the_georgian_bay_ship_canal: "The Georgian Bay Ship Canal"
 CANDNC_d2_the_georgian_bay_ship_canal_desc: "The engineers have spoken: a deep waterway from the upper lakes down the Ottawa to Montreal is possible, and every mile of it lies on our own soil. We dig the fortress its inner river, past every American lock and every American gun. We commit the treasure of the Dominion to one great artery — and it flows through the heart of the country."
 CANDNC_d2_the_clay_belts_peopled: "The Clay Belts Peopled"
 CANDNC_d2_the_clay_belts_peopled_desc: "For a generation we planted our people in a ribbon along the American line, one day's march from any invader. Now the bonus goes to the interior: the clay belts, the Abitibi, the Peace — deep country, hard country, ours beyond any army's reach and any annexation's appetite. We commit the plough to march north, and the nation to grow thick instead of long."
 CANDNC_d2_constables_in_the_ice: "Constables in the Ice"
 CANDNC_d2_constables_in_the_ice_desc: "Where we cannot send a fleet, we send three men, a stove and a flag — and the law arrives with them. Police posts rise on Hudson Bay and at Herschel, collecting customs from astonished whalers at the end of the earth. We commit the Dominion to govern every mile it claims, one detachment at a time."
 CANDNC_d2_the_poirier_sector: "The Poirier Sector"
 CANDNC_d2_the_poirier_sector_desc: "An Acadian senator rises and draws two lines on the map of the world, from our coasts to the Pole, and asks why not. No chancellery has a pigeonhole for such a claim — which is precisely why a country that expects nothing from chancelleries may make it. We commit Parliament to write the sector into statute, and the world to argue with a law already passed."
 CANDNC_d2_berniers_patrols: "Bernier's Patrols"
 CANDNC_d2_berniers_patrols_desc: "One captain has begged for years for coal, a ship and leave to hold the North for us; he now receives all three, and wireless in the ice besides. The Arctic sails from anchorage to anchorage, planting depots, licences and the flag, until the archipelago answers to Ottawa as surely as any county. We commit the Dominion to keep watch over its ice as other empires watch their seas."
 CANDNC_d2_the_hermit_dominion: "The Hermit Dominion"
 CANDNC_d2_the_hermit_dominion_desc: "The wall has held against both empires, the bins are full of our own wheat, the lamps burn on our own current, and the dollar rings on Cobalt silver. The world calls us sullen; we call ourselves paid in full — respected, solvent and alone by choice. We commit this country to remain the Switzerland of the North: armed, neutral, and owing nobody anything."
 CANDNC_d2_the_empire_of_the_cold: "The Empire of the Cold"
 CANDNC_d2_the_empire_of_the_cold_desc: "We turned our back on two empires only to find a third waiting at the top of the world, and it is ours. Sector law, police posts, wireless and the wake of one stubborn ship have made the greatest archipelago on earth a governed country, and the world, weary of arguing, acquiesces. We commit Canada to the only conquest its solitude ever allowed — the North, entire."
 CANDNC_c2_paris_will_answer_tt: "§YParis will answer.§!"
 CANDNC_c2_the_advisers_go_home: "The Advisers Go Home"
 CANDNC_c2_the_guarantee_outgrown: "The Guarantee Outgrown"
 can_dnc_c2.1.t: "Gloucester Storms the Committee"
 can_dnc_c2.1.d: "Newfoundland's fish enter the continental schedules duty-free, and Senator Lodge's Gloucester constituents storm the committee rooms as they did when they killed the Bond-Hay treaty. The administration must decide whether the deal Ottawa brokered for the oldest colony is worth a fight with its own fisheries lobby."
 can_dnc_c2.1.a: "The schedules stand — the continent is worth more than Gloucester"
 can_dnc_c2.1.b: "A carve-out for the fishermen"
 can_dnc_c2.2.t: "A Lease on the Pacific"
 can_dnc_c2.2.d: "Ottawa's lease of the Esquimalt dockyard reaches the Navy Department. Mahan's disciples celebrate a fleet anchorage on the northern Pacific; anti-imperialists in the Senate smell a second Guantanamo and ask what an 'associate' is if its harbours can be rented."
 can_dnc_c2.2.a: "Accept the station and reaffirm the guarantee"
 can_dnc_c2.2.b: "Accept — and inquire about Halifax"
 can_dnc_c2.3.t: "The Petition for the Stars"
 can_dnc_c2.3.d: "Canada's commissioners formally petition for admission to the union. Root argues before the caucus that the installments are complete and only the signature remains; the beet-sugar, lumber and fisheries senators sharpen their amendments, and the galleries are full for the first time in years."
 can_dnc_c2.3.a: "Root carries the caucus"
 can_dnc_c2.3.b: "Carve-outs first, stars after"
 can_dnc_c2.3.c: "Not this Congress"
 can_dnc_c2.4.t: "Nine Judges and a Clause"
 can_dnc_c2.4.d: "A schools case from one of the new prairie states carries the entrenched Quebec clause to the Supreme Court. Louisiana's precedents are briefed against a century of majoritarian instinct, and every French parish from Manchester to Manitoba waits on nine judges."
 can_dnc_c2.4.a: "The clause upheld in full"
 can_dnc_c2.4.b: "Upheld — but narrowed"
 can_dnc_c2.5.t: "How Long Only a Zollverein?"
 can_dnc_c2.5.d: "The perpetual commercial treaty lands in the Senate, and the annexationists suddenly understand what it means: the halfway house has been made permanent, and the fruit they were promised would fall of itself has been wired to the branch."
 can_dnc_c2.5.a: "Root's patience — the fruit will fall in its own season"
 can_dnc_c2.5.b: "Resentment entered on the record"
 can_dnc_c2.6.t: "Letting the North Go"
 can_dnc_c2.6.d: "The recall of the financial advisers reaches the White House along with Ottawa's refunding plan. Washington must decide whether an associate may grow into an equal without a crisis — or whether letting one client go politely invites every other to ask."
 can_dnc_c2.6.a: "A graceful release"
 can_dnc_c2.6.b: "The full price of freedom"
 can_dnc_c2.7.t: "The Empire Loses Its Eldest"
 can_dnc_c2.7.d: "Westminster debates the accomplished fact: the eldest dominion has passed under the stars, the British North America Act awaits repeal, and the flag over Halifax must come down by statute or by scene. The junior dominions cable to ask what, after this, still holds the Empire together."
 can_dnc_c2.7.a: "Acquiesce by statute"
 can_dnc_c2.7.b: "A bitter parting"
 can_dnc_c2.8.t: "The Loyalists Come Home Again"
 can_dnc_c2.8.d: "Assisted-passage ships land Orange families at Liverpool and Southampton — refugees of loyalty rather than poverty, with their lodge banners in the hold. The government must receive them as a symbol, a burden, or a weapon."
 can_dnc_c2.8.a: "Land for the loyal"
 can_dnc_c2.8.b: "An indictment in Westminster"
 can_dnc_d2.1.t: "A Dominion Renounces Its Duties"
 can_dnc_d2.1.d: "Ottawa has proclaimed armed neutrality inside the Empire itself: no men, no ships, no cheque — while its coasts bristle with guns it points at no one and everyone. Westminster must decide what to do with a dominion that renounces every imperial duty and every imperial protection in the same breath."
 can_dnc_d2.1.a: "A sulk, not a secession — wait it out"
 can_dnc_d2.1.b: "The Colonial Office protests formally"
 can_dnc_d2.1.c: "Chamberlain's heirs demand the Empire close ranks"
 can_dnc_d2.2.t: "A Debtor Who No Longer Borrows"
 can_dnc_d2.2.d: "The Dominion has chartered a bank of its own upon Cobalt silver, repatriated its reserves, and coined money that answers to no one. The City of London — holder of the greatest railway debt on earth, most of it Canadian — considers what to do with a debtor that no longer needs to borrow."
 can_dnc_d2.2.a: "Close the market to Canadian issues"
 can_dnc_d2.2.b: "Let Barings keep one discreet window"
 can_dnc_d2.2.c: "Let the bondholders dump Canadian rails"
 can_dnc_d2.3.t: "Two Lines to the Pole"
 can_dnc_d2.3.d: "The Canadian Parliament has written into statute a claim to every island and every floe between its coasts and the Pole, along two meridians drawn by an Acadian senator. The Foreign Office searches its pigeonholes and finds that international law has no case for a sector — and no obvious answer to one."
 can_dnc_d2.3.a: "Refuse recognition, and do nothing"
 can_dnc_d2.3.b: "Instruct the Admiralty to keep clear of the archipelago"
 can_dnc_d2.3.c: "Reserve His Majesty's rights in the ice"
 can_dnc_d2.4.t: "Buffalo in the Dark"
 can_dnc_d2.4.d: "The current from the Canadian side of Niagara has been cut at the border by law: not one kilowatt more crosses the line. Buffalo's mills go dark mid-shift, and the power companies of the frontier states descend on Washington demanding an answer to a country that keeps its own waterfalls."
 can_dnc_d2.4.a: "Apply the maximum tariff clause against the Dominion"
 can_dnc_d2.4.b: "Build steam plants and rage in the press"
 can_dnc_d2.4.c: "Take it to the boundary commission"
 can_dnc_d2.5.t: "The Folder Marked Red"
 can_dnc_d2.5.d: "Through a loose-tongued officer and a bought clerk, the War Department learns that the Militia Council in Ottawa keeps a folder marked Red: a worked-out defensive war against the United States, bridges and canals marked for demolition. The neighbours have been planning for us, the Secretary observes, as if we were Mexico."
 can_dnc_d2.5.a: "Demand a public explanation"
 can_dnc_d2.5.b: "Answer with a war plan of our own"
 can_dnc_d2.5.c: "Feed the folder to the press"
 can_dnc_d2.6.t: "The Mills Lose Their Hands"
 can_dnc_d2.6.d: "Canadian agents have opened offices in Lowell, Woonsocket and Manchester, offering every French-Canadian family a paid ticket north and a guaranteed post or homestead. The cotton mills of New England, built on that labour, watch their spinners hand in their notice by the trainload."
 can_dnc_d2.6.a: "Bar the Canadian recruiting agents"
 can_dnc_d2.6.b: "Let the mill owners raise wages"
 can_dnc_d2.6.c: "Good riddance to them"
 can_dnc_d2.7.t: "No Chaperon in the Room"
 can_dnc_d2.7.d: "Ottawa has denounced its adhesion to the Anglo-Japanese commercial arrangement and shut its ports to Japanese subjects by its own statute, signed by no empire. Tokyo protests — and discovers that London, guarding its alliance, declines to mediate for either side. For the first time, the two countries face each other with no chaperon in the room."
 can_dnc_d2.7.a: "Protest, and boycott Canadian goods"
 can_dnc_d2.7.b: "Negotiate directly, power to power"
 can_dnc_d2.7.c: "Note the insult, and wait"
 can_dnc_d2.8.t: "The Gospel of the Librarian"
 can_dnc_d2.8.d: "The academies and journals of Paris discover that a French-Canadian civil servant has written the industrial gospel of a whole dominion — the factory seized by the race that was told to stay on the land, with the state as lever. France can offer the fortress no market it will accept, but sympathy costs nothing and flatters everyone."
 can_dnc_d2.8.a: "Honour the doctrine, send the engineers"
 can_dnc_d2.8.b: "Offer a commercial convention despite the wall"
 can_dnc_d2.8.c: "Compliments, nothing more"
 CAN_c2_tariff_board: "The Permanent Tariff Board"
 CAN_c2_tariff_board_desc: "A negotiation that quietly became an institution."
 CAN_c2_perpetual_treaty: "The Perpetual Treaty"
 CAN_c2_perpetual_treaty_desc: "A partnership neither country can cheaply leave."
 CAN_c2_delegations: "The Continental Delegations"
 CAN_c2_delegations_desc: "Nobody calls it a parliament; everybody watches it learn to act like one."
 CAN_c2_two_flag_continent: "The Two-Flag Continent"
 CAN_c2_two_flag_continent_desc: "Everything the continent offers, and nothing paid in allegiance."
 CAN_c2_secretariat: "The Continental Secretariat"
 CAN_c2_secretariat_desc: "The daily business of two countries in one set of filing cabinets."
 CAN_c2_platt_guarantee: "The Treaty of Relations"
 CAN_c2_platt_guarantee_desc: "Their guarantee against the world; our promise to ask permission."
 CAN_c2_paying_out: "Paying Out the Treaty"
 CAN_c2_paying_out_desc: "Clause by clause, the protectorate is unwound."
 CAN_c2_equal_pact: "A Pact Between Equals"
 CAN_c2_equal_pact_desc: "The safety kept, the shadow shed."
 CAN_c2_statehood_transition: "The Stars Sewn On"
 CAN_c2_statehood_transition_desc: "A country has not died; it has changed its address."
 CAN_c2_northern_bloc: "The Northern Bloc"
 CAN_c2_northern_bloc_desc: "The North votes together or not at all."
 CAN_c2_installments: "Union by Installments"
 CAN_c2_installments_desc: "The slowest, surest road — with no single moment to shoot at."
 CAN_c2_president_north: "A President from the North"
 CAN_c2_president_north_desc: "The republic we joined now answers, in part, to us."
 CAN_d2_armed_neutrality: "Armed Neutrality"
 CAN_d2_armed_neutrality_desc: "Fight nowhere on earth, and everywhere at home."
 CAN_d2_swiss_militia: "The Militia of the Parishes"
 CAN_d2_swiss_militia_desc: "Every able man a rifle above the hearth."
 CAN_d2_fortress_force: "The Permanent Force"
 CAN_d2_fortress_force_desc: "Fewer soldiers, and better ones."
 CAN_d2_mosquito_flotilla: "The Mosquito Flotilla"
 CAN_d2_mosquito_flotilla_desc: "Every estuary a gamble no admiral will price."
 CAN_d2_fessenden_net: "The Fessenden Net"
 CAN_d2_fessenden_net_desc: "Every word that crosses the country by air is ours."
 CAN_d2_defence_schemes: "Schemes Red and Blue"
 CAN_d2_defence_schemes_desc: "To plan against both parents is prudence, kept locked."
 CAN_d2_garrison_state: "The Garrison State"
 CAN_d2_garrison_state_desc: "The barracks are superb and the shops are bare."
 CAN_d2_bouchette_plan: "Emparons-nous de l'industrie"
 CAN_d2_bouchette_plan_desc: "The state as founder, shareholder and schoolmaster."
 CAN_d2_white_coal: "The White Coal of the People"
 CAN_d2_white_coal_desc: "Not one kilowatt more crosses the line."
 CAN_d2_nitrogen: "Nitrogen from the Falls"
 CAN_d2_nitrogen_desc: "Bread and gunpowder from air and falling water."
 CAN_d2_silver_bank: "A Bank upon Silver"
 CAN_d2_silver_bank_desc: "Bold money runs hot, and it runs ours."
 CAN_d2_gold_bank: "A Bank upon Gold"
 CAN_d2_gold_bank_desc: "Slower than our ambitions, and unshakable."
 CAN_d2_narrow_door: "The Narrow Door"
 CAN_d2_narrow_door_desc: "One clerk can watch it."
 CAN_d2_prairie_trust: "The Public Elevators"
 CAN_d2_prairie_trust_desc: "No railway weighs a poor man’s wheat on the company’s scale."
 CAN_d2_prairie_grudge: "The West Defied"
 CAN_d2_prairie_grudge_desc: "The wall held against its own children."
 CAN_d2_churchill_port: "The Port of Churchill"
 CAN_d2_churchill_port_desc: "The wheat of the Prairies has its own salt water."
 CAN_d2_inner_river: "The Inner River"
 CAN_d2_inner_river_desc: "Past every American lock and every American gun."
 CAN_d2_arctic_law: "Constables in the Ice"
 CAN_d2_arctic_law_desc: "Three men, a stove, a flag — and the law arrives with them."
 CAN_d2_sector_law: "The Poirier Sector"
 CAN_d2_sector_law_desc: "Two lines to the Pole, written into statute."
 CAN_d2_arctic_watch: "Bernier's Patrols"
 CAN_d2_arctic_watch_desc: "The archipelago answers to Ottawa as surely as any county."
 CAN_d2_hermit_dominion: "The Hermit Dominion"
 CAN_d2_hermit_dominion_desc: "The Switzerland of the North: armed, neutral, owing nobody anything."
 CAN_d2_empire_of_cold: "The Empire of the Cold"
 CAN_d2_empire_of_cold_desc: "The withdrawal become an empire — the North, entire."
 #DNC Canada - flavor spirits
 CAN_fx_head_tax_ledger: "The Head Tax Ledger"
 CAN_fx_head_tax_ledger_desc: "Every arrival pays two years' wages at the gangway, and the Treasury counts the difference."
 CAN_fx_three_from_each_side: "Three from Each Side"
 CAN_fx_three_from_each_side_desc: "Every river the border crosses is judged by a commission of equals, and the frontier learns to settle its quarrels around a table."
 CAN_fx_unguarded_dominion: "The Unguarded Dominion"
 CAN_fx_unguarded_dominion_desc: "Three transcontinentals and not a single warship; the country grows rich behind coasts it cannot defend."
 CAN_fx_prairie_machines: "The Prairie Machines"
 CAN_fx_prairie_machines_desc: "Two provinces run by loyal party men, where every road, post and favour flows through the government's friends."
 CAN_fx_prairie_colleges: "The Prairie Colleges"
 CAN_fx_prairie_colleges_desc: "The West trains its own men now, with agriculture built into the curriculum from the first day."
 CAN_fx_buffalo_bloc: "The Buffalo Bloc"
 CAN_fx_buffalo_bloc_desc: "One great province bargains where three once pleaded, and every session in Ottawa is a negotiation."
 CAN_fx_door_shut_by_timetable: "The Door Shut by Timetable"
 CAN_fx_door_shut_by_timetable_desc: "No race is named and a whole one is barred; the coast is quiet, and the ships sail elsewhere."
 CAN_fx_empires_willing_partner: "The Empire's Willing Partner"
 CAN_fx_empires_willing_partner_desc: "One Dominion at least means to build the Empire rather than merely belong to it, and pays gladly for the privilege."
 CAN_fx_the_sixty_five: "The Sixty-Five"
 CAN_fx_the_sixty_five_desc: "Quebec's seats stand beyond the reach of any redistribution, and French Canada's consent to Empire rests upon them."
 CAN_fx_marquis_wheat: "Marquis Wheat"
 CAN_fx_marquis_wheat_desc: "A harder wheat ripens a week sooner and pushes the grain frontier into land that never grew a crop."
 CAN_fx_dominion_arsenal: "The Dominion Arsenal"
 CAN_fx_dominion_arsenal_desc: "Small arms at Quebec, shell at Montreal, cordite at Beloeil — the Dominion learns what it costs to keep an arsenal, and keeps it."
 CAN_fx_guarded_by_treaty: "Guarded by Treaty"
 CAN_fx_guarded_by_treaty_desc: "The defence of Canadian waters is an obligation in writing, and a Dominion guarded by paper sleeps easier than one guarded by goodwill."
 CAN_fx_sintaluta_precedent: "The Sintaluta Precedent"
 CAN_fx_sintaluta_precedent_desc: "The prairie farmer has beaten the railway in open court, and knows now that the law, well used, is a weapon he can wield."
 CAN_fx_no_veto_but_our_own: "No Veto but Our Own"
 CAN_fx_no_veto_but_our_own_desc: "A Parliament that leaves the imperial summons lying on the table has learned to answer to no one across the sea."
 CAN_fx_crown_east_commerce_south: "Crown to the East, Commerce to the South"
 CAN_fx_crown_east_commerce_south_desc: "A Dominion may face two ways at once and be loyal in both — the King's head on the coins, and the whole trade of the country running south."
 CAN_fx_a_country_without_a_crown: "A Country Without a Crown"
 CAN_fx_a_country_without_a_crown_desc: "The King's name has come off the writs and Rideau Hall stands shut; a thing that was a Dominion is learning to be something else."
 CAN_fx_the_continental_dollar: "The Continental Dollar"
 CAN_fx_the_continental_dollar_desc: "Every till and treasury in the Dominion counts in the American dollar now, and prospers or panics as Washington's money does."
 CAN_fx_the_halfway_house: "The Halfway House"
 CAN_fx_the_halfway_house_desc: "The market may be continental, but the Crown, the militia oath and the flag over the customs house remain ours — and shall."
 CAN_fx_the_garrisons_kept: "The Garrisons Kept"
 CAN_fx_the_garrisons_kept_desc: "Halifax and Esquimalt are manned by our own militia and gunned at our own expense; dignity, in an associate, is the last property worth keeping."
 CAN_fx_our_own_signatures_freedom: "Our Own Signature's Freedom"
 CAN_fx_our_own_signatures_freedom_desc: "Clause by clause the protectorate unwinds, and every paper reclaimed makes the next easier to ask for."
 CAN_fx_the_committee_chairs: "The Committee Chairs"
 CAN_fx_the_committee_chairs_desc: "Influence comes the American way — through seniority and the committee rooms, not through grievances shouted from the gallery."
 CAN_fx_republic_stands_alone: "A Republic Alone"
 CAN_fx_republic_stands_alone_desc: "No guarantee, no ally, no borrowed shield — seven million people who have decided to be their own protection."
 CAN_fx_three_articles: "The Three Articles"
 CAN_fx_three_articles_desc: "Autonomy within the Empire, autonomy of the provinces, an economy made at home — a creed written to outlive every party that carries it."
 CAN_fx_policy_made_at_home: "A Policy Made at Home"
 CAN_fx_policy_made_at_home_desc: "What began as a manifesto in a Montreal weekly now carries the arms of the Dominion."
 CAN_fx_english_schoolhouse: "An English Schoolhouse"
 CAN_fx_english_schoolhouse_desc: "English is the language of the classroom from the Red River to the Rockies, and the settlers pour into a West that reads one tongue."
 CAN_fx_bargain_unmade: "The Bargain Unmade"
 CAN_fx_bargain_unmade_desc: "Quebec's weight in the House is a number like any other now, and the majority has learned its own strength."
 CAN_fx_portfolios_not_pamphlets: "Portfolios, Not Pamphlets"
 CAN_fx_portfolios_not_pamphlets_desc: "The Ligue sits in Cabinet, and the country is governed by the creed it preached from a weekly's front page."
 CAN_fx_two_peoples_one_dominion: "Two Peoples, One Dominion"
 CAN_fx_two_peoples_one_dominion_desc: "A written status for the French fact and an Orange grievance carried forward — two peoples keeping one uneasy house."
 CAN_fx_masters_in_our_own_house: "Masters in Our Own House"
 CAN_fx_masters_in_our_own_house_desc: "French and English both, and bending the knee to no one across the sea."
 CAN_fx_majority_terms: "The Majority's Terms"
 CAN_fx_majority_terms_desc: "One tongue in the statute book and a fleet in the estimates; the majority governs, and the minority remembers."
 CAN_fx_silk_express: "The Silk Express"
 CAN_fx_silk_express_desc: "Sealed cars race the ocean's cargo from tidewater to the exchanges ahead of every timetable in the book."
 CAN_fx_lombard_street_terms: "Lombard Street's Terms"
 CAN_fx_lombard_street_terms_desc: "The City keeps our paper and we pay the familiar premium for the familiar peace."
 CAN_fx_gentlemens_agreement: "The Gentlemen's Agreement"
 CAN_fx_gentlemens_agreement_desc: "Restriction by handshake: Tokyo keeps the honour of the choosing, and no exclusion act stains the treaty."
 CAN_fx_the_imperial_granary: "The Imperial Granary"
 CAN_fx_the_imperial_granary_desc: "The Empire eats prairie bread, and the West's fortune sails east with every cargo."
 CAN_fx_a_british_west: "A British West"
 CAN_fx_a_british_west_desc: "The prairie fills slowly, with settlers who will melt — and stays loyal for it."
 CAN_fx_the_debt_not_taken: "The Debt We Did Not Take"
 CAN_fx_the_debt_not_taken_desc: "One good line and a clean ledger; the Dominion's credit stands unmortgaged."
 CAN_fx_the_peoples_current: "The People's Current"
 CAN_fx_the_peoples_current_desc: "Niagara's power runs to every town and workshop at the cost of making it, and not a cent for the promoter."
 CAN_fx_one_market_two_flags: "One Market, Two Flags"
 CAN_fx_one_market_two_flags_desc: "Implements come north cheap and wheat goes south dear; the border is a line the price list ignores."
 CAN_fx_the_dominion_note: "The Dominion Note"
 CAN_fx_the_dominion_note_desc: "Public money backed by public gold carries the nation's trade, and the banker's promise is no longer the whole of the currency."
 CAN_fx_wings_under_other_flags: "Wings Under Other Flags"
 CAN_fx_wings_under_other_flags_desc: "Canada's airmen make their names under another crest, and send home everything but the credit."
 #DNC Canada - Pacific expansion
 CANDNC_p2_a_battalion_from_powell_street: "A Battalion from Powell Street"
 CANDNC_p2_a_battalion_from_powell_street_desc: "We gazette the first Japanese-Canadian battalion of the Militia, recruited from the fishermen and merchants of Powell Street, and the men drill superbly. The exclusion leagues howl in Victoria and London raises an eyebrow at the precedent. We commit to a Militia that asks a man's aim, not his ancestry."
 CANDNC_p2_joint_keels_at_esquimalt_and_kure: "Joint Keels at Esquimalt and Kure"
 CANDNC_p2_joint_keels_at_esquimalt_and_kure_desc: "We lay sister cruisers on two sides of one ocean — a common class, one keel at Esquimalt and one at Kure — while the Kaigun's gunnery teachers open school on our quarterdecks. What Britain would not sell us on our terms, Japan builds with us as a partner. We commit our yards to the finest cruiser class in the Pacific."
 CANDNC_p2_the_pacific_squadron: "The Pacific Squadron"
 CANDNC_p2_the_pacific_squadron_desc: "Kure-pattern cruisers, Canadian crews, and gunnery scores that would make the Channel Fleet blush: for the first time a squadron worthy of the name stands out to sea under our flag west of the Rockies. We commit to keeping our own ocean with our own ships."
 CANDNC_p2_the_pacific_defence_compact: "The Pacific Defence Compact"
 CANDNC_p2_the_pacific_defence_compact_desc: "With Tokyo we guarantee the status quo of the North Pacific: no coast changes hands and no port closes without answer from both our navies. Washington calls it impertinence and London calls it awkward; we call it the peace of our ocean. We commit our squadron to the Compact's watch — and forgo any bargain that would buy land with neutrality."
 CANDNC_p2_the_empires_pacific_gate: "The Empire's Pacific Gate"
 CANDNC_p2_the_empires_pacific_gate_desc: "We bring Britain into the Compact on our terms: the Royal Navy is welcome at Esquimalt as a guest of the Dominion, and the Empire's Pacific gate opens and closes on Ottawa's word. We remain the King's people — but on this ocean, the King's business passes through us. We commit to holding the gate for the Empire, and to being paid in standing for it."
 CANDNC_p2_a_power_in_our_own_right: "A Power in Our Own Right"
 CANDNC_p2_a_power_in_our_own_right_desc: "The Compact needs no counter-signature from London: we publish it over our own seal and receive the ambassadors' notes in Ottawa. Britain is our mother, not our keeper. We commit to standing in the Pacific as a power in our own right, whatever the Colonial Office makes of it."
 CANDNC_p2_the_vancouver_conference: "The Vancouver Conference"
 CANDNC_p2_the_vancouver_conference_desc: "Every flag on the Pacific rim sends a plenipotentiary to Vancouver, and the chair at the head of the table is ours. Boundaries, fisheries, cables, and the open door — the ocean's business is settled in a Canadian hall. We commit to what the world now concedes: Canada is a Pacific power, and the Pacific meets at our invitation."
 CANDNC_p2_the_victoria_conference: "The Victoria Conference"
 CANDNC_p2_the_victoria_conference_desc: "Two empires bleed in Manchuria and both are ready to stop; we offer them a quiet harbour to say so. Let the plenipotentiaries of the Tsar and the Mikado meet at Victoria, under our roof, with Mr. Roosevelt reading about it in the newspapers. We commit the Dominion to its debut on the world's stage — as host, and as nothing less."
 CANDNC_p2_the_honest_broker: "The Honest Broker"
 CANDNC_p2_the_honest_broker_desc: "We hold the scales dead level: no indemnity clause, no secret annex, terms both delegations can carry home with their honour intact. The peace signed under our roof bears our name as witness, not as partisan. We commit to the broker's reward — the trust of every chancellery on this ocean."
 CANDNC_p2_a_thumb_on_the_scale: "A Thumb on the Scale"
 CANDNC_p2_a_thumb_on_the_scale_desc: "The scales tip, ever so quietly, toward our partner: the coaling clauses, the fisheries line, and the railway concessions all read a shade better in Tokyo than in Petersburg. Russia suspects and cannot prove; Japan knows and does not forget. We commit our credit to the Japanese friendship, and let the Tsar nurse his grievance."
 CANDNC_p2_the_ottawa_understanding: "The Ottawa Understanding"
 CANDNC_p2_the_ottawa_understanding_desc: "When the school-boards of California insult Japan and Washington cannot find the words, we find them: a Pacific Non-Aggression Understanding, drafted in Ottawa and initialed by three flags. Immigration honoured by gentlemen's agreement, fleets notified of their movements, no fortifying of new islands. We commit ourselves as the Pacific's clearing-house for peace."
 CANDNC_p2_the_white_fleet_off_esquimalt: "The White Fleet off Esquimalt"
 CANDNC_p2_the_white_fleet_off_esquimalt_desc: "Sixteen white battleships steam past our harbour mouth, bands playing, guns run out in 'courtesy.' The message is addressed to Tokyo but the envelope bears our name, and the tariff bill in Congress is the postscript. We commit to reading the message calmly — and to answering it in our own hand."
 CANDNC_p2_hold_the_line: "Hold the Line"
 CANDNC_p2_hold_the_line_desc: "The Militia entrains for the coast, the new batteries above Esquimalt track the horizon, and not one Canadian tariff schedule changes by a comma. If Washington means to frighten us out of our ocean, it has misjudged its neighbour. We commit to standing where we stand, and let the fleet blink first."
 CANDNC_p2_the_modus_vivendi: "The Modus Vivendi"
 CANDNC_p2_the_modus_vivendi_desc: "We choose the cooler course: a quiet memorandum with Washington — fleets announced, tariffs frozen, incidents referred to commissioners before they reach the newspapers. We surrender nothing but the pleasure of shouting. We commit to a Pacific where the tills ring louder than the guns."
 CANDNC_p2_the_panhandle_bargain: "The Panhandle Bargain"
 CANDNC_p2_the_panhandle_bargain_desc: "Japanese banks stand behind our cheque, London stands behind its embarrassment over the boundary award, and we stand at Washington's door with an offer no republic has heard before: name your price for the Alaska Panhandle. For a fortune in gold and our Pacific neutrality, the coast can be whole. We commit the Dominion's credit — and our pride — to the boldest purchase since Alaska itself."
 CANDNC_p2_the_panhandle_province: "The Panhandle Province"
 CANDNC_p2_the_panhandle_province_desc: "The stars and stripes come down from Skagway's flagpole with full honours, and the surveyors go north to draw a province out of the rain and the gold. The coast is whole from Portland Canal to Icy Strait, and every mile of it is ours. We commit to organizing the Panhandle as Canada's newest province — bought, not bled for."
 CANDNC_p2_the_silk_trains: "Ninety Hours to New York"
 CANDNC_p2_the_silk_trains_desc: "From an Empress's hold at Vancouver to a silk broker's vault in New York in under ninety hours: our sealed silk specials outrun everything on rails, guarded like bullion and insured like nothing else on earth. Every bale that crosses by Canada is a bale that skips San Francisco. We commit the fastest silk route on the planet to Canadian steel."
 CANDNC_p2_the_yen_finishes_the_line: "The Yen Finishes the Line"
 CANDNC_p2_the_yen_finishes_the_line_desc: "Japanese subscriptions close the Grand Trunk Pacific's books years ahead of the engineers' promises, and the last spike goes in with a Tokyo banker holding the maul beside our own. Prince Rupert leaps from survey stakes to boomtown between two winters. We commit the northern line — and the harbour at its end — to the Pacific trade."
 CANDNC_p2_the_empress_run: "The Empress Run"
 CANDNC_p2_the_empress_run_desc: "Subsidized white Empresses sail on every tide for Yokohama, Shanghai, and Hong Kong, faster than anything flying the American flag and cheaper than anything flying the Blue Ensign. The mails, the silk, and the first-class passengers all learn the same lesson. We commit the mail subsidy to a merchant fleet that owns the North Pacific run."
 CANDNC_p2_villages_on_the_skeena: "Villages on the Skeena"
 CANDNC_p2_villages_on_the_skeena_desc: "Company charters and quiet agreements with Tokyo plant fishing villages and sawmill towns along the Skeena and the northern coast — surveyed, schooled, and flying our flag. The exclusion leagues rage in Vancouver while the north fills with rated seamen and skilled hands. We commit the empty coast to settlement, and to the settlers, whoever they are."
 CANDNC_p2_the_rate_war: "The Rate War"
 CANDNC_p2_the_rate_war_desc: "We cut the freight rates to the bone and dare San Francisco to follow us down: the Pacific Mail bleeds money on every crossing while our subsidized Empresses sail full. Washington's shipping men scream for subsidies of their own and their Congress reaches for the tariff. We commit to a price war we intend to win — whatever it stirs up."
 CANDNC_p2_the_gentlemens_conference: "The Gentlemen's Conference"
 CANDNC_p2_the_gentlemens_conference_desc: "In a panelled room the lines divide the ocean like gentlemen: the Americans keep Hawaii and the southern crossings, we keep the great circle to the north, and rates hold where everyone makes money. It is a smaller victory than conquest, and a surer one. We commit to a cartel of the sea — profitable, discreet, and ours to chair."
 CANDNC_p2_a_province_in_two_tongues: "A Province in Two Tongues"
 CANDNC_p2_a_province_in_two_tongues_desc: "The north coast petitions for organization, and the petition is printed in two languages. We draft a territory whose schools teach English and Japanese side by side, whose juries swear on what book they please, and whose member will one day rise in our House. We commit Confederation to its boldest experiment: a Pacific province of two tongues."
 CANDNC_p2_the_company_coast: "The Company Coast"
 CANDNC_p2_the_company_coast_desc: "The coast will be governed the way it was built: by charter. The company keeps the books, pays the wages, and answers to Ottawa, while its workers remain sojourners under contract, not settlers with a vote. We commit the north coast to commerce without citizenship — profitable, orderly, and cold."
 CANDNC_p2_all_the_silk_of_asia: "All the Silk of Asia"
 CANDNC_p2_all_the_silk_of_asia_desc: "Silk, tea, and specie now clear through Vancouver as naturally as water runs downhill, and the New York houses open Vancouver offices to be nearer the wire. Our exchange posts Yokohama prices before San Francisco has finished breakfast. We commit our banks and bonded warehouses to becoming the counting-house of the Pacific."
 CANDNC_p2_the_golden_corridor: "The Golden Corridor"
 CANDNC_p2_the_golden_corridor_desc: "From a godown in Shanghai to a vault on Wall Street, the fastest and richest trade route on earth runs every mile of ocean and rail under our flag or our freight-bills. We have not conquered an acre, and we command an ocean's commerce. We commit the Dominion to its golden vocation: the corridor between the oceans, tolled in Canadian dollars."
 CANDNC_p2_petersburg_will_answer_tt: "§YPetersburg will answer.§!"
 CANDNC_p2_shanghai_will_answer_tt: "§YShanghai will answer.§!"
 CAN_p2_battalion_precedent: "The Powell Street Precedent"
 can_dnc_p2.1.t: "A Harbour for the Peace"
 can_dnc_p2.1.d: "A telegram from Ottawa reaches the Winter Palace: Canada offers Victoria as neutral ground for peace talks with Japan — a quiet harbour, a discreet press, and a host with no fleet in this war. The armies in Manchuria are spent and the Baltic Fleet lies at the bottom of Tsushima Strait; but treating for peace in a British Dominion's parlour is a bitter cup for the Tsar."
 can_dnc_p2.1.a: "The Tsar's men sail for Victoria"
 can_dnc_p2.1.b: "A European venue or nothing"
 can_dnc_p2.1.c: "Attend, but concede nothing"
 can_dnc_p2.2.t: "The Peace Without Tribute"
 can_dnc_p2.2.d: "The treaty signed at Victoria gives Japan the fruits of victory but not one rouble of indemnity — the Canadian chair held the scales level to the end. In Tokyo the crowds that expected tribute read the terms in the evening editions, and the government must decide what face to show its host."
 can_dnc_p2.2.a: "Grace in victory"
 can_dnc_p2.2.b: "Riots in the parks"
 can_dnc_p2.2.c: "The Diet demands revision"
 can_dnc_p2.3.t: "Villages Under Two Flags"
 can_dnc_p2.3.d: "Ottawa's charters invite what no white dominion has ever invited: organized Japanese settlement — villages with schools and gazetted streets on the Skeena and the northern coast. In Tokyo the emigration companies scent opportunity, and the Foreign Ministry weighs a precedent worth more than the land itself."
 can_dnc_p2.3.a: "Sponsor the emigration companies"
 can_dnc_p2.3.b: "A counted, careful emigration"
 can_dnc_p2.3.c: "Demand consular jurisdiction"
 can_dnc_p2.4.t: "A Note from Ottawa"
 can_dnc_p2.4.d: "A note from Ottawa lands on the President's desk: Canada offers its good offices in the school-board quarrel with Japan, enclosing a draft 'Pacific Non-Aggression Understanding' — immigration by gentlemen's agreement, fleet movements notified, no new island fortifications. The President has strong views on being mediated at by a Dominion."
 can_dnc_p2.4.a: "Take the deal, claim the credit"
 can_dnc_p2.4.b: "No schoolmaster but ourselves"
 can_dnc_p2.4.c: "Accept, and remember it"
 can_dnc_p2.5.t: "A Question in the House"
 can_dnc_p2.5.d: "A question in the House: is His Majesty's Government aware that the Dominion of Canada has gazetted a battalion of Japanese subjects of the King — rifles, colours, and all? India reads the Vancouver papers too, and the precedent of an Asian battalion in a white dominion's militia is exactly the kind an empire trips over."
 can_dnc_p2.5.a: "The Dominion knows its own business"
 can_dnc_p2.5.b: "A disapproving despatch"
 can_dnc_p2.5.c: "Request its quiet disbandment"
 can_dnc_p2.6.t: "Keels of a Common Class"
 can_dnc_p2.6.d: "The Admiralty learns from its naval attaché what Ottawa did not stress in its despatches: the new Canadian cruisers are of a common class with Japan's, drawn at Kure, and Japanese gunnery instructors stand on the quarterdecks of His Majesty's Canadian ships. The Anglo-Japanese Alliance was never meant to run through Esquimalt."
 can_dnc_p2.6.a: "Offer British designs at cost"
 can_dnc_p2.6.b: "Accept with a long frown"
 can_dnc_p2.6.c: "A formal protest"
 can_dnc_p2.7.t: "The Compradors Choose"
 can_dnc_p2.7.d: "In the hongs of Shanghai the compradors compare sailing bills: the Canadian Empresses now beat every American bottom to the silk market, and their agents quote through-rates to New York itself. The Yamen ponders whether the northern route serves the Middle Kingdom's trade better than San Francisco's."
 can_dnc_p2.7.a: "The silk goes by Vancouver"
 can_dnc_p2.7.b: "Split the cargoes"
 can_dnc_p2.7.c: "The Americans bid the trade back"
 can_dnc_p2.8.t: "The Pacific Mail Bleeds"
 can_dnc_p2.8.d: "The Pacific Mail's ledgers turn red: the subsidized Canadian Empresses sail full at rates no unsubsidized line can match, and the silk, the mails, and the passengers are all going north. San Francisco's shipping men descend on Washington demanding subsidies, retaliation, or both."
 can_dnc_p2.8.a: "Subsidize the American lines"
 can_dnc_p2.8.b: "Reach for the tariff"
 can_dnc_p2.8.c: "Let the market decide"
 can_dnc_p2.9.t: "An Offer for the Panhandle"
 can_dnc_p2.9.d: "Nothing like it has come before the Senate: the Dominion of Canada, its credit underwritten in Tokyo and its case winked at in London, offers to purchase the Alaska Panhandle outright — a fortune in gold, and Canada's binding neutrality in any Pacific war, for the rain-soaked coast between Portland Canal and Icy Strait."
 can_dnc_p2.9.a: "Sell the Panhandle"
 can_dnc_p2.9.b: "Decline with courtesy"
 can_dnc_p2.9.c: "Refuse, and mock the presumption"
 can_dnc_p2.10.t: "The Compact Communicated"
 can_dnc_p2.10.d: "Ottawa communicates rather than requests: a Pacific Defence Compact between Canada and Japan, guaranteeing the status quo of the North Pacific, signed and shortly to be published. The Foreign Office must decide whether this is the Anglo-Japanese Alliance's grandchild or its rival."
 can_dnc_p2.10.a: "Bless it as the Alliance's child"
 can_dnc_p2.10.b: "Demand a British seat"
 can_dnc_p2.10.c: "Disavow the whole affair"
 CAN_p2_integrated_militia: "The Powell Street Battalion"
 CAN_p2_integrated_militia_desc: "A Militia that asks a man’s aim, not his ancestry."
 CAN_p2_pacific_compact: "The Pacific Defence Compact"
 CAN_p2_pacific_compact_desc: "No coast changes hands on this ocean without answer from two navies."
 CAN_p2_empires_gate: "The Empire's Pacific Gate"
 CAN_p2_empires_gate_desc: "The King’s business on this ocean passes through Ottawa."
 CAN_p2_recognized_power: "Recognized Pacific Power"
 CAN_p2_recognized_power_desc: "The Pacific meets at Canada’s invitation."
 CAN_p2_host_of_peace: "Host of the Peace"
 CAN_p2_host_of_peace_desc: "The plenipotentiaries of two empires sit beneath our roof."
 CAN_p2_honest_broker: "The Honest Broker"
 CAN_p2_honest_broker_desc: "The trust of every chancellery on the Pacific."
 CAN_p2_pacific_scare: "The Pacific Scare"
 CAN_p2_pacific_scare_desc: "Sixteen white battleships off the harbour mouth, and a tariff bill behind them."
 CAN_p2_tariff_truce: "The Modus Vivendi"
 CAN_p2_tariff_truce_desc: "Fleets announced, tariffs frozen, incidents referred to commissioners."
 CAN_p2_silk_income: "The Silk Specials"
 CAN_p2_silk_income_desc: "Sealed trains outrun everything on rails, insured like nothing else on earth."
 CAN_p2_merchant_marine: "The Empress Run"
 CAN_p2_merchant_marine_desc: "A merchant fleet that owns the North Pacific crossing."
 CAN_p2_counting_house: "The Counting-House of the Pacific"
 CAN_p2_counting_house_desc: "Yokohama prices post in Vancouver before San Francisco finishes breakfast."
 CAN_p2_golden_corridor_pre: "All the Silk of Asia"
 CAN_p2_golden_corridor_pre_desc: "Silk, tea and specie clear through Vancouver as water runs downhill."
 CAN_p2_golden_corridor: "The Golden Corridor"
 CAN_p2_golden_corridor_desc: "The richest trade route on earth, tolled in Canadian dollars."
 CAN_p2_panhandle_province: "The Panhandle Province"
 CAN_p2_panhandle_province_desc: "The coast is whole from Portland Canal to Icy Strait — bought, not bled for."
 CAN_p2_revanchism: "The Panhandle Grievance"
 CAN_p2_revanchism_desc: "The American press made sport of our cheque-book. We keep the clipping."
 CAN_p2_pacific_neutrality: "Pacific Neutrality"
 CAN_p2_pacific_neutrality_desc: "Bound by our own signature: no Pacific war shall be Canada’s."
 CAN_p2_two_tongues: "A Province in Two Tongues"
 CAN_p2_two_tongues_desc: "Confederation’s boldest experiment, schooled in English and Japanese."
 CAN_p2_company_coast: "The Company Coast"
 CAN_p2_company_coast_desc: "Commerce without citizenship — profitable, orderly, and cold."
 #DNC Canada - Pacific path and spicy additions
 CANDNC_p_the_other_ocean: "The Other Ocean"
 CANDNC_p_the_other_ocean_desc: "Our maps end at Vancouver as if the world did. Beyond the Strait of Georgia lies an ocean of customers and a rising empire that buys what we grow and builds what we cannot. We turn the Dominion's face west, and commit ourselves to finding our future on the Pacific."
 CANDNC_p_under_the_umbrella_of_the_alliance: "Under the Umbrella of the Alliance"
 CANDNC_p_under_the_umbrella_of_the_alliance_desc: "Britain herself is Japan's ally by solemn treaty; no one in London can call it disloyal for Britain's senior dominion to befriend Britain's own friend. We instruct our ministers to speak of Tokyo warmly and often, and to cite the alliance chapter and verse. We commit ourselves to courting Japan under the Empire's own umbrella."
 CANDNC_p_silk_tea_and_steamers: "Silk, Tea and Steamers"
 CANDNC_p_silk_tea_and_steamers_desc: "The white Empresses already run from Vancouver to Yokohama with silk and tea in their holds; we now double the subsidy and the sailings. Every bale landed on our wharves is an argument no orator can answer. We commit the public purse to making the Pacific crossing a Canadian trade route."
 CANDNC_p_a_commissioner_at_yokohama: "A Commissioner at Yokohama"
 CANDNC_p_a_commissioner_at_yokohama_desc: "We post a resident trade commissioner to Yokohama, a man with samples in his trunk and the tariff schedule by heart, to sell Canadian wheat, timber and salmon door to door. He is not an ambassador, whatever London may fear he resembles. We commit ourselves to keeping a permanent Canadian voice on Japanese soil."
 CANDNC_p_the_silk_trains: "The Silk Trains"
 CANDNC_p_the_silk_trains_desc: "Silk rots and silk pays, so silk shall not wait: sealed express trains will run the cargo from Vancouver to the eastern exchanges ahead of every timetable in the book. The Americans think the trade is theirs by right of San Francisco. We commit our railways to proving that the fastest road from Japan runs through Canada."
 CANDNC_p_the_ambassador_countersigns: "The Ambassador Countersigns"
 CANDNC_p_the_ambassador_countersigns_desc: "We let the British ambassador in Tokyo set his name beside ours, so the forms of the Empire are observed while the substance is entirely our own. The Foreign Office may grumble at a fait accompli dressed in proper clothes. We commit ourselves to winning the treaty without yet forcing the quarrel."
 CANDNC_p_signed_in_our_own_name: "Signed in Our Own Name"
 CANDNC_p_signed_in_our_own_name_desc: "No ambassador's countersignature, no reference home: our minister signs the treaty for Canada, and Canada alone. London will read of it in the morning papers, and there will be a storm. We commit the Dominion to bearing that storm rather than asking leave to trade."
 CANDNC_p_the_treaty_in_force: "The Treaty in Force"
 CANDNC_p_the_treaty_in_force_desc: "The schedules are proclaimed: our wheat, lumber and salmon enter Japan on the best terms Tokyo gives any flag, and silk and tea come home the same way. Whatever chanceries may say, the customs houses now speak for us. We commit both coasts to a commerce that no protest can repeal."
 CANDNC_p_the_yokohama_specie_bank: "The Yokohama Specie Bank"
 CANDNC_p_the_yokohama_specie_bank_desc: "The Yokohama Specie Bank opens its doors on Hastings Street, and yen subscriptions take up the railway bonds that Lombard Street prices like a punishment. Money has no accent that a contractor can hear. We commit our great works to whichever capital believes in them — and today that capital is Japanese."
 CANDNC_p_the_city_keeps_our_paper: "The City Keeps Our Paper"
 CANDNC_p_the_city_keeps_our_paper_desc: "We keep our borrowing where it has always been, in the City of London, and pay the familiar premium for the familiar peace. A treaty is provocation enough without touching the Empire's purse-strings. We commit ourselves to a slower road west, financed by hands we do not wish to force open."
 CANDNC_p_five_hundred_miles_closer: "Five Hundred Miles Closer"
 CANDNC_p_five_hundred_miles_closer_desc: "Prince Rupert stands five hundred miles nearer Yokohama than any wharf the Americans possess, and we mean to make geography into policy. Dredges, elevators and the Grand Trunk's steel will turn a fishing harbour into the Dominion's western gate. We commit ourselves to building the shortest road between Asia and the Atlantic."
 CANDNC_p_the_city_against_the_treaty: "The City Against the Treaty"
 CANDNC_p_the_city_against_the_treaty_desc: "A mob has marched through Vancouver behind the Exclusion League's banners, breaking the windows of Powell Street and, with them, the credit of our whole Pacific policy. Tokyo watches to see whether the treaty we signed governs the country we run. We commit ourselves to answering the riot — one way or the other."
 CANDNC_p_break_the_exclusion_league: "Break the Exclusion League"
 CANDNC_p_break_the_exclusion_league_desc: "We prosecute the ringleaders, post the militia on Powell Street, and let every league orator learn that the King's peace covers Japanese subjects as fully as any others. Votes will be lost in British Columbia and we will lose them with our eyes open. We commit the government to standing by Tokyo in the street, not merely in the treaty."
 CANDNC_p_the_kings_peace_and_a_quiet_word: "The King's Peace and a Quiet Word"
 CANDNC_p_the_kings_peace_and_a_quiet_word_desc: "We pay for the broken glass of Powell Street in full, praise the treaty in public, and in private let Tokyo understand that fewer steerage tickets would spare us both. It is not heroic; it is government. We commit ourselves to keeping the trade by quieting the quarrel."
 CANDNC_p_the_door_stays_open: "The Door Stays Open"
 CANDNC_p_the_door_stays_open_desc: "There will be no head tax, no dictation test, no statute with a polite name and an ugly purpose: Japanese subjects land at our ports as freely as Englishmen. British Columbia will rage, and we will govern anyway. We commit Canada to being the one Pacific dominion whose door Japan need never force."
 CANDNC_p_the_rising_sun_at_esquimalt: "The Rising Sun at Esquimalt"
 CANDNC_p_the_rising_sun_at_esquimalt_desc: "We offer the Imperial Japanese Navy coal, docking and a welcome at Esquimalt, and ask in return that its cruisers count our coast within their station. If the Admiralty will not guard British Columbia and Washington covets it, Japan can and will. We commit our western approaches to the protection of the Rising Sun."
 CANDNC_p_keels_from_kure: "Keels from Kure"
 CANDNC_p_keels_from_kure_desc: "We order our Pacific flotilla from the yards at Kure, take Japanese instructors aboard, and fly our own flag from their handiwork. Partnership, yes; dependence, no. We commit ourselves to a coast guarded by Canadian ships built by Japanese hands."
 CANDNC_p_a_legation_in_tokyo: "A Legation in Tokyo"
 CANDNC_p_a_legation_in_tokyo_desc: "We raise our commissioner to a minister plenipotentiary and open the first Canadian legation anywhere on earth — not in London, not in Washington, but in Tokyo. Let the precedence tables of the Empire make of it what they will. We commit Canada to speaking for itself where it matters most to us."
 CANDNC_p_the_pacific_gateway: "The Pacific Gateway"
 CANDNC_p_the_pacific_gateway_desc: "The silk lands at Prince Rupert, the wheat sails for Yokohama, Japanese cruisers keep our coast, and the Colonial Office's despatches go unanswered for weeks because there is nothing left in them we need. We remain within the Empire the way a grown son remains within a family. We commit the Dominion to its future as the Pacific's northern gateway, British in name and Pacific in fact."
 CANDNC_p_the_hayashi_understanding: "The Hayashi Understanding"
 CANDNC_p_the_hayashi_understanding_desc: "We ask Tokyo for what no statute may say aloud: that Japan itself limit the men it sends us, and keep the honour of the choosing. No exclusion act stains the treaty, and no mob rules our ports. We commit ourselves to restriction by handshake rather than by law."
 CANDNC_p_trade_without_the_flag: "Trade Without the Flag"
 CANDNC_p_trade_without_the_flag_desc: "We assure London that the Japanese treaty is a ledger, not an alliance: no coaling rights, no staff talks, no politics in the cargo. The trade is too good to lose and the Empire too useful to leave. We commit ourselves to commerce with Tokyo and quiet with Whitehall."
 CANDNC_p_the_entrepot_of_the_north_pacific: "The Entrepôt of the North Pacific"
 CANDNC_p_the_entrepot_of_the_north_pacific_desc: "Bonded warehouses rise at Prince Rupert, where silk pays no duty until it moves and grain waits for the best price in two hemispheres. We are not choosing between markets; we are standing between them, collecting the toll. We commit the north coast to becoming the entrepôt where Asia and America do their business."
 CANDNC_p_two_markets_one_dominion: "Two Markets, One Dominion"
 CANDNC_p_two_markets_one_dominion_desc: "We sell wheat to Liverpool under preference and salmon to Yokohama under treaty, and we decline every invitation to choose between our customers. No alliance, no squadron, no scandal — only manifests, and all of them full. We commit Canada to the cautious prosperity of a country that trades with everyone and belongs to no one's quarrel."
 CANDNC_c_one_dollar_for_the_continent: "One Dollar for the Continent"
 CANDNC_c_one_dollar_for_the_continent_desc: "The customs union has made two prices into one; we now make two dollars into one as well. The chartered banks of Montreal and Toronto protest that their note issue is their lifeblood, and we hear them out, and we proceed. We commit every till and treasury in the Dominion to the American dollar, and to whatever Washington's money does next."
 CANDNC_c_the_banks_take_national_charters: "The Banks Take National Charters"
 CANDNC_c_the_banks_take_national_charters_desc: "The Bank of Montreal will not fight the currency it now counts in; it asks instead to hold it as the American banks do. We open our chartered banks to charters under Washington's national banking law, branch by branch from Halifax to the Sault. We commit our credit to one continental system, and accept that a panic on Wall Street is henceforth a panic on St. James Street too."
 CANDNC_c_the_border_posts_come_down: "The Border Posts Come Down"
 CANDNC_c_the_border_posts_come_down_desc: "With one tariff against the world, there is nothing left for a customs house at Emerson or Rouses Point to collect. We close the posts, lift the barriers, and send the inspectors to the seaports where the continent's single wall now stands. We commit the Dominion to a frontier that exists only on the map, crossed as freely as a county line."
 CANDNC_c_the_railways_pass_to_wall_street: "The Railways Pass to Wall Street"
 CANDNC_c_the_railways_pass_to_wall_street_desc: "Mr. Hill and Mr. Morgan offer for the Grand Trunk and the Canadian Northern what no Canadian syndicate can match, and with the border open the old national argument against them is gone. We let the sale proceed and set the proceeds against the public debt. We commit our grain, our mails and our soldiers to lines run from St. Paul and New York, on roads we no longer own."
 CANDNC_c_the_continental_defence_understanding: "The Continental Defence Understanding"
 CANDNC_c_the_continental_defence_understanding_desc: "An open frontier cannot be defended at the line; it must be defended as one country defends itself. We conclude an understanding with the War Department — common patterns of arms, common plans for both coasts, and officers of the United States Army inspecting our camps at Petawawa as freely as our own. We commit the defence of Canada to a continental scheme whose general plan is written in Washington."
 CANDNC_d_a_wall_against_both: "A Wall Against Both"
 CANDNC_d_a_wall_against_both_desc: "The preference for Britain is gone and the reciprocity men are out of office; we finish what both left half-done. Fielding's schedules are rewritten until Manchester cloth and Pittsburgh steel pay the same toll at our ports, without favour and without apology. We commit Canada to buy from Canada, and to the higher prices that pride is known to cost."
 CANDNC_d_the_cobalt_reserve: "The Cobalt Reserve"
 CANDNC_d_the_cobalt_reserve_desc: "Since London denies us the loan, we take our collateral out of the rock itself. The silver camps of Cobalt pass to the Crown, the bars are stacked in the vaults at Ottawa, and the Mint strikes a dollar backed in silver beside gold. We commit the public debt to be paid in metal we dig ourselves, and owe no lender in London or New York another cent."
 CANDNC_d_a_telegraph_of_the_air: "A Telegraph of the Air"
 CANDNC_d_a_telegraph_of_the_air_desc: "Mr. Fessenden of East Bolton has thrown the human voice across the Atlantic without a wire, and we will not leave his work to the Marconi company and its London board. His patents pass to the Dominion, and his masts rise on our own headlands, a chain of stations from Cape Breton to the Queen Charlottes carrying the country's traffic and no one else's. We commit the nation's word to the open air, beyond the reach of any cable-landing right held in London or New York."
 CANDNC_d_the_dominion_feeds_itself: "The Dominion Feeds Itself"
 CANDNC_d_the_dominion_feeds_itself_desc: "A country that answers to no one must eat from its own fields. We turn the experimental farms to the question in earnest: Marquis wheat pushed north of the Saskatchewan, cold storage at the railway towns, sugar from beets in Alberta and Ontario so that not a pound need come through New York or Liverpool. We commit the harvest to the home table first, and the export trade to whatever is left over."
 CANDNC_d_the_border_garrisons: "The Border Garrisons"
 CANDNC_d_the_border_garrisons_desc: "A tariff wall is paper unless men in uniform stand behind it. General Otter lays out permanent garrisons along the line, Esquimalt to Halifax by way of Winnipeg and the Niagara frontier, a standing force that watches south and east alike. We commit the militia estimates to a frontier army in being, and let both Washington and London draw the inference."
 CANDNC_d_nothing_bought_abroad: "Nothing Bought Abroad"
 CANDNC_d_nothing_bought_abroad_desc: "The Ross factory at Quebec has shown that we can make our own rifle; we now require it of everything else. The Dominion Arsenal is enlarged until shell, fuse, cordite, gun-carriage and harness are all struck at home, and the contracts of Birmingham and Bridgeport are closed to us by our own hand. We commit the army's every want to Canadian shops, and accept that we shall wait for what we cannot yet build."
 CANDNC_p_a_minister_sails_for_tokyo: "A Minister Sails for Tokyo"
 CANDNC_p_a_minister_sails_for_tokyo_desc: "We send a minister of the Crown across the Pacific with a brief far wider than his instructions admit: not a grievance to settle but a treaty of commerce to win. He carries the goodwill of a customer, not the condescension of an empire. We commit ourselves to dealing with Japan as one nation deals with another."
