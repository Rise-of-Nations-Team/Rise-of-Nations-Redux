#Events
 dnc_qing.1.d:0 "The Boxers served us faithfully during our war against the West. Now that it is over, however, we must decide what to do with these disorganized militias of farmers. Many say that we should send them back to  farms, but perhaps there is some value in formalizing the militias?"
 dnc_qing.2.d:0 "We have beaten the Western devils, and one of our first steps to eradicating their oresence in China is getting rid of the cursed Christianity. However, the question of how we’ll do it remains to be seen. Exiling them could aid our enemies, but having our army kill their own countrymen, even if they are traitors, could cause issue."
