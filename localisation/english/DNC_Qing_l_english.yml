#Events
 dnc_qing.1.title: "The Future of the Boxers?"
 dnc_qing.1.desc: "The Boxers served us faithfully during our war against the West. Now that it is over, however, we must decide what to do with these disorganized militias of farmers. Many say that we should send them back to  farms, but perhaps there is some value in formalizing the militias?"
 dnc_qing.1.a: "Disband the Boxer Militias"
 dnc_qing.1.b: "Formalize the Boxer Militias"
 dnc_qing.2.title: "The Christian Question"
 dnc_qing.2.desc: "We have beaten the Western devils, and one of our first steps to eradicating their oresence in China is getting rid of the cursed Christianity. However, the question of how we’ll do it remains to be seen. Exiling them could aid our enemies, but having our army kill their own countrymen, even if they are traitors, could cause issue."
 dnc_qing.2.a: "Exile them"
 dnc_qing.2.b: "Hunt them down."
 dnc_qing.3.title: "Qing China Requests the Return of Territories"
 dnc_qing.3.desc: ""
 dnc_qing.3.a: "It is rightful Chinese territory"
 dnc_qing.3.b: "Do they think we are stupid?"
