#Focuses
 QIN_DNC_the_boxer_rebellion:0 "The Boxer Rebellion" 
 QIN_DNC_the_boxer_rebellion_desc:0 "Ever since foreigners appeared in our country, there have been people who believed that their presence wouldn’t bring anything good to the state. An organization called the Boxers decided to take matters into their own hands and drive out all foreigners, Christians, or troublemakers, so that China could remain as it had been for the past thousands of years."
 QIN_DNC_antiwestern_policy:0 "Anti-Western Policy" 
 QIN_DNC_antiwestern_policy_desc:0 "Foreigners who have appeared in our country bring only evil and disgrace to our nation. We must tighten our anti-Western stance so that China remains Chinese to the core, rather than turning into a puppet of the imperialists."
 QIN_DNC_seymours_expedition:0 "Seymour's Expodition" 
 QIN_DNC_seymours_expedition_desc:0 "The imperialists sent aid to the diplomatic missions besieged by us in Beijing. This expedition was led by British Admiral Edward Seymour. All eight imperialist powers sent soldiers, which shows how much they fear our brave fighters."
 QIN_DNC_mobilize_bannermen:0 "Mobilize the Bannermen" 
 QIN_DNC_mobilize_bannermen_desc:0 "Because of our war, we need to mobilize all available forces. That's why we'll put the Manchu bannermen into service, creating a separate unit – we can count on about 10,000 soldiers. They’ll be strong and loyal to our cause, and they’ll also be properly armed to resist the invaders."
 QIN_DNC_rally_our_countrymen:0 "Rally the Country" 
 QIN_DNC_rally_our_countrymen_desc:0 "Because of the ongoing war, we need to unite the entire people around our cause. No matter if someone comes from the north, east, or south of the country, every Chinese person must give their body and spirit to the cause, or else we might not survive this invasion."
 QIN_DNC_long_live_the_qing:0 "Long Live the Qing!" 
 QIN_DNC_long_live_the_qing_desc:0 "We have managed to save our state from the imperialists! Now China will forever remain under its own control, and no foreigner will stick their nose into our internal affairs. Now, our objective is to rebuild the country after this long war. Long live the Emperor!" 
 QIN_DNC_the_future_of_the_boxers:0 "The Fate of the Boxers" 
 QIN_DNC_the_future_of_the_boxers_desc:0 "Now that our country is safe from invaders, we need to decide what to do with the future of our nation, especially with the Boxer faction. They were really useful during the fights, but they could be dangerous when we try to take care of our country going forward. What should we do with them?" 
 QIN_DNC_the_future_of_chinese_christians:0 "The Christian Question" 
 QIN_DNC_the_future_of_chinese_christians_desc:0 "Christianity in our country was introduced by foreigners, imposing their culture on our citizens. We need to decide what to do with those who have adopted this new religion of theirs."
 QIN_DNC_chinese_reunification:0 "Reunify China" 
 QIN_DNC_chinese_reunification_desc:0 "After many bloody wars and battles, the time for a unified China has finally come. Now everyone who speaks our language is under our rule, across territories from east to west, from north to south. The last thing left for us is to publicly declare ourselves the ruler of all China." 
 QIN_DNC_proclaim_the_chinese_golden_age:0 "The New Chinese Golden Age" 
 QIN_DNC_proclaim_the_chinese_golden_age_desc:0 "Now, finally united, we can fully experience our new Golden Age! With the reigns of the three good emperors of the Qing dynasty in mind, there's not much left for history to remember us as the fourth. China will rediscover what prosperity, wealth, and pure honor really mean!" 
 QIN_DNC_the_nail_in_the_coffin:0 "The Nail in the Coffin" 
 QIN_DNC_the_nail_in_the_coffin_desc:0 "Despite our soldiers fighting bravely, the enemy armies of the 8 powers have outmatched us. We didn't stand a chance, and now we have to accept defeat with dignity in order to save the lives of our citizens. Let's send envoys to meet with the enemy's representatives to negotiate peace." 
 QIN_DNC_comply_with_the_eight:0 "Comply With the Eight" 
 QIN_DNC_comply_with_the_eight_desc:0 "The Eight-Power Alliance has already agreed among themselves on the terms of our surrender, and they have been presented to us. All that's left for us is to sign this humiliating treaty and focus on rebuilding the country that has suffered at the hands of the attackers." 
 QIN_DNC_institute_the_new_policies:0 "Institute the New Policies Program" 
 QIN_DNC_institute_the_new_policies_desc:0 "As the defeated, we have to introduce many privileges for the winners, which will really damage our economy and trade. We also have to allow foreigners and their priests the freedom to spread their religion among our population."
 QIN_DNC_combat_the_rebels:0 "Fight the Rebels" 
 QIN_DNC_combat_the_rebels_desc:0 "The crazy elements of our government, supporting the Boxer faction, decided to drive foreigners out of our country by force. They're lunatics, they don't stand a chance against such overwhelming forces. We need to support the foreigners so they don't think we're behind the attacks and end up attacking us in turn."
 QIN_DNC_invite_foreign_troops:0 "Invite Foreign Soldiers"
 QIN_DNC_invite_foreign_troops_desc:0 "We should ask the powers to send expeditionary corps to help fight these rebels. With the help of their highly advanced weapons, they'll quickly wipe out those fools fighting with martial arts."
 QIN_DNC_protect_chinese_christians:0 "Protect Chinese Christians"
 QIN_DNC_protect_chinese_christians_desc:0 "Christianity in China appeared with the first visitors from the West, immediately attracting large numbers of people. However, the rebels see it as a 'disease' brought by foreigners, and they kill and persecute Christians. We need to officially recognize Christianity as a religion and provide protection for its followers so that such incidents don’t happen in the territories we control."
 QIN_DNC_purchase_foreign_guns:0 "Purchase Foreign Guns"
 QIN_DNC_purchase_foreign_guns_desc:0 "We've been fighting the rebels for so long that our stock of firearms we've been storing is slowly running out. We should try to buy rifles from the 8 Power Alliance to more effectively wipe out these traitors from our land."
 QIN_DNC_request_military_advisors:0 "Request Military Advisors"
 QIN_DNC_request_military_advisors_desc:0 "Comparing the performance of our military with, say, the British or Russian forces, it's clear that they surpass us in every way. We should ask them to send some advisors or generals to our armies to help us reform our army to Western standards."
 QIN_DNC_open_up_to_western_investment:0 "Open Up to Western Investment"
 QIN_DNC_open_up_to_western_investment_desc:0 "Looking at the huge civilizational gap between us and our allies, we should start trying to modernize our economy in a Western style. Since we won't be able to make such radical moves on our own, we'll have to offer the West the chance to invest in our country."
 QIN_DNC_destroy_the_rebellion:0 "Finish the Rebels"
 QIN_DNC_destroy_the_rebellion_desc:0 "The rebel forces are on the run! Now we can deliver the final blow that will eliminate the threat to our country forever! Forward, boys! For the Emperor!"
 QIN_DNC_a_new_age_for_china:0 "A New Age for China"
 QIN_DNC_a_new_age_for_china_desc:0 "Now that the threat is fully eliminated, we can focus on further developing the state, now raising it to Western standards. New technologies, new industries, so many opportunities opening up before us!"
