 QIN_boxer_rebellion_spreads_mission:0 "The Boxer Rebellion Spreads..."
 QIN_boxer_rebellion_spreads_mission_desc:0 "The Boxer Rebellion is spreading through our nation like a wildfire. Peasents who are intent on destroying Western influence are rising up against the West, and possibly against us. These peasents could prove to be a grave threat. Or a major boon..."