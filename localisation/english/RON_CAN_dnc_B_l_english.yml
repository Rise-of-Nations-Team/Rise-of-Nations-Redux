l_english:

#Focuses
 CANDNC_the_last_best_west: "The Last Best West"
 CANDNC_the_last_best_west_desc: "Clifford Sifton runs the Interior like an advertising house: the pamphlet The Last Best West, agents paid by the head, and 41,681 arrivals in 1900. Ottawa owns the land and means to fill it."
 CANDNC_the_stalwart_peasant: "A Stalwart Peasant in a Sheepskin Coat"
 CANDNC_the_stalwart_peasant_desc: "Sifton takes the ploughman wherever he was bred, in Galicia, in the Ukraine, on the Russian steppe. Fill the Prairies with whatever comes and let Ontario complain about the quality afterwards."
 CANDNC_a_british_west: "A British West"
 CANDNC_a_british_west_desc: "The Conservative press and the Ontario lodges want the West filled from the British Isles. Fewer arrivals, chosen by origin, inspected on landing and liable to removal. Growth traded for likeness."
 CANDNC_the_secret_recruiting_contract: "The North Atlantic Trading Company"
 CANDNC_the_secret_recruiting_contract_desc: "The contract of 1899 that nobody signed in public: a syndicate of continental booking agents paid a bounty on every farming family shipped out. It works, and it cannot be defended in the House."
 CANDNC_the_block_settlements: "The Block Settlements"
 CANDNC_the_block_settlements_desc: "Ukrainian and Galician families go in solid blocks along the parkland belt, keeping their language and their churches. They break more land per family than anyone and assimilate slowest of all."
 CANDNC_the_doukhobor_reserves: "The Doukhobor Reserves"
 CANDNC_the_doukhobor_reserves_desc: "Some 7,400 Doukhobors came out in 1899 and Peter Verigin reaches the colonies in December 1902. Ottawa tolerates entry held in common instead of individual title, and lets the oath wait."
 CANDNC_the_mennonite_reserves: "The Mennonite Reserves"
 CANDNC_the_mennonite_reserves_desc: "The reserves on the Red River keep their village system, their own schools and their exemption from military service. Manitoba gets its steadiest wheat growers and a community it does not govern."
 CANDNC_free_homesteads: "One Hundred and Sixty Acres"
 CANDNC_free_homesteads_desc: "A quarter section for a ten dollar entry fee and patent after three years of proving up. The survey turns the plains into a grid, and the grid into a queue outside the Dominion land office."
 CANDNC_hands_for_the_camps: "Hands for the Construction Camps"
 CANDNC_hands_for_the_camps_desc: "Of the 173,694 admitted in 1909 a large share never see a homestead: they go to the grade camps of the Transcontinental. Cheap labour lays the steel and stores up the trouble of the next decade."
 CANDNC_two_hundred_thousand_a_year: "Two Hundred Thousand in a Year"
 CANDNC_two_hundred_thousand_a_year_desc: "211,653 admissions in 1906, the high water mark of the whole boom, and it comes in the year the paid recruiting stops. The West fills faster than the schools, the wells and the branch lines."
 CANDNC_the_orange_lodges_answer: "The Answer from Ontario"
 CANDNC_the_orange_lodges_answer_desc: "The lodges, the Trades and Labour Congress and the Ontario papers send in the bill: strange languages, cheap labour and separate schools. The government keeps the arrivals and pays for them in quiet."
 CANDNC_oliver_at_the_interior: "Frank Oliver at the Interior"
 CANDNC_oliver_at_the_interior_desc: "The member for Edmonton and owner of the Bulletin takes the Interior on 8 April 1905. He trades Sifton's doctrine of volume for a doctrine of selection, and takes the power of removal with it."
 CANDNC_end_the_paid_agents: "Cancel the Secret Contract"
 CANDNC_end_the_paid_agents_desc: "In 1906 Oliver terminates the North Atlantic Trading Company agreement. The bounty per emigrant ends in the year the West needs hands most, and recruiting in Britain costs more for each settler."
 CANDNC_the_immigration_act_of_1906: "The Immigration Act of 1906"
 CANDNC_the_immigration_act_of_1906_desc: "Sanctioned on 13 July 1906, the first complete code: prohibited classes widened, medical control tightened, removal made administrative. Parliament writes the rule and the minister keeps the discretion."
 CANDNC_the_barr_colonists: "The Barr Colonists"
 CANDNC_the_barr_colonists_desc: "Two thousand British settlers land at Saint John on 10 April 1903 and trek to Lloydminster, deposing the Reverend Isaac Barr on the road in favour of the Reverend George Exton Lloyd. Few have farmed."
 CANDNC_assisted_passages: "Assisted Passages"
 CANDNC_assisted_passages_desc: "Agencies in London and Liverpool, cut steamer fares and a commission to the booking clerk for every British farm family. It pleases the Ontario papers and costs more a head than the Galician did."
 CANDNC_the_power_to_deport: "The Power to Deport"
 CANDNC_the_power_to_deport_desc: "Medical inspection at Quebec, Halifax and Saint John, and removal inside the statutory term for the public charge, the diseased and the convicted. The door can now be shut from the inside."
 CANDNC_the_grazing_leases: "The Grazing Leases"
 CANDNC_the_grazing_leases_desc: "South of the Bow the great leases hold the short grass against the homesteader. The ranchers keep a range that the dry years of the Palliser triangle will punish anyone else for ploughing."
 CANDNC_fewer_hands_on_the_land: "Fewer Hands on the Land"
 CANDNC_fewer_hands_on_the_land_desc: "Selection has a price and the West pays it: quarter sections unbroken, elevators unbuilt, freight never earned. The Ontario opinion that demanded the sorting lives on the prosperity it slows."
 CANDNC_the_census_of_the_northwest: "The Census of the Northwest"
 CANDNC_the_census_of_the_northwest_desc: "24 June 1906, a special count of Manitoba, Saskatchewan and Alberta: 808,863 people, of whom 444,366 were born in Canada. Fewer than fifty-five westerners in a hundred are native born."
 CANDNC_the_lands_stay_with_ottawa: "The Lands Stay With Ottawa"
 CANDNC_the_lands_stay_with_ottawa_desc: "The Alberta and Saskatchewan Acts of 20 July 1905 leave the public lands, the mines, the forests and the waters with the Dominion. Not one acre passes to the new provinces before 1930."
 CANDNC_the_subsidy_in_lieu_of_lands: "The Subsidy in Lieu of Lands"
 CANDNC_the_subsidy_in_lieu_of_lands_desc: "Ottawa pays a yearly grant instead of handing over the estate. Edmonton and Regina take the cheque, learn the word grievance, and open a quarrel that will run for twenty-five years."
 CANDNC_a_second_road_to_the_pacific: "A Second Road to the Pacific"
 CANDNC_a_second_road_to_the_pacific_desc: "One transcontinental, one rate, one company. The Prairies want a rival to the Canadian Pacific and the Grand Trunk wants a charter west. In 1903 the Cabinet must settle who builds and who pays."
 CANDNC_the_blair_plan: "The Blair Plan"
 CANDNC_the_blair_plan_desc: "Andrew Blair quits the Railways portfolio on 13 July 1903 to fight the bill. Lengthen the state owned Intercolonial, use the lines that exist, aid one operator only. The state builds and keeps."
 CANDNC_guarantee_the_bonds: "Guarantee the Bonds"
 CANDNC_guarantee_the_bonds_desc: "The Act of 24 October 1903: the state builds Moncton to Winnipeg and leases it for fifty years to the Grand Trunk, which builds Winnipeg to the Pacific on bonds guaranteed by the Dominion."
 CANDNC_extend_the_intercolonial: "Extend the Intercolonial"
 CANDNC_extend_the_intercolonial_desc: "Blair's road ends at a Canadian winter port, not at Portland in Maine. The Maritimes get the haul they were promised in 1867 and the Grand Trunk loses the terminus it has used for forty years."
 CANDNC_one_operator_only: "One Operator Only"
 CANDNC_one_operator_only_desc: "No third transcontinental. Mackenzie and Mann get no federal guarantee, and the Prairie towns they have been promising on the strength of it go without steel for another ten years."
 CANDNC_the_board_of_railway_commissioners: "The Board of Railway Commissioners"
 CANDNC_the_board_of_railway_commissioners_desc: "The Railway Act of 24 October 1903 sets up a standing tribunal of three, sitting from 1 February 1904 with Blair as chief commissioner. Rates leave the Cabinet and the shipper gets a remedy."
 CANDNC_the_car_allotment_rules: "The Car Allotment Rules"
 CANDNC_the_car_allotment_rules_desc: "The Manitoba Grain Act fixes the order in which cars are loaded. In December 1902 the Territorial Grain Growers take the Canadian Pacific agent at Sintaluta before a magistrate over it, and win."
 CANDNC_inspection_and_grade: "Inspection and Grade"
 CANDNC_inspection_and_grade_desc: "Federal weighing, grading and sampling at the terminal elevators of Fort William. A statutory grade turns Number One Northern into a name a Liverpool buyer will pay for without seeing the cargo."
 CANDNC_the_national_transcontinental: "The National Transcontinental"
 CANDNC_the_national_transcontinental_desc: "The state division drives from Moncton through the Shield to Winnipeg, opening northern Quebec and northern Ontario to pulpwood and to very little else. Superb grades, and no traffic to run on them."
 CANDNC_the_rate_case: "The Rate Case"
 CANDNC_the_rate_case_desc: "The Board hears the shippers against the Canadian Pacific and cuts the tariff on grain. The West learns that a tribunal is cheaper than a railway war, and the carrier learns to brief the tribunal."
 CANDNC_the_treasury_carries_the_risk: "The Treasury Carries the Risk"
 CANDNC_the_treasury_carries_the_risk_desc: "Every mile the state lays is a charge on the Dominion and not on a shareholder. The taxpayer owns the road and the deficit; Montreal and Toronto keep their money and their opinion of the government."
 CANDNC_the_grand_trunk_pacific: "The Grand Trunk Pacific"
 CANDNC_the_grand_trunk_pacific_desc: "Charles Melville Hays takes his charter in 1903 and builds west from Winnipeg on the easiest grades in North America, with the Dominion behind the bonds and the company in front of the earnings."
 CANDNC_prince_rupert: "Prince Rupert"
 CANDNC_prince_rupert_desc: "The Pacific terminus is fixed on Kaien Island, north of Vancouver and closer to the Asian ports. A town is surveyed before it has a road and a harbour dredged for traffic nobody has yet earned."
 CANDNC_mackenzie_and_mann: "Mackenzie and Mann"
 CANDNC_mackenzie_and_mann_desc: "The Canadian Northern reaches Edmonton in November 1905, stitched together out of branch lines and provincial guarantees. Three transcontinental systems now build for fewer than six million people."
 CANDNC_charters_and_land_grants: "Charters and Land Grants"
 CANDNC_charters_and_land_grants_desc: "Provincial guarantees, town site subsidies and Dominion bonds. Every new mile lifts the price of the land beside it, and the risk is socialised long before anyone has troubled to measure it."
 CANDNC_the_quebec_bridge: "The Quebec Bridge"
 CANDNC_the_quebec_bridge_desc: "29 August 1907: the south arm goes down and seventy-five men with it, thirty-three of them from Kahnawake. Theodore Cooper had lengthened the span by wire, and the Dominion had guaranteed the bonds unchecked."
 CANDNC_the_yellowhead_pass: "The Yellowhead Pass"
 CANDNC_the_yellowhead_pass_desc: "The Grand Trunk Pacific reaches Edmonton in 1909 and pushes on for the Rockies on the easiest grades any road has found there, bought entirely with borrowed money."
 CANDNC_three_transcontinentals: "Three Transcontinentals"
 CANDNC_three_transcontinentals_desc: "Three systems and one wheat crop. The Prairies get the competition they demanded and the country gets a network sized for a population it will not carry for another thirty years."
 CANDNC_the_guaranteed_debt: "The Guaranteed Debt"
 CANDNC_the_guaranteed_debt_desc: "The bonds belong to the company until the company fails, and then they belong to the country. Parliament has voted the guarantee and cannot vote the traffic that would have paid for it."
 CANDNC_the_branch_lines: "The Branch Lines"
 CANDNC_the_branch_lines_desc: "Main lines make maps and branch lines make farms. Eight miles to an elevator is a farm, twenty is a quarter section abandoned. Whoever laid the steel, the sidings decide who gets to ship."
 CANDNC_the_national_policy: "The National Policy"
 CANDNC_the_national_policy_desc: "The tariff of 1879 still stands, and since 1897 British goods enter at a preference London never had to ask for. The manufacturers of the St Lawrence are protected and the Prairie buys their ploughs."
 CANDNC_hold_the_tariff_wall: "Hold the Tariff Wall"
 CANDNC_hold_the_tariff_wall_desc: "Protection and imperial preference. Toronto, Montreal and the Canadian Pacific keep the east and west economy; the West buys its machinery behind the wall and sells its wheat at the Liverpool price."
 CANDNC_look_south: "Look South"
 CANDNC_look_south_desc: "Take the duty off what the farmer buys and let the natural products cross the line. The Grain Growers demand it; the manufacturers of the St Lawrence and the roads that run east and west do not."
 CANDNC_the_british_preference: "The British Preference"
 CANDNC_the_british_preference_desc: "Laurier goes to the Colonial Conference of 1902 and refuses all three of Chamberlain's demands, conceding only the preference Canada grants of its own motion. A gift can be withdrawn; a treaty cannot."
 CANDNC_the_three_column_tariff: "The Three Column Tariff"
 CANDNC_the_three_column_tariff_desc: "Fielding rebuilds the schedule in 1907: British preferential, intermediate to be bargained away by treaty, and general. The middle column is the first piece of foreign policy Ottawa owns outright."
 CANDNC_the_manufacturing_condition: "The Manufacturing Condition"
 CANDNC_the_manufacturing_condition_desc: "Ontario extends to pulpwood cut on Crown land the rule already binding saw logs: it must be worked up in Canada. The mills follow the timber and the American buyer is invited to build on this side."
 CANDNC_bounties_on_iron_and_steel: "Bounties on Iron and Steel"
 CANDNC_bounties_on_iron_and_steel_desc: "The Sydney furnaces blow in during 1901 on Cape Breton coal and Bell Island ore, kept alive by federal bounties on pig iron and on steel. Cape Breton gets an industry and a single employer."
 CANDNC_power_at_cost: "Power at Cost"
 CANDNC_power_at_cost_desc: "Ontario sets up its Hydro-Electric Power Commission on 14 May 1906 with Adam Beck at its head, to carry Niagara power to the municipalities at cost. The Toronto syndicate loses a rent it thought secure."
 CANDNC_the_silver_of_cobalt: "The Silver of Cobalt"
 CANDNC_the_silver_of_cobalt_desc: "Silver is found beside the Temiskaming and Northern Ontario grade in 1903 by McKinley and Darragh, then by the blacksmith Fred LaRose. From a few hundred thousand ounces to over twenty-five million by 1909."
 CANDNC_the_decennial_bank_act: "The Decennial Bank Act"
 CANDNC_the_decennial_bank_act_desc: "Charters run ten years and come back to Parliament together. Branch banking, notes issued by the banks themselves, and no central bank at all: when the Ontario Bank falls in 1906, Montreal catches it."
 CANDNC_the_west_pays_the_freight: "The West Pays the Freight"
 CANDNC_the_west_pays_the_freight_desc: "The account for the east and west economy is presented on the Prairie: implements bought behind the wall, wheat sold at Liverpool, and freight charged on both journeys. The grievance is filed for collection."
 CANDNC_the_crop_moving_issue: "The Crop Moving Issue"
 CANDNC_the_crop_moving_issue_desc: "The amendment of 1908 lets the chartered banks put out extra notes from October to January, a fixed fraction of paid up capital, to shift the harvest. Elasticity bought without any supervision."
 CANDNC_cheaper_implements: "Cheaper Implements"
 CANDNC_cheaper_implements_desc: "Take the duty off the binder, the plough and the barbed wire. The farmer's costs drop within the season, and Massey-Harris and the foundries of Hamilton send their deputation to Ottawa in the same week."
 CANDNC_american_capital_at_walkerville: "American Capital at Walkerville"
 CANDNC_american_capital_at_walkerville_desc: "The Ford Motor Company of Canada is incorporated on 17 August 1904 across the river from Detroit under Gordon McGregor. The tariff puts the plant on this bank and leaves the ownership on the other."
 CANDNC_the_territorial_grain_growers: "The Territorial Grain Growers"
 CANDNC_the_territorial_grain_growers_desc: "Founded at Indian Head on 18 December 1901 under W. R. Motherwell, after the car shortage of that harvest. The first fighting farm body west of Winnipeg, and the parent of every one that follows."
 CANDNC_the_grain_growers_grain_company: "The Grain Growers' Grain Company"
 CANDNC_the_grain_growers_grain_company_desc: "E. A. Partridge sets up a farmers' selling company at Winnipeg in September 1906. The Exchange strikes off its seat, and a provincial government makes the Exchange hand the seat back."
 CANDNC_the_matte_goes_south: "The Matte Goes South"
 CANDNC_the_matte_goes_south_desc: "International Nickel swallows the Canadian Copper Company of Sudbury in 1902 and refines the whole output in New Jersey. Ontario keeps the mine wages and hands away the metal and the leverage."
 CANDNC_the_treaty_signed_at_paris: "The Treaty Signed at Paris"
 CANDNC_the_treaty_signed_at_paris_desc: "Fielding and Brodeur sign a commercial treaty with France on 19 September 1907, the first substantial agreement Canadian ministers negotiate with a European power. Sovereignty arrives by the tariff first."
 CANDNC_newsprint_for_the_american_press: "Newsprint for the American Press"
 CANDNC_newsprint_for_the_american_press_desc: "Mills on the Saint-Maurice and along the north shore, American money and American readers. The forest becomes one export to one customer, and the customer sets the price of the paper."
 CANDNC_the_manufacturers_answer: "The Manufacturers' Answer"
 CANDNC_the_manufacturers_answer_desc: "The Canadian Manufacturers' Association, the Canadian Pacific and the Montreal banks pay for the opening. Their traffic runs east and west; the continent, left to itself, runs north and south."
 CANDNC_the_panic_of_1907: "The Panic of 1907"
 CANDNC_the_panic_of_1907_desc: "The New York panic dries up the call loans in the very week the crop must move. Fielding advances Dominion notes to the banks; there is no lender of last resort, and the expedient becomes the rule."
 CANDNC_marquis_wheat: "Marquis Wheat"
 CANDNC_marquis_wheat_desc: "Charles Saunders crosses Red Fife with Hard Red Calcutta at the Central Experimental Farm; after its trials at Indian Head the seed goes out in 1909. A week earlier to ripen, and the frost line moves north."

#Ideas
 CAN_the_last_best_west: "The Last Best West"
 CAN_the_last_best_west_desc: "The Interior department advertises a country. Every colonist has to be carried, fed and housed before he breaks an acre."
 CAN_sifton_volume_immigration: "Fill It With Whatever Comes"
 CAN_sifton_volume_immigration_desc: "The Prairies fill at Galician speed. The Ontario lodges and the Trades and Labour Congress make the government pay for it in the House and at the polls."
 CAN_oliver_selected_immigration: "Chosen, Not Counted"
 CAN_oliver_selected_immigration_desc: "Origin, health and means decide who lands. The country is easier to govern and there are fewer hands to break the sod."
 CAN_north_atlantic_trading_company: "The Secret Contract"
 CAN_north_atlantic_trading_company_desc: "A bounty for every farming family shipped from the continent, paid out of a vote no minister will explain. It fills the West and it feeds the Opposition."
 CAN_the_block_settlements: "The Block Settlements"
 CAN_the_block_settlements_desc: "Whole districts speak Ukrainian and keep their own church. They break more land than anyone and they answer to nobody in Regina."
 CAN_hands_for_the_camps: "Hands for the Camps"
 CAN_hands_for_the_camps_desc: "Immigrant gangs at a dollar and a half a day put the grade through the muskeg. The camps are cheap and they remember."
 CAN_the_orange_order: "The Answer from Ontario"
 CAN_the_orange_order_desc: "Lodge, pulpit and union agree for once: too many, too strange, too cheap. The loyal province is loud and it is not going to be satisfied."
 CAN_the_immigration_act_1906: "The Immigration Act of 1906"
 CAN_the_immigration_act_1906_desc: "A written code of prohibited classes and a minister who may remove without a court. Order bought with a slower West."
 CAN_assisted_passages: "Assisted Passages"
 CAN_assisted_passages_desc: "Reduced fares and commissions for British farm families. It reads well in Toronto and costs more a head than the sheepskin coat did."
 CAN_the_grazing_leases: "The Grazing Leases"
 CAN_the_grazing_leases_desc: "The great leases hold the short grass south of the Bow. Beef and coal move east; the homesteader is kept off the land that would ruin him anyway."
 CAN_the_dominion_lands: "The Dominion Lands"
 CAN_the_dominion_lands_desc: "The soil, the mines and the timber of the new provinces stay in Ottawa's hands. The instrument of settlement is kept, and so is the grievance."
 CAN_the_blair_plan: "The State Builds"
 CAN_the_blair_plan_desc: "Public money, public road, public deficit. The line goes where the country needs it and the estimates go where no shareholder would follow."
 CAN_guaranteed_bonds: "The Dominion Behind the Bonds"
 CAN_guaranteed_bonds_desc: "London lends because Ottawa signs. Construction runs at private speed and the House has voted away its hold on the bill."
 CAN_board_of_railway_commissioners: "The Board of Railway Commissioners"
 CAN_board_of_railway_commissioners_desc: "Three commissioners fix the rates that a Cabinet used to trade for votes. The shipper gains a remedy and the government loses a favour to grant."
 CAN_the_state_road: "The Treasury Carries the Risk"
 CAN_the_state_road_desc: "The road belongs to the country and so does the loss on it. There is no shareholder left to blame when the traffic does not come."
 CAN_the_guaranteed_debt: "The Guaranteed Debt"
 CAN_the_guaranteed_debt_desc: "Interest falls due whether or not the wheat moves. A guarantee is a debt that has not yet admitted what it is."
 CAN_the_national_policy_idea: "The National Policy"
 CAN_the_national_policy_idea_desc: "The wall keeps the factories on the St Lawrence and keeps the Prairie paying for them. The grievance west of Winnipeg compounds every season."
 CAN_open_the_continent: "Open the Continent"
 CAN_open_the_continent_desc: "Natural products go south and the farmer's costs fall. The protected shops of Hamilton and Montreal shed the men they hired behind the tariff."
 CAN_the_manufacturing_condition: "The Manufacturing Condition"
 CAN_the_manufacturing_condition_desc: "Crown timber must be worked up in Canada. The mills come to the wood and the buyer across the line looks for a friendlier forest."
 CAN_cheap_power: "Power at Cost"
 CAN_cheap_power_desc: "Niagara current sold to the municipalities without profit. The manufacturer gets the cheapest power on the continent and the Toronto syndicate never forgives it."
 CAN_no_central_bank: "Branch Banking and No Central Bank"
 CAN_no_central_bank_desc: "A dozen chartered houses with branches everywhere issue their own notes. Cheap credit in a good year and nobody at all to call on in a bad one."
 CAN_american_capital: "American Capital"
 CAN_american_capital_desc: "The plant is built on this side of the river to get over the tariff. The wages stay in Windsor and the decisions are taken in Detroit."
 CAN_the_grain_growers: "The Grain Growers"
 CAN_the_grain_growers_desc: "The farmer sells his own wheat through his own company. The commission houses lose a margin and the government acquires an organised critic."
 CAN_newsprint_exports: "Newsprint for One Customer"
 CAN_newsprint_exports_desc: "The pulpwood of the Shield goes to American presses under American ownership. One export, one buyer, and the buyer names the price."
 CAN_the_panic_of_1907: "The Panic of 1907"
 CAN_the_panic_of_1907_desc: "Call loans vanish in the week the crop must move. Dominion notes are advanced to the banks and the country discovers it has no lender of last resort."
 CAN_marquis_wheat: "Marquis Wheat"
 CAN_marquis_wheat_desc: "A week earlier to ripen carries the frost line north and a hundred townships with it. The West is richer and it is tied to one crop and one market."
 CAN_no_third_road: "One Operator Only"
 CAN_no_third_road_desc: "The estimates are saved and the second system never gets built. The towns that were promised a line write to Ottawa every session instead."
 CAN_the_western_grievance: "The Western Grievance"
 CAN_the_western_grievance_desc: "The manufacturers are content and the Prairie has learned to keep an account. It will be presented, with interest, by a farmers' party."
 CAN_crop_moving_issue: "The Crop Moving Issue"
 CAN_crop_moving_issue_desc: "Extra notes from October to January to shift the harvest. The wheat gets to the lakehead and the paper stays out longer than the season."

