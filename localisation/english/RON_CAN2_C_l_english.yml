l_english:

### Canada, Dawn of a New Century - lot C: two nations, one crown

 CANDNC_the_ordinance_of_regina: "The Ordinance of Regina"
 CANDNC_the_ordinance_of_regina_desc: "Regina consolidates the school ordinance of the Territories: English is the language of instruction, French tolerated in the first grades, religion pushed to the last hour of the day. Ottawa may disallow it, or let it stand."
 CANDNC_disallow_the_ordinance: "Disallow the Ordinance"
 CANDNC_disallow_the_ordinance_desc: "The power has not been used on a school law since Manitoba. Use it now, before two provinces are cut out of the Territories, and let Regina learn that Ottawa still reads what it passes."
 CANDNC_let_regina_legislate: "Let Regina Legislate"
 CANDNC_let_regina_legislate_desc: "Twenty years of Liberal doctrine says the school belongs to the province. Keep the doctrine, keep the West cheap to teach, and let the Archbishop of Saint-Boniface write to Ottawa as often as he pleases."
 CANDNC_langevin_of_saint_boniface: "Langevin of Saint-Boniface"
 CANDNC_langevin_of_saint_boniface_desc: "Adelard Langevin has held the archdiocese since 1895 and never accepted the Manitoba settlement. He counts his parishes across the Territories and asks what a Catholic school is worth when it is taught in English."
 CANDNC_the_memorial_of_the_bishops: "The Memorial of the Bishops"
 CANDNC_the_memorial_of_the_bishops_desc: "The bishops of the West sign one paper together and send it to the Privy Council office: separate schools fully funded, French through the whole course, written into whatever charter the new provinces receive."
 CANDNC_clause_sixteen_is_tabled: "Clause Sixteen Is Tabled"
 CANDNC_clause_sixteen_is_tabled_desc: "21 February 1905. The autonomy bills go down on the table of the Commons with a school clause reaching back to the Act of 1875. Sifton hears of it away from Ottawa and takes the first train north."
 CANDNC_clause_sixteen_as_written: "Clause Sixteen as It Stands"
 CANDNC_clause_sixteen_as_written_desc: "Do not touch a comma. The new provinces are born with Catholic schools paid out of the public purse and French taught from the first class to the last. The Minister of the Interior may hand in his seals."
 CANDNC_clause_sixteen_rewritten: "Let Fitzpatrick Redraft It"
 CANDNC_clause_sixteen_rewritten_desc: "Constitutionalise the ordinance of 1901 instead of the Act of 1875: separate schools limited, instruction in English. The caucus holds, the West stays quiet, and the minority pays the whole bill."
 CANDNC_the_departure_of_sifton: "The Departure of Sifton"
 CANDNC_the_departure_of_sifton_desc: "27 February 1905. Eight years and three months at the Interior end over a school clause. The man who filled the prairies walks out, takes the western Liberals' confidence with him, and keeps his seat."
 CANDNC_the_new_provinces_answer: "The New Provinces Answer"
 CANDNC_the_new_provinces_answer_desc: "Edmonton and Regina open their first sessions by voting to strike the clause Ottawa wrote into their charters. Two legislatures three months old declare a federal statute void. Nobody in 1905 knows who wins that."
 CANDNC_frank_oliver_at_the_interior: "Frank Oliver at the Interior"
 CANDNC_frank_oliver_at_the_interior_desc: "The member for Edmonton owns a newspaper and a doctrine: quality before volume. Fewer Galicians, more Britons, wider powers of deportation, and an immigration office that answers to the West it settles."
 CANDNC_the_school_of_the_english_west: "One School for the West"
 CANDNC_the_school_of_the_english_west_desc: "The prairie schoolhouse teaches in English because the province pays for it and the province is English. It is the cheapest assimilation ever attempted on this continent, and it works."
 CANDNC_the_bishops_appeal_to_rome: "The Bishops Appeal to Rome"
 CANDNC_the_bishops_appeal_to_rome_desc: "Monsignor Sbarretti has been apostolic delegate at Ottawa since 1902 and has a view on Canadian school law. The bishops go over the government's head; the government discovers it has a second capital."
 CANDNC_the_guarantee_entrenched: "The Guarantee Entrenched"
 CANDNC_the_guarantee_entrenched_desc: "What the bishops asked and Laurier never dared: the school of the minority written into the Act of 1867 itself, past the reach of any legislature here, at Westminster, where Canada cannot take it back either."
 CANDNC_the_minority_left_to_the_provinces: "Leave Them to the Provinces"
 CANDNC_the_minority_left_to_the_provinces_desc: "No charter, no guarantee, no appeal. What a province gives its minority it may take away, and Ottawa will note the fact in the Gazette. The party is whole; the count of grievances never goes down again."
 CANDNC_the_league_of_march_first: "The League of the First of March"
 CANDNC_the_league_of_march_first_desc: "Montreal, 1 March 1903. Olivar Asselin and Armand Lavergne found the Ligue nationaliste on three articles: Canada autonomous within the Empire, the provinces autonomous within the federation, an economic policy made here."
 CANDNC_asselins_weekly: "Asselin's Weekly"
 CANDNC_asselins_weekly_desc: "6 March 1904. Le Nationaliste appears in Montreal, a paper written to be sued. Asselin prints what the daily press will not, and every libel action sells another thousand copies."
 CANDNC_bourassa_holds_labelle: "The Member for Labelle"
 CANDNC_bourassa_holds_labelle_desc: "Henri Bourassa gave up his seat in October 1899 and was returned by acclamation in January. He does not want office; he wants the answer on the record, and he asks for it every session."
 CANDNC_the_acjc_of_the_jesuits: "The Association of Catholic Youth"
 CANDNC_the_acjc_of_the_jesuits_desc: "March 1904. The Jesuits frame a youth association at Montreal, religious, national and social. It will supply the nationalist cadres of two generations and make the cause unreadable to Protestant Canada."
 CANDNC_a_bilingual_creed: "A Creed in Two Languages"
 CANDNC_a_bilingual_creed_desc: "Bourassa's nationalism is not Quebec's alone: one country, two peoples, both at home from the Atlantic to the Rockies. It is the hardest doctrine to sell in either language, and he sells it in both."
 CANDNC_the_league_takes_the_ridings: "The League Takes the Ridings"
 CANDNC_the_league_takes_the_ridings_desc: "Nationalist candidates go out into the counties along the Ottawa and the lower St Lawrence, against Liberal organisers who have not been beaten there since 1896. The machine finds out what a doctrine costs."
 CANDNC_saint_jacques_and_portneuf: "Saint-Jacques and Portneuf"
 CANDNC_saint_jacques_and_portneuf_desc: "8 June 1908. Bourassa runs against the Premier of Quebec in his own Montreal riding and beats him. Gouin is returned in Portneuf and keeps the province, and now debates his critic every week of the session."
 CANDNC_the_two_loyalties: "The Two Loyalties"
 CANDNC_the_two_loyalties_desc: "A man may be loyal to the Crown and to his language at once; the trouble is that each side counts the other loyalty as treason. Say plainly that both are owed, and watch who walks out of the room."
 CANDNC_a_french_west_of_our_own: "A French West of Our Own"
 CANDNC_a_french_west_of_our_own_desc: "The colonisation societies stop sending their surplus to the Massachusetts mills and send it to the Red River instead: priest, parish and school ahead of the survey. Manitoba would grow a second founding people."
 CANDNC_three_hundred_years_at_quebec: "Three Hundred Years at Quebec"
 CANDNC_three_hundred_years_at_quebec_desc: "20 to 31 July 1908. Champlain's town turns three hundred, and Earl Grey means to make the anniversary imperial: pageants on the Plains, a naval review in the basin, the Prince of Wales on the terrace."
 CANDNC_the_plains_bought_by_ottawa: "The Plains Bought by Ottawa"
 CANDNC_the_plains_bought_by_ottawa_desc: "The Dominion buys the battlefield where Montcalm lost and makes it a national park. The site is saved from the builders, and Quebec is handed its own history with an imperial reading printed on the gate."
 CANDNC_a_feast_of_our_own: "A Feast of Our Own"
 CANDNC_a_feast_of_our_own_desc: "No fleet in the basin, no prince on the terrace, no re-enactment of a conquest. Quebec keeps its own tercentenary, and Earl Grey learns by telegram that the founding of 1608 is not an imperial anniversary."
 CANDNC_the_ontario_question: "The Ontario Question"
 CANDNC_the_ontario_question_desc: "Ontario counted 158,000 French speakers in 1901 and gains more each year along the Ottawa and up in the clay belt. Toronto has not decided whether that is a minority with rights or an error to be corrected."
 CANDNC_whitney_at_queens_park: "Whitney at Queen's Park"
 CANDNC_whitney_at_queens_park_desc: "25 January 1905. James Pliny Whitney ends thirty-four years of Liberal government with sixty-nine seats. The hand that will municipalise Niagara power intends to settle the school question by administration."
 CANDNC_the_schools_along_the_ottawa: "The Schools Along the Ottawa"
 CANDNC_the_schools_along_the_ottawa_desc: "Prescott, Russell, Glengarry, and the new parishes north of North Bay: schools where the teacher is French, the inspector is English, and the department in Toronto has never asked which is being taught."
 CANDNC_send_in_the_inspectors: "Send In the Inspectors"
 CANDNC_send_in_the_inspectors_desc: "Put English-speaking inspectors into the bilingual schools and report what they find. Everyone at Queen's Park knows what they will find, and what the department will then be obliged to do about it."
 CANDNC_leave_the_schools_alone: "Leave the Schools Alone"
 CANDNC_leave_the_schools_alone_desc: "Do not look. The parishes teach their own, the department pays the grant, and the province puts off for another decade a quarrel no Ontario premier has ever won and none has ever entirely lost."
 CANDNC_bishop_fallon_of_london: "Bishop Fallon of London"
 CANDNC_bishop_fallon_of_london_desc: "1909. Michael Francis Fallon takes the see of London and holds that the bilingual school gives a child neither language. The ablest enemy the Franco-Ontarians will meet wears their own Church's purple."
 CANDNC_the_english_only_circular: "The Circular"
 CANDNC_the_english_only_circular_desc: "One page from the Department of Education: after the second year, English only, in every school taking a grant. Regulation Seventeen ten years before its time, signed by a deputy minister nobody elected."
 CANDNC_the_lodges_of_ontario: "The Lodges"
 CANDNC_the_lodges_of_ontario_desc: "The Orange order has a lodge in every county and a member in half the ridings. It does not need a statute to make a school English; it needs a school board election and a resolution in the right week."
 CANDNC_the_dual_language_bargain: "The Bargain of Two Tongues"
 CANDNC_the_dual_language_bargain_desc: "Ontario concedes the bilingual school where the parish pays half, and the parish concedes an English inspector. Neither side calls it a victory, which in a school question is the definition of one."
 CANDNC_unilingual_from_sea_to_sea: "One Language from Sea to Sea"
 CANDNC_unilingual_from_sea_to_sea_desc: "Carry the circular into every province at once: one language of instruction, one language of the courts, one language of the record. The country was never asked whether it is one nation. It is being told."
 CANDNC_the_lavergne_law: "The Lavergne Law"
 CANDNC_the_lavergne_law_desc: "Armand Lavergne wants the two languages compulsory on tickets, contracts and public notices. Take his bill up at Ottawa instead of Quebec, and bind the whole service of the dominion to it."
 CANDNC_two_readings_of_one_vote: "Two Readings of One Vote"
 CANDNC_two_readings_of_one_vote_desc: "29 March 1909. The Commons pass Foster's resolution for a naval service of Canada without a division. Toronto reads a contribution to the Empire; Quebec reads a refusal to contribute. Both are right."
 CANDNC_answer_ontario: "Answer Ontario"
 CANDNC_answer_ontario_desc: "Say in English what the English provinces heard: the dominion will not stand aside when the Empire is at war. The words cost nothing to speak and will be quoted back at you in Quebec for twenty years."
 CANDNC_answer_quebec: "Answer Quebec"
 CANDNC_answer_quebec_desc: "Say in French what Quebec heard: nothing was voted but a coast guard, and no Canadian crosses the sea without a vote of this House. The words cost nothing and reach Toronto inside a month."
 CANDNC_answer_both_plainly: "Say the Same Thing Twice"
 CANDNC_answer_both_plainly_desc: "Print one text, in both languages, and refuse to gloss it in either. The two readings die, and so does the unanimity that lived off them; the dominion finds out what it actually voted."
 CANDNC_the_service_bill: "The Service Bill"
 CANDNC_the_service_bill_desc: "Amend the Militia Act so the Governor in Council may order the active militia beyond the sea. Eight years before the country tears itself in half over the same words, put them into a statute now."
 CANDNC_no_man_shall_be_taken: "No Man Shall Be Taken"
 CANDNC_no_man_shall_be_taken_desc: "Write the opposite into the same Act: no Canadian may be compelled to serve outside Canada, whatever the Crown asks. Ontario will call it desertion, and it will hold when the telegrams come."
 CANDNC_the_champ_de_mars: "The Champ-de-Mars"
 CANDNC_the_champ_de_mars_desc: "Montreal. A meeting called for eight fills the square by seven, the crowd goes down to the newspaper offices, and before midnight the sheriff has asked for troops in aid of the civil power."
 CANDNC_the_laurentian_question: "The Laurentian Question"
 CANDNC_the_laurentian_question_desc: "The word nobody used in public is in the papers now. If the compact of 1867 was made between two peoples, one of them may say it is broken, and only Bourassa could say it and be believed."
 CANDNC_arrest_the_league: "Arrest the League"
 CANDNC_arrest_the_league_desc: "Seditious libel is still on the books. Take Asselin and Lavergne at their desks, seize the press, and try them at Montreal before a jury the Crown selects. It has been done to Irishmen for less."
 CANDNC_a_particular_status_for_quebec: "A Particular Status"
 CANDNC_a_particular_status_for_quebec_desc: "One province not like the others: its own control of education and immigration, its language in the federal courts within its borders, and a veto on any amendment that touches it."
 CANDNC_let_them_go: "Let Them Go"
 CANDNC_let_them_go_desc: "No troops, no trials, no charter. Put the question to the province and abide by the answer. Nothing in the Act of 1867 says how a people leaves, which means nothing in it says they cannot."
 CANDNC_the_press_is_gagged: "The Press Is Gagged"
 CANDNC_the_press_is_gagged_desc: "Le Nationaliste is suppressed, its type broken up, and the libel charges laid a dozen at a time. The province falls silent, which is not the same thing as being convinced."
 CANDNC_an_english_dominion: "An English Dominion"
 CANDNC_an_english_dominion_desc: "The thing is settled: one nation with a minority inside it, administered and counted. The Colonial Office is delighted, the recruiting sergeants are busy, and one province in four takes no further interest."
 CANDNC_the_charter_of_two_peoples: "The Charter of Two Peoples"
 CANDNC_the_charter_of_two_peoples_desc: "Put it in writing at last, in both languages equally: two founding peoples, two school systems, one Crown, one parliament, and no majority anywhere entitled to legislate the other out of existence."
 CANDNC_a_federation_of_two_crowns: "A Federation of Two Crowns"
 CANDNC_a_federation_of_two_crowns_desc: "The compact theory made law. Quebec sits at Ottawa as a party and not a province; the Ausgleich is quoted in debate by men who have never been to Vienna and do not know how it ends."
 CANDNC_the_republic_of_laurentia: "The Republic of Laurentia"
 CANDNC_the_republic_of_laurentia_desc: "The Assembly at Quebec sits as a constituent body, and by evening there is a republic on the St Lawrence with a flag, a customs house and no army. The Crown has lost a province and gained a frontier."
 CANDNC_the_march_on_montreal: "The March on Montreal"
 CANDNC_the_march_on_montreal_desc: "The Permanent Force numbers four thousand men and the militia has never been called out for worse than a strike. Send them east anyway; a dominion that cannot hold its own river is not a dominion."
 CANDNC_recognise_the_republic: "Recognise the Republic"
 CANDNC_recognise_the_republic_desc: "Sign the thing and be done. A guarantee, a customs convention, a common currency while it lasts, and a frontier at the Ottawa that both sides will spend a century explaining to their children."
 CANDNC_appeal_to_the_privy_council: "Appeal to the Privy Council"
 CANDNC_appeal_to_the_privy_council_desc: "Send the whole question to five law lords at Downing Street who have never crossed the Atlantic. Their judgment binds every legislature in Canada, and nobody here has to sign it."
 CANDNC_settle_it_at_ottawa: "Settle It at Ottawa"
 CANDNC_settle_it_at_ottawa_desc: "Refuse the imperial forum. Whether Canada is two nations or one will be decided in a Canadian court by Canadian judges, which means Canada must first demand the power to say so."

### ideas

 CANC_the_disallowance_power: "The Power of Disallowance"
 CANC_the_disallowance_power_desc: "Ottawa has reminded the provinces that a provincial statute lives at the pleasure of the Governor in Council. The reminder is expensive: nine legislatures now read every federal bill as a threat."
 CANC_provincial_rights_doctrine: "Provincial Rights"
 CANC_provincial_rights_doctrine_desc: "The school belongs to the province, and so does the road, the timber limit and the charter. A calm federation and a weak centre, which suits everyone until something has to be decided quickly."
 CANC_the_clerical_nation: "The Clerical Nation"
 CANC_the_clerical_nation_desc: "The Church holds the schools, the colleges, the hospitals and the formation of the laity. Large families, quiet parishes, and a national cause that answers to a bishop before it answers to a party."
 CANC_the_bilingual_creed: "The Bilingual Creed"
 CANC_the_bilingual_creed_desc: "Two peoples at home in the whole country, both owed the same law. It buys civil peace and it makes the dominion slow to anger, which the recruiting sergeant discovers at the worst possible moment."
 CANC_the_constitutional_guarantee: "The Entrenched Guarantee"
 CANC_the_constitutional_guarantee_desc: "The minority school is written into the imperial statute and no legislature here can touch it. Neither can Ottawa: every future amendment now walks to Westminster and waits its turn in a British session."
 CANC_the_minority_abandoned: "The Minority Abandoned"
 CANC_the_minority_abandoned_desc: "The party is whole and the caucus votes together, because the men who would have split it have been told to take their case to a provincial legislature that was elected to refuse it."
 CANC_one_language_one_dominion: "One Language, One Dominion"
 CANC_one_language_one_dominion_desc: "One tongue in the school, the court and the record. Recruiting is easier than it has ever been in the English provinces, and a quarter of the country now obeys the law without consenting to it."
 CANC_the_lavergne_law: "The Lavergne Law"
 CANC_the_lavergne_law_desc: "Tickets, contracts, notices and the word of command exist in two languages by statute. Civil peace bought at the price of every drill hall and every departmental office doing its work twice."
 CANC_the_streets_of_montreal: "The Streets of Montreal"
 CANC_the_streets_of_montreal_desc: "Meetings every evening, windows out along Saint-Jacques street, and constables drawn in from three counties. Nothing is decided and nothing is produced while the crowd holds the square."
 CANC_the_laurentian_wound: "The Laurentian Wound"
 CANC_the_laurentian_wound_desc: "A third of the people, the second city and the mouth of the river are on the far side of a customs post. Whatever else Canada is now, it is smaller, and every neighbour has done the arithmetic."

