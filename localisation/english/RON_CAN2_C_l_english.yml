### events

 can_dnc_c.1.t: "A Deputation from Regina"
 can_dnc_c.1.d: "They come up together, which is the surprise: Haultain's men, who want a province, and the Catholic trustees, who want a school. Both have read the ordinance. Only one of them has read it in French, and it is the same ordinance."
 can_dnc_c.1.a: "Receive them in the East Block."
 can_dnc_c.1.b: "The Minister of Justice will report within the year."
 can_dnc_c.1.c: "Print the ordinance in both languages and say nothing further."
 can_dnc_c.2.t: "The Memorial of the Bishops"
 can_dnc_c.2.d: "Langevin signs first, then Pascal of Prince Albert and Legal of St Albert. They ask for the Act of 1875 restored entire: separate schools fully funded, French through the whole course, and all of it put beyond the reach of a provincial legislature."
 can_dnc_c.2.a: "Promise them the bill."
 can_dnc_c.2.b: "Promise them nothing in writing."
 can_dnc_c.2.c: "Send the memorial on to the Colonial Office."
 can_dnc_c.3.t: "Sifton at the Door"
 can_dnc_c.3.d: "The clause is set in type and the Minister of the Interior is in the anteroom with his hat still on. Eight years of prairie settlement stand behind him, and a resignation he has not yet had to write out."
 can_dnc_c.3.a: "Read him the clause before the House hears it."
 can_dnc_c.3.b: "Let him read it in the Gazette like everyone else."
 can_dnc_c.3.c: "Have Fitzpatrick redraft it tonight."
 can_dnc_c.4.t: "The Delegate Offers to Mediate"
 can_dnc_c.4.d: "Monsignor Sbarretti has been at Ottawa since 1902 and understands the arithmetic better than the bishops do. Rome will take a settlement now over a principle later, and the government is invited to name its terms."
 can_dnc_c.4.a: "Take the delegate's terms."
 can_dnc_c.4.b: "Tell Rome that Canada legislates for itself."
 can_dnc_c.4.c: "Let the bishops go over the delegate's head."
 can_dnc_c.5.t: "Saint-Jacques, 8 June 1908"
 can_dnc_c.5.d: "The Premier of Quebec is beaten in a Montreal riding by a man who does not want his office, and saved in Portneuf by a machine that does. From tonight Gouin governs the province and answers Bourassa across the floor."
 can_dnc_c.5.a: "Congratulate the member for Saint-Jacques."
 can_dnc_c.5.b: "Take the riding back at the next by-election."
 can_dnc_c.5.c: "Offer him a portfolio."
 can_dnc_c.6.t: "A Prince on the Plains"
 can_dnc_c.6.d: "Earl Grey has the pageants written, the fleet invited and the Prince of Wales confirmed. The programme celebrates the founding of 1608 and re-enacts the year 1759 four afternoons running, and the parish committees have read it."
 can_dnc_c.6.a: "Let the fleet anchor under the Citadel."
 can_dnc_c.6.b: "Champlain walks at the head and the Prince behind him."
 can_dnc_c.6.c: "Give the Plains to the nation and the pageant to the parishes."
 can_dnc_c.7.t: "The Bishop Writes to the Delegate"
 can_dnc_c.7.d: "Fallon's letter is not meant for the newspapers and reaches them within the month. The bilingual school, he writes, turns out a child fit for neither language, and the Church in Ontario cannot go on defending it."
 can_dnc_c.7.a: "Let the bishop speak for the Church in Ontario."
 can_dnc_c.7.b: "Ask Rome to silence him."
 can_dnc_c.7.c: "Print the letter entire."
 can_dnc_c.8.t: "One Vote, Two Readings"
 can_dnc_c.8.d: "The resolution passes without a division, which every member calls unity and no two of them define alike. The Toronto papers report a contribution to the Empire; the Montreal papers report that Canada has refused to contribute."
 can_dnc_c.8.a: "Let each man read into it what he likes."
 can_dnc_c.8.b: "A dominion that cannot say what it has just voted."
 can_dnc_c.9.t: "The Champ-de-Mars"
 can_dnc_c.9.d: "The square is full an hour before the meeting is called, and the crowd goes down Saint-Jacques street to the newspaper offices. The sheriff has the wording of the requisition in front of him and wants only a signature."
 can_dnc_c.9.a: "Call out the militia in aid of the civil power."
 can_dnc_c.9.b: "Let the mayor read the proclamation and nothing more."
 can_dnc_c.9.c: "Go down to the square yourself."
 can_dnc_c.10.t: "Quebec Declares"
 can_dnc_c.10.d: "The Assembly sat as a constituent body at ten and rose at six a republic. There is a flag on the Citadel, a customs house at Levis, and not one battalion between the new frontier and the Ottawa river."
 can_dnc_c.10.a: "Draw the border at the Ottawa."
 can_dnc_c.10.b: "Offer them the Crown they have just left."
 can_dnc_c.10.c: "Note it in the despatches."
