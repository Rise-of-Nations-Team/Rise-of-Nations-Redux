 KNS_idea_a_claim_fifteen_years_old: "A Claim Fifteen Years Old"
 KNS_idea_a_claim_fifteen_years_old_desc: "The same resolution, passed every session and refused every session, in eleven Norwegian counties that have stopped expecting anything else."
 KNS_idea_the_union_restored_by_arms: "The Union Restored by Arms"
 KNS_idea_the_union_restored_by_arms_desc: "It holds for exactly as long as the troops are there, and the troops are standing on half our own recruiting ground."
 KNS_idea_the_integrity_treaty: "The Integrity Treaty"
 KNS_idea_the_integrity_treaty_desc: "Four powers guarantee the border, and it may not be altered even by agreement."
 KNS_idea_the_hunger_ministry: "The Hunger Ministry"
 KNS_idea_the_hunger_ministry_desc: "The trade figures have never been better and the bread queue goes round the block."
 KNS_idea_nothing_to_expect_from_the_east: "Nothing to Expect from the East"
 KNS_idea_nothing_to_expect_from_the_east_desc: "We asked a court and accepted the answer. Nobody will ever be nervous about us again, which cuts both ways."
 KNS_idea_the_fleet_that_pays: "The Fleet That Pays"
 KNS_idea_the_fleet_that_pays_desc: "Chartered at wartime rates and sunk at wartime rates."
 KNS_idea_the_dry_kingdom: "The Dry Kingdom"
 KNS_idea_the_dry_kingdom_desc: "Sober, orderly, and remembered by every wine-growing country at every trade round."
 KNS_idea_open_to_all_signatories: "Open to All Signatories"
 KNS_idea_open_to_all_signatories_desc: "Ours by treaty, and mineable by anyone who signed the same treaty."
 KNS_idea_the_saltsjobaden_accord: "The Saltsjobaden Accord"
 KNS_idea_the_saltsjobaden_accord_desc: "The two sides of industry settle it between them, and the state finds out afterwards."
 KNS_idea_the_ore_road_to_narvik: "The Ore Road to Narvik"
 KNS_idea_the_ore_road_to_narvik_desc: "Ice-free, immensely profitable, and the first objective in everybody's war plan."
 KNS_idea_collective_neutrality: "Collective Neutrality"
 KNS_idea_collective_neutrality_desc: "Four countries that will not join anyone, including each other's protectors."

# TOOLTIPS
 KNS_two_crowns_one_chancery_tt: "Opens the two chambers: Riksdag 62, Storting 38, a gap of 24 and no vetoes spent."
 KNS_the_committee_of_both_kingdoms_tt: "Five points in each chamber, and thirty percent off the two focuses below."
 KNS_the_communique_of_march_tt: "Storting +25, Riksdag -20, and the Riksdag is capped at 70 for the rest of the game."
 KNS_conditions_of_dependency_tt: "Riksdag +25 and Storting -30. The royal refusal starts to count."
 KNS_a_chancery_of_two_desks_tt: "Eight points in Kristiania and four in Stockholm, at fifteen percent of the research budget."
 KNS_the_principles_of_kristiania_tt: "Riksdag +6, Storting -12, and the Norwegian minister resigns."
 KNS_the_consular_bill_of_may_tt: "No bonus. It arms the twenty-seventh of May and opens the only three exits from the crisis."
 KNS_sanction_the_consular_bill_tt: "Storting +40, Riksdag -35, and the royal refusal is locked at three: it can never be used again."
 KNS_a_riksakt_for_the_century_tt: "The two counters merge at their average. The gap and its crisis both disappear."
 KNS_let_the_union_lapse_tt: "Opens the negotiated dissolution, with the settlement still to be argued."
 KNS_the_crown_and_nothing_else_tt: "The union is reduced to the king's person, at half its former bonus."
 KNS_a_parliament_of_the_union_tt: "A union court and a union parliament. Everything the union does now takes twenty percent longer."
 KNS_the_karlstad_table_tt: "A perpetual neutral zone, the new works dismantled, and two armies that never met."
 KNS_the_stortings_demand_tt: "Installs A Claim Fifteen Years Old in the eleven Norwegian states."
 KNS_the_pure_flag_precedent_tt: "Storting +6, Riksdag -4. The royal refusal now freezes a bill for ninety days instead of a hundred and eighty."
 KNS_a_consular_service_of_our_own_tt: "Storting +8, Riksdag -6, and five percent on trade efficiency."
 KNS_the_michelsen_ministry_tt: "Storting +10, Riksdag -8. The twenty-seventh of May is armed."
 KNS_two_flags_no_mark_tt: "Storting +8, Riksdag -5, and stability in the Norwegian states."
 KNS_a_foreign_minister_of_our_own_tt: "Fifteen points each way. The last common institution is gone."
 KNS_the_language_of_the_law_tt: "Storting +6 and ten points of stability. It absorbs five smaller demands at once."
 KNS_double_proportionality_tt: "Riksdag +8, Storting +4, and the Great Strike follows."
 KNS_the_seventh_of_june_tt: "Available only once the gap has already reached sixty-five. The union is declared dissolved."
 KNS_the_plebiscite_of_august_tt: "The result is scripted and not negotiable. It locks the negotiated road and opens Karlstad."
 KNS_march_on_kristiania_tt: "War with Norway. The twenty-one states are already Swedish cores."
 KNS_the_union_restored_by_arms_tt: "The union holds. Stability -30, and half the Norwegian recruiting ground with it."
 KNS_a_bernadotte_for_norway_tt: "Both realms start at fifty opinion, under one house and two thrones."
 KNS_a_king_of_their_own_choosing_tt: "Norway takes its own dynasty. Ten points of stability and no bonus of any kind."
 KNS_settle_the_dynasty_question_tt: "The republican challenge ends, at seventy-five political power and the shared-house goodwill."
 KNS_the_integrity_treaty_tt: "A four-power guarantee, and no cession of territory even by consent."
 KNS_the_fortress_at_boden_tt: "Three fort levels in the north. Riksdag +8, Storting -10."
 KNS_the_works_at_kongsvinger_tt: "Three fort levels on the union border. Storting +10, Riksdag -8."

