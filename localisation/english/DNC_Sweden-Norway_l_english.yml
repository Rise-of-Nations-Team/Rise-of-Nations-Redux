 KNS_sanction_the_consular_bill: "Sanction the Consular Bill"
 KNS_sanction_the_consular_bill_desc: "Sign it. Forty points in Kristiania, thirty-five gone in Stockholm, and the royal refusal is spent for good: it will never be usable again."
 KNS_a_riksakt_for_the_century: "A Riksakt for the Century"
 KNS_a_riksakt_for_the_century_desc: "A new act of union, negotiated rather than granted. The two counters merge at their average, the gap disappears, and so does the crisis it was building towards."
 KNS_let_the_union_lapse: "Let the Union Lapse"
 KNS_let_the_union_lapse_desc: "Do not fight it. Open the negotiated dissolution and settle what can still be settled while both sides are still talking."
 KNS_the_crown_and_nothing_else: "The Crown and Nothing Else"
 KNS_the_crown_and_nothing_else_desc: "The union is reduced to the person of the king. It survives, it does almost nothing, and it survives."
 KNS_a_parliament_of_the_union: "A Parliament of the Union"
 KNS_a_parliament_of_the_union_desc: "The body that never existed: a union court and a union parliament, above both kingdoms and answerable to both. It works, and everything now takes twenty percent longer."
 KNS_the_karlstad_table: "The Karlstad Table"
 KNS_the_karlstad_table_desc: "A perpetual neutral zone, the new Norwegian works dismantled, and two states that part without a shot. Nobody gets what they wanted and everybody gets to keep their army."
