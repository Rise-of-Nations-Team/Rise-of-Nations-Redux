 KNS_the_fortress_at_boden_desc: "The largest works in Scandinavia, facing east. The Storting reads the map and sees that it also faces west."
 KNS_the_works_at_kongsvinger: "The Works at Kongsvinger"
 KNS_the_works_at_kongsvinger_desc: "Norwegian forts on the Norwegian side of the union border. Everyone knows exactly which army they are for."
