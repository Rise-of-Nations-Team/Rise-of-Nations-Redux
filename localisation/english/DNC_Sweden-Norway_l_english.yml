 KNS_two_crowns_one_chancery: "Two Crowns, One Chancery"
 KNS_two_crowns_one_chancery_desc: "One king, one foreign ministry, two parliaments that never sit together, and no court above either of them. Every bill has to pass twice."
 KNS_the_committee_of_both_kingdoms: "The Committee of Both Kingdoms"
 KNS_the_committee_of_both_kingdoms_desc: "A joint commission to draft the reform that both chambers can live with. It is the only room in the union where Swedes and Norwegians argue in advance instead of afterwards."
 KNS_the_communique_of_march: "The Communique of March"
 KNS_the_communique_of_march_desc: "Stockholm concedes the principle: Norway may have consuls of its own. Twenty-five points in Kristiania, twenty gone in Stockholm, and the Riksdag will never again pass anything above seventy."
 KNS_conditions_of_dependency: "Conditions of Dependency"
 KNS_conditions_of_dependency_desc: "Consuls, yes, but subordinate to a foreign minister who is Swedish by law. It is a real offer and it is thirty points off the Storting."
 KNS_a_chancery_of_two_desks: "A Chancery of Two Desks"
 KNS_a_chancery_of_two_desks_desc: "One ministry, two staffs, two sets of instructions and one signature. It costs research money to run and it holds the union together for another two years."
 KNS_the_principles_of_kristiania: "The Principles of Kristiania"
 KNS_the_principles_of_kristiania_desc: "Stockholm publishes the terms it will accept and the Norwegian minister resigns the same week. Six points gained, twelve lost, and the last negotiated way out closes."
 KNS_the_consular_bill_of_may: "The Consular Bill of May"
 KNS_the_consular_bill_of_may_desc: "The bill goes to the king. No bonus, no reward, and the only three exits from the crisis open behind it."
 KNS_the_stortings_demand: "The Storting's Demand"
 KNS_the_stortings_demand_desc: "Fifteen years of the same resolution, passed again every session, and refused again every session. The claim ages and does not go away."
 KNS_the_pure_flag_precedent: "The Pure Flag Precedent"
 KNS_the_pure_flag_precedent_desc: "The union mark comes out of the Norwegian flag and the king signs it. The precedent is acquired, which is why every refusal from now on only buys half the usual delay."
 KNS_a_consular_service_of_our_own: "A Consular Service of Our Own"
 KNS_a_consular_service_of_our_own_desc: "Norway has the fourth merchant fleet in the world and no consul of its own in any port it calls at. The argument writes itself."
 KNS_the_michelsen_ministry: "The Michelsen Ministry"
 KNS_the_michelsen_ministry_desc: "A shipowner from Bergen who intends to force the question rather than argue it. Ten points in Kristiania, and the twenty-seventh of May is now loaded."
 KNS_two_flags_no_mark: "Two Flags, No Mark"
 KNS_two_flags_no_mark_desc: "Two clean flags, side by side, neither of them quartered with the other. It changes nothing legally and everything else."
 KNS_a_foreign_minister_of_our_own: "A Foreign Minister of Our Own"
 KNS_a_foreign_minister_of_our_own_desc: "The last common institution goes. Fifteen points each way, and after this there is nothing left to concede short of the union itself."
 KNS_the_language_of_the_law: "The Language of the Law"
 KNS_the_language_of_the_law_desc: "Statutes, judgments and schoolbooks in a written Norwegian nobody has to translate from Danish. It absorbs five smaller demands at once."
 KNS_double_proportionality: "Double Proportionality"
 KNS_double_proportionality_desc: "Proportional representation in both chambers. It is fair, it is overdue, and it hands the labour movement a bloc in each of them."
 KNS_the_seventh_of_june: "The Seventh of June"
 KNS_the_seventh_of_june_desc: "The Storting declares that the king has ceased to act as King of Norway and that the union is therefore dissolved. It is available only when the gap has already made it inevitable."
 KNS_the_plebiscite_of_august: "The Plebiscite of August"
 KNS_the_plebiscite_of_august_desc: "Three hundred and sixty-eight thousand votes for dissolution and one hundred and eighty-four against. The result is not negotiable and neither is what follows from it."
 KNS_march_on_kristiania: "March on Kristiania"
 KNS_march_on_kristiania_desc: "The twenty-one Norwegian states are Swedish cores and always were. Take them back, and find out what a union looks like when it is a garrison."
 KNS_the_union_restored_by_arms: "The Union Restored by Arms"
 KNS_the_union_restored_by_arms_desc: "It holds. It will hold for as long as there are troops in it, and the recruiting ground it holds down is half the manpower of the realm."
 KNS_a_bernadotte_for_norway: "A Bernadotte for Norway"
 KNS_a_bernadotte_for_norway_desc: "A prince of the house takes the Norwegian throne. Two kingdoms, one family, and fifty points of goodwill on the first morning."
 KNS_a_king_of_their_own_choosing: "A King of Their Own Choosing"
 KNS_a_king_of_their_own_choosing_desc: "Norway elects a Danish prince and calls him Haakon. It is clean, it is legitimate, and there is no bonus attached to it at all."
 KNS_settle_the_dynasty_question: "Settle the Dynasty Question"
 KNS_settle_the_dynasty_question_desc: "Extinguish the Norwegian republican challenge for good, at seventy-five political power and the whole of the shared-house goodwill."
 KNS_the_integrity_treaty: "The Integrity Treaty"
 KNS_the_integrity_treaty_desc: "Four powers guarantee Norwegian territory, and Norway may not cede a metre of it even if it wishes to."
