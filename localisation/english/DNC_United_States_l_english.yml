l_english:
#Focuses
 USADNC_william_mckinleys_administration: "William McKinley's Administration"
 USADNC_william_mckinleys_administration_desc: "William McKinley has promised to promote free-trade within America. We must have it!"
 USADNC_open_the_american_economy: "Open up the American Economy"
 USADNC_open_the_american_economy_desc: "We must start to promote the ideas of a free American markets and open up the economy to move away from isolationism."
 USADNC_free_trade_aggreements: "Free Trade Agreements"
 USADNC_free_trade_aggreements_desc: "We should form free trade agreements with other nations to improve relationships with them and to gain easier access to their goods and services."
 USADNC_look_overseas: "Look Overseas"
 USADNC_look_overseas_desc: "We must look overseas to find new trading partners."
#Tooltips
 USA_DNC_republican_admin_tt: "Has a §RRepublican§! Administration"

#UNREWORKED CONTENT
 USADNC_retake_lost_teritory: "Retake Lost Territory"
 USADNC_retake_lost_teritory_desc: "We must recover our former borders!"
 USADNC_talks_with_germany: "Talks with Germany"
 USADNC_talks_with_germany_desc: "We must talk with German advisors about possibly joining the dual alliance, or perhaps working out a trade treaty."
 USADNC_the_seymour_expedition: "The Seymour Expedition"
 USADNC_the_seymour_expedition_desc: "The Seymour Expedition will be a multi-national military force with the aim to march into Beijing."
 USADNC_send_the_treaty_to_britian: "Send the Treaty to Britian"
 USADNC_send_the_treaty_to_britian_desc: "We must send the treaty to the United Kingdom to be ratified and finally begin construction of the Panama Canal."
 USADNC_public_railroads: "Public Railroads"
 USADNC_public_railroads_desc: "We must be rid of the railroad companies, as they continue to practice corporate favoritism. We should turn the railroads into a public service."
 USADNC_william_mckinleys_assassination: "William McKinley Assassinated"
 USADNC_william_mckinleys_assassination_desc: "William McKinley's assassination has been a shock to our nation. What shall we do next?"
 USADNC_the_boxer_rebellion: "The Boxer Rebellion"
 USADNC_the_boxer_rebellion_desc: "China has come to us pleading to help to put down the Yihetuan Movement. We must decide whether to show our continued support to the empire, orto the rebels."
 USADNC_ratify_the_haypauncefote_treaty: "Ratify the Hay-Pauncefote Treaty"
 USADNC_ratify_the_haypauncefote_treaty_desc: "The Hay–Pauncefote Treaty is a preliminary treaty that gives us permission to start construction the Panama Canal."
 USADNC_look_to_our_neighbors: "Look to Our Neighbors"
 USADNC_look_to_our_neighbors_desc: "We must attempt to maintain healthy relationships with our neighbouring nations."
 USADNC_implement_a_income_tax: "Implement an Income Tax"
 USADNC_implement_a_income_tax_desc: "Implementing an income tax will be certainly not be a easy task, but it is something that must be done for our nation to move forward."
 USADNC_end_the_philippines_resistance: "End the Philippines Resistance"
 USADNC_end_the_philippines_resistance_desc: "We must end Philippine resistance to our rule. We have successfully subdued the Philippines and the resistance movement is declining. We must meet with the rebels and negotiate terms with them to stop their guerilla warfare campaign."
 USADNC_britan_accepts_the_treaty: "Britain Accepts the Treaty"
 USADNC_britan_accepts_the_treaty_desc: "With the treaty being accepted we may start preparations to building the canal"
 USADNC_star_rebuilding_our_relationship_with_japan: "Our Relationship with Japan"
 USADNC_star_rebuilding_our_relationship_with_japan_desc: "Japan has sent volunteers to the Philippines. Our relationship is almost at a breaking point. We must send try to rebuild our relationship with Japan."
 USADNC_denounce_benevolent_assimilation: "Denounce Benevolent Assimilation"
 USADNC_denounce_benevolent_assimilation_desc: "We must denounce William McKinley for starting this war, but we will still keep his policy in place to try to appease the people of the Philippines."
 USADNC_destruction_of_villages: "Destruction of Villages"
 USADNC_destruction_of_villages_desc: "We must destroy the Filipino culture and rebuild it from the ground up."
 USADNC_harsh_treatment_to_the_locals: "Harsh Treatment of the Locals"
 USADNC_harsh_treatment_to_the_locals_desc: "The locals have done nothing but harass us. The war ended with more casualties than neccessary due to continued insurgency. They must pay for the damages."
 USADNC_sign_the_usphilippine_economic_recovery_act: "Sign the US-Philippine Economic Recovery Act"
 USADNC_sign_the_usphilippine_economic_recovery_act_desc: "We must both assist each-other in war reparations in order to repair both of our nations - both financially and diplomatically."
 USADNC_philippine_government_act: "Philippine Government Act"
 USADNC_philippine_government_act_desc: "The Philippine Government Act will establish a colonial government in the Philippines, putting a end to the Philippine–American War"
 USADNC_move_troops_out_of_the_philippines: "Move Troops Out of the Philippines"
 USADNC_move_troops_out_of_the_philippines_desc: "We must end the occupation of the Philippines and start to repair relations with them."
 USADNC_issue_american_currency_to_the_philippines: "Issue American Currency to the Philippines"
 USADNC_issue_american_currency_to_the_philippines_desc: "We must placate American industry in the Philippines to rebuild their economy and help them civilize."
 USADNC_encourage_immigration_to_the_philippines: "Encourage Migration"
 USADNC_encourage_immigration_to_the_philippines_desc: "We must have more Americans in the Philippines in order to promote the Americanization of the Philippines."
 USADNC_full_control_over_the_philippines: "Full Control over the Philippines"
 USADNC_full_control_over_the_philippines_desc: "We have won this war. We must take our rightful territory back."
 USADNC_start_the_americanization_of_the_philippines: "Begin the Americanization"
 USADNC_start_the_americanization_of_the_philippines_desc: "We must start bringing American culture to the Philippines. We wil; start issuing American currency, and making English as a mandated second language."
 USADNC_oklahoma_enabling_act: "Oklahoma Enabling Act"
 USADNC_oklahoma_enabling_act_desc: "The Oklahoma Enabling Act gave the Oklahoma territory power to elect delegates."
 USADNC_the_sequoyah_constitutional_convention: "The Sequoyah Constitutional Convention"
 USADNC_the_sequoyah_constitutional_convention_desc: "The Sequoyah Constitutional Convention will be American and Indian meeting to attempt to secure statehood for Indian Territory"
 USADNC_path_to_statehood_for_the_territory_of_oklahoma: "Path to Oklahoma Statehood"
 USADNC_path_to_statehood_for_the_territory_of_oklahoma_desc: "The Territory of Oklahoma has westernized and modernized enough for us to make it a official state."
 USADNC_limited_governance_over_the_philippines: "Limited Governance Over the Philippines"
 USADNC_limited_governance_over_the_philippines_desc: "Creating a Supervised State in the Philippines is the best way to go."
 USADNC_hands_off_treatment_of_the_philippines: "Hands-Off Treatment of the Philippines"
 USADNC_hands_off_treatment_of_the_philippines_desc: "We must go with a hands off treatment to govern the Philippines."
 USADNC_darft_a_list_of_monopolies: "Draft a List of Monopolies"
 USADNC_darft_a_list_of_monopolies_desc: "We must draft a list of big business that is deemed too big for competition."
 USADNC_denounce_imperialism_from_the_european_powers: "Denounce Imperialism From the European Powers"
 USADNC_denounce_imperialism_from_the_european_powers_desc: "The European powers do not wish to help China, but to exploit it. We must support the sovereignty and recognize the effort made by the Boxers."
 USADNC_pass_chinese_inclusion_act: "Pass Chinese Inclusion Act"
 USADNC_pass_chinese_inclusion_act_desc: "Repeal the Chinese Exclusion Act and allow immigration from China."
 USADNC_isthmian_canal_act: "Isthmian Canal Act"
 isthmian_canal_act: "Isthmian Canal Act"
 USADNC_isthmian_canal_act_desc: "The Canal Act called for the funding and building of the Panama Canal. We must pass this act to start construction of the Canal."
 USADNC_full_annexation_of_the_philippines: "Full Annexation of the Philippines"
 USADNC_full_annexation_of_the_philippines_desc: "We must fully annex the Philippians and admit it into our territory."
 USADNC_promises_philippine_independence_within_a_few_years: "Promise Philippine Independence"
 USADNC_promises_philippine_independence_within_a_few_years_desc: "We promise the island of the Philippines independence - eventually. However we must not act too hastily or it may reduce their internal stability."
 USADNC_end_the_occupation_of_the_philippines_imminently: "Immediately End the Occupation"
 USADNC_end_the_occupation_of_the_philippines_imminently_desc: "The calls for ending the occupation of the Philippines can not go unheard. We must order our troops to move out of the Philippines immediately."
 USADNC_send_manpower_to_the_rebels: "Send Manpower to the Rebels"
 USADNC_send_manpower_to_the_rebels_desc: "We must send them some of our manpower add fuel to the fire."
 USADNC_join_the_entete: "Join the Entente"
 USADNC_join_the_entete_desc: "France requires our help. We must agree to defend them at all costs."
 USADNC_dissolve_standard_oil: "Dissolve Standard Oil"
 USADNC_dissolve_standard_oil_desc: "With the lawsuit over we must split Standered Oil up into 32 different subsidiary companies."
 USADNC_free_trade_agreement_with_mexico: "Free Trade Agreement with Mexico"
 USADNC_free_trade_agreement_with_mexico_desc: "Mexico, though unstable, has many valuable natural resources. A free trade agreement will improve our relations."
 USADNC_alliance_focus: "Alliance Focus"
 USADNC_alliance_focus_desc: "In order to preserve our country we need to intervene in European affairs."
 USADNC_sue_standard_oil: "Sue Standard Oil"
 USADNC_sue_standard_oil_desc: "We must Standard Oil for their monopoly over the oil industry."
 USADNC_pass_the_hepburn_act: "Pass the Hepburn Act"
 USADNC_pass_the_hepburn_act_desc: "This act gave the Interstate Commerce Commission the power to set maximum railroad rates and extended its jurisdiction. This prevented railroad companies from choosing favorites and giving free passes to loyal shippers."
 USADNC_pass_the_elkins_antirebate_act: "Pass the Elkins Anti-Rebate Act"
 USADNC_pass_the_elkins_antirebate_act_desc: "This law will give railroads power to administer their rates, forbidding railroad companies from giving rebates to shippers"
 USADNC_bring_communism_to_canada: "Bring Communism to Canada"
 USADNC_bring_communism_to_canada_desc: "We must influence our northern neighbors, and spread Communist ideals to them."
 USADNC_rid_all_political_opposition: "Eliminate Political Opposition"
 USADNC_rid_all_political_opposition_desc: "We must oust all opposition in our country and prepare for the war."
 USADNC_form_a_communist_defense_pace: "Form a Communist Defense Pact"
 USADNC_form_a_communist_defense_pace_desc: "We must form a defense pact in order to protect communism."
 USADNC_revoke_the_bill_of_rights: "Revoke the Bill of Rights"
 USADNC_revoke_the_bill_of_rights_desc: "Americans do not need the state to assure their right. Rather, the citizens should ensure the rights of the state. We must favour the continuity of the state over the rights of the individual."
 USADNC_send_more_forces_to_help_out_china: "Send more Forces to Assist China"
 USADNC_send_more_forces_to_help_out_china_desc: "We must send more forces to help out China and defeat the rebels."
 USADNC_make_peace_with_the_philippine_republic: "Make Peace with the Philippine Republic"
 USADNC_make_peace_with_the_philippine_republic_desc: "It is time to make pace with the Philippines"
 USADNC_rid_of_the_moros: "Pacify of The Moros"
 USADNC_rid_of_the_moros_desc: "The Moro population are preparing an insurrection and we should stop it before it gets out of hand."
 USADNC_the_philippineamerican_war: "The Philippine–American War"
 USADNC_the_philippineamerican_war_desc: "We have occupied the Philippines, now we must propose peace with the people."
 USADNC_excert_our_influence_over_the_philippines: "Influence Over the Philippines"
 USADNC_excert_our_influence_over_the_philippines_desc: "We must exert our influence over the Philippines - rebuilding their nation while also giving us economic power over them."
 USADNC_put_william_howard_taft_in_charge_of_the_governance_of_the_philippines: "Taft as Governer of the Philippines"
 USADNC_put_william_howard_taft_in_charge_of_the_governance_of_the_philippines_desc: "William Howard Taft is already the Secretary of War ,and he will make a perfect fit for the Governer."
 USADNC_free_trade_with_the_united_kingdom: "Free Trade with the UK"
 USADNC_free_trade_with_the_united_kingdom_desc: "The United Kingdom has been trying to improve relations with The Great Rapprochement and even supported us through the Spanish american war we should return the favor and sign a free trade agreement with the United Kingdom"
 USADNC_free_trade_with_germany: "Free Trade with Germany"
 USADNC_free_trade_with_germany_desc: "Although our relationship has been straining and they threaten Venezuelan occupation it will be in our best interest to start a free trade agreement with Germany, as there vast territory can hold rich national resources"
 USADNC_extend_the_chinese_exclusion_act: "Extend The Chinese Exclusion Act"
 USADNC_extend_the_chinese_exclusion_act_desc: "Extend the act to required "each Chinese resident to register and obtain a certificate of residence. Without a certificate they will face deportation"
 USADNC_free_trade_agreement_with_the_philippines: "Free Trade Agreement with the Philippines"
 USADNC_free_trade_agreement_with_the_philippines_desc: "We will release the Philippines, and force them to sign a free trade agreement with us."
 USADNC_calls_for_ending_the_occupation_of_the_philippines: "Public Demands End to Occupation"
 USADNC_calls_for_ending_the_occupation_of_the_philippines_desc: "The people of America acknowledge the Filipino people's claims to their home islands. Calls for de-occupation have already begun. Even staunch colonialists acknowledge that the Filipino guerilla warfare campaign has created public war-weariness, and continued occupation may not be in our best interests."
 USADNC_internal_politics: "Internal Politics"
 USADNC_internal_politics_desc: "Unlock focuses that have to do with internal politics."
 USADNC_apologize_for_warcrimes: "Apologize for War Crimes"
 USADNC_apologize_for_warcrimes_desc: "We may have gone a bit too far with the Philippines campaign. We massacred large numbers of the population and we should issue a official apology to the nation."
 USADNC_create_the_panama_canal_commission: "Create The Panama Canal Commission"
 USADNC_create_the_panama_canal_commission_desc: "With the treaty signed and the United Kingdom accepting our agreement we may now start dedicating workers and factories to the project."
 USADNC_britan_rejects_the_treaty: "Britan Rejects the Treaty"
 USADNC_britan_rejects_the_treaty_desc: "With the United Kingdom rejecting the Treaty the dream of a connected south and north america may never come to fruition."
 USADNC_free_trade_with_austria_hungry: "Free Trade with Austria-Hungary"
 USADNC_free_trade_with_austria_hungry_desc: "Austria-Hungary is an ally to the German empire and any friend of Germany should be a friend of the United States. Yet another large empire that we should befriend, and start a trade agreement with."
 USADNC_free_trade_with_france: "Free Trade with France"
 USADNC_free_trade_with_france_desc: "France is already an ally of the United States we should expand our relationship further."
 USADNC_teddy_roosevelt_takes_office: "Teddy Roosevelt Takes Office"
 USADNC_teddy_roosevelt_takes_office_desc: "The vice president Teddy Roosevelt will now take office as the president of the United States."
 USADNC_the_roosevelt_administration: "The Roosevelt Administration"
 USADNC_the_roosevelt_administration_desc: "As Roosevelt takes office what acts will he pass?"
 USADNC_send_supplies_to_the_nationalists: "Supply the Nationalists"
 USADNC_send_supplies_to_the_nationalists_desc: "We must supply the nationalists and fund the rebellion."
 USADNC_the_invasion_of_colombia: "Invasion of Colombia"
 USADNC_the_invasion_of_colombia_desc: "Colombia has refused to let Panama stay independent. The time to act is now. We must begin the invasion of Colombia."
 USADNC_setup_the_first_federal_bird_reservation: "First Federal Bird Reservation"
 USADNC_setup_the_first_federal_bird_reservation_desc: "President Theodore Roosevelt will establish a bird reservation on Pelican Island."
 USADNC_fund_the_panama_nationalists: "Fund the Panama Nationalists"
 USADNC_fund_the_panama_nationalists_desc: "Our negotiations with Colombia to acquire the Panama Canal Zone have fallen through. Perhaps we can help Panama get independence in exchange for the territory?"
 USADNC_guarantee_the_independence_of_panama: "Guarantee Panama"
 USADNC_guarantee_the_independence_of_panama_desc: "With our Guarantee going to Panama we can discourage Colombia from putting down the uprising."
 USADNC_target_standard_oil: "Target Standard Oil"
 USADNC_target_standard_oil_desc: "Standard Oil is the only major American oil company. We must dissolve it to promote healthy competition."
 USADNC_sherman_antitrust_act: "Sherman Anti-Trust Act"
 USADNC_sherman_antitrust_act_desc: "The Sherman Anti-Trust Act was a act to break up monopolies, giving Roosevelt the nickname of the Trust Buster."
 USADNC_pass_congregational_acts: "Pass Congregational Acts"
 USADNC_pass_congregational_acts_desc: "We must pass congregational acts to progress our nation.
 USADNC_target_rail_road_companies: "Target Railroad Companies"
 USADNC_target_rail_road_companies_desc: "Railroad companies are giving rebates to people shipping goods and discouraging natural competition."
 USADNC_free_trade_agreement_with_canada: "Free Trade Agreement with Canada"
 USADNC_free_trade_agreement_with_canada_desc: "Canada can be a gateway to better relationship with the United Kingdom."
 USADNC_suppress_the_niagara_movement: "Suppress the Niagara Movement"
 USADNC_suppress_the_niagara_movement_desc: "We must suppress the civil rights movement in Niagara as it is a hindrance to proper American culture."
 USADNC_oklahoma_is_admitted_to_the_union: "Oklahoma Admitted to the Union"
 USADNC_oklahoma_is_admitted_to_the_union_desc: "Oklahoma must finally be finally given full statehood."
 USADNC_support_the_niagara_movement: "Support the Niagara Movement"
 USADNC_support_the_niagara_movement_desc: "We must support the civil rights movement in Niagara."
 USADNC_protect_the_revolution_overseas: "Protect the Revolution Overseas"
 USADNC_protect_the_revolution_overseas_desc: "We must protect the revolution by looking overseas. Perhaps a European power would be willing to help us protect our commune."
 USADNC_form_a_north_american_communist_union: "Form a North American Communist Union"
 USADNC_form_a_north_american_communist_union_desc: "With the major nations of North America falling to communism we can now declare a protectorate doctrine, defending the American coasts from the evil capitalists."
 USADNC_bring_communism_to_brazil: "Bring Communism to Brazil"
 USADNC_bring_communism_to_brazil_desc: "Brazil is the biggest nation in South America, we should spread our communist ideals to them."
 USADNC_rewrite_the_constitution: "Rewrite the Constitution"
 USADNC_rewrite_the_constitution_desc: "We must scrap the old Constitution and rewrite it to better suit our communist cause."
 USADNC_censor_the_media: "Censor the Media"
 USADNC_censor_the_media_desc: "We must remove all negative press about the Communist party, further strengthening our grip on our country."
 USADNC_storm_the_white_house: "Storm the White House"
 USADNC_storm_the_white_house_desc: "We must spread the flames of revolution - peacefully or not."
 USADNC_promote_the_communist_manifesto: "Promote the Communist Manifesto"
 USADNC_promote_the_communist_manifesto_desc: "The Communist Manifesto was a excellent piece of literature and should be required reading for our population."
 USADNC_dissolve_monopolies: "Dissolve Monopolies"
 USADNC_dissolve_monopolies_desc: "We must dissolve these corporate monopolies - they eat away at our nations productivity with anti-competitive practices."
 USADNC_ban_political_parties: "Ban Political Parties"
 USADNC_ban_political_parties_desc: "We do not need political parties. They lead to pointless disagreements and they get nothing done. We need the KKK in charge of America, to promote proper American culture and morality."
 USADNC_the_second_american_civil_war: "The Second American Civil War"
 USADNC_the_second_american_civil_war_desc: "We have stormed the capital and raised our new flag, however it seems like some of America is not content on becoming Communist."
 USADNC_independence_for_cuba: "Independence for Cuba"
 USADNC_independence_for_cuba_desc: "We must end the occupation of Cuba and keep our promise to end military occupation"
 USADNC_expand_presidential_powers: "Expand Presidential Powers"
 USADNC_expand_presidential_powers_desc: "The current powers of the President are to weak. We must expand their power making the President's job easier."
 USADNC_end_american_neutrality: "End American Neutrality"
 USADNC_end_american_neutrality_desc: "America no longer needs to be neutral - we should expand our influence over the world."
 USADNC_fund_the_kkk: "Fund the KKK"
 USADNC_fund_the_kkk_desc: "We must send funding to the Klu Klux Klan as their way of life is most favorable and in line with proper American culture."
 USADNC_revive_the_golden_circle: "Revive the Golden Circle"
 USADNC_revive_the_golden_circle_desc: "The Golden Circle - a plan proposed by the confederates - is sounding more and more like a good idea. We should revive it."
 USADNC_our_rightful_claim_on_mexico: "Our Rightful Claim on Mexico"
 USADNC_our_rightful_claim_on_mexico_desc: "Mexico will fit nicely into the Union."
 USADNC_revoke_the_monroe_doctrine: "Revoke the Monroe Doctrine"
 USADNC_revoke_the_monroe_doctrine_desc: "We no longer need the Monroe Doctrine. It is a irrelevant and outdated document."
 USADNC_promote_farright_parties: "Promote Far-Right Parties"
 USADNC_promote_farright_parties_desc: "We must promote the parties that have America's best interests in mind."
 USADNC_ideological_focus: "Ideological Focus"
 USADNC_ideological_focus_desc: "We must take a hard look at our ideologies and the current state of our country."
 USADNC_the_rightful_ruler: "The Rightful Ruler"
 USADNC_the_rightful_ruler_desc: "America's ruler should be a Klan member. Since we have already established many significant social reforms, we should put someone with the proper mindset in charge."
 USADNC_a_alternative_victory_in_the_elections: "An Alternative Election Victory"
 USADNC_a_alternative_victory_in_the_elections_desc: "With William McKinley losing the election what should our country do next?"
 USADNC_promote_farleft_parties: "Promote Far-Left Parties"
 USADNC_promote_farleft_parties_desc: "We must promote far-left parties, they have America's best interests in mind."
 USADNC_stateenforced_religion: "State-Enforced Religion"
 USADNC_stateenforced_religion_desc: "We must enforce a state religion in America, as establishing proper morality is the KKK's core value."
 USADNC_put_the_kkk_in_the_government: "KKK Positions in the Government"
 USADNC_put_the_kkk_in_the_government_desc: "Members of the Klan should be given positions in the government. We must fill our cabinet with the most effective and diligent members from the Klan."
 USADNC_fill_up_the_senate_with_klan_members: "A Senate of Klan Members"
 USADNC_fill_up_the_senate_with_klan_members_desc: "The Laws of the United States should be dictated by Klan members, and they should control and influence the American way of life."
 USADNC_fill_up_the_house_with_kkk_members: "KKK Members The House of Representatives"
 USADNC_fill_up_the_house_with_kkk_members_desc: "The House of Representatives should represents the United States. With the victory of the KKK, the House should represent them as well."
 USADNC_encourage_the_personality_cult: "Encourage the Personality Cult"
 USADNC_encourage_the_personality_cult_desc: "The cult of personality surrounding the KKK should be expanded and be broadcast over the american radio. We will broadcasts their ideals all throughout America."
 USADNC_end_free_elections: "End Free Elections"
 USADNC_end_free_elections_desc: "We no longer need elections as the Klan already dictate our way of life, so we might as well end the unneccessary practice of voting."
 USADNC_persue_the_dream_of_flight: "Pursue the Dream of Flight"
 USADNC_persue_the_dream_of_flight_desc: "America should be the first country to take flight into the air. We must invest money in the development of flying machines."
 USADNC_create_a_us_airforce_department: "Form the US Air Force"
 USADNC_create_a_us_airforce_department_desc: "America requires an Air Force of our own."
 USADNC_a_peaceful_revolution: "A Peaceful Revolution"
 USADNC_a_peaceful_revolution_desc: "We have stormed the capital of America with little to no opposition. It seems like America is content with being under the Communist government."
 USADNC_switch_to_a_socialist_style_of_economy: "Embrace Socialism"
 USADNC_switch_to_a_socialist_style_of_economy_desc: "Laissez-faire capitalism is a thing of the past. We must switch to a more modern Market Socialist economic system."
 USADNC_spread_communism: "Spread Communism"
 USADNC_spread_communism_desc: "We should spread communism to other nations, using the Monroe doctrine as it was intended."
 USADNC_bring_communism_to_mexico: "Bring Communism to Mexico"
 USADNC_bring_communism_to_mexico_desc: "We must spread Communism to Mexico, bringing it into the revolution."
 USADNC_secure_our_capital: "Secure our Capital"
 USADNC_secure_our_capital_desc: "We must fortify our capital building to prevent any democratic forces from entering."
 USADNC_everyone_must_fight: "Everyone Must Fight"
 USADNC_everyone_must_fight_desc: "We must never surrender! We must continue to fight on no matter what cost."
 USADNC_victory_in_the_war: "Victory in the War"
 USADNC_victory_in_the_war_desc: "We have won the civil war! This will change history for years to come!"
 USADNC_taxes_not_tariffs: "Taxes, Not Tariffs"
 USADNC_taxes_not_tariffs_desc: "Teddy Roosevelt was in favor of having free trade without tariffs. He planned to remove the deficit by implementing an income tax."
 USADNC_free_trade_with_japan: "Free Trade with Japan"
 USADNC_free_trade_with_japan_desc: "We have opened up Japan to the world of trade. We should sign a free trade agreement with them."
 USADNC_free_trade_with_russia: "Free Trade with Russia"
 USADNC_free_trade_with_russia_desc: "The Russian Empire has had positive relations with us since they offered us additional land in Alaska. We should enter a free-trade agreement with them."
 USADNC_the_panama_agreement: "The Panama Agreement"
 USADNC_the_panama_agreement_desc: "The Panama Agreement will be an agreement between us and Panama to build the Panama Canal in secret."
 USADNC_pass_congregational_acts_ii: "Pass Congregational Acts II"
 USADNC_pass_congregational_acts_ii_desc: "We must continue to pass relevant congregational acts to make our government stronger."
 USADNC_our_claims_on_central_america: "Our Claims on Central America"
 USADNC_our_claims_on_central_america_desc: "Central America rightfully belongs to us! We must conqueror all of Central America."
 USADNC_cuban_claims: "Cuban Claims"
 USADNC_cuban_claims_desc: "Take over all of Cuba and have them join the Empire."
 USADNC_destabilize_central_america: "Destabilize Central America"
 USADNC_destabilize_central_america_desc: "We must upset the status quo in Central America in preparation for spreading communism."
 USADNC_the_kings_act: "The Kings Act"
 USADNC_the_kings_act_desc: "We must pass relevant Kings Acts to improve our nation."
 USADNC_join_the_duel_alliance: "Join the Dual Alliance"
 USADNC_join_the_duel_alliance_desc: "We shall send a request to Germany to join their alliance so we both can protect each other."
 USADNC_empower_the_president: "Empower the President"
 USADNC_empower_the_president_desc: "We must empower the president and get things done!"
 USADNC_support_the_monarchy_party: "Support the Monarchy Party"
 USADNC_support_the_monarchy_party_desc: "The Monarchy Party believes that America should be a absolute monarchy. We should support this party."
 USADNC_revoke_the_15th_amendment: "Revoke the 15th Amendment"
 USADNC_revoke_the_15th_amendment_desc: "People should not be able to vote in America. America should be an absolute monarchy."
 USADNC_add_gorge_washington_to_the_dollar_bill: "George Washington on the Dollar Bill"
 USADNC_add_gorge_washington_to_the_dollar_bill_desc: "George Washington the first president of the United States should be remembered as a monarch rather then an elected leader,"
 USADNC_add_the_british_monarch_to_the_dollar_bill: "Add the British Monarch to the Dollar Bill"
 USADNC_add_the_british_monarch_to_the_dollar_bill_desc: "We have already have been under the British monarchy once. we should return back to the United Kingdom as a subject under the throne."
 USADNC_a_subject_under_the_king: "A Subject Under the King"
 USADNC_a_subject_under_the_king_desc: "The United States will be a subject under the British crown. We will forget about the american revolution."
 USADNC_on_our_own: "On Our Own"
 USADNC_on_our_own_desc: "We must become a monarchy while also preserving the independance of the Union."
 USADNC_support_the_empire: "Support the Empire"
 USADNC_support_the_empire_desc: "The Empire is the true holder of the Mandate of Heaven and the Chinese throne."
 USADNC_support_the_rebels: "Support the Rebels"
 USADNC_support_the_rebels_desc: "The rebels are fighting for a righteous cause. We will support them."
 USADNC_send_equipment_to_the_rebels: "Send Equipment to the Rebels"
 USADNC_send_equipment_to_the_rebels_desc: "The rebels are under supplied and reduced to using swords and shields. We will send them guns and modern equipment."
 USADNC_stay_democratic: "Stay Democratic"
 USADNC_stay_democratic_desc: "Democracy is the way forward."
 USADNC_formation_of_the_secret_service: "Formation of the Secret Service"
 USADNC_formation_of_the_secret_service_desc: "The Secret Service or USSS is a law enforcement agency formed to protect the nation's leaders and safeguard the financial and critical infrastructure of the United States."
 USADNC_immigration_act_of_1907: "Immigration Act of 1907"
 USADNC_immigration_act_of_1907_desc: "This bill was made to restrict Japanese immigration. Roosevelt proclaimed in 1907 that "Probably a very large proportion, including most of the undesirable class, does not come here of its own initiative, but because of the activity of the agents of the great transportation companies, they wheedle and cajole many immigrants, often against their best interest, to come here.""
 USADNC_great_britain_friendship_act: "Great Britain Friendship Act"
 USADNC_great_britain_friendship_act_desc: "We must offer foreign aid to United Kingdom if Europe ever bursts out into war."
 USADNC_create_a_embassy_in_the_german_empire: "An Embassy in the German Empire"
 USADNC_create_a_embassy_in_the_german_empire_desc: "We shall side with the German empire and Austria-Hungary. We must start rebuilding our relationship by establishing an embassy in the German empire"
 USADNC_create_a_embassy_in_the_united_kingdom: "An Embassy in the United Kingdom"
 USADNC_create_a_embassy_in_the_united_kingdom_desc: "We shall side with the United Kingdom and France. We must start rebuilding our relationship by establishing an embassy in the United Kingdom."
 USADNC_chose_a_side: "Chose a Side"
 USADNC_chose_a_side_desc: "Europe is preparing for war. Perhaps we should choose a nation to ally with in case of conflict."
 USADNC_create_a_embassy_in_austria_hungry: "An Embassy in Austria-Hungary"
 USADNC_create_a_embassy_in_austria_hungry_desc: "We should also try to rebuild relations with Austria-Hungary as they are an ally to the German Empire."
 USADNC_german_friendship_act: "German Friendship Act"
 USADNC_german_friendship_act_desc: "We must offer foreign aid to Germany if Europe ever bursts out into war."
 USADNC_create_a_embassy_in_france: "An Embassy in France"
 USADNC_create_a_embassy_in_france_desc: "We should also try to rebuild relations with France as they are a ally to the United Kingdom."
 USADNC_pay_the_philippines_depts: "Agree to Pay Damages"
 USADNC_pay_the_philippines_depts_desc: "We have caused a great deal of damage in the Philippines. With them in this damaged state it will be hard for us to utilize them to their fullest potential."
 USADNC_fund_communist_uprisings: "Fund Communist Uprisings"
 USADNC_fund_communist_uprisings_desc: "We must fund communist uprisings throughout the United States perhaps some states may want to rebel against the union"
 USADNC_fund_government_aviation_programs: "Fund Aviation Programs"
 USADNC_fund_government_aviation_programs_desc: "We must spend government money to quickly complete an airplane."