l_english:
 AUH_ww1_House_Habsburg_Lorraine:0 "House of Habsburg-Lorraine"
 AUH_ww1_House_Habsburg_Lorraine_desc:0 "The ruling dynasty of the Monarchy and one of the oldest houses in Europe. Its long tenure on the throne supplies much of the legitimacy that holds the two halves together, for as long as the house can keep it."
 multi_ethnic:0 "Multi-Ethnic Empire"
 multi_ethnic_desc:0 "Eleven nationalities under one crown, each with its own language, its own church and its own idea of what the Monarchy owes it. The army drills in German and answers in a dozen tongues."
