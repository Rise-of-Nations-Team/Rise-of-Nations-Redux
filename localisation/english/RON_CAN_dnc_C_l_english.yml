#Events
 can_dnc_c.1.t: "Ottawa Asks for Reciprocity"
 can_dnc_c.1.d: "Fielding's note reaches the State Department in 1902: the farm, the forest, the mine and the sea to cross free both ways, the manufactures to follow. The last Canadian government to ask this was beaten on it in 1891, and this one is asking while the Alaska tribunal has not yet met."
 can_dnc_c.1.a: "Open the natural products list to them."
 can_dnc_c.1.b: "First let them sign the Alaska line."
 can_dnc_c.1.c: "The Dingley rates were voted to stay."
 can_dnc_c.2.t: "Washington Opens the List"
 can_dnc_c.2.d: "Root's reply is handed to the British ambassador and comes north the same week. Hay, cattle, lumber, fish and grain to cross free both ways; the factory schedule is not mentioned and will not be. Fielding is told to take the night train."
 can_dnc_c.2.a: "Then we go to Washington."
 can_dnc_c.3.t: "The Line Before the Ledger"
 can_dnc_c.3.d: "The State Department will talk tariff when the boundary is settled and not before. Roosevelt wants the award of the tribunal accepted in Ottawa without protest, and he wants it before the offer goes stale."
 can_dnc_c.3.a: "They shall have the line first, then."
 can_dnc_c.4.t: "The Dingley Rates Stand"
 can_dnc_c.4.d: "The reply is three lines long. The tariff of 1897 was passed by Congress and Congress is not sitting for Ottawa's convenience. The New England lumber men and the Minnesota millers have already been heard from."
 can_dnc_c.4.a: "Then the wall stays where it is."
 can_dnc_c.5.t: "The Offer Lapses"
 can_dnc_c.5.d: "Four months have gone and the award is still unaccepted in Ottawa. The State Department withdraws the schedule without discourtesy and without leaving a date to come back on."
 can_dnc_c.5.a: "We waited too long."
 can_dnc_c.6.t: "Ottawa Has Signed the Award"
 can_dnc_c.6.d: "The Dominion has taken the boundary as the tribunal gave it, with no note of protest and no case reserved. The condition Root set has been met, and the schedule he put aside is on his desk again."
 can_dnc_c.6.a: "They kept their word; open the list."
 can_dnc_c.6.b: "The tariff is still a matter for Congress."
 can_dnc_c.7.t: "The Schedule Comes Back"
 can_dnc_c.7.d: "Root's second note is warmer than his first. The natural products list is reopened on the terms Ottawa asked for in 1902, and the State Department suggests the signing be done quietly."
 can_dnc_c.7.a: "Quietly, then."
 can_dnc_c.8.t: "A Boundary Is Not a Bargain"
 can_dnc_c.8.d: "Washington thanks the Dominion for its good sense over the Lynn Canal and declines to connect it with the customs schedule. The Cabinet has given away Skagway and bought nothing with it."
 can_dnc_c.8.a: "We paid for nothing."
 can_dnc_c.10.t: "Does the Doctrine Cover the Dominion?"
 can_dnc_c.10.d: "The Canadian note asks the White House a question no colony has put in writing: whether the doctrine of 1823, and the corollary the President announced over Santo Domingo, extends to British territory north of the lakes. An answer either way changes the map of the continent."
 can_dnc_c.10.a: "The corollary covers the whole hemisphere."
 can_dnc_c.10.b: "That question belongs to London."
 can_dnc_c.10.c: "A coaling station at Esquimalt, and it does."
 can_dnc_c.11.t: "Under the Wing"
 can_dnc_c.11.d: "The reply is published in Washington before Ottawa can read it twice. The United States will regard an attack on Canadian territory as an attack on the peace of the hemisphere. No British statesman has ever heard the sentence before."
 can_dnc_c.11.a: "The frontier is guaranteed."
 can_dnc_c.12.t: "A Question for London"
 can_dnc_c.12.d: "The State Department is courteous and immovable: the defence of a British possession is a matter for the British government, and the President will not be drawn into an imperial quarrel by a colonial despatch."
 can_dnc_c.12.a: "We asked and were sent home."
 can_dnc_c.13.t: "The Price of the Doctrine"
 can_dnc_c.13.d: "The answer comes with a condition attached. The Navy Department wants coal and repair rights at Esquimalt on a ninety-nine year lease, in the yard the British garrison walked out of. Guarantee for anchorage, and the Pacific station is American in all but name."
 can_dnc_c.13.a: "Ninety-nine years, and the frontier is safe."
 can_dnc_c.13.b: "We will not lease a dockyard to anyone."
 can_dnc_c.15.t: "Tokyo Reads Ottawa's Letter"
 can_dnc_c.15.d: "The note from Ottawa proposes what the California legislature proposes, in the same language. Japan is Britain's ally since 1902 and more than eight thousand of its subjects landed in Canada in the first ten months of 1907. Hayashi must answer a colony that is behaving like a foreign power."
 can_dnc_c.15.a: "Protest in London, over their heads."
 can_dnc_c.15.b: "Limit the passports ourselves, by agreement."
 can_dnc_c.15.c: "Let no Japanese hull load at Vancouver."
 can_dnc_c.16.t: "The Protest Goes to London"
 can_dnc_c.16.d: "Tokyo complains to the Foreign Office and not to Ottawa, which is exactly what it thinks of a Dominion's standing. Grey is left to explain a statute he did not draft and cannot disallow without a crisis."
 can_dnc_c.16.a: "London will have to answer for us."
 can_dnc_c.17.t: "The Gentlemen's Agreement"
 can_dnc_c.17.d: "Japan will limit the passports issued for Canada rather than be excluded by a colonial statute. Lemieux took the same bargain out of Tokyo in the winter of 1907; this one is made without asking the Foreign Office first."
 can_dnc_c.17.a: "Signed at Tokyo, unread in London."
 can_dnc_c.18.t: "No Cargo for Vancouver"
 can_dnc_c.18.d: "The NYK liners are ordered to Seattle and Tacoma. The Pacific trade that Prince Rupert was surveyed for goes to American wharves, and the Vancouver merchants who cheered the League in September are counting the loss in December."
 can_dnc_c.18.a: "The coast pays for its own riot."
 can_dnc_c.20.t: "The Colonial Office Reads the Bill"
 can_dnc_c.20.d: "A customs union with a foreign power, voted by a colonial legislature, with no clause reserving the imperial preference. Chamberlain asked the premiers for a Zollverein at the coronation conference of 1902 and was refused; the Dominion has now given one to Washington."
 can_dnc_c.20.a: "We cannot stop them and will not try."
 can_dnc_c.20.b: "The bill is reserved for the King's pleasure."
 can_dnc_c.20.c: "Repeal it in sixty days, or answer for it."
 can_dnc_c.21.t: "London Does Not Move"
 can_dnc_c.21.d: "The Colonial Secretary tells the Commons that the fiscal autonomy of the Dominions has never been in question, in the tone of a man who has just lost something. Nothing is disallowed and nothing is forgiven."
 can_dnc_c.21.a: "They let it pass."
 can_dnc_c.22.t: "Reserved for the King's Pleasure"
 can_dnc_c.22.d: "The Governor General withholds assent and sends the bill to London, an instrument last used against a colonial tariff in living memory. The schedule is law nowhere, and every merchant in Montreal has ordered against it."
 can_dnc_c.22.a: "The Crown has stopped our own Parliament."
 can_dnc_c.23.t: "Sixty Days"
 can_dnc_c.23.d: "The despatch is read at the table of the House. The bill is to be repealed within sixty days; the alternative is not stated, because the Colonial Office has not decided what it is prepared to do and does not want to be asked."
 can_dnc_c.23.a: "Sixty days to choose our century."
 can_dnc_c.24.t: "The Summons Expires"
 can_dnc_c.24.d: "The sixty days have run out with the Cabinet still in session and nothing decided. London reads the silence as contempt, Washington reads it as weakness, and the Montreal exchanges read it as both."
 can_dnc_c.24.a: "We chose by not choosing."
 can_dnc_c.25.t: "Cut the Painter, or Hold It"
 can_dnc_c.25.d: "Ottawa has refused. The Cabinet must decide whether an Empire holds a colony that has put itself inside another power's tariff wall, or lets it go and keeps the Australians and the New Zealanders from watching a war of coercion in North America."
 can_dnc_c.25.a: "Let them go, and let the world see it was freely done."
 can_dnc_c.25.b: "Then they will trade with no port of ours."
 can_dnc_c.26.t: "The Painter Is Cut"
 can_dnc_c.26.d: "The Act goes through at Westminster in a single afternoon, with a courteous preamble and no debate worth the name. Earl Grey reads the proclamation on Parliament Hill in a cold wind, and the country is legally alone for the first time since 1763."
 can_dnc_c.26.a: "Alone, and by their own hand."
 can_dnc_c.27.t: "No Port of Ours"
 can_dnc_c.27.d: "The preference is withdrawn, the Liverpool houses close their Canadian accounts, and the underwriters double the rates on St Lawrence hulls. Ottawa is free and finds its freedom costed to the shilling."
 can_dnc_c.27.a: "We will sell to the continent, then."
 can_dnc_c.30.t: "Congress Reads the Plebiscite"
 can_dnc_c.30.d: "The address of the Canadian Parliament lies on the Speaker's table with the poll of every county attached. Oklahoma was admitted as one state in 1907 after a convention at Guthrie. This petition asks for nine, with a public debt, treaty obligations to the Indian nations, and two languages."
 can_dnc_c.30.a: "Admit them as states, on the Oklahoma precedent."
 can_dnc_c.30.b: "A territory first, and statehood when they are ready."
 can_dnc_c.30.c: "This House will not import their quarrels."
 can_dnc_c.31.t: "Nine Stars"
 can_dnc_c.31.d: "The enabling act passes both houses and the President signs it in the East Room. The Dominion of Canada, constituted at Charlottetown and Quebec and enacted at Westminster in 1867, ends by vote of its own people and consent of Congress."
 can_dnc_c.31.a: "It is done."
 can_dnc_c.32.t: "A Territory First"
 can_dnc_c.32.d: "Congress will take the country in, but not as an equal. A single organised territory under a governor appointed in Washington, with a delegate who may speak and may not vote, and statehood promised for a session that is never named."
 can_dnc_c.32.a: "Take the terms; the rest will come."
 can_dnc_c.32.b: "We did not vote to be governed from Washington."
 can_dnc_c.33.t: "The Petition Is Laid Over"
 can_dnc_c.33.d: "The committee reports adversely and the House concurs without a division. The Southern members will not seat nine free states, the protectionists will not open the lumber schedule, and nobody wants the Indian treaties."
 can_dnc_c.33.a: "We asked to be taken in and were not."
 can_dnc_c.34.t: "The Clock on Capitol Hill"
 can_dnc_c.34.d: "The treaty is read a first time and referred to the Committee on Foreign Relations. Two thirds of the Senate must consent, the Canadian commissioners may sit in the gallery, and no one in Ottawa can do a thing for sixty days."
 can_dnc_c.34.a: "Sixty days of waiting."
 can_dnc_c.35.t: "The Senate Decides"
 can_dnc_c.35.d: "The Committee has reported and the roll is called. The Southern bloc has counted the senators the northern provinces would send; the protectionists have counted the lumber and the fish; and the galleries are full of men from Ottawa who cannot speak."
 can_dnc_c.35.a: "Consent, on the terms as negotiated."
 can_dnc_c.35.b: "Consent, but as one state and no more."
 can_dnc_c.35.c: "Reject. This is not a bargain, it is an annexation."
 can_dnc_c.36.t: "Two Thirds"
 can_dnc_c.36.d: "The roll is read twice and the count holds. The terms of union stand as the commissioners wrote them, debt, treaties, schools and language clauses together, and the instruments will be exchanged before the session rises."
 can_dnc_c.36.a: "Ratified."
 can_dnc_c.37.t: "One State, and Take It"
 can_dnc_c.37.d: "The amendment carries on the floor: the whole Dominion enters as a single state with two senators, from the Atlantic to the Yukon. Prince Edward Island and British Columbia are to share a delegation, and the offer is not open to counter-proposal."
 can_dnc_c.37.a: "One state is still a seat at the table."
 can_dnc_c.37.b: "We will not be one county from sea to sea."
 can_dnc_c.38.t: "Not This Session"
 can_dnc_c.38.d: "The treaty falls eleven votes short and is laid on the table. The commissioners take the train north with nothing, and the papers in Toronto that fought the union spend the week explaining that they always knew."
 can_dnc_c.38.a: "They would not have us."
 can_dnc_c.40.t: "The Prairie Petitions Washington"
 can_dnc_c.40.d: "Delegates from the conventions at Saskatoon and Calgary are received at the State Department without an Ottawa passport between them. They speak for townships settled from Iowa and the Dakotas, they ship their wheat through Duluth, and they say the eastern provinces voted their market away."
 can_dnc_c.40.a: "Receive them. The wheat lands ought to be ours."
 can_dnc_c.40.b: "We do not dismember a neighbour who has been civil."
 can_dnc_c.41.t: "Washington Will Take the West"
 can_dnc_c.41.d: "The answer is in the newspapers before it is in the Cabinet room. Ottawa may negotiate the transfer of Alberta, Saskatchewan and Manitoba, or it may hold three provinces with the North-West Mounted Police and a militia raised in Ontario."
 can_dnc_c.41.a: "Negotiate. We will not shoot farmers."
 can_dnc_c.41.b: "The Dominion holds its own territory."
 can_dnc_c.42.t: "The West Stays"
 can_dnc_c.42.d: "The State Department declines the petition in one paragraph and lets the delegates find their own way home. The prairie has learned that Washington will not take what Ottawa will not give, and has stopped believing either of them."
 can_dnc_c.42.a: "They stay, and they remember."
 can_dnc_c.43.t: "Ottawa Fires on the Prairies"
 can_dnc_c.43.d: "The despatches from Regina describe militia on the branch lines and men from the conventions in the cells at Fort Osborne. The President is asked whether the United States will stand by while a petition to Congress is answered with rifles."
 can_dnc_c.43.a: "Protest, and do nothing more."
 can_dnc_c.43.b: "Let arms reach them, and say nothing."
 can_dnc_c.44.t: "The Prairie Rising"
 can_dnc_c.44.d.a: "The columns move west from Winnipeg in weather that breaks the horses. The rebel committees have rifles that came over the line in grain cars, and every officer in the field knows where they were bought."
 can_dnc_c.44.d.b: "The columns move west from Winnipeg and the conventions break up before they arrive. Washington has said nothing worth printing, the rifles never came, and the arrests are made by constables in three weeks."
 can_dnc_c.44.a: "The Dominion holds."
 can_dnc_c.45.t: "The Question Is Put"
 can_dnc_c.45.d: "The Cabinet sits at the East Block with the customs schedule on the table and the Crown gone from the writs. There are three ways to end a country and only one of them asks the country first."
 can_dnc_c.45.a: "Then let us choose how."
 can_dnc_c.46.t: "Stones at Brockville"
 can_dnc_c.46.d: "The Yes meeting in the drill hall is broken up by an Orange crowd and the windows go in on both sides of the street. The Toronto papers print the injured on the front page and the Winnipeg papers print the speech that was never finished."
 can_dnc_c.46.a: "Put the speaker back on the platform tomorrow."
 can_dnc_c.46.b: "Cancel the eastern meetings. We will not have riots."
 can_dnc_c.47.t: "Bourassa Wants an Answer"
 can_dnc_c.47.d: "Le Devoir asks what becomes of the French language, the separate schools and the civil code of Quebec inside a republic that has never guaranteed any of them. Nothing in the schedule answers him, and half the province is waiting."
 can_dnc_c.47.a: "Promise the language and the schools in the terms."
 can_dnc_c.47.b: "Make no promise we cannot make Congress keep."
 can_dnc_c.48.t: "The Last Week"
 can_dnc_c.48.d: "Every hall from Sydney to Victoria is booked and the special trains are running at a loss. The party funds are spent, the organisers want one more week of them, and the writs cannot be moved."
 can_dnc_c.48.a: "Spend everything. There is no second ballot."
 can_dnc_c.48.b: "Let the country decide on what it has heard."
 can_dnc_c.50.t: "The Country Votes"
 can_dnc_c.50.d.yes: "The prairie polls close first and the wires from Regina and Edmonton settle it before Ontario has finished counting. The Maritimes vote No, Quebec splits, and the majority is a majority."
 can_dnc_c.50.d.no: "Ontario buries it. The lodges turn out every voter between Kingston and Windsor, the Maritimes follow, and the prairie majority is not large enough to carry the Dominion."
 can_dnc_c.50.a: "The country has said yes."
 can_dnc_c.50.b: "The country has said no."
 can_dnc_c.51.t: "The Conventions Meet at Saskatoon"
 can_dnc_c.51.d: "Four hundred delegates from the Grain Growers, the municipalities and the American settler townships sit for three days and resolve that the vote of the eastern provinces does not bind them. A committee is named to go to Washington."
 can_dnc_c.51.a: "Let them go, and let Washington answer."
 can_dnc_c.51.b: "Arrest the committee and hold the branch lines."
 can_dnc_c.55.t: "Ottawa Proposes a Treaty"
 can_dnc_c.55.d: "The Canadian minister asks the State Department to negotiate terms of union directly, government to government, on the Texas precedent of 1845. There will be no plebiscite. Root must decide whether the Senate would ever consent to a thing done this way."
 can_dnc_c.55.a: "Sit down with them. Name commissioners."
 can_dnc_c.55.b: "Send it straight to the Senate and let them answer."
 can_dnc_c.56.t: "Root Names Commissioners"
 can_dnc_c.56.d: "The State Department will negotiate. Root names three commissioners and takes the file himself, which means the terms will be defensible on the floor of the Senate before they are ever printed."
 can_dnc_c.56.a: "We have a negotiator, not a judge."
 can_dnc_c.57.t: "Straight to the Senate"
 can_dnc_c.57.d: "Root will not put his name to a draft the Senate has not seen. The terms will be written in Ottawa, sent to Washington and read for the first time in committee, with nobody on the American side committed to defending a line of them."
 can_dnc_c.57.a: "We will draft it alone, then."
 can_dnc_c.60.t: "Toronto Burns"
 can_dnc_c.60.d: "19 April 1904: the fire starts in a Wellington Street warehouse and takes fourteen acres of the wholesale district before the Buffalo engines arrive by special train. Nobody is killed and five thousand are out of work by morning."
 can_dnc_c.60.a: "Rebuild it with New York money and be quick."
 can_dnc_c.60.b: "Let the insurers and the city settle it."
 can_dnc_c.61.t: "The Waterfront Strikes"
 can_dnc_c.61.d: "Vancouver, spring 1903: the United Brotherhood of Railway Employees ties up the Canadian Pacific docks and the company answers with special constables. A royal commission is sitting, with a young deputy named Mackenzie King taking the notes."
 can_dnc_c.61.a: "The commission will condemn the foreign union."
 can_dnc_c.61.b: "The men may hold whatever charter they please."
 can_dnc_c.62.t: "The Growers Want a Seat"
 can_dnc_c.62.d: "September 1906: Partridge's Grain Growers' Grain Company buys a seat on the Winnipeg Exchange and the Exchange takes it back for paying its members a dividend. The farmers ask Ottawa whether a market may expel its own suppliers."
 can_dnc_c.62.a: "The seat is restored, and the Exchange is told why."
 can_dnc_c.62.b: "The Exchange may govern its own floor."
 can_dnc_c.63.t: "The South Arm"
 can_dnc_c.63.d: "29 August 1907: the cantilever goes into the river in fifteen seconds, seventy-five men with it, thirty-three from Kahnawake. The compression chords had been buckling for weeks and Theodore Cooper approved the longer span from New York."
 can_dnc_c.63.a: "No guaranteed work without public engineers."
 can_dnc_c.63.b: "Let the company answer to its shareholders."
 can_dnc_c.64.t: "The Panic Comes North"
 can_dnc_c.64.d: "The New York failures of October 1907 reach Canada at harvest. The chartered banks call their loans, the elevator advances stop, and the crop is on the ground with no money in the country to move it."
 can_dnc_c.64.a: "Issue Dominion notes against the crop."
 can_dnc_c.64.b: "The banks will right themselves. They always have."
 can_dnc_c.65.t: "The Terms Are Drafted"
 can_dnc_c.65.d: "The commissioners have the debt and the Indian treaties settled and are stuck on the article that would guarantee the French language and the separate schools. Washington says the Constitution knows no such article and will not invent one for a treaty."
 can_dnc_c.65.a: "Then the article stays in, or there is no treaty."
 can_dnc_c.65.b: "Strike it. Quebec will have to take its chances."
 can_dnc_c.66.t: "Whitney Takes Ontario"
 can_dnc_c.66.d: "25 January 1905: the Conservatives take sixty-nine of ninety-eight seats and end thirty-four years of Liberal government at Queen's Park. Whitney's first speech is about hydro power and his second is about who is selling Ontario to the Americans."
 can_dnc_c.66.a: "Let him shout. The West is with us."
 can_dnc_c.66.b: "Buy the province off with public works."
 can_dnc_c.70.t: "A Place Under the Wing"
 can_dnc_c.70.d: "Ottawa asks Washington for a standing guarantee of the northern frontier without any transfer of sovereignty, which is what New Zealand has from London and what no American administration has ever given to anyone. The alternative Ottawa has is nothing."
 can_dnc_c.70.a: "Guarantee them. A friendly north costs us a fleet."
 can_dnc_c.70.b: "Friendship, yes. Signatures, no."
 can_dnc_c.71.t: "The Guarantee Is Given"
 can_dnc_c.71.d: "The declaration is published in Washington and reprinted in every Canadian paper the same afternoon. An attack on Canada is to be treated as an attack on the peace of the hemisphere, and the militia estimates are already being cut."
 can_dnc_c.71.a: "The frontier is somebody else's problem now."
 can_dnc_c.72.t: "Friendship without Signatures"
 can_dnc_c.72.d: "The President is warm, the Secretary of State is warmer, and nothing is put on paper. Canada is to understand that it is safe, and to understand also that it has nothing to show a hostile power but that understanding."
 can_dnc_c.72.a: "We are protected by a sentiment."
 can_dnc_c.90.t: "The Union Grows"
 can_dnc_c.90.d: "The flag is changed at the Executive Mansion and the customs houses from Windsor to Emerson are shut for good. Forty-two years after Charlottetown the Dominion of Canada has voted itself out of existence, and the continent has one government from the Rio Grande to the Beaufort Sea."
 can_dnc_c.90.a: "From sea to sea to sea."
 can_dnc_c.91.t: "The Painter Is Cut"
 can_dnc_c.91.d: "Westminster has released the Dominion of Canada from the imperial connection. There is no war, no rebellion and no ceremony worth the name, only an Act, a proclamation read on Parliament Hill, and a governor general packing his books. Australia and New Zealand read the despatches very carefully."
 can_dnc_c.91.a: "The first to walk out."
 can_dnc_c.92.t: "The Prairies Change Flags"
 can_dnc_c.92.d: "Alberta, Saskatchewan and Manitoba pass to the United States by agreement, and the border posts are moved north to the sixtieth parallel in a fortnight. The wheat that fed the Empire will be sold in Minneapolis, and what is left of Canada has no West."
 can_dnc_c.92.a: "Half a country."
