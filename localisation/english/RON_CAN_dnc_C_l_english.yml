l_english:

#Focuses
 CANDNC_c_unrestricted_reciprocity: "Unrestricted Reciprocity"
 CANDNC_c_unrestricted_reciprocity_desc: "Fielding's note leaves Ottawa for the State Department in 1902: hay, cattle, lumber and grain to cross free both ways. Cartwright asked the same in 1891 and lost the election on it. Laurier's answer to Bourassa is not the Empire but the continent."
 CANDNC_c_accept_the_award_with_grace: "Accept the Award with Grace"
 CANDNC_c_accept_the_award_with_grace_desc: "London, 20 October 1903: Alverstone joins the three Americans, four to two, and the heads of the Lynn Canal stay American. Jette and Aylesworth refuse to sign. Ottawa signs, thanks the tribunal, and says nothing about Skagway."
 CANDNC_c_the_dollar_comes_north: "The Dollar Comes North"
 CANDNC_c_the_dollar_comes_north_desc: "Walkerville, 17 August 1904: Gordon McGregor incorporates the Ford Motor Company of Canada in a wagon works across the river from Detroit. The tariff built to keep American goods out brings American factories in instead."
 CANDNC_c_the_treaty_of_natural_products: "The Treaty of Natural Products"
 CANDNC_c_the_treaty_of_natural_products_desc: "Fielding and Root fix a schedule in Washington: the farm, the forest, the mine and the sea cross free, the factory does not. Every farmer between Brandon and Lethbridge has been asking for this since the car shortage of 1901."
 CANDNC_c_the_dingley_wall_holds: "The Dingley Wall Holds"
 CANDNC_c_the_dingley_wall_holds_desc: "The Dingley rates of 1897 stay where Congress put them, and Ottawa is told to come back when an administration needs the farm vote. Fielding raises the general tariff a point and tells the House the door is only bolted, not walled."
 CANDNC_c_hayss_line_to_prince_rupert: "Hays's Line to Prince Rupert"
 CANDNC_c_hayss_line_to_prince_rupert_desc: "Parliament sanctions the National Transcontinental on 24 October 1903: the state builds Moncton to Winnipeg and leases it to Charles Melville Hays, whose Grand Trunk Pacific runs west to a townsite on the Skeena nobody has surveyed."
 CANDNC_c_the_international_unions: "The International Unions"
 CANDNC_c_the_international_unions_desc: "Ralph Smith's Trades and Labour Congress takes its charters from the American Federation of Labor. The Vancouver locals answer to a hall in Washington, and the Berlin convention of 1902 throws out the unions that will not."
 CANDNC_c_hills_lines_from_st_paul: "Hill's Lines from St Paul"
 CANDNC_c_hills_lines_from_st_paul_desc: "James J. Hill, born at Rockwood in Upper Canada, runs his branch lines north from St Paul to the Manitoba border. His grain goes to Duluth, his rates undercut the Canadian Pacific, and the prairie learns which way its wheat travels."
 CANDNC_c_the_north_coast_port: "The North Coast Port"
 CANDNC_c_the_north_coast_port_desc: "The Grand Trunk Pacific buys Kaien Island in 1906 and lays out a harbour five hundred miles nearer Yokohama than Vancouver. Prince Rupert has a name by public competition in 1908 and almost nothing else."
 CANDNC_c_the_last_best_west_for_americans: "The Last Best West for Americans"
 CANDNC_c_the_last_best_west_for_americans_desc: "Frank Oliver's agents work the Dakotas, Iowa and Minnesota with the same pamphlets Sifton used in Galicia. The settlers who cross at Emerson bring capital, machinery and no memory of the Queen."
 CANDNC_c_grain_goes_by_duluth: "Grain Goes by Duluth"
 CANDNC_c_grain_goes_by_duluth_desc: "The elevators at Fort William empty as the cars turn south. Duluth and Minneapolis take the crop, the lake fleet at Port Arthur lies idle, and the Montreal export houses tell Fielding that the West has left the country's ledger."
 CANDNC_c_the_bridge_falls_at_quebec: "The Bridge Falls at Quebec"
 CANDNC_c_the_bridge_falls_at_quebec_desc: "29 August 1907: the south arm goes into the river in fifteen seconds and takes seventy-five men, thirty-three of them from Kahnawake. Theodore Cooper had approved the longer span from New York without seeing the steel."
 CANDNC_c_the_silver_of_cobalt: "The Silver of Cobalt"
 CANDNC_c_the_silver_of_cobalt_desc: "McKinley and Darragh find silver on the Temiskaming grade in 1903, then LaRose the blacksmith throws his hammer at a fox. Ontario keeps the royalties; the smelters, the promoters and most of the shares are in New York."
 CANDNC_c_the_winnipeg_exchange_loses_its_grip: "The Winnipeg Exchange Loses Its Grip"
 CANDNC_c_the_winnipeg_exchange_loses_its_grip_desc: "E. A. Partridge founds the Grain Growers' Grain Company at Winnipeg in September 1906. The Exchange buys it a seat, then takes the seat away, and discovers that a provincial government can put a member on its floor."
 CANDNC_c_the_winter_port_at_portland: "The Winter Port at Portland"
 CANDNC_c_the_winter_port_at_portland_desc: "Andrew Blair leaves the Railways portfolio on 13 July 1903 and attacks the scheme from the back benches on 11 August: the Grand Trunk keeps its winter terminus at Portland in Maine and leaves the Maritimes to the ice."
 CANDNC_c_the_sintaluta_judgment: "The Sintaluta Judgment"
 CANDNC_c_the_sintaluta_judgment_desc: "December 1902: Motherwell's Territorial Grain Growers take the Canadian Pacific agent at Sintaluta before a country magistrate over the car allotment rules, and win. The conviction is upheld the following year."
 CANDNC_c_under_the_monroe_doctrine: "Under the Monroe Doctrine"
 CANDNC_c_under_the_monroe_doctrine_desc: "Ottawa asks the White House the question no Dominion has asked: does the doctrine of 1823 cover a British colony north of the lakes? Roosevelt has just answered it for Santo Domingo, and the fleet is a week from Halifax."
 CANDNC_c_the_fortresses_are_ottawas: "The Fortresses Are Ottawa's"
 CANDNC_c_the_fortresses_are_ottawas_desc: "The last imperial garrisons march out of the Citadel and Work Point in 1905 and 1906. Halifax and Esquimalt pass to Frederick Borden's Militia Department with their guns, their barracks and their coal bills."
 CANDNC_c_no_truck_nor_trade: "No Truck nor Trade"
 CANDNC_c_no_truck_nor_trade_desc: "James Pliny Whitney takes Ontario on 25 January 1905 with sixty-nine seats and thirty-four years of grievance. The Orange lodges revive the cry of 1891, and the province that pays the tariff will not be sold to Washington."
 CANDNC_c_the_coast_follows_washingtons_line: "The Coast Follows Washington's Line"
 CANDNC_c_the_coast_follows_washingtons_line_desc: "The Asiatic Exclusion League marches on the Vancouver city hall on 7 September 1907 and turns into Powell Street, where the Japanese residents are waiting. Ottawa stops asking London and starts copying the California statutes."
 CANDNC_c_the_customs_union: "The Customs Union"
 CANDNC_c_the_customs_union_desc: "The bill lays one tariff schedule around both countries and divides the receipts by population. Chamberlain offered the Empire a Zollverein at the coronation conference of 1902 and Laurier said no; this one comes from Washington."
 CANDNC_c_bow_to_london: "Bow to London"
 CANDNC_c_bow_to_london_desc: "The Colonial Office has reserved the bill and given Ottawa sixty days. Laurier walks into the Commons and moves the repeal himself, and the Governor General wires London before the division bells stop ringing."
 CANDNC_c_defy_london: "Defy London"
 CANDNC_c_defy_london_desc: "The summons is read at the table and left there. Ottawa answers that a Parliament which cannot set its own tariff is not a Parliament, and asks the Colonial Secretary what he proposes to do about it."
 CANDNC_c_the_boundary_waters_treaty: "The Boundary Waters Treaty"
 CANDNC_c_the_boundary_waters_treaty_desc: "Washington, 11 January 1909: George Gibbons negotiated it, James Bryce signs it because Canada has no treaty power, and Elihu Root signs for the Americans. Six commissioners, three a side, share the Great Lakes and the Niagara."
 CANDNC_c_reciprocity_without_the_union: "Reciprocity without the Union"
 CANDNC_c_reciprocity_without_the_union_desc: "The Zollverein is dead and the schedule is not. Fielding goes back to Washington for the natural products alone, the arrangement Taft's men will carry to Ottawa in 1911, and Laurier keeps his tariff and his Crown together."
 CANDNC_c_the_question_of_union: "The Question of Union"
 CANDNC_c_the_question_of_union_desc: "London has cut its losses and the customs schedule is already American. The Cabinet sits until three in the morning at the East Block on how a country that has stopped being a colony is to stop being a country."
 CANDNC_c_the_loyalists_answered: "The Loyalists Answered"
 CANDNC_c_the_loyalists_answered_desc: "Whitney is told at Queen's Park that the Crown stays, the flag stays, and the schedule is a tariff and nothing more. The Orange lodges stand down and the Toronto papers find another quarrel for the autumn."
 CANDNC_c_the_plebiscite_on_union: "The Plebiscite on Union"
 CANDNC_c_the_plebiscite_on_union_desc: "The question goes to the country the way the liquor question went in 1898: one line on a ballot, a simple majority, every province counted together. Quebec remembers what happened to the majority that voted dry."
 CANDNC_c_the_treaty_of_union: "The Treaty of Union"
 CANDNC_c_the_treaty_of_union_desc: "No ballot. Two governments negotiate terms as Texas did in 1845, and the Senate is asked for two thirds. Elihu Root will say in a fortnight whether the State Department will sit down at all."
 CANDNC_c_the_associate_not_the_state: "The Associate, Not the State"
 CANDNC_c_the_associate_not_the_state_desc: "The Cabinet stops at the threshold. Free trade, a common defence and an American guarantee, but the ballot is never printed and the flag over the East Block is not lowered. Canada will be junior and it will still be Canada."
 CANDNC_c_the_continental_dominion: "The Continental Dominion"
 CANDNC_c_the_continental_dominion_desc: "The decade ends with the Crown on the coins, the King's writ in the courts, and the whole trade of the country running south. Laurier tells the Empire Club that a Dominion may face two ways and be loyal in both."
 CANDNC_c_the_campaign: "The Campaign"
 CANDNC_c_the_campaign_desc: "Six months of tents, halls and pamphlets from Sydney to Victoria. Bourassa takes Quebec, the lodges take Ontario, the Grain Growers take the prairie, and stones go through windows at Belleville and Brockville."
 CANDNC_c_the_terms_of_union: "The Terms of Union"
 CANDNC_c_the_terms_of_union_desc: "The commissioners argue in a hotel on Pennsylvania Avenue over the debt, the Indian treaties, the school clauses and the French language. Every article settled in Washington is an article no Canadian Parliament ever voted."
 CANDNC_c_the_junior_partner_of_a_giant: "The Junior Partner of a Giant"
 CANDNC_c_the_junior_partner_of_a_giant_desc: "Ottawa asks Washington for what New Zealand asks London: protection without absorption. The Americans have never given it to anyone north of the Rio Grande and the ministers do not know what a refusal would leave them."
 CANDNC_c_the_vote: "The Vote"
 CANDNC_c_the_vote_desc: "The polls close at five and the returning officers wire Ottawa through the night. The prairie counts first and the Maritimes count last, and by two in the morning the East Block knows what the country has done."
 CANDNC_c_the_senate_votes: "The Senate Votes"
 CANDNC_c_the_senate_votes_desc: "Sixty days on Capitol Hill. The Southern bloc counts the new senators the north would send, the protectionists count the lumber, and the Canadian commissioners sit in the gallery unable to say a word."
 CANDNC_c_the_governor_general_goes_home: "The Governor General Goes Home"
 CANDNC_c_the_governor_general_goes_home_desc: "Earl Grey's train leaves Ottawa for Halifax without a guard of honour. Rideau Hall is shut, the King's name comes off the writs, and the Prime Minister signs the first commission that no viceroy countersigned."
 CANDNC_c_admission_to_the_union: "Admission to the Union"
 CANDNC_c_admission_to_the_union_desc: "The address goes to Congress with the poll of every county attached. Oklahoma came in as one state in 1907 after a convention at Guthrie; the Dominion is asking to come in as nine, with its debts and its treaties."
 CANDNC_c_the_west_goes_south: "The West Goes South"
 CANDNC_c_the_west_goes_south_desc: "The country voted No and the prairie voted Yes. Conventions at Saskatoon and Calgary petition Washington directly, and Ottawa decides whether to negotiate the loss of three provinces or send the Mounted Police to stop it."
 CANDNC_c_nine_new_states: "Nine New States"
 CANDNC_c_nine_new_states_desc: "The Senate has consented and the terms are law. Nine stars go on the flag, the Militia Department becomes a department of the Army, and the Dominion of Canada ends forty-two years after Charlottetown."
 CANDNC_c_the_junior_partner_by_default: "The Junior Partner by Default"
 CANDNC_c_the_junior_partner_by_default_desc: "The Senate would not have us. The commissioners come home to a country with no Crown, no treaty and no tariff of its own, and Washington offers the only thing that costs it nothing: a guarantee."
 CANDNC_c_the_northern_associate: "The Northern Associate"
 CANDNC_c_the_northern_associate_desc: "The decade ends with an independent Canada inside the American customs line and under the American guarantee. The flag is its own, the market is not, and every despatch from Ottawa is read in Washington first."

#Ideas
 CAN_c_the_continent_is_the_market: "The Continent Is the Market"
 CAN_c_the_continent_is_the_market_desc: "Ottawa has stopped waiting for London to open a market and started asking Washington. The customs houses at Windsor and Emerson matter more than the cable to Poldhu, and the Ontario manufacturers know it."
 CAN_c_branch_plants: "Branch Plants"
 CAN_c_branch_plants_desc: "American firms climb the tariff wall instead of paying it. The works go up at Walkerville, Windsor and Hamilton, the wages are Canadian, the patents and the dividends are not."
 CAN_c_reciprocity_in_natural_products: "Reciprocity in Natural Products"
 CAN_c_reciprocity_in_natural_products_desc: "The farm, the forest, the mine and the fishery cross the line free; the factory still pays. The prairie gets the Minneapolis price and the eastern manufacturer gets nothing but the freight bill."
 CAN_c_the_dingley_wall: "The Dingley Wall"
 CAN_c_the_dingley_wall_desc: "Congress kept the rates of 1897 and Ottawa answered in kind. The home market is safe behind two tariffs, and the exporters are shut inside it with everyone else."
 CAN_c_hayss_debt: "Hays's Debt"
 CAN_c_hayss_debt_desc: "The Dominion guarantees the bonds of a railway across muskeg nobody has surveyed. The grade advances a mile a day and the Finance Department signs for every mile of it."
 CAN_c_hills_lines: "Hill's Lines"
 CAN_c_hills_lines_desc: "The branch lines come up from St Paul and the rates fall wherever they reach. The prairie ships cheaper and ships south, and Ottawa learns that a foreign railway sets the price of Canadian wheat."
 CAN_c_grain_by_duluth: "Grain by Duluth"
 CAN_c_grain_by_duluth_desc: "The crop turns south at Emerson for the head of Lake Superior. The growers are paid more and the Fort William elevators, the lake fleet and the Montreal export houses are paid nothing."
 CAN_c_the_portland_terminus: "The Portland Terminus"
 CAN_c_the_portland_terminus_desc: "The winter traffic goes out through Maine because the ice does not reach it. The through rate is the cheapest in the country and every Maritime member in the House says so at every session."
 CAN_c_the_international_unions: "The International Unions"
 CAN_c_the_international_unions_desc: "The locals hold American charters and strike when the international says strike. The trades are organised as they have never been, and the strike fund is voted in a hall the Dominion cannot reach."
 CAN_c_the_american_prairie: "The American Prairie"
 CAN_c_the_american_prairie_desc: "The settlers cross at Emerson and North Portal with implements, seed money and experience of the same soil. They fill the townships fast and they did not come north to be counted as British subjects."
 CAN_c_the_silver_camps: "The Silver Camps"
 CAN_c_the_silver_camps_desc: "Cobalt sends out ore that was worth a few hundred thousand ounces in 1904 and millions by 1909. Ontario takes the royalty, and the refining, the promoting and the profit are done elsewhere."
 CAN_c_the_grain_growers_company: "The Grain Growers' Company"
 CAN_c_the_grain_growers_company_desc: "The farmers sell their own crop through their own company and keep the commission. The Exchange, the banks and the line elevator men treat every ministry that helped them as an enemy."
 CAN_c_the_exclusion_line: "The Exclusion Line"
 CAN_c_the_exclusion_line_desc: "British Columbia gets the statutes it has demanded since 1900 and the Pacific trade gets the bill. The mills have their quiet coast and the shipping agents at Yokohama stop calling."
 CAN_c_the_eagles_wing: "The Eagle's Wing"
 CAN_c_the_eagles_wing_desc: "Washington has guaranteed the northern frontier and the House has read the despatch. The militia estimates are cut the same session, because nobody votes money for a danger the Americans have taken away."
 CAN_c_the_esquimalt_station: "The Esquimalt Station"
 CAN_c_the_esquimalt_station_desc: "American colliers coal at the dockyard the British garrison left, under a lease of ninety-nine years. The yard works again, and there is a foreign ensign flying over Vancouver Island."
 CAN_c_the_customs_union: "The Customs Union"
 CAN_c_the_customs_union_desc: "One tariff wall around both countries, the receipts divided by population, and no customs house between Windsor and Detroit. The market is continental and the Dominion no longer sets a single rate."
 CAN_c_the_continental_dominion: "The Continental Dominion"
 CAN_c_the_continental_dominion_desc: "The Zollverein was withdrawn and the trade stayed. Ottawa keeps the Crown, keeps its tariff schedule, and keeps a market it can no longer bargain over."
 CAN_c_the_junior_partner: "The Junior Partner"
 CAN_c_the_junior_partner_desc: "The country is free to say anything it likes and free to be ignored. Its goods move, its ministers are received at the State Department, and no despatch leaves Ottawa without a guess at Washington's temper."
 CAN_c_the_imperial_boycott: "The Imperial Boycott"
 CAN_c_the_imperial_boycott_desc: "The Empire preference is withdrawn, the Liverpool houses close their Canadian accounts, and the insurance rates on the St Lawrence double. The country is united in resentment and short of everything else."

