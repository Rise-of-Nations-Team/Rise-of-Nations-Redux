#Focuses
 CANDNC_c_unrestricted_reciprocity: "Unrestricted Reciprocity"
 CANDNC_c_unrestricted_reciprocity_desc: "Our note goes to Washington, not to London: hay, cattle, lumber and grain to cross the line free both ways. The last man who asked for this lost an election on it — but the continent, not the Empire, is where Canada's future is bought and sold."
 CANDNC_c_accept_the_award_with_grace: "Accept the Award with Grace"
 CANDNC_c_accept_the_award_with_grace_desc: "A British judge has given the Panhandle to Washington, and we could rage at London for it. Instead we sign, thank the tribunal, and say nothing of Skagway. Quarrelling with the Empire wins us nothing; keeping the Americans content may win us a great deal more."
 CANDNC_c_the_dollar_comes_north: "The Dollar Comes North"
 CANDNC_c_the_dollar_comes_north_desc: "The tariff we built to keep American goods out is bringing American factories in instead. Ford opens across the river from Detroit, and the capital follows. We let the dollar come north and put down roots — branch plants, American money, and the jobs that come with both."
 CANDNC_c_the_treaty_of_natural_products: "The Treaty of Natural Products"
 CANDNC_c_the_treaty_of_natural_products_desc: "Fielding and Root fix the schedule in Washington: the farm, the forest, the mine and the sea cross free; the factory does not. Every farmer between Brandon and Lethbridge has begged for this for years. We give the West its American market, and keep the manufacturer his wall."
 CANDNC_c_the_dingley_wall_holds: "The Dingley Wall Holds"
 CANDNC_c_the_dingley_wall_holds_desc: "Congress keeps its wall where it stands and tells us to come back when an administration needs the farm vote. We raise the general tariff a single point in reply, and tell the House the door is only bolted, not bricked over. Reciprocity waits on Washington's convenience, not ours."
 CANDNC_c_hayss_line_to_prince_rupert: "Hays's Line to Prince Rupert"
 CANDNC_c_hayss_line_to_prince_rupert_desc: "The state builds from Moncton to Winnipeg and leases the road to Hays, whose rails run on to a harbour on the Skeena no surveyor has yet walked. It is a wager on the Pacific trade with the Dominion's credit — a second transcontinental aimed at Asia, not at Britain."
 CANDNC_c_the_international_unions: "The International Unions"
 CANDNC_c_the_international_unions_desc: "Our labour takes its charters from the American Federation of Labor, and the Vancouver locals answer to a hall in Washington. Canadian workingmen are joining a continental movement, not an imperial one. We let the international unions in, and with them a loyalty that crosses the border more easily than ours."
 CANDNC_c_hills_lines_from_st_paul: "Hill's Lines from St Paul"
 CANDNC_c_hills_lines_from_st_paul_desc: "Hill runs his branch lines north to the border and pulls our grain down to Duluth at rates the Canadian Pacific cannot match. The prairie is learning which way its wheat wants to travel — and it is south. We may fight the pull, or admit that geography has already chosen for us."
 CANDNC_c_the_north_coast_port: "The North Coast Port"
 CANDNC_c_the_north_coast_port_desc: "The Grand Trunk lays out a harbour on Kaien Island, five hundred miles nearer Yokohama than Vancouver. Prince Rupert has a name won by competition and almost nothing else yet. We build the Dominion's window on the Pacific, and dare the Asian trade to come to it."
 CANDNC_c_the_last_best_west_for_americans: "The Last Best West for Americans"
 CANDNC_c_the_last_best_west_for_americans_desc: "Our agents work the Dakotas and Minnesota with the same pamphlets that once emptied Galicia. The settlers who cross at Emerson bring capital, machinery and no memory of the Queen. We fill the West with seasoned American farmers — and with a people who feel the border less with every year."
 CANDNC_c_grain_goes_by_duluth: "Grain Goes by Duluth"
 CANDNC_c_grain_goes_by_duluth_desc: "The cars turn south and the elevators at Fort William stand empty; Duluth and Minneapolis take the crop, and the lake fleet lies idle at Port Arthur. The Montreal houses warn that the West has slipped off the country's ledger. Our own harvest now leaves through another nation's ports."
 CANDNC_c_the_bridge_falls_at_quebec: "The Bridge Falls at Quebec"
 CANDNC_c_the_bridge_falls_at_quebec_desc: "The great bridge at Quebec folds into the river in fifteen seconds and takes seventy-five men, a third of them Mohawks from Kahnawake. An engineer in New York approved a span he never saw. We will raise it again — and reckon, quietly, how much of our building is designed abroad."
 CANDNC_c_the_silver_of_cobalt: "The Silver of Cobalt"
 CANDNC_c_the_silver_of_cobalt_desc: "Silver is struck on the Temiskaming grade, and the rush is on. Ontario keeps the royalties — but the smelters, the promoters and most of the shares are in New York. We dig the ore and they take the profit. A colony's wealth, once more, refined on another's account."
 CANDNC_c_the_winnipeg_exchange_loses_its_grip: "The Winnipeg Exchange Loses Its Grip"
 CANDNC_c_the_winnipeg_exchange_loses_its_grip_desc: "Partridge's Grain Growers' Company buys a seat on the Exchange, the Exchange takes it back, and a provincial government puts the company on the floor by law. The farmer is learning to organise, and the state to take his side. The old grain monopoly's grip is broken."
 CANDNC_c_the_winter_port_at_portland: "The Winter Port at Portland"
 CANDNC_c_the_winter_port_at_portland_desc: "The Grand Trunk keeps its winter terminus at Portland in Maine, and our winter trade leaves the country through an American port while the Maritimes sit locked in ice. Blair resigns rather than bless it. We tie our commerce to a foreign harbour, for the sake of a railway's convenience."
 CANDNC_c_the_sintaluta_judgment: "The Sintaluta Judgment"
 CANDNC_c_the_sintaluta_judgment_desc: "The Territorial Grain Growers haul the railway's agent before a country magistrate over the car allotment, and win — and the conviction stands on appeal. The prairie farmer has beaten the Canadian Pacific in a courtroom, and will not forget that the law, well used, is a weapon he can wield."
 CANDNC_c_under_the_monroe_doctrine: "Under the Monroe Doctrine"
 CANDNC_c_under_the_monroe_doctrine_desc: "We put the question no Dominion has dared ask the White House: does the Monroe Doctrine shelter a British colony north of the lakes? Roosevelt has just answered it for Santo Domingo. If the eagle will guard us, we need the lion's fleet a good deal less than London would like."
 CANDNC_c_the_fortresses_are_ottawas: "The Fortresses Are Ottawa's"
 CANDNC_c_the_fortresses_are_ottawas_desc: "The last imperial garrisons march out, and Halifax and Esquimalt pass to our own Militia Department with their guns and their upkeep. We hold our coasts ourselves now — one more tie to London quietly cut, one more reason the Empire's protection means less to a continental Canada."
 CANDNC_c_no_truck_nor_trade: "No Truck nor Trade"
 CANDNC_c_no_truck_nor_trade_desc: "Whitney sweeps Ontario, and the Orange lodges raise the old cry: no truck nor trade with the Yankees. The province that pays the tariff will not be sold to Washington. Here is the wall our continental course must climb — English Canada's dread of being swallowed by its neighbour."
 CANDNC_c_the_coast_follows_washingtons_line: "The Coast Follows Washington's Line"
 CANDNC_c_the_coast_follows_washingtons_line_desc: "After the riot on the coast, we stop asking London how to keep the Pacific white and start copying the statutes of California. The exclusion the Empire forbids, the American states have already written. On Asian immigration, our neighbour and not our mother shows us the way."
 CANDNC_c_the_customs_union: "The Customs Union"
 CANDNC_c_the_customs_union_desc: "One tariff schedule around both countries, the receipts divided by head. Chamberlain offered the Empire just such a union and we refused it — this one comes from Washington, and it is far harder to refuse. A single market of a hundred millions, with Canada the junior clerk at the counter."
 CANDNC_c_bow_to_london: "Bow to London"
 CANDNC_c_bow_to_london_desc: "The Colonial Office has reserved the bill and given us sixty days. We walk into the Commons and move the repeal ourselves, and the wire to London goes before the division bells fall silent. The imperial veto still binds us — and we choose, this time, to bow rather than to break."
 CANDNC_c_defy_london: "Defy London"
 CANDNC_c_defy_london_desc: "The summons is read at the table and left lying there. We answer that a Parliament which cannot set its own tariff is no Parliament at all, and ask the Colonial Secretary what he means to do about it. Let London learn whether its veto is a law, or merely a habit we may drop."
 CANDNC_c_the_boundary_waters_treaty: "The Boundary Waters Treaty"
 CANDNC_c_the_boundary_waters_treaty_desc: "Gibbons negotiates it, but Bryce must sign because Canada has no power to sign its own treaties, and Root signs for the Americans. Six commissioners share the Great Lakes between them. Even settling our own frontier, we watch London hold the pen — a humiliation we do not mean to suffer forever."
 CANDNC_c_reciprocity_without_the_union: "Reciprocity without the Union"
 CANDNC_c_reciprocity_without_the_union_desc: "The imperial union is dead, but the American schedule need not die with it. We go back to Washington for the natural products alone, and keep our tariff and our Crown both. Reciprocity in wheat and lumber, yes — but Canada stays Canada, and the deeper question is left for another day."
 CANDNC_c_the_question_of_union: "The Question of Union"
 CANDNC_c_the_question_of_union_desc: "London has washed its hands of us, and our trade is already American. The Cabinet sits till three in the morning on the last question of all: how a country that has stopped being a colony is to stop being a country. The continental road has led us to its edge, and we must look over it."
 CANDNC_c_the_loyalists_answered: "The Loyalists Answered"
 CANDNC_c_the_loyalists_answered_desc: "We tell Whitney at Queen's Park what he needs to hear: the Crown stays, the flag stays, the schedule is a tariff and nothing more. The Orange lodges stand down, and the loyalist storm blows itself out. We take the American market and swear, hand on heart, that it buys nothing but trade."
 CANDNC_c_the_plebiscite_on_union: "The Plebiscite on Union"
 CANDNC_c_the_plebiscite_on_union_desc: "The question goes to the whole country on a single line of a ballot, a simple majority to decide it. Quebec remembers what became of the majority that once voted the nation dry. We put the fate of Canada to a vote — and cannot be sure the vote will hand us back the answer we want."
 CANDNC_c_the_treaty_of_union: "The Treaty of Union"
 CANDNC_c_the_treaty_of_union_desc: "No ballot. Two governments negotiate terms the way Texas once did, and the American Senate is asked for its two thirds. We would join the Union by treaty, over the heads of the voters. Root will say within a fortnight whether Washington will even sit down to talk of it."
 CANDNC_c_the_associate_not_the_state: "The Associate, Not the State"
 CANDNC_c_the_associate_not_the_state_desc: "At the very threshold, the Cabinet stops. Free trade, a common defence, an American guarantee — but the ballot is never printed and the flag over the East Block is never lowered. Canada will be the junior partner of a giant, and it will still, unmistakably, be Canada."
 CANDNC_c_the_continental_dominion: "The Continental Dominion"
 CANDNC_c_the_continental_dominion_desc: "The decade ends with the King's head on the coins, his writ in the courts, and the whole trade of the country running south. We tell the Empire Club that a Dominion may face two ways at once and be loyal in both. Crown to the east, commerce to the south — a delicate balance we mean to keep."
 CANDNC_c_the_campaign: "The Campaign"
 CANDNC_c_the_campaign_desc: "Six months of tents and halls and pamphlets from Sydney to Victoria. Bourassa takes Quebec, the lodges take Ontario, the Grain Growers take the prairie, and stones go through windows in the loyalist towns. We have put union to the people — and set every region of the country against the others."
 CANDNC_c_the_terms_of_union: "The Terms of Union"
 CANDNC_c_the_terms_of_union_desc: "The commissioners argue on Pennsylvania Avenue over the debt, the Indian treaties, the school clauses, the French language. Every article settled in Washington is an article no Canadian Parliament will ever vote. We are bargaining away the country clause by clause — and the country is not in the room."
 CANDNC_c_the_junior_partner_of_a_giant: "The Junior Partner of a Giant"
 CANDNC_c_the_junior_partner_of_a_giant_desc: "We ask Washington for what New Zealand asks London: protection without absorption. But the Americans have never granted it to anyone north of the Rio Grande, and we cannot say what a refusal would leave us holding. To lean on the giant is one thing; to keep our feet while we do it, another."
 CANDNC_c_the_vote: "The Vote"
 CANDNC_c_the_vote_desc: "The polls close and the returning officers wire Ottawa through the night — the prairie first, the Maritimes last. By two in the morning the East Block knows what the country has decided about its own existence. Whatever the tally, Canada will not be the same country when the sun comes up."
 CANDNC_c_the_senate_votes: "The Senate Votes"
 CANDNC_c_the_senate_votes_desc: "Sixty days on Capitol Hill decide us. The Southern bloc counts the senators the north would send, the protectionists count our lumber, and our commissioners sit in the gallery unable to say a word. The fate of the Dominion now rests with a chamber in which Canada has no voice at all."
 CANDNC_c_the_governor_general_goes_home: "The Governor General Goes Home"
 CANDNC_c_the_governor_general_goes_home_desc: "Earl Grey's train leaves Ottawa without a guard of honour, Rideau Hall is shut, and the King's name comes off the writs. The Prime Minister signs the first commission no viceroy ever countersigned. The Crown has left the country quietly — and a thing that was a Dominion is now something else."
 CANDNC_c_admission_to_the_union: "Admission to the Union"
 CANDNC_c_admission_to_the_union_desc: "The address goes to Congress with the poll of every county attached. Oklahoma came in as a single state; we ask to enter as nine, dragging our debts and our treaties behind us. Canada petitions to become a corner of the American republic — the boldest surrender, or the boldest bargain, in our history."
 CANDNC_c_the_west_goes_south: "The West Goes South"
 CANDNC_c_the_west_goes_south_desc: "The country voted No and the prairie voted Yes. Conventions at Saskatoon and Calgary petition Washington over our heads, and we must choose: negotiate the loss of three provinces, or send the Mounted Police to hold them. The continental dream has cracked the Dominion along its oldest fault."
 CANDNC_c_nine_new_states: "Nine New States"
 CANDNC_c_nine_new_states_desc: "The Senate has consented and the terms are law. Nine stars go on the flag, our Militia becomes a department of the Army, and the Dominion of Canada ends a lifetime after Charlottetown. We have voted ourselves into the great republic — and closed, with our own hands, the book of a separate country."
 CANDNC_c_the_junior_partner_by_default: "The Junior Partner by Default"
 CANDNC_c_the_junior_partner_by_default_desc: "The Senate would not have us. The commissioners come home to a country stripped of its Crown, its treaty and its own tariff, and Washington offers the one thing that costs it nothing — a guarantee. We reached for union and grasped dependence: independent in name, American in every fact that matters."
 CANDNC_c_the_northern_associate: "The Northern Associate"
 CANDNC_c_the_northern_associate_desc: "The decade ends with an independent Canada inside the American customs line and under the American guarantee. The flag is our own; the market is not; and every despatch from Ottawa is read in Washington before it is answered. We are nobody's colony now — and not quite our own masters either."

#Ideas
 CAN_c_the_continent_is_the_market: "The Continent Is the Market"
 CAN_c_the_continent_is_the_market_desc: "Ottawa has stopped waiting for London to open a market and started asking Washington. The customs houses at Windsor and Emerson matter more than the cable to Poldhu, and the Ontario manufacturers know it."
 CAN_c_branch_plants: "Branch Plants"
 CAN_c_branch_plants_desc: "American firms climb the tariff wall instead of paying it. The works go up at Walkerville, Windsor and Hamilton, the wages are Canadian, the patents and the dividends are not."
 CAN_c_reciprocity_in_natural_products: "Reciprocity in Natural Products"
 CAN_c_reciprocity_in_natural_products_desc: "The farm, the forest, the mine and the fishery cross the line free; the factory still pays. The prairie gets the Minneapolis price and the eastern manufacturer gets nothing but the freight bill."
 CAN_c_the_dingley_wall: "The Dingley Wall"
 CAN_c_the_dingley_wall_desc: "Congress kept the rates of 1897 and Ottawa answered in kind. The home market is safe behind two tariffs, and the exporters are shut inside it with everyone else."
 CAN_c_hayss_debt: "Hays's Debt"
 CAN_c_hayss_debt_desc: "The Dominion guarantees the bonds of a railway across muskeg nobody has surveyed. The grade advances a mile a day and the Finance Department signs for every mile of it."
 CAN_c_hills_lines: "Hill's Lines"
 CAN_c_hills_lines_desc: "The branch lines come up from St Paul and the rates fall wherever they reach. The prairie ships cheaper and ships south, and Ottawa learns that a foreign railway sets the price of Canadian wheat."
 CAN_c_grain_by_duluth: "Grain by Duluth"
 CAN_c_grain_by_duluth_desc: "The crop turns south at Emerson for the head of Lake Superior. The growers are paid more and the Fort William elevators, the lake fleet and the Montreal export houses are paid nothing."
 CAN_c_the_portland_terminus: "The Portland Terminus"
 CAN_c_the_portland_terminus_desc: "The winter traffic goes out through Maine because the ice does not reach it. The through rate is the cheapest in the country and every Maritime member in the House says so at every session."
 CAN_c_the_international_unions: "The International Unions"
 CAN_c_the_international_unions_desc: "The locals hold American charters and strike when the international says strike. The trades are organised as they have never been, and the strike fund is voted in a hall the Dominion cannot reach."
 CAN_c_the_american_prairie: "The American Prairie"
 CAN_c_the_american_prairie_desc: "The settlers cross at Emerson and North Portal with implements, seed money and experience of the same soil. They fill the townships fast and they did not come north to be counted as British subjects."
 CAN_c_the_silver_camps: "The Silver Camps"
 CAN_c_the_silver_camps_desc: "Cobalt sends out ore that was worth a few hundred thousand ounces in 1904 and millions by 1909. Ontario takes the royalty, and the refining, the promoting and the profit are done elsewhere."
 CAN_c_the_grain_growers_company: "The Grain Growers' Company"
 CAN_c_the_grain_growers_company_desc: "The farmers sell their own crop through their own company and keep the commission. The Exchange, the banks and the line elevator men treat every ministry that helped them as an enemy."
 CAN_c_the_exclusion_line: "The Exclusion Line"
 CAN_c_the_exclusion_line_desc: "British Columbia gets the statutes it has demanded since 1900 and the Pacific trade gets the bill. The mills have their quiet coast and the shipping agents at Yokohama stop calling."
 CAN_c_the_eagles_wing: "The Eagle's Wing"
 CAN_c_the_eagles_wing_desc: "Washington has guaranteed the northern frontier and the House has read the despatch. The militia estimates are cut the same session, because nobody votes money for a danger the Americans have taken away."
 CAN_c_the_esquimalt_station: "The Esquimalt Station"
 CAN_c_the_esquimalt_station_desc: "American colliers coal at the dockyard the British garrison left, under a lease of ninety-nine years. The yard works again, and there is a foreign ensign flying over Vancouver Island."
 CAN_c_the_customs_union: "The Customs Union"
 CAN_c_the_customs_union_desc: "One tariff wall around both countries, the receipts divided by population, and no customs house between Windsor and Detroit. The market is continental and the Dominion no longer sets a single rate."
 CAN_c_the_continental_dominion: "The Continental Dominion"
 CAN_c_the_continental_dominion_desc: "The Zollverein was withdrawn and the trade stayed. Ottawa keeps the Crown, keeps its tariff schedule, and keeps a market it can no longer bargain over."
 CAN_c_the_junior_partner: "The Junior Partner"
 CAN_c_the_junior_partner_desc: "The country is free to say anything it likes and free to be ignored. Its goods move, its ministers are received at the State Department, and no despatch leaves Ottawa without a guess at Washington's temper."
 CAN_c_the_imperial_boycott: "The Imperial Boycott"
 CAN_c_the_imperial_boycott_desc: "The Empire preference is withdrawn, the Liverpool houses close their Canadian accounts, and the insurance rates on the St Lawrence double. The country is united in resentment and short of everything else."

