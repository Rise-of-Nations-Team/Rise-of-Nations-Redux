### Canada, Dawn of a New Century - militia and the Transvaal

 CANDNC_the_call_from_london: "The Call from London"
 CANDNC_the_call_from_london_desc: "October 1899. The Colonial Office asks the self-governing colonies for troops against the Boer republics. Laurier has no army to send and a Quebec caucus that will not vote him one, and the Cabinet must answer within days."
 CANDNC_the_order_in_council: "Send Them by Order in Council"
 CANDNC_the_order_in_council_desc: "The order in council of 14 October 1899 equips and ships the contingent, imperial pay beginning at the landing. Parliament is never asked. Bourassa gives up his seat over it and calls the thing a precedent."
 CANDNC_let_the_commons_vote: "Let the Commons Vote"
 CANDNC_let_the_commons_vote_desc: "Put the sending to a vote, as Tupper and the Ontario press demand. Every member from Quebec must then say in public where he stands, and the Liberal caucus splits in the open. Nothing sails until the House has spoken."
 CANDNC_the_royal_canadian_regiment: "The Royal Canadian Regiment"
 CANDNC_the_royal_canadian_regiment_desc: "The 2nd (Special Service) Battalion of the Royal Canadian Regiment sails under Lieutenant-Colonel William Dillon Otter, the first Canadian unit raised for service overseas under its own colours."
 CANDNC_the_strathconas_horse: "Strathcona's Horse"
 CANDNC_the_strathconas_horse_desc: "Lord Strathcona, High Commissioner in London, equips a mounted regiment at his own expense: some 540 to 600 men recruited in Manitoba, the North-West Territories and British Columbia, embarked at Halifax on 17 March 1900."
 CANDNC_paardeberg: "Paardeberg"
 CANDNC_paardeberg_desc: "18 to 27 February 1900. The Canadians dig in some sixty-five yards from the Boer lines after a night advance, and on the morning of the 27th Cronje surrenders. The dominion has its first battle honour won abroad."
 CANDNC_the_south_african_constabulary: "The South African Constabulary"
 CANDNC_the_south_african_constabulary_desc: "About 1,200 Canadians take service with the South African Constabulary, policing the veld once the columns have moved on. Mounted men learn escort, patrol and the supply of a column in the field."
 CANDNC_the_canadian_mounted_rifles: "The Canadian Mounted Rifles"
 CANDNC_the_canadian_mounted_rifles_desc: "Raised in the spring of 1902, the last contingents reach South Africa after the armistice. Mounted infantry, not cavalry: they ride to the fight and shoot on foot, and the militia takes the lesson home."
 CANDNC_vereeniging: "The Treaty of Vereeniging"
 CANDNC_vereeniging_desc: "31 May 1902 ends the war. Some 7,368 Canadians served and about 270 died, most of them of disease. The camps empty, the volunteers go home, and the dominion finds it has no way of keeping what it learned."
 CANDNC_the_veterans_of_the_veldt: "The Veterans of the Veldt"
 CANDNC_the_veterans_of_the_veldt_desc: "Officers back from South Africa take over the schools and the summer camps. They bring khaki, the spade and open order, and a taste for imperial service that Quebec reads as a warning."
 CANDNC_no_precedent_for_the_next_war: "No Precedent for the Next War"
 CANDNC_no_precedent_for_the_next_war_desc: "Bourassa's motion of 13 March 1900 asked that the sending never be held as a precedent. Laurier answered that every case would be decided on its own. Write that answer into the standing policy of the dominion."
 CANDNC_the_lessons_of_the_veldt: "The Lessons of the Veldt"
 CANDNC_the_lessons_of_the_veldt_desc: "Smokeless powder, magazine rifles and barbed wire have beaten close order. The militia rewrites its drill around marksmanship, entrenchment and mounted infantry, twelve years before it will need them."
 CANDNC_the_department_of_militia: "The Department of Militia"
 CANDNC_the_department_of_militia_desc: "Frederick William Borden has held Militia and Defence since 1896. The Militia Act of 1868 gives him a paper force of citizen soldiers, twelve days of camp a year, and a general officer sent out from Britain."
 CANDNC_a_militia_of_citizens: "A Militia of Citizens"
 CANDNC_a_militia_of_citizens_desc: "Numbers before quality. Keep the rural battalions, the drill shed in every county town and the twelve-day camp, and accept that the men are farmers who shoot well and manoeuvre badly."
 CANDNC_a_permanent_force: "A Permanent Force"
 CANDNC_a_permanent_force_desc: "Quality before numbers. Build regulars: schools of instruction, career officers, artillery and garrisons paid all year round. The Commons will call it a standing army, and in Canada that is an accusation."
 CANDNC_the_twelve_day_camp: "The Twelve-Day Camp"
 CANDNC_the_twelve_day_camp_desc: "Every summer the rural battalions come in for twelve days under canvas, drawn off the farms between seeding and harvest. It is the whole of their training, and it costs the country almost nothing."
 CANDNC_the_county_drill_sheds: "The County Drill Sheds"
 CANDNC_the_county_drill_sheds_desc: "A drill shed in every county town: armoury, rifle range and meeting hall in one building, put up by the Department of Public Works where the member for the riding would like it to stand."
 CANDNC_the_rifle_associations: "The Rifle Associations"
 CANDNC_the_rifle_associations_desc: "The Dominion of Canada Rifle Association and its county ranges turn the militia's weakness into its one strength. A farmer who has shot at Bisley is worth more on the veld than a man who marches well."
 CANDNC_the_school_cadet_corps: "The School Cadet Corps"
 CANDNC_the_school_cadet_corps_desc: "Drill and shooting taught in the schools. The Ontario boards take it up gladly. In Quebec the clergy and the nationalists see conscription being taught to twelve-year-olds, and say so from the pulpit."
 CANDNC_commissions_from_the_minister: "Commissions from the Minister"
 CANDNC_commissions_from_the_minister_desc: "The minister signs every commission and the member for the riding suggests the names. It binds the militia to the government of the day and fills the regiments with officers who have commanded nothing."
 CANDNC_double_the_permanent_force: "Double the Permanent Force"
 CANDNC_double_the_permanent_force_desc: "Raise the ceiling of the Permanent Force towards four thousand regulars, enough to hold the schools and take over the fortress garrisons the British mean to give up. Every man of them is paid all year."
 CANDNC_the_schools_of_instruction: "The Schools of Instruction"
 CANDNC_the_schools_of_instruction_desc: "The Royal Schools of Infantry, Cavalry and Artillery take militia officers for a term and send them back with a certificate. It is the only place in the country where a Canadian can learn the trade."
 CANDNC_the_royal_military_college: "The Royal Military College"
 CANDNC_the_royal_military_college_desc: "Kingston has trained gentlemen cadets since 1876, and Britain takes most of them. The graduate who wants a career accepts an imperial commission, because Canada has almost no billets to offer him."
 CANDNC_the_royal_canadian_artillery: "The Royal Canadian Artillery"
 CANDNC_the_royal_canadian_artillery_desc: "Field batteries at Kingston and Quebec, garrison companies for the coast guns. Artillery is the one arm a citizen militia cannot improvise, and the one that eats the estimates."
 CANDNC_the_garrisons_of_the_dominion: "The Garrisons of the Dominion"
 CANDNC_the_garrisons_of_the_dominion_desc: "Permanent barracks at Toronto, Kingston, Quebec, Fredericton and London. Regulars in garrison are steady, visible and expensive, and they are the troops the sheriff asks for when a strike turns ugly."
 CANDNC_the_dundonald_crisis: "The Dundonald Crisis"
 CANDNC_the_dundonald_crisis_desc: "14 June 1904. The Earl of Dundonald, commanding the militia since July 1902, attacks Sydney Fisher in public for striking names from an Eastern Townships cavalry list. The Cabinet dismisses him that day."
 CANDNC_the_militia_act_of_1904: "The Militia Act of 1904"
 CANDNC_the_militia_act_of_1904_desc: "4 Edward VII, chapter 23. It ends the rule that a British officer must command, repeals the clause handing wartime command to the officer commanding at Halifax, and authorises the supporting services."
 CANDNC_the_militia_council: "The Militia Council"
 CANDNC_the_militia_council_desc: "Command by board instead of by one general: the minister presides and the heads of branches sit with him. It copies the Army Council at Whitehall, and it puts a politician at the head of the army."
 CANDNC_a_canadian_may_command: "A Canadian May Command"
 CANDNC_a_canadian_may_command_desc: "The general officer commanding need no longer be lent by the British army. The dominion gains the right to appoint its own soldier, and loses the free professional that London used to send with him."
 CANDNC_the_supporting_services: "The Supporting Services"
 CANDNC_the_supporting_services_desc: "Engineers, signals, an army medical corps, ordnance and supply: the services the militia had always borrowed from the imperial garrison. Ottawa now raises them, pays them, and learns what they cost."
 CANDNC_the_camp_at_petawawa: "The Camp at Petawawa"
 CANDNC_the_camp_at_petawawa_desc: "Sand, pine and room to shoot. The land bought on the Ottawa River in 1905 gives the gunners the first ground in Canada long enough to fire a modern field gun out to its full range."
 CANDNC_in_aid_of_the_civil_power: "In Aid of the Civil Power"
 CANDNC_in_aid_of_the_civil_power_desc: "July 1909: the sheriff of Cape Breton asks for troops against the miners of Glace Bay and Springhill. The militia marches to guard the Dominion Coal Company's property, and the coalfields remember it."
 CANDNC_sir_william_otter: "Sir William Otter"
 CANDNC_sir_william_otter_desc: "In 1908 the officer who dug in at Paardeberg becomes Chief of the General Staff, the first Canadian-born soldier at the head of the army. The command is national; the doctrine and the schools stay British."
 CANDNC_a_general_staff_for_canada: "A General Staff for Canada"
 CANDNC_a_general_staff_for_canada_desc: "A staff that writes plans instead of forwarding despatches: mobilisation tables, a scheme of defence, and officers trained to think above the battalion. It is the last thing the Act of 1904 made possible."
 CANDNC_the_question_of_the_rifle: "The Question of the Rifle"
 CANDNC_the_question_of_the_rifle_desc: "The militia carries the Lee-Enfield, and every one of them comes from Britain. In a general war London arms its own first and the dominion waits. The alternative is to build rifles in a country that never has."
 CANDNC_the_ross_made_in_canada: "A Rifle Made in Canada"
 CANDNC_the_ross_made_in_canada_desc: "Sir Charles Ross offers his straight-pull design and a factory on Canadian soil. Ottawa would own its own source of arms, and would be married to one inventor's patent and to one man's temper."
 CANDNC_the_lee_enfield_from_london: "The Lee-Enfield from London"
 CANDNC_the_lee_enfield_from_london_desc: "Buy the service rifle from the imperial works. It is proven, its cartridge is the Empire's, and every round the dominion fires will be made by somebody else, in another country, at their convenience."
 CANDNC_the_contract_with_sir_charles_ross: "The Contract with Sir Charles Ross"
 CANDNC_the_contract_with_sir_charles_ross_desc: "The government contracts for the Ross rifle in 1902 and gives the company ground at Quebec. Britain will not adopt the design and says so plainly. Ottawa signs anyway, because Ottawa wants the works."
 CANDNC_the_rifle_works_at_quebec: "The Rifle Works at Quebec"
 CANDNC_the_rifle_works_at_quebec_desc: "The plant opens at Quebec in 1903, on land beside the Plains of Abraham. For the first time the dominion can make a service rifle, and it has exactly one supplier in the world who knows how."
 CANDNC_the_mark_i_is_issued: "The Mark I Is Issued"
 CANDNC_the_mark_i_is_issued_desc: "From 1905 the Ross Mark I goes out to the militia and to the mounted police. It is a superb target rifle: long, accurate, beautifully made, and built for the range rather than for mud."
 CANDNC_the_rifle_that_jams: "The Rifle That Jams"
 CANDNC_the_rifle_that_jams_desc: "The reports come back. Extraction fails, the bolt fouls, the sights shift under recoil. The mounted police hand theirs in and go back to the Lee-Enfield, and a board of officers sits on the matter."
 CANDNC_stand_by_the_ross: "Stand by the Ross"
 CANDNC_stand_by_the_ross_desc: "Modify it, test it again, and keep the contract. The rifle outshoots anything in the Empire on a range, the works employ Canadians, and no minister wants to explain a return to buying British."
 CANDNC_buy_from_the_imperial_works: "Buy from the Imperial Works"
 CANDNC_buy_from_the_imperial_works_desc: "Orders go to Britain and the rifles come back in crates. No plant to build, no patent to fight over, no inventor to manage, and no way to make a single cartridge if the sea lanes ever close."
 CANDNC_one_pattern_for_the_empire: "One Pattern for the Empire"
 CANDNC_one_pattern_for_the_empire_desc: "The same rifle, the same .303 cartridge and the same musketry tables from Aldershot to Esquimalt. A Canadian battalion can draw ammunition from any imperial magazine anywhere in the world."
 CANDNC_the_dominion_arsenal: "The Dominion Arsenal"
 CANDNC_the_dominion_arsenal_desc: "The arsenal at Quebec has been filling .303 cartridges since the nineties. Making ammunition is not making rifles, but it is the one link in the chain the dominion can hold on its own."
 CANDNC_the_musketry_course: "The Musketry Course"
 CANDNC_the_musketry_course_desc: "The imperial course of musketry, taught by the book: rapid fire from the shoulder, fifteen aimed rounds to the minute, judging distance, snap shooting. It is drudgery, and it is what stopped the Boers."
 CANDNC_no_works_of_our_own: "No Works of Our Own"
 CANDNC_no_works_of_our_own_desc: "The choice made, the country has no rifle plant and will not have one. Every emergency order goes to Birmingham and waits its turn behind the British army's, and the trade is learned somewhere else."
 CANDNC_the_schools_of_musketry: "The Schools of Musketry"
 CANDNC_the_schools_of_musketry_desc: "Permanent schools of musketry, county ranges and a paid instructor for every district. Whatever rifle the militiaman carries, he is taught to hit with it before he is taught to march with it."
 CANDNC_take_over_halifax: "Take Over Halifax"
 CANDNC_take_over_halifax_desc: "In 1905 London agrees to hand the imperial fortress of Halifax to Canada. Casemates, coast batteries and a garrison British since 1749 pass to a dominion that has never manned a heavy gun of its own."
 CANDNC_take_over_esquimalt: "Take Over Esquimalt"
 CANDNC_take_over_esquimalt_desc: "The Pacific fortress goes the same way. Esquimalt guards the only naval base on the coast, three thousand miles from Ottawa by rail, and the dominion now owns its guns, its stores and its bills."
 CANDNC_the_last_british_garrisons: "The Last British Garrisons Leave"
 CANDNC_the_last_british_garrisons_desc: "The regulars embark in 1906. For the first time in a century and a half no British soldier is quartered in the country, and no British officer is left to take command in a war. Independence arrives as a bill."
 CANDNC_the_garrison_artillery: "The Garrison Artillery"
 CANDNC_the_garrison_artillery_desc: "Canadian gunners take over the batteries at Halifax and Esquimalt. Breech-loading coast guns want drill, range-finding and constant practice, and a country that skimps on any of the three owns ornaments."
 CANDNC_the_bill_for_two_fortresses: "The Bill for Two Fortresses"
 CANDNC_the_bill_for_two_fortresses_desc: "Works, stores, ammunition, married quarters and repairs at both ends of the country, charged to Canadian estimates. The independence of 1905 is paid for every year afterwards out of the militia vote."
 CANDNC_the_arsenal_at_quebec: "The Arsenal at Quebec"
 CANDNC_the_arsenal_at_quebec_desc: "Enlarge the Dominion Arsenal: cartridges, fuzes, shell filling. A country that has taken over its own fortresses cannot leave the making of their ammunition to an ocean crossing in somebody else's holds."
 CANDNC_the_defence_of_the_dominion: "The Defence of the Dominion"
 CANDNC_the_defence_of_the_dominion_desc: "A militia under its own law, a soldier of its own country at its head, its own fortresses and its own ammunition. Small, cheap and unready, but for the first time it belongs to nobody else."

### National spirits

 CAN_the_precedent_of_1899: "The Precedent of 1899"
 CAN_the_precedent_of_1899_desc: "Troops went overseas on the signature of the Cabinet alone. The Empire can be served at a week's notice, and Quebec has learned that a war it never voted on can be fought in its name."
 CAN_the_caucus_divided: "The Caucus Divided"
 CAN_the_caucus_divided_desc: "The House was asked and the House answered, but the Liberal benches split down the language line doing it. Every future call for troops now goes through a chamber that knows how to say no."
 CAN_the_private_levy: "The Private Levy"
 CAN_the_private_levy_desc: "A regiment raised, armed and shipped on one man's cheque. It cost the treasury nothing and it established that a rich subject may put soldiers in the field without a vote of Parliament."
 CAN_paardeberg_day: "Paardeberg Day"
 CAN_paardeberg_day_desc: "The 27th of February is kept in the messes. The army has a victory of its own to remember, and a lesson it drew from it: that the answer to a fortified line is to go forward at night."
 CAN_veterans_of_the_veldt: "Veterans of the Veldt"
 CAN_veterans_of_the_veldt_desc: "Men who have been shot at run the camps and the schools. They teach faster than the manuals do, and a good many of them talk about the Empire in a way that costs the government votes."
 CAN_each_case_on_its_merits: "Each Case on Its Own Merits"
 CAN_each_case_on_its_merits_desc: "The standing answer to London: no automatic contingent, no obligation carried forward, every request weighed by itself. It keeps the country together and makes it a poor ally to plan around."
 CAN_militia_of_citizens: "A Militia of Citizens"
 CAN_militia_of_citizens_desc: "Long rolls of enrolled names and twelve days of camp behind them. The country can put men in the field cheaply and cannot manoeuvre them once they are there."
 CAN_the_permanent_force: "The Permanent Force"
 CAN_the_permanent_force_desc: "A small body of regulars kept at duty the year round. They know their work and they are paid for every day of it, and there are never enough of them to matter in a general war."
 CAN_the_school_cadet_corps: "The School Cadet Corps"
 CAN_the_school_cadet_corps_desc: "Boys drilling in schoolyards from Halifax to Victoria. It shortens recruit training by years and hands the nationalist press a picture it can use in every campaign."
 CAN_commissions_by_patronage: "Commissions by Patronage"
 CAN_commissions_by_patronage_desc: "The colonel of the county battalion is the man the member for the county wanted. The government is never short of friends in uniform, and the battalion is never commanded by a soldier."
 CAN_the_royal_military_college: "The Royal Military College"
 CAN_the_royal_military_college_desc: "Kingston turns out engineers, gunners and staff officers to an imperial standard. They cost more than the country wants to pay, and half of them take a British commission anyway."
 CAN_the_permanent_garrisons: "The Permanent Garrisons"
 CAN_the_permanent_garrisons_desc: "Regulars in barracks in half a dozen cities. They hold what they are standing on and they are slow to leave it, and the estimates carry them whether there is a war or not."
 CAN_the_militia_council: "The Militia Council"
 CAN_the_militia_council_desc: "The minister in the chair and the branch heads around the table. Business moves, responsibility is shared, and no soldier at that table can overrule the politician who appointed him."
 CAN_in_aid_of_the_civil_power: "In Aid of the Civil Power"
 CAN_in_aid_of_the_civil_power_desc: "Troops at the pit heads. Production resumes and the companies are satisfied, and a generation of miners has learned exactly whose side the army takes when it is called out."
 CAN_chief_of_the_general_staff: "Chief of the General Staff"
 CAN_chief_of_the_general_staff_desc: "One soldier answerable for training, plans and advice. The army has a professional head at last, and the head has opinions the Cabinet would rather not hear in an election year."
 CAN_the_general_staff: "The General Staff"
 CAN_the_general_staff_desc: "Mobilisation tables, a scheme of defence and officers who have been taught to write orders. It is the most useful and the least popular thing the militia vote has ever bought."
 CAN_the_ross_rifle: "The Ross Rifle"
 CAN_the_ross_rifle_desc: "A straight-pull rifle made at Quebec. The country owns its own source of small arms for the first time, and it is tied to one design that nobody else in the world has adopted."
 CAN_the_ross_under_report: "The Ross Under Report"
 CAN_the_ross_under_report_desc: "Boards, trials and complaints from the ranks. The rifle shoots beautifully and stops when it is dirty, and the men who carry it have begun to say so where the newspapers can hear."
 CAN_faith_in_the_ross: "Faith in the Ross"
 CAN_faith_in_the_ross_desc: "The government has staked itself on the rifle: more plant, more orders, more official confidence. Production has never been better and the reports from the ranges have stopped being read."
 CAN_the_lee_enfield_pattern: "The Lee-Enfield Pattern"
 CAN_the_lee_enfield_pattern_desc: "The Empire's rifle and the Empire's cartridge, tested by twenty years of colonial war. Every one of them is bought abroad, and the country makes nothing it could not lose with a shipping lane."
 CAN_bound_to_the_imperial_works: "Bound to the Imperial Works"
 CAN_bound_to_the_imperial_works_desc: "The whole armament of the militia comes across an ocean on credit and goodwill. It is the best equipment in the Empire until the day Britain needs it herself."
 CAN_the_schools_of_musketry: "The Schools of Musketry"
 CAN_the_schools_of_musketry_desc: "Instructors, ranges and a course every man must pass. The militia becomes an army of marksmen, at the price of the only days of training it ever gets."
 CAN_the_bill_for_two_fortresses: "Halifax and Esquimalt"
 CAN_the_bill_for_two_fortresses_desc: "Two imperial fortresses on Canadian charge. The dominion holds both coasts with its own gunners, and pays for works, stores and ammunition at both ends of a continent."
 CAN_the_defence_of_the_dominion: "The Defence of the Dominion"
 CAN_the_defence_of_the_dominion_desc: "An army meant for the defence of Canada and for nothing else. It stands well on its own ground, and it is not built to send anywhere, which is precisely what was intended."

 CAN_militia_schools: "Schools of Instruction"
