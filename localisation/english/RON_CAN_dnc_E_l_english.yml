#Focuses
 CANDNC_e_two_peoples_one_order_in_council: "Two Peoples, One Order in Council"
 CANDNC_e_two_peoples_one_order_in_council_desc: "On 13 March 1900 Bourassa asks the Commons to declare the order of 14 October 1899 no precedent. There is a fifth answer to him that nobody has said aloud: two peoples were engaged by one stroke of the pen, and one was never asked."
 CANDNC_e_a_country_of_two_nations: "A Country of Two Nations"
 CANDNC_e_a_country_of_two_nations_desc: "The nationalism Asselin and Lavergne will write down in 1903 is bilingual and pancanadian: two peoples, one Dominion, neither the servant of the other. Laurier says it from his own bench, and Toronto hears a Frenchman defining the Empire."
 CANDNC_e_one_language_for_one_dominion: "One Language for One Dominion"
 CANDNC_e_one_language_for_one_dominion_desc: "The territorial ordinance consolidated at Regina in 1901 already teaches the West in English. Say that what Regina does the Dominion will do, and the quarrel of 1899 becomes a quarrel over schoolrooms from the Red River to the Rockies."
 CANDNC_e_the_ligue_nationaliste_is_founded: "The Ligue Nationaliste Is Founded"
 CANDNC_e_the_ligue_nationaliste_is_founded_desc: "Montreal, 1 March 1903. Olivar Asselin and Armand Lavergne put a programme in three articles on paper with Bourassa behind them: autonomy in the Empire, autonomy of the provinces, an economic policy made in Canada."
 CANDNC_e_le_nationaliste_and_the_acjc: "Le Nationaliste and the ACJC"
 CANDNC_e_le_nationaliste_and_the_acjc_desc: "Asselin's weekly appears at Montreal on 6 March 1904 and names ministers, forest concessions and railway lawyers on its front page. The Jesuits found a youth association the same month that will drill the cadres of two generations."
 CANDNC_e_gouin_takes_quebec: "Gouin Takes Quebec"
 CANDNC_e_gouin_takes_quebec_desc: "Quebec, 23 March 1905. Gouin, Turgeon and Weir bring down Simon-Napoleon Parent over the forest concessions and Gouin takes his chair. The party has purged itself to answer the nationalists and has publicly proved them right."
 CANDNC_e_the_delegate_apostolic: "The Delegate Apostolic"
 CANDNC_e_the_delegate_apostolic_desc: "Mgr Donatus Sbarretti, apostolic delegate at Ottawa, intervenes on the school clauses while Mgr Adelard Langevin writes from Saint-Boniface. Rome cannot disallow a Canadian statute, and does not have to: it has the pulpits of sixty-five ridings."
 CANDNC_e_bourassa_beats_gouin_in_saint_jacques: "Bourassa Beats Gouin in Saint-Jacques"
 CANDNC_e_bourassa_beats_gouin_in_saint_jacques_desc: "Montreal, 8 June 1908. Bourassa turns the premier out of Saint-Jacques; Gouin, who prudently stood again at Portneuf, keeps that seat and his government. Lavergne comes in with him and the Assembly acquires a cross-examiner."
 CANDNC_e_the_naval_question_comes_to_quebec: "The Naval Question Comes to Quebec"
 CANDNC_e_the_naval_question_comes_to_quebec_desc: "Foster's resolution is before the House on 29 March 1909, and Frederick Monk, member for Jacques-Cartier, will have neither ships nor a cheque until the electors have been asked. Quebec is being invited to price the Empire."
 CANDNC_e_the_motion_of_13_march_carried: "The Motion of 13 March Carried"
 CANDNC_e_the_motion_of_13_march_carried_desc: "The House votes what Laurier refused to concede: the thousand men of the Sardinian are no precedent, and no contingent sails without the Commons. Bourassa has his doctrine in the journals; Toronto reads it as a surrender to Labelle."
 CANDNC_e_the_ligues_programme: "The Ligue's Programme"
 CANDNC_e_the_ligues_programme_desc: "The three articles of 1 March 1903 become government policy: autonomy in the Empire, autonomy of the provinces within the federation, an economic policy of Canada's own. Asselin prints the text under the arms of the Dominion."
 CANDNC_e_clause_sixteen_as_written: "Clause Sixteen as Written"
 CANDNC_e_clause_sixteen_as_written_desc: "The autonomy bills go to the House on 21 February 1905 with clause sixteen untouched: separate schools on the model of 1875, not the ordinance of 1901. Fitzpatrick drafted it, and Sifton is in the corridor with his resignation."
 CANDNC_e_french_from_the_red_river_west: "French From the Red River West"
 CANDNC_e_french_from_the_red_river_west_desc: "Mgr Langevin of Saint-Boniface gets what the episcopate asked for in 1901: French beyond the first years and separate schools funded to the fourth meridian. Nobody at Regina or Edmonton was consulted, and both intend to say so."
 CANDNC_e_an_opening_to_paris: "An Opening to Paris"
 CANDNC_e_an_opening_to_paris_desc: "Fielding and Brodeur signed at Paris on 19 September 1907 under British cover. Ottawa now sends its own man to the Quai d'Orsay to ask for what tariffs do not buy: teachers, instructing officers, and a consulate at Quebec."
 CANDNC_e_the_sixty_five_seats_locked: "The Sixty-Five Seats Locked"
 CANDNC_e_the_sixty_five_seats_locked_desc: "Section 51 makes Quebec's sixty-five members the divisor of the whole House. Ottawa declares the figure closed before the census of 1911, and the Toronto papers begin printing the six seats Ontario lost in 1904 above the fold."
 CANDNC_e_the_tercentenary_of_1608_a_french_fete: "The Tercentenary as a French Fete"
 CANDNC_e_the_tercentenary_of_1608_a_french_fete_desc: "From 20 to 31 July 1908 Champlain lands again below the Citadel. The pageants stop at 1759, the French delegation is given the first place, and the Prince of Wales watches the founding of a city that was never his."
 CANDNC_e_the_answer_voted_down: "The Answer Voted Down"
 CANDNC_e_the_answer_voted_down_desc: "The motion of 13 March 1900 is put and lost. The Commons will not say that the order in council of 14 October binds nothing, and the member for Labelle sits down in a Dominion that has just admitted its own precedent."
 CANDNC_e_the_regina_ordinance_for_all: "The Regina Ordinance for All"
 CANDNC_e_the_regina_ordinance_for_all_desc: "The school ordinance consolidated in the Territories in 1901 becomes the rule from the Red River to the Rockies: English the language of instruction, French tolerated in the first years, religious teaching after four o'clock."
 CANDNC_e_the_nationalist_press_sued: "The Nationalist Press Sued"
 CANDNC_e_the_nationalist_press_sued_desc: "The ministers Le Nationaliste names take Asselin into the Montreal courts one at a time, and the printer answers each writ with a fresh number. The costs are ruinous and the circulation rises with every hearing."
 CANDNC_e_the_sunday_law_enforced: "The Sunday Law Enforced"
 CANDNC_e_the_sunday_law_enforced_desc: "The Lord's Day Act, assented 13 July 1906, takes effect on 1 March 1907 and leaves prosecution to the provincial attorneys general. Ottawa presses Quebec to prosecute, and a Protestant sabbath is read into the parishes."
 CANDNC_e_the_tercentenary_as_an_imperial_fete: "The Tercentenary as an Imperial Fete"
 CANDNC_e_the_tercentenary_as_an_imperial_fete_desc: "July 1908: the Prince of Wales at the head of the water pageant, Earl Grey's commission of 17 March holding the Plains of Abraham, and Wolfe's victory played out in front of the city that lost it."
 CANDNC_e_the_sixty_five_seats_questioned: "The Sixty-Five Seats Questioned"
 CANDNC_e_the_sixty_five_seats_questioned_desc: "The redistribution after the census of 1901 took six seats from Ontario and none from Quebec. The Toronto boards of trade ask why one province is a constitutional divisor, and Ottawa puts the same question to the Colonial Office."
 CANDNC_e_the_representation_act_amended: "The Representation Act Amended"
 CANDNC_e_the_representation_act_amended_desc: "With Westminster's leave the sixty-five members of section 51 become a number like any other, and Quebec is counted on its population as Nova Scotia is. Bourassa calls it the breaking of the bargain of 1867, in those words."
 CANDNC_e_fallons_church: "Fallon's Church"
 CANDNC_e_fallons_church_desc: "Michael Francis Fallon is made bishop of London in 1909 and turns the Irish clergy of Ontario against the bilingual schools of the Ottawa valley. The most effective enemy the Franco-Ontarians have is a Catholic bishop."
 CANDNC_e_a_special_status_for_quebec: "A Special Status for Quebec"
 CANDNC_e_a_special_status_for_quebec_desc: "The second article of the Ligue's programme, applied to one province only: a written status for Quebec, drafted at the Department of Justice and to be laid before the House before the session of 1910 rises."
 CANDNC_e_the_nationalist_ministry: "The Nationalist Ministry"
 CANDNC_e_the_nationalist_ministry_desc: "Bourassa, Lavergne and Asselin's friends are offered portfolios instead of pamphlets. The Ligue of 1903 takes office at Ottawa rather than at Quebec, and a doctrine written for a weekly becomes the policy of a Dominion."
 CANDNC_e_coerce_quebec: "Coerce Quebec"
 CANDNC_e_coerce_quebec_desc: "The province holds sixty-five seats out of two hundred and twenty-one and is to be governed as what it is. Every bill Quebec has blocked since 1899 goes through without it, and Montreal is taught what a federal majority exists for."
 CANDNC_e_the_gilded_minority: "The Gilded Minority"
 CANDNC_e_the_gilded_minority_desc: "Quebec is not to be beaten, it is to be paid. Gouin gets harbour works, contracts and the Plains of Abraham; English stays the language of the Dominion. The nationalists are answered with a public works estimate."
 CANDNC_e_the_statute_of_quebec: "The Statute of Quebec"
 CANDNC_e_the_statute_of_quebec_desc: "An act of the Parliament of Canada names one province the home of a nation: French in the federal courts and the post office, its schools guaranteed, its share of the estimates written down. No Dominion has passed such a thing."
 CANDNC_e_a_french_regiment_of_the_line: "A French Regiment of the Line"
 CANDNC_e_a_french_regiment_of_the_line_desc: "The 65th Carabiniers Mont-Royal goes on the permanent establishment with French words of command and its own officers out of the Craig Street drill hall. Sir Frederick Borden's Militia Council prints its regulations twice."
 CANDNC_e_no_navy_without_quebecs_assent: "No Navy Without Quebec's Assent"
 CANDNC_e_no_navy_without_quebecs_assent_desc: "Foster's resolution of 29 March 1909 dies exactly where Monk wanted it to. Not a keel is laid until the Legislative Assembly at Quebec has voted, and the naval estimates are spent ashore in the yards at Levis instead."
 CANDNC_e_the_compact_of_two_nations: "The Compact of Two Nations"
 CANDNC_e_the_compact_of_two_nations_desc: "December 1909. Two peoples, one Dominion, a written status and not one ship. Bourassa has what he asked the House for on 13 March 1900, and the Orange lodges have a grievance they intend to carry into the next war."
 CANDNC_e_bourassa_at_the_interior: "Bourassa at the Interior"
 CANDNC_e_bourassa_at_the_interior_desc: "The department Sifton built to fill the West with Galicians passes to the member for Labelle. Agents are paid by the head for Bretons and Walloons at Saint-Boniface, and the 211,653 arrivals of 1906 will not be seen again."
 CANDNC_e_the_bilingual_civil_service: "The Bilingual Civil Service"
 CANDNC_e_the_bilingual_civil_service_desc: "Every department at Ottawa answers in the language it is written to, from the Post Office to the Railway Commission. The Civil Service Commission of 20 July 1908 examines the clerks, and half of them fail the first sitting."
 CANDNC_e_autonomy_in_the_empire: "Autonomy in the Empire"
 CANDNC_e_autonomy_in_the_empire_desc: "The first article of the programme of 1903, carried out to the letter: no man, no ship and no money voted at Ottawa because London asked for them, and no treaty signed under a British ambassador's cover again."
 CANDNC_e_a_nationalist_canada: "A Nationalist Canada"
 CANDNC_e_a_nationalist_canada_desc: "December 1909. The Ligue governs, Le Nationaliste reads like an official gazette, and the Dominion answers the Colonial Office over its own signature. Toronto calls it the Empire's first defeat at the hands of one of its children."
 CANDNC_e_the_naval_contribution_over_quebecs_head: "The Contribution Over Quebec's Head"
 CANDNC_e_the_naval_contribution_over_quebecs_head_desc: "Where the House voted unanimously for a service of its own on 29 March 1909, the government votes the Admiralty a cheque instead. Monk and the sixty-five members from Quebec are counted, recorded in the division list, and ignored."
 CANDNC_e_the_separatist_crisis: "The Separatist Crisis"
 CANDNC_e_the_separatist_crisis_desc: "The Legislative Assembly resolves that a province taxed for a fleet its members voted against is not governed by consent. Gouin cannot hold his benches, Lavergne asks for a mandate, and the despatch goes to three capitals."
 CANDNC_e_the_riot_act_in_montreal: "The Riot Act in Montreal"
 CANDNC_e_the_riot_act_in_montreal_desc: "The militia is called out to the Champ de Mars and an officer reads the proclamation aloud from the courthouse steps. The crowd has one hour to go home. After the hour they are rioters at law, and the militia has its orders."
 CANDNC_e_one_dominion_one_tongue: "One Dominion, One Tongue"
 CANDNC_e_one_dominion_one_tongue_desc: "December 1909. Whatever is left of Quebec is administered in English, the estimates carry a fleet, and no second nation appears anywhere in the statutes. Ontario has precisely what it asked Laurier for in March 1900."
 CANDNC_e_gouins_machine: "Gouin's Machine"
 CANDNC_e_gouins_machine_desc: "The premier who took Quebec in March 1905 by denouncing patronage is now paid in it. Concessions, harbour works and bridge contracts go through Ottawa, and Asselin's front page is answered every week with a payroll."
 CANDNC_e_the_plains_of_abraham_bought: "The Plains of Abraham Bought"
 CANDNC_e_the_plains_of_abraham_bought_desc: "The National Battlefields Commission created on 17 March 1908 buys the field where Montcalm and Wolfe both died and gives it to the city as a park. Quebec keeps the ground and loses the right to narrate it."
 CANDNC_e_the_navy_deferred_the_contracts_placed: "The Navy Deferred, the Contracts Placed"
 CANDNC_e_the_navy_deferred_the_contracts_placed_desc: "Not one ship is voted, and the yards at Levis and Sorel are paid to stand ready for the ships that are not voted. Brodeur's estimates buy silence in the Quebec press for roughly the price of a second-class cruiser."
 CANDNC_e_the_quiet_province: "The Quiet Province"
 CANDNC_e_the_quiet_province_desc: "December 1909. Quebec has no status, no fleet and no quarrel: contracts were cheaper than guarantees. Bourassa is looking for presses for a daily paper, and the ledger that bought the quiet will be read out in 1910."

#Focus tooltips
