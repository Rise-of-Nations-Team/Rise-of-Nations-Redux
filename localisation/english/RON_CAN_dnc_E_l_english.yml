l_english:

#Focuses
 CANDNC_the_conciliation_act: "The Conciliation Act"
 CANDNC_the_conciliation_act_desc: "July 1900. The Conciliation Act creates a Department of Labour under Postmaster General William Mulock, and a young Mackenzie King edits its Labour Gazette from September. The state will investigate disputes. It will not decide them."
 CANDNC_conciliation_before_all: "Conciliation Before All"
 CANDNC_conciliation_before_all_desc: "Ottawa enters industrial disputes as an investigator and never as an arbiter. The employer is handed a lawful delay, the union is handed a public hearing, and neither is handed a right."
 CANDNC_the_right_to_organize: "The Right to Organize"
 CANDNC_the_right_to_organize_desc: "What the Trades and Labour Congress asked for and never got: the right of association written into law. Wages rise, the railways and the collieries fight it, and the talk of imported agitators loses its use."
 CANDNC_the_lemieux_act: "The Lemieux Act"
 CANDNC_the_lemieux_act_desc: "22 March 1907. In mines, transport and public utilities neither strike nor lockout is lawful until a board of three has reported. The country keeps its coal moving and the miner loses the one thing he chooses, his moment."
 CANDNC_the_boards_of_investigation: "Boards of Investigation"
 CANDNC_the_boards_of_investigation_desc: "One member named by the employer, one by the men, a chairman by neither. Close to a hundred disputes go before these boards before 1911 and every finding is printed, which is the whole of what the men win."
 CANDNC_lethbridge_and_district_18: "Lethbridge and District 18"
 CANDNC_lethbridge_and_district_18_desc: "March to December 1906. The United Mine Workers hold out against the Alberta Railway and Irrigation Company for most of a year while the Prairies count the weeks to winter. Mackenzie King is sent west to end it."
 CANDNC_aid_to_the_civil_power: "Aid to the Civil Power"
 CANDNC_aid_to_the_civil_power_desc: "6 July 1909, Glace Bay and Springhill. District 26 strikes a company that will not recognise it, the sheriff requisitions troops and Ottawa sends them. A clause written for riot and invasion is now guarding a colliery."
 CANDNC_the_company_town: "The Company Town"
 CANDNC_the_company_town_desc: "The strike runs close to two years and the union loses it. Nothing is conceded, the coal moves again, and Cape Breton keeps its memory of the militia for a generation."
 CANDNC_the_congress_at_berlin: "The Congress at Berlin"
 CANDNC_the_congress_at_berlin_desc: "September 1902, at Berlin in Ontario. The Trades and Labour Congress expels some twenty bodies, the Knights of Labor and the Quebec national unions among them. The American internationals bring the strike funds and take the direction."
 CANDNC_the_railway_brotherhood: "The Railway Brotherhood"
 CANDNC_the_railway_brotherhood_desc: "February to October 1903. The United Brotherhood of Railway Employees strikes the Canadian Pacific at Vancouver and Frank Rogers is shot near the docks in March. A royal commission follows, with Mackenzie King as its secretary."
 CANDNC_recognition_in_the_charters: "Recognition in the Charters"
 CANDNC_recognition_in_the_charters_desc: "Write the right of association into every federal charter. The Canadian Pacific, Dominion Coal and the banks of Montreal are all met at once, and the first signed agreement buries the argument about foreign agitators."
 CANDNC_the_island_collieries: "The Island Collieries"
 CANDNC_the_island_collieries_desc: "Nanaimo and the coal of Vancouver Island, worked by men who send one of their own to Ottawa. The seams that heat the coast are cut under an agreement instead of under a threat."
 CANDNC_labour_in_parliament: "Labour in Parliament"
 CANDNC_labour_in_parliament_desc: "Ralph Smith sits for Nanaimo and presides over the Trades and Labour Congress at the same time. A labour platform reaches the Commons before a labour party does, and both old parties bid for it."
 CANDNC_the_deputy_minister: "The Deputy Minister"
 CANDNC_the_deputy_minister_desc: "Mackenzie King runs the Department of Labour. He investigates at Vancouver, arbitrates at Lethbridge, drafts the act that carries Lemieux's name, and learns that a settled quarrel is worth more than a decided one."
 CANDNC_the_wage_returns: "The Wage Returns"
 CANDNC_the_wage_returns_desc: "Month after month the Labour Gazette prints wages, hours and every dispute reported to it. For the first time a government can see its own working class, and so can everyone who can read."
 CANDNC_the_gate_on_the_pacific: "The Gate on the Pacific"
 CANDNC_the_gate_on_the_pacific_desc: "1900. The Chinese Immigration Act lifts the head tax from fifty dollars to a hundred. British Columbia wanted plain exclusion, London has interests in China, and so Ottawa taxes a man instead of refusing him."
 CANDNC_the_open_door: "The Open Door"
 CANDNC_the_open_door_desc: "Clifford Sifton wants ploughmen and does not much mind where they were born. Pamphlets, agents paid by the head, a secret contract with the North Atlantic Trading Company, and 41,681 admitted in 1900."
 CANDNC_shut_the_gate: "Shut the Gate"
 CANDNC_shut_the_gate_desc: "Frank Oliver trades volume for control: fewer eastern Europeans, more Britons, a wider power to deport. The West fills more slowly, and the province that shouts loudest is finally answered."
 CANDNC_the_palliser_triangle: "The Palliser Triangle"
 CANDNC_the_palliser_triangle_desc: "141,465 admitted in 1905. The Palliser triangle fills with the people the Ontario press least wanted, and they prove better on dry land than the settlers it asked for."
 CANDNC_hands_for_the_grade: "Hands for the Grade"
 CANDNC_hands_for_the_grade_desc: "173,694 admitted in 1909, a large share of them straight into the railway camps of the shield and the mountains. Cheap hands make the grade possible and make the camps what they are."
 CANDNC_the_record_year: "The Record Year"
 CANDNC_the_record_year_desc: "211,653 admitted in 1906, the largest figure of the Sifton years, and it arrives in the very year the paid recruiting contract is torn up. Nobody in Ottawa is certain which fact explains the other."
 CANDNC_a_west_of_strangers: "A West of Strangers"
 CANDNC_a_west_of_strangers_desc: "The special census of 24 June 1906 returns 808,863 people in the North-West provinces, of whom 444,366 were born in Canada. The East is frightened by that and the West answers with schooling in English."
 CANDNC_the_price_of_the_open_door: "The Price of the Open Door"
 CANDNC_the_price_of_the_open_door_desc: "Wheat, rails and cities inside ten years, bought with a nativist reaction that will not be settled in ten. The men who filled the West will be counted as aliens the first morning there is a war."
 CANDNC_five_hundred_dollars: "Five Hundred Dollars"
 CANDNC_five_hundred_dollars_desc: "1903. The head tax rises from a hundred dollars to five hundred, collected at the customs house from 1 January 1904. That is about two years of a labourer's wages, and no man already here can send for a wife or a child."
 CANDNC_the_prohibited_classes: "The Prohibited Classes"
 CANDNC_the_prohibited_classes_desc: "The classes barred at the door are widened, medical inspection is tightened and removal becomes an administrative act. The minister keeps a discretion Parliament can no longer trace."
 CANDNC_the_continuous_journey: "The Continuous Journey"
 CANDNC_the_continuous_journey_desc: "8 January 1908. No one may land who has not travelled here without a break from his country of birth, on a ticket bought there. No such sailing exists from India. Not one word of the order names a race."
 CANDNC_two_hundred_dollars_in_hand: "Two Hundred Dollars in Hand"
 CANDNC_two_hundred_dollars_in_hand_desc: "3 June 1908. A second order in council requires every immigrant from the named Asian countries to hold two hundred dollars of his own on landing. South Asian arrivals fall from more than 2,600 to a handful."
 CANDNC_the_closed_door: "The Closed Door"
 CANDNC_the_closed_door_desc: "British Columbia has what it demanded and Parliament has lost a population policy to the executive. The camps pay more for hands, the treasury has taken its revenue from the poorest arrivals, and the bill comes later."
 CANDNC_answer_for_vancouver: "Answer for Vancouver"
 CANDNC_answer_for_vancouver_desc: "7 September 1907. A crowd called out by the Asiatic Exclusion League marches on the city hall, breaks up the Chinese quarter, then turns into Powell Street, where the Japanese residents have been warned and drive it back."
 CANDNC_the_compensation_commissions: "The Compensation Commissions"
 CANDNC_the_compensation_commissions_desc: "Mackenzie King presides over two royal commissions, one for the Chinese losses and one for the Japanese: close to 27,000 dollars on the first, more than 9,000 on the second. Weapons bought in self defence are not repaid."
 CANDNC_the_lemieux_mission: "The Lemieux Mission"
 CANDNC_the_lemieux_mission_desc: "Tokyo, late 1907. Rodolphe Lemieux and Foreign Minister Hayashi agree without a treaty: Japan will hold its own emigrants to four hundred labourers and domestics a year. 495 arrive the next year, and Tokyo keeps the tap."
 CANDNC_the_opium_act: "The Opium Act"
 CANDNC_the_opium_act_desc: "20 July 1908. King found opium factories working in Vancouver while he was pricing riot damage, and the first Canadian drug prohibition follows. It names a trade, polices a quarter, and creates the market it forbids."
 CANDNC_the_cities_of_the_dominion: "The Cities of the Dominion"
 CANDNC_the_cities_of_the_dominion_desc: "Montreal and Toronto outgrow their water mains and their by-laws. The country still calls itself agricultural while its decisive quarrels move to the tenement, the street railway and the factory gate."
 CANDNC_the_sanitary_city: "The Sanitary City"
 CANDNC_the_sanitary_city_desc: "Treat the city as a question of water, milk, drains and brick. It is slow, it is expensive, it wins no election, and it saves the children that sermons do not."
 CANDNC_the_moral_city: "The Moral City"
 CANDNC_the_moral_city_desc: "Treat the city as a question of drink, the Sabbath and vice. The churches supply the organizers and the votes, the reform arrives quickly, and the treasury pays for it in licence money."
 CANDNC_the_great_fires: "The Great Fires"
 CANDNC_the_great_fires_desc: "26 April 1900: two thirds of Hull and part of LeBreton in Ottawa burn, seven dead and some fifteen thousand without a roof. 19 April 1904: the Toronto warehouse district goes in a night, without a single death."
 CANDNC_stone_and_brick: "Stone and Brick"
 CANDNC_stone_and_brick_desc: "Rebuild under harder by-laws. Stone and brick end the fire that eats a city in one night, and they price the small owner out of the very ward he was burned out of."
 CANDNC_the_milk_and_the_water: "The Milk and the Water"
 CANDNC_the_milk_and_the_water_desc: "Montreal buries its infants by the cartload every summer. Unpasteurised milk, unfiltered water and a tenement August do most of it, and every remedy is a municipal expense."
 CANDNC_the_tuberculosis_leagues: "The Tuberculosis Leagues"
 CANDNC_the_tuberculosis_leagues_desc: "Sanatoria raised by subscription, dispensaries in the parishes and open-air wards against tuberculosis. Charity does the work because no government of the period has yet agreed to own the problem."
 CANDNC_the_temperance_leagues: "The Temperance Leagues"
 CANDNC_the_temperance_leagues_desc: "The Dominion Alliance and the church societies press every legislature in the country. The licensed trade funds the other side, and no member can afford to be counted plainly on either."
 CANDNC_local_option: "Local Option"
 CANDNC_local_option_desc: "Prohibition is a provincial matter, and inside the province it is a municipal one. District by district the voters dry themselves out, the trade moves one township over, and the map turns into a chequerboard."
 CANDNC_the_lords_day_alliance: "The Lord's Day Alliance"
 CANDNC_the_lords_day_alliance_desc: "The Alliance carries its Sunday statute in 1906 and watches the enforcement from 1 March 1907. The working man gains a day nobody can take from him; Quebec reads a confessional law."
 CANDNC_the_provincial_prosecutor: "The Provincial Prosecutor"
 CANDNC_the_provincial_prosecutor_desc: "The statute is federal and the prosecutions belong to the provincial attorneys general. That one clause is how Quebec keeps its Sunday and Ottawa keeps its law, and neither has to say so out loud."
 CANDNC_the_chief_medical_officer: "The Chief Medical Officer"
 CANDNC_the_chief_medical_officer_desc: "1904. Peter Henderson Bryce becomes chief medical officer of the Interior and of Indian Affairs, one doctor for every reserve and every residential school. The state has just built itself an instrument of measurement."
 CANDNC_publish_the_bryce_report: "Publish the Bryce Report"
 CANDNC_publish_the_bryce_report_desc: "1907. Bryce examines fifteen residential schools in Manitoba and the Territories and finds a pupil death rate of twenty-four per cent, almost all of it tuberculosis. Printing that figure means paying for it."
 CANDNC_leave_it_in_the_file: "Leave It in the File"
 CANDNC_leave_it_in_the_file_desc: "The department does not publish. The churches that hold the schools on contract are not disturbed, the estimates are not reopened, and the evidence stays exactly where it was written down."
 CANDNC_ventilation_and_isolation: "Ventilation and Isolation"
 CANDNC_ventilation_and_isolation_desc: "What Bryce asked for: air in the dormitories, the tubercular kept apart from the healthy, a medical examination before a child is admitted. Every line of it is a vote of money and a quarrel with a church."
 CANDNC_the_press_finds_out: "The Press Finds Out"
 CANDNC_the_press_finds_out_desc: "November 1907. The newspapers print the substance of a report the government has kept back. Nothing is repaired and nothing is denied, and the file stays in the archive with the figure still in it."
 CANDNC_the_land_around_the_towns: "The Land Around the Towns"
 CANDNC_the_land_around_the_towns_desc: "1906. The Indian Act is amended so that a larger share of the price of surrendered reserve land goes to the band members, just as the western towns reach their boundaries. Cash buys consent; the ground never returns."
 CANDNC_sifton_takes_the_chair: "Sifton Takes the Chair"
 CANDNC_sifton_takes_the_chair_desc: "Clifford Sifton leaves the Interior for the chair of the new commission: ministers and university men on resources, public health and town planning. It may inquire and publish, never decide."

#Ideas
 CAN_the_labour_gazette: "The Labour Gazette"
 CAN_the_labour_gazette_desc: "A department that counts strikes, wages and hours, and settles nothing. Ottawa learns more about its workmen than any government in the Empire, and pays clerks to learn it."
 CAN_conciliation_doctrine: "Conciliation Doctrine"
 CAN_conciliation_doctrine_desc: "The state investigates, the work goes on, and the men who dig and drive learn that Ottawa arrives to delay them and never to decide for them."
 CAN_recognized_unions: "Recognized Unions"
 CAN_recognized_unions_desc: "An agreement signed is an agreement kept, and the shops stay quiet. Wages, hours and the grievance clause are all charged to the employer, who passes what he can to the buyer."
 CAN_the_lemieux_act: "The Industrial Disputes Investigation Act"
 CAN_the_lemieux_act_desc: "No strike in a mine, a railway or a public utility until a board has reported. Production is never interrupted; the employer gets the weeks he needs to replace the men who walked."
 CAN_militia_in_the_coalfields: "Militia in the Coalfields"
 CAN_militia_in_the_coalfields_desc: "The permanent force learns what it is like to be hated by the town it is billeted in. The coal districts will remember the uniform longer than they remember the company."
 CAN_the_company_town: "The Company Town"
 CAN_the_company_town_desc: "Housing, the store and the company doctor all belong to the colliery, and the men who dig are reminded of it every payday. Output is steady and nobody in the valley is placed to argue with it."
 CAN_the_international_unions: "The International Unions"
 CAN_the_international_unions_desc: "Discipline and strike funds arrive from across the line, and so do the officers who spend them. The Quebec clergy is handed the argument it wanted: a union that is foreign and neutral in religion."
 CAN_recognition_in_the_charters: "Recognition in the Charters"
 CAN_recognition_in_the_charters_desc: "Every company holding a federal charter must meet the men it employs. Industrial peace is bought at the price the railways and the collieries said it would cost, and they were right about the price."
 CAN_the_wage_returns: "The Wage Returns"
 CAN_the_wage_returns_desc: "A monthly national picture of pay, hours and disputes. It makes bargaining calmer and it also tells every union in the country exactly what the trade next door is getting."
 CAN_the_head_tax: "The Head Tax"
 CAN_the_head_tax_desc: "A revenue collected from the poorest people who land in Canada, and a policy of exclusion that dares not call itself one. British Columbia is not satisfied, and London is spared a colonial statute it would have had to disallow."
 CAN_the_open_door: "The Open Door"
 CAN_the_open_door_desc: "The gate on the Pacific stays open and the labour lands where the work waits. The mills, the canneries and the grade get their hands, and Vancouver sends its resolutions east by every mail."
 CAN_selection_over_volume: "Selection over Volume"
 CAN_selection_over_volume_desc: "The minister decides who is desirable, and no court reviews him. The English-speaking West is reassured and the same West waits longer for the neighbours who would have broken its land."
 CAN_navvies_of_the_grade: "Navvies of the Grade"
 CAN_navvies_of_the_grade_desc: "Two transcontinentals are built by men hired for a season, in camps that nobody inspects. The steel goes down fast and cheap, and the bill for those camps is presented after the war."
 CAN_a_west_of_strangers: "A West of Strangers"
 CAN_a_west_of_strangers_desc: "Barely more than half the people between the lakes and the mountains were born in this country. That is the strength of the West and it is also the fear the East votes on."
 CAN_the_five_hundred_dollar_tax: "The Five Hundred Dollar Tax"
 CAN_the_five_hundred_dollar_tax_desc: "Exclusion by price. The men already here are kept single and kept cheap, the employer keeps a labour force that cannot go home or bring a family, and the treasury takes its cut of both."
 CAN_government_by_order_in_council: "Government by Order in Council"
 CAN_government_by_order_in_council_desc: "Population policy has left the floor of the House and moved into the cabinet room. It is fast, it is quiet, it never has to be defended, and one day it will be quoted back at the country."
 CAN_the_closed_door: "The Closed Door"
 CAN_the_closed_door_desc: "The coast is quiet and the Pacific ports are orderly. The farms and the camps bid against each other for the hands that no longer arrive, and the country grows slower than the debt it took on."
 CAN_the_first_prohibition: "The First Prohibition"
 CAN_the_first_prohibition_desc: "The first Canadian statute to forbid a drug, aimed at a trade practised in one quarter of one city. It creates a clandestine market and a standing reason to send police into that quarter."
 CAN_the_growing_cities: "The Growing Cities"
 CAN_the_growing_cities_desc: "Factories, street railways and rents rising faster than wages. The city makes the country rich and hands it a sanitary problem that no municipal council of the period can pay for."
 CAN_stone_and_brick: "Stone and Brick"
 CAN_stone_and_brick_desc: "Fireproof by-laws, wider streets and a building inspector with teeth. The rebuilt ward is safer and dearer, and the family that was burned out of it moves further from its work."
 CAN_pure_milk_and_filtered_water: "Pure Milk and Filtered Water"
 CAN_pure_milk_and_filtered_water_desc: "Inspected dairies, filtration plants and infant clinics. It is the cheapest life-saving a government of this period can buy, and it is still a rate increase that somebody has to vote for."
 CAN_the_dominion_alliance: "The Dominion Alliance"
 CAN_the_dominion_alliance_desc: "Pulpits, petitions and a reliable vote in every county. The alliance can carry a temperance measure anywhere in Protestant Canada and can be relied on to punish the party that hesitates."
 CAN_the_lords_day_act: "The Lord's Day Act"
 CAN_the_lords_day_act_desc: "One day of rest guaranteed by the criminal law to every working man in the Dominion, and a Sabbath of one church written into the statute book of a country that holds two."
 CAN_the_bryce_report_published: "The Bryce Report Published"
 CAN_the_bryce_report_published_desc: "The figure is in the newspapers and the estimates must answer it. The churches that run the schools on contract fight every line of the reform, and the department pays for what it admitted."
 CAN_the_report_in_the_file: "The Report in the File"
 CAN_the_report_in_the_file_desc: "Nothing is spent and nothing is conceded. The doctor who wrote it keeps his copy, the schools go on as they were, and the arithmetic waits in an archive for somebody to read it aloud."
 CAN_the_land_around_the_towns: "The Land Around the Towns"
 CAN_the_land_around_the_towns_desc: "Surrendered reserve land sold into a rising market beside every growing western town. The lots are built on within a season and the band that lived on them is paid once."
 CAN_the_commission_of_conservation: "The Commission of Conservation"
 CAN_the_commission_of_conservation_desc: "Foresters, engineers and public health men with a printing budget and no authority whatever. It produces the best surveys in the country and cannot compel a single province to act on one."
