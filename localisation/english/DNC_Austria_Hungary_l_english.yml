 AUH_air_the_tandem_wing_reads_across_tt:0 "The tandem wing reads across to the aeroplane the establishment has ordered."
 AUH_air_silberer_tt:0 "The balloonist, publisher and founder of the club is available as an air chief."
 AUH_air_the_club_takes_all_tongues_tt:0 "The club takes members in every tongue of the Monarchy: [?AUS_support|%0] [?HUN_support|%0]"
 AUH_air_a_society_the_ministry_can_live_with_tt:0 "A chartered society is a thing the ministries know how to live with."
 AUH_air_lower_austria_gets_the_hall_tt:0 "The hall, the field and the works are all in Lower Austria: [?AUS_support|%0]"
 AUH_air_a_hall_for_a_rigid_ship_tt:0 "The hall is built long enough for a rigid ship from the first stone."
