 AUH_h_tb_the_bursaries:0 "The Bursaries of the Counties"
 AUH_h_academy_bursaries_tt:0 "Divisions of the Kingdom train a tenth faster; the estates lose the nomination."
 AUH_h_nat_SER_down_tt:0 "Loyalty of the Serbs falls."
 AUH_h_tb_the_designers_programme:0 "The Designer's Programme"
 AUH_h_advisor_frommer_tt:0 "The Kingdom's own small-arms designer is taken into the arms programme."
 AUH_h_company_fegyver_designer_variant_tt:0 "The works of the capital is upgraded to its designer establishment."
 AUH_h_company_danubius_tt:0 "The yard of the island is available as a naval concern for the river flotilla."
 AUH_h_tb_the_river_flotilla:0 "The Monitors of the River"
 AUH_h_naval_credit_harder_tt:0 "The Delegations will ask a price for the next naval credit."
 AUH_h_njegovan_tt:0 "The transport and flotilla officer of the fleet is taken into the high command."
 AUH_h_njegovan_already_tt:0 "The flotilla officer already serves; the river command is added to his charge."
 AUH_h_tb_the_kingdoms_trains:0 "The Trains of the Kingdom"
 AUH_h_schemua_tt:0 "The logistics officer of the staff is taken into the high command."
 AUH_h_schemua_already_tt:0 "The logistics officer already serves; the Kingdom's trains are drilled to his standard."
 AUH_h_tb_the_pack_batteries:0 "The Pack Batteries"
 AUH_h_tb_the_remounts:0 "The Remounts of the Plain"
 AUH_h_remounts_tt:0 "The Kingdom fixes the price at which the common army buys its horses."
 AUH_h_advisor_daranyi_tt:0 "The minister of the relief fund and the labour law is available as an economic advisor."
 AUH_h_emigration_slowed_tt:0 "The emigrant traffic is halved where the land credit reaches."
 AUH_h_tb_the_map_of_the_kingdom:0 "The Map of the Kingdom"
 AUH_h_nat_UKR_down_tt:0 "Loyalty of the Ruthenes falls."
 AUH_h_nat_ROM_up_tt:0 "Loyalty of the Romanians rises."
 AUH_h_nat_SLO_up_tt:0 "Loyalty of the Slovaks rises."
 AUH_h_nat_SER_up_tt:0 "Loyalty of the Serbs rises."
 AUH_h_many_tongues_tt:0 "The regimental language rule of the common army applies inside the Kingdom."
 AUH_h_school_stack_tt:0 "The civil school act and the army's schools now teach the same examination."
 AUH_h_no_condition_tt:0 "The subsidy is voted without a condition, and the schools that feed the regiments keep it."
 AUH_h_tb_the_gazetteer:0 "One Gazetteer, Two Staffs"
 AUH_h_inspectorate_tt:0 "Every levy, roll and school that feeds a regiment is inspected and reported."
 AUH_h_school_fund_tt:0 "The settlement decision The School Fund of the Uplands is unlocked."
 AUH_h_nat_UKR_up_tt:0 "Loyalty of the Ruthenes rises."
 AUH_h_curia_tt:0 "The northern counties elect in two registers, and neither can be silenced."
 AUH_h_collect_the_tax_tt:0 "The repeatable decision Collect the Unvoted Tax is unlocked."
 AUH_h_tb_the_home_guard_of_the_coast:0 "The Home Guard of the Triune Kingdom"
 AUH_h_nat_CRO_up_tt:0 "Loyalty of the Croats rises."
 AUH_h_company_mav_military_tt:0 "The state railways are available as an industrial concern in their military transport establishment."
 AUH_h_railway_stack_tt:0 "The civil pragmatic and the military transport service now speak with one voice."
 AUH_h_company_mav_commercial_tt:0 "The state railways are available as an industrial concern in their commercial establishment."
 AUH_h_nat_BOS_up_tt:0 "Loyalty of the Bosnians rises."
 AUH_h_metropolitanate_tt:0 "The metropolitanate keeps its congress, its funds and its schools by royal confirmation."
 AUH_h_transylvanian_talks_tt:0 "The settlement decision Transylvanian Talks is unlocked."
 AUH_h_tb_the_regiments_of_the_third_land:0 "The Regiments of the Occupied Land"
 AUH_h_no_transfer_tt:0 "The provinces are not transferred to either half by this act, and will not be."
 AUH_h_danubius_tt:0 "The yard of the Kingdom's harbour is available as a naval manufacturer."
 AUH_h_danubius_variant_tt:0 "The yard already serves; its Hungarian establishment is added as a variant."
 AUH_h_quota_trade_tt:0 "The share is raised and the trade is named in the protocol."
 AUH_h_minister_swap_tt:0 "A war minister acceptable to both Delegations takes the office."
 AUH_h_minuted_dissent_tt:0 "The Kingdom's dissent is minuted before any despatch leaves the house."
 AUH_h_fixed_contribution_tt:0 "The decennial renewal is replaced by a fixed contribution written into the treaty."
 AUH_h_advisor_popovics_common_tt:0 "The Kingdom's financier takes the governor's chair of the common bank and enters our service."
 AUH_h_discount_window_tt:0 "A discount window of the common bank opens in the Kingdom's own capital."
 AUH_h_one_whip_tt:0 "One party, one whip, one list; the settlements of the next decade have a majority."
 AUH_h_tb_the_staff_section:0 "The Kingdom's Staff Section"
 AUH_h_tb_the_second_convention:0 "The Convention of the Two Staffs"
 AUH_h_arz_tt:0 "The cautious staff officer of the Transylvanian frontier takes the Kingdom's staff section."
 AUH_h_tb_the_joint_manoeuvres:0 "The Manoeuvres of the Two Armies"
 AUH_h_seams_counted_tt:0 "The seams between the two establishments will be counted in front of the attaches."
 AUH_h_company_ganz_traction_tt:0 "The traction works of the capital is added as a variant of the electrical concern."
 AUH_h_published_share_tt:0 "The placement of the common army's contracts is published every year."
 AUH_h_rescript_halves_tt:0 "The malus of the heir's chancellery is halved while the rescript stands."
 AUH_h_cosmetic_dual_tt:0 "The Monarchy takes the style of the Two Armies of One King, and the Kingdom's corps carry its names."
 AUH_h_genius_withheld_tt:0 "An army that came apart twice in public does not get the man who would have equipped it."
 AUH_h_genius_granted_tt:0 "The Kingdom's designer takes the whole small-arms programme of both establishments."
 AUH_h_quota_abolished_tt:0 "The decennial quota is abolished; there is nothing left to renegotiate."
 AUH_h_advisor_popovics_kingdom_tt:0 "The Kingdom's financier takes the governor's chair of the Kingdom's own bank and enters our service."
 AUH_h_reported_not_voted_tt:0 "The Delegations are informed of the Kingdom's establishment and vote nothing about it."
 AUH_h_company_adria_tt:0 "The Kingdom's shipping line is available as a naval concern."
 AUH_h_tb_the_current_of_the_plain:0 "The Current of the Plain"
 AUH_h_company_ganz_electric_tt:0 "The electrical works of the capital is added as a variant of the electrical concern."
 AUH_h_paid_at_home_tt:0 "The establishment is carried on the Kingdom's budget and on nobody else's."
 AUH_h_cosmetic_union_tt:0 "The two kingdoms take their own styles, their own colours and their own army lists."
 AUH_h_ev300_a_tt:0 "A common minister has fallen to a national parliament, and everyone has noticed."
 AUH_h_ev300_b_tt:0 "The bills sit on the table while the minister and the Chamber argue."
 auh_dnc.300.t:0 "The Common War Minister Resigns"
 auh_dnc.300.d:0 "The minister for war has read the language clause in the military bills and has asked to be relieved. He will not put his name to a statute that concedes the tongue of a regiment to a national parliament, and he says as much in writing to the Crown. A national parliament has never before brought down a common minister. If we accept the resignation the precedent is made in one afternoon; if we refuse it, he will fight the Chamber from the bench and the bills will sit there until he loses."
 auh_dnc.300.a:0 "Accept his resignation and let the precedent stand."
 auh_dnc.300.b:0 "Refuse it. He will fight the Chamber from the bench."
 AUH_h_nat_CZE_up_tt:0 "Loyalty of the Czechs rises."
 AUH_h_ev_concede_tt:0 "Another establishment receives its own language of service, and coordination falls again."
 AUH_h_ev_refuse_tt:0 "The obstruction resumes in the other chamber and the next common law costs a quarter more."
 auh_dnc.301.t:0 "The Regiments Ask the Same"
 auh_dnc.301.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Bohemian regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.301.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.301.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 auh_dnc.302.t:0 "The Regiments Ask the Same"
 auh_dnc.302.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Croatian regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.302.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.302.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 AUH_h_nat_POL_up_tt:0 "Loyalty of the Poles rises."
 AUH_h_nat_POL_down_tt:0 "Loyalty of the Poles falls."
 auh_dnc.303.t:0 "The Regiments Ask the Same"
 auh_dnc.303.d:0 "What was conceded on the Danube has been read in every mess of the Monarchy within a week, and the Galician regiments have asked for it in their own language. Their deputies point out, accurately, that nothing in the settlement makes one people's tongue worth more than another's. There is no free answer here. Conceding again makes the establishment a federation of languages; refusing tells nine peoples that the Kingdom was paid because the Kingdom obstructed."
 auh_dnc.303.a:0 "Concede this one too. The principle was never going to hold."
 auh_dnc.303.b:0 "Refuse. The bargain was with the Kingdom and with nobody else."
 AUH_h_ev304_a_tt:0 "The cabinet is formed on the coalition's own programme."
 AUH_h_ev304_b_tt:0 "The word of command is postponed for a year and the counties hear about it."
 auh_dnc.304.t:0 "The Audience"
 auh_dnc.304.d:0 "The leaders of the victorious coalition are received. They have their military programme in their hands and they will not enter a cabinet without it. The Crown may name them on their terms, which is what this whole method was built to make possible, or it may demand that the word of command be dropped first and see whether they blink. They have not blinked in four years of obstruction."
 auh_dnc.304.a:0 "Name them with their programme."
 auh_dnc.304.b:0 "Demand the word of command be dropped first."
 AUH_h_ev305_withdraw_tt:0 "The order is withdrawn before it is read out, and the corridor is cleared by the ushers."
 auh_dnc.305.t:0 "The Honved Is Ordered to the Chamber"
 auh_dnc.305.d:0 "The Chamber will not disperse and the government has run out of parliamentary instruments. The royal commissioner, who is the Kingdom's own minister for the Honved, is instructed to clear the house with the Kingdom's own guard. Every officer in that corridor swore an oath whose two clauses we ourselves wrote down and put in that order. We are about to find out which clause they read first."
 auh_dnc.305.a:0 "Give the order."
 auh_dnc.305.b:0 "Withdraw the order. The guard is not an argument."
 AUH_h_ev305_obey_tt:0 "The officers obey. The sitting ends, and the house is cleared by force."
 AUH_h_ev305_refuse_tt:0 "The officers hesitate. The order is not executed, and the staff college of an army that would not obey will get no chair."
 AUH_h_ev306_a_tt:0 "The party of the settlement secedes; nothing now stands between this road and its end."
 AUH_h_ev306_b_tt:0 "The majority holds. The declaration of a personal union stays out of reach until the question returns."
 auh_dnc.306.t:0 "The Party of the Settlement Walks Out"
 auh_dnc.306.d:0 "The men who signed the settlement cannot sit in a cabinet founded on a separate bank of issue, and they have said so and gone. They take a third of the majority with them and the whole of the Monarchy's confidence in this government. We may let them go and govern with what is left, which is a majority for one programme and one only. Or we may buy them back with a seat at the table, and buy back with them everything they will refuse to sign."
 auh_dnc.306.a:0 "Let them go."
 auh_dnc.306.b:0 "Buy them back with a seat in the cabinet."
 AUH_h_ev307_a_tt:0 "Nothing is decided for eight months and everything is signed."
 AUH_h_ev307_b_tt:0 "The bank question is settled on the Kingdom's terms and the price is on the estimates for good."
 auh_dnc.307.t:0 "Eight Months Without a Government"
 auh_dnc.307.d:0 "The bank question has taken the cabinet down and there is nobody who can replace it. The ministers have resigned and remain at their desks signing what cannot wait, which is most things. Credit is drying up in both halves while the Chamber argues about whose name goes on the notes. We may hold the line with a caretaker and let the argument exhaust itself, or concede the bank entirely and buy a majority at whatever it costs."
 auh_dnc.307.a:0 "Hold the line and govern with a caretaker."
 auh_dnc.307.b:0 "Concede the bank fully and buy a majority."
 AUH_h_ev308_a_tt:0 "The neighbour finds other buyers, other lenders and other gunmakers."
 AUH_h_ev308_b_tt:0 "The frontier stays open and the plain sends its complaints to the capital."
 auh_dnc.308.t:0 "The Frontier Closes on the Livestock"
 auh_dnc.308.d:0 "The agrarians of the Kingdom want the southern frontier shut to live pigs and cattle, and with a tariff of our own we can shut it. The neighbour across the river sells us almost nothing else. If we close, Belgrade will buy its guns in France, build its own abattoirs with French money and be free of us inside three years. If we keep it open we shall be told in every county assembly of the plain that the government feeds a hostile kingdom."
 auh_dnc.308.a:0 "Close the frontier."
 auh_dnc.308.b:0 "Keep it open against a commercial treaty."
 AUH_h_ev309_a_tt:0 "The chancellery goes on recruiting, and the file grows."
 AUH_h_ev309_b_tt:0 "The heir's clients are pushed into open opposition, and his organisation is halved for two years."
 auh_dnc.309.t:0 "The Programme of the Next Reign"
 auh_dnc.309.d:0 "The heir's military chancellery is drafting the reign that follows this one, and every draft begins by undoing the settlement of the two armies. It is recruiting where we are weakest, in the Transylvanian counties, the uplands and the coast, and it is promising each of them what it refuses the Kingdom. We may watch and do nothing, which is what the King prefers. Or we may move against a chancellery that is not, formally, doing anything wrong."
 auh_dnc.309.a:0 "Watch them and do nothing."
 auh_dnc.309.b:0 "Move against the chancellery."
 AUH_h_ev310_a_tt:0 "The eastern deployment is written down and the alliance keeps its value."
 AUH_h_ev310_b_tt:0 "Their staff begins planning without the Monarchy's eastern army."
 auh_dnc.310.t:0 "Berlin Asks About the Word of Command"
 auh_dnc.310.d:0 "Our ally asks, through its military attache and then through its ambassador, what the common army is now worth. It was allied to an establishment that manoeuvred as one body, and the newspapers of two capitals have just told it that no such body exists. We may reassure Berlin with a written convention on the eastern deployment, which costs us the price of writing it down. Or we may say that the internal law of the Monarchy is our own affair and let their staff plan without us."
 auh_dnc.310.a:0 "Reassure Berlin with a written convention."
 auh_dnc.310.b:0 "Tell Berlin it is our affair."
 AUH_h_ev311_a_tt:0 "The understanding holds, and the Romanian loss is halved."
 auh_dnc.311.t:0 "Bucharest Reads the Order of the Day"
 auh_dnc.311.d:0 "The kingdom beyond the passes has read our order of the day, our new garrisons and our new batteries, and has drawn the obvious conclusion. Its king is bound to us by an understanding almost nobody in his own country knows about, and he cannot defend it against a press that prints our Transylvanian statutes in full. A private reassurance costs us political capital and buys us his silence. Saying nothing costs nothing today."
 auh_dnc.311.a:0 "Send a private reassurance to the King in Bucharest."
 auh_dnc.311.b:0 "Say nothing."
 AUH_h_ev312_a_tt:0 "The provinces stay outside both halves, and the ambiguity is preserved on purpose."
 AUH_h_ev312_b_tt:0 "A promise is made that nobody intends to keep, and it is written into the minutes."
 auh_dnc.312.t:0 "Budapest Asks for the Third Land"
 auh_dnc.312.d:0 "The Kingdom has paid half the bill for the occupied provinces since the day the army marched in, and it now asks what it has bought. Its ministry wants the provinces attached to the Crown of Saint Stephen, and its press has already drawn the map. The other half of the Monarchy will not hear of it and the provinces themselves have not been asked. We refuse, or we promise a decision at some later date and let the promise ripen into a scandal."
 auh_dnc.312.a:0 "Refuse, and keep the provinces outside both halves."
 auh_dnc.312.b:0 "Promise a decision at a later date."
 auh_dnc.313.t:0 "The Seam at the Manoeuvres"
 auh_dnc.313.d:0 "The two establishments take the field together in front of the attaches of six powers. Orders pass from one staff to the other by written convention, translated, timed and countersigned. If the seam holds, we shall have proved that a Monarchy can field two armies and command them as one. If it opens, it will open in front of the men who write the reports their governments act on."
 auh_dnc.313.a:0 "Hold the manoeuvres."
 AUH_h_ev313_good_tt:0 "The two staffs mesh, and a part of the coordination malus is written off for good."
 AUH_h_ev313_bad_tt:0 "The seam opens in front of the attaches, and the offensive doctrine is locked for two years."
 AUH_h_advisor_klobucar_tt:0 "The general from the coast takes the command of the Kingdom's army."
 auh_dnc.314.t:0 "The Commander of the Honved Dies"
 auh_dnc.314.d:0 "The commander-in-chief of the Kingdom's army is dead and the succession is on the King's desk. The seniority list gives the command to a general born on the coast, which the coast would notice and the capital would resent. Behind him stands an archduke of the Hungarian line, of middle rank and no particular distinction, whom the Chamber would receive with a standing ovation. One of these choices is correct and the other is useful."
 auh_dnc.314.a:0 "Name the general the seniority list gives."
 auh_dnc.314.b:0 "Pass him over for the archduke of the Hungarian line."
 AUH_h_ev315_a_tt:0 "The campaign is answered and the damage abroad is halved."
 auh_dnc.315.t:0 "The Publicist Takes Up the Uplands"
 auh_dnc.315.d:0 "A Scottish publicist named Seton-Watson has spent a summer in the northern counties and has published what he found there. The examination in the state language, the schools, the gendarmerie and the recruiting rolls are all in his book, and the book is being read in London and Paris. We may answer him in the foreign press, which concedes that a foreigner may lecture us on our internal law. Or we may refuse to answer at all, which concedes the field."
 auh_dnc.315.a:0 "Answer him in the foreign press."
 auh_dnc.315.b:0 "Refuse to answer a foreign lecture on our internal law."
 AUH_h_the_uplands_question:0 "The Question of the Uplands"
 AUH_h_ev316_a_tt:0 "The reform stands, and the governing benches are thinner by half."
 AUH_h_ev316_b_tt:0 "The bill survives with its teeth drawn, and everyone concerned knows it."
 auh_dnc.316.t:0 "The Gentry Splits Over the Ballot"
 auh_dnc.316.d:0 "The reform is real and the men who carried the coalition have worked out what it does to their seats. Half the governing benches will leave rather than vote it. We may hold the reform and let them go, which costs us the majority and keeps the new electors. Or we may water it down in committee until it is safe, which keeps the majority and tells every county that our promises are drafting exercises."
 auh_dnc.316.a:0 "Hold the reform and let them go."
 auh_dnc.316.b:0 "Water it down in committee."
 AUH_h_ev317_a_tt:0 "The squares are cleared and the day enters the calendar of the labour associations."
 AUH_h_ev317_b_tt:0 "The question is promised a second hearing and the squares empty by evening."
 auh_dnc.317.t:0 "The Streets Answer the Plural Ballot"
 auh_dnc.317.d:0 "A hundred thousand men are in the squares of the capital, and they are not asking for the vote in general but for a vote that weighs the same as anybody else's. The gendarmerie is in the side streets waiting for a word. We may let it clear the squares, which will work today and be quoted for a generation. Or we may receive a delegation and promise that the question will be reopened, which will cost us a promise we may not be able to keep."
 auh_dnc.317.a:0 "Let the police clear the squares."
 auh_dnc.317.b:0 "Receive the delegation."
 AUH_h_ev318_a_tt:0 "The threat is held over the Chamber and never carried out."
 AUH_h_ev318_c_tt:0 "The Crown declines to threaten a parliament with an electorate, and the Chamber is told so."
 auh_dnc.318.t:0 "The Franchise Held Over the Kingdom"
 auh_dnc.318.d:0 "The interior minister offers the Crown a weapon: decree a universal male franchise for the Kingdom, with the social democrats and the nationality parties behind it, and the Chamber that obstructs us disappears at the next election. It would break the obstruction in one act and it would spend, in that same act, the entire consent we have spent this decade buying. We may brandish it and not use it, which is what a threat is for. We may decree it. Or we may refuse to hold it over a parliament at all."
 auh_dnc.318.a:0 "Brandish it and do not use it."
 auh_dnc.318.b:0 "Decree it."
 auh_dnc.318.c:0 "Refuse to hold it over the Chamber at all."
 AUH_h_ev318_b_tt:0 "The Kingdom's consent, which is this whole method's currency, is spent in a single act and the counter returns to nothing."
 auh_dnc.319.t:0 "The Crisis Finds Two Armies"
 auh_dnc.319.d:0 "The provinces have been declared ours, the neighbour across the river has mobilised its opinion, and a partial mobilisation is ordered against it. Two establishments must now move on one timetable, with two staffs, two gazetteers, two survey grids and a convention between them. Everything this settlement has cost is about to be measured on a railway platform instead of in a tooltip."
 auh_dnc.319.a:0 "Order the mobilisation."
 AUH_h_ev319_good_tt:0 "It goes off on time. The neighbour capitulates and the settlement has passed its examination."
 AUH_h_ev319_bad_tt:0 "The two establishments mobilise on two timetables. The neighbour is emboldened and Berlin has seen everything."
 AUH_h_the_kingdom_consents:0 "What Budapest Has Been Given"
 AUH_h_price_paid_tt:0 "What Budapest has been given rises, and the common army holds together a little less well."
 AUH_h_gemein_down_tt:0 "The sense of common affairs weakens."
 AUH_h_gemein_up_tt:0 "The sense of common affairs is repaired a little."
 AUH_h_quota_up_tt:0 "The Kingdom's share of the common charges rises."
 AUH_h_cores_of_the_crown_tt:0 "Every state of the Crown of Saint Stephen becomes Hungarian ground in law as well as in name."
 AUH_m_tt_aus_up:0 "German-Austrian loyalty to the Monarchy rises."
 AUH_m_tt_aus_down:0 "German-Austrian loyalty to the Monarchy falls."
 AUH_m_tt_hun_up:0 "Magyar loyalty to the Monarchy rises."
 AUH_m_tt_hun_down:0 "Magyar loyalty to the Monarchy falls."
 AUH_m_tt_cze_up:0 "Czech loyalty to the Monarchy rises."
 AUH_m_tt_cze_down:0 "Czech loyalty to the Monarchy falls."
 AUH_m_tt_cro_up:0 "Croat loyalty to the Monarchy rises."
 AUH_m_tt_cro_down:0 "Croat loyalty to the Monarchy falls."
 AUH_m_tt_pol_up:0 "Polish loyalty to the Monarchy rises."
 AUH_m_tt_pol_down:0 "Polish loyalty to the Monarchy falls."
 AUH_m_tt_ukr_up:0 "Ruthene loyalty to the Monarchy rises."
 AUH_m_tt_ukr_down:0 "Ruthene loyalty to the Monarchy falls."
 AUH_m_tt_rom_up:0 "Romanian loyalty to the Monarchy rises."
 AUH_m_tt_rom_down:0 "Romanian loyalty to the Monarchy falls."
 AUH_m_tt_slv_up:0 "Slovene loyalty to the Monarchy rises."
 AUH_m_tt_slv_down:0 "Slovene loyalty to the Monarchy falls."
 AUH_m_tt_ser_up:0 "Serb loyalty to the Monarchy rises."
 AUH_m_tt_ser_down:0 "Serb loyalty to the Monarchy falls."
 AUH_m_tt_bos_up:0 "Bosnian loyalty to the Monarchy rises."
 AUH_m_tt_bos_down:0 "Bosnian loyalty to the Monarchy falls."
 AUH_m_tt_slo_up:0 "Slovak loyalty to the Monarchy rises."
 AUH_m_tt_slo_down:0 "Slovak loyalty to the Monarchy falls."
 AUH_m_tt_ita_up:0 "Italian loyalty to the Monarchy rises."
 AUH_m_tt_ita_down:0 "Italian loyalty to the Monarchy falls."
 AUH_m_the_price_of_the_exception:0 "The Price of the Exception"
 AUH_m_exception_counter_tt:0 "The exception is priced again: one more year of summary rule costs stability and the good will of the Powers."
 AUH_m_loyalties_declared_tt:0 "The loyalties of the Slovak and Italian lands are now counted with the rest."
 AUH_m_unequal_union_gone_tt:0 "The unequal union ceases to be an excuse: the army answers to the Crown, not to the settlement."
 AUH_m_the_instrument_of_the_crown_bonus:0 "The Instrument of the Crown"
 AUH_m_ordinance_counter_tt:0 "The ordinance ledger is opened: every act carried without a chamber is counted, and the count is dear."
 AUH_m_the_corps_of_many_tongues_bonus:0 "One Corps, Eleven Tongues"
 AUH_m_ruthene_reserve_tt:0 "The Ruthene counties furnish more cadets than the Polish clubs would like."
 AUH_m_the_language_of_command_bonus:0 "The Words of Command"
 AUH_m_regimental_tongue_tt:0 "In the mixed recruiting districts the regiment stops being a foreign body."
 AUH_m_the_regimental_tongue:0 "The Regimental Tongue"
 AUH_m_the_staff_school_bonus:0 "The Course at the Staff School"
 AUH_m_schemua_tt:0 "A staff officer of the new course is marked for a district command."
 AUH_m_dnc_slot_tt:0 "The trials ground becomes a standing establishment: one more line of research is opened to the realm."
 AUH_m_the_trials_bonus:0 "The Trials at Wiener Neustadt"
 AUH_m_beck_army_chief:0 "Friedrich von Beck-Rzikowsky"
 AUH_m_the_contingency_files_bonus:0 "The Files in the Safe"
 AUH_m_beck_ordered_tt:0 "The chief of the general staff is ordered to write, and he writes."
 AUH_m_brosch_tt:0 "The keeper of the card index takes his place in the high command."
 AUH_m_conrad_theorist:0 "Franz Conrad von Hoetzendorf"
 AUH_m_conrad_tt:0 "The divisional commander the heir asks for takes the staff, and the memoranda begin."
 AUH_m_the_offensive_school_bonus:0 "The Offensive School"
 AUH_m_the_staff_asks_for_war_threat:0 "The Austro-Hungarian staff plans openly"
 AUH_m_the_school_of_the_old_chief_bonus:0 "The School of the Old Chief"
 AUH_m_beck_kept_tt:0 "The author of the plan for the kingdom stays where he is."
 AUH_m_the_three_files_bonus:0 "The Three Files"
 AUH_m_corps_commanders_tt:0 "The corps commanders who will open the files are named now."
 AUH_m_the_common_estimate_bonus:0 "The Estimate Carried First"
 AUH_m_war_minister_tt:0 "The common minister of war takes his place before the Delegations."
 AUH_m_koerber_tt:0 "A ministry of officials is formed, and it will sign what the chamber will not vote."
 AUH_m_contingent_lifted_tt:0 "The Austrian share of the levy is taken by order: the frozen contingent moves for the first time."
 AUH_m_the_orders_bonus:0 "Orders Where the Votes Are"
 AUH_m_quote_up_tt:0 "The Hungarian share of the common budget rises, and so does the Hungarian claim on it."
 AUH_m_yards_still_capped_tt:0 "The yards are paid for but they are still the yards we have."
 AUH_m_the_gold_crown_bonus:0 "The Houses Answer"
 AUH_m_credit_prices_the_ordinance_tt:0 "The houses have read the ordinance ledger and priced it into the coupon."
 AUH_m_finance_minister_tt:0 "The common finance minister is put to work on the foreign houses."
 AUH_m_the_siege_train_bonus:0 "The Heavy Programme"
 AUH_m_auffenberg_tt:0 "The artillery theorist of the works is taken into the ministry's service."
 AUH_m_heaviest_tubes_tt:0 "The heaviest mortar remains in development: the era will see the drawings, not the battery."
 AUH_m_the_quick_firing_bonus:0 "The Quick-Firing Piece"
 AUH_m_krobatin_tt:0 "The gunner who will run the ordnance department is advanced."
 AUH_m_one_pattern_bonus:0 "One Rifle, One Cartridge"
 AUH_m_one_cartridge_tt:0 "From this establishment, every regiment of the common army draws the same cartridge."
 AUH_m_the_passes_bonus:0 "Where the Road Stops"
 AUH_m_the_military_lines_bonus:0 "Ramps Before Branches"
 AUH_m_wittek_tt:0 "The railway minister is placed under the staff's timetable."
 AUH_m_no_canal_tt:0 "This road never digs the canal, and the commercial chambers are told so in writing."
 AUH_m_the_traction_bonus:0 "Traction for the Heavy Guns"
 AUH_m_bohemia_seethes_tt:0 "Bohemia is already close to the point where the garrison is the government."
 AUH_m_the_railwaymen_bonus:0 "The Lines Under Orders"
 AUH_m_strike_counter_tt:0 "The organised trades are one notch better organised against the next call-up."
 AUH_m_the_frontier_sections_bonus:0 "The Sections on the Frontier"
 AUH_m_watched_coast_tt:0 "The Littoral is policed by the army's own bureau."
 AUH_m_the_watched_coast:0 "The Watched Coast"
 AUH_m_the_bureau_bonus:0 "The Legation Network"
 AUH_m_bureau_chief_tt:0 "A chief of the evidence bureau is named and given a purse nobody audits."
 AUH_m_the_counter_group_bonus:0 "Witnesses Who Can Be Bought"
 AUH_m_zagreb_papers_tt:0 "The group already has a treason trial waiting for its documents."
 AUH_m_the_rifle_corps_bonus:0 "The Shooting Societies"
 AUH_m_the_armed_tyrol_threat:0 "Austria-Hungary arms the Tyrol"
 AUH_m_the_armed_province:0 "The Armed Province"
 AUH_m_the_paid_army_bonus:0 "The Corps Is Paid First"
 AUH_m_garrison_towns_tt:0 "The garrison towns are paid before the provinces, and it shows."
 AUH_m_the_garrison_town:0 "The Garrison Town"
 AUH_m_aehrenthal_tt:0 "The ambassador from Petersburg takes the Ballhausplatz and an active policy with it."
 AUH_m_goluchowski_tt:0 "The minister of the eastern understanding stands down to make the Crown's position easier."
 AUH_m_no_more_ordinance_tt:0 "A chamber of every man in the Austrian half cannot be walked around again."
 AUH_m_the_coast_school_bonus:0 "Mines, Torpedoes and Bays"
 AUH_m_haus_tt:0 "A commander of the coastal defence and the torpedo flotillas is given the school."
 AUH_m_no_squadron_tt:0 "No squadron battleship is laid down while the exception lasts."
 AUH_m_the_station_bonus:0 "The Station at Fischamend"
 AUH_m_air_chief_tt:0 "An archduke of no great seniority is given the flying establishment, and he will keep it."
 AUH_m_the_assembly_area_bonus:0 "Ramps in the North"
 AUH_m_galicia_corps_tt:0 "The corps commanders of the northern assembly area are named."
 AUH_m_the_manoeuvres_bonus:0 "The Autumn Manoeuvres"
 AUH_m_chlopy_manoeuvres_tt:0 "These are the manoeuvres at which the order was read out, and nobody in Budapest has forgotten it."
 AUH_m_the_territorial_force_bonus:0 "The Territorial Establishment"
 AUH_m_the_reserve_commission_bonus:0 "Commissions by Examination"
 AUH_m_gentry_dispossessed_tt:0 "In the Magyar counties a class discovers that the Crown no longer needs it."
 AUH_m_the_gentry_dispossessed:0 "The Gentry Dispossessed"
 AUH_m_the_sheets_bonus:0 "The Sheets of the Counties"
 AUH_m_third_file_mapped_tt:0 "The third file now has the maps it always lacked."
 AUH_m_counties_marked_tt:0 "The counties that have stopped obeying are listed, and the list is kept."
 AUH_m_the_county_in_resistance:0 "The County in Resistance"
 AUH_m_the_county_under_commission:0 "The County Under Commission"
 AUH_m_the_kingdom_first_bonus:0 "The Case Turned Inward"
 AUH_m_no_southern_war_tt:0 "No offensive war in the south is possible while the kingdom is unsettled."
 AUH_m_the_army_bills_bonus:0 "The Bills As They Stand"
 AUH_m_war_minister_covered_tt:0 "The common minister of war is covered by the Crown and does not fall."
 AUH_m_the_chlopy_bonus:0 "Common and Undivided"
 AUH_m_reservation_repeated_tt:0 "The reservation stated in the chambers is now stated to the army itself."
 AUH_m_no_fourteenth_paragraph_tt:0 "There is no emergency article on this side of the Leitha: the deadlock has no legal exit."
 AUH_m_thirtysix_of_sixtythree_tt:0 "Thirty-six county assemblies out of sixty-three refuse tax and recruits."
 AUH_m_lever_costs_tt:0 "The industrial bargain with Budapest makes this ministry dearer to install."
 AUH_m_street_weighs_pivot_tt:0 "The street makes the majority far likelier to take the offer when the counties are called."
 AUH_m_social_democracy_tt:0 "The social democrats of both halves treat the Crown as a temporary ally."
 AUH_m_commissioners_seated_tt:0 "A commissioner sits in the chair of every county that refused."
 AUH_m_countdown_tt:0 "Within two years the counties will make their answer, and the Crown will have to choose."
 AUH_m_the_levy_bonus:0 "The Classes Called by Order"
 AUH_m_contingent_free_tt:0 "The levy is no longer frozen: the realm takes the classes its population can bear."
 AUH_m_honved_obeys_tt:0 "The royal Hungarian home guard has obeyed the King against the Hungarian Parliament."
 AUH_m_the_pact_bonus:0 "The Terms Nobody Printed"
 AUH_m_pact_bomb_tt:0 "An unpublished pact is a scandal waiting for the man who decides to publish it."
 AUH_m_they_will_be_back_tt:0 "The military programme of the majority is only postponed, and it returns by itself."
 AUH_m_magyar_minister_tt:0 "A Magyar politician who can be worked with is brought forward."
 AUH_m_the_bought_contingent_bonus:0 "The Classes Bought with Offices"
 AUH_m_counties_pay_again_tt:0 "The counties deliver their tax and their classes again."
 AUH_m_author_executes_tt:0 "The officer who wrote the plan is the officer who carries it out, and it goes faster."
 AUH_m_tax_resumes_tt:0 "The occupied counties deliver their taxes to the corps districts."
 AUH_m_exception_bites_tt:0 "The years of exception are now doing visible damage to the realm."
 AUH_m_the_one_army_bonus:0 "One Army and No Other"
 AUH_m_twelve_thousand_tt:0 "Twelve and a half thousand recruits a year return to the common contingent."
 AUH_m_no_hungarian_army_tt:0 "No separate Hungarian force exists any longer, in law or in fact."
 AUH_m_reform_everyone_wanted_tt:0 "The county reform every party demanded is carried by the army that nobody wanted."
 AUH_m_press_campaign_tt:0 "An international press campaign against the Monarchy opens and does not close."
 AUH_m_the_kingdom_settled_bonus:0 "The Kingdom Delivers"
 AUH_m_half_the_malus_tt:0 "The occupation is halved: the kingdom obeys and delivers."
 AUH_m_army_free_again_tt:0 "The common army may be employed outside the realm again."
 AUH_m_exception_lifting_tt:0 "The state of exception is set aside: the Crown gives instead of taking."
 AUH_m_no_magyarisation_tt:0 "No school law of magyarisation can pass a chamber elected on this franchise."
 AUH_m_pact_with_street_kept_tt:0 "The bargain made with the workers before the Parliament is kept, and they know it."
 AUH_m_pact_with_street_broken_tt:0 "The bargain made with the workers is broken, and the movement we built turns on us."
 AUH_m_the_seated_nation:0 "The Seated Nation"
 AUH_m_seated_nation_tt:0 "In the mixed counties the state stops being something that happens to people."
 AUH_m_rolls_freeze_tt:0 "The rolls fix the nationalities in place: the indifferent are counted out of existence."
 AUH_m_bucharest_loses_lever_tt:0 "Bucharest loses its grievance in Transylvania, and therefore its lever on us."
 AUH_m_press_campaign_ends_tt:0 "The international campaign against the Monarchy loses its subject."
 AUH_m_the_officials_bonus:0 "A Service of No Nation"
 AUH_m_colourless_service_tt:0 "The imperial service administers where the diets have stopped."
 AUH_m_full_objectivity_tt:0 "The minister-president who asked the service for full objectivity is taken at his word."
 AUH_m_the_colourless_service:0 "The Colourless Service"
 AUH_m_one_treasury_bonus:0 "One Treasury"
 AUH_m_no_more_renewals_tt:0 "The decennial renewal of the settlement is struck out of the calendar."
 AUH_m_quota_frozen_tt:0 "The Hungarian share of the common budget is frozen where it stands and will not be renegotiated again."
 AUH_m_trap_of_the_branch_tt:0 "The most effective instrument on this road is also the one that makes the way out dearest."
 AUH_m_the_notables_bonus:0 "Keys and Pensions"
 AUH_m_magyar_notable_tt:0 "A Magyar notable who can be relied on is brought into the Crown's service."
 AUH_m_class_bought_tt:0 "A class is bought where a nation could not be."
 AUH_m_the_law_of_the_crown_bonus:0 "A Constitution of Our Own Making"
 AUH_m_exception_ended_tt:0 "The state of exception is over and its ledger is closed."
 AUH_m_occupation_ends_tt:0 "The military administration of the kingdom is wound up."
 AUH_m_the_frontier_district:0 "The Frontier District"
 AUH_m_the_south_first_bonus:0 "The Case Turned South"
 AUH_m_file_stays_shut_tt:0 "The plan for the kingdom is never opened on this road."
 AUH_m_hungarian_bills_blocked_tt:0 "No Hungarian measure hostile to the common institutions reaches the House at all."
 AUH_m_the_river_watch_bonus:0 "The Crossings Counted"
 AUH_m_narodna_tt:0 "A defence society is forming across the river, and our posts will report it first."
 AUH_m_the_cordon_threat:0 "Austria-Hungary holds its southern frontier with troops"
 AUH_m_sanction_costs_the_sender_tt:0 "A sanction costs the state that imposes it more than the state it is imposed on."
 AUH_m_before_the_guns_arrive_bonus:0 "Before the Guns Arrive"
 AUH_m_the_window_threat:0 "The Austro-Hungarian staff has found its season"
 AUH_m_window_tt:0 "The season in which the southern neighbour can still be beaten cheaply is now named in the plans."
 AUH_m_the_bosniaken_bonus:0 "The Battalions of the Province"
 AUH_m_bosniaken_serve_the_province_tt:0 "The battalions are raised on the province's account: their men become ours only when the province does."
 AUH_m_the_narrow_gauge_bonus:0 "Ramps in the Valleys"
 AUH_m_province_rails_tt:0 "The province builds our military railway out of its own budget."
 AUH_m_sabor_against_us_tt:0 "The Sabor is governed against, not with: fifty-six seats of eighty-eight sit in opposition."
 AUH_m_vojvodina_warning_tt:0 "The Serb districts of the south pass under the threshold at which a rising becomes likely."
 AUH_m_the_fiume_bonus:0 "The Coast Changes Hands on Paper"
 AUH_m_the_ban_bonus:0 "Instructions from Vienna"
 AUH_m_countersignature_tt:0 "The divergence is the countersignature, not the man: Budapest keeps its appointee and loses its veto."
 AUH_m_fifty_three_accused_tt:0 "Fifty-three men are put in the dock and most of them will be convicted."
 AUH_m_the_pledge_bonus:0 "A Promise That Is Written Down"
 AUH_m_dalmatia_is_cisleithan_tt:0 "Dalmatia is named in the fundamental law: only the final settlement can actually move it."
 AUH_m_the_domobranstvo_bonus:0 "A Second Home Guard"
 AUH_m_southern_corps_tt:0 "The corps commanders of the southern front are advanced."
 AUH_m_the_littoral_levy_bonus:0 "The Cooperative Societies"
 AUH_m_cooperatives_tt:0 "The cooperative societies become a recruiting apparatus of the state."
 AUH_m_the_grenzer_bonus:0 "The Privileges of the Border"
 AUH_m_the_memorandum_bonus:0 "The Memorandum on the Ally"
 AUH_m_the_case_against_italy_threat:0 "Austria-Hungary plans against its own ally"
 AUH_m_secret_neutrality_tt:0 "The secret undertaking our ally gave to a third power is now in our hands."
 AUH_m_conrad_wants_the_isonzo_tt:0 "The chief of staff wants this front opened, and says so in writing every month."
 AUH_m_old_chief_refuses_tt:0 "The old chief will fortify the frontier and refuse to plan an attack across it."
 AUH_m_the_barrier_bonus:0 "The Full Profile"
 AUH_m_alpine_commander_tt:0 "A commander is given the alpine front and told to hold it with concrete."
 AUH_m_the_fortress_district_bonus:0 "A Province Administered as a Fortress"
 AUH_m_irredentists_cross_tt:0 "When war comes, the irredentist deputies of the coast will cross over, and they will take what they know with them."
 AUH_m_coast_pays_for_flotillas_tt:0 "A militarised coast that pays for its own flotillas may yet reopen the fleet question."
 AUH_m_two_million_subjects_tt:0 "Nearly two million subjects pass from a fiction of occupation into the realm."
 AUH_m_bosniaken_are_ours_tt:0 "The battalions raised on the province's account become our own."
 AUH_m_the_annexation_threat:0 "Austria-Hungary annexes the occupied provinces"
 AUH_m_no_bill_tt:0 "There is no crisis and therefore no bill: nobody is in a position to present one."
 AUH_m_murzsteg_burned_early_tt:0 "The eastern understanding is burned four years early, while it is still protecting our flank."
 AUH_m_understanding_at_buchlovice_tt:0 "The conversation in Moravia takes the edge off the crisis and leaves us a debt."
 AUH_m_proclaimed_alone_tt:0 "Proclaimed alone, without a word to anyone: the crisis arrives whole."
 AUH_m_the_bill_will_come_tt:0 "The Porte will present its bill, and it will have to be paid."
 AUH_m_the_reichsland_bonus:0 "A Statute Without a Diet"
 AUH_m_potiorek_landeschef:0 "Oskar Potiorek"
 AUH_m_landeschef_tt:0 "A soldier is made governor of the province with civil powers as well as military ones."
 AUH_m_the_wedge_threat:0 "Austria-Hungary keeps its garrisons in the southern district"
 AUH_m_no_common_frontier_tt:0 "The two neighbours below us cannot reach each other while we sit between them."
 AUH_m_no_territory_promised_tt:0 "This act promises no territory and creates no claim: it buys a position, not a province."
 AUH_m_common_frontier_given_tt:0 "The southern neighbours receive the common frontier we have denied them for thirty years."
 AUH_m_crisis_shortened_tt:0 "The crisis closes a season sooner than it otherwise would."
 AUH_m_sum_not_published_tt:0 "The amount is not published, and it will not be."
 AUH_m_crisis_closed_tt:0 "The crisis is closed and the title is no longer contested by the Power that held it."
 AUH_m_the_arbitration_bonus:0 "Heard on the Same Day"
 AUH_m_arbitration_tt:0 "The quarrel between the ministry and the staff is settled in front of the Crown instead of in the newspapers."
 AUH_m_loser_replaced_free_tt:0 "Whichever office loses the argument may be re-staffed without cost."
 AUH_m_the_campaign_threat:0 "Austria-Hungary opens a campaign in the south"
 AUH_m_the_army_unused_bonus:0 "Ready and Not Employed"
 AUH_m_belgrade_recognises_tt:0 "Belgrade recognises the annexation and renounces all compensation."
 AUH_m_third_refusal_tt:0 "The staff has been refused three times and will not let the Crown forget it."
 AUH_m_the_bay_bonus:0 "The Heights Above the Bay"
 AUH_m_the_bay_is_ours_tt:0 "Works and a station are built in the bay itself, never on the Dalmatian enclave to the north."
 AUH_m_the_bay_threat:0 "Austria-Hungary claims the heights above its own bay"
 AUH_m_the_southern_settlement_bonus:0 "One Administration, One Diet"
 AUH_m_italian_claim_counter_tt:0 "An Italian claim on the coast begins to be compiled, and it will not stop."
 AUH_m_the_fifty_millions_bonus:0 "The Classes Never Called"
 AUH_m_hungary_furnishes_tt:0 "The pacified kingdom furnishes its classes and its factories with the rest of the realm."
 AUH_m_hungary_withholds_tt:0 "The kingdom is administered rather than governed: its works and its classes are not fully ours."
 AUH_m_an_army_above_the_nations_bonus:0 "One Body That Belongs to All of Them"
 AUH_m_summary_courts_closed_tt:0 "The summary courts are closed and the garrisons hand the districts back."
 AUH_m_ordinance_stood_down_tt:0 "The ordinance ceases to be the ordinary form of law."
 AUH_m_ledger_published_tt:0 "The ledger of the exception is published in full, year by year."
 AUH_m_the_engineer_of_the_works_tt:0 "The ordnance man of the Bohemian works is brought into the high command with his heavy programme."
 AUH_m_krobatin_ordnance:0 "Alexander von Krobatin"
 AUH_m_ended_by_patent_tt:0 "The realm leaves the exception with a franchise the Crown gave it."
 AUH_m_ended_by_octroi_tt:0 "The realm leaves the exception with a constitution the Crown octroyed."
 AUH_m_ended_by_rescript_tt:0 "The realm leaves the exception with a southern settlement granted by rescript."
 auh_dnc.400.t:0 "The Sword Is Drawn"
 auh_dnc.400.d:0 "The Crown has told both chambers what the army is instead of asking them. The ministry of war has its orders, the summary law is in force where we proclaim it, and the ledger of what all this costs has been opened on the first page. It remains to say, once, in public, what this is for."
 auh_dnc.400.a:0 "Say it plainly to both chambers"
 auh_dnc.400.b:0 "Say nothing and let the orders speak"
 auh_dnc.401.t:0 "The Exception Is Priced"
 auh_dnc.401.d:0 "Another year of summary rule is entered in the ledger."
 auh_dnc.401.a:0 "Enter it."
 auh_dnc.402.t:0 "The Card Index at the Belvedere"
 auh_dnc.402.d:0 "The heir's chancellery has sent over its list of officers worth promoting, and it is better than the one the ministry keeps. Every man on it will owe his career to a court that is not yet reigning. The Crown may take the list and accept the debt, or refuse it and keep the seniority roll that has served us so badly."
 auh_dnc.402.a:0 "Take the list"
 auh_dnc.402.b:0 "Keep the seniority roll"
 AUH_m_next_reign_owns_them_tt:0 "The best officers of the next twenty years will owe their careers to the Belvedere."
 AUH_m_seniority_kept_tt:0 "Promotion stays with the seniority roll, and the court of the heir is told so."
 auh_dnc.403.t:0 "Credit Asks a Question"
 auh_dnc.403.d:0 "The foreign houses have read the ordinance ledger and want to know what a budget carried without a chamber is worth as security. They will lend; the only question is the price, and who inside the realm is made to pay it. The finance ministry asks for a decision before the next tranche is drawn."
 auh_dnc.403.a:0 "Pay the spread"
 auh_dnc.403.b:0 "Borrow at home instead"
 auh_dnc.403.c:0 "Sell state railway stock"
 AUH_m_spread_paid_tt:0 "The spread is paid out of the civil estimates and not mentioned in the Delegations."
 AUH_m_borrow_at_home_tt:0 "The domestic subscription is taken up, and the subscribers are not pleased about it."
 AUH_m_sell_the_rails_tt:0 "A block of state railway stock is sold to cover the tranche."
 AUH_m_credit_refused_tt:0 "Three houses in succession decline: the Crown can no longer borrow abroad."
 auh_dnc.404.t:0 "Prague Under the Summary Law"
 auh_dnc.404.d:0 "The Bohemian capital is under the summary law for the third time in fifteen years, on a statute nobody has ever repealed. The garrison can restore order in a week. There is also a settlement of national rolls that has held in the neighbouring crown land for a decade, and the ministry has drafted a version for Bohemia that it does not expect to survive first reading."
 auh_dnc.404.a:0 "Let the garrison command"
 auh_dnc.404.b:0 "Try the Moravian settlement here"
 AUH_m_third_state_of_siege_tt:0 "The third state of siege in fifteen years, under a statute that has never been repealed."
 AUH_m_moravian_holds_tt:0 "Against every expectation the rolls are agreed and the settlement holds."
 AUH_m_moravian_fails_tt:0 "The settlement is talked out, as it was the last time and as it will be the next."
 auh_dnc.405.t:0 "The Line Stops"
 auh_dnc.405.d:0 "The state railwaymen have stopped the traffic on the main lines. Under the order we signed, every reservist among them is refusing service and may be tried for it. We can call them up where they stand and have the traffic moving within the week, or we can arbitrate and be seen to arbitrate."
 auh_dnc.405.a:0 "Call them up where they stand"
 auh_dnc.405.b:0 "Arbitrate"
 AUH_m_general_strike_tt:0 "The third call-up produces what we were warned it would: a general strike in four cities."
 AUH_m_traffic_moves_tt:0 "The traffic moves within the week, under military drivers."
 AUH_m_arbitrated_tt:0 "The dispute is arbitrated and the men go back with something to show for it."
 auh_dnc.406.t:0 "The Ministry Changes Hands"
 auh_dnc.406.d:0 "The minister who has held the eastern understanding together for eleven years has offered his resignation to make the Crown's position easier. His successor has been ambassador at Petersburg and knows exactly how much the understanding is worth and what it would buy if it were spent. The Crown may take the resignation, or refuse it and keep a policy of standing still."
 auh_dnc.406.a:0 "Take the resignation"
 auh_dnc.406.b:0 "Refuse it"
 AUH_m_active_policy_tt:0 "The Ballhausplatz passes to a minister who intends to spend what his predecessor saved."
 AUH_m_standing_still_tt:0 "The policy of standing still is kept for another season."
 auh_dnc.407.t:0 "The Lieutenant of Galicia"
 auh_dnc.407.d:0 "There has been shooting over a county election in the northern province, and the lieutenancy is asking for instructions. The Ruthene peasantry wants a curia of its own; the Polish clubs have governed the province for us for a generation and will regard any curia as a confiscation. Whichever we choose, we lose the other, and the province is our assembly area."
 auh_dnc.407.a:0 "Open the Ruthene curia"
 auh_dnc.407.b:0 "The Polish system holds"
 AUH_m_curia_opened_tt:0 "A Ruthene curia is opened and the Polish clubs stop delivering the province."
 AUH_m_polish_system_tt:0 "The clubs keep the province, and the countryside answers with a decade of shooting."
 auh_dnc.408.t:0 "The Franchise as a Weapon"
 auh_dnc.408.d:0 "Our minister of the interior in the kingdom has an equal franchise drafted and ready. Published, it would end the world of the gentry within one election. He does not propose to publish it; he proposes to let it be known that it exists. The Crown must decide whether to brandish a bill it may never mean to pass."
 auh_dnc.408.a:0 "Brandish it"
 auh_dnc.408.b:0 "Keep it in the drawer"
 AUH_m_franchise_brandished_tt:0 "The cheapest weapon in the realm is drawn: a bill that need never be passed to work."
 AUH_m_franchise_in_the_drawer_tt:0 "The draft stays in the drawer, and the majority sleeps better than it should."
 auh_dnc.409.t:0 "The Witness Who Was Paid"
 auh_dnc.409.d:0 "Our counter-espionage group has produced the documents that will convict the men in the dock, and the defence has begun asking where they were printed. We can go to the end of the trial and have our convictions, or drop the charges now and keep an interlocutor who can still speak for his people. The papers came out of one of our own legations and that will be established sooner or later."
 auh_dnc.409.a:0 "Go to the end of the trial"
 auh_dnc.409.b:0 "Drop the charges"
 AUH_m_forgeries_established_tt:0 "The convictions stand for a season and the forgeries stand for ever."
 AUH_m_charges_dropped_tt:0 "The charges are dropped and the men who can speak for the province are still able to speak."
 auh_dnc.410.t:0 "The Dove or the Airship"
 auh_dnc.410.d:0 "A monoplane designed within the Monarchy has been offered to the flying establishment in series, at a price that would swallow the airship budget whole. The airships are what the army has asked for and what the manoeuvres can use. The monoplane is what the next establishment will beg for and be unable to buy in time."
 auh_dnc.410.a:0 "Order the monoplane in series"
 auh_dnc.410.b:0 "The airships are enough"
 AUH_m_the_monoplane_bonus:0 "The Monoplane Ordered in Series"
 AUH_m_no_machine_this_era_tt:0 "No machine will reach a corps in this establishment: what is bought is the two years."
 AUH_m_airships_enough_tt:0 "The technical station is enlarged, the flying field is kept, and the advantage is given away."
 auh_dnc.411.t:0 "The Reform and the Country"
 auh_dnc.411.d:0 "The decision on the franchise bill has been taken and the country is answering. The workers' benches, the German clubs and the Czech clubs have all read the same act and drawn conclusions that will govern the rest of the establishment. The ministry asks how the Crown wishes to be seen to have decided."
 auh_dnc.411.a:0 "Let the decision stand as it is"
 AUH_m_narrow_chamber_tt:0 "The chamber stays narrow for the whole establishment and the obstruction becomes permanent."
 AUH_m_wider_chamber_tt:0 "The chamber is widened, the obstruction ends, and every act that needs a vote now costs more."
 auh_dnc.412.t:0 "The Heavy Battery Cannot Move"
 auh_dnc.412.d:0 "The trials ground reports that the heavy batteries cannot be brought off a metalled road at all, and that this will decide the first fortnight of any campaign we have planned. It proposes heavy draught teams and rebuilt limbers from the Bohemian works, and a small trial column of engines to be reported on and not exhibited. The engines cost what a battery costs and may deliver nothing."
 auh_dnc.412.a:0 "Order the traction and the trial column"
 auh_dnc.412.b:0 "The committee reports against it"
 AUH_m_the_trials_report_bonus:0 "The Report of the Trials Ground"
 AUH_m_traction_ordered_tt:0 "Teams, limbers and a trial column of engines are ordered from the works at Pilsen."
 AUH_m_traction_refused_tt:0 "The committee reports against the engines and the batteries stay on the roads."
 auh_dnc.413.t:0 "The Counties Refuse"
 auh_dnc.413.d:0 "Two years of commissioners have produced an answer. Thirty-six county assemblies out of sixty-three have refused the tax and the classes and will go on refusing. At the same hour the leaders of the majority have sent word that they will take office without their military programme if the Crown will hear them. The file the staff wrote for this case is in the safe. The Crown decides which of the two it opens."
 auh_dnc.413.a:0 "Take the offer"
 auh_dnc.413.b:0 "Open the file"
 AUH_m_offer_holds_tt:0 "The offer holds: the threat of an equal franchise has done in ten months what two years of commissioners could not."
 AUH_m_offer_withdrawn_tt:0 "Nothing frightened them into signing, and the offer is withdrawn before it reaches paper."
 AUH_m_file_opened_tt:0 "The plan for the kingdom is taken out of the safe."
 AUH_m_street_steadies_us_tt:0 "The workers of the kingdom stand with the Crown against their own Parliament, and the occupation is steadier for it."
 AUH_m_army_divided_tt:0 "Too many years of exception: regiments recruited in the kingdom refuse to march against it."
 auh_dnc.414.t:0 "The Chamber Is Cleared"
 auh_dnc.414.d:0 "The hall has been cleared and the desks sealed by soldiers of the King's own Hungarian guard, under a colonel who read the rescript aloud before he gave the order. Photographers were present. The Crown may publish the rescript with the reasons in full, or say nothing and let the foreign press write the account for us."
 auh_dnc.414.a:0 "Publish the rescript"
 auh_dnc.414.b:0 "Say nothing"
 AUH_m_rescript_published_tt:0 "The reasons are published over the King's signature, and they are read everywhere."
 AUH_m_silence_tt:0 "We say nothing, and the account that circulates is written by people who were not in the room."
 auh_dnc.415.t:0 "The Emperor Says No"
 auh_dnc.415.d:0 "The submission has come back from the cabinet of the sovereign unsigned. He has governed this realm longer than most of his ministers have been alive and he does not believe that what we propose can be survived. We may insist, and spend the credit of the whole ministry on one signature, or withdraw the submission and look for a smaller road."
 auh_dnc.415.a:0 "Insist"
 auh_dnc.415.b:0 "Withdraw the submission"
 AUH_m_he_signs_tt:0 "He signs, and he does not forgive the ministry that made him."
 AUH_m_withdrawn_tt:0 "The submission is withdrawn and the sovereign is grateful in the only way he knows."
 auh_dnc.416.t:0 "The Contingent That Does Not Come"
 auh_dnc.416.d:0 "Of the annual contingent of the realm, more than two recruits in five are levied in the kingdom, and the kingdom is not levying them. The establishment cannot be maintained on the Austrian classes alone without calling them early. The ministry of war asks whether to call the Austrian classes ahead of time or to strike divisions off the order of battle."
 auh_dnc.416.a:0 "Call the Austrian classes early"
 auh_dnc.416.b:0 "Reduce the establishment"
 AUH_m_austrian_classes_early_tt:0 "The Austrian classes are called ahead of time and the Austrian half is told why."
 AUH_m_establishment_reduced_tt:0 "Divisions are struck off the order of battle rather than filled from one half of the realm."
 auh_dnc.417.t:0 "Berlin Puts the Question at Petersburg"
 auh_dnc.417.d:0 "Our friend in the north is willing to ask Petersburg for a yes or a no, in terms that admit of one answer. He is willing because it costs him nothing and puts us in his debt permanently, and he expects divisions kept standing in our northern province as the receipt. If he does not ask, the campaign goes forward without cover and the eastern empire may find that it can answer after all."
 auh_dnc.417.a:0 "Accept the demarche and the garrison"
 auh_dnc.417.b:0 "Go on without the demarche"
 AUH_m_petersburg_yields_tt:0 "Petersburg yields, Belgrade recognises what we have taken, and the account is opened in Berlin."
 AUH_m_uncovered_tt:0 "The campaign goes forward uncovered, and the eastern empire is free to answer."
 AUH_m_the_uncovered_campaign_threat:0 "Austria-Hungary campaigns without a friend"
 auh_dnc.418.t:0 "Vienna Requires an Answer"
 auh_dnc.418.d:0 "The Monarchy has annexed the two provinces, holds its army on the frontier and has been given the backing of a Great Power that has asked our protector for a yes or a no. Our protector has answered. We are invited to recognise the annexation, to renounce every claim to compensation and to undertake to be a good neighbour, in writing, this week."
 auh_dnc.418.a:0 "Recognise and renounce"
 auh_dnc.418.b:0 "Refuse and take the consequences"
 AUH_m_belgrade_signs_tt:0 "The note is signed, and it is the most humiliating document any government here has put its name to."
 AUH_m_belgrade_refuses_tt:0 "The note is refused, and the army on the river is still there in the morning."
 auh_dnc.419.t:0 "The Porte Presents Its Bill"
 auh_dnc.419.d:0 "The Power whose sovereignty we have ended presents its account: an indemnity, guarantees for the Muslims of the province, and a form of words that lets it save its face before its own parliament. Paying closes the crisis in a season. Refusing keeps the money and leaves a Power with a grievance and a good case in every chancery in Europe."
 auh_dnc.419.a:0 "Pay and guarantee"
 auh_dnc.419.b:0 "Refuse and hold"
 AUH_m_the_unpaid_bill_threat:0 "Austria-Hungary refuses to pay for what it has taken"
 AUH_m_conference_risk_tt:0 "A European conference on the question becomes likely, and we would lose the prestige at it."
 auh_dnc.420.t:0 "Fiume Answers Vienna"
 auh_dnc.420.d:0 "The Croatian deputies have heard our offer and want to know whether the Crown will put it in writing. Their leaders can carry the coalition to Vienna if there is a signed programme in their hands; they cannot carry a conversation. A written pledge on the coast will be read in the Reichsrat as the dismemberment of the Austrian half, because that is what it is."
 auh_dnc.420.a:0 "Pay the pledge in writing"
 auh_dnc.420.b:0 "Promise without signing"
 AUH_m_pledge_written_tt:0 "The pledge is signed and the coalition turns from Budapest to Vienna."
 AUH_m_promise_unsigned_tt:0 "The promise is made and not signed, and the deputies begin drifting back to Budapest."
 auh_dnc.421.t:0 "The Heir's Veto"
 auh_dnc.421.d:0 "The heir has read the campaign order and has forbidden it in terms he has not troubled to keep private. He will not have the realm's one army spent on a neighbour he considers beneath the trouble, and he has the chancellery, the promotion list and the future. We may buy him with the southern programme he wants, or go over his head and govern against a court that will outlast us."
 auh_dnc.421.a:0 "Pay the Belvedere"
 auh_dnc.421.b:0 "Go over his head"
 AUH_m_belvedere_paid_tt:0 "The veto is lifted in exchange for a southern programme the Crown has now promised twice."
 AUH_m_over_his_head_tt:0 "The order stands, and half the service begins working for a reign that has not started."
 auh_dnc.422.t:0 "A Constitution Is Restored in the East"
 auh_dnc.422.d:0 "The neighbouring empire has restored its constitution and recalled its parliament. That parliament will shortly ask for deputies from two provinces which are legally its own and which we have administered for thirty years. Once the question is put in a chamber, the fiction of an occupation cannot be defended in any chancery in Europe. The Crown is informed; the Crown will have to act."
 auh_dnc.422.a:0 "Note it"
 AUH_m_fiction_untenable_tt:0 "The fiction of the occupation cannot survive the first question asked about it in that chamber."
 AUH_m_question_does_not_arise_tt:0 "We took the title before the question could be put, and it does not arise."
 auh_dnc.423.t:0 "A Realm That Is Only a Garrison"
 auh_dnc.423.d:0 "The exception has now lasted longer than the ministry that declared it meant it to last, and the ledger has run to its last line. There is no law to hand back because none was ever written, no chamber to hand it to because none has been called, and no end that anybody can name. The realm is administered by its own army against its own peoples, and that is now the constitution. This is not a settlement. It is what happens when a means is never converted into one."
 auh_dnc.423.a:0 "Enter it in the ledger and continue"
 AUH_m_no_capstone_tt:0 "There is no end to this road now: the exception was never lifted and the era closes without a law."
 AUH_m_aehrenthal_seated_tt:0 "The common ministry for foreign affairs passes to Alois Lexa von Aehrenthal, who takes his instructions from the staff's timetable."
 AUH_m_ministry_already_settled_tt:0 "The succession at the ministry has already been settled elsewhere; the Crown only confirms the timetable."
 AUH_m_goluchowski_stays_tt:0 "Agenor Goluchowski stays at the ministry, and the understanding in the east is not disturbed."
 AUH_m_first_organ_tt:0 "The establishment of the common army is withdrawn from the ordinary budget quarrel and answers to the Crown alone."
 AUH_m_the_first_organ_bonus:0 "The First Organ of the State"
 AUH_m_police_under_army_tt:0 "The frontier sections report to the army and not to the two ministries of the interior."
 AUH_m_shooting_societies_tt:0 "The Tyrolean shooting societies are entered on the rolls as a standing reserve."
 AUH_m_bills_deposited_tt:0 "The bills lie on the table of a House that will not call them, and the common war minister is covered whatever it decides."
 AUH_m_counties_yield_tt:0 "The county halls open their tax rolls again and the recruits owed for the lost year are handed over."
 AUH_m_moravian_model_tt:0 "The rolls of the upland counties are drawn on the model that has kept the peace in the north."
 AUH_m_districts_drawn_tt:0 "The Transylvanian constituencies are drawn on the people who live in them, and the grievance across the frontier loses its lever."
 AUH_m_river_watch_tt:0 "The river stations are manned from the corps districts and the crossing points are reported to the staff every week."
 AUH_m_the_french_house_tt:0 "Our gunmaker has lost Belgrade to a French house, and the staff is ordered to fix the season at which the Serbian batteries will be re-equipped."
 AUH_m_littoral_levy_tt:0 "The Littoral regiments are levied where the coast has always found its seamen and its riflemen."
 AUH_m_bill_paid_tt:0 "The sum is voted by neither chamber, charged to the common treasury, and never published."
 AUH_m_quote_frozen_no_rise_tt:0 "The share is frozen, so the orders buy votes and nothing else; the treasury keeps what it would have conceded."
 AUH_nav_tt_hun_up_3:0 "Loyalty of the Kingdom rises by 3: the orders are shared out."
 AUH_nav_tt_hun_up_5:0 "Loyalty of the Kingdom rises by 5: nothing here is asked of Budapest."
 AUH_nav_tt_hun_up_10:0 "Loyalty of the Kingdom rises by 10: the Delegation is paid in hulls."
 AUH_nav_tt_hun_down_3:0 "Loyalty of the Kingdom falls by 3: one more common institution nobody asked for."
 AUH_nav_tt_hun_down_5:0 "Loyalty of the Kingdom falls by 5: a coast the Kingdom does not have."
 AUH_nav_tt_hun_down_8:0 "Loyalty of the Kingdom falls by 8: a programme laid before it unvoted."
 AUH_nav_tt_hun_down_10:0 "Loyalty of the Kingdom falls by 10: it is asked to hold a sea it never wanted."
 AUH_nav_tt_hun_down_15:0 "Loyalty of the Kingdom falls by 15: the credit was raised over its head."
 AUH_nav_tt_aus_up_3:0 "Loyalty of the German lands rises by 3."
 AUH_nav_tt_aus_up_5:0 "Loyalty of the German lands rises by 5: the fleet is popular in Vienna."
 AUH_nav_tt_aus_down_3:0 "Loyalty of the German lands falls by 3: the Alpine deputies wanted railways."
 AUH_nav_tt_aus_down_5:0 "Loyalty of the German lands falls by 5: the Cisleithanian yards lose the order."
 AUH_nav_tt_ita_up_3:0 "Loyalty of the Littoral's Italian speakers rises by 3."
 AUH_nav_tt_ita_up_5:0 "Loyalty of the Littoral's Italian speakers rises by 5: nobody across the sea is frightened of us now."
 AUH_nav_tt_ita_down_3:0 "Loyalty of the Littoral's Italian speakers falls by 3: the neighbouring concession is noticed."
 AUH_nav_tt_ita_down_5:0 "Loyalty of the Littoral's Italian speakers falls by 5: their town is now a closed military port."
 AUH_nav_tt_ita_down_8:0 "Loyalty of the Littoral's Italian speakers falls by 8: the fleet is pointed at their kin."
 AUH_nav_tt_slv_up_3:0 "Loyalty of the Slovene lands rises by 3: the crews of the Littoral are ours."
 AUH_nav_tt_cro_up_3:0 "Croatian loyalty rises by 3: the coast is garrisoned and paid."
 AUH_nav_tt_cze_up_5:0 "Czech loyalty rises by 5: the plate and the guns are ordered in Bohemia and Moravia."
 AUH_nav_tt_ser_down_5:0 "Serb loyalty falls by 5: the guns look south."
 AUH_nav_tt_quote_down_1:0 "The Kingdom's share of the common expenditure falls by 1: it is paid in orders, not asked for money."
 AUH_nav_tt_quote_down_3:0 "The Kingdom's share of the common expenditure falls by 3: there is very little left to share."
 AUH_nav_tt_gemeinsamkeit_up_2:0 "Commonality rises by 2: one more office answering to both halves."
 AUH_nav_tt_gemeinsamkeit_down_5:0 "Commonality falls by 5: the Crown borrowed where it should have asked."
 AUH_nav_tt_stabilimento_tecnico:0 "The Trieste technical works is entered on the naval register as a builder of capital hulls."
 AUH_nav_tt_lloyd_company:0 "The house flag of the Lloyd is entered on the naval register; its hulls and crews are requisitionable."
 AUH_nav_tt_lloyd_and_the_ministry:0 "The Ballhausplatz has already bought the mail routes: the subsidy buys hulls instead of paper."
 AUH_nav_tt_whitehead_company:0 "The torpedo works at the Kingdom's port is entered on the naval register; our order comes first."
 AUH_nav_tt_danubius_company:0 "The Kingdom's own yard is entered on the naval register with a guaranteed share of every order."
 AUH_nav_tt_cantiere_company:0 "A new private yard is founded down the coast on the strength of the loan's order book."
 AUH_nav_tt_seearsenal_company:0 "The state arsenal at the naval port is entered on the naval register: refits, boats and endurance."
 AUH_nav_tt_marinetechnisches_komitee:0 "The navy's own technical committee becomes a design office in its own right."
 AUH_nav_tt_witkowitz_and_skoda:0 "The Moravian plate works and the Bohemian ordnance works take naval contracts."
 AUH_nav_tt_popper:0 "The fleet's chief constructor is put on the establishment of the technical committee."
 AUH_nav_tt_popper_promoted:0 "The chief constructor moves from advising the committee to designing for it."
 AUH_nav_tt_spaun:0 "The Marinekommandant now signs for the section as well as for the fleet."
 AUH_nav_tt_montecuccoli:0 "The new commander takes the fleet, the section and the whole quarrel with him."
 AUH_nav_tt_haus:0 "The best seaman in the service is given the fleet and a seat in the high command."
 AUH_nav_tt_trapp:0 "A junior officer of the boats is given a command years before his turn."
 AUH_nav_tt_njegovan:0 "A middle-ranking officer of the Kingdom's coast is brought forward and told he is junior."
 AUH_nav_tt_kailer:0 "The officer who ran the trials is given a sea command of his own."
 AUH_nav_tt_horthy_junior:0 "A flotilla lieutenant is given a boat early and taken off the illustrated papers."
 AUH_nav_tt_estimates_category:0 "The naval estimates become an annual bargain: each tranche is bought from the two Delegations."
 AUH_nav_tt_address_the_delegations:0 "The society may be turned on either Delegation before the vote, at a cost in public calm."
 AUH_nav_tt_delegation_chain_armed:0 "The credit must now be re-bought every year, and the Kingdom has begun to count."
 AUH_nav_tt_armoured_cruiser_laid_down:0 "The big hull is laid down at the state yard. Keel to commissioning: four years and a half."
 AUH_nav_tt_three_hulls_slowly:0 "Three hulls of the line are ordered. They will be delivered slowly and they will be delivered late."
 AUH_nav_tt_keels_now_ships_later:0 "Three keels are laid this year. Not one of them will swim before the era closes."
 AUH_nav_tt_three_pairs_staged:0 "Two boats, then two, then two: the trial runs to the end of the era and past it."
 AUH_nav_tt_fiume_is_a_town:0 "The Kingdom's port is rebuilt as a town and can carry the buildings a yard needs."
 AUH_nav_tt_the_works_catch_up:0 "The fleet no longer waits in a queue behind a private yard's merchant orders."
 AUH_nav_tt_already_old:0 "Every ship of the line we own or have ordered is now the wrong kind of ship."
 AUH_nav_tt_not_yet_old:0 "No navy in the world has laid down an all-big-gun ship. Ours is still a modern squadron."
 AUH_nav_tt_one_hull_before_the_era_ends:0 "The loan pays for one hull of the new kind, laid down before the era closes."
 AUH_nav_tt_nothing_to_show:0 "The slips are empty, the credit was refused, and the Delegations ask what they are paying for."
 AUH_nav_tt_credit_to_the_contingent:0 "The credit the fleet will not spend goes to the contingent instead."
 AUH_nav_tt_sword_pays_for_the_fleet:0 "The general staff is told, in writing, what the fleet has just cost the army."
 AUH_nav_tt_the_heir_approves:0 "The Belvedere has wanted this loan for years and says so publicly."
 AUH_nav_tt_station_access:0 "Our consul and the garrison commander administer the ground on the river."
 AUH_nav_tt_station_no_partner:0 "There is no government on that coast to grant anything: the cruiser anchors and waits."
 AUH_nav_tt_station_expedition:0 "The expedition already sent east gives the station its garrison and its stores."
 AUH_nav_tt_cetinje_reads_it:0 "Cetinje reads the batteries exactly as they are meant."
 AUH_nav_tt_the_heights_stay_foreign:0 "The heights that command the whole bay remain in somebody else's hands. That is a war, not a base."
 AUH_nav_tt_the_account_laid:0 "The account of the fleet is laid before both parliaments: what it cost, what it is, what it must hold."
 AUH_nav_tt_capital_ship_lock:0 "No capital hull will be laid down while this stands: one would cost five times what it is worth."
 AUH_nav_the_bocche_threat:0 "The batteries above the southern bay"
 AUH_nav_the_adriatic_threat:0 "A battle fleet in the Adriatic"
 AUH_nav_the_published_programme:0 "The naval programme printed in full"
 AUH_nav_the_delegations_credit:0 "The Credit of the Delegations"
 AUH_rudolf_montecuccoli_chief:0 "Rudolf Montecuccoli"
 AUH_anton_haus_chief:0 "Anton Haus"
 AUH_tb_the_common_estimates:0 "The Common Estimates"
 AUH_tb_the_torpedo_comes_first:0 "The Torpedo Comes First"
 AUH_tb_the_line_of_battle:0 "The Line of Battle"
 AUH_tb_the_mail_contract:0 "The Mail Contract"
 AUH_tb_the_long_passage:0 "The Long Passage"
 AUH_tb_charts_of_our_own_sea:0 "Charts of Our Own Sea"
 AUH_tb_the_chief_constructor:0 "The Chief Constructor"
 AUH_tb_boats_for_a_narrow_sea:0 "Boats for a Narrow Sea"
 AUH_tb_the_fish_and_the_barrage:0 "The Fish and the Barrage"
 AUH_tb_the_barrage_service:0 "The Barrage Service"
 AUH_tb_the_sea_we_can_close:0 "The Sea We Can Close"
 AUH_tb_the_barrage_that_closes_it:0 "The Barrage That Closes It"
 AUH_tb_a_big_hull_of_our_own:0 "A Big Hull of Our Own"
 AUH_tb_the_lecture_and_the_model:0 "The Lecture and the Model"
 AUH_tb_a_fleet_on_paper:0 "A Fleet on Paper"
 AUH_tb_six_boats_to_be_ordered:0 "Six Boats to Be Ordered"
 AUH_tb_the_second_squadron:0 "The Second Squadron"
 AUH_tb_plate_and_ordnance:0 "Plate and Ordnance"
 AUH_tb_a_squadron_in_the_water:0 "A Squadron in the Water"
 AUH_tb_all_big_guns:0 "All Big Guns"
 AUH_tb_the_first_true_hull:0 "The First True Hull"
 AUH_tb_the_section_writes_the_doctrine:0 "The Section Writes the Doctrine"
 AUH_tb_ships_before_votes:0 "Ships Before Votes"
 AUH_tb_the_floating_dock:0 "The Floating Dock"
 AUH_tb_the_guns_of_the_bocche:0 "The Guns of the Bocche"
 AUH_tb_six_boats_three_designs:0 "Six Boats, Three Designs"
 AUH_tb_the_account_of_the_fleet:0 "The Account of the Fleet"
 AUH_tb_the_boat_that_hides:0 "The Boat That Hides"
 AUH_nav_the_common_fleet:0 "The Common Fleet"
 AUH_nav_the_common_fleet_desc:0 "The fleet is the one common institution that must be voted twice a year, in two capitals, by men who disagree about whether it should exist at all. It gets its estimates late, in instalments, and never in full."
 AUH_nav_the_school_of_the_narrow_sea:0 "The School of the Narrow Sea"
 AUH_nav_the_school_of_the_narrow_sea_desc:0 "Torpedo craft, mines and shore batteries, bought out of the ordinary estimates and defended by everyone who wants the money elsewhere: the Kingdom's Delegation, the land army, the strategic railways of the north-east. A cheap navy that cannot leave its gulf."
 AUH_nav_the_school_of_the_open_sea:0 "The School of the Open Sea"
 AUH_nav_the_school_of_the_open_sea_desc:0 "The fleet is built to leave the Adriatic and the money is found afterwards, tranche by tranche, from two Delegations that were not consulted. The army's best cadets go to sea and the Kingdom begins to count what it is paying for a coast it does not have."
 AUH_nav_the_naval_academy:0 "The Academy and the Institute"
 AUH_nav_the_naval_academy_desc:0 "Charts, tides and sailing directions printed at the naval port; officers trained at the Kingdom's port. The fleet no longer buys either from abroad. The regiments lose the best cadets in the realm and say so every year in the estimates."
 AUH_nav_a_fleet_that_stays_at_home:0 "A Fleet That Stays at Home"
 AUH_nav_a_fleet_that_stays_at_home_desc:0 "Written into the estimates and into both chambers' journals: this navy defends the coast and nothing else. No capital hull will be laid down while it stands, because one would cost five times what it is worth. Nobody across the sea is frightened of us any more."
 AUH_nav_four_years_and_a_half:0 "Four Years and a Half"
 AUH_nav_four_years_and_a_half_desc:0 "The honest rate of the state yard, keel to commissioning, written into every estimate that follows. The yard learns its trade on the realm's money and at the realm's pace."
 AUH_nav_the_programme_nobody_voted:0 "The Programme Nobody Voted"
 AUH_nav_the_programme_nobody_voted_desc:0 "A whole fleet printed in one document and voted in none: ships of the line, cruisers, scouts, destroyers, torpedo craft and six boats that go under. Every tranche of it must be torn out of two Delegations, one of which has no coast to defend."
 AUH_nav_the_second_squadron:0 "The Second Squadron"
 AUH_nav_the_second_squadron_desc:0 "Three more ships of the line on the ordinary estimates, with plate from Moravia and guns from Bohemia. Good ships, ordered against a standard that is about to be abolished."
 AUH_nav_the_last_ordinary_squadron:0 "The Last Ordinary Squadron"
 AUH_nav_the_last_ordinary_squadron_desc:0 "The last series this realm will finance out of the ordinary budget: three heavy hulls with the heaviest secondary battery afloat, laid down without asking anybody for a new credit. The design office is tied up building yesterday's ship."
 AUH_nav_the_empty_slips:0 "The Empty Slips"
 AUH_nav_the_empty_slips_desc:0 "The technical committee works and the slips do not. Nothing is being built, the yards are idle, and the Delegations are asked to keep paying for a fleet that is visibly not appearing."
 AUH_nav_the_marine_section:0 "The Marine Section"
 AUH_nav_the_marine_section_desc:0 "The fleet drafts its own estimates and writes its own doctrine, in its own section of the common war ministry, and the man who commands at sea signs both. The general staff loses an argument it will keep making, and the best officers."
 AUH_nav_the_credit_of_the_delegations:0 "The Credit of the Delegations"
 AUH_nav_the_credit_of_the_delegations_desc:0 "Every keel in this realm is a bargain struck twice in the same session with two bodies that answer to different parliaments. When the Kingdom's loyalty falls, the yards feel it before anybody else does."
 AUH_nav_the_share_of_the_orders:0 "The Share of the Orders"
 AUH_nav_the_share_of_the_orders_desc:0 "A guaranteed share of every naval order goes to the Kingdom's own yard, with the plate and the guns shared out to match. The yard has to be built before it can build, and the Cisleithanian firms are told exactly what they have lost."
 AUH_nav_the_loan_nobody_voted:0 "The Loan Nobody Voted"
 AUH_nav_the_loan_nobody_voted_desc:0 "The whole programme raised at once as a special loan on the Crown's own responsibility, placed with the banks of both capitals. The ships appear. So does the debt service, and so does the constitutional question, which nobody can now avoid."
 AUH_nav_the_submarine_station:0 "The Submarine Station"
 AUH_nav_the_submarine_station_desc:0 "Six boats of three designs, a basin of their own and crews taken permanently out of the torpedo flotillas. Two of the three designs were paid for in full and will never be built again."
 AUH_nav_a_sea_we_can_close:0 "A Sea We Can Close"
 AUH_nav_a_sea_we_can_close_desc:0 "Batteries on every headland, barrages across every channel, boats in every bay: nobody enters this sea and nothing of ours leaves it. The Kingdom is delighted to keep paying for it, and it will still be true when the era ends."
 AUH_nav_the_adriatic_is_ours:0 "The Adriatic Is Ours"
 AUH_nav_the_adriatic_is_ours_desc:0 "A battle fleet in a sea with one other battle fleet in it, and that fleet belongs to our formal ally. Everyone on the far shore now plans against us, and the alliance is worth a little less every year we keep building."
 AUH_nav_the_ships_of_yesterday:0 "The Ships of Yesterday"
 AUH_nav_the_ships_of_yesterday_desc:0 "Every heavy hull we own, and every heavy hull we have ordered, was designed against a standard that no longer exists. The crews know it, the Delegations know it, and the estimates still have to be voted."
 AUH_nav_the_new_yard_at_fiume:0 "The New Yard at the Kingdom's Port"
 AUH_nav_the_new_yard_at_fiume_desc:0 "The yard that was bought with the Kingdom's vote has to be built before it can build. Every order placed there in the meantime is delivered late."
 AUH_nav_the_losing_designs:0 "The Losing Designs"
 AUH_nav_the_losing_designs_desc:0 "Four of the six boats are from designs we will never build again, and all six were paid for at the contract price."
 AUH_nav_the_design_office_is_busy:0 "The Design Office Is Busy"
 AUH_nav_the_design_office_is_busy_desc:0 "Every draughtsman in the technical committee is working on hulls that are already out of date. Nothing else is being drawn."
 AUH_nav_the_slips_are_empty:0 "The Slips Are Empty"
 AUH_nav_the_slips_are_empty_desc:0 "We are waiting on purpose. The yards are idle, the fitters are being paid off, and nothing at all is coming down the ways."
 AUH_nav_the_tranche_deferred:0 "The Tranche Deferred"
 AUH_nav_the_tranche_deferred_desc:0 "The instalment was not voted this session. The yard has the plate, the slip and the men, and no order to put them together."
 AUH_nav_the_yard_learns:0 "The Yard Learns Its Trade"
 AUH_nav_the_yard_learns_desc:0 "Our own yard is doing something it has never done before, at our expense and at its own pace. The work is late and the lesson is permanent."
 auh_dnc.650.t:0 "The Memorandum in the Roman Press"
 auh_dnc.650.d:0 "A newspaper on the far shore has printed our naval memorandum entire, with the tonnages, the yards and the dates of delivery. Their ministry of marine has asked, politely, whether it is authentic. Our own Delegations are reading it in translation this morning, before either of them was shown a copy. We can deny it, print it ourselves, or cut it back to what has actually been voted."
 auh_dnc.650.a:0 "Deny it and print nothing."
 auh_dnc.650.b:0 "Publish the programme ourselves, so that both parliaments read it first."
 auh_dnc.650.c:0 "Cut the programme back to what has already been voted."
 auh_dnc.651.t:0 "The Delegation Will Not Sit"
 auh_dnc.651.d:0 "The Hungarian Delegation has adjourned itself rather than take the naval tranche, and the Austrian one will not vote alone. The Marine Section has a keel booked at a yard that has already ordered its plate. We can buy the vote with orders, carry the estimate by the Crown's own prerogative, or strike the ship out and tell the yard why."
 auh_dnc.651.a:0 "Pay for it in hulls: a share of the order goes to the Kingdom's yard."
 auh_dnc.651.b:0 "Carry the estimate by the Crown's prerogative and let them protest."
 auh_dnc.651.c:0 "Strike the ship from the estimates and tell the yard why."
 auh_dnc.652.t:0 "Four Years and a Half"
 auh_dnc.652.d:0 "The state yard has reported on the armoured cruiser. Keel to commissioning will be four years and a half, and the yard says plainly that it cannot be done faster with the plant it has. Foreign yards quote us three. The Delegations will be shown this figure whatever we decide, and every estimate we draft afterwards will be judged against it."
 auh_dnc.652.a:0 "Pay the yard its premium and buy the plant it says it needs."
 auh_dnc.652.b:0 "Accept the rate and write it into the estimates as it stands."
 auh_dnc.652.c:0 "Order the next hull from a foreign yard and let ours read about it."
 auh_dnc.653.t:0 "The Boats Come Out of the Basin"
 auh_dnc.653.d:0 "The six boats have finished their comparative trial in our own water and the committee has reported. The single-hull design dives and steers best; the boats from the northern yard are longer and better armed; the pair built at the Kingdom's torpedo works are the cheapest and can be repeated tomorrow. We build one of the three and pay off the other two designers."
 auh_dnc.653.a:0 "The single-hull boats: they dive best and their designer stays on our payroll."
 auh_dnc.653.b:0 "The boats from the northern yard: longest, best armed, and not ours."
 auh_dnc.653.c:0 "The boats built at the torpedo works: ours, cheap, and repeatable."
 auh_dnc.654.t:0 "The Ship on the Other Side of the World"
 auh_dnc.654.d:0 "The cruiser on the eastern station is due for relief and there is nothing modern to relieve her with. The legation wants her kept; the Marine Section wants her home, where she is a quarter of our effective strength. The consul points out that the concession without a warship in the river is a street with our name on it and nothing else."
 auh_dnc.654.a:0 "She stays. The station is worth a cruiser."
 auh_dnc.654.b:0 "She comes home; a gunboat and the marines keep the flag flying."
 auh_dnc.654.c:0 "The consular service takes the station over and the marines stay at the legation."
 auh_dnc.655.t:0 "The Ship That Made Every Other Ship Old"
 auh_dnc.655.d:0 "A foreign yard has commissioned a ship of the line carrying nothing but heavy guns, turbine driven, faster than anything of her size afloat. Every other battleship in every other navy is now the wrong kind of ship, including ours, including the ones still on the slips."
 auh_dnc.655.a:0 "Read the naval attache's report."
 auh_dnc.656.t:0 "Every Heavy Hull We Own"
 auh_dnc.656.d:0 "The attache's report is on the table and the Marine Section has done the arithmetic. Three ships in commission, three more on the slips, and a whole squadron ordered against a standard that no longer exists. The Delegations will still be asked to vote the instalments. The only question left is what we tell them."
 auh_dnc.656.a:0 "Tell them the truth: the squadron we are paying for is already old."
 auh_dnc.656.b:0 "Tell them nothing and keep the instalments coming."
 auh_dnc.657.t:0 "The Estimates Are Recounted"
 auh_dnc.657.d:0 "The Marine Section reads the Kingdom's temper and adjusts what it expects from the yards."
 auh_dnc.657.a:0 "Very well."
 AUH_nav_tt_avail_new_commander:0 "The office at the head of the fleet has not yet changed hands; the programme waits on the man who will sign it."
 AUH_nav_tt_avail_no_cap:0 "No promise has been given to the clubs, and no vision has frozen the fleet at its present format."
 AUH_nav_tt_avail_all_big_gun:0 "A ship carrying nothing but heavy guns has been launched abroad, and every design office in Europe knows it."
 AUH_nav_tt_avail_not_capped:0 "The Slav clubs have not been promised that this capital-ship race would never be entered."
 AUH_nav_tt_ordinance_count_up:0 "One more estimate carried over a Delegation instead of through it, and the tally of them is kept."
 AUH_nav_tt_station_gunboat:0 "The cruiser sails for home and a gunboat takes her billet: the flag stays, the strength comes back."
 AUH_nav_tt_station_consular:0 "The consul administers the ground and the marines keep the legation; the fleet withdraws from both."
 AUH_nav_tt_foreign_designers:0 "Three designers not our own are paid to build against one another in our own water."
 AUH_nav_tt_lake_retained:0 "The foreign engineer whose boats won stays on the payroll while the trial lasts, at his own price."
 AUH_r_sup_AUS_up_tt:0 "@AUS German Austrian loyalty to the crown rises."
 AUH_r_sup_AUS_down_tt:0 "@AUS German Austrian loyalty to the crown falls."
 AUH_r_sup_HUN_up_tt:0 "@HUN Hungarian loyalty to the crown rises."
 AUH_r_sup_HUN_down_tt:0 "@HUN Hungarian loyalty to the crown falls."
 AUH_r_sup_CZE_up_tt:0 "@CZE Czech loyalty to the crown rises."
 AUH_r_sup_CZE_down_tt:0 "@CZE Czech loyalty to the crown falls."
 AUH_r_sup_POL_up_tt:0 "@POL Polish loyalty to the crown rises."
 AUH_r_sup_POL_down_tt:0 "@POL Polish loyalty to the crown falls."
 AUH_r_sup_UKR_up_tt:0 "@UKR Ruthenian loyalty to the crown rises."
 AUH_r_sup_UKR_down_tt:0 "@UKR Ruthenian loyalty to the crown falls."
 AUH_r_sup_SLV_up_tt:0 "@SLV Slovene loyalty to the crown rises."
 AUH_r_sup_SLV_down_tt:0 "@SLV Slovene loyalty to the crown falls."
 AUH_r_sup_CRO_up_tt:0 "@CRO Croat loyalty to the crown rises."
 AUH_r_sup_CRO_down_tt:0 "@CRO Croat loyalty to the crown falls."
 AUH_r_sup_ROM_up_tt:0 "@ROM Romanian loyalty to the crown rises."
 AUH_r_sup_ROM_down_tt:0 "@ROM Romanian loyalty to the crown falls."
 AUH_r_sup_SER_up_tt:0 "@SER Serb loyalty to the crown rises."
 AUH_r_sup_SER_down_tt:0 "@SER Serb loyalty to the crown falls."
 AUH_r_sup_BOS_up_tt:0 "@BOS Bosnian loyalty to the crown rises."
 AUH_r_sup_BOS_down_tt:0 "@BOS Bosnian loyalty to the crown falls."
 AUH_r_sup_ITA_up_tt:0 "@ITA Italian loyalty to the crown rises."
 AUH_r_sup_ITA_down_tt:0 "@ITA Italian loyalty to the crown falls."
 AUH_r_sup_SLO_up_tt:0 "@SLO Slovak loyalty to the crown rises."
 AUH_r_sup_SLO_down_tt:0 "@SLO Slovak loyalty to the crown falls."
 AUH_r_seats_up_tt:0 "Votes behind the ministry rise."
 AUH_r_seats_down_tt:0 "Votes behind the ministry fall."
 AUH_r_seats_held_tt:0 "The count holds."
 AUH_r_counter_opened_tt:0 "The ministry begins with no bench of its own: the count of votes behind it stands at nothing."
 AUH_r_ordinance_taken_tt:0 "One more emergency ordinance is entered in the ledger."
 AUH_r_ordinance_price_tt:0 "Each ordinance already taken makes the next one dearer in stability and in credit."
 AUH_r_ordinance_price_doubled_tt:0 "Having accepted the committee's finding, every future ordinance costs twice what it did."
 AUH_r_segment_b_opened_tt:0 "The clubs may now be enrolled one by one."
 AUH_r_segment_d_opened_tt:0 "The crownland settlements may now be opened."
 AUH_r_segment_e_opened_tt:0 "The other half will now send its account."
 AUH_r_corridor_closed_tt:0 "The Alpine corridor and the second axis to the sea are closed for this era."
 AUH_r_fleet_capped_tt:0 "The fleet is held at the coast-defence format; the battle line and the semi-dreadnought are closed for this era."
 AUH_r_the_vacuum_tt:0 "The lands of the kingdom are administered under a legal vacuum by two hostile services."
 AUH_r_the_court_goes_north_tt:0 "The court's patronage moves to the kingdom's capital."
 AUH_r_the_count_is_visible_tt:0 "The count of votes behind the ministry, and its tier, are now public."
 AUH_r_unattached_decision_tt:0 "Unattached deputies may now be courted two at a time, at a rising price in political power."
 AUH_r_statute_or_nothing_tt:0 "Nothing will be settled outside the chamber again."
 AUH_r_bank_governor_tt:0 "A Galician Pole takes the governorship of the note-issuing bank."
 AUH_r_the_promise_has_a_term_tt:0 "The promise of a language statute carries a term the Czech clubs are counting."
 AUH_r_the_curial_house_holds_tt:0 "These nineteen votes exist only while the curial house does."
 AUH_r_cooperatives_tt:0 "The Slovene credit unions are recognised in law."
 AUH_r_defection_roll_tt:0 "The Christian Socials will count their price again whenever the gavel is used or the bishops are refused."
 AUH_r_the_city_is_contested_tt:0 "The port city becomes a place where every appointment is a national question."
 AUH_r_the_promise_of_the_bill_tt:0 "A franchise bill is promised in the chamber, by name; breaking that word will cost these eleven votes."
 AUH_r_tier_read_tt:0 "The tier of the ministry's support is read from the count."
 AUH_r_committee_will_report_tt:0 "The committee will report only in the second half of this era, and the ministry has undertaken to accept its finding."
 AUH_r_both_roads_open_tt:0 "The gavel and the ballot are both now open to the crown."
 AUH_r_strike_counter_tt:0 "The general-strike counter rises."
 AUH_r_strike_frozen_tt:0 "The general-strike counter is reset."
 AUH_r_the_word_broken_tt:0 "The word given to the workers is broken and their eleven votes go with it."
 AUH_r_gavel_roll_tt:0 "The closure will be put to the house. Success needs German loyalty above fifty-five, stability above forty-five in the hundred, and the count above the majority."
 AUH_r_gavel_conditions_met_tt:0 "The conditions for carrying the closure are met."
 AUH_r_gavel_conditions_failed_tt:0 "The conditions for carrying the closure are not met; the ministry is gambling."
 AUH_r_vacuum_narrowed_tt:0 "The legal vacuum in the kingdom narrows."
 AUH_r_vacuum_ended_tt:0 "The legal vacuum in the kingdom is closed."
 AUH_r_no_defection_roll_tt:0 "The Polish Club's sixty-five votes are held without a defection roll."
 AUH_r_army_locked_tt:0 "The common army is not to be touched: the army branch's reform of the staff college and its concession on the language of command are closed to this ministry."
 AUH_r_heirs_candidate_cheaper_tt:0 "The heir's candidate for the general staff is cheaper to appoint."
 AUH_r_heirs_candidate_dear_tt:0 "The heir's candidate for the general staff now needs a costly reconciliation; the old chief remains available."
 AUH_r_heirs_candidate_locked_tt:0 "The heir's candidate for the general staff is closed to this ministry; the old chief remains available."
 AUH_r_estates_consulted_tt:0 "The estates expect to be consulted before every statute that touches the land."
 AUH_r_claim_is_hollow_tt:0 "The count stands below the majority and the claim is heard as a boast."
 AUH_r_eighty_four_lost_tt:0 "The Polish Club walks out and the landowners' bench goes with the curial house: eighty-four votes."
 AUH_r_counter_rebased_tt:0 "The whole house is re-elected; the ministry's own benches in the new chamber number one hundred and thirty-one of five hundred and sixteen."
 AUH_r_tier_refreshed_tt:0 "The tier of the ministry's support is read again against the new majority of two hundred and fifty-nine."
 AUH_r_price_list_torn_up_tt:0 "The price list of the Galician delegation is torn up."
 AUH_r_polish_societies_arm_tt:0 "The Polish national societies begin arming in the province."
 AUH_r_estates_estranged_tt:0 "The estates of the kingdom are estranged from the ministry."
 AUH_r_mayor_locked_tt:0 "The clerical party and the workers' party will not carry one budget: the mayor's benches are closed for this era."
 AUH_r_the_register_is_changed_tt:0 "The Polish and Galician claims are struck from the register of the two eastern states."
 AUH_r_both_capped_tt:0 "Neither nation of the province may be brought past a bare tolerance while the viceroy holds the balance."
 AUH_r_chains_unclosable_tt:0 "Both violence chains in the province run for the rest of the era and neither can be closed."
 AUH_r_credibility_spent_tt:0 "The state enters the southern crisis with its own credibility spent."
 AUH_r_statute_roll_tt:0 "The statute will be put to a division. Success needs the workers' bench paid, the count above two hundred and fifty-eight, and stability above forty in the hundred."
 AUH_r_statute_conditions_met_tt:0 "The conditions for carrying the statute are met."
 AUH_r_statute_conditions_failed_tt:0 "The conditions for carrying the statute are not met; the ministry is gambling against the record."
 AUH_r_precedent_cited_tt:0 "The Moravian precedent is on the table of the house."
 AUH_r_thirty_six_months_tt:0 "If the settlement of the kingdom is not carried within three years, the Czech clubs will read the citation back to the ministry."
 AUH_r_silesian_decision_tt:0 "The diet of the duchy may now be asked for its own settlement."
 AUH_r_obstruction_in_the_diet_tt:0 "German loyalty is too low: the obstruction moves into the diet itself."
 AUH_r_every_land_asks_tt:0 "Every other land will ask for a minister of its own within the year."
 AUH_r_secession_reset_tt:0 "The German secession movement loses its subscribers and returns to its first stage."
 AUH_r_secession_last_stage_tt:0 "The German secession movement runs to its last stage."
 AUH_r_littoral_command_tt:0 "A Littoral corps command is given to an officer of the province, with no claim on a third crown attached."
 AUH_r_moravian_guarantee_holds_tt:0 "The Moravian guarantee holds."
 AUH_r_moravian_guarantee_wobbles_tt:0 "The Moravian guarantee is withdrawn by its own diet."
 AUH_r_two_bodies_tt:0 "Two professorial bodies that no longer speak to one another, and a bill that arrives every year."
 AUH_r_the_electrical_works_tt:0 "The electrical works of the kingdom take the current contracts."
 AUH_r_agrarian_benches_ask_tt:0 "The agrarian benches will ask what became of the river works."
 AUH_r_organised_miners_tt:0 "The arbitration makes a generation of organised miners."
 AUH_r_field_under_the_club_tt:0 "The field is worked under the Polish administration, and how much of it answers to the ministry is its decision."
 AUH_r_the_margin_stays_tt:0 "The refining margin stays inside the province."
 AUH_r_uprising_severity_tt:0 "The licensed societies are the cadres of any rising that follows a broken ring."
 AUH_r_the_balloon_officer_tt:0 "The balloon officer of the military aeronautical institute takes the detachment."
 AUH_r_quote_up_tt:0 "The other half's share of the common budget is cut and ours is raised."
 AUH_r_gemeinsamkeit_down_tt:0 "What the two halves still hold in common is worn a little thinner."
 AUH_r_gemeinsamkeit_up_tt:0 "What the two halves still hold in common is a little easier to defend."
 AUH_r_credits_dearer_tt:0 "The army and navy credits are dearer for the rest of the era."
 AUH_r_contingent_frozen_tt:0 "The Hungarian delegation refuses the credits and the contingent stays frozen."
 AUH_r_southern_roll_tt:0 "There is no advocate in this capital for outbidding the other half over the south; the address will usually be returned."
 AUH_r_address_returned_tt:0 "The address is returned to the diet that sent it."
 AUH_r_ex_lex_starts_tt:0 "The other half's chamber answers with obstruction and the ex-lex begins."
 AUH_r_interior_deployment_rehearsal_tt:0 "The army's deployment for the interior may be rehearsed and held over the other half as a standing threat. It is written, filed, and never executed."
 AUH_r_south_is_lost_tt:0 "The southern deputies go over to the other half's opposition; every later southern decision costs more."
 AUH_r_confessional_schools_tt:0 "The confessional schools of the other half's nationalities may now be funded, twice, to halve what is coming."
 AUH_r_school_law_is_coming_tt:0 "The other half will answer with a school law this crown has no instrument to stop."
 AUH_r_we_cannot_protect_them_tt:0 "The crown has heard them and cannot protect them."
 AUH_r_parity_board_tt:0 "The parity board doubles the cost of every economic decision."
 AUH_r_wear_tier_worse_tt:0 "The wear on the settlement is one step worse than any other course reaches."
 AUH_r_no_mediation_tt:0 "German mediation in any internal question is refused by standing instruction."
 AUH_r_a_congress_of_conservatives_tt:0 "On the road of historic right it is a congress of conservatives, and costs half as much abroad."
 AUH_r_the_police_are_instructed_tt:0 "The police of the province are instructed which schoolmasters to leave alone."
 AUH_r_never_claim_unification_tt:0 "This monarchy never claims the German unification."
 AUH_r_bought_once_only_tt:0 "The ally across the water has a separate understanding elsewhere; his friendship cannot be bought twice."
 AUH_r_no_european_crisis_tt:0 "The annexation is carried without a European crisis."
 AUH_r_renewal_dearer_tt:0 "The renewal of the settlement is dearer by one step."
 AUH_r_neighbour_does_not_sign_tt:0 "The understanding was never bought: the neighbour does not sign and the staff demands a war."
 AUH_r_no_dependence_tt:0 "This monarchy owes the ally nothing for its exit from the crisis."
 AUH_r_largest_divergence_tt:0 "This is the largest thing the reign has ever been asked to unsay."
 AUH_r_associations_mobilise_tt:0 "The German associations of the kingdom mobilise for the day of the ceremony."
 AUH_r_benches_boycott_tt:0 "The workers' and agrarian benches boycott the ceremony."
 AUH_r_agrarian_bench_paid_again_tt:0 "The estranged agrarian bench must be paid again before it will elect the deputation."
 AUH_r_nobility_absent_tt:0 "The nobility that would have crowned the king will not attend."
 AUH_r_the_guarantee_holds_tt:0 "The guarantee holds: the German deputies attend under protest and the ceremony passes."
 AUH_r_the_cores_are_lost_tt:0 "German Bohemia refuses: the crown ceases to hold the Sudeten lands as its own, and they must be pacified or lost."
 AUH_r_settlements_permanent_tt:0 "The crownland settlements are permanent for the rest of the game."
 AUH_r_settlements_void_tt:0 "The crownland settlements are void."
 AUH_r_g5_unlocked_tt:0 "The ring is broken; if it is not re-formed, the chamber will be adjourned and the era ended by ordinance."
 AUH_r_the_chain_repeats_tt:0 "The count is too low: the galleries fill again and the chain repeats."
 AUH_r_ruthenian_road_open_tt:0 "The Ruthenian benches may now be taken as partners."
 AUH_r_river_works_only_tt:0 "River and canal works inside the kingdom and the province only."
 AUH_r_corridor_stays_closed_tt:0 "No Alpine, no port axis and no dockyard is restored, and the corridor stays closed."
 AUH_r_surveys_published_later_tt:0 "The surveys will be published in two years and the loss will be doubled."
 AUH_r_nothing_is_decided_tt:0 "The professor is moved and no principle is decided."
 AUH_r_conversions_accelerate_tt:0 "The movement loses its leader and the conversions accelerate."
 AUH_r_nothing_spent_tt:0 "Nothing is spent now; the last stage will fire at the ceremony."
 AUH_r_straits_cheaper_tt:0 "The understanding at Petersburg makes the bargain at the Straits cheaper."
 AUH_r_the_crisis_is_ours_tt:0 "The proclamation comes first and the crisis with it."
 AUH_r_ceremony_postponed_tt:0 "The ceremony is postponed and the Czech clubs are counting again."
 AUH_r_statute_withdrawn_tt:0 "The statute is withdrawn and the ministry governs on the budget alone."
 auh_dnc.200.t:0 "Which Bench Do We Pay First?"
 auh_dnc.200.d:0 "The cabinet is formed and the lobby is full before the first sitting. The Galician delegation wants its promise in writing; the Czech clubs want the language question named in the address from the throne; the Alpine Catholics want the schools clause and nothing else. Each will wait if it is paid second. None will wait if it is paid third."
 auh_dnc.200.a:0 "The Poles, and the province is left to its diet."
 auh_dnc.200.b:0 "The Czechs, and the language question first."
 auh_dnc.200.c:0 "The Catholics, and the schools first."
 auh_dnc.201.t:0 "The Order of the Gavel"
 auh_dnc.201.d:0 "The closure is voted at four in the morning with the galleries cleared and the German deputies carried out by ushers. By noon the capital is in the streets, the social democrats have joined an obstruction they had stayed out of for a decade, and the mayor's party is in a back room counting what it can now demand. The garrison commander is asking for instructions and will not ask twice."
 auh_dnc.201.a:0 "Hold, and proclaim martial law in the capital."
 auh_dnc.201.b:0 "Hold, and let the police stand aside."
 auh_dnc.201.c:0 "Withdraw the order; the ministry cannot carry it."
 auh_dnc.202.t:0 "The Mayor Counts His Price"
 auh_dnc.202.d:0 "The mayor of the capital receives our whip in his own office, keeps him standing, and reads out a list. The municipal undertakings are not enough now; he wants the schools clause enforced in the universities, an appointment in the ministry of worship, and an undertaking about the next election that no honest government could give. He deserted the last ministry that needed him."
 auh_dnc.202.a:0 "Pay what he asks."
 auh_dnc.202.b:0 "Let him go, and count without him."
 auh_dnc.203.t:0 "Budapest Answers"
 auh_dnc.203.d:0 "The other half's chamber resolves within the week that no arrangement in this half may prejudice the settlement, and adds a demand of its own: the language of service in its own regiments, as the price of its silence about the kingdom. The crown always said that if it gave the Czechs their rolls, the Magyars would send in a bill the next morning. The crown was right."
 auh_dnc.203.a:0 "Refuse the regiments, and pay in the quota."
 auh_dnc.203.b:0 "Refuse, and pay in nothing at all."
 auh_dnc.203.c:0 "Concede the language of service in their regiments."
 auh_dnc.204.t:0 "The Club Walks Out"
 auh_dnc.204.d:0 "The Galician delegation meets for one hour and walks out of the majority in a body. Its majorities were built on curiae we are abolishing and its leaders say so without embarrassment: they were never a party, they were an arrangement. Sixty-five votes cross the floor together and the eastern province's administration goes with them."
 auh_dnc.204.a:0 "Let them go, and take the Ruthenian benches instead."
 auh_dnc.204.b:0 "Offer to leave the province's curiae untouched."
 auh_dnc.205.t:0 "A Shot at Lemberg"
 auh_dnc.205.d:0 "A Ruthenian peasant is shot dead by gendarmes at a polling place in the eastern districts and the coroner's finding is written before the body is cold. Weeks later a student walks into the viceroy's residence and kills the crown's lieutenant in the province. The province waits to see which law he is tried under, and both nations in it will read the answer as a verdict on themselves."
 auh_dnc.205.a:0 "Try him under the ordinary law and commute the sentence."
 auh_dnc.205.b:0 "Try him summarily, and let the sentence stand."
 auh_dnc.205.c:0 "Open the Ruthenian body now, over the viceroy's head."
 auh_dnc.206.t:0 "The Canal or the Rails"
 auh_dnc.206.d:0 "The agrarian benches want to know, in the chamber and on the record, whether the river works voted with the branch lines have been cut, or whether the money has quietly gone into the junction at the capital of the kingdom. The surveys exist. The estimates exist. Twelve votes are waiting for the answer and the minister of railways has gone very carefully through his notes."
 auh_dnc.206.a:0 "Dig the river works in the kingdom and the province."
 auh_dnc.206.b:0 "Shelve them, and say so in the chamber."
 auh_dnc.206.c:0 "Shelve them, and say nothing."
 auh_dnc.207.t:0 "The Professor and the Bishops"
 auh_dnc.207.d:0 "A professor of canon law publishes an essay on free science and the duty of the state to protect it. Within a month the bishops have written to the ministry of worship, the confessional partner has raised it in the club, and the students of two universities are holding meetings about a man most of them had never heard of. Twenty-nine votes are attached to the answer."
 auh_dnc.207.a:0 "Remove him."
 auh_dnc.207.b:0 "Move him to another university and settle nothing."
 auh_dnc.207.c:0 "Keep him, and say why."
 auh_dnc.208.t:0 "A German State and Nothing Else"
 auh_dnc.208.d:0 "The German national associations declare that this realm is a German state and that a ministry resting on Slav clubs is a foreign government. Their societies open subscription lists in every Sudeten town, their newspapers print the roll of officials who have sat the language examination, and their leaders are careful to stay one sentence inside the law. The public prosecutor has drafted an indictment and is waiting."
 auh_dnc.208.a:0 "Buy the bloc."
 auh_dnc.208.b:0 "Prosecute the leaders."
 auh_dnc.208.c:0 "Ignore them."
 auh_dnc.209.t:0 "The Conversions"
 auh_dnc.209.d:0 "The conversions continue: whole parishes leaving the church of the dynasty for the church of the neighbouring empire, with a band and a photographer. It is a political act dressed as a religious one and everybody understands it. The bishops want a counter-mission funded from the ordinary estimates; the treasury wants to know for how many years."
 auh_dnc.209.a:0 "Fund the counter-mission."
 auh_dnc.209.b:0 "Let them go."
 auh_dnc.210.t:0 "The Other Half Asks What It Receives"
 auh_dnc.210.d:0 "The leading statesman of the other half recalls, in a speech everyone was invited to, that a crowning at Prague was killed once before and by whom. He then asks the only question that matters: what is the other half to receive? Zagreb has sent the same question in a politer envelope."
 auh_dnc.210.a:0 "Nothing. The kingdom's rights are its own affair."
 auh_dnc.210.b:0 "The quota, and a portfolio in the common ministry."
 auh_dnc.210.c:0 "Postpone the ceremony until the question cools."
 auh_dnc.211.t:0 "German Bohemia Will Not Kneel"
 auh_dnc.211.d:0 "The route from the station to the cathedral is settled, the regalia are in the cathedral, and the German deputies of the kingdom have announced that they will not attend a ceremony that crowns a Czech state. In the frontier towns the associations are drilling in the open. The governor of the land asks whether he is to have troops on the day, and how many."
 auh_dnc.211.a:0 "Proclaim martial law over the German districts."
 auh_dnc.211.b:0 "Go through with it and garrison nothing."
 auh_dnc.211.c:0 "Take the oath in the capital of the realm instead."
 auh_dnc.211.e:0 "The guarantee holds; proceed."
 auh_dnc.212.t:0 "The Ring Marches Again"
 auh_dnc.212.d:0 "They come down the ring road again, in columns of six, in their Sunday coats, without a single window broken. There are more of them than last year and they have stopped shouting at the ministry; they shout at the curiae. The police president reports that a ban would be obeyed and that obeying it would cost us more than the march."
 auh_dnc.212.a:0 "Let them march and shoot nothing."
 auh_dnc.212.b:0 "Ban the march."
 auh_dnc.212.c:0 "Concede the further body now."
 auh_dnc.213.t:0 "Petersburg Offers a Bargain"
 auh_dnc.213.d:0 "The eastern power's foreign minister sends word through the congress that he is willing to discuss the southern provinces and the Straits in the same conversation, before anything is proclaimed. It is an offer to settle in a country house what would otherwise be settled by six chancelleries and a mobilisation. It also means paying for what we already occupy."
 auh_dnc.213.a:0 "Take the understanding, and buy the sovereignty first."
 auh_dnc.213.b:0 "Proclaim first and argue afterwards."
 auh_dnc.214.t:0 "The Committee Reports"
 auh_dnc.214.d:0 "The constitutional committee reports at last on the emergency ordinances of the language crisis: twenty-two regular, twenty-four unconstitutional but excused by necessity, thirty grossly unconstitutional. It asks for no impeachment and no repeal. It merely writes the numbers down, and this ministry undertook in advance to accept whatever it wrote."
 auh_dnc.214.a:0 "Accept the finding, as we undertook to."
 auh_dnc.214.b:0 "Table it, and take the next ordinance anyway."
 auh_dnc.215.t:0 "The Statute Goes to a Vote"
 auh_dnc.215.d:0 "The language statute is called for division in a chamber of five hundred and sixteen. The German benches have a fortnight of speeches ready, the galleries are full, and the workers' bench is being counted twice by both sides. Nobody in this house has ever seen a statute of this kind carried by a vote. The clerks are told to expect a long sitting."
 auh_dnc.215.a:0 "Sit through it and divide."
 auh_dnc.215.b:0 "Withdraw the statute and govern on the budget."
 auh_dnc.215.c:0 "Take it by ordinance after all."
 auh_dnc.216.t:0 "The State Pays the Schoolmaster"
 auh_dnc.216.d:0 "The other half answers the reception at the Hofburg with a school law of its own: the state will pay the village schoolmaster, and the state's language will be taught in every school it pays for. The Slovak and Romanian schools that were the last institutions of two nations begin closing one district at a time. This crown has no instrument to stop it and said so in advance."
 auh_dnc.216.a:0 "There is nothing we can do for them."
 auh_dnc.216.b:0 "The confessional schools we funded will hold some of them."
