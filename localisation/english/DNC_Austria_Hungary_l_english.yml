 AUH_nat_drift_falling:0 "§Rfalling§!"
 AUH_nat_drift_steady:0 "§Ysteady§!"
 AUH_nat_drift_rising:0 "§Grising§!"
 AUH_nat_coercion_up_tt:0 "§RThe ledger of coercion grows heavier by one.§!"
 AUH_nat_mediation_opens_tt:0 "§YThe Crown has 120 days to settle with [GetAUHRisingPeople]: crush it, grant the great demand, or let it go. Do nothing and it goes.§!"
 AUH_nat_mediation_settled_tt:0 "The rising has been settled, one way or another."
 AUH_nat_rising_release_tt:0 "§R[GetAUHRisingPeople] have a government, a flag and militia battalions in [GetAUHRisingLands].§!"
 AUH_nat_crush_tt:0 "§RThe army holds the districts. The column is set to 12 and scarred: it will break sooner and recover less, and the garrison props it up only while the bayonets stay.§!"
 AUH_nat_great_demand_tt:0 "§G[GetAUHGreatDemand]. [GetAUHRisingPeople] gain 12.§!"
 AUH_nat_great_demand_seesaw_tt:0 "§RThe people who had to be told no lose 2.§!"
 AUH_nat_the_arms_are_grounded_tt:0 "§GThe arms are grounded and the provinces come back to the Crown.§!"
 AUH_nat_let_go_tt:0 "§R[GetAUHRisingLands] is gone. The register records it, and the next province is watching.§!"
 AUH_nat_irredenta_hardens_tt:0 "§RNothing is settled. The grievance hardens, and the mother country across the frontier is listening.§!"
 AUH_nat_scar_down_tt:0 "§RThe column is scarred: it will break sooner and recover less.§!"
 AUH_nat_irredenta_tt:0 "§RThere is no country on the map to give them - only a kingdom across the frontier that has been waiting for exactly this.§!"
 AUH_nat_irredenta_SER_tt:0 "§RBelgrade has been waiting for exactly this.§!"
 AUH_nat_rising_hungary_tt:0 "§RThe Kingdom's own machinery answers this one.§!"
 AUH_nat_serbs_join_the_insurgency_tt:0 "§RThe Serb districts do not rise on their own. They reinforce Bosnia.§!"
 AUH_nat_prestige_down_tt:0 "§RThe House loses standing.§!"
 AUH_nat_agitator_column_up_tt:0 "§G[GetAUHAgitatorPeople] are more content with the realm.§!"
 AUH_nat_agitator_column_down_tt:0 "§R[GetAUHAgitatorPeople] grow colder toward the realm.§!"
 AUH_nat_threat_the_rising_in_arms:0 "A rising in arms in Austria-Hungary"
 AUH_dnc_the_register_status:0 "The Register, Read Aloud"
 AUH_dnc_the_register_status_desc:0 "Each people's standing out of 100, read once a month. §G40 or higher§!: content. §Y25 to 39§!: restless. §R10 to 24§!: refuses the levy. §Rbelow 10§!: in open revolt.\n\nThe register erodes of itself, and the band it erodes inside widens as the reign ages and the instruments are used. Heat stands at §Y[?AUH_register_heat|1]§! of 20, and every column caught inside that band loses §R[?AUH_register_erosion|0]§! a month.\n\n§[GetAUS_supportColor][?AUS_support|0]§! — the Germans of Austria\n§[GetHUN_supportColor][?HUN_support|0]§! — the Magyars\n§[GetCZE_supportColor][?CZE_support|0]§! — the Czechs\n§[GetPOL_supportColor][?POL_support|0]§! — the Poles\n§[GetUKR_supportColor][?UKR_support|0]§! — the Ruthenes\n§[GetROM_supportColor][?ROM_support|0]§! — the Romanians\n§[GetCRO_supportColor][?CRO_support|0]§! — the Croats\n§[GetSER_supportColor][?SER_support|0]§! — the Serbs\n§[GetBOS_supportColor][?BOS_support|0]§! — the Bosniaks\n§[GetSLV_supportColor][?SLV_support|0]§! — the Slovenes\n§[GetITA_supportColor][?ITA_support|0]§! — the Italians\n§[GetSLO_supportColor][?SLO_support|0]§! — the Slovaks"
 AUH_dnc_kriegsfaelle_cat:0 "The Cases in the Drawer"
 AUH_dnc_kriegsfaelle_cat_desc:0 "Kriegsfall I, Kriegsfall B, Kriegsfall R, Kriegsfall U. The Operations Bureau keeps a plan for every neighbour and one for the kingdom across the river. A plan on the shelf is not a war; it is the difference between a war and a rout."
 AUHDNC_bp_the_case_against_belgrade:0 "The Circular to the Chancelleries"
 AUHDNC_bp_the_case_against_belgrade_desc:0 "A printed dossier goes to every legation in Europe: the Kingdom's ministry, it says, pays the agitators of our southern counties. Some of it is true. The Ballhausplatz takes the case out of the hands of the county prosecutors and makes it a matter of state, which means it can no longer be quietly dropped."
 AUHDNC_bp_the_documents_from_the_legation:0 "The Documents from the Legation"
 AUHDNC_bp_the_documents_from_the_legation_desc:0 "Count Forgach's mission in Belgrade forwards a bundle of papers bought from a man who says he copies them at night. The Foreign Ministry does not ask where the paper was made. The court will ask. What the court will find is not written down anywhere, and will not be until the verdict is read."
 AUHDNC_bp_the_scandal_reaches_london:0 "The Scandal Reaches London"
 AUHDNC_bp_the_scandal_reaches_london_desc:0 "The Times has the whole affair, in order, with names. The Ballhausplatz can no longer treat European opinion as weather; it must be answered, and answering costs political capital every quarter."
 AUHDNC_bp_the_peace_the_ballhausplatz_writes:0 "The Peace the Ballhausplatz Writes"
 AUHDNC_bp_the_peace_the_ballhausplatz_writes_desc:0 "The soldiers have had their run; now the treaty is drafted on the Ballhausplatz, and the Ministry proves that a Great Power is the state that can end a war as well as begin one. Occupied ground is consolidated, garrisons are relieved, and the reign is closed with a signature rather than a bulletin."
 AUHDNC_bp_the_railway_to_the_east:0 "The Railway to the East"
 AUHDNC_bp_the_railway_to_the_east_desc:0 "The survey becomes a roadbed. Uvac to Mitrovica, and from Mitrovica the Sultan's trunk line runs to the Aegean. Two etappen brigades are raised to hold the strip while it is built. Belgrade understands exactly what a railway through the Sanjak means, and so does Petersburg."
 AUHDNC_bp_the_guns_on_credit_for_belgrade:0 "The Guns on Credit for Belgrade"
 AUHDNC_bp_the_guns_on_credit_for_belgrade_desc:0 "If the Kingdom must rearm, let it rearm with Pilsen steel on Vienna credit, and let every battery it owns depend on our spare parts. Creusot will underbid us. Creusot always underbids us."
 AUHDNC_bp_the_ships_that_pass_the_straits:0 "The Ships That Pass the Straits"
 AUHDNC_bp_the_ships_that_pass_the_straits_desc:0 "Izvolsky wanted the Straits opened to Russian warships and believed he had been promised it. Whether the Ministry now writes down what was said at the hunting lodge, or lets Petersburg discover the omission from the newspapers, decides which empire is the injured party for the next decade."
 AUHDNC_bp_the_note_from_berlin:0 "The Note from Berlin"
 AUHDNC_bp_the_note_from_berlin_desc:0 "Berlin states, in a note whose language is chosen to be quoted, that it stands beside its ally in shining armour. Guns, staff talks and a promise arrive together. Nothing in the east can be attempted without this note, and the note is not free: it is paid for in a decade of dependence."
 AUHDNC_bp_the_ally_who_plans_to_defect:0 "The Ally Who Plans to Defect"
 AUHDNC_bp_the_ally_who_plans_to_defect_desc:0 "The Evidenzbureau reads the naval convention our ally signed with us and the staff study our ally wrote against us. Both are genuine. Knowing which one Rome means is worth an army corps on the day the Alps are crossed."
 AUHDNC_bp_the_alphabet_of_monastir:0 "The Alphabet of Monastir"
 AUHDNC_bp_the_alphabet_of_monastir_desc:0 "Lajos Thalloczy's office pays for Albanian schools, prints an Albanian alphabet and subsidises the chieftains of the north. It is a nation built as an instrument, and the instrument only works if it is used for years before it is needed."
 AUHDNC_bp_the_faculty_at_the_allys_port:0 "The Faculty at the Ally's Port"
 AUHDNC_bp_the_faculty_at_the_allys_port_desc:0 "The Italian law faculty the students rioted for at Innsbruck is granted at last, and granted at Trieste. Rome is satisfied and the irredenta loses its best grievance. The Slovenes of the Littoral, who were promised the same city, read the decree as a sentence."
 AUHDNC_bp_the_compensation_of_the_seventh_article:0 "The Compensation of the Seventh Article"
 AUHDNC_bp_the_compensation_of_the_seventh_article_desc:0 "Article VII of the alliance says neither of us may change the Balkan status quo without compensating the other. For once we intend to keep it: Rome is paid in advance, in writing, and the road south is opened by a signature instead of a mobilisation."
 AUHDNC_arm_the_cases_in_the_drawer:0 "The Cases in the Drawer"
 AUHDNC_arm_the_cases_in_the_drawer_desc:0 "The Operations Bureau is told to stop drafting for a war and start drafting for all of them. Kriegsfall I against the ally, Kriegsfall B against the Kingdom, Kriegsfall R against the east, Kriegsfall U against the counties. Each case, once filed, is a plan the army can actually execute; each case, once filed, is also a document that can be copied."
 AUHDNC_arm_the_memoranda_of_the_chief:0 "The Memoranda of the Chief"
 AUHDNC_arm_the_memoranda_of_the_chief_desc:0 "The Chief of the General Staff writes to the Crown, again, and will write again after that. Every memorandum sharpens the army and hardens the ministry against him, and the ledger of refusals ends in a resignation offered on the desk."
 AUHDNC_m_the_hunt_for_the_traitor:0 "The Hunt for the Traitor"
 AUHDNC_m_the_hunt_for_the_traitor_desc:0 "Somebody in this building sells the mobilisation timetables. The counter-espionage group begins to watch the poste restante windows of the capital and to open the letters that are never called for. It is slow, it is expensive, and only the army that polices itself will pay for it."
 AUHDNC_nav_the_battery_on_the_mountain:0 "The Battery on the Mountain"
 AUHDNC_nav_the_battery_on_the_mountain_desc:0 "A siege battery is emplaced above the Bocche and ranged on the heights that a foreign kingdom keeps guns on. From this day the Lovcen is a demand the Monarchy can make whenever it chooses, and the cheapest war in Europe is always available to us."
 AUHDNC_x_the_window_at_messina:0 "The Window at Messina"
 AUHDNC_x_the_window_at_messina_desc:0 "The earth has done what the General Staff could not: the ally's army is in the ruins of Sicily and Calabria, its fleet is carrying bread. The window is open for one hundred and fifty days. It does not ask whether the Alpine works are finished. It only remembers afterwards."
 AUHDNC_x_the_corridor_to_salonika:0 "The Corridor to Salonika"
 AUHDNC_x_the_corridor_to_salonika_desc:0 "The Sanjak line is laid, the garrisons are in the strip, and the empire to the south is convulsed by its own constitution. The road runs Uvac, Mitrovica, Skopje, Monastir, Salonika. Take it now or explain for thirty years why it was not taken."
 AUHDNC_x_the_reckoning_with_russia:0 "The Reckoning with Russia"
 AUHDNC_x_the_reckoning_with_russia_desc:0 "Petersburg is exhausted and Berlin has put its promise in writing. The Congress Kingdom of Poland is administered by a governor-general who has no soldiers to spare. There will not be a second note from Berlin, and there will not be a second Russia this weak."
 AUH_kf_the_memorandum_is_submitted:0 "Submit Another Memorandum"
 AUH_kf_the_memorandum_is_submitted_desc:0 "The Chief writes to the Crown on the necessity of the preventive war. Each memorandum trains the staff, sours the ministry, and adds a document to the safe that the traitor will eventually reach."
 AUH_kf_file_the_case_against_italy:0 "File Kriegsfall I"
 AUH_kf_file_the_case_against_italy_desc:0 "Mountain warfare, the Isonzo crossings, the Tyrolean works. Filed, it is an army that knows where it is going."
 AUH_kf_file_the_case_in_the_balkans:0 "File Kriegsfall B"
 AUH_kf_file_the_case_in_the_balkans_desc:0 "The Save and Drina crossings, the Kolubara valley, the third week. Filed, the punitive expedition becomes a campaign."
 AUH_kf_file_the_case_in_the_east:0 "File Kriegsfall R"
 AUH_kf_file_the_case_in_the_east_desc:0 "The Galician deployment, the fortress of Przemysl, the railheads at Lemberg. The most valuable case in the safe, and the one Petersburg would most like to read."
 AUH_kf_file_the_case_at_home:0 "File Kriegsfall U"
 AUH_kf_file_the_case_at_home_desc:0 "The occupation of the Hungarian counties by the common army. It is written by officers who hope it is never opened, and the Magyar deputies know it exists."
 AUH_kf_the_army_crosses_the_save:0 "Kriegsfall B: The Army Crosses the Save"
 AUH_kf_the_army_crosses_the_save_desc:0 "Execute the filed case against the Kingdom."
 AUH_kf_the_heights_are_demanded:0 "The Heights Are Demanded"
 AUH_kf_the_heights_are_demanded_desc:0 "The battery above the Bocche is ranged and the note goes to Cetinje: the guns on the Lovcen come down, or we take the mountain."
 AUH_kf_the_counties_are_occupied:0 "The Counties Are Occupied"
 AUH_kf_the_counties_are_occupied_desc:0 "Common-army garrisons move into the county seats. Order is restored and the ledger of coercion grows."
 AUH_kf_the_dossier_is_circulated:0 "Circulate the Dossier"
 AUH_kf_the_dossier_is_circulated_desc:0 "Another chancellery receives the papers, and another newspaper receives the chancellery's leak."
 AUH_kf_the_witnesses_are_bought:0 "Buy the Witnesses"
 AUH_kf_the_witnesses_are_bought_desc:0 "The forgery ledger is spent at once on testimony. Whatever the court decides, the war goal is easier to justify and the Croats have learned what our courts are for."
 AUH_kf_the_answer_to_the_powers:0 "Answer the Powers"
 AUH_kf_the_answer_to_the_powers_desc:0 "The press bureau drafts a reply for London and Paris. It costs political capital and buys back a little of the world's patience."
 AUH_kf_the_export_credit_is_renewed:0 "Renew the Export Credit"
 AUH_kf_the_export_credit_is_renewed_desc:0 "Another tranche of Pilsen guns leaves for Belgrade on Vienna's paper."
 AUH_kf_the_note_to_petersburg:0 "Send a Note to Petersburg"
 AUH_kf_the_note_to_petersburg_desc:0 "An explanation is offered before it is demanded. Russian anger falls."
 AUH_kf_the_staff_talks_with_berlin:0 "Staff Talks with Berlin"
 AUH_kf_the_staff_talks_with_berlin_desc:0 "Conrad and Moltke exchange deployments. Every conversation makes the eastern case sounder and Petersburg angrier."
 AUH_kf_the_naval_convention_is_read:0 "Read the Naval Convention"
 AUH_kf_the_naval_convention_is_read_desc:0 "The ally's own signature tells us what the ally intends. Kriegsfall I is rewritten around it."
 AUH_alb_the_schools_of_the_alphabet:0 "Fund the Albanian Schools"
 AUH_alb_the_schools_of_the_alphabet_desc:0 "Primers, teachers and one alphabet instead of three. The client is built a year at a time."
 AUH_alb_the_subsidy_to_the_chieftains:0 "Subsidise the Chieftains"
 AUH_alb_the_subsidy_to_the_chieftains_desc:0 "Rifles and silver go north from Scutari. The Sultan protests, the Kingdom protests, and the mountains remember who paid."
 AUH_alb_the_congress_at_monastir:0 "The Congress at Monastir"
 AUH_alb_the_congress_at_monastir_desc:0 "The alphabet is settled in congress under our patronage. From this day there is an Albanian nation to hand a prince to."
 AUH_kf_the_reserve_battalions_go_down:0 "Send the Reserve Battalions Down"
 AUH_kf_the_reserve_battalions_go_down_desc:0 "Fresh battalions relieve the etappen troops in the corridor. The drain eases; the manpower does not come back."
 AUH_kf_the_poste_restante_is_watched:0 "Watch the Poste Restante"
 AUH_kf_the_poste_restante_is_watched_desc:0 "The unclaimed letters of the capital are opened one by one."
 AUH_kf_the_letters_from_the_east:0 "Open the Letters from the East"
 AUH_kf_the_letters_from_the_east_desc:0 "The ministry, which does not police the army, pays twice over to have the army's post read. It has run out of other explanations."
 AUH_kf_the_riflemen_of_galicia:0 "License the Riflemen of Galicia"
 AUH_kf_the_riflemen_of_galicia_desc:0 "Pilsudski's shooting clubs are licensed as sporting associations, armed out of the Landwehr depots and drilled where the Russian consul can see them."
 AUH_kf_the_compensation_is_valued:0 "Value the Compensation"
 AUH_kf_the_compensation_is_valued_desc:0 "What Rome is owed under Article VII is settled in Albania rather than in cash, and Rome takes it."
 AUH_arm_the_cases_in_the_drawer:0 "The Cases in the Drawer"
 AUH_arm_the_cases_in_the_drawer_desc:0 "Four war plans, kept current, wargamed each spring."
 AUH_arm_the_memoranda_of_the_chief:0 "The Memoranda of the Chief"
 AUH_arm_the_memoranda_of_the_chief_desc:0 "The staff is sharpened and the cabinet is tired."
 AUH_m_the_hunt_for_the_traitor:0 "The Hunt for the Traitor"
 AUH_m_the_hunt_for_the_traitor_desc:0 "Letters are opened. Officers are watched. The building has learned to be careful."
 AUH_kf_the_case_against_italy:0 "Kriegsfall I"
 AUH_kf_the_case_against_italy_desc:0 "The plan for the Alpine front, kept current."
 AUH_kf_the_case_in_the_balkans:0 "Kriegsfall B"
 AUH_kf_the_case_in_the_balkans_desc:0 "The plan for the Save and the Drina, kept current."
 AUH_kf_the_case_in_the_east:0 "Kriegsfall R"
 AUH_kf_the_case_in_the_east_desc:0 "The plan for Galicia, kept current."
 AUH_kf_the_case_at_home:0 "Kriegsfall U"
 AUH_kf_the_case_at_home_desc:0 "The plan for the counties, kept current, and known to be kept."
 AUH_kf_the_bought_witnesses:0 "The Bought Witnesses"
 AUH_kf_the_bought_witnesses_desc:0 "A war goal is cheap when the evidence is arranged in advance. So is a scandal."
 AUH_kf_the_rifle_clubs_of_galicia:0 "The Rifle Clubs of Galicia"
 AUH_kf_the_rifle_clubs_of_galicia_desc:0 "Sporting associations with Mannlichers, drilling in the Carpathian foothills."
 AUH_alb_the_albanian_office:0 "The Albanian Office"
 AUH_alb_the_albanian_office_desc:0 "Schools, subsidies and a printing press, administered from Vienna for a country that does not yet exist."
 AUH_bp_the_circular_to_the_chancelleries:0 "The Circular to the Chancelleries"
 AUH_bp_the_circular_to_the_chancelleries_desc:0 "The case against Belgrade is now a matter of state, and the state has committed itself in print."
 AUH_bp_the_papers_from_belgrade:0 "The Papers from Belgrade"
 AUH_bp_the_papers_from_belgrade_desc:0 "The legation's bundle is in the ministry's safe. Nobody has asked where the paper was milled."
 AUH_bp_the_press_of_the_powers:0 "The Press of the Powers"
 AUH_bp_the_press_of_the_powers_desc:0 "European opinion must now be answered quarterly, and answering it costs."
 AUH_bp_the_line_to_mitrovica:0 "The Line to Mitrovica"
 AUH_bp_the_line_to_mitrovica_desc:0 "A railway through the strip, and the supply columns that follow a railway."
 AUH_bp_the_guns_on_credit:0 "The Guns on Credit"
 AUH_bp_the_guns_on_credit_desc:0 "Belgrade's batteries depend on Pilsen's spare parts."
 AUH_bp_the_bargain_at_the_straits:0 "The Bargain at the Straits"
 AUH_bp_the_bargain_at_the_straits_desc:0 "The Adriatic squadron may pass where it could not pass before."
 AUH_bp_the_note_from_berlin:0 "The Note from Berlin"
 AUH_bp_the_note_from_berlin_desc:0 "In shining armour, at a decade's interest."
 AUH_bp_the_ally_who_plans_to_defect:0 "The Ally Who Plans to Defect"
 AUH_bp_the_ally_who_plans_to_defect_desc:0 "We have read their study of us, and they have not read ours of them."
 AUH_bp_the_office_for_albania:0 "The Office for Albania"
 AUH_bp_the_office_for_albania_desc:0 "A department of the Ballhausplatz for a nation under construction."
 AUH_bp_the_faculty_at_the_port:0 "The Faculty at the Port"
 AUH_bp_the_faculty_at_the_port_desc:0 "An Italian law faculty at Trieste. The irredenta has lost its best grievance and the Slovenes have found one."
 AUH_bp_the_seventh_article:0 "The Seventh Article Honoured"
 AUH_bp_the_seventh_article_desc:0 "Compensation agreed in advance, which is the only kind that ever prevents a war."
 AUH_bp_the_peace_of_the_ballhausplatz:0 "The Peace the Ballhausplatz Wrote"
 AUH_bp_the_peace_of_the_ballhausplatz_desc:0 "A Great Power is the state that can end its own war."
 AUH_nav_the_battery_on_the_mountain:0 "The Battery on the Mountain"
 AUH_nav_the_battery_on_the_mountain_desc:0 "Ranged on the Lovcen, and everybody in Cetinje knows the elevation."
 AUH_x_the_irredenta_is_permanent:0 "The Irredenta Is Permanent"
 AUH_x_the_irredenta_is_permanent_desc:0 "There is no longer an Italian in the Monarchy who can be argued with. This does not expire."
 AUH_x_the_corridor_to_salonika:0 "The Corridor to Salonika"
 AUH_x_the_corridor_to_salonika_desc:0 "Our exporters reach the Aegean without asking anyone's leave, and our etappen troops hold four hundred kilometres of mountain."
 AUH_x_the_price_of_the_note:0 "The Price of the Note"
 AUH_x_the_price_of_the_note_desc:0 "Berlin was paid in influence, and the instalments run for a decade."
 AUH_kf_the_kingdom_of_venetia:0 "The Kingdom of Lombardy-Venetia"
 AUH_kf_the_kingdom_of_venetia_desc:0 "A Habsburg viceroy in Venice again, sixty years after the last one left."
 AUH_kf_the_indemnity_of_udine:0 "The Indemnity of Udine"
 AUH_kf_the_indemnity_of_udine_desc:0 "A straightened frontier and a payment in gold."
 AUH_kf_the_road_to_salonika:0 "The Road to Salonika"
 AUH_kf_the_road_to_salonika_desc:0 "An Austrian flag on the Aegean and a bill for it every month."
 AUH_kf_the_principality_of_albania:0 "The Principality of Albania"
 AUH_kf_the_principality_of_albania_desc:0 "The office in Vienna has produced a country, and the country has a prince."
 AUH_kf_the_crown_of_the_vistula:0 "The Crown of the Vistula"
 AUH_kf_the_crown_of_the_vistula_desc:0 "A Habsburg wears the crown of Poland. Every Pole in Galicia is now loyal and every Ruthene is now afraid."
 AUH_kf_the_army_that_lost_the_east:0 "The Army That Lost the East"
 AUH_kf_the_army_that_lost_the_east_desc:0 "It was not the plan that failed. Somebody sold the plan."
 AUH_kf_the_opening_clean:0 "The Plan Held"
 AUH_kf_the_opening_clean_desc:0 "The trains ran to the timetable and the corps closed up on schedule."
 AUH_kf_the_opening_ragged:0 "The Trains Were Late"
 AUH_kf_the_opening_ragged_desc:0 "Not a disaster. Not the timetable either."
 AUH_kf_the_opening_bad:0 "In Piecemeal"
 AUH_kf_the_opening_bad_desc:0 "The regiments went in as they arrived, which is how regiments are wasted."
 AUH_kf_the_opening_disaster:0 "The First Fortnight"
 AUH_kf_the_opening_disaster_desc:0 "The enemy was waiting where the enemy should not have known to wait."
 AUH_kf_the_false_files:0 "The False Files"
 AUH_kf_the_false_files_desc:0 "The traitor's last deliveries were written by us. The enemy has deployed against a war we are not fighting."
 AUH_kf_the_garrisons_of_the_corridor:0 "The Garrisons of the Corridor"
 AUH_kf_the_garrisons_of_the_corridor_desc:0 "Four hundred kilometres of mountain road, held battalion by battalion, paid for out of the recruit classes."
 AUH_lajos_thalloczy:0 "Lajos Thalloczy"
 AUH_bp_thalloczy_at_the_ballhausplatz:0 "Lajos Thalloczy"
 AUH_bp_thalloczy_at_the_ballhausplatz_desc:0 "Historian of the South Slavs, archivist of the common ministry, and the man who invented a nation out of a grammar."
 AUH_tb_kf_the_circular:0 "The Circular to the Chancelleries"
 AUH_tb_kf_the_legation_papers:0 "The Papers from the Legation"
 AUH_tb_kf_the_line_east:0 "The Line to Mitrovica"
 AUH_tb_kf_the_export_orders:0 "The Export Orders"
 AUH_tb_kf_the_export_credit:0 "The Export Credit"
 AUH_tb_kf_the_straits:0 "The Question of the Straits"
 AUH_tb_kf_the_note:0 "The Note from Berlin"
 AUH_tb_kf_the_ally_is_read:0 "The Ally Is Read"
 AUH_tb_kf_the_naval_convention:0 "The Naval Convention"
 AUH_tb_kf_the_alphabet:0 "The Alphabet of Monastir"
 AUH_tb_kf_the_schools:0 "The Albanian Schools"
 AUH_tb_kf_the_faculty:0 "The Faculty at Trieste"
 AUH_tb_kf_the_drawer:0 "The Cases in the Drawer"
 AUH_tb_kf_the_memoranda:0 "The Memoranda of the Chief"
 AUH_tb_kf_the_second_memorandum:0 "The Second Memorandum"
 AUH_tb_kf_the_staff_ride:0 "The Staff Ride in the Karst"
 AUH_tb_kf_the_staff_talks:0 "The Staff Talks with Berlin"
 AUH_tb_kf_the_hunt:0 "The Hunt for the Traitor"
 AUH_tb_kf_the_traitor:0 "The Traitor Named"
 AUH_tb_kf_the_verdict:0 "The Verdict at Agram"
 AUH_tb_kf_the_heights:0 "The Guns Above the Bocche"
 AUH_tb_kf_the_case_against_italy:0 "Kriegsfall I"
 AUH_tb_kf_the_case_in_the_balkans:0 "Kriegsfall B"
 AUH_tb_kf_the_case_in_the_east:0 "Kriegsfall R"
 AUH_tb_kf_the_pilsen_answer:0 "Pilsen Answers Creusot"
 AUH_tb_kf_the_strip_survey:0 "The Survey Through the Strip"
 AUH_tb_kf_the_isonzo_works:0 "The Works on the Isonzo"
 AUH_arm_schemua_at_the_staff:0 "Blasius Schemua"
 AUH_arm_schemua_at_the_staff_desc:0 "A careful chief for a ministry that has had enough of memoranda."
 AUH_kf_threat_the_circular:0 "The Circular to the Chancelleries"
 AUH_kf_threat_the_verdict:0 "The Verdict at Agram"
 AUH_kf_threat_the_scandal:0 "The Scandal in London"
 AUH_kf_threat_the_answer_to_the_powers:0 "The Answer to the Powers"
 AUH_kf_threat_the_answer_to_petersburg:0 "The Answer to Petersburg"
 AUH_kf_threat_the_peace_is_written:0 "The Peace the Ballhausplatz Wrote"
 AUH_kf_threat_the_line_east:0 "The Railway Through the Sanjak"
 AUH_kf_threat_the_seventh_article:0 "The Compensation of the Seventh Article"
 AUH_kf_threat_the_faculty:0 "The Faculty at Trieste"
 AUH_kf_threat_the_case_in_the_balkans:0 "Kriegsfall B Executed"
 AUH_kf_threat_the_corridor:0 "The Corridor to Salonika"
 AUH_kf_threat_the_corridor_held:0 "The Sanjak Annexed"
 AUH_kf_threat_the_aegean:0 "An Austrian Flag on the Aegean"
 AUH_kf_threat_the_principality:0 "The Principality of Albania"
 AUH_kf_threat_the_kingdom_restored:0 "Lombardy-Venetia Restored"
 AUH_kf_threat_the_reckoning:0 "The Reckoning with Russia"
 AUH_kf_threat_the_crown_of_the_vistula:0 "The Crown of the Vistula"
 AUH_kf_threat_the_border_provinces:0 "The Border Provinces Taken"
 AUH_kf_threat_the_league:0 "The League of the Balkans"
 AUH_alb_threat_the_office:0 "The Albanian Office"
 AUH_alb_threat_the_subsidy:0 "The Subsidy to the Chieftains"
 AUH_alb_threat_the_congress:0 "The Congress at Monastir"
 AUH_kf_conduct_no_army_bill_tt:0 "§RThe army bill has not passed:§! the establishment that marches is the one the Delegations voted in 1889."
 AUH_kf_conduct_frozen_contingent_tt:0 "§RThe recruit contingent is still frozen:§! the classes called are the classes of a smaller empire."
 AUH_kf_conduct_no_case_i_tt:0 "§RKriegsfall I was never filed:§! the corps will improvise the Alpine deployment."
 AUH_kf_conduct_no_case_b_tt:0 "§RKriegsfall B was never filed:§! the Save crossings will be arranged in the field."
 AUH_kf_conduct_no_case_r_tt:0 "§RKriegsfall R was never filed:§! the Galician railheads have no timetable."
 AUH_kf_conduct_no_bastion_tt:0 "§RThe Galician works were never built:§! there is nothing behind the field army."
 AUH_kf_conduct_open_alps_tt:0 "§RNeither the Tyrolean works nor the mountain brigades exist:§! the frontier is open in both directions."
 AUH_kf_circular_opens_the_ladder_tt:0 "The case against Belgrade passes from the county prosecutors to the Ballhausplatz; the dossier may now be circulated at will."
 AUH_kf_legation_papers_tt:0 "The legation's bundle enters the ministry's safe, and the circular carries twice the weight."
 AUH_kf_courtroom_dice_tt:0 "The court at Agram will reach a verdict within the month. What it finds depends on how well the papers were made."
 AUH_kf_dossier_upgraded_tt:0 "The legation's papers make the dossier heavier."
 AUH_kf_press_office_tt:0 "The press bureau may now answer the Powers."
 AUH_kf_london_reads_the_forgery_tt:0 "London has the forgery, in order, with names."
 AUH_kf_london_reads_the_case_tt:0 "London has the case, and finds it dull, which is the best outcome available."
 AUH_kf_sanjak_line_tt:0 "The Sanjak line is built: the corridor to Salonika may be opened."
 AUH_kf_etappen_raised_tt:0 "Two etappen brigades are raised for the strip."
 AUH_kf_export_credit_tt:0 "The Kingdom's artillery orders may be renewed on Vienna's credit."
 AUH_kf_pilsen_has_the_order_tt:0 "Pilsen has the order; the Bohemian works are content."
 AUH_kf_straits_office_tt:0 "Petersburg may now be answered by note before it is answered by mobilisation."
 AUH_kf_straits_honest_tt:0 "The conversation at the hunting lodge is written down. Petersburg is owed nothing it did not receive."
 AUH_kf_straits_deceived_tt:0 "Petersburg learns from the newspapers what it believed it had been promised."
 AUH_kf_petersburg_notices_tt:0 "Petersburg notices."
 AUH_kf_anger_exists_tt:0 "There is something in Petersburg to answer."
 AUH_kf_anger_down_tt:0 "Petersburg is, for the moment, answered."
 AUH_kf_berlin_cover_tt:0 "Berlin's note is on file. Nothing may be attempted in the east without it."
 AUH_kf_berlin_talks_up_tt:0 "Another deployment is exchanged with the German staff."
 AUH_kf_the_germans_are_pleased_tt:0 "The German notables read the note aloud in the Chamber."
 AUH_kf_prague_reads_berlin_tt:0 "Prague reads the note and understands which capital the Monarchy now belongs to."
 AUH_kf_ally_is_read_tt:0 "The ally's naval convention may now be read against the ally."
 AUH_kf_italy_forewarned_tt:0 "Kriegsfall I is rewritten around what Rome actually intends."
 AUH_kf_albania_office_tt:0 "The Albanian Office is opened: schools, subsidies and a congress."
 AUH_kf_thalloczy_tt:0 "Lajos Thalloczy may be called to the common ministry."
 AUH_kf_faculty_reconciles_tt:0 "The window at Messina closes. There will be no war with the ally."
 AUH_kf_the_slovenes_of_the_port_tt:0 "The Slovenes of the Littoral were promised that city first."
 AUH_kf_seventh_article_tt:0 "Rome is compensated in advance; the road south may be opened by signature."
 AUH_kf_compensation_settled_tt:0 "The compensation is settled in Albania. Rome will not object to a principality."
 AUH_kf_drawer_open_tt:0 "The four Kriegsfaelle may now be filed."
 AUH_kf_the_shed_is_funded_tt:0 "The mortar in the shed is funded out of the same estimate."
 AUH_kf_memoranda_open_tt:0 "The Chief may submit memoranda to the Crown."
 AUH_kf_the_chief_is_conrad_tt:0 "The Chief is Conrad, and the memoranda will not stop."
 AUH_kf_the_chief_is_not_conrad_tt:0 "The Chief is a careful man, and writes carefully."
 AUH_kf_memorandum_filed_tt:0 "Another memorandum enters the ledger of refusals."
 AUH_kf_memoranda_shelved_tt:0 "The ledger of refusals is thinned."
 AUH_kf_frustration_tt:0 "The staff is told to wait, and does not wait quietly."
 AUH_kf_the_chief_goes_tt:0 "The Chief of the General Staff leaves the building."
 AUH_kf_case_i_filed_tt:0 "Kriegsfall I is filed."
 AUH_kf_case_b_filed_tt:0 "Kriegsfall B is filed."
 AUH_kf_case_r_filed_tt:0 "Kriegsfall R is filed."
 AUH_kf_case_u_filed_tt:0 "Kriegsfall U is filed, and the counties hear that it exists."
 AUH_kf_hunt_open_tt:0 "The poste restante of the capital may now be watched."
 AUH_kf_the_ruthenes_are_watched_tt:0 "The Ruthene societies are watched along with everybody else."
 AUH_kf_the_letters_are_opened_tt:0 "The unclaimed letters are opened."
 AUH_kf_the_traitor_is_named_tt:0 "The traitor is named, arrested and tried. The building is clean."
 AUH_kf_the_revolver_tt:0 "A revolver is left on the table in the Hotel Klomser, and the file is closed without a trial."
 AUH_kf_the_envelope_waits_tt:0 "The envelope was never called for. The watchers go home."
 AUH_kf_smoke_filed_tt:0 "The report is filed with the others."
 AUH_kf_lovcen_open_tt:0 "The heights above the Bocche may now be demanded."
 AUH_kf_siege_battery_tt:0 "A siege battery is emplaced above the Bocche."
 AUH_kf_the_exporters_want_the_aegean_tt:0 "The exporters of the kingdom want the Aegean and say so loudly."
 AUH_kf_corridor_relieved_tt:0 "The garrisons of the corridor are relieved."
 AUH_kf_corridor_drain_exists_tt:0 "The corridor is bleeding battalions."
 AUH_kf_corridor_taken_tt:0 "The Sanjak is annexed and garrisoned. It will be garrisoned for as long as it is held."
 AUH_kf_corridor_garrisoned_tt:0 "The strip is held battalion by battalion."
 AUH_kf_salonika_taken_tt:0 "The road runs to the Aegean, and so does the bill."
 AUH_kf_albania_puppet_tt:0 "The Principality of Albania is proclaimed under our protection."
 AUH_kf_the_prince_is_installed_tt:0 "The prince is installed and the office in Vienna sends his household."
 AUH_kf_durazzo_tt:0 "Durazzo receives its prince, and the mountains receive their subsidies as before."
 AUH_kf_congress_poland_tt:0 "The Congress Kingdom is restored under a Habsburg crown."
 AUH_kf_border_states_only_tt:0 "Without the classes to hold it, the Monarchy takes what it can garrison: Lublin and Bialystok."
 AUH_kf_galicia_lost_tt:0 "Tarnopol and Przemysl pass to Russia."
 AUH_kf_the_east_is_abandoned_tt:0 "Every Pole and every Ruthene in the Monarchy has watched the army leave."
 AUH_kf_the_scar_in_the_east_tt:0 "The eastern crownlands will not be spoken to on the old terms again."
 AUH_kf_the_line_is_held_tt:0 "The line is held on the San, and paid for out of the recruit classes of two years."
 AUH_kf_prestige_up_tt:0 "The House gains in standing."
 AUH_kf_prestige_down_tt:0 "The House loses in standing."
 AUH_kf_ballhausplatz_era_end_tt:0 "The reign of the Ballhausplatz is closed with a treaty."
 AUH_kf_the_irredenta_is_not_written_away_tt:0 "The irredenta cannot be written away by a treaty that never mentions it."
 AUH_kf_the_irredenta_is_bought_off_tt:0 "The irredenta is bought off at the price of the war's whole purpose."
 AUH_kf_the_littoral_is_answered_tt:0 "The Slovenes of the Littoral read the new frontier as a promise kept."
 AUH_kf_the_classes_are_called_tt:0 "The classes are called, the depots are opened, and the reserve stocks go forward with the corps."
 AUH_kf_the_peace_dividend_tt:0 "The estimates return to the civil ministries, and the works that were shelved for the war are begun."
 AUH_kf_the_depots_are_stocked_tt:0 "The depots are stocked to the establishment the four cases assume."
 AUH_kf_opening_attrition_tt:0 "The first weeks are paid for out of the depots."
 AUH_kf_creusot_takes_it_tt:0 "Creusot takes the order, and Paris takes the Kingdom."
 AUH_kf_sofia_is_bought_tt:0 "Sofia is bought out of the league before the league is signed."
 AUH_kf_petersburg_mobilises_tt:0 "Petersburg mobilises the Kiev and Warsaw districts."
 AUH_kf_the_clubs_are_licensed_tt:0 "The shooting clubs are licensed, armed and drilled."
 AUH_kf_the_clubs_are_closed_tt:0 "The shooting clubs are closed and the organisers are deported."
 AUH_alb_client_up_tt:0 "The Albanian client is a year further built."
 AUH_alb_client_ready_tt:0 "The Albanian client is built enough to hold a congress."
 AUH_alb_rifles_go_south_tt:0 "Rifles leave the Landwehr depots for the northern mountains."
 AUH_alb_the_congress_is_quiet_tt:0 "The congress is held quietly and the Sultan is told it was a literary society."
 AUH_x_messina_window_tt:0 "§YThe window at Messina is open for 150 days.§!"
 AUH_x_messina_conrad_tt:0 "A chief of staff who will sign the order"
 AUH_x_messina_cover_tt:0 "Cover for the war: Berlin's note, an alliance already priced, the ally's own plans in our hands, or an ally who has stopped pretending"
 AUH_x_messina_irredenta_cost_tt:0 "There will never again be an Italian in the Monarchy who can be argued with."
 AUH_x_messina_littoral_tt:0 "The Slovene deputies of the Littoral are not consulted about a war fought over their coast."
 AUH_x_salonika_window_tt:0 "§YThe window at Salonika is open for 180 days.§!"
 AUH_x_salonika_convulsion_tt:0 "The empire to the south is convulsed by its own constitution"
 AUH_x_salonika_ready_tt:0 "The strip is garrisoned, or the provinces are ours"
 AUH_x_salonika_cover_tt:0 "Cover for the war: the Seventh Article paid, Berlin's note, or an ally content to look away"
 AUH_x_russia_window_tt:0 "§YThe window in the east is open for 120 days.§!"
 AUH_x_russia_cover_tt:0 "§RThe note from Berlin.§! Without it there is no war in the east, only a war with Europe."
 AUH_x_russia_moment_tt:0 "Russia at war or at the end of her patience, or the crown of the Vistula already claimed"
 AUH_x_russia_ruthenes_tt:0 "The Ruthene benches understand exactly whose crown is being carried east."
 AUH_x_russia_poles_tt:0 "The Polish Club has waited a century for this sentence."
 auh_clock.280.t:0 "The First Memorandum Is Refused"
 auh_clock.280.d:0 "The Chief's paper on the preventive war goes to the Crown and comes back with a marginal note in the old hand: not now, and not in these terms. The Chief reads it aloud to his section heads, which is not what one does with a marginal note from the Emperor."
 auh_clock.280.a:0 "File it and write the next one."
 auh_clock.280.b:0 "Let the staff know exactly who refused."
 auh_clock.281.t:0 "The Second Refusal"
 auh_clock.281.d:0 "The second memorandum is more detailed, better argued and refused faster. The Ministry of War begins to keep a separate folder for correspondence with the General Staff, which is how a ministry says it expects a fight."
 auh_clock.281.a:0 "The staff work is not wasted."
 auh_clock.281.b:0 "Order the folder closed."
 auh_clock.282.t:0 "The Chief Writes to the Heir"
 auh_clock.282.d:0 "Refused by the Crown, the Chief begins to send his memoranda to the Belvedere instead. The old man in Schoenbrunn learns of it within a week, as he learns of everything, and says nothing, which is worse."
 auh_clock.282.a:0 "Let him write to whom he pleases."
 auh_clock.282.b:0 "Forbid the correspondence."
 auh_clock.283.t:0 "The Chief Offers His Resignation"
 auh_clock.283.d:0 "Twelve memoranda, twelve refusals. The Chief of the General Staff puts his resignation on the desk and says he will not command an army that is forbidden to plan. Everyone in the room knows he expects to be refused."
 auh_clock.283.a:0 "Refuse the resignation. Give him his memoranda."
 auh_clock.283.b:0 "Accept it. The army will survive him."
 auh_clock.284.t:0 "The Court Believes the Papers"
 auh_clock.284.d:0 "The court at Agram finds the documents genuine and the accused guilty. The Kingdom's ministry is convicted in absentia of paying our own subjects to conspire. Whether this is true is now a settled question of law."
 auh_clock.284.a:0 "The verdict is read in every chancellery."
 auh_clock.285.t:0 "The Papers Are Shown to Be False"
 auh_clock.285.d:0 "A Prague professor takes the documents apart in open court: the paper, the typewriter, the dates on which the named men were demonstrably elsewhere. The forgery is not merely proved, it is proved to have been bought by a ministry."
 auh_clock.285.a:0 "Admit it. Vacate the convictions."
 auh_clock.285.b:0 "Blame the clerk who bought them."
 auh_clock.286.t:0 "The Scandal Reaches London"
 auh_clock.286.d:0 "The Times prints the Agram papers over three columns, with the professor's analysis and a leader on the methods of Habsburg justice. In the Reichsrat a deputy reads the leader aloud in German translation until he is ruled out of order."
 auh_clock.286.a:0 "The press bureau will answer."
 auh_clock.286.b:0 "So that is how they govern."
 auh_clock.287.t:0 "A Report from the Eastern Desk"
 auh_clock.287.d:0 "The Evidenzbureau files a note: a Russian military attache has asked, in conversation, about a railway detail that appears in only one document, and that document has not left this building. The note is filed. Nobody draws a conclusion from a single conversation."
 auh_clock.287.a:0 "File it."
 auh_clock.287.b:0 "File it, and note who had the document."
 auh_clock.288.t:0 "The Poste Restante Answers"
 auh_clock.288.d:0 "An envelope addressed to Nikon Nizetas is called for at last. The man who calls for it is a colonel of the General Staff, and the money in the envelope came from Warsaw. He is followed to his hotel."
 auh_clock.288.a:0 "Arrest him. Try him in open court."
 auh_clock.288.b:0 "Leave a revolver on the table and close the file."
 auh_clock.289.t:0 "The Envelope Was Never Called For"
 auh_clock.289.d:0 "Six weeks of watching a post office window. The envelope sits behind the grille, unclaimed, and is eventually returned to a sender who does not exist. The detectives are paid and sent home."
 auh_clock.289.a:0 "Try again in the spring."
 auh_clock.290.t:0 "The Staff Ride in the Karst"
 auh_clock.290.d:0 "The Operations Bureau takes the four cases into the field: two days of riding the Isonzo crossings with map boards, an argument about the Tyrolean flank conducted at a trot, and an evening in which a major explains to a general why Kriegsfall B fails in its third week."
 auh_clock.290.a:0 "Let the major finish."
 auh_clock.290.b:0 "Write the argument into the case."
 auh_clock.291.t:0 "The Congress at Monastir"
 auh_clock.291.d:0 "Fifty delegates, three alphabets and our money. They leave with one alphabet, a school committee and a printed resolution thanking a foreign power for its interest in Albanian letters. The Sultan's governor attends and applauds, having no other option."
 auh_clock.291.a:0 "Print the resolution everywhere."
 auh_clock.291.b:0 "Keep it out of the newspapers."
 auh_clock.292.t:0 "The Peace with Italy"
 auh_clock.292.d:0 "The ally is beaten and the Ballhausplatz must decide what beating an ally was for. On the table: a restored kingdom under a Habsburg viceroy, a straightened frontier with a gold indemnity, or the alliance patched up and the whole thing called a misunderstanding."
 auh_clock.292.a:0 "Restore the Kingdom of Lombardy-Venetia."
 auh_clock.292.b:0 "Take the Isonzo frontier and the indemnity."
 auh_clock.292.c:0 "Patch the alliance. Give it all back."
 auh_clock.293.t:0 "The Viceroy Takes His Oath in Venice"
 auh_clock.293.d:0 "The oath is taken in the Doge's palace before a congregation of officials brought in by train, and the crowd outside is held back by our own gendarmerie. The kingdom exists. Whether it has subjects is a question for the next reign."
 auh_clock.293.a:0 "It exists. That is enough for today."
 auh_clock.294.t:0 "The Frontier at the Isonzo"
 auh_clock.294.d:0 "Gorizia to the sea, the crossings in our hands, and a payment in gold that covers rather more than the campaign cost. The frontier is defensible for the first time since 1866."
 auh_clock.294.a:0 "Survey the new works."
 auh_clock.295.t:0 "The Alliance Is Patched"
 auh_clock.295.d:0 "The treaty of alliance is renewed with a supplementary protocol and no territorial change whatever. The General Staff is informed by telegram. The General Staff does not reply."
 auh_clock.295.a:0 "Renew it and say nothing more."
 auh_clock.296.t:0 "Rome Reads the Terms"
 auh_clock.296.d:0 "The terms are read in the Chamber in Rome. What follows is not a debate."
 auh_clock.296.a:0 "This will be remembered."
 auh_clock.297.t:0 "Creusot Underbids Pilsen"
 auh_clock.297.d:0 "The Kingdom's artillery commission takes the French quick-firer and the French terms. Pilsen can match the gun but not the credit, and the credit is a political instrument, not a commercial one."
 auh_clock.297.a:0 "Match the French terms out of the treasury."
 auh_clock.297.b:0 "Let them buy French. Let them also buy French shells."
 auh_clock.299.t:0 "The Note from Petersburg"
 auh_clock.299.d:0 "The Russian ambassador reads a note that is not, technically, an ultimatum. It observes that the Monarchy has taken a series of steps in the Balkans without consultation, lists them by date, and asks what further steps are contemplated."
 auh_clock.299.a:0 "Answer it fully, and in writing."
 auh_clock.299.b:0 "Answer that we contemplate what we please."
 auh_clock.300.t:0 "The League of the Balkans"
 auh_clock.300.d:0 "Belgrade, Sofia, Athens and Cetinje have found the one thing they can agree on. The treaties are secret and we have three of the four texts within a month."
 auh_clock.300.a:0 "Then we know what we face."
 auh_clock.300.b:0 "Buy Sofia out of it."
 auh_clock.301.t:0 "The Road Through the Strip"
 auh_clock.301.d:0 "The engineers report from Uvac: a metre-gauge line, forty tunnels, and a grade that will need pusher locomotives for the next fifty years. It will be finished. Everything in that strip is finished eventually, at three times the estimate."
 auh_clock.301.a:0 "Pay the three times."
 auh_clock.302.t:0 "The Peace in the South"
 auh_clock.302.d:0 "The Ottoman army has broken in the Vardar valley and the Ballhausplatz must decide how much of a corridor a Great Power can actually hold. Everything on this list is garrisoned by our own recruit classes for as long as we keep it."
 auh_clock.302.a:0 "The Sanjak, annexed and garrisoned."
 auh_clock.302.b:0 "All the way. Skopje, Monastir, Salonika."
 auh_clock.302.c:0 "A principality for Albania under our protection."
 auh_clock.302.e:0 "White peace. We have proved the point."
 auh_clock.303.t:0 "The Corridor Is Ours"
 auh_clock.303.d:0 "Four hundred kilometres of mountain road, six garrison towns and a metre-gauge railway that freezes in February. The Bosnian regiments take the strip because the Bosnian regiments are the only ones who want it."
 auh_clock.303.a:0 "Garrison it properly."
 auh_clock.304.t:0 "The Road to Salonika"
 auh_clock.304.d:0 "The harbour master at Salonika reports to Vienna. The exporters of Budapest, who have wanted this since the Ausgleich, discover that they now share a frontier with Greece and an opinion with the General Staff."
 auh_clock.304.a:0 "Open the port to our flag."
 auh_clock.305.t:0 "The Principality of Albania"
 auh_clock.305.d:0 "The office in Vienna has produced a country: a flag, an alphabet, a gendarmerie officered by our majors, and a prince who will arrive by cruiser. It is the most complete thing the Ballhausplatz has built in thirty years."
 auh_clock.305.a:0 "Send the cruiser."
 auh_clock.306.t:0 "The Powers Convene at London"
 auh_clock.306.d:0 "An Austrian flag on the Aegean has concentrated European attention as nothing since Berlin. The conference will sit for months and change nothing, and every delegate knows it."
 auh_clock.306.a:0 "We will attend. We will not concede."
 auh_clock.306.b:0 "This cannot be allowed to stand."
 auh_clock.307.t:0 "Petersburg Answers the Mobilization"
 auh_clock.307.d:0 "The Kiev and Warsaw districts are called up within four days of our own order. The Russian machine is slower than ours and very much larger, and the second fact matters more than the first after the sixth week."
 auh_clock.307.a:0 "Then the sixth week is the whole war."
 auh_clock.308.t:0 "The Peace with Russia"
 auh_clock.308.d:0 "The Russian plenipotentiaries have arrived at Brest with instructions to concede Poland and nothing else. What the Monarchy can take away from the table depends entirely on what it can garrison, and what it can garrison depends on a military law passed years ago."
 auh_clock.308.a:0 "The Congress Kingdom, under a Habsburg crown."
 auh_clock.308.b:0 "Lublin and Bialystok. What we can hold."
 auh_clock.308.c:0 "An indemnity and the old frontier."
 auh_clock.309.t:0 "The Army Is Thrown Back from the San"
 auh_clock.309.d:0 "The Russian offensive found our deployment where the deployment was, not where it should have been guessed to be. Przemysl is invested, Tarnopol is gone, and in the officers' messes the same question is asked in the same lowered voice."
 auh_clock.309.a:0 "Sue for peace. Give up the eastern crownlands."
 auh_clock.309.b:0 "Hold the San with the next two classes."
 auh_clock.310.t:0 "The Mail Train at Bezdany"
 auh_clock.310.d:0 "The riflemen we licensed have stopped a Russian mail train at Bezdany and taken two hundred thousand roubles from it. Their commander sends a share to the Landwehr depot that armed him, with his compliments, which is either a joke or a receipt."
 auh_clock.310.a:0 "Take the share. Ask no questions."
 auh_clock.310.b:0 "Close the clubs before Petersburg does it for us."
 auh_clock.311.t:0 "The Riflemen March East"
 auh_clock.311.d:0 "A second brigade forms at Krakow out of students, foresters and men who will not say where they served before. They march east under our flag and their own eagle, and every one of them expects the second flag to outlast the first."
 auh_clock.311.a:0 "Let them carry both."
 auh_clock.312.t:0 "The Prince Takes the Palace at Durazzo"
 auh_clock.312.d:0 "The prince lands, the gendarmerie presents arms, and the chieftains of the north arrive to be paid in person, as they have been paid for six years. Nothing about the arrangement has changed except the letterhead."
 auh_clock.312.a:0 "Nothing needed to change."
 auh_clock.313.t:0 "Venice Under the Eagles"
 auh_clock.313.d:0 "The double eagle is over the Piazza San Marco for the first time since 1866. Europe is informed that this is a restoration and not a conquest, and Europe declines to make the distinction."
 auh_clock.313.a:0 "A restoration."
 auh_clock.313.b:0 "A conquest."
 auh_clock.314.t:0 "A Habsburg on the Vistula"
 auh_clock.314.d:0 "The crown of Poland, vacant since the partitions, is placed on a Habsburg head by a coronation diet summoned for the purpose. Three empires partitioned that kingdom. One of them has now un-partitioned it, at the expense of another."
 auh_clock.314.a:0 "A hundred and twenty years is not so long."
 auh_clock.314.b:0 "This overturns the whole eastern settlement."
 auh_clock.315.t:0 "The Plan Holds"
 auh_clock.315.d:0 "The trains ran to the timetable. The corps closed up on the frontier within nine days of the order, the ammunition columns were where the map said they would be, and the first engagement was fought by an army that knew where its flanks were. The staff work of six years is spent in a fortnight and it was worth every crown."
 auh_clock.315.a:0 "This is what the estimates bought."
 auh_clock.316.t:0 "The Trains Are Late"
 auh_clock.316.d:0 "Not a disaster. Two of the four railheads are congested, one corps arrives without its bridging train, and a brigade spends a day marching in the wrong direction because a filed order was three years out of date. The line forms. It forms two days late."
 auh_clock.316.a:0 "Two days is survivable."
 auh_clock.317.t:0 "The Regiments Go In Piecemeal"
 auh_clock.317.d:0 "There was no filed case for this and it shows. The regiments are fed into the fighting as they detrain, in the order they detrain, against a position nobody has reconnoitred. The depots are stripped in a fortnight to replace what a fortnight cost."
 auh_clock.317.a:0 "Stop the attacks. Reorganize."
 auh_clock.318.t:0 "The Disaster of the First Fortnight"
 auh_clock.318.d:0 "The enemy was waiting on ground he had no business knowing about, in strength he had no business having there, and our corps went in against him under a plan that was obsolete before the first train moved. Three divisions are wrecked. The despatches use the word regrettable."
 auh_clock.318.a:0 "Somebody will answer for this."
 auh_clock.319.t:0 "The False Files"
 auh_clock.319.d:0 "Since the colonel was taken, the documents he was selling have been written for him by the Evidenzbureau. The enemy has deployed with great precision against a campaign the Monarchy has no intention of fighting."
 auh_clock.319.a:0 "Let him keep sending."
 AUH_dnc_public_works_cat:0 "The Public Works"
 AUH_dnc_public_works_cat_desc:0 "The strain on the treasury stands at §[GetAUH_strainColor][?AUH_treasury_strain|0]§! of 100 — §[GetAUH_strainColor][GetAUH_strainBand]§!.\n\nThresholds: §Y30§! the bond spread, §Y50§! the Delegations balk, §R70§! the pre-panic. §[GetAUH_projectsLiveColor][?AUH_eco_projects_live|0]§! programmes are open, and every open programme adds to the strain each quarter. Every bell of the reign that is rung while two or more are open is paid for out of the same purse.\n\nThe canal law stands at §Y[?AUH_canal_years|0]§! of the five years of appropriation the spine needs."
 AUHDNC_eco_the_waterways_act:0 "The Waterways Act"
 AUHDNC_eco_the_waterways_act_desc:0 "Koerber's law of 1901 authorised four canals and the regulation of the rivers behind them, and then the Delegations starved it a year at a time until the ministry that had written it was gone. The law is not repealed. It is only unfunded. We will fund it, and the treasury will feel every year of it."
 AUHDNC_eco_the_canal_to_the_oder:0 "The Canal to the Oder"
 AUHDNC_eco_the_canal_to_the_oder_desc:0 "From the Danube at Vienna over the Moravian gate to the Oder at Ostrau, and the coal of the black country floats instead of paying the railway. The cut at Prerau is the hard part; the shareholders of the Nordbahn will fight every kilometre of it, because a barge does not need their rails."
 AUHDNC_eco_the_canal_to_the_moldau:0 "The Canal to the Moldau"
 AUHDNC_eco_the_canal_to_the_moldau_desc:0 "The Danube to the Moldau and the Moldau canalised to Prague, so that a Bohemian barge can reach the Black Sea without breaking bulk. Prague gets a river quay and a depot behind it, and the Bohemian clubs get the one thing Vienna has never yet given them without being asked twice: a public work built in Bohemia for Bohemia."
 AUHDNC_eco_the_spine_of_the_monarchy:0 "The Spine of the Monarchy"
 AUHDNC_eco_the_spine_of_the_monarchy_desc:0 "Both cuts are open, the appropriations have run their five years, and the water road runs from the Adriatic tributaries to the Oder without a break. History stopped this at the surveys. We did not. The realm now has one thing that crosses every crownland and belongs to none of them."
 AUHDNC_eco_the_consortium_of_the_ring:0 "The Consortium of the Ring"
 AUHDNC_eco_the_consortium_of_the_ring_desc:0 "The Creditanstalt gathers the houses of the Ring into a standing syndicate: one signature, one rate, and a hundred days from the asking to the money. It is the cheapest capital in the realm and the most expensive kind of friend, because a syndicate that underwrites a battleship also underwrites an opinion about who should be minister."
 AUHDNC_eco_the_tunnels_through_the_tauern:0 "The Tunnels Through the Tauern"
 AUHDNC_eco_the_tunnels_through_the_tauern_desc:0 "Karl Wurmb drove the Arlberg and he will drive this: eight kilometres under the Hohe Tauern, from Salzburg to Carinthia, on the way to the sea that does not pass through Hungarian hands. The mountain is granite where the surveys promised schist, and there is water in it."
 AUHDNC_eco_the_karawanken_and_the_wocheiner:0 "The Karawanken and the Wocheiner"
 AUHDNC_eco_the_karawanken_and_the_wocheiner_desc:0 "The second and third bores of the new Alpine railway: under the Karawanken into Carniola, and under the Wocheiner ridge down the Isonzo to the coast. The Slovene lands get a trunk line through them instead of around them, and a Slovene stationmaster in a Slovene valley."
 AUHDNC_eco_the_sudbahn_in_the_states_hands:0 "The Südbahn in the State's Hands"
 AUHDNC_eco_the_sudbahn_in_the_states_hands_desc:0 "The last great private network in the western half, held by a Paris and Frankfurt board that has taken its dividend out of the Semmering for sixty years. We buy it. The shareholders will be paid, the treasury will feel it, and Budapest will ask within the year what the Kingdom's share of the purchase is going to be."
 AUHDNC_eco_the_harbour_of_trieste:0 "The Harbour of Trieste"
 AUHDNC_eco_the_harbour_of_trieste_desc:0 "The new mountain railways come down to a port that was built for sailing ships. The moles are lengthened, the basin dredged, the free-port régime confirmed, and the Austrian Lloyd is given the eastern lines it has asked for since the canal at Suez opened. Two roads now reach the sea, and neither of them can be closed by the other capital."
 AUHDNC_eco_gods_own_city_hall:0 "God's Own City Hall"
 AUHDNC_eco_gods_own_city_hall_desc:0 "The Mayor of Vienna municipalised the gas, the trams and the electricity, brought a second spring of mountain water into the city, and declared a green belt no builder may touch. He also made the ugliest speeches in the Reichsrat, and the Crown will be signing his estimates, not his sermons."
 AUHDNC_eco_the_city_on_the_danube_answers:0 "The City on the Danube Answers"
 AUHDNC_eco_the_city_on_the_danube_answers_desc:0 "If Vienna builds, Budapest builds. István Bárczy takes the Town Hall on the other bank with a programme of schools, housing and municipal works that will be finished faster than Vienna's, because the Kingdom intends it to be seen to be finished faster."
 AUHDNC_eco_the_three_phase_railway:0 "The Three-Phase Railway"
 AUHDNC_eco_the_three_phase_railway_desc:0 "Kálmán Kandó at the Ganz works has built a locomotive that takes three-phase current straight off the line, and the Hungarian trunks are the place to prove it. If it runs, the Kingdom will be hauling its own trains on its own current before anyone west of the Leitha has ordered the first machine."
 AUHDNC_eco_the_gushers_of_boryslaw:0 "The Gushers of Borysław"
 AUHDNC_eco_the_gushers_of_boryslaw_desc:0 "The Carpathian field between Borysław and Drohobycz is the third-largest oil field on earth and it is being worked like a gold rush — wooden derricks shoulder to shoulder, no casing, no cadastre, and a fire every spring. The Crown can lease it to the refiners or regulate it. The wells will pay either way. The men who sink them will not."
 AUHDNC_eco_the_institute_of_radium:0 "The Institute of Radium"
 AUHDNC_eco_the_institute_of_radium_desc:0 "The pitchblende of Joachimsthal is the only source of radium in Europe, and it has been going out of the realm as tailings for a decade. The Academy gets its institute in Vienna, the mine gets a licence office, and the export of the ore stops being a favour and becomes a price."
 auh_clock.200.t:0 "The Memorandum on the Order of the Works"
 auh_clock.200.d:0 "The section chief lays the file on the desk: four canals, one treasury, and no year in which all four can be begun. The Oder cut serves the coal and pays first. The Moldau cut serves Bohemia and pays in politics. To begin everything at once is what the law actually says, and what no finance minister has ever permitted."
 auh_clock.200.a:0 "The Oder first — coal pays for canals."
 auh_clock.200.b:0 "The Moldau first — Prague is owed a public work."
 auh_clock.200.c:0 "The law says four. Begin four."
 auh_clock.201.t:0 "The Cut at Prerau"
 auh_clock.201.d:0 "The gate between the Danube and the Oder is open, and the first barge train of Ostrau coal has come down to the Moravian yards at a third of the rail tariff. The Nordbahn board has written to the ministry about it. The letter is not friendly."
 auh_clock.201.a:0 "Put the saving into the basin."
 auh_clock.201.b:0 "The syndicate will double it."
 auh_clock.202.t:0 "The Quay at Prague"
 auh_clock.202.d:0 "The Moldau is canalised to the city and the new river quay is finished below the Hradčany. The Bohemian clubs have arrived to be photographed on it, and the German deputies of Prague have arrived to be photographed not being on it."
 auh_clock.202.a:0 "A depot behind the quay, and no speeches."
 auh_clock.202.b:0 "Let the Bohemian clubs have their day."
 auh_clock.203.t:0 "The Water Road Is Open"
 auh_clock.203.d:0 "From the Oder to the lower Danube without breaking bulk. Koerber died out of office believing the law he wrote had been buried by the estimates; the barge masters now call the whole run the spine, and it is the only thing built in this reign that crosses every crownland and is claimed by none of them."
 auh_clock.203.a:0 "Let it be worked, and let it be counted."
 auh_clock.204.t:0 "The Works Resume"
 auh_clock.204.d:0 "The suspension has run its term. The huts are reopened, the contractors re-engaged at the new price, and the section chief has the grace not to say aloud what the stoppage cost."
 auh_clock.204.a:0 "Begin again."
 auh_clock.205.t:0 "The Works Reach the Dniester"
 auh_clock.205.d:0 "The Galician branch of the law — the one nobody in Vienna expected to see cut — reaches the Dniester. The Polish club had asked for it for form's sake. The Ruthene deputies had not asked at all, and are the more surprised of the two."
 auh_clock.205.a:0 "The crownland is on the water road."
 auh_clock.206.t:0 "The Nordbahn Shares Are Sold"
 auh_clock.206.d:0 "The Crown's holding in the Kaiser Ferdinands-Nordbahn goes to the Ring at a price the newspapers call sensible and the court calls a confession. The treasury breathes. The dynasty has sold the first railway in the realm, the one that carried the Emperor's grandfather, and everyone has noticed."
 auh_clock.206.a:0 "The books first, the name second."
 auh_clock.207.t:0 "The Loan Falls Due"
 auh_clock.207.d:0 "The hundred days are up and the syndicate would like to discuss the renewal. There is a rate on the table and there is a second rate, unwritten, which concerns who sits at the finance ministry when the next issue is placed."
 auh_clock.207.a:0 "Pay it, and pay it in cash."
 auh_clock.207.b:0 "Refuse the terms."
 auh_clock.208.t:0 "The North Ramp of the Tauern"
 auh_clock.208.d:0 "Wurmb has the bore laid out from Böckstein, and now the question of who drives it. His own directorate is slow, honest and expensive. The contractors are fast and will cut the timbering where the inspectors do not go. The imported plant from Germany is the best machinery in Europe and will be paid for in gold before a metre of it turns."
 auh_clock.208.a:0 "The directorate drives it."
 auh_clock.208.b:0 "Put it out to the contractors."
 auh_clock.208.c:0 "Buy the plant. The syndicate will carry it."
 auh_clock.209.t:0 "The Water in the Mountain"
 auh_clock.209.d:0 "The heading has run into a water-bearing fault at the eleventh kilometre and the pumps are behind it. Either the timbering holds while the men get out and the drift is carried round, or it does not."
 auh_clock.209.a:0 "Get the men out and count afterwards."
 auh_clock.210.t:0 "The Tauern Line Is Opened"
 auh_clock.210.d:0 "A train runs from Salzburg to Villach under the main chain of the Alps. The Alpine crownlands have a trunk line for the first time since the Romans stopped maintaining the passes, and the house that paid for it is the one whose name is on the tunnel portal."
 auh_clock.210.a:0 "Let the first train be the Emperor's."
 auh_clock.211.t:0 "Under the Karawanken"
 auh_clock.211.d:0 "The second bore is through and the Wocheiner line is running down to the coast. The question left is the one the surveyors would not answer: whether the stations on the new line are labelled in Slovene, in Italian, or in both — and which name is written first."
 auh_clock.211.a:0 "Slovene first. It is their valley."
 auh_clock.211.b:0 "Italian first. It is their port."
 auh_clock.212.t:0 "The Lloyd Takes the Eastern Line"
 auh_clock.212.d:0 "The Austrian Lloyd is given the subsidy and the mail contract for the eastern runs out of the enlarged basin. The house flag of Trieste will be seen at Alexandria, at Smyrna and at Bombay, and the customs receipts of the free port will pay for a good deal of what the mountain cost."
 auh_clock.212.a:0 "Let her sail."
 auh_clock.213.t:0 "The Mayor, Unsanitised"
 auh_clock.213.d:0 "The reports on the desk are two. The first is the water, the tramways and the green belt: the best-governed great city in Europe, built by a man who did not steal. The second is what he says from the platform about the Jews of his own city, week after week, to the largest crowds in the monarchy. Both reports are true and both are his."
 auh_clock.213.a:0 "Sign the estimates. The city is well governed."
 auh_clock.213.b:0 "Sign the estimates, and send for him."
 auh_clock.214.t:0 "Bárczy Takes the Town Hall"
 auh_clock.214.d:0 "The new mayor across the river has a programme of fifty-five schools, municipal housing, a milk supply and a children's court, and he wants the common purse to help with the embankment. The Kingdom's press has already printed the comparison with Vienna, and printed it in the Kingdom's favour."
 auh_clock.214.a:0 "Help with the embankment."
 auh_clock.214.b:0 "Let the Kingdom pay for the Kingdom's city."
 auh_clock.215.t:0 "The Field Blows In"
 auh_clock.215.d:0 "The new well at Tustanowice has come in at a hundred wagons a day and is still blowing. Every derrick within a kilometre is being crowded onto ground that was pasture last month, the price of crude has halved in a fortnight, and the crews — Polish, Ruthene and Jewish on the same platform — are working without casing because the lease runs out before the season does."
 auh_clock.215.a:0 "Lease the field. Let the refiners work it."
 auh_clock.215.b:0 "Regulate it. Casing, spacing and a wage schedule."
 auh_clock.216.t:0 "Kandó's Engine Runs"
 auh_clock.216.d:0 "The three-phase machine has taken a load over the Hungarian trunk without a converter under it, and the Ganz works have orders from Italy on the strength of it. The Kingdom has built something the western half will have to buy."
 auh_clock.216.a:0 "Put the current on the trunks."
 auh_clock.217.t:0 "The Institute Opens"
 auh_clock.217.d:0 "The Academy has its institute and the Joachimsthal ore has a licence office. What leaves the realm now leaves at a price, and what stays is measured in the only laboratory in Europe with a supply of its own."
 auh_clock.217.a:0 "The Academy has what it asked for."
 auh_clock.218.t:0 "The Südbahn Passes"
 auh_clock.218.d:0 "The board is bought out, the Semmering is the state's, and the through rates from the Ring to the Adriatic are set in a ministry instead of in Paris. The purchase price will be on the books for a generation."
 auh_clock.218.a:0 "One network, one schedule."
 auh_clock.219.t:0 "The Report of the Public Works"
 auh_clock.219.d:0 "The annual report on the works of the realm, laid before the Crown as the law requires. Strain on the treasury: §[GetAUH_strainColor][?AUH_treasury_strain|0]§! of 100 — §[GetAUH_strainColor][GetAUH_strainBand]§!. Programmes open: §[GetAUH_projectsLiveColor][?AUH_eco_projects_live|0]§!. Years of canal appropriation carried: §Y[?AUH_canal_years|0]§!."
 auh_clock.219.a:0 "Noted. Continue."
 auh_clock.232.t:0 "The Spread Opens"
 auh_clock.232.d:0 "The realm's paper is being quoted a quarter-point wide of the German. It is not a crisis and every banker in the Ring knows exactly what it is: the market has read the estimates and priced the works we have begun against the revenue we have not raised."
 auh_clock.232.a:0 "Let it stand. The works matter more."
 auh_clock.232.b:0 "Close the spread. Buy the paper back."
 auh_clock.233.t:0 "The Annual Estimates"
 auh_clock.233.d:0 "The Delegations have the estimates and will not vote them whole. One project-year can be struck, or the deficit can be carried forward and the strain with it, or the Kingdom's quota can be raised — which is not a budget question, it is a constitutional one, and Budapest will treat it as such."
 auh_clock.233.a:0 "Strike a project-year."
 auh_clock.233.b:0 "Carry the deficit forward."
 auh_clock.233.c:0 "Raise the quota."
 auh_clock.234.t:0 "Before the Panic"
 auh_clock.234.d:0 "The discount rate has been raised twice in six weeks and the Creditanstalt has stopped answering the smaller houses. Böhm-Bawerk has written out his resignation and left it unsigned on the desk, which is his way of saying that the estimates he certified are no longer the estimates being spent. Berlin will lend. Berlin always lends."
 auh_clock.234.a:0 "Take the great-power credit."
 auh_clock.234.b:0 "Let the professor go."
 auh_clock.234.c:0 "Ride it out."
 auh_clock.235.t:0 "The Bells Eat the Budget"
 auh_clock.235.d:0 "A bell of the reign has been rung and it has been answered with money, as they always are. The section chief's arithmetic is short and unanswerable: the crisis was paid for out of the same purse as the works, and the works are what is standing still this quarter."
 auh_clock.235.a:0 "Suspend a project."
 auh_clock.235.b:0 "Take it on the strain."
 auh_clock.235.c:0 "The ministry will find it in the provinces."
 auh_clock.236.t:0 "The Kingdom Reads the Purchase"
 auh_clock.236.d:0 "Budapest has read the Südbahn purchase and sent the bill: if the common treasury has bought a railway that runs through Hungarian territory, the Kingdom's quota rises, or the Kingdom's port keeps its schedule and Trieste can wait behind it. There is no third answer that the Kingdom will sign."
 auh_clock.236.a:0 "Pay the quota. Keep the schedule."
 auh_clock.236.b:0 "Refuse. Fiume can sail on its own timetable."
 AUH_pw_the_annual_appropriation:0 "The Annual Appropriation"
 AUH_pw_the_annual_appropriation_desc:0 "The canal law is voted a year at a time, and a year not voted is a year the cuts stand open in the rain. Five carried years finish the spine."
 AUH_pw_the_works_reach_the_dniester:0 "Carry the Works to the Dniester"
 AUH_pw_the_works_reach_the_dniester_desc:0 "The Galician branch of the four-waterways law: the one section every finance minister has struck first, and the only public work the eastern crownland has ever been promised in writing."
 AUH_pw_the_nordbahn_shares_sold:0 "Sell the Nordbahn Shares"
 AUH_pw_the_nordbahn_shares_sold_desc:0 "The Crown's holding in the oldest railway of the realm, sold into a quiet market to buy the works another five years. It can be done once, and only in peace, and the court will not forget it."
 AUH_pw_the_loan_from_the_consortium:0 "Call on the Consortium"
 AUH_pw_the_loan_from_the_consortium_desc:0 "A hundred days from the asking to the money, at the syndicate's rate. Cheap, fast, and never free."
 AUH_pw_the_second_spring_pipeline:0 "The Second Mountain Spring"
 AUH_pw_the_second_spring_pipeline_desc:0 "Two hundred kilometres of aqueduct from the Hochschwab, and Vienna drinks mountain water instead of the Danube."
 AUH_pw_the_stadtbahn_is_ours:0 "The Stadtbahn Is Ours"
 AUH_pw_the_stadtbahn_is_ours_desc:0 "The city railway and the tramways taken into municipal hands and put on the current from the mountains, on Otto Wagner's viaducts."
 AUH_pw_the_green_belt_is_declared:0 "Declare the Green Belt"
 AUH_pw_the_green_belt_is_declared_desc:0 "The woods and meadows of the Vienna hills placed beyond the reach of any builder, by resolution of the city council, in perpetuity."
 AUH_pw_the_derricks_are_sunk:0 "Sink More Derricks"
 AUH_pw_the_derricks_are_sunk_desc:0 "Another season of drilling on the Carpathian field. The oil is there. So is the fire."
 AUH_pw_the_radium_export_licence:0 "Grant an Export Licence"
 AUH_pw_the_radium_export_licence_desc:0 "The Joachimsthal ore leaves the realm at the Academy's price, and the Academy keeps the difference."
 AUH_pw_the_lloyd_takes_the_eastern_line:0 "Subsidise the Eastern Line"
 AUH_pw_the_lloyd_takes_the_eastern_line_desc:0 "A season of the Lloyd's mail runs east of Suez, paid out of the free port's own receipts."
 AUH_eco_the_waterways_act:0 "The Waterways Act"
 AUH_eco_the_waterways_act_desc:0 "A law that authorises more than the treasury can carry, and is therefore a law about what the treasury will be made to carry."
 AUH_koerber_spine:0 "Koerber's Spine"
 AUH_koerber_spine_desc:0 "One water road from the Oder to the lower Danube, worked by the state, crossing every crownland and belonging to none."
 AUH_two_roads_to_the_sea:0 "Two Roads to the Sea"
 AUH_two_roads_to_the_sea_desc:0 "The Semmering and the Tauern both reach salt water, and neither capital can close the other's road."
 AUH_eco_the_consortium_of_the_ring:0 "The Consortium of the Ring"
 AUH_eco_the_consortium_of_the_ring_desc:0 "One signature, one rate, and a standing opinion about who should hold the finance ministry."
 AUH_eco_the_railway_monopoly:0 "One Network, One Schedule"
 AUH_eco_the_railway_monopoly_desc:0 "Every trunk line in the western half is the state's, and the through rates are written in a ministry. The foreign boards that were bought out remember the price."
 AUH_eco_the_austrian_lloyd:0 "The Austrian Lloyd"
 AUH_eco_the_austrian_lloyd_desc:0 "The house flag of Trieste on the eastern runs, carrying the mail and paying for the moles."
 AUH_eco_the_institute_of_radium:0 "The Institute of Radium"
 AUH_eco_the_institute_of_radium_desc:0 "The only laboratory in Europe with a pitchblende supply of its own."
 AUH_eco_the_delegations_balk:0 "The Delegations Balk"
 AUH_eco_the_delegations_balk_desc:0 "The estimates are voted late, in parts, and with conditions. Every programme-year now runs fifteen per cent longer than it was costed."
 AUH_eco_the_pre_panic:0 "Before the Panic"
 AUH_eco_the_pre_panic_desc:0 "The discount rate has been raised twice, the smaller houses are not being answered, and the works are being priced as if they will not be finished."
 AUH_eco_the_bond_spread:0 "The Spread on the Realm's Paper"
 AUH_eco_the_bond_spread_desc:0 "A quarter-point wide of the German, and every issue carries it."
 AUH_eco_the_credit_of_the_great_powers:0 "The Credit of the Great Powers"
 AUH_eco_the_credit_of_the_great_powers_desc:0 "Berlin lent. Berlin always lends, and the rate is never the whole price."
 AUH_eco_the_nordbahn_is_private:0 "The Nordbahn Is Not Ours"
 AUH_eco_the_nordbahn_is_private_desc:0 "The oldest railway in the realm answers to a board again, and its rates are set where the Crown cannot reach them."
 AUH_eco_the_works_are_stopped:0 "The Works Are Stopped"
 AUH_eco_the_works_are_stopped_desc:0 "The huts are shut, the contractors dispersed, and the cuts standing open through a winter that will have to be paid for twice."
 AUH_eco_the_treasury_strain:0 "The Strain on the Treasury"
 AUH_eco_the_water_road:0 "On the Water Road"
 AUH_eco_the_mountain_line:0 "On the New Trunk Line"
 AUH_eco_the_free_port:0 "The Free Port"
 AUH_eco_the_carpathian_field:0 "The Carpathian Field"
 AUH_eco_the_schedule_is_lost:0 "The Schedule Was Lost"
 AUH_karl_wurmb:0 "Karl Wurmb"
 AUH_karl_wurmb_desc:0 "The engineer who drove the Arlberg and then ran the railway-building directorate that drove everything after it. He does not promise dates he cannot hold, which is why the contractors dislike him and the mountain does not."
 AUH_istvan_barczy:0 "István Bárczy"
 AUH_istvan_barczy_desc:0 "Mayor of Budapest, and the only man in the Kingdom who has built fifty-five schools without once making a speech about the nation while doing it."
 AUH_eco_strain_band_easy:0 "the estimates carry"
 AUH_eco_strain_band_spread:0 "the spread is open"
 AUH_eco_strain_band_balk:0 "the Delegations balk"
 AUH_eco_strain_band_panic:0 "the discount rate is rising"
