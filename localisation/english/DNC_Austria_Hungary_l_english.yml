l_english:
 #Admin/diplomatic branch consequence events (auh_admin_crisis)
 auh_admin_crisis.1.t:0 "The Twelve Peoples Read the Compromise"
 auh_admin_crisis.1.d:0 "The rescript proclaiming the Compromise as the constitution has gone out from the Hofburg, and both halves' parliaments have confirmed the two state peoples in their old place. The Czech National Council in Prague and the Croatian and Slovene clubs have answered with a joint memorandum: if German and Magyar are once again the sole tongues of empire and kingdom, they ask, what exactly was promised to the other ten peoples of the register. The memorandum is polite. It is also signed by every deputy who might otherwise have voted the government's estimates."
 auh_admin_crisis.1.a:0 "Answer with a rescript of reassurance."
 auh_admin_crisis.1.b:0 "Let the memorandum go unanswered."
 auh_admin_crisis.1.c:0 "Refer it to a future Crown Council on nationality law."
 AUH_ac_1a_tt:0 "The reassurance is read out in Prague and Zagreb, and costs the crown nothing but a little more of its patience."
 AUH_ac_1b_tt:0 "Silence is itself an answer, and the clubs who signed the memorandum hear it plainly."
 AUH_ac_1c_tt:0 "A council is promised for some unspecified year to come; nobody in the register is fooled, but nobody is provoked either."
 auh_admin_crisis.2.t:0 "The Czech Club Answers by Obstruction"
 auh_admin_crisis.2.d:0 "Paragraph Fourteen let the ministry pass this year's budget without the Reichsrat's vote, and the Young Czechs have replied in the only coin the chamber allows them: procedural motions read aloud for nine hours at a stretch, quorum calls timed to the minute, a stack of amendments nobody intends to see debated. The government can grind through the obstruction, buy it off with a concession, or answer decree with a fresh decree — but next year's session calendar is already being written around whichever it chooses."
 auh_admin_crisis.2.a:0 "Let the obstruction run its course."
 auh_admin_crisis.2.b:0 "Offer the Czech Club a concession on court language."
 auh_admin_crisis.2.c:0 "Answer the walkout with a fresh round of decrees."
 AUH_ac_2b_tt:0 "Prague reads the concession as a small victory; the German Club reads it as the first crack."
 AUH_ac_2c_tt:0 "The Young Czechs are told plainly that the paragraph will be used again if it must be."
 auh_admin_crisis.3.t:0 "The New Chamber Cannot Agree on a Chairman"
 auh_admin_crisis.3.d:0 "The first election under the new franchise has returned more than thirty parties to the House of Deputies, several of them a single member strong, and none of them speaking for a working majority. Three weeks in, the Chamber has yet to settle its own standing orders, let alone the government's estimates. The old curial elite calls it the predictable wages of universal manhood suffrage; the new deputies call it democracy learning to walk. Either way, nothing is being passed."
 auh_admin_crisis.3.a:0 "Let the parties fight it out on the floor."
 auh_admin_crisis.3.b:0 "Govern by Paragraph Fourteen regardless of the new Chamber."
 auh_admin_crisis.3.c:0 "Buy a working majority with patronage and offices."
 AUH_ac_3a_tt:0 "The new deputies note that the government let them fight it out honestly, whatever it cost the session."
 AUH_ac_3b_tt:0 "The franchise reform is a year old and already answered with the old paragraph; the reformers do not forget it."
 AUH_ac_3c_tt:0 "A majority is assembled out of offices and favours, and everyone in the lobby knows the price of every vote in it."
 auh_admin_crisis.4.t:0 "The Counties Answer the Gendarmes"
 auh_admin_crisis.4.d:0 "News of the scene in the Chamber — the opposition benches cleared by soldiers so the new standing orders could be carried — has reached the county assemblies before the official gazette did. A dozen county committees have voted resolutions of protest and instructed their sheriffs to look the other way if Budapest's circulars go unread. It is the same passive defiance the counties once used against Vienna, turned now against Budapest's own government."
 auh_admin_crisis.4.a:0 "Let the counties resolve and rage."
 auh_admin_crisis.4.b:0 "Send royal commissioners to overawe the defiant counties."
 auh_admin_crisis.4.c:0 "Reopen the Chamber and let the Speaker apologise."
 AUH_ac_4b_tt:0 "Commissioners sit in county hall after county hall, and the counties will not forget who sent them."
 AUH_ac_4c_tt:0 "An apology from the chair mends fences in the counties, and looks like weakness everywhere else."
 auh_admin_crisis.5.t:0 "Trieste Reads the Proclamation"
 auh_admin_crisis.5.d:0 "The courts-martial sit now in the Littoral under the state of exception, and the first sentences have gone out this week: modest fines for most of the men rounded up, a handful of prison terms for the newspapermen who printed the wrong editorial. Rome has not protested through the embassy, but the irredentist press in Trieste and Trento has printed the sentences in full, alongside the name of every judge who signed them."
 auh_admin_crisis.5.a:0 "Let the courts-martial run their course."
 auh_admin_crisis.5.b:0 "Quietly release the lesser prisoners."
 auh_admin_crisis.5.c:0 "Answer Rome's silence with a formal note of firmness anyway."
 AUH_ac_5a_tt:0 "The sentences stand, and the Littoral's Italian-speakers read them as confirmation of exactly what they feared."
 AUH_ac_5b_tt:0 "The lesser men go home quietly, and the newspapermen stay in their cells."
 AUH_ac_5c_tt:0 "Rome is told, unasked, that the courts-martial are the monarchy's own affair; the ally hears it as an affront."
 auh_admin_crisis.6.t:0 "The Delegations Ask What Rome Signed"
 auh_admin_crisis.6.d:0 "The renewed treaty is filed at the Ballhausplatz and toasted at the German embassy, but the Delegations' own foreign affairs committee has quietly asked to see the Italian annexes — the ones touching the Adriatic and the Balkans — before it votes the ministry's budget. Nobody doubts Berlin's word. Rome's is a different question, and everyone in the room remembers why."
 auh_admin_crisis.6.a:0 "Trust the treaty at face value; the committee is told to close the file."
 auh_admin_crisis.6.b:0 "Quietly reinforce the southern frontier against Italy anyway."
 auh_admin_crisis.6.c:0 "Publish the annexes to still the committee's doubts."
 AUH_ac_6b_tt:0 "The works on the southern frontier are not announced, but Rome's military attaché reports them within the month."
 AUH_ac_6c_tt:0 "The annexes are read aloud in committee, and the coast's own deputies do not much like what an ally's price for friendship turns out to be."
 auh_admin_crisis.7.t:0 "The Free Hand Is Debated Behind Closed Doors"
 auh_admin_crisis.7.d:0 "The declaration leaves the monarchy's Balkan policy unbound from Berlin's for the first time in a generation, and the general staff wants to know what exactly the freedom is meant to buy. The Delegations' military committee is split between those who read it as licence for the first opportunity south of the Sava, and those who would rather bank it and say nothing at all."
 auh_admin_crisis.7.a:0 "Use the free hand at once."
 auh_admin_crisis.7.b:0 "Bank the free hand and say nothing."
 auh_admin_crisis.7.c:0 "Reassure Rome the free hand is not aimed at Albania."
 AUH_ac_7a_tt:0 "The free hand is exercised south of the Sava within the season, and Belgrade's own Serbs in the realm take note of exactly whose hand it was."
 AUH_ac_7c_tt:0 "Rome is told the free hand stops well short of Albania; the coast's Italian-speakers are the ones who hear the reassurance land."
 auh_admin_crisis.8.t:0 "The Old Hands Ask to Be Heard"
 auh_admin_crisis.8.d:0 "Aehrenthal's mission to press an active policy at Petersburg has not been announced in the Delegations, only felt: two career men who served the standing-still tradition for twenty years have asked for an audience before they submit their resignations. They are not blocking the new course. They want it said, once, in a room with the minister in it, that Petersburg was warned nothing had changed — and that both halves will be paying for it if that warning was wrong."
 auh_admin_crisis.8.a:0 "Back Aehrenthal fully; let the cautious resign."
 auh_admin_crisis.8.b:0 "Rein him in — no more surprises without the Delegations' knowledge."
 auh_admin_crisis.8.c:0 "Let the Delegations grill him in closed session."
 AUH_ac_8a_tt:0 "The old hands resign as they said they would, and Petersburg is left reading the active policy as a settled fact rather than a trial balloon."
 AUH_ac_8c_tt:0 "Aehrenthal answers three hours of questions behind closed doors, and Budapest's delegates leave satisfied that at least they were asked."
 auh_admin_crisis.9.t:0 "Budapest Asks What Standing Still Costs"
 auh_admin_crisis.9.d:0 "Goluchowski keeps his desk at the Ballhausplatz, and the Hungarian delegation's press has taken to calling him, in print, the minister who does not move. It is meant as an insult; it is also becoming an argument, aired openly ahead of the next Delegations budget session, that a ministry which moves for nobody should not be paid for by both halves equally."
 auh_admin_crisis.9.a:0 "Ride it out — the minister keeps his desk."
 auh_admin_crisis.9.b:0 "Trim the Ballhausplatz budget to appease Budapest."
 auh_admin_crisis.9.c:0 "Promise Budapest the next vacancy at the Ballhausplatz."
 AUH_ac_9a_tt:0 "The minister stays, the mockery continues, and Budapest's delegates file it away for the next budget fight."
 AUH_ac_9b_tt:0 "The common ministry's budget is trimmed at Budapest's insistence, and the career men at the Ballhausplatz notice exactly who asked for it."
 AUH_ac_9c_tt:0 "A promise of the next vacancy buys Budapest's patience for now, and commits the crown to a choice it has not yet made."
 #RON AUH DNC court crises pool (auh_court.*)
 auh_court.1.t:0 "The Contract in the Newspapers"
 auh_court.1.d:0 "The Neue Freie Presse prints a ledger page it should never have seen: a middleman's commission on the last order of heavy guns from the Škoda works, initialled by an officer of the joint War Ministry. Deputies in both halves of the realm demand the same thing in different languages, and the general staff wants the whole business buried before the next order goes out to bid. The newspaper says it has more pages."
 auh_court.1.a:0 "The ministry investigates itself, quietly."
 auh_court.1.b:0 "Order a parliamentary inquiry."
 auh_court.1.c:0 "Try the middleman, spare the generals."
 auh_court.2.t:0 "Silence on the Parade Ground"
 auh_court.2.d:0 "At a garrison in Bohemia, the inspecting general gives his commands in German as always, and for the length of the whole inspection not one conscript in the third company answers above a mutter. No rifle is out of place and no order is refused outright; the silence itself is the report the colonel now has to write. Vienna wants to know before the newspapers do."
 auh_court.2.a:0 "Court-martial the loudest of them."
 auh_court.2.b:0 "Transfer the whole regiment, without explanation."
 auh_court.2.c:0 "Permit the company its own words of command."
 auh_court.3.t:0 "The Ring Is Full"
 auh_court.3.d:0 "The crowd along the Ringstrasse is larger than the police have ever had to count, banners asking for the vote of every man regardless of what he pays in tax, and the police president's own estimate keeps rising by the hour. Mayor Lueger's officers are drawn up at the side streets, unbriefed, waiting for a decision from higher up than the mayor. The shops along the boulevard have already put up their shutters."
 auh_court.3.a:0 "Let the march pass unhindered."
 auh_court.3.b:0 "Turn out the gendarmerie."
 auh_court.3.c:0 "Promise a franchise bill, by name."
 auh_court.4.t:0 "A Run on the Ring"
 auh_court.4.d:0 "A rumor moves through the Vienna and Budapest bourses faster than any denial can catch it: that the common Bank's gold cover has slipped under the legal minimum. Small depositors are already queued outside the Postsparkasse counters, and the financial press wants Governor Biliński to say something, anything, before the opening bell tomorrow."
 auh_court.4.a:0 "Raise the discount rate at once."
 auh_court.4.b:0 "Have the joint treasuries guarantee every deposit."
 auh_court.4.c:0 "Say nothing and let the rumor exhaust itself."
 auh_court.5.t:0 "The Precedence Question"
 auh_court.5.d:0 "Chamberlain Montenuovo's household has again explained, in writing, that the Duchess of Hohenberg's rank does not entitle her to walk beside the Emperor at a state occasion, and the ambassadors present have all noticed exactly where she was seated. The Archduke's household at the Belvedere considers the letter a deliberate insult; Montenuovo considers it simply the protocol book. Both sides expect the Emperor to settle it, again."
 auh_court.5.a:0 "Uphold Montenuovo; the forms are the forms."
 auh_court.5.b:0 "Let the household bend, this once."
 auh_court.5.c:0 "Answer neither side directly."
 auh_court.6.t:0 "The Timetable Changed Hands"
 auh_court.6.d:0 "A clerk of the railway bureau that keeps the mobilization timetables is found with considerably more money than his salary explains, and a Russian military attaché's calling card in the lining of his coat. The Evidenzbureau wants to know how much of next year's timetable has already crossed the frontier, and whether the clerk is worth more locked up or left in place."
 auh_court.6.a:0 "A quiet court-martial, no press notified."
 auh_court.6.b:0 "A public trial, as a warning."
 auh_court.6.c:0 "Turn him, and feed the timetable false entries."
 auh_court.7.t:0 "The River Rises Past the Quay"
 auh_court.7.d:0 "After a fortnight of rain the Danube tops the lower quays of Pest, and the poorer streets along the embankment are already ankle-deep before the water has even crested. The honvéd garrison has pontoon gear and trained engineers who could be turned out tonight instead of at the week's end, if someone will give the order and answer for the cost."
 auh_court.7.a:0 "Turn out the garrison engineers tonight."
 auh_court.7.b:0 "Leave it to the municipal authorities."
 auh_court.7.c:0 "Fund a standing flood-works commission."
 auh_court.8.t:0 "The Wells Are Burning at Boryslaw"
 auh_court.8.d:0 "A gusher at one of the Boryslaw derricks has caught fire, and the blaze has already jumped to two of its neighbors; the black column of smoke is visible from Drohobycz. The roughnecks on site want army engineers and dynamite to cut a firebreak before the flames reach the storage tanks, and they want it before the wind changes."
 auh_court.8.a:0 "Send the army's engineer battalion."
 auh_court.8.b:0 "Leave it to the oil companies' own crews."
 auh_court.8.c:0 "Order a safety code for the whole field, afterward."
 auh_court.9.t:0 "Cholera Reported at the Frontier"
 auh_court.9.d:0 "A sanitary inspector at a Bukovina border crossing reports symptoms matching cholera among the grain porters arriving from across the frontier, and wants the crossing closed before the laboratory in Czernowitz confirms it, which could take a week either way. The grain merchants on both sides of the line are already telegraphing everyone they know."
 auh_court.9.a:0 "Close the crossing at once."
 auh_court.9.b:0 "Wait for the laboratory to confirm it."
 auh_court.9.c:0 "Send army doctors to inspect, and quarantine only the sick."
 auh_court.10.t:0 "A Parcel Left at the Ministry"
 auh_court.10.d:0 "Police intercept a parcel addressed to a minister that the laboratory confirms is a crude but functioning bomb, and a search of a print shop in Trieste turns up more of the same distinctive wrapping paper. Nobody has been hurt. The minister's calendar of public appearances now reads, to the security section, like a list of opportunities."
 auh_court.10.a:0 "Round up the known circles in Trieste."
 auh_court.10.b:0 "Quiet protection only, no arrests."
 auh_court.10.c:0 "Publicize the plot to justify a new security budget."
 auh_court.11.t:0 "The Frontier Is Closed to Serbian Cattle"
 auh_court.11.d:0 "The veterinary inspectors at the southern border posts have begun rejecting entire trainloads of Serbian pigs and cattle on sanitary grounds that the government in Belgrade calls a pretext, loudly. The real quarrel is an artillery order that went to a French firm instead of the usual Austrian suppliers; the livestock trade is simply how Vienna has chosen to make the point."
 auh_court.11.a:0 "Extend the embargo along the whole frontier."
 auh_court.11.b:0 "Negotiate a face-saving quota."
 auh_court.11.c:0 "Let the customs service run it as a technical matter."
 auh_court.12.t:0 "The Contracts of the Landesregierung"
 auh_court.12.d:0 "An audit of the Bosnian provincial government's road contracts finds that three of the largest went to firms in which serving officials, or their in-laws, hold a stake. The joint finance ministry, which has answered for the province since Kallay's day, must now decide how loudly it wants to admit what the auditors found."
 auh_court.12.a:0 "Discipline the officials privately; the roads stay open."
 auh_court.12.b:0 "Order a public tribunal of inquiry."
 auh_court.12.c:0 "Reassign the officials to other provinces, quietly."
 auh_court.13.t:0 "An Affair of Honor at the Officers' Mess"
 auh_court.13.d:0 "A lieutenant is dead before dawn after a duel fought over a toast that turned, somewhere in the small hours, into a remark about which nation's regiments run first when the shooting starts. The colonel's report calls it a hunting accident. Every other officer at the garrison already knows it was not."
 auh_court.13.a:0 "Let the report stand as written."
 auh_court.13.b:0 "Open a formal court-martial."
 auh_court.13.c:0 "Cashier both seconds without trial, and close the file."
 #tooltips
 AUH_court_skoda_coverup_tt:0 "German-Austrian opinion notes who was protected."
 AUH_court_skoda_inquiry_tt:0 "The public trusts a process it was allowed to watch."
 AUH_court_skoda_scapegoat_tt:0 "A modest justice satisfies nobody entirely, and everybody a little."
 AUH_court_garrison_courtmartial_tt:0 "The Czech lands remember whose silence was punished."
 AUH_court_garrison_concession_tt:0 "The Czech lands note the concession, and who granted it."
 AUH_court_franchise_promise_tt:0 "A promised franchise is worth something to those who lack the vote today."
 AUH_court_timetable_suspicion_tt:0 "Suspicion settles on the Ruthenian clerks of the frontier offices."
 AUH_court_flood_response_tt:0 "Budapest remembers which uniform came first."
 AUH_court_flood_neglect_tt:0 "Budapest remembers that Vienna left the sandbagging to the city alone."
 AUH_court_flood_commission_tt:0 "A standing commission is a promise the Hungarian half can hold the ministry to."
 AUH_court_oilfire_response_tt:0 "The Ruthenian roughnecks of the fields note who sent the engineers."
 AUH_court_oilfire_neglect_tt:0 "The Ruthenian roughnecks note who did not."
 AUH_court_oilfire_code_tt:0 "A safety code, however late, is still a code."
 AUH_court_cholera_closed_tt:0 "The Romanian grain towns of the frontier pay for a health measure they did not ask for."
 AUH_court_cholera_measured_tt:0 "A measured response earns more trust than a closed gate."
 AUH_court_trieste_roundup_tt:0 "Trieste's Italian quarter feels collectively suspected for the acts of a few."
 AUH_court_pigwar_embargo_tt:0 "Belgrade reads the embargo exactly as it is meant."
 AUH_court_pigwar_quota_tt:0 "The quota buys goodwill in Belgrade at the price of looking irresolute."
 AUH_court_pigwar_technical_tt:0 "Nobody in Belgrade believes the customs service acted alone."
 AUH_court_bosnia_discipline_tt:0 "Sarajevo notes that the men who profited kept their pensions."
 AUH_court_bosnia_tribunal_tt:0 "Sarajevo notes that the tribunal was public, and that it happened at all."
 AUH_court_bosnia_reassign_tt:0 "Sarajevo notes that the file was closed, at least."
 #The Ausgleich - the five settlements
 AUH_dnc_the_personal_union:0 "The Personal Union"
 AUH_dnc_the_personal_union_desc:0 "Nothing is held in common but the Crown. Neither government answers in the other chamber, neither treasury is asked for anything it has not offered, and the common army is a list of regiments nobody will vote recruits for."
 AUH_dnc_the_hungarian_bargain:0 "The Hungarian Bargain"
 AUH_dnc_the_hungarian_bargain_desc:0 "Two states, one sovereign, and a short schedule of charges they have agreed to meet together. It holds because neither half is asked for much and neither half looks closely at the other's books."
 AUH_dnc_the_two_parliaments:0 "The Two Parliaments"
 AUH_dnc_the_two_parliaments_desc:0 "Every common charge must pass two chambers elected to distrust each other. What is carried is carried twice, paid for three times, and explained differently on each bank of the river."
 AUH_dnc_the_indivisible_army:0 "The Indivisible Army"
 AUH_dnc_the_indivisible_army_desc:0 "One army, one command, one language of service. The kingdom votes the recruits under protest and reminds the ministry every year that it need not have."
 AUH_dnc_the_einheitsreich:0 "The Einheitsreich"
 AUH_dnc_the_einheitsreich_desc:0 "The realm is governed as one country. The offices have never worked so well, the estimates have never been met so promptly, and nobody outside the offices has ever been so angry."
 #The Ausgleich - what a failure leaves
 AUH_dnc_the_provisorium:0 "The Provisorium"
 AUH_dnc_the_provisorium_desc:0 "There is no settlement. The common charges are met by provisional twelfths voted month by month, and every office in the realm budgets on rumour."
 AUH_dnc_two_customs_territories:0 "Two Customs Territories"
 AUH_dnc_two_customs_territories_desc:0 "The common tariff is gone. Each half sets its own duties, and the other half is now a foreign market with a bad conscience and a shared currency."
 AUH_dnc_hungarian_national_resistance:0 "The Counties on Strike"
 AUH_dnc_hungarian_national_resistance_desc:0 "The county assemblies refuse the recruits and refuse the taxes. The commissioners sent to collect them are met at the door and read a resolution."
 #The Ausgleich - the term falls due
 auh_ausgleich.1.t:0 "The Term Falls Due"
 auh_ausgleich.1.d:0 "The settlement between the two halves has run out its term. Until a new one is voted in both chambers, nothing common has a legal basis: not the tariff, not the bank of issue, not the recruits.\n\nThe kingdom's share of the common charge stands at [?AUH_quote|1] in the hundred. What the two halves still hold in common is reckoned at [?AUH_gemeinsamkeit|0]. Neither Delegation will vote the other's figure for the asking."
 auh_ausgleich.1.a:0 "Lay the bill before both Delegations."
 auh_ausgleich.1.b:0 "Buy the kingdom's vote before it is cast."
 auh_ausgleich.1.c:0 "Set the figures by royal ordinance."
 auh_ausgleich.1.e:0 "Let the term run out."
 auh_ausgleich_bill_tt:0 "The bill costs [?AUH_renewal_cost|0] political power to bring to a division, and is reckoned to carry in [?AUH_renewal_odds|0] cases in the hundred."
 auh_ausgleich_bought_tt:0 "The kingdom's men are paid before the division. The settlement will pass, and German Austria will learn what it cost."
 auh_ausgleich_ordinance_tt:0 "The figures stand because the Crown says so. They will stand for half a term, and the kingdom will remember every month of it."
 auh_ausgleich_run_out_tt:0 "The ministry will not put the bill. The Delegations go home without a figure."
 #The Ausgleich - carried
 auh_ausgleich.2.t:0 "The Settlement Carried"
 auh_ausgleich.2.d:0 "Both Delegations have voted the same figures within a week of each other, which the older clerks say has not happened in living memory.\n\nThe tariff holds, the bank keeps its charter, the contingent is voted, and the whole arrangement falls due again at the end of the new term."
 auh_ausgleich.2.a:0 "Let it be published in both languages."
 auh_ausgleich_carried_tt:0 "A new term begins, the provisional twelfths are ended, and the common charge is voted on the settled figures."
 #The Ausgleich - failed
 auh_ausgleich.3.t:0 "The Settlement Fails"
 auh_ausgleich.3.d:0 "The Delegations have parted without a figure. One chamber has adjourned itself, the other has voted a resolution instead of a budget, and the common ministries are told to carry on as best they can.\n\nThe realm has no lawful common charge, and the ministry must say by what it proposes to govern."
 auh_ausgleich.3.a:0 "Govern by the provisional twelfths."
 auh_ausgleich.3.b:0 "Let the customs union go with it."
 auh_ausgleich.3.c:0 "Send the ministry away and put the bill again."
 auh_ausgleich_provisorium_tt:0 "The common charges will be met month by month on the last lawful figures until the bill can be put again."
 auh_ausgleich_customs_tt:0 "The common tariff is given up. Each half will set its own duties, and the industries that were built for one market must find two."
 auh_ausgleich_new_ministry_tt:0 "The ministry is dismissed and another is appointed to put the same bill to the same chambers within the year."
 #The Ausgleich - the union in question
 auh_ausgleich.4.t:0 "The Union in Question"
 auh_ausgleich.4.d:0 "It is no longer the figures that are in dispute. The kingdom's chamber has resolved that what binds the two halves is the person of the sovereign and nothing else, and it has resolved it out loud.\n\nThe Crown is asked what it intends to do about a realm that has stopped agreeing that it is one."
 auh_ausgleich.4.a:0 "Let the kingdom go."
 auh_ausgleich.4.b:0 "Hold the kingdom with the army."
 auh_ausgleich.4.c:0 "Pay whatever the kingdom asks."
 auh_ausgleich_dissolved_tt:0 "The common institutions are wound up. What is left is a Crown worn in two capitals."
 auh_ausgleich_held_tt:0 "The garrisons stay where they are and the chamber is told what it may debate. Nothing is settled; it is only postponed."
 auh_ausgleich_bought_union_tt:0 "The common charge is written down until the kingdom will sign it, and German Austria and Bohemia are sent the difference."
 #The Ausgleich - the counties on strike
 auh_ausgleich.5.t:0 "The Counties Refuse"
 auh_ausgleich.5.d:0 "The common institutions have grown until the kingdom no longer recognises what it agreed to. The county assemblies have answered in the only way left to them: they will not collect the taxes and they will not deliver the recruits.\n\nThe machinery of the realm is sound in every particular except that nobody in half of it will turn the handle."
 auh_ausgleich.5.a:0 "Send royal commissioners into the counties."
 auh_ausgleich.5.b:0 "Give way and send the Diet home."
 auh_ausgleich_commissioners_tt:0 "The commissioners will collect what the counties will not. They will be obeyed, and they will be hated for a long time after."
 auh_ausgleich_gave_way_tt:0 "The common arrangement is loosened until the counties will work it again."
 AUHDNC_x_the_moravian_lesson:0 "The Compromise at Brünn"
 AUHDNC_x_the_moravian_lesson_desc:0 "The four provincial acts of the margraviate stop being a precedent we cite and become the doctrine of the realm: every man on the roll declares his nation once, the curiae are drawn from the declaration, and the school money follows it and nothing else. A people whose rolls are closed stops being a card in the ministry's hand. Those who were neither cease to exist on paper."
 AUHDNC_x_the_bukovina_lesson:0 "The Compromise at Czernowitz"
 AUHDNC_x_the_bukovina_lesson_desc:0 "The crownland at the far end of the realm does what the margraviate did, with five nations instead of two and a diet that has already agreed the arithmetic among itself. The lawyers come from the province, the bill costs the treasury almost nothing, and the ministry may sign a second national cadastre for the price of a session. Nobody in Vienna has to be persuaded of anything."
 AUH_x_the_rolls_exist_tt:0 "The realm keeps rolls of nationality."
 AUH_x_cadastre_charge_tt:0 "§GOne national cadastre may be granted.§! Spend it from the register decisions."
 AUH_x_scar_CZE_tt:0 "§GThe Czech column becomes settled ground: it erodes more slowly, revolts later, and recovers higher.§!"
 AUH_x_scar_UKR_tt:0 "§GThe Ruthenian column becomes settled ground: it erodes more slowly, revolts later, and recovers higher.§!"
 AUH_nat_cadastre_charge_tt:0 "The ministry has a national cadastre in hand."
 AUH_nat_cadastre_seesaw_tt:0 "§GThis people leaves the see-saw: a concession to its rival no longer costs it anything.§!"
 AUH_nat_cadastre_scar_tt:0 "§GSettled ground: the column erodes more slowly, revolts later, and recovers higher.§!"
 AUH_nat_cadastre_gemeinsamkeit_tt:0 "§RThe realm is one register richer and one common thing poorer.§!"
 AUH_cadastre_AUS:0 "A Cadastre for the Germans of Austria"
 AUH_cadastre_AUS_desc:0 "The German rolls are closed, the curiae drawn from them, and the language of the offices settled where the roll says it is settled."
 AUH_cadastre_HUN:0 "A Cadastre for the Magyars"
 AUH_cadastre_HUN_desc:0 "The Magyar rolls are closed and guaranteed, and the Kingdom's own counties are told what a guarantee costs."
 AUH_cadastre_CZE:0 "A Cadastre for the Czechs"
 AUH_cadastre_CZE_desc:0 "The Bohemian rolls are drawn on the Moravian model: two national bodies, two school administrations, one crown land."
 AUH_cadastre_POL:0 "A Cadastre for the Poles"
 AUH_cadastre_POL_desc:0 "The Galician rolls are closed, and the club that has governed the province by arrangement governs it by law instead."
 AUH_cadastre_UKR:0 "A Cadastre for the Ruthenians"
 AUH_cadastre_UKR_desc:0 "The Ruthenian rolls are closed, the curia is written into the diet, and the metropolitan is asked to countersign."
 AUH_cadastre_ROM:0 "A Cadastre for the Romanians"
 AUH_cadastre_ROM_desc:0 "The Romanian rolls of Transylvania and the Bukovina are closed, and the school laws are read against the roll and not the map."
 AUH_cadastre_CRO:0 "A Cadastre for the Croats"
 AUH_cadastre_CRO_desc:0 "The rolls of the triune kingdom are closed, and the ban is left to govern a province whose arithmetic no longer moves."
 AUH_cadastre_SER:0 "A Cadastre for the Serbs"
 AUH_cadastre_SER_desc:0 "The Serb rolls are closed, and church and school are administered from the roll instead of from the consulate at Belgrade."
 AUH_cadastre_BOS:0 "A Cadastre for the Bosnian Muslims"
 AUH_cadastre_BOS_desc:0 "The rolls of the provinces are closed, and the vakuf and the medresa are guaranteed against every future ministry."
 AUH_cadastre_SLV:0 "A Cadastre for the Slovenes"
 AUH_cadastre_SLV_desc:0 "The Carniolan and Littoral rolls are closed, and the Slovene curia is written into the diets that have argued over it for thirty years."
 AUH_cadastre_ITA:0 "A Cadastre for the Italians"
 AUH_cadastre_ITA_desc:0 "The rolls of the Trentino and the Littoral are closed, which settles who may be taught in Italian and nothing at all about Innsbruck."
 AUH_cadastre_SLO:0 "A Cadastre for the Slovaks"
 AUH_cadastre_SLO_desc:0 "The rolls of the upland counties are closed, and a Slovak elects a Slovak, whatever the Kingdom's registrar would prefer to write."
 AUH_nat_cadastre_AUS_tt:0 "§GThe rolls of the Germans of Austria are closed and guaranteed.§!"
 AUH_nat_cadastre_HUN_tt:0 "§GThe rolls of the Magyars are closed and guaranteed.§!"
 AUH_nat_cadastre_CZE_tt:0 "§GThe rolls of the Czechs are closed and guaranteed.§!"
 AUH_nat_cadastre_POL_tt:0 "§GThe rolls of the Poles are closed and guaranteed.§!"
 AUH_nat_cadastre_UKR_tt:0 "§GThe rolls of the Ruthenians are closed and guaranteed.§!"
 AUH_nat_cadastre_ROM_tt:0 "§GThe rolls of the Romanians are closed and guaranteed.§!"
 AUH_nat_cadastre_CRO_tt:0 "§GThe rolls of the Croats are closed and guaranteed.§!"
 AUH_nat_cadastre_SER_tt:0 "§GThe rolls of the Serbs are closed and guaranteed.§!"
 AUH_nat_cadastre_BOS_tt:0 "§GThe rolls of the Bosnian Muslims are closed and guaranteed.§!"
 AUH_nat_cadastre_SLV_tt:0 "§GThe rolls of the Slovenes are closed and guaranteed.§!"
 AUH_nat_cadastre_ITA_tt:0 "§GThe rolls of the Italians are closed and guaranteed.§!"
 AUH_nat_cadastre_SLO_tt:0 "§GThe rolls of the Slovaks are closed and guaranteed.§!"
 # Political advisors, theorists and chiefs of the DNC era
 AUH_eugen_bohm_bawerk:0 "Eugen von Böhm-Bawerk"
 AUH_eugen_bohm_bawerk_desc:0 "Finance minister of the balanced estimate. He will not countersign a schedule the treasury cannot cover, and the army and the navy learn to wait their turn."
 AUH_karl_lueger:0 "Karl Lueger"
 AUH_karl_lueger_desc:0 "Mayor of Vienna, master of the municipal gas, the trams and the current. The city votes for him; half the peoples of the monarchy read the result as a threat."
 AUH_albert_gessmann:0 "Albert Gessmann"
 AUH_albert_gessmann_desc:0 "Christian Social minister of public works, who turns a jubilee fund into contracts and contracts into benches in the Reichsrat."
 AUH_rudolf_sieghart:0 "Rudolf Sieghart"
 AUH_rudolf_sieghart_desc:0 "Section chief of the Ministerpraesidium: the quiet hand behind the cabinet's press, its credits and its majorities."
 AUH_josef_redlich:0 "Josef Redlich"
 AUH_josef_redlich_desc:0 "Moravian jurist of administrative reform, who reads the constitution as a machine that can be rebuilt while it is still running."
 AUH_ernst_von_plener:0 "Ernst von Plener"
 AUH_ernst_von_plener_desc:0 "Leader of the German liberals and president of the audit court. He counts before he speaks, and he speaks rarely."
 AUH_alfred_montenuovo:0 "Alfred von Montenuovo"
 AUH_alfred_montenuovo_desc:0 "Second lord of the household, keeper of the court's order of precedence and of the distance between the Emperor and his heir."
 AUH_julius_derschatta:0 "Julius Derschatta von Standhalt"
 AUH_julius_derschatta_desc:0 "Railway minister of the line through the Karst, who knows what a gradient will cost before the surveyors have finished with it."
 AUH_beni_kallay:0 "Béni Kállay"
 AUH_beni_kallay_desc:0 "Common finance minister and administrator of the occupied land, author of a nationality invented so that it would belong to neither crown."
 AUH_edmund_von_krieghammer:0 "Edmund von Krieghammer"
 AUH_edmund_von_krieghammer_desc:0 "Common war minister who asks the two delegations for the army they promised him, and goes when they refuse it."
 AUH_heinrich_von_pitreich:0 "Heinrich von Pitreich"
 AUH_heinrich_von_pitreich_desc:0 "Common war minister who prices the recruit contingent to the last crown, and buys his guns with his own political credit."
 AUH_janos_forgach:0 "János Forgách"
 AUH_janos_forgach_desc:0 "Minister at Belgrade, whose despatches arrive with documents nobody can trace and everybody would like to believe."
 AUH_ladislaus_szogyeny:0 "Ladislaus von Szőgyény-Marich"
 AUH_ladislaus_szogyeny_desc:0 "Ambassador at Berlin, the standing wire to the northern ally and the one man who knows what it will and will not sign."
 AUH_arthur_giesl:0 "Arthur Giesl von Gieslingen"
 AUH_arthur_giesl_desc:0 "Chief of the intelligence bureau, who keeps the files on the Balkan courts and, quietly, on his own officers."
 AUH_kalman_szell:0 "Kálmán Széll"
 AUH_kalman_szell_desc:0 "Minister President at Budapest, author of the formula that renews the customs union without anyone having to call it a treaty."
 AUH_khuen_hedervary:0 "Károly Khuen-Héderváry"
 AUH_khuen_hedervary_desc:0 "Ban of Croatia turned Minister President, who governs by setting the Croat benches against the Serb ones and pocketing the difference."
 AUH_geza_fejervary:0 "Géza Fejérváry"
 AUH_geza_fejervary_desc:0 "General of the bodyguard called to head a cabinet the chamber never elected, and which the counties refuse to obey."
 AUH_jozsef_kristoffy:0 "József Kristóffy"
 AUH_jozsef_kristoffy_desc:0 "Minister of the interior who threatens the gentry with the vote of every man, and means it exactly as long as they resist."
 AUH_sandor_nyiri:0 "Sándor Nyíri"
 AUH_sandor_nyiri_desc:0 "Honved general and royal commissioner, the officer sent to dissolve a chamber that will not dissolve itself."
 AUH_sandor_wekerle:0 "Sándor Wekerle"
 AUH_sandor_wekerle_desc:0 "Author of the common currency, recalled to lead a coalition that came into office promising to break it."
 AUH_ferenc_kossuth:0 "Ferenc Kossuth"
 AUH_ferenc_kossuth_desc:0 "Heir to the great name and minister of commerce: an independence leader who signs railway conventions with Vienna."
 AUH_albert_apponyi:0 "Albert Apponyi"
 AUH_albert_apponyi_desc:0 "Minister of cults and instruction, who pays the village schoolmaster and prescribes the language he is to teach in."
 AUH_ignac_daranyi:0 "Ignác Darányi"
 AUH_ignac_daranyi_desc:0 "Minister of agriculture, who answers the harvest strikes with a labourers' fund in one hand and a servants' law in the other."
 AUH_gyula_justh:0 "Gyula Justh"
 AUH_gyula_justh_desc:0 "Leader of the independence left, who will trade the whole common budget for a bank of the Kingdom's own."
 AUH_dezso_banffy:0 "Dezső Bánffy"
 AUH_dezso_banffy_desc:0 "Advocate of the hard Magyar state programme: one kingdom, one language of service, and no argument about either."
 AUH_sandor_popovics:0 "Sándor Popovics"
 AUH_sandor_popovics_desc:0 "Governor of the common bank: the Hungarian who keeps the note issue of both halves in a single till."
 AUH_leo_lanczy:0 "Leó Lánczy"
 AUH_leo_lanczy_desc:0 "Head of the Pest commercial bank, who finances the mills, the works, and the ministers who need them."
 AUH_manfred_weiss:0 "Manfréd Weiss"
 AUH_manfred_weiss_desc:0 "Master of the Csepel works, the second industrial house of the monarchy and the first of the Kingdom."
 AUH_karel_kramar:0 "Karel Kramář"
 AUH_karel_kramar_desc:0 "Leader of the Young Czechs and of the neo-Slav congress, who bargains in Vienna and looks toward Petersburg."
 AUH_antonin_svehla:0 "Antonín Švehla"
 AUH_antonin_svehla_desc:0 "Organiser of the Czech agrarians, who counts the villages the clubs of Prague forget to count."
 AUH_tomas_masaryk:0 "Tomáš Garrigue Masaryk"
 AUH_tomas_masaryk_desc:0 "The realist professor who takes the forged despatches apart in open court, whatever it costs the government that produced them."
 AUH_frantisek_thun:0 "František Thun"
 AUH_frantisek_thun_desc:0 "Statthalter of Bohemia, required to govern the kingdom for the crown and for the German benches at the same time."
 AUH_heinrich_clam_martinic:0 "Heinrich Clam-Martinic"
 AUH_heinrich_clam_martinic_desc:0 "Voice of the feudal great landowners, for whom the crown of Saint Wenceslas is an estate to be administered and not an idea to be argued."
 AUH_ivan_sustersic:0 "Ivan Šušteršič"
 AUH_ivan_sustersic_desc:0 "Leader of the Slovene People's Party, who wants the southern lands gathered under a third crown."
 AUH_janez_krek:0 "Janez Evangelist Krek"
 AUH_janez_krek_desc:0 "Priest of the peasant co-operatives, who builds savings banks in provinces where the state has built only barracks."
 AUH_milan_hodza:0 "Milan Hodža"
 AUH_milan_hodza_desc:0 "Deputy of the Upper Land and of the heir's circle: the Slovak the Kingdom would very much rather not hear."
 AUH_aurel_popovici:0 "Aurel C. Popovici"
 AUH_aurel_popovici_desc:0 "Author of a plan to recut the monarchy into fifteen national states, which Budapest reads as a declaration of war."
 AUH_vaida_voevod:0 "Alexandru Vaida-Voevod"
 AUH_vaida_voevod_desc:0 "Romanian deputy of the heir's circle, patient with Vienna and long out of patience with Budapest."
 AUH_josip_frank:0 "Josip Frank"
 AUH_josip_frank_desc:0 "Leader of the Party of Right, who offers Vienna a Croatia loyal against the Serbs and against Budapest alike."
 AUH_frano_supilo:0 "Frano Supilo"
 AUH_frano_supilo_desc:0 "Author of the resolutions that put Croat and Serb deputies into one club, which is precisely what makes him dangerous."
 AUH_svetozar_pribicevic:0 "Svetozar Pribićević"
 AUH_svetozar_pribicevic_desc:0 "Leader of the independent Serbs of Croatia, the other half of a coalition Budapest cannot break by counting heads."
 AUH_pavao_rauch:0 "Pavao Rauch"
 AUH_pavao_rauch_desc:0 "Ban who governs against the coalition with commissioners, dissolutions and a trial prepared in advance."
 AUH_teodor_pejacevic:0 "Teodor Pejačević"
 AUH_teodor_pejacevic_desc:0 "Ban who resigns rather than sign the railway pragmatic, and is remembered for it in both kingdoms."
 AUH_andrey_sheptytsky:0 "Andrey Sheptytsky"
 AUH_andrey_sheptytsky_desc:0 "Metropolitan of Halych, who asks for benches, chairs and schools for the Ruthenes, and takes every one of them from the Poles."
 AUH_michal_bobrzynski:0 "Michał Bobrzyński"
 AUH_michal_bobrzynski_desc:0 "Statthalter of Galicia, who spends his whole term buying a settlement between Poles and Ruthenes."
 AUH_benno_straucher:0 "Benno Straucher"
 AUH_benno_straucher_desc:0 "Deputy of the Bukovina who negotiates the register of the peoples and is refused a curia of his own at the end of it."
 AUH_aurel_von_onciul:0 "Aurel von Onciul"
 AUH_aurel_von_onciul_desc:0 "Negotiator of the Bukovina settlement, who gets Romanians and Ruthenes to put their names to the same list."
 AUH_johann_chlumecky:0 "Johann von Chlumecky"
 AUH_johann_chlumecky_desc:0 "Architect of the Moravian settlement, the standing proof that a national register can be written without a riot."
 AUH_alfred_krauss:0 "Alfred Krauss"
 AUH_alfred_krauss_desc:0 "Instructor of the war school, whose comparative studies are read a good deal further than his lectures are heard."
 AUH_siegfried_popper:0 "Siegfried Popper"
 AUH_siegfried_popper_desc:0 "Chief constructor of the fleet: every capital hull of the age leaves his drawing office before it leaves the slip."
 AUH_simon_lake:0 "Simon Lake"
 AUH_simon_lake_desc:0 "Foreign designer whose boats are bought for the trials, and who teaches the yard rather more than the trials do."
 AUH_wilhelm_kress:0 "Wilhelm Kress"
 AUH_wilhelm_kress_desc:0 "Builder of the seaplane the lake swallowed. The wing was right; the engine ordered abroad weighed twice what it was promised to weigh."
 AUH_franz_xaver_wels:0 "Franz Xaver Wels"
 AUH_franz_xaver_wels_desc:0 "The glider man: the wing before the engine, and the engine only when the wing has proved that it will carry one."
 AUH_igo_etrich:0 "Igo Etrich"
 AUH_igo_etrich_desc:0 "Master of the Zanonia wing, whose gliders are flying over the Prater long before any motor is fitted to them."
 AUH_kalman_kando:0 "Kálmán Kandó"
 AUH_kalman_kando_desc:0 "Electrical engineer of the Ganz works, whose three-phase traction electrifies foreign lines while our own stay under smoke."
 AUH_hermann_von_spaun:0 "Hermann von Spaun"
 AUH_hermann_von_spaun_desc:0 "Commandant of the navy, and of the school that holds a coast rather than disputes a sea."
 AUH_franz_hinterstoisser:0 "Franz Hinterstoisser"
 AUH_franz_hinterstoisser_desc:0 "Officer of the balloon establishment, twice its commander, and the schoolmaster of every man who goes up in it."
 AUH_viktor_silberer:0 "Viktor Silberer"
 AUH_viktor_silberer_desc:0 "Aeronaut, editor and founder of the club, who raises by subscription the money the estimates will not vote."
 AUH_karl_illner:0 "Karl Illner"
 AUH_karl_illner_desc:0 "The first pilot to hold a certificate, who takes an Etrich machine off the monarchy's own flying field."
 AUH_karl_landsteiner:0 "Karl Landsteiner"
 AUH_karl_landsteiner_desc:0 "The laboratory that stayed. The groups of the blood are found in Vienna, and the chair that found them is a standing charge on both delegations."
 AUH_frantisek_krizik:0 "František Křižík"
 AUH_frantisek_krizik_desc:0 "The electrician of the kingdom: arc lamps, tramways and the current that turns the Bohemian workshops."
 AUH_rudolf_frommer:0 "Rudolf Frommer"
 AUH_rudolf_frommer_desc:0 "Designer of the Kingdom's own small arms, which is the whole quarrel: two regulation patterns inside one army."
 AUH_paul_daimler:0 "Paul Daimler"
 AUH_paul_daimler_desc:0 "The motor works of Wiener Neustadt: four wheels driven, a wheeled machine offered to the army, and the bill sent to the delegations."
 AUH_emil_von_woinovich:0 "Emil von Woinovich"
 AUH_emil_von_woinovich_desc:0 "Director of the war archive, who reads every campaign the army has fought and writes down what it has since forgotten."
 AUH_ferdinand_porsche:0 "Ferdinand Porsche"
 AUH_ferdinand_porsche_desc:0 "The motor man of Wiener Neustadt: his engine, his propeller and his tubular frame carry the army's first airship."
 AUH_alfred_von_pischof:0 "Alfred von Pischof"
 AUH_alfred_von_pischof_desc:0 "Austrian builder of the Paris school, who comes home with the practice of the French sheds in his hands."
 AUH_hermann_hoernes:0 "Hermann Hoernes"
 AUH_hermann_hoernes_desc:0 "Officer and publicist of the aeronautical question, who argues the arm into existence before there is an arm to argue about."
 # Commanders of the DNC era
 AUH_joseph_karl_von_osterreich:0 "Archduke Joseph Karl"
 AUH_joseph_karl_von_osterreich_advisor:0 "Archduke Joseph Karl"
 AUH_joseph_karl_von_osterreich_advisor_desc:0 "An archduke at the head of the Honved. His presence is worth more to the Kingdom than it is to the staff."
 AUH_vilmos_klobucar:0 "Vilmos Klobučar"
 AUH_samu_hazai:0 "Samu Hazai"
 AUH_karl_tersztyanszky:0 "Karl Tersztyánszky"
 AUH_gustav_ratzenhofer:0 "Gustav Ratzenhofer"
 AUH_gustav_ratzenhofer_desc:0 "Director of the war archive and sociologist of the army, who studies why men fight before he asks how they are to be moved."
 # Sea officers of the DNC era
 AUH_georg_von_trapp:0 "Georg von Trapp"
 AUH_julius_ripper:0 "Julius Ripper"
 AUH_alfred_von_koudelka:0 "Alfred von Koudelka"
 AUH_alfred_von_koudelka_desc:0 "Officer and writer on the fleet question, who explains the naval estimates to a public that has never seen the sea."
 accomplished_professor:0 "Accomplished Professor"
 AUH_dnc_delegations_cat:0 "The Delegations"
 AUH_dnc_serbia_ladder_cat:0 "The Ladder Against Belgrade"
 AUH_dnc_county_instruments_cat:0 "The Instruments Against the Counties"
 AUH_dnc_heirs_chancellery_cat:0 "The Heir's Chancellery"
 AUH_dnc_memoranda_cat:0 "The Memoranda"
 AUH_del_carry_the_common_estimates:0 "Carry the Common Estimates"
 AUH_del_carry_the_common_estimates_desc:0 "Sixty men from Vienna and sixty from Budapest, meeting in the same city and never in the same room, exchanging notes like duellists' seconds. If the common estimates are carried without a scene, the year is already half won."
 AUH_del_press_the_quota_upward:0 "Press the Quota Upward"
 AUH_del_press_the_quota_upward_desc:0 "The common charge is divided by a number nobody loves. Instruct the delegation to argue, table by table, that the Kingdom has grown rich enough to pay like it."
 AUH_del_quota_room_up_tt:0 "There is still room to press: the Kingdom's share stands below forty in the hundred."
 AUH_del_let_the_quota_slip:0 "Let the Quota Slip"
 AUH_del_let_the_quota_slip_desc:0 "A point conceded on the quota is the cheapest good temper Budapest sells. The finance ministers will grumble; the delegations will vote."
 AUH_del_quota_room_down_tt:0 "There is something left to concede: the Kingdom's share stands above thirty in the hundred."
 AUH_del_the_credits_for_the_common_army:0 "The Credits for the Common Army"
 AUH_del_the_credits_for_the_common_army_desc:0 "Rifles, remounts and fortress guns are the one shopping list both delegations can sign without reading. Ask for the credits while the mood holds."
 AUH_serb_the_tariff_wall:0 "Raise the Tariff Wall"
 AUH_serb_the_tariff_wall_desc:0 "Nine-tenths of what Serbia sells crosses our frontier on the hoof. Post the new schedule at the customs houses and let arithmetic do the arguing."
 AUH_serb_tariff_wall_tt:0 "The tariff wall stands for six months, and the ladder's next rung comes within reach."
 AUH_serb_the_pig_war:0 "Close the Frontier to the Pig"
 AUH_serb_the_pig_war_desc:0 "The tariff pinched; the closure starves. Not a hog, not a plum, not a hide crosses until Belgrade remembers who buys them. The chancelleries of Europe will call it a pig war, and they will not be wrong."
 AUH_serb_tariff_first_tt:0 "The tariff wall must be standing before the frontier can be closed."
 AUH_serb_pig_war_tt:0 "The frontier is closed to Serbian goods for two years, and every legation in Europe files a report about pigs."
 AUH_serb_the_pig_war_threat:0 "The frontier closed against Serbia"
 AUH_serb_the_loan_is_blocked:0 "The Loan Is Blocked"
 AUH_serb_the_loan_is_blocked_desc:0 "Belgrade is shopping for money in Paris to spend on guns elsewhere. A word from the Ballhausplatz to the right banks, and the terms on offer become instructive."
 AUH_serb_loan_blocked_tt:0 "The Serbian loan waits in the antechambers of the banks, and the waiting is worth something in Vienna."
 AUH_serb_the_hand_reopened:0 "Reopen the Hand"
 AUH_serb_the_hand_reopened_desc:0 "Ladders are for climbing down as well as up. Lift the schedules, receive the trade delegation, and let the pig cross the frontier as an ambassador of good sense."
 AUH_serb_hand_reopened_tt:0 "The schedules are lifted and the frontier trade resumes."
 AUH_cty_the_royal_commissioners:0 "Send the Royal Commissioners"
 AUH_cty_the_royal_commissioners_desc:0 "Where a county assembly will not administer the law, a commissioner is named who will. He arrives with a warrant, a clerk and no friends, and the offices open in the morning."
 AUH_cty_ledger_up_tt:0 "§RThe ledger of the counties' grievances grows longer.§!"
 AUH_cty_the_gendarmes_ride_out:0 "The Gendarmes Ride Out"
 AUH_cty_the_gendarmes_ride_out_desc:0 "The resolutions are brave until the gendarmerie is billeted on the county seat. Order is restored, and remembered."
 AUH_cty_the_taxes_by_the_bayonet:0 "Collect the Taxes by the Bayonet"
 AUH_cty_the_taxes_by_the_bayonet_desc:0 "What the county will not remit, the army will escort. The arrears arrive to the kreuzer, and the receipt is written in a hand the counties will not forgive."
 AUH_cty_the_instruments_rest:0 "Let the Instruments Rest"
 AUH_cty_the_instruments_rest_desc:0 "A season without commissioners, without escorts, without new names on the warrant. The assemblies notice what is absent sooner than they ever noticed what was sent."
 AUH_cty_ledger_live_tt:0 "The counties must have grievances on the ledger for the resting to be noticed."
 AUH_cty_ledger_down_tt:0 "§GA page of the counties' grievances is quietly retired.§!"
 AUH_hc_a_card_on_every_desk:0 "A Card on Every Desk"
 AUH_hc_a_card_on_every_desk_desc:0 "Every prefect, colonel and editor of consequence gets a card in the index: who he owes, what he wants, which way he will jump. The next reign is being staffed in advance, alphabetically."
 AUH_hc_a_minister_is_marked:0 "A Minister Is Marked"
 AUH_hc_a_minister_is_marked_desc:0 "One name in the cabinet is underlined in the Belvedere's ink. His successor has already been to dinner."
 AUH_hc_minister_marked_tt:0 "A serving minister is marked in the card index for the day after."
 AUH_hc_the_generals_are_briefed:0 "The Generals Are Briefed"
 AUH_hc_the_generals_are_briefed_desc:0 "Quiet rooms, large maps, no minutes. The commanders who matter learn what the heir intends, and the heir learns which of them can be told."
 AUH_hc_the_word_dropped_at_court:0 "The Word Dropped at Court"
 AUH_hc_the_word_dropped_at_court_desc:0 "Three cards from the index, played at the right levee, buy a favour the government never learns it granted."
 AUH_hc_cards_to_spend_tt:0 "There must be at least five cards in the index worth playing."
 AUH_hc_dossier_spent_tt:0 "Cards are played from the index, and the dossier for the next reign grows thinner."
 AUH_mem_the_press_bureau_is_funded:0 "Fund the Press Bureau"
 AUH_mem_the_press_bureau_is_funded_desc:0 "The Ballhausplatz keeps a room of men who write for other men's newspapers. Their subject is the southern Slav question; their sources are the files; their salaries are now paid."
 AUH_mem_ledger_up_tt:0 "The file of documents of doubtful provenance grows thicker."
 AUH_mem_the_documents_of_provenance:0 "The Documents of Provenance"
 AUH_mem_the_documents_of_provenance_desc:0 "Minutes of meetings that may have happened, subscriptions to societies that certainly exist, signatures of an unusual fluency. The legation at Belgrade forwards them without comment."
 AUH_mem_the_coalition_stands_accused:0 "The Coalition Stands Accused"
 AUH_mem_the_coalition_stands_accused_desc:0 "The documents are entered into evidence and names are read into the record. The trial will hold as long as nobody looks too hard at the ink."
 AUH_mem_ledger_ready_tt:0 "The file must hold at least three documents fit to be sworn to."
 AUH_mem_ledger_spent_tt:0 "The documents are spent in open court, and the file grows thin."
 AUH_mem_the_trial_read_abroad:0 "A political trial read in every capital"
 AUH_mem_the_papers_are_burned:0 "The Papers Are Burned"
 AUH_mem_the_papers_are_burned_desc:0 "A cold grate, a match, and a file that can no longer embarrass anyone. Some victories are subtractions."
 AUH_mem_ledger_exists_tt:0 "There must be something left in the file to burn."
 AUH_mem_ledger_burned_tt:0 "§GThe file of doubtful documents is two pieces thinner.§!"
 AUHDNC_b_the_chancellery_at_the_belvedere:0 "The Chancellery at the Belvedere"
 AUHDNC_b_the_chancellery_at_the_belvedere_desc:0 "The Monarchy cannot be mended while the old Emperor lives; every reform dies on the desk where the Settlement was signed. Very well. Across the garden from the Hofburg another chancellery is assembling — a military chancellery in name, a government in waiting in fact. Nothing we build will bear fruit this reign. Everything we build is for the morning after."
 AUHDNC_b_the_card_index_of_the_heir:0 "The Card Index of the Heir"
 AUHDNC_b_the_card_index_of_the_heir_desc:0 "Brosch's office keeps a card on every man in the Monarchy worth having an opinion about: who can be won, who must be bought, who will have to be retired in the first week. The index decides nothing today. It decides everything on the day the bells ring."
 AUHDNC_b_the_long_wait:0 "The Long Wait"
 AUHDNC_b_the_long_wait_desc:0 "The decade closes and the old man is still at his desk at five in the morning. The programme stays in its safe; the marked ministers keep their offices; the cards keep their drawer. A shadow government has grown old waiting for its reign — but it has learned the state from the inside, which is more than most governments in power can say."
 AUH_b_sup_HUN_down_tt:0 "Budapest knows what the heir thinks of the Settlement; the Kingdom's loyalty cools."
 AUH_b_sup_CRO_up_tt:0 "The Croats have heard there is a friend at the Belvedere."
 AUH_b_sup_ROM_up_tt:0 "The Romanians of Transylvania have heard there is a friend at the Belvedere."
 AUH_b_the_waiting_court_tt:0 "The Hofburg notices the second court and does not forgive it: the government in waiting is watched, snubbed, and patient."
 AUH_b_the_chancellery_bonus:0 "The Military Chancellery of the Heir"
 AUH_b_dossier_up_tt:0 "The card index thickens; the dossier for the next reign grows."
 AUH_b_dossier_banked_tt:0 "The index was worth the ink: the men it marked run their offices as if the reign had already come."
 AUH_b_the_wait_goes_on_tt:0 "The era ends with the crown where it always was; the day after has not come."
 AUH_b_the_long_wait_bonus:0 "The Government in Waiting"
 AUHDNC_c_the_first_lord_of_the_household:0 "The First Lord of the Household"
 AUHDNC_c_the_first_lord_of_the_household_desc:0 "Prince Alfred de Montenuovo governs nothing and rules everything: precedence, mourning, the depth of a bow, which door a minister may use. A court that keeps its forms keeps its secrets, and a man who controls the forms controls the men. We shall make the Obersthofmeister's office an instrument of state."
 AUHDNC_c_the_oath_of_renunciation:0 "The Oath of Renunciation"
 AUHDNC_c_the_oath_of_renunciation_desc:0 "Before the assembled archdukes, the heir swears that the children of his marriage to Countess Chotek shall never sit the throne. The dynasty is satisfied, the law is clear, and the heir will not forgive it as long as he lives. Every settled question at this court settles a grudge with it."
 AUHDNC_c_the_spanish_ceremonial:0 "The Spanish Ceremonial"
 AUHDNC_c_the_spanish_ceremonial_desc:0 "The strictest etiquette in Europe, inherited from Burgundy through Spain, is enforced to the letter. It is theatre, and it is armour: a monarchy that cannot be approached cannot be measured, and a capital that watches processions does not count parliaments."
 AUHDNC_c_the_house_laws_reread:0 "The House Laws Reread"
 AUHDNC_c_the_house_laws_reread_desc:0 "The Familienstatut of 1839 is taken down and read as lawyers read it: who is of the House, who may marry, who may reign, and who governs if the Emperor can sign nothing. The paragraphs on a regency were written for minors, not for an old man's long dying. We will know what they permit before we need them."
 AUHDNC_c_the_seat_below_the_archduchesses:0 "The Seat Below the Archduchesses"
 AUHDNC_c_the_seat_below_the_archduchesses_desc:0 "At every gala the heir's wife enters last, behind the youngest archduchess, on the arm of no one. Montenuovo prices each slight to the schilling, and the Belvedere keeps the receipts. The etiquette is flawless; the account it opens will one day be presented in full."
 AUHDNC_c_the_jubilee_of_the_reign:0 "The Jubilee of the Reign"
 AUHDNC_c_the_jubilee_of_the_reign_desc:0 "Sixty years on the throne: processions, illuminations, homage from every crownland, the one ceremony in which the whole Monarchy still recognises itself. The old man in Schönbrunn is the last common possession of eleven quarrelling peoples. How Prague answers the illuminations will tell us what the ledger already knows."
 AUHDNC_c_the_physicians_of_the_hofburg:0 "The Physicians of the Hofburg"
 AUHDNC_c_the_physicians_of_the_hofburg_desc:0 "A cough at Schönbrunn moves the bourse more than a note from Berlin. The faculty's best men are attached to the person of the Emperor, their bulletins written for the newspapers and their true findings written for us. Medicine cannot stop the clock; it can steady the hands that read it."
 AUHDNC_c_the_question_of_the_succession:0 "The Question of the Succession"
 AUHDNC_c_the_question_of_the_succession_desc:0 "It may not be asked aloud — not by ministers, not by archdukes, least of all in the Emperor's hearing. We will ask it in writing, in a locked room: what happens on the day, in the hour, and who must be standing where. Whoever prepares that day owns the day after; the asking itself will cost us."
 AUHDNC_c_the_regency_act_in_the_drawer:0 "The Regency Act in the Drawer"
 AUHDNC_c_the_regency_act_in_the_drawer_desc:0 "If the hand that has signed for sixty years can no longer sign, the Monarchy has no government at all. An act is drafted — the powers of a regent, the council that names him, the order of signatures — and laid unsigned in a drawer of the Hofburg. It changes nothing today, and everything on the worst morning."
 AUHDNC_c_the_vigil_at_schoenbrunn:0 "The Vigil at Schönbrunn"
 AUHDNC_c_the_vigil_at_schoenbrunn_desc:0 "The bulletins shorten; the antechambers fill; the Cardinal-Archbishop waits in the next room. Nothing is decided at a deathbed, but everything is arranged there. The court that keeps this vigil in good order will hand over an empire in good order."
 AUHDNC_c_the_crypt_of_the_capuchins:0 "The Crypt of the Capuchins"
 AUHDNC_c_the_crypt_of_the_capuchins_desc:0 "The Capuchin friar asks three times who begs admittance, and only the third answer — a poor sinner — opens the crypt. Whatever else the peoples dispute, they bury this Emperor together. There is a week, perhaps two, in which grief does the work of government; it must not be wasted."
 AUHDNC_c_the_court_of_the_new_reign:0 "The Court of the New Reign"
 AUHDNC_c_the_court_of_the_new_reign_desc:0 "The old court is dismissed with pensions, and the new reign names its own household. What was protocol becomes policy: the men of the antechamber are exchanged for men of the files. The paralysis of the long wait ends here, whichever crown is now worn."
 AUH_c_protocol_machine_tt:0 "The household is an instrument: court affairs will find the Hofburg's doors already ordered."
 AUH_c_household_loyalty_tt:0 "The first society of the Empire is satisfied."
 AUH_c_oath_sworn_tt:0 "The succession is settled in law; the grudge is filed at the Belvedere."
 AUH_c_dossier_grows_tt:0 "A paper is added to the files of the Heir's Chancellery."
 AUH_c_ceremonial_tt:0 "The Crown cannot be approached, and so cannot be measured."
 AUH_c_house_laws_tt:0 "The regency machinery is understood: when the regency question comes, the House will have an answer ready."
 AUH_c_slights_priced_tt:0 "Every slight at court is now priced and remembered; court affairs will present their accounts."
 AUH_c_jubilee_loyalty_tt:0 "For one week, the Monarchy has a single capital and a single flag."
 AUH_c_jubilee_streets_tt:0 "How Prague answers the illuminations depends on the Bohemian ledger."
 AUH_c_health_recovers_tt:0 "The Emperor's health steadies under the faculty's watch."
 AUH_c_succession_question_tt:0 "The question is asked: the clock over Schönbrunn runs faster, and the day after is being planned."
 AUH_c_regency_ready_tt:0 "An unsigned regency act lies in the drawer; the worst morning will find a government."
 AUH_c_vigil_tt:0 "The court is prepared: the succession, when it comes, will find every man standing where he must."
 AUH_c_funeral_loyalty_tt:0 "The peoples bury their Emperor together, whatever they do tomorrow."
 AUH_c_new_reign_tt:0 "The long wait is over; the court answers to the living."
 AUH_c_new_reign_belvedere_tt:0 "The shadow court walks in by the front door, and every file in the Chancellery is already open."
 AUH_c_avail_first_cough:0 "The Emperor's health has fallen to 60 or below"
 AUH_c_avail_failing_fast:0 "The Emperor's health has fallen to 40 or below"
 AUH_c_avail_last_days:0 "The Emperor's health has fallen to 20 or below"
 AUH_c_avail_old_man_dead:0 "The Emperor is dead"
 auh_clock.60.t:0 "German and Czech in the Streets"
 auh_clock.60.d:0 "The jubilee illuminations reached Prague ahead of any goodwill to light them. Czech crowds tore down the black-and-yellow bunting on the Graben; German students answered with marching songs; by the third evening there were barricades in Žižkov and the garrison was confined to barracks awaiting orders. The Statthalter telegraphs hourly. The city that was to crown the jubilee is deciding what the reign is worth."
 auh_clock.60.a:0 "Proclaim a state of siege over Prague"
 auh_clock.60.b:0 "Let the burgomasters make the peace"
 auh_clock.60.c:0 "Withdraw the garlands and say nothing"
 auh_clock.61.t:0 "A City of Lanterns"
 auh_clock.61.d:0 "Prague was the worry, and Prague hung lanterns. The procession passed the Powder Tower between Czech falcons and German glee-clubs standing, for one evening, on the same pavement; the police report records nothing worse than pickpockets. Sixty years of the old man have bought one week in which the Monarchy likes itself. The question is what to do with a week."
 auh_clock.61.a:0 "A jubilee amnesty for press offences"
 auh_clock.61.b:0 "A jubilee honours list, and nothing more"
 auh_clock.62.t:0 "A Word Overheard"
 auh_clock.62.d:0 "The question was asked behind a locked door, and within the week the Emperor has heard of it — Schönbrunn hears everything, which is the last power it keeps whole. Nothing is said at the Wednesday audience. The old man signs, comments on the weather, and does not offer his hand. Somewhere between two courtiers, a career has quietly ended."
 auh_clock.62.a:0 "Send the Obersthofmeister to explain"
 auh_clock.62.b:0 "Let the silence stand"
 AUHDNC_x_the_house_that_cannot_vote:0 "The House That Cannot Vote"
 AUHDNC_x_the_house_that_cannot_vote_desc:0 "The Reichsrat has drowned itself in inkwells and national anthems. Somebody must govern Austria while the deputies fight over which language the stenographers may use."
 AUHDNC_x_the_government_of_officials:0 "The Government of Officials"
 AUHDNC_x_the_government_of_officials_desc:0 "Paragraph fourteen was written for emergencies. It is quietly becoming the constitution: ministries of civil servants who answer to the Crown and to nobody's benches."
 AUHDNC_x_the_sixty_eight_words:0 "The Sixty-Eight Words"
 AUHDNC_x_the_sixty_eight_words_desc:0 "Sixty-eight words of German suffice to command a battalion. Budapest demands them in Magyar; the Crown holds that an army with two languages of command is two armies."
 AUHDNC_x_the_county_assemblies_speak:0 "The County Assemblies Speak"
 AUHDNC_x_the_county_assemblies_speak_desc:0 "Every coercion is answered in the counties: resolutions, refused taxes, recruiting notices that are never posted. The ledger of their grievances is worth reading before it is worth burning."
 AUHDNC_x_blood_in_the_konak:0 "Blood in the Konak"
 AUHDNC_x_blood_in_the_konak_desc:0 "A king and a queen thrown from a palace window in Belgrade. The dynasty that took their place owes nothing to Vienna, and the question of Serbia now lies open on every desk of the Ballhausplatz."
 AUHDNC_x_the_punitive_expedition:0 "The Punitive Expedition"
 AUHDNC_x_the_punitive_expedition_desc:0 "Europe is disgusted with the regicides; the cover will never be cheaper. One short campaign, to put Belgrade under a king who behaves."
 AUHDNC_x_the_hofburg_receives_the_coalition:0 "The Hofburg Receives the Coalition"
 AUHDNC_x_the_hofburg_receives_the_coalition_desc:0 "The dossier against the Croat-Serb Coalition is provenance first and evidence second. Receive its leaders at court, quash the convictions, and let honesty do what no forgery can."
 AUHDNC_x_a_cabinet_without_a_chamber:0 "A Cabinet Without a Chamber"
 AUHDNC_x_a_cabinet_without_a_chamber_desc:0 "The Kingdom refuses the recruits and the taxes. Very well: a government of the King's own men will govern Hungary without its chamber, for as long as the King's patience lasts."
 AUHDNC_x_the_capitulation_in_secret:0 "The Capitulation in Secret"
 AUHDNC_x_the_capitulation_in_secret_desc:0 "The Coalition may take office after all, provided it signs away, in a document nobody will ever see, everything it campaigned for. Surrender dressed as victory, its price deferred."
 AUHDNC_x_the_law_of_the_millions:0 "The Law of the Millions"
 AUHDNC_x_the_law_of_the_millions_desc:0 "Universal suffrage imposed on the Kingdom by royal decree: the gentry's chamber drowned in Romanian, Slovak, Serb and peasant votes. The one weapon Budapest genuinely fears."
 AUHDNC_x_the_chamber_of_the_nations:0 "The Chamber of the Nations"
 AUHDNC_x_the_chamber_of_the_nations_desc:0 "The decree has held. A Budapest parliament in which the nationalities sit by the hundred, and through which the Crown's writ finally runs."
 AUHDNC_x_the_street_asks_for_the_ballot:0 "The Street Asks for the Ballot"
 AUHDNC_x_the_street_asks_for_the_ballot_desc:0 "A quarter of a million marchers on the Ring, and not a stone thrown yet. They are asking for the vote. The alternative is that they stop asking."
 AUHDNC_x_the_ballot_and_the_register:0 "The Ballot and the Register"
 AUHDNC_x_the_ballot_and_the_register_desc:0 "Because the register was filed years ago, the franchise can be built upon it: national curias, every people voting within its own roll. Suffrage without the nationality war."
 AUHDNC_x_the_settlement_falls_due:0 "The Settlement Falls Due"
 AUHDNC_x_the_settlement_falls_due_desc:0 "The economic compromise expires on schedule, as it does every tenth year. The quota, the bank, the tariff: everything is on the table again, and both parliaments know it."
 AUHDNC_x_the_east_in_motion:0 "The East in Motion"
 AUHDNC_x_the_east_in_motion_desc:0 "Young officers have seized Constantinople and proclaimed the constitution. Every treaty in the Balkans rests on a sultanate that no longer exists. The window is open."
 AUHDNC_x_the_disposal_of_the_provinces:0 "The Disposal of the Provinces"
 AUHDNC_x_the_disposal_of_the_provinces_desc:0 "The provinces are annexed; now they must belong to something. To the joint administration, to Croatia, to Hungary: each answer redraws the monarchy from the south upward."
 AUHDNC_x_a_crown_for_the_vistula:0 "A Crown for the Vistula"
 AUHDNC_x_a_crown_for_the_vistula_desc:0 "The Polish club has a candidate, the army has a frontier, and Russia has never been weaker. A Habsburg crown for a restored Poland: the boldest thing the monarchy could do, and the most dangerous."
 AUHDNC_x_the_regency_question:0 "The Regency Question"
 AUHDNC_x_the_regency_question_desc:0 "The House Laws provide for a king who cannot reign. Nobody has dared read those articles aloud in fifty years. Read them now."
 AUHDNC_x_the_regiments_in_the_streets:0 "The Regiments in the Streets"
 AUHDNC_x_the_regiments_in_the_streets_desc:0 "Where the chambers are shut and the marchers are counted in the hundred thousands, order is what the garrison says it is."
 AUHDNC_x_the_peace_of_the_king:0 "The Peace of the King"
 AUHDNC_x_the_peace_of_the_king_desc:0 "The Kingdom has been beaten by its own king. Commissioners in the counties, the Honved stood down, and a peace that will be obeyed for exactly as long as it is enforced."
 AUH_x_house_paragraph_tt:0 "Koerber's officials govern by the fourteenth paragraph, and are becoming rather good at it."
 AUH_x_house_majority_tt:0 "The four clubs hold; the House votes."
 AUH_x_house_kingdom_tt:0 "Budapest watches Vienna fail to govern itself, and draws conclusions."
 AUH_x_house_sword_tt:0 "The army takes note of what parliaments are worth."
 AUH_x_dossier_tt:0 "A page is added to the card index at the Belvedere."
 AUH_x_ordinances_tt:0 "Government by ordinance grows easier each time it is tried."
 AUH_x_word_pressed_tt:0 "The Kingdom has pressed its demand upon the common army."
 AUH_x_word_refused_tt:0 "The word of command remains German, and Budapest remembers."
 AUH_x_counties_stir_tt:0 "The county assemblies are in session again."
 AUH_x_county_ledger_tt:0 "The resolutions of the county assemblies are catalogued and answered."
 AUH_x_county_refusal_tt:0 "The language of the latest resolutions has turned from protest to refusal."
 AUH_x_county_instruments_tt:0 "The instruments against the counties are drafted and waiting."
 AUH_x_serbia_ladder_tt:0 "The Serbian question is open: punish, buy, or strangle."
 AUH_x_coalition_received_tt:0 "The convictions are quashed by the Crown itself; the South Slavs take note."
 AUH_x_bodyguard_tt:0 "A cabinet of the King's own men governs the Kingdom without its chamber."
 AUH_x_capitulation_tt:0 "The Coalition takes office. The price is not written down."
 AUH_x_millions_tt:0 "The franchise is imposed by decree; the gentry's monopoly is broken."
 AUH_x_era_end_chamber_tt:0 "The era closes on a chamber of the nations in Budapest."
 AUH_x_ballot_conceded_tt:0 "The ballot is conceded before the march becomes something else."
 AUH_x_curial_franchise_tt:0 "Suffrage with national curias: every people votes within its own register."
 AUH_x_settlement_due_tt:0 "The renegotiation of the Settlement is on the table."
 AUH_x_delegations_ready_tt:0 "The Delegations are seated and the estimates are ready; the quota talks open well."
 AUH_x_east_window_tt:0 "While the Powers stare at Constantinople, much becomes possible."
 AUH_x_disposal_croatia_tt:0 "The provinces are attached to Croatia; a third pillar begins to bear weight."
 AUH_x_disposal_hungary_tt:0 "The provinces pass to the Holy Crown; Budapest is paid for its acquiescence."
 AUH_x_disposal_condominium_tt:0 "The provinces remain under the joint administration, a land of the Crown entire."
 AUH_x_vistula_tt:0 "A Habsburg candidature for a restored Poland is in the open, and Petersburg knows it."
 AUH_x_regency_prepared_tt:0 "The regency machinery is drafted, sealed, and ready to be read aloud."
 AUH_x_regency_now_tt:0 "The council of regency is proclaimed within the week."
 AUH_x_regiments_tt:0 "Order in the streets is now a military question."
 AUH_x_era_end_peace_tt:0 "The era closes with the Kingdom under the peace of the King."
 AUH_x_punitive_threat:0 "The punitive expedition against Serbia"
 AUH_x_vistula_threat:0 "A Habsburg crown for the Vistula"
 auh_clock.1.t:0 "The House That Cannot Vote"
 auh_clock.1.d:0 "The obstruction has won. The benches of the Reichsrat shout in five languages and vote in none; the estimates cannot be carried, the recruit contingent cannot be renewed, and the ministers wait in the corridor with a budget nobody may lawfully pass. Austria must be governed somehow. The fourteenth paragraph waits in the drawer where it has always waited."
 auh_clock.1.a:0 "Govern by the fourteenth paragraph"
 auh_clock.2.t:0 "The Word of Command"
 auh_clock.2.d:0 "Sixty-eight words of command hold the common army together, and Budapest now asks that they be spoken in Magyar. The recruit bill is hostage to the demand; the King will not yield the army, and the Kingdom will not vote the men. Somebody must pay for the year that is being lost."
 auh_clock.2.a:0 "The bill stalls; Vienna pays"
 auh_clock.3.t:0 "Blood in the Konak"
 auh_clock.3.d:0 "Officers of the Belgrade garrison have thrown their King and Queen from a window of the Konak, and the dynasty that takes the throne is a dynasty of the bomb and the barracks. Europe is disgusted, and Europe will not stay disgusted for long. Across the Save the question is asked at every desk of the Ballhausplatz: punish, buy, or strangle?"
 auh_clock.3.a:0 "Mourning, and a quarrel over pigs"
 auh_clock.4.t:0 "The Kingdom Refuses"
 auh_clock.4.d:0 "The Kingdom has voted, and it has voted against the King. The coalition of the gentry holds the chamber, refuses the recruits, refuses the estimates, and asks for the army as the price of governing at all. The Crown may appoint whom it likes; the counties will obey whom they like."
 auh_clock.4.a:0 "The coalition swears the army untouched"
 auh_clock.5.t:0 "The Street Asks for the Ballot"
 auh_clock.5.d:0 "A quarter of a million men stand on the Ring in silence, in their Sunday coats, and ask for the vote. There is no fighting; that is what makes it serious. The garrison commanders ask for instructions, and the ministers discover that there are none to give."
 auh_clock.5.a:0 "Suffrage for the Austrian half"
 auh_clock.6.t:0 "The Settlement Falls Due"
 auh_clock.6.d:0 "The decennium is over and the Settlement must be written again: the quota, the tariff, the bank, the army's money, everything the two halves share is on the table at once. The delegations pack their papers. The clock the founders wound has struck."
 auh_clock.6.a:0 "Let the ministers haggle"
 auh_clock.7.t:0 "The East in Motion"
 auh_clock.7.d:0 "Young officers have restored the constitution in the neighbouring empire, and a parliament will shortly sit where the Sultan governed alone. That parliament will ask for deputies from two provinces we have administered for thirty years without owning them. The fiction is over; the window is open; Petersburg is still counting its losses in the east."
 auh_clock.7.a:0 "The provinces will be declared"
 auh_clock.8.t:0 "The Emperor Is Dead"
 auh_clock.8.d:0 "The light in the window at Schönbrunn has gone out. The oldest servant of the state has left it, and everything he refused to decide is now decided by his absence. The bells of every church in the Monarchy say the same thing in eleven languages: the reign that was the state itself is over."
 auh_clock.8.a:0 "The bells of every church"
 auh_clock.9.t:0 "A Shot at Lemberg"
 auh_clock.9.d:0 "A student has shot the governor of Galicia in his own audience room. The east of the crownland buries one martyr and the west buries another, and the university, the curia and the frontier are all suddenly the same question. It was not inevitable; it merely was not prevented."
 auh_clock.9.a:0 "A trial, and a funeral of state"
 auh_clock.20.t:0 "A Cough at Schönbrunn"
 auh_clock.20.d:0 "The Emperor has a cold, the household says; the household has said so for a week. The audiences are shortened, the boxes go unsigned, and every chancery in the Monarchy quietly rereads the House Laws. It is nothing. It is the first nothing."
 auh_clock.20.a:0 "It is nothing, the household says"
 auh_clock.21.t:0 "The Physicians Confer"
 auh_clock.21.d:0 "Three physicians were called to Schönbrunn in one week, and none of them came away smiling. The boxes wait, the audiences lapse, and the ministries begin drafting in duplicate: one set for the reign that is, one for the reign that may be by spring."
 auh_clock.21.a:0 "Draft everything in duplicate"
 auh_clock.22.t:0 "The Vigil at Schönbrunn"
 auh_clock.22.d:0 "The court no longer pretends. The chapel is lit at all hours, the heir's household is reached by telephone twice a day, and the machine of the Monarchy slows because every hand that moves it is watching one bedroom window. Nothing may be decided now; everything is about to be."
 auh_clock.22.a:0 "Keep the vigil"
 auh_clock.30.t:0 "The Accession"
 auh_clock.30.d:0 "The Archduke has taken the oath before the assembled court, and the reign nobody planned for has begun. Whatever was prepared at the Belvedere, whatever was sworn in the counties, whatever was promised and never paid, all of it now comes due at once. The old reign held the realm together by lasting. The new one will have to do it some other way."
 auh_clock.30.a:0 "The Archduke takes the oath"
 AUH_clock_hub_house_tt:0 "The first bell has rung. The question of the House is open in the national focus tree: The House That Cannot Vote."
 AUH_clock_hub_word_tt:0 "The second bell has rung. The question of the army is open in the national focus tree: The Sixty-Eight Words."
 AUH_clock_hub_konak_tt:0 "The third bell has rung. The Serbian question is open in the national focus tree: Blood in the Konak."
 AUH_clock_hub_kingdom_tt:0 "The fourth bell has rung. The coalition has taken office, and the Hungarian question is open in the national focus tree: A Cabinet Without a Chamber."
 AUH_clock_hub_street_tt:0 "The fifth bell has rung. The question of the ballot is open in the national focus tree: The Street Asks for the Ballot."
 AUH_clock_hub_settlement_tt:0 "The sixth bell has rung. The renewal of the Settlement is open in the national focus tree: The Settlement Falls Due."
 AUH_clock_hub_east_tt:0 "The seventh bell has rung. The Bosnian window is open in the national focus tree: The East in Motion."
 AUH_clock_hub_vistula_tt:0 "A ninth bell, and it need never have rung. The Galician question is open in the national focus tree: A Crown for the Vistula."
 AUH_clock_street_calms_tt:0 "The street stands down; the pressure of the strike ebbs."
 AUH_clock_court_answers_tt:0 "The court has heard it too. Such answers as exist are found in the Court of Vienna."
 AUH_clock_succession_tt:0 "Franz Ferdinand is Emperor and King. The old reign is over."
 AUH_clock_era_end_tt:0 "The era closes with the succession: a new reign will need a new reckoning."
 auh_clock.1.b:0 "The majority carries the estimates"
 auh_clock.1.c:0 "Let the officials govern, and note the names"
 auh_clock.1.e:0 "Soldiers at the doors of the House"
 auh_clock.2.b:0 "Not one word of the sixty-eight"
 auh_clock.2.c:0 "Buy the bill with honest concessions"
 auh_clock.2.e:0 "The Kingdom presses its demand"
 auh_clock.3.b:0 "Close the frontier to their pigs"
 auh_clock.3.c:0 "A treaty for the new dynasty"
 auh_clock.3.e:0 "The staff drafts a timetable"
 auh_clock.4.b:0 "A cabinet of the bodyguard"
 auh_clock.4.c:0 "The chamber has beaten the King"
 auh_clock.4.e:0 "Let the Kingdom fester"
 auh_clock.5.b:0 "Build the franchise on the register"
 auh_clock.5.c:0 "Clear the Ring"
 auh_clock.6.b:0 "Open with the books balanced"
 auh_clock.6.c:0 "Budapest names its figure"
 auh_clock.7.b:0 "Acquiescence has a price"
 auh_clock.7.c:0 "Administer, and do not proclaim"
 auh_clock.7.e:0 "The window opens on a war"
 auh_clock.8.b:0 "The act comes out of the drawer"
 auh_clock.8.c:0 "The Chancellery crosses the garden"
 auh_clock.9.b:0 "Martial law east of the San"
 auh_clock.9.c:0 "The bargain, signed late"
 AUH_clock_old_man_strain_tt:0 "Another question of the reign settled by force; the strain tells at Schönbrunn."
 AUH_clock_word_bought_tt:0 "The bill is bought with honest coin; the county ledger stays cold."
 AUH_clock_konak_strangle_tt:0 "The frontier and the tariff will do the work of an army corps; the grievance is banked."
 AUH_clock_konak_buy_tt:0 "Guns on credit and a market for pigs: the new dynasty is given a reason to behave."
 AUH_clock_konak_sabre_tt:0 "The mobilisation timetable against Serbia is filed where it can be reached."
 AUH_clock_kingdom_defied_tt:0 "The Crown appoints its own men and dares the counties to refuse the taxes."
 AUH_clock_kingdom_ours_tt:0 "The coalition is ours: the chamber has beaten the King, and the counties know it."
 AUH_clock_register_answer_tt:0 "The register was filed years ago; the franchise can be built on its rolls."
 AUH_clock_street_broken_tt:0 "The Ring is cleared by the garrison, and the movement will remember the sabres."
 AUH_clock_settlement_squeeze_tt:0 "Budapest opens with a figure the ministers cannot say aloud."
 AUH_clock_east_price_tt:0 "The Kingdom will acquiesce, and names its price in keels and concessions."
 AUH_clock_east_patience_tt:0 "Nothing is proclaimed: the provinces are administered as before while the Powers stare at Constantinople."
 AUH_clock_regency_from_drawer_tt:0 "The act comes out of the drawer signed within the hour; the worst morning finds a government."
 AUH_clock_day_after_tt:0 "The Chancellery crosses the garden by the front door: the day after has come, and it was prepared."
 AUH_clock_lemberg_martial_tt:0 "The east of the crownland passes under the army; the frontier gains a garrison and an irredenta."
 AUH_clock_lemberg_bargain_tt:0 "What gratitude would have bought is now bought at full price — but it is bought."
 auh_clock.100.t:0 "The Chief Names His War"
 auh_clock.100.d:0 "The Chief of the General Staff has asked, in writing, for the one thing the Monarchy has never given him: a date. The file on the southern kingdom is complete — the roads counted, the bridges weighed, the season chosen — and the men around the table know that every year the question is deferred the answer grows dearer. A war is available. It must merely be named."
 auh_clock.100.a:0 "The hour is not chosen"
 auh_clock.100.b:0 "Send the note to Belgrade"
 auh_clock.100.c:0 "No note, no partners: the campaign alone"
 auh_clock.101.t:0 "Bülow Underwrites"
 auh_clock.101.d:0 "The answer from the Wilhelmstrasse arrives in a sealed envelope and consists, in substance, of one sentence: Germany will stand at the Monarchy's shoulder, and Petersburg will be told so in terms that admit of one reading. The Chancellor has decided that our quarrel is cheap at the price and that the debt will be collected later. It always is."
 auh_clock.101.a:0 "The shoulder of the ally"
 auh_clock.102.t:0 "Berlin Regrets"
 auh_clock.102.d:0 "The answer is courteous, warm, and empty. The moment is inopportune; the Emperor's health, the naval estimates, the temper of the Reichstag — the reasons fill two pages and amount to a single word. Whatever is undertaken in the south is undertaken alone, and the chancelleries of Europe will know it within the week."
 auh_clock.102.a:0 "Then we note the regret"
 auh_clock.103.t:0 "Petersburg Averts Its Eyes"
 auh_clock.103.d:0 "The eastern empire has counted its regiments, its railways and its loans, and has found the sum insufficient for the season. The ambassador delivers a note of measured sorrow: Russia reserves her sentiments and will consult her friends. The men at the Ballhausplatz read it twice to be sure. The road south is open — for a while."
 auh_clock.103.a:0 "The road is open"
 auh_clock.104.t:0 "Petersburg Stands"
 auh_clock.104.d:0 "There is no note of sorrow. The eastern empire answers with a partial mobilisation on the Galician frontier and a communiqué that names the Slavs of the south as a Russian care. Whatever was planned as a fortnight's promenade is now priced as a European question, and the price is printed where every chancellery can read it."
 auh_clock.104.a:0 "The note is withdrawn"
 auh_clock.104.b:0 "March anyway"
 auh_clock.104.c:0 "The die is already cast"
 auh_clock.105.t:0 "Belgrade Submits"
 auh_clock.105.d:0 "The Serbian answer arrives a day before the time allowed expires, and it concedes everything: the tariff, the ports, the association of officers, the wording of the apology. It is the sort of victory that costs a dynasty its dignity and saves its army, and the men who signed it will spend ten years explaining it. Vienna has won without a shot; the account of what that is worth is opened today."
 auh_clock.105.a:0 "A victory in ink"
 auh_clock.106.t:0 "The Answer Is No"
 auh_clock.106.d:0 "Belgrade has read the note, weighed the mountain roads and the autumn rains against the temper of its officers, and declined. The reply is dignified, brief, and unmistakable: the Kingdom will submit to arbitration, but not to Vienna. The chief has his answer, and asks for his marching orders."
 auh_clock.106.a:0 "To the Morava"
 auh_clock.106.b:0 "The ladder stops here"
 auh_clock.107.t:0 "What to Do with a Kingdom"
 auh_clock.107.d:0 "The army is over the Save, the capital is open, and the ministries that asked for this war now discover that nobody wrote the last chapter. A kingdom is lying on the table. It may be given a king who owes us everything, or divided with a neighbour who will owe us the half of it. What it cannot be is put back."
 auh_clock.107.a:0 "An Obrenović under our bayonets"
 auh_clock.107.b:0 "The partition with Sofia"
 auh_clock.108.t:0 "The Bands in the Šumadija"
 auh_clock.108.d:0 "The kingdom submitted; the villages did not. The first gendarmerie post was burned within the month, and the new King's writ runs precisely as far as our patrols. The staff calls it pacification and prices it at a decade. The bill is presented to Vienna, not to Belgrade, and it will arrive every year."
 auh_clock.108.a:0 "A decade of small war"
 auh_clock.109.t:0 "Belgrade Answers for Cetinje"
 auh_clock.109.d:0 "The quarrel was with the mountain, and the mountain has a brother. Serbian reservists are moving toward the frontier by the timetable of a state that has decided not to watch. If the two southern kingdoms are one question, they can be answered together; if they are two, one of them can wait. The chief, asked for his opinion, gives it in one word."
 auh_clock.109.a:0 "One mountain is enough"
 auh_clock.109.b:0 "Two wars are one war"
 auh_clock.180.t:0 "The Battery on the Mountain"
 auh_clock.180.d:0 "From the naval works at the Bocche the glasses can see them plainly: modern guns, foreign pattern, going up on the crest of the Lovćen, one by one, on the King of Montenegro's mountain and over the Monarchy's only southern anchorage. A fleet under another man's battery is a fleet on parole. The Marinesektion has written one sentence and underlined it: the guns, or the bay."
 auh_clock.180.a:0 "The guns may rust where they stand"
 auh_clock.180.b:0 "The ultimatum to Cetinje"
 auh_clock.181.t:0 "A Note from Vienna"
 auh_clock.181.d:0 "The great neighbour asks for one thing, and asks for it undressed of courtesy: the battery on the Lovćen is to come down, under inspection, within the month. The King has a mountain, an army of one campaign, and a brother-people across the frontier that promises much and signs little. The note is on the table, and the month has begun."
 auh_clock.181.a:0 "The battery is dismantled"
 auh_clock.181.b:0 "The King refuses"
 auh_clock.182.t:0 "The Battery Comes Down"
 auh_clock.182.d:0 "The inspectors watched from the ridge as the breeches were drawn and the carriages lowered onto the mule tracks. The bay is a Habsburg anchorage again, entire. Nothing was spent but powder never fired — and a certain quantity of good opinion, in Cetinje, in Petersburg, and in every small capital that has just learned what a note from Vienna weighs."
 auh_clock.182.a:0 "The anchorage is ours entire"
 auh_clock.183.t:0 "The Answer from the Black Mountain"
 auh_clock.183.d:0 "The King's reply is carried down the mountain by an officer in parade dress, and it is a poem: the Black Mountain has never given up a gun, and will not learn the habit from an empire. The month expires tomorrow. The fleet is in the bay; the mountain brigades are at Cattaro; the staff asks only whether the word is given."
 auh_clock.183.a:0 "To the heights"
 auh_clock.183.b:0 "The demonstration was enough"
 auh_clock.184.t:0 "The Heights Are Taken"
 auh_clock.184.d:0 "The batteries changed hands before the snow, and the flag over the Lovćen is black and yellow. The King's army has come down the far side of its own mountain, and the King's ministers ask for terms in French. The mountain kingdom is in the Monarchy's hand. The question is what the hand does."
 auh_clock.184.a:0 "A king under the eagles"
 auh_clock.184.b:0 "The heights and the harbours annexed"
 auh_clock.185.t:0 "The King Cannot Stay Out"
 auh_clock.185.d:0 "The telegrams from Cetinje arrive in Belgrade twice a day, and each one is read aloud in the cafés before it reaches the palace. The dynasty's newspapers have already chosen the word — brothers — and a government that lets the word pass unanswered may not remain a government. The army asks nothing better. The treasury asks a week's delay. The King must ask himself what a dynasty is for."
 auh_clock.185.a:0 "The army marches for the Black Mountain"
 auh_clock.185.b:0 "Brotherhood is a sentiment, not a policy"
 auh_clock.186.t:0 "The Mountain Remembers"
 auh_clock.186.d:0 "The dismantled emplacements are left as they fell, uncleaned, by instruction. Visitors are taken to see them. The King has lost his guns and kept his crown, and he has drawn from the ledger the only lesson small kingdoms are taught twice: the great neighbour will always be a neighbour, and never great enough to be loved. The next battery will be ordered quietly, and the next friend chosen further east."
 auh_clock.186.a:0 "The next friend, further east"
 AUH_clock_window_waits_tt:0 "The window closes unused; the question of the south is deferred, not answered."
 AUH_clock_note_sent_tt:0 "The note is at Belgrade, and every chancellery in Europe is reading a copy."
 AUH_clock_alone_tt:0 "No partner is asked and none is owed: the campaign, if it comes, is the Monarchy's alone."
 AUH_clock_berlin_cover_tt:0 "Berlin underwrites the southern account; Petersburg will be shown the signature."
 AUH_clock_cheque_returned_tt:0 "§RThe cheque from Berlin is returned uncashed; whatever follows in the south is uncovered.§!"
 AUH_clock_road_open_tt:0 "Russia stands aside for the season: the road to the Morava is open."
 AUH_clock_first_fortnight_tt:0 "The staff promises the first fortnight of the war. Whether the promise is kept depends on how well the plans were kept."
 AUH_clock_stood_down_tt:0 "The note is withdrawn and the moment passes; Europe files the retreat under Vienna's name."
 AUH_clock_european_war_tt:0 "§RThe early European war: the Monarchy marches with Russia standing, and the war itself will write the rest.§!"
 AUH_clock_die_cast_tt:0 "The campaign is already begun; Petersburg's answer changes its size, not its existence."
 AUH_clock_cheque_presented_tt:0 "Berlin's signature is on the account: the alliance is asked to pay in the east."
 AUH_clock_banked_win_tt:0 "Belgrade has submitted without war: a diplomatic victory, banked at full value."
 AUH_clock_march_tt:0 "The wargoal is named and the army marches when the order is given."
 AUH_clock_defiance_stands_tt:0 "The defiance is allowed to stand; the ladder was climbed for nothing."
 AUH_clock_obrenovic_tt:0 "A king who owes Vienna everything is seated in the Konak, and the Kingdom becomes a ward of the Monarchy."
 AUH_clock_pacification_opens_tt:0 "§RThe Šumadija will not submit with its capital: the pacification opens on the ladder, and will be paid for yearly.§!"
 AUH_clock_partition_tt:0 "The Kingdom is divided: the Morava for the Monarchy, the eastern marches for Sofia."
 AUH_clock_small_war_tt:0 "The pacification is priced honestly: a decade of small war, paid annually from the ladder."
 AUH_clock_mountain_watched_tt:0 "Belgrade's mobilisation is watched and not answered; the southern question keeps its two halves."
 AUH_clock_two_wars_tt:0 "The two southern kingdoms are named as one question, to be answered by one campaign."
 AUH_clock_guns_tolerated_tt:0 "§RThe foreign guns keep the heights, and the southern anchorage remains a fleet on parole.§!"
 AUH_clock_ultimatum_sent_tt:0 "The ultimatum is at Cetinje: the battery comes down within the month, or the army goes up."
 AUH_clock_battery_razed_tt:0 "The battery is razed under inspection and the Bocche is a Habsburg anchorage entire; the bill is paid in opinion."
 AUH_clock_heights_war_tt:0 "The wargoal is named against Cetinje: a short war for the heights, priced to stay a local one."
 AUH_clock_fleet_stands_off_tt:0 "The fleet stands off and the ultimatum dies of old age; the mountain keeps its guns and Europe keeps the anecdote."
 AUH_clock_king_under_eagles_tt:0 "The King keeps his crown under the Monarchy's eagles, and the heights keep their new garrison."
 AUH_clock_heights_annexed_tt:0 "The mountain kingdom is entered on the map of the Monarchy, harbours, heights and grievances entire."
 AUH_clock_threat_the_note:0 "An Austrian note at Belgrade"
 AUH_clock_threat_the_silence:0 "The Ballhausplatz consults nobody"
 AUH_clock_threat_the_march_on_belgrade:0 "The march on Belgrade"
 AUH_clock_threat_the_european_war:0 "The European war, come early"
 AUH_clock_threat_petersburg_answers:0 "Petersburg answers the campaign"
 AUH_clock_threat_the_restoration:0 "A king restored by foreign bayonets"
 AUH_clock_threat_the_partition:0 "The partition of Serbia"
 AUH_clock_threat_two_wars:0 "Two wars in the south"
 AUH_clock_threat_the_mountain:0 "An ultimatum at Cetinje"
 AUH_serb_the_last_rung_of_the_ladder:0 "The Last Rung of the Ladder"
 AUH_serb_the_last_rung_of_the_ladder_desc:0 "Above the tariff and the closed frontier there is one rung more, and everything above it is not commerce. Draft the note that names the Monarchy's terms, and let the chief name his war if Belgrade declines them."
 AUH_serb_last_rung_tt:0 "The war council meets: the question of the south will be put plainly."
 AUH_serb_the_sumadija_pacification:0 "The Pacification of the Šumadija"
 AUH_serb_the_sumadija_pacification_desc:0 "The bands burn a post, the column burns a village, and the accountants enter both under the same heading. The Kingdom was conquered in a season; it is held one year at a time."
 AUH_serb_pacification_tt:0 "The columns go through the hills again; the Kingdom is held for one more year."
 auh_clock.110.t:0 "The Meeting at Buchlovice"
 auh_clock.110.d:0 "In Count Berchtold's Moravian castle the two foreign ministers walk the gardens without secretaries and without minutes. Izvolsky's price is the Straits opened to Russian warships; ours is a free hand in the two provinces. Nothing is signed. Each man leaves believing the other has agreed to something, and only one of them can be right about what."
 auh_clock.110.a:0 "Deal honestly, and be bound"
 auh_clock.110.b:0 "Promise him the Straits"
 AUH_clock_buchlau_honest_tt:0 "The understanding is real: a date, a text, a bargain both capitals can survive. When the provinces are declared, Petersburg will be bound by its own signature."
 AUH_clock_buchlau_promise_tt:0 "Izvolsky leaves the castle with a promise the Ballhausplatz has no intention of keeping. The bill will be presented later, and not to us first."
 auh_clock.111.t:0 "The Tour of the Capitals"
 auh_clock.111.d:0 "Izvolsky travels west by easy stages to sell the bargain — Paris, London, a shooting party in the country. The declaration, when it comes, will not wait on his itinerary; what matters now is what he believes he agreed to, and what he can prove."
 auh_clock.111.a:0 "He will read it in the newspapers"
 auh_clock.111.b:0 "The bargain holds"
 AUH_clock_buchlau_remembered_tt:0 "Russia will remember Buchlau. Every Russian answer this monarchy waits on for the rest of the era is weighted by the memory."
 AUH_clock_buchlau_bound_tt:0 "Petersburg is bound and knows it; the protest will be formal, and short."
 auh_clock.112.t:0 "The Disposal of the Provinces"
 auh_clock.112.d:0 "The common ministerial council sits on the one question the proclamation left open. The provinces are held; they are not yet placed. Every crown in the Monarchy has a claim, the Kingdom insists on its veto, and the army has a map of the Sanjak on the table. The disposition will follow from everything this government has already chosen."
 auh_clock.112.a:0 "The question is put"
 AUH_clock_disposal_pending_tt:0 "The disposition will be announced within the week, and it will follow from the path this government has walked."
 AUH_clock_disposal_council_tt:0 "The common ministerial council convenes on the disposal of the provinces; the disposition will follow."
 auh_clock.113.t:0 "A Land of the Crown Entire"
 auh_clock.113.d:0 "Neither Vienna nor Budapest will suffer the other to have them, so the provinces will belong to both and answer to neither: a Reichsland under the common Finance Ministry, governed well and represented nowhere. It is the arrangement everyone can live with, which is this Monarchy's own definition of a settlement."
 auh_clock.113.a:0 "So it remains"
 AUH_clock_reichsland_entire_tt:0 "The provinces answer to the common ministry alone. The annexation is banked — and Petersburg is left to nurse it."
 AUH_clock_condominium_stands_tt:0 "Nothing is proclaimed and nothing is signed; the provinces are administered as they have been for thirty years."
 auh_clock.114.t:0 "The Third Pillar"
 auh_clock.114.d:0 "The rescript attaches the provinces to the Kingdom of Croatia and Slavonia, and with one signature the South Slavs of the Monarchy acquire a border, a diet and a majority somewhere. Zagreb rings its bells. Budapest reads the rescript twice, because the lands of the Holy Crown have just been rearranged without asking the Holy Crown."
 auh_clock.114.a:0 "Zagreb will bear the weight"
 AUH_clock_franks_charter_tt:0 "It is Frank's charter: the attachment is written by the party of the Crown, and the Serb benches of the Sabor are not consulted."
 AUH_clock_coalition_charter_tt:0 "The Coalition's benches vote for the attachment: negotiated, not imposed, and the Serbs of the Kingdom vote with it."
 AUH_clock_trialism_seeded_tt:0 "A South Slav political body now exists inside the Monarchy, with a border and an appetite. The road to a third crown is open."
 auh_clock.115.t:0 "The Price of Acquiescence"
 auh_clock.115.d:0 "The provinces pass to the lands of the Holy Crown, as the Kingdom's price for letting the declaration stand. Two million new subjects learn Magyar administration; the Ballhausplatz learns what the Kingdom's silence costs; and Vienna signs, because the alternative was the Kingdom's voice."
 auh_clock.115.a:0 "Budapest is paid"
 AUH_clock_hungary_price_tt:0 "The provinces pass to the Holy Crown. The Kingdom's acquiescence on every other question of the era is included in the price."
 auh_clock.116.t:0 "The Protectorate of the Two Provinces"
 auh_clock.116.d:0 "The Young Turks' parliament needs a success it can survive, and offers one: suzerainty acknowledged, the administration ours by treaty, the garrisons of the Sanjak kept, and not one Power able to call any of it a seizure. It is the smallest triumph on the table, and the only one nobody in Europe will spend a decade avenging."
 auh_clock.116.a:0 "Sign with the Young Turks"
 auh_clock.116.b:0 "The provinces will not wait forever"
 auh_clock.116.c:0 "Events have outrun the ink"
 AUH_clock_sanjak_kept_tt:0 "The garrisons of Novi Pazar remain by treaty. The corridor to the south is kept, and no congress will ever be summoned about it."
 AUH_clock_nothing_to_nurse_tt:0 "No annexation, no humiliation: Petersburg is given nothing to nurse."
 AUH_clock_question_open_tt:0 "The offer is declined. The question of the provinces stays open, and the window with it."
 AUH_clock_offer_moot_tt:0 "The provinces were declared while the Porte's draft was still crossing the frontier."
 auh_clock.117.t:0 "The Chief Counts the Corps"
 auh_clock.117.d:0 "Serbia has mobilised over a proclamation, Russia is in no condition to answer for her, and the Chief of the General Staff is in the antechamber with the same memorandum as always and, for once, arithmetic that supports it. There will not be a cheaper hour for the reckoning in the south — which is precisely what makes it tempting, and precisely what should frighten us."
 auh_clock.117.a:0 "There will never be a cheaper hour"
 auh_clock.117.b:0 "Hold the leash"
 AUH_clock_serbia_window_tt:0 "The third window is open: with Conrad at the staff, the short campaign can be named in the national focus tree."
 AUH_clock_window_declined_tt:0 "The moment passes. The army stands down, and the annexation is digested in peace."
 AUH_clock_conrads_moment_threat:0 "Austria-Hungary counts the corps on the Save"
 auh_clock.118.t:0 "The Lands of the Crown Do Not Shrink"
 auh_clock.118.d:0 "The Hungarian Diet declares the attachment null in the lands of the Holy Crown, votes it a grievance of the first constitutional order, and instructs its delegation accordingly. The Kingdom has not lost a hectare and screams as if it had lost a kingdom — because in the arithmetic of the Settlement, a third pillar is subtraction."
 auh_clock.118.a:0 "The Crown has spoken"
 auh_clock.118.b:0 "Soften it with a price"
 AUH_clock_paid_scream_tt:0 "A loan, a tariff line, a railway concession: the Kingdom's constitutional objection is discovered to have a market price."
 auh_clock.120.t:0 "A Quarter Million on the Ring"
 auh_clock.120.d:0 "The federations have set the day: on Sunday the unions will put a quarter of a million men on the Ringstrasse, in Sunday coats, in silence, with the franchise as their only banner. The bell rang once already; this is the street's answer to everything done and not done since. The ministers can announce the bill before Sunday, wait among the crowd and yield there, or instruct the garrison — and the garrison, this time, will be asked to move against men who speak its own languages."
 auh_clock.120.a:0 "Announce the franchise before Sunday"
 auh_clock.120.b:0 "Let them march, and concede on the Ring"
 auh_clock.120.c:0 "The Ring will be cleared"
 AUH_clock_march_conceded_tt:0 "The ballot is conceded with the government still standing upright; the march arrives as a celebration."
 AUH_clock_march_won_tt:0 "The street has learned that a quarter million in silence outvotes a chamber; it will remember the lesson, and use it again."
 AUH_clock_march_order_tt:0 "The order is signed. Whether the regiments obey it is now a matter for the regiments: the answer will come from Ostrava and Trieste."
 auh_clock.121.t:0 "The Regiment at Ostrava"
 auh_clock.121.stood.d:0 "The colonel read the order to a regiment recruited from the very pits and foundries now on strike, and the regiment presented arms. Ostrava is held. The men did their duty; their families will not soon forgive them for it."
 auh_clock.121.refused.d:0 "The order was read twice at Ostrava, and twice the ranks stood still. A Czech regiment asked to clear Czech miners from their own square has discovered that it is Czech first. The colonel confined it to barracks before a worse word could be found for what this is."
 auh_clock.121.a:0 "File the report"
 auh_clock.122.t:0 "The Regiment at Trieste"
 auh_clock.122.stood.d:0 "At Trieste the garrison moved before the crowd had finished assembling, and the Italian battalions went with it — sullen, exact, obedient. The quays are held. The city has noted which regiments held them."
 auh_clock.122.refused.d:0 "The battalion at Trieste heard the order in German and answered in Italian, and the answer was no. The men will not sabre the arsenal workers among whom they were raised. The harbour belongs to the strikers tonight."
 auh_clock.122.a:0 "File the report"
 auh_clock.123.t:0 "The Answer of the Garrison"
 auh_clock.123.held.d:0 "Both garrisons obeyed. The Ring was cleared between noon and dusk — sabres flat, and then not flat — and the marchers' silence has been replaced by a different one. The vote has been refused and the refusal has held. What the movement does with its defeat is now the question."
 auh_clock.123.refused.d:0 "The order came back from the garrisons unexecuted. A state that asks its regiments to move against the street and is told no has learned something about itself in public. The strike has spread with the news, and the county assemblies have taken note of what an order is worth."
 auh_clock.123.a:0 "So it stands"
 AUH_clock_garrison_refused_tt:0 "The garrison's refusal is known in every town by morning: the strike surges, and the counties have learned that an order can be told no."
 auh_clock.124.t:0 "The Internationale in Pieces"
 auh_clock.124.d:0 "The movement that stood together on the Ring has not survived being beaten there together. The Czech unions blame the German leadership for the sabres; the German executive blames the street for provoking them; Adler, who held the improbable structure in one piece for twenty years, has resigned rather than preside over the inquest. The Internationale in Austria now speaks its nationalities' languages, and nothing else."
 auh_clock.124.a:0 "A quieter opposition"
 AUH_clock_adler_retires_tt:0 "Victor Adler withdraws from public life; no one remains who could hold the movement together."
 AUH_x_the_internationale_in_pieces:0 "The Internationale in Pieces"
 AUH_x_the_internationale_in_pieces_desc:0 "The workers' movement has split along its nationalities, and each fragment hates the sabres one degree less than it hates the other fragments. The government faces no united opposition — and no united anything else."
 auh_clock.130.t:0 "The Empty Chair at Lemberg"
 auh_clock.130.d:0 "The governor is buried, the student will hang, and the Statthalter's chair in Lemberg stands empty at the worst possible moment: the east of the crownland is ungovernable in Ruthenian eyes and ungoverned in Polish ones. Whoever is sent — a soldier, a professor, a friend of the Polish club — will be the answer Vienna gives to the question the shot asked."
 auh_clock.130.a:0 "A soldier for the east"
 auh_clock.130.b:0 "Send for Bobrzyński"
 auh_clock.130.c:0 "Hear the Polish club's price"
 AUH_clock_chair_soldier_tt:0 "The chair will go to a general, and the east of the crownland with it; martial law will follow within the week."
 AUH_clock_chair_professor_tt:0 "The historian who believes Galicia can be settled will be asked to prove it from the Statthalter's chair."
 AUH_clock_chair_polish_club_tt:0 "The club will fill the chair with its own man — and has begun, very quietly, to speak of a candidate for a larger one. The question stands open in the national focus tree: A Crown for the Vistula."
 auh_clock.131.t:0 "Martial Law East of the San"
 auh_clock.131.d:0 "Eastern Galicia passes under military administration: courts martial for political offences, the Ruthenian societies dissolved, the university chairs suspended. The frontier is quiet in the way a held thing is quiet. Every Russophile pamphlet east of the San now writes itself, and the army that must one day defend this frontier will defend it among a population it has just finished teaching whom to hope for."
 auh_clock.131.a:0 "The east passes under the army"
 AUH_x_russophile_irredenta_tt:0 "A Russophile irredenta now sits on the exact frontier the army must defend: every reckoning with Russia will be fought a little at home."
 auh_clock.132.t:0 "The Professor Takes the Chair"
 auh_clock.132.d:0 "Bobrzyński takes the chair with a historian's contempt for the quarrel he inherits and a politician's exact count of what it costs. The university question is reopened, the Ruthenian curia drafted, the Podolacy informed rather than consulted. It is the bargain of Lemberg signed late and at the market price — but signed."
 auh_clock.132.a:0 "The settlement, bought at full price"
 AUH_clock_bobrzynski_tt:0 "Michał Bobrzyński is available to the government as Statthalter of Galicia; the settlement he buys is real."
 auh_clock.133.t:0 "A Candidature on the Vistula"
 auh_clock.133.d:0 "Vienna has let it be known — deniably, through the Polish club's newspapers — that a Habsburg archduke could one day answer to the name of a Polish crown. Whatever is meant by it, Warsaw has read it, and Warsaw is a Russian city. The Foreign Ministry asks for instructions."
 auh_clock.133.a:0 "This will be remembered"
 auh_clock.133.b:0 "A rumour is not a policy"
 auh_clock.134.t:0 "The Line of Żywiec"
 auh_clock.134.d:0 "Karl Stephan of the house of Habsburg keeps his court at Żywiec, speaks Polish at his own table, and has married his daughters into the szlachta. Nobody at that table says the word crown. The question is whether the Archduke should now be taught the part he may one day be asked to play — the club is willing to be his tutor, and Petersburg is certain to hear of every lesson."
 auh_clock.134.a:0 "The Archduke learns his part"
 auh_clock.134.b:0 "The candidature stays deniable"
 AUH_clock_karl_stephan_tt:0 "The line of Żywiec is groomed for a crown that does not yet exist; if Poland is ever restored, the Monarchy has its candidate ready."
 AUH_clock_karl_stephan_quiet_tt:0 "The lessons are postponed; the candidature remains a rumour that can be denied."
 auh_clock.135.t:0 "Petersburg Says Nothing"
 auh_clock.135.d:0 "The candidature is in the open and the protest has not come. Russia's chancelleries have other fires to put out, or no water left to put them out with. The silence from Petersburg is the loudest encouragement the Vistula project has yet received — nothing now stands between the Monarchy and its temptation but its own judgement."
 auh_clock.135.a:0 "Nothing stands in the way"
 AUH_clock_vistula_silence_tt:0 "No protest will come; the reckoning with Russia can be chosen at leisure."
 AUH_x_vistula_war_hook_tt:0 "The candidature is a war the Monarchy has promised itself: when the reckoning with Russia comes, Galicia and the crown of the Vistula are what it will be about."
 auh_clock.140.t:0 "The Case Against Belgrade"
 auh_clock.140.d:0 "The arrests are made and the treason case wants its evidence. The archives hold enough for suspicion and not enough for a verdict; a court that respects itself will probably acquit. Then the despatch box from the Belgrade legation is opened, and there it all is: minutes, receipts, a society's whole ledger of treason, in fresh ink and convenient order. The couriers have brought exactly what the case was missing."
 auh_clock.140.a:0 "Only what the archives can prove"
 auh_clock.140.b:0 "The despatches from the legation"
 auh_clock.140.c:0 "The file goes back in the drawer"
 auh_clock.141.t:0 "The Verdict on the Evidence"
 auh_clock.141.d:0 "The state has pleaded what it could prove, which was diligence, sympathy, and a great deal of coffee drunk in the wrong houses. The bench has weighed it without gratitude, as benches will. Honest cases have this one weakness: they can be lost, and everyone in the chamber knows which kind this is."
 auh_clock.141.a:0 "The court has spoken"
 auh_clock.141.b:0 "Let the sentences stand"
 auh_clock.141.c:0 "Lay the verdicts before the Crown"
 auh_clock.142.t:0 "The Professor Asks for the Provenance"
 auh_clock.142.d:0 "The treason case opens to a full gallery, and for two days the despatches perform beautifully. On the third day the deputy for the realists rises — a professor with a valise — and puts one question only: where, precisely, did these documents come from? The prosecution asks for an adjournment. The valise waits."
 auh_clock.142.a:0 "The hearing continues"
 auh_clock.143.t:0 "The Annotated Forgeries"
 auh_clock.143.d:0 "The professor spent his recess in Belgrade, and he has come back with the originals. One hand wrote the despatches, on one stock of paper, several of them dated to days when the society they minute had not yet met. He reads the annotations slowly, to a full chamber, and lets the arithmetic of the calendar do the shouting. The state's case is not lost; it is laughed out of existence, and the state with it."
 auh_clock.143.a:0 "The ministry answers for it"
 auh_clock.143.b:0 "No apology to a courtroom"
 auh_clock.144.t:0 "The Verdict Holds"
 auh_clock.144.d:0 "The provenance held — or rather, no one who could break it was believed in time. The convictions are read to a silent gallery; the Coalition's deputies leave the chamber convicted or compromised; and the men who manufactured the case note, for future use, that it worked. Some victories teach a state exactly the wrong lesson."
 auh_clock.144.a:0 "The Coalition is broken"
 auh_clock.144.b:0 "Quash it even so"
 auh_clock.145.t:0 "The Scandal Reaches London"
 auh_clock.145.d:0 "A Scottish historian and the correspondent of the Times have annotated the annotations, and the despatches are now published where the Ballhausplatz cannot subpoena the reader. Europe's cartoonists have the forger's inkwell. Europe's chancelleries have a note in the margin of every future assurance from Vienna."
 auh_clock.145.a:0 "There is nothing to be said"
 auh_clock.146.t:0 "The Answer of the Bomb"
 auh_clock.146.d:0 "The Coalition's clubs are shut, its papers suppressed, its deputies convicted — and a student has just thrown a bomb at the commissioner's carriage on the Ilica. The politics the trial killed had a queue behind it, and the next man in the queue does not make speeches."
 auh_clock.146.a:0 "Commissioners, and more of them"
 auh_clock.146.b:0 "Loosen the commissariat"
 auh_clock.147.t:0 "The Hofburg Receives the Coalition"
 auh_clock.147.d:0 "The men the state prosecuted stand in the audience chamber, and the old form does its old work: whom the Hofburg receives, the Monarchy has forgiven — and of whom the Hofburg asks forgiveness, in the language of receptions, all Europe takes note. It is a small ceremony. It buys what commissioners cannot."
 auh_clock.147.a:0 "The audience is granted"
 AUH_serb_the_case_against_belgrade:0 "The Case Against Belgrade"
 AUH_serb_the_case_against_belgrade_desc:0 "Between the Coalition's benches and the Belgrade legation there is said to run a channel of money and instructions. The Ballhausplatz proposes to prove it in a courtroom. What can be proven, and with what, is a question the ministers would prefer to answer after the arrests."
 AUH_forgery_honest_tt:0 "The case will be built from what the archives can prove, and may well die of it."
 AUH_forgery_promise_tt:0 "The despatches will carry the trial: the Coalition broken in open court, its benches emptied, Belgrade's hand shown to all Europe."
 AUH_forgery_case_dropped_tt:0 "There will be no trial. The legation's despatches stay in their box, and their provenance stays nobody's business."
 AUH_forgery_dice_tt:0 "Nothing was decided in the chamber today. The provenance of the despatches will decide everything."
 AUH_forgery_gem_crash_tt:0 "The Monarchy has been caught manufacturing the treason of its own citizens; nothing in the era costs the common state more than this afternoon."
 AUH_forgery_friedjung_tt:0 "The historian who swore to the documents is destroyed in an afternoon; his footnotes survive him."
 AUH_forgery_forgach_retired_tt:0 "The minister at Belgrade retires to his estates, his despatches unthanked."
 AUH_forgery_minister_recalled_tt:0 "A legation clerk is recalled, a chancery door is repainted, and no one of rank is named."
 AUH_forgery_file_burned_tt:0 "The file of manufactured documents goes into the stove, years too late."
 AUH_forgery_no_apology_tt:0 "The ministry does not resign and the bureau does not repent; the file stays open, and so does the wound."
 AUH_forgery_hub_opens_tt:0 "The road to Canossa is open: the Hofburg may yet receive the Coalition it prosecuted."
 AUH_forgery_coalition_broken_tt:0 "The Croat-Serb Coalition is broken as a parliamentary force; its cause leaves the chamber for the street."
 AUH_forgery_rauch_tt:0 "The Ban named by the Crown governs by commissariat now, with the verdict for a warrant."
 AUH_forgery_commissioner_sought_tt:0 "A commissioner is sought for Zagreb: the verdict waits for a man willing to use it."
 AUH_forgery_capitals_tt:0 "The despatches, annotated, are read in London and Paris; the word of the Ballhausplatz is quoted at a discount in every chancellery."
 AUH_forgery_bomb_hardens_tt:0 "The commissariat digs in; the movement goes further underground, and further from politics."
 AUH_forgery_bomb_relents_tt:0 "The clubs reopen and the censors relent; whether the queue behind the bomb disperses is Croatia's to decide."
 AUH_forgery_receipt_tt:0 "The reception is held, the quashing is understood, and the South Slavs leave the Hofburg with something no trial could have taken from them."
 AUH_forgery_reception_due_tt:0 "The Coalition will be received at the Hofburg within the week."
 AUH_forgery_zagreb_verdict_threat:0 "The treason verdicts of Zagreb"
 AUH_forgery_won_trial_threat:0 "A coalition broken by a courtroom"
 AUH_forgery_scandal_threat:0 "The forgeries read in every capital"
 auh_clock.150.t:0 "The Earth Opens at Messina"
 auh_clock.150.d:0 "The earth has opened at the straits and shut again on a hundred thousand of our ally's subjects. Messina is rubble to the waterline, Reggio answers no signal, and the King of Italy digs with his soldiers. The squadron at Pola has steam up within the day. In the Operations Bureau another calculation is being made in a small, exact hand: the ally of the treaty's text is the enemy of the staff's arithmetic, and he is lying down."
 auh_clock.150.a:0 "The squadron sails for the straits"
 auh_clock.150.b:0 "The chief asks for his hour"
 auh_clock.150.c:0 "An ally, for once, in earnest"
 auh_clock.151.t:0 "The Memorandum Goes to Schönbrunn"
 auh_clock.151.d:0 "The chief of the general staff has put it on paper: the Italian army is under its own barracks, the fleet is hauling corpses, the passes stand open, and such an hour will not strike twice in a hundred years. The memorandum asks for the one signature that can turn arithmetic into orders — and it goes to a desk where the word preventive has been refused before, by an old man who has lost every war he was talked into."
 auh_clock.151.a:0 "Place the memorandum before the crown"
 auh_clock.151.b:0 "Withdraw it before the answer comes"
 auh_clock.152.t:0 "The Sanction"
 auh_clock.152.d:0 "Against every expectation of the Ballhausplatz, the answer from the audience is consent. Whether it is a new hand on the throne or an old hand grown tired of refusing, the staff has its sanction; by the morning courier the corps commands are asking for the timetable. What was arithmetic an hour ago is policy now — if we choose to make it march."
 auh_clock.152.a:0 "The hour will not strike twice"
 auh_clock.152.b:0 "The moment passes"
 auh_clock.153.t:0 "The Veto Stands"
 auh_clock.153.d:0 "The answer comes back in the Emperor's own hand, and it is No. He has not kept the peace of the house for forty years to open his last decade by stabbing a buried ally; the alliance may be paper, but the signature on the paper is his. The memorandum returns to its drawer, and the chief of the staff reads the refusal twice, and reaches for his pen."
 auh_clock.153.a:0 "The crown has answered"
 auh_clock.153.b:0 "He asks again, in writing"
 auh_clock.154.t:0 "The Staff Passes"
 auh_clock.154.d:0 "The second memorandum was not answered by the Emperor at all; it was answered by the Military Chancellery, in the third person. The chief of the general staff is thanked for his services and relieved of them. The best head of the war party rolls at its own insistence — the faction has eaten its own — and the maps pass to a second pick who will keep them in better order and open them less."
 auh_clock.154.a:0 "The second pick takes the maps"
 auh_clock.155.t:0 "The Ally Upright"
 auh_clock.155.d:0 "The dead of Messina are buried, and the living remember whose sailors dug. The relief from Pola was catalogued in Rome down to the last blanket and the last hour, and for the first time since it was signed, the treaty of the three describes something that exists. The staffs may now talk about something other than each other."
 auh_clock.155.a:0 "Bank the friendship"
 auh_clock.155.b:0 "Name the price of the seventh article"
 auh_clock.156.t:0 "The Ships from Pola"
 auh_clock.156.d:0 "The first foreign ensign over the rubble was Austrian. Whatever the treaty says and whatever the staff suspects of the works above the passes, the sailors from Pola dug our people out of our own stones with their hands, and were burying their own dead beside ours by nightfall. The Consulta may decide what the country ought to feel about it. The country has decided already."
 auh_clock.156.a:0 "The country has decided"
 auh_clock.156.b:0 "Count the bunkers behind the stretchers"
 AUH_clock_messina_sanction_needed_tt:0 "Nothing marches without the crown: the memorandum must survive Schönbrunn before a single corps entrains."
 AUH_clock_messina_veto_odds_tt:0 "While the old Emperor lives the veto is near-certain; a sword at the crown's elbow, or a new reign, would change the arithmetic."
 AUH_clock_messina_reconciled_tt:0 "There is no war party proposal on the table: the ships sail because the ally is, for once, an ally."
 AUH_clock_messina_from_the_works_tt:0 "The opening battles start from the works of the passes: the barrier built against the ally serves the march into him."
 AUH_clock_messina_open_frontier_tt:0 "The fortress credit went to other frontiers; the opening battles will be fought in the open."
 AUH_clock_messina_stayed_tt:0 "The sanction is left unspent; the arithmetic goes back into its drawer with its author's reputation."
 AUH_clock_messina_second_ask_tt:0 "A second refusal will not leave the chief at his desk."
 AUH_clock_messina_staff_passes_tt:0 "Conrad is retired, the memoranda go with him, and the staff passes to the second pick."
 AUH_clock_alliance_real_tt:0 "The Triple Alliance describes, for the first time, something that exists."
 AUH_clock_messina_threat:0 "Austria-Hungary falls upon a stricken ally"
 AUHDNC_h_the_bank_of_the_kingdom:0 "The Bank of the Kingdom"
 AUHDNC_h_the_bank_of_the_kingdom_desc:0 "The charter of the common bank is running out, and Justh's men have found the one demand no coalition can survive: a bank of issue for the lands of the Holy Crown alone — Hungarian notes, Hungarian gold, a Hungarian discount rate. Money is the last common institution but the King. We shall put the question and count who stands."
 auh_clock.160.t:0 "The Charter on the Table"
 auh_clock.160.d:0 "The bill is laid on the table of the House: an independent bank of issue for the Kingdom. Andrássy's settlement men say the common bank is the Compromise itself; Justh's men say that is precisely the point. Both are right, which is why the Coalition cannot vote on this and remain a coalition."
 auh_clock.160.a:0 "Present the charter as written"
 auh_clock.160.b:0 "Blunt the clause and keep the Coalition"
 auh_clock.161.t:0 "The Sixty-Sevens Walk Out"
 auh_clock.161.d:0 "The vote is put and the benches empty: the settlement men walk out of the Coalition rather than out of the Settlement. What remains on the government side is a single party with a single demand, and the demand is no longer a bank."
 auh_clock.161.a:0 "The Kingdom has one party now"
 auh_clock.162.t:0 "The Treaty Runs Out"
 auh_clock.162.d:0 "The term of the economic compromise expires and no address of renewal is sent to the throne. At midnight the common tariff has no legal existence, and the Kingdom's customs men wait at the Leitha bridges for instructions. Vienna must now say aloud whether the union is commerce or coercion."
 auh_clock.162.a:0 "Let it lapse: nothing common but the King"
 auh_clock.162.b:0 "The King will not receive the address"
 auh_clock.163.t:0 "A Union Dissolves in the North"
 auh_clock.163.d_gone:0 "The telegraph brings it from Kristiania: the Storthing has declared the union with Sweden dissolved, and the King of Sweden renounces the Norwegian crown rather than levy war for it. Two peoples have divided a throne across a conference table, and every chancellery with a composite crown is reading the dispatches twice."
 auh_clock.163.d_standing:0 "The correspondents write from Kristiania that the northern union is sickening of a familiar disease: separate consuls refused, separate banks demanded, a treaty nobody will renew. Whether Stockholm fights or signs, every capital with a composite crown is reading the dispatches twice."
 auh_clock.163.a:0 "A demonstration: thrones can be divided by lawyers"
 auh_clock.163.b:0 "A warning: unions die of neglect"
 auh_clock.164.t:0 "Nothing Common but the King"
 auh_clock.164.d:0 "In two chambers a thousand miles of law is repealed in an afternoon. The delegations are dissolved, the common ministries wound up, the quota struck from the statute book at nothing. What is left in common is a man: King in Buda, Emperor in Vienna, and no clause between the two crowns but his heartbeat."
 auh_clock.164.a:0 "Two kingdoms, one crown"
 auh_clock.165.t:0 "Agram Answers the Crown"
 auh_clock.165.d:0 "Agram was promised to neither party, and the court has kept its own accounts. The Triune Kingdom does not pass under the schedule of Saint Stephen: Croatia-Slavonia is retained to the dynasty directly, and Budapest signs the loss because the alternative is signing nothing."
 auh_clock.165.a:0 "The Triune Kingdom holds to the dynasty"
 auh_clock.166.t:0 "Agram Under Saint Stephen"
 auh_clock.166.d:0 "No one asked Agram. The Nagodba passes whole into the new Kingdom's law, the ban answers to Budapest alone, and the Sabor learns of the divorce from the newspapers. The lawyers call it continuity. The students on the Ilica call it something shorter."
 auh_clock.166.a:0 "The ban answers to Budapest"
 auh_clock.167.t:0 "The Sword Over the Statute"
 auh_clock.167.d:0 "The refused address does not go away; it goes to the counties. Fee collection falters on the Alföld, commissioners are appointed, and the garrison commanders reread their instructions. The customs question has become the crown question, and the crown question has a bell of its own."
 auh_clock.167.a:0 "The counties will not collect the King's taxes"
 auh_clock.167.b:0 "Withdraw the address for a season"
 AUH_h_the_break_promised_tt:0 "The sixty-sevens will not sit under this bill. The break is coming: the Coalition has days to live, and the price and the prize will be paid when it falls."
 AUH_h_settlement_party_seceded_tt:0 "The settlement party has left the Coalition. The Kingdom's politics has one party now, and it wants the union gone: The Personal Union is open in the national focus tree."
 AUH_h_the_engine_stands_still_tt:0 "There is no settlement left to renew: the quota clock stops, and no renewal will ever be asked again."
 AUH_h_the_quota_restored_tt:0 "The lapse is refused from the throne: the quota stands at the old figure, and the common tariff is carried by decree."
 AUH_h_the_crisis_changes_hands_tt:0 "The question is no longer commercial. The Crown and the counties will settle it the way the fourth bell settles things."
 AUH_h_north_demonstration_tt:0 "Budapest has watched a union end across a table. The road to the personal union runs faster from here."
 AUH_h_north_warning_tt:0 "Vienna has watched a king lose half his crown for want of firmness. The warning is taken."
 AUH_h_the_divorce_signed_tt:0 "The instruments are exchanged in good order: two governments, two tariffs, two armies — and one King."
 AUH_h_the_divorce_unblessed_tt:0 "Vienna never consented and does not forgive: the divorce is law, and the grudge is policy."
 AUH_h_the_divorce_dictated_tt:0 "This settlement was signed under the guns, and every man who signed it knows it."
 AUH_h_register_recounted_tt:0 "The register of the peoples is recalculated for two kingdoms."
 AUH_h_croatia_crown_tt:0 "Croatia-Slavonia is not in the schedule of Saint Stephen: the Triune Kingdom holds to the dynasty, not to Budapest."
 AUH_h_croatia_stephen_tt:0 "The Nagodba is subsumed whole: Agram answers to Budapest alone now, and Agram remembers being asked by neither side."
 AUH_h_croatia_cools_tt:0 "The Croats and the Serbs of the Kingdom did not choose this crown; their loyalty cools."
 AUH_h_the_claim_sleeps_tt:0 "The address is withdrawn and the counties stand down. The claim sleeps; the men who carried it do not forget."
 auh_clock.170.t:0 "The Gentry Reads the Bill"
 auh_clock.170.d:0 "The text of the franchise bill reaches the county seats ahead of the official gazette. In assembly hall after assembly hall the same speech is made: the bill is no law, the minister is no minister, and the county that lends the register a single clerk has betrayed the constitution. The register offices wait for instructions. So does Vienna."
 auh_clock.170.a:0 "The King's word does not return void"
 auh_clock.170.b:0 "Send the commissioners ahead of the writ"
 auh_clock.170.c:0 "Let the assemblies talk themselves out"
 auh_clock.171.t:0 "The Counties Are Counted"
 auh_clock.171.d:0 "The returns from the county seats are tallied."
 auh_clock.171.a:0 "Count them."
 auh_clock.172.t:0 "The Decree Carries"
 auh_clock.172.d:0 "County by county the resistance breaks. Some assemblies dissolve themselves rather than administer the new rolls, and their clerks administer them anyway; some take the commissioner's stipend and discover it spends; a few hold out a full session and find the quarter's taxes flowing past them to men who signed. The franchise of the millions is law in the Kingdom, and every man it enfranchises knows whose signature made him an elector."
 auh_clock.172.a:0 "Every name in the register is the Crown's"
 auh_clock.172.b:0 "The army watched the count"
 auh_clock.173.t:0 "The Counties Refuse the King"
 auh_clock.173.d:0 "The returns admit one reading. The assemblies will not open the rolls, the fiscal offices have stopped forwarding the quarter, and the recruiting boards sit before empty benches. The bill is dead where it stands, and the question it leaves behind is one no living minister has answered: what a King does with a Kingdom that refuses on this scale."
 auh_clock.173.a:0 "The writ will run, if soldiers carry it"
 auh_clock.173.b:0 "Withdraw the bill before the Kingdom burns"
 auh_clock.174.t:0 "The New Electors"
 auh_clock.174.d:0 "Through the winter the register offices work in the county seats: Romanian villages that have never seen an election official, Slovak market towns where the roll was last a rumour, Serb parishes copying names by lamplight. The chamber of the nations has stopped being a phrase in a memorandum. The electors exist, and they know who made them."
 auh_clock.174.a:0 "Open the rolls"
 auh_clock.175.t:0 "The Counties Go Silent"
 auh_clock.175.d:0 "No proclamation and no barricade — silence. The taxes do not come, the recruits do not come, and the royal commissioners preside over halls that empty as they enter. The counties are not in rebellion; they are waiting, with a patience that has an object."
 auh_clock.175.a:0 "Note what the silence is waiting for"
 auh_clock.176.t:0 "Budapest Reads the Returns"
 auh_clock.176.d:0 "The gentry's press prints the register in black borders and calls it the death warrant of the constitution. The old chamber's clubs meet in permanent session; the casinos are louder than the county halls now, and angrier. Between the new electors and the old Kingdom there is room for exactly one gesture — if the Crown cares to make it."
 auh_clock.176.a:0 "Let them write"
 auh_clock.176.b:0 "Offer the old chamber seats in the new"
 AUH_x_gentry_will_answer_tt:0 "The bill goes down to the counties. The gentry will answer."
 AUH_x_decree_dice_tt:0 "Whether the writ runs will depend on the counties' temper, the Kingdom's loyalty, and the instruments already in place."
 AUH_x_decree_carried_tt:0 "§GThe decree has carried; the county monopoly is broken.§!"
 AUH_x_decree_carried_trig_tt:0 "The franchise decree has carried in the counties"
 AUH_x_new_electors_tt:0 "The rolls are open; the chamber of the nations waits for its first sitting."
 AUH_x_counties_over_the_edge_tt:0 "§RThe counties are past obedience. What follows will not be settled by a bill.§!"
 AUH_x_decree_withdrawn_tt:0 "§YThe bill is buried; the King's word has returned void.§!"
 AUH_x_edge_handoff_tt:0 "§RThe Kingdom neither pays nor musters. The counties are waiting for a spark.§!"
 AUH_x_hopes_dashed_tt:0 "§RThe nationalities read the withdrawal for what it is.§!"
 AUHDNC_b_a_court_within_the_court:0 "A Court Within the Court"
 AUHDNC_b_a_court_within_the_court_desc:0 "The Military Chancellery of the heir has outgrown its name. It has a foreign desk, a press desk, a desk for the nationalities and a desk for the Kingdom of Hungary — a second government, drawing its salaries from a household allowance, answering to a man who holds no office of state. The Hofburg calls it an impertinence. The men who staff it call it practice."
 AUHDNC_b_the_slovak_at_the_back_stairs:0 "The Slovak at the Back Stairs"
 AUHDNC_b_the_slovak_at_the_back_stairs_desc:0 "Hodža comes up the service stairs because the front ones would be noticed. He brings the arithmetic of the Kingdom's nationalities: how the counties are drawn, how the franchise is starved, what the Slovaks would pay in loyalty for schools in their own tongue. The heir listens for an hour past the appointment. A card goes into the index."
 AUHDNC_b_fifteen_nations_on_paper:0 "Fifteen Nations on Paper"
 AUHDNC_b_fifteen_nations_on_paper_desc:0 "Popovici's book proposes the unthinkable with footnotes: dissolve the two halves into fifteen states drawn by language, under one crown, one army and one market. In Budapest the book is banned; at the Belvedere it is read twice and shelved within reach. If the Monarchy is to be refounded, someone must first have drawn the map."
 AUHDNC_b_the_croat_of_the_partys_right:0 "The Croat of the Party's Right"
 AUHDNC_b_the_croat_of_the_partys_right_desc:0 "Frank's price is known: Dalmatia, the provinces and the Kingdom of Croatia under one crown of Zvonimir — and he will swear it to a Habsburg sooner than share a bench with Belgrade. A card on such a man is worth a regiment. The heir has it written in his own hand."
 AUHDNC_b_the_generals_who_will_swear:0 "The Generals Who Will Swear"
 AUHDNC_b_the_generals_who_will_swear_desc:0 "The index turns to the army list. Corps by corps, the chancellery marks the men who would take the new oath on the first morning without asking to see the old one honoured — and, in a different ink, the men who would ask. On the day itself there will be no time to find out."
 AUHDNC_b_the_ministers_are_marked:0 "The Ministers Are Marked"
 AUHDNC_b_the_ministers_are_marked_desc:0 "Three offices in one week. The Ballhausplatz passes from Gołuchowski's patience to Aehrenthal's appetite; the staff from old Beck's caution to Conrad's arithmetic of the preventive war; the War Ministry to Schönaich, who will sign what the other two agree. The old Emperor consents to each change on its merits, and does not see the pattern. The pattern is the point."
 AUHDNC_b_the_navy_of_the_next_reign:0 "The Navy of the Next Reign"
 AUHDNC_b_the_navy_of_the_next_reign_desc:0 "The heir collects battleships the way other archdukes collect horses. The Marinesektion has learned that a memorandum sent to the Belvedere comes back annotated within the week, where the Hofburg loses it for a season. The fleet the Delegations will not vote is being designed anyway, hull by hull, for a reign that has not begun."
 AUHDNC_b_a_newspaper_for_the_day_after:0 "A Newspaper for the Day After"
 AUHDNC_b_a_newspaper_for_the_day_after_desc:0 "A military weekly and a Catholic daily, both in debt, both suddenly solvent. Their line is simple: the army above the two states, the crown above the army, and certain named ministers beneath contempt. Nothing in either paper is treason. All of it is preparation."
 AUHDNC_b_the_privy_purse_opened:0 "The Este Millions"
 AUHDNC_b_the_privy_purse_opened_desc:0 "A shadow government has payrolls. The heir's own revenues — the estates, the settlements, the quiet subscriptions of industrialists who can read a calendar — begin to move through three Viennese banks toward desks, presses and retainers. The auditors of the Hofburg may not examine a private purse. That is what makes it useful."
 AUHDNC_b_the_case_for_the_programme:0 "The Case for the Programme"
 AUHDNC_b_the_case_for_the_programme_desc:0 "Every county resolution against the joint army is clipped, translated and filed. Every obstruction in the Diet is dated. The chancellery does nothing to calm the Kingdom and something, here and there, to provoke it — for the programme in the drawer requires a Hungary that has plainly failed, and the file that proves the failure is kept with love."
 AUHDNC_b_two_drafts_in_one_drawer:0 "Two Drafts in One Drawer"
 AUHDNC_b_two_drafts_in_one_drawer_desc:0 "The lawyers have produced two texts. The first is an accession manifesto: correct, conciliatory, swearable. The second is a patent to be published before any oath is taken, suspending the Settlement pending the reorganisation of the Monarchy. They lie in the same drawer, and the drawer has one key, and the key is not in Vienna."
 AUHDNC_b_the_patent_of_the_peoples:0 "The Patent of the Peoples"
 AUHDNC_b_the_patent_of_the_peoples_desc:0 "The patent is published in eleven languages on the same morning. The historic kingdoms are dissolved into the peoples that inhabit them; the crown stands over fifteen states as it once stood over two. In Prague and Agram and the Slovak counties the church bells answer each other. In Budapest there is silence, which the new Emperor has planned for."
 AUHDNC_b_the_third_crown:0 "The Third Crown"
 AUHDNC_b_the_third_crown_desc:0 "Zagreb receives the provinces, Dalmatia, and a coronation. The Monarchy that was two is three, and the southern Slav question is answered inside the house instead of across the Drina. Budapest calls it robbery; Vienna calls it symmetry; the third capital calls it, carefully, a beginning."
 AUH_b_brosch_office_tt:0 "Brosch runs the office: every paper worth reading reaches the Belvedere before it reaches the Hofburg."
 AUH_b_hodza_card_tt:0 "Milan Hodža will answer a summons from the Belvedere. His card is in the index."
 AUH_b_popovici_card_tt:0 "Aurel Popovici's map of the fifteen states is in the safe with the rest of the programme."
 AUH_b_franks_card_tt:0 "Josip Frank has given his word to the next reign. Croatia's answer, when the day comes, is already written."
 AUH_b_army_marked_tt:0 "The army list is annotated: the corps that will swear at once are known by name."
 AUH_b_goluchowski_retired_tt:0 "Gołuchowski leaves the Ballhausplatz with every honour and no explanation."
 AUH_b_beck_retired_tt:0 "The old chief is thanked, decorated, and retired."
 AUH_b_aehrenthal_installed_tt:0 "Aehrenthal takes the Ballhausplatz with an appetite the old house is not used to."
 AUH_b_conrad_installed_tt:0 "Conrad takes the staff, and begins asking for his war within the month."
 AUH_b_conrad_already_placed_tt:0 "Conrad already holds the staff; the heir's list merely confirms him."
 AUH_b_schonaich_installed_tt:0 "Schönaich takes the War Ministry and signs what the other two agree."
 AUH_b_marked_in_the_index_tt:0 "The card index had already marked the offices; the week goes smoothly."
 AUH_b_the_triple_change_threat:0 "The Heir's Men Take the Offices"
 AUH_b_navy_reads_alive_tt:0 "The Marinesektion knows where its next patron sits: the fleet's friends plan for the next reign."
 AUH_b_high_seas_school_tt:0 "The high-seas school has the Belvedere's blessing, and knows it."
 AUH_b_extraordinary_credit_tt:0 "The credit outside the estimates was the heir's arrangement; the yards remember."
 AUH_b_case_quietly_made_tt:0 "The counties' defiance is filed with care. The worse the Kingdom behaves, the stronger the programme's case."
 AUH_b_two_drafts_tt:0 "Two texts, one drawer, one key."
 AUH_b_drawer_locked_tt:0 "The drawer is locked."
 AUH_b_avail_patent_tt:0 "The old Emperor has died and the accession patent has carried"
 AUH_b_avail_third_crown_tt:0 "The provinces have been disposed toward Zagreb"
 AUH_b_patent_era_tt:0 "The era of the question ends: the Monarchy is refounded as the united states of its peoples."
 AUH_b_third_crown_era_tt:0 "The era of the question ends: the Monarchy is three, and the third crown holds the south."
 AUH_b_popovici_map_tt:0 "Popovici's map was drawn years ago; the patent needs only to publish it."
 AUH_b_the_next_reigns_navy_bonus:0 "The Navy of the Next Reign"
 AUH_b_the_privy_purse_bonus:0 "The Privy Purse"
 AUH_b_the_patent_bonus:0 "The Patent of the Peoples"
 auh_clock.30.b:0 "The Belvedere kept its own list"
 auh_clock.30.c:0 "The Chancellery has been ready for years"
 auh_clock.31.t:0 "The Telegram from Schönbrunn"
 auh_clock.31.d:0 "The telegram reaches the Belvedere before the bells begin. Brosch has the duplicate keys in his pocket, the adjutants have their sealed envelopes, and the first train is held at the platform. Years of waiting have ended in a single line of cipher: the reign has begun, and the machine built in the dark starts to move in daylight."
 auh_clock.31.a:0 "Open the safe"
 auh_clock.31.b:0 "First the oath"
 auh_clock.32.t:0 "The Oath Can Wait"
 auh_clock.32.d:0 "The court expects the new King at the cathedral. The new King is in the Chancellery, signing. The programme comes out of the safe page by page: the manifesto to the peoples, the patent, the list of ministers with the retirements noted in the margin. The oath will be sworn — after. He who swears first inherits the machine as it is; he who signs first inherits it as he wants it."
 auh_clock.32.a:0 "Proclaim, then swear"
 auh_clock.33.t:0 "Budapest Answers"
 auh_clock.33.d:0 "The manifesto is on every wall from Krakau to Ragusa, and one capital has not answered. In Budapest the Houses sit in permanent session; the county assemblies are voting on whether the patent of a king uncrowned by Hungary is a law or a piece of paper. Every register, every grievance and every card in the heir's index is now being weighed on the Danube."
 auh_clock.33.a:0 "Wait for the Danube's answer"
 auh_clock.34.t:0 "The Patent Carries"
 auh_clock.34.d:0 "Budapest blinks. The magnates count the garrisons, the counties count the dossiers on the new King's desk, and the Houses vote the address of homage with their teeth set. The patent stands: the crownlands are summoned to the new order, and for the first time since the Settlement the initiative belongs entirely to the crown."
 auh_clock.34.a:0 "The peoples are summoned"
 auh_clock.35.t:0 "The Kingdom Refuses the King"
 auh_clock.35.d:0 "The answer comes not from the Houses but from the counties: taxes refused, recruits refused, the patent burned on the courthouse steps. The Diet declares that no law of Hungary can be made by a king who has not sworn Hungary's oath — and begins to conduct itself as the government of an independent state. The programme has its answer. Now it must decide what an army is for."
 auh_clock.35.a:0 "Then the Kingdom must be won"
 auh_clock.36.t:0 "The Third Crown Offered"
 auh_clock.36.d:0 "Neither homage nor rebellion: an offer. Budapest will accept the accession — if the patent is withdrawn and the southern lands are settled by negotiation, crown by crown. The lawyers call it trialism; the Belvedere calls it half the programme; the counties call it victory. It is the price of a morning on which nobody was ready to shoot."
 auh_clock.36.a:0 "Half the programme is a beginning"
 auh_clock.37.t:0 "The Oath Comes First"
 auh_clock.37.d:0 "No manifesto, no patent, no telegrams. The heir travels to the capital as an heir, swears the oath as sixty years of law prescribe it, and receives the crowns as their undoubted owner. The programme stays in the safe — but every minister who watched the flawless accession knows that the new reign owes nothing to anyone, and that the drawer is still there."
 auh_clock.37.a:0 "Sworn, crowned, unquestioned"
 auh_clock.38.t:0 "A Reign Begun in Order"
 auh_clock.38.d:0 "Three weeks into the reign the state has not missed a payment or a parade. The legality is banked; the court is quiet; Budapest, which prepared for a coup, has been handed a coronation instead and does not quite know what to do with its relief. Now — carefully, lawfully, one signature at a time — the new King may begin to change things."
 auh_clock.38.a:0 "Begin with the southern crown"
 auh_clock.38.b:0 "Begin by changing nothing"
 AUH_clock_the_safe_is_opened_tt:0 "There is a drawer at the Belvedere that has waited years for this morning: the accession will not be improvised."
 AUH_clock_drawer_unlocked_tt:0 "The safe is unlocked. What was written for this day will now be executed, page by page."
 AUH_b_oath_comes_first_tt:0 "The heir will swear before he reigns: whatever else changes, it will change lawfully."
 AUH_b_ministers_already_marked_tt:0 "The Triple Change was made in the old reign's shadow; the marked ministers already sit at their desks, and the machine does not miss an hour."
 AUH_b_triple_change_rushed_tt:0 "The Triple Change is executed from the card index in a single week: Gołuchowski and Beck-Rzikowsky are retired, and the men of the next reign stand ready at the ministries."
 AUH_b_day_after_ready_tt:0 "The Chancellery crossed the garden prepared; the first orders were signed before the requiem."
 AUH_clock_patent_proclaimed_tt:0 "The patent is proclaimed before the oath is sworn: the peoples are promised their statute from a throne not yet occupied by law."
 AUH_clock_threat_the_patent:0 "A patent before an oath in Vienna"
 AUH_clock_budapest_weighs_tt:0 "The counties are counting their registers and the Kingdom is counting its options; Budapest's answer is on its way."
 AUH_clock_ferdinand_crowned_tt:0 "Franz Ferdinand takes the throne."
 AUH_b_patent_carried_tt:0 "The patent has carried: the Kingdom submits to the new statute, and the Patent of the Peoples can now be made law."
 AUH_b_accession_secession_tt:0 "Budapest has refused the new King: the counties are over the edge, and the Kingdom is arming its answer."
 AUH_b_oath_sworn_tt:0 "The oath is sworn before anything else is signed; the new reign begins owing nothing to force."
 AUH_b_accession_legal_tt:0 "The accession was lawful from its first hour: whatever this reign attempts, it will attempt from solid ground."
 AUHDNC_b_the_programme_in_the_safe:0 "The Programme in the Safe"
 AUHDNC_b_the_programme_in_the_safe_desc:0 "Brosch drafts it in his own hand and no copyist sees it whole: the manifesto, the patent, the list of ministers, the order of telegrams for the first week of the reign. It is signed, sealed and locked in the safe of the Military Chancellery. It does nothing. It waits."
 AUH_b_programme_locked_tt:0 "The drawer is locked. Nothing happens today; everything in it happens on the day the bells ring."
 AUHDNC_b_the_oath_first:0 "The Oath First"
 AUHDNC_b_the_oath_first_desc:0 "The counter-argument comes from the lawyers: a king who proclaims before he swears is a usurper with better handwriting. Let the accession be flawless — oath, then crown, then change. The programme stays a memorandum; the legality becomes the weapon."
 AUH_b_oath_first_tt:0 "It is decided at the Belvedere: on the day, the oath comes first. Legality is the one weapon the Hofburg cannot confiscate."
 auh_clock.190.t:0 "Whose Army Is It"
 auh_clock.190.d:0 "The county assemblies have stopped answering; the recruiting officers are barred from their own depots; and in Budapest men who were ministers last month are administering an oath of their own devising. Every order now runs through one question, asked barracks by barracks from Pressburg to Kronstadt: when the King commands and the Kingdom refuses, which of the two does a Honved regiment obey? The answer is being given tonight, and nobody in Vienna is being consulted."
 auh_clock.190.a:0 "Put the question"
 auh_clock.191.t:0 "The Counties Fold"
 auh_clock.191.d:0 "The regiments answered, and the answer was the King. A colonel in Debrecen paraded his men against the county hall instead of for it; the new oath found few takers while the garrisons stood unmoved; and the resolutions that were read out to cheering in the spring are being burned in the courtyards now. The leaders of the resistance are asking, through intermediaries, what terms His Majesty will condescend to set."
 auh_clock.191.a:0 "Take the submission, and no more"
 auh_clock.191.b:0 "Set the terms in writing, and keep the paper"
 auh_clock.192.t:0 "The Kingdom Takes the Field"
 auh_clock.192.d:0 "The regiments answered, and the answer was Budapest. The Honved has marched to the counties, not against them; the depots and the tax offices east of the Leitha are held by men wearing a cockade the law does not know; and a government calling itself the King's own Hungarian ministry has ordered the frontier between the two states manned from its side. There is no word for what begins this morning except the one nobody at the Hofburg will say aloud."
 auh_clock.192.a:0 "Then it is war, and it is ours to win"
 auh_clock.195.t:0 "The Powers Press for Terms"
 auh_clock.195.d:0 "The war between the King and his Kingdom has run on long enough for Europe to finish watching. Berlin fears for the alliance, Petersburg scents an opening, London speaks gravely of the sanctity of contracts. The ambassadors call together, which is the point: mediation is offered in a form that will be expensive to decline, on the basis of things as they presently stand."
 auh_clock.195.a:0 "The House does not negotiate with its own subjects"
 auh_clock.195.b:0 "Accept the mediation"
 auh_clock.196.t:0 "The Peace of the King"
 auh_clock.196.d:0 "It ends where it began, in the county halls. The Honved has stacked its arms; the ministry that made the war has dissolved itself by night; and the commissioners go from county to county with a list of names and a squadron each. The Kingdom of Hungary has been beaten by its own King, and both of them will remember it for as long as the peace is enforced."
 auh_clock.196.a:0 "Commissioners over the Kingdom"
 auh_clock.197.t:0 "The Crowns Part Company"
 auh_clock.197.d:0 "The terms are written politely and mean surrender. Nothing is held in common any longer but the person of the King: two states, two armies, two treasuries, a commercial treaty either side may denounce, and a court that will winter in Vienna and be lectured in Budapest. The war is over. The Monarchy, in the sense the word has carried for forty years, is over with it."
 auh_clock.197.a:0 "One King, twice crowned, nothing shared"
 AUH_x_honved_dice_tt:0 "§RThe loyalty of the Honved is being decided in the barracks, not the chancellery.§!"
 AUH_x_counties_collapse_tt:0 "§GThe resistance of the counties collapses.§!"
 AUH_x_hun_floor_tt:0 "The Kingdom submitted inside the Monarchy: Magyar loyalty will fall no further for now."
 AUH_x_counties_folded_tt:0 "§GThe capitulation is in your pocket: Pocket the Capitulation can be taken.§!"
 AUH_x_civil_war_running_tt:0 "§RThe King is at war with his own Kingdom.§!"
 AUH_x_zagreb_loyal_tt:0 "§GZagreb declares for the King: Croatia-Slavonia stays out of the Kingdom's war.§!"
 AUH_x_zagreb_follows_budapest_tt:0 "§RNothing was ever promised to Zagreb: Croatia-Slavonia marches with the Kingdom.§!"
 AUH_x_mediation_refused_tt:0 "The powers are refused; the war goes on to a verdict."
 AUH_x_union_road_open_tt:0 "The settlement party has seceded in fact: the personal union is now a road the era can end on."
 AUH_x_terms_dictated_tt:0 "§RThe terms are set by the position, and the position is lost.§!"
 AUH_x_commissioners_tt:0 "§RRoyal commissioners administer the Hungarian counties.§!"
 AUH_x_kingdom_beaten_tt:0 "§GThe Kingdom is beaten: The Peace of the King can be taken.§!"
 AUH_x_union_imposed_tt:0 "§RThe personal union is imposed: nothing is common any longer but the King.§!"
 AUH_x_era_end_union_tt:0 "The question before the Crown is answered: the era can end."
 AUH_clock_threat_the_kings_own_war:0 "The King's war with his own Kingdom"
 auh_clock.370.t:0 "The Rising in Arms"
 auh_clock.370.a:0 "Then let them have their war"
 auh_clock.370.b:0 "There is no country on the map to give them"
 auh_clock.370.c:0 "Put the question to the Kingdom"
 auh_clock.370.d:0 "It is one insurgency, and it is Bosnian"
 auh_clock.390.t:0 "The Statthalter's Annual Report"
 auh_clock.390.d:0 "Every Statthalter, Landespraesident and Obergespan has returned the same form, and the Ministry of the Interior has bound them into one volume for a man who reads everything. The volume is not short.\n\nVienna and Budapest answer this year as they answered last. The columns rewritten in a heavier hand are those of [GetAUHRisingPeople], and the returns out of [GetAUHAgitatorLands] came in late and came in twice. The register lies open at the Ministry and the Crown may send for it at any hour.\n\nNo emperor has held all twelve."
 auh_clock.390.a:0 "Read it to the end"
 auh_clock.390.b:0 "Have the passages about the register struck out"
 auh_clock.391.t:0 "The Strike at [GetAUHAgitatorTown]"
 auh_clock.391.d:0 "It began over a foreman and it is being finished over a flag. The works at [GetAUHAgitatorTown] have stopped, the reading society has printed the demands in two languages, and the demands in the second language are not about wages. [GetAUHAgitatorPeople] are watching to see which of the two the Crown answers."
 auh_clock.391.a:0 "Answer the demands that are about wages"
 auh_clock.391.b:0 "Answer both with the gendarmerie"
 auh_clock.392.t:0 "The Schools Petition"
 auh_clock.392.d:0 "Nine thousand signatures out of [GetAUHAgitatorLands], gathered parish by parish, asking for what the law already half promises: instruction in the mother tongue, a teachers' seminary, and inspectors who can read what they are inspecting. The petition is polite. The men who carried it from village to village are not, and they now know every household by name."
 auh_clock.392.a:0 "Grant the seminary and the inspectors"
 auh_clock.392.b:0 "The petition is acknowledged and shelved"
 auh_clock.393.t:0 "The Tax Refusal"
 auh_clock.393.d:0 "The district in [GetAUHAgitatorLands] has not paid, and it has not paid together - the assembly voted it, the priest read it from the pulpit, and the collector came back with an empty book and an escort he did not have when he set out. [GetAUHAgitatorPeople] have found the one instrument of government that works from the bottom."
 auh_clock.393.a:0 "Remit the arrears and reopen the assembly"
 auh_clock.393.b:0 "Quarter troops on the district until it pays"
 auh_clock.394.t:0 "The Recruits Who Did Not Come"
 auh_clock.394.d:0 "Of the contingent called from [GetAUHAgitatorLands] this spring, a third did not present themselves and a further third presented themselves and then walked home. The gendarmerie can fetch them. The regiment can hold them. Nobody at the ministry will write down what such a battalion is worth in the field, and that refusal is itself the report."
 auh_clock.394.a:0 "An amnesty, and the levy renegotiated with the county"
 auh_clock.394.b:0 "Fetch them, and quarter the regiment on the villages"
 auh_clock.440.t:0 "The Autumn Examinations at the Schillerplatz"
 auh_clock.440.d:0 "The General Painting School of the Academy of Fine Arts reports on the autumn intake, as it does every year, and the report is read by nobody of consequence. One hundred and thirteen candidates sat the drawing examination. Twenty-eight were admitted. The rector notes, as he always does, that the standard of the test heads was poor, that several rejected candidates showed some feeling for buildings and might be steered toward the architecture school, and that a few of them will appeal. Among the names on the list of those examined is a young man from Braunau am Inn, lately of Linz, currently lodging in the Stumpergasse. The file is initialled and goes into the cabinet with the others."
 auh_clock.440.a:0 "Initial the report and close the file."
 auh_clock.440.b:0 "Initial the report and close the file."
 AUH_academy_refused_tt:0 "Twenty-eight places, and the young man from Braunau is not among them. He will appeal, and be refused again, and stay in Vienna. The Academy keeps no record of what becomes of the ones it turns away."
 AUH_academy_admitted_tt:0 "Twenty-eight places, and the young man from Braunau takes the last of them. He will spend the next years drawing the Ringstrasse in the General Painting School, and the Monarchy will never learn what it was spared."
 auh_clock.441.t:0 "NEUE FREIE PRESSE"
 auh_clock.441.d_admitted:0 "§YFROM THE ARTS PAGE, UNDER THE THEATRE NOTICES§!\n\nThe General Painting School has hung its first-year work in the corridor at the Schillerplatz, and the public is admitted on Thursdays without charge.\n\nOur correspondent reports the usual quantity of Alpine lakes. He singles out for cautious praise a set of pen studies of the Ringstrasse by a first-year man from Upper Austria, who has drawn the Parliament, the Rathaus and the Burgtheater with a ruler and an evident love of cornices, and who has not drawn a single human figure in any of them. The rector observes that the young man was very nearly refused in the autumn, that he has a feeling for buildings and none whatever for people, and that he has been advised, not for the first time, to consider the architecture school.\n\nOur correspondent concludes that the studies are competent, cold, and unlikely to trouble posterity."
 auh_clock.441.d_refused:0 "§YFROM THE CITY PAGE, BELOW THE TRAM TIMETABLE§!\n\nThe Academy of Fine Arts has concluded its autumn examinations. One hundred and thirteen candidates sat, twenty-eight were admitted, and the remainder have been advised to present themselves again next year.\n\nThis paper takes the occasion to remark, as it does each autumn, on the condition of the young men who come to Vienna for these examinations and do not pass them. They do not, as a rule, go home. They take rooms in the Stumpergasse and the Felberstrasse, they copy postcards for the dealers on the Ring, and in time a certain number of them find their way to the hostel in the Meldemannstrasse, where a bed costs half a crown and the reading room is warm.\n\nWhat becomes of them after that this paper does not say, and has no means of knowing."
 auh_clock.441.a:0 "Competent, cold, and unlikely to trouble posterity."
 auh_clock.441.b:0 "The paper does not say, and has no means of knowing."
 AUH_dnc_collapse_cat:0 "The Twilight of the Monarchy"
 AUH_dnc_collapse_cat_desc:0 "§[GetAUH_collapseStageColor][GetAUH_collapseStageName]§!. Strain §[GetAUH_strainColor][?AUH_treasury_strain|0]§!, columns in revolt §R[?AUH_nat_rising_count|0]§!, provinces gone §R[?AUH_nat_secessions|0]§!, mother countries armed §[GetAUH_vulturesColor][?AUH_z_vultures_armed|0]§!.\n\nA state does not end at once. It stops paying, and then it stops being obeyed, and then the neighbours read the newspapers. Every one of those three has an exit."
 AUH_z_declare_the_moratorium:0 "Declare the Moratorium"
 AUH_z_declare_the_moratorium_desc:0 "The Finance Ministry stops paying the coupon. The debt is not repudiated, only postponed, which is what a state says when it repudiates a debt. The books clear; the works stop; the Ring does not forget."
 AUH_z_pay_the_service_in_paper:0 "Pay the Service in Paper"
 AUH_z_pay_the_service_in_paper_desc:0 "The clerks of Bohemia and the tax-collectors of the Banat are paid in notes printed against nothing. They go back to their desks, and the notes go into the market, and the market answers."
 AUH_z_buy_back_the_regiments:0 "Buy Back the Regiments"
 AUH_z_buy_back_the_regiments_desc:0 "Arrears settled, officers reinstated, the Landwehr staffs recalled to their depots. Regiments that have once gone home come back slowly and come back dearer."
 AUH_z_regiments_need_a_treasury_tt:0 "The treasury must be able to pay arrears at all (§Ystrain below 90§!)"
 AUH_z_the_price_of_the_kingdom:0 "The Price of a Kingdom"
 AUH_z_the_price_of_the_kingdom_desc:0 "One of the mother countries can be bought out of its claim. It costs money the monarchy does not have, and it teaches the other two exactly what a claim is worth."
 AUH_z_read_the_ledger_of_the_ruin:0 "Read the Ledger of the Ruin"
 AUH_z_read_the_ledger_of_the_ruin_desc:0 "The Cabinet Chancellery reads out where the monarchy actually stands. Nothing is hidden in it, which is the only mercy in it."
 AUH_z_the_army_is_split:0 "The Army Is Split"
 AUH_z_the_army_is_split_desc:0 "Regiments recruited on the Vistula and the Save have marched home under their own officers. What answers the Kriegsministerium is smaller than what is on its lists, and it knows it."
 AUH_z_the_service_is_unpaid:0 "The Service Is Not Paid"
 AUH_z_the_service_is_unpaid_desc:0 "Ninety thousand officials, from the Statthalter down to the station clerk at Czernowitz, have not drawn a salary. They still come to work. They do not hurry."
 AUH_z_the_price_of_berlin:0 "The Price of Berlin"
 AUH_z_the_price_of_berlin_desc:0 "German staff officers sit in the Kriegsministerium and German bankers sit in the Finance Ministry, and both are polite about it. The monarchy is saved and no longer decides alone."
 AUH_z_the_rump_monarchy:0 "The Rump Monarchy"
 AUH_z_the_rump_monarchy_desc:0 "The Alpine lands and the Bohemian crownlands, an army that fits in them, and a court that has stopped pretending otherwise. Small, poor, defensible, and still called an empire."
 AUH_z_the_mountains_still_answer:0 "The Mountains Still Answer"
 AUH_z_the_mountains_still_answer_desc:0 "The Tyrolean and Alpine-German battalions have not asked whose flag they serve, because for them the question never arose. They are the floor beneath every collapse."
 AUH_z_the_suspension_of_payment:0 "The Suspension of Payment"
 AUH_z_the_suspension_of_payment_desc:0 "Payment is suspended. The state factories run at half fire, the scaffolding stands empty, and every foreign house that lent to Vienna is writing to its embassy."
 AUH_z_threat_the_bells_ring_together:0 "Austria-Hungary is coming apart"
 AUH_z_threat_the_vultures:0 "The heirs of Austria-Hungary are stating their claims"
 AUH_z_stage_name_none:0 "The monarchy holds"
 AUH_z_stage_name_one:0 "Stage One: the state fails"
 AUH_z_stage_name_two:0 "Stage Two: the vultures"
 AUH_z_stage_name_three:0 "Stage Three: rump Austria"
 AUH_z_floor_laid:0 "§GThe loyal corps are counted and will not be counted away.§!"
 AUH_z_floor_not_laid:0 "§YThe loyal corps have not yet been separated from the rest.§!"
 AUH_z_collapse_opened_tt:0 "The §Rcollapse§! is now running. It has three stages, and every stage has a way out."
 AUH_z_the_suspension_tt:0 "Payment is §Rsuspended§! for a year: factories idle, construction all but stopped, strain written down to 50."
 AUH_z_the_army_is_split_tt:0 "The §Rnational regiments go home§!. They can be bought back."
 AUH_z_the_service_is_unpaid_tt:0 "The §Rcivil service goes unpaid§! for ten months, or until it is paid in paper."
 AUH_z_the_floor_army_tt:0 "The §Gloyal corps§! are raised: four Kaiserjaeger brigades, manpower and rifles. This floor is guaranteed and repeats while the monarchy is below it."
 AUH_z_rump_austria_tt:0 "The monarchy is reduced to the §YAlpine and Bohemian core§!, and holds it."
 AUH_z_cascade_step_tt:0 "A column is going out of the register and into the field."
 AUH_z_vulture_ITA_tt:0 "§RItaly§! states its claim to the Trentino, the Littoral and Trieste."
 AUH_z_vulture_ROM_tt:0 "§RRomania§! states its claim to Transylvania and the Banat."
 AUH_z_vulture_SER_tt:0 "§RSerbia§! states its claim to Syrmia and the Bacska."
 AUH_z_the_price_of_berlin_tt:0 "Berlin pays, and Berlin is henceforth consulted."
 AUH_z_berlin_refused_tt:0 "The offer is refused. The monarchy stands on its own account."
 AUH_z_berlin_declined_tt:0 "No offer was made."
 auh_clock.320.t:0 "The Bells Ring Together"
 auh_clock.320.d:0 "They have rung one at a time for years and the reign has answered them one at a time. This morning they ring together: the treasury, the register, the counties, the garrisons. The Cabinet Chancellery does not use the word collapse in the minute. Everyone in the room uses it in the corridor."
 auh_clock.320.a:0 "Then we govern with what is left."
 auh_clock.320.b:0 "Put the Delegations in permanent session."
 auh_clock.322.t:0 "The Treasury Cannot Pay"
 auh_clock.322.d:0 "Böhm-Bawerk's successors put it in one sentence: the estimates for the coming quarter cannot be met from revenue, from the Ausgleich quota, or from any house on the Ring that will still take our paper. There are three ways out of a sentence like that and none of them is quiet."
 auh_clock.322.a:0 "Suspend payment."
 auh_clock.322.b:0 "Pay it out of the last gold, and let the peoples pay for the gold."
 auh_clock.322.c:0 "Let Berlin's credit stand behind the coupon."
 auh_clock.323.t:0 "The Army Splits"
 auh_clock.323.d:0 "A Hungarian battalion at Pressburg entrains for home without orders and nobody stops it, because the regiment that should have stopped it is Czech. The Kriegsministerium has spent forty years insisting the army has no nationality. It is being told this week exactly how many it has."
 auh_clock.323.a:0 "Let them go home. We will need what stays."
 auh_clock.323.b:0 "Hold them at the depots with the gendarmerie."
 auh_clock.324.t:0 "The Service Is Not Paid"
 auh_clock.324.d:0 "The salaries of the imperial-royal service are eleven days late, then nineteen. A Statthalter writes to Vienna that his district commissioners are borrowing from the men they are supposed to be taxing, and asks, without irony, for instructions."
 auh_clock.324.a:0 "They have waited before. They will wait."
 auh_clock.324.b:0 "Pay the officials first and the contractors never."
 auh_clock.326.t:0 "The Vultures Gather"
 auh_clock.326.d:0 "In Rome, in Bucharest, in Belgrade, the same file is opened in the same week, and it is not a war plan. It is a list of provinces with populations beside them. Ninety days of the monarchy failing in public has taught the neighbours that the question is no longer whether, but who is standing nearest."
 auh_clock.326.a:0 "Let them show their hand first."
 auh_clock.326.b:0 "Sound the reserve before they do."
 auh_clock.327.t:0 "Italy States Its Claim"
 auh_clock.327.d:0 "The Consulta's note is courteous and reads like a bill of sale: the Trentino, the Littoral, and the disposition of Trieste, to be settled 'in the spirit of the alliance'. The alliance has one year left to run and both sides know what the note is."
 auh_clock.327.a:0 "The alliance can be read in Vienna too. Let them come."
 auh_clock.327.b:0 "Buy the peace with the Trentino."
 auh_clock.328.t:0 "Romania States Its Claim"
 auh_clock.328.d:0 "Bucharest has been the quiet ally for thirty years, and the treaty is still secret, and the Crown Council has still voted to ask what the school laws did to three million Romanians east of the Tisza. The ask is a claim with a covering letter."
 auh_clock.328.a:0 "The Tisza is not a frontier of negotiation."
 auh_clock.328.b:0 "Give up the northern counties and keep the rest."
 auh_clock.329.t:0 "Serbia States Its Claim"
 auh_clock.329.d:0 "The Kingdom has waited for this since the annexation and does not pretend otherwise. Its note is the shortest of the three: Syrmia, the Bacska, and no mention at all of the spirit of anything."
 auh_clock.329.a:0 "Then it is the war the Ballhausplatz always wanted, at the worst hour."
 auh_clock.329.b:0 "Pay the Kingdom in ground and take the year."
 auh_clock.330.t:0 "The Offer from Berlin"
 auh_clock.330.d:0 "Berlin will lend an army corps, a banking syndicate, and the word of the Kaiser that the monarchy will not be partitioned. In return, the Kriegsministerium will accept German staff officers, the Finance Ministry will accept German auditors, and Vienna will not sign anything east of the Carpathians without asking first. It is a rescue. It is also the end of deciding alone."
 auh_clock.330.a:0 "Take it. A dependent monarchy is still a monarchy."
 auh_clock.330.b:0 "We were a Great Power this morning."
 auh_clock.331.t:0 "Berlin Sends Its Regrets"
 auh_clock.331.d:0 "The Wilhelmstrasse's reply is three paragraphs of warmth and no verbs of commitment. The Chancellor is sympathetic, the Kaiser is following events, and the alliance is of course unshaken. Nobody in the Ballhausplatz needs the cipher clerk to explain it."
 auh_clock.331.a:0 "Then we are alone, and we may as well be told so."
 auh_clock.332.t:0 "Rump Austria"
 auh_clock.332.d:0 "What is left answers from Vienna: the Alpine lands, Salzburg and the Tyrol, Bohemia and Moravia held by garrison rather than by consent. It is small and poor and it is entirely defensible, and for the first time in the reign every soldier on the rolls is a soldier who will actually come."
 auh_clock.332.a:0 "The mountains still answer. Begin from there."
 auh_clock.332.b:0 "Bohemia stays, and the army will explain why."
 auh_clock.333.t:0 "The Loyal Corps"
 auh_clock.333.d:0 "The Kaiserjaeger and the Landesschuetzen depots empty into the valleys and fill again with volunteers who were not called. They ask no questions about the register. Whatever else has gone, this has not, and the staff can now plan on a number instead of a hope."
 auh_clock.333.a:0 "Then we have a floor to stand on."
 auh_clock.334.t:0 "A Province Declares"
 auh_clock.334.d:0 "It begins as it always begins: a diet that will not adjourn, a Statthalter who cannot be reached, a telegraph office that answers in the wrong language. By evening it is not a disorder any more. It is a country, or it is about to be."
 auh_clock.334.a:0 "Send for the file."
 auh_clock.335.t:0 "The Moratorium Ends"
 auh_clock.335.d:0 "A year of suspended payment ends with the state solvent, hated by every creditor from Frankfurt to Paris, and free of a debt it could never have carried. The scaffolding goes back up. The terms of the next loan will be remembered for a generation."
 auh_clock.335.a:0 "Open the yards again."
 auh_clock.336.t:0 "The Officials Are Paid"
 auh_clock.336.d:0 "Arrears are settled, in coin, with an apology from the Cabinet Chancellery that nobody asked for. The service resumes at the speed it kept before, which was never fast, and which is now the most reassuring thing in the empire."
 auh_clock.336.a:0 "The desks are manned."
 auh_clock.337.t:0 "The Regiments Come Back"
 auh_clock.337.d:0 "They return in the order they left, by nationality, and they are counted at the depot gates by officers who have learned not to say anything about it. The army is whole on paper again. On paper is where it was always whole."
 auh_clock.337.a:0 "Enter them on the rolls."
 auh_clock.338.t:0 "The Price of a Kingdom"
 auh_clock.338.d:0 "The claim can be bought. Not with a province — with the last credit the monarchy has, paid to a neighbour to say publicly that it wants nothing. The neighbour will take it. The other two will read the figure in their own newspapers."
 auh_clock.338.a:0 "Pay Rome."
 auh_clock.338.b:0 "Pay Bucharest."
 auh_clock.338.c:0 "Pay Belgrade."
 auh_clock.338.e:0 "Pay nobody. Keep the credit."
 auh_clock.339.t:0 "The Bells Fall Silent"
 auh_clock.339.d:0 "Six months without a rising, without a suspension, without a note from a neighbour. The Cabinet Chancellery does not announce a recovery, because announcing one is how the last three ended. It simply stops circulating the emergency minute."
 auh_clock.339.a:0 "Say nothing and keep working."
 auh_clock.340.t:0 "Vienna Suspends Payment"
 auh_clock.340.d:0 "The Austro-Hungarian Monarchy has suspended payment on its public debt. The Bourse in Vienna closed early; the Paris and Berlin houses that carried the paper are counting what they hold. It is the first suspension by a European Great Power in living memory, and every chancellery in Europe is asking the same question about what such a state is still worth as an ally."
 auh_clock.340.a:0 "It was not the war that broke us."
 auh_clock.340.b:0 "A Great Power that cannot pay is a question, not a partner."
 auh_clock.344.t:0 "The Ledger of the Ruin"
 auh_clock.344.d:0 "§[GetAUH_collapseStageColor][GetAUH_collapseStageName]§!\n\nTreasury strain §[GetAUH_strainColor][?AUH_treasury_strain|0]§! of 100.\nColumns in open revolt: §R[?AUH_nat_rising_count|0]§! of twelve.\nProvinces already gone: §R[?AUH_nat_secessions|0]§!.\nMother countries armed against us: §[GetAUH_vulturesColor][?AUH_z_vultures_armed|0]§! of three.\nHouse of Habsburg standing: §Y[?AUH_house_prestige|0]§!.\n\n[GetAUH_floorState]"
 auh_clock.344.a:0 "Read it again next month."
 #DNC Austria-Hungary - industrial concerns
 AUH_witkowitz:0 "Witkowitzer Bergbau- und Eisenhuettengewerkschaft"
 AUH_witkowitz_desc:0 "The northern basin in one balance sheet: its own coal, its own coke, its own ore trains and the only plant in the realm that rolls armour thick enough for a capital ship. Rothschild money and the Gutmann family own it between them, and neither of them has ever been told a price by this ministry."
 AUH_poldi_huette:0 "Poldihuette"
 AUH_poldi_huette_desc:0 "Crucible and tool steel out of Kladno, and the first electric arc furnace turning anywhere in the realm. It is a small works with a laboratory attached, and what it learns in the laboratory reaches the other works within the year."
 AUH_boehler:0 "Gebrueder Boehler & Co."
 AUH_boehler_desc:0 "The special steels of the mountain valleys: gun steel, tool steel, spring steel, sold on a certificate rather than a price. Barrels made from it do not open up, and every artillery office in Europe knows it."
 AUH_alpine_montan:0 "Oesterreichisch-Alpine Montangesellschaft"
 AUH_alpine_montan_desc:0 "The ore mountain and the works below it, held as one estate. It digs its own iron, burns its own coal and sells pig to half the foundries of the western half. Where the ore goes short, this company decides who goes short with it."
 AUH_ostrava_karvina:0 "Ostrava-Karvina Coal Company"
 AUH_ostrava_karvina_desc:0 "Coking coal of the northern basin, the fuel that makes steel rather than heat. The pits, the coke ovens and the works stand on the same few kilometres of ground, which is the whole of their advantage and the whole of their danger."
 AUH_bruex_lignite:0 "Bruex Lignite Mining Company"
 AUH_bruex_lignite_desc:0 "Brown coal of the northern Bohemian seams, cut in the open and carried cheap. It is poor fuel and there is a great deal of it: it heats the towns, runs the gasworks and feeds the boilers that better coal is too expensive to feed."
 AUH_carpathian_field:0 "The Carpathian Field Companies"
 AUH_carpathian_field_desc:0 "The wells of the Carpathian field and the refineries of the towns below them, held by a crowd of small companies with foreign capital behind most of them. The realm has oil of its own, which is more than most powers can say, and no minister has yet decided who it belongs to."
 AUH_ganz:0 "Ganz & Co., Budapest"
 AUH_ganz_desc:0 "Electrical machines, three-phase traction, meters, turbines and the mills that made the house before the dynamos did. It electrifies a line faster than the state can survey one, and it takes its orders in Magyar."
 AUH_laurin_klement:0 "Laurin & Klement"
 AUH_laurin_klement_desc:0 "A Bohemian cycle works that began building motors and did not stop. The first series-built motor car of the realm came out of its sheds; the ministry noticed when it was already being sold abroad."
 AUH_nesselsdorfer:0 "Nesselsdorfer Wagenbau-Fabriks-Gesellschaft"
 AUH_nesselsdorfer_desc:0 "Carriages, then railway carriages, then motor carriages, from a works that has never once built the same thing for two decades running. It keeps the rolling stock of the northern lines moving and charges what it likes for it."
 AUH_puch:0 "Johann Puch, Graz"
 AUH_puch_desc:0 "Cycles, then motorcycles, then cars, built by a man who cannot read a drawing and does not need to. Cheap machines, made in quantity, in a town nobody in Vienna thinks of as an industrial one."
 AUH_oesterreichischer_lloyd:0 "Oesterreichischer Lloyd"
 AUH_oesterreichischer_lloyd_desc:0 "The subsidised mail steamers of Trieste, flying the house flag from the Levant to the East Indies. The subsidy is voted by two parliaments that agree on nothing else, and the stokers who keep the boats at sea have been shot at on the quay for asking to be paid."
 AUH_oesterreichisch_ungarische_bank:0 "Oesterreichisch-ungarische Bank"
 AUH_oesterreichisch_ungarische_bank_desc:0 "One note bank with two head offices, two governing bodies and banknotes printed in two languages on two sides of the same paper. Its privilege runs out on a date both parliaments know, and neither will say in advance what it intends to do about it."
 AUH_creditanstalt:0 "k.k. priv. Oesterreichische Credit-Anstalt"
 AUH_creditanstalt_desc:0 "The Rothschild house on the Ring, and behind it the iron, the coal and the railways of half the realm. It does not lend to the state so much as sit beside it, and when it declines a scheme the scheme does not happen."
 AUH_pesti_kereskedelmi:0 "Pesti Magyar Kereskedelmi Bank"
 AUH_pesti_kereskedelmi_desc:0 "The commercial bank of the Kingdom: grain, mills, sugar, waterworks and the municipal loans of every county town that wants a tramway. Hungarian capital, lent in Hungary, and its board says so at every opportunity."
 AUH_state_ironworks:0 "The State Ironworks"
 AUH_state_ironworks_desc:0 "The works the treasury owns outright, in the uplands and Transylvania: rails, plate, shell steel and gun forgings, made where the ministry says and sold at the price the ministry sets. They are never the cheapest supplier and they are the only one that cannot refuse an order."
 #DNC Austria-Hungary - materiel manufacturers
 AUH_skoda:0 "Skoda Works, Pilsen"
 AUH_skoda_desc:0 "Quick-firing field guns, mountain batteries and siege mortars that no fortress in Europe has yet been built to survive, all out of one town in Bohemia. The guns are the best money can buy and the ministry is reminded of that on every invoice."
 AUH_artilleriearsenal_wien:0 "k.u.k. Artilleriearsenal Wien"
 AUH_artilleriearsenal_wien_desc:0 "The state arsenal, pouring bronze barrels at a price no private house can match and to a design the private houses abandoned. Every gun is cheap, reliable and outranged, and the batteries that carry them will find that out in the field rather than on the proving ground."
 AUH_steyr_oewg:0 "Oesterreichische Waffenfabriks-Gesellschaft"
 AUH_steyr_oewg_desc:0 "The rifle works on the Enns: straight-pull Mannlichers by the hundred thousand, clip loading, and the Schwarzlose machine gun - a short barrel and an unlocked breech held shut by a toggle and its own inertia, which is crude, cheap and refuses to break."
 AUH_weiss_manfred:0 "Weiss Manfred, Csepel"
 AUH_weiss_manfred_desc:0 "Cartridges, shells, fuzes, rolling mills, tinned rations and the field kitchens that carry them, on an island below the Hungarian capital. It is the second industrial house of the realm and every round the army fires passes through it."
 AUH_feg_frommer:0 "Fegyver- es Gepgyar"
 AUH_feg_frommer_desc:0 "The arms and machine works of the Hungarian capital, and the long-recoil pistol its chief designer will not stop improving. Small arms made in the Kingdom, for the Kingdom's own establishment, with a design office that answers to Budapest."
 AUH_austro_daimler:0 "Oesterreichische Daimler-Motoren-Gesellschaft"
 AUH_austro_daimler_desc:0 "Engines first and vehicles afterwards, out of Wiener Neustadt: staff cars, lorries, road trains that pull a battery over ground no horse team will cross, and a wheeled armoured vehicle the army has already declined to buy."
 #DNC Austria-Hungary - naval manufacturers
 AUH_stabilimento_tecnico_triestino:0 "Stabilimento Tecnico Triestino"
 AUH_stabilimento_tecnico_triestino_desc:0 "The private yard at Trieste, and the only slipways in the realm long enough for a battleship. It builds the big hulls well, it builds them slowly, and it names its own price because there is nowhere else to go."
 AUH_seearsenal_pola:0 "Seearsenal Pola"
 AUH_seearsenal_pola_desc:0 "The navy's own establishment: docks, workshops, magazines, boats and the refits that keep the fleet at sea. It laid down an armoured cruiser and took four and a half years to hand her over, and nobody in the Marinesektion pretends otherwise."
 AUH_danubius_fiume:0 "Danubius Yard, Fiume"
 AUH_danubius_fiume_desc:0 "The yard the Kingdom demanded and the Kingdom's votes paid for, built at the Hungarian port to take the Hungarian share of the hulls. It turns out torpedo craft and destroyers in numbers; the prestige ships stay at Trieste, which was the bargain."
 AUH_whitehead_fiume:0 "Whitehead & Co., Fiume"
 AUH_whitehead_fiume_desc:0 "The torpedo works, and with it the gyroscope that finally makes a torpedo run where it is aimed. It sells to every navy that asks, including the ones our fleet is built against, and no minister has found a way to say so politely."
 #DNC Austria-Hungary - aircraft manufacturers
 AUH_etrich:0 "Etrich, Oberaltstadt"
 AUH_etrich_desc:0 "A Bohemian linen-mill family that took the seed of a climbing gourd, copied the shape of its wing and built a monoplane that flies itself. It is stable to the point of obstinacy: it will not fall out of the sky and it will not turn quickly either."
 AUH_lohner:0 "Jacob Lohner & Co., Vienna"
 AUH_lohner_desc:0 "Court carriage builders who went from coachwork to electric wheel-hub motors and are now bending ash and doping linen into airframes. The joinery is beautiful, the structures are heavy, and no other works in the realm can finish a fuselage like it."
 trade_concern:0 "Trade Concern"
 AUH_dnc_nationalities_cat:0 "The Register of the Nationalities"
 AUH_nat_the_register_overview:0 "The Register, at a Glance"
 AUH_nat_the_register_overview_desc:0 "No emperor has held all twelve. Choose what you will lose.\n\nEach people's standing out of 100, read once a month. §G40 or higher§!: content. §Y25 to 39§!: restless. §R10 to 24§!: refuses the levy. §Rbelow 10§!: in open revolt.\n\n§[GetAUS_supportColor][?AUS_support|0]§! — the Germans of Austria\n§[GetHUN_supportColor][?HUN_support|0]§! — the Magyars\n§[GetCZE_supportColor][?CZE_support|0]§! — the Czechs\n§[GetPOL_supportColor][?POL_support|0]§! — the Poles\n§[GetUKR_supportColor][?UKR_support|0]§! — the Ruthenes\n§[GetROM_supportColor][?ROM_support|0]§! — the Romanians\n§[GetCRO_supportColor][?CRO_support|0]§! — the Croats\n§[GetSER_supportColor][?SER_support|0]§! — the Serbs\n§[GetBOS_supportColor][?BOS_support|0]§! — the Bosniaks\n§[GetSLV_supportColor][?SLV_support|0]§! — the Slovenes\n§[GetITA_supportColor][?ITA_support|0]§! — the Italians\n§[GetSLO_supportColor][?SLO_support|0]§! — the Slovaks"
 AUH_nat_register_overview_noop_tt:0 "A report only, not a decision — nothing changes by reading it."
 AUH_dnc_the_rising:0 "A Rising in the Provinces"
 AUH_dnc_the_rising_desc:0 "One of the peoples has gone past petitioning. The gendarmerie asks for the army, the army asks for orders, and the Crown must decide what the register is worth."
 AUH_conciliate_AUS:0 "Concede to the Germans of Austria"
 AUH_conciliate_AUS_desc:0 "The German deputies want the language ordinances read their way and the offices staffed from Vienna."
 AUH_conciliate_HUN:0 "Concede to the Magyars"
 AUH_conciliate_HUN_desc:0 "Budapest wants the quota lowered, the word royal on the colours, and a customs line of its own."
 AUH_conciliate_CZE:0 "Concede to the Czechs"
 AUH_conciliate_CZE_desc:0 "Prague wants Bohemian state right acknowledged and Czech accepted in the inner service."
 AUH_conciliate_POL:0 "Concede to the Poles"
 AUH_conciliate_POL_desc:0 "Cracow governs itself already and wants that written down before anyone reconsiders."
 AUH_conciliate_UKR:0 "Concede to the Ruthenes"
 AUH_conciliate_UKR_desc:0 "The Ruthene clergy want their own chairs, their own schools and a curia that is not Polish."
 AUH_conciliate_ROM:0 "Concede to the Romanians"
 AUH_conciliate_ROM_desc:0 "The Romanian church schools of Transylvania want the law taken off their backs."
 AUH_conciliate_CRO:0 "Concede to the Croats"
 AUH_conciliate_CRO_desc:0 "Zagreb wants the Nagodba honoured to the letter and a ban who answers to the Sabor."
 AUH_conciliate_SER:0 "Concede to the Serbs"
 AUH_conciliate_SER_desc:0 "The Serb parishes want their schools, their fairs and their pigs left alone."
 AUH_conciliate_BOS:0 "Concede to the Bosniaks"
 AUH_conciliate_BOS_desc:0 "The occupied provinces want to be told which crown they belong to, and given a diet."
 AUH_conciliate_SLV:0 "Concede to the Slovenes"
 AUH_conciliate_SLV_desc:0 "The Slovene reading rooms want a university in Laibach and their cases heard in Slovene."
 AUH_conciliate_ITA:0 "Concede to the Italians"
 AUH_conciliate_ITA_desc:0 "Trieste and the Trentino want an Italian faculty and a prefect who speaks the town."
 AUH_conciliate_SLO:0 "Concede to the Slovaks"
 AUH_conciliate_SLO_desc:0 "The Slovak villages want the county to stop closing their schools."
 AUH_nat_room_to_give_tt:0 "This people is not yet reconciled to the realm: there is still something to give."
 AUH_r_convene_the_estates:0 "Convene the Estates Again"
 AUH_r_convene_the_estates_desc:0 "The old chambers can be summoned again without a fresh mandate — a short sitting, an address from the throne, a vote of loyalty read out in both houses. It settles nothing for good, but it reminds both benches, for a season, of what they still hold in common."
 AUH_eco_charter_the_common_banks_governor:0 "Charter the Common Bank's Governor"
 AUH_eco_charter_the_common_banks_governor_desc:0 "Two years on, the bank common to both halves still answers to no one seat in particular. It is time Vienna and Budapest agreed on whose portrait hangs in the boardroom."
 AUH_eco_common_banks_governor_tt:0 "A governor is named for the common bank of issue, and the joint institution finally has a face to answer for it."
 AUH_dnc_nationalities_cat_desc:0 "No emperor has held all twelve. Choose what you will lose."
 AUH_nat_the_mediation:0 "The Mediation"
 AUH_nat_the_mediation_desc:0 "The rising has a government of its own and the powers are already offering their good offices. There are three ways this ends, and the Crown has one hundred and twenty days to pick one. If it picks none, the province picks for it."
 AUH_nat_crush_the_rising:0 "Settle It With the Army"
 AUH_nat_crush_the_rising_desc:0 "No negotiation, no rescript, no mediation. The districts will be held by the garrison for as long as the garrison stands there, and the register will remember which people had to be held."
 AUH_nat_grant_the_great_demand:0 "Grant the Great Demand"
 AUH_nat_grant_the_great_demand_desc:0 "[GetAUHGreatDemand] - the one thing [GetAUHRisingPeople] have asked for in every petition for a generation. Granting it ends the rising and costs the Crown its authority in front of everybody else."
 AUH_nat_grant_the_great_demand_again:0 "Grant the Great Demand Again"
 AUH_nat_grant_the_great_demand_again_desc:0 "It was granted once and it did not hold. [GetAUHGreatDemand], a second time, at twice the price - and there will not be a third."
 AUH_nat_let_the_province_go:0 "Let the Province Go"
 AUH_nat_let_the_province_go_desc:0 "Sign the white peace, recall the garrisons, and let the map be redrawn by men who were subjects last spring. The Monarchy survives it. The idea of the Monarchy does not."
 AUHDNC_g_the_german_question:0 "The German Question"
 AUHDNC_g_the_german_question_desc:0 "Until Franz II laid it down, the Roman crown of the German nation was a Habsburg possession for three and a half centuries. Vienna has not spoken of it since Koeniggraetz. The archives are opened anyway, and a file is made.\n\nOpening the file is cheap. Everything after it is not: the German column stands at §[GetAUS_supportColor][?AUS_support|0]§!, and the Slav columns will read every word of this from the newspapers.\n\n§YThe Belvedere will not help you.§! The Archd"
 AUHDNC_g_los_von_rom:0 "Los von Rom"
 AUHDNC_g_los_von_rom_desc:0 "Schoenerer's movement tells the Germans of Austria to leave Rome and Austria together, and take themselves to the Protestant Reich. Tens of thousands convert. The pan-Germans of this monarchy are not our instrument - they are Berlin's, and they are working against us in our own German lands.\n\nA Greater Germany led from Vienna must first defeat its own pan-Germans."
 AUHDNC_g_break_the_schoenerians:0 "Break the Schoenerians"
 AUHDNC_g_break_the_schoenerians_desc:0 "The Statthalter, the gendarmerie and the courts against a legal party. Ban the associations, prosecute the newspapers, and finish the Ritter von Schoenerer in the only way that ever finished him - publicly, and by the state.\n\nIt works. It also teaches every German elector in Bohemia and the Alpine lands that Vienna reaches for the police first, and it costs the register a mark against the state that will never be rubbed out.\n\nThe Slavs applaud."
 AUHDNC_g_the_vienna_appeal:0 "The Appeal from Vienna"
 AUHDNC_g_the_vienna_appeal_desc:0 "Do not break the movement - outbid it. Berlin offers the Germans of Austria a Reich they must emigrate into. Vienna offers them a Reich they already live in, with the Hofburg at the head of it.\n\nKarl Hermann Wolf broke with Schoenerer over exactly this, and has kept a pan-German party that still calls itself Austrian. Buy him, his press and his voters, and the movement changes owner without losing a single member.\n\nThe price is paid in Bohemia."
 AUHDNC_g_the_catholic_south:0 "The Catholic South"
 AUHDNC_g_the_catholic_south_desc:0 "Bavaria, Wuerttemberg, the Rhineland: Catholic Germany never wanted a Protestant Prussian emperor, and the Zentrum has spent a generation being governed by men who distrust it. Vienna is the only capital in Europe that can speak to them as a co-religionist and a former sovereign.\n\nPrince Alois von Liechtenstein carries the Christian Social case south of the Main."
 AUHDNC_g_the_old_imperial_right:0 "The Old Imperial Right"
 AUHDNC_g_the_old_imperial_right_desc:0 "The lawyers of the Reichshofrat are set to work on the abdication of 1806: whether a crown laid down under Napoleonic duress was ever lawfully extinguished, and if not, in whom it now rests.\n\nThe opinion is worthless in international law and priceless in German politics. Every minor court that resents Berlin now has a text to cite.\n\nBerlin understands the message perfectly."
 AUHDNC_g_the_customs_union:0 "The Customs Union"
 AUHDNC_g_the_customs_union_desc:0 "No crown, no war: a tariff line drawn around Vienna and Berlin together, the idea Austrian and German economists have been circulating in the trade journals for a decade before anyone gives it a name.\n\nThis road belongs to the builders. It needs a settlement that holds - the quota at §Y[?AUH_quote|1]§!, no renewal missed - and a treasury that is not already groaning at §Y[?AUH_treasury_strain|0]§!.\n\nWhat you built in the economic branch is what you bring to the tabl"
 AUHDNC_g_the_common_currency:0 "One Coin for Two Empires"
 AUHDNC_g_the_common_currency_desc:0 "A tariff line can be undone by a ministry. A shared coin cannot. The krone and the mark are fixed against one another, the two note issues are made to answer to a single board, and the discount rates of Vienna, Budapest and Berlin stop being three separate weapons.\n\nSandor Popovics is brought to the common bank to hold the note issue of the whole union in one till.\n\nCheap money follows."
 auh_clock.400.t:0 "The Answer from Linz"
 auh_clock.400.d:0 "The file did not stay in the chancery a fortnight. Schoenerer speaks at Linz, and the speech is not about Vienna's crown at all - it is about the sixty thousand Germans of Austria who should be Prussians already, and the Habsburg court that stands between them and the Reich.\n\nThe Reichsrat wants to know whether the government intends to answer, and how."
 auh_clock.400.a:0 "Let him talk. A movement that shouts is a movement that can be counted."
 auh_clock.400.b:0 "Confiscate the edition. Charge the printer."
 auh_clock.401.t:0 "The Converts Are Counted"
 auh_clock.401.d:0 "The Statthalter returns the figures for Los von Rom. They are not enormous and they are not the point: the conversions run along the language frontier, in exactly the districts where a German column and a Czech column meet, and every one of them is a household saying it would rather be Prussian than Austrian.\n\nCardinal Gruscha asks whether the answer is to be the Church's or the state's."
 auh_clock.401.a:0 "The Church answers. Missions, schools, and a pastoral letter in every parish."
 auh_clock.401.b:0 "The state answers. The language ordinances, applied without discussion."
 auh_clock.402.t:0 "The Party Splits at Eger"
 auh_clock.402.d:0 "With the Ritter finished, his party comes apart in a hall at Eger. The radicals will go to Berlin whatever happens. The moderates - the schoolmasters, the small manufacturers, the clerks - are looking for somewhere to stand.\n\nLueger's machine can absorb them in a week, at a price."
 auh_clock.402.a:0 "Take them into the Christian Socials. Vienna keeps its Germans."
 auh_clock.402.b:0 "Let them go north. We are better without them."
 auh_clock.403.t:0 "The Bargain at the Volksrat"
 auh_clock.403.d:0 "Wolf brings his people to the Ballhausplatz and they do not come cheaply. He will put a pan-German movement behind a Habsburg crown, and in return he wants what pan-Germans always want: the offices, or the schools.\n\nThe offices cost the monarchy its reputation for impartiality. The schools cost it Bohemia."
 auh_clock.403.a:0 "Pay in offices. The administration becomes German where it counts."
 auh_clock.403.b:0 "Pay in schools. A German gymnasium in every mixed district."
 auh_clock.404.t:0 "The Zentrum Sends a Reply"
 auh_clock.404.d:0 "The reply comes back through Munich rather than Berlin, which is itself the answer. Catholic Germany is listening. It wants to know what a Habsburg crown would guarantee that a Hohenzollern one does not - and it is too experienced to be satisfied by sentiment.\n\nThe Nuncio suggests the guarantee be written down. The Finance Ministry suggests it be paid instead."
 auh_clock.404.a:0 "Write it down. A concordat guarantee for the whole German south."
 auh_clock.404.b:0 "Pay it. Subsidies, railway terms and a loan on Bavarian paper."
 auh_clock.405.t:0 "The Golden Bull Is Read Again"
 auh_clock.405.d:0 "The opinion of the Reichshofrat jurists runs to four hundred pages and reaches the conclusion it was commissioned to reach. The abdication was extracted under duress; the electoral college was dissolved by force and not by law; the dignity, in the jurists' careful phrase, was never lawfully vacated.\n\nPublishing it is a diplomatic act. Filing it is an insurance policy."
 auh_clock.405.a:0 "Publish. Let every court in Germany read it."
 auh_clock.405.b:0 "File it. The document is worth more unspent."
 auh_clock.406.t:0 "The Crown Is Carried to Vienna"
 auh_clock.406.d:0 "It is done, and it is done in the old way: a deputation, a formula, and an ancient object carried across a border by men in uniforms nobody has worn in a century.\n\nWhere the ceremony is held is the last political decision of the whole affair. Frankfurt says the crown returns to Germany. Vienna says Germany returns to the crown."
 auh_clock.406.a:0 "Frankfurt. Crowned where the emperors were crowned."
 auh_clock.406.b:0 "Vienna. The Hofburg, and the Hungarians invited to watch."
 auh_clock.407.t:0 "The Register Is Read After the Crown"
 auh_clock.407.d:0 "The gazette reaches Prague, Lemberg, Agram and Laibach on the same morning. It does not have to be explained. A monarchy of many peoples has told them all which people it belongs to.\n\nThe Statthalters send the same telegram in four languages: the districts are quiet today, and they will not be quiet next month.\n\nThe columns can still be bought. Not for long, and not for little."
 auh_clock.407.a:0 "Buy them. A promise in writing to the Slav lands, and pay for it in power."
 auh_clock.407.b:0 "Garrison them. The army is the answer to a register that will not read right."
 auh_clock.410.t:0 "The Tariff Line Is Drawn"
 auh_clock.410.d:0 "The negotiators reach the only question that ever mattered in a customs union: whose schedule the union adopts. Ours protects Bohemian textiles and Hungarian grain and costs Berlin nothing it will miss. Theirs is cheaper for our consumers and lethal for half our manufacturers.\n\nThe Delegations will vote on whichever we bring them."
 auh_clock.410.a:0 "Our schedule. We pay for the privilege of protecting our own."
 auh_clock.410.b:0 "Their schedule. Cheaper today, and cheaper every year."
 auh_clock.411.t:0 "The Krone and the Mark"
 auh_clock.411.d:0 "The ratio is set in a room in the Bankgasse with three governors and no journalists. A rate that flatters the krone protects Hungarian agriculture and the common budget. A rate that flatters the mark makes every German machine tool in Bohemia cheaper by a fifth.\n\nPopovics will sign either one and says so."
 auh_clock.411.a:0 "Set it high. The quota and the common budget come first."
 auh_clock.411.b:0 "Set it low. Let the works have their cheap machines."
 auh_clock.412.t:0 "Who Sits at the Head of the Table"
 auh_clock.412.d:0 "The union's first council meets, and the seating is the whole of it. Everything the delegates will argue about for the next twenty years was decided before they arrived, by furnaces, freight tonnage and the ledgers of two treasuries.\n\nNobody votes. Everybody understands."
 auh_clock.412.a:0 "Vienna takes the chair. The works we built are sitting in the room."
 auh_clock.412.b:0 "Berlin takes the chair. We asked for a partnership and were given a place at it."
 AUH_anton_josef_gruscha:0 "Anton Josef Gruscha"
 AUH_anton_josef_gruscha_desc:0 "Cardinal-Archbishop of Vienna, and the man who organised the Church's answer to Los von Rom parish by parish. Where the state can only prosecute, he can preach."
 AUH_karl_hermann_wolf:0 "Karl Hermann Wolf"
 AUH_karl_hermann_wolf_desc:0 "The pan-German who broke with Schoenerer and stayed Austrian: duellist, editor, and the only man alive who can deliver a German nationalist movement to the Hofburg without it dissolving in his hands."
 AUH_alois_von_liechtenstein:0 "Alois von Liechtenstein"
 AUH_alois_von_liechtenstein_desc:0 "Prince, Christian Social, and the aristocratic conscience of Catholic social politics. Berlin's Zentrum will receive him. Berlin's chancellor will not enjoy it."
 AUH_g_the_file_on_the_crown:0 "The File on the Crown"
 AUH_g_the_file_on_the_crown_desc:0 "The chancery is working on a question the monarchy has not asked aloud since the Elbe. The court is energised; nobody else is."
 AUH_g_the_movement_broken:0 "The Movement Broken"
 AUH_g_the_movement_broken_desc:0 "Bans, prosecutions and a ruined man. The pan-Germans are finished as a force and the instrument that finished them is now on the books."
 AUH_g_the_movement_bought:0 "The Movement Bought"
 AUH_g_the_movement_bought_desc:0 "Wolf's press, Wolf's clubs and Wolf's voters, all pointed at Vienna instead of Berlin. A loud asset with a very short leash."
 AUH_g_the_christian_social_machine:0 "The Christian Social Machine"
 AUH_g_the_christian_social_machine_desc:0 "Vienna's municipal apparatus absorbing a broken party. Rarely elegant, always effective."
 AUH_g_the_offices_are_german:0 "The Offices Are German"
 AUH_g_the_offices_are_german_desc:0 "The administration staffed to a nationality. It works quickly and it is noticed everywhere."
 AUH_g_the_catholic_south:0 "The Catholic South"
 AUH_g_the_catholic_south_desc:0 "Munich, Stuttgart and the Zentrum returning Vienna's calls. Berlin notices the traffic."
 AUH_g_the_concordat_guarantee:0 "The Concordat Guarantee"
 AUH_g_the_concordat_guarantee_desc:0 "A written undertaking to Catholic Germany, and the moral standing that comes with keeping one."
 AUH_g_the_old_imperial_right:0 "The Old Imperial Right"
 AUH_g_the_old_imperial_right_desc:0 "A legal claim that no chancellery accepts and no German court can ignore."
 AUH_g_the_imperial_crown:0 "The Imperial Crown of the Germans"
 AUH_g_the_imperial_crown_desc:0 "The oldest dignity in Europe, back in Habsburg hands, resting on a state whose majority is Slav and knows it."
 AUH_g_crowned_at_frankfurt:0 "Crowned at Frankfurt"
 AUH_g_crowned_at_frankfurt_desc:0 "The old coronation city, the old rite, and a Germany told that its emperor has come home."
 AUH_g_crowned_at_vienna:0 "Crowned at Vienna"
 AUH_g_crowned_at_vienna_desc:0 "The Hofburg, the Hungarian delegation in the front row, and a crown that is understood to have moved to the Danube."
 AUH_g_the_promise_to_the_slavs:0 "The Promise to the Slavs"
 AUH_g_the_promise_to_the_slavs_desc:0 "Guarantees given in writing to peoples who have just been shown where they stand. Expensive, and worth every crown of it."
 AUH_g_the_middle_european_tariff:0 "The Middle European Tariff"
 AUH_g_the_middle_european_tariff_desc:0 "One line around two empires. The largest protected market in Europe, and our manufacturers inside it."
 AUH_g_the_schedule_is_ours:0 "The Schedule Is Ours"
 AUH_g_the_schedule_is_ours_desc:0 "The union adopts our tariff book. Our works survive; our treasury pays for the privilege."
 AUH_g_the_schedule_is_theirs:0 "The Schedule Is Theirs"
 AUH_g_the_schedule_is_theirs_desc:0 "The union adopts Berlin's tariff book. Cheap goods, cheap credit, and a slow lesson in who is the workshop."
 AUH_g_the_middle_european_coin:0 "One Coin for Two Empires"
 AUH_g_the_middle_european_coin_desc:0 "Krone and mark fixed, note issues joined, and a single discount rate over the middle of Europe."
 AUH_g_the_middle_european_institutions:0 "The Common Institutions"
 AUH_g_the_middle_european_institutions_desc:0 "A council, a court and a chamber above both crowns. The union has become a state that nobody voted for."
 AUH_g_vienna_holds_the_chair:0 "Vienna Holds the Chair"
 AUH_g_vienna_holds_the_chair_desc:0 "The works we built are sitting in the room, and the room defers to them."
 AUH_g_berlin_holds_the_chair:0 "Berlin Holds the Chair"
 AUH_g_berlin_holds_the_chair_desc:0 "We proposed the union and were given a chair at it. The arithmetic was never in our favour."
 AUH_g_question_dial_tt:0 "§YThe German question stands at [?AUH_g_german_question|0] of 100. The pan-Germans stand at [?AUH_g_pangerman_strength|0].§!"
 AUH_g_the_heir_stands_in_the_way_tt:0 "§YFranz Ferdinand's chancery opposes any Habsburg bid for a German crown.§! On the Belvedere path this needs house prestige and a German column both at §Y55§! or better."
 AUH_g_the_belvedere_price_tt:0 "§RThe Belvedere is overruled, and the heir remembers it.§!"
 AUH_g_gruscha_unlocked_tt:0 "§GCardinal Gruscha is available as a political advisor.§!"
 AUH_g_wolf_unlocked_tt:0 "§GKarl Hermann Wolf is available as a political advisor.§!"
 AUH_g_liechtenstein_unlocked_tt:0 "§GPrince Alois von Liechtenstein is available as a political advisor.§!"
 AUH_g_schoenerer_is_finished_tt:0 "§RGeorg Ritter von Schoenerer is finished in public life.§!"
 AUH_g_pangermans_louder_tt:0 "§RThe pan-German movement grows louder.§!"
 AUH_g_pangermans_quieter_tt:0 "§GThe pan-German movement loses ground.§!"
 AUH_g_prestige_up_tt:0 "§GThe standing of the House rises.§!"
 AUH_g_prestige_down_tt:0 "§RThe standing of the House falls.§!"
 AUH_g_the_scar_of_the_crown_tt:0 "§RThis is written into the scar the register never forgets.§!"
 AUH_g_the_slav_price_light_tt:0 "§RThe Slav lands read the German road for what it is.§!"
 AUH_g_the_slavs_are_abandoned_tt:0 "§RThe monarchy has chosen a nation. Every Slav column is scarred, and the scar does not heal.§!"
 AUH_g_the_register_is_read_tt:0 "§RThe register is recounted at once. Expect risings.§!"
 AUH_g_berlin_road_is_shut_tt:0 "§GThe imperial crown of the Germans is claimed from Vienna. Berlin can no longer take the German road.§!"
 AUH_g_the_german_era_closes_tt:0 "§YThe German question is answered, and the reign's account is closed with it. No further era of the monarchy can be opened.§!"
 AUH_g_berlin_stumbles_tt:0 "§YEither Germany has genuinely stumbled§! - a civil war, a war being lost, a Reich made subject, a parliamentary government carried, or a democratic majority above §Y45%§! - §Yor the German question itself stands at §Y85§! of 100§!, which Vienna can reach on its own by pressing every step of this road."
 AUH_g_the_claim_is_entered_tt:0 "§YA claim is entered on the German core lands.§!"
 AUH_g_the_contingents_are_raised_tt:0 "§GThe Reichskontingent Brigade template is drawn up.§!"
 AUH_g_the_settlement_holds_tt:0 "§YThe Ausgleich must be settled§!: no renewal missed, and the quota between §Y30§! and §Y45§!."
 AUH_g_the_treasury_is_sound_tt:0 "§YThe treasury must be sound§!: strain below §Y50§!."
 AUH_g_the_bank_is_ready_tt:0 "§YThe common bank must exist§! - the Bank of Two Capitals, or two banks holding one coin."
 AUH_g_the_union_has_a_head_tt:0 "§YThe union needs a head§!: at least §Y2§! great works standing to our name."
 AUH_g_the_tariff_was_ours_tt:0 "§GThe autonomous tariff was already ours. The union adopts our schedule for nothing.§!"
 AUH_g_the_treaties_were_ours_tt:0 "§GOur commercial treaties are folded into the union on our terms.§!"
 AUH_g_the_ring_underwrites_tt:0 "§GThe great houses of the Ring underwrite the new coin.§!"
 AUH_g_vienna_holds_the_chair_tt:0 "§GVienna takes the chair of the union.§!"
 AUH_g_berlin_holds_the_chair_tt:0 "§RBerlin takes the chair of the union.§!"
 AUH_g_threat_the_crown_of_the_germans:0 "The Crown of the Germans"
 AUH_g_threat_the_middle_of_europe:0 "The Middle of Europe"
 AUH_g_threat_the_old_right:0 "The Old Imperial Right"
 AUHFX_the_catholic_south_bonus:0 "The Catholic South"
 AUHFX_the_old_imperial_right_bonus:0 "The Old Imperial Right"
 AUHFX_the_german_schools_bonus:0 "The German Schools"
 AUHFX_the_middle_european_tariff_bonus:0 "The Middle European Tariff"
 AUHFX_the_middle_european_coin_bonus:0 "One Coin for Two Empires"
 AUHFX_the_union_chair_bonus:0 "The Chair of the Union"
 AUHDNC_g_the_army_for_one_war:0 "The Army for One War"
 AUHDNC_g_the_army_for_one_war_desc:0 "The military law is passed and the contingent is filled. Every case in the Chief's drawer is drawn against Belgrade, Rome or Lemberg. Conrad is told to draw one more, northward, and to draw it as though it were the only one that mattered. The gun works of Vienna, Pilsen and Budapest go onto a single order book; the Hungarian delegation is told what it will cost and is not asked whether it agrees."
 AUHDNC_g_a_partner_at_berlins_back:0 "A Partner at Berlin's Back"
 AUHDNC_g_a_partner_at_berlins_back_desc:0 "Vienna cannot face the Reich alone and every soldier at the Ballhausplatz knows it. Forgach is sent out quietly to find a capital that would like Berlin held for a season. Petersburg would want the Balkans left to it. Paris would want its money to speak. Either way the price is paid before the first gun is laid."
 AUHDNC_g_the_hour_when_berlin_looks_away:0 "The Hour When Berlin Looks Away"
 AUHDNC_g_the_hour_when_berlin_looks_away_desc:0 "The Reich has its own trouble somewhere else, and the trouble will not last. The staff opens the northern window, calls the reserve classes, and begins counting days. A window is not a war; it is permission to have one, and it closes."
 AUHDNC_g_the_crown_offered:0 "The Crown Offered"
 AUHDNC_g_the_crown_offered_desc:0 "The Reich is shaking and the German princes want a name to hold the wreck together. A deputation comes to the Hofburg with the offer the House once refused, and this time the House does not refuse. Nothing is fought for and everything is claimed, which the crownlands east of the Leitha understand as clearly as the Germans do."
 AUHDNC_g_the_reckoning_of_sixtysix:0 "The Reckoning of Sixty-Six"
 AUHDNC_g_the_reckoning_of_sixtysix_desc:0 "The question of who leads the Germans was settled at Koeniggraetz, and it was settled against Vienna. The Monarchy proposes to ask it again with the answer prepared. The crown the Habsburgs wore until the old Empire lapsed is claimed openly; Berlin's own road to a German nation is closed by that claim alone. Everything the realm has east of the Leitha will pay for it."
 AUHDNC_g_the_common_institutions:0 "The Common Institutions"
 AUHDNC_g_the_common_institutions_desc:0 "No proclamation and no army: a customs council, a common court, a standing conference of the German governments, and a chair at the head of the table that only Vienna can fill. The crown follows the institutions instead of preceding them. It is slower, cheaper and just as final, and the Slav deputies count the chairs and find none of them theirs."
 AUHDNC_g_the_reckoning_with_the_slavs:0 "The Reckoning with the Slavs"
 AUHDNC_g_the_reckoning_with_the_slavs_desc:0 "A German empire ruled from Vienna has no room in it for a Czech state right or a Croatian settlement. The Slav deputies read the proclamation and understand exactly what has been done to them. The Reichsrat is governed by paragraph, the diets are put in their place, and the coercion ledger takes every entry."
 AUHDNC_g_the_army_of_the_interior:0 "The Army of the Interior"
 AUHDNC_g_the_army_of_the_interior_desc:0 "Half an army for the frontier, half an army for the crownlands. Krauss draws up security divisions of second-line infantry with a squadron of horse and a police company, and the garrisons of Bohemia, Croatia and the Banat are doubled. It buys quiet. It costs recruits, marching speed, and every last shred of consent."
 AUHDNC_g_the_forge_of_the_german_lands:0 "The Forge of the German Lands"
 AUHDNC_g_the_forge_of_the_german_lands_desc:0 "The union is worth nothing until it is worth something in iron. Every German land the Monarchy holds is written into the register as its own; the works of Vienna, Pilsen, Witkowitz and Budapest are put on one order book with the northern plants. Bohemia builds the guns of an empire it never voted for."
 AUHDNC_g_the_empire_of_all_the_germans:0 "The Empire of All the Germans"
 AUHDNC_g_the_empire_of_all_the_germans_desc:0 "The crown that left Vienna with the old Empire comes back to it. One army, one register, one realm answering to the Hofburg, and a settlement with Hungary that is no longer a settlement. It is the largest thing the House has done in a century, and it is being done over provinces that are already in arms."
 AUH_g_tt_the_offensive_school_holds:0 "The offensive school holds the General Staff"
 AUH_g_tt_the_belvedere_must_be_squared:0 "The Belvedere must be squared: the heir is no friend of the pan-Germans, and only real standing in the House will override him. The House stands at §Y[?AUH_house_prestige|0]§! of the 55 required."
 AUH_g_tt_the_army_stands_ready:0 "The new military law is in force"
 AUH_g_tt_berlin_is_engaged:0 "Berlin is engaged elsewhere"
 AUH_g_tt_the_window_is_open:0 "The northern window is open"
 AUH_g_tt_the_partner_is_secured:0 "A partner stands at Berlin's back"
 AUH_g_tt_the_case_is_filed:0 "Kriegsfall N is filed"
 AUH_g_tt_the_house_stands_high:0 "The House can be offered a crown: standing of §Y[?AUH_house_prestige|0]§! against the 60 required"
 AUH_g_tt_berlin_is_in_trouble:0 "The Reich cannot hold itself together"
 AUH_g_tt_the_crown_is_claimed:0 "Vienna has claimed the German crown"
 AUH_g_tt_the_germans_answer_to_vienna:0 "The Germans answer to Vienna: the Reich is broken, made a subject, or the guns against it are silent"
 AUH_g_conrad_gets_his_map_tt:0 "Conrad von Hoetzendorf is given the one map he has always wanted and a level of skill with it"
 AUH_g_the_case_in_the_north_unlocked_tt:0 "The drawer opens: Kriegsfall N may now be filed"
 AUH_g_the_estimates_are_doubled_tt:0 "The estimates are carried on the common treasury"
 AUH_g_forgach_is_sent_tt:0 "Janos Forgach is taken off the Hungarian file and sent out as the envoy of the northern case"
 AUH_g_the_plan_needs_a_partner_tt:0 "One more plan joins the drawer"
 AUH_g_the_window_at_berlin_tt:0 "The northern window stands open while the Reich looks elsewhere"
 AUH_g_the_reckoning_opened_tt:0 "Koeniggraetz is refought, in reverse"
 AUH_g_the_crown_is_claimed_tt:0 "Vienna claims the imperial crown the House wore before the old Empire lapsed"
 AUH_g_the_road_from_berlin_is_closed_tt:0 "Berlin can no longer make a German nation of its own: the claim from Vienna closes that road"
 AUH_g_the_scars_of_the_crown_tt:0 "The Slav peoples remember this, and the register will not let them forget"
 AUH_g_the_ledger_takes_the_crown_tt:0 "The coercion ledger records what the crown cost"
 AUH_g_the_year_is_bought_tt:0 "A year of quiet is bought from every Slav column, and paid for out of the treasury"
 AUH_g_paragraph_fourteen_open_tt:0 "The Reichsrat may now be governed by paragraph"
 AUH_g_krauss_takes_the_interior_tt:0 "Alfred Krauss takes the interior command"
 AUH_g_skoda_takes_the_orders_tt:0 "Karl von Skoda takes the northern order book"
 AUH_g_the_german_lands_are_cored_tt:0 "Every German land the realm holds is written into the register as its own"
 AUH_g_the_einheitsreich_is_worn_tt:0 "The realm is worn as one empire, not as a settlement between two"
 AUH_g_era_end_tt:0 "The German question is answered from Vienna, and the era closes on it"
 AUH_g_schoenerer_turns_his_coat_tt:0 "Georg von Schoenerer takes his Los-von-Rom men over to the Reich, and the German street in Austria goes with him"
 AUH_g_schoenerer_is_prosecuted_tt:0 "The agitation is prosecuted; the pan-Germans of Austria are broken before they can cheer for Berlin"
 AUH_g_schoenerer_is_outbid_tt:0 "Lueger's men take the German street back with money and processions"
 AUH_g_the_belvedere_is_heavy_handed_tt:0 "The heir's police go about it heavily, and the German districts remember"
 AUH_g_petersburg_is_quieted_tt:0 "Petersburg is quieted; the Balkans are left to it"
 AUH_g_the_paris_bourse_opens_tt:0 "The Paris bourse opens to the common treasury"
 AUH_g_the_staff_waits_tt:0 "No capital answers. The staff files the case and waits."
 AUH_g_the_garrisons_are_doubled_tt:0 "The garrisons of the crownlands are doubled"
 AUH_g_the_provinces_are_left_alone_tt:0 "The provinces are left to themselves, and they notice"
 AUH_g_conduct_no_case_n_tt:0 "§RKriegsfall N was never filed:§! the northern opening will be improvised."
 AUH_g_conduct_no_partner_tt:0 "§RNo partner stands at Berlin's back:§! the Monarchy fights the Reich with both hands."
 AUH_g_conduct_los_von_rom_tt:0 "§RThe Los-von-Rom agitation is loose:§! the German districts behind the northern army cheer for the enemy."
 AUH_g_case_n_filed_tt:0 "Kriegsfall N is filed against the Reich"
 AUH_g_the_sitting_is_held_tt:0 "The house is governed for another quarter without it"
 AUH_g_threat_the_army_for_one_war:0 "Vienna Arms for the North"
 AUH_g_threat_the_search_for_a_partner:0 "Vienna Looks for a Partner"
 AUH_g_threat_the_partner_at_berlins_back:0 "A Partner at Berlin's Back"
 AUH_g_threat_the_hour_is_watched:0 "The Northern Window"
 AUH_g_threat_the_crown_offered:0 "The Crown Offered to Vienna"
 AUH_g_threat_the_reckoning_of_sixtysix:0 "The Reckoning of Sixty-Six"
 AUH_g_threat_the_common_institutions:0 "The Common German Institutions"
 AUH_g_threat_the_crown_is_claimed:0 "Vienna Claims the German Crown"
 AUH_g_threat_the_slav_question_is_closed:0 "The Slav Question Is Closed"
 AUH_g_threat_the_army_of_the_interior:0 "The Army of the Interior"
 AUH_g_threat_the_empire_of_all_the_germans:0 "The Empire of All the Germans"
 AUH_tb_g_the_army_for_one_war:0 "The Army for One War"
 AUH_tb_g_the_one_order_book:0 "The Single Order Book"
 AUH_tb_g_the_case_in_the_north:0 "Kriegsfall N"
 AUH_tb_g_the_common_institutions:0 "The Common Institutions"
 AUH_tb_g_the_army_of_the_interior:0 "The Army of the Interior"
 AUH_tb_g_the_forge:0 "The Forge of the German Lands"
 AUH_g_forgach_the_envoy:0 "Janos Forgach"
 AUH_g_krauss_the_interior:0 "Alfred Krauss"
 AUH_g_skoda_the_northern_orders:0 "Karl von Skoda"
 AUH_g_the_army_for_one_war:0 "The Army for One War"
 AUH_g_the_army_for_one_war_desc:0 "One plan, one frontier, one enemy. The staff has stopped pretending it is preparing for anything else."
 AUH_g_the_search_for_a_partner:0 "The Search for a Partner"
 AUH_g_the_search_for_a_partner_desc:0 "Envoys in three capitals, all asking the same question in different words."
 AUH_g_the_understanding_with_petersburg:0 "The Understanding with Petersburg"
 AUH_g_the_understanding_with_petersburg_desc:0 "The Balkans are conceded so that the north may be free. The army of the east may stand down; the Ballhausplatz may not mention Salonika again."
 AUH_g_the_understanding_with_paris:0 "The Understanding with Paris"
 AUH_g_the_understanding_with_paris_desc:0 "French capital finds a new borrower, and the Republic finds a partner willing to hold Berlin from the south."
 AUH_g_the_case_in_the_north:0 "Kriegsfall N"
 AUH_g_the_case_in_the_north_desc:0 "The northern deployment, worked out to the timetable of the last railway battalion."
 AUH_g_the_hour_is_watched:0 "The Hour Is Watched"
 AUH_g_the_hour_is_watched_desc:0 "The mobilisation tables are kept on the desk, not in the safe."
 AUH_g_the_los_von_rom_agitation:0 "The Los-von-Rom Agitation"
 AUH_g_the_los_von_rom_agitation_desc:0 "Schoenerer's men tell the Germans of Austria to leave Rome and Vienna together. A Greater Germany led from the Hofburg must first defeat its own pan-Germans."
 AUH_g_the_crown_is_offered:0 "The Crown Is Offered"
 AUH_g_the_crown_is_offered_desc:0 "A deputation of German princes and a crown carried up the Hofburg stairs. It cost nothing and it will be paid for later."
 AUH_g_the_common_institutions:0 "The Common Institutions"
 AUH_g_the_common_institutions_desc:0 "A customs council, a common court, a standing conference, and the chair at the head of the table. Government by committee, from Vienna."
 AUH_g_the_reckoning_of_sixtysix:0 "The Reckoning of Sixty-Six"
 AUH_g_the_reckoning_of_sixtysix_desc:0 "The army that lost at Koeniggraetz has been rebuilt for one purpose and told what it is."
 AUH_g_the_slav_question_is_closed:0 "The Slav Question Is Closed"
 AUH_g_the_slav_question_is_closed_desc:0 "Government by paragraph. It works, until the provinces stop pretending it does."
 AUH_g_the_army_of_the_interior:0 "The Army of the Interior"
 AUH_g_the_army_of_the_interior_desc:0 "Divisions that will never see a frontier, standing in the towns of Bohemia, Croatia and Galicia."
 AUH_g_the_forge_of_the_german_lands:0 "The Forge of the German Lands"
 AUH_g_the_forge_of_the_german_lands_desc:0 "One order book from the Danube to the Rhine, and Bohemian coal underwriting all of it."
 AUH_g_the_one_german_army:0 "The One German Army"
 AUH_g_the_one_german_army_desc:0 "Common army, Landwehr and Honved dissolved into a single establishment with one language of command."
 AUH_g_the_empire_of_all_the_germans:0 "The Empire of All the Germans"
 AUH_g_the_empire_of_all_the_germans_desc:0 "The old imperial crown restored, over a realm where half the register is in arms against it."
 AUH_g_file_the_case_in_the_north:0 "File Kriegsfall N"
 AUH_g_file_the_case_in_the_north_desc:0 "The northern deployment against the Reich, worked out and locked in the drawer with the others."
 AUH_g_the_paragraph_fourteen_sitting:0 "Govern by Paragraph"
 AUH_g_the_paragraph_fourteen_sitting_desc:0 "Another quarter carried by emergency ordinance instead of a vote. The house keeps quiet and the ledger grows."
 auh_clock.415.t:0 "A Partner at Berlin's Back"
 auh_clock.415.d:0 "Forgach reports from his soundings. Petersburg will hold its hand in the north if the Monarchy takes its own hand off the Balkans for good. Paris will lend, generously, to anyone who will keep the Reich looking two ways at once, and will say so in print. Neither offer is friendship. Both are invoices."
 auh_clock.415.a:0 "Petersburg. Let the Balkans be the price."
 auh_clock.415.b:0 "Paris. Let the money speak, and let Rome read it."
 auh_clock.415.c:0 "Neither. The staff will file and wait."
 auh_clock.416.t:0 "The Hour Is Watched"
 auh_clock.416.d:0 "The Reich is busy elsewhere and the Chief wants a date. The railway section says the concentration can be run inside the window if it is run now; the treasury says every week the reserve classes stand under arms is a week of borrowing. The window will not stay open by itself."
 auh_clock.416.a:0 "Set the date."
 auh_clock.416.b:0 "Hold the window open a while longer."
 auh_clock.417.t:0 "Los von Rom"
 auh_clock.417.d:0 "Georg von Schoenerer has been telling the Germans of Austria to leave Rome for years, and to leave Vienna with it. Now that Vienna proposes to lead the Germans itself, his men do not cheer: they say the crown belongs in Berlin, and they say it in the German districts of Bohemia, Styria and Lower Austria, behind the very army that is meant to march north."
 auh_clock.417.a:0 "Prosecute the agitation."
 auh_clock.417.b:0 "Outbid them in the German street."
 auh_clock.417.c:0 "Let them shout."
 auh_clock.418.t:0 "The Proclamation Reaches the Crownlands"
 auh_clock.418.d:0 "It takes four days for the text to reach every Statthalterei and about four hours after that for the meaning to be understood. A German empire governed from Vienna is a realm with no state right for Bohemia, no settlement for Croatia, no Galician autonomy worth the paper. The Czech deputies walk out first. The others are only slower."
 auh_clock.418.a:0 "Govern by paragraph. They will learn."
 auh_clock.418.b:0 "Buy a year. Concede in every crownland at once."
 auh_clock.418.c:0 "Double the garrisons and say nothing."
 auh_clock.419.t:0 "The Year Runs Out"
 auh_clock.419.d:0 "The concessions bought twelve months of sullen quiet and nothing beyond them. The treasury cannot pay that price again, and the provinces have spent the year discovering how little the money was worth against the proclamation."
 auh_clock.419.a:0 "There is nothing left to buy it with."
 auh_clock.420.t:0 "Paragraph Fourteen"
 auh_clock.420.d:0 "The emergency article lets the Crown govern without the Reichsrat. It does not let it govern without the crownlands. The ministry must choose which diet is put down first, and which is left its dignity a little longer, or take both and be done with the pretence."
 auh_clock.420.a:0 "Bohemia is governed from Vienna. Galicia keeps its own."
 auh_clock.420.b:0 "Galicia is governed from Vienna. Prague keeps its own."
 auh_clock.420.c:0 "Both diets are dissolved."
 auh_clock.421.t:0 "The Army of the Interior Reports"
 auh_clock.421.d:0 "Three security divisions stand ready. Krauss says they will hold the towns and the railway junctions and nothing else, and that the field army will feel their absence the first week it needs them. The provinces will feel their presence rather sooner."
 auh_clock.421.a:0 "The garrisons stay where they are."
 auh_clock.421.b:0 "Send them to the field army."
 auh_clock.422.t:0 "The Empire of All the Germans"
 auh_clock.422.d:0 "The proclamation is drafted and the only question left is what the Emperor is to be called. The pan-Germans want the plain modern title. The Court wants the old one back, the one that lapsed when the Holy Roman Empire did, because it says something to the Catholic south and to the Slav crownlands that the modern one does not."
 auh_clock.422.a:0 "Kaiser der Deutschen."
 auh_clock.422.b:0 "The Roman crown, restored."
 AUH_a_the_four_waterways_tt:0 "The Danube-Oder, the Danube-Moldau, the Oder-Elbe and the regulation of the north-eastern rivers are voted in one bill."
 AUH_eco_the_ostrau_karwin_bonus:0 "The Ostrau-Karwin Basin"
 AUH_eco_the_black_country_tt:0 "The Ostrau-Karwin basin is worked as one field, on both sides of the crown-land line."
 AUH_eco_wurmb_directorate_tt:0 "The bores pass to the railway-building directorate that drove the Arlberg."
 AUH_eco_the_works_at_simmering_tt:0 "The engine order goes to the machine and wagon works at Simmering, and the electrical house that lit Prague enters the Crown's service."
 AUH_eco_kossuth_industry_act_tt:0 "The Kingdom's minister of commerce signs the general guarantee, and the island below the capital gets the plant."
 AUH_eco_boehm_bawerk_at_the_treasury_tt:0 "The professor keeps the pen: what does not balance is struck, whoever asked for it."
 AUH_eco_the_laenderbank_tt:0 "The Vienna house that carries the Oriental business takes the line and the charters south of the Save, and the Porte is glad of it."
 AUH_eco_the_creditanstalt_tt:0 "The greatest house of the Ring underwrites the field, and holds itself ready for the next syndicate."
 AUH_eco_the_carpathia_at_the_molo_tt:0 "The steamer berths at the Molo, and the Kingdom's port has a direct line to New York."
 AUH_arm_the_arsenal_pours_tt:0 "The Arsenal keeps the proof range and the bronze recipe."
 AUH_arm_karl_skoda_tt:0 "The master of the Pilsen works enters the Crown's service."
 AUH_arm_conrad_approves_the_works_tt:0 "The staff's mountain party has what it has asked for since the Tyrol commission reported."
 AUH_arm_the_seven_communes_tt:0 "The plateau above the Seven Communes is fortified to the frontier."
 AUH_arm_the_ring_of_przemysl_tt:0 "The girdle of works at the San is closed, and the outer ring toward Krakow is begun."
 AUH_arm_schonaich_at_the_ministry_tt:0 "The administrator takes the War Ministry."
 AUH_arm_schonaich_at_the_ministry:0 "Minister of War"
 AUH_arm_schonaich_at_the_ministry_desc:0 "An inspector-general who has never asked for a war and never lost an inspection. The estimates are defended line by line and the returns come in on time."
 AUH_air_the_motor_airship_society_tt:0 "A subscribed company of officers, engineers and Viennese money stands behind the line, and the Vienna aircraft works are taken on."
 AUH_h_frommer_at_the_works_tt:0 "The designer of the Kingdom's automatic pistol is engaged at the works."
 AUH_b_the_este_millions_tt:0 "The Modena inheritance moves through three Viennese banks, and the card index grows faster than the auditors can ask why."
 AUH_karl_skoda:0 "Karl von Škoda"
 AUH_karl_skoda_desc:0 "The son of the founder, and the man who turned a Pilsen machine shop into the second gun house of Europe. He will take the Crown's order. He will also price it."
 #DNC Austria-Hungary
 AUH_dnc_the_question_posed_tt:0 "The question of the realm is put; the loyalty of the twelve peoples begins to be counted."
 AUH_a_root_loyalty_tt:0 "The two state peoples are reassured; nobody else is."
 AUH_a_koerber_tt:0 "Ernest von Koerber may be called to the ministry."
 AUH_a_no_war_of_ours_tt:0 "No war of ours: this government will hold no war goal in the south."
 AUH_a_cabinet_loyalty_tt:0 "The offices are satisfied; the Chamber is not consulted."
 AUH_a_cabinet_german_confidence_tt:0 "The German notables are content to be governed by officials."
 AUH_a_wittek_tt:0 "Heinrich Ritter von Wittek may be called to the ministry."
 AUH_a_ordinance_counter_tt:0 "Entries are added to the register of ordinances."
 AUH_a_ordinance_loyalty_tt:0 "The offices approve; the kingdom of Bohemia does not."
 AUH_a_issue_an_ordinance_tt:0 "The ministry may now issue an ordinance whenever the Chamber will not sit."
 AUH_a_public_works_loyalty_tt:0 "The quarrelling provinces are being built in."
 AUH_a_gemeinsamkeit_tt:0 "What the two halves hold in common is worth a little more."
 AUH_a_gemeinsamkeit_down_tt:0 "What the two halves hold in common is worth rather less."
 AUH_a_strike_pressure_down_tt:0 "Pressure in the streets falls."
 AUH_a_strike_pressure_up_tt:0 "Pressure in the streets rises."
 AUH_a_corridor_loyalty_tt:0 "The Alpine and Littoral lands gain; the kingdom across the river watches its port undercut."
 AUH_a_kkstb_tt:0 "The state railways of the realm may be contracted with."
 AUH_a_waterway_loyalty_tt:0 "The northern peoples are paid; the south gets nothing."
 AUH_a_ddsg_tt:0 "The Danube steam navigation company may be contracted with."
 AUH_a_no_language_law_tt:0 "No language law will be laid before either Chamber."
 AUH_a_conferences_loyalty_tt:0 "Both camps are talking, which is more than either does in the Chamber."
 AUH_a_conferences_good_faith_tt:0 "The Czech clubs come in good faith."
 AUH_a_conferences_bad_faith_tt:0 "The Czech clubs come to be seen refusing."
 AUH_a_the_port_will_answer_tt:0 "The port at the head of the Adriatic will answer for this within the year."
 AUH_dnc_slot_tt:0 "A research slot is opened for the era. It is granted once."
 AUH_dnc_slot_already_tt:0 "The slot has already been endowed; the money goes to the laboratories instead."
 AUH_a_chairs_loyalty_tt:0 "Every people that asked for a chair has one."
 AUH_a_officials_loyalty_tt:0 "The service and the Polish Club are satisfied; the Czechs and Slovenes are not."
 AUH_a_road_of_the_officials_tt:0 "The realm takes the road of the officials; the road of the register is closed."
 AUH_a_daily_use_loyalty_tt:0 "The two state peoples gain by the wording of the question."
 AUH_a_census_taken_tt:0 "The census is in the field."
 AUH_a_curias_loyalty_tt:0 "Property and standing keep the Chamber; the unpropertied organise elsewhere."
 AUH_a_the_ring_will_answer_tt:0 "The street will present its account before the reign is out."
 AUH_a_fifth_body_loyalty_tt:0 "A curia that answers everybody and satisfies nobody."
 AUH_a_fifth_curia_added_tt:0 "A fifth curia has been added to the five."
 AUH_a_police_loyalty_tt:0 "The files grow; the men in them find out."
 AUH_a_police_under_the_officials_tt:0 "The service already runs the crownlands; the files cost nothing to keep."
 AUH_a_political_police_tt:0 "The political section of the ministry is established."
 AUH_a_exception_counter_tt:0 "Another proclamation is added to the ledger of exceptions."
 AUH_a_exception_loyalty_tt:0 "The garrison towns are quiet and remember why."
 AUH_a_proclaim_the_exception_tt:0 "The ministry may proclaim the exception in a disturbed city."
 AUH_a_postsparkasse_tt:0 "The postal savings office may be contracted with."
 AUH_a_bohemia_loyalty_tt:0 "The kingdom is administered and boycotts every state contract."
 AUH_a_the_old_capital_will_answer_tt:0 "The old capital will answer for this in the street."
 AUH_a_salaries_loyalty_tt:0 "The service is paid and belongs to the ministry."
 AUH_a_salaries_hold_the_regime_tt:0 "A service that is paid will apply an ordinance without asking whose law it is."
 AUH_a_ordinances_reported_tt:0 "The committee's verdict is printed and the ordinances stand."
 AUH_a_report_loyalty_tt:0 "The constitutional forms have been observed, which is what they are for."
 AUH_a_report_grossly_tt:0 "Too many of them are found grossly unconstitutional to be laughed off."
 AUH_a_report_excused_tt:0 "Most are excused by necessity and the instrument stays in the drawer."
 AUH_a_house_never_sits_loyalty_tt:0 "Neither national camp forgives a Chamber that is simply not used."
 AUH_a_bienerth_tt:0 "Richard von Bienerth-Schmerling may be called to the ministry."
 AUH_a_bureaucracy_loyalty_tt:0 "The offices and the Polish Club gain; the Czechs and the Italians do not."
 AUH_a_register_loyalty_tt:0 "Eight points pass from the two state peoples to the four that were never the default."
 AUH_a_road_of_the_register_tt:0 "The realm takes the road of the register; the road of the officials is closed."
 AUH_a_mother_tongue_loyalty_tt:0 "Every nation entered in the column acquires a claim."
 AUH_a_gautsch_tt:0 "Paul Gautsch von Frankenthurn may be called to the ministry."
 AUH_a_ring_loyalty_tt:0 "The march passes the Chamber and the bill is laid the same week."
 AUH_a_beck_tt:0 "Max Wladimir von Beck may be called to the ministry."
 AUH_a_three_ministries_loyalty_tt:0 "A service with no opinions is suspected by both national camps."
 AUH_a_bill_carried_by_the_street_tt:0 "The street is behind the text and the third ministry will carry it."
 AUH_a_universal_franchise_loyalty_tt:0 "The curial majorities of the Germans and the Poles are gone."
 AUH_a_universal_franchise_tt:0 "Universal, equal, direct and secret manhood suffrage is sanctioned."
 AUH_a_peers_loyalty_tt:0 "The notables voted the bill and were shown the list of their replacements."
 AUH_a_districts_nation_loyalty_tt:0 "The German groups keep more seats than their numbers."
 AUH_a_districts_by_nation_tt:0 "The districts are nationally of one piece."
 AUH_a_districts_equal_loyalty_tt:0 "Equal districts give the Slav peoples the majority the realm contains."
 AUH_a_polish_club_loyalty_tt:0 "Sixty-odd votes delivered, and the eastern peasantry told what it is worth."
 AUH_a_ruthene_petition_tt:0 "The Ruthene deputies petition again, and are answered again with the land commission."
 AUH_a_ruthene_body_loyalty_tt:0 "A body of their own in the eastern diet, and a Polish delegation that has stopped voting with us."
 AUH_a_ruthene_body_tt:0 "A separate Ruthene electoral body sits in the eastern diet."
 AUH_a_adler_tt:0 "Viktor Adler may be received as a party of government."
 AUH_a_workers_party_loyalty_tt:0 "The one party that speaks for every nation at once is dealt with as a party."
 AUH_a_thirty_parties_loyalty_tt:0 "The enlarged Chamber obstructs exactly as the old one did."
 AUH_a_gemeinsamkeit_reward_tt:0 "The realm is paid in political power for everything both halves have signed."
 AUH_a_caretaker_ended_tt:0 "The caretaker ministry of the kingdom is released."
 AUH_a_counties_ended_tt:0 "The counties return to order."
 AUH_a_signature_loyalty_tt:0 "Both halves have signed, and both halves know what it cost."
 AUH_a_the_text_is_signed_tt:0 "The realm has an agreed text and no further programme."
 AUH_a_cover_opinion_tt:0 "Every chancellery in Europe draws the obvious conclusion."
 AUH_a_cover_loyalty_tt:0 "The southern peoples of the realm read the verdict and the gazette."
 AUH_a_open_opinion_tt:0 "The realm can be believed, which is worth more than the service was."
 AUH_a_open_loyalty_tt:0 "The men the papers were forged against are told so publicly."
 AUH_a_jubilee_loyalty_tt:0 "Every crownland keeps the jubilee; the kingdom across the river does not come."
 AUH_a_landsteiner_tt:0 "The pathological institute is funded and its assistants are kept."
 AUH_a_capstone_loyalty_tt:0 "The realm ends the reign with every people still counted in it."
 AUH_a_capstone_ledger_tt:0 "The reward is read off the ordinances, the proclamations and the pressure in the streets."
 AUH_a_capstone_clean_tt:0 "The reign was governed with the Chamber more often than against it."
 AUH_a_capstone_dirty_tt:0 "The reign was governed by decree, by proclamation and against the street."
 AUH_a_capstone_provinces_tt:0 "The four provinces are in the realm and were taken without a shot."
 AUH_a_era_end_tt:0 "The era closes with the Settlement intact."
 AUH_a_two_parliaments_loyalty_tt:0 "Both capitals are told that the gap will be managed and not closed."
 AUH_a_budapest_column_open_tt:0 "The affairs of the other half are now this ministry's business."
 AUH_a_ausgleich_clock_tt:0 "The term of the arrangement with the other half is set."
 AUH_a_szell_tt:0 "Kalman Szell may be called to the ministry."
 AUH_a_formula_loyalty_tt:0 "The union survives by two identical decrees."
 AUH_a_open_ballot_loyalty_tt:0 "The governing party keeps its majority; four peoples are kept out of the Chamber."
 AUH_a_open_ballot_opinion_tt:0 "The western powers read the returns and draw conclusions."
 AUH_a_bills_loyalty_tt:0 "The army is served; the kingdom's Chamber is not."
 AUH_a_contingent_decision_tt:0 "The ministry may press for the raised contingent while the bills lie on the table."
 AUH_a_the_kingdom_will_answer_tt:0 "The kingdom's Chamber will answer for the bills within the year."
 AUH_a_common_army_loyalty_tt:0 "One army and one word of command, and the kingdom is told so at the manoeuvres."
 AUH_a_common_army_resented_tt:0 "The kingdom is already too far gone to hear the order as anything but a threat."
 AUH_a_ex_lex_loyalty_tt:0 "The kingdom is taxed without a law and knows it."
 AUH_a_same_rights_loyalty_tt:0 "This half states its equal right over the common affairs."
 AUH_a_khuen_falls_tt:0 "The ministry of the other half falls on a point of order the same afternoon."
 AUH_a_handkerchief_loyalty_tt:0 "The bills pass and the kingdom's Chamber will not forget how."
 AUH_a_tisza_tt:0 "Istvan Tisza may be called to the ministry of the other half."
 AUH_a_party_destroyed_tt:0 "The governing party of thirty years is destroyed at the next poll."
 AUH_a_banners_loyalty_tt:0 "Colours for one people, and the same file opened by every other."
 AUH_a_khuen_hedervary_tt:0 "Karoly Khuen-Hedervary may be called to the ministry of the other half."
 AUH_a_mav_tt:0 "The state railways of the kingdom may be contracted with."
 AUH_a_railwaymen_loyalty_tt:0 "Traffic runs; a hundred thousand state employees have learned what their contract is worth."
 AUH_a_fejervary_tt:0 "Geza Fejervary may be called to the ministry of the other half."
 AUH_a_bodyguard_loyalty_tt:0 "The kingdom is governed without its Chamber; the smaller peoples are pleased and afraid."
 AUH_a_commissioners_loyalty_tt:0 "The commissioners collect; the counties count what they were able to block."
 AUH_a_counties_will_answer_tt:0 "The counties will answer within the year, and it may go badly."
 AUH_a_kristoffy_tt:0 "Jozsef Kristoffy may be called to the ministry of the other half."
 AUH_a_brandish_loyalty_tt:0 "The smaller peoples are promised the ballot and the gentry are counting."
 AUH_a_nyiri_tt:0 "Sandor Nyiri may be called to the ministry of the other half."
 AUH_a_chamber_cleared_loyalty_tt:0 "The administrative strike is broken in an hour and remembered for fifty years."
 AUH_a_pact_loyalty_tt:0 "The crisis ends; the franchise of the kingdom is buried with it."
 AUH_a_the_pact_may_be_printed_tt:0 "The paper exists, and papers are printed."
 AUH_a_wekerle_tt:0 "Sandor Wekerle may be called to the ministry of the other half."
 AUH_a_andrassy_tt:0 "Gyula Andrassy the Younger may be called to the ministry of the other half."
 AUH_a_apponyi_tt:0 "Albert Apponyi may be called to the ministry of the other half."
 AUH_a_coalition_loyalty_tt:0 "The men who obstructed us take office and drop their programme."
 AUH_a_plural_vote_loyalty_tt:0 "The promise is kept in form and removed in substance."
 AUH_a_plural_vote_opinion_tt:0 "The schedule is printed abroad and read exactly as it was written."
 AUH_a_promise_kept_loyalty_tt:0 "Deputies of the smaller peoples enter the kingdom's Chamber."
 AUH_a_promise_kept_opinion_tt:0 "The realm is credited abroad with keeping a written promise."
 AUH_a_schoolmaster_loyalty_tt:0 "One language in the schoolroom, and four peoples told what that means."
 AUH_a_schoolmaster_opinion_tt:0 "A foreign publicist is handed a decade of material."
 AUH_a_subsidy_loyalty_tt:0 "The same money and no language condition."
 AUH_a_subsidy_opinion_tt:0 "The kingdom's neighbours are comfortable for the first time in the reign."
 AUH_a_pragmatic_loyalty_tt:0 "One tongue on the stations, and the coast in opposition."
 AUH_a_exempt_loyalty_tt:0 "The southern kingdom keeps the settlement it signed."
 AUH_a_south_slav_card_lost_tt:0 "Vienna can no longer play the South-Slav card against Budapest."
 AUH_a_quota_set_tt:0 "The kingdom's share of the common charge is fixed at the renewal figure."
 AUH_a_settlement_renewed_loyalty_tt:0 "One market of fifty millions, paid for by the half that gained least."
 AUH_a_settlement_opinion_tt:0 "The common tariff is renewed and the neighbours are informed."
 AUH_a_bank_loyalty_tt:0 "One bank of issue, and a premier who resigned and could not leave."
 AUH_a_popovics_tt:0 "Sandor Popovics may be called to the governorship."
 AUH_a_bank_credit_tt:0 "The realm borrows at the rate a great power ought to pay."
 AUH_a_goluchowski_tt:0 "Agenor Goluchowski may be called to the foreign ministry."
 AUH_a_common_affairs_loyalty_tt:0 "Three ministries that answer to both halves and to no chamber."
 AUH_a_delegations_loyalty_tt:0 "The common estimates are carried by two bodies that never meet."
 AUH_a_montecuccoli_tt:0 "Rudolf Montecuccoli takes the naval command."
 AUH_a_estimates_crown_loyalty_tt:0 "The yards begin; the kingdom is informed afterwards."
 AUH_a_bohm_bawerk_tt:0 "An economist of the finance ministry may be retained as theorist."
 AUH_a_orders_share_tt:0 "The kingdom's share of the orders is read off its share of the common charge."
 AUH_a_estimates_budapest_loyalty_tt:0 "The fleet becomes a Hungarian industrial interest."
 AUH_a_gold_credit_tt:0 "Foreign credit becomes cheap for the first time in living memory."
 AUH_a_gold_loyalty_tt:0 "One coin in both halves, paid for by the agrarian debtors of the kingdom."
 AUH_a_bilinski_tt:0 "Leon von Bilinski may be called to the governorship."
 AUH_a_common_bank_company_tt:0 "The common bank may be contracted with."
 AUH_a_governor_loyalty_tt:0 "The governorship changes half and the parity holds without a statute."
 AUH_a_burian_tt:0 "Istvan Burian may be called to the common finance ministry."
 AUH_a_bosnische_ostbahnen_tt:0 "The narrow-gauge eastern railways may be contracted with."
 AUH_a_provinces_integrated_tt:0 "The occupied provinces are drawn closer to the common administration"
 AUH_a_provinces_administered_tt:0 "The provinces are administered from the common finance ministry."
 AUH_a_provinces_loyalty_tt:0 "Roads, schools and a narrow gauge, and no local elite whatever."
 AUH_a_no_strip_promised_tt:0 "No territory beyond the provinces is promised by this act."
 AUH_a_altar_puppet_tt:0 "The confessional statutes are proclaimed in the provinces."
 AUH_a_altar_loyalty_tt:0 "The churches and the endowments get their self-government."
 AUH_a_altar_opinion_tt:0 "The Porte is told the statutes change nothing about the title."
 AUH_a_diet_refused_tt:0 "The demand for a constitution and a diet is refused, jointly, to both who asked."
 AUH_a_status_quo_opinion_tt:0 "Petersburg and Vienna agree to hold the south still."
 AUH_a_status_quo_loyalty_tt:0 "The southern peoples are told nothing will move."
 AUH_a_alliance_opinion_tt:0 "The alliance of three is renewed ahead of time."
 AUH_a_alliance_loyalty_tt:0 "The Italian subjects of the realm are told nothing was conceded about them."
 AUH_a_the_service_will_report_tt:0 "The service has been asked what else Rome has signed."
 AUH_a_faculty_loyalty_tt:0 "The Italian subjects get their faculty; the site is the ministry's business."
 AUH_a_faculty_event_tt:0 "The site of the faculty will be settled within the month."
 AUH_a_frontier_shut_loyalty_tt:0 "The agrarians are paid; the southern kingdom is shut out."
 AUH_a_frontier_shut_opinion_tt:0 "The trade war begins."
 AUH_a_their_trade_goes_west_tt:0 "Their trade and their artillery orders go to Paris and Berlin."
 AUH_a_treaty_opinion_tt:0 "The commercial treaty is signed and their market stays ours."
 AUH_a_treaty_loyalty_tt:0 "The southern kingdom stays in our orbit; the agrarians are told why."
 AUH_a_aehrenthal_tt:0 "Alois Lexa von Aehrenthal takes the foreign ministry."
 AUH_a_ballhausplatz_active_tt:0 "The foreign ministry takes the initiative in the south."
 AUH_a_understanding_cancelled_tt:0 "The understanding with Petersburg is at an end."
 AUH_a_active_policy_opinion_tt:0 "Petersburg and Belgrade read the change within the week."
 AUH_a_active_policy_loyalty_tt:0 "Both capitals approve; the southern peoples do not."
 AUH_a_provinces_question_armed_tt:0 "The question of the occupied provinces is now urgent whether we want it or not."
 AUH_a_oath_loyalty_tt:0 "The court is quiet and the heir has his own household."
 AUH_a_belvedere_open_tt:0 "The heir begins to build a chancellery of his own."
 AUH_a_oath_refused_loyalty_tt:0 "The court is in scandal and the succession is disputed."
 AUH_a_no_belvedere_tt:0 "The heir's chancellery is never formed."
 AUH_a_oath_dispensed_loyalty_tt:0 "The dynasty is embarrassed and the ministry is left alone."
 AUH_a_census_nine_loyalty_tt:0 "The list of admissible answers closes at nine."
 AUH_a_census_tenth_loyalty_tt:0 "A people nobody had counted appears in the column, and asks for a body of its own."
 AUH_a_census_german_lists_loyalty_tt:0 "They are entered on the German lists and told the matter is closed."
 AUH_a_exception_armed_tt:0 "The state of exception may now be proclaimed."
 AUH_a_port_shooting_loyalty_tt:0 "Fourteen dead in the square, and the state of siege the next morning."
 AUH_a_no_war_support_for_this_tt:0 "No war support is granted for shooting fourteen dockworkers."
 AUH_a_port_arbitration_loyalty_tt:0 "The arbitration is won the same evening and the port works within the week."
 AUH_a_port_conciliation_loyalty_tt:0 "Boards of conciliation are put into the law of the realm."
 AUH_a_bills_shelved_loyalty_tt:0 "The military bills go back in the drawer and a government is formable again."
 AUH_a_contingent_stays_frozen_tt:0 "The recruit contingent stays where the old military law left it."
 AUH_a_twelfths_run_loyalty_tt:0 "The twelfths run on and the kingdom is governed without a budget."
 AUH_a_orders_by_force_loyalty_tt:0 "The standing orders are carried by force and the opposition becomes one bloc."
 AUH_a_counties_fold_loyalty_tt:0 "The counties fold; the leaders of the opposition ask for terms."
 AUH_a_pact_unlocked_tt:0 "The capitulation may now be pocketed."
 AUH_a_word_given_loyalty_tt:0 "The word of command is conceded and the common army stops being one army."
 AUH_a_summary_law_kingdom_loyalty_tt:0 "Summary law is proclaimed in the kingdom and the counties come to heel."
 AUH_a_ring_cleared_loyalty_tt:0 "The police cleared the Ring and the workers' party has stopped asking for a franchise."
 AUH_a_capstone_reward_void_tt:0 "The reign will not be able to claim it ended in order."
 AUH_a_pact_denied_loyalty_tt:0 "The denial is not believed and the coalition's credit is destroyed."
 AUH_a_pact_published_loyalty_tt:0 "The text is published and the Crown is not accused of a secret bargain."
 AUH_a_old_capital_loyalty_tt:0 "Summary law in the old capital, for the third time in fifteen years."
 AUH_a_street_left_alone_loyalty_tt:0 "The street is left to the student corporations and the riot repeats."
 AUH_a_alliance_hollow_tt:0 "The alliance is worth less than the paper says and the staff is told so quietly."
 AUH_a_confront_rome_opinion_tt:0 "Rome is confronted and Berlin is pleased."
 AUH_a_confront_rome_loyalty_tt:0 "The realm's Italian subjects read the quarrel in their own press."
 AUH_a_faculty_tyrol_loyalty_tt:0 "A riot the first night, a young painter dead, and the faculty dissolved within the week."
 AUH_a_faculty_port_loyalty_tt:0 "The port's Germans and Slovenes read the siting as a surrender."
 AUH_a_faculty_nowhere_loyalty_tt:0 "Nothing is spent and the irredentist deputies are lost for good."
 AUH_a_conrad_tt:0 "Franz Conrad von Hoetzendorf takes the general staff."
 AUH_a_beck_rzikowsky_tt:0 "Friedrich von Beck-Rzikowsky is kept at the general staff."
 AUH_a_strip_returned_opinion_tt:0 "The garrisons are withdrawn and every capital in the south is told."
 AUH_a_strip_returned_loyalty_tt:0 "The provinces are told the realm wants nothing beyond them."
 AUH_a_wedge_kept_opinion_tt:0 "The garrisons stay and the survey is taken up again."
 AUH_a_provinces_claimed_not_cored_tt:0 "The four provinces are owned and claimed, and belong to neither half."
 AUH_a_proclamation_opinion_tt:0 "The proclamation is read in every chancellery in Europe within the day."
 AUH_a_proclamation_loyalty_tt:0 "The realm gains four provinces and a permanent enemy."
 AUH_a_someone_to_sign_with_tt:0 "The confessional autonomies give the provinces somebody who can sign."
 AUH_a_bulgaria_declares_too_tt:0 "The principality to the south declares its own independence the day before."
 AUH_a_title_bought_opinion_tt:0 "The Porte is paid and there is no crisis."
 AUH_a_title_bought_loyalty_tt:0 "The provinces are bought before they are proclaimed."
 AUH_a_no_contemporary_carrier_tt:0 "No minister of this realm proposed buying the title; this is a road not taken."
 AUH_a_ambiguity_kept_opinion_tt:0 "The ambiguity that has served for thirty years is left standing."
 AUH_a_ambiguity_kept_loyalty_tt:0 "The provinces are administered and nothing is proclaimed."
 AUH_a_berlin_note_opinion_tt:0 "The ally puts the question at Petersburg and the crisis closes."
 AUH_a_belgrade_signs_tt:0 "Belgrade signs what the ally dictates."
 AUH_a_defence_society_tt:0 "A defence society is founded and funded in the southern kingdom."
 AUH_a_trade_war_ended_tt:0 "The trade war is ended."
 AUH_a_pay_belgrade_opinion_tt:0 "Belgrade is paid, and the frontier is reopened."
 AUH_a_pay_belgrade_loyalty_tt:0 "The agrarians of the kingdom are told what their market was traded for."
 AUH_a_alone_opinion_tt:0 "Nobody signs anything and the realm stands on its own."
 AUH_a_alone_mobilisation_tt:0 "Petersburg and Belgrade mobilise; this realm can only be attacked or renounce."
 AUH_a_alone_loyalty_tt:0 "Both halves close ranks behind a government that will not be seen to yield."
