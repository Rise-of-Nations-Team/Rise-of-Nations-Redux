 AUH_air_the_gunners_read_the_wind_tt:0 "The corps artillery is taught to read the printed ascent before it ranges."
 AUH_air_a_french_hull_is_bought_tt:0 "A French firm is paid for one of the three hulls."
 AUH_air_the_club_cannot_pay_for_three_tt:0 "A subscription cannot buy three ships, and the committee says so publicly."
 AUH_air_berlin_approves_the_purchase_tt:0 "Berlin is pleased to sell, and says so through the military attache."
 AUH_air_the_estate_will_talk_tt:0 "The estate holds the drawings and will talk to whoever arrives with a commission."
