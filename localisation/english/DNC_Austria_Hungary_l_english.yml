 AUH_r_the_works_at_pilsen_bonus:0 "The Works at Pilsen"
 auh_dnc.204.c:0 "The mayor's ninety-five are for sale. Buy the whole clerical bloc."
 AUH_r_mayor_bought_after_reform_tt:0 "The clerical bloc sits in the majority, and the language statute can never be carried with it: those benches were bought by the other side to prevent exactly that."
 AUH_r_dnc_slot_tt:0 "A research slot is granted, once in this era."
 AUHDNC_the_dual_monarchy:0 "The Dual Monarchy"
 AUHDNC_the_dual_monarchy_desc:0 "One sovereign wears two crowns, and between the two halves there is no arbiter but himself. Every ten years the settlement must be re-signed, every year the common estimates carried twice. The question is not whether the realm survives but on what terms: by the agreed text, by the crown of Saint Stephen, or by the army."
 AUHDNC_a_the_compromise_is_the_constitution:0 "The Compromise Is the Constitution"
 AUHDNC_a_the_compromise_is_the_constitution_desc:0 "The Settlement is not a treaty we may reopen; it is the constitution. We will alter nothing that Vienna and Budapest have not both agreed to alter. Where a question cannot be decided we will pay for it: an institution costs money, a decision costs half the realm. We will be moved by an agreed text, not by a general in a hurry."
 AUHDNC_a_a_cabinet_of_civil_servants:0 "A Cabinet of Civil Servants"
 AUHDNC_a_a_cabinet_of_civil_servants_desc:0 "The Chamber cannot produce a majority and the Crown will not wait for one. We make a ministry of the men who already run the offices: jurists, heads of section, not one party leader among them. The parties may talk; the taxes and the courts will not stop while they do. We take office to administer, not to represent."
 AUHDNC_a_govern_by_the_fourteenth_paragraph:0 "Government by the Fourteenth Paragraph"
 AUHDNC_a_govern_by_the_fourteenth_paragraph_desc:0 "The budget, the taxes and the arrangement with the other half go out as emergency ordinances under the paragraph the constitution provides. The Chamber may approve them when it feels able; until then the realm will be governed. We do not call this parliamentary rule. Each is entered in a register that will be read out one day."
 AUHDNC_a_buy_peace_with_public_works:0 "The Act of the Four Waterways"
 AUHDNC_a_buy_peace_with_public_works_desc:0 "The canal bill is carried with the house adjourned: the Danube to the Oder, the Danube to the Moldau, the Oder to the Elbe, and the regulation of the north-eastern rivers, on a fourteen-year calendar with the treasury behind every span. It is the largest sum ever voted for anything that does not float. A province with spades in the ground has something to lose; the quarrel cools."
 AUHDNC_a_the_alpine_corridor:0 "The Corridor Through the Alps"
 AUHDNC_a_the_alpine_corridor_desc:0 "The whole programme goes into the mountains: new state lines through the Tauern and the Karawanken, and out to the port at the head of the Adriatic. The realm will have a second road to the sea of its own, not the single overloaded private line it depends on now. It will cost more than the estimate and bury a railway minister."
 AUHDNC_a_the_northern_waterway:0 "The Waterway of the North"
 AUHDNC_a_the_northern_waterway_desc:0 "The money goes to the canals instead: the Danube to the Oder, the Moldau to the Elbe, with arms reaching toward the Vistula. A barge carries what a wagon cannot, and it carries it to the Czech and Polish lands that have voted for this and never been paid. There will be no southern corridor; the fleet keeps the line it has."
 AUHDNC_a_the_conferences_without_a_law:0 "The Conferences Without a Law"
 AUHDNC_a_the_conferences_without_a_law_desc:0 "We will sit the Germans and the Czechs down in a room outside the Chamber, with the ministry in the chair and no shorthand writer at the door. They may agree what they like about the language of the offices. Whatever they agree will not be put to a vote, because a vote would break the Chamber and a law would break the ministry."
 AUHDNC_a_the_chairs_the_realm_pays_for:0 "The Chairs the Realm Pays For"
 AUHDNC_a_the_chairs_the_realm_pays_for_desc:0 "Where two peoples cannot share an institution, the treasury will pay for two. A chair in every tongue that asks for one, an examining board in each language, and the salaries to go with them. It is the most expensive answer available to us and the only one that offends nobody. We buy with money what others buy with a decision."
 AUHDNC_a_the_state_of_the_officials:0 "The State of the Officials"
 AUHDNC_a_the_state_of_the_officials_desc:0 "The realm will be administered, not represented. The service is the state we rely on; the Chamber is a room in which the parties are kept. The governor of each crownland, and not its diet, will decide who is heard, and the ministry will stand behind him. We propose no new constitution; we refuse to stop using the one we have."
 AUHDNC_a_the_language_of_daily_use:0 "The Language of Daily Use"
 AUHDNC_a_the_language_of_daily_use_desc:0 "The enumerator will ask each subject not what nation he claims but what tongue he uses at his counter. That answer will fix the rights of every office, school and court in the crownland. The list of admissible answers is the ministry's, and closed. We are counting a fact of daily life, and we decline to count an ambition."
 AUHDNC_a_the_curias_kept:0 "The Curias Kept"
 AUHDNC_a_the_curias_kept_desc:0 "The franchise stays as it stands. Property, standing and the payment of a tax decide who sits in the Chamber, because the men who carry the realm should be the men who choose its representatives. A crowd on the Ring is not an electorate. What is being organised outside the curias we will treat as a police question."
 AUHDNC_a_a_curia_for_those_who_own_nothing:0 "A Curia for Those Who Own Nothing"
 AUHDNC_a_a_curia_for_those_who_own_nothing_desc:0 "Rather than equal votes we will add one more body to the five, for the men who pay no tax and own no land. It will send enough deputies to be answered with and not enough to change a majority. The workers' party will call it an insult and contest every seat in it anyway. We concede the form and keep the arithmetic."
 AUHDNC_a_the_political_police:0 "The Political Police"
 AUHDNC_a_the_political_police_desc:0 "The state will know what its associations, its unions and its student corporations intend before they do it. Every club that meets more than twice keeps a register, every register is copied, and the copies come to one office on the Ring. We will not prosecute opinions; we will never again be surprised by a hall full of them."
 AUHDNC_a_the_state_of_exception:0 "The State of Exception"
 AUHDNC_a_the_state_of_exception_desc:0 "Where the street has taken a city, the ordinary law is suspended and the garrison commander answers for order until it is restored. Juries are set aside, the press is licensed, assemblies require a permit that will not be given. The law that allows this is part of the settlement we defend, and we will use it as written."
 AUHDNC_a_the_office_and_the_ordinance:0 "The Office and the Ordinance"
 AUHDNC_a_the_office_and_the_ordinance_desc:0 "What the Chamber will not vote, the ministry will decree, and the service will apply it without asking whose law it is. A postal savings office, a building regulation, a schedule of fees: none of it needs a majority and all of it needs doing. The habit is the danger and we take it with our eyes open."
 AUHDNC_a_rule_bohemia_by_ordinance:0 "Bohemia Ruled from the Ministry"
 AUHDNC_a_rule_bohemia_by_ordinance_desc:0 "The diet of the kingdom cannot sit without a riot, so it will not sit. Bohemia will be administered from the ministry by commission until it can conduct its business, and the commission will spend on it as generously as the diet ever did. The Czech deputies will boycott every state contract; we will place the contracts anyway."
 AUHDNC_a_the_treasury_pays_the_official:0 "The Treasury Pays the Official"
 AUHDNC_a_the_treasury_pays_the_official_desc:0 "Salaries across the service are raised, with seniority steps and advancement that comes automatically and not by favour. A servant who is not paid is a servant of somebody else. In exchange the service belongs to us: an official who stands for election is disciplined and transferred. It is the largest new charge on both budgets."
 AUHDNC_a_the_ordinances_reported:0 "The Ordinances Reported"
 AUHDNC_a_the_ordinances_reported_desc:0 "The constitutional committee may examine every ordinance this ministry has issued and publish whatever verdict it reaches. It may not annul one of them, and no minister will be arraigned on its finding. Having survived the reading, the instrument stays in the drawer and remains available."
 AUHDNC_a_the_house_that_never_sits:0 "The House That Never Sits"
 AUHDNC_a_the_house_that_never_sits_desc:0 "Let the Chamber obstruct. We will not reform its standing orders, we will not force a vote through the chair, and we will not need either. The session is adjourned; the ordinance carries the budget; the offices carry the realm. A parliament that has taught itself that obstruction is free will not be cured by us, and we have stopped trying."
 AUHDNC_a_a_bureaucracy_that_works:0 "A Bureaucracy That Works"
 AUHDNC_a_a_bureaucracy_that_works_desc:0 "We will finish this reign with the service, and not the Chamber, as the state. The offices are paid, the ordinances registered, the provinces administered and the trains run. We call an administration that works a constitution that works, and invite anyone who disagrees to say when the Chamber last carried a budget."
 AUHDNC_a_the_register_of_the_peoples:0 "The Register of the Voters"
 AUHDNC_a_the_register_of_the_peoples_desc:0 "The administration will draw one electoral register for every adult man in the western half, and do it in months rather than in sessions. We are not asking the nations to agree on what they are; we are counting men. The two peoples who were always the default here will find they are two entries among several."
 AUHDNC_a_the_mother_tongue_registered:0 "The Mother Tongue Registered"
 AUHDNC_a_the_mother_tongue_registered_desc:0 "The enumerator will ask a man what he is, not what he speaks at the counter, and the answer will be entered and kept. Every nation that appears in the column acquires a claim on a schoolmaster, an examining board and a set of official forms. We know what that costs and we are voting the money in advance."
 AUHDNC_a_yield_to_the_street_of_the_ring:0 "Yield to the Street"
 AUHDNC_a_yield_to_the_street_of_the_ring_desc:0 "The police will not fire on the march. The cordon will stand back, the crowd will pass the Chamber, and the ministry will lay an equal franchise before the House in the same week. We are conceding to a demonstration and will not pretend otherwise. From today the workers' party is a creditor of this government."
 AUHDNC_a_three_ministries_for_one_law:0 "Three Ministries for One Law"
 AUHDNC_a_three_ministries_for_one_law_desc:0 "The ministry that laid the bill has fallen on it, and we will spend two more on the same text rather than withdraw a line. The service is instructed to be objective to the point of having no opinions, in the national question as in the party question. We would rather be suspected by everybody than useful to one side."
 AUHDNC_a_a_vote_for_every_man:0 "A Vote for Every Man"
 AUHDNC_a_a_vote_for_every_man_desc:0 "Universal, equal, direct and secret manhood suffrage. The curias are abolished, the Chamber is enlarged, and the men who have voted in fifths and sixths of a vote will vote once. The realm will find out what it actually contains, and so will we."
 AUHDNC_a_a_creation_of_peers:0 "The Upper House Must Pass It"
 AUHDNC_a_a_creation_of_peers_desc:0 "The house of the notables will vote the franchise as it stands. If it will not, the Crown will name as many new members as it takes to carry it, and the list is already drawn. We do not expect to use the list; we expect it to be read. The notables will understand that they have been shown an instrument, and they will remember it longer than they remember the bill."
 AUHDNC_a_districts_drawn_by_nation:0 "Districts Drawn by Nation"
 AUHDNC_a_districts_drawn_by_nation_desc:0 "Districts will be cut nationally of one piece, so that a German seat is a German seat and a Czech seat a Czech seat. The German groups will hold rather more seats than their share of the population, and we have drawn it that way deliberately. It buys a decade of quiet, and returns the same majority whatever the country does."
 AUHDNC_a_districts_of_equal_number:0 "Districts of Equal Number"
 AUHDNC_a_districts_of_equal_number_desc:0 "Districts of equal population, drawn by the survey office without regard to which tongue lives in them. The majority of the Chamber will be Slav, because the realm is. The German clubs will call it a betrayal of the state people and go into obstruction within the year. We will govern with the assembly our own numbers produce."
 AUHDNC_a_the_price_of_the_polish_club:0 "The Price of the Polish Club"
 AUHDNC_a_the_price_of_the_polish_club_desc:0 "Galicia keeps its own school board, its own land commission and the ministry's ear, and in exchange its deputies vote our budgets without being asked twice. It is the only bloc in the western half that delivers what it promises. The arbitration in the eastern countryside goes to the landowners, because they deliver the bloc."
 AUHDNC_a_a_body_for_the_ruthenes:0 "A Body of Their Own in the Eastern Diet"
 AUHDNC_a_a_body_for_the_ruthenes_desc:0 "The diet of the eastern land will be opened to a separate Ruthene electoral body, with seats of its own and a school inspectorate answering to it. The Polish Club will be told in writing what we think of an arithmetic that needs seven Ruthene votes to return what one of theirs returns. They will stop delivering their bloc."
 AUHDNC_a_the_party_of_all_the_tongues:0 "The Party of All the Tongues"
 AUHDNC_a_the_party_of_all_the_tongues_desc:0 "The workers' party is the one body in this half that speaks for every nation at once, and it will be dealt with as a party of government rather than a conspiracy. Its press may print and its deputies will be received at the ministry like anybody else. In exchange it will carry budgets, and name its price each time."
 AUHDNC_a_a_chamber_of_thirty_parties:0 "A Chamber of Thirty Parties"
 AUHDNC_a_a_chamber_of_thirty_parties_desc:0 "We have given the western half the widest franchise in Europe and we will now govern the assembly it produced. It contains some thirty parties; it obstructs exactly as the old one did; it still cannot vote a budget. We say plainly what nobody wanted to hear: the franchise was worth doing and it settled nothing."
 AUHDNC_a_what_both_halves_will_sign:0 "What Both Halves Will Sign"
 AUHDNC_a_what_both_halves_will_sign_desc:0 "We will sign nothing that both halves have not already agreed, and we will call that enough for a constitution. Everything still outstanding is outstanding because one of the two parliaments will not have it, and no ministry of ours will pretend otherwise. From here the realm can be maintained; it cannot be changed."
 AUHDNC_a_cover_the_legation:0 "Cover the Legation"
 AUHDNC_a_cover_the_legation_desc:0 "The documents came from our own legation and our own section chief, and the ministry will stand behind both. There will be no prosecution, no resignation and no inquiry, and the file will be closed with a line in the official gazette. Every chancellery in Europe will draw the obvious conclusion about what we hand them in future."
 AUHDNC_a_open_the_papers_to_the_delegations:0 "Open the Papers to the Delegations"
 AUHDNC_a_open_the_papers_to_the_delegations_desc:0 "The Delegations will see the whole file, and the men who assembled it will answer for it in front of them. The service will lose its section chief, its budget line and most of its foreign residencies. We will be able to be believed, which is the only asset a foreign ministry of a realm like ours has left."
 AUHDNC_a_the_jubilee_of_the_reign:0 "The Jubilee of the Reign"
 AUHDNC_a_the_jubilee_of_the_reign_desc:0 "The jubilee of the reign will be kept in every crownland: foundations for hospitals and orphanages, amnesties, medals for the service, a review of the garrison in the capital. The kingdom across the river will not send a delegation, and nothing will be said about that. An old sovereign is the last thing we all hold in common."
 AUHDNC_a_the_settlement_holds:0 "The Settlement Holds"
 AUHDNC_a_the_settlement_holds_desc:0 "The realm ends this reign whole, solvent, with one army and two parliaments, and it will have decided nothing that could not be signed twice. That is the programme and there was never another. We hand on a machine that runs, a currency taken anywhere, and a set of quarrels that have all been paid to stand still."
 AUHDNC_a_the_two_parliaments:0 "The Two Parliaments"
 AUHDNC_a_the_two_parliaments_desc:0 "Two legislatures, one Crown, and no arbiter whatever between them. When they disagree there is no court and no casting vote; there is only the sovereign, and he is not a tribunal. We will manage that gap rather than close it, because closing it means opening the Settlement. Every common decision costs us twice."
 AUHDNC_a_the_formula_of_the_two_governments:0 "The Formula of the Two Governments"
 AUHDNC_a_the_formula_of_the_two_governments_desc:0 "The customs union will be kept alive by reciprocal royal ordinances, each half issuing the same text with a term attached. Nothing is settled; everything continues. The quarrel over the tariff and the quota is deferred to the term, and the term will arrive with a government neither of us has met."
 AUHDNC_a_the_vote_given_aloud:0 "The Vote Given Aloud"
 AUHDNC_a_the_vote_given_aloud_desc:0 "Elections in the kingdom will continue to be taken openly, each man naming his choice before the committee, with the gendarme at the door. About one man in sixteen has a vote and the governing party will take two seats in three. A majority we can count in advance is worth more than one we cannot."
 AUHDNC_a_the_bills_laid_on_the_table:0 "The Bills Laid on the Table"
 AUHDNC_a_the_bills_laid_on_the_table_desc:0 "The two military bills go to the Chamber of the kingdom exactly as drafted, with the recruit contingent raised and not one syllable conceded on the language of the regiments. There is no counterpart offered because there is nothing this government is willing to give. The opposition will obstruct, and we will let it. A session spent on one bill is a session, not a defeat."
 AUHDNC_a_common_and_undivided:0 "Common and Undivided"
 AUHDNC_a_common_and_undivided_desc:0 "The army of this realm is one army, with one language of command, one set of colours and one oath, and it will remain so. The legislature of the kingdom may discuss it as long as it pleases; it may not decide it alone. The order will be read at the autumn manoeuvres in the sovereign's own words, and remembered against us."
 AUHDNC_a_taxes_without_a_law:0 "Taxes Without a Law"
 AUHDNC_a_taxes_without_a_law_desc:0 "The kingdom has no budget, no indemnity act and no emergency paragraph: the constitution of that half simply did not provide for this. So the taxes will be levied by provisional twelfths on last year's figures, the recruits taken on last year's contingent, and the whole thing will be lawful in nobody's opinion including our own."
 AUHDNC_a_vienna_has_the_same_rights:0 "Vienna Has the Same Rights"
 AUHDNC_a_vienna_has_the_same_rights_desc:0 "The ministry of this half will rise in its own Chamber and state that the common affairs belong to both halves equally, citing the law of the Delegations. We will not sit silent while Budapest bargains alone with the Crown over an army we pay for. A government across the river will fall on it; the principle is worth a cabinet."
 AUHDNC_a_the_vote_taken_by_a_handkerchief:0 "The Vote Taken by a Handkerchief"
 AUHDNC_a_the_vote_taken_by_a_handkerchief_desc:0 "The standing orders will be changed this afternoon by a show of hands from the chair, and the chair will read the result whether or not it can be seen. The blocked bills pass, the session ends, and the obstruction ends with it. We are trading a party of thirty years for a session, and we know which the realm needs."
 AUHDNC_a_banners_without_words:0 "Banners Without Words"
 AUHDNC_a_banners_without_words_desc:0 "The regiments recruited in the kingdom may carry its colours and wear its badges, and the bills go back in the drawer. Not one word of command changes and not one clause of the military law is touched; what is conceded is cloth. Every other people of the realm will open the same file with a case exactly as good."
 AUHDNC_a_the_railwaymen_called_to_the_colours:0 "The Railwaymen Called to the Colours"
 AUHDNC_a_the_railwaymen_called_to_the_colours_desc:0 "The strike on the state lines will not be negotiated. The reservists among the men will be called up by royal order, and they will do the same work in uniform, under military discipline and for military pay. A hundred thousand state employees are about to learn that their employer is a barracks, and they will vote accordingly."
 AUHDNC_a_a_cabinet_of_the_bodyguard:0 "A Cabinet of the Bodyguard"
 AUHDNC_a_a_cabinet_of_the_bodyguard_desc:0 "The coalition that won the election will not be appointed. A general of the royal guard will take the ministry of the kingdom, with officials and soldiers in the portfolios and not one deputy among them. The counties will refuse to collect our taxes and hand over our recruits, and we shall find out how many of them mean it."
 AUHDNC_a_commissioners_in_the_counties:0 "Commissioners in the Counties"
 AUHDNC_a_commissioners_in_the_counties_desc:0 "Royal commissioners will take the chairs of the county assemblies that have refused us. The salaries of officials who obstruct will be withheld, the seals will change hands, and the gendarmerie will collect the taxes the county clerks will not. Tax and recruits resume within the month, or the commissioners stay for a year."
 AUHDNC_a_brandish_the_franchise:0 "Brandish the Franchise"
 AUHDNC_a_brandish_the_franchise_desc:0 "The government of the kingdom will put universal manhood suffrage in its programme and open a negotiation with the workers' party on the strength of it. The gentry may consider what an equal franchise would do to counties where they are one voter in twenty. We do not intend to enact it; we intend it to be believed."
 AUHDNC_a_the_chamber_cleared:0 "The Chamber Cleared"
 AUHDNC_a_the_chamber_cleared_desc:0 "The minister for the home guard is appointed royal commissioner, and an officer will read the rescript of dissolution from the floor. The home guard will clear it, the doors locked and the offices sealed the same evening. We are ending an administrative strike with troops in a parliament, and it reads well nowhere."
 AUHDNC_a_pocket_the_capitulation:0 "Pocket the Capitulation"
 AUHDNC_a_pocket_the_capitulation_desc:0 "The leaders of the opposition may take office on two written conditions: the military programme is dropped, and the economic settlement is renewed on our terms. Nothing else is promised in public. They will sign, and the paper will be kept — if it is ever printed the men who signed it are finished."
 AUHDNC_a_the_coalition_takes_office:0 "The Coalition Takes Office"
 AUHDNC_a_the_coalition_takes_office_desc:0 "The men who obstructed us for five years will now govern for us. They take the portfolios, the coalition takes the credit, and their programme stays in the drawer where they left it. The elections that follow will be crushing and will change nothing at all. We have not defeated the opposition; we have hired it."
 AUHDNC_a_the_vote_that_counts_twice:0 "The Vote That Counts Twice"
 AUHDNC_a_the_vote_that_counts_twice_desc:0 "The electoral promise of the pact goes to the interior ministry, and comes back as a bill in which a man's schooling, his property and his years give him a second vote and sometimes a third. The form of the promise is kept exactly; the substance is removed with care. Every later concession we make will be believed by nobody."
 AUHDNC_a_the_promise_kept:0 "The Promise Kept"
 AUHDNC_a_the_promise_kept_desc:0 "The promise of the pact will be carried as written: a wide franchise in the kingdom, tempered by schooling or property if it must be, but one man and one vote. Several dozen deputies of the nationalities will enter the Chamber, and after that no school act and no shooting in a northern village will be possible."
 AUHDNC_a_the_state_pays_the_schoolmaster:0 "The State Pays the Schoolmaster"
 AUHDNC_a_the_state_pays_the_schoolmaster_desc:0 "Every primary school that takes the state's money will teach in the state's language, and the schoolmaster will be examined in it, sworn to it and dismissed if his pupils cannot pass. The confessional schools may keep their doors open at their own charge. One system and one examination, in every county but the one exempted."
 AUHDNC_a_the_subsidy_without_a_condition:0 "The Subsidy Without a Condition"
 AUHDNC_a_the_subsidy_without_a_condition_desc:0 "The same money goes to the same schools. The state's language is taught as a subject, competently and everywhere, and the schoolmaster is examined on his arithmetic and not on his loyalty. What is abandoned is the idea that this kingdom must become one nation to remain one kingdom."
 AUHDNC_a_the_pragmatic_of_the_railway_service:0 "The Pragmatic of the Railway Service"
 AUHDNC_a_the_pragmatic_of_the_railway_service_desc:0 "Every servant of the state railways must be a citizen of the kingdom and know its language, in the southern kingdom exactly as north of the river. The signs, the timetables and the orders will be in one tongue from the frontier to the sea. The ban will resign rather than sanction it; his successor will sanction it."
 AUHDNC_a_exempt_the_kingdom_of_croatia:0 "Exempt the Kingdom of Croatia"
 AUHDNC_a_exempt_the_kingdom_of_croatia_desc:0 "The railway service in the southern kingdom keeps its own official language, as its schools already do under the settlement it signed. The signs stay as they are and the clerks stay where they are. Budapest will say we gave away the unity of the service; Vienna loses the South-Slav card it would have played across the river."
 AUHDNC_a_the_settlement_renewed:0 "The Settlement Renewed"
 AUHDNC_a_the_settlement_renewed_desc:0 "The customs and commercial union is renewed for another decade. The kingdom's share of the common charge rises, the tariff schedule is common, and the market stays one market from the Alps to the Carpathians. Having paid more, the kingdom will now ask for more, and every demand it makes is on the table at a discount."
 AUHDNC_a_the_charter_of_the_common_bank:0 "One Bank, and No Other"
 AUHDNC_a_the_charter_of_the_common_bank_desc:0 "There is one bank of issue for both halves and there will be no second. The demand for a separate bank in the kingdom is refused in writing, and the premier who carried it to us may resign over it. He will resign and stay in office, because there is no other majority in his Chamber and he knows it."
 AUHDNC_a_the_common_affairs:0 "The Common Affairs"
 AUHDNC_a_the_common_affairs_desc:0 "Three ministries answer to no chamber and to both halves at once: the foreign office, the war office, and the treasury that pays for them. Their ministers are appointed by the sovereign and can be brought down by neither parliament. This is the part of the realm that functions, precisely because nobody elected it."
 AUHDNC_a_the_delegations_of_sixty:0 "The Delegations of Sixty"
 AUHDNC_a_the_delegations_of_sixty_desc:0 "Sixty deputies from each parliament will vote the common estimates. They will sit in separate rooms, in separate languages, and exchange written notes rather than debate, because a joint sitting was the one thing neither half would concede. It is an absurd procedure and it has carried every common budget of this reign."
 AUHDNC_a_carry_the_estimates_by_the_crown:0 "Carry the Estimates by the Crown"
 AUHDNC_a_carry_the_estimates_by_the_crown_desc:0 "If the Delegations will not vote the common budget, the Crown will carry it and the works will be told to begin. The yards at the imperial port take the order, the guns are contracted, and the parliaments are informed. It is one more entry in the register of ordinances and a serious one. We would rather have the vote; we will not have the fleet wait for it."
 AUHDNC_a_buy_the_estimates_from_budapest:0 "Buy the Estimates from Budapest"
 AUHDNC_a_buy_the_estimates_from_budapest_desc:0 "The kingdom will vote the common estimates, and be paid for them in orders placed with its own yards and works, in a share fixed against the share it pays. New slips must be laid before a keel can be, so the first years buy nothing but concrete. We have made the fleet a Hungarian industrial interest, for good or for ill."
 AUHDNC_a_the_crown_alone:0 "The Crown Alone"
 AUHDNC_a_the_crown_alone_desc:0 "One coin, on gold, legal tender in both halves, and the old florin notes withdrawn. The realm can borrow at the rate a great power ought to pay. It also means we can never again quietly print our way out of a deficit, and every future war estimate must be found in taxes. The agrarian debtors will pay the difference."
 AUHDNC_a_a_governor_from_the_other_half:0 "A Governor from the Other Half"
 AUHDNC_a_a_governor_from_the_other_half_desc:0 "The governor of the common bank will be named from the half that did not name the last one, the note stays bilingual, and the board keeps its parity. No law says any of this and no law will be asked for. Each vacancy will therefore be a negotiation, and the other half will want something for it every time."
 AUHDNC_a_the_land_that_belongs_to_neither:0 "The Land That Belongs to Neither"
 AUHDNC_a_the_land_that_belongs_to_neither_desc:0 "The occupied provinces stay under the common finance ministry. No diet, no citizenship of either half, and officials sent down with their suitcases, moved on again in five years. What they will get is a road, a school, a hospital and a narrow-gauge line to the southern frontier. It is administration in place of politics."
 AUHDNC_a_autonomy_for_the_altar:0 "Autonomy for the Altar, Not for the Diet"
 AUHDNC_a_autonomy_for_the_altar_desc:0 "The churches, the schools and the religious endowments of the provinces get their self-government: their own assemblies, their own appointments. The political demand behind it does not. The head of the Muslim national organisation and the leading Serb notable asked us together for a diet, and are refused together."
 AUHDNC_a_the_status_quo_of_two:0 "The Status Quo of Two"
 AUHDNC_a_the_status_quo_of_two_desc:0 "The Balkans will be kept as they are by a direct understanding with Petersburg, agreed at a hunting lodge and not at a congress. We will police the Sultan's disturbed provinces together: a gendarmerie under foreign officers, indemnities for burnt villages. Nothing there can be taken while this holds, or lost."
 AUHDNC_a_renew_the_alliance_of_three:0 "Renew the Alliance of Three"
 AUHDNC_a_renew_the_alliance_of_three_desc:0 "The alliance is renewed as it stands, ahead of time and without a comma altered. Rome asked for nothing about our Italian subjects and we conceded nothing. Our own service believes there is a second paper in a third capital that empties this one, and we have asked them to find out."
 AUHDNC_a_a_faculty_anywhere_but_the_port:0 "A Faculty Anywhere But the Port"
 AUHDNC_a_a_faculty_anywhere_but_the_port_desc:0 "The Italian subjects of the realm will have their law faculty, sited where it cannot become the capital of an irredenta. Not the port, whatever the deputies say, preferably a city where the German burghers outnumber the students ten to one. It will be opened by ministerial decree, because no chamber would carry it."
 AUHDNC_a_shut_the_frontier_to_the_kingdom:0 "Shut the Frontier to the Southern Kingdom"
 AUHDNC_a_shut_the_frontier_to_the_kingdom_desc:0 "Their customs union with their northern neighbour will be answered by closing our market to their livestock. Four fifths of what that kingdom sells comes to us, and they will discover in a season what that is worth. When it is over their trade will run to Paris and Berlin, and we will have no peaceful lever on them at all."
 AUHDNC_a_the_treaty_belgrade_wanted:0 "The Treaty Belgrade Wanted"
 AUHDNC_a_the_treaty_belgrade_wanted_desc:0 "We will sign the commercial treaty already lying half-negotiated on the table, and treat their arrangement with their neighbour as the small thing it is. Their market stays ours, their loans stay ours, and their artillery order stays with our works. A kingdom that sells to us cannot afford to arm against us."
 AUHDNC_a_an_active_policy:0 "An Active Policy"
 AUHDNC_a_an_active_policy_desc:0 "The long standing-still is over. The foreign ministry will take the initiative in the south and the Delegations will be informed afterwards, as the law permits. The minister who kept the realm still for a decade has resigned to make the change easier for the Crown. The question of the occupied provinces now becomes urgent."
 AUHDNC_air_the_militar_aeronautische_anstalt:0 "The Militär-Aeronautische Anstalt"
 AUHDNC_air_the_militar_aeronautische_anstalt_desc:0 "The aeronautical establishment's estimates are renewed, and answerability for what flies over the army passes from the fortress-engineer branch to the General Staff. One line in the budget, one commander who reports upward, one place in the order of battle. We are not founding anything; we are settling who answers for it."
 AUHDNC_air_the_dirigible_question:0 "The Dirigible Question"
 AUHDNC_air_the_dirigible_question_desc:0 "What an army needs over a marching corps is a ship that can hold its place in the sky for a day, not a machine that falls out of it after four minutes. The Monarchy buys gasbags, and the men who can steer them. Everything we fly will be slow, enormous, and unable to go anywhere it has not first built a hall."
 AUHDNC_air_heavier_than_air:0 "Heavier than Air"
 AUHDNC_air_heavier_than_air_desc:0 "The Monarchy will not buy gasbags. We publish a tender for aeroplanes, we judge them by flying them, and we take our designers where we find them — a mill-owner's son in Bohemia, a coachbuilder in Vienna. Every machine is a prototype and every prototype a funeral risk. We are buying a lottery ticket and the estimates say so."
 AUHDNC_air_the_kress_committee:0 "The Kress Committee"
 AUHDNC_air_the_kress_committee_desc:0 "We will not ask the Delegations for a krone. The Flugtechnischer Verein opens a public subscription, the Aero-Club takes the collection, and the privy purse adds the Crown's gift. Flight stays a matter for engineers until it earns a line in the estimates — and the army's budget is untouched, along with the army's claim on it."
 AUHDNC_air_the_aeronautical_credits:0 "The Motor-Airship Society"
 AUHDNC_air_the_aeronautical_credits_desc:0 "We put an aeronautical line in the army estimates and defend it before both Delegations, against a Minister of War who calls the whole business superfluous. Behind the line stands a subscribed company of officers, engineers and Viennese money, with workshops of its own and a claim on the treasury. Budapest pays its share of a hall it will never see, and the line must be re-won every year."
 AUHDNC_air_the_wienerwaldsee_trials:0 "The Wienerwaldsee Trials"
 AUHDNC_air_the_wienerwaldsee_trials_desc:0 "We put the committee's money behind one machine and one man. He tries it on the reservoir above Vienna, in front of anybody who cares to walk out and watch, and we publish the result whichever way it goes. A failure watched by a thousand people is still an argument for the next subscription."
 AUHDNC_air_the_aero_club:0 "The Aero-Club and the Races"
 AUHDNC_air_the_aero_club_desc:0 "We charter the Aero-Club, we let it fly the Monarchy's colours in the international balloon races, and we send serving officers to it as guests. A state that will not pay for a school can at least stop forbidding its officers to attend somebody else's. The club will lobby us as often as it serves us."
 AUHDNC_air_the_move_to_fischamend:0 "The Move to Fischamend"
 AUHDNC_air_the_move_to_fischamend_desc:0 "We take the establishment out of the Arsenal, buy a field on the Danube within an hour of Vienna by rail, and build it a hall large enough for a rigid ship. A service that shares a yard with the gun foundry will never be more than a workshop of the gun foundry. The first hall goes up before the second estimate is voted."
 AUHDNC_air_the_aerological_ascents:0 "The Aerological Ascents"
 AUHDNC_air_the_aerological_ascents_desc:0 "The establishment's balloons go up for the observatory as well as the guns: ascents on a published timetable, instruments read at height, tables sent to every corps staff. An army that means to fly must first learn what the air does three thousand metres up. We buy the instruments abroad and the observatory bills us for the gas."
 AUHDNC_air_parseval_lebaudy_koerting:0 "Parseval, Lebaudy, Körting"
 AUHDNC_air_parseval_lebaudy_koerting_desc:0 "We buy one ship of each pattern — the Prussian, the French, the Hanoverian — fly them against one another, and let the crews say which the Monarchy will build for itself. Three patterns mean three sets of spares and three foreign firms to keep sweet. It is the fastest way to learn and the most expensive way to own nothing."
 AUHDNC_air_the_schwarz_patents:0 "The Schwarz Drawings"
 AUHDNC_air_the_schwarz_patents_desc:0 "The first all-metal hull was drawn by a subject of this Crown who never saw it fly. We commission a rigid ship to that principle from the drawings his estate still holds. There is no smelter in the Monarchy: we buy the ingot where it is made and rivet the hull here. The next ship in the hall is ours, or bought finished."
 AUHDNC_air_the_airship_of_the_army:0 "The Airship of the Army"
 AUHDNC_air_the_airship_of_the_army_desc:0 "The trial ships come off the experimental books and one pattern enters the order of battle: a hall, a crew, a mooring party and a number of its own. The ship becomes a unit and not an exhibit, and a corps commander may plan around what it sees. Thirty men and a supply of hydrogen are charged to the army whether it flies or not."
 AUHDNC_air_the_zanonia_wing:0 "The Zanonia Wing"
 AUHDNC_air_the_zanonia_wing_desc:0 "We stop paying men to copy birds and pay two men in a Bohemian mill town to copy a seed: an unmanned model first, a manned glider after it, and no engine at all until the wing will fly by itself. The laboratory is private, the mill pays for it, and the army is a guest there with no claim on a single drawing."
 AUHDNC_air_the_field_at_wiener_neustadt:0 "The Field at Wiener Neustadt"
 AUHDNC_air_the_field_at_wiener_neustadt_desc:0 "We do not build the aeroplane a shed inside the Arsenal. We lease a corner of the municipality's new field to the man who actually has a machine, and put an officer, a hangar and a wind sock of our own on the same ground, so that what is learned there is learned by the army. The theorist goes out as the pilot comes in."
 AUHDNC_air_the_etrich_taube:0 "The Etrich Taube"
 AUHDNC_air_the_etrich_taube_desc:0 "We do not wait for a tender. The establishment places a series order with the Bohemian works for the constructor's monoplane, sight unseen, and pays for the tooling and for a course of pilots to fly it. We are buying a machine that has flown forty metres, and the Delegations will be told so in those words."
 AUHDNC_air_the_balloon_detachments:0 "The Balloon Detachments"
 AUHDNC_air_the_balloon_detachments_desc:0 "Every fortress and every corps gets a captive balloon, a winch, a telephone cable and an officer trained to correct the guns from the basket. The fire direction of the army is rewritten around what that officer can see. The new arm is tied to the fortress artillery, and the fliers will have to win that argument again."
 AUHDNC_air_the_kite_balloon:0 "The Kite Balloon"
 AUHDNC_air_the_kite_balloon_desc:0 "The round balloon comes off the winch. The elongated kite balloon takes its place, because it holds steady in a wind that grounds the sphere. Every corps artillery gets one, and the observers are taught to read ground and not scenery. The fortress artillery is told to pay for the new envelopes out of its own credit."
 AUHDNC_air_the_fortress_balloon_parks:0 "The Balloon Parks of the Fortresses"
 AUHDNC_air_the_fortress_balloon_parks_desc:0 "Every first-class fortress gets a balloon park of its own — the one on the San, the one over the bay — paid out of the fortress credit and not out of the aeronautical line, and manned by the garrison that will use it. The money is already voted, so nobody has to vote it again."
 AUHDNC_air_the_first_military_pilots:0 "The First Military Pilots"
 AUHDNC_air_the_first_military_pilots_desc:0 "We stop lending officers to the enthusiasts and open a school of our own: a fixed course, a certificate signed by the establishment, a badge on the tunic, and a list from which a corps commander may ask for a flier by name. It gets ground, a hangar and an establishment, and it will produce officers who want machines."
 AUHDNC_air_a_flying_troop:0 "A Flying Troop"
 AUHDNC_air_a_flying_troop_desc:0 "We take the fliers out of the establishment and make them a troop of the line, with their own commander and a place in the order of battle, so the next Minister of War cannot dissolve them with a pen. The guns lose their trained observers and say so. No language ordinance has ever been written for this arm."
 AUHDNC_arm_the_three_armies:0 "The Three Armies"
 AUHDNC_arm_the_three_armies_desc:0 "We maintain a common army, a Landwehr and a Honved, and we pay for all three rather than let either half of the realm choose. The number of men we may call up is fixed by a military law neither parliament will reopen without being paid. So we spend this decade on the staff, the school, the gun and the frontier works."
 AUHDNC_arm_the_general_staff:0 "The General Staff"
 AUHDNC_arm_the_general_staff_desc:0 "The staff on the Ring gets its own credit, its own railway section and the right to draft the deployments without asking the War Ministry first. We are buying a brain for an army run as an accounts office. The bill is constitutional rather than financial: a staff that answers to the Crown is a staff no parliament can audit."
 AUHDNC_arm_keep_the_old_chief:0 "Keep the Old Chief"
 AUHDNC_arm_keep_the_old_chief_desc:0 "The chief who has held the staff for a quarter of a century stays at his desk. We buy modernisation in instalments and we do not buy a war, and we tell the Belvedere so in writing. The army we get is one nobody can invade and nobody can spend, and the offensive school is shut out for the rest of this reign."
 AUHDNC_arm_the_administrator:0 "Schönaich at the War Ministry"
 AUHDNC_arm_the_administrator_desc:0 "Neither the old chief nor the heir's man. The realm's best administrator takes the War Ministry, and the staff is made an office beneath it: works, railways and returns, the best kept desk in Europe. We are buying order, and nobody at that desk will ever hand us a plan of campaign."
 AUHDNC_arm_the_heirs_candidate:0 "The Heir's Candidate"
 AUHDNC_arm_the_heirs_candidate_desc:0 "We let the Belvedere name the chief of the General Staff. He is the best soldier of his generation and he will ask us for his war every time the Balkans move, in writing, with copies. His tactics manual becomes the school text and the offensive returns to the regulations. We are taking an instrument we may not be able to hold."
 AUHDNC_arm_the_school_of_caution:0 "The School of Caution"
 AUHDNC_arm_the_school_of_caution_desc:0 "We write the regulations of an army meant to be seen and not spent: fortified frontiers, deliberate mobilisation, and no plan that opens with an attack. The chief we kept is confirmed in the school he has taught all his life. From today the realm is visibly unable to begin anything, and every neighbour will price that in."
 AUHDNC_arm_the_deployment_plans:0 "The Deployment Plans"
 AUHDNC_arm_the_deployment_plans_desc:0 "The staff will write three deployments and keep them all in the drawer: one against the Balkan kingdom, one against the northern empire, one against our ally beyond the Alps. Writing the third is an act we will deny, and we are writing it. Three plans mean three sets of railway timetables, and a chief convinced one is overdue."
 AUHDNC_arm_the_autumn_manoeuvres:0 "The Autumn Manoeuvres"
 AUHDNC_arm_the_autumn_manoeuvres_desc:0 "We hold the great manoeuvres every autumn, before the Crown and the foreign attaches, and we pay the farmers for the trampled harvest. It is the most expensive fortnight of the year, and the only one in which the three establishments work as one. Everything the army has learned is tested, and so is everything it has not."
 AUHDNC_arm_the_kriegsschule:0 "The Kriegsschule"
 AUHDNC_arm_the_kriegsschule_desc:0 "We double the intake of the staff school and make the red trouser stripe reachable by an officer with neither a particle in his name nor German at home. The examination decides and nothing else decides. The court will notice within five years that the staff corps is no longer entirely its own, and it will be right."
 AUHDNC_arm_the_alpine_barrier:0 "The Forts of the Seven Communes"
 AUHDNC_arm_the_alpine_barrier_desc:0 "The fortress credit goes to the Tyrol. We close the passes against the ally whose treaty we renew and whose word we have never once trusted, and we do it with works he can count from his own side of the line. The two other frontiers on the commission's list will stand this decade exactly as they are."
 AUHDNC_arm_the_galician_bastion:0 "The Ring of Przemyśl"
 AUHDNC_arm_the_galician_bastion_desc:0 "The fortress credit goes to the San. We finish the armoured works begun and abandoned for money, and we build the strategic lines that feed them. It is the strongest single position we can make, and it faces the only empire that can actually kill us. Every other building programme in the realm slows down for it."
 AUHDNC_arm_the_bocche_and_the_save:0 "The Bocche and the Save"
 AUHDNC_arm_the_bocche_and_the_save_desc:0 "The fortress credit goes south: heavy batteries over the bay and fortified crossings on the Save. This is the only frontier work in the realm that buys us a campaign rather than a delay, and the staff has asked for it every year. The garrisons that hold it read as a threat in Belgrade, which is half of what they are for."
 AUHDNC_arm_the_recruit_contingent:0 "The Recruit Contingent"
 AUHDNC_arm_the_recruit_contingent_desc:0 "The two parliaments fix how many men we may call up, and neither will reopen the figure without being paid for it. Very well: we take the number the law allows and train more of them, for less time, than the law was written to permit. The reserve classes and the short colour service are expedients, and we say so openly."
 AUHDNC_arm_the_language_of_command:0 "The Language of Service"
 AUHDNC_arm_the_language_of_command_desc:0 "The words of command are not ours to change and we will not pretend otherwise. The language of service inside the regiment is ours: the courses, the orderly room and the pay book follow the men the regiment is recruited from, and stop there. Budapest will read it as a refusal, and it is one."
 AUHDNC_arm_the_officer_corps_of_many_tongues:0 "The Officer Corps of Many Tongues"
 AUHDNC_arm_the_officer_corps_of_many_tongues_desc:0 "Every officer must show a second regimental language within three years of his commission, and the army pays for the courses. A subaltern who cannot be understood by his own men is a subaltern we have wasted. The bill is paid in time rather than money: an officer in a classroom is an officer off the drill square, permanently."
 AUHDNC_arm_the_two_academies:0 "The Two Academies"
 AUHDNC_arm_the_two_academies_desc:0 "The line academy and the technical academy are funded to one standard, and the technical places are opened to the sons of officials, not only of officers. An artillery officer who understands metallurgy is worth more to us than a fourth generation of cavalry. The corps will understand what has been done to it; we fund it anyway."
 AUHDNC_arm_the_army_estimates:0 "The Army Estimates"
 AUHDNC_arm_the_army_estimates_desc:0 "We ask the Delegations for one thing only: an extraordinary military credit, outside the ordinary estimate, spent on arsenals and stores. The ordinary estimate is a political question and not this ministry's to settle. An extraordinary credit buys an extraordinary debate, and we take the debate and the stores together."
 AUHDNC_arm_the_mannlicher_standard:0 "The Mannlicher Standard"
 AUHDNC_arm_the_mannlicher_standard_desc:0 "One rifle, one cartridge, one works: the straight-pull repeater becomes the only weapon in the hands of the common army, the Landwehr and the Honved. Three establishments that cannot agree on a word of command will at least fire the same round. The depots must be converted all at once: a year of disorder for a decade of supply."
 AUHDNC_arm_the_schwarzlose_machine_gun:0 "The Machine-Gun Detachments"
 AUHDNC_arm_the_schwarzlose_machine_gun_desc:0 "We adopt the water-cooled gun from the same works, and give two to every battalion instead of building a machine-gun arm. The battalion commander keeps his guns; the establishment stays where the money already is. The rolling field kitchen travels with it, and both are heavy: from today the battalion moves at their pace."
 AUHDNC_arm_the_artillery_question:0 "The Artillery Question"
 AUHDNC_arm_the_artillery_question_desc:0 "We put the whole field artillery on the table at once: what the batteries shoot with, who casts the barrel, and whether the realm can make the metal at all. A standing commission reports on it every year and is answered every year. We would rather pay for that than keep firing a design our grandfathers approved."
 AUHDNC_arm_the_bronze_barrel:0 "The Steel-Bronze of the Arsenal"
 AUHDNC_arm_the_bronze_barrel_desc:0 "We keep the steel-bronze of the old inspector-general. The Arsenal can pour it today, in quantity, without waiting for a steelworks the realm does not have and cannot conjure. Every battery gets its gun and every gun is worse than the neighbours', and both of those sentences are the same decision."
 AUHDNC_arm_the_gun_steel_programme:0 "Pilsen Against Essen"
 AUHDNC_arm_the_gun_steel_programme_desc:0 "We pay for nickel-steel. The Bohemian works take the Crown's gun order and the Moravian ironworks the contract for the ingots, and in ten years the realm can make a barrel nobody has to apologise for. Fewer guns, later, and a bill the Delegations will hold against this ministry until it falls."
 AUHDNC_arm_the_gun_of_the_arsenal:0 "The Gun of the Arsenal"
 AUHDNC_arm_the_gun_of_the_arsenal_desc:0 "The quick-firing field gun goes into every battery, with the barrel we can pour and the recoil carriage we have licensed. The pieces it replaces go down to the Landwehr and Honved, where they should have gone a generation ago. We are adopting a gun the works cannot yet deliver in the numbers we need, and adopting it anyway."
 AUHDNC_arm_the_skoda_siege_train:0 "The Siege Train"
 AUHDNC_arm_the_skoda_siege_train_desc:0 "We order a siege train of heavy howitzers, and let the Bohemian works begin the very heavy piece the staff has asked for since the commission reported. The howitzers we shall have; the very heavy piece is a development, and it will be delivered to somebody else's government. We are buying the means to open a fortified frontier."
 AUHDNC_arm_the_mountain_troops:0 "The Mountain Troops"
 AUHDNC_arm_the_mountain_troops_desc:0 "We make the mountain a branch of the service. The Tyrolean rifles and the provincial marksmen get their own establishment, gun and badge, and the badge is not a small thing to the men who wear it. A corps trained for one kind of ground is slower on every other, and the ground we are likeliest to be attacked on stands on end."
 AUHDNC_arm_the_army_bill:0 "The Army Bill"
 AUHDNC_arm_the_army_bill_desc:0 "We lay a new military law before both parliaments: a contingent that follows the population, a shorter service with the colours, and a stated price for the votes. Until now this ministry has bought quality, because quantity was locked in a statute we could not open. We are opening it in public, and the bill will name the price."
 AUHDNC_bp_the_ballhausplatz:0 "The Ballhausplatz"
 AUHDNC_bp_the_ballhausplatz_desc:0 "Foreign affairs answer to neither chamber. The house on the square keeps the ciphers and the consulates of both crowns, and speaks for fifty million subjects with one voice; its estimate reaches the Delegations only after the instructions have left. A policy no parliament voted is one no parliament will defend."
 AUHDNC_bp_the_minister_of_the_house:0 "The Minister of the House and the Court"
 AUHDNC_bp_the_minister_of_the_house_desc:0 "One man holds the Imperial House, the Court and Foreign Affairs together, and answers to the sovereign and to nobody else. We confirm the office as it stands: one instruction, one signature binding both halves of the realm. The Delegations will vote his estimate and will not be told what it buys."
 AUHDNC_bp_the_expedition_to_the_east:0 "The Expedition to the East"
 AUHDNC_bp_the_expedition_to_the_east_desc:0 "The legations are besieged and our own minister is inside one of them. A cruiser division and a landing company of our seamen will join the relief column under our own flag, and come home when the column has done its work. We seek no empire beyond Suez, only to be counted among the powers that were asked."
 AUHDNC_bp_the_alliance_of_three_renewed:0 "The Alliance of Three Renewed"
 AUHDNC_bp_the_alliance_of_three_renewed_desc:0 "The treaty is renewed ahead of its term and not a comma is conceded. Rome asked that the grievances of our own Italian subjects be written into the text; we refused, and Rome signed regardless. Berlin is our certainty and Rome our insurance, and we will not pay twice for one paper."
 AUHDNC_bp_the_understanding_at_murzsteg:0 "The Understanding at Muerzsteg"
 AUHDNC_bp_the_understanding_at_murzsteg_desc:0 "At the hunting lodge the two emperors agree that neither will take a yard of the Sultan's provinces, and that both will reform them: gendarmerie districts drawn by nationality, a civil agent from each of us, indemnities for the burnt villages. We buy quiet on our southern frontier with a signature, not a battalion."
 AUHDNC_bp_the_consulates_of_the_levant:0 "The Consulates of the Levant"
 AUHDNC_bp_the_consulates_of_the_levant_desc:0 "Every port on the Sultan's coast where our steamers call gets a consul, a school and a post office, the consul a graduate of the oriental academy and not a merchant. We hold our nearest market with clerks and freight rates, not with ships. The Delegations pay for the buildings; the companies keep the profit."
 AUHDNC_bp_the_detachment_at_the_legation:0 "The Detachment at the Legation"
 AUHDNC_bp_the_detachment_at_the_legation_desc:0 "One cruiser stays on the eastern station, a company of our seamen stays at the legation, and the ground offered to us on the river is accepted. This is the entire extent of our policy in Asia, and it will not grow. What it buys is a flag in a harbour where the other powers keep theirs, and the right to be consulted."
 AUHDNC_bp_the_declaration_of_neutrality:0 "The Declaration of Neutrality"
 AUHDNC_bp_the_declaration_of_neutrality_desc:0 "While the Tsar fights at the other end of his empire, we declare we stay neutral if a third power attacks him, and he declares the same for us. He gives us a free hand should our partner across the Adriatic turn on us; we give him our backs turned in Asia. Nothing is published, and the southern frontier is ours to arrange."
 AUHDNC_bp_the_officers_in_the_vilayets:0 "The Officers in the Vilayets"
 AUHDNC_bp_the_officers_in_the_vilayets_desc:0 "The Sultan's Macedonian gendarmerie is to be officered by the powers, and the sector around Uskub falls to us. We send majors, not battalions: they will pay the men, redraw the boundaries by nationality and report every burnt village. They will be shot at by committees no treaty binds, and those we bury we bury quietly."
 AUHDNC_bp_the_line_toward_the_south:0 "The Line Toward the South"
 AUHDNC_bp_the_line_toward_the_south_desc:0 "The narrow gauge that stops at Uvac will be surveyed onward through the strip to the Sultan's trunk line, and our exporters will reach the Aegean without any neighbour's leave. The cost in those mountains is enormous. Petersburg will read it as the end of the hunting-lodge understanding, and be right."
 AUHDNC_bp_keep_the_minister_of_the_house:0 "Keep the Minister of the House"
 AUHDNC_bp_keep_the_minister_of_the_house_desc:0 "The minister offers his resignation and it is refused. The line he has held  -  nothing taken, nothing conceded, the peninsula kept as it is by two signatures  -  will be held to the end of this reign. We shall be told that a great power which never moves is growing old. We would rather be an ageing power than a bankrupt one."
 AUHDNC_bp_the_ambassador_from_petersburg:0 "The Ambassador from Petersburg"
 AUHDNC_bp_the_ambassador_from_petersburg_desc:0 "Our ambassador at the Tsar's court takes the house on the square with a programme: the standing still is over. The occupied provinces will be given a title in law, the strip settled one way or the other, the neighbours informed and not consulted. He means to obtain Petersburg's consent in a room with no clerk in it."
 AUHDNC_bp_the_frontier_shut_to_the_kingdom:0 "The Frontier Shut to the Kingdom"
 AUHDNC_bp_the_frontier_shut_to_the_kingdom_desc:0 "The southern kingdom signed a customs union with its eastern neighbour behind our back. Our answer is the veterinary certificate: no live pig, ox or sheep crosses our frontier, and agriculture signs the order, so it is a health measure and not a war. When our agrarians stop cheering, no peaceful lever on Belgrade remains."
 AUHDNC_bp_the_treaty_the_kingdom_wanted:0 "The Treaty the Kingdom Wanted"
 AUHDNC_bp_the_treaty_the_kingdom_wanted_desc:0 "We sign the commercial treaty their prime minister has kept on our table, and call their eastern arrangement the small thing it is. Their livestock keeps its market, their artillery is ordered from our works, their loans placed with our banks. The agrarians of the Hungarian half will vote against everything else we ask."
 AUHDNC_bp_the_meeting_at_buchlovice:0 "The Meeting at Buchlovice"
 AUHDNC_bp_the_meeting_at_buchlovice_desc:0 "Our minister receives the Russian foreign minister at a country house in Moravia, with no secretary in the room. We will say he agreed to our taking the title in the provinces; he will say he agreed to a conference and the Straits. Both will be telling the truth about a conversation nobody wrote down."
 AUHDNC_bp_the_provinces_are_declared:0 "The Provinces Are Declared"
 AUHDNC_bp_the_provinces_are_declared_desc:0 "The Sultan's restored parliament will summon deputies from provinces we have administered for a generation, and the fiction of occupation dies. By rescript the condominium ends: the provinces join the realm, kept under the common finance ministry, seated in neither parliament. Europe will be informed, not consulted."
 AUHDNC_bp_the_simultaneous_proclamation:0 "The Simultaneous Proclamation"
 AUHDNC_bp_the_simultaneous_proclamation_desc:0 "The prince at Sofia means to call himself Tsar of an independent kingdom the day before our rescript, whether we like it or not. So we arrange it: two announcements in two days, two indignations divided between us, and the Porte with two bills instead of one. Nobody outside three chancelleries will be told."
 AUHDNC_bp_the_protectorate_of_the_cults:0 "The Protectorate of the Cults"
 AUHDNC_bp_the_protectorate_of_the_cults_desc:0 "The Sultan's Catholic subjects on the western shore are ours to protect by old capitulation, and we mean to make it visible. Our consuls pay the priests, build the schools and receive the tribal chiefs; the subsidy goes to the mission, not to a rifle. Rome will call it a rival claim, and be right."
 AUHDNC_eco_the_common_market:0 "The Common Market"
 AUHDNC_eco_the_common_market_desc:0 "The customs union is the one thing both halves already own together, and we will run it as a going concern. The ministry of commerce will treat the schedule, the bank, the track and the quay as one estate with two treasuries. What one half spends, the other must consent to pay."
 AUHDNC_eco_the_autonomous_tariff:0 "The Autonomous Tariff"
 AUHDNC_eco_the_autonomous_tariff_desc:0 "We fix our own schedule of duties first and negotiate afterwards, if at all. Grain, flour and livestock will be sold behind a wall, and the agrarian majority that carries our budgets paid in the only coin it accepts. The treaties now running are left to lapse. We know what this costs abroad."
 AUHDNC_eco_the_commercial_treaties:0 "The Commercial Treaties"
 AUHDNC_eco_the_commercial_treaties_desc:0 "The schedule exists to be traded away. We sign, and keep our mills, sugar, timber and machinery inside other people's markets, with the clause giving our goods the best terms any third party obtains in every treaty. The consulates of the Levant become commercial agencies first. The agrarians pay in cheap foreign grain."
 AUHDNC_eco_the_league_of_the_landowners:0 "The League of the Landowners"
 AUHDNC_eco_the_league_of_the_landowners_desc:0 "The agrarian leagues of both banks become this government's partner on everything that grows. In exchange the frontier is shut to the livestock of the southern kingdom on a veterinary certificate, which is agriculture's affair and not the foreign office's. Four fifths of that kingdom's trade came to us; it will go elsewhere now."
 AUHDNC_eco_the_mills_of_the_two_capitals:0 "The Mills of the Two Capitals"
 AUHDNC_eco_the_mills_of_the_two_capitals_desc:0 "The grain of the plain will be ground where it is grown and sold as flour, not shipped away for somebody else's mill. The milling houses get the freight rate they ask for, the roller patents are protected here, and the schedule carries a line to keep the trade at home. The growers will pay the ring's margin."
 AUHDNC_eco_the_bounty_on_sugar:0 "The Bounty on Sugar"
 AUHDNC_eco_the_bounty_on_sugar_desc:0 "The export bounty that lets the cartel sell abroad below cost and charge our own households above it is given up. With it we buy an open market for our refined sugar, and the refineries will live on their own weight. The beet growers of the Great Plain pay for the change, and the cartel's political fund dries up with it."
 AUHDNC_eco_the_chambers_of_commerce:0 "The Chambers of Commerce"
 AUHDNC_eco_the_chambers_of_commerce_desc:0 "The chambers of commerce keep their own seats and their own voice while the franchise is being rewritten. In exchange they vote our budgets without being asked twice and staff our commercial courts at their own expense. When the franchise is made general they go back to being a trade body and stop being a bench."
 AUHDNC_eco_the_bank_of_two_capitals:0 "The Bank of Two Capitals"
 AUHDNC_eco_the_bank_of_two_capitals_desc:0 "The bank of issue stays one institution, two head offices, a note printed in both tongues. Its governorship is part of the bargain between the two governments and traded like every other part of it, under no rule of alternation either half could later cite. One policy for two economies: industry gains, agriculture pays."
 AUHDNC_eco_the_great_houses_of_the_ring:0 "The Great Houses of the Ring"
 AUHDNC_eco_the_great_houses_of_the_ring_desc:0 "The great houses of the capital will hold the shares of the realm's industries, carry its paper and place its loans, and answer to the ministry for all three. In return they keep the model that made them: a bank, a board seat and a works in one hand. One of them keeps its direction abroad, and we take the bargain anyway."
 AUHDNC_eco_the_city_takes_the_wire:0 "The City Takes the Wire"
 AUHDNC_eco_the_city_takes_the_wire_desc:0 "The tramway, the gasworks and the electrical station pass to the city they serve. The municipality owns the wire, sets the fare and carries the debt, and what it takes on the fare it spends on the tenements. Every loan is floated against the rates, so the house-owners will fight us, and we accept the fight."
 AUHDNC_eco_the_city_sells_the_concession:0 "The City Sells the Concession"
 AUHDNC_eco_the_city_sells_the_concession_desc:0 "No city of ours will borrow to buy a tramway. The wire is conceded to whoever will lay it, on a royalty and a term, and the borrowing power of the municipality is kept for the day the realm needs it. The housing question waits: the instrument that would have answered it has just been signed away."
 AUHDNC_eco_the_savings_of_the_provinces:0 "The Savings of the Provinces"
 AUHDNC_eco_the_savings_of_the_provinces_desc:0 "The postal savings office and the provincial credit unions are given the small deposit the great houses will not touch, in every tongue it is offered in. A schoolmaster's book and a co-operative's ledger are one institution to this ministry. This money will keep a smallholder off the emigrant boat."
 AUHDNC_eco_the_capital_goes_south:0 "The Länderbank Rides the Orient Line"
 AUHDNC_eco_the_capital_goes_south_desc:0 "The money of the Ring will go where the army would otherwise have to go: loans, concessions, abattoirs and railway charters in the kingdoms below us, on our paper and on our terms. A creditor is listened to longer than a garrison. We are buying a lever the foreign office can pull without the general staff."
 AUHDNC_eco_the_capital_stays_at_home:0 "The Creditanstalt of the Ring"
 AUHDNC_eco_the_capital_stays_at_home_desc:0 "Not one crown crosses the frontier while the Carpathian field is still being drilled on borrowed money. The field, the refineries and the pipeline will be financed here, and the realm takes its share of what comes out of the ground. We would rather own that problem than rent somebody else's."
 AUHDNC_eco_the_rate_that_defends_the_crown:0 "The Rate That Defends the Crown"
 AUHDNC_eco_the_rate_that_defends_the_crown_desc:0 "When the money of the world turns round, the bank raises its discount and holds the coin at its weight in gold, whatever it costs the man who borrowed to sow. Credit is throttled for as long as the defence lasts, and the indebted farmer pays first and loudest. The exchange will not move."
 AUHDNC_eco_the_iron_road:0 "The Iron Road"
 AUHDNC_eco_the_iron_road_desc:0 "The state railway administration is the largest employer, the largest buyer and the largest debtor in the realm, and it will be run as an instrument of the realm and not a collection of concessions. Timetables, freight schedules and mobilisation tables belong in one office and stay there."
 AUHDNC_eco_the_state_buys_the_network:0 "The State Buys the Network"
 AUHDNC_eco_the_state_buys_the_network_desc:0 "The great private companies are bought out one after another: the northern, the north-western and the old state-railway company. One tariff, one timetable, one owner, and a mobilisation plan that asks nobody's permission to move a train. The indemnities are enormous and the plant is old: we are buying rail that already exists."
 AUHDNC_eco_the_line_that_is_built_instead:0 "The Line That Is Built Instead"
 AUHDNC_eco_the_line_that_is_built_instead_desc:0 "We will not pay a fortune for rail that already exists. The same money goes into rail that is not: the mountain crossings and the strategic connections no board has found profitable. The companies keep their concessions, and one keeps its direction in a foreign capital, where its tariff quarrels will now be settled."
 AUHDNC_eco_the_southern_company:0 "The Southern Company"
 AUHDNC_eco_the_southern_company_desc:0 "The one great company we have not settled is the road from the capital to the sea, managed from a foreign capital and drowning in its own bonds. It is dealt with now: bought at its own price, or left to run itself under our eye and audited every year until it fails. The Adriatic road stops being a question we postpone."
 AUHDNC_eco_the_second_road_to_the_sea:0 "Wurmb's Mountain Railways"
 AUHDNC_eco_the_second_road_to_the_sea_desc:0 "The mountain tunnels and the Karst line are driven to the end on the state's own account, so the port at the head of the Adriatic can be reached without asking a private company or a foreign board for a path. The bores will be paid for in money and in men. A realm with one road to the sea has no road to the sea."
 AUHDNC_eco_the_current_of_the_mountains:0 "The Works at Simmering"
 AUHDNC_eco_the_current_of_the_mountains_desc:0 "The white coal of the alpine valleys is dammed, the main lines above the tunnels are put on the wire, and the order for the engines goes to the machine and wagon works in the Vienna suburb that has built our locomotives for forty years. Our own people proved high-tension traction on a foreign main line before it was ever used at home. We would rather owe a valley than a colliery."
 AUHDNC_eco_the_road_ends_at_the_sea:0 "The Road Ends at the Sea"
 AUHDNC_eco_the_road_ends_at_the_sea_desc:0 "Two ports, one purse. The realm will finish the quays, the cranes, the cold stores and the grain silos at the head of the Adriatic and on the Kingdom's shore, and it will finish both. Which of the two gets the cargo will be decided in the schedule of rebates and not in a speech."
 AUHDNC_eco_the_schedule_favours_the_imperial_port:0 "The Schedule Favours the Imperial Port"
 AUHDNC_eco_the_schedule_favours_the_imperial_port_desc:0 "One customs union, one deep-water port. The rebates on the state lines are written so that the grain, the timber and the sugar of both halves go down to the head of the Adriatic, and the Kingdom's shore may have what is left. A freight schedule is read in the Kingdom as a constitutional act, because that is what it is."
 AUHDNC_eco_the_schedule_favours_the_kingdoms_port:0 "The Schedule Favours the Kingdom's Port"
 AUHDNC_eco_the_schedule_favours_the_kingdoms_port_desc:0 "The Kingdom's own lines will carry to the Kingdom's own port at rates no imperial quay can meet. What the rebate costs the railway's receipts, the shore gives back in ships, in warehouses and in men who no longer leave the county for work. The receipts will not be there for the next programme."
 AUHDNC_eco_the_warehouses_and_the_steerage:0 "The Carpathia at the Molo"
 AUHDNC_eco_the_warehouses_and_the_steerage_desc:0 "Inside the fence the goods pay nothing until they leave, and the warehouses, the cold stores and the bonded sheds are built to make that worth doing. The steerage licence goes to the English line that will berth at the Molo and sail from our own quay to New York without touching Bremen or Hamburg. The recruiting officer will send us the bill."
 AUHDNC_eco_the_men_are_kept_at_home:0 "Three Hundred Thousand Souls a Year"
 AUHDNC_eco_the_men_are_kept_at_home_desc:0 "The passage is not sold. The counties that empty first are given the land, the credit and the wage that keep a man where he was born, and the agent who books him for a foreign ship answers before a magistrate. The great estates lose their safety valve, and the works that need hands must bid for them."
 AUHDNC_eco_the_river_and_the_gates:0 "The River and the Gates"
 AUHDNC_eco_the_river_and_the_gates_desc:0 "The river is treated as a main line: tow-paths, winter harbours and a dredged channel kept open by the state's own dredgers. The toll at the gorge, which every riparian state resents, will be lowered rather than defended, because we want the traffic more than the receipts."
 AUHDNC_eco_the_works_of_the_two_halves:0 "The Works of the Two Halves"
 AUHDNC_eco_the_works_of_the_two_halves_desc:0 "The great works of both halves go on the realm's books as one estate: the iron and coal of the northern basin, the special steels of the mountain valleys and the works of the Banat. What they make, they make for us first, at a price the ministry has seen the costings for. We are buying an industry and inheriting a lobby."
 AUHDNC_eco_the_ordnance_of_the_realm:0 "The Ordnance of the Realm"
 AUHDNC_eco_the_ordnance_of_the_realm_desc:0 "Every gun, rifle and shell the common army buys is ordered inside the realm, in the proportion the two governments agreed. The works are told what to build before they are told what it will cost, and no tender exists to discipline the price. The Kingdom has its share, which is why the Delegations vote the estimate at all."
 AUHDNC_eco_the_promotion_of_home_industry:0 "Kossuth's Industry Act"
 AUHDNC_eco_the_promotion_of_home_industry_desc:0 "Any works that makes here what the realm still buys abroad will have its years free of tax, its freight rebate and, if it asks, the treasury on its share register. The old list of named beneficiaries gives way to a general guarantee for anything not yet made here. The Kingdom subsidises the same works; we proceed anyway."
 AUHDNC_eco_the_new_engineering:0 "The New Engineering"
 AUHDNC_eco_the_new_engineering_desc:0 "The carriage, cycle and electrical works that have begun building motors are given the orders, the roads and the fuel duty to build them by the hundred instead of by the dozen. The first series-built motor car of the realm came out of a Bohemian cycle works, and this ministry noticed only when it was sold abroad."
 AUHDNC_eco_the_technical_schools:0 "The Schools Inside the Works"
 AUHDNC_eco_the_technical_schools_desc:0 "Where the works cannot find the men, the realm will pay for the school inside the works: apprenticeship on the state's account, a trade school beside every large shop, and a certificate the foreman is obliged to honour. The master artisans whose apprentices we now pay for will find it the first thing the state has done for them."
 AUHDNC_eco_the_shift_is_shortened:0 "The Miners' Eight Hours"
 AUHDNC_eco_the_shift_is_shortened_desc:0 "Eight hours at the coal face, and the small workshop is brought under the same law as the factory. We pay for it in coal we do not raise and in a military budget that must buy the rest at the market price. The workshop clause ruins tens of thousands of master artisans, and their party will not sit in a cabinet of ours again."
 AUHDNC_eco_the_shift_is_nine_hours:0 "The Shift Is Nine Hours"
 AUHDNC_eco_the_shift_is_nine_hours_desc:0 "The government's own bill and nothing more: nine hours at the face, written into the trade code, and the small workshop left exactly as it is. The minority report asked for eight and the employers for ten, and both will be disappointed in proportion. It is the only compromise either half has put on paper."
 AUHDNC_eco_the_coal_comes_first:0 "The Black Country of Ostrau"
 AUHDNC_eco_the_coal_comes_first_desc:0 "The seams keep their hours. Where the pit stops, the gendarmerie opens it; where the line stops, the men who run it are called to the colours and go back to work in uniform. We will have the coal, the steel and the traffic, and a generation who regard their employer as a barracks."
 AUHDNC_eco_the_estimate_that_balances:0 "Böhm-Bawerk's Estimate"
 AUHDNC_eco_the_estimate_that_balances_desc:0 "The whole of it goes on one sheet: the tunnels, the buy-outs, the ordnance, the rebates and the schools, against what the realm actually takes in. What does not balance is struck, whoever asked for it and whatever uniform he asked in. A realm that cannot say no to its own generals is being invoiced, not governed."
 AUHDNC_h_buy_the_vote_with_banners:0 "Buy the Vote with Banners"
 AUHDNC_h_buy_the_vote_with_banners_desc:0 "The army needs more men than the old military law allows, and only the Chamber on the Danube can vote them. We will not take them by an order the Kingdom does not recognise; we will buy them, and the price is its own tongue on its own regiments. The question is no longer whether we concede, but what we get for it."
 AUHDNC_h_treat_with_the_dissidents:0 "Treat with the Dissidents"
 AUHDNC_h_treat_with_the_dissidents_desc:0 "We negotiate with the Catholic People's Party and with the men about to walk out of the governing party. They want the army Magyar and the Monarchy whole, which is exactly the bargain we can afford. They will give us the recruits and will not ask for the purse; in exchange the Crown accepts them as partners in every settlement."
 AUHDNC_h_treat_with_the_independence_party:0 "Treat with the Independence Party"
 AUHDNC_h_treat_with_the_independence_party_desc:0 "We negotiate with the party that never signed the settlement. It will give the recruits only to a Kingdom that also holds its own purse, and it says so in every sitting. The Crown accepts the conversation and what it implies: whatever we obtain from these men we shall pay for twice."
 AUHDNC_h_the_colours_of_the_regiments:0 "Colours and Badges for the Regiments"
 AUHDNC_h_the_colours_of_the_regiments_desc:0 "The regiments recruited in the Kingdom take its colours, its badges and the Holy Crown on their standards. It costs the treasury nothing and it is worth a corps. The common army is told that a badge is not a language and that nothing follows from it. Nobody in the Kingdom believes that, and neither do we."
 AUHDNC_h_bring_rakoczi_home:0 "Bring the Prince Home"
 AUHDNC_h_bring_rakoczi_home_desc:0 "The proscription of the leader of the old insurrection is annulled by law, and his remains are brought back and buried in the Kingdom. The Crown carries the coffin of a man the Crown condemned. It is a humiliation, it is cheap, and there is not a county that will not remember it at the next levy."
 AUHDNC_h_the_hussars_of_the_honved:0 "The Hussars of the Honved"
 AUHDNC_h_the_hussars_of_the_honved_desc:0 "The Kingdom's own cavalry is doubled and re-horsed from the state studs of the plain. The remount bill is charged to the Kingdom's budget, which is the point of the exercise. The common cavalry inspectorate is informed and not consulted. Squadrons raised this way are the cheapest loyalty the Crown can buy in the Kingdom."
 AUHDNC_h_consult_the_house_of_magnates:0 "Consult the House of Magnates"
 AUHDNC_h_consult_the_house_of_magnates_desc:0 "Nothing goes to the lower house until the magnates have been squared. The great estates are told what the Crown intends and are given time to price it. They will vote the recruits and they will keep their labourers, which is the bargain on the table. It is a slow way to govern and the only one that does not need a coup."
 AUHDNC_h_let_the_chamber_talk:0 "Let the Chamber Talk"
 AUHDNC_h_let_the_chamber_talk_desc:0 "The government refuses to break the obstruction by a coup of the standing orders. The Chamber may talk until Budapest names its price out loud, and the state will run without a voted budget until it does. We lose a year of administration and gain the one thing a gavel never buys: a demand we can answer."
 AUHDNC_h_permit_the_cult_of_the_exile:0 "Permit the Cult of the Exile"
 AUHDNC_h_permit_the_cult_of_the_exile_desc:0 "The government stops prosecuting the songs, the statues and the processions of the national opposition. A prosecution costs a gendarme and buys an enemy; a licence costs nothing and buys a queue at the recruiting office. The other peoples of the Monarchy will read the licence as theirs, and we shall answer them one at a time."
 AUHDNC_h_refactions_for_the_kingdoms_port:0 "Refactions for the Kingdom's Port"
 AUHDNC_h_refactions_for_the_kingdoms_port_desc:0 "The state railways' preferential tariffs route the Kingdom's traffic to the Kingdom's own harbour instead of the imperial one. Rates are cut on every line that ends at our quays and raised on every line that does not. The hinterland of the other port loses the traffic and knows precisely who took it."
 AUHDNC_h_the_ships_sail_from_our_own_port:0 "The Ships Sail from Our Own Port"
 AUHDNC_h_the_ships_sail_from_our_own_port_desc:0 "Emigration is not forbidden, it is licensed. A man may go, but through the Kingdom's harbour, on a ticket sold by the Kingdom's agent, on a line the Kingdom subsidises. The fares, the freight and the remittances stay with us instead of enriching the northern ports of Germany. What we cannot stop we shall at least tax."
 AUHDNC_h_the_development_acts:0 "The Development Acts"
 AUHDNC_h_the_development_acts_desc:0 "Subsidies, tax holidays and state orders are voted for every factory founded inside the Kingdom. The acts name the Kingdom and nothing else, which is the whole of their intention. Bohemian industry will call it theft; we answer that a market which builds only one half of a Monarchy is not common either."
 AUHDNC_h_the_bills_carry_a_price:0 "The Bills Carry a Price"
 AUHDNC_h_the_bills_carry_a_price_desc:0 "The two military bills go before the Chamber with the language of service written into their text. We do not ask the Kingdom to vote recruits and trust us afterwards; the counterpart sits in the same paragraph as the demand. The common war minister will not put his name to a bill that concedes the tongue, and he will go."
 AUHDNC_h_the_programme_of_the_nine:0 "The Programme of the Nine"
 AUHDNC_h_the_programme_of_the_nine_desc:0 "The Crown concedes in writing that Crown and parliament together may alter the language question of the army. It is the principle and not yet the thing; no word of command changes today. But it was asked for in nine written points and granted in one, and a right conceded once is never conceded once."
 AUHDNC_h_a_chamber_that_can_sit:0 "A Chamber That Can Sit"
 AUHDNC_h_a_chamber_that_can_sit_desc:0 "The standing orders are revised by agreement with the opposition instead of by the president's handkerchief. Every party signs the order of business, which means every party is bound by it. Vienna reads that as proof the Kingdom can be governed without a coup, and stops asking for one. The radicals of the Danube call it a sale."
 AUHDNC_h_the_language_of_the_regiment:0 "The Language of the Regiment"
 AUHDNC_h_the_language_of_the_regiment_desc:0 "The regiments recruited in the Kingdom are instructed and administered in Magyar. Orders on parade stay as they are, for now; the paperwork, the courts, the schools and the daily service change today. Two languages of administration inside one establishment will cost us in every headquarters."
 AUHDNC_h_the_contingent_raised:0 "The Contingent Raised"
 AUHDNC_h_the_contingent_raised_desc:0 "The annual contingent, frozen by the old military law while the Monarchy grew by four millions, is raised at last, because the price has been paid. The recruiting districts receive their new quotas and the depots are enlarged to hold them. This is what the whole method was for; everything after it is the bill."
 AUHDNC_h_both_houses_vote_the_same_law:0 "Both Houses Vote the Same Law"
 AUHDNC_h_both_houses_vote_the_same_law_desc:0 "The identical military law passes in both parliaments, each in its own language, and is sanctioned in the same week. Two chambers that agree on an army are worth more to the Monarchy than one chamber that obeys. Every common law after it will need the same double purchase, and we shall pay it every time."
 AUHDNC_h_the_king_names_the_coalition:0 "The King Names the Coalition"
 AUHDNC_h_the_king_names_the_coalition_desc:0 "The victors of the ballot are called to office with their military programme in their hands, instead of a cabinet of generals and officials. The Crown accepts that a country which votes for a programme must be governed by it. The royal commissioners and the staff's plan for occupying the Kingdom are shut away for good."
 AUHDNC_h_the_counties_pay_again:0 "The Counties Pay Again"
 AUHDNC_h_the_counties_pay_again_desc:0 "With the programme accepted, the county assemblies are asked for the tax they refused to levy and the recruits they refused to send. They pay, because the government in the capital is now their own. Thirty-six counties of sixty-three were in open resistance, and the resistance ends without a gendarme moving."
 AUHDNC_h_tell_the_heir:0 "Tell the Heir"
 AUHDNC_h_tell_the_heir_desc:0 "The settlement is communicated to the heir presumptive, and his military chancellery is instructed to hold its tongue. It will hold nothing of the sort. The Kingdom rallies to the King against a successor who has promised to undo it all, and while that quarrel runs no chief of staff who wants a war can be appointed."
 AUHDNC_h_the_regiments_under_one_ministry:0 "Saint Stephen's Regiments Under One Ministry"
 AUHDNC_h_the_regiments_under_one_ministry_desc:0 "Every regiment recruited inside the Kingdom passes under the Kingdom's own defence ministry, which has never yet had an army worth the name. The common army keeps the oath, the flag and the King; it loses the establishment. The Monarchy now has two war offices, and only one answers to the Delegations."
 AUHDNC_h_the_word_of_command_in_magyar:0 "The Word of Command in Magyar"
 AUHDNC_h_the_word_of_command_in_magyar_desc:0 "The seventy to eighty words of command are given in Magyar to the regiments of the Kingdom. This is the thing itself, the fork the Crown refused at the manoeuvres because the Czechs and the Croats will ask the same tomorrow. From this day the army is in fact two armies."
 AUHDNC_h_a_staff_college_for_the_honved:0 "A Staff College for the Honved"
 AUHDNC_h_a_staff_college_for_the_honved_desc:0 "The Kingdom stops sending its staff candidates to the imperial war school and opens its own. Its military academy already stands at full rank; what has never existed is a staff college, and that is what we found. Its first class will study the same operations in a different grammar."
 AUHDNC_h_guns_for_the_honved:0 "Guns for the Honved"
 AUHDNC_h_guns_for_the_honved_desc:0 "The Kingdom's army receives the field artillery it has been refused since it was founded: batteries, parks, ammunition columns and an inspector of its own. The common inspectorate has argued for a generation that a second line needs no guns, and has just lost the argument in both chambers."
 AUHDNC_h_the_gun_works_of_the_capital:0 "Frommer's Works at Soroksár"
 AUHDNC_h_the_gun_works_of_the_capital_desc:0 "The rifle, pistol and shell orders of the second army go to the works of the capital and of the island below it, not to the Bohemian and Styrian houses. Those works get the plant, the contracts and the proof range to arm an army the Kingdom raised. Two great arsenals lose the orders and will say so in the Delegations."
 AUHDNC_h_the_iron_of_the_state_works:0 "The Iron of the State Works"
 AUHDNC_h_the_iron_of_the_state_works_desc:0 "The state ironworks of the uplands are enlarged to plate and forge for the second army: furnaces, rolling mills and a shell shop, paid for out of the Kingdom's development fund. The Bohemian houses lose another slice of the ordnance trade and count it publicly. Iron the Kingdom smelts is iron the Kingdom can be asked to pay for."
 AUHDNC_h_the_honved_as_an_army:0 "The Honved as an Army"
 AUHDNC_h_the_honved_as_an_army_desc:0 "The Kingdom's force stops being a second line and becomes a field army with its own corps commands, engineers, trains and depots. Twelve thousand five hundred men a year go into an establishment that can now hold them. The common army is informed of the new order of battle and is not asked to approve it."
 AUHDNC_h_a_commander_for_the_honved:0 "A Commander for the Honved"
 AUHDNC_h_a_commander_for_the_honved_desc:0 "The King names the commander-in-chief of the Kingdom's army and fixes in writing what he may do without Vienna. The office existed on paper; it now has an establishment under it and a rank to match. A prince of the House holds it, which reconciles the dynasty to an army it did not ask for."
 AUHDNC_h_the_oath_of_the_officers:0 "The Oath of the Officers"
 AUHDNC_h_the_oath_of_the_officers_desc:0 "The officers of the Kingdom's army swear to the King and to the constitution of the Kingdom, and the order of the two is written down. Nobody has written it down before, because everybody knew what would happen when the two pulled apart. On the day they conflict, the regiments will read the order for themselves."
 AUHDNC_h_the_academy_takes_the_counties:0 "The Academy Takes the Counties"
 AUHDNC_h_the_academy_takes_the_counties_desc:0 "The Kingdom's military academy is opened to the sons of the small gentry on state bursaries. What is new is not the rank of the school but who sits in its lecture rooms. An officer corps recruited from the counties is one the counties will not fire on, and one the great estates did not choose."
 AUHDNC_h_the_garrisons_of_the_southern_counties:0 "The Garrisons of the Southern Counties"
 AUHDNC_h_the_garrisons_of_the_southern_counties_desc:0 "The Kingdom's own army takes over the garrisons of the southern frontier from the common army: works, magazines and a field marshal's command on the river line. Belgrade and Bucharest will read the order of the day correctly, because it is written to be read."
 AUHDNC_h_a_design_office_of_our_own:0 "A Design Office of Our Own"
 AUHDNC_h_a_design_office_of_our_own_desc:0 "The Kingdom's small-arms designer is given the whole rifle and pistol programme and a works to run it. He has patented inside our borders and sold the licence abroad; from now on the licence is ours first. We stop asking Steyr what our infantry may carry, and the first bad rifle is entirely our fault."
 AUHDNC_h_the_monitors_of_the_river:0 "The Monitors of the River"
 AUHDNC_h_the_monitors_of_the_river_desc:0 "The river flotilla is enlarged at the capital's yards and manned from the Kingdom: armoured monitors, patrol boats and a transport command for the great river. There is no sea here and no dockyard; the yard on the island builds hulls and floats them down. The Delegations will find the naval credit harder to vote."
 AUHDNC_h_trains_and_field_kitchens:0 "Trains and Field Kitchens"
 AUHDNC_h_trains_and_field_kitchens_desc:0 "The second army gets its own supply trains, field bakeries and rolling kitchens instead of borrowing the common army's. An establishment that eats out of another establishment's wagons is not separate, whatever the statute says. We are paying for the unglamorous half of a national army, and it is the half that decides campaigns."
 AUHDNC_h_batteries_for_the_mountain_frontier:0 "Batteries for the Mountain Frontier"
 AUHDNC_h_batteries_for_the_mountain_frontier_desc:0 "Mountain batteries and pack columns for the eastern arc of the Kingdom: short guns, mules, and a school to teach the men to take them where wheels do not go. The kingdom beyond the passes will read the order correctly and say nothing in public. A frontier without guns is an invitation, and we mean both halves of that sentence."
 AUHDNC_h_the_remounts_of_the_plain:0 "The Remounts of the Plain"
 AUHDNC_h_the_remounts_of_the_plain_desc:0 "The state studs of the plain pass under the Kingdom's defence ministry and supply both armies. Whoever owns the horses sets the price of a campaign, and until today the common army set it. The Kingdom now sells its remounts to the common establishment at a rate the Kingdom fixes."
 AUHDNC_h_keep_the_ploughman_at_home:0 "Keep the Ploughman at Home"
 AUHDNC_h_keep_the_ploughman_at_home_desc:0 "The farm-servant law is loosened and land credit is opened, so the counties stop emptying into the ships. Every man who sails is a recruit we have paid to raise and will never see at a depot. The magnates lose the cheap labour bargain they were promised, and the preamble says so."
 AUHDNC_h_a_survey_of_our_own:0 "A Survey of Our Own"
 AUHDNC_h_a_survey_of_our_own_desc:0 "The Kingdom maps its own territory for its own staff instead of buying the common institute's sheets: triangulation, levelling, and a printing office in the capital. Two surveys of the same ground is a deliberate absurdity, because sheets are how a staff thinks. Divisions raised outside the Kingdom will feel it."
 AUHDNC_h_one_kingdom_one_language_of_service:0 "One Kingdom, One Language of Service"
 AUHDNC_h_one_kingdom_one_language_of_service_desc:0 "Whatever the county, the Kingdom's regiments are served in Magyar. There is one political nation inside the Holy Crown and it has one tongue of service; the rest is dialect and sentiment. The Romanian, Slovak and Serb counties will be recruited in a language most of their men do not speak at home."
 AUHDNC_h_each_regiment_in_its_countys_tongue:0 "Each Regiment in Its County's Tongue"
 AUHDNC_h_each_regiment_in_its_countys_tongue_desc:0 "The regiments of the Kingdom are commanded in Magyar and served in the language of the men who fill them. It is the common army's own rule, which the Kingdom has always refused to apply inside its own borders. We apply it, and the Romanian, Slovak and Serb counties learn that the settlement can be spent on them too."
 AUHDNC_h_the_barracks_teaches_the_tongue:0 "The Barracks Teaches the Tongue"
 AUHDNC_h_the_barracks_teaches_the_tongue_desc:0 "The recruit school, the cadet school and the reserve-officer examination of the Kingdom are conducted in the state language. A man who cannot pass them does not wear a star, whatever his county and whatever his church. This is the civil school law carried into the barracks, and the barracks is where it bites hardest."
 AUHDNC_h_the_same_money_no_condition:0 "The Same Money, No Condition"
 AUHDNC_h_the_same_money_no_condition_desc:0 "The recruit school and the reserve-officer examination may be taken in the county's language. The confessional schools that feed the regiments keep their subsidy, and are asked only that the state language be taught as a subject. The money is the same money; only the condition is dropped."
 AUHDNC_h_the_names_on_the_map:0 "The Names on the Map"
 AUHDNC_h_the_names_on_the_map_desc:0 "The place-names of the Kingdom are fixed in one register: signposts, station boards, recruiting rolls and the staff's own sheets. One gazetteer serving two establishments is a real military argument. It is also a way of telling several million people that the name their grandfathers used is not administratively real."
 AUHDNC_h_the_inspectors_of_the_counties:0 "The Inspectors of the Counties"
 AUHDNC_h_the_inspectors_of_the_counties_desc:0 "A state inspectorate rides the recruiting counties and reports on every levy, every roll and every school that supplies the regiments. It answers to the Kingdom's ministry and to nobody in the county seat. Outside the Kingdom the same body is read as an instrument, which it is."
 AUHDNC_h_honour_the_nationalities_act:0 "Honour the Nationalities Act"
 AUHDNC_h_honour_the_nationalities_act_desc:0 "The Kingdom applies its own law on the equality of nationalities in the commune, the county and the court of first instance. The law is ours, voted in our own Chamber, and it has been a dead letter ever since. Nobody in Vienna is imposing anything: Budapest is keeping a promise Budapest made."
 AUHDNC_h_seats_for_the_northern_counties:0 "Seats for the Northern Counties"
 AUHDNC_h_seats_for_the_northern_counties_desc:0 "Seats are reserved in the county assemblies of the north for the language of their majority. The model works in the margraviate beyond the mountains, where two registers of voters elect two curiae and neither can be outvoted into silence. The Kingdom called this impossible at home; it said the same about the army."
 AUHDNC_h_the_gendarmerie_of_the_counties:0 "The Gendarmerie of the Counties"
 AUHDNC_h_the_gendarmerie_of_the_counties_desc:0 "The royal gendarmerie is enlarged and put under the Kingdom's own ministry, with the tax roll in its hands. It will collect what the county assemblies refused to vote, and it will be seen collecting it. The counties will remember the uniform that came for the money."
 AUHDNC_h_croatia_keeps_its_own_command:0 "Croatia Keeps Its Own Command"
 AUHDNC_h_croatia_keeps_its_own_command_desc:0 "The Croatian home guard keeps Croatian as its language of command and of service, as the Kingdom's own settlement with Zagreb provides. The Kingdom says so, not the Crown; that distinction is the whole value of the act. Zagreb will bank the concession and ask for the next one."
 AUHDNC_h_the_military_railway_service:0 "The Military Railway Speaks One Tongue"
 AUHDNC_h_the_military_railway_service_desc:0 "Every servant of the lines the general staff may requisition must be a citizen of the Kingdom and serve in its language: the stations, the telegraph and the guards alike. A transport service that cannot read its own orders is not one. In the Croat and Serb counties this reaches into every station house."
 AUHDNC_h_exempt_the_croatian_service:0 "Exempt the Croatian Service"
 AUHDNC_h_exempt_the_croatian_service_desc:0 "The settlement's language rule is respected on the lines of the Triune Kingdom as it is in its schools, military transport included. The coalition of the coast asked exactly this and we refused once; refusing twice costs us our only ally on that shore. A railway that runs is worth more than a railway that is correct."
 AUHDNC_h_confirm_the_church_school_autonomy:0 "Confirm the Church-School Autonomy"
 AUHDNC_h_confirm_the_church_school_autonomy_desc:0 "The Orthodox metropolitanate keeps its schools, its funds and its congress under royal confirmation, over the Kingdom's objection. The Crown confirms an autonomy our own ministry has spent years trying to erode. It costs us in Budapest and buys us a church that preaches obedience in the southern counties."
 AUHDNC_h_receive_the_romanians:0 "Receive the Romanians"
 AUHDNC_h_receive_the_romanians_desc:0 "The Kingdom's government receives the Romanian National Party and puts a settlement of schools, seats and language on the table. Their memorandum was refused once and the men who carried it went to prison for it. We receive them now because a Romanian regiment is worth more than a Romanian grievance."
 AUHDNC_h_the_regiments_of_the_occupied_land:0 "The Regiments of the Occupied Land"
 AUHDNC_h_the_regiments_of_the_occupied_land_desc:0 "The regiments of the occupied provinces keep their own establishment and their own recruiting law while the two states argue over the ground. The Kingdom pays half the bill and therefore says what it will and will not pay for. These are four good regiments and the only ones in the Monarchy nobody quarrels about."
 AUHDNC_h_keels_for_the_kingdoms_yards:0 "Keels for the Kingdom's Yards"
 AUHDNC_h_keels_for_the_kingdoms_yards_desc:0 "The Kingdom's vote on the naval credits is bought with a guaranteed share of the hulls: no share, no credit, and the Delegations may test that sentence whenever they wish. The yard at our own harbour receives the slips, the cranes and the orders to make the share real. The fleet will pay for the settlement in months of delay."
 AUHDNC_h_two_armies_before_the_delegations:0 "Two Armies Before the Delegations"
 AUHDNC_h_two_armies_before_the_delegations_desc:0 "The common budget is laid before the two Delegations carrying two general staffs. Nobody pretends any longer that the second establishment is a militia with a flag. Vienna will pay for a staff it does not command and will be invited to say so in public. The estimate is larger, the argument is shorter, and the fiction is dead."
 AUHDNC_h_the_quota_for_the_recruits:0 "The Quota for the Recruits"
 AUHDNC_h_the_quota_for_the_recruits_desc:0 "The Kingdom pays a larger share of the common charges in exchange for the recruits and the tongue it has been given. We name the trade out loud, which nobody has done before: so many points of the quota, so many words of command. Vienna gets money it needs; Budapest gets a bill its own press will print on the front page."
 AUHDNC_h_a_war_minister_budapest_can_bring_down:0 "A War Minister Budapest Can Bring Down"
 AUHDNC_h_a_war_minister_budapest_can_bring_down_desc:0 "The common war ministry answers to both Delegations on the Hungarian establishment, and either may unseat its holder. It has happened once by accident; we are making it a right. A minister on two leashes will sign nothing he can avoid signing, and that is the price of a war office the Kingdom will actually fund."
 AUHDNC_h_budapest_at_the_ballhausplatz:0 "Budapest at the Ballhausplatz"
 AUHDNC_h_budapest_at_the_ballhausplatz_desc:0 "The Kingdom's minister-president must be heard before the common foreign minister acts, and his dissent is minuted. Both premiers already sit on the common council; we turn attendance into a right and silence into a record. No despatch leaves the house without a second signature or a written objection."
 AUHDNC_h_the_union_renewed_by_treaty:0 "The Union Renewed by Treaty"
 AUHDNC_h_the_union_renewed_by_treaty_desc:0 "The customs and commercial union is renewed as a treaty between two territories with a fixed contribution, instead of a decennial quarrel. The clock that has poisoned every settlement of this reign is taken off the wall. Neither half can hold the market hostage at a renewal, and we lose that leverage too."
 AUHDNC_h_the_governor_from_budapest:0 "The Governor Comes from Budapest"
 AUHDNC_h_the_governor_from_budapest_desc:0 "The common bank keeps its privilege untouched, and the Kingdom takes the governor's chair, a fixed share of the directorate and a discount window in its own capital. One bank, one currency, two capitals in the boardroom. The agrarians who wanted a bank of their own will pay for somebody else's cheap credit and will not thank us."
 AUHDNC_h_keep_the_promise_on_the_franchise:0 "Keep the Promise on the Franchise"
 AUHDNC_h_keep_the_promise_on_the_franchise_desc:0 "The electoral reform promised when the coalition took office is actually laid. It is tempered by property and by schooling, and it is real: hundreds of thousands of new electors in counties that have never returned a member of their own. The gentry parties that carried the coalition will split over it within the month."
 AUHDNC_h_the_plural_ballot:0 "The Plural Ballot"
 AUHDNC_h_the_plural_ballot_desc:0 "The promise is honoured in form. Every man of full age votes, and the weight of his vote follows his property and his schooling. It is a reform in the sense that a bill exists and a reform in no other sense. The squares of the capital will have an opinion, and the gendarmerie has been warned."
 AUHDNC_h_a_party_that_can_govern:0 "A Party That Can Govern"
 AUHDNC_h_a_party_that_can_govern_desc:0 "The government's friends of every stripe are rebuilt into one governing party with one whip, one list and one programme. A coalition that agrees only about the army cannot carry a decade of settlements. We are manufacturing a majority that can, in the open, and it will represent a narrower country than it admits to."
 AUHDNC_h_a_staff_of_our_own:0 "A Staff of Our Own"
 AUHDNC_h_a_staff_of_our_own_desc:0 "The Kingdom's army receives its own general staff section, which coordinates with the common staff by written convention. Convention, not order: the two staffs meet, exchange and agree, and neither commands the other. Everything once settled by an order is now settled by a conference."
 AUHDNC_h_the_manoeuvres_of_the_two_armies:0 "The Manoeuvres of the Two Armies"
 AUHDNC_h_the_manoeuvres_of_the_two_armies_desc:0 "The autumn manoeuvres are held jointly, and the seams between the two establishments are counted in the open, with foreign attaches present as always. We could hold two separate manoeuvres and learn nothing; we hold one and learn exactly what the settlement has cost us in the field. Whatever the umpires write down will be true."
 AUHDNC_h_the_kingdoms_share_of_the_orders:0 "The Kingdom's Share of the Orders"
 AUHDNC_h_the_kingdoms_share_of_the_orders_desc:0 "The common army's contracts are placed in the proportion of the Kingdom's contribution, and the placement is published. Publication is the whole reform: an unpublished share is a favour, a published share is a right. The traction works of the capital take their part of the rolling stock and the Bohemian houses lose it."
 AUHDNC_h_the_kings_word_to_the_army:0 "The King's Word to the Army"
 AUHDNC_h_the_kings_word_to_the_army_desc:0 "The King binds himself, and asks his successor to bind himself, to the settlement of the two armies, and the rescript is read at the head of every regiment. An officer corps told the settlement was a temporary humiliation hears the opposite from the only man it obeys without argument."
 AUHDNC_h_two_armies_one_king:0 "Two Armies, One King"
 AUHDNC_h_two_armies_one_king_desc:0 "The Monarchy is declared to rest on one dynasty, one market, one foreign policy and two armies, published in both capitals on the same morning. The second establishment is named, funded and recognised, and the common army is told what it has kept. What holds this together is the King."
 AUHDNC_h_let_the_treaty_lapse:0 "Let the Treaty Lapse"
 AUHDNC_h_let_the_treaty_lapse_desc:0 "The government lets the commercial arrangement run to its term and does not renew it. We are not denouncing anything and not signing anything; we are letting a clock finish. The quota quarrel dies with the treaty, and so does the market that fed both halves of the Monarchy."
 AUHDNC_h_a_tariff_schedule_of_our_own:0 "A Tariff Schedule of Our Own"
 AUHDNC_h_a_tariff_schedule_of_our_own_desc:0 "The Kingdom writes and enacts its own customs tariff. Grain, cattle, timber and machinery are rated by a Chamber that answers to the men who grow and sell them. The revenue comes to us and so does every quarrel it starts, beginning with the frontier to the south."
 AUHDNC_h_a_bank_of_our_own:0 "A Bank of Our Own"
 AUHDNC_h_a_bank_of_our_own_desc:0 "When the common privilege falls due the Kingdom takes its own bank of issue. Two banks, two discount rates, one currency for as long as that lasts. Credit will be dearer in both halves, and every builder, every railway and every works will feel it. This is the demand that has brought governments down, and we are conceding it."
 AUHDNC_h_the_independence_party_in_office:0 "The Independence Party in Office"
 AUHDNC_h_the_independence_party_in_office_desc:0 "The men who never signed the settlement take the ministries and are told to govern with it anyway. They will govern, and they will say every morning what they think of the arrangement they administer. The party of the settlement cannot sit in a cabinet built on a separate bank, and it will walk out."
 AUHDNC_h_vote_the_establishment_at_home:0 "Vote the Establishment at Home"
 AUHDNC_h_vote_the_establishment_at_home_desc:0 "The Kingdom's army establishment is voted in its own Chamber and merely reported to the Delegations. Recruits, budget, order of battle: all of it decided where the men are raised. The common fleet loses the Hungarian credit in the same sitting, and nobody in the Chamber regrets it."
 AUHDNC_h_the_kingdoms_flag_at_sea:0 "The Kingdom's Flag at Sea"
 AUHDNC_h_the_kingdoms_flag_at_sea_desc:0 "The Kingdom's merchant lines and its yard are subsidised as a national establishment, not as a share of a common one. Our own flag on our own hulls out of our own harbour, with a subsidy voted in our own Chamber. The other harbour of the Monarchy is invited to compete."
 AUHDNC_h_electrify_the_lines_of_the_plain:0 "Current for the Kingdom's Own Lines"
 AUHDNC_h_electrify_the_lines_of_the_plain_desc:0 "The Kingdom's works stop selling their traction abroad and wire the Kingdom's own traffic first: the suburban lines of the capital, the yards, the mills and the mines. On the plain there is no falling water, so the current is made from coal we must buy. We would rather pay for our own current than sell the patent abroad again."
 AUHDNC_h_an_army_paid_for_at_home:0 "An Army Paid For at Home"
 AUHDNC_h_an_army_paid_for_at_home_desc:0 "The Kingdom's army is carried on the Kingdom's own budget, and the common charge is reduced to what the treaties strictly require. Whatever the Kingdom does not vote, nobody votes. It puts the whole weight of a modern establishment on one Chamber's willingness to pay, and that Chamber has never yet refused this particular bill."
 AUHDNC_h_nothing_common_but_the_king:0 "Nothing Common but the King"
 AUHDNC_h_nothing_common_but_the_king_desc:0 "The two ministries deal as two governments. Only the person of the King and the treaties remain common, and every despatch that leaves either house says which of us is speaking. Every chancellery in Europe will now ask that question before it answers ours."
 AUHDNC_h_the_personal_union:0 "The Personal Union"
 AUHDNC_h_the_personal_union_desc:0 "The two kingdoms are declared separate states, tied by the person of the King and by a commercial treaty either may denounce. One Crown, two governments, two armies, two purses, two customs frontiers, and every pair was bought with the recruits we needed. Nothing above the two ministries arbitrates any longer."
 AUHDNC_m_the_sword_settles_it:0 "The Sword Settles It"
 AUHDNC_m_the_sword_settles_it_desc:0 "Where law cannot be had, the Crown will have obedience. The common army is the instrument of the state, and it will not ask two parliaments for permission to exist. The summary law stands wherever we proclaim it, and what the Crown is owed we take by other means. Every year the exception lasts it costs us more."
 AUHDNC_m_the_army_is_the_state:0 "The Army Is the State"
 AUHDNC_m_the_army_is_the_state_desc:0 "The common army is declared a first organ of the state, answerable to the Crown alone. Its establishment leaves the ordinary budget quarrel, and no chamber may bargain over what it is. The arsenal receives the orders it has been refused. This is paid out of what the provinces would otherwise have had."
 AUHDNC_m_the_supreme_war_lord:0 "The Supreme War Lord"
 AUHDNC_m_the_supreme_war_lord_desc:0 "We restate before both chambers that the unity of the army belongs to the sovereign, and that no chamber may bargain over it. This is not a courtesy of the settlement but a right older than it. Budapest will call it a breach; we call it a reading, and the Crown opens a ledger of what it carries without a vote."
 AUHDNC_m_the_corps_of_eleven_tongues:0 "The Officer Corps of Many Tongues"
 AUHDNC_m_the_corps_of_eleven_tongues_desc:0 "We recruit the officer corps from every land of the Monarchy and require of it one language of command and no national loyalty. A cadet who brings a nation into the mess is sent home. In exchange the corps is opened to men with no family claim on a commission. A Czech will serve under a Croat."
 AUHDNC_m_the_three_year_language_rule:0 "The Three-Year Language Rule"
 AUHDNC_m_the_three_year_language_rule_desc:0 "An officer has three years to learn the regimental language of his men, and the words of command stay German. A regiment whose captain cannot be understood is not a regiment. The rule is enforced by examination, and an officer who fails it twice goes to the depot. This is what we offer the nations instead of national armies."
 AUHDNC_m_the_kriegsschule_of_the_staff:0 "The Kriegsschule of the Staff"
 AUHDNC_m_the_kriegsschule_of_the_staff_desc:0 "The staff school is enlarged, its course lengthened, and its graduates take the district commands that used to go by seniority. Entry is by examination, and the examination is not shown to the ministry beforehand. Officers who have never held a staff appointment will not command a corps. The old guard will resent this."
 AUHDNC_m_the_technical_military_committee:0 "The Technical Military Committee"
 AUHDNC_m_the_technical_military_committee_desc:0 "The technical committee of the war ministry is given a standing budget, its own trial ground and the right to order what it approves without a further vote. It will test before it argues and it will publish nothing. What it rejects is not bought because a chamber liked it. It answers to the ministry of war alone."
 AUHDNC_m_the_general_staff_of_beck:0 "The General Staff of Beck-Rzikowsky"
 AUHDNC_m_the_general_staff_of_beck_desc:0 "The chief of the general staff is ordered to write the contingency files the Monarchy has never dared put on paper, and to report on them to the Crown alone. Three cases are kept ready at all times and no minister is shown them. The staff stops being a bureau of timetables and becomes the office where the next war is decided."
 AUHDNC_m_the_heirs_military_chancellery:0 "The Heir's Military Chancellery"
 AUHDNC_m_the_heirs_military_chancellery_desc:0 "The heir's military chancellery is recognised as a channel of the Crown, and its card index of useful men becomes the promotion list. Officers who wish to be noticed will be noticed there. We know what we are building: a second court, with a programme of its own. It is the price of a staff that answers to a Habsburg."
 AUHDNC_m_conrad_by_the_heirs_hand:0 "Conrad by the Heir's Hand"
 AUHDNC_m_conrad_by_the_heirs_hand_desc:0 "We put the divisional commander the heir asks for at the head of the general staff. He is the best instructor of his generation and he will ask for a war every year of his tenure. The Crown takes the instrument and accepts the demand attached to it. There is no other way to have a staff that plans instead of filing."
 AUHDNC_m_beck_kept_at_the_staff:0 "Beck-Rzikowsky Kept at the Staff"
 AUHDNC_m_beck_kept_at_the_staff_desc:0 "We keep the old chief. He writes the plan for the kingdom, which we may need, and refuses the plans against the neighbours, which we do not. The staff will be slower, the court quieter, and the file that matters most on this road will be written by the man who invented it. The offensive school waits for another reign."
 AUHDNC_m_the_plans_in_the_staffs_safe:0 "The Deployment Plans"
 AUHDNC_m_the_plans_in_the_staffs_safe_desc:0 "Three files are kept ready in the staff safe at all times: the northern front, the southern front, and the kingdom. Each is revised every year against the real state of the railways and the real strength of the classes called. The third is shown to no minister of either half. We know what it means to keep it."
 AUHDNC_m_the_estimates_of_the_common_army:0 "The Army Estimates"
 AUHDNC_m_the_estimates_of_the_common_army_desc:0 "We put the whole military estimate before the Crown first and the Delegations second. They will still vote it, for that is the organ of the common budget. What changes is the order: they will be told what the army costs, not asked what it may be. The arsenal is enlarged on the strength of the estimate before the vote."
 AUHDNC_m_the_estimates_by_ordinance:0 "The Estimates by Ordinance"
 AUHDNC_m_the_estimates_by_ordinance_desc:0 "The Austrian half's share is taken by emergency ordinance. A ministry of officials will sign it and the chamber will be informed of what it has voted. The recruits come in a year early and the obstruction that has paralysed the Reichsrat is walked around. Every ordinance makes the next easier to sign and dearer to justify."
 AUHDNC_m_buy_the_delegations_with_orders:0 "Buy the Delegations with Orders"
 AUHDNC_m_buy_the_delegations_with_orders_desc:0 "Every gun and every hull is placed where a delegation votes, and the estimate passes because it is paid for in factories. The Hungarian share of the common orders rises and Budapest is told exactly why. We keep the appearance of consent and hand the kingdom a lever it will use against us. It is the slow road, and it is legal."
 AUHDNC_m_the_gold_crown_answers:0 "The Gold Crown Answers"
 AUHDNC_m_the_gold_crown_answers_desc:0 "We ask the foreign houses what an army budget carried without a chamber costs in interest, and take the answer as a cost of war. They will price the illegality rather than refuse it. The finance ministry pays the spread and says nothing of it in the Delegations. Every further ordinance returns to us in the coupon."
 AUHDNC_m_the_siege_train_at_pilsen:0 "The Siege Train at Pilsen"
 AUHDNC_m_the_siege_train_at_pilsen_desc:0 "We order from the Bohemian works a train of siege pieces heavy enough to open a fortified river line, and we pay for it before the field guns. The heaviest tubes will not arrive in this establishment's lifetime; the carriages, crews and mountings will. The money goes to Bohemia and the German clubs will say so out loud."
 AUHDNC_m_the_quick_firing_field_gun:0 "The Quick-Firing Field Gun"
 AUHDNC_m_the_quick_firing_field_gun_desc:0 "The field batteries receive the quick-firing piece now, on the strength of the estimate and before the vote. The older tubes go to the territorial force, which has none. Batteries will be short of trained layers for two seasons. A battery that fires four rounds while its neighbour fires one is worth the confusion."
 AUHDNC_m_the_mannlicher_and_the_schwarzlose:0 "The Mannlicher and the Schwarzlose"
 AUHDNC_m_the_mannlicher_and_the_schwarzlose_desc:0 "One rifle and one machine gun for the whole army, made at one works, and no regiment keeps its own pattern. Cartridge, spare and drill become the same from the Bukovina to the Tyrol. The conversion costs us a year of output and the regiments will complain. A common army that cannot share a cartridge is a coalition with a flag."
 AUHDNC_m_the_mountain_batteries:0 "The Mountain Batteries"
 AUHDNC_m_the_mountain_batteries_desc:0 "We fit out batteries that can be carried where a road stops, because both of our likely fronts are mountains. Pack artillery, mule columns and a school for the men who lead them. The line divisions will move a little slower for the sake of the ones that must climb. Whoever holds the passes decides where the next war is fought."
 AUHDNC_m_the_military_railways:0 "The Military Railways"
 AUHDNC_m_the_military_railways_desc:0 "The general staff, not the ministry of commerce, decides which lines are doubled and where the loading ramps are built. Strategic double track north and south comes first; the canal and the regional branches wait for money that will not come in this establishment. An army that cannot detrain on its own frontier is a parade."
 AUHDNC_m_the_motor_column_and_the_traction_train:0 "The Motor Column and the Traction Train"
 AUHDNC_m_the_motor_column_and_the_traction_train_desc:0 "We order traction for the heavy batteries: draught teams and limbers from the Bohemian works, and a trial column of engines from the makers who can build them. Nothing here is promised as a fighting vehicle; what is bought is the ability to move a siege battery off a road. The committee will report when it has driven them."
 AUHDNC_m_the_law_of_the_summary_courts:0 "The Law of the Summary Courts"
 AUHDNC_m_the_law_of_the_summary_courts_desc:0 "The summary law ceases to be an emergency and becomes an ordinary instrument of government. Where a town is proclaimed, the jury steps aside and the garrison commands. We are not inventing the power; we are removing the shame of using it. From today the exception is a habit, and its ledger is one notch heavier."
 AUHDNC_m_the_railwaymen_in_uniform:0 "The Railwaymen in Uniform"
 AUHDNC_m_the_railwaymen_in_uniform_desc:0 "Reservists of the state railways are called to the colours where they stand. A strike on the lines becomes a refusal of service and is tried as one. The traffic will move within the week and the men will move it in uniform. We teach an organised trade that the Crown can conscript it; it will organise further to answer us."
 AUHDNC_m_the_police_under_the_army:0 "The Political Police"
 AUHDNC_m_the_police_under_the_army_desc:0 "The political sections of the police pass to the war ministry's evidence bureau for everything touching the frontier lands. Press, associations and the post in the coastal districts are read by officers, not prefects. The coast will know it is administered as a suspect province, and will behave like one."
 AUHDNC_m_the_evidenzbureau:0 "The Evidenzbureau"
 AUHDNC_m_the_evidenzbureau_desc:0 "The evidence bureau is enlarged from a map room into a service with agents, its own money and a network run through the legations. It answers to the chief of staff and its accounts go before no chamber. We are creating an instrument that can buy information and, if careless, documents that are not."
 AUHDNC_m_the_counter_espionage_group:0 "The Counter-Espionage Group"
 AUHDNC_m_the_counter_espionage_group_desc:0 "A counter-espionage group is formed against Belgrade's friends inside the Monarchy, and it is allowed to buy its witnesses. It will have results and have them quickly. We know how such groups end: with a defence counsel holding up a document made in one of our own legations. We arm the instrument and the scandal together."
 AUHDNC_m_the_kaiserjager_and_the_landesschutzen:0 "The Kaiserjaeger and the Landesschuetzen"
 AUHDNC_m_the_kaiserjager_and_the_landesschutzen_desc:0 "The Tyrolean rifle corps are put on a war footing and the shooting societies of the province are recognised as their reserve, with ammunition, ranges and cadres from the state. Our ally across the mountains will read this as what it is. The province that would be lost in the first fortnight of a southern war will not be lost."
 AUHDNC_m_the_army_that_pays_its_own:0 "The Army That Pays Its Own"
 AUHDNC_m_the_army_that_pays_its_own_desc:0 "Officers' pay and the pensions of the ranks are put on the common budget before the provinces are served. A subaltern will live on his salary without a family behind him, and a discharged sergeant will not beg. The diets will feel the money leave them. Better resented by the diets than deserted by the corps."
 AUHDNC_m_the_ministry_on_the_ring:0 "The Ministry on the Ring"
 AUHDNC_m_the_ministry_on_the_ring_desc:0 "The common ministry for foreign affairs is put on the staff's timetable. It will be told when the Monarchy intends to act and will prepare the ground for that season and no other. The minister who has kept the eastern understanding cannot do this work; his successor can. Standing still is no longer a policy."
 AUHDNC_m_the_reform_is_not_called:0 "The Reform Is Not Called"
 AUHDNC_m_the_reform_is_not_called_desc:0 "The bill for an equal franchise will not be called before the House. The estimate comes first, and the chamber that would have to vote it is the one we are not asking. We cancel the largest constitutional act the Austrian half was ready to pass, and pay in German and Czech loyalty. The recruits are worth more."
 AUHDNC_m_the_franchise_bought_with_the_estimate:0 "The Franchise Bought with the Estimate"
 AUHDNC_m_the_franchise_bought_with_the_estimate_desc:0 "The equal franchise passes, and it passes because the military estimate passes with it. We give the Austrian half a chamber of all its men and take the recruits in the same session. The bargain is stated in the lobby and never in the record. From now the ordinance is closed to us, and every vote costs more."
 AUHDNC_m_the_school_of_the_coast:0 "The School of the Coast"
 AUHDNC_m_the_school_of_the_coast_desc:0 "The navy is given the school it needs for the war it will actually fight: mine barrages, torpedo craft and the defence of the bays. The officers who teach that war are promoted before the battleship men, and the squadron programme waits. Our fleet is an Adriatic fleet and we will stop pretending otherwise in the estimates."
 AUHDNC_m_the_airship_detachment:0 "The Airship Detachment"
 AUHDNC_m_the_airship_detachment_desc:0 "The balloon establishment of the arsenal becomes an airship detachment with its own technical station and flying field, and the army stops borrowing civilian balloons. No flying machine is promised to any corps; what is bought is the school and the ground. Whoever holds the school need not buy it later."
 AUHDNC_m_the_army_in_galicia:0 "The Army in Galicia"
 AUHDNC_m_the_army_in_galicia_desc:0 "The northern province is administered as what it is: the assembly area of the plan against the eastern empire. Garrison towns, loading ramps and a lieutenancy that answers to the staff on anything touching the frontier. The Polish clubs will be consulted on schools and not on roads. We are treating a crown land as a glacis."
 AUHDNC_m_the_manoeuvres_of_the_realm:0 "The Manoeuvres of the Realm"
 AUHDNC_m_the_manoeuvres_of_the_realm_desc:0 "The autumn manoeuvres are held each year in a different land of the Monarchy, and the sovereign attends. The nations are shown the one body that belongs to all of them, marching through their own fields under their own regimental names. It costs six weeks of the workshops. It buys what no ordinance can."
 AUHDNC_m_the_landwehr_and_the_landsturm:0 "The Landwehr and the Landsturm"
 AUHDNC_m_the_landwehr_and_the_landsturm_desc:0 "The Austrian territorial force is raised to field standard and given its own artillery and cadres. It exists because the half of the realm that will vote its recruits must carry the half that will not. Two divisions are formed at once and the establishment is published. Budapest will understand it perfectly."
 AUHDNC_m_the_officers_of_the_reserve:0 "The Officers of the Reserve"
 AUHDNC_m_the_officers_of_the_reserve_desc:0 "The one-year volunteers are recruited from the schools and counting-houses of the towns, and a reserve commission stops being a favour owed to a family. Merit is established by examination, the same in every crown land. The gentry of the kingdom loses a monopoly. That is not an accident of the reform; it is the reform."
 AUHDNC_m_the_map_of_the_realm:0 "The Map of the Realm"
 AUHDNC_m_the_map_of_the_realm_desc:0 "The military geographical institute is ordered to survey the Monarchy itself at the scale of an operation, and the sheets of the Hungarian counties are printed first. Roads, fords, mills and the yield of every district. An army that would occupy its own realm needs better maps of it than of any frontier."
 AUHDNC_m_the_plan_for_the_kingdom:0 "The Plan for the Kingdom"
 AUHDNC_m_the_plan_for_the_kingdom_desc:0 "The kingdom is settled first. Until the Crown can levy in Hungary what it levies in the Austrian half, no soldier of ours crosses the Save. Every corps, commissioner and gendarme faces inward from this hour, and the southern question waits. The choice is not reversible, and the neighbours will use the years we give them."
 AUHDNC_m_the_army_bills_deposited:0 "The Army Bills Deposited"
 AUHDNC_m_the_army_bills_deposited_desc:0 "The two military bills go to Budapest as they stand, without a word conceded on the language of command. The Crown will not buy recruits with the unity of the army. The opposition may talk the session to death; the common minister of war stays in his place. What the bills would give us is paid for later, if ever."
 AUHDNC_m_the_order_of_chlopy:0 "The Order of Chlopy"
 AUHDNC_m_the_order_of_chlopy_desc:0 "At the autumn manoeuvres the Crown declares before the assembled corps that its army will remain common and united. No conciliating rescript will follow this time. We are told the Czechs and the Croats would demand the same the next morning; that is precisely why nothing is conceded to anyone."
 AUHDNC_m_the_house_that_votes_nothing:0 "The House That Votes Nothing"
 AUHDNC_m_the_house_that_votes_nothing_desc:0 "Without a budget and without an indemnity act, the taxes of the kingdom are levied by provisional twelfths on the Crown's own authority. The refusal is read as a refusal of service owed, not a parliamentary opinion. No article of the Hungarian constitution lets a ministry govern meanwhile, and we will invent none."
 AUHDNC_m_the_strike_of_the_counties:0 "The Strike of the Counties"
 AUHDNC_m_the_strike_of_the_counties_desc:0 "We record which county assemblies have stopped obeying, and stop the salaries of their officials the same week. The list is published so that every county knows where it stands. More than half are on it, and until they are broken or bought the kingdom furnishes neither taxes nor classes."
 AUHDNC_m_a_cabinet_of_generals:0 "A Cabinet of Generals"
 AUHDNC_m_a_cabinet_of_generals_desc:0 "The Crown refuses to call the majority and installs a government of generals and officials under the captain of its Hungarian guard. Its minister of the interior is to prepare an equal franchise for the kingdom, and to let it be known that he is preparing it. This ministry has no majority and wants none."
 AUHDNC_m_the_street_against_the_chamber:0 "The Street Against the Chamber"
 AUHDNC_m_the_street_against_the_chamber_desc:0 "We let the workers march on the national Parliament for the vote we intend to give them, and we do not send the gendarmes. While the Chamber refuses the Crown, the street is the Crown's ally. We are manufacturing a labour movement we will not control, and if we then withhold the franchise it becomes the worst enemy we have made."
 AUHDNC_m_the_royal_commissioners:0 "The Royal Commissioners"
 AUHDNC_m_the_royal_commissioners_desc:0 "A royal commissioner takes the chair of every county assembly that refuses tax and recruits. The gendarmerie collects, the salaries of the elected officials stop, and the assemblies may meet as often as they wish. This is where the kingdom stops being governed and starts being administered."
 AUHDNC_m_the_recruits_taken_by_the_commissioners:0 "The Recruits Taken by the Commissioners"
 AUHDNC_m_the_recruits_taken_by_the_commissioners_desc:0 "What the Diet would not vote, the commissioners levy under royal order, county by county. No emergency article is invoked, because there is none to invoke; the order rests on the Crown's right to the service owed it. The classes come in this year. The kingdom will remember the method longer than the Crown remembers the recruits."
 AUHDNC_m_the_chamber_cleared_by_the_guard:0 "The Chamber Cleared by the Guard"
 AUHDNC_m_the_chamber_cleared_by_the_guard_desc:0 "The House is dissolved by rescript, and the royal commissioner has the hall cleared and the desks sealed by troops of the King's own Hungarian guard. The order is carried out by Hungarian soldiers against a Hungarian parliament, and that is the whole point of it. What it proves about the Honved outlasts the building."
 AUHDNC_m_the_counties_yield:0 "The Counties Yield"
 AUHDNC_m_the_counties_yield_desc:0 "The leaders of the majority send word that they will take office without their military programme. We take the offer, keep the commissioners in place, and print nothing. They surrender the language of command because the alternative is an equal franchise that would end their world. One of them will talk."
 AUHDNC_m_the_coalition_in_office_under_watch:0 "The Coalition in Office Under Watch"
 AUHDNC_m_the_coalition_in_office_under_watch_desc:0 "The majority governs, and it governs with a soldier of the common army at the ministry of national defence and a royal commissioner in every county that made trouble. It may have the offices; it may not have the army. Its leaders will tell their voters they conceded nothing, and we will not contradict them in public."
 AUHDNC_m_the_contingent_obtained_by_the_pact:0 "The Contingent Obtained by the Pact"
 AUHDNC_m_the_contingent_obtained_by_the_pact_desc:0 "The price of the offices is the recruits. The annual contingent is raised by what the Crown asked for, and the language of command appears nowhere in the act. The majority may call this a budget measure; we call it the levy we could not obtain by ordinance. We buy with patronage what others take by commissioners."
 AUHDNC_m_the_commissioners_kept_a_year:0 "The Commissioners Kept a Year"
 AUHDNC_m_the_commissioners_kept_a_year_desc:0 "The commissioners stay where they are for a full year after the pact. The counties are to learn that the Crown does not withdraw because it has been obeyed once, and that the machinery can be brought back in a fortnight. Salaries resume, elections do not. The Crown will be hated with more precision."
 AUHDNC_m_the_case_of_the_kingdom_opened:0 "The Case of the Kingdom Is Opened"
 AUHDNC_m_the_case_of_the_kingdom_opened_desc:0 "The file the staff wrote for this case is opened. Corps commanders receive their districts, the counties pass under military administration, and the kingdom is governed from a headquarters. Two of every five recruits the realm levies come from the half we are now occupying, and they will not come."
 AUHDNC_m_the_army_holds_the_kingdom:0 "The Army Holds the Kingdom"
 AUHDNC_m_the_army_holds_the_kingdom_desc:0 "Districts, not counties. Each corps commander answers to the Crown for order, taxes and recruits in his own, and the county map is set aside. The Romanian, Slovak and Serb districts find a colonel a fairer master than a Magyar sheriff, and say so. Croatia does not, and will not be won by the sword."
 AUHDNC_m_the_honved_stood_down:0 "The Honved Stood Down"
 AUHDNC_m_the_honved_stood_down_desc:0 "The royal Hungarian home guard is stood down and its depots taken over by the common army. Its officers are offered a commission in the common service or their pension, and most will take the pension. The classes it drew return to the common contingent. After this there is no Hungarian army of any kind to negotiate about."
 AUHDNC_m_the_counties_under_commissioners:0 "The Counties Under Commissioners"
 AUHDNC_m_the_counties_under_commissioners_desc:0 "The county self-government that refused the Crown is replaced by a salaried administration answering to the ministry. Officials are appointed, examined and paid, and they may be dismissed. Every serious man in the kingdom has demanded this reform; none wanted it carried by an occupying army."
 AUHDNC_m_the_bench_of_the_summary_court:0 "The Bench of the Summary Court"
 AUHDNC_m_the_bench_of_the_summary_court_desc:0 "In the districts under commission the jury is set aside and the garrison court sits, under the old law that has never been repealed. Sentences are passed within days and carried out within days. Order will be restored faster than by any other means we have. The foreign press will write about us, and truthfully."
 AUHDNC_m_the_kingdom_at_the_kings_disposal:0 "The Kingdom at the King's Disposal"
 AUHDNC_m_the_kingdom_at_the_kings_disposal_desc:0 "The kingdom no longer refuses. Taxes come in, classes come in, and the counties do what they are told. Now the Crown must give the realm a law, or govern it for ever with a garrison and call that a constitution. From this hour the army may be used elsewhere, and the exception must be brought to an end."
 AUHDNC_m_the_franchise_by_patent:0 "The Franchise by Patent"
 AUHDNC_m_the_franchise_by_patent_desc:0 "The Crown gives the kingdom the franchise its gentry refused: every man votes, and the chamber that comes out of it will not be Magyar alone. The electorate is multiplied several times over by a single act of the Crown. The exception is lifted the day the patent is published. The gentry will never forgive it."
 AUHDNC_m_indivisibiliter:0 "Indivisibiliter ac Inseparabiliter"
 AUHDNC_m_indivisibiliter_desc:0 "The Crown octroys one constitution for the whole realm: one government, one service, one budget, and diets that advise. The dualist settlement is not renewed, it is superseded. Nobody has asked for this and nobody will be consulted, which is what makes it possible. The exception ends the day the patent is published."
 AUHDNC_m_the_deputies_of_the_nationalities:0 "The Deputies of the Nationalities"
 AUHDNC_m_the_deputies_of_the_nationalities_desc:0 "Romanian, Slovak, Serb and Ruthene members take their seats at Budapest in numbers for the first time. They are seated, sworn and paid, and the House learns to do business before the peoples it legislates for. Nothing will be carried quickly there again. The Crown gains a chamber that cannot combine against it."
 AUHDNC_m_a_curia_for_the_uplands:0 "A Curia for the Uplands"
 AUHDNC_m_a_curia_for_the_uplands_desc:0 "The Moravian model is carried into the kingdom: national rolls and separate curiae in the upland counties, so that a Slovak elects a Slovak and a Magyar a Magyar. It has kept the peace in one crown land and can keep it here. Every man must now declare what he is, and those who were neither cease to exist on paper."
 AUHDNC_m_the_districts_redrawn_in_transylvania:0 "The Districts Redrawn in Transylvania"
 AUHDNC_m_the_districts_redrawn_in_transylvania_desc:0 "The Transylvanian constituencies are drawn on the people who actually live in them, and the returning officers are appointed by the ministry rather than the counties. Romanian members will be returned in proportion to Romanian voters. The kingdom will call it a mutilation of the electoral law, and it is."
 AUHDNC_m_the_teacher_paid_without_a_language:0 "The Teacher Paid Without a Language"
 AUHDNC_m_the_teacher_paid_without_a_language_desc:0 "The state pays the village teacher the same supplement whether he teaches in Magyar, Slovak or Romanian, and asks only that Magyar be taught as a subject. The kingdom voted this law itself and has never applied a line of it. It costs what magyarisation would have cost and buys the opposite."
 AUHDNC_m_the_officials_and_not_the_diets:0 "The Officials and Not the Diets"
 AUHDNC_m_the_officials_and_not_the_diets_desc:0 "Where a diet obstructs, its competences pass to the imperial officials, and those officials are instructed to be nationally colourless in everything they do. A civil service that belongs to no nation is the counterpart of an army that belongs to no nation. Both camps will call such an official an enemy in hiding."
 AUHDNC_m_one_treasury_and_one_service:0 "One Treasury and One Service"
 AUHDNC_m_one_treasury_and_one_service_desc:0 "Two ministries of finance become one, and the quota ceases to be a thing negotiated every ten years by men who have no arbitrator. It is frozen where it stands and the decennial renewal is struck from the calendar. The realm pays as a realm. The Hungarian loan will be repriced and the houses will make us feel it for a season."
 AUHDNC_m_the_ordinance_becomes_the_rule:0 "The Ordinance Becomes the Rule"
 AUHDNC_m_the_ordinance_becomes_the_rule_desc:0 "The chambers are convoked to hear, not to vote, and the ordinance becomes the ordinary form of law throughout the realm. Everything the Crown wants passes on the day the Crown wants it. A commission has reported that a third of the ordinances so far were grave abuses, and nobody was impeached. That is our precedent."
 AUHDNC_m_the_magyar_notables_bought_back:0 "The Magyar Notables Bought Back"
 AUHDNC_m_the_magyar_notables_bought_back_desc:0 "The gentry that lost its counties is offered commissions, pensions and places at court. A class can be bought where a nation cannot, and this one has debts. Chamberlains' keys cost the treasury nothing; the pensions cost a great deal. From the day they are paid, they stop furnishing the reserve commissions they gave for honour."
 AUHDNC_m_the_realm_receives_its_law:0 "The Realm Receives Its Law"
 AUHDNC_m_the_realm_receives_its_law_desc:0 "The state of exception is lifted. What the Crown took by ordinance it returns as a constitution of its own making, published, sealed and not open to amendment by anybody who did not write it. The commissioners go home and the summary courts close. Every parliamentary power in Europe has watched how this was done."
 AUHDNC_m_the_plan_for_the_south:0 "The Plan for the South"
 AUHDNC_m_the_plan_for_the_south_desc:0 "The kingdom is held quiet, not settled. The Crown will not spend an army on its own counties while the southern question can be closed with the same men and the same season. Budapest is governed by what we refuse to sign. The file for the kingdom stays in the safe, and we will feel its absence in every class we call."
 AUHDNC_m_the_kingdom_held_by_ordinance:0 "The Kingdom Held by Ordinance"
 AUHDNC_m_the_kingdom_held_by_ordinance_desc:0 "Every Hungarian bill is pre-sanctioned before it reaches the House, or it does not reach the House. The Crown governs Budapest by what it refuses to sign, which requires no troops and no commissioners. The kingdom will obey, and will cooperate in nothing that is not compelled."
 AUHDNC_m_the_watch_on_the_save_and_the_danube:0 "The Watch on the Save and the Danube"
 AUHDNC_m_the_watch_on_the_save_and_the_danube_desc:0 "The river frontier is put under permanent military surveillance. Crossing points are counted, ferries licensed, and the gendarmerie of the border districts placed under the corps commands. We will know within a day who has come over and with what. A society for the nation's defence is rising on the other bank."
 AUHDNC_m_the_frontier_shut_to_belgrade:0 "The Frontier Shut to Belgrade"
 AUHDNC_m_the_frontier_shut_to_belgrade_desc:0 "The closed frontier is put under the army. Customs officers are replaced by cordons, the crossing points held by troops, and the frontier will not be reopened by a trade negotiation we did not order. Each year the cordon stands, Belgrade finds another abattoir and another gunmaker, and the weapon in our hand gets lighter."
 AUHDNC_m_belgrade_buys_its_guns_elsewhere:0 "Belgrade Buys Its Guns Elsewhere"
 AUHDNC_m_belgrade_buys_its_guns_elsewhere_desc:0 "Our gunmaker has lost Belgrade to a French house, paid for with a French loan. The staff is ordered to fix the season at which the Serbian batteries will actually be re-equipped, and to plan for the years before it. That season is the whole of our freedom of action in the south. The staff will ask for those years every month."
 AUHDNC_m_the_bosniaken_regiments:0 "The Bosniaken Regiments"
 AUHDNC_m_the_bosniaken_regiments_desc:0 "The Bosnian battalions are doubled and given depots of their own, and the province is made to pay for its garrison in men. They remain the subjects of a sovereign who is not ours, and every recruit we take is an argument the neighbours will use. We take them anyway; they are the best mountain infantry in the realm."
 AUHDNC_m_the_narrow_gauge_to_the_drina:0 "The Narrow Gauge to the Drina"
 AUHDNC_m_the_narrow_gauge_to_the_drina_desc:0 "The narrow-gauge network of the province is pushed east to the valleys where a corps would otherwise detrain and march. Bridges, water towers and loading ramps in country that has never carried a wheel. The province is not ours and we are building a military railway across it. Mountain railway is the dearest kind."
 AUHDNC_m_the_frankist_wager:0 "The Frankist Wager"
 AUHDNC_m_the_frankist_wager_desc:0 "We govern Croatia with the party that wants Vienna against Budapest, and treat the coalition the country actually elected as an enemy of the state. That coalition holds fifty-six of the eighty-eight seats in the Sabor. Whatever we gain in Zagreb we lose in every Serb district of the kingdom."
 AUHDNC_m_outbid_the_resolution_of_fiume:0 "Outbid the Resolution of Fiume"
 AUHDNC_m_outbid_the_resolution_of_fiume_desc:0 "The Croatian deputies went to Budapest and asked for the reunion of Dalmatia with their kingdom. We offer it first, and ask for their loyalty in exchange. This is a constitutional programme and not a favour, and it will be paid for by the Germans of the coast and of Styria. Vienna takes back the card it let Budapest pick up."
 AUHDNC_m_a_ban_named_by_the_crown:0 "A Ban Named by the Crown"
 AUHDNC_m_a_ban_named_by_the_crown_desc:0 "The ban stays where he is and stops being Budapest's man: he receives his instructions from the Crown, and the Hungarian countersignature is asked for afterwards or not at all. What breaks here is the Croatian-Hungarian settlement, not the personnel. Budapest keeps its ban and loses its signature."
 AUHDNC_m_dissolve_the_coalition_of_zagreb:0 "Dissolve the Coalition of Zagreb"
 AUHDNC_m_dissolve_the_coalition_of_zagreb_desc:0 "The Sabor is suspended and the leaders of the coalition are put on trial for high treason before a court that will convict them. Organised opposition in Croatia ends for two years. The principal documents were manufactured in one of our own legations and the defence will establish it. We proceed with our eyes open."
 AUHDNC_m_the_dalmatian_pledge:0 "The Dalmatian Pledge"
 AUHDNC_m_the_dalmatian_pledge_desc:0 "We give the Dalmatian diet and the Sabor a written promise, and we tell the Reichsrat that the coast will change hands. Dalmatia is named in the fundamental law of the Austrian half and cannot be detached by ordinance, so a promise is all we can give now. The Germans of the coast will treat this as a betrayal, correctly."
 AUHDNC_m_the_royal_croatian_home_guard:0 "The Royal Croatian Home Guard"
 AUHDNC_m_the_royal_croatian_home_guard_desc:0 "The Croatian home guard is enlarged, given artillery of its own and its own language of command, and it swears to the King alone. Two brigades are formed at once from the districts that furnish the best men. Budapest asked for exactly this for itself and was refused; Zagreb receives it because Zagreb is useful to us."
 AUHDNC_m_the_regiments_of_the_littoral:0 "The Regiments of the Littoral"
 AUHDNC_m_the_regiments_of_the_littoral_desc:0 "The Littoral and Carniola furnish their own regiments, and the cooperative societies of those provinces are made responsible for the families of the men called. Credit unions, granaries and burial funds become a recruiting apparatus. We are arming one half of a province against the other and calling it a levy."
 AUHDNC_m_the_frontier_regiments_remembered:0 "The Frontier Regiments Remembered"
 AUHDNC_m_the_frontier_regiments_remembered_desc:0 "The old military frontier is remembered where it is useful. The border districts are offered the exemptions and the land tenure their grandfathers held, in exchange for battalions raised and officered on the spot. The Serb villages take the bargain because it is the only thing this Crown has offered them that is not a sermon."
 AUHDNC_m_the_case_against_italy:0 "The Case Against Italy"
 AUHDNC_m_the_case_against_italy_desc:0 "The staff puts its memorandum on the ally across the Isonzo before the Crown, and asks for a plan and not a treaty. Our intelligence has the text of a secret undertaking that ally has given to a third power, and it is laid on the table beside it. The alliance will be renewed on schedule and mean nothing to either signatory."
 AUHDNC_m_the_works_on_the_tyrolean_frontier:0 "The Alpine Barrier"
 AUHDNC_m_the_works_on_the_tyrolean_frontier_desc:0 "The Tyrolean frontier works are built to their full profile, and the passes are closed on paper before they are closed with concrete. Every fort is sited by the staff and paid out of the common estimate, over the objection of every diet that must house the labour. In the mountains a fort is worth a division."
 AUHDNC_m_the_littoral_under_the_army:0 "The Littoral Under the Army"
 AUHDNC_m_the_littoral_under_the_army_desc:0 "The Littoral is administered as a fortress district. There will be no Italian faculty of law anywhere in the Monarchy, the national league is dissolved, and the port works answer to the naval command. We granted such a faculty once: a riot destroyed it within a day and a man was killed. We refuse it outright now."
 AUHDNC_m_take_the_title_while_petersburg_looks_east:0 "Take the Title While Petersburg Looks East"
 AUHDNC_m_take_the_title_while_petersburg_looks_east_desc:0 "The eastern empire cannot answer for two years and everyone in Europe can see it. We take the title to the two provinces now, before there is a conference to ask us for it. There is no indemnity to negotiate because nobody can demand one. We burn the understanding that has kept the Balkans quiet."
 AUHDNC_m_end_the_condominium:0 "End the Condominium"
 AUHDNC_m_end_the_condominium_desc:0 "The occupation is declared over: the two provinces are annexed by proclamation and the Powers are informed afterwards. A parliament restored in the east will ask for deputies from provinces legally still its own, and the fiction cannot survive that question. The crisis this costs is cheaper than the question."
 AUHDNC_m_incorporate_the_reichsland:0 "Incorporate the Reichsland"
 AUHDNC_m_incorporate_the_reichsland_desc:0 "The province is given a governor with military powers and a statute that grants schools and religious endowments, and no diet. The Orthodox and then the Muslims receive the administration of their own foundations; nobody receives a vote. Political life here will be confessional, because we permit nothing else."
 AUHDNC_m_keep_the_garrisons_of_novi_pazar:0 "Keep the Garrisons of Novi Pazar"
 AUHDNC_m_keep_the_garrisons_of_novi_pazar_desc:0 "The garrisons stay where they are and the survey for the line to the south is taken up again and announced before the Delegations. So long as we sit in that district the two hostile neighbours below us have no common frontier. Not one kilometre will be laid; the survey alone costs what a railway costs."
 AUHDNC_m_hand_back_the_garrisons:0 "Hand Back the Garrisons"
 AUHDNC_m_hand_back_the_garrisons_desc:0 "The garrisons are withdrawn from the southern district, and the withdrawal is announced as an act of moderation on the same day as the proclamation. One crisis is bought off with the other. The Powers will take the gesture at face value because it costs us something real: the two neighbours below us will have a common frontier."
 AUHDNC_m_the_porte_presents_its_bill:0 "The Porte Presents Its Bill"
 AUHDNC_m_the_porte_presents_its_bill_desc:0 "We buy the title we have already taken. An indemnity is paid to the Porte and guarantees are given to the Muslims of the province over their foundations, their schools and their exemption from our service. The sum is not published and will not be. What is bought is the quiet recognition of a Power with every reason to refuse it."
 AUHDNC_m_the_minister_and_the_chief:0 "The Minister and the Chief"
 AUHDNC_m_the_minister_and_the_chief_desc:0 "The foreign minister and the chief of the general staff are heard on the same day and the Crown decides between them. One says the crisis is won and must therefore be closed; the other says it is only won if it is used, and asks for the campaign a third time. The one set aside is replaced without cost."
 AUHDNC_m_the_short_campaign:0 "The Short Campaign"
 AUHDNC_m_the_short_campaign_desc:0 "The staff is given what it has asked for twice: a short campaign against Belgrade while its batteries are unpaid and its protector is looking east. The frontier is crossed on the plan already in the safe. If our friend in the north puts the question at Petersburg, this is a campaign of weeks. If not, it is a war."
 AUHDNC_m_the_army_that_is_not_used:0 "The Army That Is Not Used"
 AUHDNC_m_the_army_that_is_not_used_desc:0 "The army is kept ready and not employed. The neighbour capitulates on paper, recognises what we have taken and undertakes to be a good neighbour, which he will not be. We spend nothing and gain everything the campaign would have gained, minus the credit of doing it ourselves. The staff will call this the third refusal."
 AUHDNC_m_the_guns_above_cattaro:0 "The Guns Above Cattaro"
 AUHDNC_m_the_guns_above_cattaro_desc:0 "The mountain that overlooks our only deep-water bay is taken, and the bay stops being a hostage to a battery on a neighbour's ridge. Coastal works and a naval station are built in the bay itself. The summit belongs to a sovereign state and we are going to take it from him. The whole south will judge us by it."
 AUHDNC_m_the_settlement_of_the_south_slavs:0 "The Settlement of the South Slavs"
 AUHDNC_m_the_settlement_of_the_south_slavs_desc:0 "By royal rescript to the Sabor, the Croatian lands, Dalmatia and the annexed province are placed under one administration and one diet, and the state of exception is lifted. It is granted from above, to a people that furnished the soldiers rather than to a diet that demanded it. Across the Isonzo this reads as a programme."
 AUHDNC_m_the_army_of_fifty_millions:0 "The Army of Fifty Millions"
 AUHDNC_m_the_army_of_fifty_millions_desc:0 "The contingent is set at what the population can bear, and the classes that were never called are called. The realm has gained ten million people since the levy was last fixed and has taken not one additional recruit for them. Arming that many men will cost the civil budget for a decade."
 AUHDNC_m_an_army_above_the_nations:0 "An Army Above the Nations"
 AUHDNC_m_an_army_above_the_nations_desc:0 "The realm has one institution that belongs to no nation. It has given the realm its law and now returns to its barracks under that law. The summary courts close, the commissioners are recalled, and the ledger of the exception is published in full. We hand the next reign a state that reaches for the sword too fast."
 AUHDNC_nav_the_kuk_kriegsmarine:0 "The k.u.k. Kriegsmarine"
 AUHDNC_nav_the_kuk_kriegsmarine_desc:0 "The fleet stops being an appendix to the land estimates. It is given its own section of the common war ministry, its own yards, its own school and its own line in the budget, and both halves of the realm will be told every year what it costs them. What we are voting is that there is a navy at all, and that it is common."
 AUHDNC_nav_the_austrian_lloyd:0 "The House Flag of the Lloyd"
 AUHDNC_nav_the_austrian_lloyd_desc:0 "The subsidised lines and the state mail contracts are a naval instrument and we will treat them as one. The company keeps its subsidy, its routes and its coaling stations; in return its hulls and its crews are requisitionable the day we ask. The seamen of the Littoral go on a naval register and draw a retainer for it."
 AUHDNC_nav_the_coast_defence_school:0 "The Coast Defence School"
 AUHDNC_nav_the_coast_defence_school_desc:0 "The Adriatic is a closed sea and we will close it. Torpedo craft, mines and shore batteries on the headlands of every channel, and not one hull we cannot pay for out of the ordinary estimates. The Kingdom's Delegation will vote this without being asked twice. We choose a fleet that will never leave its own gulf."
 AUHDNC_nav_the_high_seas_school:0 "The High Seas School"
 AUHDNC_nav_the_high_seas_school_desc:0 "A fleet that cannot leave its own gulf is a fleet nobody counts, in any chancellery. We decide now that this navy is built to go out of the Adriatic, and we will find the money afterwards, tranche by tranche, from two Delegations neither of which has been asked yet. What we vote is the direction, and the bill that comes with it."
 AUHDNC_nav_the_station_in_china:0 "The Station in China"
 AUHDNC_nav_the_station_in_china_desc:0 "One cruiser stays permanently on the eastern station and a marine detachment at the legation. The ground offered on the river is accepted and administered by our consul and the garrison commander. It costs us the only modern ship we could spare, nine thousand miles from the Adriatic. A flag nobody has seen abroad is not a flag."
 AUHDNC_nav_the_torpedo_flotillas:0 "The Torpedo Flotillas"
 AUHDNC_nav_the_torpedo_flotillas_desc:0 "The money that will not buy a battleship buys twenty boats. Sea-going torpedo craft and destroyers, based forward on the Dalmatian coast where the channels are, with young officers given commands early and told to keep them. In a sea this narrow, twenty boats close more water than one hull ever will."
 AUHDNC_nav_the_marinesektion:0 "The Marine Section"
 AUHDNC_nav_the_marinesektion_desc:0 "The fleet is administered by its own section of the common war ministry. That section, not the general staff, drafts the naval estimates, writes the doctrine and answers for both before the Delegations. The officer who commands the fleet at sea holds the ministry office too, and will keep both. Budapest asked for none of it."
 AUHDNC_nav_the_armoured_cruiser_at_pola:0 "The Armoured Cruiser at Pola"
 AUHDNC_nav_the_armoured_cruiser_at_pola_desc:0 "The state yard at the naval port lays down an armoured cruiser of its own, the largest hull it has ever attempted. The realm will find out what a big ship costs it, and the answer is not in crowns but in years: keel to commissioning, four and a half of them. Every programme after this one is costed at the rate this ship sets."
 AUHDNC_nav_the_academy_and_the_hydrographic_office:0 "The Academy and the Hydrographic Office"
 AUHDNC_nav_the_academy_and_the_hydrographic_office_desc:0 "The fleet will print its own charts, tides and sailing directions at the naval port, and train its own officers at the academy on the Kingdom's coast. Both are enlarged, funded from the common estimates and placed under the Marine Section. We stop buying our own coastline from foreign publishers, and the best cadets go to sea."
 AUHDNC_nav_the_whitehead_works:0 "The Whitehead Works"
 AUHDNC_nav_the_whitehead_works_desc:0 "The torpedo works on the Kingdom's coast keeps its export trade, selling to everyone who asks, including the only other navy in this sea; but our order comes first and our fuses are not for sale. Beside it we raise a mine and barrage service with its own depot and a survey of every channel worth closing."
 AUHDNC_nav_the_vote_of_the_two_delegations:0 "The Vote of the Two Delegations"
 AUHDNC_nav_the_vote_of_the_two_delegations_desc:0 "The naval estimates go to both Delegations in the same session, printed in both languages, with the yards and the orders named line by line. We take what the more reluctant of the two will give, and come back next year to ask again. The fleet's price is never the Crown's authority; it is a bargain renewed every year."
 AUHDNC_nav_the_flottenverein:0 "A League for the Fleet"
 AUHDNC_nav_the_flottenverein_desc:0 "The fleet will be argued for outside the chamber. A society is constituted to promote the realm's shipping: members from both parliaments, lectures in the provincial towns, model ships in the schoolrooms. When the estimates arrive they are to be half voted already, and it will ask us for one more ship every year."
 AUHDNC_nav_the_keels_of_both_crowns:0 "The Keels of Both Crowns"
 AUHDNC_nav_the_keels_of_both_crowns_desc:0 "The Kingdom will vote the naval credit and it will be paid in hulls. A guaranteed share of every order goes to its own yard at its own port, the armour and the ordnance shared out to match, and the yard enlarged at common expense until it can take a big keel. We are buying a vote with an industry that does not exist yet."
 AUHDNC_nav_the_credit_outside_the_estimates:0 "The Credit Outside the Estimates"
 AUHDNC_nav_the_credit_outside_the_estimates_desc:0 "We will not sell this fleet hull by hull to a Delegation that has no coast. The whole programme is raised at once as a special loan on the Crown's own responsibility, placed with the banks of both capitals. The money is found this year; the constitutional bill for having found it this way arrives later, and it will be large."
 AUHDNC_nav_montecuccoli_takes_the_helm:0 "The Programme of the New Commander"
 AUHDNC_nav_montecuccoli_takes_the_helm_desc:0 "The Marine Command lays a whole fleet before the two Delegations at once: ships of the line, armoured cruisers, scout cruisers, destroyers, torpedo craft and six boats that go under. Not one item of it is voted. We publish it anyway, in full, and we will tear it out of them a tranche at a time for as many years as it takes."
 AUHDNC_nav_a_fleet_that_stays_at_home:0 "A Fleet That Stays at Home"
 AUHDNC_nav_a_fleet_that_stays_at_home_desc:0 "We say it plainly, in both chambers and in writing: this navy defends the coast and nothing else. No hull larger than a coast-defence ship will be laid down while the decision stands, and the credit it does not spend goes to the army and the railways. It is the cheapest fleet in Europe, and it cannot be undone this decade."
 AUHDNC_nav_the_arsenal_at_pola:0 "The Arsenal at Pola"
 AUHDNC_nav_the_arsenal_at_pola_desc:0 "The naval port stops being a repair shop with a flag over it. Slips, cranes, a floating dock, a torpedo depot and a machine shop that can cut its own gun mountings, all of it under the Marine Section. From now on the fleet refits itself and queues behind nobody. The town becomes a closed military port, and is not consulted."
 AUHDNC_nav_the_erzherzog_karl_class:0 "The Erzherzog Karl Class"
 AUHDNC_nav_the_erzherzog_karl_class_desc:0 "Three more ships of the line, ordered on the ordinary estimates, and the last big hulls those estimates will carry without a new bargain. The plate comes from the Moravian works and the guns from the Bohemian, and both need new plant to deliver on time. The Marine Section suspects their kind is ending; we order them anyway."
 AUHDNC_nav_the_bay_of_cattaro:0 "The Bay of Cattaro"
 AUHDNC_nav_the_bay_of_cattaro_desc:0 "The southern anchorage becomes a real base: moles, a coaling depot, a telegraph cable, batteries on both headlands and a survey of the heights that overlook the inlet. From there the fleet reaches the mouth of the Adriatic in a day. Belgrade and Cetinje will read the batteries as they are meant to be read."
 AUHDNC_nav_the_first_submarines:0 "The Boats of Three Designs"
 AUHDNC_nav_the_first_submarines_desc:0 "Our own technical committee's design is rejected as impracticable, and so is the open competition that followed it. Instead we buy two boats each from three designs that are not ours, run them against one another in our own water, and build whatever wins. Two of the three pairs will be paid for in full and never repeated."
 AUHDNC_nav_the_radetzky_class:0 "Lay Down the Semi-Dreadnoughts"
 AUHDNC_nav_the_radetzky_class_desc:0 "Three more heavy hulls now, on the ordinary estimates, with the heaviest secondary battery afloat and no new credit asked of anybody. A squadron in the water beats a better design on paper, and these keels can be laid this year. They will be outclassed on the day the first of them swims, and we know what we are paying for."
 AUHDNC_nav_wait_for_the_all_big_gun_ship:0 "Wait for the All-Big-Gun Ship"
 AUHDNC_nav_wait_for_the_all_big_gun_ship_desc:0 "We will not spend the decade's last credit on ships that are already old. The slips stay empty, the technical committee draws, and the first hull we lay down will carry nothing but heavy guns on the centreline. The Delegations are entitled to ask what they are financing while the yards stand idle, and we will tell them."
 AUHDNC_nav_the_fleet_and_the_two_states:0 "The Fleet the Two States Paid For"
 AUHDNC_nav_the_fleet_and_the_two_states_desc:0 "We lay the account before both parliaments at once: this is what the fleet has cost, in hulls and in bargains; this is what it is; and this is the sea it is now expected to hold. Nothing in it was voted willingly and nothing in it can be unvoted. The era closes with the fleet the two states actually paid for."
 AUHDNC_r_the_iron_ring_reforged:0 "The Iron Ring Reforged"
 AUHDNC_r_the_iron_ring_reforged_desc:0 "We decline a ministry of officials holding the emergency paragraph in its pocket. This cabinet is commissioned out of the Slav and Catholic clubs of the chamber, and it will ask them for their votes rather than govern around them. Every portfolio, every school, every branch line is paid before a single estimate is carried."
 AUHDNC_r_the_provisional_by_ordinance:0 "The Provisional Regime Renewed"
 AUHDNC_r_the_provisional_by_ordinance_desc:0 "The settlement with the other half cannot wait for a chamber still arguing about its own rules. We sign the provisional by emergency ordinance and inform the house of it afterwards. The customs union holds, the common budget is covered, and our own majority is humiliated by its government in its first weeks."
 AUHDNC_r_the_price_list_of_the_clubs:0 "The Price List of the Clubs"
 AUHDNC_r_the_price_list_of_the_clubs_desc:0 "We write down what each club is owed before we ask it for anything: a portfolio here, a school there, a branch line into a valley that has never seen one. The list is paid first and the vote is asked second, because that is the only order this chamber has ever worked in. It will get dearer with every partner we add."
 AUHDNC_r_the_money_goes_to_the_clubs:0 "The Money Goes to the Clubs"
 AUHDNC_r_the_money_goes_to_the_clubs_desc:0 "The billion voted for waterways and mountain rail is broken up into small local lines, schools and post offices in the lands whose deputies sit behind us. Every crownland gets something it can show its voters and nothing gets finished. The Alpine route and the second axis to the port are closed for the era."
 AUHDNC_r_the_fleet_the_clubs_will_pay_for:0 "The Fleet the Clubs Will Pay For"
 AUHDNC_r_the_fleet_the_clubs_will_pay_for_desc:0 "The Adriatic is a closed sea and we will close it: torpedo craft, mines, coast batteries and three ships of the line the ordinary estimates can carry. The expansion plan drawn in the naval section is not adopted while these benches vote our budget. Our admirals command the fleet the clubs will pay for, and not a battle line."
 AUHDNC_r_the_germans_leave_the_chamber:0 "The Germans Leave the Chamber"
 AUHDNC_r_the_germans_leave_the_chamber_desc:0 "We state from the bench that obstruction will now come from the German side, that it will not be bought off, and that the language regulations of the kingdom will not be withdrawn. The desks are hammered and Karl Hermann Wolf has his platform. The kingdom will be administered in a legal vacuum by two hostile services."
 AUHDNC_r_the_dynasty_pays_in_czech_coin:0 "The Dynasty Pays in Czech Coin"
 AUHDNC_r_the_dynasty_pays_in_czech_coin_desc:0 "The court itself goes to the kingdom. Its museums and its academy take the sovereign's patronage, its regimental colours are confirmed in their own names, and the royal castle above the river is kept as a residence rather than a store-room. The German-Magyar households of the court will read every appointment as a defeat."
 AUHDNC_r_the_arithmetic_of_the_house:0 "The Arithmetic of the House"
 AUHDNC_r_the_arithmetic_of_the_house_desc:0 "We count. The five clubs this ministry can enrol are one hundred and eighty-two votes; two hundred and thirteen make a majority; the difference must be bought bench by bench. The count is published, so every defection is reckoned against us in the morning papers before the sitting opens."
 AUHDNC_r_the_conferences_abandoned:0 "The Conferences Are Abandoned"
 AUHDNC_r_the_conferences_abandoned_desc:0 "The attempt to settle the language question between notables in a hotel room outside parliament is given up. What is settled will be settled by statute, and this ministry will not be blackmailed by men who hold no seat. We gain a clear principle and lose the last channel that was not a shouting match."
 AUHDNC_r_the_polish_club_in_office:0 "The Polish Club in Office"
 AUHDNC_r_the_polish_club_in_office_desc:0 "The Galician delegation takes a portfolio and a promise: nothing decided in this capital will be applied in the province against the diet at Lemberg. Sixty-five votes come with it, and the Bank's governorship goes to a Galician Pole. We hand over the province's schools, its police and its electoral lists."
 AUHDNC_r_the_clubs_of_bohemia:0 "The Clubs of Bohemia"
 AUHDNC_r_the_clubs_of_bohemia_desc:0 "The Czech clubs are told the language of the inner office will be settled by statute in this parliament, and asked in exchange to stop obstructing the estimates. Forty-four votes cross the floor on a promise with a term attached, and the works at Pilsen come with them. If we postpone, they will read the term back to us."
 AUHDNC_r_the_estates_of_the_kingdom:0 "The Estates of the Kingdom"
 AUHDNC_r_the_estates_of_the_kingdom_desc:0 "The conservative great landowners of the kingdom are confirmed in their own body and their nineteen votes enrolled. They ask for precedence, for the historic order of the land, and for a hearing before every statute that touches it; they will have all three. These seats exist only because the curial house exists."
 AUHDNC_r_the_club_of_the_centre:0 "The Club of the Centre"
 AUHDNC_r_the_club_of_the_centre_desc:0 "The Catholic conservatives of the Alpine lands are given the confessional clause in the schools they have demanded since the school law passed over their heads, and their twenty-nine votes are enrolled. The parish takes back what the inspectorate took from it. Our universities will pay in chairs left vacant."
 AUHDNC_r_the_slav_association:0 "The Slav Association"
 AUHDNC_r_the_slav_association_desc:0 "The Slovene and southern conservative deputies come in as one bloc: their credit unions recognised in law, their schools funded from the ordinary estimates, their clergy left alone. Twenty-five votes, and village cooperatives that answer to our lobby. The port city will read every Slovene schoolroom as an act against itself."
 AUHDNC_r_the_mayor_names_his_price:0 "The Mayor Names His Price"
 AUHDNC_r_the_mayor_names_his_price_desc:0 "The Christian Socials are bought with the capital's own affairs: the municipal gas, tram and electricity works confirmed in the city's hands, the school clause enforced inside the walls, and the mayor left to govern as he pleases. Twenty-five votes bring the ministry to two hundred and seven. We take them, and we watch him."
 AUHDNC_r_a_faculty_on_the_adriatic:0 "A Faculty on the Adriatic"
 AUHDNC_r_a_faculty_on_the_adriatic_desc:0 "The Italian deputies are given the law faculty they have asked for, and in the city they asked for it in rather than a mountain town where it can be closed in a day. Eighteen votes, a real university, and an end to the annual riot in the borrowed lecture rooms. The Tyrol will call it a surrender and the port a conquest."
 AUHDNC_r_the_bench_of_the_workers:0 "The Bench of the Workers"
 AUHDNC_r_the_bench_of_the_workers_desc:0 "The eleven deputies of the workers' party are asked for the estimates and paid in the sickness and accident funds, an inspectorate with real powers of entry, and our word that a franchise bill will be laid before this parliament ends. The word is given in the chamber, on the record, by name."
 AUHDNC_r_the_majority_is_declared:0 "The Majority Is Declared"
 AUHDNC_r_the_majority_is_declared_desc:0 "The minister-president rises and declares to the house that this ministry has a majority and intends to legislate with it. The count is read out, club by club, and put on the record. From this sitting our support is a public fact and our own spirit rises or falls with it, whether the majority is a dozen or nothing."
 AUHDNC_r_the_ordinances_referred:0 "The Ordinances Are Referred"
 AUHDNC_r_the_ordinances_referred_desc:0 "The constitutional committee is instructed to examine every emergency ordinance taken since the language crisis and to say plainly which of them were lawful. The ministry undertakes in advance to accept whatever it finds. We give that undertaking before we know the finding, and the German clubs will hold us to it either way."
 AUHDNC_r_the_obstruction_must_end:0 "The Obstruction Must End"
 AUHDNC_r_the_obstruction_must_end_desc:0 "A chamber that cannot close a debate cannot pass a language law, and this ministry was commissioned to pass one. We announce that we will change one of the two things: the rules of the house, or the men in it. Saying it aloud unites every German bench against us before we have chosen which, and costs us stability from that day."
 AUHDNC_r_the_road_of_historic_right:0 "The Road of Historic Right"
 AUHDNC_r_the_road_of_historic_right_desc:0 "The crown will not widen the franchise. It will make the house that exists work, and pay in ancient rights rather than in new voters. The curiae stay, the estates keep their precedence, and the men promised a franchise bill are told the promise belongs to another parliament. The street will make itself heard another way."
 AUHDNC_r_another_body_for_the_unenfranchised:0 "Another Body for the Unenfranchised"
 AUHDNC_r_another_body_for_the_unenfranchised_desc:0 "The general body of non-censitary voters that already sits in this house is enlarged, and a further body is added beside it. The notables keep their curiae; the men without property are given a door that does not open onto anybody else's. It buys us two quiet years and makes a mass party that will never forgive us."
 AUHDNC_r_the_order_of_the_gavel:0 "The Order of the Gavel"
 AUHDNC_r_the_order_of_the_gavel_desc:0 "The standing orders are altered so that a debate can be closed and a division taken. We accept in advance what happened the last time a ministry reached for this instrument: the galleries cleared, the capital in the streets, martial law proclaimed. This time it is proclaimed against Germans."
 AUHDNC_r_the_language_of_the_office:0 "The Language of the Office, Settled by Statute"
 AUHDNC_r_the_language_of_the_office_desc:0 "What was tried by ordinance and withdrawn under pressure is now passed as law: both languages in the inner service of the lands of the kingdom, with a term of grace for officials who have only one. A statute cannot be withdrawn by the next minister in a bad week. The German officials will work to rule from the first day."
 AUHDNC_r_the_bargain_of_lemberg:0 "The Bargain of Lemberg"
 AUHDNC_r_the_bargain_of_lemberg_desc:0 "Galicia's autonomy is confirmed exactly as it stands. The diet keeps the electoral bodies it has, the viceroy keeps his instructions, and the Ruthenian demand is answered with reading rooms instead of a body of its own. Sixty-five votes are held for the rest of this parliament, and the province holds itself down with gendarmes."
 AUHDNC_r_the_patron_at_the_belvedere:0 "The Patron at the Belvedere"
 AUHDNC_r_the_patron_at_the_belvedere_desc:0 "The heir's chancellery is told the crown's Bohemian policy in advance and asked to bless it: the road of the estates is one the next reign can continue. In exchange the common army is not to be touched by this ministry, and we sign that undertaking. From today there are two governments in this capital and both must be paid."
 AUHDNC_r_the_officials_of_the_kingdom:0 "The Officials of the Kingdom"
 AUHDNC_r_the_officials_of_the_kingdom_desc:0 "The service of the kingdom is recruited from men who have both languages, and the examination is made the gate rather than the exception. Within a decade the district offices will look like the districts they administer. The German associations open a fund to pay the men who resign rather than sit the paper."
 AUHDNC_r_the_estates_endow_the_kingdom:0 "The Estates Endow the Kingdom"
 AUHDNC_r_the_estates_endow_the_kingdom_desc:0 "The land's own finances are put in order by a levy the estates vote upon themselves, and the kingdom pays thereafter for its own schools and its own roads. The treasury is relieved of a standing quarrel. In exchange the estates expect to be consulted before every statute that touches the land."
 AUHDNC_r_the_landwehr_of_the_kingdoms:0 "The Landwehr of the Kingdoms"
 AUHDNC_r_the_landwehr_of_the_kingdoms_desc:0 "The second-line army is recruited, trained and commanded in the lands that pay for it, and its officers are commissioned out of schools the diets endow. The common War Minister signs the order against his own department and puts his protest in writing first. The common army will treat these regiments as armed national clubs."
 AUHDNC_r_the_house_that_works:0 "The House That Works"
 AUHDNC_r_the_house_that_works_desc:0 "The ministry records that a full session has been carried through without a single emergency ordinance, and asks the crown to say so from the throne. It is a small sentence and it is the whole point of this government. The claim holds only while the gavel holds and the count stays above the line."
 AUHDNC_r_the_road_of_the_ballot:0 "The Road of the Ballot"
 AUHDNC_r_the_road_of_the_ballot_desc:0 "Rather than close the debate with a gavel, the crown will drown the obstruction in voters: equal manhood suffrage, granted before the street asks for it and in the crown's own name. The Polish Club walks out the same afternoon, and the landowners' bench goes with the curial house. The count falls by eighty-four."
 AUHDNC_r_constituencies_of_equal_weight:0 "Constituencies of Equal Weight"
 AUHDNC_r_constituencies_of_equal_weight_desc:0 "The districts are drawn on the number of men and not on the map of the nations, the whole house is re-elected upon them, and this ministry accepts whatever arithmetic gives it. It gives a chamber of five hundred and sixteen in which our own benches number one hundred and thirty-one. Two hundred and fifty-nine make a majority."
 AUHDNC_r_the_club_walks_out:0 "The Club Walks Out"
 AUHDNC_r_the_club_walks_out_desc:0 "The ministry records in the journal that the Galician delegation has left it, and refuses to buy that delegation back by restoring the curiae. The price list is torn up and what we spent on Lemberg every month returns to the treasury. In exchange every order we send east will be answered slowly, badly, or not at all."
 AUHDNC_r_the_ruthenian_benches:0 "The Ruthenian Benches"
 AUHDNC_r_the_ruthenian_benches_desc:0 "The Ruthenian deputies the new franchise returns are taken as partners rather than as a nuisance: a body of their own at Lemberg, chairs at the university, a viceroy instructed to apply both and not to lose the papers. Twenty-eight votes and a peasant bank. The Polish national democrats will call it a partition by instalments."
 AUHDNC_r_the_agrarians_and_the_workers:0 "The Agrarians and the Workers"
 AUHDNC_r_the_agrarians_and_the_workers_desc:0 "The new chamber's two Czech benches, the agrarians and the social democrats, are given the land bank and the factory inspectorate they came to this parliament for. Fifty votes. The estates who would have received the royal oath learn that their ministry has made terms with a peasant union and a trade union."
 AUHDNC_r_the_bench_that_carries_the_budget:0 "The Bench That Carries the Budget"
 AUHDNC_r_the_bench_that_carries_the_budget_desc:0 "The fifty deputies of the German workers' party, the one German bench that will sit down with Slavs, are asked to carry the budget. They are paid in the inspectorate, in the funds, and in an undertaking on the army estimates. The majority stands exactly at the line, and the mayor's ninety-five are closed to us."
 AUHDNC_r_the_crownland_at_the_san:0 "A Crownland at the San"
 AUHDNC_r_the_crownland_at_the_san_desc:0 "The province is divided at the river: a Polish land in the west, a Ruthenian land in the east, each with its own diet and viceroy. The claim of the old province over the eastern districts is struck out in the same act. Berlin reads a Ruthenian crownland on its Polish frontier as a provocation, and the Polish Club is lost to us."
 AUHDNC_r_galicia_undivided:0 "Galicia Undivided"
 AUHDNC_r_galicia_undivided_desc:0 "The province stays one, with two nations inside it and a viceroy instructed to hold the balance and to satisfy nobody. Every concession granted to one is entered in the other's ledger as a loss, so neither can be brought past a bare tolerance of us. It is a standing tax, not a safe default."
 AUHDNC_r_the_realists_and_the_forgeries:0 "The Realists and the Forgeries"
 AUHDNC_r_the_realists_and_the_forgeries_desc:0 "The deputy who broke the ritual-murder verdict is given the papers of the treason trial in the south, and takes the common foreign ministry's documents apart before the Delegations. The forgeries are read out to the men who signed for them. The Ballhausplatz will never forgive us."
 AUHDNC_r_the_law_carried_by_the_majority:0 "The Law Carried in the Chamber"
 AUHDNC_r_the_law_carried_by_the_majority_desc:0 "The language statute the German benches have obstructed for a decade is put to a division on the floor of the new chamber: no gavel, no ordinance, no withdrawal. We accept that a flooded house is still a house, and that a house can be talked out. If the workers' bench has been paid and the country is quiet, we have a chance."
 AUHDNC_r_the_house_that_votes:0 "The House That Votes"
 AUHDNC_r_the_house_that_votes_desc:0 "The ministry records that a full session has been carried by votes alone, in a chamber elected by every man in the land, and asks the crown to say so from the throne. No other ministry of this reign has been able to say it. The workers' bench renews its price at every opening and the army estimates will feel it. We are content."
 AUHDNC_r_the_cadastre_of_moravia:0 "The Moravian Precedent Invoked"
 AUHDNC_r_the_cadastre_of_moravia_desc:0 "The four provincial acts of the margraviate are laid on the table of the house, and we state the obvious conclusion: what a diet agreed there, a diet can agree at Prague. We do not repeal the Moravian guarantee, we cite it, and we undertake to bring in the bill this session. The Czech clubs will hold us to the calendar."
 AUHDNC_r_the_settlement_of_the_kingdom:0 "The Settlement of the Kingdom"
 AUHDNC_r_the_settlement_of_the_kingdom_desc:0 "The Moravian rolls are pressed on the kingdom itself: two national bodies in the diet, two school administrations, and the boundary of the office languages drawn on the rolls of men instead of the map of villages. The legal vacuum in which the kingdom has been administered ends today. Budapest's answer will be a bill."
 AUHDNC_r_the_diet_of_the_kingdom:0 "The Diet of the Kingdom"
 AUHDNC_r_the_diet_of_the_kingdom_desc:0 "The diet at Prague receives competences the imperial chamber gives up: schools, roads, the land's own finances. It will sit on the new national rolls and it will legislate. If the German bloc of the land is not reconciled, the obstruction simply moves from one chamber to the other."
 AUHDNC_r_a_minister_for_bohemia:0 "A Minister for Bohemia"
 AUHDNC_r_a_minister_for_bohemia_desc:0 "The kingdom is given at the council table what the eastern province has had for a generation: a minister of its own, without portfolio, who signs for its affairs. The precedent already exists, which is the whole argument for it and the whole danger. Every other land will ask for one, and so will Budapest."
 AUHDNC_r_the_bohemian_germans_get_their_price:0 "The Bohemian Germans Get Their Price"
 AUHDNC_r_the_bohemian_germans_get_their_price_desc:0 "The German bloc of the kingdom is bought: guaranteed seats on the new rolls, a school fund from the ordinary estimates, and an undertaking that no office in its districts is filled from the other roll. The secession societies lose their best argument. The Czech clubs will call it a frontier drawn inside their own crown."
 AUHDNC_r_the_frontier_is_not_drawn:0 "The Frontier Is Not Drawn"
 AUHDNC_r_the_frontier_is_not_drawn_desc:0 "The division of the kingdom into national circles is refused outright. The crown of this land is one crown and it will not be cut into districts to suit a census. The historic-right argument is preserved whole for the ceremony we intend to hold, which is precisely why we refuse. The secession movement moves to its last stage."
 AUHDNC_r_the_diet_of_carniola:0 "The Diet of Carniola"
 AUHDNC_r_the_diet_of_carniola_desc:0 "Carniola receives the competences the kingdom has received, and the inner service of its offices is put into the language its people speak. The Styrian and Carinthian Germans will read it as the loss of a frontier, and the port city as one more act against an Italian municipality. We settle the province and unsettle the coast."
 AUHDNC_r_the_lands_of_the_crown:0 "The Lands of the Crown"
 AUHDNC_r_the_lands_of_the_crown_desc:0 "The crown states that the kingdom, the margraviate and the duchy are three lands of one crown, and calls their three diets into a standing conference to legislate their common affairs. The Germans of the duchy and the margraviate will read that as one kingdom swallowing two lands. Budapest fears it more than any statute."
 AUHDNC_r_the_chairs_the_estates_endow:0 "The Chairs the Estates Endow"
 AUHDNC_r_the_chairs_the_estates_endow_desc:0 "The estates of the lands vote endowments out of their own levy for chairs in the margraviate: law, medicine, the technical faculties. The crown confirms them and asks the imperial chamber for nothing. Doubling institutions is demanded everywhere and financed nowhere, and we finance it out of a purse that is not the treasury's."
 AUHDNC_r_the_kingdom_lights_its_own_lines:0 "The Kingdom Lights Its Own Lines"
 AUHDNC_r_the_kingdom_lights_its_own_lines_desc:0 "The branch lines the clubs were promised are built electrified, and the current is bought from works inside the kingdom rather than imported from the Reich. The engineers we are about to train will have somewhere to work. The common army complains that a second-rate gauge is laid where a strategic line was voted."
 AUHDNC_r_the_junction_at_prague:0 "The Junction at Prague"
 AUHDNC_r_the_junction_at_prague_desc:0 "The capital of the kingdom is given the through station and the goods yards it has been rebuilding piecemeal for a generation. Trains will cross the city instead of terminating in it. The canal lobby will read the money going into rails within a fortnight, and the agrarian benches will ask us what became of the river works."
 AUHDNC_r_the_coal_of_the_kingdom:0 "The Coal of the Kingdom"
 AUHDNC_r_the_coal_of_the_kingdom_desc:0 "The coal and iron basin of the north-east is put under the state's arbitration, and the pits are told what the wage will be. The ironworks and the collieries stop bleeding a strike every second winter. The arbitration also makes a generation of miners who know the state can be forced to the table."
 AUHDNC_r_the_oil_of_boryslaw:0 "The Oil of the Carpathian Field"
 AUHDNC_r_the_oil_of_boryslaw_desc:0 "The Carpathian field is given a refining industry inside the province instead of shipping its crude out in tank cars. The stills go up beside the wells and the province keeps the margin for the first time. Whether its own administration or a Polish one works the field afterwards depends on the road we are on."
 AUHDNC_r_the_societies_are_licensed:0 "The Societies Are Licensed"
 AUHDNC_r_the_societies_are_licensed_desc:0 "The national gymnastic and shooting societies are licensed as auxiliaries of the second line instead of watched as conspiracies. They drill anyway; from today they drill with our rifles and our instructors, and their rolls are in our files. If this ring is ever broken, they are the cadres of whatever comes next."
 AUHDNC_r_the_balloon_park_of_the_kingdom:0 "The Balloon Park of the Kingdom"
 AUHDNC_r_the_balloon_park_of_the_kingdom_desc:0 "The second line is given an aeronautical detachment paid for by the diets: captive balloons, an airship shed, and motors from the kingdom's own electrical works. The observers are trained by the balloon officer of the military aeronautical institute. The common army's technical bureau calls it an encroachment, and it is one."
 AUHDNC_r_the_precedent_is_read_in_budapest:0 "The Precedent Is Read in Budapest"
 AUHDNC_r_the_precedent_is_read_in_budapest_desc:0 "The crown accepts in writing that what it has granted in one half will be quoted in the other, and instructs its common ministers to prepare for the bill that is coming. This is the sentence the crown has spent a reign refusing to write. We shall negotiate worse on everything until the account arrives."
 AUHDNC_r_the_quota_is_the_answer:0 "The Quota Is the Answer"
 AUHDNC_r_the_quota_is_the_answer_desc:0 "Budapest names its price for silence on the kingdom and the price is money: the other half's share of the common budget is cut and ours is raised. The settlement is renewed without a crisis, and the army and navy credits are dearer for the rest of the era. We would rather pay in florins than in the constitution of the kingdom."
 AUHDNC_r_hold_the_share_of_the_settlement:0 "Hold the Share of the Settlement"
 AUHDNC_r_hold_the_share_of_the_settlement_desc:0 "The share stays where the last settlement fixed it. Budapest is paid instead in things this crown does not value: the Bank's governorship, industrial orders placed in the other half, refactions at the port on the other side. The Hungarian delegation will begin refusing the army and navy credits within the year."
 AUHDNC_r_zagreb_asks_the_same:0 "Zagreb Asks the Same"
 AUHDNC_r_zagreb_asks_the_same_desc:0 "The address of the southern diet, asking for what the kingdom received, is answered by the crown in its own name rather than forwarded to the other capital. We spend our whole political credit on a document that may simply be returned to us. If it succeeds the settlement of the south is reopened."
 AUHDNC_r_the_south_is_budapests_affair:0 "The South Is Budapest's Affair"
 AUHDNC_r_the_south_is_budapests_affair_desc:0 "The address is forwarded unopened to the other half's minister-president, and the crown states that it has no competence in the matter. The other half is grateful and its settlement is easier. The southern deputies go over to its opposition for good, and we are left without a friend at Zagreb."
 AUHDNC_r_the_nationality_deputies_are_received:0 "The Nationality Deputies Are Received"
 AUHDNC_r_the_nationality_deputies_are_received_desc:0 "The record delegation of nationality deputies returned by the other half's chamber is received at the Hofburg. The crown says publicly that it has heard them, and forwards their case to the ministry that will refuse it. We are confessing in the same act that we cannot protect them."
 AUHDNC_r_the_bank_stays_common:0 "The Bank Stays Common"
 AUHDNC_r_the_bank_stays_common_desc:0 "The note-issuing bank stays one institution with two seats and bilingual notes, and its governorship is used as a card rather than surrendered as a principle. The separate bank the other half demands is refused by statute. One currency for one market is worth everything here and nothing to a Hungarian grain grower."
 AUHDNC_r_the_settlement_is_renewed:0 "The Settlement Is Renewed"
 AUHDNC_r_the_settlement_is_renewed_desc:0 "The decennial settlement is renewed under a ministry the other half despises, and the common market is kept whole. Whatever was fixed about the share is now fixed for a decade. Every clause was dictated to a chamber the Germans had walked out of, and will be paid for twice: once at the table and once in the newspapers."
 AUHDNC_r_the_recruit_bill_is_not_ours:0 "The Recruit Bill Is Not Ours"
 AUHDNC_r_the_recruit_bill_is_not_ours_desc:0 "The Austrian chamber passes its half of the recruit bill on the express condition that the other half passes its own, and the crown is told it will get no ordinance from us to cover the difference. Our majority is seen to keep its word. The contingent stays frozen, and the men we do not call up we shall not have."
 AUHDNC_r_a_slav_vienna_and_the_powers:0 "A Slav Vienna and the Powers"
 AUHDNC_r_a_slav_vienna_and_the_powers_desc:0 "The common foreign ministry is instructed that the monarchy's internal settlement is now a fact of its foreign policy and will be defended as one. No power, ally or otherwise, is to be received on the subject of our own house. An ally told that trusts us less on everything else, and we accept the loss."
 AUHDNC_r_the_congress_at_prague:0 "The Congress at Prague"
 AUHDNC_r_the_congress_at_prague_desc:0 "The congress of the Slav nations meets in the kingdom's capital under the crown's own patronage instead of under the supervision of its police. Delegates come from Petersburg and Warsaw and Zagreb and are received by a sovereign, not by a commissioner. Berlin will read a Slav conference held on its doorstep by its only ally."
 AUHDNC_r_the_consulate_at_lemberg:0 "The Consulate at Lemberg"
 AUHDNC_r_the_consulate_at_lemberg_desc:0 "The crown decides which of the two Ruthenian orientations it will fund, the one that looks to Kiev or the one that looks across the frontier, and instructs its police accordingly. Funding the national movement buys a loyal province; funding the other hands its schools to a movement answering to a foreign consulate."
 AUHDNC_r_berlin_reads_the_lists:0 "Berlin Reads the Lists"
 AUHDNC_r_berlin_reads_the_lists_desc:0 "The ally's objections to a ministry resting on Slav clubs are received, acknowledged in the politest possible terms, and not acted on. We refuse his mediation in any internal question and write that into the standing instructions of our embassies. The alliance will hold, and it will be colder."
 AUHDNC_r_the_littoral_and_the_ally_across_the_water:0 "The Littoral and the Ally Across the Water"
 AUHDNC_r_the_littoral_and_the_ally_across_the_water_desc:0 "The crown decides how the port city is to be administered: as an Italian municipality with a Slovene hinterland, or as a state city with two nations and neither in charge. Whichever we choose, the other nation pays. The ally has his own understanding with a third power about this coast, and cannot be bought twice."
 AUHDNC_r_the_bargain_at_the_straits:0 "The Bargain at the Straits"
 AUHDNC_r_the_bargain_at_the_straits_desc:0 "Before anything is proclaimed in the south, the understanding is settled at Petersburg and a compensation negotiated with the neighbour; only then is the sovereignty bought from the Porte. It is expensive, slow and unheroic, and it means no ultimatum and no debt to an ally. To our own generals it looks like weakness."
 AUHDNC_r_the_tariff_war_is_ended:0 "The Tariff War Is Ended"
 AUHDNC_r_the_tariff_war_is_ended_desc:0 "The frontier is reopened to the neighbour's livestock on a long treaty, and the consumer schedule is preferred to the agrarian one. Meat gets cheaper in every industrial town in this half and the neighbour stops looking for a harbour that is not ours. The landowners of the other half pay for it, and will say so."
 AUHDNC_r_the_monarchy_is_not_a_second:0 "The Monarchy Is Not a Second"
 AUHDNC_r_the_monarchy_is_not_a_second_desc:0 "When the ally offers to end the crisis by presenting our demand at Petersburg himself, the answer is that this monarchy settles its own affairs. The crisis lasts months longer and costs us stability and nerve, and at the end of it we owe nobody anything. Without the understanding, the neighbour will not sign at all."
 AUHDNC_r_the_rescript_renewed:0 "The Rescript Renewed"
 AUHDNC_r_the_rescript_renewed_desc:0 "The crown reissues in its own hand the promise its ministers once made it withdraw: it recognises the ancient rights of the kingdom and declares itself ready to take the oath in its capital. This is the largest thing this reign has ever been asked to unsay. The other half will demand to know what it receives."
 AUHDNC_r_the_regalia_return:0 "The Regalia Return"
 AUHDNC_r_the_regalia_return_desc:0 "The crown and the regalia of the kingdom leave the court's keeping and go back to the cathedral above the river, and the chamber that holds them is given to the diet with the keys. Every schoolchild in the land will be taken to see them. The German associations will read a crown carried through those streets as a declaration."
 AUHDNC_r_the_estates_are_summoned:0 "The Estates Are Summoned"
 AUHDNC_r_the_estates_are_summoned_desc:0 "The estates of the kingdom are summoned in their ancient order to receive the oath: the prelates, the lords, the knights and the towns, in that order and no other. The German nobility of the land sits among them and will attend. It is a monument to the curial house, and the workers' and agrarian benches will boycott it to a man."
 AUHDNC_r_the_diet_elects_the_deputation:0 "The Diet Elects the Deputation"
 AUHDNC_r_the_diet_elects_the_deputation_desc:0 "The diet elected on the new rolls chooses the deputation that will receive the oath, and the estates are not asked. A king of this land will be crowned by men chosen by every voter in it. The nobility that would have crowned him will not attend, and a coronation the old families boycott has a hole in the middle of it."
 AUHDNC_r_the_oath_at_the_hradschin:0 "The Oath at the Hradschin"
 AUHDNC_r_the_oath_at_the_hradschin_desc:0 "The king goes to the kingdom's capital, takes the oath on its ancient rights before its diet and its estates, and is crowned with its own crown. The sovereign who refused it for a lifetime is the man kneeling. The kingdom is settled for good, and the German districts that will not kneel with it cease to be held as our own."
 AUHDNC_r_the_house_is_not_the_state:0 "The House Is Not the State"
 AUHDNC_r_the_house_is_not_the_state_desc:0 "The experiment is written off. The chamber is adjourned, the emergency paragraph becomes the ordinary instrument of government, and the ministry is made of officials again. Order returns within a fortnight and the estimates are signed by men nobody elected. Every crownland settlement we drafted is void."
 AUH_dnc_the_question_before_the_crown:0 "The Question Before the Crown"
 AUH_dnc_the_question_before_the_crown_desc:0 "The realm has been asked on what terms it is held together, and until it answers every office in it is waiting."
 AUH_a_the_settlement_is_the_constitution:0 "The Settlement Is the Constitution"
 AUH_a_the_settlement_is_the_constitution_desc:0 "Nothing may be done that both halves have not signed, so nothing is ever done quickly and nothing warlike is done at all."
 AUH_a_the_ministry_of_the_offices:0 "A Ministry of the Offices"
 AUH_a_the_ministry_of_the_offices_desc:0 "For the moment the heads of section govern, and they govern quickly, because nobody has to be consulted."
 AUH_a_the_ministry_without_a_party:0 "The Ministry Without a Party"
 AUH_a_the_ministry_without_a_party_desc:0 "A government nobody voted for is a government nobody must defend, and the parties have learned that obstruction is free."
 AUH_a_the_ordinance_budget:0 "The Budget by Ordinance"
 AUH_a_the_ordinance_budget_desc:0 "The estimates are law because the minister signed them, and the treasury is spending on that signature."
 AUH_a_governs_by_ordinance:0 "Government by Ordinance"
 AUH_a_governs_by_ordinance_desc:0 "The instrument was meant for emergencies and has become the ordinary way of carrying business; the register never resets."
 AUH_a_the_money_that_cools:0 "The Money That Cools"
 AUH_a_the_money_that_cools_desc:0 "A province being built in is a province with something to lose, and the quarrel goes quiet while the contracts run."
 AUH_a_the_realm_administers_itself:0 "The Realm Administers Itself"
 AUH_a_the_realm_administers_itself_desc:0 "The service is the state; the parties are what happens outside it, and they are recruiting hard against us."
 AUH_a_the_enumerators:0 "The Enumerators in the Field"
 AUH_a_the_enumerators_desc:0 "Every household visited, every answer entered on the ministry's own form, in one season."
 AUH_a_the_exception_becomes_ordinary:0 "The Exception Becomes Ordinary"
 AUH_a_the_exception_becomes_ordinary_desc:0 "Each proclamation is cheaper to sign than the last and dearer to answer for than the last."
 AUH_a_the_garrison_answers:0 "The Garrison Answers for Order"
 AUH_a_the_garrison_answers_desc:0 "Juries suspended, assemblies licensed, and a colonel signing what a magistrate used to sign."
 AUH_a_the_roll_the_offices_keep:0 "The Roll the Offices Keep"
 AUH_a_the_roll_the_offices_keep_desc:0 "One register for every adult man, and the two state peoples are now two entries among several."
 AUH_a_the_schoolmasters_bill:0 "The Schoolmaster's Bill"
 AUH_a_the_schoolmasters_bill_desc:0 "Every nation written into the column has acquired a claim on a schoolmaster, and they are all presenting it."
 AUH_a_the_chamber_of_all:0 "The Chamber of All"
 AUH_a_the_chamber_of_all_desc:0 "The widest franchise in Europe, and the curial majorities of the Germans and the Poles gone with it."
 AUH_a_the_realm_at_its_ceiling:0 "The Realm at Its Ceiling"
 AUH_a_the_realm_at_its_ceiling_desc:0 "Everything that both halves will sign has been signed, and nothing further can be attempted."
 AUH_a_the_compromise_survived:0 "The Compromise Survived"
 AUH_a_the_compromise_survived_desc:0 "Whole, solvent, with one army and two parliaments, and nothing decided that could not be signed twice."
 AUH_a_the_laboratory_that_stayed:0 "The Laboratory That Stayed"
 AUH_a_the_laboratory_that_stayed_desc:0 "The institute did not recognise the finding; the treasury paid the assistants anyway, and the man stayed."
 AUH_a_no_court_between_the_halves:0 "No Court Between the Halves"
 AUH_a_no_court_between_the_halves_desc:0 "The Settlement provided no arbitration procedure of any kind, so every common decision is taken twice or not at all."
 AUH_a_the_silent_season:0 "The Silent Season"
 AUH_a_the_silent_season_desc:0 "The two chanceries have stopped speaking to each other and everything common is waiting for one of them to blink."
 AUH_a_the_counties_refuse:0 "The Counties Refuse"
 AUH_a_the_counties_refuse_desc:0 "More than half the counties have stopped applying orders, collecting taxes and handing over recruits."
 AUH_a_a_weapon_we_do_not_mean_to_fire:0 "A Weapon We Do Not Mean to Fire"
 AUH_a_a_weapon_we_do_not_mean_to_fire_desc:0 "Universal suffrage is in the programme of the kingdom's own government and the gentry are counting their voters."
 AUH_a_the_scene_in_the_hall:0 "The Scene in the Hall"
 AUH_a_the_scene_in_the_hall_desc:0 "Home guards clearing a parliament under a royal commissioner is the founding scene of a generation's argument against the Settlement."
 AUH_a_the_secret_pact:0 "The Secret Pact"
 AUH_a_the_secret_pact_desc:0 "Two written conditions, no witnesses, and a paper that finishes the men who signed it if it is ever printed."
 AUH_a_the_quota_that_rises:0 "The Quota That Rises"
 AUH_a_the_quota_that_rises_desc:0 "One market of fifty millions, a larger share of the common charge for the kingdom, and every Hungarian demand now on the table at a discount."
 AUH_a_the_bank_question_deferred:0 "The Bank Question Deferred"
 AUH_a_the_bank_question_deferred_desc:0 "One bank of issue, a premier who resigned and could not leave, and a caretaker government running the kingdom."
 AUH_a_the_estimates_by_prerogative:0 "The Estimates by Prerogative"
 AUH_a_the_estimates_by_prerogative_desc:0 "The Crown carried the common budget, the yards began, and the register of ordinances took another entry."
 AUH_a_the_orders_go_to_the_kingdom:0 "The Orders Go to the Kingdom"
 AUH_a_the_orders_go_to_the_kingdom_desc:0 "A guaranteed industrial share across the river has made the fleet a Hungarian interest, and the lobby wants the next programme too."
 AUH_a_the_slips_must_be_built_first:0 "The Slips Must Be Built First"
 AUH_a_the_slips_must_be_built_first_desc:0 "New yards cannot lay a keel until they exist, and the first years of the programme buy concrete."
 AUH_a_the_officials_with_suitcases:0 "The Officials with Suitcases"
 AUH_a_the_officials_with_suitcases_desc:0 "An administration without a local elite, and a narrow gauge that caps everything moving toward the frontier."
 AUH_a_the_diet_deferred:0 "The Diet Deferred"
 AUH_a_the_diet_deferred_desc:0 "Two confessional autonomies and no political one; the Muslim organisation and the Serb notables now ask jointly."
 AUH_a_the_sanction_that_costs_the_sender:0 "The Sanction That Costs the Sender"
 AUH_a_the_sanction_that_costs_the_sender_desc:0 "Their livestock is shut out, their trade has gone west, their guns are ordered in Paris, and we have no lever left."
 AUH_a_the_rival_court:0 "The Rival Court"
 AUH_a_the_rival_court_desc:0 "The heir keeps his own chancellery, his own soldiers and his own foreign policy, and the ministry is consulted last."
 AUH_a_the_nation_we_refused_to_count:0 "The Nation We Refused to Count"
 AUH_a_the_nation_we_refused_to_count_desc:0 "A people of over two millions is entered on the German lists, and the refusal is written down as a refusal."
 AUH_a_the_hidden_year:0 "The Hidden Year"
 AUH_a_the_hidden_year_desc:0 "The police fired on the Ring; the workers' party has stopped asking for a franchise and started asking for a state."
 AUH_a_the_gesture_of_moderation:0 "The Gesture of Moderation"
 AUH_a_the_gesture_of_moderation_desc:0 "The garrisons are withdrawn and the survey abandoned; the two southern kingdoms can now share a frontier."
 AUH_a_the_wedge_kept:0 "The Wedge Kept"
 AUH_a_the_wedge_kept_desc:0 "Garrisons in the strip and the survey taken up again; a mountain line costs enormously and everyone is watching it."
 AUH_a_the_second_of_berlin:0 "The Second of Berlin"
 AUH_a_the_second_of_berlin_desc:0 "The crisis was closed by the ally's note; the prestige is ours and the initiative is not."
 AUH_a_the_price_of_a_quiet_frontier:0 "The Price of a Quiet Frontier"
 AUH_a_the_price_of_a_quiet_frontier_desc:0 "Belgrade was paid, the frontier reopened, and no cover was owed to anybody or offered by anybody."
 AUH_air_the_aeronautical_establishment:0 "The Aeronautical Establishment"
 AUH_air_the_aeronautical_establishment_desc:0 "The balloon park of the Arsenal now answers to the General Staff and carries a line of its own in the estimates. It has a name, a commander and a place in the order of battle. It therefore also has somebody in the War Ministry who must defend it every year, and nobody there wants the job."
 AUH_air_flight_by_subscription:0 "Flight by Subscription"
 AUH_air_flight_by_subscription_desc:0 "The society raises the money, the club takes the collection and the privy purse adds the Crown's gift; the state gives nothing and owns nothing. The army's fliers are guests of a club, and the General Staff says so in writing every year. Everything the air arm will ever want must be bought from somebody who already owns a works."
 AUH_air_the_line_in_the_estimates:0 "The Line in the Estimates"
 AUH_air_the_line_in_the_estimates_desc:0 "An aeronautical line stands in the estimates of the common army and buys workshops, ground and a claim on the treasury. It must be re-won before both Delegations every year, and the Minister of War sits on the other side of the table. Transleithania pays its quota of a hall it will never see, and says so at every sitting."
 AUH_air_the_airship_service:0 "The Airship Service"
 AUH_air_the_airship_service_desc:0 "The Monarchy flies gasbags: a ship that can hold its place over a marching corps for a day, and a crew of thirty to keep it there. Everything we fly is slow, enormous, and cannot go anywhere it has not first built a hall. What it sees, it sees for a whole day, and no aeroplane in Europe can say that yet."
 AUH_air_heavier_than_air:0 "Heavier than Air"
 AUH_air_heavier_than_air_desc:0 "There is no aeroplane industry in the Monarchy, only workshops. Every machine is a prototype, every prototype is a funeral risk, and nothing we own can stay up long enough to reach the next corps. We are paying to find out whether the thing can be done at all, and the finding out is the whole of the return."
 AUH_air_the_club_in_the_colours:0 "The Club in the Colours"
 AUH_air_the_club_in_the_colours_desc:0 "A balloon in the Monarchy's colours over a foreign capital is worth a regiment of newspaper, and the club that flies it takes serving officers as guests. It is also a lobby, and it lobbies against the War Ministry as often as for it. Its money is other people's money and comes in by subscription, so it never builds anything."
 AUH_air_the_ship_in_the_line:0 "The Ship in the Line"
 AUH_air_the_ship_in_the_line_desc:0 "One pattern is off the experimental books and into the order of battle, with a hall, a crew, a mooring party and a number of its own. A corps commander may now expect it at manoeuvres and plan around what it sees. A hall, hydrogen and thirty men are charged to the army every day, whether the ship flies or not."
 AUH_air_the_mill_owners_laboratory:0 "The Mill-Owner's Laboratory"
 AUH_air_the_mill_owners_laboratory_desc:0 "Two men in a Bohemian mill town build a wing that flies by itself before an engine is allowed near it. The laboratory is private, the mill pays for it, and the army is a guest there with no claim on a single drawing. Everything that leaves that shed is a one-off built by a millwright to a drawing he keeps."
 AUH_air_the_series_order:0 "The Series Order"
 AUH_air_the_series_order_desc:0 "A works in a mill town has been asked to become a factory, and the treasury is paying for the tooling of a machine nobody has yet kept in the air for ten minutes. The pilots are on course before the first airframe is on the bench. If it flies, we are two years ahead of everyone; if it does not, we have bought a barn."
 AUH_air_the_flying_school:0 "The Flying School"
 AUH_air_the_flying_school_desc:0 "A fixed course, a certificate signed by the establishment and a badge on the tunic; a corps commander may now ask for a flier by name off a list. The school has ground, a hangar and an establishment of its own. It produces officers who want machines, and machines are a line in next year's estimates."
 AUH_air_a_flying_troop:0 "A Flying Troop"
 AUH_air_a_flying_troop_desc:0 "The fliers are out of the establishment and into the order of battle: companies, a commander of their own, and a number no Minister of War can strike out with a pen. The arm answers for its own accidents and its own schooling. The guns have lost their trained observers to it and say so at every inspection."
 AUH_air_one_word_of_command:0 "One Word of Command"
 AUH_air_one_word_of_command_desc:0 "The new troop drills and flies in the German of service, exactly as every other arm of the common army does. One word for one order, and one file closed before it was opened. It is also one more grievance, and it is filed in four languages."
 AUH_air_the_dove_that_left:0 "The Dove That Left"
 AUH_air_the_dove_that_left_desc:0 "The constructor could not sell his monoplane at home. The drawings, the licence and the man's patience have gone north and south, and his machine will be built under other cockades before it is built under ours. We will buy it back later at a price somebody else sets."
 AUH_air_the_ministry_obstructs:0 "The Ministry Obstructs"
 AUH_air_the_ministry_obstructs_desc:0 "The War Ministry has been overruled and is not reconciled. Every requisition goes twice round the Ring before it is signed, and the establishment's commander spends his week writing letters instead of flying."
 AUH_air_the_machine_is_at_the_bottom:0 "The Machine Is at the Bottom"
 AUH_air_the_machine_is_at_the_bottom_desc:0 "A wing caught the water in a turn the reservoir was too small to allow, and the machine went down in eleven metres of it. The constructor was pulled out; the engine was not. The subscription has nothing left to show a subscriber."
 AUH_air_the_ordinance_of_many_tongues:0 "The Ordinance of Many Tongues"
 AUH_air_the_ordinance_of_many_tongues_desc:0 "The troop drills in whatever its fliers speak, and only its flight orders stay in German. Every other arm of the common army has now written to ask why it may not do the same."
 AUH_arm_the_three_armies:0 "The Three Armies"
 AUH_arm_the_three_armies_desc:0 "A common army, a Landwehr and a Honved: three establishments, three schools of instruction, three sets of estimates. They mobilise in parallel and they duplicate everything else."
 AUH_the_frozen_contingent_1:0 "The Frozen Contingent"
 AUH_the_frozen_contingent_1_desc:0 "The number of men we may call to the colours each year was fixed by a military law that neither parliament will reopen without being paid, and the population has grown past it by millions."
 AUH_the_frozen_contingent_2:0 "The Contingent Eased"
 AUH_the_frozen_contingent_2_desc:0 "One notch has been bought out of the old military law. The classes called up are larger than the law intended and smaller than the realm needs."
 AUH_the_frozen_contingent_3:0 "The Contingent Nearly Free"
 AUH_the_frozen_contingent_3_desc:0 "The old military law survives only as a formality that the depots no longer take seriously. What is left of it is a signature we have not yet obtained."
 AUH_arm_the_generalstab:0 "The General Staff on the Ring"
 AUH_arm_the_generalstab_desc:0 "The staff draws its own credit, keeps its own railway section and writes the deployments without asking the War Ministry first. It answers to the Crown, and therefore to no auditor."
 AUH_arm_the_school_of_beck:0 "The School of the Old Chief"
 AUH_arm_the_school_of_beck_desc:0 "Modernisation is bought in instalments and war is not bought at all. The regiments dig, the depots fill, and no plan on the shelf opens with an attack."
 AUH_arm_the_staff_of_the_administrator:0 "The Staff of the Inspector"
 AUH_arm_the_staff_of_the_administrator_desc:0 "The staff has become an office of works, railways and returns. Nothing is out of order, the fortress files are immaculate, and nobody there is thinking about a war."
 AUH_arm_the_preventive_war_memoranda:0 "The Memoranda of the Chief"
 AUH_arm_the_preventive_war_memoranda_desc:0 "The chief of the General Staff submits a paper demanding a preventive war every time the Balkans move, and copies it to the Belvedere. Refusing him costs the government something each time."
 AUH_arm_the_kriegsschule:0 "The Staff School"
 AUH_arm_the_kriegsschule_desc:0 "The red trouser stripe is reachable by an officer with neither a particle in his name nor German at home. A staff corps recruited on merit is a staff corps the court no longer entirely owns."
 AUH_arm_the_two_frontiers_left_open:0 "Two Frontiers Left Open"
 AUH_arm_the_two_frontiers_left_open_desc:0 "The frontier commission reported on three frontiers and the estimates paid for one. The other two stand exactly as they were, and every neighbour who reads a map knows which ones."
 AUH_arm_the_alpine_barrier:0 "The Barrier of the Passes"
 AUH_arm_the_alpine_barrier_desc:0 "The fortress credit has gone to the Tyrol. The passes are closed against the ally whose treaty we renew and whose word we do not trust, and he has read the works."
 AUH_arm_the_galician_bastion:0 "The Bastion on the San"
 AUH_arm_the_galician_bastion_desc:0 "The armoured works and the strategic lines that feed them are finished. The credit that finished them is the credit every other building programme in the realm was waiting for."
 AUH_arm_the_southern_front:0 "The Watch on the Save"
 AUH_arm_the_southern_front_desc:0 "Permanent fortified crossings on the river and heavy batteries over the bay. Garrison duty in the south is unpopular at home and provocative abroad."
 AUH_arm_the_ersatzreserve:0 "The Reserve Classes"
 AUH_arm_the_ersatzreserve_desc:0 "We take the number the law allows and train more of them, for less time, than the law was written to permit. The establishment is fuller and thinner at the same moment."
 AUH_arm_one_oath_and_one_flag:0 "One Oath and One Flag"
 AUH_arm_one_oath_and_one_flag_desc:0 "The language of service follows the men the regiment is recruited from, and stops at the orderly room door. Budapest reads the limit as a refusal and prices every future military bill accordingly."
 AUH_arm_two_armies_in_one:0 "Two Armies in One Uniform"
 AUH_arm_two_armies_in_one_desc:0 "The concession has been made and the men are coming. So are the requests from every other regimental language in the realm, and nothing above battalion level now speaks with one voice."
 AUH_arm_the_academies:0 "The Two Academies"
 AUH_arm_the_academies_desc:0 "The line academy and the technical academy are funded to one standard and the technical places are open to the sons of officials. The officer corps stops being a caste, and the men already in it know it."
 AUH_arm_the_steel_bronze:0 "The Steel-Bronze Barrel"
 AUH_arm_the_steel_bronze_desc:0 "The Arsenal can pour this metal today, in quantity, without waiting for a steelworks the realm does not have. Every gun we field is outclassed by the neighbours' steel and none of them can be sold abroad."
 AUH_arm_the_gun_steel:0 "The Nickel-Steel Barrel"
 AUH_arm_the_gun_steel_desc:0 "The realm pays for gun steel of its own and the Bohemian works take the Crown's order. Fewer guns, later, and a bill the Delegations will hold against this government."
 AUH_arm_the_siege_train:0 "The Siege Train"
 AUH_arm_the_siege_train_desc:0 "Heavy howitzers on road carriages, and a very heavy piece begun at the Bohemian works. The heaviest of them travel at walking pace and eat a whole army's road capacity."
 AUH_arm_the_mountain_brigades:0 "The Mountain Establishment"
 AUH_arm_the_mountain_brigades_desc:0 "The mountain is a branch of the service with its own establishment, its own gun and its own badge. A corps trained for one kind of ground is slower on all the others."
 AUH_arm_the_new_military_law:0 "The New Military Law"
 AUH_arm_the_new_military_law_desc:0 "A contingent that follows the population, a shorter service with the colours, and a price paid in public for the votes. The law is on the statute book and the government that carried it is spent."
 AUH_arm_the_law_the_counties_will_not_apply:0 "The Law the Counties Will Not Apply"
 AUH_arm_the_law_the_counties_will_not_apply_desc:0 "The military law exists and the county administrations that must call the classes have not been asked. The law stands; the men do not come."
 AUH_arm_the_plan_in_the_drawer:0 "The Plan in the Drawer"
 AUH_arm_the_plan_in_the_drawer_desc:0 "A deployment against the interior of the realm is written, sealed and filed. Everybody who matters knows it exists and nobody has been told what is in it."
 AUH_arm_the_works_half_built:0 "The Works Left Half Built"
 AUH_arm_the_works_half_built_desc:0 "The supplementary credit was refused and the contractors have gone home. What stands, stands; the rest is a line of surveyed pits."
 AUH_arm_the_three_armies_reformed:0 "Three Armies, One Law"
 AUH_arm_the_three_armies_reformed_desc:0 "The three establishments survive, because nobody proposed abolishing them and nobody would have carried it. What they no longer have is three different answers to the question of how many men there are."
 AUH_arm_the_quota_conceded:0 "The Share Was the Price"
 AUH_arm_the_quota_conceded_desc:0 "Budapest carries a smaller part of the common expenditure than its wealth would suggest, and it carried the military law. Every ministry that draws on the common purse now draws on a smaller one."
 AUH_arm_the_supplementary_credit:0 "The Supplementary Credit"
 AUH_arm_the_supplementary_credit_desc:0 "The works were costed against rock that turned out to be softer, wetter and deeper than the survey said, and the credit has been voted a second time to finish them. The money comes out of the ordinary estimate, and everything else waits its turn."
 AUH_arm_the_bank_of_the_kingdom:0 "The Governor Comes from Budapest"
 AUH_arm_the_bank_of_the_kingdom_desc:0 "The next governor of the common bank is the Kingdom's man, and the discount rate will be set with the Kingdom's harvest in mind. The industry of the other half borrows on worse terms than it did, and says so at every session."
 AUH_bp_the_common_foreign_ministry:0 "The Common Foreign Ministry"
 AUH_bp_the_common_foreign_ministry_desc:0 "One ministry speaks for both crowns and answers to neither chamber. Its instructions leave before the estimate is voted and its archive is read by nobody who could object."
 AUH_bp_one_signature_for_both_halves:0 "One Signature for Both Halves"
 AUH_bp_one_signature_for_both_halves_desc:0 "House, Court and Foreign Affairs in one pair of hands. Every embassy has one instruction and one man to blame, and every chamber has one grievance it cannot address."
 AUH_bp_the_paper_in_the_drawer:0 "The Paper in the Drawer"
 AUH_bp_the_paper_in_the_drawer_desc:0 "The alliance is renewed and our third partner has already promised his neutrality to somebody else. We keep the treaty, we keep the staff talks, and we keep no illusions about either."
 AUH_bp_the_understanding_at_the_lodge:0 "The Understanding at the Lodge"
 AUH_bp_the_understanding_at_the_lodge_desc:0 "Two emperors have agreed to want nothing, and for as long as the paper holds the southern frontier costs us no divisions. It also forbids us to take anything, and everyone south of us has read it."
 AUH_bp_the_line_through_the_strip:0 "The Line Through the Strip"
 AUH_bp_the_line_through_the_strip_desc:0 "A survey concession through the mountains toward the Aegean, announced to the Delegations with the cost attached. It buys our exporters a road to the sea and costs us the only understanding that kept the south quiet."
 AUH_bp_the_minister_who_does_not_move:0 "The Minister Who Does Not Move"
 AUH_bp_the_minister_who_does_not_move_desc:0 "Nothing taken, nothing conceded, the peninsula kept as it is by two signatures. The realm keeps its frontiers, its friendships and its reputation for never doing anything."
 AUH_bp_the_year_of_standing_still:0 "The Year of Standing Still"
 AUH_bp_the_year_of_standing_still_desc:0 "The resignation was refused and the programme is unchanged for another year. The chancelleries are calm and the newspapers of both capitals are asking what the common ministry is for."
 AUH_bp_an_active_policy:0 "An Active Policy"
 AUH_bp_an_active_policy_desc:0 "The house on the square has a programme again: a title for the provinces, a settlement in the strip, and neighbours who are informed rather than asked. Everything it gains it will gain by surprising somebody."
 AUH_bp_the_sanction_that_costs_the_sender:0 "The Sanction That Costs the Sender"
 AUH_bp_the_sanction_that_costs_the_sender_desc:0 "A veterinary order closes our market to a neighbour who sold us four fifths of everything he had. His cattle find another road, his loan finds another bank, and our own exporters find the door shut behind them."
 AUH_bp_the_market_kept:0 "The Market Kept"
 AUH_bp_the_market_kept_desc:0 "The treaty is signed, the livestock crosses, the artillery orders stay with our works and the loans stay on our banks' books. The agrarian leagues of the plain will make us pay for it in every other division."
 AUH_bp_the_conversation_without_minutes:0 "The Conversation Without Minutes"
 AUH_bp_the_conversation_without_minutes_desc:0 "A day of talk at a country house and not one line written down. We shall quote it for years, and so will the other man, and the two quotations will not agree."
 AUH_bp_the_land_of_no_half:0 "The Land That Belongs to Neither"
 AUH_bp_the_land_of_no_half_desc:0 "Four provincial districts held by the common finance ministry, with a statute promised, no diet, and a seat in neither parliament. Their recruits are excellent and their reading rooms are full of committees."
 AUH_bp_the_crisis_divided:0 "The Crisis Divided"
 AUH_bp_the_crisis_divided_desc:0 "Two proclamations in two days, and half the indignation of Europe spent on a Balkan prince. We are still in a crisis, but we are in it with company and with a share of the bill."
 AUH_bp_second_of_berlin:0 "The Second of Berlin"
 AUH_bp_second_of_berlin_desc:0 "Our ally put the question at Petersburg for us and Petersburg answered yes. The rescript stands, the crisis ends, and every chancellery in Europe now knows which of the two of us decides."
 AUH_bp_the_indemnity:0 "The Indemnity to the Porte"
 AUH_bp_the_indemnity_desc:0 "The bill for the provinces is paid in gold and the receipt is not published. The Delegations vote it as an extraordinary credit and the exchequer feels it for a year."
 AUH_eco_the_common_market:0 "The Common Market"
 AUH_eco_the_common_market_desc:0 "One market, two treasuries, and a bargain that has to be renewed. The union carries the trade of the realm and quarrels over the bill."
 AUH_eco_the_wall_of_the_schedule:0 "The Wall of the Schedule"
 AUH_eco_the_wall_of_the_schedule_desc:0 "The duties are ours and nobody else's. The plain sells dear at home and cannot sell at all abroad, and the works pay for the difference."
 AUH_eco_the_treaty_schedule:0 "The Treaty Schedule"
 AUH_eco_the_treaty_schedule_desc:0 "Our duties are written to be signed away. The export houses prosper and the grain of a foreign plain crosses the frontier behind them."
 AUH_eco_the_bank_of_two_capitals:0 "The Bank of Two Capitals"
 AUH_eco_the_bank_of_two_capitals_desc:0 "One bank of issue, two head offices, a bilingual note and a governorship that is bargained for. The industry of one half gains and the agriculture of the other pays."
 AUH_eco_two_banks_one_coin:0 "Two Banks, One Coin"
 AUH_eco_two_banks_one_coin_desc:0 "Two banks of issue and one coin between them. The discount is set twice, the loan is dearer in both halves, and neither treasury will admit whose fault it is."
 AUH_eco_the_universal_banks:0 "The Universal Banks"
 AUH_eco_the_universal_banks_desc:0 "A bank, a board seat and a works in the same hand. The houses of the Ring build faster than the ministry and answer to it more slowly."
 AUH_eco_the_capital_offensive:0 "The Capital Offensive"
 AUH_eco_the_capital_offensive_desc:0 "Our paper, our terms and our charters in the kingdoms below us. The Ring's own works wait for the money and the foreign office gains a lever it does not have to garrison."
 AUH_eco_the_field_of_the_carpathians:0 "The Field of the Carpathians"
 AUH_eco_the_field_of_the_carpathians_desc:0 "Nine tenths of the realm's oil comes out of one eastern province, and it comes out faster than anything can carry it away."
 AUH_eco_one_owner_one_tariff:0 "One Owner, One Tariff"
 AUH_eco_one_owner_one_tariff_desc:0 "One timetable and one freight schedule from the Silesian pits to the Adriatic. The indemnities are paid, the plant is old, and the mobilisation tables no longer ask permission."
 AUH_eco_the_concessions_kept:0 "The Concessions Kept"
 AUH_eco_the_concessions_kept_desc:0 "New line instead of bought line. The companies keep their coupons and their leverage, and one of their boards sits in a foreign capital."
 AUH_eco_the_bore_and_the_bill:0 "The Bore and the Bill"
 AUH_eco_the_bore_and_the_bill_desc:0 "Two crossings of the mountains on the state's own account. The calendar is held, the estimate is not, and the Kingdom reads the whole programme as a freight schedule aimed at its own shore."
 AUH_eco_the_white_coal:0 "The White Coal"
 AUH_eco_the_white_coal_desc:0 "The valleys are dammed and the main lines are on the wire. The trains stop burning bought coal and the northern owners never forgive it."
 AUH_eco_one_union_one_port:0 "One Union, One Port"
 AUH_eco_one_union_one_port_desc:0 "The rebates send both halves' cargo to one deep-water quay. The Kingdom is compensated in the settlement, which it regards as no compensation at all."
 AUH_eco_the_rebate_of_the_kingdom:0 "The Rebate of the Kingdom"
 AUH_eco_the_rebate_of_the_kingdom_desc:0 "The Kingdom's lines carry to the Kingdom's shore below cost. The shore grows, the receipts do not, and the imperial chamber petitions every session."
 AUH_eco_the_emigrant_traffic:0 "The Emigrant Traffic"
 AUH_eco_the_emigrant_traffic_desc:0 "The free zone fills and the steerage empties the counties. The money comes in, the recruits go out, and the flag on the funnel is not ours."
 AUH_eco_the_land_and_the_labour_book:0 "The Land and the Labour Book"
 AUH_eco_the_land_and_the_labour_book_desc:0 "Land, credit and a wage that holds a man where he was born, and a penalty for the agent who books him elsewhere. The estates lose their valve and the works bid against each other for hands."
 AUH_eco_the_ordnance_ring:0 "The Ordnance Ring"
 AUH_eco_the_ordnance_ring_desc:0 "Three works, no tender and a fixed share for each half. Everything the army buys is made here and priced by the people who make it."
 AUH_eco_the_foreign_tender:0 "The Foreign Tender"
 AUH_eco_the_foreign_tender_desc:0 "The tender is opened and a foreign house wins it. The battery is better, the price is honest, and three works and a hundred thousand voters are told why."
 AUH_eco_the_promotion_acts:0 "The Promotion of Home Industry"
 AUH_eco_the_promotion_acts_desc:0 "Tax years, freight rebates and the treasury on the share register for anything not yet made here. The Kingdom subsidises the same works out of its own purse and says so at every session."
 AUH_eco_the_shorter_shift:0 "The Shorter Shift"
 AUH_eco_the_shorter_shift_desc:0 "Eight hours at the face and the workshop under the factory law. The pits raise less, the coal price walks into every estimate including the army's, and nobody strikes."
 AUH_eco_the_single_sick_fund:0 "One Fund for the Workmen"
 AUH_eco_the_single_sick_fund_desc:0 "Accident cover and one sick fund instead of forty trade chests, and a sanatorium for the disease the capital does not name. The premium is on the payroll."
 AUH_eco_the_governments_own_bill:0 "The Government's Own Bill"
 AUH_eco_the_governments_own_bill_desc:0 "Nine hours in the trade code and the workshop untouched. The smallest thing on the board and the only one either chamber would actually have passed."
 AUH_eco_the_pit_stays_open:0 "The Pit Stays Open"
 AUH_eco_the_pit_stays_open_desc:0 "The seams keep their hours and the gendarmerie keeps the gate. The realm has its coal and a permanent strike calendar to go with it."
 AUH_eco_the_estimate_that_balances:0 "Böhm-Bawerk's Estimate"
 AUH_eco_the_estimate_that_balances_desc:0 "One sheet, one signature and a finance ministry that has read the whole of it. Every armed estimate now comes back with the arithmetic attached."
 AUH_eco_the_books_are_opened:0 "The Books Are Opened"
 AUH_eco_the_books_are_opened_desc:0 "Every department in the realm is asked for its costings at once, and the ministries that have never been asked before take a season to answer."
 AUH_eco_the_ring_is_audited:0 "The Ring Is Audited"
 AUH_eco_the_ring_is_audited_desc:0 "The ordnance houses open their costings to the ministry. The guns are cheaper and every works in the realm now has a grievance with a file number."
 AUH_eco_the_coal_we_did_not_raise:0 "The Coal We Did Not Raise"
 AUH_eco_the_coal_we_did_not_raise_desc:0 "The weekly pay is conceded and the seams give less for it. The price walks into every budget in the realm within the quarter."
 AUH_eco_the_strike_returns:0 "The Strike Returns Are Printed"
 AUH_eco_the_strike_returns_desc:0 "The figures the statistics office has always collected are now published. The unions read them, the newspapers read them, and the ministry answers for them."
 AUH_eco_the_calendar_is_held:0 "The Calendar Is Held"
 AUH_eco_the_calendar_is_held_desc:0 "The heading is driven through on the contractor's schedule. The tunnels open on the day the ministry promised and the inquest sits afterwards."
 AUH_eco_the_months_we_lost:0 "The Months We Lost"
 AUH_eco_the_months_we_lost_desc:0 "The face is shored, the shifts are shortened and the programme slips. Nobody else dies in the heading."
 AUH_eco_the_ministry_without_a_minister:0 "The Ministry Without a Minister"
 AUH_eco_the_ministry_without_a_minister_desc:0 "The railway ministry is run by its section chiefs for a season. Nothing is decided and nothing is cancelled."
 AUH_eco_the_oil_cartel:0 "The Realm Buys the Surplus"
 AUH_eco_the_oil_cartel_desc:0 "The state takes the field's overflow for its own boilers and saves the small drillers into a syndicate that will outlive this ministry."
 AUH_eco_the_chamber_keeps_its_seat:0 "The Chamber Keeps Its Seat"
 AUH_eco_the_chamber_keeps_its_seat_desc:0 "The commercial curia is given a nominated bench upstairs instead of an elected one. The trade is content, the general franchise is shown what its victory was worth, and every other body without a seat asks for the same arrangement."
 AUH_h_the_price_is_named:0 "The Price Is Named"
 AUH_h_the_price_is_named_desc:0 "The Crown has instructed its Hungarian ministry to attach a price to the military bills. The common officer corps reads the instruction as a surrender given before a shot is fired."
 AUH_h_the_partners_of_the_settlement:0 "The Partners of the Settlement"
 AUH_h_the_partners_of_the_settlement_desc:0 "We govern with men who want the army Magyar and the Monarchy whole. They are cheap partners and they are never enthusiastic ones."
 AUH_h_the_men_who_never_signed:0 "The Men Who Never Signed"
 AUH_h_the_men_who_never_signed_desc:0 "We treat with the party that never accepted the settlement. Every common affair now costs us twice, once in Vienna and once again on the Danube."
 AUH_h_the_hungarian_sea:0 "The Kingdom's Sea"
 AUH_h_the_hungarian_sea_desc:0 "Preferential tariffs turn the Kingdom's traffic toward the Kingdom's own harbour. Every ton that lands there is a ton the imperial port did not handle."
 AUH_h_the_bills_with_a_price:0 "The Bills Carry a Price"
 AUH_h_the_bills_with_a_price_desc:0 "The two military bills are laid with the language of service written into their text. The common war minister will not put his name to them."
 AUH_h_two_armies_in_one:0 "Two Armies in One"
 AUH_h_two_armies_in_one_desc:0 "The words of command are given in Magyar to the regiments of the Kingdom. From this hour the establishment is in fact two armies wearing one coat."
 AUH_h_the_staff_of_two_schools:0 "The Staff of Two Schools"
 AUH_h_the_staff_of_two_schools_desc:0 "The Kingdom trains its own staff candidates and stops sending them to the imperial war school. Two schools teach two grammars of the same operation."
 AUH_h_the_school_without_a_chair:0 "The School Without a Chair"
 AUH_h_the_school_without_a_chair_desc:0 "The staff college opens under a cloud and the ministry gives it money instead of standing. What it cannot buy in prestige it buys in bursaries and in books."
 AUH_h_the_honved_establishment:0 "The Honved Establishment"
 AUH_h_the_honved_establishment_desc:0 "The Kingdom's force stops being a second line and takes corps, engineers and trains of its own. It eats like a field army because that is what it now is."
 AUH_h_the_keels_of_two_states:0 "The Keels of Two States"
 AUH_h_the_keels_of_two_states_desc:0 "The Kingdom's vote on the naval credits is bought with a guaranteed share of the hulls. Two yards now build what one yard used to build better."
 AUH_h_two_territories_one_treaty:0 "Two Territories, One Treaty"
 AUH_h_two_territories_one_treaty_desc:0 "The customs and commercial union is renewed as a treaty between two territories with a fixed contribution. The decennial quarrel is over and so is the decennial leverage."
 AUH_h_the_widened_franchise:0 "The Promise Kept"
 AUH_h_the_widened_franchise_desc:0 "The electoral reform promised when the coalition took office is actually laid, tempered by property and schooling but real. The gentry's parties are already counting what it costs them."
 AUH_h_the_plural_ballot:0 "The Plural Ballot"
 AUH_h_the_plural_ballot_desc:0 "The promise is honoured in form and the weight of a vote follows property and schooling. The squares of the capital have an opinion about the form."
 AUH_h_two_armies_one_king:0 "Two Armies, One King"
 AUH_h_two_armies_one_king_desc:0 "One dynasty, one market, one foreign policy and two armies, published in both capitals. It holds because the King says it holds."
 AUH_h_the_clock_runs_out:0 "The Clock Runs Out"
 AUH_h_the_clock_runs_out_desc:0 "The commercial arrangement runs to its term and is not renewed. The quota quarrel ends with it, and so does the market that fed both halves."
 AUH_h_the_hungarian_merchant_flag:0 "The Kingdom's Flag at Sea"
 AUH_h_the_hungarian_merchant_flag_desc:0 "The Kingdom's merchant lines and its yard are carried as a national establishment, not as a share of a common one. The other harbour of the Monarchy is told to compete."
 AUH_h_the_separate_hungarian_state:0 "The Separate Hungarian State"
 AUH_h_the_separate_hungarian_state_desc:0 "Two kingdoms, separate states, tied by the person of the King and by a commercial treaty either may denounce. Nothing above them arbitrates any longer."
 AUH_h_the_designer_of_the_kingdom:0 "The Designer of the Kingdom"
 AUH_h_the_designer_of_the_kingdom_desc:0 "The Kingdom's own small-arms designer holds the whole rifle and pistol programme and a works to run it. A second army equipped by the country that raises it stops being an argument and becomes an inventory."
 AUH_h_the_house_cleared_by_force:0 "The House Cleared by Force"
 AUH_h_the_house_cleared_by_force_desc:0 "The sitting ended when the guard entered the chamber. The government has its order of business and nothing else."
 AUH_m_the_sword_settles_it:0 "The Sword Settles It"
 AUH_m_the_sword_settles_it_desc:0 "The Crown has stopped asking. The army is levied, paid and employed by order, and the two chambers are told what has been decided. Nothing here can be renegotiated by treaty, and no franchise will be voted while it lasts."
 AUH_m_the_state_of_exception:0 "The State of Exception"
 AUH_m_the_state_of_exception_desc:0 "The summary law is in force wherever the Crown proclaims it. It buys obedience now and charges interest every year it is not lifted."
 AUH_m_the_frozen_contingent:0 "The Frozen Contingent"
 AUH_m_the_frozen_contingent_desc:0 "The annual levy has not moved while the population has grown by millions. Every class called is smaller than the realm can bear."
 AUH_m_the_realm_that_is_only_a_garrison:0 "A Realm That Is Only a Garrison"
 AUH_m_the_realm_that_is_only_a_garrison_desc:0 "The exception was never lifted. What was to be a means has become the constitution, and the realm is administered by its own army against its own peoples."
 AUH_m_the_technical_committee:0 "The Technical Military Committee"
 AUH_m_the_technical_committee_desc:0 "The trials ground has a standing budget and the right to order what it approves without a vote. Everything it approves is paid for twice: once in money and once in the estimate it displaces."
 AUH_m_the_preventive_war_memoranda:0 "The Preventive War Memoranda"
 AUH_m_the_preventive_war_memoranda_desc:0 "The chief of staff asks for a war every year and puts it in writing every year. The plans are excellent and the asking never stops."
 AUH_m_the_school_of_beck:0 "The School of Beck-Rzikowsky"
 AUH_m_the_school_of_beck_desc:0 "The old chief keeps the staff, writes the plan for the kingdom and refuses the plans against the neighbours. The army digs well and moves slowly."
 AUH_m_the_summary_law_made_ordinary:0 "The Summary Law Made Ordinary"
 AUH_m_the_summary_law_made_ordinary_desc:0 "Where a town is proclaimed the jury steps aside and the garrison commands, and no minister need be asked twice. Each proclamation is cheaper to decide and dearer to survive."
 AUH_m_the_kundschaftsdienst:0 "The Kundschaftsdienst"
 AUH_m_the_kundschaftsdienst_desc:0 "The evidence bureau grows from a map room into a service with agents, money and a legation network. Money that leaves no receipt leaves no defence either."
 AUH_m_the_counter_espionage_group:0 "The Counter-Espionage Group"
 AUH_m_the_counter_espionage_group_desc:0 "A group set up against Belgrade's friends inside the Monarchy, and allowed to buy its witnesses. Bought witnesses are cross-examined by somebody eventually."
 AUH_m_the_cabinet_of_generals:0 "A Cabinet of Generals"
 AUH_m_the_cabinet_of_generals_desc:0 "The Crown governs the kingdom through a ministry of soldiers and officials with no majority behind it, and instructs its minister of the interior to draft an equal franchise. Nothing Hungarian will be cheap again."
 AUH_m_the_national_resistance:0 "The National Resistance"
 AUH_m_the_national_resistance_desc:0 "The kingdom answers the commissioners with a passive resistance that touches every office, every court and every tax roll. It will break within two years, one way or the other."
 AUH_m_the_pact_that_is_not_published:0 "The Pact That Is Not Published"
 AUH_m_the_pact_that_is_not_published_desc:0 "The leaders of the majority take office having abandoned their military programme, and the terms are never printed. A pact nobody has read is a pact anybody may deny."
 AUH_m_the_kingdom_under_the_army:0 "The Kingdom Under the Army"
 AUH_m_the_kingdom_under_the_army_desc:0 "The kingdom is administered from a headquarters, and the half of the realm that furnishes two recruits in five furnishes none. Nothing can be attempted beyond the frontier while the occupation lasts."
 AUH_m_the_patent_of_the_franchise:0 "The Patent of the Franchise"
 AUH_m_the_patent_of_the_franchise_desc:0 "The Crown gives the kingdom the franchise its gentry refused, and the chamber that comes out of it will not be Magyar alone. No school law of magyarisation can ever pass such a house."
 AUH_m_a_chamber_of_all_the_peoples:0 "A Chamber of All the Peoples"
 AUH_m_a_chamber_of_all_the_peoples_desc:0 "Romanian, Slovak, Serb and Ruthene members sit at Budapest in numbers for the first time. Every measure now takes three times as long to carry."
 AUH_m_the_ordinance_is_the_law:0 "The Ordinance Is the Law"
 AUH_m_the_ordinance_is_the_law_desc:0 "The chambers are convoked to hear and not to vote, and the ordinance is the ordinary form of law. It is the most efficient arrangement available and the one hardest to walk back out of."
 AUH_m_the_party_of_the_crown_in_zagreb:0 "The Party of the Crown in Zagreb"
 AUH_m_the_party_of_the_crown_in_zagreb_desc:0 "Croatia is governed with the party that wants Vienna against Budapest, against a diet in which it holds nothing. The elected coalition is treated as an enemy of the state and behaves like one."
 AUH_m_the_pledge_of_dalmatia:0 "The Pledge of Dalmatia"
 AUH_m_the_pledge_of_dalmatia_desc:0 "Vienna outbids Budapest by offering the Croats what they asked Budapest for. The Germans of the coast and of Styria understand at once what is being sold."
 AUH_m_the_settlement_in_question:0 "The Settlement in Question"
 AUH_m_the_settlement_in_question_desc:0 "The ban receives his instructions from the Crown and the Hungarian countersignature is asked for afterwards or not at all. The man is Budapest's; the signature is no longer."
 AUH_m_the_reichsland_annexed:0 "The Reichsland Annexed"
 AUH_m_the_reichsland_annexed_desc:0 "The two provinces are ours in title as well as in fact, and their people belong to neither half of the realm. The eastern court will not forget how it was done."
 AUH_m_the_wedge:0 "The Wedge"
 AUH_m_the_wedge_desc:0 "Garrisons kept in the southern district keep two hostile neighbours from touching each other, and the survey for the line south is taken up again. No line will be built and the survey costs as much as one."
 AUH_m_the_gesture_of_moderation:0 "The Gesture of Moderation"
 AUH_m_the_gesture_of_moderation_desc:0 "The garrisons are withdrawn and the withdrawal is announced as moderation, so the annexation costs one crisis and not two. The two neighbours below us can now shake hands across a frontier we gave them."
 AUH_m_the_two_offices:0 "The Minister and the Chief"
 AUH_m_the_two_offices_desc:0 "The foreign ministry and the general staff are working against each other in front of the Crown. Until the Crown decides between them, nothing either of them plans is worth anything."
 AUH_m_the_army_that_had_its_war:0 "The Army That Had Its War"
 AUH_m_the_army_that_had_its_war_desc:0 "The staff was given the campaign it asked for twice. It is now an army that has been used, and everything it wants next it will ask for louder."
 AUH_m_the_army_not_to_be_used:0 "The Army Not to Be Used"
 AUH_m_the_army_not_to_be_used_desc:0 "The army is kept ready and not employed, and the neighbour capitulates on paper. The chief of staff will spend the rest of his tenure explaining what was thrown away."
 AUH_m_the_third_refusal:0 "The Third Refusal"
 AUH_m_the_third_refusal_desc:0 "The chief of the general staff has now been refused his campaign three times and has stopped pretending to accept it. Every submission from the staff arrives with a covering note about lost opportunities."
 AUH_m_the_lands_of_the_south:0 "The Lands of the South"
 AUH_m_the_lands_of_the_south_desc:0 "The Croatian lands, Dalmatia and the annexed province are under one administration and one diet, granted by rescript from above. Budapest has been robbed, the Germans of the coast have been sold, and the ally across the Isonzo has been given a programme."
 AUH_m_an_army_above_the_nations:0 "An Army Above the Nations"
 AUH_m_an_army_above_the_nations_desc:0 "The realm has one institution that belongs to no nation, and it has given the realm its law and gone back to barracks under it. The state that comes out of this is military in temperament whatever constitution it has written for itself."
 AUH_m_the_army_divided:0 "The Army Divided"
 AUH_m_the_army_divided_desc:0 "Regiments recruited in the occupied half are refusing service against their own counties, and their officers are refusing to make them. Nobody will say aloud how many."
 AUH_m_the_general_strike:0 "The General Strike"
 AUH_m_the_general_strike_desc:0 "The trades we conscripted have answered with a general strike in four cities. The lines run under military drivers and nothing else runs at all."
 AUH_m_the_word_of_vienna:0 "The Word of Vienna"
 AUH_m_the_word_of_vienna_desc:0 "A court has established that the principal documents in a treason trial were manufactured in one of our own legations, and nobody was punished for it. No chancery in Europe will take a paper from us at face value again."
 AUH_m_the_cover_from_berlin:0 "The Cover from Berlin"
 AUH_m_the_cover_from_berlin_desc:0 "Our friend in the north has put the question at Petersburg in terms that admit of one answer. He will send the bill in his own time."
 AUH_m_second_of_berlin:0 "The Second of Berlin"
 AUH_m_second_of_berlin_desc:0 "We were rescued from a crisis of our own making by a demarche we did not control, and everyone concerned watched it happen. The Monarchy is now the junior of its alliance in fact as well as in strength."
 AUH_m_the_garrison_of_galicia:0 "The Garrison of Galicia"
 AUH_m_the_garrison_of_galicia_desc:0 "Eight divisions are to stand in the northern province for as long as the guarantee lasts, and our friend will count them. They are not available for anything else."
 AUH_m_the_programme_of_the_next_reign:0 "The Programme of the Next Reign"
 AUH_m_the_programme_of_the_next_reign_desc:0 "The heir has been overruled and has begun to govern in advance. Half the useful men in the service are now waiting for a reign that has not begun."
 AUH_m_the_unsigned_promise:0 "The Unsigned Promise"
 AUH_m_the_unsigned_promise_desc:0 "The Croats were promised the coast and given nothing on paper. They will wait a year before they go back to Budapest."
 AUH_r_a_majority_of_a_dozen:0 "A Majority of a Dozen"
 AUH_r_a_majority_of_a_dozen_desc:0 "The ministry rests on clubs, not on a party. It can carry a budget the week after it has paid for one, and it can carry nothing the week it has not."
 AUH_r_the_house_told_afterwards:0 "The House Told Afterwards"
 AUH_r_the_house_told_afterwards_desc:0 "The chamber learns from the newspapers what its ministry signed. It will remember the discourtesy longer than the clause."
 AUH_r_the_count_is_published:0 "The Count Is Published"
 AUH_r_the_count_is_published_desc:0 "A ministry that has published its own arithmetic is a ministry whose every defection is counted against it before the sitting opens."
 AUH_r_the_lobby_is_open:0 "The Lobby Is Open"
 AUH_r_the_lobby_is_open_desc:0 "Ninety unattached deputies and a queue outside the minister's door. They are for sale and they know what they are worth."
 AUH_r_the_standing_bargain:0 "The Standing Bargain"
 AUH_r_the_standing_bargain_desc:0 "Nothing decided in this capital is applied in the province against the diet at Lemberg. Sixty-five votes, and a province we no longer govern."
 AUH_r_galicia_is_not_governed:0 "Galicia Is Not Governed"
 AUH_r_galicia_is_not_governed_desc:0 "The province's schools, police and electoral lists have left the ministry's hands. What happens there is reported to us afterwards."
 AUH_r_the_partner_in_prague:0 "The Partner in Prague"
 AUH_r_the_partner_in_prague_desc:0 "The Czech clubs vote the estimates against a promise with a term attached to it. The works and the trade bank of the kingdom come with them."
 AUH_r_the_historic_estates:0 "The Historic Estates"
 AUH_r_the_historic_estates_desc:0 "The conservative great landowners of the kingdom sit as their own body and expect precedence in everything. Nineteen votes that exist only while the curial house does."
 AUH_r_the_altar_in_the_majority:0 "The Altar in the Majority"
 AUH_r_the_altar_in_the_majority_desc:0 "The confessional clause sits over the schools and, before long, over the universities. Twenty-nine votes and a bishop in every appointment."
 AUH_r_the_mayor_in_the_majority:0 "The Mayor in the Majority"
 AUH_r_the_mayor_in_the_majority_desc:0 "The capital's undertakings stay municipal and its mayor stays useful. He deserted the last ministry that reached for the gavel."
 AUH_r_the_word_given_to_the_workers:0 "The Word Given to the Workers"
 AUH_r_the_word_given_to_the_workers_desc:0 "The funds, the inspectorate and an undertaking on the franchise, given in the chamber by name. The funds are an annual charge."
 AUH_r_the_word_broken:0 "The Word Broken"
 AUH_r_the_word_broken_desc:0 "The undertaking was given by name and withdrawn by name. The funds are still paid; the eleven votes are not."
 AUH_r_ring_below_the_line:0 "The Ring Below the Line"
 AUH_r_ring_below_the_line_desc:0 "The count stands under the majority. Every law now needs an ordinance and every ordinance is entered in the ledger."
 AUH_r_ring_of_a_dozen:0 "The Ring of a Dozen"
 AUH_r_ring_of_a_dozen_desc:0 "A majority, and a small one. It carries budgets and it is bought fresh every session."
 AUH_r_ring_secure:0 "The Ring Secure"
 AUH_r_ring_secure_desc:0 "A working majority with something to spare. The clubs are cheaper when they are not indispensable."
 AUH_r_the_question_is_put:0 "The Question Is Put"
 AUH_r_the_question_is_put_desc:0 "The ministry has announced that it will change either the rules of the house or the men in it, and has not yet said which. Every German bench is on notice."
 AUH_r_the_house_on_notice:0 "The House on Notice"
 AUH_r_the_house_on_notice_desc:0 "Nothing is being negotiated while the chamber waits to learn how it is to be reformed."
 AUH_r_the_curias_kept:0 "The Curias Kept"
 AUH_r_the_curias_kept_desc:0 "The franchise is not widened. The house that exists will be made to work, and it will be paid in ancient rights."
 AUH_r_the_street_is_not_heard:0 "The Street Is Not Heard"
 AUH_r_the_street_is_not_heard_desc:0 "The men without a vote have one instrument left and they are learning to use it. The processions get longer each year."
 AUH_r_the_ring_is_broken:0 "The Ring Is Broken"
 AUH_r_the_ring_is_broken_desc:0 "The majority has come apart and the clubs are negotiating with each other instead of with us. Re-forming it costs double what forming it cost."
 AUH_r_galicia_confirmed:0 "Galicia Confirmed"
 AUH_r_galicia_confirmed_desc:0 "The province's autonomy stands exactly as it is. Sixty-five votes held without a defection roll, and a province held down by its own gendarmes."
 AUH_r_the_franchise_from_the_crown:0 "The Franchise from the Crown"
 AUH_r_the_franchise_from_the_crown_desc:0 "Equal manhood suffrage, granted before the street asked for it and in the crown's own name. The Polish Club and the landowners' bench are gone."
 AUH_r_the_ruthenian_curia:0 "The Ruthenian Benches"
 AUH_r_the_ruthenian_curia_desc:0 "A body of their own at Lemberg, chairs at the university, and a viceroy instructed to apply both. The Polish national democrats are arming their societies."
 AUH_r_the_two_czech_benches:0 "The Two Czech Benches"
 AUH_r_the_two_czech_benches_desc:0 "The land bank and the inspectorate, and fifty votes. The estates of the kingdom have learned what their ministry will trade."
 AUH_r_two_lands_of_galicia:0 "Two Lands of Galicia"
 AUH_r_two_lands_of_galicia_desc:0 "A Polish land in the west, a Ruthenian land in the east, and a Polish Club that will not return to us in this era."
 AUH_r_two_nations_one_land:0 "Two Nations, One Land"
 AUH_r_two_nations_one_land_desc:0 "One province, two nations, and a viceroy instructed to satisfy neither. Every concession to one is entered in the other's ledger as a loss."
 AUH_r_the_documents_are_read:0 "The Documents Are Read"
 AUH_r_the_documents_are_read_desc:0 "The forgeries are taken apart in front of the Delegations by a professor with a seat and a printing press."
 AUH_r_the_ballhausplatz_resents_us:0 "The Ballhausplatz Resents Us"
 AUH_r_the_ballhausplatz_resents_us_desc:0 "The common foreign ministry was humiliated in public by its own government. It will remember, and it drafts our instructions."
 AUH_r_the_delegations_are_reading:0 "The Delegations Are Reading"
 AUH_r_the_delegations_are_reading_desc:0 "Every dispatch of the last decade is being read aloud to men who signed for it."
 AUH_r_the_precedent_on_the_table:0 "The Precedent on the Table"
 AUH_r_the_precedent_on_the_table_desc:0 "The Moravian acts lie on the table of the house and the ministry has undertaken to bring in the bill this session."
 AUH_r_the_bill_is_promised:0 "The Bill Is Promised"
 AUH_r_the_bill_is_promised_desc:0 "We cited a precedent in public. The clubs are counting the months."
 AUH_r_the_guarantee_of_the_frontier:0 "The Guarantee of the Frontier"
 AUH_r_the_guarantee_of_the_frontier_desc:0 "Guaranteed seats, a school fund and an undertaking on appointments. The German bloc of the kingdom is bought, and quotes the price back at us."
 AUH_r_one_crown_one_land:0 "One Crown, One Land"
 AUH_r_one_crown_one_land_desc:0 "The kingdom will not be cut into national circles. The historic-right argument is preserved whole, and so is the quarrel."
 AUH_r_slovene_in_the_office:0 "Slovene in the Office"
 AUH_r_slovene_in_the_office_desc:0 "The inner service of Carniola is in the language of its people. Styria, Carinthia and the port city each read it as a loss."
 AUH_r_the_southern_school_associations:0 "The Southern School Associations"
 AUH_r_the_southern_school_associations_desc:0 "German school societies open a counter-campaign in every valley of the south, funded from outside the province."
 AUH_r_the_ancient_order:0 "The Ancient Order"
 AUH_r_the_ancient_order_desc:0 "Prelates, lords, knights and towns, in that order and no other. A ceremony the mass parties will boycott to a man."
 AUH_r_the_deputation_elected:0 "The Deputation Elected"
 AUH_r_the_deputation_elected_desc:0 "The deputation that receives the oath was chosen by a diet elected by every man in the land, and the old families will not attend."
 AUH_r_the_crown_of_the_kingdom:0 "The Crown of the Kingdom"
 AUH_r_the_crown_of_the_kingdom_desc:0 "The king is crowned in the kingdom's capital with the kingdom's own crown, and the lands of that crown are one. The settlement is permanent."
 AUH_r_the_crown_contested:0 "The Crown Contested"
 AUH_r_the_crown_contested_desc:0 "The ceremony was held and half the kingdom stayed away from it. What was crowned is a nation, not a land."
 AUH_r_the_ordinance_becomes_the_rule:0 "The Ordinance Becomes the Rule"
 AUH_r_the_ordinance_becomes_the_rule_desc:0 "The chamber is adjourned and the emergency paragraph is the ordinary instrument of government. Order returns and nothing else does."
 AUH_r_the_bureau_pays_for_science:0 "The Bureau Pays for Science"
 AUH_r_the_bureau_pays_for_science_desc:0 "No chairs were endowed and no slot was won. The ministry's own statistical bureau does what a university would have done, badly and cheaply."
 AUH_r_martial_law_in_the_kingdom:0 "Martial Law in the Kingdom"
 AUH_r_martial_law_in_the_kingdom_desc:0 "Summary courts in the German districts of the kingdom. It is quick, it works, and every proclamation makes the next one cheaper to decide and dearer to survive."
 AUH_r_the_altar_is_first:0 "The Altar Is Paid First"
 AUH_r_the_altar_is_first_desc:0 "The schools clause is settled before the language question is opened. The bishops are content and the faculties are not."
 AUH_r_the_mayors_second_price:0 "The Mayor's Second Price"
 AUH_r_the_mayors_second_price_desc:0 "He named a figure, we paid it, and he has learned what we will pay. There will be a third price."
 AUH_r_the_reform_was_gutted:0 "The Reform Was Gutted"
 AUH_r_the_reform_was_gutted_desc:0 "The province keeps its curiae and the rest of the realm gets equal suffrage. The German bloc was not drowned after all, and everyone can see the seam."
 AUH_r_the_bloc_is_bought:0 "The Bloc Is Bought"
 AUH_r_the_bloc_is_bought_desc:0 "The secession societies lose their subscribers to a government subsidy. It works, and it is paid every quarter."
 AUH_dnc_political_sc:0 "Political"
 AUH_dnc_diplomacy_sc:0 "Diplomacy"
 AUH_dnc_army_sc:0 "Army"
 AUH_dnc_navy_sc:0 "Navy"
 AUH_dnc_economy_sc:0 "Economy"
 AUH_dnc_airforce_sc:0 "Air Force"
 auh_dnc.507.t:0 "The Skupstina Debates the Annexation"
 auh_dnc.507.d:0 "News of the proclamation reached Belgrade within a day, and their assembly has sat in near-continuous session since. The war minister wants the reserve classes under arms before the powers can agree on a form of words to describe what has already happened; the finance minister wants a note of protest and nothing that costs money. Both are being heard, and our military attache in Belgrade reports the barracks are busier than the speeches from the tribune admit."
 auh_dnc.507.a:0 "Muster the reservists and let Vienna hear the answer across the Sava."
 auh_dnc.507.b:0 "Protest through the legations, and muster nothing yet."
 auh_dnc.508.t:0 "Petersburg Weighs Belgrade's Telegram"
 auh_dnc.508.d:0 "The Serbian telegram sits on the Foreign Minister's desk beside the general staff's own note on our mobilisation schedules. The Duma's louder members are already asking whether Russia will again watch a Slav kingdom stand alone before the Dual Monarchy, while the ambassador in Vienna cables that Berlin's preference in the matter has been made plain enough to need no translation."
 auh_dnc.508.a:0 "Tell Belgrade that Russia stands behind it."
 auh_dnc.508.b:0 "Advise Belgrade to accept what cannot now be undone."
 auh_dnc.509.t:0 "Word Arrives From the North"
 auh_dnc.509.d:0 "St. Petersburg's answer reaches the Ballhausplatz by cipher before it reaches the newspapers. What the Tsar's government has decided will settle, for the moment, whether the annexation closes as a matter of protocol or opens as a standing quarrel with the kingdom on the Sava."
 auh_dnc.509.a:0 "Answer Belgrade and Petersburg both."
 auh_dnc.509.b:0 "Bank the quiet victory and say nothing further."
 AUH_bp_507a_tt:0 "The reserve classes are called to the colours and the frontier garrisons stand to."
 AUH_bp_507b_tt:0 "The legations lodge their protest and the Serbian barracks stay quiet, for now."
 AUH_bp_508a_tt:0 "The ambassador in Belgrade is instructed to speak plainly, and the annexation is no longer a matter between two courts alone."
 AUH_bp_508b_tt:0 "Petersburg counsels patience at Belgrade, and files the humiliation away against Berlin's account."
 AUH_bp_509a_tt:0 "A wargoal is drawn against the Serbian kingdom, and the powder keg wants only the spark."
 AUH_bp_509b_tt:0 "The annexation stands unchallenged, and Berlin is thanked for a service it will remember billing us for."
 AUH_bp_the_powder_keg_threat:0 "Austria-Hungary holds a standing wargoal against the Serbian kingdom"
 AUH_m_gemein_high_seated_tt:0 "Imperial cohesion is high enough that the new lands settle into the state apparatus without friction, boosting compliance and local manpower."
 AUH_m_gemein_low_seated_tt:0 "Imperial cohesion is too weak for the new lands to be properly seated: cores are granted, but the settlement never wins over its own administration."
 AUH_r_gemein_high_settlement_tt:0 "Imperial cohesion is high enough that the Reichsrat funds the settlement's industrial dowry in full."
 AUH_r_gemein_low_settlement_tt:0 "Imperial cohesion is too low for the Reichsrat to fund the settlement's industrial dowry in full: the crownlands' allotment is cut back to a token investment."
 auh_dnc.424.t:0 "The Voice from the Ridge"
 auh_dnc.424.d:0 "Our engineers hold the summit above the bay, but the guns that could still be laid on the roadstead below belong to a neighbour we outweigh a hundred times over. A note goes down the mountain to Cetinje: dismantle the batteries and let the coast alone, or Vienna finishes what the survey has already begun."
 auh_dnc.424.a:0 "Cede the coast"
 auh_dnc.424.b:0 "Refuse the ultimatum"
 auh_dnc.425.t:0 "The Ridge Above Cattaro"
 auh_dnc.425.ceded.d:0 "Prince Nikola bows to the arithmetic of cannon: the batteries above the bay come down, and Cetinje's flag stays well back from the water. Belgrade watches a client state fold without a shot, and draws its own conclusions."
 auh_dnc.425.refused.d:0 "Cetinje answers with silence and keeps its guns trained on the roadstead. The General Staff is only too glad of the excuse: the survey becomes a war plan, and Montenegro's independence becomes a question for the army to settle."
 auh_dnc.425.a:0 "Accept the peaceful transfer"
 auh_dnc.425.b:0 "Answer refusal with the army"
 AUH_m_cattaro_ceded_tt:0 "Montenegro dismantles the Lovcen batteries and steps back from the bay without a fight."
 AUH_m_cattaro_refused_tt:0 "Montenegro's refusal becomes the standing justification for war; the General Staff sharpens its plans against Cetinje."
 auh_dnc.320.t:0 "Vienna's Household Reacts"
 auh_dnc.320.d:0 "News of two governments set apart within the monarchy reaches the Hofburg. The Emperor's household must answer for the Crown: let the settlement stand, or hold the question in council and make Budapest wait."
 auh_dnc.320.a:0 "Accept the split"
 auh_dnc.320.b:0 "Stall in council"
 auh_dnc.321.t:0 "The Household Yields"
 auh_dnc.321.d:0 "After weeks of quiet talks, the Crown's household signals it will not stand in the way. The two governments are treated as settled fact at court, and the path toward a fuller personal union opens without further resistance from above."
 auh_dnc.321.a:0 "So it shall stand"
 auh_dnc.322.t:0 "The Household Digs In"
 auh_dnc.322.d:0 "The council keeps the question open, passing it from committee to committee. Nothing already granted is undone, but every week of delay costs the Crown in coin and in goodwill it can no longer spare freely."
 auh_dnc.322.a:0 "Let them wait"
 AUH_h_household_reacts_tt:0 "The Emperor's household will weigh how the Crown answers the new arrangement."
 AUH_h_household_accept_tt:0 "The Crown signals it will not obstruct the settlement."
 AUH_h_household_stall_tt:0 "The Crown holds the question in committee rather than answer it."
 AUH_h_household_yields_tt:0 "The household's consent smooths the way toward a fuller union."
 AUH_h_household_digs_in_tt:0 "The Crown's resistance is felt in the treasury and in the streets."
 AUH_h_household_yielded_tt:0 "With the Crown's blessing, the Honved musters in greater strength."
 AUH_h_household_dug_in_tt:0 "Without the Crown's blessing, the Honved musters leaner than planned."
 AUH_h_gemein_high_army_tt:0 "Imperial cohesion is high enough that the Delegations fund the crown army in full, artillery train included."
 AUH_h_gemein_low_army_tt:0 "Imperial cohesion is too thin for the Delegations to fund the crown army in full: it is raised under-strength, without its own artillery."
 auh_dnc.658.t:0 "The Counties Are Informed"
 auh_dnc.658.d:0 "The army bill does not go before the Hungarian county assemblies for a vote; it goes to them as a notice. Several diets simply decline to write the quota into their own statutes, and the War Ministry is told to expect a shortfall it had timed to the last man. Budapest hears none of this as compromise. It hears a limit set without a signature, and prices the next Settlement accordingly."
 auh_dnc.658.a:0 "Let the counties refuse. The regiments fill regardless."
 auh_dnc.659.t:0 "Budapest Names Its Price"
 auh_dnc.659.d:0 "The military law that finally clears the Delegations is not quite the one the War Ministry drafted. The counties keep their own tongue where it matters, and the common army gets its men on schedule. German-Austrian deputies call it a bill written by Magyars for Magyars; Budapest, more simply, calls it paid."
 auh_dnc.659.a:0 "The regiments are filled. Let Budapest remember who filled them."
 auh_dnc.660.t:0 "A Slav Army Bill"
 auh_dnc.660.d:0 "The Iron Ring does not need the German-Austrian benches to carry the law: the Bohemian and Galician diets supply the votes instead. The bill passes on schedule, and every German paper in Vienna prints it as what it is - an army raised by Czechs and Poles, over German objections, for a German Emperor."
 auh_dnc.660.a:0 "Let the numbers speak. The votes came from where the votes were."
 auh_dnc.711.t:0 "The Passed-Over Harbour"
 auh_dnc.711.d:0 "The chamber of commerce in the port the ministry's schedule left standing reads the completion notices from its rival's quay with plain fury. Its brokers argue over answering with a strike of the wharves, or swallowing the insult and waiting for the next tender."
 auh_dnc.711.a:0 "Call a Protest Strike"
 auh_dnc.711.b:0 "Accept Quietly"
 AUH_dnc_port_strike_delay_tt:0 "The ministry's attention is fixed on the docks; the shift question will keep for now."
 auh_dnc.661.t:0 "The Men Who Were Not Chosen"
 auh_dnc.661.d:0 "The chief's chair is filled, and the two circles of patrons whose candidate did not get it have not read the matter as closed. Memoranda are circulating in the corridors of the War Ministry that question the process rather than the man; more than one officer who backed the wrong horse is finding his file quietly reread; and letters are arriving from men who expect an answer, if not an apology. The new chief can afford to be generous, or he can afford to remind them whose signature is on the promotions."
 auh_dnc.661.a:0 "Let It Go"
 auh_dnc.661.b:0 "Make Them Pay for It"
 AUH_arm_staff_grudge_tt:0 "The passed-over patrons have been shown their place, and they are keeping count."
 auh_dnc.217.t:0 "The Diet Returns Its Verdict"
 auh_dnc.217.d:0 "The returns come in curia by curia through the night, until the clerks in Prague have set a tally against every bench of the Landtag. The old-Czech and German-liberal parties that once carried this house between them are all but gone; what is left to learn by morning is whether the Young Czech benches add up to a working majority on their own, or only to the largest minority in a house that nobody can govern."
 auh_dnc.217.a:0 "The Young Czechs sweep the diet."
 auh_dnc.217.b:0 "The diet returns hung."
 auh_dnc.218.t:0 "A Coronation, and a Ledger"
 auh_dnc.218.d:0 "The oath is read at the Hradschin as arranged, the bishops in their places and the guns saluting from the ramparts. Whether the day is remembered as a settlement or only as a ceremony depends on what was decided in the chamber before the crown ever arrived."
 auh_dnc.218.a:0 "The house that elected this crown is settled behind it."
 auh_dnc.218.b:0 "The house that watches this crown is still divided."
 auh_dnc.218.c:0 "The old estates never put it to a vote at all."
 AUH_r_the_bench_is_settled_tt:0 "The Young Czech bench commands the Landtag outright, and rules it without needing the Germans or the old estates."
 AUH_r_the_house_is_split_tt:0 "No bench in the new Landtag can govern alone, and the ring gains from the deadlock."
 AUH_r_the_coronation_is_untroubled_tt:0 "The Landtag that elected this crown is settled behind it; the ceremony needs no further guarantee."
 AUH_r_the_crown_answers_a_fractured_house_tt:0 "The crown is anointed over a Landtag that still cannot agree on anything else, and the era closes on that note."
 AUH_r_the_old_estates_never_voted_tt:0 "The old estates were summoned, not elected, and never put this question to a division at all."
 auh_dnc.323.t:0 "The Political Advisor's Chair"
 auh_dnc.323.szell.d:0 "Kalman Szell, the formula man who lays the bills before the House, takes his seat at the political advisor's table. For now the customs question is treated as arithmetic, not politics."
 auh_dnc.323.apponyi.d:0 "Kalman Szell's formula has done its work and he is thanked for it; the chair now goes to Albert Apponyi, the very man whose opposition programme forced the settlement in the first place. The government now speaks with the dissident's own voice."
 auh_dnc.323.a:0 "So it is settled."
 AUH_dnc_323_szell_tt:0 "Kalman Szell is installed as political advisor."
 AUH_dnc_323_apponyi_tt:0 "Kalman Szell is dismissed; Albert Apponyi is installed as political advisor in his place."
 auh_dnc.426.t:0 "The Chief Names His War"
 auh_dnc.426.d:0 "Conrad has the general staff, and he has not waited for the ink on the appointment to dry before naming what he means to do with it. One memorandum sketches a strike south into the Balkans before the neighbour finishes arming; the other keeps the staff at its tables all year, on mobilisation schedules and fortress credits, and leaves the war for whichever year the Crown actually declares one. He wants an answer, not a committee."
 auh_dnc.426.a:0 "Back the Balkan strike"
 auh_dnc.426.b:0 "Bind him to the calendar"
 AUH_m_conrad_chief_offensive_tt:0 "Conrad takes the general staff on an offensive footing, and the Balkan front is what he now plans for."
 AUH_m_conrad_chief_defensive_tt:0 "Conrad takes the general staff on a defensive footing, and the mobilisation tables come before any war."
 AUH_m_conrad_army_chief_offensive:0 "Franz Conrad von Hoetzendorf"
 AUH_m_conrad_army_chief_defensive:0 "Franz Conrad von Hoetzendorf"
 auh_dnc.423.b:0 "Strike the exception from the ledger, at a price"
 auh_dnc.219.t:0 "A Great Power Weighs Vienna's Register"
 auh_dnc.219.d:0 "Word of Vienna's register of the nationalities has reached this chancellery, framed by its own diplomats as either the promise of a steadier neighbor or a dangerous precedent for restless minorities closer to home."
 auh_dnc.219.a:0 "Encourage the experiment"
 auh_dnc.219.b:0 "Counsel caution"
 AUH_r_power_endorses_tt:0 "@AUH Relations with Vienna improve."
 AUH_r_power_cautions_tt:0 "@AUH Relations with Vienna cool."
 auh_dnc.220.t:0 "The Chancellery Replies"
 auh_dnc.220.endorsed.d:0 "The power sounded out over the register speaks well of it abroad. In Vienna, the nationalities' delegates take the endorsement as license to expect more, and the loyalist press claims a diplomatic victory."
 auh_dnc.220.cautioned.d:0 "The power sounded out over the register declines to bless it, murmuring in dispatches about precedents best not encouraged. In Vienna, the loyalist press stays quiet, and the delegates take note of who did not speak up."
 auh_dnc.220.a:0 "Press the advantage"
 auh_dnc.220.b:0 "Absorb the rebuff"
 AUH_r_powers_blessing_tt:0 "The register of the nationalities gains a foreign endorsement."
 AUH_r_powers_reproach_tt:0 "The register of the nationalities draws foreign reproach."
 auh_dnc.221.t:0 "Vienna's Register, Abroad"
 auh_dnc.221.endorsed.d:0 "With a great power's blessing on record, the register of the nationalities stops looking like an internal improvisation and starts looking like policy. Warsaw's delegates in particular treat the moment as proof that the crown's federalist turn has friends beyond its own borders."
 auh_dnc.221.cautioned.d:0 "Without any great power willing to bless it, the register of the nationalities stays exactly what its critics call it: an internal improvisation, unrecognized beyond the monarchy's own borders. Warsaw's delegates note the silence."
 auh_dnc.221.a:0 "A settlement recognized abroad"
 auh_dnc.221.b:0 "A settlement Vienna owns alone"
 AUH_r_slav_vienna_recognized_tt:0 "@AUH The register of the nationalities gains standing as recognized policy."
 AUH_r_slav_vienna_isolated_tt:0 "@AUH The register of the nationalities remains an unrecognized improvisation."
 AUH_bp_berchtold_appointed_tt:0 "Leopold Berchtold stays on at the Ballhausplatz, the treaty signed under the shadow of the standoff he means to see through."
 AUH_bp_burian_appointed_tt:0 "Stephan Burian von Rajecz takes the Ballhausplatz, tasked with keeping the peace that the fait accompli in Belgrade bought."
 AUH_bp_berchtold_at_the_ballhausplatz:0 "Berchtold at the Ballhausplatz"
 AUH_bp_burian_at_the_ballhausplatz:0 "Burian at the Ballhausplatz"
 AUH_m_kaiserjager_military_cabinet_tt:0 "With the sword in the saddle, the Tyrolean command answers to the War Ministry alone; the Delegations only vote the bill."
 AUH_m_kaiserjager_civilian_cabinet_tt:0 "The sword has not taken the saddle here: the Tyrolean command still answers to the joint ministry, and the Delegations still read its accounts."
 AUH_eco_estimate_ausgleich_strain_tt:0 "With the kingdom's quote sitting this low, the estimate can only balance by shorting what it just promised both halves — the books close, but the Ausgleich groans under it."
