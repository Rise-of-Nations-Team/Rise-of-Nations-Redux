 AUH_air_berlin_will_be_told_twice_tt:0 "Berlin will hear of this twice over, and the second telling will be sharper."
 AUH_air_the_ship_has_a_number_tt:0 "The ship carries a number in the order of battle: [?AUS_support|%0]"
