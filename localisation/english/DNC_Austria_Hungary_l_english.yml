 auh_dnc.100.t:0 "The Oath in the Hofburg"
 auh_dnc.100.d:0 "The heir has told the sovereign that he will marry a lady of a house the court does not recognise as equal, and that he will not be talked out of it. The dynasty's law says that such a marriage bars the issue from the succession; the heir is willing to swear to that in front of the archdukes, the primate and the ministers of both halves. The alternative is to forbid the marriage and be told, in writing, that he renounces in favour of his brother. Whatever is decided this morning fixes what kind of court the realm will have for the rest of the reign."
 auh_dnc.100.a:0 "Let him swear it before the whole court."
 auh_dnc.100.b:0 "The marriage will not take place."
 auh_dnc.100.c:0 "Dispense with the oath and let the lawyers argue later."
 auh_dnc.101.t:0 "The Form of the Census"
 auh_dnc.101.d:0 "The enumerators go out next month and the form must be printed this week. The column for the tongue admits a fixed list of answers, and the ministry decides the list. Deputations have arrived from the eastern towns asking that the tongue actually spoken there be added, and the eastern land's own clubs have arrived asking that it not be. Whatever the printer sets will decide, for ten years, who has a right to a schoolmaster and who does not."
 auh_dnc.101.a:0 "Nine answers, and no more."
 auh_dnc.101.b:0 "Admit the tongue of the eastern towns."
 auh_dnc.101.c:0 "Enter them on the German lists and say so plainly."
 auh_dnc.102.t:0 "Fire on the Square of the Exchange"
 auh_dnc.102.d:0 "The stokers of the shipping line went out first and the whole port followed them within two days. The crowd is now in the square in front of the exchange, the shipping company's directors are in the building behind it, and the garrison has two companies at the corner with orders that have not been read out yet. The company's own board has offered to sit with an arbitrator this evening. The governor wants an answer before dark."
 auh_dnc.102.a:0 "The troop will protect the palace."
 auh_dnc.102.b:0 "The arbitration board sits tonight."
 auh_dnc.102.c:0 "Put compulsory arbitration into the law."
 auh_dnc.103.t:0 "The Kingdom Without a Law"
 auh_dnc.103.d:0 "The Chamber of the kingdom has not passed a budget, an indemnity or a recruit bill, and the opposition has held the floor for eleven weeks. The treasury is collecting on last year's figures and the recruiting offices are working on last year's contingent, both without any legal authority whatever. There is no emergency paragraph on that side of the river to fall back on. Either the bills come off the table, or the twelfths run on, or the standing orders are changed against the Chamber's will."
 auh_dnc.103.a:0 "Shelve the military bills."
 auh_dnc.103.b:0 "Hold, and let the twelfths run."
 auh_dnc.103.c:0 "Change the standing orders and carry them."
 auh_dnc.104.t:0 "The Counties Answer"
 auh_dnc.104.d:0 "The commissioners have been sitting in the county halls for half a year. Some counties have resumed collecting; others have simply stopped answering letters, and the gendarmerie is doing the work of clerks who are still drawing salaries elsewhere. The leaders of the opposition have let it be known that they would receive an approach. The report on the ministry's desk says which way it has gone."
 auh_dnc.104.a:0 "They have folded; open the negotiation."
 auh_dnc.104.b:0 "They have not; concede the word of command and be done."
 auh_dnc.104.c:0 "They have not; proclaim summary law in the kingdom."
 auh_dnc.105.t:0 "The Street of the Ring"
 auh_dnc.105.d:0 "The unions have called a stoppage of a full day and the march on the boulevard is being organised openly, with stewards, printed routes and a deputation that intends to present a franchise petition at the Chamber door. The police have a plan for clearing the boulevard and the ministry has been shown it. The workers' party says it will keep the crowd in order if it is allowed to pass. The cordon is being formed while this is decided."
 auh_dnc.105.a:0 "Let them march."
 auh_dnc.105.b:0 "Offer a body for the unpropertied."
 auh_dnc.105.c:0 "The police will clear the boulevard."
 auh_dnc.106.t:0 "The Pact Is in the Newspapers"
 auh_dnc.106.d:0 "A journal of the opposition has printed what it says are the two conditions on which the coalition took office, and the wording is close enough to be somebody's copy. The coalition ministers are demanding that the government deny it flatly. The alternative is to lay the text itself before the Chamber and let it be read as what it is, which will finish several careers but not the Crown's."
 auh_dnc.106.a:0 "Deny it."
 auh_dnc.106.b:0 "Publish the text."
 auh_dnc.107.t:0 "Summary Law in the Old Capital"
 auh_dnc.107.d:0 "The old capital has had two nights of it: German students on one side, Czech clubs on the other, the tram wires down and the police outnumbered in three districts. The garrison commander has asked for the ordinary law to be suspended and says he will have the streets clear in forty-eight hours if it is. It would be the third time in fifteen years. The alternative is to leave the boulevards to whichever corporation can hold them. The settlement of the kingdom that would end the quarrel is not ours to offer: this government has promised the conferences that no language law will be laid before either diet."
 auh_dnc.107.a:0 "Proclaim it."
 auh_dnc.107.b:0 "Leave the street to the corporations."
 auh_dnc.108.t:0 "The Paper Rome Signed Elsewhere"
 auh_dnc.108.d:0 "The service has brought back the substance of an accord our ally signed in another capital, promising benevolent neutrality in a case the alliance was written to cover. The text is not in our hands and cannot be produced in public without naming how it was obtained. Every staff conversation of the last decade has been conducted on the assumption that this ally marches. The question is whether the ally is told that we know."
 auh_dnc.108.a:0 "Say nothing, and plan accordingly."
 auh_dnc.108.b:0 "Confront Rome with it."
 auh_dnc.109.t:0 "One Day of a Faculty"
 auh_dnc.109.d:0 "The decree is drafted and only the town is left blank. The Italian deputies want the port and nothing else; the German clubs of the Tyrol have already promised what will happen if it opens in their provincial capital; the ministry's own lawyers say either can be defended. The rector has been told to be ready for the opening ceremony within the month. The police of whichever town we name have asked, in writing, how many men they will be given."
 auh_dnc.109.a:0 "In the Tyrolean city."
 auh_dnc.109.b:0 "In the port."
 auh_dnc.109.c:0 "Nowhere at all."
 auh_dnc.110.t:0 "The Heir Asks for a New Chief"
 auh_dnc.110.d:0 "The heir's military chancellery has submitted a name for the general staff and made it clear that the submission is not a suggestion. The candidate is an infantry general with a reputation for saying, in writing, what the older men say in private, and a settled view that this realm's problems in the south are soluble by an army and by nothing else. The present chief has held the post for a generation and is content to hold it longer. Whichever way this goes, the heir will have been answered."
 auh_dnc.110.a:0 "Name the heir's candidate."
 auh_dnc.110.b:0 "Keep the old chief."
 auh_dnc.111.t:0 "The Strip and the Line"
 auh_dnc.111.d:0 "Our garrisons still sit in the strip of Ottoman territory between the two southern kingdoms, and the survey for a railway through it has been half paid for and never begun. Withdrawing costs nothing and buys goodwill in three capitals at once; it also lets the two kingdoms below us share a frontier for the first time. Keeping it means garrisons, a mountain railway and a permanent grievance in every chancellery that matters. The general staff wants it kept and the foreign ministry wants it handed back."
 auh_dnc.111.a:0 "Withdraw the garrisons and abandon the survey."
 auh_dnc.111.b:0 "Keep the garrisons and take the survey up again."
 auh_dnc.112.t:0 "The Provinces Are Declared"
 auh_dnc.112.d:0 "The constitution has been restored in the east, and a restored parliament there will shortly claim to legislate for provinces we have administered for thirty years. Our title to them is a mandate and nothing more. The principality on our southern flank is about to declare its own independence, which will give the week enough noise to hide a second declaration. The alternatives are to proclaim, to buy the title first, or to leave the ambiguity exactly where it has been."
 auh_dnc.112.a:0 "Proclaim them part of the realm by rescript."
 auh_dnc.112.b:0 "Buy the title first."
 auh_dnc.112.c:0 "Do nothing; the ambiguity has served us for thirty years."
 auh_dnc.113.t:0 "The Note at Petersburg"
 auh_dnc.113.d:0 "The proclamation has been made and Petersburg has refused to recognise it, with Belgrade mobilising behind them and the Delegations asking daily what our position is. Our ally has offered to put the question at Petersburg in terms that will not be refused, and has made clear what accepting the offer will look like. Belgrade could instead be bought outright with a commercial treaty and a railway of its own. Or we can hold out and answer for it alone."
 auh_dnc.113.a:0 "Let the ally put the question."
 auh_dnc.113.b:0 "Pay Belgrade."
 auh_dnc.113.c:0 "Hold out alone."
 AUH_a_capstone_street_void_tt:0 "The boulevard was cleared by the police and the workers' deputies have never come back to the Chamber; the settlement is registered, not celebrated."
 AUH_a_capstone_word_given_tt:0 "The word of command was conceded in the counties, and nothing signed at the end of the reign takes it back."
 AUH_a_capstone_alone_tt:0 "The realm answered the note alone; it closes the reign without a patron and with the account still open."
 AUH_dnc_aviation:0 "Aviation of the Monarchy"
 AUH_dnc_aviation_desc:0 "What the establishment, the halls, the fields and the schools of the air arm together are worth to the common army."
