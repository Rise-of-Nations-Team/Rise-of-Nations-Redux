 AUH_tb_the_quick_firing_field_gun:0 "The Quick-Firing Field Gun"
 AUH_tb_the_siege_howitzers:0 "The Siege Howitzers"
 AUH_tb_the_mountain_establishment:0 "The Mountain Establishment"
 AUH_tb_the_new_establishment:0 "The New Establishment"
 AUH_arm_the_northern_frontier_left_open:0 "The northern frontier is left as it stands"
 AUH_arm_the_southern_frontier_left_open:0 "The river frontier is left as it stands"
 AUH_arm_the_alpine_frontier_left_open:0 "The passes are left as they stand"
 AUH_arm_three_establishments_tt:0 "Three establishments are carried on one budget. Nothing above the Army Bill will give us more men."
 AUH_arm_the_frozen_contingent_tt:0 "The old military law stands until a new one is laid before both parliaments."
 AUH_arm_the_inspector_of_the_army_tt:0 "The inspector of the army takes the review of all three establishments."
 AUH_arm_beck_at_the_staff_tt:0 "The chief of the General Staff may now be taken into the Crown's own military counsel."
 AUH_arm_the_chief_deepens_tt:0 "The chief we kept is confirmed in the defensive school, and the regulations are written to his hand."
 AUH_arm_the_interior_plan_tt:0 "The staff is instructed to draw a deployment for the interior of the realm."
 AUH_arm_potiorek_tt:0 "The inspector who has never asked for a war and never lost an inspection takes the staff."
 AUH_arm_conrad_two_roles_tt:0 "The Belvedere's man takes the staff, and his tactics manual becomes the school text."
 AUH_arm_brosch_tt:0 "The heir's military chancellery is opened to the common army's officers."
 AUH_arm_urbanski_tt:0 "The evidence bureau's chief is attached to the deployment section."
 AUH_arm_schemua_tt:0 "The school's best logistician is taken into the high command."
 AUH_arm_krobatin_tt:0 "The artillery inspector is placed at the head of the standing commission."
 AUH_arm_the_war_minister_tt:0 "The common War Minister takes the extraordinary credit before the Delegations."
 AUH_arm_the_sword_carries_the_memoranda_tt:0 "The chief is ours already; the vision of the sword carries what he costs."
 AUH_arm_the_sword_carries_the_plans_tt:0 "The deployments are already the sword's own business; the branch supplies only the studies."
 AUH_arm_the_sword_carries_the_train_tt:0 "The train itself is ordered on the sword's account; the branch supplies only the pieces."
 AUH_arm_the_sword_carries_the_barrier_tt:0 "The barrier is the sword's own programme; the branch pays only for the works."
 AUH_arm_the_attaches_watch_tt:0 "Every foreign attache in Europe is in the field with us, and writes home about what he sees."
 AUH_arm_two_frontiers_left_open_tt:0 "Two frontiers in three spend this decade exactly as they are."
 AUH_arm_the_bocche_batteries_stand_tt:0 "The fleet's bunkers over the bay stand; we mount the land batteries behind them and build nothing twice."
 AUH_arm_the_bosnian_approaches_tt:0 "If the occupied land is ours to garrison, the approaches are put in order with it."
 AUH_arm_the_language_of_service_tt:0 "The words of command are not ours to change. The language of service in the regiment is."
 AUH_arm_hun_reads_the_limit_tt:0 "Budapest reads the limit as a refusal and prices the next military bill accordingly."
 AUH_arm_hun_is_paid_tt:0 "Budapest has been paid, and will say so at the next Settlement."
 AUH_arm_the_bohemian_order_tt:0 "The realm's largest ordnance order goes to the Bohemian works, and the German parties of Bohemia read it as a defeat."
 AUH_arm_the_ruthenian_roads_tt:0 "The Polish contractors are paid and the eastern deputies read the new roads as roads for somebody else's garrison."
 AUH_arm_belgrade_reads_the_works_tt:0 "Belgrade reads the fortified crossings; Zagreb reads the garrisons and the pay."
 AUH_arm_the_frustration_rises_tt:0 "The chief of the General Staff has been refused again, and the staff is counting."
 AUH_arm_the_frustration_falls_tt:0 "The staff's account with this government is closed and reopened at zero."
 AUH_arm_the_hand_down_tt:0 "The superseded pieces go down to the Landwehr and Honved batteries. They are not replaced with new ones."
 AUH_arm_the_very_heavy_piece_tt:0 "The very heavy piece is ordered as a development. It will not be delivered in this government's time."
 AUH_arm_the_badge_of_the_edelweiss_tt:0 "The mountain regiments receive an establishment, a gun and a badge of their own."
 AUH_arm_the_contingent_cleared_tt:0 "The old military law is superseded, not shaved. Whatever is left of the frozen contingent goes with it."
 AUH_arm_the_bill_before_both_parliaments_tt:0 "The bill goes to both parliaments, and what it costs depends on who is carrying it."
 AUH_arm_the_counties_are_told_tt:0 "The Hungarian counties are not asked. They are informed."
 AUH_arm_the_diets_carry_it_tt:0 "The bill is carried through the strengthened diets, and the German bloc reads a Slav army bill."
 auh_dnc.600.t:0 "The Word at the Manoeuvres"
 auh_dnc.600.d:0 "The coalition has asked for the words of command in its own tongue, and the whole field is waiting for the answer. The staff has drafted three. One holds the line at the language of service and gives nothing further. One holds the same line and follows it with a rescript soft enough to be read as a promise. One concedes the language of service as the coalition asks it, and the Crown has been told what the Czechs and the Croats will ask the next morning."
 auh_dnc.600.a:0 "The service language, and not a word more."
 auh_dnc.600.b:0 "Send the conciliatory rescript after it."
 auh_dnc.600.c:0 "Concede the language of service as the coalition asks it."
 auh_dnc.601.t:0 "A Parliament Fells a Minister"
 auh_dnc.601.d:0 "A national parliament has brought down a common minister over a military bill, and it will do it again. We may take the resignation and put a quartermaster in his place, or keep him and carry the credit over the chamber's head. The second road exists only in one half of the realm: the other has no article of emergency and no intention of writing one."
 auh_dnc.601.a:0 "Accept the resignation and name his successor."
 auh_dnc.601.b:0 "Keep him, and carry the credit by ordinance."
 auh_dnc.602.t:0 "The Plan in the Drawer"
 auh_dnc.602.d:0 "The staff has delivered the deployment for the interior: corps, railways, timetables, and the counties named in order. It is a complete piece of work and it has never been meant for use. We may seal it and say nothing, or rehearse a part of it at the autumn manoeuvres and let the counties draw their own conclusions."
 auh_dnc.602.a:0 "File it, and tell no one."
 auh_dnc.602.b:0 "Rehearse it at the autumn manoeuvres."
 auh_dnc.603.t:0 "The Chief Asks for His War"
 auh_dnc.603.d:0 "The chief of the General Staff has submitted the paper again. The moment is favourable, the army is ready, the southern kingdom is not, and every year we wait the arithmetic gets worse. The Foreign Ministry says the opposite in the same number of pages, and the heir has read both."
 auh_dnc.603.a:0 "We negotiate. Tell him the answer is no."
 auh_dnc.603.b:0 "Let him have it."
 auh_dnc.604.t:0 "The Chief and the Heir"
 auh_dnc.604.d:0 "The chief has been refused in public twice and is now writing to the Belvedere instead of to us. The heir will not have a chief who campaigns against his own government, and the chief will not have a government that will not fight. One of the two has to go, and only one of them can be dismissed."
 auh_dnc.604.a:0 "Replace the chief."
 auh_dnc.604.b:0 "Keep him, and take the next war he offers."
 auh_dnc.605.t:0 "The Works Run Over"
 auh_dnc.605.d:0 "The rock is not what the survey said it was. The contractors want a supplementary credit that nobody voted and the responsible minister has offered his resignation in advance. We may pay again and finish the works, or stop where they stand and let the frontier commission explain the line of surveyed pits."
 auh_dnc.605.a:0 "Vote the supplementary credit."
 auh_dnc.605.b:0 "Leave them as they stand."
 auh_dnc.606.t:0 "The Price of the Bill"
 auh_dnc.606.d:0 "Budapest will vote the military law and has named its price. It will take the share of common expenditure, or the next governor of the common bank, or the language of service in its own regiments. It will take exactly one of them and it will ask for the other two at the next renewal of the Settlement."
 auh_dnc.606.a:0 "The share of the common expenditure."
 auh_dnc.606.b:0 "The bank."
 auh_dnc.606.c:0 "The language."
 AUH_arm_the_minister_goes_tt:0 "The sitting common War Minister leaves the Ring, and his room is given to his successor."
 AUH_arm_the_minister_carries_it_tt:0 "The minister who costed the works carries them out of the ministry with him. His room stands empty."
 AUH_arm_auffenberg_tt:0 "The commission takes the artillerist who has spent his service arguing about barrels, and gives him the file."
 AUH_arm_the_concession_already_stands_tt:0 "The regiments already answer in their own tongue. There is nothing left here to concede."
 AUH_bp_credit_tt:0 "Every bargain the house closes abroad is entered in the credit of the Ballhausplatz."
 AUH_bp_two_new_peoples_tt:0 "The consular registers now count the Slovenes of the Littoral and the Italians of the coast among the peoples of the realm."
 AUH_bp_root_support_tt:0 "Vienna is content that the ministry is common. Budapest counts one more affair it does not control."
 AUH_bp_the_cipher_room:0 "The Cipher Room"
 AUH_bp_the_black_cabinet:0 "The Reading of the Post"
 AUH_bp_goluchowski_tt:0 "The Galician count who has held the house for a decade is confirmed in it, and the standing instruction to the embassies is renewed unchanged."
 AUH_bp_a_pole_at_the_ballhausplatz_tt:0 "The Polish Club reads the appointment as its own: the first affair of the realm is held by one of theirs."
 AUH_bp_budapest_wants_the_office_tt:0 "Budapest answers that a common minister who is not Hungarian is a minister the kingdom did not appoint."
 AUH_bp_the_consular_reports:0 "The Consular Reports"
 AUH_bp_the_landing_party_tt:0 "A naval landing company of the realm marches with the columns of five other powers, and the newspapers of Vienna print the roll."
 AUH_bp_the_landing_company:0 "The Landing Company"
 AUH_bp_the_coast_reads_the_treaty_tt:0 "The Italian deputies of the coast are told their kingdom has signed with us, and for a season they behave as if it mattered."
 AUH_bp_the_slovenes_read_the_treaty_tt:0 "The Slovene clubs of the Littoral hear only that Rome has been paid in their coin."
 AUH_bp_the_third_partner_tt:0 "The cipher room is instructed to read everything our third partner sends to a fourth capital."
 AUH_bp_the_alpine_staff_talks:0 "The Staff Talks of the Alliance"
 AUH_bp_the_neoslavs_approve_tt:0 "The Czech and Slovene clubs read an understanding with Petersburg as proof that the realm can be Slav abroad as well as at home."
 AUH_bp_the_tsar_is_the_enemy_tt:0 "Budapest remembers the Cossacks who put down its revolution; the Polish Club remembers everything else."
 AUH_bp_the_civil_agents:0 "The Civil Agents"
 AUH_bp_the_kingdoms_levant_line_tt:0 "The kingdom's own Levant company is chartered under its own law and sails from its own port."
 AUH_bp_the_merchants_of_the_coast_tt:0 "The Italian merchant houses of the imperial port take the freight and, for the moment, take the flag with it."
 AUH_bp_credit_up_tt:0 "The credit of the house rises by one."
 AUH_bp_the_oriental_academy:0 "The Oriental Academy"
 AUH_bp_the_levant_lines:0 "The Lines of the Levant"
 AUH_bp_the_neighbouring_concession_tt:0 "The concession next to ours flies the tricolour, and our Italian subjects are asked which council they would rather sit on."
 AUH_bp_a_harbour_of_our_own_tt:0 "Vienna is told the realm holds ground on a river nine thousand miles away, and Vienna is pleased."
 AUH_bp_the_long_passage:0 "The Long Passage"
 AUH_bp_the_station_guard:0 "The Guard of the Station"
 AUH_bp_the_window_is_open_tt:0 "Petersburg is fighting and cannot answer a note in the Balkans. The window is open, and it will not stay open."
 AUH_bp_the_window_is_shut_tt:0 "Petersburg is at peace and will read every note twice. The free hand is a paper right and nothing more."
 AUH_bp_the_free_hand_is_read_tt:0 "The clause about the Adriatic partner is not published, and within a season every irredentist club has read it."
 AUH_bp_the_southern_files:0 "The Files for the South"
 AUH_bp_the_slavs_of_the_south_watch_tt:0 "The Slav clubs of the realm are told that our officers are protecting Slav villages, and for once they believe it."
 AUH_bp_belgrade_reads_the_districts_tt:0 "Belgrade reads the new district boundaries and finds its own claims drawn out of them."
 AUH_bp_the_mountain_patrols:0 "The Patrols in the Mountains"
 AUH_bp_the_district_maps:0 "The Maps of the Districts"
 AUH_bp_the_provinces_pay_for_the_survey_tt:0 "The occupied provinces are drawn one notch closer to the common administration, because the survey has to be paid for out of somebody's budget."
 AUH_bp_the_lodge_is_dead_tt:0 "The understanding of the hunting lodge is dead the day the concession is announced, and both chancelleries know it before the newspapers do."
 AUH_bp_the_exporters_cheer_tt:0 "The exporters of both halves are promised the Aegean, and the Serb notables of the south are promised nothing."
 AUH_bp_credit_up2_tt:0 "The credit of the house rises by one."
 AUH_bp_no_land_in_the_strip_tt:0 "No yard of the strip is claimed, garrisoned as our own or promised to anyone: the concession is a survey and a right of way."
 AUH_bp_the_mountain_survey:0 "The Survey in the Mountains"
 AUH_bp_the_narrow_gauge:0 "The Narrow Gauge"
 AUH_bp_goluchowski_stays_tt:0 "The resignation is refused, the standing instruction is renewed, and the house on the square keeps the man who wrote it."
 AUH_bp_standing_still_pleases_the_slavs_tt:0 "The Slav clubs are content: a realm that takes nothing in the south is a realm that is not fighting their cousins."
 AUH_bp_budapest_wants_movement_tt:0 "Budapest asks what the common ministry is for, if it is for nothing."
 AUH_bp_the_archives_of_the_house:0 "The Archives of the House"
 AUH_bp_aehrenthal_tt:0 "The ambassador recalled from the Tsar's court takes the common foreign ministry, and the standing instruction to the embassies is torn up on his first morning."
 AUH_bp_berchtold_at_petersburg_tt:0 "A Moravian magnate goes out to the Tsar's court in his place, and takes his country house with him into the business of the realm."
 AUH_bp_budapest_likes_movement_tt:0 "Budapest approves of a common ministry that finally intends to do something, and reserves the right to send the bill back."
 AUH_bp_the_neoslavs_are_dismayed_tt:0 "The Czech and Slovene clubs understand at once that an active policy in the south is a policy against Slavs."
 AUH_bp_the_files_on_the_south:0 "The Files on the South"
 AUH_bp_the_agrarians_are_paid_tt:0 "The agrarian leagues of the plain are paid in a closed market, and they will remember it at the next vote on the common estimate."
 AUH_bp_the_south_slavs_read_the_order_tt:0 "The Serb and Croat notables of the realm read a health regulation and see a blockade."
 AUH_bp_the_trade_goes_west_tt:0 "Their cattle find a road to the west, their loan finds a bank in Paris and their next order for guns finds a French works."
 AUH_bp_the_veterinary_service:0 "The Veterinary Service"
 AUH_bp_the_south_slavs_are_answered_tt:0 "The Serb and Croat notables of the realm are shown a treaty instead of a customs wall, and the coalition of the south loses its best argument."
 AUH_bp_the_agrarians_are_told_no_tt:0 "The agrarian leagues of the plain are told that a neighbour's goodwill outranks their livestock prices, and they answer at the next division."
 AUH_bp_the_orders_stay_with_our_works:0 "The Orders Stay With Our Works"
 AUH_bp_izvolsky_tt:0 "The Russian minister comes to a Moravian country house at our ambassador's invitation, and leaves it convinced he has been promised the Straits."
 AUH_bp_the_honest_meeting_tt:0 "The old minister brings a clerk, the clerk writes everything down, and both governments sign the record before dinner."
 AUH_bp_no_minutes_tt:0 "No clerk, no record, and two ministers who will each remember a different afternoon."
 AUH_bp_credit_up3_tt:0 "The credit of the house rises by one."
 AUH_bp_the_question_of_the_straits:0 "The Question of the Straits"
 AUH_bp_the_provinces_are_ours_tt:0 "The condominium is abolished by rescript and the four provincial districts pass to the common finance ministry."
 AUH_bp_no_cores_tt:0 "The inhabitants receive a provincial belonging of their own and remain foreign in both halves of the realm: the districts are held, never incorporated."
 AUH_bp_somebody_to_sign_with_tt:0 "The confessional autonomies were granted first, so there are notables in the provinces with authority to sign the rescript's receipt."
 AUH_bp_nobody_to_sign_with_tt:0 "There is no body in the provinces entitled to accept anything, so the rescript is delivered to nobody and read by everybody."
 AUH_bp_the_serbs_of_the_realm_tt:0 "Every Serb reading room in the realm is now a national committee, and the police report says so in the first week."
 AUH_bp_both_capitals_cheer_tt:0 "Both capitals cheer a rescript neither parliament was shown."
 AUH_bp_the_minutes_help_tt:0 "The record signed at the country house is produced, and the crisis is halved before it begins."
 AUH_bp_the_crisis_is_entire_tt:0 "There is nothing to produce, and every capital in Europe is free to say it was deceived."
 AUH_bp_the_bosniaken:0 "The Regiments of the Provinces"
 AUH_bp_ferdinand_tt:0 "The prince at Sofia is told the day and the hour, and asks in return only that he be allowed to go first."
 AUH_bp_bulow_tt:0 "Berlin is asked whether it will stand behind the rescript, and the German chancellor answers that he will put the question at Petersburg himself."
 AUH_bp_the_blame_is_shared_tt:0 "Half the indignation of Europe is spent on a Balkan prince, and the realm reads its own newspapers with relief."
 AUH_bp_the_two_announcements:0 "The Two Announcements"
 AUH_bp_the_consul_at_scutari_tt:0 "A consul who speaks the mountain dialects is installed on the northern coast, with a school fund and no garrison whatever."
 AUH_bp_no_albanian_state_tt:0 "There is no state on that coast to befriend, so the subsidy goes to the clans, the seminaries and the consular schools instead."
 AUH_bp_rome_answers_on_the_coast_tt:0 "Rome answers with schools of its own on the same coast, and our Italian subjects are asked to choose a flag again."
 AUH_bp_the_catholic_south_tt:0 "The Croat clergy read a Catholic protectorate on the Adriatic as their own errand, and say so from the pulpit."
 AUH_bp_credit_up4_tt:0 "The credit of the house rises by one."
 AUH_bp_the_mission_schools:0 "The Mission Schools"
 AUH_bp_the_credit_of_the_house:0 "The Credit of the House"
 auh_dnc.500.t:0 "The Delegations Ask What Was Signed"
 auh_dnc.500.d:0 "Sixty deputies from each half sit in separate rooms and send each other notes, and both rooms have arrived at the same question: what, precisely, has the common ministry undertaken in our name? The instructions left for the embassies three weeks ago. The minister observes that a foreign policy debated in two languages is a foreign policy read in every capital before it is executed."
 auh_dnc.500.a:0 "Lay a summary before them, and keep the annexes."
 auh_dnc.500.b:0 "The instructions have already left."
 AUH_bp_500a_tt:0 "The Delegations receive four pages and vote the estimate; the annexes stay in the house."
 AUH_bp_500b_tt:0 "The Delegations are informed that the question is not properly before them."
 auh_dnc.501.t:0 "The Bands in the Vilayets"
 auh_dnc.501.d:0 "The internal committee has burned three villages in our reform sector and hanged a Greek schoolmaster in a fourth, and the Sultan's troops arrived a week later to burn the rest. Our civil agent reports that the district boundaries we drew are being made true by massacre rather than by census. The two emperors' programme was written to prevent exactly this, and it has no clause that covers it."
 auh_dnc.501.a:0 "Press the Porte to draw the districts as we agreed."
 auh_dnc.501.b:0 "Our officers will pay their own informers."
 auh_dnc.501.c:0 "Shut the strip to the committees and their couriers."
 AUH_bp_the_informers:0 "The Informers of the Sector"
 AUH_bp_501a_tt:0 "The Porte is reminded in writing, twice, and moves one boundary."
 AUH_bp_501b_tt:0 "Our sector acquires a network of paid informers and a reputation the powers do not discuss."
 AUH_bp_501c_tt:0 "The mountain tracks through the strip are patrolled, and the couriers go round by another kingdom."
 auh_dnc.502.t:0 "A Major Is Shot Above Uskub"
 auh_dnc.502.d:0 "One of our officers has been shot from a ridge while inspecting a gendarmerie post, and the killers were over the frontier before the escort reached the body. The Porte offers regrets and an investigation that will find nobody. Our reform sector has now cost us four officers and the newspapers of the realm have printed the name of none of them."
 auh_dnc.502.a:0 "A coffin, and no communique."
 auh_dnc.502.b:0 "A court, an indemnity, or we withdraw."
 auh_dnc.502.c:0 "Withdraw the officers from the district."
 AUH_bp_502a_tt:0 "The body comes home by rail at night and the ministry says nothing at all."
 AUH_bp_502b_tt:0 "The Porte is handed a note with a term attached, and the term is short."
 AUH_bp_502c_tt:0 "Our majors come out of the mountains and the reform of the vilayets continues without us."
 auh_dnc.503.t:0 "What Was Said at the Country House"
 auh_dnc.503.d:0 "The Russian minister has left, and within a week he is telling three capitals that he consented to a European conference and received a promise on the Straits. Our minister's recollection is that he consented to the rescript and asked for nothing that was refused. There is no record. Whatever we do now, one of the two governments is about to be called a liar by the other."
 auh_dnc.503.a:0 "Publish our own record of the conversation."
 auh_dnc.503.b:0 "Take him at his word and say nothing."
 auh_dnc.503.c:0 "Offer him the conference he says he asked for."
 AUH_bp_503a_tt:0 "Our version is printed first, which settles nothing and ends the friendship."
 AUH_bp_503b_tt:0 "Nothing is published and nothing is denied, and the misunderstanding is left to ripen."
 AUH_bp_503c_tt:0 "A conference is offered, and the rescript will have to survive being discussed."
 auh_dnc.504.t:0 "The Porte Presents Its Bill"
 auh_dnc.504.d:0 "The Sultan's government does not dispute the rescript; it disputes the price. It asks compensation for a sovereignty it has not exercised in a generation, and it has instructed its merchants to refuse our goods until it is paid. The boycott is costing our exporters more each week than the sum demanded. The Delegations would like to know why we are paying for something we have already taken."
 auh_dnc.504.a:0 "Pay the sum and print no receipt."
 auh_dnc.504.b:0 "Refuse, and let the boycott run its course."
 auh_dnc.504.c:0 "Pay in kind: the garrisons in the strip come out."
 AUH_bp_504a_tt:0 "The sum is voted as an extraordinary credit and no figure is ever laid before either chamber."
 AUH_bp_504b_tt:0 "The boycott holds through the season and our shipping lines carry the loss."
 AUH_bp_504c_tt:0 "The strip is evacuated and the survey concession dies with the garrisons."
 auh_dnc.505.t:0 "Berlin Puts the Question at Petersburg"
 auh_dnc.505.d:0 "Our ally proposes to go to the Tsar's government himself and demand a plain yes or no on the rescript, warning that events would then take their course. He does not ask our permission; he asks whether we wish him to. If he goes and they yield, the crisis ends in a fortnight and every chancellery in Europe learns which of the two of us decides. If we answer Petersburg ourselves, we answer alone."
 auh_dnc.505.a:0 "Let him put the question."
 auh_dnc.505.b:0 "We will answer Petersburg ourselves."
 AUH_bp_505a_tt:0 "Petersburg yields within the week, the southern kingdom signs its recognition, and the realm is from that day the second signature on its ally's policy."
 AUH_bp_505b_tt:0 "The note goes out over our own signature, and the general staff is asked how many corps stand between the San and the frontier."
 auh_dnc.506.t:0 "Belgrade Answers"
 auh_dnc.506.d:0 "Their prime minister has been in Paris. A loan is being negotiated there against the security of the very livestock we refused to admit, their next artillery order is being placed with a French works, and abattoirs are going up on their side of the river to cure what we will not buy. He tells his skupstina that the frontier taught his kingdom to live without us. He is not entirely wrong, and he is entirely pleased."
 auh_dnc.506.a:0 "The frontier stays shut. Let them learn what the west pays."
 auh_dnc.506.b:0 "Reopen the frontier for the artillery order alone."
 auh_dnc.506.c:0 "Offer them the road to the sea as well."
 AUH_bp_the_order_recovered:0 "The Order Recovered"
 AUH_bp_506a_tt:0 "The loan is signed in Paris, the guns are ordered in France, and our lever on Belgrade is gone for the rest of the reign."
 AUH_bp_506b_tt:0 "The certificate is issued for one consignment and the agrarian leagues are told it was a technical matter."
 AUH_bp_506c_tt:0 "Their goods are given transit and warehouse rights to our imperial port, and their kingdom is inside our economy again."
 AUH_bp_no_subject_to_annex_tt:0 "There is no administration left in the provinces to abolish, so the four districts are simply entered in the register of the realm."
 AUH_bp_the_upper_counties_pay_tt:0 "The closed market is a triumph of the plain, and the Slovak counties of the north are congratulated on it in a language their villages do not read."
 AUH_bp_the_upper_counties_spared_tt:0 "The agrarian leagues are beaten on the treaty, and every county they do not own breathes out."
 AUH_eco_AUS_up_tt:0 "§GThe German benches of the Reichsrat count this as theirs.§!"
 AUH_eco_AUS_down_tt:0 "§RThe German benches of the Reichsrat count this against us.§!"
 AUH_eco_HUN_up_tt:0 "§GThe chamber of the Kingdom books this to our credit.§!"
 AUH_eco_HUN_down_tt:0 "§RThe chamber of the Kingdom books this against us.§!"
 AUH_eco_CZE_up_tt:0 "§GThe Bohemian clubs read the decision as a gain.§!"
 AUH_eco_CZE_down_tt:0 "§RThe Bohemian clubs read the decision as a loss.§!"
 AUH_eco_CRO_up_tt:0 "§GZagreb reads the decision as a gain.§!"
