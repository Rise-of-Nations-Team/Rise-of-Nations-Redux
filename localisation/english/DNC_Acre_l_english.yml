l_english:
#Ideas
 Brazilian_colonists: "Brazilian Colonists"
 ACR_veterans_of_the_cuban_war: "Veterans of the Cuban War"
 ACR_veterans_of_the_cuban_war_desc: "After the end of the Cuban War of Independence in 1898, some veterans and adventurers who had fought in Cuba were left without stable opportunities, money, or military prospects. At the same time, the Amazonian region of Acre was experiencing a rubber boom, attracting fortune seekers, mercenaries, and political opportunists. As a result, a number of veterans of the Cuban conflict joined expeditions into Acre, where they sided with local rebels and rubber tappers in disputes against Bolivian control of the territory."
 ACR_against_all_odds: "Against All Odds"
 ACR_against_all_odds_desc: "The region has been officially claimed by Bolivia, recognized internationally as Bolivian territory, and lacked is lacking the military strength, resources, and diplomatic support needed to mantain it's independence. Yet Acre's largely Brazilian rubber tappers, adventurers, and foreign volunteers continue to resist Bolivian authority, motivated by economic interests tied to the lucrative rubber trade but at the same time, this doesn't mean that we have the full support of Brazil to continue being a independent country and while we have a strong economic potential thanks to the booming rubber trade, which is giving the republic a financial importance and attracting settlers willing to defend local autonomy. On the other hand, we have little international recognition, weak military capacity, internal instability, and constant pressure from both Bolivia, which wanted to reassert control, and Brazil, whose support was inconsistent and driven by its own interests."
 ACR_recent_republic: "A Recent Republic"
 ACR_recent_republic_desc: "Our succesful attempt at independent statehood had only just emerged in 1899, when separatists led by Luis Gálvez Rodríguez de Arias proclaimed the Republic of Acre in opposition to Bolivian rule."
#Focuses
 ACR_DNC_careful_as_it_goes: "Careful As It Goes"
 ACR_DNC_careful_as_it_goes_desc: "We worked really hard to gain our independence. We now have to work even harder to try and maintain it. With our neighbours being much stronger than us, we have to be really careful. The clock has started ticking"
 ACR_DNC_clash_between_the_politicians: "Clash Between the Politicians"
 ACR_DNC_clash_between_the_politicians_desc: "Different politicians in our country have different ideas about what we can do to maintain our sovereignty. Unfortunately, this causes tensions and disagreements. If we really want to survive, we either have to choose one option or learn to work together…"
 ACR_DNC_not_much_time_left: "The Clock is Ticking"
 ACR_DNC_not_much_time_left_desc: "The clock is approaching noon. Our spies are bringing us bad news from our neighbors. We need to get our act together and start reforms, because it might soon be too late..."
 ACR_DNC_galvez_firm: "Galvez's Firm Stance"
 ACR_DNC_galvez_firm_desc: "Our 'Emperor of Acre' brought independence to our country. We must trust him with further rule to survive through hard times. He will help us stay on our path to sovereignty."
 ACR_DNC_emergency_national_assessment: "Emergency National Assessment"
 ACR_DNC_emergency_national_assessment_desc: "We are in a crisis situation. Every idea and voice counts, which is why an Emergency National Assessment had to be made. It proved that centralizing power doesn’t make sense, and if we want to survive hard times, we need to form a National Assembly."
 ACR_DNC_de_sousa_thinking: "Follow De Sousa"
 ACR_DNC_de_sousa_thinking_desc: "Galvez is too soft for high-level politics. In these tough times, like those that are coming, we need strong and experienced people who can save the state and lead it to glory. Everybody voting for De Sousa says 'Aye!'"
 ACR_DNC_defend_at_all_costs: "Defend at All Costs"
 ACR_DNC_defend_at_all_costs_desc: "In the tough times ahead, everyone needs to be ready to defend the country, no matter the cost or suffering. Independence is the highest value we achieved by paying a huge price. Let's honor the memory of those fighters, just as they defended it until the very end."
 ACR_DNC_politics_for_later: "Suspend the Elections"
 ACR_DNC_politics_for_later_desc: "A time of crisis is coming. In a situation where many citizens could lose their lives or go through horrible experiences, election results can be very easily tampered with/voters can be easily influenced by foreign forces. That's why we should postpone the election date until we've dealt with the crisis situation."
 ACR_DNC_prepare_the_arms: "Prepare Our Military"
 ACR_DNC_prepare_the_arms_desc: "Midnight is coming, and we must be absolutely ready when it strikes. We should call up the reservists and prepare them for service, because it is not known when the blow will fall. We must have everything we can ready, because only in this way will we manage to survive."
 ACR_DNC_diplomacy_first: "Diplomacy First"
 ACR_DNC_diplomacy_first_desc: "It is always worth being prepared, but it would be even more worthwhile for us to avoid a crisis situation altogether. We should send representatives to the surrounding nations; perhaps we could manage to resolve something amicably."
 ACR_DNC_defensive_stand: "Defensive Stand"
 ACR_DNC_defensive_stand_desc: "If we end up facing our enemies, we need to be really well prepared. We can't spend money from our already small budget on unnecessary offensive weapons. It would be better to focus on fortifications and defensive armaments."
 ACR_DNC_offensive_stand: "Offensive Stand"
 ACR_DNC_offensive_stand_desc: "As they say - the best defense is a good offense. We are prepared, so why not plan, just in case, a preemptive war strategy? If we could force the surrounding countries to officially recognize us by force and thereby secure our safety, so much the better for us."
 ACR_DNC_the_unveitable: "Midnight Comes"
 ACR_DNC_the_unveitable_desc: "The day we have long anticipated, yet hoped until the last moment would never come, has arrived today. From this moment, we are in a state of war with Bolivia. The clock has struck midnight; may God have us in His care."
 ACR_DNC_victory_against_it_all: "Victory Against It All"
 ACR_DNC_victory_against_it_all_desc: "Against all odds, Acre survived the crisis! The sun, recently hidden, has risen over us once again! The clock has struck morning and it will strike many more in our homeland! Viva a pátria!"
 ACR_DNC_focus_on_our_industry: "Focus on Our Industry"
 ACR_DNC_focus_on_our_industry_desc: "We need to rebuild the industry that was destroyed by the war. Everyone should chip in to renew the country, even in the smallest way. Working for your homeland is a noble act!"
 ACR_DNC_after_it_all: "A Brand New Chapter"
 ACR_DNC_after_it_all_desc: "Now that we've resolved the crisis that has hung over us for a long time, we can start thinking - what's next? Treaties, alliances, trade, development - the possibilities are endless!"
 ACR_DNC_forgive_the_bolivians: "Forgive the Bolivians"
 ACR_DNC_forgive_the_bolivians_desc: "Now that we've won the war with Bolivia, we should show our magnanimity and invite them to an alliance! Both nations, worn out by the war, should help each other and work together to make sure nothing like this happens again."
 ACR_DNC_final_blow_to_bolivia: "Final Blow to Bolivia"
 ACR_DNC_final_blow_to_bolivia_desc: "The Bolivian state survived our last victory... That was a mistake – we learn about their new schemes every day. It's time to deliver the final blow when they're at their weakest, so they don't get a chance to strike us."
 ACR_DNC_ally_brazil: "Ally Brazil"
 ACR_DNC_ally_brazil_desc: "We should find new partners to raise our national prestige and to help lift our country from the rock bottom. We have sent our chargé d'affaires to Brazil; if his visit proves fruitful, we will be able to benefit from it."
 ACR_DNC_mutual_protection_agreement: "Mutual Protection Agreement"
 ACR_DNC_mutual_protection_agreement_desc: "The relationship with Brazil has proven its worth. We should offer them a pact of mutual guarantees to further strengthen the ties, as well as to secure some protection in case of an attack from a more powerful country."
 ACR_DNC_improve_brazilian_trade_relations: "Improve Trade Relations with Brazil"
 ACR_DNC_improve_brazilian_trade_relations_desc: "We should expand our alliance with Brazil with trade treaties - we produce large amounts of rubber, but we suffer from a shortage of other resources. If we could manage to get these treaties finalized, it would help in rebuilding and further developing Acre."
 ACR_DNC_befriend_peru: "Befriend Peru"
 ACR_DNC_befriend_peru_desc: "Our South American bloc is growing – we're talking with envoys from Peru about possibly joining it. The more powerful countries in our coalition, the safer our little country can feel."
 ACR_DNC_exchange_technology: "Exchange Technology"
 ACR_DNC_exchange_technology_desc: "Our scientists are making a lot of breakthroughs in industry – if we could combine their efforts with the efforts of our allies' scientists, everyone would benefit. Technology exchange treaties would make that possible."
 ACR_DNC_increase_food_and_resource_imports: "Increase Food and Resource Imports"
 ACR_DNC_increase_food_and_resource_imports_desc: "Together with our new allies, new ports are opening up to us, where we can import essential things like food and raw materials. Increasing these imports will help restore our country to its pre-war shape."
 ACR_DNC_double_down_on_heavy_industry: "Double Down on Heavy Industry"
 ACR_DNC_double_down_on_heavy_industry_desc: "The city of Acre should become a place of opportunity for anyone looking for a job. That's why we've ordered the construction of new heavy industry factories. Not only will this help people get work, but it will also aid in the development of our military and metallurgy."
