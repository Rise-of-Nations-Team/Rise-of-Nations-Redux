#Ideas
 AUS_backward_navy_industry: "Backward Naval Industry"
 AUS_backward_navy_industry_desc: "When it came to its financial and political position within the Empire, the Austrian (and later Austro-Hungarian) Navy was a bit of an afterthought for most of the time it existed. One reason was that sea power was never a priority of the Austrian foreign policy and that the Navy itself was relatively little known and supported by the public. Activities such as open days and naval clubs were unable to change the sentiment that the Navy was just something 'expensive but far away'. Another point was that naval expenditures were for most of the time overseen by the Austrian War Ministry, which was largely controlled by the Army."
