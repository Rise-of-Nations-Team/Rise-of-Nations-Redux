l_english:
 AUHDNC_g_the_german_question:0 "The German Question"
 AUHDNC_g_the_german_question_desc:0 "Until Franz II laid it down, the Roman crown of the German nation was a Habsburg possession for three and a half centuries. Vienna has not spoken of it since Koeniggraetz. The archives are opened anyway, and a file is made.\n\nOpening the file is cheap. Everything after it is not: the German column stands at §[GetAUS_supportColor][?AUS_support]§!, and the Slav columns will read every word of this from the newspapers.\n\n§YThe Belvedere will not help you.§! The Archd"
 AUHDNC_g_los_von_rom:0 "Los von Rom"
 AUHDNC_g_los_von_rom_desc:0 "Schoenerer's movement tells the Germans of Austria to leave Rome and Austria together, and take themselves to the Protestant Reich. Tens of thousands convert. The pan-Germans of this monarchy are not our instrument - they are Berlin's, and they are working against us in our own German lands.\n\nA Greater Germany led from Vienna must first defeat its own pan-Germans."
 AUHDNC_g_break_the_schoenerians:0 "Break the Schoenerians"
 AUHDNC_g_break_the_schoenerians_desc:0 "The Statthalter, the gendarmerie and the courts against a legal party. Ban the associations, prosecute the newspapers, and finish the Ritter von Schoenerer in the only way that ever finished him - publicly, and by the state.\n\nIt works. It also teaches every German elector in Bohemia and the Alpine lands that Vienna reaches for the police first, and it costs the register a mark against the state that will never be rubbed out.\n\nThe Slavs applaud."
 AUHDNC_g_the_vienna_appeal:0 "The Appeal from Vienna"
 AUHDNC_g_the_vienna_appeal_desc:0 "Do not break the movement - outbid it. Berlin offers the Germans of Austria a Reich they must emigrate into. Vienna offers them a Reich they already live in, with the Hofburg at the head of it.\n\nKarl Hermann Wolf broke with Schoenerer over exactly this, and has kept a pan-German party that still calls itself Austrian. Buy him, his press and his voters, and the movement changes owner without losing a single member.\n\nThe price is paid in Bohemia."
 AUHDNC_g_the_catholic_south:0 "The Catholic South"
 AUHDNC_g_the_catholic_south_desc:0 "Bavaria, Wuerttemberg, the Rhineland: Catholic Germany never wanted a Protestant Prussian emperor, and the Zentrum has spent a generation being governed by men who distrust it. Vienna is the only capital in Europe that can speak to them as a co-religionist and a former sovereign.\n\nPrince Alois von Liechtenstein carries the Christian Social case south of the Main."
 AUHDNC_g_the_old_imperial_right:0 "The Old Imperial Right"
 AUHDNC_g_the_old_imperial_right_desc:0 "The lawyers of the Reichshofrat are set to work on the abdication of 1806: whether a crown laid down under Napoleonic duress was ever lawfully extinguished, and if not, in whom it now rests.\n\nThe opinion is worthless in international law and priceless in German politics. Every minor court that resents Berlin now has a text to cite.\n\nBerlin understands the message perfectly."
 AUHDNC_g_the_crown_offered:0 "The Crown Offered"
 AUHDNC_g_the_crown_offered_desc:0 "The crown is not taken. It is offered. Either Germany has stumbled - a Hohenzollern succession gone wrong, a war lost, a socialist majority, a Reich made subject to someone else's arms - or the case Vienna has built is by now too loud to answer, and the question stands at §Y85§! of 100.\n\n§YIf Berlin stands and the question is quiet, this road waits.§! That is the point of it.\n\nAnd the day the crown is accepted, the monarchy stops being the house of many peoples."
 AUHDNC_g_the_customs_union:0 "The Customs Union"
 AUHDNC_g_the_customs_union_desc:0 "No crown, no war: a tariff line drawn around Vienna and Berlin together, the idea Austrian and German economists have been circulating in the trade journals for a decade before anyone gives it a name.\n\nThis road belongs to the builders. It needs a settlement that holds - the quota at §Y[?AUH_quote]§!, no renewal missed - and a treasury that is not already groaning at §Y[?AUH_treasury_strain]§!.\n\nWhat you built in the economic branch is what you bring to the tabl"
 AUHDNC_g_the_common_currency:0 "One Coin for Two Empires"
 AUHDNC_g_the_common_currency_desc:0 "A tariff line can be undone by a ministry. A shared coin cannot. The krone and the mark are fixed against one another, the two note issues are made to answer to a single board, and the discount rates of Vienna, Budapest and Berlin stop being three separate weapons.\n\nSandor Popovics is brought to the common bank to hold the note issue of the whole union in one till.\n\nCheap money follows."
 AUHDNC_g_the_common_institutions:0 "The Common Institutions"
 AUHDNC_g_the_common_institutions_desc:0 "The tariff and the coin were arithmetic. This is sovereignty: a common council, a common court of commerce, a common tribunal for the union's disputes, and delegates who sit in a chamber that is neither Austrian nor German.\n\n§YWho chairs it is decided by the economy you built, not by the speech you make.§! Works standing to our name: §Y[?AUH_eco_projects_live]§!. Four or more and Vienna takes the chair."
 auh_clock.400.t:0 "The Answer from Linz"
 auh_clock.400.d:0 "The file did not stay in the chancery a fortnight. Schoenerer speaks at Linz, and the speech is not about Vienna's crown at all - it is about the sixty thousand Germans of Austria who should be Prussians already, and the Habsburg court that stands between them and the Reich.\n\nThe Reichsrat wants to know whether the government intends to answer, and how."
 auh_clock.400.a:0 "Let him talk. A movement that shouts is a movement that can be counted."
 auh_clock.400.b:0 "Confiscate the edition. Charge the printer."
 auh_clock.401.t:0 "The Converts Are Counted"
 auh_clock.401.d:0 "The Statthalter returns the figures for Los von Rom. They are not enormous and they are not the point: the conversions run along the language frontier, in exactly the districts where a German column and a Czech column meet, and every one of them is a household saying it would rather be Prussian than Austrian.\n\nCardinal Gruscha asks whether the answer is to be the Church's or the state's."
 auh_clock.401.a:0 "The Church answers. Missions, schools, and a pastoral letter in every parish."
 auh_clock.401.b:0 "The state answers. The language ordinances, applied without discussion."
 auh_clock.402.t:0 "The Party Splits at Eger"
 auh_clock.402.d:0 "With the Ritter finished, his party comes apart in a hall at Eger. The radicals will go to Berlin whatever happens. The moderates - the schoolmasters, the small manufacturers, the clerks - are looking for somewhere to stand.\n\nLueger's machine can absorb them in a week, at a price."
 auh_clock.402.a:0 "Take them into the Christian Socials. Vienna keeps its Germans."
 auh_clock.402.b:0 "Let them go north. We are better without them."
 auh_clock.403.t:0 "The Bargain at the Volksrat"
 auh_clock.403.d:0 "Wolf brings his people to the Ballhausplatz and they do not come cheaply. He will put a pan-German movement behind a Habsburg crown, and in return he wants what pan-Germans always want: the offices, or the schools.\n\nThe offices cost the monarchy its reputation for impartiality. The schools cost it Bohemia."
 auh_clock.403.a:0 "Pay in offices. The administration becomes German where it counts."
 auh_clock.403.b:0 "Pay in schools. A German gymnasium in every mixed district."
 auh_clock.404.t:0 "The Zentrum Sends a Reply"
 auh_clock.404.d:0 "The reply comes back through Munich rather than Berlin, which is itself the answer. Catholic Germany is listening. It wants to know what a Habsburg crown would guarantee that a Hohenzollern one does not - and it is too experienced to be satisfied by sentiment.\n\nThe Nuncio suggests the guarantee be written down. The Finance Ministry suggests it be paid instead."
 auh_clock.404.a:0 "Write it down. A concordat guarantee for the whole German south."
 auh_clock.404.b:0 "Pay it. Subsidies, railway terms and a loan on Bavarian paper."
 auh_clock.405.t:0 "The Golden Bull Is Read Again"
 auh_clock.405.d:0 "The opinion of the Reichshofrat jurists runs to four hundred pages and reaches the conclusion it was commissioned to reach. The abdication was extracted under duress; the electoral college was dissolved by force and not by law; the dignity, in the jurists' careful phrase, was never lawfully vacated.\n\nPublishing it is a diplomatic act. Filing it is an insurance policy."
 auh_clock.405.a:0 "Publish. Let every court in Germany read it."
 auh_clock.405.b:0 "File it. The document is worth more unspent."
 auh_clock.406.t:0 "The Crown Is Carried to Vienna"
 auh_clock.406.d:0 "It is done, and it is done in the old way: a deputation, a formula, and an ancient object carried across a border by men in uniforms nobody has worn in a century.\n\nWhere the ceremony is held is the last political decision of the whole affair. Frankfurt says the crown returns to Germany. Vienna says Germany returns to the crown."
 auh_clock.406.a:0 "Frankfurt. Crowned where the emperors were crowned."
 auh_clock.406.b:0 "Vienna. The Hofburg, and the Hungarians invited to watch."
 auh_clock.407.t:0 "The Register Is Read After the Crown"
 auh_clock.407.d:0 "The gazette reaches Prague, Lemberg, Agram and Laibach on the same morning. It does not have to be explained. A monarchy of many peoples has told them all which people it belongs to.\n\nThe Statthalters send the same telegram in four languages: the districts are quiet today, and they will not be quiet next month.\n\nThe columns can still be bought. Not for long, and not for little."
 auh_clock.407.a:0 "Buy them. A promise in writing to the Slav lands, and pay for it in power."
 auh_clock.407.b:0 "Garrison them. The army is the answer to a register that will not read right."
 auh_clock.410.t:0 "The Tariff Line Is Drawn"
 auh_clock.410.d:0 "The negotiators reach the only question that ever mattered in a customs union: whose schedule the union adopts. Ours protects Bohemian textiles and Hungarian grain and costs Berlin nothing it will miss. Theirs is cheaper for our consumers and lethal for half our manufacturers.\n\nThe Delegations will vote on whichever we bring them."
 auh_clock.410.a:0 "Our schedule. We pay for the privilege of protecting our own."
 auh_clock.410.b:0 "Their schedule. Cheaper today, and cheaper every year."
 auh_clock.411.t:0 "The Krone and the Mark"
 auh_clock.411.d:0 "The ratio is set in a room in the Bankgasse with three governors and no journalists. A rate that flatters the krone protects Hungarian agriculture and the common budget. A rate that flatters the mark makes every German machine tool in Bohemia cheaper by a fifth.\n\nPopovics will sign either one and says so."
 auh_clock.411.a:0 "Set it high. The quota and the common budget come first."
 auh_clock.411.b:0 "Set it low. Let the works have their cheap machines."
 auh_clock.412.t:0 "Who Sits at the Head of the Table"
 auh_clock.412.d:0 "The union's first council meets, and the seating is the whole of it. Everything the delegates will argue about for the next twenty years was decided before they arrived, by furnaces, freight tonnage and the ledgers of two treasuries.\n\nNobody votes. Everybody understands."
 auh_clock.412.a:0 "Vienna takes the chair. The works we built are sitting in the room."
 auh_clock.412.b:0 "Berlin takes the chair. We asked for a partnership and were given a place at it."
 AUH_anton_josef_gruscha:0 "Anton Josef Gruscha"
 AUH_anton_josef_gruscha_desc:0 "Cardinal-Archbishop of Vienna, and the man who organised the Church's answer to Los von Rom parish by parish. Where the state can only prosecute, he can preach."
 AUH_karl_hermann_wolf:0 "Karl Hermann Wolf"
 AUH_karl_hermann_wolf_desc:0 "The pan-German who broke with Schoenerer and stayed Austrian: duellist, editor, and the only man alive who can deliver a German nationalist movement to the Hofburg without it dissolving in his hands."
 AUH_alois_von_liechtenstein:0 "Alois von Liechtenstein"
 AUH_alois_von_liechtenstein_desc:0 "Prince, Christian Social, and the aristocratic conscience of Catholic social politics. Berlin's Zentrum will receive him. Berlin's chancellor will not enjoy it."
 AUH_g_the_file_on_the_crown:0 "The File on the Crown"
 AUH_g_the_file_on_the_crown_desc:0 "The chancery is working on a question the monarchy has not asked aloud since the Elbe. The court is energised; nobody else is."
 AUH_g_the_los_von_rom_agitation:0 "Los von Rom"
 AUH_g_the_los_von_rom_agitation_desc:0 "A legal, funded, Berlin-facing movement telling our Germans to leave our Church and our state. Every month it runs, it costs us."
 AUH_g_the_movement_broken:0 "The Movement Broken"
 AUH_g_the_movement_broken_desc:0 "Bans, prosecutions and a ruined man. The pan-Germans are finished as a force and the instrument that finished them is now on the books."
 AUH_g_the_movement_bought:0 "The Movement Bought"
 AUH_g_the_movement_bought_desc:0 "Wolf's press, Wolf's clubs and Wolf's voters, all pointed at Vienna instead of Berlin. A loud asset with a very short leash."
 AUH_g_the_christian_social_machine:0 "The Christian Social Machine"
 AUH_g_the_christian_social_machine_desc:0 "Vienna's municipal apparatus absorbing a broken party. Rarely elegant, always effective."
 AUH_g_the_offices_are_german:0 "The Offices Are German"
 AUH_g_the_offices_are_german_desc:0 "The administration staffed to a nationality. It works quickly and it is noticed everywhere."
 AUH_g_the_catholic_south:0 "The Catholic South"
 AUH_g_the_catholic_south_desc:0 "Munich, Stuttgart and the Zentrum returning Vienna's calls. Berlin notices the traffic."
 AUH_g_the_concordat_guarantee:0 "The Concordat Guarantee"
 AUH_g_the_concordat_guarantee_desc:0 "A written undertaking to Catholic Germany, and the moral standing that comes with keeping one."
 AUH_g_the_old_imperial_right:0 "The Old Imperial Right"
 AUH_g_the_old_imperial_right_desc:0 "A legal claim that no chancellery accepts and no German court can ignore."
 AUH_g_the_imperial_crown:0 "The Imperial Crown of the Germans"
 AUH_g_the_imperial_crown_desc:0 "The oldest dignity in Europe, back in Habsburg hands, resting on a state whose majority is Slav and knows it."
 AUH_g_crowned_at_frankfurt:0 "Crowned at Frankfurt"
 AUH_g_crowned_at_frankfurt_desc:0 "The old coronation city, the old rite, and a Germany told that its emperor has come home."
 AUH_g_crowned_at_vienna:0 "Crowned at Vienna"
 AUH_g_crowned_at_vienna_desc:0 "The Hofburg, the Hungarian delegation in the front row, and a crown that is understood to have moved to the Danube."
 AUH_g_the_promise_to_the_slavs:0 "The Promise to the Slavs"
 AUH_g_the_promise_to_the_slavs_desc:0 "Guarantees given in writing to peoples who have just been shown where they stand. Expensive, and worth every crown of it."
 AUH_g_the_middle_european_tariff:0 "The Middle European Tariff"
 AUH_g_the_middle_european_tariff_desc:0 "One line around two empires. The largest protected market in Europe, and our manufacturers inside it."
 AUH_g_the_schedule_is_ours:0 "The Schedule Is Ours"
 AUH_g_the_schedule_is_ours_desc:0 "The union adopts our tariff book. Our works survive; our treasury pays for the privilege."
 AUH_g_the_schedule_is_theirs:0 "The Schedule Is Theirs"
 AUH_g_the_schedule_is_theirs_desc:0 "The union adopts Berlin's tariff book. Cheap goods, cheap credit, and a slow lesson in who is the workshop."
 AUH_g_the_middle_european_coin:0 "One Coin for Two Empires"
 AUH_g_the_middle_european_coin_desc:0 "Krone and mark fixed, note issues joined, and a single discount rate over the middle of Europe."
 AUH_g_the_middle_european_institutions:0 "The Common Institutions"
 AUH_g_the_middle_european_institutions_desc:0 "A council, a court and a chamber above both crowns. The union has become a state that nobody voted for."
 AUH_g_vienna_holds_the_chair:0 "Vienna Holds the Chair"
 AUH_g_vienna_holds_the_chair_desc:0 "The works we built are sitting in the room, and the room defers to them."
 AUH_g_berlin_holds_the_chair:0 "Berlin Holds the Chair"
 AUH_g_berlin_holds_the_chair_desc:0 "We proposed the union and were given a chair at it. The arithmetic was never in our favour."
 AUH_g_question_dial_tt:0 "§YThe German question stands at [?AUH_g_german_question] of 100. The pan-Germans stand at [?AUH_g_pangerman_strength].§!"
 AUH_g_the_heir_stands_in_the_way_tt:0 "§YFranz Ferdinand's chancery opposes any Habsburg bid for a German crown.§! On the Belvedere path this needs house prestige and a German column both at §Y55§! or better."
 AUH_g_the_belvedere_price_tt:0 "§RThe Belvedere is overruled, and the heir remembers it.§!"
 AUH_g_gruscha_unlocked_tt:0 "§GCardinal Gruscha is available as a political advisor.§!"
 AUH_g_wolf_unlocked_tt:0 "§GKarl Hermann Wolf is available as a political advisor.§!"
 AUH_g_liechtenstein_unlocked_tt:0 "§GPrince Alois von Liechtenstein is available as a political advisor.§!"
 AUH_g_schoenerer_is_finished_tt:0 "§RGeorg Ritter von Schoenerer is finished in public life.§!"
 AUH_g_pangermans_louder_tt:0 "§RThe pan-German movement grows louder.§!"
 AUH_g_pangermans_quieter_tt:0 "§GThe pan-German movement loses ground.§!"
 AUH_g_prestige_up_tt:0 "§GThe standing of the House rises.§!"
 AUH_g_prestige_down_tt:0 "§RThe standing of the House falls.§!"
 AUH_g_the_scar_of_the_crown_tt:0 "§RThis is written into the scar the register never forgets.§!"
 AUH_g_the_slav_price_light_tt:0 "§RThe Slav lands read the German road for what it is.§!"
 AUH_g_the_slavs_are_abandoned_tt:0 "§RThe monarchy has chosen a nation. Every Slav column is scarred, and the scar does not heal.§!"
 AUH_g_the_register_is_read_tt:0 "§RThe register is recounted at once. Expect risings.§!"
 AUH_g_berlin_road_is_shut_tt:0 "§GThe imperial crown of the Germans is claimed from Vienna. Berlin can no longer take the German road.§!"
 AUH_g_the_german_era_closes_tt:0 "§YThe German question is answered, and the reign's account is closed with it. No further era of the monarchy can be opened.§!"
 AUH_g_berlin_stumbles_tt:0 "§YEither Germany has genuinely stumbled§! - a civil war, a war being lost, a Reich made subject, a parliamentary government carried, or a democratic majority above §Y45%§! - §Yor the German question itself stands at §Y85§! of 100§!, which Vienna can reach on its own by pressing every step of this road."
 AUH_g_the_claim_is_entered_tt:0 "§YA claim is entered on the German core lands.§!"
 AUH_g_the_contingents_are_raised_tt:0 "§GThe Reichskontingent Brigade template is drawn up.§!"
 AUH_g_the_settlement_holds_tt:0 "§YThe Ausgleich must be settled§!: no renewal missed, and the quota between §Y30§! and §Y45§!."
 AUH_g_the_treasury_is_sound_tt:0 "§YThe treasury must be sound§!: strain below §Y50§!."
 AUH_g_the_bank_is_ready_tt:0 "§YThe common bank must exist§! - the Bank of Two Capitals, or two banks holding one coin."
 AUH_g_the_union_has_a_head_tt:0 "§YThe union needs a head§!: at least §Y2§! great works standing to our name."
 AUH_g_the_tariff_was_ours_tt:0 "§GThe autonomous tariff was already ours. The union adopts our schedule for nothing.§!"
 AUH_g_the_treaties_were_ours_tt:0 "§GOur commercial treaties are folded into the union on our terms.§!"
 AUH_g_the_ring_underwrites_tt:0 "§GThe great houses of the Ring underwrite the new coin.§!"
 AUH_g_vienna_holds_the_chair_tt:0 "§GVienna takes the chair of the union.§!"
 AUH_g_berlin_holds_the_chair_tt:0 "§RBerlin takes the chair of the union.§!"
 AUH_g_threat_the_crown_of_the_germans:0 "The Crown of the Germans"
 AUH_g_threat_the_middle_of_europe:0 "The Middle of Europe"
 AUH_g_threat_the_old_right:0 "The Old Imperial Right"
 AUHFX_the_catholic_south_bonus:0 "The Catholic South"
 AUHFX_the_old_imperial_right_bonus:0 "The Old Imperial Right"
 AUHFX_the_german_schools_bonus:0 "The German Schools"
 AUHFX_the_middle_european_tariff_bonus:0 "The Middle European Tariff"
 AUHFX_the_middle_european_coin_bonus:0 "One Coin for Two Empires"
 AUHFX_the_union_chair_bonus:0 "The Chair of the Union"
