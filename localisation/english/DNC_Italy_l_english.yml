 renato_sandalli:0 "Renato Sandalli"
 rino_corso_fougier:0 "Rino Corso Fougier"
 rodolfo_graziani:0 "Rodolfo Graziani"
 silvio_scaroni:0 "Silvio Scaroni"
 ugo_cavallero:0 "Ugo Cavallero"
 vittorio_ambrosio:0 "Vittorio Ambrosio"
 ITA_p_the_piazza:0 "The Piazza"
 ITA_p_the_piazza_desc:0 "What the prefects report from the squares, the chambers of labour and the mills, kept as one figure in a book at the Interior. The state shelled Milan for less than this.\n\nThe piazza: §Y[?ITA_piazza|0]§! of 100. It will not fall below §Y[?ITA_piazza_floor|0]§!.\n\n§R45§!: the strike spreads. §R60§!: the ministry falls. §R75§!: the province is out of hand. §R90§! for three months: insurrection."
 ITA_c_the_chamber:0 "The Chamber"
 ITA_c_the_chamber_desc:0 "There is no party in this Chamber, only a majority, and a majority is a thing assembled deputy by deputy in a room off the corridor. It holds until the bill comes.\n\nThe government's hold: §Y[?ITA_majority|0]§! of 100, of which §Y[?ITA_majority_bought|0]§! was made by the prefects.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. Public works promised and not yet delivered: §Y[?ITA_pledges|0]§!."
 ITA_p_the_army_in_the_streets:0 "The Army in the Streets"
 ITA_p_the_army_in_the_streets_desc:0 "Bava Beccaris was decorated for it, and the country has not stopped counting since. Every time the troops are sent the square empties that week and refills the next year with men who remember.\n\nTimes the army has been used against a crowd: §Y[?ITA_bayonets|0]§!. Each one raises the floor of the piazza by §R4§! and adds §R0.25§! to its monthly rise, permanently."
 ITA_p_the_province_ungoverned:0 "The Province Is Not Governed"
 ITA_p_the_province_ungoverned_desc:0 "The prefect is in his residence with the shutters closed, the telegraph is cut, and a committee sitting in the town hall is issuing passes. Nothing is being built here and nothing is being shipped out."
 ITA_p_the_strike_spreads:0 "The Strike Spreads"
 ITA_p_the_strike_spreads_desc:0 "It began in one trade and it is now in all of them: the port, the railway shops, the tramways, the mills along the Olona. There is no fund to break, no leader to arrest and no demand to concede, because nobody drew one up. The furnaces are banked and the country is waiting to see what the government is."
 ITA_p_the_country_divided:0 "The Country Divided"
 ITA_p_the_country_divided_desc:0 "There is a line across the peninsula now with an army on either side of it, and the kingdom that Cavour assembled in eleven years has come apart in a fortnight. Whichever side wins, no conscript from those provinces will be trusted with a rifle for a generation."
 ITA_c_the_ministry_of_transition:0 "A Ministry of Transition"
 ITA_c_the_ministry_of_transition_desc:0 "The King has sent for a man everyone can accept because nobody wants him, and he has undertaken to do nothing at all until the situation clarifies. Every measure is put off to the spring session. The situation does not clarify."
 ITA_c_the_chamber_will_not_vote:0 "The Chamber Will Not Vote"
 ITA_c_the_chamber_will_not_vote_desc:0 "The estimates were laid before the House and the House went home. There is no majority for anything: not for the ministry, not against it, not for the credits, not for a dissolution. The Kingdom is administered by the permanent officials and by nobody else."
 ITA_c_the_majority_returned:0 "The Majority Returned"
 ITA_c_the_majority_returned_desc:0 "Three hundred and some deputies came back with the government, and for two sessions the ministry can put a bill down and know the numbers before the division bell. It will not last, because it never does, but it is the only condition in which anything in this kingdom gets built."
 ITA_repress_tt:0 "§RThe army is used against the crowd.§! The piazza falls by §Y14§! now. The count of bayonets rises by §Y1§!: the floor of the piazza rises §Y4§! and its monthly rise §Y0.25§!, permanently."
 ITA_ministry_falls_tt:0 "§RThe ministry falls.§! The most senior standing of the government's political spirits is lost, and the majority falls by §Y15§!."
 ITA_ungoverned_tt:0 "§RTwo provinces pass out of the government's hands for eight months§! and produce nothing while they are gone."
 ita_dnc.600.t:0 "The Chambers of Labour Vote to Come Out"
 ita_dnc.600.d:0 "It began over a shooting in Sardinia and it is now in Milan, Genoa, Turin and Rome at once, without a central committee, without a demand, and without a fund. The trams have stopped, the port has stopped, and the newspapers are not being printed. Nobody in this ministry has seen a general strike before, because until this week no European country had one.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!."
 ita_dnc.600.a:0 "Send the prefect to sit at the table with them."
 ita_dnc.600.b:0 "The garrison will clear the squares by this evening."
 ita_dnc.600.c:0 "It has no demands. It will exhaust itself."
 ita_dnc.601.t:0 "The Ministry Falls"
 ita_dnc.601.d:0 "The majority that voted the estimates in the spring did not divide with the government tonight, and the men who arranged it are already in the corridor arranging the next one. Nothing was defeated on principle. A hundred deputies simply decided that a ministry with the country in this state is not a ministry worth being counted with.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!, the majority at §Y[?ITA_majority|0]§!."
 ita_dnc.601.a:0 "Send for the same man. He will make another majority."
 ita_dnc.601.b:0 "Send for someone the Chamber has not yet used up."
 ita_dnc.601.c:0 "Ask the King to prorogue the House until it is calmer."
 ita_dnc.602.t:0 "The Province Is Out of Hand"
 ita_dnc.602.d:0 "It started with three men shot at a meeting and it is now a week old. The railway has been torn up outside the city, the telegraph is cut, the tax registers have been burned in the square, and in the smaller towns committees have declared themselves and are issuing bread tickets. The prefect reports that he has no force he can rely on and asks for instructions.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!. No amount of political credit will settle this one."
 ita_dnc.602.a:0 "Two divisions and a state of siege. It ends this month."
 ita_dnc.602.b:0 "Concede what they are asking for, in writing, today."
 ita_dnc.602.c:0 "The prefects will manage it without the army."
 ita_dnc.603.t:0 "The Insurrection"
 ita_dnc.603.d:0 "The Romagna has been out of the government's hands for three months and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report. In Tuscany the garrison commander has asked to be relieved rather than fire. What is being read from the balconies is no longer a list of grievances but a constitution.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!. The kingdom is past the point where a ministry decides anything."
 ita_dnc.603.a:0 "Then it is a war, and we shall fight it."
 ita_dnc.604.t:0 "The Province Is Governed Again"
 ita_dnc.604.d:0 "The committees have dispersed, the prefect is back at his desk, and the registers are being copied out again from the tax rolls in Rome. The line is repaired as far as the junction. Nobody has been prosecuted, which is the only reason it is over."
 ita_dnc.604.a:0 "Let nothing be said about it in the House."
 ita_dnc.700.t:0 "The Circular to the Prefects"
 ita_dnc.700.d:0 "The draft is on the desk and it says nothing that could be read out. It tells ninety prefects which candidates the government regards with favour, which licences may be granted before the poll, and which roads and aqueducts are to be surveyed in which constituencies. It has always been sent. The only question is how hard to write it.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. The machine is worth §Y[?ITA_machine_now|0]§! with the prefectures the ministry already holds."
 ita_dnc.700.a:0 "Write it hard. Promise the works and name the men."
 ita_dnc.700.b:0 "Send it as it has always been sent."
 ita_dnc.700.c:0 "Withdraw it. The prefects will supervise and nothing else."
 ita_dnc.701.t:0 "The General Election"
 ita_dnc.701.d:0 "Two and a half million men have the vote out of thirty-three million Italians, and in half the southern constituencies the poll is a formality arranged in the prefecture. The clergy have quietly been released from the ban in a few dioceses and will vote for the first time since 1870.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.701.a:0 "The prefects will make the returns."
 ita_dnc.701.b:0 "Fight it on what the ministry has actually built."
 ita_dnc.701.c:0 "The government will not touch this election."
 ita_dnc.702.t:0 "The General Election"
 ita_dnc.702.d:0 "The socialists come back stronger from the North whatever is done, and the ministry's answer is the same as ever: find the numbers somewhere else. In the South that means the prefectures. In the Veneto and the Marche it means the parish clergy, who now have an understanding with the government that neither side will put on paper.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.702.a:0 "The prefects will make the returns."
 ita_dnc.702.b:0 "The sacristy will deliver what the prefecture cannot."
 ita_dnc.702.c:0 "The government will not touch this election."
 ita_dnc.703.t:0 "The First Election of the Whole Country"
 ita_dnc.703.d:0 "The register has gone from two and a half million to eight and a half. Every man over thirty votes now whether he can read or not, and there are constituencies in Apulia and Sicily where the prefect does not know the name of one elector in twenty. The machine that made every majority since Depretis has just been handed an electorate it has never met.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects. The piazza stands at §Y[?ITA_piazza|0]§!."
 ita_dnc.703.a:0 "Nothing can be arranged now. Let the country vote."
 ita_dnc.703.b:0 "Go to the sacristy. It is the only list that still holds."
 ita_dnc.703.c:0 "The register is unchanged. The prefects will make the returns."
 ita_dnc.703.e:0 "The government will not touch this election."
 ita_dnc.705.t:0 "The Returns"
 ita_dnc.705.d:0 "The last constituencies have been declared and the clerks at Montecitorio have finished the arithmetic that decides what kind of ministry this is going to be.\n\nThe majority now stands at §Y[?ITA_majority|0]§! of 100. Above §G55§! the government is returned; between §Y35§! and §Y54§! it holds office without holding the House; below §R35§! it does not govern at all."
 ita_dnc.705.a:0 "The government is returned."
 ita_dnc.705.b:0 "A ministry, then, but not a majority."
 ita_dnc.705.c:0 "There is no government in this Chamber."
 ita_dnc.610.t:0 "The Hour After Monza"
 ita_dnc.610.d:0 "Bresci is in the cell at Milan and will not stop explaining himself. He came home from a silk mill in Paterson, New Jersey, with his fare paid by subscription, to answer the guns Bava Beccaris turned on the bread riots two years ago; and he says so in the tone of a man reading out an invoice.\n\nThe court is in mourning, the Chamber is adjourned, and every prefect in the kingdom is telegraphing for instructions. Whatever goes back over that wire is the constitution of this reign, and it will be quoted in every prefecture for twenty years."
 ita_dnc.610.a:0 "The law of suspects. Every anarchist name into the register, and the registers do not close."
 ita_dnc.610.b:0 "The clemency of the new reign: quash the Milan sentences and let them come home."
 ita_dnc.610.c:0 "The oath to the Statuto, and not one word past it."
 ita_dnc.611.t:0 "The Port That Stopped"
 ita_dnc.611.d:0 "A prefect has dissolved the chamber of labour at Genoa by decree, and the port has answered by stopping. No coal in, no grain in, nothing out of the Ansaldo sheds. The Welsh colliers are riding at anchor in the roads and the furnaces have eleven days of stock behind them.\n\nThe prefect did not invent his authority. He read it in the circulars, and the circulars came from us."
 ita_dnc.611.a:0 "The prefect is sustained. The hall stays shut and the quays are cleared."
 ita_dnc.611.b:0 "The prefect is recalled and the decree withdrawn over his own signature."
 ita_dnc.611.c:0 "Neither. Let the shipowners and the league find the bottom of it themselves."
 ita_dnc.612.t:0 "The Ministry of the Left"
 ita_dnc.612.d:0 "Zanardelli is seventy-five and has agreed to be Prime Minister on the understanding that somebody else does the work. The somebody is a Piedmontese ex-official of the Treasury with no oratory, no faction and a complete card index of the prefectures.\n\nThe King has asked him what he intends to do about the strikes. He intends, he says, to let them happen. The Chamber has not yet decided whether that is statesmanship or abdication, and neither has the country."
 ita_dnc.612.a:0 "Giolitti to the Interior. The prefects answer to him and to nobody else."
 ita_dnc.612.b:0 "Zanardelli's programme entire: the state stands out of the strikes, and says so in the Gazette."
 ita_dnc.612.c:0 "Sonnino instead. Torniamo allo Statuto: the Crown governs and the Chamber approves."
 ita_dnc.623.t:0 "The Agents at the Quayside"
 ita_dnc.623.d:0 "Six hundred thousand a year now. The agents meet them at the station in Naples with a ticket, a contract in a language they cannot read, and a bunk below the waterline. Two hundred drowned off Cape Palos last spring in a hull that had no business carrying passengers, and the consulate learned of it from the newspapers.\n\nThe bill creating a Commissariat of Emigration is drafted. The shipping houses of Genoa and Naples hold eleven seats between them, and they have read it."
 ita_dnc.623.a:0 "The Commissariat sails with them: fares fixed, hulls surveyed, consuls answerable."
 ita_dnc.623.b:0 "The law goes on the statute book and the trade goes on as before."
 ita_dnc.623.c:0 "Land before the ship. Drain the Basilicata and they will not need the Brazil office."
 ita_dnc.613.t:0 "Buggerru"
 ita_dnc.613.d:0 "The Sardinian pits at Buggerru struck over the hour they are made to lose at the coal face, and the company wrote to the prefect asking for troops. The troops came, and the troops fired: three men dead in the road up to the washery and eleven in the infirmary.\n\nThe telegraph out of Sardinia is slow. By the time the Chamber of Labour at Milan has the story it will have been improved in the telling, and it will be true enough."
 ita_dnc.613.a:0 "Court-martial the lieutenant and move the regiment off the island."
 ita_dnc.613.b:0 "The troops were stoned first. The file is closed and the officer is confirmed."
 ita_dnc.613.c:0 "An inquiry, appointed at once, to report when the Chamber is in recess."
 ita_dnc.614.t:0 "Six Days in September"
 ita_dnc.614.d:0 "Milan struck first and Genoa followed the same evening; then Turin, then Rome, then Bologna. By Sunday there is no train moving north of Florence and no newspaper printing but the socialist ones. Nobody ordered it. The Chamber of Labour telegraphed the news from Sardinia and the country did the rest.\n\nNo European state has seen this before. There is no article of the code that fits it and no precedent to send to the prefects, and the ministry has nothing to consult but its own nerve."
 ita_dnc.614.a:0 "The state takes no side. It ends when the strike fund does, and not one day earlier."
 ita_dnc.614.b:0 "The garrisons out. Every station, every gasworks and every tram shed under guard by morning."
 ita_dnc.614.c:0 "Give the leagues what they are asking, and let the Chamber settle the account in February."
 ita_dnc.615.t:0 "The Dissolution"
 ita_dnc.615.d:0 "The strike is over and it changed nothing except everything. The ministry will not sit through a session answering for it, so the Chamber goes home and the country is asked instead.\n\nThe prefects are already writing, in the careful phrasing the service keeps for this, to ask what degree of assistance the government's friends may look for in their constituencies. There are ninety days and five hundred and eight seats."
 ita_dnc.615.a:0 "Work the prefectures. A candidate who wants the seat comes to the Interior first."
 ita_dnc.615.b:0 "Fight it on the strike itself, and let the country say what it thought of it."
 ita_dnc.615.c:0 "Ask the prefects for nothing. The result will be the result."
 ita_dnc.624.t:0 "The Lockout in the Bassa"
 ita_dnc.624.d:0 "Fifty thousand day labourers are out across the province of Parma and the agrarian association has answered with a lockout, a private guard and a subscription list. The children have been sent north to socialist families in Genoa and Milan, in convoys, with bands playing, which the newspapers of the right are calling abduction.\n\nThe prefect wants cavalry. Both sides have stated in writing that they will accept arbitration, on the condition that it goes their way."
 ita_dnc.624.a:0 "Cavalry to the prefect. The camera del lavoro at Parma is closed."
 ita_dnc.624.b:0 "Both parties before a board, a minister presiding, and the award binding on each."
 ita_dnc.624.c:0 "Neither. The harvest is six weeks off and it will settle what we cannot."
 ita_dnc.616.t:0 "The Relief and the Reckoning"
 ita_dnc.616.d:0 "Ten days on. Messina and Reggio are rubble under rain, the count of the dead has passed eighty thousand, and the first organised parties ashore were Russian sailors from a squadron that happened to be lying at Augusta, with British boats behind them. Our own transports came third.\n\nSurvivors are being shot for looting by soldiers who landed after the Russians did. Every newspaper in Europe has that sentence set in type, and so has every deputy who intends to use it."
 ita_dnc.616.a:0 "Martial law in the Straits. The relief is a military operation and the prefects stand down."
 ita_dnc.616.b:0 "Every foreign squadron stays as long as it is useful, and we thank them from the tribune."
 ita_dnc.616.c:0 "Rebuild by decree, to a seismic code, and let the Chamber ratify it when it dares."
 ita_dnc.625.t:0 "The Congress at Florence"
 ita_dnc.625.d:0 "Two hundred of them in a hall on the Via Cavour: professors, poets, a retired admiral and the editors of four newspapers that did not exist last year. They have voted themselves an Association, a programme and a weekly, and the programme holds that the emigrant ships are a national humiliation which a war would cure.\n\nThey have no seats and no funds worth counting. They have Corradini, who writes better than anyone in the Chamber, and a country full of men who went to Brazil because there was nothing for them here."
 ita_dnc.625.a:0 "Let them talk. They sell newspapers. They do not carry constituencies."
 ita_dnc.625.b:0 "Take the programme and leave them the name: say from the tribune that Tripoli is Italian."
 ita_dnc.625.c:0 "Prosecute the loudest of them for incitement and see how the subscriptions hold."
 ita_dnc.617.t:0 "Tripoli"
 ita_dnc.617.d:0 "The note gives the Porte twenty-four hours and asks for a thing no Sultan can grant and keep his throne. The Banco di Roma has been buying land around Tripoli for four years and would now like to be paid for it in sovereignty. The nationalist press has printed the map so often that half the country believes the place is already ours.\n\nThe General Staff was told a fortnight ago. The Chamber has not been told at all, and is not sitting."
 ita_dnc.617.a:0 "The note goes tonight. The papers say four weeks and the Staff has not contradicted them."
 ita_dnc.617.b:0 "Not this year. Tell the Banco di Roma to sell its holdings to whoever will take them."
 ita_dnc.617.c:0 "Send it in the recess. The Chamber can approve the war it finds waiting in February."
 ita_dnc.617.e:0 "The war is already ours. The vote is a formality and the ministry will collect it."
 ita_dnc.619.t:0 "The Register"
 ita_dnc.619.d:0 "The bill lays it before the Chamber in a single clause. Every male subject of thirty, whether he can read or not; every man of twenty-one who has served with the colours. Eight and a half million electors where there were three, and most of the new ones live in places the deputy has never had to visit.\n\nThe whips have done the arithmetic and have not shown it to the Prime Minister. He did it himself a year ago, and proposed the bill anyway."
 ita_dnc.619.a:0 "Pass it whole. Thirty years, literate or not, and the soldiers at twenty-one."
 ita_dnc.619.b:0 "Announce the reform and leave the literacy test in committee."
 ita_dnc.619.c:0 "No. The Chamber we have was chosen by the part of the country that can read."
 ita_dnc.618.t:0 "The Year It Does Not End"
 ita_dnc.618.d:0 "Twelve months. The coast towns are ours down to the last customs house and nothing behind them is. The columns that go inland come back thinner and with no map worth the paper; the Senussi decline battle and have no need of it.\n\nTwo hundred and fifty thousand men are in Africa or on their way, a class has been held with the colours, and the socialist press prints the casualty lists in full because it is the only thing the censor lets it print. In the Romagna a schoolmaster's son has been expelled from his own party for being insufficiently against this war. He is against it now."
 ita_dnc.618.a:0 "Take the islands. Rhodes and the Dodecanese, and let the Porte feel it in the Aegean."
 ita_dnc.618.b:0 "Ouchy. Sign whatever ends it and call what is left the Fourth Shore."
 ita_dnc.618.c:0 "Stay. Garrison it, wire it, and wait for the Senussi to tire before we do."
 ita_dnc.620.t:0 "The Lists of Count Gentiloni"
 ita_dnc.620.d:0 "There is no treaty, no announcement and no signature anywhere. There is a list of the government's candidates whom the parish clergy may lawfully recommend, and seven points those candidates undertake not to vote against: the schools, the orders, divorce.\n\nThe Vatican has not lifted the non expedit and will not. It has simply stopped enforcing it in three hundred and thirty constituencies, and it can start again."
 ita_dnc.620.a:0 "Sign the seven points. The clergy will do the rest in every parish that has one."
 ita_dnc.620.b:0 "Nothing in writing, nothing denied, and the lists circulate regardless."
 ita_dnc.620.c:0 "Run against the sacristy. A ministry that owes the bishops cannot govern the Left."
 ita_dnc.621.t:0 "Red Week"
 ita_dnc.621.d:0 "Three dead at Ancona at an antimilitarist meeting, and the country went up in four days. Ravenna and Ancona are in the hands of committees, the line is cut at Fabriano, a republic has been proclaimed in at least two towns of the Romagna and in one of them the tricolour has come down.\n\nThe General Confederation called the general strike on Tuesday and is privately trying to work out how to call it off. Malatesta is somewhere in the Marches; so, since Thursday, are ten thousand troops who cannot find him."
 ita_dnc.621.a:0 "A hundred thousand men into the Romagna and the Marches, and the committees broken up in their own squares."
 ita_dnc.621.b:0 "Wait. The Confederation will call it off inside the week because it must."
 ita_dnc.621.c:0 "Concede the thing they are actually out for: abolish the disciplinary companies."
 ita_dnc.622.t:0 "What the Alliance Was Worth"
 ita_dnc.622.d:0 "Vienna sent her ultimatum to Belgrade without consulting us, which Article VII says she may not do, and asked for our support after posting it. Berlin assumes we are coming. The Consulta has taken the treaty out of the safe and read it aloud twice, and it does not improve.\n\nThe army has not finished digesting Libya. The Chamber is the one the country elected under the register we gave it. Whatever the ministry decides this week it decides alone, and it will be right or wrong for thirty years."
 ita_dnc.622.a:0 "March with them. The treaty says what it says and a signature is a signature."
 ita_dnc.622.b:0 "Article VII was not honoured. We are not bound, and we say so from the tribune today."
 ita_dnc.622.c:0 "Neutral, and not free of charge. Let both sides tell us what Trento is worth to them."
 ITA_chronicle_answered_tt:0 "§YThe decade takes one more entry. Beats answered so far: §Y[?ITA_chron_answered|0]§!"
 ITA_ch_already_out_tt:0 "§RThe country was already in the streets when the shots were fired.§!"
 ITA_ch_the_prefect_did_not_ask_tt:0 "§RThe prefect did not telegraph first. The ministry learned of the decree from the newspapers.§!"
 ITA_ch_nobody_else_would_take_it_tt:0 "§RNobody else would take the Interior. The King's choice is not a choice.§!"
 ITA_ch_the_trade_is_already_theirs_tt:0 "§RThe agents already have the trade, and the quaysides know it.§!"
 ITA_ch_the_army_was_already_out_tt:0 "§RThe army was out elsewhere before it was out here. Buggerru is not an incident, it is a pattern.§!"
 ITA_ch_the_strike_took_the_railways_tt:0 "§RThe strike has taken the railways north and south.§!"
 ITA_ch_dissolved_over_bayonets_tt:0 "§RThe Chamber is dissolved by a ministry that used troops. Every platform in the country will say so.§!"
 ITA_ch_the_boards_are_tested_tt:0 "§GThe arbitration boards exist. Parma is the first weight they have been asked to hold.§!"
 ITA_ch_messina_on_a_country_out_tt:0 "§RThere are no troops to spare for the Straits. They are holding the cities.§!"
 ITA_ch_messina_the_contracts_tt:0 "§RThe reconstruction contracts are placed before the rubble is cleared, and the Chamber knows which deputies placed them.§!"
 ITA_ch_messina_a_quiet_country_tt:0 "§GA quiet country lets a government be seen to govern.§!"
 ITA_ch_the_last_reserves_tt:0 "§RThe last reserves go south. The cities are held by nobody.§!"
 ITA_ch_the_nationalists_have_an_audience_tt:0 "§RAn angry country is an audience, and the Association has found one.§!"
 ITA_ch_the_papers_have_promised_it_tt:0 "§RThe newspapers have promised this war on the ministry's behalf.§!"
 ITA_ch_asked_in_the_street_tt:0 "§RThe reform is being demanded outside the Chamber before it is moved inside it.§!"
 ITA_ch_the_whips_can_count_tt:0 "§RThe whips have counted the bought seats and know exactly what a mass register costs.§!"
 ITA_ch_the_bought_seats_will_not_hold_tt:0 "§RThe seats bought through the prefectures will not survive the next election.§!"
 ITA_ch_the_coast_is_ours_tt:0 "§YThe coast is ours. The interior has not been informed.§!"
 ITA_ch_the_socialists_have_their_issue_tt:0 "§RThe war has handed the maximalists the argument they were short of.§!"
 ITA_ch_the_reservists_will_not_go_tt:0 "§RThe reservists called for Africa have already been used against their own towns.§!"
 ITA_ch_gentiloni_the_new_register_tt:0 "§YUnder the new register the clergy can deliver more votes than the prefects ever could.§!"
 ITA_ch_gentiloni_the_old_register_tt:0 "§YUnder the old register the pact is worth less. The prefects still hold the seats.§!"
 ITA_ch_red_week_held_tt:0 "§YThe provinces hold, barely, and the line is cut in one place only.§!"
 ITA_ch_july_the_country_will_not_march_tt:0 "§RThe country will not march. It has been in the streets all summer and it knows who put it there.§!"
 ITA_ch_july_no_majority_tt:0 "§RThere is no majority to carry a war vote, and the whips have said so in writing.§!"
 ITA_ch_july_the_army_is_in_the_streets_tt:0 "§RThe army is holding Italian towns. It cannot be asked to hold a front as well.§!"
 ITA_ch_the_law_of_suspects:0 "The Law of Suspects"
 ITA_ch_the_law_of_suspects_desc:0 "The register at the Interior has a card for every anarchist in the kingdom, every subscriber to an anarchist paper, and every man seen at a meeting where one spoke. It works: the ministry knows things it did not know. It also tells several hundred thousand people who were not anarchists last year exactly which side the state has taken, and the emigration offices in Naples are busier than they were."
 ITA_ch_the_amnesty_of_the_new_reign:0 "The Amnesty of the New Reign"
 ITA_ch_the_amnesty_of_the_new_reign_desc:0 "The Milan sentences are quashed and the men come home to bands at the station. The reign begins with a gesture nobody in the Chamber advised and half the Senate regards as an insult to the dead King. It buys something that cannot be bought any other way, and it is spent the moment it is made."
 ITA_ch_the_port_that_stopped:0 "The Port That Stopped"
 ITA_ch_the_port_that_stopped_desc:0 "Genoa lands two thirds of what the industrial triangle burns, and Genoa is shut. The colliers wait in the roads on demurrage, the grain sits in the holds, and Ansaldo has sent its fitters home. Every day of this is a week somewhere inland."
 ITA_ch_the_ministry_of_the_left:0 "The Ministry of the Left"
 ITA_ch_the_ministry_of_the_left_desc:0 "An old orator in front and a card index behind him. The prefectures have a minister who reads their reports, remembers them, and answers by return; the Chamber has a leader who can count. It is not a programme and does not pretend to be one, but it governs, which is more than the last four ministries managed."
 ITA_ch_the_agents_of_the_ports:0 "The Agents of the Ports"
 ITA_ch_the_agents_of_the_ports_desc:0 "The law exists and is not enforced, which suits everyone who wrote it. The agents keep the trade, the fares stay what the traffic will bear, and the men keep going: from the Veneto, from the Basilicata, from villages that will have no men of military age in them by the time the class is called. The state is not paying for this. It is simply losing them."
 ITA_ch_the_officers_grievance:0 "The Officers' Grievance"
 ITA_ch_the_officers_grievance_desc:0 "A lieutenant has been tried for obeying an order the prefect gave and the ministry did not withdraw. The mess at every garrison in the kingdom has now worked out that the state will send them into a piazza and then disown them for what happens there. They will still go. They will go slowly, and they will not volunteer."
 ITA_ch_the_troops_were_right:0 "The Troops Were Right"
 ITA_ch_the_troops_were_right_desc:0 "The officer is confirmed in his rank, the file is closed, and the army knows the state stands behind the rifle. So does everybody else. There is a discipline in the barracks that was not there last year, and a hardness in the leagues that was not there either, and the second will outlast the first."
 ITA_ch_the_general_strike:0 "The General Strike"
 ITA_ch_the_general_strike_desc:0 "No train, no tram, no gas, no press but one. Nobody in Europe has done this before and nobody is certain how it stops. Whatever else it proves, it has proved that the country can be halted by men who own nothing and hold no office, and every ministry from now on will govern with that fact in the room."
 ITA_ch_the_lockout_of_parma:0 "The Lockout in the Bassa"
 ITA_ch_the_lockout_of_parma_desc:0 "The agrarians have money and time and the leagues have neither, so the fields stand and the bassa eats what the subscription lists send it. The children are in Genoa. The province is being run by two private organisations, neither of which is the prefecture."
 ITA_ch_the_seismic_decree:0 "The Seismic Decree"
 ITA_ch_the_seismic_decree_desc:0 "The Straits are rebuilt to a code written by engineers and imposed by decree, over the heads of the Chamber, the province and everyone who owned a building in Messina. It is the best piece of administration the kingdom has done in twenty years, and it was done in a way the constitution does not contemplate."
 ITA_ch_the_africa_of_the_newspapers:0 "The Africa of the Newspapers"
 ITA_ch_the_africa_of_the_newspapers_desc:0 "The ministry has said from the tribune what the nationalist weeklies have been saying for a year: that Tripoli is Italian and only the date is in question. The country liked it. So did the Association, which has now been told by the government itself that its programme is the government's, and will hold the ministry to it."
 ITA_ch_the_war_that_was_not_declared:0 "The War That Was Not Declared"
 ITA_ch_the_war_that_was_not_declared_desc:0 "The note was drafted and not sent. The Banco di Roma is selling its Tripolitanian holdings at whatever it can get, the nationalist press has found the word renunciation and will not put it down, and a Chamber that had already been promised a colony has been handed a prudent explanation instead. The peace is real. So is the bill for it."
 ITA_ch_the_desert_that_pays_nothing:0 "The Desert That Pays Nothing"
 ITA_ch_the_desert_that_pays_nothing_desc:0 "A year in, and the war consists of holding the coast against people who do not want the coast. The columns march, find nothing, and are shot at on the way back. The class held with the colours is a year older, the casualty lists are printed in full, and the men writing against the war in the Romagna are getting a hearing they never had in peacetime."
 ITA_ch_the_garrison_of_the_fourth_shore:0 "The Garrison of the Fourth Shore"
 ITA_ch_the_garrison_of_the_fourth_shore_desc:0 "Forts, wire, wells and blockhouses from Zuara to Derna, held by conscripts who did not expect Africa, resupplied by sea because there is no other way. It is permanent now, and it is subtracted from every other thing the army might be asked to do."
 ITA_ch_the_wider_register:0 "The Wider Register"
 ITA_ch_the_wider_register_desc:0 "Eight and a half million electors, most of whom have never voted and owe nothing to anybody. The Socialists have a constituency, the Catholics have a constituency, and the deputy who used to be returned by four hundred notables and a prefect's letter no longer knows who is in his own division. This is what was asked for. It cannot be given back."
 ITA_ch_the_register_unrevised:0 "The Register Unrevised"
 ITA_ch_the_register_unrevised_desc:0 "The reform was announced in the Chamber and the literacy test stayed in committee, where it will be studied. The country has been told it has the vote and has not been given it, which quiets the tribune for a session and settles nothing at all."
 ITA_ch_the_romagna_remembers:0 "The Romagna Remembers"
 ITA_ch_the_romagna_remembers_desc:0 "The committees are broken, the tricolour is back up, and the Romagna has learned exactly what the state will do and how long it takes to do it. The men who ran those four days are alive, at liberty, and no longer arguing among themselves about method."
 ITA_ch_the_barracks_reform:0 "The Barracks Reform"
 ITA_ch_the_barracks_reform_desc:0 "The disciplinary companies are abolished and the punishment regulations rewritten, which is what the meeting at Ancona was called about in the first place. The country is quieter than it has been since the strike. The General Staff has put its objection in writing and asked that it be filed where it can be found later."
 ITA_ch_the_alliance_honoured:0 "The Alliance Honoured"
 ITA_ch_the_alliance_honoured_desc:0 "The treaty was kept. Italy marches with the partner she has spent thirty years distrusting, for a quarrel about Serbia, over an ultimatum she was not shown. The army is better for having a decision. The country was not asked, and the party that will tell it so is already writing."
 ITA_ch_the_scrap_of_paper:0 "The Letter of the Treaty"
 ITA_ch_the_scrap_of_paper_desc:0 "Article VII required consultation and there was none, so the casus foederis does not arise. The lawyers are right, the Consulta is right, and the ministry has read the finding aloud from the tribune. Vienna calls it desertion. The country calls it the first sensible thing done in Rome since Ouchy, and means it."
 ITA_ch_the_hands_are_free:0 "The Hands Are Free"
 ITA_ch_the_hands_are_free_desc:0 "Neutral, and letting it be known in both capitals that neutrality has a price and a shelf life. Two embassies now have an interest in improving their offer and neither can be certain of us. It is not a policy anyone would put in a despatch, and it is worth more than one."
 ITADNC_z_the_chamber_adjourned_indefinitely:0 "The Chamber Adjourned"
 ITADNC_z_the_chamber_adjourned_indefinitely_desc:0 "We close the session and set no date for the next. Our decrees have done every piece of governing worth doing, and the deputies have learned to read the Gazzetta for their instructions. We dissolve nothing. The building simply stops being the place where Italy is decided."
 ITADNC_z_the_ministry_of_the_extreme_left:0 "The Ministry of the Extreme Left"
 ITADNC_z_the_ministry_of_the_extreme_left_desc:0 "Turati will not take a portfolio, so Bissolati's people take five, and the King signs the list like a man signing a bill. The wider register put them there. We hand them the file on Libya and the file on the Adriatic, and wait to see what a reformist does with them."
 ITADNC_z_the_reckoning_of_the_decade:0 "The Reckoning of the Decade"
 ITADNC_z_the_reckoning_of_the_decade_desc:0 "A decade and more. Our prefects have counted the majority, our questori the piazza, the War Ministry the times we called the army out, and Vienna's attache has counted everything else. All of it lies on one sheet at the Interior now. Whatever we have made of this kingdom, it is that, and Europe is about to ask."
 ITADNC_z_the_columns_come_home:0 "The Columns Come Home"
 ITADNC_z_the_columns_come_home_desc:0 "We order the garrisons back to the coast - Tripoli, Homs, Benghazi, Derna - and nothing inland that cannot be reached from a ship. The interior goes to men we never beat, our flag stays over five towns, and the General Staff will call it a defeat in writing for a generation."
 ITA_z_the_chamber_adjourned:0 "The Chamber Adjourned"
 ITA_z_the_chamber_adjourned_desc:0 "No dissolution, no proclamation, no crisis: only a session that ends and is not reconvened. The ministry governs by decree because the decree is quicker, and quickness has become the only argument anyone makes. The deputies still draw the allowance. They have simply stopped being consulted."
 ITA_z_the_extreme_left_in_office:0 "The Extreme Left in Office"
 ITA_z_the_extreme_left_in_office_desc:0 "Reformists at the Interior, at Labour, at Public Instruction. The prefects who spent a decade counting votes now take instructions from men they used to have followed. The chambers of labour are answered instead of dissolved, and every general in the kingdom has written privately to the King about it."
 ITA_end_the_state_that_chose:0 "The State That Chose"
 ITA_end_the_state_that_chose_desc:0 "Universal suffrage, a Chamber that was not bought, and a piazza that is loud without being ungovernable. Nobody in Europe expected this from Italy and a good many people in Rome did not either. The kingdom enters the crisis of 1914 as the only great power that will decide its own part in it from a position of quiet."
 ITA_end_the_country_was_asked:0 "The Country Was Asked"
 ITA_end_the_country_was_asked_desc:0 "No war without a vote, said aloud and then written down. It makes the ministry slow, it makes the General Staff furious, and it makes any decision Italy reaches almost impossible to reverse afterwards, because the whole country signed it."
 ITA_end_the_ministry_decides_alone:0 "The Ministry Decides Alone"
 ITA_end_the_ministry_decides_alone_desc:0 "The prerogative in foreign affairs belongs to the Crown and its ministers, and the Chamber is informed. It is legal, it is fast, and it means that whatever Italy does next will have been done by eleven men who can be named."
 ITA_end_the_bargain_of_1914:0 "The Bargain"
 ITA_end_the_bargain_of_1914_desc:0 "Terms discussed in a room in London: the Trentino, Trieste, the Istrian coast, Valona, a share of whatever comes apart. Nothing is signed where anyone can see it, and the ambassador in Vienna is not told. Italy has decided who it will be when the war comes, and has decided it in advance and at a price."
 ITA_end_the_word_kept:0 "The Word Kept"
 ITA_end_the_word_kept_desc:0 "The Triple Alliance is thirty years old, the staff talks are current, and Italy marches with Berlin and Vienna because it said it would. Half the Chamber thinks this is madness and the irredentists think it is treason, but no chancellery in Europe will ever again say that an Italian signature means nothing."
 ITA_end_out_by_our_own_decision:0 "Out, by Our Own Decision"
 ITA_end_out_by_our_own_decision_desc:0 "Not neutrality bought, not neutrality forced, and not neutrality from weakness: a kingdom that could have gone either way and told both sides no. The factories keep running, the emigrants keep their sons, and Italy will be present at the peace as the one power with nothing to explain and nothing to claim."
 ITA_end_the_kingdom_by_decree:0 "The Kingdom by Decree"
 ITA_end_the_kingdom_by_decree_desc:0 "Public safety decrees, prefects with a free hand, garrisons quartered in the industrial towns, and a Chamber that meets when it is convenient. It works. Taxes are collected, order is kept, and the ministry can do in a week what used to take a session. Nobody has a word for this yet. Everyone can feel that it does not bend."
 ITA_end_the_ministry_of_the_sword:0 "The Ministry of the Sword"
 ITA_end_the_ministry_of_the_sword_desc:0 "A general at the Interior, a general at the Council, and the Carabinieri answering to both. The army has stopped being the last argument of the state and become its ordinary one, which is a thing armies enjoy for about four years."
 ITA_end_the_civil_mask:0 "The Civil Mask"
 ITA_end_the_civil_mask_desc:0 "A lawyer at the Interior, a professor at Public Instruction, and every decree countersigned by a man in a frock coat. The powers are exactly the same. The photographs are different, and in Italy the photographs have always mattered more than anybody admits."
 ITA_end_the_chamber_recalled:0 "The Chamber Recalled"
 ITA_end_the_chamber_recalled_desc:0 "The deputies come back to a building they had stopped visiting, and spend the first four sittings on the question of who is to blame. The decrees are lifted one by one. It costs the ministry every friend it had in the prefectures, and it is the only thing that stops the country coming apart."
 ITA_end_the_ministry_of_the_left:0 "The Ministry of the Extreme Left"
 ITA_end_the_ministry_of_the_left_desc:0 "The first socialist ministry in Europe, made by a franchise the liberals themselves granted. It will not arm, it will not ally, and it will not send a single class to a war it did not choose. Every embassy in Rome has been instructed to treat the kingdom, for the moment, as a country that is not there."
 ITA_end_the_party_splits:0 "The Party Splits"
 ITA_end_the_party_splits_desc:0 "Bissolati took office and Mussolini took the newspaper, and by autumn there are two socialisms in Italy that will not sit in the same hall. The ministry survives on the votes of men who despise it, which in this Chamber is not unusual and is never comfortable."
 ITA_end_the_price_abroad:0 "The Price Paid Abroad"
 ITA_end_the_price_abroad_desc:0 "The columns are off the caravan roads, the ascari are paid off, and the consulates report that the kingdom's word is being discounted from Constantinople to Addis Ababa. This is what neutrality cost, and it was always going to be charged somewhere other than at home."
 ITA_end_the_pledge_we_kept:0 "The Pledge We Kept"
 ITA_end_the_pledge_we_kept_desc:0 "Rhodes and the twelve islands were taken as security and are not being given back, whatever was promised at Ouchy and whatever the Porte says now. A socialist ministry holding a conquest it voted against is a thing the cartoonists will not let go of."
 ITA_end_the_state_after_the_rising:0 "The State After the Rising"
 ITA_end_the_state_after_the_rising_desc:0 "Ten days, four provinces, and something over a hundred dead before the columns had the railway junctions back. The kingdom that came out of the Romagna is not the kingdom that went in: it knows now exactly what it is prepared to do, and so does everybody else."
 ITA_end_the_provinces_that_left:0 "The Provinces That Left"
 ITA_end_the_provinces_that_left_desc:0 "Ancona, Ravenna, Forli, and half the Marche are administered by committees the prefects cannot name. Taxes are not remitted, conscripts are not delivered, and the ministry has decided that the honest word for the situation is one it will not use in the Chamber."
 ITA_end_the_ministry_from_the_streets:0 "The Ministry from the Streets"
 ITA_end_the_ministry_from_the_streets_desc:0 "The King sent for the men whose arrest he had authorised the previous week, and they came. The rising ends because the government becomes the thing it was raised against. It is the cheapest way this could have ended and there is not a colonel in the kingdom who will forgive it."
 ITA_end_the_kingdom_that_came_out_of_it:0 "The Kingdom That Came Out of It"
 ITA_end_the_kingdom_that_came_out_of_it_desc:0 "Whatever was decided in those ten days is now simply how Italy is governed, and the argument about it has moved from the streets into the histories. A state that has survived its own worst week has a certain hardness afterwards, and pays for it in every other way."
 ITA_end_the_crown_that_would_not_sign:0 "The Crown That Would Not Sign"
 ITA_end_the_crown_that_would_not_sign_desc:0 "The King refused a second state of siege and let a ministry fall rather than sign it. It is the only genuinely popular act of his reign and it has cost him the confidence of the General Staff, the prefects, and his own household."
 ITA_end_the_army_that_cannot_come_home:0 "The Army That Cannot Come Home"
 ITA_end_the_army_that_cannot_come_home_desc:0 "Fifty thousand men between Tripoli and the Fezzan, holding wells against people who do not need to hold anything. Italy is a great power with an army it cannot move, and every chancellery in Europe has done the arithmetic and written Rome off for the season."
 ITA_end_next_year_in_the_fezzan:0 "Next Year in the Fezzan"
 ITA_end_next_year_in_the_fezzan_desc:0 "Another column, another oasis, another dispatch promising that the interior will be pacified before the rains. The troops learn a great deal about desert marching, the treasury learns nothing at all, and the phrase has become a joke in the Chamber that nobody laughs at."
 ITA_end_the_coast_only:0 "The Coast Only"
 ITA_end_the_coast_only_desc:0 "Five towns, a garrison in each, and a line on the map that stops where the guns of the fleet stop. It is not the fourth shore that was promised from a hundred platforms, but the men are back within reach of a transport and the ration returns fit on one page."
 ITA_end_the_staff_that_was_overruled:0 "The Staff That Was Overruled"
 ITA_end_the_staff_that_was_overruled_desc:0 "The General Staff asked for two more divisions and one more year and was refused by civilians, in writing, with reasons. They have kept the copy. Every failure of the next decade will be explained by reference to it, whatever the actual cause turns out to be."
 ITA_end_the_columns_that_came_home:0 "The Columns That Came Home"
 ITA_end_the_columns_that_came_home_desc:0 "Battalions off the transports at Naples and Taranto, thin, yellow, and quiet, marching through towns that had been told for two years they were winning. The army is available again. What it is available for is now a much harder question to answer in public."
 ITA_end_the_decade_in_the_sand:0 "The Decade in the Sand"
 ITA_end_the_decade_in_the_sand_desc:0 "The best infantry in the kingdom has spent its whole service escorting water. They can march, they can shoot, and they cannot be brought to Europe inside a year. Nobody in Rome will say aloud that Libya has cost Italy the only decade that mattered."
 ITA_end_the_accidental_ministry:0 "The Accidental Ministry"
 ITA_end_the_accidental_ministry_desc:0 "Nothing was settled, so a ministry took office that nobody voted for, led by a man nobody chose, resting on a majority that was assembled in a corridor. It will do for the ordinary business of the kingdom. The crisis of 1914 is not the ordinary business of the kingdom."
 ITA_end_the_men_in_the_room:0 "The Men in the Room"
 ITA_end_the_men_in_the_room_desc:0 "Four signatures, no debate, and the Chamber informed afterwards by telegram. Italy can be committed to anything in a fortnight now, which is exactly the argument for the arrangement and exactly the reason the country will not stand behind whatever is decided."
 ITA_end_the_old_man_recalled:0 "The Old Man Recalled"
 ITA_end_the_old_man_recalled_desc:0 "Giolitti comes back the way he always comes back: without a programme, without a speech, and with a list of names. The machine turns over on the first attempt. He will not take the kingdom to war, and he has never once in his life explained himself."
 ITA_end_the_brittle_kingdom:0 "The Brittle Kingdom"
 ITA_end_the_brittle_kingdom_desc:0 "Order without consent holds perfectly until the day it does not. Every month of decrees, every garrison in a factory town, every session not convened adds another degree of stiffness to a structure that has no way left of bending. The figure below is how far it has gone."
 ita_dnc.710.t:0 "The Kingdom Chooses"
 ita_dnc.710.d:0 "There is no crisis. That is the remarkable thing, and every ambassador in Rome has written home about it in the same puzzled tone.\n\nThe franchise is nearly universal and the majority survived it. The chambers of labour negotiate with prefects instead of being dissolved by them. The army has not been called into a piazza in years and the officers have stopped expecting it. There is no state of siege anywhere in the kingdom, and the last of the public safety decrees lapsed without anyone bothering to renew it.\n\nItaly is the poorest of the great powers and the only one that is not afraid of its own people. In a Europe that is loading, that turns out to be a form of strength nobody had a name for."
 ita_dnc.710.a:0 "Then no war without a vote of the Chamber."
 ita_dnc.710.b:0 "The prerogative stays with the ministry."
 ita_dnc.711.t:0 "The Choice of 1914"
 ita_dnc.711.d:0 "Three files on the table at the Consulta. London and Paris will discuss the Trentino, Trieste and the Adriatic coast, and want to know the price. Berlin and Vienna point at a treaty signed in 1882 and renewed four times, and want to know whether an Italian signature is worth anything. The third file is empty, and is the only one that costs nothing to choose.\n\nWhichever is picked up, it will be picked up by a government that could have picked up either of the others. Very few countries in Europe will be able to say that in August."
 ita_dnc.711.a:0 "Hear what London is offering."
 ita_dnc.711.b:0 "We signed it. We will honour it."
 ita_dnc.711.c:0 "Neither. And we will say so first."
 ita_dnc.720.t:0 "The Kingdom by Decree"
 ita_dnc.720.d:0 "Count what is in force. Public safety decrees in nine provinces. Garrisons quartered in the factory towns of the North on a footing that was supposed to last a fortnight. Prefects empowered to dissolve any association by their own signature. A Chamber that meets, votes the estimates, and goes home.\n\nIt works. That is the difficulty. Order is kept, the taxes come in, and the ministry can do in eight days what the Chamber used to spend a session refusing. There is no word yet for a state governed this way, and there will not be one for another decade.\n\nWhat there is, instead, is a structure with nothing left in it that bends. Everything it can do, it does by force, and the amount of force required goes up every year."
 ita_dnc.720.a:0 "Then let it be a soldier who signs."
 ita_dnc.720.b:0 "Keep a civilian face on it."
 ita_dnc.721.t:0 "The Crack"
 ita_dnc.721.d:0 "It begins over something trivial, as these things do: a tram fare in Turin, or a foreman in Sesto San Giovanni, and within a week it is in four cities and the prefects are asking for troops that have already been promised somewhere else.\n\nThe machinery of decree has no lower setting. It can proclaim, arrest and quarter, and it cannot negotiate, because negotiating would concede that there is somebody to negotiate with. The Interior is now recommending measures that would have been thought insane in 1898.\n\nThe alternative is to recall the deputies, admit in front of them that the last several years were a mistake, and let them say so at length."
 ita_dnc.721.a:0 "More decrees. It has always worked before."
 ita_dnc.721.b:0 "Recall the Chamber."
 ita_dnc.730.t:0 "The Ministry of the Extreme Left"
 ita_dnc.730.d:0 "The King has signed the list. He signed it in the manner of a man paying a debt he disputes, but he signed it, and by evening there are socialists at the Interior and at Public Instruction and the Corriere has printed a black border round its own leading article.\n\nThey were put there by the franchise the liberals granted. That is the part nobody in the old majority can answer: it was legal, it was foreseeable, and it was done with the votes of men who had never voted before and had been told for a decade that this was progress.\n\nThe first act of the new ministry is a circular to every embassy. Italy will not arm beyond its frontiers, will not enter any combination of powers, and will not spend a single class of conscripts on a quarrel it did not begin. The second act is to open the file on Libya."
 ita_dnc.730.a:0 "Neutrality, and pay for it where it must be paid."
 ita_dnc.730.b:0 "Neutrality, but the army stays where it stands."
 ita_dnc.731.t:0 "The Price Paid Abroad"
 ita_dnc.731.d:0 "The columns come off the caravan roads and the ascari are paid off in front of the consulate at Benghazi, which several correspondents describe at length. The Senussi are not defeated and will not be; the arrangement is that they are no longer being fought.\n\nThat leaves the islands. Rhodes and the eleven others were occupied as security for a treaty that was signed two years ago, and holding them was always going to be awkward for a government that voted against taking them.\n\nThe Porte has asked, publicly, and is being listened to in four capitals."
 ita_dnc.731.a:0 "Give them back. We said we would."
 ita_dnc.731.b:0 "The islands stay. There are limits."
 ita_dnc.740.t:0 "The Week That Did Not End"
 ita_dnc.740.d:0 "It started the way it started in Ancona: three dead at a meeting, and the news on every railway telegraph in the country by nightfall. The general strike was called for a week. The week is over.\n\nIn the Romagna the prefects have withdrawn to the provincial capitals and in two of them not even that. Railway staff take orders from committees. Taxes are being collected by people who issue receipts. The red flag is over the town hall in a dozen places and in several of them it has been there long enough that the arrangement has begun to look like an administration.\n\nThe Chamber is sitting through the night. Every option on the table has a name attached to it, and every name belongs to somebody who will be remembered for this."
 ita_dnc.740.a:0 "Every division we have, into the Romagna."
 ita_dnc.740.b:0 "We do not have the men. Hold the line where it is."
 ita_dnc.740.c:0 "The King will send for them."
 ita_dnc.741.t:0 "The State That Came Out of It"
 ita_dnc.741.d:0 "The country goes back to work, and finds that the government it went back to is not quite the one it left."
 ita_dnc.741.d.a:0 "The junctions were retaken in ten days, which is faster than anybody at the Interior had promised and slower than the newspapers will admit. There are figures for the dead and there are two sets of them.\n\nWhat has changed is not written anywhere. The state has learned what it is willing to do to its own citizens, and has found the answer tolerable. Every prefect in the kingdom now knows he will be supported. Every chamber of labour knows what the alternative to negotiation is. The men who gave the order have not slept and will govern for another decade on the credit of that week.\n\nThis is a harder country than it was in the spring. Nobody involved is sure it is a better one."
 ita_dnc.741.d.b:0 "There is a line on the staff map now, and on the far side of it the kingdom's writ does not run. Nobody calls it a frontier. The word in the ministry is provisional, and it has been provisional for four months.\n\nConscripts are not delivered. Taxes are not remitted. The prefects report on the situation the way consuls report on a foreign country, and one of them has begun, without irony, to use the word negotiations.\n\nItaly is smaller than it was and cannot say so out loud, because saying so would require somebody to explain how it happened."
 ita_dnc.741.d.c:0 "They came to the Quirinale in the clothes they had been arrested in, and the King received them, and by the following week the general strike had been called off by the people who called it.\n\nIt worked. It is the only thing that would have worked, and it cost the Crown every friend it had in the officer corps. Two army corps commanders have applied to be relieved. The prefects are drafting their resignations and holding them. In the barracks of a dozen garrison towns young officers are saying, quietly, that the monarchy has shown what it is worth.\n\nThe country is calm. It is calm in the way a house is calm after the argument that decides everything."
 ita_dnc.741.a:0 "Then this is how Italy is governed now."
 ita_dnc.741.b:0 "The King will not sign a second state of siege."
 ita_dnc.750.t:0 "The Army Is in Africa"
 ita_dnc.750.d:0 "The war was to take six weeks. It has taken three years and it has not stopped, because there is no capital to occupy, no army to defeat, and nobody with the authority to surrender.\n\nWhat there is: fifty thousand men strung along a coast and up two caravan roads, holding wells against people who do not need to hold anything and can wait. The best regiments in the kingdom are there. So are the mountain batteries that were built for the Cadore, and the ascari, and most of the transport.\n\nIn Europe the arithmetic has been done. Vienna has reassessed the Adriatic. Paris no longer bothers to ask what Rome thinks. Italy is a great power that cannot move a corps across the Mediterranean inside a season, and everybody knows it except the newspapers."
 ita_dnc.750.a:0 "Hold the interior. It will be finished next year."
 ita_dnc.750.b:0 "The coast only. Bring the rest back."
 ita_dnc.751.t:0 "The Columns"
 ita_dnc.751.d:0 "Another year of it. The dispatches have stopped promising anything and now simply report positions, which the Chamber has noticed.\n\nThe General Staff wants two more divisions and one more season and has wanted them for three years running. The Interior wants the classes released, because the piazza has begun to make the connection between the wells of the Fezzan and the price of everything at home. The Consulta has stopped arguing and is simply pointing at the calendar.\n\nSomebody has to sign an order that says the interior is not going to be held, and whoever signs it will be answering for it in front of a commission before the decade is out."
 ita_dnc.751.a:0 "Sign it. Bring them home."
 ita_dnc.751.b:0 "No. We do not leave the wells."
 ita_dnc.760.t:0 "The Accidental Ministry"
 ita_dnc.760.d:0 "Nothing was settled. That is the whole account of it.\n\nThe piazza was neither broken nor satisfied. The Chamber was neither reformed nor abolished. The franchise came in and the machine went on and the two of them have been circling one another for two years without either giving way. Then the last ministry fell over an estimate, and the man who could form one at short notice was not the man anybody had in mind for a serious year.\n\nHe is competent, he is conservative, and he has no majority of his own and no standing in the country. The prefects do not know him. The King barely does. Europe is loading, and this is who is holding the kingdom's end of the rope."
 ita_dnc.760.a:0 "Let the Consulta and the Crown handle it."
 ita_dnc.760.b:0 "Send for Giolitti."
 ITA_end_reckoning_tt:0 "The verdict on the decade will be taken."
 ITA_end_readout_tt:0 "§YThe Piazza stands at [?ITA_piazza|0]. The majority stands at [?ITA_majority|0], of which [?ITA_majority_bought|0] was bought. The army has been called out [?ITA_bayonets|0] times.§!"
 ITA_end_free_hand_tt:0 "Italy may enter or make a faction, and may send volunteers, at its own choosing."
 ITA_end_neutral_lock_tt:0 "Italy may not join or create a faction, and may not declare war without a war goal."
 ITA_end_chamber_dead_tt:0 "The Chamber no longer governs. The majority is a formality."
 ITA_end_bargain_london_tt:0 "The terms are noted and not written where anyone can read them."
 ITA_end_word_kept_tt:0 "The alliance holds, and the irredentists will not forgive it."
 ITA_end_out_by_choice_tt:0 "Italy stands out of the coming war by its own decision, and says so first."
 ITA_end_islands_returned_tt:0 "The Dodecanese returns to the Porte."
 ITA_end_islands_kept_tt:0 "The islands are kept, against everything the ministry stood for."
 ITA_end_provinces_go_tt:0 "Emilia Romagna, Abruzzo and Tuscany pass out of the government's control."
 ITA_end_put_down_tt:0 "The rising is broken by the army. The Piazza falls to 30 and will never again fall below 35."
 ITA_end_libya_closed_tt:0 "The war in Libya is closed. The army is available again."
 ITA_t_vienna_seeded_tt:0 "§YConfidence at Vienna§! begins at §Y[?ITA_vienna_trust|0]§! of 100 and will be read by every ally we keep or lose."
 ITA_t_the_hunt_costs_a_bayonet_tt:0 "§RThe hunt for Bresci's accomplices puts troops into the working quarters.§! A §Rbayonet§! is spent, and the Piazza will never again fall below where it now stands."
 ITA_t_the_law_is_enough_tt:0 "§GThe law is allowed to be enough.§! The prefects are told to make no arrests they cannot justify to a magistrate, and the Chamber notices."
 ITA_t_the_question_is_put_tt:0 "§YThe ministry must answer the Genoa decree.§! What it answers depends on whether the street is already up."
 ITA_t_the_port_is_shut_tt:0 "§RThe port is shut and the ministry gives way.§! The decree is withdrawn, the prefect is transferred, and ninety prefectures learn that a general strike works."
 ITA_t_the_prefect_is_sustained_tt:0 "§GThe prefect is sustained.§! The decree stands, the machine gains a lever it will use for a decade, and the Extreme Left has its argument for the next twenty years."
 ITA_t_the_price_of_the_quays_tt:0 "§RThe coal quays at Genoa are worked by men who now know what they are worth.§! The Chamber is asked to vote money for water it cannot see."
 ITA_t_the_roads_before_us_tt:0 "§YFive roads lead out of Adwa:§! the §Rarmy§!, the §Bfleet§!, the §GChamber§!, the §Gcountry beneath the state§!, and the §YConsulta§!. The estimates will not stretch to all of them."
 ITA_t_the_answer_at_genoa:0 "The Answer at Genoa"
 ITA_t_the_answer_at_genoa_desc:0 "Whatever the ministry said about the Genoa decree is being read aloud in ninety prefectures, and nobody in Italy is quite sure yet what it will mean when the next port stops."
 ITA_t_the_three_memoranda:0 "The Three Memoranda"
 ITA_t_the_three_memoranda_desc:0 "The War Ministry, the Marine and the Treasury have each sent the King a paper explaining why the others should be cut. Until one of them is chosen, every department is spending the same lira twice on paper."
 ITA_t_luzzatti_at_the_treasury:0 "Luigi Luzzatti"
 ITA_t_luzzatti_at_the_treasury_desc:0 "The banker who founded the people's banks and has balanced more budgets than any man in the Chamber. He will find the money, and he will tell you exactly whose it was."
 ITA_a_the_book_carried_over_tt:0 "§GThe trunk book does not simply vanish.§! A third of the ninety prefectures carry over into the §Ystanding machine§! the new ministry inherits."
 ITA_a_genoa_is_remembered_tt:0 "§GThe ministry that gave way at Genoa is trusted a little further.§! The street comes down before the new Chamber sits."
 ITA_a_genoa_is_remembered_badly_tt:0 "§RThe ministry that sustained the prefect at Genoa opens with an enemy already organised.§! It has political power and it has no goodwill."
 ITA_a_the_machine_carries_it_tt:0 "§YThe prefects deliver the neutral state's majority§!, which means it is owed favours it has not yet been asked for."
 ITA_a_the_bargain_is_made_in_the_lobby_tt:0 "§GWithout a machine, the arrangement is made group by group in the lobby.§! It is cheaper and it is less reliable."
 ITA_a_nitti_at_the_board_tt:0 "Francesco Saverio Nitti becomes available as a political advisor."
 ITA_a_nitti_at_the_board:0 "Nitti at the Board of Trade"
 ITA_a_nitti_at_the_board_desc:0 "The Southern economist who counted what the North had taken and published the figure. He is not popular in Milan and he is entirely correct."
 ITA_a_the_street_answers_sonnino_tt:0 "§RThe street answers the Statuto before the Chamber can.§! A §Rbayonet§! is spent putting the answer down."
 ITA_a_the_country_is_quiet_enough_tt:0 "§GThe country is quiet enough to be governed from the antechamber§!, and the prefects are told so in writing."
 ITA_a_salandra_on_the_right:0 "Salandra on the Right"
 ITA_a_salandra_on_the_right_desc:0 "A Puglian professor of administrative law who believes the Statuto meant what it said. Courteous, immovable, and convinced the Chamber is a nuisance the Crown tolerates."
 ITA_a_turati_has_somewhere_to_stand_tt:0 "§GThe chambers of labour give Turati an address the ministry can negotiate with.§! The offer means something because there is somebody to accept it."
 ITA_a_the_offer_is_made_to_nobody_tt:0 "§RThe offer is made to a party with no legal existence.§! The maximalists read it out at the congress as proof of what the state wants from them."
 ITA_a_bonomi_at_the_door:0 "Bonomi at the Door"
 ITA_a_bonomi_at_the_door_desc:0 "A reformist who will take a portfolio and be expelled for it, and who is worth more inside the ministry than his party will ever admit."
 ITA_a_pledges_given_tt:0 "§YPledges outstanding: [?ITA_pledges|0]§!. Each one comes due within the year, and comes due badly if there is nothing built to show for it."
 ITA_a_the_circular_only_confirms_it_tt:0 "§GThe prefects were already instructed by the society ministry.§! The circular only puts a signature on a practice, and costs nothing to send."
 ITA_a_the_ninety_are_written_to_tt:0 "§RNinety prefectures are told in writing which mayor is to be sustained.§! Somebody will read the circular aloud one day."
 ITA_a_the_garrisons_come_out_tt:0 "§GA garrison comes out of the industrial quarters.§! A §Gbayonet is returned§!, and the Piazza's floor drops with it."
 ITA_a_nothing_to_withdraw_tt:0 "§GThere were no troops in the disputes to withdraw.§! The declaration costs nothing and is believed."
 ITA_a_the_two_neutralities_agree_tt:0 "§GThe Chamber and the ministry are saying the same thing about strikes for once.§! The arbitration boards are actually used."
 ITA_a_a_bayonet_is_spent_tt:0 "§RA bayonet is spent.§! Troops used against Italians raise the floor under the Piazza permanently, and the endings will count them."
 ITA_a_dissolving_what_we_recognised_tt:0 "§RThe decrees dissolve associations the Kingdom recognised by law last session.§! The socialists no longer have to argue that the state is not neutral."
 ITA_a_the_prefects_had_the_lists_ready_tt:0 "§GThe prefects already had the lists.§! Dissolution is a morning's work and nobody outside the quarter hears about it for a week."
 ITA_a_a_ministry_without_a_chamber_tt:0 "§RThe Chamber will not carry the estimates and is not asked to.§! The ministry loses a paid arrangement and the street takes note."
 ITA_a_the_groups_are_informed_tt:0 "§GThe groups are informed after the fact and accept it.§! The prefects are the reason why."
 ITA_a_the_census_wrote_the_rolls_tt:0 "§GThe published figures wrote the new registers.§! Nobody can claim the rolls were drawn to suit the ministry, because they were drawn before it knew what it wanted."
 ITA_a_nobody_knows_who_the_voters_are_tt:0 "§RSix million names go onto the rolls and nobody in Rome knows what they will do.§! Neither does anybody in Milan."
 ITA_a_the_register_reprinted:0 "The Register Reprinted"
 ITA_a_the_register_reprinted_desc:0 "The electorate has quadrupled and every arrangement made with the old one is now worth a fraction of what was paid for it. The prefects are rewriting a book they had spent a decade perfecting."
 ITA_a_the_chambers_deliver_the_votes_tt:0 "§GThe recognised chambers of labour deliver the reformist votes as promised.§! The arrangement holds because both sides can be held to it."
 ITA_a_a_promise_without_an_address_tt:0 "§RThe reformists promise support the ministry has no way to collect.§! It is worth political power and very little else."
 ITA_a_the_act_is_already_on_the_book_tt:0 "§GThe society ministry already carried the special laws.§! This vote is the appropriation, not the act, and it passes in an afternoon."
 ITA_a_the_north_pays_for_it_tt:0 "§RThe Northern estimates carry the Southern works.§! Lombardy's deputies will say so at every reading."
 ITA_a_a_counterparty_with_an_address_tt:0 "§GThe Council of Labour sits with organisations that legally exist.§! Disputes are recorded rather than suppressed."
 ITA_a_an_office_that_counts_strangers_tt:0 "§RThe office counts strikes by bodies the law does not recognise.§! It is a good statistical service and nothing more."
 ITA_a_facta_at_the_council:0 "Facta at the Council"
 ITA_a_facta_at_the_council_desc:0 "An amiable Piedmontese lawyer who can be relied upon to keep a room calm, and to be in that room when it matters less than he thinks."
 ITA_a_no_pledge_survives_a_decree_tt:0 "§REvery pledge given to the Chamber lapses when the Chamber stops deciding.§! Nobody is owed anything, and nobody owes us anything either."
 ITA_a_the_provinces_stop_answering_tt:0 "§RTwo provinces stop answering Rome altogether.§! Government by decree has reached the point where there is nothing to decree at."
 ITA_a_the_country_does_not_notice_yet_tt:0 "§GThe country is quiet and the decrees pass unread.§! The prefects gain everything the Chamber lost."
 ITA_a_the_order_is_used_at_once_tt:0 "§RThe standing order is used within the month.§! A §Rbayonet§! is spent and the quarter remembers the name of the regiment."
 ITA_a_the_order_lies_in_the_drawer_tt:0 "§GThe order lies unused in every prefecture.§! It is worth more there than it would be in the street."
 ITA_a_the_po_landowners_withdraw_tt:0 "§RThe grain growers of the Po withdraw from the government's arrangement.§! The machine loses its most reliable province."
 ITA_a_the_south_can_afford_it_tt:0 "§GThe South has water and roads and can survive the loss of the tariff.§! Bread falls and nothing else does."
 ITA_a_the_treasury_loses_a_certainty_tt:0 "§RThe Treasury loses its one certainty and the South gets nothing else in exchange.§! Bread is cheaper in provinces with no road to carry it."
 ITA_a_he_sits_beside_the_men_who_fired_tt:0 "§RThe socialist minister takes his seat beside colleagues who signed the orders to fire.§! His own party will not let him forget it."
 ITA_a_no_blood_between_them_tt:0 "§GThere is no blood between the ministry and the party it has just taken in.§! The arrangement is survivable."
 ITA_a_the_provinces_did_not_wait_tt:0 "§YThe parish committees have already been voting for two years.§! Rome is being asked to bless an arrangement the prefects made themselves."
 ITA_a_the_right_asks_first_tt:0 "§YSonnino's ministry asks the question, which is not the ministry Rome expected to hear from.§! The answer will be warmer for it."
 ITA_a_the_prefects_are_told_quietly_tt:0 "§YNothing is asked of Rome and nothing is promised.§! The prefects are told a Catholic committee is not an unlawful assembly, and that is the whole of the policy."
 ITA_a_boselli_between_the_two_romes:0 "Boselli Between the Two Romes"
 ITA_a_boselli_between_the_two_romes_desc:0 "An old Ligurian liberal trusted by the Quirinale and tolerated by the Vatican, which in this kingdom is a rarer qualification than competence."
 ITA_a_the_same_ninety_seats_tt:0 "§RThe parish committees already hold these seats.§! Rome's permission buys nothing that was not bought, and the bishops now expect to be paid twice."
 ITA_a_ninety_seats_change_hands_tt:0 "§GSeats change hands across the north without a single voter changing his mind.§! Both sides deny that any understanding exists."
 ITA_a_the_countryside_owes_us_nothing_tt:0 "§RThe rural banks, the leagues and the mutual societies stay outside the Kingdom entirely.§! The prefect has nothing to offer them and no hold on them."
 ITA_a_the_provinces_disobey_rome_tt:0 "§YThe parish committees keep voting after Rome forbids it.§! The seats are ours and the bishops are furious with everyone."
 ITA_a_the_leagues_stay_outside_tt:0 "§RThe countryside is organised by men who owe the state nothing at all.§! Some of them are socialists and some of them are priests."
 ITA_a_the_works_are_already_standing_tt:0 "§GThe aqueducts and the roads already exist.§! The Southern question is answered with a ledger instead of a promise, and one pledge is redeemed."
 ITA_a_promised_again_from_rome_tt:0 "§RThe South is promised works again by a ministry that has not built any.§! The deputies vote for it and expect to be paid."
 ITA_a_a_majority_resting_on_bayonets_tt:0 "§RThe settlement rests on troops as much as on votes.§! Everyone in the Chamber knows it and the country outside knows it better."
 ITA_a_a_majority_that_can_be_counted_tt:0 "§GA ministry can count its votes before it asks for them, and has not fired on anybody to get them.§! The King is popular for the first time since Monza."
 ITA_e_the_returns_are_written_to_suit_tt:0 "§RThe prefects return the figures the ministry wants.§! The census is worth less than it cost and the machine is trusted less for it."
 ITA_e_the_figures_come_back_honest_tt:0 "§GThe returns come back honest because nobody had a reason to cook them.§! Rome learns what Italy actually is."
 ITA_e_daneo_at_public_instruction:0 "Daneo at Public Instruction"
 ITA_e_daneo_at_public_instruction_desc:0 "The minister who took the elementary schools off the communes and onto the state's own rolls. Half of Italy will read because of a man nobody remembers."
 ITA_e_the_valleys_are_bought_tt:0 "§RThe high valleys are bought out from under the communes that grazed them.§! Nobody in Rome hears the objection."
 ITA_e_the_south_was_paid_first_tt:0 "§GThe South was paid before the grid was strung.§! The Southern deputies vote the transmission credits without a division."
 ITA_e_every_kilometre_north_of_the_po_tt:0 "§REvery kilometre of it runs north of the Po and the Chamber can read a map.§! The Southern vote is bought with a promise instead of a road."
 ITA_e_the_plate_is_ours_tt:0 "§YA kingdom that buys its armour in Sheffield owns no armour at all.§! Terni is dear and it is ours."
 ITA_e_the_navy_signs_the_order_tt:0 "§GThe Marine signs the plate order it has been promising since 1887.§! The works run full and the constructors get Italian steel."
 ITA_e_the_works_wait_for_a_customer_tt:0 "§RThe only customer for armour plate has not opened its estimates.§! Terni rolls rail and shell steel and waits."
 ITA_e_the_fitters_of_turin_tt:0 "Turin's trained fitters become the Kingdom's industrial reserve."
 ITA_e_the_quarter_has_a_committee_tt:0 "§GThe new quarter has a recognised chamber of labour before it has a grievance.§! The disputes are argued instead of fought."
 ITA_e_thirty_thousand_in_one_quarter_tt:0 "§RThirty thousand men are gathered into one quarter of one city with no legal way to complain.§! They will find another."
 ITA_e_the_communes_lose_their_pasture_tt:0 "§RWhole communes are told the pasture is now a lake the state has bought.§! The compensation is calculated in Rome."
 ITA_e_the_current_stops_failing_in_august_tt:0 "§GThe reservoirs hold the melt and the mills keep turning through a dry August.§! The whole white-coal argument is finally proved."
 ITA_e_the_leash_goes_slack_tt:0 "§GA strike in Cardiff no longer banks the furnaces of the triangle.§! The ministry can say so in the Chamber and be believed."
 ITA_e_no_longer_on_paper_tt:0 "§GItaly stops being a great power on paper.§! The industrial base finally matches the flag flown over it."
 ITA_e_the_bill_is_already_law_tt:0 "§GThe Chamber has already voted the special laws.§! This is the works programme, and it starts on ground that has been surveyed."
 ITA_e_the_deputies_want_the_credit_tt:0 "§YThe government deputies take the credit for the laws and the prefects collect on it.§! It is how the South has always been governed."
 ITA_e_the_cheapest_army_tt:0 "§GTwo million Italians a year stop losing their working season to the fever.§! It is the cheapest army this kingdom will ever raise."
 ITA_e_the_census_named_the_districts_tt:0 "§GThe census named the malarial districts and the quinine goes where it is needed.§! The mortality figures move within two years."
 ITA_e_the_shops_sell_where_they_can_tt:0 "§RThe tobacco shops sell state quinine wherever there is a tobacco shop§!, which is not where the fever is."
 ITA_e_the_pumps_have_current_tt:0 "§GThe Sele aqueduct is pumped with Alpine current.§! Puglia gets water that does not depend on a wet winter."
 ITA_e_the_sele_is_a_long_way_off_tt:0 "§RThe aqueduct is surveyed, costed and begun, and nobody alive will see it finished on this vote.§! The pledges are given anyway."
 ITA_e_the_promises_are_redeemed_tt:0 "§GPledges made to the Southern deputies are redeemed in concrete.§! For once the Chamber is owed nothing."
 ITA_e_they_stayed_and_it_was_worth_it_tt:0 "§GThe men who did not sail have ground worth staying on.§! The land reform is vindicated in the census returns."
 ITA_e_the_ships_still_leave_tt:0 "§YThe works are built and the ships still leave, only fuller of men who mean to come back.§! It is not defeat and it is not victory."
 ITA_e_the_number_is_printed_tt:0 "§RSix hundred thousand a year is now a published figure.§! Every opposition paper in Italy runs it above the fold."
 ITA_e_the_number_is_an_estimate_tt:0 "§GThe figure stays an estimate the ministry can argue with.§! Nobody is quite obliged to answer for it yet."
 ITA_e_a_consul_at_the_far_end_tt:0 "§GA consul waits at the far end of every inspected passage.§! The agents lose the traffic and the emigrants keep their fare."
 ITA_e_the_landowners_break_with_us_tt:0 "§RThe great landowners of the South break with the government.§! The machine loses the men who used to deliver its Southern seats."
 ITA_e_they_have_lost_twice_tt:0 "§RThe landowners lost the grain duty and are now losing the estates.§! They will fight every clause and finance the fight."
 ITA_e_they_still_have_the_tariff_tt:0 "§YThe landowners keep the grain tariff and lose only the idle ground.§! They fight, but they fight for less."
 ITA_e_our_blood_beyond_the_sea:0 "Our Blood Beyond the Sea"
 ITA_e_our_blood_beyond_the_sea_desc:0 "Four million Italians in Argentina, Brazil and the United States, with Italian schools, Italian chambers of commerce and consuls who answer to the Consulta. They are not a lost population any more. They are an interest abroad, and one day somebody will ask them for something."
 ITA_e_water_first_then_grain_tt:0 "§GThe aqueduct came before the plough and the ground holds the water it is given.§! A pledge is redeemed in grain."
 ITA_e_dry_ground_stays_dry_tt:0 "§RThe estates are broken up and the ground is still dry.§! The families that stay will have a harder decade than the ones that sailed."
 ITA_e_neutrality_under_sonnino_tt:0 "§RA ministry that restored the Statuto now announces it will not take sides in strikes.§! Nobody in Italy believes a word of it and the Right is furious anyway."
 ITA_e_neutrality_under_the_bloc_tt:0 "§GThe Popular Bloc's ministry is believed when it says the army will stay in barracks.§! The strikes get shorter."
 ITA_e_neutrality_as_giolitti_meant_it_tt:0 "§GNeutrality announced by the man who invented the policy.§! It is taken at face value in Milan and in the Chamber."
 ITA_e_the_guns_are_remembered_tt:0 "§RThe declaration is read out in quarters where the army has already fired.§! It is received as an insult rather than a concession."
 ITA_e_the_prefect_loses_a_lever_tt:0 "§RRecognised chambers of labour cannot be dissolved by a prefect's signature.§! The machine loses a lever it used every session."
 ITA_e_recognition_after_a_volley_tt:0 "§GRecognition comes after the shooting and is accepted as an apology.§! A garrison comes out of the quarter."
 ITA_e_recognition_before_a_volley_tt:0 "§GRecognition comes before anybody has been shot, which is why it works.§! The chambers negotiate rather than agitate."
 ITA_e_the_hall_that_is_unavailable:0 "The Hall That Is Unavailable"
 ITA_e_the_hall_that_is_unavailable_desc:0 "There is always a reason. The roof is unsafe, the licence has lapsed, the previous meeting left damage. The prefecture never forbids anything and the meeting never happens, and every man turned away at the door tells forty others."
 ITA_e_the_neutral_state_looks_away_tt:0 "§RThe ministry that promised neutrality is caught doing this in its own name.§! The reformists it courted read the file aloud."
 ITA_e_nobody_pretended_otherwise_tt:0 "§GThis ministry never claimed to be neutral, so nothing is exposed.§! The prefects work and the Chamber says nothing."
 ITA_e_the_teacher_is_appointed_from_rome_tt:0 "§RThe schoolmaster stops being the mayor's man and becomes the state's.§! The prefect loses a place he could always fill."
 ITA_e_the_bishops_ask_about_the_inspectors_tt:0 "§RThe bishops who delivered the seats want to know who inspects the schools.§! A pledge is spent answering them and the answer satisfies nobody."
 ITA_e_the_communes_are_relieved_tt:0 "§GThe poorest communes are relieved of a charge they could never carry.§! Nobody objects because nobody is losing anything."
 ITA_e_rome_already_conceded_it_tt:0 "§RRome has already lifted the ban nationally.§! The parish arrangement now buys seats the Kingdom had been given for nothing."
 ITA_e_the_committee_acts_without_rome_tt:0 "§GThe parish committees act without waiting for Rome and deliver anyway.§! The prefects gain a curate in every commune."
 ITA_e_the_account_is_settled_tt:0 "§GThe pledges given across the decade are written off against what was actually built.§! The Chamber is owed less than it feared."
 ITA_e_ten_years_without_a_volley_tt:0 "§GTen years and the army was never turned on Italians.§! There is no floor under the Piazza that we put there ourselves."
 ITA_e_one_country_held_down_tt:0 "§RThe two Italies are one kingdom and part of it is held down.§! The arithmetic of the endings will remember every bayonet."
 ita_dnc.800.t:0 "The Prefects Read the Answer"
 ita_dnc.800.d:0 "The circular on the Genoa decree has reached ninety prefectures and each of them has drawn its own conclusion. Two ask for confirmation in writing. One has already acted on what it thinks the ministry meant, and the Interior has to decide whether to disown him before the newspapers do."
 ita_dnc.800.a:0 "Confirm it in writing."
 ita_dnc.800.b:0 "Let each prefect read it as he likes."
 ita_dnc.801.t:0 "Three Memoranda"
 ita_dnc.801.d:0 "The War Ministry wants the army rebuilt, the Marine wants the estimates for hulls, and the Treasury wants both of them to be quiet for five years. Each paper explains at length why the other two are ruinous. The King has read all three and has asked which one the Chamber would actually vote."
 ita_dnc.801.a:0 "Take the papers to the Chamber."
 ita_dnc.801.b:0 "Decide it in the antechamber."
 ita_dnc.802.t:0 "The Book Is Read Aloud"
 ita_dnc.802.d:0 "A deputy of the Extreme Left has a copy of the circular. He reads it to the Chamber, clause by clause, with the names of the prefectures. The government benches are silent because there is nothing to say that would not make it worse, and the galleries are full."
 ita_dnc.802.a:0 "Defend the circular as administration."
 ita_dnc.802.b:0 "Withdraw it and transfer the prefect."
 ita_dnc.803.t:0 "The Consul at Buenos Aires"
 ita_dnc.803.d:0 "Our consul reports that there are more Italians in his district than in most Italian provinces, that they have their own schools, their own hospitals and their own newspapers, and that Rome has never once asked them for anything. He suggests, carefully, that this could be changed."
 ita_dnc.803.a:0 "Ask them for money and recruits."
 ita_dnc.803.b:0 "Ask them for nothing and keep the goodwill."
 ita_dnc.804.t:0 "The Hall Is Unavailable"
 ita_dnc.804.d:0 "The meeting was to be held in the municipal hall and the licence has been found irregular. Nobody has been arrested and nothing has been forbidden. Four hundred men stand in the square outside instead, which is worse for everyone, and a subprefect asks Rome whether he is to go on doing this."
 ita_dnc.804.a:0 "Tell him to go on doing it."
 ita_dnc.804.b:0 "Tell him the licence is in order after all."
 ita_dnc.805.t:0 "Two Bills, One Act"
 ita_dnc.805.d:0 "The special laws for the South have now been carried twice, by two ministries, for the same provinces. The appropriations overlap, two departments claim the works, and a Basilicata deputy asks in the Chamber which of the two roads to his town is the one that is going to be built."
 ita_dnc.805.a:0 "Merge the appropriations and build once."
 ita_dnc.805.b:0 "Let both departments spend and take the credit twice."
 ita_dnc.806.t:0 "The Parish Committee"
 ita_dnc.806.d:0 "The parish committees were voting before Rome permitted it and are now being told they may do what they have already done. The bishops who took the risk want to know what became of the understanding about the school inspectors, and the ones who refused want to know why the others were not punished."
 ita_dnc.806.a:0 "Honour the understanding about the schools."
 ita_dnc.806.b:0 "Take the seats and forget the understanding."
 ita_dnc.807.t:0 "The Telegram from Cardiff"
 ita_dnc.807.d:0 "The Welsh pits are out and the colliers at Genoa are being told there is nothing to unload. The furnaces of the triangle have six weeks of coal in the yards. Every deputy who voted against the Alpine credits last session is unavailable for comment, and the ministry has an argument it did not have to make."
 ita_dnc.807.a:0 "Bring the credits back before the Chamber."
 ita_dnc.807.b:0 "Buy American coal and say nothing."
 ita_dnc.808.t:0 "The Register Is Reprinted"
 ita_dnc.808.d:0 "The new rolls come back from the printers and the prefectures go through them looking for the villages they know. In three provinces out of four the arrangement no longer reaches far enough to matter. A subprefect writes to Rome asking, in effect, what he is supposed to do now."
 ita_dnc.808.a:0 "Tell him to learn the new electorate."
 ita_dnc.808.b:0 "Tell him to find more favours."
 ita_dnc.809.t:0 "The Ledger of the Decade"
 ita_dnc.809.d:0 "The statistical office lays out ten years in one table: current generated, hectares watered, children in school, emigrants sailed, strikes recorded, and at the bottom, in a column nobody asked for, the number of occasions on which troops were used against Italians. The King reads the last column first."
 ita_dnc.809.a:0 "Publish the table as it stands."
 ita_dnc.809.b:0 "Publish it without the last column."
 ITA_arm_tt_the_ministry_wants_it_read:0 "The Ministry means the report to be read, and the prefectures are told so. §YProvinces worked +6§!."
 ITA_arm_tt_the_ministry_wants_it_shelved:0 "The report is filed with the compliments of the Ministry and no instruction attached."
 ITA_arm_tt_porro_at_the_desk:0 "Carlo Porro takes the Operations desk and may be appointed as army chief."
 ITA_arm_tt_nava_kept:0 "Luigi Nava is confirmed at the head of the list and is now formally §Rof the old guard§!."
 ITA_arm_tt_diaz_noticed:0 "Major Armando Diaz is noticed by the examining board and gains §Yorganizer§!."
 ITA_arm_tt_pollio_on_the_list:0 "Alberto Pollio's name stands high on the reopened list and he may be appointed as army chief."
 ITA_arm_tt_the_lists_agree:0 "The emigration registers and the conscription registers are the same registers. §Y8000 men§! answer who would not have been found."
 ITA_arm_tt_the_class_sailed:0 "No register was kept and the class has sailed. §R4000 men§! are struck off and the quarters they came from are read aloud in the Chamber."
 ITA_arm_tt_the_prefects_guess:0 "With no emigration office the prefects estimate the class, as they have every year since unification."
 ITA_arm_tt_a_pledge_is_given:0 "A public work is promised to buy the vote. §YPromises outstanding +1§!; the Chamber will remember when it is not delivered."
 ITA_arm_tt_the_duty_confirmed:0 "§RThe circular confirms the duty.§! The army remains available to the prefects. Bayonets §Y+1§!: the floor of the piazza rises permanently."
 ITA_arm_tt_the_duty_refused:0 "§GThe circular writes the army out of the streets.§! The prefects must find another instrument, and are given twenty more provinces to work."
 ITA_arm_tt_three_years_taught:0 "Three years with the colours is long enough to teach a man to read and to drill him afterwards."
 ITA_arm_tt_two_years_taught:0 "Two years with the colours leaves time for the drill or the alphabet, and the inspectors want the drill."
 ITA_arm_tt_the_schools_help:0 "The Kingdom's schools have already done half of it, and the regiment is handed literate recruits for the first time."
 ITA_arm_tt_the_regiment_teaches_alone:0 "There are no state schools worth the name, so the regiment teaches the alphabet out of its own drill hours."
 ITA_arm_tt_pecori_to_the_alps:0 "Guglielmo Pecori Giraldi is sent to the north-eastern command and learns the ground: §Ytrait_mountaineer§!."
 ITA_arm_tt_the_ally_is_the_enemy:0 "§RThe Consulta is renewing an alliance the General Staff has just written a war against.§!"
 ITA_arm_tt_the_gun_is_ours_batteries:0 "The Turin and Ansaldo lines are already tooled and the mule gun comes off them in a year."
 ITA_arm_tt_the_gun_is_bought_batteries:0 "Every mountain barrel comes from Essen with a bill attached and a delivery date the Chamber must vote again."
 ITA_arm_tt_the_alpini_take_the_guns:0 "The Alpini have an establishment to hang the batteries on, and the mountain divisions are complete."
 ITA_arm_tt_vienna_up_6:0 "Vienna's confidence in Rome rises by §G6§!: an army looking at Africa is not an army looking at the Isonzo."
 ITA_arm_tt_the_treaty_embarrasses:0 "The Kingdom has just guaranteed Menelik's borders and is now voting an army to cross them."
 ITA_arm_tt_the_debt_is_open:0 "Adwa is left on the books as a debt, and the officer corps is told in public that it will be collected."
 ITA_arm_tt_the_battalions_are_doubled:0 "The Eritrean depot already exists; this is a second levy on the same highlands, not a new army."
 ITA_arm_tt_the_battalions_are_raised:0 "The Eritrean battalions are raised, paid and given a depot at Massawa."
 ITA_arm_tt_the_strike_against_the_war:0 "§RThe quarters strike against the landing and the strike is broken.§! Bayonets §Y+1§!."
 ITA_arm_tt_the_ascari_land_first:0 "The ascari battalions go ashore first, as they always have, and the metropolitan brigades follow."
 ITA_arm_tt_the_marine_was_waiting:0 "The Ministry of Marine had the estimate drawn up before the cabinet met."
 ITA_arm_tt_nobody_asked_for_it:0 "There is no naval programme to hand the difference to, so it goes back to the Treasury and buys a majority instead."
 ITA_arm_tt_the_short_service_pays:0 "Two years with the colours and a kept index make the cadre system arithmetic rather than a hope."
 ITA_arm_tt_the_long_service_resists:0 "Three years with the colours and a smaller establishment are the same argument twice, and the colonels say so."
 ITA_arm_tt_spingardi_signs_it:0 "Paolo Spingardi signs the establishment and may be appointed to the high command."
 ITA_arm_tt_the_verdict_is_remembered:0 "The army that lost Adwa is now the army that lost the estimates, and every mess in the Kingdom says so."
 ITA_arm_tt_the_corps_takes_it_quietly:0 "The verdict of Adwa has already been answered, so the corps takes the cut as a matter of arithmetic."
 ITA_arm_tt_frugoni_takes_the_cut:0 "Pietro Frugoni is left to administer the reduction and grows §Ytrait_cautious§!."
 ITA_arm_tt_nava_retired:0 "Luigi Nava is retired from the active list."
 ITA_arm_tt_diaz_promoted:0 "Armando Diaz is promoted over three seniors and gains §Yorganizer§!."
 ITA_arm_tt_pollio_confirmed:0 "Alberto Pollio is confirmed as Chief of the General Staff by seniority and may be appointed as army chief."
 ITA_arm_the_frontier_threat:0 "Italy surveys the Alpine frontier"
 ITA_arm_the_northeastern_threat:0 "Italy deploys its army to the north-east"
 ITA_arm_the_cadore_threat:0 "Italy fortifies the Cadore"
 ITA_arm_the_landing_threat:0 "Italy prepares a landing in Tripolitania"
 ITA_arm_tb_the_ansaldo_line:0 "The Ansaldo Line"
 ITA_arm_tb_the_second_levy:0 "The Second Levy"
 ITA_arm_tb_the_slipways_at_castellammare:0 "The Slipways at Castellammare"
 ITA_arm_tb_the_marine_takes_the_vote:0 "The Marine Takes the Vote"
 ITA_arm_tb_the_northeastern_regulations:0 "The North-Eastern Regulations"
 ITA_arm_tb_the_colonial_regulations:0 "The Colonial Regulations"
 ITA_n_tt_the_army_paid_for_this:0 "The army gave up its share and the second erecting shop is roofed out of it."
 ITA_n_tt_the_chamber_paid_for_this:0 "Nobody has given anything up, so the ways are lengthened out of the ordinary vote and the deputies notice."
 ITA_n_tt_the_estimates_are_there:0 "The estimates crossed the corridor last year; the ship is inside the vote already granted."
 ITA_n_tt_the_estimates_are_not_there:0 "The Chamber is asked for a hull that costs more than any it has voted, with the army's estimates untouched."
 ITA_n_tt_viale_backs_the_ship:0 "Leone Viale carries the design through the technical committee and may be appointed to the high command."
 ITA_n_tt_vienna_down_4:0 "Vienna's confidence in Rome falls by §R4§!."
 ITA_n_tt_vienna_down_6:0 "Vienna's confidence in Rome falls by §R6§!."
 ITA_n_tt_the_study_confirms:0 "The war game confirms the line of battle the Kingdom is already building, and Livorno says so in print."
 ITA_n_tt_the_study_condemns:0 "The war game condemns the refusal of 1903 in eleven pages, and the Chamber reads every one of them."
 ITA_n_tt_cagni_reads_it:0 "Umberto Cagni reads the study twice and comes away a §Ybattleship_adherent§!."
 ITA_n_tt_paladini_takes_the_flotilla:0 "Osvaldo Paladini takes the night flotilla and gains §Ysuperior_tactician§!."
 ITA_n_tt_revel_takes_her:0 "Paolo Thaon di Revel is given the ship and becomes a §Ybattleship_adherent§! for the rest of his career."
 ITA_n_tt_the_third_hull_is_voted:0 "The army's estimates cover the third hull and the Leonardo da Vinci is ordered with her sisters."
 ITA_n_tt_the_third_hull_is_struck:0 "The committee strikes the third hull out of the programme and the class goes to sea two ships strong."
 ITA_n_tt_the_boats_go_abroad:0 "Portugal, Brazil and Russia send their orders to Venice, and the arsenal is paid to keep building."
 ITA_n_tt_the_army_already_gave_way:0 "The army gave up the estimates years ago; the high seas school costs the Chamber nothing new."
 ITA_n_tt_the_army_pays_for_it:0 "The estimates are taken from the War Ministry without its consent, and the officer corps is told after the vote."
 ITA_n_tt_the_boats_are_the_fleet:0 "The Venice boats stop being an experiment and become the striking arm of the narrow sea."
 ITA_n_tt_pola_was_already_building:0 "Vienna stopped trusting us before the credit was voted, and the slips at Trieste were occupied first."
 ITA_n_tt_pola_is_answered:0 "The programme is answered inside a year and the ally is told, politely, that it was noticed."
 ITA_n_tt_acton_gets_the_squadron:0 "Alfredo Acton is given the Adriatic squadron and gains §Ysuperior_tactician§!."
 ITA_n_the_cuniberti_threat:0 "Italy designs the all-big-gun ship"
 ITA_n_the_pola_answer_threat:0 "Italy answers the Austrian dreadnought programme"
 ITA_n_tb_the_line_of_battle:0 "The Line of Battle"
 ITA_n_tb_the_flotilla_answer:0 "The Flotilla Answer"
 ITA_n_tb_the_dante_hull:0 "The Dante Hull"
 ITA_n_tb_the_cavour_hulls:0 "The Cavour Hulls"
 ITA_n_tb_the_boats_are_the_fleet:0 "The Boats Are the Fleet"
 ITA_w_tt_the_ledger_is_not_reopened:0 "The Consulta opens the ledger it finds and does not write a new first page. Vienna's confidence stands where the Marine left it."
 ITA_w_tt_tittoni_at_the_consulta:0 "Tommaso Tittoni takes the Palazzo and may be appointed as a political advisor."
 ITA_w_tt_the_base_is_on_the_table:0 "The Austrian delegation asks what the squadron at Taranto is four hundred miles nearer to."
 ITA_w_tt_the_survey_is_on_the_table:0 "The Austrian delegation has the Cadore survey, in translation, before the text is initialled."
 ITA_w_tt_vienna_believes_us:0 "Vienna believes the signature and the military convention is written out in full."
 ITA_w_tt_vienna_does_not_believe_us:0 "Vienna takes the signature and files it. The Third Army is promised to a staff that no longer counts it."
 ITA_w_tt_the_timetable_is_agreed:0 "Berlin and Rome settle the railways, the days of mobilisation and the crossing points, and both courts know the figures are real."
 ITA_w_tt_the_timetable_is_not_agreed:0 "The German staff receives our officers, feeds them well and gives them a timetable it does not intend to use."
 ITA_w_tt_pollio_goes_to_berlin:0 "Alberto Pollio goes to Berlin himself and may be appointed as army chief."
 ITA_w_tt_the_plan_is_taken_out:0 "The Isonzo deployment is taken out of the safe and issued, and the claim has a date attached to it."
 ITA_w_tt_the_claim_without_a_plan:0 "The Kingdom claims three provinces of a great power without a single filed plan for taking them."
 ITA_w_tt_racconigi_is_read:0 "Vienna has stopped believing us and reads the Racconigi protocol within the month."
 ITA_w_tt_racconigi_stays_quiet:0 "Vienna still credits Rome, and the protocol stays where the two courts left it."
 ITA_w_tt_tripoli_is_conceded_to_us:0 "Petersburg concedes Tripolitania in writing in exchange for the Straits, and the file is closed."
 ITA_w_tt_the_depot_already_exists:0 "The Massawa depot and the establishment already exist; these are reinforcements on an existing strength."
 ITA_w_tt_the_battalions_are_raised:0 "The Eritrean battalions are raised and given a template of their own."
 ITA_w_tt_the_strike_against_the_expedition:0 "§RThe quarters strike against the second expedition and the strike is broken.§! Bayonets §Y+1§!."
 ITA_w_tt_the_army_of_africa_marches:0 "The colonial establishment exists, the supply train works past the last well, and the column marches complete."
 ITA_w_tt_no_army_was_built_for_this:0 "No colonial army was ever voted, and the column marches with brigades shipped out of Naples."
 ITA_w_tt_the_general_strike_is_broken:0 "§RThe general strike against the Libyan war is broken by troops.§! Bayonets §Y+1§!."
 ITA_w_tt_the_country_wants_it:0 "The street is quiet enough that the war is popular before the first shot is fired."
 ITA_w_tt_the_fleet_covers_the_landing:0 "The high seas school has the hulls and the practice to put a division ashore and keep it supplied."
 ITA_w_tt_the_fleet_cannot_leave:0 "§RThe fleet was built for the Adriatic and cannot cover an operation outside it.§!"
 ITA_w_tt_vienna_up_8:0 "Vienna's confidence in Rome rises by §G8§!: a bank is not a landing."
 ITA_w_tt_the_bank_holds_the_province:0 "Libya is bought rather than stormed. §RThe desert war will never be fought, and the account of it will never be settled.§!"
 ITA_w_tt_the_army_was_promised_a_landing:0 "An army was voted for Africa and is given a banking concession instead."
 ITA_w_tt_the_pledge_is_kept:0 "The Aegean islands are held against the signature and quietly not given back."
 ITA_w_tt_nothing_to_hand_back:0 "Nothing was taken as security, so the Porte signs on our word and keeps its officers in the interior."
 ITA_w_tt_the_army_is_already_there:0 "The colonial establishment is on the spot and the survey is done by men who live there."
 ITA_w_tt_a_survey_and_nothing_more:0 "A survey party, two roads and a report. Nothing is garrisoned that was not garrisoned before."
 ITA_w_threat_racconigi_is_read:0 "Italy bargains with Russia behind its allies"
 ITA_w_threat_the_bank_instead:0 "Italy buys in Tripoli instead of landing"
 ITA_w_threat_the_fourth_shore:0 "Italy annexes the Libyan provinces"
 ITA_w_tb_the_convention:0 "The Military Convention"
 ITA_w_tb_the_plan_is_taken_out:0 "The Plan Is Taken Out"
 ITA_w_tb_the_second_levy:0 "The Second Levy"
 ITA_w_tb_the_landing_is_covered:0 "The Landing Is Covered"
 ITA_end_tt_the_army_looks_north:0 "The verdict of the decade: §Ythe army was built to fight the ally.§!"
 ITA_end_tt_the_army_looks_south:0 "The verdict of the decade: §Ythe army was built to collect a debt in Africa.§!"
 ITA_end_tt_the_army_gave_way:0 "The verdict of the decade: §Ythe army gave up the estimates and the fleet spent them.§!"
 ITA_end_tt_the_fleet_can_leave:0 "The fleet can leave the Adriatic, and every ministry after this one will be asked why it has not."
 ITA_end_tt_the_sea_was_conceded:0 "The open sea was conceded in writing, and the coast is fortified because of it."
 ITA_end_tt_vienna_expects_nothing:0 "Vienna expects nothing from Rome and has written the Third Army out of its plans."
 ITA_end_tt_vienna_still_counts_on_us:0 "Vienna still counts the Third Army in its order of battle, whatever the Chamber says in public."
 ITA_end_tt_the_count_of_bayonets:0 "The army has been called out against Italians §Y[?ITA_bayonets|0]§! times, and every prefect knows the number."
 ITA_end_tt_the_barracks_answer:0 "The circular of the barracks is still in force, so the adjournment is enforced by troops. Bayonets §Y+1§!."
 ITA_end_tt_the_prefects_answer:0 "The army was written out of the streets, so the adjournment is enforced by prefects and questori alone."
 ITA_end_tt_pelloux_is_recalled:0 "Luigi Pelloux is recalled to the King's service and may be appointed as a political advisor."
 ITA_end_tt_the_street_waits_and_watches:0 "The street gives the new ministry a year before it decides anything about it."
 ITA_end_tt_the_columns_are_recalled:0 "The columns in the Libyan interior are recalled to the coast in the ministry's first week."
 ITA_end_tt_the_barracks_are_remembered:0 "Every deputy on those benches has a constituent who was shot at by the army, and the list is read out."
 ITA_end_tt_the_estimates_are_cut:0 "The battle fleet is the first line the new ministry finds in the estimates, and the first it strikes."
 ITA_end_tt_the_army_of_africa_is_recalled:0 "An army was raised for Africa and is now ordered to come home from it without a battle."
 ITA_end_tt_nobody_built_it_for_this:0 "Nobody built an army for the interior, so nothing is lost in giving the interior up."
 ITA_end_threat_the_alliance_is_paper:0 "The Triple Alliance is paper"
 ITA_w_the_military_convention:0 "The Military Convention"
 ITA_w_the_military_convention_desc:0 "Vienna and Berlin believed the signature. The Third Army's timetables are printed, the crossing points are surveyed and the staffs exchange officers who are told the truth."
 ITA_w_the_word_that_is_doubted:0 "The Word That Is Doubted"
 ITA_w_the_word_that_is_doubted_desc:0 "The treaty is renewed and nobody on the other side of the Alps believes a word of it. Our officers are received in Berlin and shown the timetables the German staff keeps for visitors."
 ita_dnc.850.t:0 "The Circular on the Barracks"
 ita_dnc.850.d:0 "The circular has gone out to every divisional command and the newspapers have it within a week. The prefect of Ancona has already telegraphed to ask whether he may still call for a battalion when the dockers stop work, and the Ministry of the Interior would very much like the answer in writing rather than in the Gazzetta."
 ita_dnc.850.a:0 "The prefect may ask. The army will answer."
 ita_dnc.850.b:0 "Let the questori find their own men."
 ita_dnc.851.t:0 "What the Seniority List Answers"
 ita_dnc.851.d:0 "Eleven general officers have written to the Ministry, jointly, on the subject of examination boards. Two have offered to resign and one has offered to resign publicly. Below them are four hundred majors who have read the same letter and drawn the opposite conclusion about their own prospects."
 ita_dnc.851.a:0 "Accept the resignations and post the board."
 ita_dnc.851.b:0 "Nobody resigns. The list stands."
 ita_dnc.852.t:0 "The Classes and the Chamber"
 ita_dnc.852.d:0 "The estimates for the class come before the Chamber and three deputies from the South rise to explain, at length, what a full call-up does to a district that is already losing its young men to the steamers. They are not opposed in principle. They would simply like the exemptions to remain where the prefects have always put them."
 ita_dnc.852.a:0 "The exemptions stand. Buy the vote."
 ita_dnc.852.b:0 "The law is the law. Call the class."
 ita_dnc.853.t:0 "The Attache at Agordo"
 ita_dnc.853.d:0 "The Austro-Hungarian military attache has spent a fortnight walking in the upper Cadore with a camera and a botanical interest. His report is not published, but Vienna's note to the Consulta refers, twice and very politely, to road improvements above Agordo which appear to be constructed in reinforced concrete."
 ita_dnc.853.a:0 "They are roads. Say so and mean it."
 ita_dnc.853.b:0 "Admit the works and remind them of the treaty."
 ita_dnc.855.t:0 "The Transports at Naples"
 ita_dnc.855.d:0 "Thirty-four transports lie at Naples with the tide against them and the divisions embarked. The Consulta has not been consulted, the Chamber is in recess, and the Ottoman minister is asking for an interview he will not be granted. The General Staff wants the order tonight, because in a week the ships will have to be coaled again."
 ita_dnc.855.a:0 "Sail. The Chamber can read about it."
 ita_dnc.855.b:0 "Hold the transports. Put it to the Consulta first."
 ita_dnc.856.t:0 "The Study Is Printed"
 ita_dnc.856.d:0 "Two hundred copies, bound in grey, distributed to every flag officer and, by an arrangement nobody will admit to, to three deputies on the naval estimates committee. The conclusion is on page eleven and it is not a conclusion the Ministry would have chosen. Livorno has done exactly what it was asked to do."
 ita_dnc.856.a:0 "Circulate it. The service must read it."
 ita_dnc.856.b:0 "Withdraw the copies from the committee."
 ita_dnc.857.t:0 "Three Hulls and a Committee"
 ita_dnc.857.d:0 "The programme leaves the Ministry as a squadron and reaches the committee as a series of items. The third ship is the one under discussion; the argument against her is that two will do, and the argument for her is that a squadron of two is not a squadron. Both arguments are correct and only one of them costs money."
 ita_dnc.857.a:0 "Fight for the third hull on the floor."
 ita_dnc.857.b:0 "Take the two and come back next year."
 ita_dnc.859.t:0 "The School Is Settled"
 ita_dnc.859.d:0 "The doctrine is signed, printed and issued, and within a month it is in three foreign naval attaches' despatch bags. Whatever the Regia Marina has decided the Adriatic is for, Pola now knows it too, and so does every yard in the Kingdom that was hoping for a different answer."
 ita_dnc.859.a:0 "Let it be read. It is meant to be read."
 ita_dnc.859.b:0 "Restrict the circulation and deny the text."
 ita_dnc.860.t:0 "What Vienna Does With Our Word"
 ita_dnc.860.d:0 "The Ballhausplatz replies within the month, in the tone reserved for allies. Rome's undertaking is welcomed, noted and, in the covering minute which our black cabinet has read, described as a document of which the second half will not be performed. Somebody in Vienna is very well informed about the Chamber."
 ita_dnc.860.a:0 "Prove them wrong. Send the staff to Berlin."
 ita_dnc.860.b:0 "Let them think it. It costs us nothing."
 ita_dnc.862.t:0 "The Coast and the Interior"
 ita_dnc.862.d:0 "The treaty is signed and the flag goes up over five towns. Beyond the last palm the Senussi are still where they were, the wells are still theirs, and the officers who negotiated at Ouchy have written a memorandum explaining that autonomy was the only word the Porte would accept. Nobody has told the columns."
 ita_dnc.862.a:0 "March inland. The province was bought whole."
 ita_dnc.862.b:0 "Garrison the coast and call it Libya."
 ita_dnc.863.t:0 "Two Counts on One Sheet"
 ita_dnc.863.d:0 "The Interior has ruled the paper into two columns. On the left, the majority: how many deputies, how many bought, how many provinces worked to buy them. On the right, the piazza: how many strikes, how many days lost, how many times the army was called out and how many were shot. Nobody has ever put the two counts on one sheet before, and the men who did it are junior enough to have thought it a clerical exercise."
 ita_dnc.863.a:0 "Read it, and then let the King be told."
 ita_dnc.864.t:0 "The Staff Writes It Down"
 ita_dnc.864.d:0 "The order to withdraw to the coast is executed in eleven weeks and costs fewer men than a month of the interior did. The General Staff's account of it, circulated to commands, uses the word retreat four times in two pages and does not use the word order at all. It will be quoted at every promotion board for twenty years."
 ita_dnc.864.a:0 "Let the staff write what it likes."
 ita_dnc.864.b:0 "Suppress the account and issue our own."
 ITA_victor_emmanuel_iii_int:0 "Vittorio Emanuele III"
 ITA_victor_emmanuel_iii_int_desc:0 "He came to the throne at thirty over his father's body and spent the reign being underestimated by everyone who met him. The generals call him the little king and take his signature anyway."
 ITADNC_o_the_seniority_board:0 "The Board of Promotion"
 ITADNC_o_the_seniority_board_desc:0 "A colonel reaches the top of the list because the men above him died. We put a board between the calendar and the epaulette, with a written rule it must apply. Half the general officers of this kingdom will read that rule and discover they do not meet it."
 ITADNC_o_the_war_school_at_turin:0 "The War School at Turin"
 ITADNC_o_the_war_school_at_turin_desc:0 "The staff course teaches fortification and examines on memory. We rebuild it around a problem that can be lost: a corps on a real frontier against a real enemy, marked by men who will say so. The syllabus decides which frontier our officers spend the next decade thinking about."
 ITADNC_o_the_ministry_and_the_staff:0 "The Ministry and the Staff"
 ITADNC_o_the_ministry_and_the_staff_desc:0 "One office signs the estimates and answers the Chamber, another writes the war plans and answers the King, and at present they are the same office in two hats. We divide them, and we say plainly which one the army obeys when they disagree. The constitution does not settle it, so we will."
 ITADNC_o_the_pay_of_a_lieutenant:0 "The Pay of a Lieutenant"
 ITADNC_o_the_pay_of_a_lieutenant_desc:0 "A subaltern cannot marry without a deposited dowry and cannot live in a garrison town on his pay, and he knows it before he takes the oath. The men we want go to the railways instead. We raise the scale, and the money comes out of the estimates that were going to buy guns."
 ITADNC_o_the_list_is_printed:0 "The List Is Printed"
 ITADNC_o_the_list_is_printed_desc:0 "Every board, examination and quarrel we have had, reduced to one document and sent to the printer: who commands what, in what order, on what ground. Once it is public nobody rearranges it quietly for a cousin. The officer corps has a shape we can defend in the Chamber."
 ITADNC_g_the_batteries_rearmed:0 "The Batteries Rearmed"
 ITADNC_g_the_batteries_rearmed_desc:0 "The decision about the gun is made; the rearmament is a different matter entirely. Every field battery in the kingdom has to be taken out of the line, re-equipped, and taught the new drill, and the credit is spread over years the Chamber has not yet voted. Until it is finished we have two artilleries."
 ITADNC_g_ansaldo_at_sampierdarena:0 "Ansaldo at Sampierdarena"
 ITADNC_g_ansaldo_at_sampierdarena_desc:0 "Genoa builds marine engines and armour and would rather like to build guns. We give the works the order and the licence, and we acquire a second gunmaker who is not the state - and a firm with a whole valley on its payroll and a strong opinion about our estimates."
 ITADNC_g_the_gun_shop_at_terni:0 "The Gun Shop at Terni"
 ITADNC_g_the_gun_shop_at_terni_desc:0 "Our state works were built to roll armour plate for a navy that is not ordering enough of it. We put a gun shop beside the furnace, and the steel that would have gone to sea goes to the batteries instead. Umbria is poor and its deputies will make sure the country hears about the contract."
 ITADNC_g_the_heavy_batteries:0 "The Heavy Batteries"
 ITADNC_g_the_heavy_batteries_desc:0 "Field guns cannot break masonry and every frontier we might fight on is built of it. A park of heavy howitzers is slow, expensive, and useless for anything except a siege, which is precisely the argument against it. Whoever votes the credit is telling the world which frontier he has in mind."
 ITADNC_g_the_shell_and_the_fuse:0 "The Shell and the Fuse"
 ITADNC_g_the_shell_and_the_fuse_desc:0 "Guns without shells are ornaments, and we fill our shells in sheds by women paid by the piece. We build a proper plant, standardise the fuse, and count the reserve honestly for once. The number tells us how long a war we can afford to begin."
 ITADNC_c_the_arm_that_is_not_the_army:0 "The Arm That Is Not the Army"
 ITADNC_c_the_arm_that_is_not_the_army_desc:0 "Bava Beccaris turned field guns on Milan because we had nothing else to send. We will not be caught that way twice. Enlarge the Carabinieri: a force that lives in the villages it polices and can hold a square without a battery. Every man it takes is a man the line regiments will not get."
 ITADNC_c_the_guards_of_public_safety:0 "The Guards of Public Safety"
 ITADNC_c_the_guards_of_public_safety_desc:0 "The Carabinieri are gendarmes and think like soldiers. A city crowd needs somebody else. We raise guards for the towns, under the questore, armed with a stick and given written orders. What we put in that instruction decides whether the next strike ends in a contract or a funeral."
 ITADNC_c_the_mobile_squadrons:0 "The Mobile Squadrons"
 ITADNC_c_the_mobile_squadrons_desc:0 "In the interior a station of a few men covers days of mule track and the law arrives after the news of it. We put mounted squadrons between the provinces. Order will reach the South long before the aqueduct does. It usually does."
 ITADNC_c_the_troops_go_back_to_barracks:0 "The Troops Go Back to Barracks"
 ITADNC_c_the_troops_go_back_to_barracks_desc:0 "Somebody else can hold the square now, so the standing order changes: no prefect requisitions troops for public order without the ministry. The army stops being our instrument of last resort and goes back to being an army. The palace will not thank us for it."
 ITADNC_c_the_oath_that_is_not_asked:0 "The Oath That Is Not Asked"
 ITADNC_c_the_oath_that_is_not_asked_desc:0 "Elsewhere they ask the soldier, at least in the newspapers, whether he would fire on his own countrymen. We will not put the question, because the answer is now another department's business. Two services, two sets of orders, and an army we never had to ask."
 ITADNC_s_the_recruit_who_cannot_read:0 "The Recruit Who Cannot Read"
 ITADNC_s_the_recruit_who_cannot_read_desc:0 "Our draft boards already record whether a conscript can sign his name, and we file the figure and never print it. We will make the return official province by province, and acquire the only honest literacy map we have - and an argument, because the worst columns are the ones with deputies."
 ITADNC_s_the_regimental_primer:0 "The Regimental Primer"
 ITADNC_s_the_regimental_primer_desc:0 "If the recruit cannot read, our regiment will teach him, because a corporal who can read an order is worth two who cannot. A primer, an hour a day, an examination before discharge. The barracks becomes the largest school in the kingdom, which is either our triumph or our indictment."
 ITADNC_s_the_state_pays_the_teacher:0 "The State Pays the Teacher"
 ITADNC_s_the_state_pays_the_teacher_desc:0 "Elementary teachers are paid by bankrupt communes, appointed by mayors who are electors, and dismissed for voting wrong. We put them on our own payroll and the commune loses a favour to sell. Our prefects will notice the loss before the children notice the gain."
 ITADNC_s_the_normal_schools:0 "The Normal Schools"
 ITADNC_s_the_normal_schools_desc:0 "Taking the schools onto our rolls is one thing; finding somebody to stand in them is another, and half the posts in the South go unfilled year after year. We build the training colleges, pay the students, and bind them to serve where we send them. In time there is a profession where there was a vacancy."
 ITADNC_s_a_kingdom_that_reads:0 "A Kingdom That Reads"
 ITADNC_s_a_kingdom_that_reads_desc:0 "The class that came up this year can read its own orders, its own contract and its own ballot paper, and those are the same fact. Everything else we want to be rests on it: the staff work, the factory, the wider register. It took us a decade and it cannot be taken back."
 ITADNC_m_the_map_of_the_fever:0 "The Map of the Fever"
 ITADNC_m_the_map_of_the_fever_desc:0 "The fever is eating the South and we cannot say where. Send the inspectors, name the districts, publish the map. Once the worst communes are on paper no ministry can pretend it never saw them - ours least of all."
 ITADNC_m_the_ground_that_is_drained:0 "The Ground That Is Drained"
 ITADNC_m_the_ground_that_is_drained_desc:0 "The fever lives in standing water, and the water lies on land its owners will not farm. We drain it on the state's account and argue about who got rich afterwards. The alternative is to leave it there and go on burying people."
 ITADNC_m_the_sulphur_of_sicily:0 "The Sulphur of Sicily"
 ITADNC_m_the_sulphur_of_sicily_desc:0 "Louisiana melts sulphur out of the ground with steam and our price falls with every cargo they land. We will fix the price by consortium and buy the whole Sicilian output. It saves the trade, and it hands the living of a province to a committee of its own owners."
 ITADNC_m_the_children_in_the_mines:0 "The Children in the Mines"
 ITADNC_m_the_children_in_the_mines_desc:0 "Boys carry sulphur up the shafts on their backs, hired out by their fathers against an advance nobody ever repays. We fix an age and give the inspectors the right to walk into any pit in Sicily. The output will fall and the owners will howl. Let them."
 ITADNC_m_the_third_class_deck:0 "The Third-Class Deck"
 ITADNC_m_the_third_class_deck_desc:0 "Our people leave through Naples and Genoa on the steerage deck and get whatever the company cares to give them. We subsidise the lines, we inspect the ships, and we write into every contract that the state may take the hulls back when it wants them. Mail boats now. Cruisers on the day we need them."
 ITADNC_air_the_brigade_of_specialists:0 "The Brigade of Specialists"
 ITADNC_air_the_brigade_of_specialists_desc:0 "Our engineers keep a balloon section, a pigeon loft and one determined officer who reads foreign journals about heavier-than-air machines. We give the section a name, a shed and a line in the estimates, and see what it becomes. It costs less than a battery and the Chamber will laugh while it votes."
 ITADNC_air_the_airship_park:0 "The Airship Park"
 ITADNC_air_the_airship_park_desc:0 "A semi-rigid dirigible can stay up for hours, carry a wireless and photograph a frontier, and it is the only flying machine that can do us useful work today. We build the hall, make the gas and train the crews. Every other power is doing the same, which is either our reason or our warning."
 ITADNC_air_the_field_at_centocelle:0 "The Field at Centocelle"
 ITADNC_air_the_field_at_centocelle_desc:0 "Wilbur Wright came to Rome, flew before the King, and taught two of our officers before he left. We keep the field, buy the machines, and put the motor trade of Turin to work on an engine light enough. The whole establishment costs us what one battery costs."
 ITADNC_air_the_battalion_of_aviators:0 "The Battalion of Aviators"
 ITADNC_air_the_battalion_of_aviators_desc:0 "We turn the enthusiasts into a unit: a battalion with a school, a depot, an establishment of machines and a regulation written by somebody who has thought about what they are for. We must transfer the officers out of their regiments, and a regiment does not give up a good captain politely."
 ITADNC_air_the_first_bomb:0 "The First Bomb"
 ITADNC_air_the_first_bomb_desc:0 "Our lieutenant leans out over the oasis, pulls the pin with his teeth and drops four grenades on the camp below. It is reconnaissance in our despatch and murder in the Porte's, and every general staff in Europe will read the report twice. Nobody has done this before."
 ITA_o_the_board_of_promotion:0 "The Board of Promotion"
 ITA_o_the_board_of_promotion_desc:0 "Advancement is decided by a board applying a written rule, and the rule is on file. The army is better commanded and a good many well-connected colonels are not."
 ITA_o_the_calendar_of_ranks:0 "The Calendar of Ranks"
 ITA_o_the_calendar_of_ranks_desc:0 "Seniority decides everything and nobody is offended. The ministry keeps a quiet army and a general staff whose average age rises by one year every year."
 ITA_o_the_school_of_war:0 "The School of War"
 ITA_o_the_school_of_war_desc:0 "A staff course built around a problem that can be lost, marked by officers who say so out loud. The corps that come out of it can write an order and read a map."
 ITA_o_the_staff_answers:0 "The Staff Answers the Crown"
 ITA_o_the_staff_answers_desc:0 "War plans are made where the Chamber cannot see them and the minister learns of them afterwards. It is efficient and it is one more thing the country has not agreed to."
 ITA_o_the_minister_answers:0 "The Minister Answers the Chamber"
 ITA_o_the_minister_answers_desc:0 "Every plan has a signature and the signature belongs to a man who can be questioned on Thursday. Slower, more expensive, and nobody has to guess who is responsible."
 ITA_o_the_pay_of_the_officer:0 "The Pay of the Officer"
 ITA_o_the_pay_of_the_officer_desc:0 "A subaltern can live on his pay and marry without a deposit. The candidates stop being only the sons of officers, and the estimates carry a permanent charge."
 ITA_o_the_list_that_is_printed:0 "The List That Is Printed"
 ITA_o_the_list_that_is_printed_desc:0 "Who commands what, in what order, and why, printed and public. An officer corps that knows its own shape is worth several divisions of the one that did not."
 ITA_g_the_batteries_rearmed:0 "The Batteries Rearmed"
 ITA_g_the_batteries_rearmed_desc:0 "Quick-firing guns on modern carriages, battery by battery, with the drill re-taught each time. The field artillery is finally all of one pattern and all of one century."
 ITA_g_ansaldo_of_genoa:0 "Ansaldo of Genoa"
 ITA_g_ansaldo_of_genoa_desc:0 "A second gunmaker who is not the state, with its own drawing office and its own opinion of the estimates. Competition in the tender and thirty thousand men in one valley."
 ITA_g_the_works_retooling:0 "The Works Are Retooling"
 ITA_g_the_works_retooling_desc:0 "The shops are being rebuilt around the new lathes and are producing very little while it lasts. Every firm that takes a first artillery order goes through this year."
 ITA_g_the_gun_shop_at_terni:0 "The Gun Shop at Terni"
 ITA_g_the_gun_shop_at_terni_desc:0 "The state works roll plate on one side of the yard and bore barrels on the other, and the furnace is paid for twice over. Umbria has a payroll and Rome has a supplier it owns."
 ITA_g_the_heavy_batteries:0 "The Heavy Batteries"
 ITA_g_the_heavy_batteries_desc:0 "Howitzers heavy enough to open masonry, with the tractors and the road parties that go with them. Slow to move and impossible to explain to a neighbour as defensive."
 ITA_g_the_shell_that_bursts:0 "The Shell That Bursts"
 ITA_g_the_shell_that_bursts_desc:0 "One filling plant, one fuse, one reserve that has actually been counted. The proportion of rounds that do nothing at all falls to something a gunner can plan around."
 ITA_c_the_arma_reinforced:0 "The Arma Reinforced"
 ITA_c_the_arma_reinforced_desc:0 "More stations, more men, and a gendarmerie that lives where it works. Public order stops being a task for field batteries, and the annual class is a little smaller."
 ITA_c_the_recruiting_of_the_arma:0 "The Recruiting of the Arma"
 ITA_c_the_recruiting_of_the_arma_desc:0 "The new squadrons are being filled from the same classes the line regiments were counting on, and the best non-commissioned officers go first."
 ITA_c_the_guards_of_public_safety:0 "The Guards of Public Safety"
 ITA_c_the_guards_of_public_safety_desc:0 "Town guards under the questore, with a stick and a written instruction. Crowds are handled by men whose trade is crowds rather than by conscripts with cartridges."
 ITA_c_the_mobile_squadrons:0 "The Mobile Squadrons"
 ITA_c_the_mobile_squadrons_desc:0 "Mounted detachments that can cross a province in a day and do not wait for the assizes. The interior is governed; whether it is governed well is a separate question."
 ITA_c_the_troops_in_barracks:0 "The Troops Stay in Barracks"
 ITA_c_the_troops_in_barracks_desc:0 "No prefect may requisition a battalion for public order without the ministry. The regiments train instead of standing in squares, and the palace thinks it a weakness."
 ITA_c_the_oath_not_asked:0 "The Oath That Is Not Asked"
 ITA_c_the_oath_not_asked_desc:0 "Two services with two instructions, and a soldier who has not been ordered to fire on his own town in ten years. It shows in the barracks and it shows in the country."
 ITA_c_the_questore_decides:0 "The Questore Decides"
 ITA_c_the_questore_decides_desc:0 "The civil authority holds the order and the colonel waits to be asked. Public order is a political act performed by a political officer, which is at least honest."
 ITA_s_the_recruit_who_cannot_read:0 "The Recruit Who Cannot Read"
 ITA_s_the_recruit_who_cannot_read_desc:0 "The draft returns are printed by province and the figures are worse than anybody admitted. Training takes longer than it should because the orders have to be read aloud."
 ITA_s_the_regimental_primer:0 "The Regimental Primer"
 ITA_s_the_regimental_primer_desc:0 "An hour a day, a book, and an examination before discharge. Men go home able to read, and in the meantime the corporals can be trusted with a written order."
 ITA_s_the_state_pays_the_teacher:0 "The State Pays the Teacher"
 ITA_s_the_state_pays_the_teacher_desc:0 "Elementary teachers on the state's rolls, appointed and paid from Rome. The mayor loses a favour, the teacher gains a career, and the school opens in October."
 ITA_s_the_normal_schools:0 "The Normal Schools"
 ITA_s_the_normal_schools_desc:0 "Training colleges with paid places and an obligation to serve where sent. The empty posts in the South begin to fill with people who chose the work."
 ITA_s_a_kingdom_that_reads:0 "A Kingdom That Reads"
 ITA_s_a_kingdom_that_reads_desc:0 "The conscript reads his orders, the workman reads his contract, the elector reads his paper. Everything the kingdom does becomes cheaper and rather harder to manage."
 ITA_s_the_evening_classes:0 "The Evening Classes"
 ITA_s_the_evening_classes_desc:0 "Classes in the barracks and the town halls for men the schools missed. Not elegant, not expensive, and it puts a signature on a great many pay-sheets."
 ITA_m_the_map_of_the_fever:0 "The Map of the Fever"
 ITA_m_the_map_of_the_fever_desc:0 "The malarial communes named, mapped and given a station apiece. The men who used to be too sick to work in August are counted, and some of them are counted alive."
 ITA_m_the_ground_drained:0 "The Ground That Is Drained"
 ITA_m_the_ground_drained_desc:0 "Ditches, pumps and embankments on the state's account, from the Agro Romano to the Campanian plain. Land that killed people begins to feed them instead."
 ITA_m_the_sulphur_consortium:0 "The Sulphur Consortium"
 ITA_m_the_sulphur_consortium_desc:0 "One buyer, one price, the whole output of the island. The trade survives another decade, and every mine owner in the province is now a shareholder in the ministry's policy."
 ITA_m_the_children_out_of_the_mines:0 "The Children Out of the Mines"
 ITA_m_the_children_out_of_the_mines_desc:0 "An age fixed, inspectors who may enter a pit, and an end to the advance paid against a boy's back. Less sulphur comes up, and more of it comes up on adult shoulders."
 ITA_m_the_third_class_deck:0 "The Third-Class Deck"
 ITA_m_the_third_class_deck_desc:0 "Subsidised lines, inspected decks, and a clause letting the state take the hulls. A merchant marine that carries the emigrants and can be called back in a fortnight."
 ITA_air_the_brigade_of_specialists:0 "The Brigade of Specialists"
 ITA_air_the_brigade_of_specialists_desc:0 "A shed, a section and a line in the estimates for balloons, kites and whatever comes next. The cheapest establishment in the army and the only one nobody understands."
 ITA_air_the_airship_park:0 "The Airship Park"
 ITA_air_the_airship_park_desc:0 "Semi-rigid dirigibles with a hall, a gas plant and trained crews. They see further than any cavalry patrol and they are at the mercy of an afternoon of weather."
 ITA_air_the_field_at_centocelle:0 "The Field at Centocelle"
 ITA_air_the_field_at_centocelle_desc:0 "A flying ground outside Rome, imported machines, and officers learning on them. The engines are the difficulty, and the engines come from the motor trade."
 ITA_air_the_battalion_of_aviators:0 "The Battalion of Aviators"
 ITA_air_the_battalion_of_aviators_desc:0 "A unit with a depot, a school and an establishment, instead of a collection of enthusiasts on loan. Flying becomes a career rather than an eccentricity."
 ITA_air_the_first_bomb:0 "The First Bomb"
 ITA_air_the_first_bomb_desc:0 "The kingdom is the first to drop an explosive from an aeroplane onto men, and every staff in Europe now has a file on it. The doctrine runs ahead of the machines."
 ita_dnc.900.t:0 "The Rule of the Board"
 ita_dnc.900.d:0 "The board has met and drawn up its rule. The question the minister must answer before it sits again is whether the rule, and the marks it gives, are to be printed in the Gazzetta with the names against them, or kept in a drawer where a friendly word can still reach them."
 ita_dnc.900.a:0 "Print it, names and all."
 ita_dnc.900.b:0 "The board sits in private."
 ita_dnc.902.t:0 "The Batteries That Are Left Over"
 ita_dnc.902.d:0 "Rearmament produces a second army by accident: the batteries that have not yet been reached, still drawing the old ammunition, still drilling the old drill. The inspector-general wants them re-equipped at once and the treasury wants them kept in the reserve divisions where nobody will look at them."
 ita_dnc.902.a:0 "One pattern, whatever it costs."
 ita_dnc.902.b:0 "The old guns go to the reserve."
 ita_dnc.910.t:0 "Who Holds the Order"
 ita_dnc.910.d:0 "A crowd in a provincial town, a questore who wants the guards, and a colonel who says that once his men are in the square they are his to command. Somebody must be told, in writing and before the next occasion, which of the two decides when the order to clear is given."
 ita_dnc.910.a:0 "The civil authority holds it."
 ita_dnc.910.b:0 "The officer on the ground holds it."
 ita_dnc.920.t:0 "The Column Marked With a Cross"
 ita_dnc.920.d:0 "The draft returns are in and in four provinces more than half the class signs with a cross. The war ministry can strike the illiterate off the good regiments and be done with it, or it can open classes in the barracks and the town halls and take the men anyway."
 ita_dnc.920.a:0 "Open the evening classes."
 ita_dnc.920.b:0 "Sort them into the labour battalions."
 ita_dnc.931.t:0 "The Pits Have Stopped"
 ita_dnc.931.d:0 "The consortium has fixed a price and the miners have discovered that the price does not reach them. Three thousand men are out in the sulphur towns, the owners want the squadrons, and the prefect has telegraphed twice in one night asking for instructions."
 ita_dnc.931.a:0 "Hear them before anything else."
 ita_dnc.931.b:0 "Clear the pits."
 ita_dnc.942.t:0 "Grenades Dropped From an Aeroplane"
 ita_dnc.942.d:0 "An Italian officer flying over an oasis in Tripolitania has dropped four hand grenades on a camp beneath him, and the world has a new fact to consider. Every war ministry in Europe is asking the same two questions this morning: how high was he, and what could he have carried instead."
 ita_dnc.942.a:0 "The first in the world to do it."
 ita_dnc.942.b:0 "Send for the attache's report."
 ita_dnc.942.c:0 "This is not war. It is murder from the sky."
 ITA_o_tt_the_board_has_a_rule:0 "Promotion already goes by examination, so the board has a rule to apply and applies it."
 ITA_o_tt_brusati_is_struck_off:0 "Roberto Brusati fails the new standard and leaves the active list."
 ITA_o_tt_the_board_reads_the_calendar:0 "With seniority still the law, the board can only certify what the calendar has already decided."
 ITA_o_tt_the_crown_names_them:0 "The Crown keeps the appointment of general officers and the Chamber is informed afterwards."
 ITA_o_tt_the_chamber_reads_the_list:0 "The list is laid before the Chamber, and the deputies read every name on it."
 ITA_o_tt_the_ministry_signs_quietly:0 "The ministry signs the list and lets the interested parties hear of it privately."
 ITA_o_tt_porro_teaches:0 "Carlo Porro may be appointed as a theorist."
 ITA_o_tt_the_staff_answers_the_crown:0 "The Chief of Staff reports to the King and the war plans stay out of the Chamber."
 ITA_o_tt_the_minister_answers_the_chamber:0 "The Minister of War signs the plans and answers for them at the tribune."
 ITA_o_tt_spingardi_takes_the_ministry:0 "Paolo Spingardi is available as a corps commander."
 ITA_o_tt_the_grievance_is_answered:0 "The officers' grievance has been answered."
 ITA_o_tt_the_list_is_public:0 "The seniority list is printed and the King is credited with it."
 ITA_o_tt_the_list_is_a_courtesy:0 "The list is printed, but the appointments behind it are still arranged."
 ITA_o_tt_cadorna_is_reached:0 "Luigi Cadorna reaches a command and brings his own convictions with him."
 ITA_o_tt_diaz_is_reached:0 "Armando Diaz reaches a staff appointment."
 ITA_g_tt_the_carriage_is_made_here:0 "The recoil carriage is built under licence in our own shops."
 ITA_g_tt_the_carriage_comes_by_rail:0 "The guns arrive complete from Essen and the money leaves with the train."
 ITA_g_tt_the_licence_comes_from_le_creusot:0 "Ansaldo builds to French drawings, and Paris is pleased to sell them."
 ITA_g_tt_the_licence_comes_from_essen:0 "Ansaldo builds to German drawings, and the alliance is reassured."
 ITA_g_tt_the_park_faces_north:0 "Nobody pretends the heavy park is for Africa."
 ITA_g_tt_the_park_is_shown_to_the_ally:0 "The heavy park is shown to the allied attaches, which is its own kind of statement."
 ITA_c_tt_somebody_has_to_do_it:0 "The army is out of the streets, so the Arma inherits the whole duty."
 ITA_c_tt_the_regiments_keep_the_duty_too:0 "The regiments keep the duty as well, and the Arma is only an addition to it."
 ITA_c_tt_the_guards_are_told_to_carry_no_rifle:0 "The guards go into a crowd with a stick and a written instruction, and nothing else."
 ITA_c_tt_the_guards_are_told_to_clear_the_square:0 "The guards are instructed to clear a square and are given the means to do it."
 ITA_c_tt_the_volleys_are_on_the_record:0 "One volley is struck off the ministry's account."
 ITA_c_tt_nothing_to_undo:0 "The troops have not fired on the country, and there is nothing to undo."
 ITA_c_tt_milan_is_written_out:0 "The doctrine of Milan is struck out of the standing orders."
 ITA_c_tt_the_streets_are_quiet_enough_to_try_it:0 "The streets are quiet enough that the settlement can be made permanent."
 ITA_c_tt_the_streets_are_not_quiet_and_it_is_tried_anyway:0 "The streets are not quiet, and the settlement is made anyway."
 ITA_s_tt_the_figure_is_printed_with_the_census:0 "The literacy return is printed beside the census and cannot be argued away."
 ITA_s_tt_the_figure_stays_in_the_ministry:0 "The literacy return stays in the ministry, where it can be managed."
 ITA_s_tt_the_communes_lose_a_favour_to_sell:0 "The communes lose the appointment of the teacher, and with it a favour to sell."
 ITA_s_tt_the_teachers_union_is_recognised:0 "The teachers' association is recognised and brought into the settlement."
 ITA_s_tt_the_two_italies_are_one_reader:0 "North and South read the same primer and the same ballot paper."
 ITA_s_tt_one_italy_reads_and_the_other_signs:0 "One half of the kingdom reads and the other half still signs with a cross."
 ITA_m_tt_the_quinine_has_somewhere_to_go:0 "The state quinine has stations to be distributed from."
 ITA_m_tt_the_map_is_drawn_and_nothing_follows:0 "The map is drawn and there is no quinine to put on it."
 ITA_m_tt_the_land_was_promised_and_here_it_is:0 "Land was promised instead of the emigrant ship, and here it is."
 ITA_m_tt_the_men_who_would_have_dug_it_are_at_sea:0 "The men who would have dug the ditches are on a steamer to Buenos Aires."
 ITA_m_tt_louisiana_undersells_us:0 "American sulphur undersells the island in every market it had."
 ITA_m_tt_the_consortium_is_a_bargain_with_the_owners:0 "The consortium is a bargain struck with the owners and paid for in votes."
 ITA_m_tt_the_consortium_is_forced_to_take_the_miners_in:0 "The consortium is made to seat the miners' delegates at its own table."
 ITA_m_tt_the_labour_office_has_inspectors_to_send:0 "The labour office has inspectors and can put them down a shaft."
 ITA_m_tt_the_law_has_nobody_to_enforce_it:0 "The law fixes an age and provides nobody to go and look."
 ITA_m_tt_turati_calls_it_the_only_thing_worth_the_session:0 "Turati calls it the only thing the session has been worth."
 ITA_m_tt_mirabello_takes_the_auxiliaries:0 "Carlo Mirabello takes the auxiliary squadron."
 ITA_m_tt_the_commissariat_writes_the_charter:0 "The Commissariat writes the charter, and the state can move its people in bodies."
 ITA_m_tt_the_shipowners_write_the_charter:0 "The shipowners write the charter and the inspectors read it afterwards."
 ITA_m_tt_the_liners_are_counted_as_cruisers:0 "The subsidised liners are entered in the naval returns as auxiliary cruisers."
 ITA_air_tt_moris_is_given_the_brigade:0 "Maurizio Moris is available as a corps commander."
 ITA_air_tt_the_staff_calls_it_a_balloon_company:0 "The staff files the brigade under balloons and forgets about it."
 ITA_air_tt_the_chamber_laughs_and_votes_it:0 "The Chamber laughs at the item and votes it."
 ITA_air_tt_calderara_is_taught_by_wilbur_wright:0 "Mario Calderara is taught to fly by Wilbur Wright and stays to teach others."
 ITA_air_tt_douhet_writes_the_regulations:0 "Giulio Douhet writes the regulations, and they are more ambitious than the machines."
 ITA_air_tt_the_battalion_is_meant_for_the_alps:0 "The battalion is being built to look over the northern frontier."
 ITA_air_tt_the_battalion_is_offered_to_the_alliance:0 "The battalion is offered to the alliance as a reconnaissance arm."
 ITA_air_tt_the_porte_calls_it_murder:0 "The Porte protests to every chancellery in Europe."
 ITA_air_tt_the_kingdom_advertises_it:0 "The kingdom advertises the feat and enjoys the attention."
 ITA_air_tt_the_extreme_left_asks_who_was_under_it:0 "The Extreme Left asks who was standing under the grenades."
 ITA_air_tt_the_despatch_says_reconnaissance:0 "The despatch records a reconnaissance and says nothing about the grenades."
 ITA_air_tt_gavotti_comes_back:0 "The pilot comes back, lands, and writes the first report of its kind."
 ITA_air_tt_the_machine_does_not_come_back:0 "The machine does not come back."
 ITA_arm_tt_the_left_reads_the_list:0 "The Extreme Left has the seniority list printed. Every colonel now knows who passed him and why."
 ITA_arm_tt_the_list_is_the_crowns:0 "Promotion is the King's prerogative and the ministry says so in one line. The list stays in the drawer."
 ITA_arm_tt_the_ministry_does_not_read_it:0 "The ministry has no opinion about the seniority list and does not intend to acquire one."
 ITA_arm_tt_the_class_answers_the_denunciation:0 "The alliance is denounced; the class of the year is voted at full strength, and the piazza answers."
 ITA_arm_tt_the_convention_fixes_the_class:0 "The military convention already tells us how many men Vienna expects. We call up exactly that many."
 ITA_arm_tt_the_bloc_shortens_the_class:0 "The bloc will not vote a full class. Fewer men to the colours, and a quieter country for it."
 ITA_arm_tt_the_essen_offer:0 "Krupp will sell to an ally on an ally's terms, and Vienna hears of the order before Paris does."
 ITA_arm_tt_no_gun_from_essen:0 "Essen does not sell guns to a country that has left the alliance. Ansaldo gets the drawings and the bill."
 ITA_arm_tt_surveying_an_ally:0 "Our engineers are measuring the passes of a power we are sworn to reinforce. Somebody in Vienna reads the contracts."
 ITA_arm_tt_the_survey_is_expected:0 "Nobody in Rome pretends the survey is about avalanches. The Chamber votes it without a division."
 ITA_arm_tt_the_bloc_writes_it_down:0 "The bloc will not take a verbal assurance. The refusal goes into the regulations, in print, over a signature."
 ITA_arm_tt_the_ministry_says_nothing_in_writing:0 "The ministry gives its word and refuses to give it in writing. The prefects understand the arrangement."
 ITA_arm_tt_the_primer_before_the_rifle:0 "The bloc insists the conscript learn to read first. The regiment becomes the largest school in the kingdom."
 ITA_arm_tt_the_rifle_before_the_primer:0 "The ministry wants soldiers, not scholars. The drill hours go where the ministry says."
 ITA_arm_tt_the_orders_are_placed_where_they_vote:0 "Arsenal contracts go to the districts that return the right deputies, and the prefects see that it is understood."
 ITA_arm_tt_the_arsenals_are_the_states:0 "The arsenals stay public, the fitters keep their committees, and nobody is dismissed for belonging to one."
 ITA_arm_tt_the_estimates_are_not_laid_before_anyone:0 "The arsenal vote is folded into a decree and never reaches a committee."
 ITA_arm_tt_the_alpini_are_told_who_they_face:0 "The battalions are raised and the maps are issued. The maps have Austrian names on them."
 ITA_arm_tt_the_alpini_are_a_frontier_guard:0 "The corps is described as customs work in uniform. Vienna accepts the description because it costs nothing."
 ITA_arm_tt_the_estimates_pass_by_decree:0 "The estimates are promulgated, not debated. Nothing is cut and nothing is explained."
 ITA_arm_tt_the_estimates_are_bought:0 "The estimates pass on promises made to sixty deputies, and every promise is written down somewhere."
 ITA_arm_tt_the_bloc_cuts_the_estimates:0 "The bloc trims the army vote before it will carry it. The country approves; the corps does not."
 ITA_arm_tt_the_denunciation_has_an_army:0 "The treaty is torn up and the deployment matches the policy. For once the staff and the Consulta agree."
 ITA_arm_tt_the_bloc_will_not_pay_for_the_alps:0 "The bloc was not elected to build an army against Austria, and says so from the benches."
 ITA_arm_tt_the_ally_asks_about_the_concrete:0 "Vienna reads the tender notices. An ally pouring forts on a shared frontier owes an explanation we do not have."
 ITA_arm_tt_nobody_needs_a_reason_now:0 "The works go up openly. There is no longer an alliance to embarrass."
 ITA_arm_tt_the_bloc_calls_it_an_adventure:0 "The bloc names it an adventure paid for by men who will never see Africa, and the piazza takes up the phrase."
 ITA_arm_tt_the_south_is_told_it_gains:0 "The southern deputies are told the colonial depots will be built in their provinces. Another promise on the account."
 ITA_arm_tt_the_right_has_wanted_this_since_adwa:0 "The Right has wanted the verdict of Adwa reversed for ten years, and votes the army of Africa without a murmur."
 ITA_arm_tt_no_italian_mothers_to_answer:0 "Ascari casualties produce no letters to deputies. The ministry counts this as economy."
 ITA_arm_tt_the_bloc_asks_what_they_are_paid:0 "The bloc asks in the Chamber what an ascaro is paid and how he was recruited. The answers are not read out."
 ITA_arm_tt_vienna_is_told_before_the_porte:0 "An ally must be told first. Vienna is informed, disapproves, and remembers."
 ITA_arm_tt_there_is_nobody_to_tell:0 "There is no alliance left to consult. The order goes out on our own authority."
 ITA_arm_tt_the_bloc_breaks_over_libya:0 "The Extreme Left will not carry a colonial war. The understanding that held the majority together ends here."
 ITA_arm_tt_the_bloc_gets_what_it_asked_for:0 "A smaller army was the bloc's price for its votes, and the bloc is paid in full."
 ITA_arm_tt_the_right_will_not_forgive_the_cut:0 "The Right regards the cut as a great power resigning, and remembers it in every subsequent division."
 ITA_arm_tt_the_convention_promised_three_corps:0 "The convention promises Vienna three corps on the Rhine. We have just made that arithmetic impossible."
 ITA_arm_tt_the_prefects_keep_the_index:0 "The reserve index is kept by the prefectures, along with everything else worth keeping."
 ITA_arm_tt_the_communes_keep_the_index:0 "The communes keep the reserve rolls, and the men may read their own entries."
 ITA_arm_tt_the_plan_is_filed_against_a_friend:0 "The staff has a war plan against the power we are treaty-bound to reinforce. Somebody will eventually ask about it."
 ITA_arm_tt_the_plan_is_the_policy:0 "The plan and the policy now say the same thing, and neither has to be hidden."
 ITA_arm_tt_the_army_answers_to_the_crown:0 "The new regulations settle the question of whose army it is. It is the King's."
 ITA_arm_tt_the_army_answers_to_the_chamber:0 "Estimates, promotions and the barracks duty are all the Chamber's business now, in writing."
 ITA_arm_tt_the_army_answers_to_the_ministry:0 "The army answers to whoever is at the Interior this year, which is the arrangement the ministry prefers."
 ITA_arm_tt_the_batteries_have_a_map_to_match:0 "The mule batteries are sited against a frontier we have already named as hostile."
 ITA_arm_tt_mountain_guns_for_a_frontier_at_peace:0 "Mountain guns for a frontier nobody expects to fight over. The Chamber finds this cheap and reassuring."
 ITA_arm_tt_the_convention_expects_corps_not_hulls:0 "Vienna and Berlin were promised divisions. They are told the money went into slipways."
 ITA_arm_tt_a_free_hand_needs_a_fleet_first:0 "A country with no allies needs its own sea before it needs another army corps."
 ITA_n_tt_the_estimates_are_bought:0 "The naval estimates carry on promises, not arguments. The pledges are entered against the ministry."
 ITA_n_tt_the_estimates_are_signed:0 "The estimates are signed, promulgated and printed. There is no debate to lose."
 ITA_n_tt_the_estimates_are_contested:0 "The bloc fights the naval vote line by line and takes something off it."
 ITA_n_tt_the_drawings_are_shown_to_pola:0 "Allied navies exchange drawings. Pola is shown what Cuniberti is working on, because that is what allies do."
 ITA_n_tt_the_office_keeps_its_own_counsel:0 "The drawing office shows its work to nobody. There is no ally with a right to ask."
 ITA_n_tt_the_ways_are_laid_where_they_vote:0 "The new slipways are laid in constituencies that needed encouraging."
 ITA_n_tt_the_yards_are_the_blocs_own_men:0 "The yard hands are organised, and they are organised on our side of the Chamber."
 ITA_n_tt_fiume_sells_to_an_ally:0 "Whitehead's works are in Fiume. An ally gets the licence, and gets it cheaply."
 ITA_n_tt_fiume_will_not_sell:0 "Whitehead's works are in Fiume, and Fiume no longer sells torpedoes to Italy. We shall make our own."
 ITA_n_tt_the_ship_needs_no_vote:0 "The all-big-gun ship is ordered by decree. There is nobody to persuade."
 ITA_n_tt_the_bloc_will_not_vote_a_battleship:0 "The bloc will not put its name to a battleship while the schools are unbuilt."
 ITA_n_tt_the_ship_is_paid_for_in_seats:0 "The hull is bought in the lobby, at the usual rate."
 ITA_n_tt_the_refusal_is_the_blocs_victory:0 "The bloc wanted the money for something else and got it. The refusal is claimed in every league hall."
 ITA_n_tt_the_refusal_is_read_as_weakness:0 "The Right reads the refusal as a great power declining to be one, and says so."
 ITA_n_tt_the_ally_asks_why_taranto:0 "A base at Taranto faces one sea and one navy. Vienna does not need the point explained."
 ITA_n_tt_the_base_faces_where_it_should:0 "The base faces the Adriatic, which is where the fleet's work will be."
 ITA_n_tt_the_south_gets_a_yard_at_last:0 "The South is given something built rather than promised, and one old pledge can be struck off."
 ITA_n_tt_the_cheap_boat_passes:0 "A submarine costs what a gun turret costs. The bloc votes it without a fight."
 ITA_n_tt_the_right_wants_hulls_not_boats:0 "The Right regards submarines as the weapon of a power that has given up, and votes the credit sourly."
 ITA_n_tt_the_study_names_no_enemy:0 "The Livorno study is written without naming an opponent, which makes it a poor study and a good treaty document."
 ITA_n_tt_the_study_names_pola:0 "The study names Pola on its first page and works from there."
 ITA_n_tt_a_closed_sea_with_a_friend_in_it:0 "The Adriatic can only be closed against the fleet of our own ally. The paper is circulated anyway."
 ITA_n_tt_the_sea_has_one_other_owner:0 "There is one other fleet in this sea, and we have stopped pretending otherwise."
 ITA_n_tt_the_ally_reads_the_petersburg_papers:0 "Our best naval constructor is now working for Russia. Vienna draws the obvious conclusion."
 ITA_n_tt_petersburg_is_a_useful_friend:0 "Petersburg pays well and remembers favours. We are short of friends."
 ITA_n_tt_the_boats_go_to_paris_and_petersburg:0 "Laurenti's hulls are sold where the orders are, and the orders are in Paris and Petersburg."
 ITA_n_tt_the_ally_reads_the_order_book:0 "An ally examines our export order book and finds its own rivals in it."
 ITA_n_tt_the_bloc_divides_over_the_dante:0 "The reformists will carry a dreadnought; the maximalists will not. The bloc splits over one hull."
 ITA_n_tt_the_hull_is_ordered_by_decree:0 "The Dante is laid down on a decree. The estimates follow afterwards."
 ITA_n_tt_the_hull_costs_three_pledges:0 "The hull is bought with promises to three groups, all of which will be called in."
 ITA_n_tt_two_allies_building_against_each_other:0 "Two members of the same alliance are building against each other, and both admit it in their estimates."
 ITA_n_tt_the_race_has_a_name_now:0 "The race with Pola no longer has to be described as a race with anyone else."
 ITA_n_tt_three_hulls_three_constituencies:0 "Three hulls, three yards, three sets of grateful deputies."
 ITA_n_tt_the_bloc_asks_for_the_schools_instead:0 "The bloc asks what a third battleship would buy in classrooms, and gets a figure it can read out."
 ITA_n_tt_the_yard_sells_where_it_likes:0 "With no alliance to consider, the yards take orders from anyone who pays."
 ITA_n_tt_the_order_book_is_shown_to_berlin:0 "The order book is shown to Berlin first, as a courtesy that costs us a customer or two."
 ITA_n_tt_a_fleet_for_a_country_with_no_ally:0 "A country that has denounced its alliance needs a fleet that can leave its own gulf."
 ITA_n_tt_the_ally_asks_what_it_is_for:0 "Vienna asks what a high seas school is for, and does not accept the answer given."
 ITA_n_tt_the_bloc_pays_for_it_in_the_country:0 "The bloc carries the largest naval vote of the decade and pays for it in the piazza."
 ITA_n_tt_the_cheap_school_suits_the_bloc:0 "Coast defence is the cheapest school there is, which is why the bloc voted for it."
 ITA_n_tt_a_great_power_does_not_hide_in_a_gulf:0 "The Right calls it the doctrine of a second-class power, and the phrase sticks."
 ITA_n_tt_the_ally_is_reassured_by_a_coast_fleet:0 "A fleet built to defend a coast cannot threaten Pola. Vienna is told so, and believes it."
 ITA_e_tt_the_prefects_count_their_own_districts:0 "The census is taken by the prefectures, which are counting the districts they also manage."
 ITA_e_tt_the_bloc_wants_the_figures_printed:0 "The bloc insists the returns be published unedited, and the statisticians are delighted."
 ITA_e_tt_the_ministry_keeps_the_returns:0 "The returns go to the ministry and no further. What is not published cannot be quoted against us."
 ITA_e_tt_the_concessions_find_friends:0 "Alpine water concessions are granted to men who were useful at the last election."
 ITA_e_tt_the_concessions_are_granted_by_decree:0 "The concessions are granted by decree, over the heads of the communes that owned the water."
 ITA_e_tt_the_communes_are_paid_for_their_water:0 "The communes are compensated before the dams are begun, which is slow, expensive and quiet."
 ITA_e_tt_the_plate_must_be_ours:0 "Nobody will roll armour plate for a country that has left its alliance. Terni must do it."
 ITA_e_tt_the_ally_will_roll_the_plate:0 "An allied works will roll plate for us on decent terms while Terni learns how."
 ITA_e_tt_turin_is_the_blocs_city:0 "Thirty thousand fitters in one quarter, and they vote for the bloc."
 ITA_e_tt_thirty_thousand_men_and_a_garrison:0 "Thirty thousand fitters in one quarter, and a ministry that answers them with a garrison."
 ITA_e_tt_the_south_is_a_constituency:0 "The special laws are administered by prefects who will remember the arrangement in June."
 ITA_e_tt_the_south_is_a_debt:0 "The bloc treats the special laws as a debt the North owes, and pays it without asking for the seats."
 ITA_e_tt_sonnino_wrote_this_book_himself:0 "The President of the Council wrote about the Sicilian peasantry before he governed. The bill is his own."
 ITA_e_tt_the_bloc_calls_it_a_verdict:0 "The bloc reads six hundred thousand departures a year as a verdict on the kingdom, and says so."
 ITA_e_tt_the_safety_valve:0 "Every man on a gangplank is a man not in a piazza. The ministry has always understood the arithmetic."
 ITA_e_tt_the_consulates_are_places_to_give:0 "The new consular posts are places to be given, and they are given carefully."
 ITA_e_tt_the_leagues_man_the_offices:0 "The emigration offices are staffed from the leagues, which know the emigrants better than the ministry does."
 ITA_e_tt_the_italians_of_trieste_are_counted_too:0 "The register of Italians abroad does not stop at Trieste, and the newspapers notice."
 ITA_e_tt_the_lists_stop_at_the_border:0 "The register stops carefully at the Austrian frontier. Vienna notices that too."
 ITA_e_tt_the_leagues_asked_for_this:0 "Land at home instead of a berth abroad was the leagues' own demand."
 ITA_e_tt_the_valve_is_shut_by_hand:0 "The safety valve is closed deliberately, and the landowners who profited from it break with the ministry."
 ITA_e_tt_recognising_our_own_benches:0 "The chambers of labour are recognised by a ministry that sits with their deputies."
 ITA_e_tt_the_right_recognises_what_it_would_dissolve:0 "The Right signs a recognition it spent five years promising to revoke, and its own benches say so."
 ITA_e_tt_the_decrees_and_the_prefect_agree:0 "The public safety decrees and the prefect's instructions say the same thing, which makes both easier to apply."
 ITA_e_tt_the_bloc_cannot_answer_for_this:0 "The bloc cannot explain a prefect breaking a strike to the men who elected it. The understanding does not survive."
 ITA_e_tt_the_bloc_wrote_this_bill:0 "Compulsory elementary schooling was the bloc's own bill before it was the ministry's."
 ITA_e_tt_the_teacher_is_a_prefects_appointment:0 "The schoolmaster is appointed from Rome, which means in practice by the prefect."
 ITA_e_tt_the_communes_are_told_what_to_teach:0 "The communes lose the schools and are told what will be taught in them."
 ITA_e_tt_the_pact_is_the_ministrys_own_work:0 "The parish pact was negotiated by the ministry's own agents, district by district."
 ITA_e_tt_the_bloc_cannot_sit_with_the_sacristy:0 "A bloc resting on the Extreme Left cannot also rest on the curates. Something has to give."
 ITA_e_tt_the_right_and_the_curate_agree:0 "The Right and the parish committees want the same things, and are pleased to be asked."
 ITA_e_tt_the_leagues_hand_out_the_tablets:0 "The state quinine is distributed through the leagues, which reach fields the prefecture never visits."
 ITA_e_tt_the_tablets_are_handed_out_by_the_prefect:0 "The state quinine is distributed by the prefecture, and the peasants are told who sent it."
 ITA_e_tt_the_south_is_answered_and_billed:0 "The South is answered, and the account of what it now owes the ministry is presented at once."
 ITA_e_tt_the_south_is_answered_and_enfranchised:0 "The South is answered by a government that also intends to let it vote."
 ITA_e_tt_the_south_is_answered_from_rome:0 "The South is answered from Rome, thoroughly and without being consulted."
 ITA_e_tt_a_country_that_asks_nobody_for_coal:0 "A country with no alliance and no coal would be at anyone's mercy. Now it is at nobody's."
 ITA_e_tt_silesian_coal_on_a_friendly_tariff:0 "Silesian coal comes in on an ally's tariff while the current is being built."
 ITA_e_tt_one_kingdom_administered:0 "One kingdom, held together by ninety prefects and a great deal of correspondence."
 ITA_e_tt_one_kingdom_enfranchised:0 "One kingdom, held together because most of the men in it now have a vote."
 ITA_e_tt_one_kingdom_governed:0 "One kingdom, held together from Rome, and told so."
 ITA_w_tt_foreign_policy_is_the_crowns:0 "Under the Statuto, treaties are the King's business. The Consulta answers to him and to nobody on the benches."
 ITA_w_tt_the_bloc_asks_to_read_the_treaties:0 "The bloc asks that treaties be laid before the Chamber. It does not get everything, but it gets the habit."
 ITA_w_tt_the_consulta_is_left_to_itself:0 "Foreign policy is left to the officials, who are grateful and helpful in return."
 ITA_w_tt_the_renewal_needs_no_debate:0 "The renewal is signed and announced. It is not debated, because nothing is."
 ITA_w_tt_the_extreme_left_votes_against:0 "The Extreme Left votes against the alliance and forces us to count our own majority."
 ITA_w_tt_the_convention_never_reaches_the_chamber:0 "The military convention is a matter between staffs and crowns. The Chamber is not shown it."
 ITA_w_tt_the_chamber_is_told_a_smaller_number:0 "The Chamber is given a figure for the Rhine army smaller than the one Berlin has."
 ITA_w_tt_the_bloc_learns_of_the_third_army:0 "The bloc learns that Italian corps are promised to the Rhine, and the benches go up in noise."
 ITA_w_tt_two_books_and_no_chamber:0 "Two sets of engagements, one cipher room, and no committee entitled to ask."
 ITA_w_tt_the_bloc_would_publish_both:0 "The bloc's own press would print both books if it ever saw them. The secret is now a domestic risk."
 ITA_w_tt_the_bloc_will_not_own_the_irredenta:0 "The Extreme Left will not carry an irredentist claim, and the understanding ends over it."
 ITA_w_tt_the_right_writes_the_claim:0 "The Right has wanted this written down since 1866, and writes it well."
 ITA_w_tt_the_ministry_would_rather_not_have_said_it:0 "The ministry preferred the claim unspoken. Now it must be defended in the Chamber."
 ITA_w_tt_an_ally_bargaining_with_petersburg:0 "An ally bargaining with Russia over the Balkans is an ally in name. Vienna reads it that way."
 ITA_w_tt_racconigi_is_the_new_policy:0 "Racconigi is not a betrayal of anything. It is simply the policy now."
 ITA_w_tt_valona_is_watched_by_two_allies:0 "Two allies are watching the same harbour, and each knows why the other is there."
 ITA_w_tt_the_other_shore_has_one_claimant:0 "There is one claimant to the other shore of the Otranto strait, and it is us."
 ITA_w_tt_the_bloc_costs_the_colonies_out:0 "The bloc has the colonies costed and reads the total out. The total is not flattering."
 ITA_w_tt_a_colony_is_a_place_to_send_a_client:0 "A colonial administration is a set of appointments, and appointments are what the ministry has to give."
 ITA_w_tt_the_right_wants_them_governed:0 "The Right wants the colonies governed rather than merely held, and votes the money for it."
 ITA_w_tt_the_bloc_asks_about_the_recruiting:0 "The bloc asks in the Chamber how the ascari are recruited and what becomes of those who refuse."
 ITA_w_tt_a_colonial_army_costs_no_italian_vote:0 "Native battalions cost no Italian conscripts, and therefore no Italian votes."
 ITA_w_tt_the_extreme_left_forced_the_inquiry:0 "It was the Extreme Left that forced the inquiry into the company's Benadir. The buy-out is their result."
 ITA_w_tt_the_inquiry_is_settled_quietly:0 "The inquiry is settled before it reports, and the officials concerned are transferred."
 ITA_w_tt_the_company_is_not_the_states_business:0 "The Right holds that a chartered company's affairs are its own. Paying for it anyway is resented."
 ITA_w_tt_adwa_is_closed_by_the_men_who_opposed_it:0 "The men who voted against the expedition are the men who close the account. The country notices."
 ITA_w_tt_the_right_signs_and_says_nothing:0 "The Right signs the treaty with Menelik and refuses to celebrate it."
 ITA_w_tt_the_bloc_will_not_survive_a_second_adwa:0 "The bloc cannot carry a second Abyssinian war for a fortnight, and does not try."
 ITA_w_tt_the_right_has_waited_ten_years:0 "The Right has waited ten years for this and votes the credits standing."
 ITA_w_tt_the_ministry_did_not_want_this:0 "The ministry did not want an Abyssinian war and is now carrying one it cannot administer."
 ITA_w_tt_the_ally_is_consulted_about_tripoli:0 "The alliance requires consultation over Ottoman territory. Vienna is consulted, and is not encouraging."
 ITA_w_tt_nobody_is_consulted_about_tripoli:0 "There is no treaty left requiring us to ask anyone about Tripoli."
 ITA_w_tt_the_ministry_counts_the_nationalist_seats:0 "The ministry counts the seats a Libyan enterprise would be worth, and finds the sum persuasive."
 ITA_w_tt_the_alliance_is_told_after_the_fact:0 "An ally learns of our ultimatum from the newspapers. The Triple Alliance survives the week, barely."
 ITA_w_tt_a_free_hand_is_for_this:0 "This is what a free hand was denounced for. Nobody has to be squared."
 ITA_w_tt_the_bloc_will_not_hold_through_a_war:0 "A bloc resting on the Extreme Left cannot hold through a colonial war. It does not."
 ITA_w_tt_the_bank_is_cheaper_than_a_war:0 "A bank in Tripoli costs a fraction of a landing and leaves the majority intact."
 ITA_w_tt_a_great_power_does_not_send_a_banker:0 "The Right regards a bank as what a power sends when it dare not send a division."
 ITA_w_tt_the_bloc_is_spared_a_war:0 "The bloc is spared a war it could not have carried, and the piazza with it."
 ITA_w_tt_the_islands_are_kept_because_we_can:0 "The islands are described as a pledge. There is no ally in a position to ask when it is redeemed."
 ITA_w_tt_vienna_asks_when_they_go_back:0 "Vienna asks, in writing, on what date the Aegean islands will be returned."
 ITA_w_tt_the_ministry_banks_the_victory:0 "The peace is announced, the prefects are instructed, and the victory is banked before the next election."
 ITA_w_tt_the_right_asks_why_we_stopped:0 "The Right asks why the columns stopped at the coast, and keeps asking."
 ITA_w_tt_the_fourth_shore_owes_nothing_to_vienna:0 "The fourth shore was taken without an ally's leave and is held without an ally's help."
 ITA_w_tt_the_bloc_counts_the_columns:0 "The bloc counts the columns still in the desert and prints the figure in every league paper."
 ITA_w_tt_the_right_calls_it_pacification:0 "The Right calls it pacification and votes the transport."
 ITA_w_tt_the_emigrants_are_sent_to_libya_instead:0 "Emigrants promised land in the South are offered land in Libya. One old promise is disposed of."
 ITA_w_tt_the_bloc_calls_it_sand:0 "The bloc calls the fourth shore a box of sand bought with a decade of school budgets."
 ITA_a_tt_the_decrees_are_read_abroad:0 "A kingdom governing by public safety decree is read abroad as a kingdom expecting trouble."
 ITA_a_tt_vienna_recognises_the_instrument:0 "Vienna knows the instrument well and regards its use as a sign of seriousness."
 ITA_a_tt_the_new_voters_hear_about_trieste:0 "Two million new voters, and the first thing many are canvassed about is Trieste."
 ITA_a_tt_the_alliance_is_not_a_platform:0 "Nobody can campaign on the Triple Alliance. The ministry keeps it out of the election entirely."
 ITA_a_tt_the_ally_counts_the_garrisons_at_home:0 "Our ally counts the divisions kept in Italian cities and subtracts them from those promised to the Rhine."
 ITA_a_tt_a_free_hand_and_a_garrison_in_milan:0 "A free hand abroad and a garrison in Milan. The contrast is drawn in every league paper."
 ITA_a_tt_berlin_prefers_a_government_that_lasts:0 "Berlin and Vienna prefer an ally whose government survives the winter, whatever the means."
 ITA_a_tt_a_free_hand_wielded_by_decree:0 "A free hand abroad, exercised by a ministry that has stopped consulting anyone at home."
 ITA_a_tt_hungarian_grain_comes_in_free:0 "With the duty gone, Hungarian grain comes in freely, and Budapest is grateful in a way Vienna records."
 ITA_a_tt_the_grain_is_bought_where_we_like:0 "The grain is bought wherever it is cheapest, and no treaty says otherwise."
 ITA_a_tt_the_convention_is_kept_from_the_new_minister:0 "The military convention cannot be shown to a socialist minister, and Vienna knows he is sitting there."
 ITA_a_tt_a_free_hand_that_the_left_can_live_with:0 "The Left can sit in a ministry that has denounced the alliance. It could not sit in one that kept it."
 ITA_a_tt_the_settlement_has_no_ally_behind_it:0 "The settlement rests on the country alone. The Chamber is told to remember it."
 ITA_a_tt_the_alliance_underwrites_the_settlement:0 "A kingdom inside a great alliance can afford a quiet Chamber, and the Chamber knows it."
 ITA_end_tt_the_ally_is_relieved_by_the_adjournment:0 "Vienna and Berlin greet the adjournment as the end of an unreliable parliament."
 ITA_end_tt_a_free_hand_and_a_closed_chamber:0 "A kingdom with no allies and no parliament. Europe files the observation."
 ITA_end_tt_the_third_partner_under_a_left_ministry:0 "Vienna will not deal on military matters with a ministry that includes the Extreme Left."
 ITA_end_tt_the_free_hand_is_folded:0 "The free hand is folded away. The new ministry has no use for it."
 ITA_end_tt_the_bloc_gets_its_columns_back:0 "The bloc asked for the columns to come home and can now say it brought them."
 ITA_end_tt_the_right_calls_it_a_surrender:0 "The Right calls the recall a surrender to a desert, and the phrase outlives the ministry."
 ITA_end_tt_the_verdict_on_the_neutral_state:0 "Ten years of a state that stood back: an administration that works, and a country that owes it favours."
 ITA_end_tt_the_verdict_on_the_statuto:0 "Ten years of the Statuto read strictly: a kingdom governed, and a street that has not forgotten."
 ITA_end_tt_the_verdict_on_the_bloc:0 "Ten years of the popular bloc: a wider franchise and a majority that can be counted."
 ITA_end_tt_the_verdict_on_the_third_partner:0 "Ten years of loyalty: an alliance that still expects Italian corps, and staffs that still talk."
 ITA_end_tt_the_verdict_on_the_free_hand:0 "Ten years of a free hand: no allies, no obligations, and every neighbour watching."
 ita_dnc.950.t:0 "Buggerru Keeps the Date"
 ita_dnc.950.d:0 "Seven years ago a company of the line fired into the miners at Buggerru and left three men on the road. That battalion is down for the Iglesias garrison in the autumn rotation, and the prefect of Cagliari writes that the town has kept the fourth of September every year since, with the shutters down and the band silent. He does not say what he wants done. He wants it on the record that he asked."
 ita_dnc.950.a:0 "Change the rotation. Send anyone but them."
 ita_dnc.950.b:0 "The battalion goes where it is posted."
 ita_dnc.950.c:0 "Pension the families and print the inquiry we buried."
 ita_dnc.951.t:0 "The Chamber Asks After a Prefect"
 ita_dnc.951.d:0 "The interpellation is down for Thursday and it names a man: the prefect who made the arrangements in his province the last time the country voted. The deputy who tabled it sat on our benches until the majority began to thin. Half the Chamber knows exactly what that prefect did, because half the Chamber owes its seat to somebody who did the same."
 ita_dnc.951.a:0 "Sustain him. He acted on instructions."
 ita_dnc.951.b:0 "He went beyond his instructions. He is retired."
 ita_dnc.951.c:0 "The question will not be reached this session."
 ita_dnc.952.t:0 "What the Prefects Report"
 ita_dnc.952.d:0 "Ninety confidential reports come up in January and they say much the same thing in ninety different hands. The province is quiet. The province is administered. The province would not vote for us if it were left alone. One prefect, an honest man in a bad post, adds a paragraph asking whether the ministry has considered that a country governed this well may simply be a country that has stopped arguing with us."
 ita_dnc.952.a:0 "Read that paragraph out to the committee."
 ita_dnc.952.b:0 "The reports are for the ministry and stay in it."
 ita_dnc.952.c:0 "Take the three worst provinces and actually build there."
 ita_dnc.953.t:0 "The Magistrates Address the Crown"
 ita_dnc.953.d:0 "Three presidents of appeal have signed an address to the King. It is respectful to the point of insolence. It observes that decrees of public safety issued between sessions have now stood longer than the sessions they replaced, that the courts are required to apply them as law, and that the magistrates would be glad to be told, on paper, under what article of the Statuto this is done."
 ita_dnc.953.a:0 "Put every decree to the Chamber for ratification."
 ita_dnc.953.b:0 "Three presidencies fall vacant this year in any case."
 ita_dnc.953.c:0 "The address is acknowledged. Nothing further."
 ita_dnc.954.t:0 "The Bill the Left Brought With Them"
 ita_dnc.954.d:0 "We let them in and they came in with a folder. Eight hours in the state arsenals, the chambers of labour recognised in law, the domicilio coatto repealed. Turati is polite about it and says the ministry has a year. Behind him the chambers of labour are less polite and have a date. The reformists have spent their credit inside our government; if we hand them nothing they must go outside to spend what is left."
 ita_dnc.954.a:0 "Take the folder. All of it."
 ita_dnc.954.b:0 "A portfolio is not a party congress. Refuse."
 ita_dnc.954.c:0 "Keep Turati. Cut the syndicalists loose."
 ita_dnc.955.t:0 "A Note from the Ballhausplatz"
 ita_dnc.955.d:0 "When the naval estimates were pared down the Consulta sweetened it in Vienna with a written assurance that Italy intended no race in the Adriatic. It was a cheap thing to give away for a fleet we were not building. The Ballhausplatz has had it copied out and laid beside Article VII, and asks in the most courteous terms what an ally who would not build against Pola imagines it is doing landing at Tripoli without notice."
 ita_dnc.955.a:0 "The assurance stands. No islands, no Aegean."
 ita_dnc.955.b:0 "It bound the estimates. It did not bind the kingdom."
 ita_dnc.955.c:0 "Offer talks on a timetable and say nothing else."
 ita_dnc.956.t:0 "The File on Our Own Denial"
 ita_dnc.956.d:0 "Vienna has taken Bosnia and did not ask. The Consulta drafts an indignant note, and then somebody walks to the cabinet and comes back with the 1902 folder, and everyone in the room remembers what we swore to Vienna about Tripoli while the ink on the French understanding was still wet. Article VII is a good article. It is a better one for a power that has not been caught."
 ita_dnc.956.a:0 "Ask for compensation. Article VII is plain."
 ita_dnc.956.b:0 "We have a file of our own. Say nothing."
 ita_dnc.956.c:0 "Print the whole 1902 correspondence and take the blow."
 ita_dnc.957.t:0 "The Huts of Messina"
 ita_dnc.957.d:0 "Three winters in the baracche. The relief commission's own count is forty thousand still living in board and tar paper, in rows laid out for a season, with the numbering worn off the doors. The Chamber has voted for the city twice. What it has never voted is a name against the job of building it."
 ita_dnc.957.a:0 "Rebuild the city and put a name against it."
 ita_dnc.957.b:0 "The navy keeps the yard, and the yard rebuilds the port."
 ita_dnc.957.c:0 "The huts hold. The kingdom has a war on its hands."
 ita_dnc.958.t:0 "The Photographs"
 ita_dnc.958.d:0 "A Swiss paper has them first, then everyone. Men hanged in the oasis with the rope over a date palm, and a line of officers in the frame, some of them looking at the camera. The dispatches said reprisals against irregulars. The photographs say a thing a dispatch cannot. In the Chamber the Extreme Left has one enlarged and mounted and intends to hold it up."
 ita_dnc.958.a:0 "Court-martial the officers in the frame."
 ita_dnc.958.b:0 "The photographs are not ours. Say so and keep saying it."
 ita_dnc.958.c:0 "Rewrite the standing orders. Say nothing about the past."
 ita_dnc.959.t:0 "Europe Looks at Tripolitania"
 ita_dnc.959.d:0 "The pictures ran in Zurich, then in Paris, then everywhere with a press. Whatever Rome says now, it is saying it second."
 ita_dnc.959.a:0 "The trials will be held in public."
 ita_dnc.959.b:0 "The foreign press has always hated us."
 ita_dnc.959.c:0 "Now the world sees what we have been telling it."
 ita_dnc.959.e:0 "So this is the civilising mission."
 ita_dnc.960.t:0 "The Class Is Short"
 ita_dnc.960.d:0 "The district offices have sent up their returns and the arithmetic is ugly. The shorter term put a smaller class through the barracks; the exemptions the Chamber voted took whole districts out of the count; the war is eating drafts faster than the depots can post them. The Minister of War would like to know which of those three things the ministry is prepared to undo."
 ita_dnc.960.a:0 "Call up the districts the Chamber spared."
 ita_dnc.960.b:0 "Recall the older class for the duration."
 ita_dnc.960.c:0 "Hold the establishment. Send fewer columns inland."
 ita_dnc.961.t:0 "The German Gun in the Sand"
 ita_dnc.961.d:0 "The batteries bought from Essen are good guns, and in the Tripolitanian dust they are good guns that need parts we do not make. The arsenal at Turin has a piece stripped on the floor and a colonel who says he could have working drawings in six months whether Essen likes it or not. The attaché in Berlin has already been asked, twice, what our people are doing with the specimen."
 ita_dnc.961.a:0 "Buy the licence and tool Turin for it properly."
 ita_dnc.961.b:0 "Order the spares. Leave the drawings alone."
 ita_dnc.961.c:0 "Copy it. Berlin can read about it afterwards."
 ita_dnc.962.t:0 "The Clerk Who Kept the First Copy"
 ita_dnc.962.d:0 "The colonial ledger went to press four years ago with the awkward columns taken out, and the man who took them out was a second-division clerk who has since been passed over twice. He kept the unedited proofs. He has shown them to a deputy of the Extreme Left, the deputy has shown them to Avanti!, and the ministry has perhaps a fortnight before the columns nobody voted appear beside the ones everybody did."
 ita_dnc.962.a:0 "Print the whole thing. Four years late is still in time."
 ita_dnc.962.b:0 "He signed an undertaking of secrecy. Prosecute him."
 ita_dnc.962.c:0 "A friend of the ministry can buy the proofs back."
 ita_dnc.963.t:0 "The Army Asks to Be Relieved"
 ita_dnc.963.d:0 "The memorandum comes up through the Ministry of War and it carries more corps commanders' signatures than is comfortable. The line regiments have been turned out against crowds so often that recruits are learning the manual of arms from men who last used it in a market square. The generals put it in the language of readiness. What they mean is that the army does not want the country to hate it, and is running out of years in which that is still a choice."
 ita_dnc.963.a:0 "Raise a corps of public safety guards and relieve them."
 ita_dnc.963.b:0 "The army stays where the ministry needs it."
 ita_dnc.963.c:0 "Enlarge the carabinieri instead. It is quicker."
 ita_dnc.964.t:0 "The Men Who Did Not Come Home"
 ita_dnc.964.d:0 "The Commissariat of Emigration keeps a good register, which is how we know exactly how bad this is. The consulates posted the call-up from New York to Buenos Aires and a small fraction of the class answered it. They are not traitors. They are men who left because the kingdom had nothing for them, and who are now asked to come back and be shot at in a desert none of them had heard of."
 ita_dnc.964.a:0 "Strike them off. They keep their passports."
 ita_dnc.964.b:0 "No passport for a man who did not answer."
 ita_dnc.964.c:0 "An amnesty, and paid passage for volunteers only."
 ita_dnc.965.t:0 "The Register Is Read Against Us"
 ita_dnc.965.d:0 "The literacy marks were made for the recruiting sergeant, so that a battalion would know which men could read an order. Then the franchise widened, and the same marks decide who stands on the electoral register and who does not. The clerks did not change; the use did. The Socialists have counted the marked names in nineteen constituencies and publish the count on Sunday."
 ita_dnc.965.a:0 "Strike the army's marks off the electoral roll."
 ita_dnc.965.b:0 "The register is the register. It stands."
 ita_dnc.965.c:0 "Reprint it, with the evening-class certificates counted."
 ita_dnc.966.t:0 "Racconigi Is Quoted Back"
 ita_dnc.966.d:0 "The Austrian ambassador is not angry, which is worse. He reads out, in Italian, from our own memorandum of the Racconigi meeting: the status quo in the Balkans, maintained by the powers with an interest in it. He lets the phrase sit. Then he observes that Italian troops are at this moment on Ottoman soil, and asks whether the Consulta would care to gloss the word status."
 ita_dnc.966.a:0 "Accept the gloss. We stay out of the islands."
 ita_dnc.966.b:0 "The status quo died at Bosnia, and not by our hand."
 ita_dnc.966.c:0 "Offer the military convention. It is what he came for."
 ita_dnc.967.t:0 "The Board's Marks Come Back"
 ita_dnc.967.d:0 "The promotion board printed its marks, and those marks are now three years old and commanding brigades. The two colonels it passed over are the two who have done best in Africa; the officer it marked highest has been relieved for cause. The seniority men have the newspapers, the board has the record, and the Minister of War must say which of them he governs by before the next list goes up to the King."
 ita_dnc.967.a:0 "The board's list stands. The record is the record."
 ita_dnc.967.b:0 "Restore the calendar of ranks. The army wants quiet."
 ita_dnc.967.c:0 "Put the passed-over colonels into the African command."
 ITA_r_tt_the_rotation_is_altered:0 "The battalion is posted elsewhere, and the Ministry of War is not told why."
 ITA_r_tt_the_anniversary_passes_quietly:0 "The fourth of September passes with the shutters down and nothing else."
 ITA_r_tt_the_square_is_cleared_again:0 "There is a crowd at the cemetery, and the same battalion clears it."
 ITA_r_tt_the_ninety_are_watching:0 "Every prefecture in the kingdom reads how the ministry treats a prefect who obeyed."
 ITA_r_tt_the_ninety_read_the_gazzetta:0 "Every prefecture in the kingdom reads what becomes of a prefect who is caught."
 ITA_r_tt_nothing_leaves_the_ministry:0 "The reports are filed. The paragraph is filed with them."
 ITA_r_tt_three_benches_are_reseated:0 "Three presidents of appeal are transferred to quieter courts."
 ITA_r_tt_turati_stays_and_the_rest_go:0 "The reformists carry the party congress and the syndicalists walk out alone."
 ITA_r_tt_the_congress_goes_with_the_syndicalists:0 "The congress goes the other way and takes the chambers of labour with it."
 ITA_r_tt_the_consulta_says_nothing:0 "The Consulta files its indignation beside the 1902 folder."
 ITA_r_tt_the_spared_districts_are_called:0 "The districts the Chamber exempted are put back into the count."
 ITA_r_tt_essen_keeps_the_drawings:0 "Essen keeps the drawings, and the next order will be on Essen's terms."
 ITA_r_tt_the_copy_is_in_the_drawer:0 "The proofs come back to the ministry and go into a drawer."
 ITA_r_tt_avanti_prints_it_anyway:0 "Avanti! prints it anyway, with the price of the drawer alongside."
 ITA_r_tt_a_bayonet_comes_off_the_count:0 "One bayonet comes off the count, and the floor under the Piazza falls with it."
 ITA_r_tt_pollio_signs_the_new_list:0 "General Pollio signs the new list without comment."
 ITA_r_threat_the_note_is_read_back:0 "Rome tells Vienna the assurance bound only the estimates"
 ITA_r_threat_the_bosnian_file:0 "Italy asks compensation for Bosnia"
 ITA_r_threat_the_green_book:0 "Rome publishes the 1902 correspondence"
 ITA_r_threat_the_photographs:0 "Italy denies the Tripolitanian photographs"
 ITA_r_threat_the_status_quo_answered:0 "Rome refuses Vienna's reading of Racconigi"
 ITA_r_tb_the_three_worst_provinces:0 "The Three Worst Provinces"
 ITA_r_tb_the_adriatic_delay:0 "An Answer Deferred"
 ITA_r_tb_the_yard_that_stayed:0 "The Yard That Stayed at Messina"
 ITA_r_tb_the_licence_at_last:0 "The Licence, At Last"
 ITA_r_tb_the_turin_copy:0 "The Turin Copy"
 ITA_r_tb_the_figures_are_public:0 "The Figures Are Public"
 ITA_r_dc_the_standing_orders_rewritten:0 "The Standing Orders Rewritten"
 ITA_r_dc_the_establishment_is_held:0 "The Establishment Is Held"
 ITA_r_dc_the_battery_that_is_ours:0 "A Battery That Is Ours"
 ITA_r_dc_the_board_is_sustained:0 "The Board Is Sustained"
 ITA_r_dc_the_passed_over_get_a_command:0 "A Command for the Passed Over"
 ITADNC_g_the_neutral_state:0 "The Neutral State"
 ITADNC_g_the_neutral_state_desc:0 "We have no business breaking a strike we did not call. Wages are not a question of public order, and a ministry that fires on Milan cannot then ask Milan for taxes. We invite the Extreme Left to behave like an opposition rather than an enemy."
 ITADNC_g_the_prefects_instructed:0 "The Prefects Instructed"
 ITADNC_g_the_prefects_instructed_desc:0 "A prefect for every province, a man in a sash for each, and a book in Rome recording which mayor we sustain and which list goes astray in the post. It carries our estimates and it builds our bridges. It is also written down, and someday somebody will read it aloud in the Chamber."
 ITADNC_g_the_state_takes_no_side:0 "The State Takes No Side"
 ITADNC_g_the_state_takes_no_side_desc:0 "We withdraw the troops from the disputes and set up arbitration boards where the parties will sit at them. Our prefect is told that a strike is not a rebellion. The mills lose weeks and gain years, and the men who built barricades learn to count votes instead."
 ITADNC_g_the_ministry_of_the_lobby:0 "The Ministry of the Lobby"
 ITADNC_g_the_ministry_of_the_lobby_desc:0 "We have no government party and never have had. We have a corridor behind the Chamber where a deputy is asked what his province wants and told what we need on Thursday. Depretis called it transformism and was ashamed of the word. We use the method and never use the word."
 ITADNC_g_the_book_of_the_ninety:0 "The Book of the Ninety"
 ITADNC_g_the_book_of_the_ninety_desc:0 "Our clerk at the Interior keeps a ledger with a page for every province: the mayor who is sound, the sub-prefect who is useful, the deputy who voted wrong in March. Nothing in it is illegal and none of it is written for publication. It is the only complete map of this kingdom anyone possesses."
 ITADNC_g_the_special_laws_for_the_south:0 "The Special Laws for the South"
 ITADNC_g_the_special_laws_for_the_south_desc:0 "We write statutes for Basilicata and for Naples alone: cheap power, a tariff exemption, aqueducts and roads scheduled by law instead of promised by a minister. We charge it to the Northern estimates. It will be a decade before anyone can point at a road and say what it bought us."
 ITADNC_g_the_labour_office:0 "The Labour Office"
 ITADNC_g_the_labour_office_desc:0 "A Superior Council of Labour, employers and unions in one room, and an office that counts strikes instead of suppressing them. We stop being a party to every dispute and become the clerk who records it. That is cheaper, and considerably less likely to end in a volley."
 ITADNC_g_the_boards_of_conciliation:0 "The Boards of Conciliation"
 ITADNC_g_the_boards_of_conciliation_desc:0 "A board in every industrial province: the masters, the men, and a magistrate who may not have an opinion about socialism. Nothing it decides can be enforced. Both sides come anyway, because the alternative is weeks of lost wages and a prefect we have told to stay indoors."
 ITADNC_g_the_men_who_will_vote_for_it:0 "The Men Who Will Vote For It"
 ITADNC_g_the_men_who_will_vote_for_it_desc:0 "We assemble a majority out of Piedmontese liberals, Neapolitan clienteles, radicals who want the labour laws and clericals who want the schools left alone. It agrees about nothing except the estimates. It is a majority, which is the only property a ministry actually requires."
 ITADNC_g_a_bridge_for_every_vote:0 "A Bridge for Every Vote"
 ITADNC_g_a_bridge_for_every_vote_desc:0 "We read the public works estimate line by line, and every line has a deputy attached to it: a road in the Molise, a mole at Bari, a bridge that will carry two carts a day. The Chamber votes the money gratefully, and we discover that gratitude expires within the year."
 ITADNC_g_the_list_that_goes_astray:0 "The List That Goes Astray"
 ITADNC_g_the_list_that_goes_astray_desc:0 "Nothing so vulgar as a stolen ballot box. A rival's papers are found irregular, his supporters are called for a licence renewal on polling day, and our carabinieri stand where they can be seen. Below Naples we know the return in Rome before the count begins."
 ITADNC_g_the_apulian_aqueduct:0 "The Apulian Aqueduct"
 ITADNC_g_the_apulian_aqueduct_desc:0 "A tunnel from the Sele across the Apennines to a province where water is carried up from cisterns and sold by the litre. We have voted it and it will outlast this ministry. It is the one promise we made to the South that cannot be quietly forgotten, because it is visible."
 ITADNC_g_the_strike_that_is_counted:0 "The Strike That Is Counted"
 ITADNC_g_the_strike_that_is_counted_desc:0 "The first general strike in our history. Milan and Genoa stop, the syndicalists proclaim the end of the bourgeois state, and we do absolutely nothing at all. It dissolves of its own accord, and we have learned the cheapest lesson of the decade."
 ITADNC_g_the_leagues_are_lawful:0 "The Leagues Are Lawful"
 ITADNC_g_the_leagues_are_lawful_desc:0 "We stop dissolving chambers of labour by prefectural decree, and let a peasant league hold funds and sign a contract. A union with property has something to lose, an address we can write to, and officials who must answer to their members for a strike that fails."
 ITADNC_g_the_portfolio_they_cannot_take:0 "The Portfolio They Cannot Take"
 ITADNC_g_the_portfolio_they_cannot_take_desc:0 "Turati is offered a place in the cabinet, and everybody in Rome knows he cannot accept it without breaking his own party in half. That is the point of offering. Either the reformists come in and are ours, or they refuse and spend the next congress explaining why to men who wanted the job."
 ITADNC_g_the_seats_that_are_paid_for:0 "The Seats That Are Paid For"
 ITADNC_g_the_seats_that_are_paid_for_desc:0 "Somebody in our Treasury finally adds it up: how many deputies sit for a constituency we gave a public work, how many for a province where our prefect arranged it. We do not show the figure to the Chamber. We show it to the President of the Council, who reads it and asks for nothing further."
 ITADNC_g_the_minister_of_the_underworld:0 "The Minister of the Underworld"
 ITADNC_g_the_minister_of_the_underworld_desc:0 "Salvemini prints a pamphlet naming our President of the Council the minister of the criminal classes, and describing exactly how a Basilicata seat is delivered. Nothing in it is untrue, and nothing in it can be answered."
 ITADNC_g_the_men_we_domesticated:0 "The Men We Domesticated"
 ITADNC_g_the_men_we_domesticated_desc:0 "The scattered leagues become one General Confederation of Labour with a headquarters, a treasury and a mass membership. That was the point of our whole policy. It also means our next dispute is not with a crowd in a square but with an organisation that can hold out for a month."
 ITADNC_g_the_majority_is_bought_again:0 "The Majority Is Bought Again"
 ITADNC_g_the_majority_is_bought_again_desc:0 "The estimates come round and every arrangement we made must be made again at a higher price. The deputies have learned what they are worth. We have kept nothing we purchased; we have only rented it, and the rent is reviewed each session."
 ITADNC_g_the_majority_that_governs:0 "The Majority That Governs"
 ITADNC_g_the_majority_that_governs_desc:0 "The Chamber elected under our arrangement takes its seats, and for the first time since Depretis we can count our votes before we ask for them. What we improvised after Monza is now the way Italy is governed, and it will hold as long as we feed it."
 ITADNC_g_the_register_is_reprinted:0 "The Register Is Reprinted"
 ITADNC_g_the_register_is_reprinted_desc:0 "Every adult male who has served, or can read, or has turned thirty goes on our roll, and the electorate trebles in a single revision. Nobody has ever canvassed these men, nobody owes them anything, and no prefect of ours has a page in his book for them."
 ITADNC_g_the_last_giolittian_chamber:0 "The Last Giolittian Chamber"
 ITADNC_g_the_last_giolittian_chamber_desc:0 "The first general election under the wide register returns a Chamber our machine did not make. The majority is still there on paper and it answers to five different things at once. Years of our arrangement are laid on the table to be valued, and strangers are doing the valuing."
 ITA_g_the_ministry_of_the_lobby:0 "The Ministry of the Lobby"
 ITA_g_the_ministry_of_the_lobby_desc:0 "Business is done in the corridor and ratified in the hall. It is quick, it is entirely legal, and it means that no policy of the Kingdom is ever decided by an argument."
 ITA_g_the_book_of_the_ninety:0 "The Book of the Ninety"
 ITA_g_the_book_of_the_ninety_desc:0 "The Interior knows the name of every man in every province who can deliver something, and what he wants for it. The estimates are drawn with the ledger open on the table."
 ITA_g_the_boards_of_conciliation:0 "The Boards of Conciliation"
 ITA_g_the_boards_of_conciliation_desc:0 "Disputes end in a room with a table in it rather than in a street with cavalry in it. The mills lose fewer weeks and the ministry loses fewer nights."
 ITA_g_the_men_who_will_vote_for_it:0 "The Men Who Will Vote For It"
 ITA_g_the_men_who_will_vote_for_it_desc:0 "A bench without a programme, assembled fresh each session out of whoever the ministry can satisfy. It carries every division and believes in nothing whatever."
 ITA_g_the_public_works_estimate:0 "The Public Works Estimate"
 ITA_g_the_public_works_estimate_desc:0 "More roads, harbours and bridges are being built in the Kingdom than at any time since unification, and every one of them was voted for a reason that had nothing to do with traffic."
 ITA_g_the_list_that_goes_astray:0 "The List That Goes Astray"
 ITA_g_the_list_that_goes_astray_desc:0 "In the South the ministry does not win elections, it arranges them. It is reliable, it is cheap, and it is the single fact about Italy that every foreign newspaper knows."
 ITA_g_the_leagues_are_lawful:0 "The Leagues Are Lawful"
 ITA_g_the_leagues_are_lawful_desc:0 "The unions have offices, funds and lawyers. They are far easier to negotiate with than a crowd, and far harder to disperse."
 ITA_g_the_minister_of_the_underworld:0 "The Minister of the Underworld"
 ITA_g_the_minister_of_the_underworld_desc:0 "The method has been described in print, with names and constituencies, by a man nobody can accuse of inventing it. The system still works. It simply no longer works quietly."
 ITA_g_the_confederation_of_labour:0 "The Confederation of Labour"
 ITA_g_the_confederation_of_labour_desc:0 "Half a million organised men with one address and one treasury. They will not riot. They will also never again be dispersed by a squadron of cavalry and a prefect's decree."
 ITA_g_the_bill_comes_round_again:0 "The Bill Comes Round Again"
 ITA_g_the_bill_comes_round_again_desc:0 "Nothing the ministry bought has been kept. Every session the same men present the same accounts, and the figure at the bottom is larger than it was last year."
 ITA_g_the_last_giolittian_chamber:0 "The Last Giolittian Chamber"
 ITA_g_the_last_giolittian_chamber_desc:0 "Eight and a half million voters have sent up a Chamber that owes the prefects nothing. It can still be managed. It cannot be counted in advance, and that is the whole difference."
 ITA_g_the_system_outlived_its_arithmetic:0 "The System Outlived Its Arithmetic"
 ITA_g_the_system_outlived_its_arithmetic_desc:0 "The machine was dismantled by its own author before the country dismantled it for him, and the ministry has come out of the reckoning still governing. Very few systems in Europe manage that."
 ITA_g_orlando_in_the_lobby:0 "Orlando in the Lobby"
 ITA_g_orlando_in_the_lobby_desc:0 "A Sicilian professor of constitutional law who can explain, at length and with authorities, why whatever the ministry did last week was provided for in 1848."
 ITA_g_carcano_at_the_treasury:0 "Carcano at the Treasury"
 ITA_g_carcano_at_the_treasury_desc:0 "He signs the public works estimate every year and every year tells the Council that this is the last time. He has been telling them so since Crispi."
 ITA_g_daneo_at_public_instruction:0 "Daneo at Public Instruction"
 ITA_g_daneo_at_public_instruction_desc:0 "If the register is to be widened to every man who can read, then somebody had better see that they can. He would rather it were done for its own sake."
 ITA_g_tb_the_lobby:0 "The Ministry of the Lobby"
 ITA_g_tb_the_boards:0 "The Boards of Conciliation"
 ITA_g_tb_the_bench:0 "The Bench Assembled"
 ITA_g_tb_the_public_works:0 "The Public Works Estimate"
 ITA_g_tb_the_aqueduct:0 "The Apulian Aqueduct"
 ITA_g_tb_the_strike_counted:0 "The Strike That Was Counted"
 ITA_g_tb_the_leagues:0 "The Leagues Made Lawful"
 ITA_g_tb_the_confederation:0 "The Confederation of Labour"
 ITA_g_the_machine_counted_tt:0 "Provinces held by the machine: §Y[?ITA_prefects|0]§! of 100."
 ITA_g_the_bench_is_already_full_tt:0 "§GThe majority is comfortable enough that the groups come to us.§! Nobody has to be paid twice this session."
 ITA_g_the_groups_are_bought_one_by_one_tt:0 "§RThe bench has to be assembled group by group.§! Every one of them names a price before it sits down."
 ITA_g_the_book_is_thick_tt:0 "§GThe ledger already covers most of the Kingdom.§! Adding to it is a matter of copying, not of persuasion."
 ITA_g_the_book_is_still_thin_tt:0 "§YHalf the provinces have no page worth reading.§! The clerks begin at the beginning."
 ITA_g_the_boards_meet_under_guard_tt:0 "§RThere are still troops in the disputes.§! Nobody sits at a board with a picket outside, and both sides say so."
 ITA_g_the_boards_are_believed_tt:0 "§GNo garrison has been called out in a strike this year.§! The masters come to the table because the alternative is now genuinely worse for them."
 ITA_g_the_curate_sits_beside_the_notary_tt:0 "§GThe ban is lifted and the parish vote is on the bench.§! It is the cheapest bloc the ministry has ever acquired."
 ITA_g_the_bench_is_short_of_the_countryside_tt:0 "§RRome has held the ban.§! The rural provinces send men who owe the ministry nothing at all."
 ITA_g_rome_has_not_answered_yet_tt:0 "§YThe question of the ban is still open.§! The bench is assembled without knowing whether it will have a Catholic wing."
 ITA_g_more_is_promised_than_can_be_built_tt:0 "§RThe pledges outrun the estimates.§! Somebody in the Molise is going to be told there is no bridge after all."
 ITA_g_the_works_are_within_reach_tt:0 "§GEverything promised this session can actually be built.§! It is an unusual position for an Italian ministry."
 ITA_g_the_street_reads_the_returns_tt:0 "§RThe country is already restless and the returns are printed anyway.§! The Extreme Left has an argument it did not have to make up."
 ITA_g_nobody_below_naples_is_surprised_tt:0 "§GThe country is quiet and the arrangement passes without comment.§! It is how elections have been held there since 1861."
 ITA_g_a_promise_is_redeemed_tt:0 "§GThree pledges are struck off the book.§! Water arrives where a minister said it would, which has not happened before."
 ITA_g_nothing_was_owed_here_tt:0 "§YNothing was promised for this, so nothing is discharged by it.§! The prefects take the credit instead."
 ITA_g_the_floor_will_not_come_down_tt:0 "§RThe army has been used in the streets before and the piazza remembers.§! The strike does not dissolve; it hardens."
 ITA_g_the_strike_ends_itself_tt:0 "§GNo troops were sent and there was nothing to fight.§! The strike ends in four days and the ministry is stronger for having done nothing."
 ITA_g_the_office_has_a_counterparty_tt:0 "§GThe Labour Office now has somebody lawful to write to.§! Disputes are settled in correspondence."
 ITA_g_recognised_and_unrecorded_tt:0 "§RThe leagues are lawful and nobody is counting them.§! The state has legalised an organisation it cannot see."
 ITA_g_turati_is_tempted_tt:0 "§GThe country is quiet enough that a reformist can defend taking office.§! Milan splits and the ministry gains a wing."
 ITA_g_the_congress_forbids_it_tt:0 "§RThe piazza is up and no socialist can be seen entering the Quirinale.§! The offer is refused in public and at length."
 ITA_g_half_the_bench_is_rented_tt:0 "§RA quarter of the Chamber sits for a favour rather than a conviction.§! Everybody can see it and nobody will say it in the hall."
 ITA_g_the_price_is_still_reasonable_tt:0 "§GThe bought seats are a minority of the majority.§! The arrangement is still cheaper than governing without one."
 ITA_g_the_pamphlet_can_be_documented_tt:0 "§RThe machine is large enough that every charge in the pamphlet can be checked.§! It is checked."
 ITA_g_the_pamphlet_is_denied_tt:0 "§GThe book is thin enough to be called a libel.§! The ministry denies it and enough people believe the denial."
 ITA_g_the_floor_is_organised_tt:0 "§YThe street has a permanent organisation now.§! It will never again fall as low as it used to between strikes."
 ITA_g_the_confederation_is_ours_tt:0 "§GThe reformists run the Confederation and the Confederation talks to us.§! It was the entire point of the offer to Turati."
 ITA_g_the_confederation_is_its_own_tt:0 "§RThe Confederation was built without us and answers to nobody in Rome.§! Half a million men, one treasury, and no obligation."
 ITA_g_the_ledger_will_not_close_tt:0 "§RThere are more promises outstanding than the session can discharge.§! Something in the cabinet has to go."
 ITA_g_it_is_paid_for_this_session_tt:0 "§GThe accounts balance for another year.§! Next year they will be presented again."
 ITA_g_the_bought_seats_will_not_survive_it_tt:0 "§RA large part of the majority was bought and none of it is worth anything to eight million voters.§! The machine is written down."
 ITA_g_there_is_little_to_lose_by_it_tt:0 "§GThe majority does not rest on purchased seats.§! Widening the register costs the ministry very little."
 ITA_g_the_country_has_already_answered_tt:0 "§GThe election has been held under the wide register.§! Whatever the Chamber is now, it is what the country sent."
 ITA_g_the_country_has_not_been_asked_yet_tt:0 "§RThe reckoning is forced before the country has voted on it.§! The Chamber resents being valued by a ministry it did not choose."
 ITA_g_the_sacristy_carried_it_tt:0 "§GThe parish clergy delivered the new voters.§! The majority survives the register, and now owes a debt to a party that does not admit it exists."
 ITA_g_the_bench_stands_on_itself_tt:0 "§RThere was no Catholic bloc to carry the new electorate.§! The bench faces eight million voters with nothing but its record."
 ita_dnc.1100.t:0 "The Second Half of the Circular"
 ita_dnc.1100.d:0 "A clerk at the Interior has been keeping the book for eleven years and is retiring. He asks, correctly and in writing, what is to be done with it. There are two halves. The first is the instruction that troops are not to be used in industrial disputes, which is printed, circulated and quoted in the Chamber with pride. The second is ninety pages of names: the mayor of a Calabrian commune who is sound, the sub-prefect at Foggia who is useful, the deputy for Avellino who abstained in March and has not been forgiven. It is the only document in Rome that describes the Kingdom as it actually is. It is also the exact thing that, read aloud, would end the ministry in an afternoon."
 ita_dnc.1100.a:0 "The book is kept. It is how the country is governed."
 ita_dnc.1100.b:0 "The second half goes into the stove."
 ita_dnc.1101.t:0 "Four Days in September"
 ita_dnc.1101.d:0 "It began with carabinieri shooting quarrymen in Sardinia and it is now a general strike, the first the Kingdom has ever seen. Milan has no trams, no papers and no bread deliveries; Genoa is shut; the syndicalists at the Camera del Lavoro are proclaiming that the bourgeois state has ended. Every prefect in the North has telegraphed for troops and every telegram has gone unanswered on the President of the Council's instruction. He is telling the cabinet that a general strike with no government to fight it is a demonstration that runs out of money, and that the country will be so relieved when it stops that it will vote for whoever did nothing. He may also simply be wrong."
 ita_dnc.1101.a:0 "Do nothing, and dissolve the Chamber the moment it ends."
 ita_dnc.1101.b:0 "Do nothing, and say nothing afterwards either."
 ita_dnc.1101.c:0 "Four days is enough. Clear the squares."
 ita_dnc.1102.t:0 "Il Ministro della Malavita"
 ita_dnc.1102.d:0 "Gaetano Salvemini is a historian from Molfetta who lost his wife, his sister and his five children under the rubble at Messina, and who has since stopped being careful. His pamphlet does not allege corruption in general terms. It names constituencies, it describes how the nomination papers of an opposition candidate are found irregular on the last permitted day, it explains what the carabinieri are for on polling morning below Naples, and it calls the President of the Council the minister of the criminal classes. Nothing in it is invented. The ministry's difficulty is not that the charge is false but that it is documented, and that Salvemini would rather like to be prosecuted."
 ita_dnc.1102.a:0 "Send a commission south and let it report honestly."
 ita_dnc.1102.b:0 "It is a pamphlet. Say nothing at all."
 ita_dnc.1102.c:0 "Prosecute him, and let him make his speech in court."
 ita_dnc.1103.t:0 "The Offer Is Made Twice"
 ita_dnc.1103.d:0 "Filippo Turati has been offered a portfolio before and refused it on the ground that his own party would destroy him for taking it. He is asked again, in a private room, and the terms are put to him without decoration. Inside the cabinet he can have the labour laws, the Sunday rest, the inspectors and the accident insurance. Outside it he can have another decade of arguing with the maximalists about whether to argue with anybody. Anna Kuliscioff has told him that a party which never governs never has to be right about anything. The intransigents have the congress, the provincial federations and the newspapers, and they are counting the days."
 ita_dnc.1103.a:0 "Press him. A split in Milan is worth a session in Rome."
 ita_dnc.1103.b:0 "Withdraw it gracefully and take the support instead."
 ita_dnc.1104.t:0 "The Water Reaches the Murge"
 ita_dnc.1104.d:0 "The tunnel from the Sele has come through the Apennines and the first water is running east into a province where a family has always bought it by the litre from a cart. Half of Apulia wants the King to open it, the local deputies want the ministry to open it, and the engineers point out that the works are eighteen years from completion and that the ceremony will be reported as though they were finished. There is a second consideration. Six deputies were promised something for their votes in the last session, and the aqueduct is the only thing standing that could be presented to them as payment."
 ita_dnc.1104.a:0 "Open it publicly, and let it be seen that a promise was kept."
 ita_dnc.1104.b:0 "Open it quietly, and let the prefects hand out the credit."
 ita_dnc.1105.t:0 "Eight and a Half Million Names"
 ita_dnc.1105.d:0 "The revision is done and the rolls are printed. Every man over thirty, every man who has served, every man who can read: the electorate has gone from three and a quarter million to eight and a half in a single act, and more than half of the new voters are agricultural labourers who have never been canvassed by anybody in their lives. The Interior asks for guidance. The prefects can be instructed to learn these men the way they learned the old register, which will take three years and a great deal of money and will be noticed. Or they can be left alone, and the ministry can find out in 1913 what an Italy nobody has arranged actually votes for."
 ita_dnc.1105.a:0 "Instruct the prefects. The book must cover the new rolls."
 ita_dnc.1105.b:0 "Leave them alone. We will meet them at the polls."
 ita_dnc.1106.t:0 "The Chamber of 1913"
 ita_dnc.1106.d:0 "The returns are in and the arithmetic no longer works. The ministry has its majority, on paper, and it is made of Catholics who came in on the Gentiloni understanding, radicals who came in against the Libyan war, Southern deputies who came in the usual way, and eighty socialists who came in on their own account. Nothing binds them. A seat that cost a bridge in 1909 cost a bridge and eleven thousand new voters in 1913, and there are constituencies where the prefect's arrangements were simply drowned. Thirteen years of a system are on the table. Somebody has to say what it was worth and whether it goes on."
 ita_dnc.1106.a:0 "It did what it was for. Wind it up while we still can."
 ita_dnc.1106.b:0 "Extend the machine to the new rolls and carry on."
 ita_dnc.1106.c:0 "Break it up entirely and govern without it."
 ITADNC_s_the_prefect_is_an_instrument:0 "The Prefect Is an Instrument"
 ITADNC_s_the_prefect_is_an_instrument_desc:0 "For a generation our prefect has been a broker: a road for a mayor, a mayor for a list, a list for a deputy who votes the estimates. We inform him that he is not a party to the bargain but an officer of the Crown, and that what he arranges he arranges on our instruction. The favours stop. The obedience is to begin."
 ITADNC_s_the_chambers_of_labour_dissolved:0 "The Chambers of Labour Dissolved"
 ITADNC_s_the_chambers_of_labour_dissolved_desc:0 "The camere del lavoro are associations under the public safety law, and that law lets us dissolve them by order. Milan, Genoa, Turin, Bologna: doors sealed before dawn, registers carried off, funds sequestrated. The men are still there in the morning, and now they have nowhere to be."
 ITADNC_s_the_paper_seized_before_it_is_read:0 "Seized Before It Is Read"
 ITADNC_s_the_paper_seized_before_it_is_read_desc:0 "Preventive seizure: our questore lifts the run off the stone at four in the morning and the editor argues about it in a court that will sit next season. Avanti! prints in Lugano. The provincial sheets learn without being told which paragraphs are not worth the plant."
 ITADNC_s_the_cassation_overruled:0 "The Cassation Overruled"
 ITADNC_s_the_cassation_overruled_desc:0 "The Court of Cassation held that a decree cannot make law where the Chamber has refused it, and our public safety decrees died of that sentence. We answer that the court has read the Statuto as though it were a republic's constitution. We lay a bill of interpretation, carry it, and the judgement becomes an opinion."
 ITADNC_s_the_south_governed_not_bought:0 "The South Governed, Not Bought"
 ITADNC_s_the_south_governed_not_bought_desc:0 "The transformist South is a market: a bridge for a borough, a prefect who mislays the wrong ballot boxes. Ours will be an administration instead. We send engineers, inspectors and money we account for line by line, and we send nobody to ask the local deputy what he wants in exchange for his vote."
 ITADNC_s_the_leagues_that_register:0 "The Leagues That Register"
 ITADNC_s_the_leagues_that_register_desc:0 "What we dissolve may re-form, on our terms. A league that deposits its rules, its accounts and the names of its officers at the prefecture may meet; one that does not is a criminal association and its committee is liable. Half register inside the year. The half that matter do not, and meet in the churchyard."
 ITADNC_s_the_licence_to_print:0 "The Licence to Print"
 ITADNC_s_the_licence_to_print_desc:0 "A press we may seize is still a press. A press that requires a deposit, a responsible editor of property and a licence renewable at our prefecture is an instrument of government. The great papers pay and continue. The small sheets of the provinces cannot, and the kingdom is quieter than it has been in a generation."
 ITADNC_s_the_bench_reappointed:0 "The Bench Reappointed"
 ITADNC_s_the_bench_reappointed_desc:0 "Judges are appointed by the Crown and promoted by our Minister of Grace and Justice, and nobody has ever pretended otherwise. We go through the promotion lists with a pencil. Magistrates who found for the seized newspapers are transferred to Sardinia with their rank intact and their careers finished."
 ITADNC_s_the_colleges_redrawn:0 "The Colleges Redrawn"
 ITADNC_s_the_colleges_redrawn_desc:0 "The single-member colleges, and it is we who draw the map. The obstructionists of the Romagna are divided among three agricultural seats; Milan's working quarters are joined to the villas beyond the walls. We disenfranchise no Italian. Whole benches simply stop being returned."
 ITADNC_s_the_state_of_siege_by_telegram:0 "A State of Siege by Telegram"
 ITADNC_s_the_state_of_siege_by_telegram_desc:0 "Our prefect who wires Rome for powers has them before the answer comes back. He may proclaim a state of siege on his own authority and report it afterwards, and the military tribunal sits inside the week. Bava Beccaris needed a royal decree to shell Milan. His successors will need a telegraph clerk."
 ITADNC_s_the_aqueduct_without_a_deputy:0 "The Aqueduct Without a Deputy"
 ITADNC_s_the_aqueduct_without_a_deputy_desc:0 "We let the Apulian aqueduct on an engineer's report, and the deputy for Bari reads about it in the Gazzetta with everybody else. Every public work in the South before this one bought a vote. This one buys nothing, which is the whole point, and which is why nobody in Bari believes in it yet."
 ITADNC_s_the_code_of_public_safety:0 "The Code of Public Safety"
 ITADNC_s_the_code_of_public_safety_desc:0 "We gather the decrees, seizures, dissolutions and transfers into one consolidated text and carry it in a single sitting of four hours. What was a series of emergencies becomes the ordinary law of the kingdom, and we no longer have to explain each measure as though it were the last."
 ITADNC_s_the_ministry_that_cannot_fall:0 "The Ministry That Cannot Fall"
 ITADNC_s_the_ministry_that_cannot_fall_desc:0 "A vote of the Chamber is not a resignation. We hold office at the King's pleasure, and the Chamber's disapproval is entered in the minutes and left there. Ministries are censured and neither leaves. After that the censure stops being moved at all, and we call that stability."
 ITADNC_s_the_administration_that_governs:0 "The Administration That Governs"
 ITADNC_s_the_administration_that_governs_desc:0 "Ninety prefects, a corps of inspectors who answer to us and not to the province, a school for them by the Tiber, and a career that passes through no deputy's antechamber. It is the one thing this kingdom has never owned: a service we can tell to do a thing, which will have done it by the next quarter."
 ITADNC_s_the_state_that_is_obeyed:0 "The State That Is Obeyed"
 ITADNC_s_the_state_that_is_obeyed_desc:0 "Year after year, and every measure has worked. Our order is executed, the paper does not print it, the court will not entertain it, and the Chamber is not asked. We have bought all of it with the same coin, paid annually: the number of Italians who believe this kingdom belongs to them is smaller every year."
 ITADNC_s_the_statuto_kept:0 "The Statuto Kept"
 ITADNC_s_the_statuto_kept_desc:0 "The Chamber meets, the estimates are laid before it, and it votes them because we arranged beforehand that it would. We have broken nothing in the Statuto and left nothing in it as it stood. Whether what remains is a constitution or a settled habit of obedience is a question for the next reign."
 ITA_s_the_instrument_owes_nothing_tt:0 "§REvery pledge the ministry was carrying is written off in one circular.§! An instrument does not owe favours, and the deputies who were promised them stop voting with us."
 ITA_s_there_was_nothing_promised_tt:0 "§GThe ministry took office owing nobody anything.§! The circular costs a morning and offends nobody who matters."
 ITA_s_the_ninety_already_take_orders_tt:0 "§GThe ninety prefectures were already instructed by the society ministry.§! The new circular only tells them to stop taking anything in return."
 ITA_s_the_brokers_are_told_to_stop_tt:0 "§RNinety men are told to stop doing the only thing they know how to do.§! Half the arrangements in the provinces come apart before the new ones are made."
 ITA_s_we_are_shutting_what_we_licensed_tt:0 "§RThe Kingdom recognised the chambers of labour by law and is now sealing their doors.§! Nobody on the Left has to argue that the state is not neutral any more."
 ITA_s_they_had_no_standing_to_lose_tt:0 "§GThe chambers were tolerated, never recognised.§! Dissolution takes a prefectural order and a locksmith, and the prefects gain the registers."
 ITA_s_seizing_figures_already_printed_tt:0 "§RThe ledger is already public and the seizures look like a confession.§! Every issue taken off the stone is read in manuscript by twice as many people."
 ITA_s_the_questori_work_quietly_tt:0 "§GNothing has been published that anyone can compare the seizures against.§! The questori work at four in the morning and the provinces hear nothing."
 ITA_s_the_court_was_beaten_once_already_tt:0 "§GThe court has been overruled once and knows how it ends.§! The bill of interpretation passes in a single sitting."
 ITA_s_the_bar_reads_the_bill_aloud_tt:0 "§RThe bar of Rome reads the bill aloud and calls it what it is.§! The profession that administers the law stops believing in the ministry that writes it."
 ITA_s_no_court_will_hear_the_appeal_tt:0 "§GThe Cassation has been overruled, so a refused licence has nowhere to go.§! The refusals stop being challenged and start being obeyed."
 ITA_s_the_licence_is_litigated_tt:0 "§REvery refused licence is taken to court and half of them are won there.§! The instrument works, slowly, and in public."
 ITA_s_nobody_signs_the_register_tt:0 "§RWith the street this high, no league in the Kingdom will put its officers' names on a prefectural list.§! A §Rbayonet§! goes to closing the ones that meet anyway."
 ITA_s_half_of_them_sign_tt:0 "§GHalf the leagues register and go on meeting under a prefect's eye.§! It is not liberty and it is quieter than dissolution."
 ITA_s_the_courts_carry_what_the_chamber_will_not_tt:0 "§YWith no majority, the ministry governs through the bench instead.§! It works, and everyone in Italy can see exactly what has been done to the bench."
 ITA_s_the_transfers_pass_unremarked_tt:0 "§GWith a majority behind it, the ministry moves eleven magistrates to Sardinia and nobody asks a question in the Chamber.§!"
 ITA_s_too_many_voters_to_draw_around_tt:0 "§RThe register is too large to be drawn around.§! Redistricting a mass electorate produces a majority and an organised enemy in the same afternoon."
 ITA_s_sixty_seats_stop_being_returned_tt:0 "§GTwo and a half million voters can be sorted into any map the ministry likes.§! Sixty obstructionist seats stop being returned and nobody is disenfranchised."
 ITA_s_vienna_counts_the_garrisons_at_home_tt:0 "§RVienna counts the divisions standing in Italian cities and subtracts them from the alliance.§!"
 ITA_s_a_free_hand_and_a_tribunal_in_milan_tt:0 "§RA kingdom with a free hand abroad and a military tribunal in Milan is watched.§! The powers take note of what the army is being used for."
 ITA_s_the_army_already_answers_the_sash_tt:0 "§GThe army already accepts a prefect's requisition without asking Rome.§! The telegram only shortens a procedure the regiments know."
 ITA_s_the_generals_are_told_afterwards_tt:0 "§RThe staff learns that prefects may now proclaim sieges by reading the Gazzetta.§! The army does the work and is not consulted about it."
 ITA_s_the_special_laws_have_a_service_now_tt:0 "§GThe special laws already exist and now there is a service to execute them.§! The works go up in Apulia and Basilicata without a deputy touching them."
 ITA_s_an_administration_with_nothing_to_do_tt:0 "§RAn administration has been built for a South that has no programme to administer.§! The inspectors write reports about roads nobody has voted."
 ITA_s_the_sele_water_arrives_on_schedule_tt:0 "§GThe aqueduct was begun and the water arrives on the engineer's date, not the deputy's.§! Apulia stops burying children in the summer."
 ITA_s_the_engineers_start_from_nothing_tt:0 "§RThere is no aqueduct to finish, only a survey.§! Everything is begun from the first peg and paid for out of patience."
 ITA_s_the_emergencies_become_the_law_tt:0 "§YThree emergency measures are consolidated into one ordinary law of the Kingdom.§! The separate spirits are replaced by the Code."
 ITA_s_the_code_writes_down_the_bayonets_tt:0 "§RThe Code is voted by a country that has already been shot at three times.§! What it consolidates is not order but the memory of the volleys."
 ITA_s_a_quiet_kingdom_codified_tt:0 "§GThe Code arrives before the shooting does.§! It reads as administration rather than as reprisal, and the prefects gain by it."
 ITA_s_a_censured_ministry_that_stays_tt:0 "§RA ministry the Chamber has censured stays in office anyway.§! A paid arrangement collapses and the street understands the announcement perfectly."
 ITA_s_the_motion_is_never_moved_tt:0 "§GWith a majority in hand, the doctrine is stated and never has to be tested.§! The censure is simply not moved."
 ITA_s_a_service_that_can_be_told_tt:0 "§GA permanent inspectorate answering to Rome.§! It is the first Italian institution that can be told to do a thing and will have done it."
 ITA_s_the_inspectors_have_figures_to_start_from_tt:0 "§GThe ledger is public, so the inspectorate begins with numbers instead of guesses.§! The first quarter is not wasted counting."
 ITA_s_the_inspectors_count_it_themselves_tt:0 "§RNothing has ever been counted honestly, so the inspectorate must count it first.§! Two years go into arithmetic before anything is administered."
 ITA_s_obedience_stops_at_the_city_gate_tt:0 "§RThe Kingdom obeys everywhere except where it matters.§! Provinces stop answering Rome and the ministry finds out by telegram."
 ITA_s_the_kingdom_does_what_it_is_told_tt:0 "§GFrom the Alps to Sicily, the order given in Rome is the order carried out.§! No Italian government has ever been able to say that."
 ITA_s_the_programme_is_finished_tt:0 "§GTorniamo allo Statuto ceases to be a programme.§! It is the constitution of the Kingdom as actually practised, and the pamphlet is withdrawn."
 ITA_s_the_floor_under_the_piazza_stays_tt:0 "§RFour or more bayonets were spent getting here.§! The floor under the Piazza does not come down because the ministry has stopped shooting."
 ITA_s_a_form_that_survived_the_cure_tt:0 "§GThe Statuto is restored to its letter without a general volley.§! Whatever this is, the country has not been broken to get it."
 ITA_s_the_chambers_dissolved:0 "The Chambers of Labour Dissolved"
 ITA_s_the_chambers_dissolved_desc:0 "Sealed doors in four cities and the funds under sequestration. Nothing has been settled and everything has been postponed."
 ITA_s_the_prefect_is_an_instrument:0 "The Prefect as Instrument"
 ITA_s_the_prefect_is_an_instrument_desc:0 "Ninety men in a sash who take orders and no longer take terms. It is a better machine and a smaller one."
 ITA_s_the_censor_before_the_press:0 "Seizure Before Publication"
 ITA_s_the_censor_before_the_press_desc:0 "The questore reaches the stone before the reader does. The papers that survive are the ones that can afford to be careful."
 ITA_s_the_law_of_interpretation:0 "The Law of Interpretation"
 ITA_s_the_law_of_interpretation_desc:0 "The Chamber has told the Court of Cassation what the Statuto means. The Court has agreed, in the only way left to it."
 ITA_s_the_south_administered:0 "The South Administered"
 ITA_s_the_south_administered_desc:0 "Engineers and inspectors instead of bargains. It builds more per lira and it costs the ministry every Southern deputy it had."
 ITA_s_the_estimates_are_thin:0 "An Administration Without a Programme"
 ITA_s_the_estimates_are_thin_desc:0 "The service exists and there is nothing for it to execute. Inspectors write reports about works that were never voted."
 ITA_s_the_registered_leagues:0 "The Register of Leagues"
 ITA_s_the_registered_leagues_desc:0 "Association at the price of a list of names at the prefecture. Most of the trade movement accepts it, and the rest goes underground."
 ITA_s_the_licence_to_print:0 "The Licence to Print"
 ITA_s_the_licence_to_print_desc:0 "A deposit, a responsible editor of property, and a renewal every year. The great papers are untouched and the provinces are silent."
 ITA_s_the_bench_is_reliable:0 "A Reliable Bench"
 ITA_s_the_bench_is_reliable_desc:0 "The promotion lists have been gone through. Judgements now arrive at the answer the ministry expected, which is convenient and widely known."
 ITA_s_the_colleges_redrawn:0 "The Colleges Redrawn"
 ITA_s_the_colleges_redrawn_desc:0 "A map drawn in the Interior. It is entirely legal, it disenfranchises nobody, and it decides sixty elections in advance."
 ITA_s_the_siege_by_telegram:0 "A State of Siege by Telegram"
 ITA_s_the_siege_by_telegram_desc:0 "Any prefect may proclaim a siege and report it afterwards. The army is quicker than it has ever been and is used for this."
 ITA_s_the_works_administered:0 "Works Without a Deputy"
 ITA_s_the_works_administered_desc:0 "Contracts let on an engineer's report. The aqueducts advance on schedule and no Southern member has a favour left to sell."
 ITA_s_the_code_of_public_safety:0 "The Code of Public Safety"
 ITA_s_the_code_of_public_safety_desc:0 "One consolidated text replacing four years of emergencies. What was exceptional is now simply the law of the Kingdom."
 ITA_s_the_ministry_holds:0 "The Ministry Holds"
 ITA_s_the_ministry_holds_desc:0 "Ministers hold office at the King's pleasure and a vote of the Chamber is an opinion. Government stops being interrupted every eleven months."
 ITA_s_the_administration_that_governs:0 "The Administration That Governs"
 ITA_s_the_administration_that_governs_desc:0 "A permanent inspectorate that answers to Rome. It is the most competent thing the Kingdom has ever built and it answers to nobody elected."
 ITA_s_the_state_that_is_obeyed:0 "The State That Is Obeyed"
 ITA_s_the_state_that_is_obeyed_desc:0 "Every instrument works. The cost is entered in a column nobody adds up: the number of Italians who think the Kingdom is theirs."
 ITA_s_the_statuto_kept:0 "The Statuto Kept"
 ITA_s_the_statuto_kept_desc:0 "The letter of 1848 restored and the custom of forty years discarded. Whether it is a constitution or a habit is a question for the next reign."
 ITA_s_orlando_at_grace_and_justice:0 "Orlando at Grace and Justice"
 ITA_s_orlando_at_grace_and_justice_desc:0 "A Sicilian professor of public law who can prove that anything the ministry has already done was lawful, and who is usually right."
 ITA_s_orlando_at_grace_and_justice_tt:0 "Vittorio Emanuele Orlando becomes available as a political advisor."
 ITA_s_the_telegram_threat:0 "Sieges Proclaimed by Telegram"
 ita_dnc.1200.t:0 "The Circular of the First of March"
 ita_dnc.1200.d:0 "The circular has gone to ninety prefectures and eleven of them have written back. The prefect of Cosenza wants to know, respectfully, what he is to say to the deputy who has been promised a road since 1897, and whether the ministry understands that the promise is why the estimates carried last year."
 ita_dnc.1200.a:0 "Tell him the promise was not the ministry's to make."
 ita_dnc.1200.b:0 "Let the old arrangements run out rather than be broken."
 ita_dnc.1201.t:0 "The General Strike"
 ita_dnc.1201.d:0 "Four days after the sequestrations, the trades of Milan stop together for the first time in the history of the Kingdom. There is no committee to negotiate with because the committee is in Santo Stefano prison. The prefect asks whether he is to open the halls again or clear the streets, and he requires the answer tonight."
 ita_dnc.1201.a:0 "Clear the streets. The order stands."
 ita_dnc.1201.b:0 "Lift the sequestration. We have made our point."
 ita_dnc.1202.t:0 "The First President Resigns"
 ita_dnc.1202.d:0 "The First President of the Court of Cassation lays down his office rather than administer the law of interpretation, and says so in four sentences that are printed everywhere before the questori can reach the presses. He is seventy-one and has nothing whatever left to lose."
 ita_dnc.1202.a:0 "Accept the resignation and appoint a successor tonight."
 ita_dnc.1202.b:0 "Refuse it, and let him serve under the law he despises."
 ita_dnc.1203.t:0 "The Deposit"
 ita_dnc.1203.d:0 "Nine hundred provincial sheets have applied for a licence and four hundred can find the deposit. The Corriere and the Tribuna have paid without complaint and are notably content with the arrangement. The Catholic press of the Veneto has not paid, and the bishops would like to discuss it."
 ita_dnc.1203.a:0 "The deposit is the law. It applies to the sacristies too."
 ita_dnc.1203.b:0 "Exempt the diocesan sheets and keep the bishops quiet."
 ita_dnc.1204.t:0 "The Map Is Laid on the Table"
 ita_dnc.1204.d:0 "The new colleges are published in the Gazzetta on a Saturday. Romagna has lost four seats to the countryside, Milan has gained two suburbs of villas, and a deputy from Forli stands up in the Chamber holding the old map and the new one and asks the ministry to explain the difference to the country."
 ita_dnc.1204.a:0 "The map is administrative. Move to the next business."
 ita_dnc.1204.b:0 "Concede the Romagna colleges and keep the rest."
 ita_dnc.1205.t:0 "Ancona, Proclaimed at Nine in the Morning"
 ita_dnc.1205.d:0 "The prefect of Ancona proclaims a state of siege over a dispute at the shipyard and wires Rome an hour afterwards. The tribunal has sentenced eleven men before the ministry has finished reading the telegram. It is exactly the procedure that was voted, and nobody in the cabinet expected to see it used this way."
 ita_dnc.1205.a:0 "Confirm the proclamation. The power exists to be used."
 ita_dnc.1205.b:0 "Revoke it and recall the prefect."
 ita_dnc.1206.t:0 "Four Hours in the Chamber"
 ita_dnc.1206.d:0 "The Code is read, debated and voted between two o'clock and six. The Extreme Left walks out at the second article and the sitting continues without them, which is noted in the minutes as a formality. Outside, the deputies who left are cheered by a crowd the questore estimates at nine thousand."
 ita_dnc.1206.a:0 "Print the Code and let the crowd disperse itself."
 ita_dnc.1206.b:0 "Delay promulgation until the winter. Let it cool."
 ita_dnc.1207.t:0 "The Censure of the Twelfth"
 ita_dnc.1207.d:0 "The Chamber censures the ministry by two hundred and six to a hundred and ninety-one. The President of the Council thanks the House for its opinion, informs it that the ministry holds office from the King, and calls the next item on the order paper. There is no precedent in forty years for what happens next, which is nothing."
 ita_dnc.1207.a:0 "Nothing happens next. Call the next item."
 ita_dnc.1207.b:0 "Reconstruct the cabinet without resigning."
 ita_dnc.1208.t:0 "The Report of the Inspectorate"
 ita_dnc.1208.d:0 "The inspectorate's fifth annual report is laid before the King and not before the Chamber. It records that every order given in the last year was executed, and it records, in an appendix nobody was asked to write, the number of provinces where execution required troops."
 ita_dnc.1208.a:0 "Strike the appendix. It is not the inspectorate's business."
 ita_dnc.1208.b:0 "Print it whole. We should know what it costs."
 ITADNC_r_the_hand_offered_to_turati:0 "The Hand Offered to Turati"
 ITADNC_r_the_hand_offered_to_turati_desc:0 "We offered Turati a portfolio and he refused, saying his party would never forgive him. We offer it again, and we tell the reformists at Milan plainly what refusal costs them: another decade of being shot at by our prefects while the maximalists collect the dead."
 ITADNC_r_the_chambers_enter_the_state:0 "The Chambers Enter the State"
 ITADNC_r_the_chambers_enter_the_state_desc:0 "We count the camere del lavoro, register them and give them a legal person: they may hold funds, sign for a trade, be sued. Our prefects lose the right to close a hall on a telegram. In exchange the halls acquire what they never had - an address where we can serve papers."
 ITADNC_r_the_illiterate_voter:0 "The Illiterate Voter"
 ITADNC_r_the_illiterate_voter_desc:0 "Half the men we put on the new register cannot read the ballot we hand them. Evening classes in every commune, a printed symbol beside each list, clerks who are not the mayor's cousins. Whoever teaches these men to read will be remembered by them, and we would rather it were us."
 ITADNC_r_the_contract_has_the_force_of_law:0 "The Contract Has the Force of Law"
 ITADNC_r_the_contract_has_the_force_of_law_desc:0 "A wage agreed between a chamber of labour and an employers' association will bind every workshop in the trade, and our magistrate will enforce it. The strike stops being a test of who can starve longest and becomes a matter of paper. The employers of Lombardy call this confiscation."
 ITADNC_r_a_ministry_of_labour:0 "A Ministry of Labour"
 ITADNC_r_a_ministry_of_labour_desc:0 "We raise the Labour Office out of Agriculture and give it a minister in cabinet, inspectors with the power of entry, and estimates of its own to defend. It is the first department of this kingdom whose business is the men who work rather than the men who own."
 ITADNC_r_the_white_leagues:0 "The White Leagues"
 ITADNC_r_the_white_leagues_desc:0 "Rome does not intend to leave the countryside to the socialists. Catholic leagues, rural savings banks and parish co-operatives spread through the Veneto and Lombardy faster than anything the Chamber has voted. They are better organised than us and they are not obliged to tell us what they want."
 ITADNC_r_the_south_votes_now:0 "The South Votes Now"
 ITADNC_r_the_south_votes_now_desc:0 "Universal suffrage in the North is a reform; in the South it is a revolution or a farce, depending entirely on whether our prefect still owns the returning officer. New voters by the province, in country where we have never been anything but a tax collector and a conscription list."
 ITADNC_r_the_congress_at_bologna:0 "The Congress at Bologna"
 ITADNC_r_the_congress_at_bologna_desc:0 "The party meets to decide whether a socialist may sit in our cabinet. The reformists have the deputies, the intransigents have the halls, and both have counted the delegates. Whichever motion carries, the losers will not stay, and we shall be governing with a party we helped to break."
 ITADNC_r_the_men_who_walked_out:0 "The Men Who Walked Out"
 ITADNC_r_the_men_who_walked_out_desc:0 "The revolutionary syndicalists take their halls and their newspapers and leave us. They will not contest another election; they intend the general strike. They are fewer than they were that morning and considerably louder, and we cannot arrest an idea."
 ITADNC_r_the_ministry_without_the_army:0 "The Ministry Without the Army"
 ITADNC_r_the_ministry_without_the_army_desc:0 "A standing instruction to the ninety prefectures: troops are not to be requested in a labour dispute, and no officer is to be asked to settle a wage. The street learns that we have put the rifles away. The officer corps learns that we would rather be beaten than defended by it."
 ITADNC_r_the_officers_petition:0 "The Officers' Petition"
 ITADNC_r_the_officers_petition_desc:0 "A memorial reaches the King's desk, signed by more colonels than anyone will admit to counting, complaining that we have made the army ridiculous - employing it for nothing and paying it less. Nothing in it is treason. Everything in it is a warning, and the Crown reads it twice."
 ITADNC_r_the_army_the_reformists_will_pay_for:0 "The Army the Reformists Will Pay For"
 ITADNC_r_the_army_the_reformists_will_pay_for_desc:0 "We put the bargain to both benches: shorter colours, a real territorial reserve, promotion by examination, and in exchange the Extreme Left votes our estimates instead of abstaining. It is a smaller army than the generals asked for, and the first one they have been voted in a decade."
 ITADNC_r_the_money_leaves_milan:0 "The Money Leaves Milan"
 ITADNC_r_the_money_leaves_milan_desc:0 "The Banca Commerciale discovers Switzerland. Orders are postponed, extensions cancelled, and three boards announce that conditions in our kingdom do not presently justify investment. Nobody has broken a law. The lights of the North can be turned off by men who answer to no constituency."
 ITADNC_r_the_terms_offered_to_the_banks:0 "The Terms Offered to the Banks"
 ITADNC_r_the_terms_offered_to_the_banks_desc:0 "We stop asking and start bargaining: state orders guaranteed for years ahead, against a written undertaking to keep the plant in Italy and honour the trade contracts. It is not a nationalisation and we do not pretend it is charity. Both sides know exactly what the other can withhold."
 ITADNC_r_the_answer_to_the_parish:0 "The Answer to the Parish"
 ITADNC_r_the_answer_to_the_parish_desc:0 "If the leagues will organise the villages, we will teach them. We take elementary schooling off the communes and pay it from Rome; the teacher becomes our servant with a pension, and the curate is no longer the only man in the commune who can explain a document to a labourer."
 ITADNC_r_the_pension_that_is_not_charity:0 "The Pension That Is Not Charity"
 ITADNC_r_the_pension_that_is_not_charity_desc:0 "Old age and invalidity made compulsory rather than voluntary, collected through the registered halls, paid as a right and not as relief. It is the most expensive thing we have ever asked the Chamber to vote for men who own nothing, and it is why the reformists can tell their congress the bargain was worth it."
 ITADNC_r_the_eight_hours_in_the_state_yards:0 "The Eight Hours in the State Yards"
 ITADNC_r_the_eight_hours_in_the_state_yards_desc:0 "We cannot legislate the working day for every trade in Italy, so we do it where we are the employer: the arsenals, the state railways, the naval yards. Then we ask every private works in the country why it cannot manage what we manage - and we let it know we shall ask again."
 ITADNC_r_the_kingdom_of_all_italians:0 "The Kingdom of All Italians"
 ITADNC_r_the_kingdom_of_all_italians_desc:0 "A decade ago the state met the workman with a battery in the Corso. He now votes, signs a contract the courts enforce, and draws a pension from a fund he pays into. The party that was going to overthrow the Kingdom is inside it, arguing about estimates. It is a harder country to govern and it is ours."
 ITA_r_the_chambers_in_the_state:0 "The Chambers in the State"
 ITA_r_the_chambers_in_the_state_desc:0 "Every chamber of labour has a register, a treasurer and a legal person. Disputes are argued in an office instead of a square, and the prefect has to find a reason before he closes a hall."
 ITA_r_the_new_electorate:0 "The New Electorate"
 ITA_r_the_new_electorate_desc:0 "Eight million men on the rolls and evening classes in every commune to teach them what they are holding. They are learning to read on a ballot paper, and nobody in Rome can predict what they will do with it."
 ITA_r_the_collective_contract:0 "The Collective Contract"
 ITA_r_the_collective_contract_desc:0 "A wage settled for a whole trade and enforced by a magistrate. The workshops know their costs a year ahead, and the employers of Lombardy have not stopped calling it theft."
 ITA_r_the_ministry_of_labour:0 "The Ministry of Labour"
 ITA_r_the_ministry_of_labour_desc:0 "A department with inspectors, estimates and a seat in cabinet, whose business is the men who work. Every dispute in the Kingdom now has somewhere official to go before it reaches the street."
 ITA_r_the_white_leagues:0 "The White Leagues"
 ITA_r_the_white_leagues_desc:0 "Catholic unions, rural banks and parish co-operatives across the North, better organised than anything the Chamber has voted. They keep the countryside quiet and they do not take instructions from us."
 ITA_r_the_south_in_the_register:0 "The South in the Register"
 ITA_r_the_south_in_the_register_desc:0 "Two million Southern labourers with a vote, in provinces where the state has been a tax collector and a conscription list. They have discovered that Rome will now listen when they are counted."
 ITA_r_the_party_that_split:0 "The Party That Split"
 ITA_r_the_party_that_split_desc:0 "Two socialist parties where there was one, each publishing that the other has betrayed the working class. The ministry is sustained by half of a movement and denounced by the other half every week."
 ITA_r_the_syndicalists_outside:0 "The Syndicalists Outside"
 ITA_r_the_syndicalists_outside_desc:0 "The men who walked out of Bologna will not contest another election. They want the general strike, they are preparing for it openly, and no law on the books makes preparing for it a crime."
 ITA_r_the_army_that_is_not_called:0 "The Army That Is Not Called"
 ITA_r_the_army_that_is_not_called_desc:0 "No regiment is to be requested in a labour dispute. The squares are quieter than they have been since unification, and the officer corps has been told in writing that the country does not trust it indoors."
 ITA_r_the_officers_memorial:0 "The Officers' Memorial"
 ITA_r_the_officers_memorial_desc:0 "A grievance signed by more colonels than the ministry cares to count, addressed to the King rather than to the Chamber. Nothing in it is treason and every word of it is remembered in the messes."
 ITA_r_the_militia_establishment:0 "The Militia Establishment"
 ITA_r_the_militia_establishment_desc:0 "Short colours, a real territorial reserve and promotion by examination. It is a defensive army that the Extreme Left will vote money for, which is more than the last three establishments could say."
 ITA_r_the_capital_that_left:0 "The Capital That Left"
 ITA_r_the_capital_that_left_desc:0 "Orders postponed, extensions cancelled, and three boards announcing that conditions in the Kingdom do not presently justify investment. No law has been broken and the furnaces are banked all the same."
 ITA_r_the_terms_with_the_industrialists:0 "The Terms With the Industrialists"
 ITA_r_the_terms_with_the_industrialists_desc:0 "State orders guaranteed for years ahead, against a written undertaking to keep the plant in Italy and honour the trade contracts. Neither side is grateful and both sides keep to it."
 ITA_r_the_school_against_the_parish:0 "The School Against the Parish"
 ITA_r_the_school_against_the_parish_desc:0 "Elementary schooling paid by Rome and taught by a state servant with a pension. The curate is no longer the only man in the commune who can explain a printed document to a labourer."
 ITA_r_the_pensions_act:0 "The Pensions Act"
 ITA_r_the_pensions_act_desc:0 "Old age and invalidity made compulsory and collected through the registered halls, paid as a right and not as relief. The most expensive thing the Chamber has ever voted for men who own nothing."
 ITA_r_the_eight_hours:0 "The Eight Hours"
 ITA_r_the_eight_hours_desc:0 "Eight hours in the arsenals, the state railways and the naval yards. Every private works in the Kingdom is being asked why it cannot manage what the government manages, and the asking does not stop."
 ITA_r_the_kingdom_of_all_italians:0 "The Kingdom of All Italians"
 ITA_r_the_kingdom_of_all_italians_desc:0 "The party that was going to overthrow the Kingdom is inside it arguing about estimates. Harder to govern than the country of ten years ago, and a great deal harder to frighten."
 ITA_r_bonomi_at_the_door:0 "Ivanoe Bonomi"
 ITA_r_bonomi_at_the_door_desc:0 "A reformist who will explain the ministry to the halls and the halls to the ministry, and who is disbelieved by both in roughly equal measure."
 ITA_r_nitti_at_labour:0 "Francesco Saverio Nitti"
 ITA_r_nitti_at_labour_desc:0 "He arrives at the new department with figures nobody asked for and a Southern accent nobody in the cabinet can ignore any longer."
 ITA_r_tb_the_registered_halls:0 "The Registered Halls"
 ITA_r_tb_the_evening_classes:0 "The Evening Classes"
 ITA_r_tb_the_labour_code:0 "The Labour Code"
 ITA_r_tb_the_territorial_militia:0 "The Territorial Militia"
 ITA_r_tb_the_state_orders:0 "The State Orders"
 ITA_r_tb_the_lay_school:0 "The Lay School"
 ITA_r_turati_has_somewhere_to_stand_tt:0 "§GThe halls are already recognised.§! Turati has an organisation behind him when he answers, and the answer is yes."
 ITA_r_the_offer_is_made_to_nobody_tt:0 "§RThe halls have no standing in law.§! The offer is made to a party that cannot deliver what it promises."
 ITA_r_the_dead_of_milan_sit_between_them_tt:0 "§RTroops have been used on the street.§! Every reformist who takes the hand is asked at his next meeting whose hand it is."
 ITA_r_nothing_stands_between_them_tt:0 "§GNo blood has been spilled by this government.§! The understanding costs the reformists nothing at home."
 ITA_r_the_registers_already_exist_tt:0 "§GThe halls have been counted once already.§! The registration is a formality and the votes follow it."
 ITA_r_ninety_halls_must_be_counted_tt:0 "§RNothing has been counted.§! Ninety prefectures must be made to produce a list of societies they have spent ten years closing."
 ITA_r_the_schools_got_there_first_tt:0 "§GThe Kingdom already reads.§! The new voters were taught before they were enfranchised."
 ITA_r_the_ballot_is_read_aloud_tt:0 "§RHalf the register cannot read it.§! The ballot is read aloud by whoever is standing nearest, and that is usually the mayor."
 ITA_r_the_mayor_cannot_deliver_them_tt:0 "§RThe register is too large to buy.§! Provinces instructed: §Y[?ITA_prefects|0]§! of 100."
 ITA_r_the_employers_remember_the_troops_tt:0 "§RThe employers remember the troops.§! They argue that a government which fired on strikers in one year cannot bind them in another."
 ITA_r_nobody_has_been_shot_over_a_wage_tt:0 "§GNo wage in this reign has been settled by rifle fire.§! The employers have no grievance to hide behind."
 ITA_r_the_halls_can_sign_for_a_trade_tt:0 "§GThe chambers of labour can already sign for a whole trade.§! The code has somebody to sign it."
 ITA_r_the_estimates_pass_without_a_division_tt:0 "§GThe majority is solid.§! The new department gets its estimates without a division and its inspectors within the year."
 ITA_r_a_department_without_a_budget_tt:0 "§RThe majority is thin.§! The ministry exists on paper and its inspectors are borrowed from Agriculture."
 ITA_r_the_leagues_come_in_with_a_vote_tt:0 "§GThe ban is lifted.§! The leagues arrive in the Chamber instead of organising against it."
 ITA_r_the_leagues_organise_against_us_tt:0 "§RThe faithful are still forbidden the ballot.§! The leagues organise the countryside and answer to Rome, not to us."
 ITA_r_the_pact_already_covers_the_communes_tt:0 "§GThere is already an understanding with the parishes.§! The leagues arrive inside it rather than against it."
 ITA_r_the_machine_still_holds_the_south_tt:0 "§YThe prefects still hold the South.§! The new voters are delivered in blocks, and the blocks are not free."
 ITA_r_the_south_votes_for_itself_tt:0 "§GThe machine is gone from the South.§! The new voters answer to nobody, which is the point and also the difficulty."
 ITA_r_they_have_something_to_vote_about_tt:0 "§GThe South has had its answer from Rome.§! There is a record to run on."
 ITA_r_a_ballot_and_nothing_else_tt:0 "§RNothing has been done for the South but this.§! The ballot arrives with a list of promises attached."
 ITA_r_the_intransigents_carry_the_hall_tt:0 "§RThe intransigents carry the congress.§! The ministry keeps its deputies and loses the movement."
 ITA_r_the_reformists_carry_the_hall_tt:0 "§GThe reformists carry the congress.§! The men who leave take the newspapers and not the votes."
 ITA_r_they_took_the_party_with_them_tt:0 "§RThey left with the party behind them.§! Every hall that walked out is now organising for the general strike."
 ITA_r_they_took_the_agitators_and_left_the_votes_tt:0 "§GThey left with the agitators and without the electors.§! The halls that matter stayed registered."
 ITA_r_a_signed_contract_is_hard_to_strike_against_tt:0 "§GThe trades are under contract.§! A general strike must first break agreements the workmen signed themselves."
 ITA_r_one_regiment_goes_back_to_barracks_tt:0 "§GOne standing deployment is withdrawn.§! The permanent floor under the street comes down with it."
 ITA_r_the_order_was_never_given_tt:0 "§GNo troops have ever been called out by this government.§! The instruction only confirms what the prefects already do."
 ITA_r_the_guards_take_the_duty_instead_tt:0 "§GThe guards of public safety exist.§! There is a civil force to send where the regiments used to go."
 ITA_r_there_is_nobody_else_to_send_tt:0 "§RThere is no civil force.§! A prefect facing a crowd has the carabinieri and his own nerve."
 ITA_r_they_have_been_paid_this_year_tt:0 "§GThe officers have had their pay voted.§! The memorial is a complaint and not an ultimatum."
 ITA_r_the_grievance_is_older_than_the_ministry_tt:0 "§RThe pay question was never settled.§! The memorial arrives on top of ten years of it."
 ITA_r_the_crown_reads_it_and_says_nothing_tt:0 "§RThe King reads the memorial and returns it without comment.§! That silence is the whole message."
 ITA_r_the_memorial_is_answered_tt:0 "§GThe memorial is answered by an establishment the army can live with.§! The grievance is withdrawn."
 ITA_r_the_establishment_is_already_cut_tt:0 "§GThe establishment has already been reduced.§! The militia law is written on top of a settled peace footing."
 ITA_r_the_classes_are_shortened_by_law_tt:0 "§YThe colours are shortened by statute.§! More men pass through the depots and fewer of them stay."
 ITA_r_the_current_is_not_theirs_to_take_tt:0 "§GThe current belongs to the state.§! The North cannot switch off what it does not own."
 ITA_r_the_north_can_switch_off_the_lights_tt:0 "§RThe power stations are private.§! Three boards can bank the furnaces of the triangle between them."
 ITA_r_turin_keeps_its_workshops_open_tt:0 "§GThe fitters of Turin have their own works.§! One shop stays open whatever the boards decide."
 ITA_r_the_money_comes_back_on_terms_tt:0 "§GThe capital returns.§! The flight is over and the terms are written down."
 ITA_r_the_chamber_sets_the_price_tt:0 "§GThe majority is solid enough to name the terms.§! The state buys plant and does not pay for goodwill."
 ITA_r_they_set_the_price_tt:0 "§RThe majority is too thin to bargain.§! The industrialists write the undertaking and the Chamber votes it."
 ITA_r_the_state_already_pays_the_teacher_tt:0 "§GThe schools are already the state's.§! The answer to the parish is a matter of adding classrooms."
 ITA_r_the_commune_pays_and_the_curate_chooses_tt:0 "§RThe communes still pay the teachers.§! Half the Kingdom's schoolmasters are appointed by men who did not want them appointed."
 ITA_r_two_schools_in_every_village_tt:0 "§YTwo schools in every village.§! The parish and the Kingdom are teaching the same children different things."
 ITA_r_the_remittances_pay_a_part_of_it_tt:0 "§GEmigration is governed and the remittances are recorded.§! The fund starts with something behind it."
 ITA_r_the_fund_is_short_from_the_first_year_tt:0 "§RThe fund is short from the first year.§! The Chamber is asked to make good a promise it has already spent."
 ITA_r_the_halls_collect_the_contributions_tt:0 "§GThe registered halls collect the contributions.§! Nobody has to build a machine to gather the money."
 ITA_r_the_yards_are_building_and_cannot_stop_tt:0 "§RThe naval programme is running.§! The yards are on contract time and the hours are taken out of the estimates."
 ITA_r_the_arsenals_can_afford_the_hours_tt:0 "§GThe yards are not under pressure.§! The hours are conceded where the state is the only employer."
 ITA_r_the_private_trades_ask_for_the_same_tt:0 "§GThe trades are already under contract.§! The private works are asked for the same hours in writing."
 ITA_r_the_private_yards_refuse_it_tt:0 "§RThe private yards refuse the hours.§! The men in them can see what the state grants its own."
 ITA_r_the_street_has_nothing_left_to_ask_tt:0 "§GThe street has run out of demands.§! The settlement holds because there is nothing outstanding worth a barricade."
 ITA_r_the_street_is_still_out_there_tt:0 "§RThe street is still out there.§! The settlement is signed over the top of a grievance that has not been answered."
 ITA_r_a_free_hand_the_left_can_live_with_tt:0 "§GThe alliance has been denounced.§! The Extreme Left can vote for a foreign policy for the first time."
 ITA_r_the_convention_is_kept_from_the_ministry_tt:0 "§RThe alliance is kept.§! The military convention is not shown to a cabinet that contains a socialist, and Vienna is told why."
 ita_dnc.1300.t:0 "The Answer from Milan"
 ita_dnc.1300.d:0 "The reformist leaders meet for eleven hours and come out without a communique. What they have decided is that they will not be the ones to refuse, provided the ministry says out loud, in the Chamber and not in a corridor, what it is offering them and what it wants in return."
 ita_dnc.1300.a:0 "Say it in the Chamber."
 ita_dnc.1300.b:0 "Say it in the corridor and let them explain it."
 ita_dnc.1301.t:0 "Ninety Prefects Are Asked for a List"
 ita_dnc.1301.d:0 "The circular goes out asking each prefecture to return the societies of workmen in its province. Several return nothing, on the grounds that no such societies are lawfully constituted. One returns a list of the halls he has closed, apparently under the impression that this is what was wanted."
 ita_dnc.1301.a:0 "Send the circular again, and name the defaulters."
 ita_dnc.1301.b:0 "Register what has been returned and move on."
 ita_dnc.1302.t:0 "The Symbol Beside the List"
 ita_dnc.1302.d:0 "The commission on the ballot paper cannot agree. A printed emblem beside each list lets a man who cannot read cast his own vote; it also lets a party be recognised at fifty paces by anyone standing outside the polling station, which in some provinces is a great many people."
 ita_dnc.1302.a:0 "Print the emblems. He votes for himself or not at all."
 ita_dnc.1302.b:0 "Names only, and post the carabinieri outside."
 ita_dnc.1303.t:0 "The Award at Monza"
 ita_dnc.1303.d:0 "A magistrate applies the new law for the first time and holds a silk firm to the trade rate it never signed. The award is nine lines long. It is reprinted in every labour paper in the Kingdom within the week, and in every employers' bulletin within two, with different commentary."
 ita_dnc.1303.a:0 "Let the award stand and say nothing."
 ita_dnc.1303.b:0 "Instruct the prefect to explain it to the firm."
 ita_dnc.1304.t:0 "The Inspectors Have No Doors"
 ita_dnc.1304.d:0 "The new ministry sends its first inspectors out and discovers that its power of entry is disputed in eight provinces and simply ignored in four more. The minister asks the cabinet whether he is to litigate the point or to be quietly given the carabinieri when he needs them."
 ita_dnc.1304.a:0 "Litigate it. The power must be settled in law."
 ita_dnc.1304.b:0 "Give him the carabinieri and settle it in practice."
 ita_dnc.1305.t:0 "The Bank at Treviso"
 ita_dnc.1305.d:0 "A rural savings bank founded by a parish priest lends more to the peasants of its district in one year than the state has advanced to the whole province since unification. The prefect reports this with admiration. The Ministry of Labour reads the report with something closer to alarm."
 ita_dnc.1305.a:0 "Deal with them. They are doing our work."
 ita_dnc.1305.b:0 "Match them. The state should be the lender."
 ita_dnc.1306.t:0 "Two Thousand New Electors in One Commune"
 ita_dnc.1306.d:0 "In a Basilicata commune the register goes from ninety-one names to two thousand and four. The sitting deputy, who has held the seat since 1892 and has never addressed a public meeting in it, writes to Rome to ask what he is now expected to do."
 ita_dnc.1306.a:0 "Tell him to go and talk to them."
 ita_dnc.1306.b:0 "Tell the prefect to go and talk to them."
 ita_dnc.1307.t:0 "The Count at Bologna"
 ita_dnc.1307.d:0 "The motion is put at two in the morning after a debate in which both sides accuse the other of having sold the working class. The delegates are counted twice because the first count is disputed. Men who have shared a platform for fifteen years leave the hall by different doors."
 ita_dnc.1307.a:0 "The government says nothing about a party matter."
 ita_dnc.1307.b:0 "The government makes its preference known."
 ita_dnc.1308.t:0 "The Strike That Is Called Against Us"
 ita_dnc.1308.d:0 "The syndicalists call out the Parma agricultural labourers against a contract their own chamber of labour signed. The registered halls refuse to support it and say so publicly. It is the first time in the Kingdom's history that a strike has been broken by other workmen rather than by troops."
 ita_dnc.1308.a:0 "Let the halls settle it. The state stays out."
 ita_dnc.1308.b:0 "Take the credit and put the prefect in the middle."
 ita_dnc.1309.t:0 "The Circular the Prefects Did Not Expect"
 ita_dnc.1309.d:0 "The instruction is one paragraph and it is read out in every prefecture in the Kingdom. Several prefects write back to ask what they are to do instead. The Ministry of the Interior replies, without visible irony, that they are to negotiate."
 ita_dnc.1309.a:0 "Confirm it. They will learn to negotiate."
 ita_dnc.1309.b:0 "Add a clause for cases of insurrection."
 ita_dnc.1310.t:0 "The Memorial"
 ita_dnc.1310.d:0 "It is delivered by hand and it is impeccably respectful. The army, it says, is asked to be ready for a European war by ministers who will not trust it to stand in a piazza, and is voted less money each year for the privilege. The signatures stop at colonel. That is deliberate."
 ita_dnc.1310.a:0 "Receive it properly and answer it in writing."
 ita_dnc.1310.b:0 "Return it unanswered and note the names."
 ita_dnc.1311.t:0 "The Estimates Pass on Socialist Votes"
 ita_dnc.1311.d:0 "For the first time the Extreme Left goes into the lobby for a military budget, having read the establishment and found a territorial reserve, shorter colours and examinations for promotion in it. Two of their own deputies resign the whip over it. The estimates pass by forty-one."
 ita_dnc.1311.a:0 "Take the manpower. That was the bargain."
 ita_dnc.1311.b:0 "Take the quality. Spend it on the schools of the regiment."
 ita_dnc.1312.t:0 "Conditions Do Not Presently Justify Investment"
 ita_dnc.1312.d:0 "Three boards publish near-identical statements within a fortnight. Nobody can prove they were co-ordinated and nobody believes they were not. The Corriere calls it prudence, the Avanti calls it a strike by the rich, and both descriptions fit the facts equally well."
 ita_dnc.1312.a:0 "Call them in. There is a price for staying."
 ita_dnc.1312.b:0 "Say publicly what they are doing and let them answer."
 ita_dnc.1313.t:0 "The Undertaking"
 ita_dnc.1313.d:0 "Four pages, signed in a room at the Treasury with no journalists present. The state guarantees orders; the firms guarantee plant, employment and the trade contracts. Neither party describes the other as a partner and both parties keep every clause of it for the next nine years."
 ita_dnc.1313.a:0 "Publish it. The Chamber voted the money."
 ita_dnc.1313.b:0 "Keep it in the file. It works better unread."
 ita_dnc.1314.t:0 "The Schoolmaster and the Curate"
 ita_dnc.1314.d:0 "In a Veneto village the new state schoolmaster and the parish priest arrive at the same door on the same afternoon, each with a form for the same family to sign. The family, who cannot read either form, ask the two of them to settle it between themselves outside."
 ita_dnc.1314.a:0 "Instruct the schoolmasters to leave the priests alone."
 ita_dnc.1314.b:0 "Instruct them to be there first every time."
 ita_dnc.1315.t:0 "The First Pensions Are Paid"
 ita_dnc.1315.d:0 "An old bricklayer in Sesto San Giovanni draws the first payment out of the fund and is photographed doing it, which he had not been told about. The sum is small enough to be embarrassing and it is his by right, which is the part the reformists intend the country to notice."
 ita_dnc.1315.a:0 "Raise the rate and find the money later."
 ita_dnc.1315.b:0 "Hold the rate and widen the coverage."
 ita_dnc.1316.t:0 "The Hours at the Arsenal"
 ita_dnc.1316.d:0 "The eight hours begin at Spezia on a Monday. Output falls for six weeks and then, to the visible annoyance of the yard's own accountants, returns to what it was. The private yards at Genoa announce that their circumstances are entirely different."
 ita_dnc.1316.a:0 "Publish the figures and let Genoa explain them."
 ita_dnc.1316.b:0 "Say nothing and let the men at Genoa ask."
 ita_dnc.1317.t:0 "The Kingdom of All Italians"
 ita_dnc.1317.d:0 "The King opens the session before a Chamber containing socialist ministers, Catholic deputies and men from villages that had ninety electors a decade ago. He reads a speech about continuity. Half the House was not there when the century began and does not remember what is being continued."
 ita_dnc.1317.a:0 "Let the record speak. It is written down."
 ita_dnc.1317.b:0 "Ask the country to confirm it at a general election."
 ITADNC_z_the_proletarian_nation:0 "The Proletarian Nation"
 ITADNC_z_the_proletarian_nation_desc:0 "Corradini's phrase, and we do not mean it as a metaphor. We sell our men abroad the way a poor country sells anything else, and we are answered at the congresses in the voice kept for debtors. If there are proletarian nations as well as proletarian classes, the quarrel that matters is not among Italians."
 ITADNC_z_the_idea_nazionale:0 "L'Idea Nazionale"
 ITADNC_z_the_idea_nazionale_desc:0 "We make the weekly a daily, with a press of its own and a room in Rome where our editors need ask no party for paper. It prints Adwa on the anniversary, the emigration returns beside the naval estimates, and the name of every deputy who voted against the army."
 ITADNC_z_the_association_of_the_nation:0 "The Association of the Nation"
 ITADNC_z_the_association_of_the_nation_desc:0 "Lawyers, professors, retired colonels and a bishop's nephew, meeting in a hall in Florence and adopting our programme in one afternoon. It is monarchist, it is respectable, it asks nobody to leave his club - and within a year we have a committee in every provincial capital."
 ITADNC_z_the_unredeemed_provinces:0 "The Unredeemed Provinces"
 ITADNC_z_the_unredeemed_provinces_desc:0 "Trento and Trieste have embarrassed the Consulta for a generation, said at banquets and denied in notes. From this session we say them from the government bench. We claim nothing and demand nothing, and every chancellery in Europe understands exactly what has changed."
 ITADNC_z_the_paper_read_aloud:0 "The Paper Read Aloud"
 ITADNC_z_the_paper_read_aloud_desc:0 "Half the kingdom cannot read the leading article we wrote for it. So our sheets go to the barber, the schoolmaster and the sacristan, and are read out on Sunday to men who will never buy a copy. What reaches them is not the argument but the tone, and the tone is the part that lasts."
 ITADNC_z_the_emigrant_is_not_a_loss:0 "The Emigrant Is Not a Loss"
 ITADNC_z_the_emigrant_is_not_a_loss_desc:0 "Our Treasury has always counted the men who leave as remittances arriving. We will count them instead as Italians lost to other flags, and the whole argument turns over: they are not a safety valve for the South, they are the plainest evidence that this kingdom is too small for its own people."
 ITADNC_z_the_nation_before_the_class:0 "The Nation Before the Class"
 ITADNC_z_the_nation_before_the_class_desc:0 "We set the doctrine out at length and defend it in the reviews. There is a struggle and it is real, but it runs between nations and not between Italians; the fitter in Turin and the man who owns his shop stand on our side of it whether either cares for the arrangement. The chambers of labour will answer."
 ITADNC_z_the_schools_beyond_the_frontier:0 "The Schools Beyond the Frontier"
 ITADNC_z_the_schools_beyond_the_frontier_desc:0 "We take the Dante Alighieri Society out of the hands of retired ambassadors and give it a line in the estimates: Italian schools in Trieste, Gorizia and the Dalmatian towns, teachers paid from Rome, and a quiet expectation that the Statthalter will close a certain number of them."
 ITADNC_z_the_alliance_that_must_pay:0 "The Alliance That Must Pay"
 ITADNC_z_the_alliance_that_must_pay_desc:0 "We do not propose to tear up the Triple Alliance. We propose to handle it as a contract is handled: renewed when it pays, priced when it is renewed, and on the day it stops paying, a piece of paper about which we have no sentiment whatever."
 ITADNC_z_the_lecture_and_the_lantern:0 "The Lecture and the Lantern"
 ITADNC_z_the_lecture_and_the_lantern_desc:0 "A speaker, a magic lantern and forty slides of Adwa, Trieste and the Tripolitanian coast, in a hired hall in a market town on a winter evening. It costs us almost nothing, it reaches the people our daily never will, and the men who come back a second time bring their sons and their subscriptions."
 ITADNC_z_the_ships_that_carry_our_own:0 "The Ships That Carry Our Own"
 ITADNC_z_the_ships_that_carry_our_own_desc:0 "Our people leave on German and British bottoms, are landed by foreign agents and counted by foreign consuls. Italian lines, Italian masters, and an inspector at Naples who answers to us: the emigrant becomes a national asset the moment we can see where he has gone and who met him there."
 ITADNC_z_the_syndicalists_who_crossed:0 "The Syndicalists Who Crossed"
 ITADNC_z_the_syndicalists_who_crossed_desc:0 "A handful of men who spent years arguing that the general strike would settle everything, and have concluded that a strike in a poor country only makes it poorer. They come over to us with their organisers and their printing, and our notables are not at all sure they want them at the table."
 ITADNC_z_the_consuls_on_the_adriatic:0 "The Consuls on the Adriatic"
 ITADNC_z_the_consuls_on_the_adriatic_desc:0 "Durazzo, Valona, Scutari, Ragusa: our consulates with a clerk, a cipher and a subsidy for a school, in towns where nothing has happened in living memory. The reports go to the Consulta and the copies to the naval staff, and only one of those departments reads them to the end."
 ITADNC_z_the_price_of_article_seven:0 "The Price of Article Seven"
 ITADNC_z_the_price_of_article_seven_desc:0 "The seventh article says neither party may alter the Balkan settlement without compensating the other. Vienna has always read it as a courtesy. We read it as a bill: we present it in advance for anything that may happen in the Sanjak, and we ask that the figure be agreed before the event and not after."
 ITADNC_z_the_national_subscription:0 "The National Subscription"
 ITADNC_z_the_national_subscription_desc:0 "We open lists in every provincial capital, headed by the prefect where he is willing and by the local marquis where he is not. It raises less than a vote of credit and takes three times as long, and that is the point: the men who wrote their names have bought a share in whatever we do with it."
 ITADNC_z_the_strike_that_is_treason:0 "The Strike That Is Treason"
 ITADNC_z_the_strike_that_is_treason_desc:0 "A stoppage in the yards or on the railways is no longer a quarrel between two private parties. It is interference with the means of national defence and we will answer it as such. The decree is short, the language careful, and every time our troops go out the street settles a little higher than before."
 ITADNC_z_the_fourth_shore_is_a_programme:0 "The Fourth Shore"
 ITADNC_z_the_fourth_shore_is_a_programme_desc:0 "Not a colony with a governor and a garrison, but a province across the water with our ploughs in it: land grants, water surveys, a shipping subsidy, and a promise to the men who would otherwise be in Sao Paulo by spring. We write all of it up before settling how the shore is to be acquired."
 ITADNC_z_the_alliance_is_a_receipt:0 "The Alliance Is a Receipt"
 ITADNC_z_the_alliance_is_a_receipt_desc:0 "We have presented the bill; now we ask for it in writing, initialled and dated. Vienna may pay in a railway concession, in a free hand at Valona, or in nothing whatever - and the third answer is the one for which we have quietly been drafting a reply since our first day."
 ITADNC_z_the_nation_in_arms:0 "The Nation in Arms"
 ITADNC_z_the_nation_in_arms_desc:0 "We call the whole annual class and keep it long enough to teach it something, and we put rifle clubs in the towns for the men the class did not take. The estimates go before the Chamber entire, without the customary arrangement by which part of them reappears later as extraordinary credits."
 ITADNC_z_the_country_that_cannot_climb_down:0 "The Country That Cannot Climb Down"
 ITADNC_z_the_country_that_cannot_climb_down_desc:0 "A decade of teaching a nation what it is owed, and the lesson has been learned rather better than we intended. We may still choose the moment; we can no longer choose to withdraw. The first minister who tries will find the procession going past him without stopping."
 ITADNC_z_the_sea_that_must_be_ours:0 "The Sea That Must Be Ours"
 ITADNC_z_the_sea_that_must_be_ours_desc:0 "A narrow sea, with every good harbour on the wrong side of it. We declare the Adriatic an Italian question, we name the harbours, and we publish it in full. Whether our fleet can support a line of it depends on estimates voted years ago by other men."
 ITADNC_z_the_greater_italy:0 "The Greater Italy"
 ITADNC_z_the_greater_italy_desc:0 "The whole of it said at once and in one place: the provinces, the shore, the sea, and the men who left. It is not a war aim, because we name no enemy, and not a policy, because we have costed nothing. It is a standard, and from the day we raise it this kingdom is measured against it every morning."
 ITA_z_the_proletarian_nation:0 "The Proletarian Nation"
 ITA_z_the_proletarian_nation_desc:0 "The government has adopted a phrase, and phrases adopted by governments do not stay where they are put. The country is louder, prouder and rather harder to govern, and the men who sell it grain and coal have noticed the change of tone."
 ITA_z_the_idea_nazionale:0 "L'Idea Nazionale"
 ITA_z_the_idea_nazionale_desc:0 "A daily paper that is not the organ of any group in the Chamber and cannot be silenced by withholding the government advertisements. It sets the terms of the argument every morning before the ministry has finished its coffee."
 ITA_z_the_associazione_nazionalista:0 "The Nationalist Association"
 ITA_z_the_associazione_nazionalista_desc:0 "Committees in every provincial capital, made up of exactly the men the prefect would have invited anyway. Respectable, monarchist, and useful to a ministry for as long as the ministry says what the committees expect to hear."
 ITA_z_trento_e_trieste:0 "Trento e Trieste"
 ITA_z_trento_e_trieste_desc:0 "The irredenta is government policy and is spoken of as such. It costs nothing to say and a great deal to un-say, and it has made a difficult neighbour into a neighbour who reads our newspapers with a pencil in his hand."
 ITA_z_the_paper_read_aloud:0 "The Paper Read Aloud"
 ITA_z_the_paper_read_aloud_desc:0 "The argument now travels past the last railway station. It arrives simplified, and simplified it is far more useful to a recruiting sergeant than it ever was to an editor."
 ITA_z_the_emigrant_who_is_counted:0 "The Emigrant Who Is Counted"
 ITA_z_the_emigrant_who_is_counted_desc:0 "A register, a consul and a returning address. The kingdom knows where its people went, writes to them, and has begun to suggest that they might have gone somewhere the flag already flies."
 ITA_z_the_nation_before_the_class:0 "The Nation Before the Class"
 ITA_z_the_nation_before_the_class_desc:0 "A doctrine with a bibliography, taught in the reviews and repeated in the halls. It takes the edge off the class quarrel and puts that edge somewhere else, and the somewhere else is across a frontier."
 ITA_z_the_schools_beyond_the_frontier:0 "The Schools Beyond the Frontier"
 ITA_z_the_schools_beyond_the_frontier_desc:0 "Teachers on the Roman payroll in towns that are not Roman. It buys goodwill among Italians we do not govern and a standing grievance with the government that does."
 ITA_z_the_alliance_on_terms:0 "The Alliance on Terms"
 ITA_z_the_alliance_on_terms_desc:0 "The treaty is still signed and the staff talks still happen, but the Consulta now keeps an account of what the alliance has returned this year. Allies who are audited behave differently towards us, and so do their enemies."
 ITA_z_the_lantern_circuit:0 "The Lantern Circuit"
 ITA_z_the_lantern_circuit_desc:0 "Forty slides and a folding screen, in market towns where the last public meeting was about a bridge. Cheap, patient, and remarkably effective on men of nineteen."
 ITA_z_the_italian_bottoms:0 "The Italian Bottoms"
 ITA_z_the_italian_bottoms_desc:0 "The emigrant trade is carried under our own flag and inspected by our own officers. The yards have steady work, the consuls have a passenger list, and the freight no longer leaves the country in a foreign ledger."
 ITA_z_the_syndicalists_of_the_nation:0 "The Syndicalists of the Nation"
 ITA_z_the_syndicalists_of_the_nation_desc:0 "Organisers who know how to call men out, working for a ministry instead of against one. They bring discipline and a following, and they bring quarrels that no cabinet has ever had to arbitrate before."
 ITA_z_the_consular_service:0 "The Consular Service"
 ITA_z_the_consular_service_desc:0 "Small posts in small Adriatic ports, each with a cipher and a school subsidy. What comes back is not diplomacy so much as soundings, and the naval staff has asked to be kept on the distribution."
 ITA_z_the_national_subscription:0 "The National Subscription"
 ITA_z_the_national_subscription_desc:0 "Public lists, public totals and a printed roll of the subscribers. It is slower than a vote of credit and it commits far more people, which is the only reason it was preferred."
 ITA_z_the_strike_is_a_national_question:0 "The Strike Is a National Question"
 ITA_z_the_strike_is_a_national_question_desc:0 "The decree stands over every yard and every main line. The trains run and the ministry is obeyed, and the price is paid in a country that no longer believes the state is a stranger to the quarrel."
 ITA_z_the_fourth_shore_programme:0 "The Fourth Shore"
 ITA_z_the_fourth_shore_programme_desc:0 "Surveys, grants and sailings, all promised in advance. It sends men and money out of the peninsula on the strength of a shore the kingdom may or may not come to hold."
 ITA_z_the_receipt_from_vienna:0 "The Receipt from Vienna"
 ITA_z_the_receipt_from_vienna_desc:0 "An ally who has been asked, in writing, to state what our friendship is worth. Whatever the answer, the question cannot be withdrawn, and Europe has been told that it was asked."
 ITA_z_the_nation_in_arms:0 "The Nation in Arms"
 ITA_z_the_nation_in_arms_desc:0 "The full class trained and the towns full of men who have handled a rifle since. The kingdom can raise more and raise it faster, and pays for it in every other estimate on the table."
 ITA_z_the_country_that_cannot_climb_down:0 "The Country That Cannot Climb Down"
 ITA_z_the_country_that_cannot_climb_down_desc:0 "Every ministry from here is a prisoner of the last ten years of speeches. Retreat is no longer a policy that can be presented to the Chamber, and the country will hold together under a blow far better than it will hold together under an apology."
 ITA_z_mare_nostrum:0 "Mare Nostrum"
 ITA_z_mare_nostrum_desc:0 "The Adriatic is declared an Italian question in a printed programme with the harbours named. The fleet takes it as an order, the Treasury takes it as a bill, and Pola takes it as a notice."
 ITA_z_greater_italy:0 "The Greater Italy"
 ITA_z_greater_italy_desc:0 "A standard the kingdom is now measured against. It makes men, war support and a justification quickly, and it makes every unfinished thing in the country look like a betrayal."
 ITA_national_union:0 "Unione Nazionale"
 ITA_national_union_long:0 "Unione Nazionale Italiana"
 ITA_z_corradini_at_the_paper:0 "Corradini at the Paper"
 ITA_z_corradini_at_the_paper_desc:0 "He invented the argument and he will not let it be softened for the convenience of a majority. Useful in a hall, dangerous in a cabinet, and impossible to dismiss now that the phrase is in the King's speech."
 ITA_z_boselli_at_the_dante:0 "Boselli at the Dante"
 ITA_z_boselli_at_the_dante_desc:0 "Seventy years old, on every committee in Rome, and president of a society with a school in half the towns of the Adriatic. He can raise a subscription in an afternoon and offend nobody doing it."
 ITA_z_tb_the_national_argument:0 "The National Argument"
 ITA_z_tb_the_press_room:0 "The Press Room"
 ITA_z_tb_the_reading_rooms:0 "The Reading Rooms"
 ITA_z_tb_the_dante_lectures:0 "The Dante Lectures"
 ITA_z_tb_the_terms_are_drafted:0 "The Terms Are Drafted"
 ITA_z_tb_the_emigrant_liners:0 "The Emigrant Liners"
 ITA_z_tb_the_cipher_from_durazzo:0 "The Cipher from Durazzo"
 ITA_z_tb_the_subscription_ship:0 "A Ship by Subscription"
 ITA_z_tb_the_subscription_schools:0 "Schools by Subscription"
 ITA_z_tb_the_terms_are_read_twice:0 "The Terms Are Read Twice"
 ITA_z_tb_the_nation_in_arms:0 "The Nation in Arms"
 ITA_z_tb_the_sea_that_must_be_ours:0 "The Adriatic Programme"
 ITA_z_tb_the_greater_italy:0 "The Greater Italy"
 ITA_z_threat_the_state_irredenta:0 "Italy has made the irredenta state policy"
 ITA_z_threat_the_school_question:0 "Italy is quarrelling over schools across the frontier"
 ITA_z_threat_the_adriatic_consulates:0 "Italian consulates are opening along the Adriatic"
 ITA_z_threat_the_compensation_demanded:0 "Italy has demanded compensation in advance"
 ITA_z_threat_the_terms_are_published:0 "Italy has published the terms of the alliance"
 ITA_z_threat_the_receipt_refused:0 "Italy has been refused her compensation"
 ITA_z_threat_the_receipt_torn_up:0 "Italy has torn up her account with Vienna"
 ITA_z_threat_the_fourth_shore:0 "Italy has a settlement programme for a shore she does not hold"
 ITA_z_threat_the_settlement_scheme:0 "Italy is promising land in Tripolitania"
 ITA_z_threat_the_adriatic_programme:0 "Italy has named the harbours she wants"
 ITA_z_threat_the_adriatic_squadron:0 "The Italian squadron has moved north"
 ITA_z_threat_the_country_that_cannot_climb_down:0 "Italy can no longer withdraw from her own programme"
 ITA_z_threat_the_programme_has_a_date:0 "The Italian programme has been given a date"
 ITA_z_threat_the_greater_italy:0 "Italy has declared the whole of her programme"
 ITA_z_tt_the_street_hears_proletarian_and_stops_listening:0 "The street hears the word proletarian and hears nothing after it"
 ITA_z_tt_the_notables_sign_the_appeal:0 "The notables sign the appeal without being asked twice"
 ITA_z_tt_the_paper_prints_the_phrase_back:0 "The paper prints a great power on paper back at the ministry every week"
 ITA_z_tt_a_weekly_with_a_press_of_its_own:0 "A weekly with a press of its own, and no more than that"
 ITA_z_tt_the_paper_turns_on_the_ministry_too:0 "The paper turns on the ministry as readily as on the opposition"
 ITA_z_tt_the_lobby_reads_it_before_breakfast:0 "The lobby reads it before breakfast and votes accordingly"
 ITA_z_tt_the_paper_hands_over_its_subscription_list:0 "The paper hands over its subscription list to the founders"
 ITA_z_tt_a_congress_nobody_reported:0 "A congress that no newspaper thought worth reporting"
 ITA_z_tt_the_ally_reads_the_speech_from_the_throne:0 "The ally reads the speech from the throne, and reads it twice"
 ITA_z_tt_the_claim_is_already_public:0 "The claim was already public and this only dates it"
 ITA_z_tt_the_consulta_has_not_been_told:0 "The Consulta learns of the policy from the newspapers"
 ITA_z_tt_the_readers_do_not_need_a_reader:0 "The kingdom reads it for itself"
 ITA_z_tt_the_schoolmaster_reads_it_out:0 "The state schoolmaster reads it out on Sunday"
 ITA_z_tt_half_the_kingdom_is_told_what_it_says:0 "Half the kingdom is told what it says by whoever is holding it"
 ITA_z_tt_the_commissariat_already_keeps_the_register:0 "The Commissariat of Emigration already keeps the register"
 ITA_z_tt_nobody_knows_how_many_left_last_year:0 "Nobody in Rome can say how many left last year"
 ITA_z_tt_the_argument_is_made_at_home_instead:0 "The argument is made to men who are staying"
 ITA_z_tt_the_chambers_of_labour_answer_it:0 "The chambers of labour answer the doctrine in kind"
 ITA_z_tt_the_argument_lands_on_quiet_ground:0 "The argument lands on quiet ground and takes root"
 ITA_z_tt_the_troops_already_answered_the_argument:0 "The troops answered this argument once already, and are remembered for it"
 ITA_z_tt_vienna_protests_and_is_answered_politely:0 "Vienna protests and is answered with great politeness"
 ITA_z_tt_the_schools_are_closed_by_the_statthalter:0 "The Statthalter closes the schools and makes them famous"
 ITA_z_tt_the_renewal_now_has_a_price_written_on_it:0 "The renewal now has a price written on it"
 ITA_z_tt_there_is_nothing_left_to_price:0 "There is no alliance left to put a price on"
 ITA_z_tt_the_consulta_is_instructed_before_it_signs:0 "The Consulta is instructed before it signs anything"
 ITA_z_tt_the_prefect_lends_the_hall:0 "The prefect lends the hall and sits in the front row"
 ITA_z_tt_the_hall_is_hired_by_subscription:0 "The hall is hired out of the subscribers' pockets"
 ITA_z_tt_the_same_lecturer_goes_to_trieste:0 "The same lecturer takes the lantern across to Trieste"
 ITA_z_tt_the_export_yard_takes_the_order:0 "The export yard takes the order for the liners"
 ITA_z_tt_the_lines_are_chartered_from_abroad:0 "The lines are chartered abroad and the flag is a courtesy"
 ITA_z_tt_the_third_class_deck_is_ours_to_answer_for:0 "The third class deck is now ours to answer for"
 ITA_z_tt_they_bring_a_following_with_them:0 "They bring their organisers and a following with them"
 ITA_z_tt_they_bring_only_themselves:0 "They bring themselves and a printing press"
 ITA_z_tt_the_association_will_not_sit_with_them:0 "The Association will not sit at a table with them"
 ITA_z_tt_valona_is_already_watched:0 "Valona is already watched and the consulate only formalises it"
 ITA_z_tt_the_consulates_are_opened_first:0 "The consulates are opened before anyone has decided why"
 ITA_z_tt_the_naval_staff_asked_for_this_years_ago:0 "The naval staff asked for exactly this years ago"
 ITA_z_tt_the_ballhausplatz_is_handed_the_bill:0 "The Ballhausplatz is handed the bill in advance"
 ITA_z_tt_they_pay_because_they_still_need_us:0 "They pay, because they still need the third signature"
 ITA_z_tt_they_answer_that_the_article_says_consultation:0 "They answer that the article says consultation and nothing else"
 ITA_z_tt_the_lecturers_pass_the_hat:0 "The lecturers pass the hat at the end of every evening"
 ITA_z_tt_the_lists_are_short:0 "The lists are short and headed by the same eleven families"
 ITA_z_tt_the_money_is_asked_for_a_ship:0 "The subscription is asked for a ship"
 ITA_z_tt_the_money_is_asked_for_the_schools:0 "The subscription is asked for the schools"
 ITA_z_tt_the_troops_go_out_and_the_floor_rises:0 "The troops go out, and the street never settles as low again"
 ITA_z_tt_the_decree_is_printed_and_not_yet_used:0 "The decree is printed and left in the prefect's drawer"
 ITA_z_tt_the_squadrons_answer_instead_of_the_line:0 "The mobile squadrons answer instead of the line regiments"
 ITA_z_tt_the_barracks_answer_and_remember_it:0 "The barracks answer, and the barracks remember being asked"
 ITA_z_tt_the_land_is_ours_and_now_must_be_filled:0 "The shore is held, and now it has to be filled"
 ITA_z_tt_the_promise_is_turned_into_a_prospectus:0 "The promise of Tripoli is turned into a prospectus"
 ITA_z_tt_a_programme_for_a_shore_we_do_not_hold:0 "A settlement programme for a shore the kingdom does not hold"
 ITA_z_tt_the_register_is_told_where_to_go:0 "The emigration register is told where the sailings go"
 ITA_z_tt_the_ledger_is_already_closed:0 "The ledger with Vienna is already closed"
 ITA_z_tt_the_ally_pays_in_words_and_a_railway:0 "The ally pays in warm words and a railway concession"
 ITA_z_tt_petersburg_holds_the_other_copy:0 "Petersburg holds the other copy of the understanding"
 ITA_z_tt_the_full_class_is_already_called:0 "The full annual class is already being called"
 ITA_z_tt_the_estimates_are_asked_for_all_at_once:0 "The estimates are asked for entire and all at once"
 ITA_z_tt_the_rifle_clubs_are_full:0 "The rifle clubs fill up from the lecture circuit"
 ITA_z_tt_the_street_is_already_ahead_of_the_ministry:0 "The street is already ahead of the ministry that taught it"
 ITA_z_tt_the_ministry_is_still_a_length_ahead:0 "The ministry is still a length ahead of the procession"
 ITA_z_tt_the_floor_under_the_street_is_now_high:0 "Too many bayonets have been spent for any ministry to look calm"
 ITA_z_tt_no_ministry_may_now_concede:0 "No ministry may now concede anything without being called a traitor"
 ITA_z_tt_the_fleet_was_built_to_go_out:0 "The fleet was built to go out, and the programme suits it"
 ITA_z_tt_the_fleet_was_built_to_stay_in:0 "The fleet was built to stay in, and the programme does not suit it"
 ITA_z_tt_the_programme_arrives_before_the_fleet:0 "The programme arrives several years before the fleet"
 ITA_z_tt_the_consuls_have_already_named_the_harbours:0 "The consuls named the harbours before the programme did"
 ITA_z_tt_the_chamber_votes_the_programme_entire:0 "The Chamber votes the programme entire and without amendment"
 ITA_z_tt_the_programme_is_carried_over_the_chamber:0 "The programme is carried over the Chamber rather than through it"
 ITA_z_tt_the_street_will_be_asked_to_pay_for_it:0 "The street will be asked to pay for it, and knows"
 ITA_z_tt_the_students_are_moved_on_quietly:0 "The students are moved on quietly and nothing is reported"
 ITA_z_tt_the_doctrine_is_left_in_the_reviews:0 "The doctrine is left in the reviews where it started"
 ITA_z_tt_the_notables_keep_the_committee:0 "The notables keep the committee and the newcomers keep the street"
 ITA_z_tt_the_prospectus_is_left_on_the_table:0 "The prospectus is left on the table for a better year"
 ITA_z_tt_the_rifles_stay_in_the_armoury:0 "The rifles stay in the armoury and the clubs drill with sticks"
 ITA_z_tt_the_squadron_stays_at_taranto:0 "The squadron stays at Taranto and the programme stays on paper"
 ITA_z_tt_the_floor_never_comes_down_again:0 "Whatever the street was before this week, it will not be that again"
 ita_dnc.1400.t:0 "The Phrase in the Speech from the Throne"
 ita_dnc.1400.d:0 "The draft has come back from the Quirinal with one sentence marked. The King has no objection to the sentiment and every objection to the word; his private secretary observes that proletarian is a term borrowed from the other side, and that borrowing it once will mean owning it for a generation. The ministry must decide before Thursday whether the phrase is government language or a journalist's."
 ita_dnc.1400.a:0 "Let it stand. The word is the argument."
 ita_dnc.1400.b:0 "Strike it. The argument survives without the word."
 ita_dnc.1401.t:0 "The Editor and the Public Prosecutor"
 ita_dnc.1401.d:0 "The daily has printed the name and constituency of every deputy who voted against the artillery credits, under a heading the prosecutor believes is an incitement. He has the file ready and asks only for the ministry's view. Prosecuting the paper would silence a friend; not prosecuting it tells every editor in Rome what may now be printed about a deputy."
 ita_dnc.1401.a:0 "No prosecution. The paper is doing our work."
 ita_dnc.1401.b:0 "Let the law take its course, quietly."
 ita_dnc.1402.t:0 "Where the Association Sits"
 ita_dnc.1402.d:0 "The Florence congress has to decide whether it is a party or a pressure. Sitting with the constitutional right gives it thirty votes in the Chamber and a leash; standing apart gives it nothing in the division lobby and the right to say anything it likes about the men who are in it. The older members want the seats. The younger ones want the freedom."
 ita_dnc.1402.a:0 "Sit with the right. Votes are worth more than purity."
 ita_dnc.1402.b:0 "Stand apart. We are not here to be counted for somebody else."
 ita_dnc.1403.t:0 "The Students at the Austrian Consulate"
 ita_dnc.1403.d:0 "Four hundred of them from the university, with a wreath for Oberdan and a good deal more than a wreath. The consulate windows are out, the prefect has telegraphed twice, and Vienna will have a note on the Consulta's desk by morning. The ministry can regret the incident or it can decline to regret it, and the students are waiting to hear which."
 ita_dnc.1403.a:0 "We regret nothing that young Italians feel."
 ita_dnc.1403.b:0 "Clear the street and apologise for the glass."
 ita_dnc.1404.t:0 "The Sailing from Naples"
 ita_dnc.1404.d:0 "Two thousand on the quay with tickets for Brazil, and the Commissariat has an officer there for the first time with authority to speak to them. He may tell them what the kingdom is doing for the South and ask them to wait a year, or he may tell them where the flag flies on the other side of the water and offer them a passage there instead."
 ita_dnc.1404.a:0 "Ask them to stay. The kingdom will need them here."
 ita_dnc.1404.b:0 "Offer them a shore of our own to go to."
 ita_dnc.1405.t:0 "The Chamber of Labour Replies"
 ita_dnc.1405.d:0 "Turati has answered the doctrine in the Chamber, and answered it well: he asks how a nation can be proletarian while the men in it are being paid eighty centesimi a day by other men in it. The reply is printed everywhere. The ministry can meet it in the same terms and prolong the argument, or it can let the reviews have it and change the subject."
 ita_dnc.1405.a:0 "Answer him. The country should hear both."
 ita_dnc.1405.b:0 "Leave it to the professors and move to the estimates."
 ita_dnc.1406.t:0 "What the Alliance Returned This Year"
 ita_dnc.1406.d:0 "The Consulta has drawn up an account: what was asked of Vienna and Berlin since the renewal, what was granted, and what was refused. It is a short document and an unflattering one. Circulated in the Chamber it would settle the argument about the alliance for good, in a direction from which no ministry could then retreat."
 ita_dnc.1406.a:0 "Keep it in the department. We are not ready to have that argument."
 ita_dnc.1406.b:0 "Lay it before the Chamber. Let the country see the account."
 ita_dnc.1407.t:0 "The Men Who Crossed"
 ita_dnc.1407.d:0 "They arrive with two newspapers, a following in the Romagna and a manner that empties a drawing room. The Association's committee has met twice about them without reaching a conclusion. They can be given the industrial committee, which is where their organisers are useful, or they can be thanked, photographed and kept at the edge of the platform."
 ita_dnc.1407.a:0 "Give them the industrial committee."
 ita_dnc.1407.b:0 "Keep the committee in the hands of the founders."
 ita_dnc.1408.t:0 "The Bill Presented in Advance"
 ita_dnc.1408.d:0 "Our ambassador has been instructed to state, before anything happens in the Sanjak, what Italy would expect if it did. Vienna's reply may be an agreed figure, which binds them, or a lecture on the meaning of consultation, which binds nobody. The instruction can go as a private conversation or it can go as a note, and notes are read out in parliaments."
 ita_dnc.1408.a:0 "A conversation. We want the answer, not the quarrel."
 ita_dnc.1408.b:0 "A note. Let them refuse it in writing."
 ita_dnc.1409.t:0 "The Railwaymen Stop the Line"
 ita_dnc.1409.d:0 "Every main line north of Bologna, on the second day, and the decree in the prefect's drawer covers it exactly. Troops on the footplate would have the trains running by Thursday and would spend something that is never recovered. The prefects say they can settle it in a fortnight without a soldier, if the ministry can afford a fortnight."
 ita_dnc.1409.a:0 "Troops on the footplate. The lines are national defence."
 ita_dnc.1409.b:0 "Give the prefects their fortnight."
 ita_dnc.1410.t:0 "The Prospectus for the Fourth Shore"
 ita_dnc.1410.d:0 "The Ministry of Agriculture has a printed scheme: hectares, water, a subsidised passage and a first sailing date. Published, it will put ten thousand families on a list and give the programme a constituency that cannot be disbanded. Held back, it stays a plan, and plans can be revised by ministries that have not yet promised anything."
 ita_dnc.1410.a:0 "Publish it. Let the families put their names down."
 ita_dnc.1410.b:0 "Hold it. We will not promise land we have not got."
 ita_dnc.1411.t:0 "The Reply from the Ballhausplatz"
 ita_dnc.1411.d:0 "It has come, and it is a masterpiece of nothing: warm on friendship, precise on procedure, silent on compensation. The Consulta can file it and treat the friendship as banked, or it can reply that an alliance which will not state its terms has already stated them, and let the copy go to the newspapers."
 ita_dnc.1411.a:0 "File it. A vague friend is still a friend."
 ita_dnc.1411.b:0 "Reply, and give the correspondence to the press."
 ita_dnc.1412.t:0 "The Rifle Clubs Ask for Rifles"
 ita_dnc.1412.d:0 "Two hundred societies, forty thousand members, and a request for service rifles and an officer to instruct them. The General Staff sees a trained reserve arriving free. The Ministry of the Interior sees forty thousand armed men organised by nobody in particular, in a country where the street has been high for three years."
 ita_dnc.1412.a:0 "Issue the rifles and send the instructors."
 ita_dnc.1412.b:0 "Drill they may have. Rifles stay in the armoury."
 ita_dnc.1413.t:0 "The Procession Goes Past the Ministry"
 ita_dnc.1413.d:0 "It formed for the anniversary and it has not gone home. Fifty thousand in the Corso, entirely orderly, singing the things we taught them, and asking for a policy the cabinet had intended to announce next year. The President of the Council can go out on the balcony and lead it, or he can decline, and the cabinet will not survive declining."
 ita_dnc.1413.a:0 "Go out to them. Better at the head than in the way."
 ita_dnc.1413.b:0 "Decline. Somebody has to say when."
 ita_dnc.1414.t:0 "Where the Squadron Lies"
 ita_dnc.1414.d:0 "The programme names Adriatic harbours; the fleet is based at Taranto, which is where it belongs if the enemy is French. Moving the squadron to Venice matches the words to the ships and tells Pola precisely what we mean. Leaving it where it is keeps the programme a paper one, which is what several members of the cabinet were hoping for."
 ita_dnc.1414.a:0 "Move the squadron north."
 ita_dnc.1414.b:0 "The squadron stays at Taranto."
 ita_dnc.1415.t:0 "The Standard Is Raised"
 ita_dnc.1415.d:0 "The whole programme has been read to the Chamber: the provinces, the shore, the sea, the men abroad. What remains is whether the government attaches a date to it. A date makes it a plan and every chancellery in Europe will treat it as one. No date leaves it a standard, which is harder to fight and much harder to abandon."
 ita_dnc.1415.a:0 "Give it a date. A programme without one is a speech."
 ita_dnc.1415.b:0 "No date. Let it stand over the country as it is."
 ITADNC_air_the_lesson_of_wilbur_wright:0 "The Lesson of Wilbur Wright"
 ITADNC_air_the_lesson_of_wilbur_wright_desc:0 "The American brings his machine to the field outside Rome and for weeks our engineers stand in the wet grass watching a man decide where he is going. Calderara goes up beside him and comes down a pilot. Everything we know about flying begins in those weeks, and all of it is borrowed."
 ITADNC_air_the_dirigible_lobby:0 "The Dirigible Lobby"
 ITADNC_air_the_dirigible_lobby_desc:0 "Our airship men are engineers, they are decorated, and they have the ear of the ministry. They tell us the aeroplane is a toy that kills its pilot and the dirigible is a ship that carries a crew, a wireless and a camera. They are not wrong yet, and they intend to be listened to for as long as that lasts."
 ITADNC_air_the_shed_at_vizzola:0 "The Shed at Vizzola"
 ITADNC_air_the_shed_at_vizzola_desc:0 "An engineer with a borrowed field on the Ticino and money from his brother builds a machine of his own design, flies it, breaks it and builds another. We buy nothing and send nobody. Caproni keeps going anyway, and his shed becomes the only aeroplane works in the kingdom."
 ITADNC_air_the_airship_of_the_kingdom:0 "The Airship of the Kingdom"
 ITADNC_air_the_airship_of_the_kingdom_desc:0 "We order dirigibles of Italian design, hydrogen plants to fill them and sheds long enough to hold them. They are slow, they can be seen for miles and they will burn. They also stay up for a day and carry a map-maker, a wireless and an officer who writes a legible report."
 ITADNC_air_the_answer_of_the_world:0 "The Answer of the World"
 ITADNC_air_the_answer_of_the_world_desc:0 "Our despatch called it a reconnaissance. The Porte calls it murder, the Hague conventions are read aloud in three parliaments, and every general staff in Europe quietly asks its engineers what such a thing would take. We must decide whether to apologise for it or take the credit."
 ITADNC_air_the_makers_of_the_kingdom:0 "The Makers of the Kingdom"
 ITADNC_air_the_makers_of_the_kingdom_desc:0 "We have no aircraft industry, only men with sheds: Caproni on the Ticino, the motor-car shops that were building chassis last year, a workshop or two in Turin. We can go on buying French machines by the dozen, or decide the kingdom will build its own and pay for the learning."
 ITADNC_air_the_hangars_of_the_north:0 "The Hangars of the North"
 ITADNC_air_the_hangars_of_the_north_desc:0 "Our sheds go up inland, where an airship can be walked out at dawn and be over the frontier passes by noon. What it photographs on the way is our own kingdom: the roads, the quarry towns that struck last spring, and columns of men on them that no prefect of ours has yet counted."
 ITADNC_air_the_airship_goes_to_sea:0 "The Airship Goes to Sea"
 ITADNC_air_the_airship_goes_to_sea_desc:0 "The navy asks for our dirigibles and has the better argument. From a shed on the lagoon an airship can hold the mouth of the Adriatic in sight all day, count what leaves Pola and be home the same night. The army will not forgive the transfer, and will say so every year in the estimates."
 ITADNC_air_the_memoranda_of_douhet:0 "The Memoranda of Douhet"
 ITADNC_air_the_memoranda_of_douhet_desc:0 "A major of the Bersaglieri who has never flown sends us memorandum after memorandum arguing that the air is a theatre of its own and not a pair of eyes for the artillery. Half of it is wrong and all of it is early. The question is not whether he is right but whether any of us reads to the end."
 ITADNC_air_the_engine_that_is_ours:0 "The Engine That Is Ours"
 ITADNC_air_the_engine_that_is_ours_desc:0 "Every aeroplane we own turns a French rotary bought at the price Paris asks in the year it is asked. We tell Fiat, Isotta Fraschini and the fitters of Turin to produce an aero engine of our own that will run for an hour. The first ones will not, and we shall have to sit through that."
 ITADNC_air_the_shop_at_the_ansaldo:0 "The Shop at the Ansaldo"
 ITADNC_air_the_shop_at_the_ansaldo_desc:0 "Genoa builds armour plate, gun mountings and locomotives, and we now tell it to build aeroplanes as well. We lay an aeronautical shop beside the gun shop, reasoning that a firm which can bore a naval gun can be trusted with a wing spar. It is not remotely the same trade."
 ITADNC_air_the_schools_at_the_makers_fields:0 "The Schools at the Makers' Fields"
 ITADNC_air_the_schools_at_the_makers_fields_desc:0 "The makers keep their own fields, and the fields fill with young men paying to learn. Civilian schools issuing civilian brevets, teaching in a fortnight what we teach in a year, and quietly turning out more pilots than our Battaglione Aviatori will ever train itself."
 ITADNC_air_the_lobby_is_answered:0 "The Lobby Is Answered"
 ITADNC_air_the_lobby_is_answered_desc:0 "We finally put the argument before the ministry with both sides in the room. The airship men bring endurance, a wireless and a crew; the aeroplane men bring a machine that costs a tenth as much and needs no shed the length of a street. Somebody has to lose, and the losers keep their pensions."
 ITADNC_air_the_seaplane_station:0 "The Seaplane Station"
 ITADNC_air_the_seaplane_station_desc:0 "A station on the lagoon and another on the Ligurian coast, with slipways, a crane and machines that come down on water because along most of our coast there is nowhere else to come down. Calderara has told us since the day he learned to fly that the sea is the aeroplane's natural country."
 ITADNC_air_the_command_of_the_air:0 "The Command of the Air"
 ITADNC_air_the_command_of_the_air_desc:0 "We write the doctrine before we own the machines: squadrons that scout for nobody, that fly past the army altogether and go for what stands behind it. We cannot do it with the aeroplanes we have. We write the regulations anyway, and then order the aeroplanes they describe."
 ITADNC_air_the_caproni_trimotor:0 "The Caproni Trimotor"
 ITADNC_air_the_caproni_trimotor_desc:0 "Three engines, a crew of four and a load worth carrying: the machine drawn in a shed on the Ticino is now the heaviest aeroplane flying anywhere. We are the only ones ordering such a thing, because we are the only ones with a major in the ministry writing memoranda about what it would be for."
 ITADNC_air_the_orders_of_the_ministry:0 "The Orders of the Ministry"
 ITADNC_air_the_orders_of_the_ministry_desc:0 "We have bought aviation one machine at a time, at the whim of whichever officer happened to be at the table. We write a standing order instead: types fixed, numbers fixed, deliveries fixed years ahead, so a maker can lay out a shop knowing we shall still be buying."
 ITADNC_air_the_reserve_of_pilots:0 "The Reserve of Pilots"
 ITADNC_air_the_reserve_of_pilots_desc:0 "We copy every civilian brevet in the kingdom into a register and ask every holder to sign an undertaking to serve. It costs us a form and a stamp and it doubles the number of men who can fly on the day it matters. Some decline, and we note that too."
 ITADNC_air_the_naval_flying_service:0 "The Naval Flying Service"
 ITADNC_air_the_naval_flying_service_desc:0 "The navy stops borrowing our army pilots and raises its own: its own brevets, its own stations on both coasts, its own officers who will never be posted back to a regiment. Two flying services in one kingdom is one more than our estimates carry gracefully, and both intend to survive."
 ITADNC_air_the_arm_of_its_own:0 "An Arm of Its Own"
 ITADNC_air_the_arm_of_its_own_desc:0 "We take flying out of the engineers, where it has sat since the balloon company, and make it a thing of its own with a director, a line in the estimates and officers who belong to nothing else. It is not an air force yet. It is the office that will have to build one, on paper first."
 ITA_air_the_lesson_of_wilbur_wright:0 "The Lesson of Wilbur Wright"
 ITA_air_the_lesson_of_wilbur_wright_desc:0 "The kingdom has a handful of men who were taught to fly by the man who invented it, and they are teaching the next handful. It is not an air service. It is a small number of people who know something nobody else in Italy knows."
 ITA_air_the_dirigible_lobby:0 "The Dirigible Lobby"
 ITA_air_the_dirigible_lobby_desc:0 "The airship engineers hold the aeronautical estimates, the sheds and the ear of the ministry, and they spend a good part of their energy explaining why the aeroplane is not ready. The kingdom gets endurance and reconnaissance, and pays for it in everything else."
 ITA_air_the_answer_of_the_world:0 "The Answer of the World"
 ITA_air_the_answer_of_the_world_desc:0 "Italy is the country that did it first. Every staff in Europe has a file, every chancellery has a note, and the kingdom is watched now with a particular kind of attention that flatters and does not protect."
 ITA_air_the_makers_of_the_kingdom:0 "The Makers of the Kingdom"
 ITA_air_the_makers_of_the_kingdom_desc:0 "A short list of firms that can build an aeroplane, kept alive by orders the kingdom does not strictly need yet. It is dearer than buying from Paris and it is the only way the kingdom will ever stop buying from Paris."
 ITA_air_the_hangars_of_the_north:0 "The Hangars of the North"
 ITA_air_the_hangars_of_the_north_desc:0 "Airship stations inland, with the frontier passes on one side and the kingdom's own provinces on the other. The photographs go to the staff, and copies go wherever else they are asked for."
 ITA_air_the_airship_goes_to_sea:0 "The Airship Goes to Sea"
 ITA_air_the_airship_goes_to_sea_desc:0 "The dirigibles belong to the admiralty, work over water and report on what leaves the far shore. The army has learned to say the word aviation with a certain coldness."
 ITA_air_the_memoranda_of_douhet:0 "The Memoranda of Douhet"
 ITA_air_the_memoranda_of_douhet_desc:0 "A theory of air war exists in the kingdom before the aeroplanes do, written in full, circulated and argued with. Being years early is worth something, and it costs the patience of every senior officer who has to read it."
 ITA_air_the_schools_at_the_makers_fields:0 "The Schools at the Makers' Fields"
 ITA_air_the_schools_at_the_makers_fields_desc:0 "Flying is taught by the men who build the machines, at their own fields, to anybody who can pay. It is quicker than the army school, cheaper than the army school, and entirely outside the army."
 ITA_air_the_lobby_is_answered:0 "The Lobby Is Answered"
 ITA_air_the_lobby_is_answered_desc:0 "The airship question is settled and the aeronautical estimates stop being an argument between two parties of engineers. Whichever side won, the ministry can now write one programme instead of refereeing two."
 ITA_air_the_command_of_the_air:0 "The Command of the Air"
 ITA_air_the_command_of_the_air_desc:0 "The kingdom has squadrons meant to go past the army and hit what is behind it, and a doctrine that says so in writing. The machines are not equal to the idea, and will be flown as though they were."
 ITA_air_the_orders_of_the_ministry:0 "The Orders of the Ministry"
 ITA_air_the_orders_of_the_ministry_desc:0 "A standing order with fixed types and fixed dates. The makers can hire, lay out a shop and plan a year ahead; the ministry has bound its own hands for three years to obtain that."
 ITA_air_the_reserve_of_pilots:0 "The Reserve of Pilots"
 ITA_air_the_reserve_of_pilots_desc:0 "A register of every man in the kingdom who holds a brevet, with an undertaking against each name. On the day it is wanted the flying service is three times the size of the flying service."
 ITA_air_the_naval_flying_service:0 "The Naval Flying Service"
 ITA_air_the_naval_flying_service_desc:0 "The fleet has its own aviators, its own stations and its own idea of what aeroplanes are for. It also has a second aeronautical establishment competing with the first for every officer and every shed."
 ITA_air_the_arm_of_its_own:0 "An Arm of Its Own"
 ITA_air_the_arm_of_its_own_desc:0 "Aviation is a service with a director, an establishment and a career that ends somewhere other than an infantry regiment. Everything that has been improvised since the balloon company now has an address."
 ITA_air_crocco_at_the_works:0 "Crocco at the Airship Works"
 ITA_air_crocco_at_the_works_desc:0 "Gaetano Crocco designs the kingdom's airships, argues for them in the ministry, and is right about them for about six more years."
 ITA_air_tt_calderara_teaches_what_he_was_taught:0 "Mario Calderara stays on the field and teaches what Wright taught him."
 ITA_air_tt_the_lesson_is_not_written_down:0 "The lesson goes home with the American and nobody writes it down."
 ITA_air_tt_the_crowd_at_centocelle:0 "Half of Rome comes out to the field and goes home certain the century belongs to us."
 ITA_air_tt_the_left_asks_what_it_is_for:0 "The Extreme Left grants that a school is a school, and asks what comes after it."
 ITA_air_tt_the_field_is_closed_to_the_press:0 "The field is closed to the press and the flights are reported by the prefecture."
 ITA_air_tt_the_ministry_takes_the_credit:0 "The ministry takes the credit and the item passes without a division."
 ITA_air_tt_crocco_speaks_for_the_airship:0 "Gaetano Crocco is available as a theorist and will argue for the airship."
 ITA_air_tt_the_lobby_is_a_constituency:0 "The airship men are a constituency like any other and are treated as one."
 ITA_air_tt_the_ministry_does_not_consult:0 "The minister hears the deputation and decides without it."
 ITA_air_tt_the_left_prices_the_shed:0 "The Extreme Left reads out what one shed costs in schoolrooms."
 ITA_air_tt_the_airship_is_a_flag:0 "An airship over a city is worth more than what it can carry."
 ITA_air_tt_the_motor_trade_answers:0 "The Turin motor trade sends fitters, benches and a working drawing office."
 ITA_air_tt_the_shed_stands_alone:0 "There is no trade behind the shed and every part is made twice."
 ITA_air_tt_an_italian_machine_at_last:0 "A machine designed, built and flown in the kingdom, and the papers say so for a week."
 ITA_air_tt_the_ministry_prefers_to_buy_abroad:0 "The ministry would rather buy abroad and is voted down politely."
 ITA_air_tt_the_current_fills_the_envelope:0 "National current runs the electrolysis plants and the gas costs the kingdom nothing abroad."
 ITA_air_tt_the_gas_is_bought_in:0 "The hydrogen is bought in, and the sheds wait on somebody else's delivery."
 ITA_air_tt_the_airship_watches_the_provinces:0 "The dirigibles photograph the provinces as readily as the frontier, and the prefects notice."
 ITA_air_tt_the_estimates_are_read_out_line_by_line:0 "The Extreme Left reads the aeronautical estimate out line by line."
 ITA_air_tt_the_kingdom_signs_nothing:0 "The kingdom declines to sign anything limiting what may be dropped from an aeroplane."
 ITA_air_tt_the_kingdom_sends_a_note:0 "A note is sent explaining that the grenades were aimed at a military camp."
 ITA_air_tt_the_feat_is_taught_in_schools:0 "The flight over the oasis is printed in the school readers within the year."
 ITA_air_tt_the_chamber_hears_the_word_murder:0 "The word murder is used in the Chamber and is not withdrawn."
 ITA_air_tt_the_papers_are_told_what_to_print:0 "The prefects instruct the papers on what the despatch actually said."
 ITA_air_tt_the_ministry_says_as_little_as_possible:0 "The ministry says as little as possible and waits for the next subject."
 ITA_air_tt_turin_takes_the_second_contract:0 "Turin takes the second contract and the industrial triangle has two aeroplane shops."
 ITA_air_tt_one_shop_for_a_kingdom:0 "One shop for a kingdom, and every order queues behind the last."
 ITA_air_tt_the_left_wants_the_works_inspected:0 "The Extreme Left votes the contracts and sends inspectors with them."
 ITA_air_tt_the_nation_makes_its_own_wings:0 "A nation that buys its wings abroad is a nation that flies on sufferance."
 ITA_air_tt_the_passes_are_photographed:0 "The frontier survey is photographed from the air and the maps are corrected."
 ITA_air_tt_there_is_no_map_to_correct:0 "There is no survey to correct and the photographs go into a drawer."
 ITA_air_tt_the_prefects_ask_for_the_photographs:0 "The prefects ask for copies of the photographs and are given them."
 ITA_air_tt_the_photographs_go_to_the_land_registry:0 "The photographs go to the land registry and settle four boundary disputes."
 ITA_air_tt_pola_is_counted_from_the_air:0 "What lies in Pola is counted from the air, in daylight, once a week."
 ITA_air_tt_nobody_asked_the_admirals_what_for:0 "The airships are handed over before anybody asks the admirals what for."
 ITA_air_tt_vienna_is_told_it_is_for_the_customs:0 "Vienna is told the airships are for the customs service and does not believe it."
 ITA_air_tt_the_adriatic_is_watched_openly:0 "The watch on the Adriatic is kept openly and meant to be seen."
 ITA_air_tt_douhet_is_given_a_desk:0 "Giulio Douhet is given a desk, a file and the right to circulate what he writes."
 ITA_air_tt_the_papers_circulate_unsigned:0 "The memoranda circulate unsigned and are attributed to four different officers."
 ITA_air_tt_the_staff_reads_to_the_end:0 "The staff reads to the end, disagrees on paper, and keeps the file open."
 ITA_air_tt_the_memoranda_are_filed:0 "The memoranda are acknowledged, filed, and not circulated further."
 ITA_air_tt_the_reviews_print_him:0 "The nationalist reviews print him in full and treat him as a prophet."
 ITA_air_tt_the_ministry_prefers_him_quiet:0 "The ministry would rather he wrote less and is careful not to say so."
 ITA_air_tt_the_fitters_already_know_the_work:0 "The fitters of Turin have been machining to a thousandth for a decade already."
 ITA_air_tt_the_first_engines_seize:0 "The first engines seize on the bench and the programme starts again."
 ITA_air_tt_the_left_asks_who_owns_the_patent:0 "The Extreme Left asks who will own the patent and is answered in writing."
 ITA_air_tt_no_more_french_rotaries:0 "The kingdom stops buying rotaries from Paris, and Paris is told why."
 ITA_air_tt_the_gunmaker_takes_the_wing_spar:0 "The gun shop has the steel, the jigs and the men, and takes the wing spar."
 ITA_air_tt_a_shop_without_a_trade:0 "A new shop with no trade behind it learns the work the expensive way."
 ITA_air_tt_the_chamber_asks_about_the_contract:0 "The Chamber asks how the Ansaldo contract was awarded and gets no clear answer."
 ITA_air_tt_genoa_votes_the_right_way:0 "Genoa has work, and Genoa votes the way work votes."
 ITA_air_tt_centocelle_sets_the_syllabus:0 "Centocelle sets the syllabus and the private schools teach to it."
 ITA_air_tt_every_school_teaches_its_own_way:0 "Every school teaches its own way and every brevet means something different."
 ITA_air_tt_the_schools_take_men_without_a_name:0 "The schools take any man who can pay, which is not how the army chooses officers."
 ITA_air_tt_the_register_of_the_schools_is_copied:0 "The prefecture takes a copy of every school register as a matter of course."
 ITA_air_tt_the_aeroplane_men_win_on_the_figures:0 "The aeroplane men win on cost, on numbers and on how quickly one can be replaced."
 ITA_air_tt_the_airship_men_keep_the_room:0 "The airship men keep the estimates, the sheds and the argument."
 ITA_air_tt_the_minister_decides_alone:0 "The minister decides between them alone and informs the Chamber afterwards."
 ITA_air_tt_both_sides_keep_something:0 "Both sides keep something, which is how this ministry settles anything."
 ITA_air_tt_calderara_gets_his_water:0 "Mario Calderara gets the water he has been asking for since he learned to fly."
 ITA_air_tt_the_station_waits_for_a_pilot:0 "The slipway is built and the station waits for somebody who can use it."
 ITA_air_tt_a_machine_that_saves_fishermen:0 "The first thing the station does is take three fishermen off a sandbank."
 ITA_air_tt_the_sea_is_ours_to_watch:0 "The sea between the two shores is ours to watch and we mean to watch it."
 ITA_air_tt_libya_is_the_only_evidence_anyone_has:0 "Libya is the only evidence anybody in Europe has, and it is ours."
 ITA_air_tt_a_doctrine_without_a_precedent:0 "A doctrine with no precedent behind it is an opinion with footnotes."
 ITA_air_tt_the_ministry_is_asked_why_bombs_are_an_item:0 "The Chamber asks why bombs are an item in the estimates of a country at peace."
 ITA_air_tt_a_weapon_worthy_of_the_nation:0 "A weapon that does not wait for the army is a weapon worthy of the nation."
 ITA_air_tt_the_estimate_is_taken_by_decree:0 "The bombardment estimate is taken by decree and laid before the Chamber later."
 ITA_air_tt_the_item_is_called_experimental:0 "The item is entered as experimental and passes without discussion."
 ITA_air_tt_the_machine_matches_the_memorandum:0 "For once the machine on the field matches the machine in the memorandum."
 ITA_air_tt_nobody_can_say_what_it_is_for:0 "It is the largest aeroplane in the world and nobody can say what it is for."
 ITA_air_tt_the_largest_aeroplane_in_europe:0 "The largest aeroplane in Europe is Italian, and every attache comes to look."
 ITA_air_tt_the_order_is_placed_quietly:0 "The order is placed quietly and announced after the machines are delivered."
 ITA_air_tt_the_makers_can_lay_out_a_shop:0 "With three years of orders in hand the makers hire, build and plan ahead."
 ITA_air_tt_an_order_with_nobody_to_fill_it:0 "A standing order and nobody in the kingdom able to fill it on time."
 ITA_air_tt_the_order_never_reaches_the_chamber:0 "The order is signed in the ministry and never reaches the Chamber at all."
 ITA_air_tt_the_contract_is_printed_in_full:0 "The contract is printed in full, prices included, and survives the reading."
 ITA_air_tt_the_battalion_gets_a_second_intake:0 "The battalion takes a second intake without waiting for the annual class."
 ITA_air_tt_a_register_and_nowhere_to_send_them:0 "A register of pilots and no establishment to send them to."
 ITA_air_tt_the_undertaking_is_not_optional:0 "The undertaking is presented for signature and is not in practice optional."
 ITA_air_tt_the_undertaking_may_be_declined:0 "The undertaking may be declined, and the register records who declined."
 ITA_air_tt_they_sign_before_they_are_asked:0 "Half of them have signed before the circular reaches their school."
 ITA_air_tt_the_admiralty_pays_for_it_itself:0 "The admiralty pays for its aviators out of the naval vote and owes nobody."
 ITA_air_tt_two_services_one_estimate:0 "Two flying services and one aeronautical estimate between them."
 ITA_air_tt_the_two_services_are_reconciled_on_paper:0 "The two services are reconciled on paper, which is where the quarrel now lives."
 ITA_air_tt_the_crown_settles_it_between_them:0 "The Crown settles the question between them and neither may appeal."
 ITA_air_tt_the_directorate_does_not_get_the_sea:0 "The directorate is given everything that flies except what flies from water."
 ITA_air_tt_one_directorate_for_everything_that_flies:0 "One directorate takes everything that flies, water included."
 ITA_air_tt_the_arm_is_shown_to_the_country:0 "The new arm is paraded, photographed and shown to the country as its own."
 ITA_air_tt_the_arm_answers_to_the_chamber:0 "The new arm reports to a minister who answers questions in the Chamber."
 ITA_air_tt_the_arm_answers_to_the_crown:0 "The new arm answers to the Crown through the ministry and to nobody else."
 ITA_air_tt_the_arm_is_an_office_with_a_budget_line:0 "The new arm is an office, a director and a line in the estimates, and that is enough."
 ITA_air_tb_the_lesson:0 "The Lesson of Wilbur Wright"
