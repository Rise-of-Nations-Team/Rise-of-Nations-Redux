l_english:
 ITADNC_the_kingdom:0 "The Kingdom of Italy"
 ITADNC_the_kingdom_desc:0 "Forty years old, a great power by courtesy, with the industry of a middling one and half its people unable to read. The Chamber is a market of favours, the South is governed the way a colony is governed, and every furnace in the North burns coal that came in by sea. This is the kingdom we have. Now we find out what can be made of it."
 ITADNC_t_monza:0 "Monza"
 ITADNC_t_monza_desc:0 "Three shots into a carriage at the gymnastics prize-giving, and the King is dead before the horses are stopped. Bresci came home from a silk mill in New Jersey with his fare paid by subscription, and says he was answering the guns of Milan. His son is thirty and has an hour to decide what kind of reign this will be."
 ITADNC_t_the_question_of_order:0 "The Question of Order"
 ITADNC_t_the_question_of_order_desc:0 "A prefect has dissolved the chamber of labour in Genoa by decree and the port has stopped. The ministry must say aloud what it has dodged since Bava Beccaris: whether the state takes a side in a strike. If the streets are already up we will be sustaining nobody; if they are quiet the prefect keeps his decree and the Chamber pays for it."
 ITADNC_t_the_coal_that_is_not_ours:0 "The Coal That Is Not Ours"
 ITADNC_t_the_coal_that_is_not_ours_desc:0 "There is no seam worth the digging under any part of the peninsula. Milan and Genoa run on Welsh coal landed from British bottoms, and a strike in Cardiff can bank the furnaces of the industrial triangle inside six weeks. The Alps are full of falling water. It is the only fuel this kingdom will ever own outright."
 ITADNC_t_the_road_from_adwa:0 "The Road from Adwa"
 ITADNC_t_the_road_from_adwa_desc:0 "Six thousand dead in a single morning to an African army, and four years on nobody at the War Ministry will say the name aloud. Three memoranda go to the King: rebuild the army that lost it, buy the cheaper empire at sea, or spend the money at home. The Consulta adds a fourth about the alliance, and the Chamber will want to know who pays."
 ITA_t_a_great_power_on_paper:0 "A Great Power on Paper"
 ITA_t_a_great_power_on_paper_desc:0 "Italy sits at the congresses because Cavour arranged that she should, and is asked for her opinion in the tone reserved for a guest whose bill is being watched. The bureaucracy is real, the railways are real, the seat at the table is real. The steel behind it is not, and every chancellery in Europe already knows the figure."
 ITA_t_the_current_from_the_alps:0 "The Current from the Alps"
 ITA_t_the_current_from_the_alps_desc:0 "Paderno on the Adda, then the Ticino, then every torrent with a fall worth damming. The turbines do not care that there is no coal, and the line to Milan carries what the collier used to. It will never run the yards or the armour plate, but it takes the leash off the light industry of the North for good."
 ITA_t_the_gentiloni_understanding:0 "The Understanding with the Sacristy"
 ITA_t_the_gentiloni_understanding_desc:0 "No concordat, no announcement, no signature: only a list of candidates the parish clergy may recommend, and an assurance about the schools that nobody puts in writing. The Catholic vote comes in for the ministry, and the ministry now owes a debt to a party that does not admit it exists."
 ITA_t_the_black_year:0 "The Black Year"
 ITA_t_the_black_year_desc:0 "The court is in mourning, the Chamber is adjourned, and every prefect in the kingdom is arresting somebody. Business stops out of decency and then out of fear. The country will forgive a new king a great deal in his first twelve months, and will remember exactly what he did with them."
 ITA_t_the_oath_of_the_new_reign:0 "The Oath of the New Reign"
 ITA_t_the_oath_of_the_new_reign_desc:0 "He swore to the Statuto in the words his grandfather used, and then, unlike his father, behaved as though the words bound him. The ministry answers to the Chamber and the King does not send for generals when the Chamber is inconvenient. It is a small thing written down, and it holds the kingdom together for a decade."
 ITA_t_the_state_stands_aside:0 "The State Stands Aside"
 ITA_t_the_state_stands_aside_desc:0 "Giolitti's doctrine in one sentence: a strike is a quarrel between two private parties and the government is not one of them. The troops stay in barracks, wages rise, the unions get respectable, and the men who wanted a revolution find themselves negotiating a contract instead. Every ministry now falls a little faster."
 ITA_t_the_arbitration_boards:0 "The Arbitration Boards"
 ITA_t_the_arbitration_boards_desc:0 "A magistrate, a master and a delegate sit in a room in every industrial province, and the decree stays in the prefect's drawer while they talk. Nobody is satisfied and nothing is settled quickly, but the port keeps working and no one has been shot in the street this year."
 ITA_t_messina_relief:0 "The Straits Are Still Being Dug Out"
 ITA_t_messina_relief_desc:0 "Two cities to clear by hand, ninety thousand people under canvas through two winters, and a relief credit that will be voted again every spring. Every engineer, every sapper and every ton of cement in the kingdom is going south, and everything else that was to be built this year is not being built."
 ITA_t_the_army_rebuilt:0 "The Army That Lost"
 ITA_t_the_army_rebuilt_desc:0 "The classes are called up in full and kept long enough to be taught something, the batteries fire live rounds instead of drawing them, and the staff college stops promoting on seniority alone. It is unglamorous, it is expensive, and it is the only apology the kingdom can make to the men left at Adwa."
 ITA_t_the_cheaper_empire:0 "The Cheaper Empire"
 ITA_t_the_cheaper_empire_desc:0 "A colony inland must be held with divisions; a colony on a coast is held with a squadron and a coaling station. The Ministry of Marine argues that Italy is a pier thrust into the middle sea and should spend accordingly. The Army hears exactly what that means for its own estimates."
 ITA_t_no_more_africa:0 "Africa Was the Wrong Question"
 ITA_t_no_more_africa_desc:0 "The Eritrean garrison is cut to a guard, the concession companies are told to find their own investors, and the money goes to aqueducts, schools and the line over the Apennines. It is the least popular decision a ministry can take in the papers, and the only one the census will thank it for."
 ITA_t_prefects_tt:0 "§YForty of the ninety prefectures§! can be relied on to deliver a government majority."
 ITA_tb_the_kingdom:0 "The Kingdom of Italy"
 ITA_tb_the_alpine_current:0 "The Current from the Alps"
 ITA_tb_the_seismic_code:0 "The Messina Building Code"
 ITA_tb_the_road_from_adwa:0 "The Road from Adwa"
 ita_dnc.1.t:0 "Regicide at Monza"
 ita_dnc.1.d:0 "The King had reviewed the gymnasts, taken his seat in the carriage and raised his hand to the crowd when Bresci fired three times at four paces. He was dead before the horses were pulled up. The assassin makes no attempt to run and tells the carabinieri that he paid his own passage from Paterson, New Jersey, and that he was answering for the dead of Milan two years ago. In Rome the Consulta is telegraphing the royal yacht. The Prince of Naples is thirty years old, has never been trusted with anything, and is King of Italy."
 ita_dnc.1.a:0 "He will be tried under the law as it stands."
 ita_dnc.1.b:0 "Find every man who put a coin in that subscription."
 ita_dnc.2.t:0 "The Chamber of Labour Is Closed"
 ita_dnc.2.d:0 "The prefect of Genoa has dissolved the chamber of labour by decree, on the ground that it took dues from dock workers who were not its members. Within a day the port is shut, the tram men are out, and the Ligurian committee has voted a general strike in a city that handles a third of the kingdom's trade. Saracco's ministry has no answer prepared and the Chamber reconvenes in six weeks. The question will be on the order paper whether we put it there or not."
 ita_dnc.2.a:0 "Then the question is put to us, and we must answer it."
 ita_dnc.3.t:0 "The Prefect Asks for Instructions"
 ita_dnc.3.d:0 "The telegram from Genoa is on the table and it asks something very plain in official language: is the decree to be enforced, or withdrawn? Every man in this room understands that the answer is not about Genoa. It is about whether the Italian state has a side when Italians strike, and it will be read that way in ninety prefectures by Friday."
 ita_dnc.3.a:0 "Enforce it. A prefect who is overruled is not a prefect."
 ita_dnc.3.b:0 "Withdraw it. The state has no side in a strike."
 ita_dnc.3.c:0 "Suspend it, and put arbitration boards in its place."
 ita_dnc.4.t:0 "The First General Strike"
 ita_dnc.4.d:0 "Troops fired on the men at the Buggerru zinc pits in Sardinia and killed three of them. Four days later the chambers of labour of Milan and Genoa call the whole country out, and for four days there are no trains, no trams, no papers and no post. It is the first general strike in the history of the kingdom and neither side knows how such a thing is supposed to end. It ends because the men go back, having proved they can stop Italy whenever they choose to."
 ita_dnc.4.a:0 "Let it exhaust itself, then dissolve the Chamber."
 ita_dnc.4.b:0 "The troops will hold every station on every line."
 ita_dnc.4.c:0 "Concede the eight-hour day in the mines and be done."
 ita_dnc.5.t:0 "The Straits at Twenty Past Five"
 ita_dnc.5.d:0 "Thirty-seven seconds, and then the sea drew back and came in three times over what was left. Messina and Reggio are gone. The first count of the dead is eighty thousand and it will rise. There is no telegraph, no prefect, no garrison and no water; the survivors are being dug out by hand under rain. The first organised parties ashore are Russian sailors from a squadron that happened to be at Augusta, and British boats behind them, and the Regia Marina after that."
 ita_dnc.5.a:0 "The Regia Marina takes charge of the whole relief."
 ita_dnc.5.b:0 "Accept every foreign squadron that offers, and say so."
 ita_dnc.5.c:0 "Rebuild to a seismic code, and prosecute those who ignore it."
 ita_dnc.6.t:0 "Red Week"
 ita_dnc.6.d:0 "Three men are shot at an antimilitarist meeting in Ancona and the Romagna goes up behind them. Republics are proclaimed in a dozen small towns, the tax registers are burned at Fabriano, the railway is torn up, and a bishop is politely locked in his own palace. The reformist unions call the strike off after four days; the syndicalists keep it going. There are a hundred thousand men under arms in Italy against Italians, and it is the last week of June 1914."
 ita_dnc.6.a:0 "A hundred thousand men, and it is finished this week."
 ita_dnc.6.b:0 "Wait. It will burn itself out in a fortnight."
 ita_dnc.6.c:0 "Answer it with the franchise, not with the bayonet."
 ita_dnc.7.t:0 "The Road from Adwa"
 ita_dnc.7.d:0 "The commission's report has sat in a drawer since 1897 because no minister wanted his name on the cover. Baratieri was acquitted and the army was not. Four maps, no water, and brigades that walked into the hills separately to be destroyed separately. There are three roads out of that drawer, and the kingdom can afford to walk properly down only one of them."
 ita_dnc.7.a:0 "Rebuild the army that lost, before anything else."
 ita_dnc.7.b:0 "The cheaper empire is the one held from the sea."
 ita_dnc.7.c:0 "Africa was the wrong question. Spend it at home."
 ITADNC_a_the_chamber_and_the_crown:0 "The Chamber and the Crown"
 ITADNC_a_the_chamber_and_the_crown_desc:0 "Umberto is dead at Monza and his son is thirty. The Chamber that broke Pelloux's decrees by obstruction is still sitting, and it will not be governed the way it was. Vittorio Emanuele must settle what a ministry is: the King's servant, the Chamber's creature, or a bargain struck fresh every session."
 ITADNC_a_the_neutral_state:0 "The Neutral State"
 ITADNC_a_the_neutral_state_desc:0 "Giolitti tells the Chamber that the state has no business breaking a strike it did not call. Wages are not a question of public order, and a ministry that fires on Milan cannot then ask Milan for taxes. The Extreme Left is invited to behave like an opposition rather than an enemy."
 ITADNC_a_return_to_the_statuto:0 "Torniamo allo Statuto"
 ITADNC_a_return_to_the_statuto_desc:0 "Sonnino wrote it three years ago and has not withdrawn a word. The Statuto makes ministers answerable to the King; parliamentary government is a custom that grew over the law and has now outgrown it. A cabinet resting on the Crown need not buy a majority every Thursday afternoon."
 ITADNC_a_the_hand_offered_to_turati:0 "The Hand Offered to Turati"
 ITADNC_a_the_hand_offered_to_turati_desc:0 "The ministry offered Filippo Turati a portfolio and he refused it, saying his party would never forgive him. He is offered it again, and the reformists at Milan are told plainly what refusal costs: another decade of being shot at by prefects while the maximalists collect the dead."
 ITADNC_a_the_prefects_instructed:0 "The Prefects Instructed"
 ITADNC_a_the_prefects_instructed_desc:0 "Ninety provinces, ninety men in a sash, and a book in Rome that records which mayor is to be sustained and which list goes astray in the post. It carries the estimates and it builds the bridges. It is also written down, and one day somebody will read it aloud in the Chamber."
 ITADNC_a_the_state_takes_no_side:0 "The State Takes No Side"
 ITADNC_a_the_state_takes_no_side_desc:0 "Troops are withdrawn from the disputes. Arbitration boards are set up where the parties will sit at them, and the prefect is told that a strike is not a rebellion. The mills lose weeks and gain years, and the men who used to build barricades learn to count votes instead."
 ITADNC_a_the_decrees_revived:0 "The Decrees Revived"
 ITADNC_a_the_decrees_revived_desc:0 "The public safety decrees of 1899 come back: associations dissolved by prefectural order, meetings forbidden, newspapers seized before they are read. The Cassation held them void once. This time they are laid before the Chamber as a bill and carried by a majority the King has arranged."
 ITADNC_a_the_crown_names_the_cabinet:0 "The Crown Names the Cabinet"
 ITADNC_a_the_crown_names_the_cabinet_desc:0 "Article 65 says the King appoints and dismisses ministers, and says nothing whatever about the confidence of the Chamber. The ministry is formed in the antechamber at the Quirinale, the groups are informed afterwards, and the estimates are laid before deputies who were not consulted."
 ITADNC_a_a_vote_for_every_man:0 "A Vote for Every Man"
 ITADNC_a_a_vote_for_every_man_desc:0 "Two million eight hundred thousand may vote out of thirty-two million Italians. Widen the register to every adult male and the prefect's arithmetic collapses overnight, because there are more voters in a village than there are favours to hand out. Nobody knows what the new electorate will do."
 ITADNC_a_the_reformists_at_the_door:0 "The Reformists at the Door"
 ITADNC_a_the_reformists_at_the_door_desc:0 "Turati's men will sustain the ministry without entering it. They take the labour laws, the accident insurance and the Sunday rest, and they leave the portfolios alone. It buys the government its majority and it hands the maximalists an argument they will use at every congress."
 ITADNC_a_the_special_laws_for_the_south:0 "The Special Laws for the South"
 ITADNC_a_the_special_laws_for_the_south_desc:0 "Statutes written for Basilicata and for Naples alone: cheap power, a tariff exemption, aqueducts and roads scheduled by law rather than promised by a minister. It is charged to the Northern estimates. It will be a decade before anyone can point at a road and say what it bought."
 ITADNC_a_the_labour_office:0 "The Labour Office"
 ITADNC_a_the_labour_office_desc:0 "A Superior Council of Labour with employers and unions in the same room, and an office that counts strikes instead of suppressing them. The state stops being a party to every dispute and becomes the clerk who records it, which is cheaper and considerably less likely to end in a volley."
 ITADNC_a_the_chamber_governed_past:0 "The Chamber Governed Past"
 ITADNC_a_the_chamber_governed_past_desc:0 "Obstruction is broken by changing the rules on a show of hands. Sessions are prorogued when the count looks poor and the estimates go by royal decree when they will not pass. The Chamber still meets. It simply no longer decides whether the country is governed."
 ITADNC_a_the_army_at_the_prefects_call:0 "The Army at the Prefect's Call"
 ITADNC_a_the_army_at_the_prefects_call_desc:0 "A prefect may requisition troops without asking Rome, and a state of siege may be declared before the telegram reaches the Consulta. Bava Beccaris cleared Milan this way two years ago and was given the Grand Cross for it. The order stands ready in every prefecture."
 ITADNC_a_the_duty_on_bread:0 "The Duty on Bread"
 ITADNC_a_the_duty_on_bread_desc:0 "The grain tariff and the salt monopoly are what the Southern labourer actually pays the Kingdom, and they are why the bread riots of 1898 began. Lift them and the landowners of the Po valley lose their protection and the Treasury loses a certainty. The country eats."
 ITADNC_a_a_socialist_in_the_ministry:0 "A Socialist in the Ministry"
 ITADNC_a_a_socialist_in_the_ministry_desc:0 "For the first time a party that calls itself revolutionary holds a portfolio in the King's government. Whether that party is still the reformists' when the congress meets depends entirely on how many new voters have come in and how loud the maximalists have been about them."
 ITADNC_a_the_non_expedit_weighed:0 "The Non Expedit"
 ITADNC_a_the_non_expedit_weighed_desc:0 "Since 1874 Rome has held that it is not expedient for a Catholic to vote in the state that took Rome from the Pope, and a third of the country obeys. Pius X was a parish priest where the socialists held the council. The ministry sends no note and asks no question; it simply lets the prefects be told that a Catholic committee is not an unlawful assembly."
 ITADNC_a_the_sacristies_are_opened:0 "The Sacristies Are Opened"
 ITADNC_a_the_sacristies_are_opened_desc:0 "No encyclical, no announcement, no word in writing. Bishops are permitted to judge locally, and locally always means wherever a socialist might otherwise win. Ninety seats change hands without a single voter changing his mind, and both sides deny that any understanding exists."
 ITADNC_a_the_ban_holds:0 "The Ban Holds"
 ITADNC_a_the_ban_holds_desc:0 "Rome refuses. The Catholics keep their rural banks, their mutual societies and their leagues, and they keep them outside the Kingdom entirely. It costs the ministry a reserve of votes it badly wanted, and it leaves the countryside organised by men who owe the state nothing at all."
 ITADNC_a_the_southern_question:0 "The Southern Question"
 ITADNC_a_the_southern_question_desc:0 "Two provinces in three below Naples have no water, no metalled road and no school, and six hundred thousand people a year answer the question by leaving. What is sent after them decides whether the Kingdom keeps its South or merely administers it."
 ITADNC_a_the_majority_that_governs:0 "The Majority That Governs"
 ITADNC_a_the_majority_that_governs_desc:0 "The Chamber elected under the new arrangement takes its seats, and for the first time since Depretis a ministry can count its votes before it asks for them. What was improvised after Monza is now the way Italy is governed, and it will hold as long as it is fed."
 ITA_a_the_kings_first_ministry:0 "The King's First Ministry"
 ITA_a_the_kings_first_ministry_desc:0 "A sovereign of thirty who was raised to distrust his father's advisers, and a cabinet that does not yet know which of them he will keep. Everyone in Rome is polite and nobody commits to anything."
 ITA_a_the_neutral_state:0 "The Neutral State"
 ITA_a_the_neutral_state_desc:0 "The government has taken itself out of the quarrel between the mill and the men. Strikes are counted, not charged, and the loss of a fortnight's production is entered against the gain of a decade without a barricade. The army is not pleased to be told it has no part in it."
 ITA_a_torniamo_allo_statuto:0 "Torniamo allo Statuto"
 ITA_a_torniamo_allo_statuto_desc:0 "The ministry rests on the Crown and admits it. Business moves faster than it has in twenty years because nothing has to be bargained twice, and every faction in the Chamber now understands that the way back to office runs through the antechamber rather than the lobby."
 ITA_a_the_reformist_understanding:0 "The Reformist Understanding"
 ITA_a_the_reformist_understanding_desc:0 "The party of the workers has agreed to keep a liberal ministry alive, and the price is written into every estimate: shorter hours, the Sunday rest, and inspectors who actually enter the sheds. The maximalists call it a betrayal and recruit on the strength of it."
 ITA_a_the_prefects_circular:0 "The Circular to the Prefects"
 ITA_a_the_prefects_circular_desc:0 "Every province has a man who knows what the returns are to say, and Rome has a book that records what he was told. It carries the estimates and it costs the ministry the one thing it cannot buy back.\n\nProvinces instructed: §Y[?ITA_t_prefects|0]§! of 100."
 ITA_a_the_state_takes_no_side:0 "The State Takes No Side"
 ITA_a_the_state_takes_no_side_desc:0 "The arbitration boards sit in Genoa, Turin and Milan, and the prefect attends as a clerk rather than a commander. Disputes end in a signature instead of a funeral, and the industrial triangle discovers that it can plan a year ahead."
 ITA_a_the_decrees_of_public_safety:0 "The Decrees of Public Safety"
 ITA_a_the_decrees_of_public_safety_desc:0 "Associations dissolved by order, meetings forbidden, the presses seized before the ink dries. The ministry has a free hand and the country has learned that a law it never voted can reach it. The men who used to argue in the Chamber now argue somewhere the government cannot hear them."
 ITA_a_the_kings_prerogative:0 "The King's Prerogative"
 ITA_a_the_kings_prerogative_desc:0 "Ministers are made and unmade at the Quirinale and the Chamber is told afterwards. It is exactly what the Statuto says, it works, and every ambition in Rome has quietly redirected itself away from the electorate and toward one staircase."
 ITA_a_the_widened_franchise:0 "The Widened Franchise"
 ITA_a_the_widened_franchise_desc:0 "Eight million names on registers built for two. The village that used to be delivered by its mayor now has to be argued with, the parties have to learn to speak to men who cannot read their programme, and nobody in Rome can predict a constituency any more."
 ITA_a_the_reformists_at_the_door:0 "The Reformists at the Door"
 ITA_a_the_reformists_at_the_door_desc:0 "They vote with the ministry and refuse its portfolios, which lets them claim the labour laws and disown the budget. It is a comfortable arrangement for both parties and it is the reason the intransigents will win the next congress."
 ITA_a_the_special_laws_of_the_south:0 "The Special Laws of the South"
 ITA_a_the_special_laws_of_the_south_desc:0 "For the first time the Kingdom has admitted in statute that the South is a different problem and not merely a poorer version of the North. Aqueducts, roads and cheap power are scheduled by law, charged to the North, and delivered about an eighth of the gap a year."
 ITA_a_the_labour_office:0 "The Labour Office"
 ITA_a_the_labour_office_desc:0 "A room in Rome where the employers' federation and the chambers of labour argue in front of a stenographer. What it produces is not agreement but predictability, which turns out to be the thing the mills were short of."
 ITA_a_government_by_decree:0 "Government by Decree"
 ITA_a_government_by_decree_desc:0 "The estimates pass, the ministry is never defeated, and the Chamber has become a gallery. It works beautifully until the first bad harvest, and everyone in Rome knows exactly which year that will be."
 ITA_a_the_state_of_siege:0 "The State of Siege"
 ITA_a_the_state_of_siege_desc:0 "Troops answer a prefect's telegram without waiting for Rome, and the officers who put down the last rising have been promoted for it. Order is cheap now. What it is being bought with is the belief that a strike and a rebellion are different things."
 ITA_a_the_duty_lifted:0 "The Duty Lifted"
 ITA_a_the_duty_lifted_desc:0 "Bread and salt are cheaper than they have been since unification, and the Southern labourer keeps a fortnight's wages a year that used to go to the Treasury. The landowners of the Po valley have lost their tariff and have not forgiven anybody for it."
 ITA_a_a_socialist_in_the_ministry:0 "A Socialist in the Ministry"
 ITA_a_a_socialist_in_the_ministry_desc:0 "A man who has been arrested by this government sits in its cabinet. The factories are quieter than they have been in ten years, the officer corps considers the arrangement an insult, and the party that sent him is tearing itself apart over whether he should have gone."
 ITA_a_the_catholic_vote:0 "The Catholic Vote"
 ITA_a_the_catholic_vote_desc:0 "A third of the country has been released to vote and has voted for order. No document exists, no bishop will confirm it, and the ministry has acquired a reserve of deputies who answer to a parish priest before they answer to a whip."
 ITA_a_the_ban_holds:0 "The Ban Holds"
 ITA_a_the_ban_holds_desc:0 "Rome keeps its faithful out of the polling booth and keeps them organised in everything else. The rural banks lend where the state does not, the leagues feed where the prefecture cannot, and the countryside has learned to manage without Rome twice over."
 ITA_a_the_south_bought:0 "The South Bought"
 ITA_a_the_south_bought_desc:0 "Roads, aqueducts, a harbour works and a railway that was promised in 1878. It is patronage and it is also the first infrastructure the Mezzogiorno has been given, and the two facts refuse to be separated in any ledger."
 ITA_a_the_south_policed:0 "The South Policed"
 ITA_a_the_south_policed_desc:0 "Carabinieri stations where the schools were to have gone. The countryside is quiet, the estates are worked, and the ships out of Naples are fuller every year because nothing has changed except the number of men in uniform watching it not change."
 ITA_a_the_south_schooled:0 "The South Schooled"
 ITA_a_the_south_schooled_desc:0 "Elementary schools taken out of the hands of communes that could not pay for them and put on the national estimate. It will show in nothing for fifteen years and then it will show in everything, which is why no ministry had ever done it."
 ITA_a_the_majority_that_governs:0 "The Majority That Governs"
 ITA_a_the_majority_that_governs_desc:0 "A Chamber that can be counted before it is asked. Whatever it was built out of, it is now the machine through which Italy is governed, and the men who assembled it have stopped pretending it assembled itself."
 ITA_a_the_giolittian_system:0 "The Giolittian System"
 ITA_a_the_giolittian_system_desc:0 "Transformism perfected: every opposition is bought before it becomes one, the state stands aside from the quarrels it cannot win, and the industrial triangle grows at a rate no one predicted in 1900. The critics call it a dictatorship of the ministry of the interior. They are not entirely wrong."
 ITA_a_the_statuto_restored:0 "The Statuto Restored"
 ITA_a_the_statuto_restored_desc:0 "The Kingdom is governed as its charter says it should be, by a King who chooses and a Chamber that assents. Decisions are quick, the army is content, and the whole apparatus now depends on the judgement of one man who has been on the throne for less than a decade."
 ITA_a_the_popular_bloc:0 "The Popular Bloc"
 ITA_a_the_popular_bloc_desc:0 "Liberals, radicals and reformist socialists in one majority, held together by the franchise and the labour laws. The country is calmer and poorer at the top than it was, the officers write letters to each other about it, and nobody can say what the bloc does in a war."
 ITA_a_tittoni_at_the_interior:0 "Tittoni at the Interior"
 ITA_a_tittoni_at_the_interior_desc:0 "A prefect who became a minister and never stopped thinking like one. He knows every province by the name of the man who delivers it."
 ITA_a_carcano_at_the_treasury:0 "Carcano at the Treasury"
 ITA_a_carcano_at_the_treasury_desc:0 "He balanced Pelloux's books while the Chamber was shouting, and he will balance anyone's. He has never once asked where a majority came from."
 ITA_a_pelloux_at_the_interior:0 "Pelloux at the Interior"
 ITA_a_pelloux_at_the_interior_desc:0 "A general who was given the Interior because the King wanted the decrees signed by a soldier. He signed them, lost the Chamber, and has been waiting ever since to be told he was right."
 ITA_a_bonomi_in_the_ministry:0 "Bonomi in the Ministry"
 ITA_a_bonomi_in_the_ministry_desc:0 "A reformist who argues that a party which never governs never changes anything. His own congress is preparing to expel him for saying so out loud."
 ITA_tb_the_new_reign:0 "The New Reign"
 ITA_tb_the_neutral_state:0 "The Neutral State"
 ITA_tb_the_arbitration_boards:0 "The Arbitration Boards"
 ITA_tb_the_basilicata_law:0 "The Basilicata Law"
 ITA_tb_the_labour_office:0 "The Labour Office"
 ITA_tb_the_grain_duty:0 "The Grain Duty"
 ITA_tb_the_rural_banks:0 "The Rural Banks"
 ITA_a_three_answers_tt:0 "§YThree answers are open to the Chamber:§! the §Gneutral state§! of Giolitti, the §Rreturn to the Statuto§! of Sonnino, or the §Bhand offered to Turati§!. Choosing one closes the other two."
 ITA_a_prefects_counted_tt:0 "Provinces instructed: §Y[?ITA_t_prefects|0]§! of 100."
 ITA_a_the_maximalists_win_tt:0 "§RThe register is full and the intransigents have the congress.§! The party sends its own secretary to the ministry, and it is not a friendly appointment."
 ITA_a_the_reformists_hold_tt:0 "§GThe reformists still hold the party.§! The portfolio is taken by a man who wants the arrangement to last."
 ITA_a_two_answers_from_rome_tt:0 "§YRome will answer in one of two ways:§! the §Gsacristies open§! and the faithful vote, or the §Rban holds§! and they stay outside the Kingdom."
 ITA_a_two_blocs_one_ballot_tt:0 "§RThe Popular Bloc and the parish priest are on the same ballot paper.§! Nobody has explained to either of them how that is to work."
 ITA_a_the_right_finds_a_reserve_tt:0 "§GThe Right acquires a reserve it did not have to pay for.§! The Crown notices."
 ITA_a_the_prefect_finds_a_curate_tt:0 "§GThe prefect now has a curate in every commune he could not otherwise reach.§!"
 ita_dnc.100.t:0 "The Oath at the Quirinale"
 ita_dnc.100.d:0 "The King came up from Naples on a night train and swore before the two Chambers to observe the Statuto loyally. There are two Statutos in the room. There is the text of 1848, in which ministers answer to the Crown and the Chamber is consulted about money. And there is the thing that grew over it in fifty-two years, in which no ministry survives a hostile vote and the King reigns without governing. His father died believing the first. The men in front of him have built their whole careers on the second, and they are watching his face to see which one he has just sworn to."
 ita_dnc.100.a:0 "As it is written."
 ita_dnc.100.b:0 "As it has been practised."
 ita_dnc.101.t:0 "Bresci Is Found Hanged"
 ita_dnc.101.d:0 "Santo Stefano, in the Pontine islands. Gaetano Bresci, who came home from Paterson in New Jersey with a revolver and a fixed idea about the Grand Cross given to the general who shelled Milan, has been found dead in his cell after ten months. The register says suicide. The warders say suicide. The lawyer who was refused access three times does not say suicide, and neither does any anarchist newspaper in Europe. Nothing about an inquiry can bring back the late King, and everything about refusing one will be printed for the next thirty years."
 ita_dnc.101.a:0 "An inquiry, and publish what it finds."
 ita_dnc.101.b:0 "The register says suicide."
 ita_dnc.102.t:0 "The Cassation Reads the Decrees Again"
 ita_dnc.102.d:0 "In February of 1900 the Court of Cassation held that a government may not put a decree into force before the Chamber has voted it, and Pelloux's public safety measures fell in a morning. The Right now proposes to do the same thing again with the King's name on it and the court's opinion unsought. The First President has let it be known, through the usual channels and in the usual words, that his court has not changed its mind and would prefer not to be asked twice."
 ita_dnc.102.a:0 "The decrees will be laid before the Chamber."
 ita_dnc.102.b:0 "A court does not legislate."
 ita_dnc.103.t:0 "Turati Reads the Offer to the Party"
 ita_dnc.103.d:0 "Milan. The offer is a portfolio, and Turati has already refused one on the ground that his party would tear him apart for taking it. The reformists around Critica Sociale think the labour laws are worth the risk. The intransigents think that a socialist in a King's cabinet stops being a socialist on the way up the stairs, and they have the congress and the provincial federations. Anna Kuliscioff, who is the only person in the room everyone listens to, is telling him that support without office is a way of having the argument every single year instead of once."
 ita_dnc.103.a:0 "Support without office, for now."
 ita_dnc.103.b:0 "Sit in the cabinet and be damned for it."
 ita_dnc.104.t:0 "The Circular of the Ninety Prefects"
 ita_dnc.104.d:0 "The Ministry of the Interior sends one letter to every prefecture in the Kingdom, and the letter has two halves. The first says that troops are not to be used against strikers. The second, which is not printed, indicates which mayors are to be sustained, which lists are to be found irregular, and which returns are expected. The prefects of Piedmont and Lombardy will read the first half and file the second. Below Naples the proportions are reversed, and everyone in the ministry knows it."
 ita_dnc.104.a:0 "Every province, without exception."
 ita_dnc.104.b:0 "Only where the seat is in doubt."
 ita_dnc.105.t:0 "Genoa Shuts Its Port"
 ita_dnc.105.d:0 "The prefect has dissolved the Chamber of Labour on the ground that it is a political body, and Genoa has answered by stopping. Not the dockers alone: the tram men, the gasworks, the bakers, the customs porters. Nothing moves through the first port of the Kingdom, and the British colliers are riding at anchor outside the mole with the coal that Milan runs on. The ministry can restore the Chamber of Labour and admit that a prefect exceeded himself, or it can hold the line and find out how long the mills can bank their furnaces."
 ita_dnc.105.a:0 "Reinstate the Chamber of Labour."
 ita_dnc.105.b:0 "The prefect acted within the law."
 ita_dnc.106.t:0 "The Question of the Grand Cross"
 ita_dnc.106.d:0 "General Fiorenzo Bava Beccaris used artillery on a crowd in Milan in May of 1898 and was made a Grand Cross of the Military Order of Savoy for it. That decoration is the reason Bresci gave for the three shots at Monza. Reviving the decrees puts the general back at the centre of the argument, because the Chamber will ask whether the government intends to decorate the next one too, and the officer corps will read the answer very carefully indeed."
 ita_dnc.106.a:0 "The decoration stands."
 ita_dnc.106.b:0 "The general retires quietly."
 ita_dnc.107.t:0 "A Cabinet From the Antechamber"
 ita_dnc.107.d:0 "The list is settled at the Quirinale between the King, his household and two men who hold no parliamentary office at all. The leaders of the groups are informed by letter the following morning. It is entirely legal, it is precisely what Article 65 provides for, and it is the first time since 1861 that a ministry has been assembled without anyone counting the Chamber first. Somebody now has to walk into that Chamber and ask it for money."
 ita_dnc.107.a:0 "Let it vote confidence and be told afterwards."
 ita_dnc.107.b:0 "One portfolio to the Left, for the look of it."
 ita_dnc.108.t:0 "Five Million New Electors"
 ita_dnc.108.d:0 "The registers close and the arithmetic of the Kingdom changes. Constituencies that were delivered by a mayor and a schoolmaster now contain three thousand men who have never voted, most of whom cannot read the ballot they are handed. The prefects report, with unusual candour, that they no longer know what their provinces will do. The Right proposes a reading test at the register, which would remove about two thirds of the new names and would be perfectly constitutional."
 ita_dnc.108.a:0 "Register them all and find out."
 ita_dnc.108.b:0 "A reading test at the register."
 ita_dnc.109.t:0 "The Congress Turns"
 ita_dnc.109.d:0 "Enrico Ferri has the hall. The argument is that the reformists have spent five years propping up a liberal ministry in exchange for factory inspectors, that the ministry has used the interval to perfect the prefects, and that a party which supports a government it will never lead is a wing of that government. The reformist press is well written and poorly funded. The intransigent press is neither, and it reaches every provincial federation in the country a week earlier."
 ita_dnc.109.a:0 "Let the reformists fight for their own party."
 ita_dnc.109.b:0 "Find money for the reformist press."
 ita_dnc.110.t:0 "The Estimates by Decree"
 ita_dnc.110.d:0 "The budget will not pass. The obstruction is orderly, the Extreme Left has learned to read the standing orders better than the President of the Chamber, and the ministry is four days from having no legal authority to pay the army. The Statuto is silent on what happens next. The precedent, if one is made, will be available to every ministry that comes after this one, including the ones that will be formed by the men now shouting."
 ita_dnc.110.a:0 "The estimates by royal decree."
 ita_dnc.110.b:0 "Prorogue, and try again in the autumn."
 ita_dnc.111.t:0 "Milan Remembers"
 ita_dnc.111.d:0 "The prefect of Milan has asked for troops and has the power to take them without asking. The city is out over the price of bread, which is exactly what it was out over in May of 1898, and there are men in the crowd who were in the Via Manzoni when the guns were laid. The garrison commander has the requisition in his hand and has sent a private telegram to Rome asking whether anybody there would like to countermand it before he has to obey it."
 ita_dnc.111.a:0 "The troops stay in barracks."
 ita_dnc.111.b:0 "The requisition is granted."
 ita_dnc.112.t:0 "The Party Congress Answers"
 ita_dnc.112.d:0 "The socialist deputies have a minister among them and the congress has been called to decide whether he is still one of theirs. The reformists point at the eight hour bill, the accident insurance and the inspectors who now actually enter the sheds. The intransigents point at the prefects, who have not gone anywhere, and at the fact that the ministry's majority is now made of men who were elected by promising to fight it."
 ita_dnc.112.a:0 "The portfolio is kept."
 ita_dnc.112.b:0 "The party orders him out of the ministry."
 ita_dnc.113.t:0 "A Pope Who Was a Parish Priest"
 ita_dnc.113.d:0 "Leo XIII is dead and the conclave has been through an Austrian veto to reach Giuseppe Sarto, patriarch of Venice, the son of a village postman. He has spent his life in parishes, and in several of those parishes the socialists took the council while the faithful stayed home under the non expedit as instructed. He has said nothing about the ban and has not repeated it either, which in Rome is a sentence rather than a silence."
 ita_dnc.113.a:0 "Sound the Vatican quietly."
 ita_dnc.113.b:0 "Say nothing and let the bishops move first."
 ita_dnc.114.t:0 "The Deputies Nobody Admits to Sending"
 ita_dnc.114.d:0 "There is no encyclical and there will not be one. There are bishops who have decided that a local case is a local case, and priests who mention from the altar which candidate is acceptable to a Catholic conscience, and a number of liberal deputies who have found themselves returned by majorities they did not build. Everyone denies that an understanding exists. The Chamber can accept the votes and ask nothing, or it can say aloud what has happened and force Rome to disown it."
 ita_dnc.114.a:0 "Accept the votes and ask nothing."
 ita_dnc.114.b:0 "Publish the understanding."
 ita_dnc.115.t:0 "The Opera dei Congressi Keeps Its Own"
 ita_dnc.115.d:0 "Rome declines. The ban stands and the faithful stay away from the polls, but they do not stay away from anything else: three thousand rural savings banks, the mutual aid societies, the peasant leagues, the co-operative dairies of the Veneto and the Po. In half the countryside the only institution that lends money and buries the dead is not the Kingdom. The ministry may leave that alone, or it may bring the rural banks under the Ministry of Agriculture and discover how much it costs to fight a parish."
 ita_dnc.115.a:0 "Leave them alone."
 ita_dnc.115.b:0 "Bring the rural banks under the ministry."
 ita_dnc.116.t:0 "Six Hundred Thousand a Year"
 ita_dnc.116.d:0 "Naples, Palermo, Genoa. The figure for last year was six hundred thousand and the figure for this one will be higher. They are men of military age, they are the ones who could have gone either to America or to a barricade, and the money they post home from Buenos Aires and New York closes the trade deficit of a great power. The Commissariat of Emigration can protect them on the voyage and count them as they go, or the prefects can refuse passports to any man of the conscription class and keep the villages full."
 ita_dnc.116.a:0 "Protect them. We will not stop them."
 ita_dnc.116.b:0 "No passport for a man of the class."
 ita_dnc.117.t:0 "The Chamber That Was Made"
 ita_dnc.117.d:0 "The new Chamber takes its seats and the ministry counts them before it asks them for anything, which is the first time that has been possible since Depretis died. What was improvised in the fortnight after Monza has hardened into the way the Kingdom is governed. It is not the parliament the Risorgimento imagined and nobody in the building is going to say so, because it works, and because the alternative was tried between 1898 and 1900 and ended with a King shot dead at a gymnastics display."
 ita_dnc.117.a:0 "It will hold as long as it is fed."
 ITADNC_e_the_country_beneath_the_state:0 "The Country Beneath the State"
 ITADNC_e_the_country_beneath_the_state_desc:0 "Rome governs a kingdom forty years old and thirty-two million people, and knows almost nothing about them. The prefects send in figures nobody checks and half the South cannot read the form. Before the state can act upon Italy it must first admit what Italy is."
 ITADNC_e_white_coal:0 "White Coal"
 ITADNC_e_white_coal_desc:0 "There is no coal under any Italian mountain, but there is water falling off all of them. Alpine torrents can be made to turn dynamos and the current sold to Milan. The engineers call it white coal, and it is the only fuel this kingdom will ever own."
 ITADNC_e_the_wires_between_three_cities:0 "The Wires Between Three Cities"
 ITADNC_e_the_wires_between_three_cities_desc:0 "Current is worthless where it is made. Turin, Milan and Genoa must be strung together with transmission lines and the valleys behind them opened by road, so a fall of water in the Valtellina can drive a lathe in Piedmont. Every kilometre of it runs north of the Po, and the Southern deputies will read the estimates carefully."
 ITADNC_e_the_state_orders_from_terni:0 "The State Orders From Terni"
 ITADNC_e_the_state_orders_from_terni_desc:0 "The steelworks at Terni exist because the Navy wanted armour plate and the government promised to buy it. The plate is dear and the promise dearer, but a kingdom that buys its armour in Sheffield owns no armour at all. Renew the orders and enlarge the works."
 ITADNC_e_the_workshops_of_turin:0 "The Workshops of Turin"
 ITADNC_e_the_workshops_of_turin_desc:0 "Turin has a motor works four years old, a body trade grown up around it, and more trained fitters than anywhere south of the Alps. Cheap current and standing state orders can turn a city of workshops into a city of factories. It also gathers thirty thousand men into one quarter of one city, where they will learn to strike together."
 ITADNC_e_reservoirs_in_the_alps:0 "Reservoirs in the Alps"
 ITADNC_e_reservoirs_in_the_alps_desc:0 "A plant on a running river gives nothing in a dry August, which is exactly when the mills want it. Dam the high valleys, hold the melt behind concrete, and the current stops arriving by season. It means concessions, surveys, a great deal of blasting, and whole communes told that their pasture is now a lake the state has bought."
 ITADNC_e_a_current_for_every_wheel:0 "A Current for Every Wheel"
 ITADNC_e_a_current_for_every_wheel_desc:0 "Reservoirs above, wires across, orders below. What began as a way around the absence of coal is now the frame Italian industry hangs on, and the leash London holds on the coal quays of Genoa has gone slack. The Kingdom no longer has to ask what a strike in Cardiff will do to it, and can be told so in the Chamber."
 ITADNC_e_special_laws_for_the_south:0 "Special Laws for the South"
 ITADNC_e_special_laws_for_the_south_desc:0 "Basilicata and Calabria are governed under the same code as Lombardy and live in another century. Parliament will vote them laws of their own: roads, aqueducts, forestry and works ordered from Rome. Giolitti's deputies want the credit for them."
 ITADNC_e_quinine_at_the_states_price:0 "Quinine at the State's Price"
 ITADNC_e_quinine_at_the_states_price_desc:0 "Malaria takes two million Italians off their work every year and tens of thousands into the ground. Make quinine a state monopoly, sell it at cost through the tobacco shops, drain the ground where the mosquitoes breed. The cheapest army this kingdom will ever raise."
 ITADNC_e_water_before_anything_else:0 "Water Before Anything Else"
 ITADNC_e_water_before_anything_else_desc:0 "Puglia has no river worth the name and Calabria loses its hillsides every winter. The aqueduct from the Sele, the replanting of the slopes, hard roads to villages that have never seen one. Nothing else in the South works until the water does."
 ITADNC_e_the_land_that_holds_its_people:0 "The Land That Holds Its People"
 ITADNC_e_the_land_that_holds_its_people_desc:0 "The special laws expire; what they built does not. Where there is water, a hard road and no fever, a family has a reason to stay on ground it can work. The South stops being a province the Kingdom administers and becomes one it can count on for grain, for taxes and for recruits. It has taken ten years and it is not finished."
 ITADNC_e_six_hundred_thousand_a_year:0 "Six Hundred Thousand a Year"
 ITADNC_e_six_hundred_thousand_a_year_desc:0 "Every year the population of a great city walks up the gangplanks at Naples and Genoa and does not come back. What they send home keeps whole provinces fed and keeps whole provinces quiet. The Kingdom must decide whether this is a wound to be closed or a policy to be organised, because it cannot be ignored much longer."
 ITADNC_e_the_commissariat_of_emigration:0 "The Commissariat of Emigration"
 ITADNC_e_the_commissariat_of_emigration_desc:0 "If they are going regardless, let them go on inspected ships at fixed fares with a consul waiting at the far end. The state takes the traffic out of the hands of the agents, and what the emigrants send back becomes the steadiest support the country has."
 ITADNC_e_the_land_before_the_ship:0 "The Land Before the Ship"
 ITADNC_e_the_land_before_the_ship_desc:0 "A country that exports its young men is a country conceding defeat. Break up the great estates that lie idle, put uncultivated ground under the plough, make it cheaper to stay than to sail. The landowners of the South will fight every clause."
 ITADNC_e_the_italians_beyond_the_sea:0 "The Italians Beyond the Sea"
 ITADNC_e_the_italians_beyond_the_sea_desc:0 "Four million Italians live in Argentina, Brazil and the United States, and most of them still consider themselves ours. Schools, consulates, chambers of commerce and a line of steamers under our own flag turn a lost population into a standing interest abroad."
 ITADNC_e_the_bread_that_stays:0 "The Bread That Stays"
 ITADNC_e_the_bread_that_stays_desc:0 "The estates are broken up, uncultivated ground is put under the plough, and the men who would have sailed from Naples are working ground they have some claim on. The villages that were emptying stop emptying. Grain, roads and conscripts all rise out of the same soil, and none of it arrives before the ships would have."
 ITADNC_e_the_state_is_neutral_in_the_strike:0 "The State Is Neutral in the Strike"
 ITADNC_e_the_state_is_neutral_in_the_strike_desc:0 "Bava Beccaris turned artillery on Milan two years ago and the country has not forgiven it. Giolitti's answer is that the army is not an instrument of the employers: a strike is a matter between masters and men, and the prefect keeps the peace and nothing more."
 ITADNC_e_the_chambers_of_labour:0 "The Chambers of Labour"
 ITADNC_e_the_chambers_of_labour_desc:0 "Recognise the chambers of labour, let contracts be signed with them, and a strike becomes a negotiation with a counterparty who has a name and an address. The socialists gain a legal home inside the Kingdom, which is the price and also the point."
 ITADNC_e_the_prefect_settles_it:0 "The Prefect Settles It"
 ITADNC_e_the_prefect_settles_it_desc:0 "Neutrality is for speeches. In practice the prefect knows which deputies must be returned and which agitators will find the meeting hall unavailable. It delivers a majority every session and asks nothing of the Treasury. It is paid for elsewhere: in carabinieri standing where a magistrate should be, and in a street that never comes back down."
 ITADNC_e_the_schools_of_the_kingdom:0 "The Schools of the Kingdom"
 ITADNC_e_the_schools_of_the_kingdom_desc:0 "Elementary teaching belongs to communes too poor to pay for it, and half of Italy signs with a cross. Take the schools onto the state's own rolls, appoint the teachers from Rome, and in one generation the recruits will read their own orders."
 ITADNC_e_the_pew_and_the_ballot:0 "The Pew and the Ballot"
 ITADNC_e_the_pew_and_the_ballot_desc:0 "Rome has said nothing and will say nothing. In the provinces the arrangement is made anyway: a parish committee, a list of candidates the priest can read from the altar without naming, and a promise about the school inspectors. The seats are real, the understanding is deniable, and the bishops keep the receipts."
 ITADNC_e_two_italies_one_kingdom:0 "Two Italies, One Kingdom"
 ITADNC_e_two_italies_one_kingdom_desc:0 "Current in the North, water in the South, schools in both, and a labour question argued instead of shot at. The gap has not closed and will not close in this generation. But the census figures are comparable for the first time, the prefects report to one code, and Rome governs one country rather than two administered separately."
 ITA_dnc_the_two_italies:0 "The Two Italies"
 ITA_dnc_the_two_italies_desc:0 "A great power on the map and a poor agricultural country underneath it. The North reads, the South does not; the young leave and the old stay; and the government in Rome is the last to hear about either."
 ITA_dnc_the_kingdom_made_whole:0 "The Kingdom Made Whole"
 ITA_dnc_the_kingdom_made_whole_desc:0 "The distance between the two Italies is still there, but it is being measured, argued over and slowly paid down. A country that can be governed as one is worth more than a country that merely appears on one map."
 ITA_dnc_white_coal:0 "White Coal"
 ITA_dnc_white_coal_desc:0 "The Alpine plants have begun to feed the industrial triangle. Every kilowatt drawn from falling water is a ton of British coal we do not have to land at Genoa."
 ITA_dnc_a_current_for_every_wheel:0 "A Current for Every Wheel"
 ITA_dnc_a_current_for_every_wheel_desc:0 "Reservoirs, transmission lines and public orders have made hydroelectricity the ordinary condition of Italian industry rather than an experiment in a mountain valley."
 ITA_dnc_the_grid_of_the_triangle:0 "The Grid of the Triangle"
 ITA_dnc_the_grid_of_the_triangle_desc:0 "Turin, Milan and Genoa are wired together and the valleys behind them are roaded. Where the current reaches, the ground is worth building on."
 ITA_dnc_the_state_orders_from_terni:0 "The State Orders From Terni"
 ITA_dnc_the_state_orders_from_terni_desc:0 "Armour plate, gun forgings and rails come out of Umbria under a standing government contract. The works are expensive and they are ours."
 ITA_dnc_the_workshops_of_turin:0 "The Workshops of Turin"
 ITA_dnc_the_workshops_of_turin_desc:0 "Motor works, machine tools and a school of fitters in one city. Turin builds prototypes faster than the ministries can decide what to order."
 ITA_dnc_the_alpine_reservoirs:0 "Reservoirs in the Alps"
 ITA_dnc_the_alpine_reservoirs_desc:0 "Dams in the high valleys hold the snowmelt until the mills want it. The current no longer fails in August."
 ITA_dnc_the_special_laws:0 "The Special Laws"
 ITA_dnc_the_special_laws_desc:0 "Basilicata and Calabria are being built by decree: roads, aqueducts, forestry, and a run of public works that the rest of the budget must carry."
 ITA_dnc_the_land_that_holds:0 "The Land That Holds"
 ITA_dnc_the_land_that_holds_desc:0 "Water, roads and quinine have made the southern provinces liveable. People stay, the harvest is larger, and the prefects report a quieter country."
 ITA_dnc_the_quinine_of_the_state:0 "Quinine at the State's Price"
 ITA_dnc_the_quinine_of_the_state_desc:0 "Cheap quinine in every tobacco shop and drained ground where the fever bred. The recruiting sergeants notice it before the statisticians do."
 ITA_dnc_the_water_and_the_land:0 "Water and the Land"
 ITA_dnc_the_water_and_the_land_desc:0 "The Apulian aqueduct, replanted hillsides and hard roads into villages that had none. The South is being made reachable before it is made rich."
 ITA_dnc_six_hundred_thousand_a_year:0 "Six Hundred Thousand a Year"
 ITA_dnc_six_hundred_thousand_a_year_desc:0 "The Kingdom loses the population of a great city every year to the emigrant ships. What they send home feeds the villages they left; what they take with them is the conscript class of 1915."
 ITA_dnc_the_commissariat_of_emigration:0 "The Commissariat of Emigration"
 ITA_dnc_the_commissariat_of_emigration_desc:0 "Inspected ships, fixed fares, consuls at the far end. Departure has become a service the state provides, and the money that comes back is now the most reliable thing arriving in Italy."
 ITA_dnc_the_land_before_the_ship:0 "The Land Before the Ship"
 ITA_dnc_the_land_before_the_ship_desc:0 "Idle estates broken up and uncultivated ground put under the plough. Fewer families reach the quay, and the landowners of the South have not forgiven Rome for it."
 ITA_dnc_the_italians_beyond_the_sea:0 "The Italians Beyond the Sea"
 ITA_dnc_the_italians_beyond_the_sea_desc:0 "Schools, consulates and chambers of commerce from Buenos Aires to New York. Four million Italians abroad are an argument Rome can use in capitals that would otherwise ignore it."
 ITA_dnc_the_bread_that_stays:0 "The Bread That Stays"
 ITA_dnc_the_bread_that_stays_desc:0 "The villages are no longer emptying. Grain, recruits and taxes all come off the same fields, and the ships sail half full."
 ITA_dnc_the_state_is_neutral:0 "The State Is Neutral in the Strike"
 ITA_dnc_the_state_is_neutral_desc:0 "The army will not be sent against strikers again. The country is calmer for it, and the employers have learned that the government is not their private constabulary."
 ITA_dnc_the_chambers_of_labour:0 "The Chambers of Labour"
 ITA_dnc_the_chambers_of_labour_desc:0 "Labour is organised, recognised and negotiated with. Production is steadier, disputes are shorter, and the socialists have a legal address in every industrial city."
 ITA_dnc_the_prefect_settles_it:0 "The Prefect Settles It"
 ITA_dnc_the_prefect_settles_it_desc:0 "Elections are arranged, meetings are discouraged and majorities appear on schedule. The government has never been stronger in the Chamber or weaker in the streets."
 ITA_dnc_the_schools_of_the_kingdom:0 "The Schools of the Kingdom"
 ITA_dnc_the_schools_of_the_kingdom_desc:0 "Elementary schools taken onto the state's rolls and teachers paid from Rome. Literacy is climbing, and with it everything that depends on a man being able to read."
 ITA_dnc_the_pew_and_the_ballot:0 "The Pew and the Ballot"
 ITA_dnc_the_pew_and_the_ballot_desc:0 "Catholic voters are quietly returning to the polls on the government's side. The Kingdom has found an ally it spent thirty years pretending did not exist."
 ITA_dnc_e_the_real_country_tt:0 "The true condition of the Kingdom becomes a matter of public record."
 ITA_dnc_e_white_coal_tt:0 "Italian industry will be built on falling water rather than on coal landed at Genoa."
 ITA_dnc_e_the_ships_tt:0 "The emigration question is opened. The Kingdom must choose how to answer it."
 ita_dnc.200.t:0 "What the Census Found"
 ita_dnc.200.d:0 "The returns are in from every prefecture and the Ministry has stopped pretending to be surprised. Nearly half the Kingdom cannot sign its own name; in Calabria the figure is above four in five. Three provinces have sent counts the statisticians will not stand behind, and one prefect has returned numbers identical to those of ten years ago."
 ita_dnc.200.a:0 "Publish the figures exactly as they are."
 ita_dnc.200.b:0 "Publish only what we can answer for."
 ita_dnc.201.t:0 "A Law Written for Basilicata"
 ita_dnc.201.d:0 "The bill passes with the usual majority and the usual understanding. Rome will pay for roads, an aqueduct and the replanting of the hills, and Rome will decide almost none of it: the prefects and the local deputies will. Nitti, who wrote half the arguments in its favour, says publicly that the works will be built and privately that he would like to know by whom."
 ita_dnc.201.a:0 "Let the deputies place the works where they like."
 ita_dnc.201.b:0 "Send engineers from Rome instead of deputies."
 ita_dnc.202.t:0 "The Ships at Naples"
 ita_dnc.202.d:0 "A steamer clears the mole on Thursday with fourteen hundred aboard, of whom nine hundred are men between eighteen and thirty-five. The port commissioner counts them because somebody must. The War Ministry has begun asking, in writing, whether the conscript classes it expects in ten years will still be in Italy to answer the call."
 ita_dnc.202.a:0 "Register every departure at the quayside."
 ita_dnc.202.b:0 "Let the War Ministry have its list first."
 ita_dnc.203.t:0 "Rome Loosens the Ban"
 ita_dnc.203.d:0 "The non expedit still stands on paper: no Catholic may vote in a national election. In a dozen constituencies where the alternative is a socialist, the parish clergy have discovered that the ban admits of exceptions, and the bishops have not corrected them. Giolitti has noticed. So has every prefect who counts a return."
 ita_dnc.203.a:0 "Take the votes wherever they are offered."
 ita_dnc.203.b:0 "The Kingdom does not bargain with the Vatican."
 ita_dnc.204.t:0 "The Current Reaches the Loom"
 ita_dnc.204.d:0 "The line down from the mountain plants is closed at last, and the cotton mills of the Lombard plain are running on water that fell as snow. The mill owners want every kilowatt on offer. The councils of Milan and Turin want the trams and the street lamps served first, and they have the newspapers on their side."
 ita_dnc.204.a:0 "The mills take the current."
 ita_dnc.204.b:0 "Light the cities first."
 ITA_dnc_e_the_census_bonus:0 "The Census of the Kingdom"
 ITA_dnc_e_white_coal_bonus:0 "White Coal"
 ITA_dnc_e_the_wires_bonus:0 "The Wires Between Three Cities"
 ITA_dnc_e_terni_bonus:0 "The Terni Works"
 ITA_dnc_e_the_workshops_bonus:0 "The Workshops of Turin"
 ITA_dnc_e_the_reservoirs_bonus:0 "Reservoirs in the Alps"
 ITA_dnc_e_the_current_bonus:0 "A Current for Every Wheel"
 ITA_dnc_e_special_laws_bonus:0 "The Special Laws"
 ITA_dnc_e_the_aqueduct_bonus:0 "The Apulian Aqueduct"
 ITA_dnc_e_the_commissariat_bonus:0 "The Commissariat of Emigration"
 ITA_dnc_e_beyond_the_sea_bonus:0 "The Italians Beyond the Sea"
 ITA_dnc_e_one_kingdom_bonus:0 "Two Italies, One Kingdom"
 ITA_dnc_e_the_loom_bonus:0 "The Current Reaches the Loom"
 ITADNC_arm_the_army_after_adwa:0 "The Army After Adwa"
 ITADNC_arm_the_army_after_adwa_desc:0 "Four years on, the report into the disaster is still unpublished and every officer in the Kingdom has read a copy. This is the only European army destroyed by an African one, and the same generals turned field guns on Milan two years later. Rome must decide what the army is for before it decides what it is worth."
 ITADNC_arm_the_promotion_lists:0 "The Promotion Lists"
 ITADNC_arm_the_promotion_lists_desc:0 "Rank comes by seniority and a colonel waits for a funeral. Turin turns out officers who will hold a battalion at fifty and a brigade at sixty-two. Open the list to examination and the men who lost Adwa are told so in writing; leave it closed and the majors who will command the next war spend it standing behind them."
 ITADNC_arm_the_annual_class:0 "The Annual Class"
 ITADNC_arm_the_annual_class_desc:0 "Every year the prefects count the twenty-year-olds and every year half are excused: only sons, the unfit, the ones already at sea for Buenos Aires. The class that reports is smaller than the law promises and the Chamber votes the difference without reading it. Call it properly, and pay the deputies who must explain it at home."
 ITADNC_arm_the_field_gun_question:0 "The Field Gun Question"
 ITADNC_arm_the_field_gun_question_desc:0 "Our batteries fire guns that jump their ground at every round while Paris fields the seventy-five. Recoil is the whole argument. Until the trail stays where it is put, Italian artillery will register slower than anyone it is likely to meet."
 ITADNC_arm_the_alpine_frontier:0 "The Frontier We Do Not Name"
 ITADNC_arm_the_alpine_frontier_desc:0 "The Triple Alliance is signed and the passes above the Cadore are surveyed anyway. Every staff ride goes north-east, every road laid in Veneto is measured for gun traffic, and the survey parties are told to travel in civilian coats. Nobody in the Chamber says aloud which ally the works face, and the attache from Vienna counts the mule tracks himself."
 ITADNC_arm_never_again_milan:0 "Not to Be Used Against the Cities"
 ITADNC_arm_never_again_milan_desc:0 "Bava Beccaris turned field guns on a bread riot in Milan and was decorated for it; two years later the King who pinned the medal was shot dead at Monza. The War Ministry must now write down, in a circular every colonel will read, whether the army is an instrument of order or an army. Sonnino's people want the duty confirmed. Giolitti wants it quietly deleted."
 ITADNC_arm_the_school_of_the_regiment:0 "The School of the Regiment"
 ITADNC_arm_the_school_of_the_regiment_desc:0 "Two conscripts in five arrive unable to read their own service book. The regiment can teach them badly, at the cost of drill hours the inspectors will count against it, or hand the same illiterate back to his village at the end of his time. An army whose orders are written down has an interest in the answer, and so has the Ministry of Instruction."
 ITADNC_arm_the_arsenals:0 "The Arsenals"
 ITADNC_arm_the_arsenals_desc:0 "Terni forges the plate, Turin turns the barrels and Ansaldo would like the whole contract. Buying abroad is faster and teaches the country nothing. The Carcano is ours; the machine tools that make it are not, and that is the part worth putting right."
 ITADNC_arm_the_alpini:0 "The Alpini"
 ITADNC_arm_the_alpini_desc:0 "Battalions raised in the valleys they are meant to hold, by men who already know the ground. Give them their own establishment, their guns on mules and their own school, and the Kingdom has a speciality no other army in Europe has troubled to build."
 ITADNC_arm_the_army_estimates:0 "The Estimates Before the Chamber"
 ITADNC_arm_the_army_estimates_desc:0 "The War Minister lays the figures down and the Chamber discovers three armies inside them and room for one. The Alps, Africa, or a smaller establishment that lets the fleet have the difference. Every deputy already knows which answer his province wants."
 ITADNC_arm_the_army_of_the_alps:0 "An Army for the Alps"
 ITADNC_arm_the_army_of_the_alps_desc:0 "The enemy is the ally. Everything is written for the north-east: mountain divisions, works in the Cadore and above the Isonzo, batteries that go up a mule track, railheads at Belluno and Udine. Vienna will read our estimates line by line and understand them perfectly, and will say nothing at all while the treaty still runs."
 ITADNC_arm_the_works_in_the_cadore:0 "The Works in the Cadore"
 ITADNC_arm_the_works_in_the_cadore_desc:0 "Concrete goes into the passes above Agordo and the ledgers call it road improvement. Forts in the upper valleys, a rail spur to each, garrisons that live in the ground they will have to hold. The works face the ally whose treaty we renew every few years, and the Austrian military attache has already asked to see the Cadore in summer."
 ITADNC_arm_the_mountain_batteries:0 "The Mountain Batteries"
 ITADNC_arm_the_mountain_batteries_desc:0 "A gun that breaks into mule loads and comes together again above the treeline is worth two that cannot leave the valley road. The short sixty-five goes to the Alpini and the gunners learn angles the manuals do not cover. Whether the barrels are forged at Turin or bought from Essen is settled in the same vote, by men who have never seen a mule track."
 ITADNC_arm_the_plan_against_the_ally:0 "The Plan Against the Ally"
 ITADNC_arm_the_plan_against_the_ally_desc:0 "The staff completes a deployment against Austria-Hungary and files it where the Consulta will not find it. Rome renews the Triple Alliance with one hand and rehearses the Isonzo with the other. Irredentism has stopped being a street slogan and become a map with dates on it."
 ITADNC_arm_the_army_of_africa:0 "An Army for Africa"
 ITADNC_arm_the_army_of_africa_desc:0 "Adwa is a debt and the officer corps intends to collect it. Colonial establishments, a supply train that works past the last well, ascari battalions carried on the strength, and men who volunteer for the climate because promotion is faster there. The Chamber will be told the question is prestige, because it is, and will vote it anyway."
 ITADNC_arm_the_ascari_regiments:0 "The Ascari Regiments"
 ITADNC_arm_the_ascari_regiments_desc:0 "The Eritrean battalions fought better at Adwa than the metropolitan brigades and were spent covering their retreat. Raise them properly, pay them properly, give them a depot at Massawa and Italian officers who intend to stay past one tour. Every battalion raised in the highlands is one that need not be shipped out of Naples with a band playing."
 ITADNC_arm_the_expedition_to_tripoli:0 "The Expedition to Tripoli"
 ITADNC_arm_the_expedition_to_tripoli_desc:0 "The Banco di Roma has been buying land in Tripolitania for years and the nationalist press has been buying the argument. The Ottoman garrison is thin and the fleet can be off Tobruk within the week. What happens after the landing is the part nobody has written down."
 ITADNC_arm_a_smaller_army:0 "A Smaller Army"
 ITADNC_arm_a_smaller_army_desc:0 "Sixteen corps that cannot be equipped are worse than twelve that can. Cut the establishment, keep the cadres, and let the difference go down the slipways at Castellammare. The generals will call it disarmament and the admirals will call it sense."
 ITADNC_arm_the_cadre_establishment:0 "The Cadre Establishment"
 ITADNC_arm_the_cadre_establishment_desc:0 "Fewer men under arms, longer in the hands of better officers, and a reserve index that is actually kept, province by province, so a callable man can be found in a morning. The peacetime establishment shrinks and every deputy who wanted a barracks in his town says so out loud. What could be raised in a fortnight does not shrink at all."
 ITADNC_arm_the_army_gives_way:0 "The Army Gives Way"
 ITADNC_arm_the_army_gives_way_desc:0 "The War Minister loses the argument in cabinet and the estimates cross the corridor to the Marine. Slipways at Castellammare, not barracks at Verona; a year of intake deferred and two brigades left at cadre strength. The officer corps remembers which minister signed it and which admirals dined out on it, and remembers both for twenty years."
 ITADNC_arm_the_army_of_the_new_century:0 "The Army of the New Century"
 ITADNC_arm_the_army_of_the_new_century_desc:0 "Whatever was chosen, the choosing is finished and the regulations are rewritten around it. The men who lost Adwa are retiring. The men who will command in the next war are majors now, and for the first time they were trained for something in particular."
 ITA_arm_the_verdict_of_adwa:0 "The Verdict of Adwa"
 ITA_arm_the_verdict_of_adwa_desc:0 "An army that lost to Menelik and won at Milan, and is not sure which of the two it is supposed to be proud of. Recruits arrive expecting to be despised and the officers do not disappoint them."
 ITA_arm_the_seniority_list:0 "The Seniority List"
 ITA_arm_the_seniority_list_desc:0 "Nobody is passed over and nobody is offended. The generals are content, the Chamber is untroubled, and the man who will command the army in the next war is already sixty."
 ITA_arm_promotion_by_examination:0 "Promotion by Examination"
 ITA_arm_promotion_by_examination_desc:0 "Boards, papers and a mark against a name. Ability rises faster than it used to and a great many colonels have written to their deputies about it."
 ITA_arm_the_class_of_the_year:0 "The Class of the Year"
 ITA_arm_the_class_of_the_year_desc:0 "The levy is called as the law says it should be, exemptions are audited, and the register at last resembles the country. The depots are fuller and the families are angrier."
 ITA_arm_three_years_with_the_colours:0 "Three Years with the Colours"
 ITA_arm_three_years_with_the_colours_desc:0 "A long service that turns a peasant into a soldier and keeps him out of the fields for two harvests. The battalions are steady and there are fewer of them."
 ITA_arm_two_years_with_the_colours:0 "Two Years with the Colours"
 ITA_arm_two_years_with_the_colours_desc:0 "More men pass through the depots and fewer of them remember what they learned. On paper the Kingdom can put a great army in the field, and on paper it has trained it."
 ITA_arm_the_school_of_the_regiment:0 "The School of the Regiment"
 ITA_arm_the_school_of_the_regiment_desc:0 "The barracks teaches letters because nobody else has. A conscript goes home able to read the newspaper that will one day tell him what his officers have done."
 ITA_arm_the_quick_firing_batteries:0 "The Quick-Firing Batteries"
 ITA_arm_the_quick_firing_batteries_desc:0 "A carriage that absorbs its own recoil, a layer who does not relay after every round, and a battery that can be registered before the enemy has finished deploying."
 ITA_arm_the_deport_licence:0 "The Deport Licence"
 ITA_arm_the_deport_licence_desc:0 "The hydro-pneumatic carriage is licensed and built at Turin. The first batteries are late and the fifth is on time, and the trade has stayed inside the country."
 ITA_arm_the_krupp_contract:0 "The Krupp Contract"
 ITA_arm_the_krupp_contract_desc:0 "Finished guns off the quay at Genoa, excellent and foreign. The batteries are re-equipped in a year and the arsenals have learned nothing they did not already know."
 ITA_arm_the_army_is_not_a_police:0 "The Army Is Not a Police Force"
 ITA_arm_the_army_is_not_a_police_desc:0 "Standing orders forbid the use of field artillery in a labour dispute. The prefects are told to manage with the carabinieri, and the working quarters have stopped counting the army among their enemies."
 ITA_arm_the_cannon_of_milan:0 "The Cannon of Milan"
 ITA_arm_the_cannon_of_milan_desc:0 "The battalions still go where the prefect sends them, and the ministry can rely on it. So can the Socialist press, which reprints the casualty list of ninety-eight every May."
 ITA_arm_the_alpine_frontier:0 "The Alpine Frontier"
 ITA_arm_the_alpine_frontier_desc:0 "Surveys, mule tracks and quarry sidings in the north-east, entered in the estimates as roads. The engineers know exactly which contour line the guns are meant to sit on."
 ITA_arm_the_alpini_corps:0 "The Alpini"
 ITA_arm_the_alpini_corps_desc:0 "Recruited in the valleys, officered by men from the same valleys, and the only corps in the Kingdom that fills its ranks with volunteers. They keep the feather and they keep the ground."
 ITA_arm_the_army_of_the_alps:0 "An Army for the Alps"
 ITA_arm_the_army_of_the_alps_desc:0 "Everything is sized for a war of ridgelines: short marches, heavy positions, guns that go where wheels cannot. It is a superb instrument in one place and an awkward one anywhere else."
 ITA_arm_the_frontier_works:0 "The Frontier Works"
 ITA_arm_the_frontier_works_desc:0 "Concrete in the passes, batteries cut into the rock and a garrison that has lived on the position long enough to know where the fog sits in October."
 ITA_arm_the_mountain_batteries:0 "The Mountain Batteries"
 ITA_arm_the_mountain_batteries_desc:0 "Guns broken into mule loads, gunners who can climb, and fire support above the treeline where an enemy has learned not to expect it."
 ITA_arm_the_plan_against_the_ally:0 "The Plan Against the Ally"
 ITA_arm_the_plan_against_the_ally_desc:0 "A finished deployment against the power we are allied to, rehearsed every summer and never mentioned at the renewal talks. The staff has stopped improvising."
 ITA_arm_the_army_of_africa:0 "An Army for Africa"
 ITA_arm_the_army_of_africa_desc:0 "Columns that carry their own water, officers who volunteer for the climate, and an establishment that assumes the enemy will be met a fortnight beyond the railhead."
 ITA_arm_the_ascari_regiments:0 "The Ascari Regiments"
 ITA_arm_the_ascari_regiments_desc:0 "Eritrean battalions on a proper establishment with proper pay. They march further on less than any regiment raised in Lombardy, and Rome has begun to depend on it."
 ITA_arm_a_smaller_army:0 "A Smaller Army"
 ITA_arm_a_smaller_army_desc:0 "Twelve corps that are equipped instead of sixteen that are not. The saving goes to the slipways, and the officer corps has been told to call it prudence."
 ITA_arm_the_cadre_establishment:0 "The Cadre Establishment"
 ITA_arm_the_cadre_establishment_desc:0 "Small units of long-service men who can be filled out from an indexed reserve. Cheap in peace, and it works only if the index is kept honest."
 ITA_arm_the_army_of_the_new_century:0 "The Army of the New Century"
 ITA_arm_the_army_of_the_new_century_desc:0 "Regulations written for a war the Kingdom has actually chosen to fight, and officers who were examined for the rank they hold. Adwa is a page in the staff course now, not an open wound."
 ITA_arm_robilant_at_the_staff:0 "Mario di Robilant"
 ITA_arm_robilant_at_the_staff_desc:0 "He commanded in the mountains before it was fashionable and has written the only Italian manual on it that the Alpini actually use."
 ITA_arm_the_three_answers_tt:0 "§YThe Chamber will hear three answers: the Alps, Africa, or a smaller army and a larger fleet.§!"
 ITA_arm_pollio_at_the_boards_tt:0 "§YAlberto Pollio sits on the examination boards and gains a skill level.§!"
 ITA_arm_cadorna_waits_his_turn_tt:0 "§YLuigi Cadorna keeps his place on the list, and remembers who put it there.§!"
 ITA_arm_robilant_at_the_staff_tt:0 "§YMario di Robilant is available as a High Command advisor.§!"
 ITA_arm_diaz_takes_the_salute_tt:0 "§YArmando Diaz gains a skill level.§!"
 ita_dnc.400.t:0 "The Report Nobody Published"
 ita_dnc.400.d:0 "Baratieri was acquitted and the report was shelved, and every officer in the Kingdom has read a copy anyway. Twelve thousand men marched into the mountains in four columns working off three different maps, and the columns lost touch before dawn. The failure was the staff work, and the staff is still the staff."
 ita_dnc.400.a:0 "Then we begin with the staff."
 ita_dnc.400.b:0 "Let it stay on the shelf."
 ita_dnc.401.t:0 "The List Is Posted in January"
 ita_dnc.401.d:0 "It is the same list every year, in the same order, one year older. Pollio wants examination boards and a mark against every name. The seniors answer that a colonel who has waited twenty years has earned his regiment, and several of them have written to their deputies about it. Cadorna has written to the King."
 ita_dnc.401.a:0 "Open the list to examination."
 ita_dnc.401.b:0 "Seniority is the only honest rule."
 ita_dnc.402.t:0 "The Class of the Year"
 ita_dnc.402.d:0 "Two hundred thousand names on the registers, ninety thousand exemptions granted, and a good part of the remainder already gone to Buenos Aires or New York without telling the mayor. The Minister of War may have three years with the colours and a small army, or two years and a large one that has forgotten its drill by the second harvest."
 ita_dnc.402.a:0 "Three years. Soldiers, not numbers."
 ita_dnc.402.b:0 "Two years. Numbers are what we have."
 ita_dnc.403.t:0 "The Recoil Question"
 ita_dnc.403.d:0 "Two answers lie on the table. Krupp will sell a finished quick-firer for cash and teach us nothing. Deport's hydro-pneumatic carriage can be licensed and turned out at Turin, more slowly, and the trade stays in the country. Ansaldo has already sent a deputation to the ministry, and so has the German embassy."
 ita_dnc.403.a:0 "Licence it. Build it at Turin."
 ita_dnc.403.b:0 "Buy the guns from Essen."
 ita_dnc.404.t:0 "The Prefect Asks for Battalions"
 ita_dnc.404.d:0 "A prefect in Emilia wires for two battalions to clear a strike. In ninety-eight the answer was Bava Beccaris, grapeshot in the Corso and a decoration from a King who now lies in the Pantheon with three bullets in him. Giolitti's rule is that the state does not take sides in a wage dispute. No general has yet been made to test it."
 ita_dnc.404.a:0 "The army does not police strikes."
 ita_dnc.404.b:0 "Order first. Send the battalions."
 ita_dnc.405.t:0 "The Feather and the Establishment"
 ita_dnc.405.d:0 "The Alpini recruit where the men already know the snow, which is why they are the only corps that fills its ranks without a summons. Robilant wants them made permanent, with their own artillery and their own school at Aosta. The line regiments call it a private army with a feather in its hat."
 ita_dnc.405.a:0 "Give them a corps of their own."
 ita_dnc.405.b:0 "They are line battalions with a hat."
 ita_dnc.406.t:0 "The Debt of Adwa"
 ita_dnc.406.d:0 "Menelik still holds the treaty that made Ethiopia sovereign and Italy the power that signed it away. The officer corps wants the frontier redrawn at Adigrat. The Consulta wants the caravan road and the coffee. Both are being asked for at once, and only one of them is cheap."
 ita_dnc.406.a:0 "The frontier. We are going back."
 ita_dnc.406.b:0 "The road and the trade. Not the frontier."
 ita_dnc.407.t:0 "The Transports Are Loaded at Naples"
 ita_dnc.407.d:0 "The Ottoman garrison in Tripolitania is thin, the nationalist papers have already printed the landing, and the Banco di Roma has been buying land there for a decade. Giolitti spent two years telling the Consulta that Tripoli is a box of sand. He has stopped saying it where reporters can hear."
 ita_dnc.407.a:0 "Send the ultimatum to the Porte."
 ita_dnc.407.b:0 "Hold the transports."
 ita_dnc.408.t:0 "The Minister Takes It Personally"
 ita_dnc.408.d:0 "The War Minister reads the vote as a verdict on himself and offers to go. The estimates cross the corridor to the Marine, where Thaon di Revel has been waiting with a list of slipways. The generals will be correct and quiet about it, and will remember the year."
 ita_dnc.408.a:0 "Accept the resignation."
 ita_dnc.408.b:0 "Keep him, and split the difference."
 ita_dnc.409.t:0 "The Review"
 ita_dnc.409.d:0 "The King takes the salute of an army that finally knows what it is for. The officers who marched off three maps in Tigray are pensioned, their successors were examined for the rank they wear, and the regulations in the hands of the drill sergeants were printed this year. Whatever the Chamber decided, it has reached the parade ground."
 ita_dnc.409.a:0 "The Kingdom has an army."
 ITADNC_n_the_naval_estimates:0 "The Naval Estimates"
 ITADNC_n_the_naval_estimates_desc:0 "Brin is dead and the fleet he left is a museum of single ships: no two alike, no two magazines interchangeable. The estimate before the Chamber can buy hulls or it can buy a plan, and it cannot buy both. Somebody in the Ministry of Marine has to say aloud what the Regia Marina is actually for."
 ITADNC_n_the_design_office:0 "The Design Office"
 ITADNC_n_the_design_office_desc:0 "A room at the Genio Navale, four draughtsmen and a colonel who will not stop arguing that the secondary battery is the part which has to go. Cuniberti gets his table, his sums and a hearing before the technical committee. What the committee does with him afterwards is a separate question."
 ITADNC_n_the_building_ways:0 "The Building Ways"
 ITADNC_n_the_building_ways_desc:0 "Castellammare, La Spezia and the Venice arsenal between them can lay down three capital hulls at once and finish none of them on time. Lengthen the slips, roof the erecting shops, hire the fitters before the drawings arrive. Somebody must be told where the money came from, and the answer is either the army's vote or the Chamber's patience."
 ITADNC_n_the_whitehead_licence:0 "The Whitehead Licence"
 ITADNC_n_the_whitehead_licence_desc:0 "The best torpedo in Europe is made at Fiume, which is Austrian territory, by an English firm. Buy the licence while it is still for sale and lay down a state works at Naples, so that the day the ally becomes the enemy the flotillas are not disarmed by a customs house."
 ITADNC_n_the_all_big_gun_ship:0 "The All-Big-Gun Ship"
 ITADNC_n_the_all_big_gun_ship_desc:0 "Twelve twelve-inch guns, twenty-four knots, and nothing in between to confuse the spotters. Cuniberti's ship is three years ahead of every navy afloat and costs more than the Chamber has ever voted for a single hull. Build it here, and first, before somebody abroad reads the sums."
 ITADNC_n_the_article_in_janes:0 "The Article in Jane's"
 ITADNC_n_the_article_in_janes_desc:0 "The technical committee will not carry it and the estimates will not stretch. Let the colonel publish instead: a signed article in Jane's Fighting Ships, on an ideal battleship for the British fleet, which is at least an honest title. The money stays in the vote where the Chamber can see it."
 ITADNC_n_the_fleet_base_at_taranto:0 "The Fleet Base at Taranto"
 ITADNC_n_the_fleet_base_at_taranto_desc:0 "Spezia faces France and Naples faces nothing in particular. The Mar Grande is deep, defensible and four hundred miles nearer the mouth of the Adriatic than anything else the Kingdom owns. Dredge it, fort it, and move the squadron south to the war it is actually for."
 ITADNC_n_the_glauco_boats:0 "The Glauco Boats"
 ITADNC_n_the_glauco_boats_desc:0 "Pullino's boats at the Venice arsenal are small, wet and reliable enough that the crews volunteer twice. They cannot cross a sea. They do not need to: the Adriatic is a hundred miles wide, and a boat that can sit in it for a week changes what Pola may safely risk."
 ITADNC_n_the_triple_turret:0 "The Triple Turret"
 ITADNC_n_the_triple_turret_desc:0 "Masdea proposes three barrels on one turntable, which every foreign constructor says will jam, whip and spread the salvo. He has done the sums twice and asks leave to do them again on a proof mounting at the range. If the ring holds, Italy carries more guns per ton than anybody."
 ITADNC_n_the_petersburg_drawings:0 "The Petersburg Drawings"
 ITADNC_n_the_petersburg_drawings_desc:0 "Vickers wants the plans, Petersburg wants the man and the Ministry needs the fee. Sell the drawings and let the colonel go with them. The wardroom will read what he builds abroad in a foreign navy list, and nobody will pretend afterwards that the decision was made on merit."
 ITADNC_n_the_naval_academy_study:0 "The Livorno Study"
 ITADNC_n_the_naval_academy_study_desc:0 "Set the Academy to war-game the Adriatic honestly, with Pola playing itself and no thumb on the scale. The answer comes back unwelcome: the sea cannot be forced by a line of battle and cannot be held without one. Print it, give every squadron commander a copy, and accept that the Chamber will read it too and ask what it has been buying."
 ITADNC_n_the_adriatic_is_a_closed_sea:0 "The Adriatic Is a Closed Sea"
 ITADNC_n_the_adriatic_is_a_closed_sea_desc:0 "One door at Otranto, forty miles wide, and behind it a coast of islands belonging to the ally. Every officer at Livorno can see the shape of the problem: whoever holds the eastern shore holds the sea, and Rome holds the flat side, with all the ports and none of the anchorages."
 ITADNC_n_the_laurenti_hull:0 "The Laurenti Hull"
 ITADNC_n_the_laurenti_hull_desc:0 "A double hull, a partitioned battery and a boat that surfaces when the crew asks it to. Laurenti's design is the one Portugal, Brazil and eventually Russia will buy, which means the yards at Venice are selling something the great powers cannot yet copy for themselves."
 ITADNC_n_the_dante_alighieri:0 "The Dante Alighieri"
 ITADNC_n_the_dante_alighieri_desc:0 "Twelve guns in four triple turrets, all on the centreline, laid down at Castellammare before Vienna has drawn a line on paper. She is the first dreadnought designed and built entirely in Italy. The day her frames go up, every naval attache in Rome writes home that the Kingdom has decided what the Adriatic is to mean, and Pola answers within the year."
 ITADNC_n_the_armoured_cruiser_answer:0 "The Armoured Cruiser Answer"
 ITADNC_n_the_armoured_cruiser_answer_desc:0 "San Giorgio and San Marco: fast, handsome, well armoured against guns nobody mounts any more. They can be built in the yards that exist out of the vote that exists, and they will be obsolete the week the first dreadnought commissions. The Ministry knows this and orders them anyway."
 ITADNC_n_the_night_attack:0 "The Night Attack"
 ITADNC_n_the_night_attack_desc:0 "Train the flotillas to work without lights in water they know by the smell of it. A destroyer captain who can find a battle squadron at two in the morning is worth a battleship the Chamber will never vote, and the Adriatic is narrow enough to be crossed and recrossed before dawn. The bill for oil, torpedoes and lost boats goes up all the same."
 ITADNC_n_the_race_with_pola:0 "The Race with Pola"
 ITADNC_n_the_race_with_pola_desc:0 "Vienna's delegations have voted the credit and the slips at Trieste are already occupied. The ally is building dreadnoughts, and the only sea they can be used in is the one Italy has to cross. Answer the programme, and be seen to answer it, while the treaty is still signed."
 ITADNC_n_the_cavour_class:0 "The Cavour Class"
 ITADNC_n_the_cavour_class_desc:0 "Three ships to a settled design, ordered together instead of one at a time, so the yards can cut plate for a class rather than for a prototype. It is the first occasion on which the Kingdom has budgeted for a squadron rather than for a series of accidents, and the third hull is the one the Chamber will try to strike out in committee."
 ITADNC_n_the_export_yard:0 "The Export Yard"
 ITADNC_n_the_export_yard_desc:0 "If the fleet will not order, somebody else will. Ansaldo and Orlando take work for Argentina, Spain and the Turks; the slips stay warm, the fitters stay hired, and the finest hull in the yard flies another flag. The Chamber calls it prudence. The wardroom calls it something else."
 ITADNC_n_the_high_seas_fleet:0 "The High Seas Fleet"
 ITADNC_n_the_high_seas_fleet_desc:0 "A line of battle that can leave the Adriatic, cover a landing on a hostile coast and stay at sea a fortnight. It is the only fleet that could put a division ashore in Africa without asking London for the coal to get there, and it is paid for out of the army's share of the estimates whether or not the War Ministry has agreed to give it up."
 ITADNC_n_the_narrow_sea_doctrine:0 "The Narrow Sea Doctrine"
 ITADNC_n_the_narrow_sea_doctrine_desc:0 "Accept the sea as it is. Mines, boats, torpedo craft and a coast fortified at every landing beach, so a superior fleet entering the Adriatic is bled rather than fought. The Chamber will vote it gladly because it is cheap, and in voting it concedes in writing that the open sea belongs to somebody else for as long as anyone now serving will live."
 ITA_n_the_estimates_of_1900:0 "The Estimates of 1900"
 ITA_n_the_estimates_of_1900_desc:0 "A fleet of one-offs, a ministry that changes hands every eighteen months, and a vote that has never once been written to a plan lasting longer than the ministry. The estimate is at last drawn up as a programme rather than a shopping list, and the Treasury has noticed that programmes are harder to cut."
 ITA_n_the_estimates_of_1909:0 "The Estimates of 1909"
 ITA_n_the_estimates_of_1909_desc:0 "The vote is now written four years ahead, because a dreadnought takes four years and the ally is building four of them. The yards have never been busier and the Chamber has never been asked for so much at once. Everything that is not a hull is being paid for by somebody who did not vote for it."
 ITA_n_the_drawing_office:0 "The Drawing Office"
 ITA_n_the_drawing_office_desc:0 "Four draughtsmen, a colonel of the Genio Navale and a standing instruction to work the weights honestly before the committee sees them. It is the cheapest thing in the estimate and the only part of the Regia Marina that is ahead of anyone."
 ITA_n_the_ship_of_the_future:0 "The Ship of the Future"
 ITA_n_the_ship_of_the_future_desc:0 "A uniform main battery, one calibre and one set of splashes to range on, in a hull nobody has built yet. The gunnery is transformed and so is the price: every yard in the Kingdom has to be rebuilt around a ship the Kingdom has never made, and every existing ship becomes a training vessel."
 ITA_n_the_refusal_of_1903:0 "The Refusal of 1903"
 ITA_n_the_refusal_of_1903_desc:0 "The committee heard him, thanked him, and voted for what the yards could already build. The estimate is smaller, the Chamber is calmer, and the argument the Regia Marina had won in private has been given away in print to whoever cares to lay the keel."
 ITA_n_the_base_at_taranto:0 "The Base at Taranto"
 ITA_n_the_base_at_taranto_desc:0 "Dredged basins, a dry dock, coal sheds and a boom across the Mar Piccolo. The squadron now lies where the Adriatic can be reached in a day rather than a week, and the South has been given the only piece of state industry it has ever been sent."
 ITA_n_a_sea_that_closes_behind_us:0 "A Sea That Closes Behind Us"
 ITA_n_a_sea_that_closes_behind_us_desc:0 "The staff paper is circulated: one door at Otranto, no anchorages on our own side, and an eastern shore held by the power we are treaty-bound to. Batteries go up at the heel of Italy and the survey ships work the channels, and the ally's attache reports every yard of it.\n\nVienna's confidence in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_n_the_double_hull:0 "The Double Hull"
 ITA_n_the_double_hull_desc:0 "Laurenti's partitioned boat surfaces when it is asked to, which is more than most of Europe's can promise. Foreign navies are placing orders at Venice, and the crews of the Regia Marina no longer volunteer as though they were volunteering for a funeral."
 ITA_n_the_dante_programme:0 "The Dante Programme"
 ITA_n_the_dante_programme_desc:0 "Four triple turrets on the centreline, the first of them in the world, built in a yard that had never assembled anything like it. The Kingdom has a dreadnought before its ally does. It has also committed the next four estimates to keeping her company."
 ITA_n_the_cruiser_answer:0 "The Cruiser Answer"
 ITA_n_the_cruiser_answer_desc:0 "Armoured cruisers are quick, handsome, affordable and beaten by anything with a uniform heavy battery. The fleet gets hulls this decade instead of arguments, and the wardroom keeps a copy of the Jane's article in the drawer to remind itself what it settled for."
 ITA_n_the_race_with_pola:0 "The Race with Pola"
 ITA_n_the_race_with_pola_desc:0 "Two allies laying down capital ships against each other in a sea a hundred miles wide, each publishing the tonnage so the other can read it. The yards are full and the Treasury is empty, and neither government will say in the Chamber who the ships are for."
 ITA_n_the_cavour_programme:0 "The Cavour Programme"
 ITA_n_the_cavour_programme_desc:0 "A class rather than a prototype: three hulls ordered together, plate cut to one set of templates, and a fitting-out schedule the yards can actually plan around. It is the first time Italian naval construction has behaved like an industry instead of a commission."
 ITA_n_the_export_yard:0 "The Export Yard"
 ITA_n_the_export_yard_desc:0 "Foreign orders keep the slips warm and the fitters employed between naval votes, and the drawing offices learn faster building for demanding customers than for a ministry that cannot make up its mind. The best ship on the ways is always somebody else's."
 ITA_n_the_high_seas_school:0 "The School of the Open Sea"
 ITA_n_the_high_seas_school_desc:0 "The fleet is trained and stored to leave its own sea: long-range steaming, colliers exercised with the squadron, landing parties told off by name. It is expensive, the army resents every lira of it, and it is the only doctrine under which Italy can put troops ashore where it chooses."
 ITA_n_the_narrow_sea_school:0 "The School of the Narrow Sea"
 ITA_n_the_narrow_sea_school_desc:0 "Mines, boats, night torpedo work and a fortified coast. The Adriatic becomes a sea nobody can enter cheaply, including us. The battle line that would have to leave it is not built, and the Chamber is quietly relieved."
 ITA_n_terni_plate:0 "Terni Plate"
 ITA_n_terni_plate_desc:0 "The belt is rolled in Umbria, late and dear, by a works the state had to keep alive to have it at all. It is the only armour in the Kingdom that no foreign minister can delay, and every constructor knows exactly how much that independence is costing per ton."
 ITA_n_the_sheffield_contract:0 "The Sheffield Contract"
 ITA_n_the_sheffield_contract_desc:0 "The plate is cheaper, better and English, and it arrives in the same bottoms as the coal. The ships are afloat a year earlier. So is the understanding, at the Consulta and at the Admiralty both, that Italy's battle line is armoured at London's convenience."
 ita_dnc.300.t:0 "The Estimates of 1900"
 ita_dnc.300.d:0 "The Ministry of Marine lays its estimate before a Chamber still arguing about Adwa and the state of siege. There is money for a squadron, or for the yards that would build one, or for the base a squadron would sail from, and there is not money for two of the three. Bettolo's officials want the hulls. The constructors want the slips lengthened first. The naval staff want Taranto dredged and the fleet moved south. The minister has a week to choose, and whichever he chooses will be quoted back at him for a decade."
 ita_dnc.300.a:0 "Vote the hulls. The yards will manage somehow."
 ita_dnc.300.b:0 "Vote nothing this year. The Chamber has had a bad enough one."
 ita_dnc.300.c:0 "Vote the base. The ships can wait; the harbour cannot."
 ITA_n_e300a_tt:0 "Four keels are laid in yards that cannot finish them on time, and everybody involved knows it while signing."
 ITA_n_e300b_tt:0 "The estimate is withdrawn and the ministry survives the session. The Navy List ages by a year in one afternoon."
 ITA_n_e300c_tt:0 "The dredgers go to work in the Mar Grande, and the South is sent state money for the first time since unification without a prefect attached to it."
 ita_dnc.301.t:0 "The Colonel Presents His Ship"
 ita_dnc.301.d:0 "Cuniberti stands before the technical committee with a general arrangement eight feet long and a table of weights he has checked four times. Twelve heavy guns, no secondary battery worth the name, twenty-four knots, seventeen thousand tons. The committee's objection is not that it will not work. The objection is that if it does work, every ship on the Navy List becomes a training vessel the day she commissions, including the four the Chamber voted for last year and the two still on the slips."
 ita_dnc.301.a:0 "Order the design worked up in full."
 ita_dnc.301.b:0 "Thank the colonel and file the drawing."
 ITA_n_e301a_tt:0 "The weights are worked through properly and the gunnery school is told to plan for one calibre."
 ITA_n_e301b_tt:0 "The drawing goes into a cabinet at the Genio Navale, and the committee returns to the ships it understands."
 ita_dnc.302.t:0 "Twelve Guns and Nothing Between Them"
 ita_dnc.302.d:0 "The gunnery school reports that with a uniform main battery the spotters range on the splashes instead of guessing which calibre made them, and the hit rate at eight thousand yards roughly doubles. The same report notes that the ship has almost nothing to throw at a torpedo boat closing in the dark, and that the Adriatic is full of torpedo boats belonging to the ally. Thaon di Revel's staff want a secondary battery put back. The constructors reply that the weight has to come out of the belt or out of the boilers, and invite the staff to choose which."
 ita_dnc.302.a:0 "Hold the line. No secondary battery."
 ita_dnc.302.b:0 "Put back a light battery and accept the weight."
 ITA_n_e302a_tt:0 "The spotting tables are rewritten for a single calibre, and the flotillas are told the battle line will simply have to be screened."
 ITA_n_e302b_tt:0 "A light battery goes back into the design, the belt loses two inches, and the ship becomes slightly less than the article promised."
 ita_dnc.303.t:0 "Jane's Prints What Rome Would Not Build"
 ita_dnc.303.d:0 "The article appears under the colonel's own name in the 1903 edition, complete with the general arrangement, the weights and the reasoning, under the title of an ideal battleship for the British fleet. It is read at the Admiralty within the month and at Portsmouth within two. Rome has published, free of charge and over its own signature, the design it declined to pay for. The only question left open is who lays the first keel, and the answer will be printed in every naval annual for thirty years."
 ita_dnc.303.a:0 "Let it stand. The credit is Italy's whatever flag flies over the ship."
 ita_dnc.303.b:0 "Answer it with a staff paper of our own."
 ita_dnc.303.c:0 "Approach Vickers about buying a hull instead of drawing one."
 ITA_n_e303a_tt:0 "The Admiralty's constructors are handed a finished argument they were still assembling, and the first all-big-gun keel is laid on the Solent rather than at Castellammare."
 ITA_n_e303b_tt:0 "Livorno is set to work on what such a ship would mean for a closed sea, which is at least a study the Kingdom owns."
 ITA_n_e303c_tt:0 "The Consulta opens a quiet conversation in London, and the fleet's next capital ship will be armoured, engined and largely built by the power that sells us our coal."
 ita_dnc.304.t:0 "Terni or Sheffield"
 ita_dnc.304.d:0 "The belt needs cemented plate, and the works at Terni can roll it at a price and to a schedule which the constructors describe in writing as optimistic. Vickers and John Brown can deliver the same plate sooner and cheaper, carried in ships crossing a sea London controls, out of furnaces fed by coal London also controls. The Kingdom has no coal under any part of it and has already learned what a leash feels like. The question in front of the minister is whether he wants a second one fastened around the armour belt."
 ita_dnc.304.a:0 "Roll the plate at Terni, whatever it costs and however late."
 ita_dnc.304.b:0 "Buy the plate at Sheffield and get the ship into the water."
 ITA_n_e304a_tt:0 "Terni is kept alive by the naval vote, delivers late, and delivers armour no foreign ministry can hold up at a wharf."
 ITA_n_e304b_tt:0 "The plate lands at Genoa in the same bottoms as the coal, the ship is afloat a year early, and the account with London grows by one more item."
 ita_dnc.305.t:0 "A Sea With One Door"
 ita_dnc.305.d:0 "The staff appreciation runs to four pages and says one thing: the Adriatic can be closed at Otranto by whichever fleet gets a squadron there first, and the eastern shore, which holds every deep-water anchorage in the sea, belongs to the power Rome is formally allied to. The Consulta would rather the paper did not circulate. The naval staff would rather it were acted upon. Vienna's attache has already asked, twice and politely, what exactly the survey ships out of Brindisi are surveying."
 ita_dnc.305.a:0 "Act on it. The sea is a military problem before it is a diplomatic one."
 ita_dnc.305.b:0 "Reassure Vienna and shelve the paper."
 ita_dnc.305.c:0 "Fortify the heel of Italy and say nothing to anybody."
 ITA_n_e305a_tt:0 "The appreciation becomes the working assumption of the fleet, and the attache's next report says so."
 ITA_n_e305b_tt:0 "The survey ships are recalled and the ally is told, in writing, that the Adriatic is a shared sea."
 ITA_n_e305c_tt:0 "Batteries go up at Brindisi and Otranto without an announcement, and are photographed from a passing steamer within the season."
 ita_dnc.306.t:0 "The Dante Alighieri Takes the Water"
 ita_dnc.306.d:0 "She goes down the ways at Castellammare with the King on the stand and half the Chamber behind him, and the newspapers count the guns for their readers: twelve, all of one calibre, all on the centreline, in a ship laid down before anybody else in Europe had drawn one. The naval attaches count them as well. The wire to Vienna goes out the same evening, and within the week the delegations at Pola will be asked for a credit they have twice refused."
 ita_dnc.306.a:0 "Let the launch be as loud as the newspapers want it."
 ita_dnc.306.b:0 "Keep the ceremony small and the figures out of the press."
 ITA_n_e306a_tt:0 "The country is told it has built the finest ship in Europe, and so is everybody else."
 ITA_n_e306b_tt:0 "The launch is a naval occasion rather than a national one, and Vienna is given a fortnight less to be alarmed in."
 ita_dnc.307.t:0 "Pola Lays Down Four"
 ita_dnc.307.d:0 "The Tegetthoff class: four ships, triple turrets, ordered together. The credit was voted by delegations that had refused a fleet twice before, and the slips at Trieste were cleared before the vote was taken. Vienna is formally an ally, the treaty has years left to run, and every officer in both navies knows the only water in which either fleet could reach the other. Rome can match the programme keel for keel, answer it with something cheaper that would still hurt, or say plainly and publicly that it will not race an ally."
 ita_dnc.307.a:0 "Keel for keel."
 ita_dnc.307.b:0 "Boats instead of battleships."
 ita_dnc.307.c:0 "Refuse the race, and say so at Vienna."
 ITA_n_e307a_tt:0 "The estimate is written four years forward and the Chamber is told what it will be voting until 1913."
 ITA_n_e307b_tt:0 "Venice is given the money Castellammare wanted, and the ally's four battleships acquire a problem nobody at Pola has costed."
 ITA_n_e307c_tt:0 "The refusal is made in the proper form at the Ballhausplatz, and is believed there rather more than it is at home."
 ita_dnc.308.t:0 "The Yard Sells What the Fleet Will Not Buy"
 ita_dnc.308.d:0 "Ansaldo has a cruiser on the ways against an Argentine order and Orlando is quoting the Turks. The fitters are employed, the plate mills are running and the profit is entirely real. It is also the case that the best hull the Kingdom can build this year will fly somebody else's flag, and that one of the buyers is a power the fleet may eventually have to meet somewhere in the Mediterranean, in a ship it paid Genoa to build."
 ita_dnc.308.a:0 "Take the orders. A warm slip is worth more than a principle."
 ita_dnc.308.b:0 "Buy the hull out of the contract for the Regia Marina."
 ITA_n_e308a_tt:0 "The yards run full for three years, and the Navy List is the only navy list in Europe shorter than the order book that fed it."
 ITA_n_e308b_tt:0 "The contract is bought out at an embarrassing price, the buyer is compensated, and the Regia Marina gets the best ship in the yard for once."
 ita_dnc.309.t:0 "Calderara Rises From the Water"
 ita_dnc.309.d:0 "Lieutenant Calderara puts a float-fitted machine off the lagoon at Venice and stays up long enough to report the position of three boats the flotilla commander had lost. The naval staff had funded the experiment as a curiosity and a courtesy. The submarine officers, who spend their working lives unable to see anything at all, have understood the implications considerably faster than the gunnery branch has."
 ita_dnc.309.a:0 "Fund a naval air station on the lagoon."
 ita_dnc.309.b:0 "Spend the money on more boats instead."
 ITA_n_e309a_tt:0 "Venice gets sheds, a slipway and six machines, and the Regia Marina becomes the first navy in Europe to write aircraft into a fleet exercise."
 ITA_n_e309b_tt:0 "The machine is put away and two more boats are laid down, which is the answer the flotilla commanders asked for anyway."
 ITA_n_tt_vienna_confidence_set:0 "Vienna's confidence in Rome stands at §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_n_tt_cuniberti_hired:0 "Colonel Vittorio Cuniberti is given a drawing office and may be appointed as a naval theorist."
 ITA_n_tt_pullino_hired:0 "Giacinto Pullino may be appointed as a naval theorist; Cesare Laurenti will follow once the double hull is proved."
 ITA_n_tt_laurenti_hired:0 "Cesare Laurenti may be appointed as a naval theorist."
 ITA_n_tt_masdea_hired:0 "Edoardo Masdea may be appointed as a naval theorist."
 ITA_n_tt_masdea_draws_the_ring:0 "Edoardo Masdea takes the triple mounting to the proof range at Muggiano."
 ITA_n_tt_cuniberti_gone:0 "Colonel Cuniberti leaves the Kingdom's service with his drawings and may no longer be appointed."
 ITA_n_tt_vienna_down_3:0 "Vienna's confidence in Rome falls by §R3§!."
 ITA_n_tt_vienna_down_5:0 "Vienna's confidence in Rome falls by §R5§!."
 ITA_n_tt_vienna_down_8:0 "Vienna's confidence in Rome falls by §R8§!."
 ITA_n_tt_vienna_down_10:0 "Vienna's confidence in Rome falls by §R10§!."
 ITA_n_the_dante_threat:0 "The Dante Alighieri"
 ITA_n_the_adriatic_race_threat:0 "The Adriatic Race"
 ITA_n_the_cavour_threat:0 "The Cavour Programme"
 ITADNC_w_the_consulta:0 "The Consulta"
 ITADNC_w_the_consulta_desc:0 "Palazzo della Consulta keeps the archives of a great power and the means of a middling one. Every chancellery in Europe has already priced us; the question is whether the men who write our despatches have. Open the ministry's books and let the Kingdom read the treaties it has actually signed."
 ITADNC_w_the_renewal_of_the_alliance:0 "The Renewal of the Alliance"
 ITADNC_w_the_renewal_of_the_alliance_desc:0 "The Triple Alliance falls due again and Berlin wants it signed before anyone thinks to ask the Chamber. The text is defensive, it says nothing whatever about Trento, and it costs us nothing to put our hand to it. Renewal buys quiet on the Alpine frontier and the good opinion of the two courts that hold our irredenta."
 ITADNC_w_the_loyal_third:0 "The Loyal Third"
 ITADNC_w_the_loyal_third_desc:0 "Be the ally we say we are. The Third Army entrains for the Rhine if Berlin is attacked, Vienna gets the staff conversations it has asked for since Adwa, and the Consulta stops selling the same neutrality twice. The irredentist press will call it treason, and Trieste will not forgive it."
 ITADNC_w_prinettis_note_to_paris:0 "Prinetti's Note to Paris"
 ITADNC_w_prinettis_note_to_paris_desc:0 "The foreign minister hands Ambassador Barrere a signed assurance: if France is attacked, Italy stays out, whatever the alliance says. Four men in Rome know of it. It buys the entire western frontier without a soldier, and it makes the treaty we signed in June a lie in writing, kept in a safe."
 ITADNC_w_the_notice_of_denunciation:0 "Notice of Denunciation"
 ITADNC_w_the_notice_of_denunciation_desc:0 "Say it aloud. The King's government gives formal notice that the alliance will not be renewed, and Rome stops pretending it is bound to the power that holds Trento. The Chamber will cheer for a week. Then we are a great power with no allies, no coal of our own, and a very long coast."
 ITADNC_w_the_staff_talks_at_berlin:0 "The Staff Talks at Berlin"
 ITADNC_w_the_staff_talks_at_berlin_desc:0 "Our staff sends officers to Berlin to settle the timetables: how many divisions cross the Alps, on which railways, by what day of mobilisation. For the first time the alliance means a train schedule rather than a phrase, and both courts notice which of the two it is."
 ITADNC_w_the_double_book:0 "The Double Book"
 ITADNC_w_the_double_book_desc:0 "Two files, two truths, one ministry keeping both. Vienna is told what the treaty says, Paris is told what the note says, and Rome collects from each the price of a friend it has already promised elsewhere. It works beautifully until a clerk in one capital reads a newspaper printed in the other."
 ITADNC_w_trento_and_trieste:0 "Trento and Trieste"
 ITADNC_w_trento_and_trieste_desc:0 "The irredenta stops being a subject for banquets. Rome states the claim in the Chamber, in the schools and in the despatches: the Trentino, Trieste and Istria are Italian land under a foreign crown, and the Kingdom means to have them. Vienna will read it as exactly what it is."
 ITADNC_w_the_bargain_at_racconigi:0 "The Bargain at Racconigi"
 ITADNC_w_the_bargain_at_racconigi_desc:0 "The Tsar comes to the King's shooting lodge, and in three days the two courts agree to keep the Balkans as they are, to favour no third power there, and to remember one another when the Straits and Tripoli come up. Nothing is published. Vienna hears of it within the month."
 ITADNC_w_the_albanian_shore:0 "The Albanian Shore"
 ITADNC_w_the_albanian_shore_desc:0 "The Otranto narrows are ours only while nobody else holds Valona. Rome opens schools, buys quays and pays the chiefs, because whichever great power organises Albania first closes the Adriatic on the other. Vienna is doing precisely the same thing, forty miles away, out of the same purse."
 ITADNC_w_the_two_colonies:0 "The Two Colonies"
 ITADNC_w_the_two_colonies_desc:0 "Eritrea and the Benadir coast cost the estimates more than they return and are governed by whoever happens to be on the spot. Send out a proper survey, put a road behind Massawa and a road behind Mogadishu, and decide what the two possessions are for before anybody proposes a third."
 ITADNC_w_buying_out_the_benadir_company:0 "Buying Out the Benadir Company"
 ITADNC_w_buying_out_the_benadir_company_desc:0 "The chartered company has run the Benadir on a subsidy and a scandal, and the inquiry found slaving in the ports it administers. The state buys the charter back and governs Somaliland directly. It costs the ministry a vote it would rather not hold, and ends an embarrassment it cannot survive twice."
 ITADNC_w_the_ascari_battalions:0 "The Ascari Battalions"
 ITADNC_w_the_ascari_battalions_desc:0 "The best infantry Italy has in Africa is Eritrean: recruited in the highlands, led by Italian officers, paid better than a conscript from Basilicata. Raise more of them. They march further on less, they know the country, and each battalion raised is one not shipped out of Naples."
 ITADNC_w_the_treaty_with_menelik:0 "The Treaty with Menelik"
 ITADNC_w_the_treaty_with_menelik_desc:0 "Menelik destroyed a European army and is willing to be generous about it. Fix the Eritrean boundary, open the caravan roads, and join London and Paris in guaranteeing that Ethiopia stays whole. It closes Adwa without another shot, and it tells the army in public that the account will not be settled."
 ITADNC_w_the_march_back_to_adwa:0 "The March Back to Adwa"
 ITADNC_w_the_march_back_to_adwa_desc:0 "The army has not forgiven 1896 and neither has the country. But the highlands begin at eight thousand feet, every round comes up by mule from Massawa, Menelik has more rifles than he had then, and London guarantees his borders. Everything that destroyed Baratieri is still there, unchanged, waiting."
 ITADNC_w_the_tripoli_question:0 "The Tripoli Question"
 ITADNC_w_the_tripoli_question_desc:0 "The last piece of Africa nobody has taken lies four hundred miles from Sicily, and every chancellery has already conceded that it is Italy's when Italy wants it. France has Tunis, Britain has Egypt, and the Porte holds Tripoli with a few battalions and no money. Rome opens the file."
 ITADNC_w_the_ultimatum_to_the_porte:0 "The Ultimatum to the Porte"
 ITADNC_w_the_ultimatum_to_the_porte_desc:0 "Twenty-four hours to consent to an Italian occupation of Tripolitania and Cyrenaica, drafted so that consent is impossible. The fleet is coaled, the transports lie at Naples, and the Chamber has not been asked. Give the word and the Kingdom is at war with the Ottoman Empire."
 ITADNC_w_the_banco_di_roma_instead:0 "The Banco di Roma Instead"
 ITADNC_w_the_banco_di_roma_instead_desc:0 "The bank already holds the mills, the quays and half the debts in Tripoli. Buy the province instead of storming it: more branches, more credit to the notables, a quiet understanding with the Porte that Italian money may go where Italian troops may not. Cheaper, slower, no triumph, and no war for the nationalist press to lose its temper over."
 ITADNC_w_the_islands_as_a_pledge:0 "The Islands as a Pledge"
 ITADNC_w_the_islands_as_a_pledge_desc:0 "The Ottoman garrison in Libya is supplied through the Aegean, so take the Aegean. Rhodes and eleven islands are occupied as a pledge, to be handed back when Constantinople signs. Everyone concerned understands that a pledge held long enough stops being a pledge."
 ITADNC_w_the_peace_of_ouchy:0 "The Peace of Ouchy"
 ITADNC_w_the_peace_of_ouchy_desc:0 "At a lakeside hotel near Lausanne the Porte agrees to withdraw its officers and grant the provinces autonomy, and Italy agrees to call that a transfer. The Sultan keeps his religious title over men who will go on shooting at us from the wells south of Sirte. The coast is ours on the map. Nobody has yet asked the interior for its opinion."
 ITADNC_w_the_war_that_does_not_end:0 "The War That Does Not End"
 ITADNC_w_the_war_that_does_not_end_desc:0 "The coast was taken in a fortnight. The interior has not been taken at all. The Senussi hold the wells and the caravan roads, the columns march out and come back thinner, and the war announced as finished goes on being paid for in men who were promised a parade."
 ITADNC_w_the_fourth_shore:0 "The Fourth Shore"
 ITADNC_w_the_fourth_shore_desc:0 "If Libya is to be worth the graves, it must take the emigrants who now go to Brooklyn and Buenos Aires. Land offices, wells, a coast road, and forty hectares promised to any family out of the South. It is the only possession we hold that anyone has ever proposed to fill with Italians."
 ITA_w_the_consulta:0 "The Consulta"
 ITA_w_the_consulta_desc:0 "The foreign ministry has been given its own budget line, its own cipher room and, for the first time in a decade, an instruction to keep records of what was promised to whom."
 ITA_w_the_third_partner:0 "The Loyal Third"
 ITA_w_the_third_partner_desc:0 "Rome means the treaty it signed. Two general staffs plan with ours, and one third of the Chamber regards the ministry as the caretaker of Austrian rule over Italians."
 ITA_w_the_note_of_1902:0 "The Note in the Safe"
 ITA_w_the_note_of_1902_desc:0 "France will not be fought, and the divisions that watched the Alpine passes can watch something else. Four men know why, and one of them is a foreign ambassador."
 ITA_w_the_double_book:0 "The Double Book"
 ITA_w_the_double_book_desc:0 "Both camps believe they have bought us and both go on paying. The Consulta has never been so well informed, so well courted, or so completely dependent on nobody in Paris talking."
 ITA_w_the_broken_word:0 "The Broken Word"
 ITA_w_the_broken_word_desc:0 "It is now on the record in three languages that Italy signs what it does not mean. Every future undertaking will be read as provisional, and priced accordingly."
 ITA_w_free_hands:0 "Free Hands"
 ITA_w_free_hands_desc:0 "No ally, no obligation, no timetable written in someone else's capital. Also no one under any duty to come when the coast is shelled."
 ITA_w_the_albanian_stake:0 "The Albanian Stake"
 ITA_w_the_albanian_stake_desc:0 "Coaling rights at Valona, schools in the hinterland and a subsidy to the chiefs. The Adriatic is a corridor, and Rome now holds one hinge of the door."
 ITA_w_the_ascari:0 "The Ascari Battalions"
 ITA_w_the_ascari_desc:0 "Eritrean regulars under Italian officers, acclimatised, cheaper to keep than a metropolitan division, and the only troops we have who have never lost a colonial campaign."
 ITA_w_the_tripartite_understanding:0 "The Tripartite Understanding"
 ITA_w_the_tripartite_understanding_desc:0 "Rome, London and Paris guarantee Ethiopia's integrity and divide its trade. The caravan roads to Massawa are open and the border is a line rather than a grievance."
 ITA_w_the_second_expedition:0 "The Second Expedition"
 ITA_w_the_second_expedition_desc:0 "The army is going back to the highlands to settle 1896. Every cartridge fired there arrives by mule, over a mountain, in a column that has to be escorted."
 ITA_w_the_banco_di_roma:0 "The Banco di Roma"
 ITA_w_the_banco_di_roma_desc:0 "Italian credit does the work an Italian corps would otherwise be asked to do. It is slower, it is far cheaper, and it wins no man a decoration."
 ITA_w_the_desert_that_does_not_end:0 "The Desert That Does Not End"
 ITA_w_the_desert_that_does_not_end_desc:0 "The coast is administered and the interior is not. The columns learn desert war the only way it is learned, and the casualty lists arrive in a country that was told the war ended."
 ITA_w_the_fourth_shore:0 "The Fourth Shore"
 ITA_w_the_fourth_shore_desc:0 "Land offices at Tripoli and Benghazi, wells, a coast road, and families out of Calabria on the first sailings. Emigration that leaves under our own flag."
 ITA_w_vienna_trust_tt:0 "Confidence of Vienna in Rome: §Y[?ITA_vienna_trust|0]§! of 100."
 ITA_w_note_sealed_tt:0 "The note stays in the safe. It cannot be traded on, and it cannot be found."
 ITA_w_note_talked_about_tt:0 "The note is spoken of in Paris drawing rooms. What is spoken of in Paris is printed in Vienna."
 ITA_w_tripoli_opened_tt:0 "The Tripoli file is open at the Consulta. The decision to use it, or not to, is taken here."
 ITA_w_ouchy_tt:0 "Tripolitania, Cyrenaica and the Libyan coast pass to the Kingdom of Italy, and the war with the Porte is ended."
 ITA_w_ultimatum_extended_tt:0 "The ultimatum is extended. The wargoal stands, the transports stay at Naples, and the Chamber is told nothing."
 ITA_w_restraint_tt:0 "The columns are held to their orders. The ministry pays for it in the Roman press for a month."
 ITA_w_expedition_halted_tt:0 "The expedition is halted at the escarpment. The claim on Ethiopia stands on paper and nowhere else."
 ITA_w_threat_the_irredenta:0 "Italy claims Trento and Trieste"
 ITA_w_threat_the_second_expedition:0 "Italy prepares a second Ethiopian expedition"
 ITA_w_threat_the_ultimatum:0 "Italy threatens the Ottoman provinces in Africa"
 ITA_w_threat_the_chamber_cheers:0 "Rome renounces the Triple Alliance"
 ITA_w_threat_the_libyan_war:0 "Italy invades Ottoman Libya"
 ITA_w_threat_the_aegean:0 "Italy occupies the Aegean islands"
 ITA_w_threat_the_reprisals:0 "Reprisals in the Tripoli oases"
 ITA_w_threat_valona:0 "Italy stakes a claim to Valona"
 ITA_w_the_cipher_room:0 "The Cipher Room"
 ITA_w_the_military_convention_bonus:0 "The Military Convention"
 ITA_w_the_third_army_rides:0 "The Third Army Timetable"
 ITA_w_the_rhine_timetable:0 "The Rhine Timetable"
 ITA_w_the_black_cabinet:0 "The Reading of Despatches"
 ITA_w_the_balkan_desks:0 "The Balkan Desks"
 ITA_w_the_otranto_survey:0 "The Otranto Survey"
 ITA_w_the_colonial_office_bonus:0 "The Colonial Office"
 ITA_w_the_benadir_survey:0 "The Benadir Survey"
 ITA_w_the_colonial_battalions:0 "The Colonial Battalions"
 ITA_w_the_libyan_survey:0 "The Libyan Survey"
 ITA_w_the_column_and_the_well:0 "The Column and the Well"
 ita_dnc.500.t:0 "The Chancelleries Take Our Measure"
 ita_dnc.500.d:0 "The ministry's own summary is not flattering. Berlin regards us as a road to the Rhine that may or may not be open. Vienna regards us as the ally that will one day ask for Trento and would rather we asked before the Emperor dies. Paris regards us as purchasable. London regards us as a customer with a long coast and no coal.\n\nThe King is thirty. He reads all four estimates and does not disagree with any of them."
 ita_dnc.500.a:0 "Then let them price us correctly."
 ita_dnc.501.t:0 "The Note is Signed"
 ita_dnc.501.d:0 "The paper is two paragraphs long. If France is the object of direct or indirect aggression, Italy will maintain a strict neutrality; and Italy will do nothing in North Africa that France would resent. Barrere folds it and puts it in the embassy bag.\n\nThe treaty renewed at Berlin says something else entirely. Both documents are now valid, both are signed by the same government, and the question before the ministry is simply how many people are to know."
 ita_dnc.501.a:0 "The King, the minister, and the safe."
 ita_dnc.501.b:0 "Let Paris be pleased with us aloud."
 ita_dnc.502.t:0 "Vienna Reads the Paris Press"
 ita_dnc.502.d:0 "A deputy in the French Chamber, defending a colonial estimate, says rather more than he needed to about Italian goodwill in the Mediterranean. The sentence is reprinted in Vienna within four days, with the parts about the alliance set in heavier type.\n\nThe Ballhausplatz asks our ambassador, very politely, whether the Kingdom has undertakings towards France that its allies have not seen."
 ita_dnc.502.a:0 "There is no such undertaking. Say so."
 ita_dnc.502.b:0 "Admit the note and call it insurance."
 ita_dnc.503.t:0 "The Notice at the Ballhausplatz"
 ita_dnc.503.d:0 "Our ambassador reads the declaration standing, because he has been asked to make it formal. The alliance will lapse and will not be renewed. The Kingdom remains, of course, the friend of both empires.\n\nNobody in the room pretends to believe the last sentence. The question at home is what tone Rome takes on the morning the newspapers have it."
 ita_dnc.503.a:0 "A correct despatch and no demonstrations."
 ita_dnc.503.b:0 "Let the Chamber say what the country thinks."
 ita_dnc.504.t:0 "An Envoy from Addis Ababa"
 ita_dnc.504.d:0 "The Emperor's envoy is received at the Quirinal with the honours due to a sovereign who beat us, which is to say generously. He brings the boundary maps, an offer on the caravan road to Massawa, and a message that the Emperor considers the war of 1896 concluded.\n\nHe also mentions, without emphasis, that Ethiopia is buying rifles from four countries and would prefer to buy them from three."
 ita_dnc.504.a:0 "Sign the boundary and open the road."
 ita_dnc.504.b:0 "Sign, and ask for the customs at the frontier."
 ita_dnc.505.t:0 "The Ultimatum Expires"
 ita_dnc.505.d:0 "The Porte's reply arrives before the hour is out. It offers everything short of the occupation: guarantees for Italian enterprise, indemnities, a commission. It is a better answer than we expected and it is not the answer the ultimatum was written to receive.\n\nThe transports are loaded. The Chamber is in recess. The word rests with the ministry and nobody else."
 ita_dnc.505.a:0 "The fleet sails for Tripoli."
 ita_dnc.505.b:0 "Extend the term by a week."
 ita_dnc.506.t:0 "Twelve Islands"
 ita_dnc.506.d:0 "The landings are almost unopposed. Rhodes takes an afternoon, and the smaller islands send out their notables to meet the boats. The Greek inhabitants greet the marines as liberators and immediately ask when the union with Athens will be proclaimed.\n\nThe fleet reports that the Aegean supply route to Libya is closed. The Consulta reports that London has asked a question about the islands rather sooner than expected."
 ita_dnc.506.a:0 "A pledge, held until the Porte signs."
 ita_dnc.506.b:0 "The islands were Roman before they were Ottoman."
 ita_dnc.507.t:0 "The Oasis Outside Tripoli"
 ita_dnc.507.d:0 "A battalion holding the palm gardens east of the city is taken from behind by men who were counted as townspeople the day before. The survivors come back into Tripoli with a story that spreads through the whole force before evening.\n\nThe general commanding asks for a free hand in the oasis. The correspondents of four countries are quartered a mile away, and they can already smell the smoke."
 ita_dnc.507.a:0 "Give him his free hand."
 ita_dnc.507.b:0 "Hold the columns to their orders."
 ita_dnc.508.t:0 "The Staff Reads the Map Again"
 ita_dnc.508.d:0 "The operations section has prepared the estimate it prepared in 1895, with better figures. Massawa to the escarpment by mule. Water at four points, all of them known to the enemy. Sixty thousand rifles in the Emperor's hands, and a supply column that must be escorted by a third of the force it feeds.\n\nOne officer notes at the bottom that the last army to attempt this was a good army."
 ita_dnc.508.a:0 "This time we go with enough of everything."
 ita_dnc.508.b:0 "Halt at the escarpment. The claim can wait."
 ita_dnc.509.t:0 "Vienna Asks About Valona"
 ita_dnc.509.d:0 "The Austrian ambassador is amiable and entirely direct. Both courts are paying the same Albanian chiefs, opening rival schools in the same towns and surveying the same anchorage. He proposes that they stop, and that both powers undertake to keep Albania independent of each other.\n\nHe does not say what happens if Rome declines. He does not really need to."
 ita_dnc.509.a:0 "An understanding. Neither of us takes it."
 ita_dnc.509.b:0 "Valona commands the Adriatic. Say nothing."
 ITA_the_non_expedit:0 "The Non Expedit"
 ITA_the_non_expedit_desc:0 "The Holy See has held since 1874 that it is not expedient for a Catholic to vote in the elections of a state that took Rome from the Pope, and a third of the electorate obeys. The Chamber is therefore quieter than the country, the ministry is spared an opposition it would not know how to answer, and the day a bishop decides the rule may be read loosely, ninety seats change hands without a single voter changing his mind."
 ITA_the_emigrant_ledger:0 "The Emigrant Ledger"
 ITA_the_emigrant_ledger_desc:0 "Six hundred thousand leave every year and the money they post home closes the trade deficit of a great power. The other column is the one nobody prints: they are of military age, the villages they left are being counted for the conscription class of 1920 by a clerk who keeps finding nobody at the address, and the ledger balances because the country is being drained to balance it."
 ITA_the_southern_ledger:0 "The Southern Ledger"
 ITA_the_southern_ledger_desc:0 "Two provinces in three below Naples have no water, no metalled road and no school, and the Kingdom has never once admitted in statute that this is a different problem rather than a poorer version of the North. Everything built there is built twice as slowly and costs twice as much, and the account is carried forward every year in the hope that the next ministry will look at it."
 ITA_the_british_leash:0 "The British Leash"
 ITA_the_british_leash_desc:0 "Eighty-eight tons in every hundred are cut in Wales, and every wheel that turns in Milan turns because a collier unloaded at Genoa. The Triple Alliance is renewed on paper every few years; the coal contract is renewed every winter, and the Consulta knows which of the two would actually stop the mills."
 ITA_the_prefect_machine:0 "The Prefect Machine"
 ITA_the_prefect_machine_desc:0 "Ninety constituencies, ninety prefects, and a book in Rome recording which mayor is to be sustained and which list is to go astray in the post. The bridges get built and the estimates get voted. The book is the difficulty: it exists, it is written down, and somebody is always counting."
 ITA_the_mezzogiorno_account:0 "The Mezzogiorno Account"
 ITA_the_mezzogiorno_account_desc:0 "What has been promised to the South and what has actually been laid in the ground are two different figures, and the second follows the first by about an eighth of the gap a year. Aqueducts take longer than ministries do."
 ITA_the_empty_bunkers:0 "The Bunkers Are Empty"
 ITA_the_empty_bunkers_desc:0 "Under three months on the quay at Genoa. The mills bank their furnaces because banking is cheaper than stopping, and the yards follow within the fortnight."
 ITA_the_prefect_ledger:0 "The Prefect Ledger"
 ITA_the_prefect_ledger_desc:0 "Outside the three industrial cities the state is one man in a sash per province, and he decides what the returns say. A strong machine hands a ministry a Chamber that does as it is told and a Chamber that will not survive one bad harvest. It also means the men it shuts out have nowhere left to go except the party you have already outlawed in your head.\n\nPrefects: §Y[?ITA_prefects|0]§! of 100. Electorate: §Y[?ITA_electorate|0]§! hundred thousand."
 ITA_the_special_laws:0 "The Special Laws for the South"
 ITA_the_special_laws_desc:0 "Cheap power, a tariff exemption on raw materials, a state guarantee and a schedule of public works written into statute. It is the only industrial policy the kingdom has ever addressed to the South, it is charged to the Northern estimates, and it will be another decade before anybody can point at a road and say that this is what it bought."
 ITA_liberal_left:0 "Liberal Left"
 ITA_liberal_left_long:0 "The Liberal Left of Giovanni Giolitti"
 ITA_constitutional_right:0 "Constitutional Right"
 ITA_constitutional_right_long:0 "The Constitutional Right and the Statuto"
 ITA_popular_bloc:0 "Popular Bloc"
 ITA_popular_bloc_long:0 "The Popular Bloc of the Extreme Left"
 ITA_vittorio_cuniberti:0 "Vittorio Cuniberti"
 ITA_vittorio_cuniberti_desc:0 "Colonel of the Genio Navale. He drew the all-big-gun ship in 1902 and has spent every year since explaining, to committees, why the small guns are the part that has to go."
 ITA_edoardo_masdea:0 "Edoardo Masdea"
 ITA_edoardo_masdea_desc:0 "Chief constructor of the Regia Marina. He put three barrels on one turntable before anyone else dared, having done the sums twice and asked to do them again."
 ITA_giacinto_pullino:0 "Giacinto Pullino"
 ITA_giacinto_pullino_desc:0 "Builder of the Glauco boats at the Venice arsenal. Small, wet, reliable enough that the crews volunteer twice, and intended for the Adriatic and nowhere else."
 ITA_cesare_laurenti:0 "Cesare Laurenti"
 ITA_cesare_laurenti_desc:0 "The double hull that becomes the Foca and then the Medusa class, which is the design the rest of Europe eventually buys."
