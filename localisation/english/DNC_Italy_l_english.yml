 ITA_tb_the_refusal:0 "The Refusal at Vienna"
 ITA_minister_of_agriculture_industry:0 "Minister of Agriculture and Industry"
 ITA_minister_of_agriculture_industry_desc:0 "He has the two portfolios nobody wants and the only two that touch what most Italians actually do for a living."
