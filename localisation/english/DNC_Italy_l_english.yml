 vittorio_ambrosio:0 "Vittorio Ambrosio"
 ITA_p_the_piazza:0 "The Piazza"
 ITA_p_the_piazza_desc:0 "What the prefects report from the squares, the chambers of labour and the mills, kept as one figure in a book at the Interior. The state shelled Milan for less than this.\n\nThe piazza: §Y[?ITA_piazza|0]§! of 100. It will not fall below §Y[?ITA_piazza_floor|0]§!.\n\n§R45§!: the strike spreads. §R60§!: the ministry falls. §R75§!: the province is out of hand. §R90§! for three months: insurrection."
 ITA_c_the_chamber:0 "The Chamber"
 ITA_c_the_chamber_desc:0 "There is no party in this Chamber, only a majority, and a majority is a thing assembled deputy by deputy in a room off the corridor. It holds until the bill comes.\n\nThe government's hold: §Y[?ITA_majority|0]§! of 100, of which §Y[?ITA_majority_bought|0]§! was made by the prefects.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. Public works promised and not yet delivered: §Y[?ITA_pledges|0]§!."
 ITA_p_the_army_in_the_streets:0 "The Army in the Streets"
 ITA_p_the_army_in_the_streets_desc:0 "Bava Beccaris was decorated for it, and the country has not stopped counting since. Every time the troops are sent the square empties that week and refills the next year with men who remember.\n\nTimes the army has been used against a crowd: §Y[?ITA_bayonets|0]§!. Each one raises the floor of the piazza by §R4§! and adds §R0.25§! to its monthly rise, permanently."
 ITA_p_the_province_ungoverned:0 "The Province Is Not Governed"
 ITA_p_the_province_ungoverned_desc:0 "The prefect is in his residence with the shutters closed, the telegraph is cut, and a committee sitting in the town hall is issuing passes. Nothing is being built here and nothing is being shipped out."
 ITA_p_the_strike_spreads:0 "The Strike Spreads"
 ITA_p_the_strike_spreads_desc:0 "It began in one trade and it is now in all of them: the port, the railway shops, the tramways, the mills along the Olona. There is no fund to break, no leader to arrest and no demand to concede, because nobody drew one up. The furnaces are banked and the country is waiting to see what the government is."
 ITA_p_the_country_divided:0 "The Country Divided"
 ITA_p_the_country_divided_desc:0 "There is a line across the peninsula now with an army on either side of it, and the kingdom that Cavour assembled in eleven years has come apart in a fortnight. Whichever side wins, no conscript from those provinces will be trusted with a rifle for a generation."
 ITA_c_the_ministry_of_transition:0 "A Ministry of Transition"
 ITA_c_the_ministry_of_transition_desc:0 "The King has sent for a man everyone can accept because nobody wants him, and he has undertaken to do nothing at all until the situation clarifies. Every measure is put off to the spring session. The situation does not clarify."
 ITA_c_the_chamber_will_not_vote:0 "The Chamber Will Not Vote"
 ITA_c_the_chamber_will_not_vote_desc:0 "The estimates were laid before the House and the House went home. There is no majority for anything: not for the ministry, not against it, not for the credits, not for a dissolution. The Kingdom is administered by the permanent officials and by nobody else."
 ITA_c_the_majority_returned:0 "The Majority Returned"
 ITA_c_the_majority_returned_desc:0 "Three hundred and some deputies came back with the government, and for two sessions the ministry can put a bill down and know the numbers before the division bell. It will not last, because it never does, but it is the only condition in which anything in this kingdom gets built."
 ITA_repress_tt:0 "§RThe army is used against the crowd.§! The piazza falls by §Y14§! now. The count of bayonets rises by §Y1§!: the floor of the piazza rises §Y4§! and its monthly rise §Y0.25§!, permanently."
 ITA_ministry_falls_tt:0 "§RThe ministry falls.§! The most senior standing of the government's political spirits is lost, and the majority falls by §Y15§!."
 ITA_ungoverned_tt:0 "§RTwo provinces pass out of the government's hands for eight months§! and produce nothing while they are gone."
 ita_dnc.600.t:0 "The Chambers of Labour Vote to Come Out"
 ita_dnc.600.d:0 "It began over a shooting in Sardinia and it is now in Milan, Genoa, Turin and Rome at once, without a central committee, without a demand, and without a fund. The trams have stopped, the port has stopped, and the newspapers are not being printed. Nobody in this ministry has seen a general strike before, because until this week no European country had one.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!."
 ita_dnc.600.a:0 "Send the prefect to sit at the table with them."
 ita_dnc.600.b:0 "The garrison will clear the squares by this evening."
 ita_dnc.600.c:0 "It has no demands. It will exhaust itself."
 ita_dnc.601.t:0 "The Ministry Falls"
 ita_dnc.601.d:0 "The majority that voted the estimates in the spring did not divide with the government tonight, and the men who arranged it are already in the corridor arranging the next one. Nothing was defeated on principle. A hundred deputies simply decided that a ministry with the country in this state is not a ministry worth being counted with.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!, the majority at §Y[?ITA_majority|0]§!."
 ita_dnc.601.a:0 "Send for the same man. He will make another majority."
 ita_dnc.601.b:0 "Send for someone the Chamber has not yet used up."
 ita_dnc.601.c:0 "Ask the King to prorogue the House until it is calmer."
 ita_dnc.602.t:0 "The Province Is Out of Hand"
 ita_dnc.602.d:0 "It started with three men shot at a meeting and it is now a week old. The railway has been torn up outside the city, the telegraph is cut, the tax registers have been burned in the square, and in the smaller towns committees have declared themselves and are issuing bread tickets. The prefect reports that he has no force he can rely on and asks for instructions.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!. No amount of political credit will settle this one."
 ita_dnc.602.a:0 "Two divisions and a state of siege. It ends this month."
 ita_dnc.602.b:0 "Concede what they are asking for, in writing, today."
 ita_dnc.602.c:0 "The prefects will manage it without the army."
 ita_dnc.603.t:0 "The Insurrection"
 ita_dnc.603.d:0 "The Romagna has been out of the government's hands for three months and the rest of the country has stopped pretending otherwise. The reservists called up in the Marche did not report. In Tuscany the garrison commander has asked to be relieved rather than fire. What is being read from the balconies is no longer a list of grievances but a constitution.\n\nThe piazza stands at §Y[?ITA_piazza|0]§!. The kingdom is past the point where a ministry decides anything."
 ita_dnc.603.a:0 "Then it is a war, and we shall fight it."
 ita_dnc.604.t:0 "The Province Is Governed Again"
 ita_dnc.604.d:0 "The committees have dispersed, the prefect is back at his desk, and the registers are being copied out again from the tax rolls in Rome. The line is repaired as far as the junction. Nobody has been prosecuted, which is the only reason it is over."
 ita_dnc.604.a:0 "Let nothing be said about it in the House."
 ita_dnc.700.t:0 "The Circular to the Prefects"
 ita_dnc.700.d:0 "The draft is on the desk and it says nothing that could be read out. It tells ninety prefects which candidates the government regards with favour, which licences may be granted before the poll, and which roads and aqueducts are to be surveyed in which constituencies. It has always been sent. The only question is how hard to write it.\n\nProvinces worked: §Y[?ITA_prefects|0]§!. The machine is worth §Y[?ITA_machine_now|0]§! with the prefectures the ministry already holds."
 ita_dnc.700.a:0 "Write it hard. Promise the works and name the men."
 ita_dnc.700.b:0 "Send it as it has always been sent."
 ita_dnc.700.c:0 "Withdraw it. The prefects will supervise and nothing else."
 ita_dnc.701.t:0 "The General Election"
 ita_dnc.701.d:0 "Two and a half million men have the vote out of thirty-three million Italians, and in half the southern constituencies the poll is a formality arranged in the prefecture. The clergy have quietly been released from the ban in a few dioceses and will vote for the first time since 1870.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.701.a:0 "The prefects will make the returns."
 ita_dnc.701.b:0 "Fight it on what the ministry has actually built."
 ita_dnc.701.c:0 "The government will not touch this election."
 ita_dnc.702.t:0 "The General Election"
 ita_dnc.702.d:0 "The socialists come back stronger from the North whatever is done, and the ministry's answer is the same as ever: find the numbers somewhere else. In the South that means the prefectures. In the Veneto and the Marche it means the parish clergy, who now have an understanding with the government that neither side will put on paper.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects."
 ita_dnc.702.a:0 "The prefects will make the returns."
 ita_dnc.702.b:0 "The sacristy will deliver what the prefecture cannot."
 ita_dnc.702.c:0 "The government will not touch this election."
 ita_dnc.703.t:0 "The First Election of the Whole Country"
 ita_dnc.703.d:0 "The register has gone from two and a half million to eight and a half. Every man over thirty votes now whether he can read or not, and there are constituencies in Apulia and Sicily where the prefect does not know the name of one elector in twenty. The machine that made every majority since Depretis has just been handed an electorate it has never met.\n\nThe majority stands at §Y[?ITA_majority|0]§!, of which §Y[?ITA_majority_bought|0]§! was made by the prefects. The piazza stands at §Y[?ITA_piazza|0]§!."
 ita_dnc.703.a:0 "Nothing can be arranged now. Let the country vote."
 ita_dnc.703.b:0 "Go to the sacristy. It is the only list that still holds."
 ita_dnc.703.c:0 "The register is unchanged. The prefects will make the returns."
 ita_dnc.703.e:0 "The government will not touch this election."
 ita_dnc.705.t:0 "The Returns"
 ita_dnc.705.d:0 "The last constituencies have been declared and the clerks at Montecitorio have finished the arithmetic that decides what kind of ministry this is going to be.\n\nThe majority now stands at §Y[?ITA_majority|0]§! of 100. Above §G55§! the government is returned; between §Y35§! and §Y54§! it holds office without holding the House; below §R35§! it does not govern at all."
 ita_dnc.705.a:0 "The government is returned."
 ita_dnc.705.b:0 "A ministry, then, but not a majority."
 ita_dnc.705.c:0 "There is no government in this Chamber."
 ita_dnc.610.t:0 "The Hour After Monza"
 ita_dnc.610.d:0 "Bresci is in the cell at Milan and will not stop explaining himself. He came home from a silk mill in Paterson, New Jersey, with his fare paid by subscription, to answer the guns Bava Beccaris turned on the bread riots two years ago; and he says so in the tone of a man reading out an invoice.\n\nThe court is in mourning, the Chamber is adjourned, and every prefect in the kingdom is telegraphing for instructions. Whatever goes back over that wire is the constitution of this reign, and it will be quoted in every prefecture for twenty years."
 ita_dnc.610.a:0 "The law of suspects. Every anarchist name into the register, and the registers do not close."
 ita_dnc.610.b:0 "The clemency of the new reign: quash the Milan sentences and let them come home."
 ita_dnc.610.c:0 "The oath to the Statuto, and not one word past it."
 ita_dnc.611.t:0 "The Port That Stopped"
 ita_dnc.611.d:0 "A prefect has dissolved the chamber of labour at Genoa by decree, and the port has answered by stopping. No coal in, no grain in, nothing out of the Ansaldo sheds. The Welsh colliers are riding at anchor in the roads and the furnaces have eleven days of stock behind them.\n\nThe prefect did not invent his authority. He read it in the circulars, and the circulars came from us."
 ita_dnc.611.a:0 "The prefect is sustained. The hall stays shut and the quays are cleared."
 ita_dnc.611.b:0 "The prefect is recalled and the decree withdrawn over his own signature."
 ita_dnc.611.c:0 "Neither. Let the shipowners and the league find the bottom of it themselves."
 ita_dnc.612.t:0 "The Ministry of the Left"
 ita_dnc.612.d:0 "Zanardelli is seventy-five and has agreed to be Prime Minister on the understanding that somebody else does the work. The somebody is a Piedmontese ex-official of the Treasury with no oratory, no faction and a complete card index of the prefectures.\n\nThe King has asked him what he intends to do about the strikes. He intends, he says, to let them happen. The Chamber has not yet decided whether that is statesmanship or abdication, and neither has the country."
 ita_dnc.612.a:0 "Giolitti to the Interior. The prefects answer to him and to nobody else."
 ita_dnc.612.b:0 "Zanardelli's programme entire: the state stands out of the strikes, and says so in the Gazette."
 ita_dnc.612.c:0 "Sonnino instead. Torniamo allo Statuto: the Crown governs and the Chamber approves."
 ita_dnc.623.t:0 "The Agents at the Quayside"
 ita_dnc.623.d:0 "Six hundred thousand a year now. The agents meet them at the station in Naples with a ticket, a contract in a language they cannot read, and a bunk below the waterline. Two hundred drowned off Cape Palos last spring in a hull that had no business carrying passengers, and the consulate learned of it from the newspapers.\n\nThe bill creating a Commissariat of Emigration is drafted. The shipping houses of Genoa and Naples hold eleven seats between them, and they have read it."
 ita_dnc.623.a:0 "The Commissariat sails with them: fares fixed, hulls surveyed, consuls answerable."
 ita_dnc.623.b:0 "The law goes on the statute book and the trade goes on as before."
 ita_dnc.623.c:0 "Land before the ship. Drain the Basilicata and they will not need the Brazil office."
 ita_dnc.613.t:0 "Buggerru"
 ita_dnc.613.d:0 "The Sardinian pits at Buggerru struck over the hour they are made to lose at the coal face, and the company wrote to the prefect asking for troops. The troops came, and the troops fired: three men dead in the road up to the washery and eleven in the infirmary.\n\nThe telegraph out of Sardinia is slow. By the time the Chamber of Labour at Milan has the story it will have been improved in the telling, and it will be true enough."
 ita_dnc.613.a:0 "Court-martial the lieutenant and move the regiment off the island."
 ita_dnc.613.b:0 "The troops were stoned first. The file is closed and the officer is confirmed."
 ita_dnc.613.c:0 "An inquiry, appointed at once, to report when the Chamber is in recess."
 ita_dnc.614.t:0 "Six Days in September"
 ita_dnc.614.d:0 "Milan struck first and Genoa followed the same evening; then Turin, then Rome, then Bologna. By Sunday there is no train moving north of Florence and no newspaper printing but the socialist ones. Nobody ordered it. The Chamber of Labour telegraphed the news from Sardinia and the country did the rest.\n\nNo European state has seen this before. There is no article of the code that fits it and no precedent to send to the prefects, and the ministry has nothing to consult but its own nerve."
 ita_dnc.614.a:0 "The state takes no side. It ends when the strike fund does, and not one day earlier."
 ita_dnc.614.b:0 "The garrisons out. Every station, every gasworks and every tram shed under guard by morning."
 ita_dnc.614.c:0 "Give the leagues what they are asking, and let the Chamber settle the account in February."
 ita_dnc.615.t:0 "The Dissolution"
 ita_dnc.615.d:0 "The strike is over and it changed nothing except everything. The ministry will not sit through a session answering for it, so the Chamber goes home and the country is asked instead.\n\nThe prefects are already writing, in the careful phrasing the service keeps for this, to ask what degree of assistance the government's friends may look for in their constituencies. There are ninety days and five hundred and eight seats."
 ita_dnc.615.a:0 "Work the prefectures. A candidate who wants the seat comes to the Interior first."
 ita_dnc.615.b:0 "Fight it on the strike itself, and let the country say what it thought of it."
 ita_dnc.615.c:0 "Ask the prefects for nothing. The result will be the result."
 ita_dnc.624.t:0 "The Lockout in the Bassa"
 ita_dnc.624.d:0 "Fifty thousand day labourers are out across the province of Parma and the agrarian association has answered with a lockout, a private guard and a subscription list. The children have been sent north to socialist families in Genoa and Milan, in convoys, with bands playing, which the newspapers of the right are calling abduction.\n\nThe prefect wants cavalry. Both sides have stated in writing that they will accept arbitration, on the condition that it goes their way."
 ita_dnc.624.a:0 "Cavalry to the prefect. The camera del lavoro at Parma is closed."
 ita_dnc.624.b:0 "Both parties before a board, a minister presiding, and the award binding on each."
 ita_dnc.624.c:0 "Neither. The harvest is six weeks off and it will settle what we cannot."
 ita_dnc.616.t:0 "The Relief and the Reckoning"
 ita_dnc.616.d:0 "Ten days on. Messina and Reggio are rubble under rain, the count of the dead has passed eighty thousand, and the first organised parties ashore were Russian sailors from a squadron that happened to be lying at Augusta, with British boats behind them. Our own transports came third.\n\nSurvivors are being shot for looting by soldiers who landed after the Russians did. Every newspaper in Europe has that sentence set in type, and so has every deputy who intends to use it."
 ita_dnc.616.a:0 "Martial law in the Straits. The relief is a military operation and the prefects stand down."
 ita_dnc.616.b:0 "Every foreign squadron stays as long as it is useful, and we thank them from the tribune."
 ita_dnc.616.c:0 "Rebuild by decree, to a seismic code, and let the Chamber ratify it when it dares."
 ita_dnc.625.t:0 "The Congress at Florence"
 ita_dnc.625.d:0 "Two hundred of them in a hall on the Via Cavour: professors, poets, a retired admiral and the editors of four newspapers that did not exist last year. They have voted themselves an Association, a programme and a weekly, and the programme holds that the emigrant ships are a national humiliation which a war would cure.\n\nThey have no seats and no funds worth counting. They have Corradini, who writes better than anyone in the Chamber, and a country full of men who went to Brazil because there was nothing for them here."
 ita_dnc.625.a:0 "Let them talk. They sell newspapers. They do not carry constituencies."
 ita_dnc.625.b:0 "Take the programme and leave them the name: say from the tribune that Tripoli is Italian."
 ita_dnc.625.c:0 "Prosecute the loudest of them for incitement and see how the subscriptions hold."
 ita_dnc.617.t:0 "Tripoli"
 ita_dnc.617.d:0 "The note gives the Porte twenty-four hours and asks for a thing no Sultan can grant and keep his throne. The Banco di Roma has been buying land around Tripoli for four years and would now like to be paid for it in sovereignty. The nationalist press has printed the map so often that half the country believes the place is already ours.\n\nThe General Staff was told a fortnight ago. The Chamber has not been told at all, and is not sitting."
 ita_dnc.617.a:0 "The note goes tonight. The papers say four weeks and the Staff has not contradicted them."
 ita_dnc.617.b:0 "Not this year. Tell the Banco di Roma to sell its holdings to whoever will take them."
 ita_dnc.617.c:0 "Send it in the recess. The Chamber can approve the war it finds waiting in February."
 ita_dnc.617.e:0 "The war is already ours. The vote is a formality and the ministry will collect it."
 ita_dnc.619.t:0 "The Register"
 ita_dnc.619.d:0 "The bill lays it before the Chamber in a single clause. Every male subject of thirty, whether he can read or not; every man of twenty-one who has served with the colours. Eight and a half million electors where there were three, and most of the new ones live in places the deputy has never had to visit.\n\nThe whips have done the arithmetic and have not shown it to the Prime Minister. He did it himself a year ago, and proposed the bill anyway."
 ita_dnc.619.a:0 "Pass it whole. Thirty years, literate or not, and the soldiers at twenty-one."
 ita_dnc.619.b:0 "Announce the reform and leave the literacy test in committee."
 ita_dnc.619.c:0 "No. The Chamber we have was chosen by the part of the country that can read."
 ita_dnc.618.t:0 "The Year It Does Not End"
 ita_dnc.618.d:0 "Twelve months. The coast towns are ours down to the last customs house and nothing behind them is. The columns that go inland come back thinner and with no map worth the paper; the Senussi decline battle and have no need of it.\n\nTwo hundred and fifty thousand men are in Africa or on their way, a class has been held with the colours, and the socialist press prints the casualty lists in full because it is the only thing the censor lets it print. In the Romagna a schoolmaster's son has been expelled from his own party for being insufficiently against this war. He is against it now."
 ita_dnc.618.a:0 "Take the islands. Rhodes and the Dodecanese, and let the Porte feel it in the Aegean."
 ita_dnc.618.b:0 "Ouchy. Sign whatever ends it and call what is left the Fourth Shore."
 ita_dnc.618.c:0 "Stay. Garrison it, wire it, and wait for the Senussi to tire before we do."
 ita_dnc.620.t:0 "The Lists of Count Gentiloni"
 ita_dnc.620.d:0 "There is no treaty, no announcement and no signature anywhere. There is a list of the government's candidates whom the parish clergy may lawfully recommend, and seven points those candidates undertake not to vote against: the schools, the orders, divorce.\n\nThe Vatican has not lifted the non expedit and will not. It has simply stopped enforcing it in three hundred and thirty constituencies, and it can start again."
 ita_dnc.620.a:0 "Sign the seven points. The clergy will do the rest in every parish that has one."
 ita_dnc.620.b:0 "Nothing in writing, nothing denied, and the lists circulate regardless."
 ita_dnc.620.c:0 "Run against the sacristy. A ministry that owes the bishops cannot govern the Left."
 ita_dnc.621.t:0 "Red Week"
 ita_dnc.621.d:0 "Three dead at Ancona at an antimilitarist meeting, and the country went up in four days. Ravenna and Ancona are in the hands of committees, the line is cut at Fabriano, a republic has been proclaimed in at least two towns of the Romagna and in one of them the tricolour has come down.\n\nThe General Confederation called the general strike on Tuesday and is privately trying to work out how to call it off. Malatesta is somewhere in the Marches; so, since Thursday, are ten thousand troops who cannot find him."
 ita_dnc.621.a:0 "A hundred thousand men into the Romagna and the Marches, and the committees broken up in their own squares."
 ita_dnc.621.b:0 "Wait. The Confederation will call it off inside the week because it must."
 ita_dnc.621.c:0 "Concede the thing they are actually out for: abolish the disciplinary companies."
 ita_dnc.622.t:0 "What the Alliance Was Worth"
 ita_dnc.622.d:0 "Vienna sent her ultimatum to Belgrade without consulting us, which Article VII says she may not do, and asked for our support after posting it. Berlin assumes we are coming. The Consulta has taken the treaty out of the safe and read it aloud twice, and it does not improve.\n\nThe army has not finished digesting Libya. The Chamber is the one the country elected under the register we gave it. Whatever the ministry decides this week it decides alone, and it will be right or wrong for thirty years."
 ita_dnc.622.a:0 "March with them. The treaty says what it says and a signature is a signature."
 ita_dnc.622.b:0 "Article VII was not honoured. We are not bound, and we say so from the tribune today."
 ita_dnc.622.c:0 "Neutral, and not free of charge. Let both sides tell us what Trento is worth to them."
 ITA_chronicle_answered_tt:0 "§YThe decade takes one more entry. Beats answered so far: §Y[?ITA_chron_answered|0]§!"
 ITA_ch_already_out_tt:0 "§RThe country was already in the streets when the shots were fired.§!"
 ITA_ch_the_prefect_did_not_ask_tt:0 "§RThe prefect did not telegraph first. The ministry learned of the decree from the newspapers.§!"
 ITA_ch_nobody_else_would_take_it_tt:0 "§RNobody else would take the Interior. The King's choice is not a choice.§!"
 ITA_ch_the_trade_is_already_theirs_tt:0 "§RThe agents already have the trade, and the quaysides know it.§!"
 ITA_ch_the_army_was_already_out_tt:0 "§RThe army was out elsewhere before it was out here. Buggerru is not an incident, it is a pattern.§!"
 ITA_ch_the_strike_took_the_railways_tt:0 "§RThe strike has taken the railways north and south.§!"
 ITA_ch_dissolved_over_bayonets_tt:0 "§RThe Chamber is dissolved by a ministry that used troops. Every platform in the country will say so.§!"
 ITA_ch_the_boards_are_tested_tt:0 "§GThe arbitration boards exist. Parma is the first weight they have been asked to hold.§!"
 ITA_ch_messina_on_a_country_out_tt:0 "§RThere are no troops to spare for the Straits. They are holding the cities.§!"
 ITA_ch_messina_the_contracts_tt:0 "§RThe reconstruction contracts are placed before the rubble is cleared, and the Chamber knows which deputies placed them.§!"
 ITA_ch_messina_a_quiet_country_tt:0 "§GA quiet country lets a government be seen to govern.§!"
 ITA_ch_the_last_reserves_tt:0 "§RThe last reserves go south. The cities are held by nobody.§!"
 ITA_ch_the_nationalists_have_an_audience_tt:0 "§RAn angry country is an audience, and the Association has found one.§!"
 ITA_ch_the_papers_have_promised_it_tt:0 "§RThe newspapers have promised this war on the ministry's behalf.§!"
 ITA_ch_asked_in_the_street_tt:0 "§RThe reform is being demanded outside the Chamber before it is moved inside it.§!"
 ITA_ch_the_whips_can_count_tt:0 "§RThe whips have counted the bought seats and know exactly what a mass register costs.§!"
 ITA_ch_the_bought_seats_will_not_hold_tt:0 "§RThe seats bought through the prefectures will not survive the next election.§!"
 ITA_ch_the_coast_is_ours_tt:0 "§YThe coast is ours. The interior has not been informed.§!"
 ITA_ch_the_socialists_have_their_issue_tt:0 "§RThe war has handed the maximalists the argument they were short of.§!"
 ITA_ch_the_reservists_will_not_go_tt:0 "§RThe reservists called for Africa have already been used against their own towns.§!"
 ITA_ch_gentiloni_the_new_register_tt:0 "§YUnder the new register the clergy can deliver more votes than the prefects ever could.§!"
 ITA_ch_gentiloni_the_old_register_tt:0 "§YUnder the old register the pact is worth less. The prefects still hold the seats.§!"
 ITA_ch_red_week_held_tt:0 "§YThe provinces hold, barely, and the line is cut in one place only.§!"
 ITA_ch_july_the_country_will_not_march_tt:0 "§RThe country will not march. It has been in the streets all summer and it knows who put it there.§!"
 ITA_ch_july_no_majority_tt:0 "§RThere is no majority to carry a war vote, and the whips have said so in writing.§!"
 ITA_ch_july_the_army_is_in_the_streets_tt:0 "§RThe army is holding Italian towns. It cannot be asked to hold a front as well.§!"
 ITA_ch_the_law_of_suspects:0 "The Law of Suspects"
 ITA_ch_the_law_of_suspects_desc:0 "The register at the Interior has a card for every anarchist in the kingdom, every subscriber to an anarchist paper, and every man seen at a meeting where one spoke. It works: the ministry knows things it did not know. It also tells several hundred thousand people who were not anarchists last year exactly which side the state has taken, and the emigration offices in Naples are busier than they were."
 ITA_ch_the_amnesty_of_the_new_reign:0 "The Amnesty of the New Reign"
 ITA_ch_the_amnesty_of_the_new_reign_desc:0 "The Milan sentences are quashed and the men come home to bands at the station. The reign begins with a gesture nobody in the Chamber advised and half the Senate regards as an insult to the dead King. It buys something that cannot be bought any other way, and it is spent the moment it is made."
 ITA_ch_the_port_that_stopped:0 "The Port That Stopped"
 ITA_ch_the_port_that_stopped_desc:0 "Genoa lands two thirds of what the industrial triangle burns, and Genoa is shut. The colliers wait in the roads on demurrage, the grain sits in the holds, and Ansaldo has sent its fitters home. Every day of this is a week somewhere inland."
 ITA_ch_the_ministry_of_the_left:0 "The Ministry of the Left"
 ITA_ch_the_ministry_of_the_left_desc:0 "An old orator in front and a card index behind him. The prefectures have a minister who reads their reports, remembers them, and answers by return; the Chamber has a leader who can count. It is not a programme and does not pretend to be one, but it governs, which is more than the last four ministries managed."
 ITA_ch_the_agents_of_the_ports:0 "The Agents of the Ports"
 ITA_ch_the_agents_of_the_ports_desc:0 "The law exists and is not enforced, which suits everyone who wrote it. The agents keep the trade, the fares stay what the traffic will bear, and the men keep going: from the Veneto, from the Basilicata, from villages that will have no men of military age in them by the time the class is called. The state is not paying for this. It is simply losing them."
 ITA_ch_the_officers_grievance:0 "The Officers' Grievance"
 ITA_ch_the_officers_grievance_desc:0 "A lieutenant has been tried for obeying an order the prefect gave and the ministry did not withdraw. The mess at every garrison in the kingdom has now worked out that the state will send them into a piazza and then disown them for what happens there. They will still go. They will go slowly, and they will not volunteer."
 ITA_ch_the_troops_were_right:0 "The Troops Were Right"
 ITA_ch_the_troops_were_right_desc:0 "The officer is confirmed in his rank, the file is closed, and the army knows the state stands behind the rifle. So does everybody else. There is a discipline in the barracks that was not there last year, and a hardness in the leagues that was not there either, and the second will outlast the first."
 ITA_ch_the_general_strike:0 "The General Strike"
 ITA_ch_the_general_strike_desc:0 "No train, no tram, no gas, no press but one. Nobody in Europe has done this before and nobody is certain how it stops. Whatever else it proves, it has proved that the country can be halted by men who own nothing and hold no office, and every ministry from now on will govern with that fact in the room."
 ITA_ch_the_lockout_of_parma:0 "The Lockout in the Bassa"
 ITA_ch_the_lockout_of_parma_desc:0 "The agrarians have money and time and the leagues have neither, so the fields stand and the bassa eats what the subscription lists send it. The children are in Genoa. The province is being run by two private organisations, neither of which is the prefecture."
 ITA_ch_the_seismic_decree:0 "The Seismic Decree"
 ITA_ch_the_seismic_decree_desc:0 "The Straits are rebuilt to a code written by engineers and imposed by decree, over the heads of the Chamber, the province and everyone who owned a building in Messina. It is the best piece of administration the kingdom has done in twenty years, and it was done in a way the constitution does not contemplate."
 ITA_ch_the_africa_of_the_newspapers:0 "The Africa of the Newspapers"
 ITA_ch_the_africa_of_the_newspapers_desc:0 "The ministry has said from the tribune what the nationalist weeklies have been saying for a year: that Tripoli is Italian and only the date is in question. The country liked it. So did the Association, which has now been told by the government itself that its programme is the government's, and will hold the ministry to it."
 ITA_ch_the_war_that_was_not_declared:0 "The War That Was Not Declared"
 ITA_ch_the_war_that_was_not_declared_desc:0 "The note was drafted and not sent. The Banco di Roma is selling its Tripolitanian holdings at whatever it can get, the nationalist press has found the word renunciation and will not put it down, and a Chamber that had already been promised a colony has been handed a prudent explanation instead. The peace is real. So is the bill for it."
 ITA_ch_the_desert_that_pays_nothing:0 "The Desert That Pays Nothing"
 ITA_ch_the_desert_that_pays_nothing_desc:0 "A year in, and the war consists of holding the coast against people who do not want the coast. The columns march, find nothing, and are shot at on the way back. The class held with the colours is a year older, the casualty lists are printed in full, and the men writing against the war in the Romagna are getting a hearing they never had in peacetime."
 ITA_ch_the_garrison_of_the_fourth_shore:0 "The Garrison of the Fourth Shore"
 ITA_ch_the_garrison_of_the_fourth_shore_desc:0 "Forts, wire, wells and blockhouses from Zuara to Derna, held by conscripts who did not expect Africa, resupplied by sea because there is no other way. It is permanent now, and it is subtracted from every other thing the army might be asked to do."
 ITA_ch_the_wider_register:0 "The Wider Register"
 ITA_ch_the_wider_register_desc:0 "Eight and a half million electors, most of whom have never voted and owe nothing to anybody. The Socialists have a constituency, the Catholics have a constituency, and the deputy who used to be returned by four hundred notables and a prefect's letter no longer knows who is in his own division. This is what was asked for. It cannot be given back."
 ITA_ch_the_register_unrevised:0 "The Register Unrevised"
 ITA_ch_the_register_unrevised_desc:0 "The reform was announced in the Chamber and the literacy test stayed in committee, where it will be studied. The country has been told it has the vote and has not been given it, which quiets the tribune for a session and settles nothing at all."
 ITA_ch_the_romagna_remembers:0 "The Romagna Remembers"
 ITA_ch_the_romagna_remembers_desc:0 "The committees are broken, the tricolour is back up, and the Romagna has learned exactly what the state will do and how long it takes to do it. The men who ran those four days are alive, at liberty, and no longer arguing among themselves about method."
 ITA_ch_the_barracks_reform:0 "The Barracks Reform"
 ITA_ch_the_barracks_reform_desc:0 "The disciplinary companies are abolished and the punishment regulations rewritten, which is what the meeting at Ancona was called about in the first place. The country is quieter than it has been since the strike. The General Staff has put its objection in writing and asked that it be filed where it can be found later."
 ITA_ch_the_alliance_honoured:0 "The Alliance Honoured"
 ITA_ch_the_alliance_honoured_desc:0 "The treaty was kept. Italy marches with the partner she has spent thirty years distrusting, for a quarrel about Serbia, over an ultimatum she was not shown. The army is better for having a decision. The country was not asked, and the party that will tell it so is already writing."
 ITA_ch_the_scrap_of_paper:0 "The Letter of the Treaty"
 ITA_ch_the_scrap_of_paper_desc:0 "Article VII required consultation and there was none, so the casus foederis does not arise. The lawyers are right, the Consulta is right, and the ministry has read the finding aloud from the tribune. Vienna calls it desertion. The country calls it the first sensible thing done in Rome since Ouchy, and means it."
 ITA_ch_the_hands_are_free:0 "The Hands Are Free"
 ITA_ch_the_hands_are_free_desc:0 "Neutral, and letting it be known in both capitals that neutrality has a price and a shelf life. Two embassies now have an interest in improving their offer and neither can be certain of us. It is not a policy anyone would put in a despatch, and it is worth more than one."
 ITADNC_z_the_chamber_adjourned_indefinitely:0 "The Chamber Adjourned"
 ITADNC_z_the_chamber_adjourned_indefinitely_desc:0 "The session closes and no date is set for the next one. The decrees have done every piece of governing worth doing for two years, and the deputies have learned to read the Gazzetta for their instructions. Nobody dissolves anything. The building simply stops being the place where Italy is decided."
 ITADNC_z_the_ministry_of_the_extreme_left:0 "The Ministry of the Extreme Left"
 ITADNC_z_the_ministry_of_the_extreme_left_desc:0 "Turati will not take a portfolio, so Bissolati's people take five, and the King signs the list with the face of a man signing a bill. Half a million new voters put them there. The Consulta hands them the file on Libya and the file on the Adriatic and waits to see what a reformist does with them."
 ITADNC_z_the_reckoning_of_the_decade:0 "The Reckoning of the Decade"
 ITADNC_z_the_reckoning_of_the_decade_desc:0 "Fourteen years of it. The prefects have counted the majority, the questori have counted the piazza, and both figures are now on the same sheet of paper in the Interior. Whatever this kingdom has been made into, it is that thing now, and Europe is about to put a question to it that cannot be postponed."
 ITADNC_z_the_columns_come_home:0 "The Columns Come Home"
 ITADNC_z_the_columns_come_home_desc:0 "Order the garrisons back to the coast: Tripoli, Homs, Benghazi, Derna, and nothing inland that cannot be reached from a ship. The interior goes to men who were never beaten, the flag stays over five towns, and the General Staff will call it a defeat in writing for the next twenty years."
 ITA_z_the_chamber_adjourned:0 "The Chamber Adjourned"
 ITA_z_the_chamber_adjourned_desc:0 "No dissolution, no proclamation, no crisis: only a session that ends and is not reconvened. The ministry governs by decree because the decree is quicker, and quickness has become the only argument anyone makes. The deputies still draw the allowance. They have simply stopped being consulted."
 ITA_z_the_extreme_left_in_office:0 "The Extreme Left in Office"
 ITA_z_the_extreme_left_in_office_desc:0 "Reformists at the Interior, at Labour, at Public Instruction. The prefects who spent a decade counting votes now take instructions from men they used to have followed. The chambers of labour are answered instead of dissolved, and every general in the kingdom has written privately to the King about it."
 ITA_end_the_state_that_chose:0 "The State That Chose"
 ITA_end_the_state_that_chose_desc:0 "Universal suffrage, a Chamber that was not bought, and a piazza that is loud without being ungovernable. Nobody in Europe expected this from Italy and a good many people in Rome did not either. The kingdom enters the crisis of 1914 as the only great power that will decide its own part in it from a position of quiet."
 ITA_end_the_country_was_asked:0 "The Country Was Asked"
 ITA_end_the_country_was_asked_desc:0 "No war without a vote, said aloud and then written down. It makes the ministry slow, it makes the General Staff furious, and it makes any decision Italy reaches almost impossible to reverse afterwards, because the whole country signed it."
 ITA_end_the_ministry_decides_alone:0 "The Ministry Decides Alone"
 ITA_end_the_ministry_decides_alone_desc:0 "The prerogative in foreign affairs belongs to the Crown and its ministers, and the Chamber is informed. It is legal, it is fast, and it means that whatever Italy does next will have been done by eleven men who can be named."
 ITA_end_the_bargain_of_1914:0 "The Bargain"
 ITA_end_the_bargain_of_1914_desc:0 "Terms discussed in a room in London: the Trentino, Trieste, the Istrian coast, Valona, a share of whatever comes apart. Nothing is signed where anyone can see it, and the ambassador in Vienna is not told. Italy has decided who it will be when the war comes, and has decided it in advance and at a price."
 ITA_end_the_word_kept:0 "The Word Kept"
 ITA_end_the_word_kept_desc:0 "The Triple Alliance is thirty years old, the staff talks are current, and Italy marches with Berlin and Vienna because it said it would. Half the Chamber thinks this is madness and the irredentists think it is treason, but no chancellery in Europe will ever again say that an Italian signature means nothing."
 ITA_end_out_by_our_own_decision:0 "Out, by Our Own Decision"
 ITA_end_out_by_our_own_decision_desc:0 "Not neutrality bought, not neutrality forced, and not neutrality from weakness: a kingdom that could have gone either way and told both sides no. The factories keep running, the emigrants keep their sons, and Italy will be present at the peace as the one power with nothing to explain and nothing to claim."
 ITA_end_the_kingdom_by_decree:0 "The Kingdom by Decree"
 ITA_end_the_kingdom_by_decree_desc:0 "Public safety decrees, prefects with a free hand, garrisons quartered in the industrial towns, and a Chamber that meets when it is convenient. It works. Taxes are collected, order is kept, and the ministry can do in a week what used to take a session. Nobody has a word for this yet. Everyone can feel that it does not bend."
 ITA_end_the_ministry_of_the_sword:0 "The Ministry of the Sword"
 ITA_end_the_ministry_of_the_sword_desc:0 "A general at the Interior, a general at the Council, and the Carabinieri answering to both. The army has stopped being the last argument of the state and become its ordinary one, which is a thing armies enjoy for about four years."
 ITA_end_the_civil_mask:0 "The Civil Mask"
 ITA_end_the_civil_mask_desc:0 "A lawyer at the Interior, a professor at Public Instruction, and every decree countersigned by a man in a frock coat. The powers are exactly the same. The photographs are different, and in Italy the photographs have always mattered more than anybody admits."
 ITA_end_the_chamber_recalled:0 "The Chamber Recalled"
 ITA_end_the_chamber_recalled_desc:0 "The deputies come back to a building they had stopped visiting, and spend the first four sittings on the question of who is to blame. The decrees are lifted one by one. It costs the ministry every friend it had in the prefectures, and it is the only thing that stops the country coming apart."
 ITA_end_the_ministry_of_the_left:0 "The Ministry of the Extreme Left"
 ITA_end_the_ministry_of_the_left_desc:0 "The first socialist ministry in Europe, made by a franchise the liberals themselves granted. It will not arm, it will not ally, and it will not send a single class to a war it did not choose. Every embassy in Rome has been instructed to treat the kingdom, for the moment, as a country that is not there."
 ITA_end_the_party_splits:0 "The Party Splits"
 ITA_end_the_party_splits_desc:0 "Bissolati took office and Mussolini took the newspaper, and by autumn there are two socialisms in Italy that will not sit in the same hall. The ministry survives on the votes of men who despise it, which in this Chamber is not unusual and is never comfortable."
 ITA_end_the_price_abroad:0 "The Price Paid Abroad"
 ITA_end_the_price_abroad_desc:0 "The columns are off the caravan roads, the ascari are paid off, and the consulates report that the kingdom's word is being discounted from Constantinople to Addis Ababa. This is what neutrality cost, and it was always going to be charged somewhere other than at home."
 ITA_end_the_pledge_we_kept:0 "The Pledge We Kept"
 ITA_end_the_pledge_we_kept_desc:0 "Rhodes and the twelve islands were taken as security and are not being given back, whatever was promised at Ouchy and whatever the Porte says now. A socialist ministry holding a conquest it voted against is a thing the cartoonists will not let go of."
 ITA_end_the_state_after_the_rising:0 "The State After the Rising"
 ITA_end_the_state_after_the_rising_desc:0 "Ten days, four provinces, and something over a hundred dead before the columns had the railway junctions back. The kingdom that came out of the Romagna is not the kingdom that went in: it knows now exactly what it is prepared to do, and so does everybody else."
 ITA_end_the_provinces_that_left:0 "The Provinces That Left"
 ITA_end_the_provinces_that_left_desc:0 "Ancona, Ravenna, Forli, and half the Marche are administered by committees the prefects cannot name. Taxes are not remitted, conscripts are not delivered, and the ministry has decided that the honest word for the situation is one it will not use in the Chamber."
 ITA_end_the_ministry_from_the_streets:0 "The Ministry from the Streets"
 ITA_end_the_ministry_from_the_streets_desc:0 "The King sent for the men whose arrest he had authorised the previous week, and they came. The rising ends because the government becomes the thing it was raised against. It is the cheapest way this could have ended and there is not a colonel in the kingdom who will forgive it."
 ITA_end_the_kingdom_that_came_out_of_it:0 "The Kingdom That Came Out of It"
 ITA_end_the_kingdom_that_came_out_of_it_desc:0 "Whatever was decided in those ten days is now simply how Italy is governed, and the argument about it has moved from the streets into the histories. A state that has survived its own worst week has a certain hardness afterwards, and pays for it in every other way."
 ITA_end_the_crown_that_would_not_sign:0 "The Crown That Would Not Sign"
 ITA_end_the_crown_that_would_not_sign_desc:0 "The King refused a second state of siege and let a ministry fall rather than sign it. It is the only genuinely popular act of his reign and it has cost him the confidence of the General Staff, the prefects, and his own household."
 ITA_end_the_army_that_cannot_come_home:0 "The Army That Cannot Come Home"
 ITA_end_the_army_that_cannot_come_home_desc:0 "Fifty thousand men between Tripoli and the Fezzan, holding wells against people who do not need to hold anything. Italy is a great power with an army it cannot move, and every chancellery in Europe has done the arithmetic and written Rome off for the season."
 ITA_end_next_year_in_the_fezzan:0 "Next Year in the Fezzan"
 ITA_end_next_year_in_the_fezzan_desc:0 "Another column, another oasis, another dispatch promising that the interior will be pacified before the rains. The troops learn a great deal about desert marching, the treasury learns nothing at all, and the phrase has become a joke in the Chamber that nobody laughs at."
 ITA_end_the_coast_only:0 "The Coast Only"
 ITA_end_the_coast_only_desc:0 "Five towns, a garrison in each, and a line on the map that stops where the guns of the fleet stop. It is not the fourth shore that was promised from a hundred platforms, but the men are back within reach of a transport and the ration returns fit on one page."
 ITA_end_the_staff_that_was_overruled:0 "The Staff That Was Overruled"
 ITA_end_the_staff_that_was_overruled_desc:0 "The General Staff asked for two more divisions and one more year and was refused by civilians, in writing, with reasons. They have kept the copy. Every failure of the next decade will be explained by reference to it, whatever the actual cause turns out to be."
 ITA_end_the_columns_that_came_home:0 "The Columns That Came Home"
 ITA_end_the_columns_that_came_home_desc:0 "Battalions off the transports at Naples and Taranto, thin, yellow, and quiet, marching through towns that had been told for two years they were winning. The army is available again. What it is available for is now a much harder question to answer in public."
 ITA_end_the_decade_in_the_sand:0 "The Decade in the Sand"
 ITA_end_the_decade_in_the_sand_desc:0 "The best infantry in the kingdom has spent its whole service escorting water. They can march, they can shoot, and they cannot be brought to Europe inside a year. Nobody in Rome will say aloud that Libya has cost Italy the only decade that mattered."
 ITA_end_the_accidental_ministry:0 "The Accidental Ministry"
 ITA_end_the_accidental_ministry_desc:0 "Nothing was settled, so a ministry took office that nobody voted for, led by a man nobody chose, resting on a majority that was assembled in a corridor. It will do for the ordinary business of the kingdom. The crisis of 1914 is not the ordinary business of the kingdom."
 ITA_end_the_men_in_the_room:0 "The Men in the Room"
 ITA_end_the_men_in_the_room_desc:0 "Four signatures, no debate, and the Chamber informed afterwards by telegram. Italy can be committed to anything in a fortnight now, which is exactly the argument for the arrangement and exactly the reason the country will not stand behind whatever is decided."
 ITA_end_the_old_man_recalled:0 "The Old Man Recalled"
 ITA_end_the_old_man_recalled_desc:0 "Giolitti comes back the way he always comes back: without a programme, without a speech, and with a list of names. The machine turns over on the first attempt. He will not take the kingdom to war, and he has never once in his life explained himself."
 ITA_end_the_brittle_kingdom:0 "The Brittle Kingdom"
 ITA_end_the_brittle_kingdom_desc:0 "Order without consent holds perfectly until the day it does not. Every month of decrees, every garrison in a factory town, every session not convened adds another degree of stiffness to a structure that has no way left of bending. The figure below is how far it has gone."
 ita_dnc.710.t:0 "The Kingdom Chooses"
 ita_dnc.710.d:0 "There is no crisis. That is the remarkable thing, and every ambassador in Rome has written home about it in the same puzzled tone.\n\nThe franchise is nearly universal and the majority survived it. The chambers of labour negotiate with prefects instead of being dissolved by them. The army has not been called into a piazza in years and the officers have stopped expecting it. There is no state of siege anywhere in the kingdom, and the last of the public safety decrees lapsed without anyone bothering to renew it.\n\nItaly is the poorest of the great powers and the only one that is not afraid of its own people. In a Europe that is loading, that turns out to be a form of strength nobody had a name for."
 ita_dnc.710.a:0 "Then no war without a vote of the Chamber."
 ita_dnc.710.b:0 "The prerogative stays with the ministry."
 ita_dnc.711.t:0 "The Choice of 1914"
 ita_dnc.711.d:0 "Three files on the table at the Consulta. London and Paris will discuss the Trentino, Trieste and the Adriatic coast, and want to know the price. Berlin and Vienna point at a treaty signed in 1882 and renewed four times, and want to know whether an Italian signature is worth anything. The third file is empty, and is the only one that costs nothing to choose.\n\nWhichever is picked up, it will be picked up by a government that could have picked up either of the others. Very few countries in Europe will be able to say that in August."
 ita_dnc.711.a:0 "Hear what London is offering."
 ita_dnc.711.b:0 "We signed it. We will honour it."
 ita_dnc.711.c:0 "Neither. And we will say so first."
 ita_dnc.720.t:0 "The Kingdom by Decree"
 ita_dnc.720.d:0 "Count what is in force. Public safety decrees in nine provinces. Garrisons quartered in the factory towns of the North on a footing that was supposed to last a fortnight. Prefects empowered to dissolve any association by their own signature. A Chamber that meets, votes the estimates, and goes home.\n\nIt works. That is the difficulty. Order is kept, the taxes come in, and the ministry can do in eight days what the Chamber used to spend a session refusing. There is no word yet for a state governed this way, and there will not be one for another decade.\n\nWhat there is, instead, is a structure with nothing left in it that bends. Everything it can do, it does by force, and the amount of force required goes up every year."
 ita_dnc.720.a:0 "Then let it be a soldier who signs."
 ita_dnc.720.b:0 "Keep a civilian face on it."
 ita_dnc.721.t:0 "The Crack"
 ita_dnc.721.d:0 "It begins over something trivial, as these things do: a tram fare in Turin, or a foreman in Sesto San Giovanni, and within a week it is in four cities and the prefects are asking for troops that have already been promised somewhere else.\n\nThe machinery of decree has no lower setting. It can proclaim, arrest and quarter, and it cannot negotiate, because negotiating would concede that there is somebody to negotiate with. The Interior is now recommending measures that would have been thought insane in 1898.\n\nThe alternative is to recall the deputies, admit in front of them that the last several years were a mistake, and let them say so at length."
 ita_dnc.721.a:0 "More decrees. It has always worked before."
 ita_dnc.721.b:0 "Recall the Chamber."
 ita_dnc.730.t:0 "The Ministry of the Extreme Left"
 ita_dnc.730.d:0 "The King has signed the list. He signed it in the manner of a man paying a debt he disputes, but he signed it, and by evening there are socialists at the Interior and at Public Instruction and the Corriere has printed a black border round its own leading article.\n\nThey were put there by the franchise the liberals granted. That is the part nobody in the old majority can answer: it was legal, it was foreseeable, and it was done with the votes of men who had never voted before and had been told for a decade that this was progress.\n\nThe first act of the new ministry is a circular to every embassy. Italy will not arm beyond its frontiers, will not enter any combination of powers, and will not spend a single class of conscripts on a quarrel it did not begin. The second act is to open the file on Libya."
 ita_dnc.730.a:0 "Neutrality, and pay for it where it must be paid."
 ita_dnc.730.b:0 "Neutrality, but the army stays where it stands."
 ita_dnc.731.t:0 "The Price Paid Abroad"
 ita_dnc.731.d:0 "The columns come off the caravan roads and the ascari are paid off in front of the consulate at Benghazi, which several correspondents describe at length. The Senussi are not defeated and will not be; the arrangement is that they are no longer being fought.\n\nThat leaves the islands. Rhodes and the eleven others were occupied as security for a treaty that was signed two years ago, and holding them was always going to be awkward for a government that voted against taking them.\n\nThe Porte has asked, publicly, and is being listened to in four capitals."
 ita_dnc.731.a:0 "Give them back. We said we would."
 ita_dnc.731.b:0 "The islands stay. There are limits."
 ita_dnc.740.t:0 "The Week That Did Not End"
 ita_dnc.740.d:0 "It started the way it started in Ancona: three dead at a meeting, and the news on every railway telegraph in the country by nightfall. The general strike was called for a week. The week is over.\n\nIn the Romagna the prefects have withdrawn to the provincial capitals and in two of them not even that. Railway staff take orders from committees. Taxes are being collected by people who issue receipts. The red flag is over the town hall in a dozen places and in several of them it has been there long enough that the arrangement has begun to look like an administration.\n\nThe Chamber is sitting through the night. Every option on the table has a name attached to it, and every name belongs to somebody who will be remembered for this."
 ita_dnc.740.a:0 "Every division we have, into the Romagna."
 ita_dnc.740.b:0 "We do not have the men. Hold the line where it is."
 ita_dnc.740.c:0 "The King will send for them."
 ita_dnc.741.t:0 "The State That Came Out of It"
 ita_dnc.741.d:0 "The country goes back to work, and finds that the government it went back to is not quite the one it left."
 ita_dnc.741.d.a:0 "The junctions were retaken in ten days, which is faster than anybody at the Interior had promised and slower than the newspapers will admit. There are figures for the dead and there are two sets of them.\n\nWhat has changed is not written anywhere. The state has learned what it is willing to do to its own citizens, and has found the answer tolerable. Every prefect in the kingdom now knows he will be supported. Every chamber of labour knows what the alternative to negotiation is. The men who gave the order have not slept and will govern for another decade on the credit of that week.\n\nThis is a harder country than it was in the spring. Nobody involved is sure it is a better one."
 ita_dnc.741.d.b:0 "There is a line on the staff map now, and on the far side of it the kingdom's writ does not run. Nobody calls it a frontier. The word in the ministry is provisional, and it has been provisional for four months.\n\nConscripts are not delivered. Taxes are not remitted. The prefects report on the situation the way consuls report on a foreign country, and one of them has begun, without irony, to use the word negotiations.\n\nItaly is smaller than it was and cannot say so out loud, because saying so would require somebody to explain how it happened."
 ita_dnc.741.d.c:0 "They came to the Quirinale in the clothes they had been arrested in, and the King received them, and by the following week the general strike had been called off by the people who called it.\n\nIt worked. It is the only thing that would have worked, and it cost the Crown every friend it had in the officer corps. Two army corps commanders have applied to be relieved. The prefects are drafting their resignations and holding them. In the barracks of a dozen garrison towns young officers are saying, quietly, that the monarchy has shown what it is worth.\n\nThe country is calm. It is calm in the way a house is calm after the argument that decides everything."
 ita_dnc.741.a:0 "Then this is how Italy is governed now."
 ita_dnc.741.b:0 "The King will not sign a second state of siege."
 ita_dnc.750.t:0 "The Army Is in Africa"
 ita_dnc.750.d:0 "The war was to take six weeks. It has taken three years and it has not stopped, because there is no capital to occupy, no army to defeat, and nobody with the authority to surrender.\n\nWhat there is: fifty thousand men strung along a coast and up two caravan roads, holding wells against people who do not need to hold anything and can wait. The best regiments in the kingdom are there. So are the mountain batteries that were built for the Cadore, and the ascari, and most of the transport.\n\nIn Europe the arithmetic has been done. Vienna has reassessed the Adriatic. Paris no longer bothers to ask what Rome thinks. Italy is a great power that cannot move a corps across the Mediterranean inside a season, and everybody knows it except the newspapers."
 ita_dnc.750.a:0 "Hold the interior. It will be finished next year."
 ita_dnc.750.b:0 "The coast only. Bring the rest back."
 ita_dnc.751.t:0 "The Columns"
 ita_dnc.751.d:0 "Another year of it. The dispatches have stopped promising anything and now simply report positions, which the Chamber has noticed.\n\nThe General Staff wants two more divisions and one more season and has wanted them for three years running. The Interior wants the classes released, because the piazza has begun to make the connection between the wells of the Fezzan and the price of everything at home. The Consulta has stopped arguing and is simply pointing at the calendar.\n\nSomebody has to sign an order that says the interior is not going to be held, and whoever signs it will be answering for it in front of a commission before the decade is out."
 ita_dnc.751.a:0 "Sign it. Bring them home."
 ita_dnc.751.b:0 "No. We do not leave the wells."
 ita_dnc.760.t:0 "The Accidental Ministry"
 ita_dnc.760.d:0 "Nothing was settled. That is the whole account of it.\n\nThe piazza was neither broken nor satisfied. The Chamber was neither reformed nor abolished. The franchise came in and the machine went on and the two of them have been circling one another for two years without either giving way. Then the last ministry fell over an estimate, and the man who could form one at short notice was not the man anybody had in mind for a serious year.\n\nHe is competent, he is conservative, and he has no majority of his own and no standing in the country. The prefects do not know him. The King barely does. Europe is loading, and this is who is holding the kingdom's end of the rope."
 ita_dnc.760.a:0 "Let the Consulta and the Crown handle it."
 ita_dnc.760.b:0 "Send for Giolitti."
 ITA_end_reckoning_tt:0 "The verdict on the decade will be taken."
 ITA_end_readout_tt:0 "§YThe Piazza stands at [?ITA_piazza|0]. The majority stands at [?ITA_majority|0], of which [?ITA_majority_bought|0] was bought. The army has been called out [?ITA_bayonets|0] times.§!"
 ITA_end_free_hand_tt:0 "Italy may enter or make a faction, and may send volunteers, at its own choosing."
 ITA_end_neutral_lock_tt:0 "Italy may not join or create a faction, and may not declare war without a war goal."
 ITA_end_chamber_dead_tt:0 "The Chamber no longer governs. The majority is a formality."
 ITA_end_bargain_london_tt:0 "The terms are noted and not written where anyone can read them."
 ITA_end_word_kept_tt:0 "The alliance holds, and the irredentists will not forgive it."
 ITA_end_out_by_choice_tt:0 "Italy stands out of the coming war by its own decision, and says so first."
 ITA_end_islands_returned_tt:0 "The Dodecanese returns to the Porte."
 ITA_end_islands_kept_tt:0 "The islands are kept, against everything the ministry stood for."
 ITA_end_provinces_go_tt:0 "Emilia Romagna, Abruzzo and Tuscany pass out of the government's control."
 ITA_end_put_down_tt:0 "The rising is broken by the army. The Piazza falls to 30 and will never again fall below 35."
 ITA_end_libya_closed_tt:0 "The war in Libya is closed. The army is available again."
