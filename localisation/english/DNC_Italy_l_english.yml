 ITA_vittorio_italico_zupelli:0 "Vittorio Italico Zupelli"
 RON_Atheism:0 "The State Has No Church"
 RON_Atheism_desc:0 "No oath is sworn on a book here. It buys the government a free hand and costs it the parish priest, who was the only man in some villages who could read the notices aloud."
 RON_European_Union:0 "The Community of Six"
 RON_European_Union_desc:0 "A customs union that its founders describe as a market and its lawyers draft as a constitution. Steel and coal move without a tariff, and so, eventually, does everything else."
