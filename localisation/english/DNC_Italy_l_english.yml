 ITA_paolo_carcano:0 "Paolo Carcano"
 regia_marina_trait:0 "Regia Marina"
 regia_marina_trait_desc:0 "Trained in a fleet that reads Cuniberti in the wardroom and cannot afford what he draws."
 ITA_carlo_porro:0 "Carlo Porro"
 ITA_domenico_grandi:0 "Domenico Grandi"
 ITA_giulio_douhet:0 "Giulio Douhet"
