l_english:
 ITA_t_vienna_opened_tt:0 "§YConfidence at Vienna§! is opened, and every ally we keep or lose will be weighed against it."
 ITA_arm_vienna_opened_tt:0 "Vienna begins to keep an account of us, and the army estimates are the first entry in it."
 ITA_n_vienna_opened_tt:0 "Vienna begins to keep an account of us, and every keel we lay is entered in it."
 ITA_w_vienna_opened_tt:0 "The Consulta opens its account with Vienna, and will be judged on what it does with it."
 ITA_w_vienna_claim_tt:0 "Vienna reads the claim, and our credit with the ally is spent against it."
 ITA_z_vienna_sea_tt:0 "Vienna reads the programme, and what is left of the alliance is spent on it."
 ITA_w_tt_tripoli_claimed:0 "The kingdom claims Tripolitania, Cyrenaica and the Fezzan"
 ITA_w_tt_islands_claimed:0 "The kingdom claims Rhodes and the eleven islands"
 ITA_w_tt_ouchy_cored:0 "The African provinces become part of the kingdom"
 ITA_w_tt_fourth_shore_cored:0 "The Fourth Shore is settled and held as Italian ground"
 ITA_w_tt_valona_claimed:0 "The kingdom claims the Albanian shore"
 ITA_w_tt_irredenta_claimed:0 "The kingdom claims the Trentino and Trieste"
 ITA_z_tt_provinces_claimed:0 "The kingdom claims the Trentino, Trieste and Istria"
 ITA_z_tt_adriatic_claimed:0 "The kingdom claims the Dalmatian coast"
 ITA_z_tt_greater_italy_cored:0 "Everything the kingdom holds of the programme becomes Italian ground"
 ITA_w_threat_tripoli:0 "The Tripoli Question"
 ITA_w_threat_ultimatum:0 "The Italian Ultimatum to the Porte"
 ITA_arm_threat_expedition:0 "The Italian Expedition to Tripoli"
 ITA_w_threat_islands:0 "The Italian Occupation of the Aegean Islands"
 ITA_w_threat_irredenta:0 "The Italian Claim on Trento and Trieste"
 ITA_z_threat_provinces:0 "The Italian Claim on the Unredeemed Provinces"
 ITA_z_threat_adriatic:0 "The Italian Claim on the Adriatic"
 ITA_z_threat_no_climbdown:0 "Italy Will Not Climb Down"
 ITA_w_threat_adwa:0 "The Italian Return to Abyssinia"
 ITA_nationalist_union:0 "Nationalist Union"
 ITA_nationalist_union_long:0 "The Italian Nationalist Association"
