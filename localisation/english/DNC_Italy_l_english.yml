 ITA_air_tb_the_motor_trade:0 "The Motor Trade Answers"
 ITA_air_tb_the_hydrogen_works:0 "The Hydrogen Works"
 ITA_air_tb_the_electrolysis_shed:0 "The Electrolysis Shed"
 ITA_air_tb_the_despatches_are_studied:0 "The Despatches Are Studied"
 ITA_air_tb_the_makers:0 "The Makers of the Kingdom"
 ITA_air_tb_the_inland_sheds:0 "The Inland Sheds"
 ITA_air_tb_the_frontier_survey:0 "The Frontier Survey from the Air"
 ITA_air_tb_the_lagoon_station:0 "The Station on the Lagoon"
 ITA_air_tb_the_watch_on_pola:0 "The Watch on Pola"
 ITA_air_tb_the_memoranda:0 "The Memoranda of Douhet"
 ITA_air_tb_the_aero_engine:0 "An Engine of Our Own"
 ITA_air_tb_the_turin_bench:0 "The Bench at Turin"
 ITA_air_tb_the_aeronautical_shop:0 "The Aeronautical Shop"
 ITA_air_tb_the_gun_shop_learns:0 "The Gun Shop Learns the Trade"
 ITA_air_tb_the_civil_brevet:0 "The Civil Brevet"
 ITA_air_tb_the_settled_argument:0 "The Argument Settled"
 ITA_air_tb_the_aeroplane_wins:0 "The Aeroplane Wins the Estimates"
 ITA_air_tb_the_airship_keeps_it:0 "The Airship Keeps the Estimates"
 ITA_air_tb_the_slipway:0 "The Slipway and the Crane"
 ITA_air_tb_the_command_of_the_air:0 "The Command of the Air"
 ITA_air_tb_the_only_evidence:0 "The Only Evidence in Europe"
 ITA_air_tb_the_trimotor:0 "The Caproni Trimotor"
 ITA_air_tb_doctrine_meets_machine:0 "The Doctrine Meets the Machine"
 ITA_air_tb_the_standing_order:0 "The Standing Order"
 ITA_air_tb_the_three_year_list:0 "The Three Year List"
 ITA_air_tb_the_reserve:0 "The Reserve of Brevets"
 ITA_air_tb_the_naval_service:0 "The Naval Flying Service"
 ITA_air_tb_the_admiralty_vote:0 "The Admiralty Vote"
 ITA_air_tb_the_new_arm:0 "An Arm of Its Own"
 ITA_air_tb_the_directorate:0 "The Directorate of Aeronautics"
 ITA_air_the_answer_threat:0 "Italy has bombed from the air"
 ITA_air_the_adriatic_watch_threat:0 "Italian airships over the Adriatic"
 ITA_air_the_doctrine_threat:0 "The Italian bombardment squadrons"
 ITA_air_the_trimotor_threat:0 "The Italian heavy aeroplane"
 ITA_air_the_new_arm_threat:0 "Italy has raised an air arm"
 ita_dnc.980.t:0 "The Staff Answers the Memoranda"
 ita_dnc.980.d:0 "The file has come back from the staff with a covering note. It does not say the major is wrong. It says the questions he raises are premature, that the machines described do not exist, and that the officer would be of more use to the service in a regiment. There is a blank space at the bottom for a minute, and the minister is expected to write in it."
 ita_dnc.980.a:0 "Circulate them to every command."
 ita_dnc.980.b:0 "Note the objections. File them."
 ita_dnc.981.t:0 "The Question at the Hague"
 ita_dnc.981.d:0 "Three chancelleries have now asked, in the courteous form used when the answer is already known, whether the kingdom regards the declaration on projectiles thrown from balloons as binding upon aeroplanes. The lawyers of the Consulta think the point is arguable either way. The Porte has published photographs. Something must be said."
 ita_dnc.981.a:0 "The kingdom regrets nothing."
 ita_dnc.981.b:0 "A note of regret, and no admission."
