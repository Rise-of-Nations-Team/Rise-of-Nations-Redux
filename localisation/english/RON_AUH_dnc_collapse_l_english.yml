l_english:
 AUH_dnc_collapse_cat:0 "The Twilight of the Monarchy"
 AUH_dnc_collapse_cat_desc:0 "§[GetAUH_collapseStageColor][GetAUH_collapseStageName]§!. Strain §[GetAUH_strainColor][?AUH_treasury_strain|0]§!, columns in revolt §R[?AUH_nat_rising_count|0]§!, provinces gone §R[?AUH_nat_secessions|0]§!, mother countries armed §[GetAUH_vulturesColor][?AUH_z_vultures_armed|0]§!.\n\nA state does not end at once. It stops paying, and then it stops being obeyed, and then the neighbours read the newspapers. Every one of those three has an exit."
 AUH_z_declare_the_moratorium:0 "Declare the Moratorium"
 AUH_z_declare_the_moratorium_desc:0 "The Finance Ministry stops paying the coupon. The debt is not repudiated, only postponed, which is what a state says when it repudiates a debt. The books clear; the works stop; the Ring does not forget."
 AUH_z_pay_the_service_in_paper:0 "Pay the Service in Paper"
 AUH_z_pay_the_service_in_paper_desc:0 "The clerks of Bohemia and the tax-collectors of the Banat are paid in notes printed against nothing. They go back to their desks, and the notes go into the market, and the market answers."
 AUH_z_buy_back_the_regiments:0 "Buy Back the Regiments"
 AUH_z_buy_back_the_regiments_desc:0 "Arrears settled, officers reinstated, the Landwehr staffs recalled to their depots. Regiments that have once gone home come back slowly and come back dearer."
 AUH_z_regiments_need_a_treasury_tt:0 "The treasury must be able to pay arrears at all (§Ystrain below 90§!)"
 AUH_z_the_price_of_the_kingdom:0 "The Price of a Kingdom"
 AUH_z_the_price_of_the_kingdom_desc:0 "One of the mother countries can be bought out of its claim. It costs money the monarchy does not have, and it teaches the other two exactly what a claim is worth."
 AUH_z_read_the_ledger_of_the_ruin:0 "Read the Ledger of the Ruin"
 AUH_z_read_the_ledger_of_the_ruin_desc:0 "The Cabinet Chancellery reads out where the monarchy actually stands. Nothing is hidden in it, which is the only mercy in it."
 AUH_z_the_army_is_split:0 "The Army Is Split"
 AUH_z_the_army_is_split_desc:0 "Regiments recruited on the Vistula and the Save have marched home under their own officers. What answers the Kriegsministerium is smaller than what is on its lists, and it knows it."
 AUH_z_the_service_is_unpaid:0 "The Service Is Not Paid"
 AUH_z_the_service_is_unpaid_desc:0 "Ninety thousand officials, from the Statthalter down to the station clerk at Czernowitz, have not drawn a salary. They still come to work. They do not hurry."
 AUH_z_the_price_of_berlin:0 "The Price of Berlin"
 AUH_z_the_price_of_berlin_desc:0 "German staff officers sit in the Kriegsministerium and German bankers sit in the Finance Ministry, and both are polite about it. The monarchy is saved and no longer decides alone."
 AUH_z_the_rump_monarchy:0 "The Rump Monarchy"
 AUH_z_the_rump_monarchy_desc:0 "The Alpine lands and the Bohemian crownlands, an army that fits in them, and a court that has stopped pretending otherwise. Small, poor, defensible, and still called an empire."
 AUH_z_the_mountains_still_answer:0 "The Mountains Still Answer"
 AUH_z_the_mountains_still_answer_desc:0 "The Tyrolean and Alpine-German battalions have not asked whose flag they serve, because for them the question never arose. They are the floor beneath every collapse."
 AUH_z_the_suspension_of_payment:0 "The Suspension of Payment"
 AUH_z_the_suspension_of_payment_desc:0 "Payment is suspended. The state factories run at half fire, the scaffolding stands empty, and every foreign house that lent to Vienna is writing to its embassy."
 AUH_z_threat_the_bells_ring_together:0 "Austria-Hungary is coming apart"
 AUH_z_threat_the_vultures:0 "The heirs of Austria-Hungary are stating their claims"
 AUH_z_stage_name_none:0 "The monarchy holds"
 AUH_z_stage_name_one:0 "Stage One: the state fails"
 AUH_z_stage_name_two:0 "Stage Two: the vultures"
 AUH_z_stage_name_three:0 "Stage Three: rump Austria"
 AUH_z_floor_laid:0 "§GThe loyal corps are counted and will not be counted away.§!"
 AUH_z_floor_not_laid:0 "§YThe loyal corps have not yet been separated from the rest.§!"
 AUH_z_collapse_opened_tt:0 "The §Rcollapse§! is now running. It has three stages, and every stage has a way out."
 AUH_z_the_suspension_tt:0 "Payment is §Rsuspended§! for a year: factories idle, construction all but stopped, strain written down to 50."
 AUH_z_the_army_is_split_tt:0 "The §Rnational regiments go home§!. They can be bought back."
 AUH_z_the_service_is_unpaid_tt:0 "The §Rcivil service goes unpaid§! for ten months, or until it is paid in paper."
 AUH_z_the_floor_army_tt:0 "The §Gloyal corps§! are raised: four Kaiserjaeger brigades, manpower and rifles. This floor is guaranteed and repeats while the monarchy is below it."
 AUH_z_rump_austria_tt:0 "The monarchy is reduced to the §YAlpine and Bohemian core§!, and holds it."
 AUH_z_cascade_step_tt:0 "A column is going out of the register and into the field."
 AUH_z_vulture_ITA_tt:0 "§RItaly§! states its claim to the Trentino, the Littoral and Trieste."
 AUH_z_vulture_ROM_tt:0 "§RRomania§! states its claim to Transylvania and the Banat."
 AUH_z_vulture_SER_tt:0 "§RSerbia§! states its claim to Syrmia and the Bacska."
 AUH_z_the_price_of_berlin_tt:0 "Berlin pays, and Berlin is henceforth consulted."
 AUH_z_berlin_refused_tt:0 "The offer is refused. The monarchy stands on its own account."
 AUH_z_berlin_declined_tt:0 "No offer was made."
 auh_clock.320.t:0 "The Bells Ring Together"
 auh_clock.320.d:0 "They have rung one at a time for years and the reign has answered them one at a time. This morning they ring together: the treasury, the register, the counties, the garrisons. The Cabinet Chancellery does not use the word collapse in the minute. Everyone in the room uses it in the corridor."
 auh_clock.320.a:0 "Then we govern with what is left."
 auh_clock.320.b:0 "Put the Delegations in permanent session."
 auh_clock.322.t:0 "The Treasury Cannot Pay"
 auh_clock.322.d:0 "Böhm-Bawerk's successors put it in one sentence: the estimates for the coming quarter cannot be met from revenue, from the Ausgleich quota, or from any house on the Ring that will still take our paper. There are three ways out of a sentence like that and none of them is quiet."
 auh_clock.322.a:0 "Suspend payment."
 auh_clock.322.b:0 "Pay it out of the last gold, and let the peoples pay for the gold."
 auh_clock.322.c:0 "Let Berlin's credit stand behind the coupon."
 auh_clock.323.t:0 "The Army Splits"
 auh_clock.323.d:0 "A Hungarian battalion at Pressburg entrains for home without orders and nobody stops it, because the regiment that should have stopped it is Czech. The Kriegsministerium has spent forty years insisting the army has no nationality. It is being told this week exactly how many it has."
 auh_clock.323.a:0 "Let them go home. We will need what stays."
 auh_clock.323.b:0 "Hold them at the depots with the gendarmerie."
 auh_clock.324.t:0 "The Service Is Not Paid"
 auh_clock.324.d:0 "The salaries of the imperial-royal service are eleven days late, then nineteen. A Statthalter writes to Vienna that his district commissioners are borrowing from the men they are supposed to be taxing, and asks, without irony, for instructions."
 auh_clock.324.a:0 "They have waited before. They will wait."
 auh_clock.324.b:0 "Pay the officials first and the contractors never."
 auh_clock.326.t:0 "The Vultures Gather"
 auh_clock.326.d:0 "In Rome, in Bucharest, in Belgrade, the same file is opened in the same week, and it is not a war plan. It is a list of provinces with populations beside them. Ninety days of the monarchy failing in public has taught the neighbours that the question is no longer whether, but who is standing nearest."
 auh_clock.326.a:0 "Let them show their hand first."
 auh_clock.326.b:0 "Sound the reserve before they do."
 auh_clock.327.t:0 "Italy States Its Claim"
 auh_clock.327.d:0 "The Consulta's note is courteous and reads like a bill of sale: the Trentino, the Littoral, and the disposition of Trieste, to be settled 'in the spirit of the alliance'. The alliance has one year left to run and both sides know what the note is."
 auh_clock.327.a:0 "The alliance can be read in Vienna too. Let them come."
 auh_clock.327.b:0 "Buy the peace with the Trentino."
 auh_clock.328.t:0 "Romania States Its Claim"
 auh_clock.328.d:0 "Bucharest has been the quiet ally for thirty years, and the treaty is still secret, and the Crown Council has still voted to ask what the school laws did to three million Romanians east of the Tisza. The ask is a claim with a covering letter."
 auh_clock.328.a:0 "The Tisza is not a frontier of negotiation."
 auh_clock.328.b:0 "Give up the northern counties and keep the rest."
 auh_clock.329.t:0 "Serbia States Its Claim"
 auh_clock.329.d:0 "The Kingdom has waited for this since the annexation and does not pretend otherwise. Its note is the shortest of the three: Syrmia, the Bacska, and no mention at all of the spirit of anything."
 auh_clock.329.a:0 "Then it is the war the Ballhausplatz always wanted, at the worst hour."
 auh_clock.329.b:0 "Pay the Kingdom in ground and take the year."
 auh_clock.330.t:0 "The Offer from Berlin"
 auh_clock.330.d:0 "Berlin will lend an army corps, a banking syndicate, and the word of the Kaiser that the monarchy will not be partitioned. In return, the Kriegsministerium will accept German staff officers, the Finance Ministry will accept German auditors, and Vienna will not sign anything east of the Carpathians without asking first. It is a rescue. It is also the end of deciding alone."
 auh_clock.330.a:0 "Take it. A dependent monarchy is still a monarchy."
 auh_clock.330.b:0 "We were a Great Power this morning."
 auh_clock.331.t:0 "Berlin Sends Its Regrets"
 auh_clock.331.d:0 "The Wilhelmstrasse's reply is three paragraphs of warmth and no verbs of commitment. The Chancellor is sympathetic, the Kaiser is following events, and the alliance is of course unshaken. Nobody in the Ballhausplatz needs the cipher clerk to explain it."
 auh_clock.331.a:0 "Then we are alone, and we may as well be told so."
 auh_clock.332.t:0 "Rump Austria"
 auh_clock.332.d:0 "What is left answers from Vienna: the Alpine lands, Salzburg and the Tyrol, Bohemia and Moravia held by garrison rather than by consent. It is small and poor and it is entirely defensible, and for the first time in the reign every soldier on the rolls is a soldier who will actually come."
 auh_clock.332.a:0 "The mountains still answer. Begin from there."
 auh_clock.332.b:0 "Bohemia stays, and the army will explain why."
 auh_clock.333.t:0 "The Loyal Corps"
 auh_clock.333.d:0 "The Kaiserjaeger and the Landesschuetzen depots empty into the valleys and fill again with volunteers who were not called. They ask no questions about the register. Whatever else has gone, this has not, and the staff can now plan on a number instead of a hope."
 auh_clock.333.a:0 "Then we have a floor to stand on."
 auh_clock.334.t:0 "A Province Declares"
 auh_clock.334.d:0 "It begins as it always begins: a diet that will not adjourn, a Statthalter who cannot be reached, a telegraph office that answers in the wrong language. By evening it is not a disorder any more. It is a country, or it is about to be."
 auh_clock.334.a:0 "Send for the file."
 auh_clock.335.t:0 "The Moratorium Ends"
 auh_clock.335.d:0 "A year of suspended payment ends with the state solvent, hated by every creditor from Frankfurt to Paris, and free of a debt it could never have carried. The scaffolding goes back up. The terms of the next loan will be remembered for a generation."
 auh_clock.335.a:0 "Open the yards again."
 auh_clock.336.t:0 "The Officials Are Paid"
 auh_clock.336.d:0 "Arrears are settled, in coin, with an apology from the Cabinet Chancellery that nobody asked for. The service resumes at the speed it kept before, which was never fast, and which is now the most reassuring thing in the empire."
 auh_clock.336.a:0 "The desks are manned."
 auh_clock.337.t:0 "The Regiments Come Back"
 auh_clock.337.d:0 "They return in the order they left, by nationality, and they are counted at the depot gates by officers who have learned not to say anything about it. The army is whole on paper again. On paper is where it was always whole."
 auh_clock.337.a:0 "Enter them on the rolls."
 auh_clock.338.t:0 "The Price of a Kingdom"
 auh_clock.338.d:0 "The claim can be bought. Not with a province — with the last credit the monarchy has, paid to a neighbour to say publicly that it wants nothing. The neighbour will take it. The other two will read the figure in their own newspapers."
 auh_clock.338.a:0 "Pay Rome."
 auh_clock.338.b:0 "Pay Bucharest."
 auh_clock.338.c:0 "Pay Belgrade."
 auh_clock.338.e:0 "Pay nobody. Keep the credit."
 auh_clock.339.t:0 "The Bells Fall Silent"
 auh_clock.339.d:0 "Six months without a rising, without a suspension, without a note from a neighbour. The Cabinet Chancellery does not announce a recovery, because announcing one is how the last three ended. It simply stops circulating the emergency minute."
 auh_clock.339.a:0 "Say nothing and keep working."
 auh_clock.340.t:0 "Vienna Suspends Payment"
 auh_clock.340.d:0 "The Austro-Hungarian Monarchy has suspended payment on its public debt. The Bourse in Vienna closed early; the Paris and Berlin houses that carried the paper are counting what they hold. It is the first suspension by a European Great Power in living memory, and every chancellery in Europe is asking the same question about what such a state is still worth as an ally."
 auh_clock.340.a:0 "It was not the war that broke us."
 auh_clock.340.b:0 "A Great Power that cannot pay is a question, not a partner."
 auh_clock.344.t:0 "The Ledger of the Ruin"
 auh_clock.344.d:0 "§[GetAUH_collapseStageColor][GetAUH_collapseStageName]§!\n\nTreasury strain §[GetAUH_strainColor][?AUH_treasury_strain|0]§! of 100.\nColumns in open revolt: §R[?AUH_nat_rising_count|0]§! of twelve.\nProvinces already gone: §R[?AUH_nat_secessions|0]§!.\nMother countries armed against us: §[GetAUH_vulturesColor][?AUH_z_vultures_armed|0]§! of three.\nHouse of Habsburg standing: §Y[?AUH_house_prestige|0]§!.\n\n[GetAUH_floorState]"
 auh_clock.344.a:0 "Read it again next month."
