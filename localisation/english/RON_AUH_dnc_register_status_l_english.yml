 AUH_dnc_the_register_status:0 "The Register, Read Aloud"
 AUH_dnc_the_register_status_desc:0 "Each people's standing out of 100, read once a month. §G40 or higher§!: content. §Y25 to 39§!: restless. §R10 to 24§!: refuses the levy. §Rbelow 10§!: in open revolt.\n\nThe register erodes of itself, and the band it erodes inside widens as the reign ages and the instruments are used. Heat stands at §Y[?AUH_register_heat|1]§! of 20, and every column caught inside that band loses §R[?AUH_register_erosion|0]§! a month.\n\n§[GetAUS_supportColor][?AUS_support]§! — the Germans of Austria\n§[GetHUN_supportColor][?HUN_support]§! — the Magyars\n§[GetCZE_supportColor][?CZE_support]§! — the Czechs\n§[GetPOL_supportColor][?POL_support]§! — the Poles\n§[GetUKR_supportColor][?UKR_support]§! — the Ruthenes\n§[GetROM_supportColor][?ROM_support]§! — the Romanians\n§[GetCRO_supportColor][?CRO_support]§! — the Croats\n§[GetSER_supportColor][?SER_support]§! — the Serbs\n§[GetBOS_supportColor][?BOS_support]§! — the Bosniaks\n§[GetSLV_supportColor][?SLV_support]§! — the Slovenes\n§[GetITA_supportColor][?ITA_support]§! — the Italians\n§[GetSLO_supportColor][?SLO_support]§! — the Slovaks"
