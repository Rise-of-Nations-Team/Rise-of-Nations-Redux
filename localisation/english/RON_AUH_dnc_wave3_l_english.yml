l_english:
 AUHDNC_nav_the_hulls_before_the_vote:0 "The Hulls Before the Vote"
 AUHDNC_nav_the_hulls_before_the_vote_desc:0 "Montecuccoli has a habit the Delegations have not yet learned to punish: he lays the keels first and asks for the money afterwards. Plates are ordered at Witkowitz, slipways cleared at the Stabilimento Tecnico, and the two parliaments are informed that the Monarchy has begun something it would be embarrassing to stop. It is not lawful. It has never yet failed."
 AUHDNC_nav_the_answer_to_the_dante:0 "The Answer to the Dante"
 AUHDNC_nav_the_answer_to_the_dante_desc:0 "Rome has laid down an all-big-gun ship and given her a poet's name. The Marinetechnisches Komitee answers with Popper's drawings: four triple turrets on the centre line, twelve heavy guns, a ship that can be built inside the Adriatic and inside our means. Approving the design commits nothing but the ink. Everyone in the room knows what comes next."
 AUHDNC_nav_viribus_unitis:0 "Viribus Unitis"
 AUHDNC_nav_viribus_unitis_desc:0 "The Emperor's own motto goes on the bow of the first dreadnought of the k.u.k. Kriegsmarine. She is laid down at Trieste with money nobody has finally voted, and she will make the Adriatic a sea in which the Monarchy has an opinion. Whether her bunkers hold Galician oil or Bohemian coal is not a question of romance; it is a question of how far she can go without asking anyone's leave."
 AUHDNC_nav_the_yards_of_fiume:0 "The Yards of Fiume"
 AUHDNC_nav_the_yards_of_fiume_desc:0 "The Danubius works at Fiume have never built a capital ship, and the Hungarian Delegation has never voted for one that was not partly built in Hungary. Both problems are solved by the same signature. Budapest gets its share of the plates, the quota talk grows quieter for a season, and the Monarchy acquires a second yard that can lay a heavy keel."
 AUHDNC_nav_the_torpedoes_of_whitehead:0 "The Torpedoes of Whitehead"
 AUHDNC_nav_the_torpedoes_of_whitehead_desc:0 "The self-propelled torpedo was invented at Fiume by an Englishman in the Monarchy's service, and half the navies of the world now buy it from him. The Marinesektion takes a share of the works, a first refusal on every new pattern, and the awkward power to decide who else may be sold the thing that makes small navies dangerous."
 AUHDNC_nav_the_monitors_of_the_danube:0 "The Monitors of the Danube"
 AUHDNC_nav_the_monitors_of_the_danube_desc:0 "The Danube flotilla is the only squadron the Monarchy can send eight hundred kilometres inland. Shallow-draught armoured monitors at Budapest, a landing detachment trained to put a battalion ashore at a bend in the river, and a chart of every sandbank between Pressburg and the Iron Gates. Belgrade sits on that river. So does Vienna."
 AUHDNC_arm_the_mortar_in_the_shed:0 "The Mortar in the Shed"
 AUHDNC_arm_the_mortar_in_the_shed_desc:0 "In a locked shed at the Pilsen works there is a barrel of thirty and a half centimetres that the artillery inspectorate has not decided it wants. It is too heavy for any road, too slow for any timetable, and it will crack a modern fort like a walnut. The programme costs money every year and produces nothing until the year it produces everything."
 AUHDNC_arm_the_motor_of_herr_porsche:0 "The Motor of Herr Porsche"
 AUHDNC_arm_the_motor_of_herr_porsche_desc:0 "The young engineer at Austro-Daimler has built a road train in which every wheel is driven by its own electric motor, fed by a petrol generator on the leading carriage. The army wanted a tractor. He has given it a system that can drag anything that will fit on a road, and a few things that will not."
 AUHDNC_arm_the_contingent_unfrozen:0 "The Contingent Unfrozen"
 AUHDNC_arm_the_contingent_unfrozen_desc:0 "The annual intake of recruits has stood unchanged since 1889 because raising it requires both parliaments to agree, and both parliaments have discovered that refusing is free. The Monarchy raises fewer men from fifty millions than France raises from thirty-nine. There are two ways to end that. One of them is legal."
 AUHDNC_air_the_subsidy_for_herr_kress:0 "The Subsidy for Herr Kress"
 AUHDNC_air_the_subsidy_for_herr_kress_desc:0 "Wilhelm Kress has been building a flying machine on the Wienerwald reservoir for a decade, and has come nearer than anyone in Europe to leaving the water in it. What defeated him was a motor: the one he could afford weighed twice what he was promised. A subsidy buys a better motor. It does not buy the wind."
 AUHDNC_air_the_hall_at_fischamend:0 "The Hall at Fischamend"
 AUHDNC_air_the_hall_at_fischamend_desc:0 "A shed two hundred metres long on the Danube meadow below Vienna, a hydrogen plant, a mooring mast, and the establishment that goes with them. The airship park at Fischamend gives the army its own aeronautical garrison instead of a subscription list. What will hang in the hall is the next question, and three foreign firms have already sent their prices."
 AUHDNC_air_the_archdukes_squadron:0 "The Archduke's Squadron"
 AUHDNC_air_the_archdukes_squadron_desc:0 "Archduke Leopold Salvator, Inspector-General of Artillery, has spent his own money on aeroplanes for four years and has drawings in his desk that the ministry has not asked to see. Given the new arm to patronise, he will give it what no committee can: a Habsburg name over the door, and a first flying company with numbered machines and a list of pilots."
 AUHDNC_c_the_scandals_of_the_archdukes:0 "The Scandals of the Archdukes"
 AUHDNC_c_the_scandals_of_the_archdukes_desc:0 "There are some seventy archdukes and archduchesses, and the Lord High Steward's chancellery keeps a file on each. Debts at Baden, a brother who will not stop writing to the newspapers, a Tuscan line that has married beneath itself twice in a decade. The credit of the House is a real quantity: it buys obedience in the crownlands, it steadies the exchanges, and it can be spent until there is none."
 AUHDNC_c_the_house_law_has_teeth:0 "The House Law Has Teeth"
 AUHDNC_c_the_house_law_has_teeth_desc:0 "The Family Statute of 1839 is read out as though it meant what it says. Allowances are withheld, residences assigned, marriages refused, and one archduke informed in writing that he is no longer an archduke. The Ring approves. The Belvedere, where the heir has his own opinions about statutes applied to heirs, does not."
 AUHDNC_c_the_blind_eye_of_the_emperor:0 "The Blind Eye of the Emperor"
 AUHDNC_c_the_blind_eye_of_the_emperor_desc:0 "The old man has buried a brother, a son, a wife and an empress, and he has decided that he will not also quarrel with his cousins. The files stay in the drawer, the allowances are paid, and the newspapers are handled rather than answered. It is cheaper in political power and more expensive in everything else."
 AUHDNC_c_the_death_of_the_handsome_archduke:0 "The Death of the Handsome Archduke"
 AUHDNC_c_the_death_of_the_handsome_archduke_desc:0 "Otto is dead at forty-one, of a disease nobody will name in the court circular, and the succession must be read again. Franz Ferdinand stands where he stood. Behind him, where the handsome archduke used to be, there is now a quiet boy of twenty who has been raised by tutors and has never been thought about."
 AUHDNC_c_the_student_at_the_hradcany:0 "The Student at the Hradcany"
 AUHDNC_c_the_student_at_the_hradcany_desc:0 "The boy is sent to Prague: lectures in law at the Bohemian university, a Czech tutor, quarters in the castle above the city, and instructions to be seen at the Czech theatre as often as at the German. Prague notices. So does the Belvedere, which has other plans for what a future Emperor should be taught."
 AUHDNC_c_the_dragoon_at_brandeis:0 "The Dragoon at Brandeis"
 AUHDNC_c_the_dragoon_at_brandeis_desc:0 "He is posted to the 7th Dragoons at Brandeis on the Elbe, and does the work: squadron duty, riding school, manoeuvres in the rain, the regimental language which is not his own. An Emperor who has served in a line regiment is worth a great deal to an army of eleven tongues, and very little to anyone else."
 AUHDNC_c_the_jesuits_have_him:0 "The Jesuits Have Him"
 AUHDNC_c_the_jesuits_have_him_desc:0 "The Fathers take charge of the young archduke's formation, and the result is exactly what they intend: a prince who hears mass daily, who believes the crown is held in trust from God, and who will be adored by the Catholic peasantry of Croatia, Carniola and the Tyrol. The liberal press of Vienna begins sharpening its pens twenty years early."
 AUHDNC_c_the_procession_of_the_sixty_years:0 "The Procession of the Sixty Years"
 AUHDNC_c_the_procession_of_the_sixty_years_desc:0 "Twelve thousand people in the costume of every land of the Monarchy walk past the Emperor on the Ringstrasse: Tyrolean shooters, Hungarian magnates in leopard skin, Poles, Ruthenes, Croats, Bosniaks, Romanians, Slovenes. The whole register is invited to march. Whoever does not come will be counted just as carefully as whoever does."
 AUHDNC_c_the_mausoleum_of_the_rebel:0 "The Mausoleum of the Rebel"
 AUHDNC_c_the_mausoleum_of_the_rebel_desc:0 "Budapest is building a mausoleum for Lajos Kossuth, who declared the House of Habsburg deposed and died unpardoned in Turin. The Kingdom will consecrate it with or without the Crown's blessing. A wreath from the Hofburg would be worth a great deal in Hungary, and would cost the dynasty something it cannot buy back."
 AUHDNC_c_a_duchess_by_degrees:0 "A Duchess by Degrees"
 AUHDNC_c_a_duchess_by_degrees_desc:0 "Sophie Chotek is the wife of the heir to the throne and walks into dinner behind the youngest archduchess, after every princess of a house that has been mediatised for a century. Her children cannot succeed. The heir has counted every one of these evenings, and he is not a forgiving man. The ladder can be climbed a rung at a time, and every rung is paid for out of the House's credit."
 AUHDNC_c_the_masters_of_the_rituals:0 "The Masters of the Rituals"
 AUHDNC_c_the_masters_of_the_rituals_desc:0 "The Spanish ceremonial is not decoration; it is the working timetable of the monarchy. Corpus Christi behind the Host, the washing of twelve old men's feet on Maundy Thursday, the New Year audiences at which every deputation in the Empire is received in order of precedence. It exhausts the old man, and it is the only thing that visibly holds the eleven peoples in one room."
 AUHDNC_c_the_friend_at_the_villa:0 "The Friend at the Villa"
 AUHDNC_c_the_friend_at_the_villa_desc:0 "At Bad Ischl there is a villa, an actress who has been a friend for thirty years, a plain breakfast at half past four in the morning, and a walk in the Salzkammergut that no chamberlain is permitted to time. It is the only fixture in the imperial year at which the Emperor is not on duty, and it is worth more to his health than the entire faculty of medicine."
 AUHDNC_c_the_crown_of_saint_stephen:0 "The Crown of Saint Stephen"
 AUHDNC_c_the_crown_of_saint_stephen_desc:0 "No Habsburg is King of Hungary until he has been crowned at Buda with the crown of Saint Stephen and has sworn, in the open air on the coronation mound, to defend the constitution of the Kingdom. The heir has said in private that he would rather not swear it. Every accession the Monarchy will ever have runs through this question, and the answer can be given now or extorted later."
 AUH_tb_the_hulls_before_the_vote:0 "The Keels Are Down"
 AUH_tb_the_answer_to_the_dante:0 "The All-Big-Gun Design"
 AUH_tb_viribus_unitis:0 "The Fleet Has a Flagship"
 AUH_tb_the_fleet_burns_oil:0 "Oil-Fired Boilers"
 AUH_tb_the_yards_of_fiume:0 "The Danubius Slipway"
 AUH_tb_the_torpedoes_of_whitehead:0 "The Whitehead Pattern"
 AUH_tb_the_boats_that_carry_them:0 "Boats for the Torpedo"
 AUH_tb_the_river_flotilla:0 "The River Flotilla"
 AUH_tb_the_plates_pass_proof:0 "The Plates Pass Proof"
 AUH_tb_the_race_is_admitted:0 "The Race Is Admitted"
 AUH_tb_the_pattern_stays_at_home:0 "The Pattern Stays at Home"
 AUH_tb_the_mortar_in_the_shed:0 "The Siege Piece"
 AUH_tb_the_thirty_and_a_half:0 "Thirty and a Half Centimetres"
 AUH_tb_the_mountain_batteries:0 "The Mountain Batteries"
 AUH_tb_the_motor_of_herr_porsche:0 "The Road Train"
 AUH_tb_the_prinz_heinrich_run:0 "The Prinz-Heinrich Run"
 AUH_tb_the_subsidy_for_herr_kress:0 "The Subsidy for Kress"
 AUH_tb_the_machine_that_flew:0 "The Machine That Flew"
 AUH_tb_the_drachenflieger_flew:0 "The Drachenflieger Rose"
 AUH_tb_the_hall_at_fischamend:0 "The Airship Park"
 AUH_tb_the_parseval_pattern:0 "The Parseval Pattern"
 AUH_tb_the_lebaudy_pattern:0 "The Lebaudy Pattern"
 AUH_tb_the_korting_motor:0 "The Korting Motor"
 AUH_tb_the_archdukes_squadron:0 "The First Flying Company"
 AUH_tb_the_dragoon_at_brandeis:0 "Regimental Duty"
 AUH_nav_the_dreadnought_threat:0 "Austria-Hungary has launched a dreadnought"
 AUH_nav_the_dreadnought_answer_threat:0 "Austria-Hungary answers the Italian estimates"
 AUH_arm_the_mortar_threat:0 "Austria-Hungary has a fortress-breaking siege train"
 AUH_c_prestige_up_tt:0 "§GThe credit of the House rises.§!"
 AUH_c_prestige_down_tt:0 "§RThe credit of the House falls.§!"
 AUH_c_tt_the_dial_of_the_dynasty:0 "The credit of the House now moves stability, political power and drift defence with it: §Y[?AUH_house_prestige|0]§! out of 100."
 AUH_c_tt_the_chancellery_watches:0 "The Lord High Steward's chancellery reports what the archdukes are doing, whether or not the crown wishes to hear it."
 AUH_c_tt_two_archdukes_named:0 "Archduke Otto and Archduke Ludwig Viktor enter the Crown's service, and its files."
 AUH_c_tt_the_heir_writes_it_down:0 "§RThe Belvedere adds it to the account.§!"
 AUH_c_tt_the_belvedere_is_quiet:0 "§GThe Belvedere has one grievance fewer.§!"
 AUH_c_tt_the_law_is_applied:0 "The Family Statute is applied to the family."
 AUH_c_tt_the_emperor_looks_away:0 "The files go back in the drawer, and the allowances are paid."
 AUH_c_tt_avail_otto_is_dead:0 "Archduke Otto is dead."
 AUH_c_tt_the_line_is_read_again:0 "The order of succession is read out in full to the Crown Council."
 AUH_c_tt_the_handsome_archduke_retired:0 "Archduke Otto leaves the Crown's service."
 AUH_c_tt_the_boy_is_next_but_one:0 "Archduke Karl now stands second in the line."
 AUH_c_tt_the_old_man_reads_the_obituary:0 "§RThe Emperor has buried another of his house.§!"
 AUH_c_tt_the_boy_learns_czech:0 "The heir's heir is formed in Prague, in two languages."
 AUH_c_tt_cze_up_2:0 "§GThe Bohemian clubs read the castle windows.§!"
 AUH_c_tt_the_seventh_dragoons:0 "Archduke Karl serves with the 7th Dragoons at Brandeis."
 AUH_c_tt_the_boy_wears_the_tunic:0 "The future Emperor has stood a squadron duty."
 AUH_c_tt_the_fathers_have_him:0 "The archduke's formation is given to the Society of Jesus."
 AUH_c_tt_the_catholic_south_reads_it:0 "§GZagreb and Ljubljana are told who is being raised for them.§!"
 AUH_c_tt_twelve_deputations_march:0 "Every land of the Monarchy walks past the Emperor in its own costume."
 AUH_c_tt_the_gaps_in_the_column_are_counted:0 "§RThe places left empty in the procession are counted by everyone present.§!"
 AUH_c_tt_the_king_walks_in_buda:0 "The Emperor crosses to Buda and walks as King."
 AUH_c_tt_the_ring_is_not_amused:0 "§RVienna reads the Buda procession as a concession.§!"
 AUH_c_tt_the_rebel_is_buried_at_home:0 "The question of the mausoleum is answered."
 AUH_c_tt_a_wreath_from_the_hofburg:0 "A wreath is sent in the Emperor's name to the tomb of the man who deposed him."
 AUH_c_tt_no_wreath_is_sent:0 "The Hofburg sends nothing, and says nothing."
 AUH_c_tt_hun_up_5:0 "§GHungary is astonished.§!"
 AUH_c_tt_hun_down_4:0 "§RHungary notes the empty place at the consecration.§!"
 AUH_c_tt_hun_up_4:0 "§GThe Kingdom is answered.§!"
 AUH_c_tt_hun_down_3:0 "§RThe Kingdom is left waiting.§!"
 AUH_c_tt_the_ladder_is_opened:0 "The rank of the heir's wife may now be raised, one degree at a time."
 AUH_c_tt_the_hungry_heir:0 "The heir is a hungry man, and every dinner he is made to watch is another course he will serve when his turn comes."
 AUH_c_tt_the_calendar_opens:0 "The court calendar becomes an instrument: the year's ceremonies can be worked, at a price."
 AUH_c_tt_the_walk_at_ischl:0 "The Emperor keeps one appointment in the year at which nothing is required of him."
 AUH_c_tt_the_old_man_sleeps:0 "§GThe Emperor's health improves.§!"
 AUH_c_tt_the_decay_slows:0 "§GThe Emperor is failing more slowly than he was.§!"
 AUH_c_tt_the_oath_is_decided:0 "The question of the coronation oath is settled for the next accession."
 AUH_c_tt_the_oath_is_deferred:0 "The oath is deferred, and the Kingdom is told to wait for an answer."
 AUH_c_tt_the_oath_is_promised:0 "The next King will swear on the mound at Buda."
 AUH_c_tt_the_oath_is_left_open:0 "The Hofburg gives no undertaking, and lets the Diet infer what it likes."
 AUH_c_tt_the_ring_reads_it_at_breakfast:0 "§RThe Vienna press has it by the morning edition.§!"
 AUH_c_tt_the_bureau_buys_the_edition:0 "The press bureau buys the edition, and the file goes into the safe."
 AUH_c_tt_what_was_bought_is_printed:0 "§RWhat the bureau bought is printed abroad, and comes back over the frontier by post.§!"
 AUH_c_tt_the_altar_is_offended:0 "§RThe scene at the church door is repeated in every sermon south of the Save.§!"
 AUH_c_tt_klessheim_is_far_from_vienna:0 "Archduke Ludwig Viktor is required to reside at Klessheim, and not to return."
 AUH_c_tt_the_bath_is_not_mentioned:0 "The military bath-house affair is not mentioned again in any Vienna paper."
 AUH_c_tt_the_tuscan_is_struck_from_the_list:0 "The Tuscan archduke is struck from the House and from the army list."
 AUH_c_tt_the_pension_is_continued:0 "The pension is continued, quietly, and the name is left on the list."
 AUH_c_tt_the_renunciation_is_demanded:0 "A renunciation in writing is required before the marriage is permitted."
 AUH_c_tt_the_marriage_is_allowed:0 "The marriage is permitted, and the House law is bent one degree further."
 AUH_c_tt_the_letter_is_filed:0 "The heir's letter is acknowledged, filed, and not answered."
 AUH_c_tt_the_funeral_is_full_dress:0 "The archduke is buried with the full ceremonial of the House."
 AUH_c_tt_the_funeral_is_private:0 "The archduke is buried at night, with four candles and no deputation."
 AUH_c_tt_the_renunciations_are_confirmed:0 "Every renunciation in the House archive is confirmed and countersigned."
 AUH_c_tt_the_renunciations_are_reopened:0 "The renunciations are reopened, and the line becomes a matter of argument."
 AUH_c_tt_the_order_of_precedence_stands:0 "The Lord High Steward is upheld, and precedence stands as written."
 AUH_court_tt_the_calendar_has_room:0 "The court calendar has room this year: §Y[?AUH_ritual_uses|0]§! of 4 ceremonies worked."
 AUH_court_tt_the_old_man_walks_behind_the_host:0 "The Emperor walks behind the Host through the inner city, bareheaded, as he has for sixty years."
 AUH_court_tt_the_deputations_are_received:0 "Every deputation in the Empire is received in order of precedence."
 AUH_court_tt_twelve_old_men_are_served:0 "Twelve old men are seated, served and have their feet washed by the Emperor of Austria."
 AUH_court_tt_the_walk_is_not_a_ceremony:0 "The walk at Ischl is not in the calendar, and does not tire him."
 AUH_court_tt_the_purse_can_pay:0 "The privy purse can pay: §Y[?AUH_house_prestige|0]§! credit remaining."
 AUH_court_tt_the_bureau_is_retained:0 "The press bureau is retained for a year. What it buys does not stay bought forever."
 AUH_court_tt_the_archduchesses_are_furious:0 "§RThe archduchesses of the blood take it as an insult to every one of them.§!"
 AUH_sophie_tt_princess_of_hohenberg:0 "Sophie Chotek is created Princess of Hohenberg."
 AUH_sophie_tt_duchess_of_hohenberg:0 "The Princess of Hohenberg is raised to Duchess, with the style of Highness."
 AUH_sophie_tt_she_may_be_advised:0 "The Duchess of Hohenberg may now be given a place in the Crown's counsels."
 AUH_sophie_tt_the_first_lord_must_yield:0 "The Lord High Steward can only be overruled by an emperor who has already stopped enforcing the statute, or by the Belvedere itself."
 AUH_sophie_tt_the_seat_is_taken:0 "The Duchess takes her seat at the imperial table, ahead of the archduchesses."
 AUH_sophie_tt_the_hungry_heir_is_fed:0 "§GThe hungry heir has been fed, and the account is nearly clear.§!"
 AUH_nav_tt_services_estimates:0 "The estimates of the services are opened: the yards, the arsenal and the airship park may now be worked by decision."
 AUH_nav_tt_the_keels_go_down_first:0 "Plates are ordered and slipways cleared while the Delegations are still reading the estimate."
 AUH_nav_tt_the_keels_are_a_fact:0 "The keels are an accomplished fact, and the Delegations are invited to pay for them."
 AUH_nav_tt_hun_up_1:0 "§GHungary is content.§!"
 AUH_nav_tt_hun_up_2:0 "§GHungary reads its own share in the order.§!"
 AUH_nav_tt_hun_down_2:0 "§RHungary is presented with a bill it did not vote.§!"
 AUH_nav_tt_hun_down_4:0 "§RThe Kingdom's yard is struck from the contract.§!"
 AUH_nav_tt_aus_up_2:0 "§GThe Ring subscribes to the fleet with enthusiasm.§!"
 AUH_nav_tt_cro_up_1:0 "§GThe Croatian coast sees work at Fiume.§!"
 AUH_nav_tt_ita_down_4:0 "§RTrieste and Trento read the launch as a threat aimed past them.§!"
 AUH_nav_tt_ser_down_1:0 "§RBelgrade counts the patrol.§!"
 AUH_nav_tt_ser_down_2:0 "§RBelgrade reads the monitors on its own river.§!"
 AUH_nav_tt_ser_down_3:0 "§RBelgrade understands what the flotilla is for.§!"
 AUH_nav_tt_popper_draws_the_triple_turret:0 "Siegfried Popper draws four triple turrets on the centre line, and the committee approves the drawing."
 AUH_nav_tt_rome_reads_the_slipways:0 "§RRome reads the drawings as an answer, because they are one.§!"
 AUH_nav_tt_the_race_is_admitted:0 "The Monarchy admits it is in a naval race, which is half the cost of winning one."
 AUH_nav_tt_the_estimates_are_quiet:0 "The Italian estimates are quiet this year. The committee will look again."
 AUH_nav_tt_the_ship_is_named:0 "The first dreadnought is named for the Emperor's motto: with united forces."
 AUH_nav_tt_the_galician_oil_reaches_pola:0 "§GGalician oil reaches the bunkers, and the ship can go where coal cannot follow.§!"
 AUH_nav_tt_the_bunkers_hold_coal:0 "§RThe bunkers hold Bohemian coal, and the flagship's range is what a collier can carry to her.§!"
 AUH_nav_tt_avail_a_yard_that_answers:0 "A yard that can lay a heavy keel: either the keels were laid before the vote, or Fiume has taken its share."
 AUH_nav_tt_the_credit_is_voted_backwards:0 "The Delegations vote the credit after the ship, which is not what the constitution intends, but is what happens."
 AUH_nav_tt_the_ship_is_already_afloat:0 "The Marinesektion observes that the ship is already afloat, and invites objections in writing."
 AUH_nav_tt_danubius_takes_a_share:0 "The Danubius works at Fiume take their share of the plates and the credit."
 AUH_nav_tt_the_kingdom_has_a_yard:0 "The Kingdom of Hungary has a yard that can lay a capital ship, and will not forget who gave it one."
 AUH_nav_tt_the_fiume_share_is_stripped:0 "§RThe Fiume share is stripped from the contract and the works lose their company.§!"
 AUH_nav_tt_both_yards_are_kept:0 "The penalty is paid out of the privy purse and both yards keep their contracts."
 AUH_nav_tt_the_plates_pass_proof:0 "§GThe armour plate passes proof at the first attempt.§!"
 AUH_nav_tt_the_licence_is_on_the_table:0 "The Marinesektion holds first refusal on every Whitehead pattern, and the export licence."
 AUH_nav_tt_the_pattern_stays_at_home:0 "The newest pattern is refused to every foreign buyer."
 AUH_nav_tt_the_temes_and_the_bodrog:0 "The monitors Temes and Bodrog are laid down at Budapest, with a landing detachment to work with them."
 AUH_nav_tt_the_river_is_a_road:0 "The Danube is treated as what it is: a road eight hundred kilometres long, running past Belgrade."
 AUH_nav_tt_the_flotilla_patrols_only:0 "The flotilla patrols, charts the bends, and is not given a task."
 AUH_arm_tt_the_shed_at_pilsen:0 "The programme for the thirty-and-a-half is opened: §Y[?AUH_mortar_progress|0]§! of 100."
 AUH_arm_tt_the_mortar_credit_opens:0 "The mortar credit may now be drawn each quarter until the piece is finished."
 AUH_arm_tt_the_tractor_is_already_ordered:0 "§GThe road train is already ordered, and the piece has something to move it.§!"
 AUH_arm_tt_the_piece_can_now_be_moved:0 "§GThe piece can be moved, which was the whole difficulty.§!"
 AUH_arm_tt_the_piece_fires_at_felixdorf:0 "The M.11 fires on the Felixdorf range and puts its shell through fourteen metres of concrete."
 AUH_arm_tt_daimler_enters_the_service:0 "Paul Daimler enters the Crown's service."
 AUH_arm_tt_the_works_are_shared:0 "The order is divided between Wiener Neustadt and the Bohemian works, and both are satisfied."
 AUH_arm_tt_the_run_is_won:0 "The road train wins the Prinz-Heinrich run, and the ministry reads the result in the sporting papers."
 AUH_arm_tt_the_tractors_go_to_the_batteries:0 "The tractors are sent to the batteries instead of the exhibitions."
 AUH_arm_tt_avail_a_route_exists:0 "There is a route by which the contingent can be raised: a Kingdom that will vote it, or a crown that will not ask."
 AUH_arm_tt_the_classes_are_called:0 "§GThe annual intake is raised and the reserve classes are called.§!"
 AUH_arm_tt_the_bill_goes_to_both_houses:0 "The bill goes to both parliaments, and will be paid for in concessions."
 AUH_arm_tt_the_paragraph_is_read_out:0 "The recruit contingent is raised by ordinance under the emergency paragraph. No parliament is asked."
 AUH_arm_tt_the_three_columns_read_the_octroi:0 "§RPrague, Budapest and Lemberg read the ordinance as what it is.§!"
 AUH_arm_tt_the_ledger_records_the_paragraph:0 "§RThe coercion ledger records the paragraph.§!"
 AUH_arm_tt_the_kingdom_voted_it:0 "§GThe Kingdom voted the classes, and expects to be thanked.§!"
 AUH_air_tt_the_subsidy_is_paid:0 "The subsidy is paid to Kress, and the machine gets its motor."
 AUH_air_tt_kress_has_a_motor:0 "§GKress will have a motor light enough to fly.§!"
 AUH_air_tt_the_machine_that_flew:0 "§GThe Drachenflieger leaves the water. Austria has flown.§!"
 AUH_air_tt_the_honest_failure:0 "§RThe machine does not rise, and the report says so honestly.§!"
 AUH_air_tt_the_procurement_opens:0 "The airship procurement is opened: three firms, three patterns, one choice."
 AUH_air_tt_the_park_is_a_garrison:0 "The park at Fischamend is a garrison of the army, not a subscription list."
 AUH_air_tt_fliegerkompanie_one:0 "Fliegerkompanie 1 is formed at Fischamend with numbered machines and a list of pilots by name."
 AUH_air_tt_leopold_salvator:0 "Archduke Leopold Salvator takes the new arm under his own name."
 AUH_air_tt_the_old_man_looks_up:0 "§GThe Emperor is driven to the Prater and looks up, which he has not done in years.§!"
 AUH_svc_tt_the_inspector_signs:0 "The naval inspector signs for the plates before they are laid, which makes a fault less likely and no less expensive."
 AUH_svc_tt_the_credit_is_drawn:0 "The quarterly credit is drawn and the piece advances."
 AUH_svc_tt_the_mountain_batteries:0 "The Skoda mountain batteries are ordered: a gun that four mules can carry to a place where no road goes."
 AUH_svc_tt_the_alpine_columns_read_it:0 "§GThe Alpine and Slovene districts read the order as work.§!"
 AUH_svc_tt_the_licence_is_sold:0 "The export licence is sold, and the Monarchy takes its percentage of somebody else's navy."
 AUH_svc_tt_fiume_takes_its_cut:0 "§GFiume takes its cut of the licence.§!"
 AUH_svc_tt_the_pattern_from_berlin:0 "The Parseval pattern is bought from Berlin: a non-rigid ship that can be packed on a wagon."
 AUH_svc_tt_the_pattern_from_paris:0 "The Lebaudy pattern is bought from Paris: a semi-rigid ship with the best eye in Europe."
 AUH_svc_tt_the_motor_only:0 "Only the Korting motor is bought. The hull will be built at Fischamend, badly at first."
 AUH_svc_tt_the_hull_is_built_at_home:0 "§GThe hull is built at home, and the trade stays in the Monarchy.§!"
 AUH_svc_tt_the_patrol_runs_to_belgrade:0 "The flotilla runs the reach past Belgrade with the colours up."
 AUH_svc_tt_the_ledger_records_the_patrol:0 "§RThe coercion ledger records the patrol.§!"
 experience_gain_air_factor_tt:0 "Air experience gain"
 air_accidents_factor_tt:0 "Air accidents"
 recon_factor_tt:0 "Reconnaissance"
 air_range_factor_tt:0 "Air range"
 AUH_dnc_services_cat:0 "The Estimates of the Services"
 AUH_dnc_services_cat_desc:0 "The yards, the arsenal and the airship park. Everything here is a programme: it is paid for by the year and delivers in the year it delivers."
 AUH_dnc_court_calendar_cat:0 "The Court Calendar"
 AUH_dnc_court_calendar_cat_desc:0 "The credit of the House is §Y[?AUH_house_prestige|0]§! out of 100. It buys obedience, it steadies the exchanges, and it is spent by every scandal the crown does not answer."
 AUH_svc_the_slipway_inspection:0 "Send the Naval Inspector to the Slipway"
 AUH_svc_the_slipway_inspection_desc:0 "An inspector at Trieste with authority to reject plate before it is worked. It slows the yard and it makes the yard honest."
 AUH_svc_the_mortar_credit:0 "Draw the Mortar Credit"
 AUH_svc_the_mortar_credit_desc:0 "Another quarter's money for the shed at Pilsen, on the understanding that it will produce nothing this quarter either."
 AUH_svc_the_mountain_batteries:0 "Order the Mountain Batteries"
 AUH_svc_the_mountain_batteries_desc:0 "The Skoda mountain gun, broken down to four mule loads, for the establishments that have to fight above the treeline."
 AUH_svc_the_torpedo_export_licence:0 "Sell a Whitehead Licence"
 AUH_svc_the_torpedo_export_licence_desc:0 "A foreign navy wants the newest pattern. The works want the money. The Marinesektion holds the pen."
 AUH_svc_the_parseval_ship:0 "Buy the Parseval Pattern"
 AUH_svc_the_parseval_ship_desc:0 "A non-rigid airship from Berlin, packed on wagons, inflated where it is wanted. Germany will be pleased to sell it."
 AUH_svc_the_lebaudy_ship:0 "Buy the Lebaudy Pattern"
 AUH_svc_the_lebaudy_ship_desc:0 "A semi-rigid ship from Paris, the best observation platform in Europe, bought from a power Berlin would rather we did not visit."
 AUH_svc_the_korting_motor:0 "Buy the Motor, Build the Hull"
 AUH_svc_the_korting_motor_desc:0 "Only the Korting motor is imported. The envelope and the car are built at Fischamend, and the first three will be failures."
 AUH_svc_the_danube_patrol:0 "Run the Reach Past Belgrade"
 AUH_svc_the_danube_patrol_desc:0 "The flotilla takes the river past the Serbian capital with the colours up, and the crews learn the bends."
 AUH_court_the_corpus_christi_procession:0 "Walk Behind the Host"
 AUH_court_the_corpus_christi_procession_desc:0 "Corpus Christi in the inner city: the Emperor bareheaded behind the Host, the whole court in Spanish dress, the crowd four deep on the Graben."
 AUH_court_the_new_year_audience:0 "Receive the New Year Deputations"
 AUH_court_the_new_year_audience_desc:0 "Every deputation of the Empire received in order of precedence, in one long day, in a uniform coat."
 AUH_court_the_maundy_washing_of_feet:0 "Wash the Feet of Twelve Old Men"
 AUH_court_the_maundy_washing_of_feet_desc:0 "On Maundy Thursday the Emperor of Austria kneels and washes twelve pairs of feet, and the photograph is in every parish house by Easter."
 AUH_court_the_summer_at_ischl:0 "Take the Summer at Ischl"
 AUH_court_the_summer_at_ischl_desc:0 "Six weeks at the Kaiservilla, an old friend at the Villa Felicitas, and a walk in the Salzkammergut that is in nobody's timetable."
 AUH_court_the_press_bureau_retained:0 "Retain the Press Bureau"
 AUH_court_the_press_bureau_retained_desc:0 "The Ballhausplatz press bureau is put on a retainer to buy editions before they are read. It works. It is not free, and what it buys does not stay bought."
 AUH_sophie_the_princely_rank:0 "Create Her Princess of Hohenberg"
 AUH_sophie_the_princely_rank_desc:0 "The first rung: a princely title of the second class, which entitles her to nothing at court and to a great deal in the newspapers."
 AUH_sophie_the_duchess_of_hohenberg:0 "Raise Her to Duchess"
 AUH_sophie_the_duchess_of_hohenberg_desc:0 "The second rung: Duchess of Hohenberg, with the style of Highness, and the right to be seen standing next to her husband."
 AUH_sophie_the_seat_at_the_table:0 "Give Her the Seat at the Table"
 AUH_sophie_the_seat_at_the_table_desc:0 "The last rung, and the one the Lord High Steward will resign over: a seat at the imperial table ahead of the archduchesses of the blood."
 AUH_leopold_salvator:0 "Leopold Salvator von Osterreich-Toskana"
 AUH_otto_franz_josef:0 "Otto Franz Josef von Osterreich"
 AUH_ludwig_viktor:0 "Ludwig Viktor von Osterreich"
 AUH_sophie_chotek:0 "Sophie von Hohenberg"
 AUH_c_the_credit_of_the_dynasty:0 "The Credit of the Dynasty"
 AUH_nav_the_hulls_before_the_vote:0 "The Keels Before the Vote"
 AUH_nav_the_hulls_before_the_vote_desc:0 "Two hulls are on the slipways and no parliament has voted for them. The yards work at a pace nobody would dare authorise, and every estimate the Marinesektion submits from now on will be read with suspicion."
 AUH_nav_the_tegetthoff_programme:0 "The Tegetthoff Programme"
 AUH_nav_the_tegetthoff_programme_desc:0 "Four dreadnoughts on the establishment, twelve heavy guns apiece, and a naval office that has stopped apologising. The Adriatic now costs somebody else money to enter."
 AUH_nav_the_whitehead_works:0 "The Whitehead Works at Fiume"
 AUH_nav_the_whitehead_works_desc:0 "The Monarchy owns the works that invented the torpedo, holds first refusal on every pattern, and decides which foreign navy may be made dangerous this year."
 AUH_nav_the_danube_flotilla:0 "The Danube Flotilla"
 AUH_nav_the_danube_flotilla_desc:0 "Armoured monitors, a landing detachment and a chart of every sandbank from Pressburg to the Iron Gates. The river is a road, and the Monarchy holds both ends of it."
 AUH_nav_the_yard_that_failed:0 "The Yard That Failed"
 AUH_nav_the_yard_that_failed_desc:0 "Plate rejected at proof, a slipway idle, a commission of inquiry sitting in a room that smells of cigars. Every yard in the Monarchy is now working under a suspicion it has earned."
 AUH_arm_the_motor_column:0 "The Motor Column"
 AUH_arm_the_motor_column_desc:0 "Austro-Daimler road trains at the head of the heavy batteries. The guns that could not be moved can now be moved, at the price of a fuel column nobody has budgeted for."
 AUH_arm_the_m11_mortar:0 "The Thirty-and-a-Half"
 AUH_arm_the_m11_mortar_desc:0 "A motorised siege mortar of 30.5 centimetres that puts a shell through fourteen metres of concrete. There is no fortress on the Monarchy's frontiers that was designed against it."
 AUH_arm_the_contingent_unfrozen:0 "The Contingent Unfrozen"
 AUH_arm_the_contingent_unfrozen_desc:0 "The annual intake is raised for the first time since 1889. The barracks are full, the training cadres are thin, and for two years the army will be larger than it is good."
 AUH_arm_the_law_taken_by_ordinance:0 "The Law Taken by Ordinance"
 AUH_arm_the_law_taken_by_ordinance_desc:0 "The recruits were raised under the emergency paragraph. Every county clerk who has to enrol them knows it, and half of them are in no hurry."
 AUH_air_the_hall_at_fischamend:0 "The Hall at Fischamend"
 AUH_air_the_hall_at_fischamend_desc:0 "Two hundred metres of shed, a hydrogen plant and a mooring mast on the Danube meadow. The army's aeronautical establishment has an address."
 AUH_air_the_archdukes_squadron:0 "The Archduke's Squadron"
 AUH_air_the_archdukes_squadron_desc:0 "Fliegerkompanie 1: numbered machines, a list of pilots by name, a Habsburg over the door, and an accident rate that an archduke's patronage makes it possible to discuss honestly."
 AUH_c_the_house_law_has_teeth:0 "The House Law Has Teeth"
 AUH_c_the_house_law_has_teeth_desc:0 "The Family Statute is enforced against archdukes, which costs the crown nothing and gains it everything except the affection of its cousins. The Belvedere keeps an account."
 AUH_c_the_blind_eye:0 "The Blind Eye"
 AUH_c_the_blind_eye_desc:0 "The Emperor will not quarrel with his house. It is cheap in political power, expensive in credit, and the newspapers get better every year."
 AUH_c_the_clerical_affinity:0 "The Prince the Fathers Raised"
 AUH_c_the_clerical_affinity_desc:0 "A future Emperor formed by the Society of Jesus: adored from Zagreb to the Tyrol, distrusted in every liberal newspaper between Vienna and Prague."
 AUH_c_the_court_calendar:0 "The Court Calendar"
 AUH_c_the_court_calendar_desc:0 "The ceremonial year worked as an instrument of government. Every procession is a demonstration that the eleven peoples still stand in one room, in an order somebody wrote down."
 AUH_c_the_scandal_in_the_press:0 "The Scandal in the Press"
 AUH_c_the_scandal_in_the_press_desc:0 "The affair is in every paper from the Neue Freie Presse to the provincial weeklies, with drawings. It will pass. It always passes. It costs something every time."
 auh_clock.220.t:0 "The Bill Before the Delegations"
 auh_clock.220.d:0 "The estimate reaches the Delegations three months after the plates reached the slipway, and Excellency Montecuccoli is invited to explain the order of events. The Hungarian benches understand perfectly: they are being asked not to vote a fleet, but to avoid the scandal of two half-built hulls rusting at Trieste. It is an old trick and it has never yet failed, which is precisely what makes the benches so angry."
 auh_clock.220.a:0 "Let the keels stand. Ask for the money afterwards."
 auh_clock.220.b:0 "Withdraw the request; pay it from the naval fund."
 auh_clock.221.t:0 "The Yard Reports"
 auh_clock.221.d:0 "A commission has spent three weeks at the slipways with a hammer, a set of gauges and a very unhappy chief constructor. There is a report on the desk. Whether it describes armour plate that passed proof at the first attempt or a season's work that must be cut up and sold for scrap is the only thing anybody at the Marinesektion has thought about since Tuesday."
 auh_clock.221.a:0 "Strip the Fiume share and re-let the contract."
 auh_clock.221.b:0 "Pay the penalty; keep both yards working."
 auh_clock.221.c:0 "Read the report aloud. Every plate passed."
 auh_clock.222.t:0 "The Estimates from Rome"
 auh_clock.222.d:0 "The naval attache's report from Rome is on the table with the Italian estimates beside it. The Regia Marina has laid down a ship with a poet's name and twelve guns on the centre line, and the Chamber has voted three more without a division. Nobody in this room believes those ships are meant for the Mediterranean generally. They are meant for a sea a hundred kilometres wide with our coast on one side of it."
 auh_clock.222.a:0 "Admit the race. Answer it."
 auh_clock.222.b:0 "Note the estimate and look again next year."
 auh_clock.223.t:0 "The Credit Is Voted Backwards"
 auh_clock.223.d:0 "The flagship is afloat, named, blessed, photographed and reported in every newspaper in Europe, and the Delegations are now asked to approve the money that built her. The constitutional position is that they may refuse. The practical position is that the Monarchy would then own a battleship it had not paid for, which is a difficulty of a kind the Ballhausplatz has learned to enjoy."
 auh_clock.223.a:0 "Ask properly, and pay for the asking."
 auh_clock.223.b:0 "Observe that she is already afloat."
 auh_clock.224.t:0 "The Flotilla Asks for a Task"
 auh_clock.224.d:0 "The commander of the Danube flotilla submits, with the diffidence of a man who knows exactly what he is doing, a memorandum on the navigability of the reach below Semlin. It contains soundings, a note on the range of the Serbian batteries, and an appendix listing the bridges. It does not contain a recommendation. It does not need to."
 auh_clock.224.a:0 "The river is a road. Prepare to use it."
 auh_clock.224.b:0 "File the soundings. The flotilla patrols."
 auh_clock.225.t:0 "The Prinz-Heinrich Run"
 auh_clock.225.d:0 "Herr Porsche has entered his road train in the Prinz-Heinrich-Fahrt, which is a sporting event attended by half the general staffs of Europe and reported in newspapers that no ministry reads. The machine finishes. The military attaches take notes. The artillery inspectorate, which has been refusing the tractor for two years, discovers that it has always been enthusiastic."
 auh_clock.225.a:0 "Let him win it in front of the attaches."
 auh_clock.225.b:0 "Take the tractors off the course and give them to the batteries."
 auh_clock.226.t:0 "The Piece Fires at Felixdorf"
 auh_clock.226.d:0 "The M.11 stands on the range at Felixdorf on its firing platform, having been brought there in three loads behind Herr Porsche's road train. The first shell goes into the target and does not come out; the observers find it at the bottom of fourteen metres of reinforced concrete. Somebody at the back of the gallery says, quite clearly, that Liege was built in the eighties."
 auh_clock.226.a:0 "Order the battery. Say nothing to the attaches."
 auh_clock.227.t:0 "A Buyer at Fiume"
 auh_clock.227.d:0 "A foreign naval mission is at Fiume with an order book, and the Whitehead works would very much like to fill it. The pattern in question is the one with the gyroscope; it will make somebody else's torpedo boats a serious proposition in narrow waters. There are, unfortunately, several seas in Europe that are narrow."
 auh_clock.227.a:0 "Sell the licence. Take the percentage."
 auh_clock.227.b:0 "Refuse. The newest pattern stays at home."
 auh_clock.228.t:0 "The Keel at Fiume"
 auh_clock.228.d:0 "The Danubius works lay their first heavy keel with a band, a bishop, the Ban of Croatia, and a Hungarian minister who makes a speech about the maritime vocation of the Crown of Saint Stephen that would be more convincing if the Kingdom had a coastline longer than fifty kilometres. It is nonetheless the truth: Hungary is now building capital ships, and will remember it at every quota negotiation for a generation."
 auh_clock.228.a:0 "Let the minister make his speech."
 auh_clock.229.t:0 "How the Contingent Is to Be Passed"
 auh_clock.229.d:0 "Raising the annual intake requires an act of both parliaments, and both parliaments have discovered that refusing costs them nothing. There is a bill drafted. There is also, in a different drawer, a draft ordinance under the emergency paragraph, with a covering note observing that the last three governments have used it for less. The Chief of Staff has read both and has an opinion he has not been asked for."
 auh_clock.229.a:0 "Send the bill to both houses."
 auh_clock.229.b:0 "Take it by ordinance. The paragraph exists to be used."
 auh_clock.230.t:0 "The Machine at Wiener Neustadt"
 auh_clock.230.d:0 "Kress has his motor, his machine is on the water, and half the aeronautical section has come out to watch in a state of embarrassment. He is sixty-two years old. He has been doing this since before most of the officers present were commissioned, and he has been within a metre of the air more than once. The engine catches. The floats begin to lift."
 auh_clock.230.a:0 "It rises."
 auh_clock.230.b:0 "It does not rise. Write it down honestly."
 auh_clock.231.t:0 "Bleriot over the Prater"
 auh_clock.231.d:0 "Bleriot brings his monoplane to Vienna and flies it over the Prater in front of three hundred thousand people, the entire General Staff, and an eighty-year-old Emperor who has been driven out in an open carriage and who watches the whole thing without saying anything at all. Afterwards he remarks to his adjutant that he has now seen a man fly, and that he supposes it will be used for war."
 auh_clock.231.a:0 "He watched it all the way down."
 auh_clock.240.t:0 "The Household Chancellery Reports"
 auh_clock.240.d:0 "A file has come up from the Lord High Steward's office."
 auh_clock.240.a:0 "Read it."
 auh_clock.241.t:0 "The Archduke on the Ringstrasse"
 auh_clock.241.d:0 "Archduke Otto has driven down the Ringstrasse at four in the morning in evening dress and rather less, having made a wager at the Sacher which he has now won. There were witnesses. Several of them were journalists, and one of them writes for a Prague paper that has been waiting years for exactly this."
 auh_clock.241.a:0 "Let them print it."
 auh_clock.241.b:0 "The bureau will buy the edition."
 auh_clock.242.t:0 "The Archduke at the Church Door"
 auh_clock.242.d:0 "The archduke has appeared at the door of the Votivkirche in a condition, and a manner, which the parish priest has described to his bishop in a letter that is now in three chancelleries. The Catholic press of the south, which spends its year explaining to Croat and Slovene peasants that the House of Habsburg is the sword of the Church, has been asked for comment."
 auh_clock.242.a:0 "The statute applies to him as to anyone."
 auh_clock.242.b:0 "Say nothing. Let the bishops write."
 auh_clock.243.t:0 "The Affair at the Bath-House"
 auh_clock.243.d:0 "Archduke Ludwig Viktor, whom Vienna has called Luziwuzi for thirty years, has been struck in the face by an officer at the military swimming bath, in circumstances that every club in the city can describe and no newspaper may. The Emperor's brother cannot be tried, cannot be spoken of, and cannot be left in Vienna."
 auh_clock.243.a:0 "Klessheim. He is not to return."
 auh_clock.243.b:0 "It did not happen. Nothing happened."
 auh_clock.244.t:0 "The Winter of the Tuscan Line"
 auh_clock.244.d:0 "The Tuscan branch has produced another difficulty: an archduke who has renounced his rank, taken a common name, married a woman from a Salzburg dance hall and given three interviews about the tyranny of the House law. He is asking for his pension. The court circular has already struck him out; the treasury has not."
 auh_clock.244.a:0 "Strike him from the House and the army list."
 auh_clock.244.b:0 "Continue the pension. Quietly."
 auh_clock.245.t:0 "The Professor's Daughter"
 auh_clock.245.d:0 "A young archduke wishes to marry the daughter of a professor at Innsbruck. She is educated, respectable, admired by everyone who has met her, and by the Family Statute of 1839 she is not equal to him, which means her children would inherit nothing and the marriage would be a permanent standing rebuke to the law that says so. The Belvedere, for reasons that are not a secret to anybody, is following the case closely."
 auh_clock.245.a:0 "A renunciation in writing first."
 auh_clock.245.b:0 "Let them marry. The law can bend once more."
 auh_clock.246.t:0 "The Letter from the Belvedere"
 auh_clock.246.d:0 "The heir has written again, at length, in his own hand, about the treatment of his wife at the last court function. It is not a polite letter. It is not, on the facts, an unreasonable one either. The Lord High Steward has read it and recommends that it be acknowledged and filed, which is what was done with the last four."
 auh_clock.246.a:0 "Answer it. Give him something."
 auh_clock.246.b:0 "Acknowledge, and file it with the others."
 auh_clock.247.t:0 "What the Bureau Bought"
 auh_clock.247.d:0 "The edition the press bureau bought two years ago has been printed in Munich, with the receipts. The story is now the purchase and not the scandal, which is very much worse, and the papers that were paid are the loudest of all. The Hofburg is invited by a Berlin weekly to explain the accounting practices of the imperial household."
 auh_clock.247.a:0 "There is nothing to be said."
 auh_clock.248.t:0 "The Death of the Handsome Archduke"
 auh_clock.248.d:0 "Archduke Otto is dead at forty-one, after a long illness which the court circular describes as a chill. He was the handsomest man in the Monarchy, the worst-behaved, and by the ordinary reading of the House law the father of the Emperor after next. He leaves a widow, a great many debts, and a quiet boy of twenty who has never been considered by anybody."
 auh_clock.248.a:0 "Bury him with the full ceremonial of the House."
 auh_clock.248.b:0 "Four candles and no deputation."
 auh_clock.249.t:0 "The Mausoleum at Budapest"
 auh_clock.249.d:0 "The Kingdom is consecrating a mausoleum to Lajos Kossuth, who in 1849 read out the deposition of the House of Habsburg from the throne of Hungary and who died in Turin without asking pardon. Half the Diet will attend. The question in front of the Crown is not whether to prevent it, which is impossible, but whether to send a wreath."
 auh_clock.249.a:0 "Send a wreath in the Emperor's name."
 auh_clock.249.b:0 "The Hofburg will send nothing."
 auh_clock.250.t:0 "The Procession of the Sixty Years"
 auh_clock.250.d:0 "Twelve thousand people from every land of the Monarchy assemble on the Ringstrasse in the costume of their country: Tyrolean shooters, Hungarian magnates in leopard skin and heron plumes, Poles from Galicia, Ruthene peasants, Croats, Bosniaks in fez, Romanians from the Banat, Slovenes, Italians from the littoral, Czechs from Bohemia and Moravia. Every deputation that was invited has answered, one way or the other, and the Emperor will see the whole register walk past him in three hours."
 auh_clock.250.a:0 "The whole register marched."
 auh_clock.250.b:0 "Count the places that were left empty."
 auh_clock.250.c:0 "Cross to Buda and walk as King as well."
 auh_clock.251.t:0 "Montenuovo Reads the House Law"
 auh_clock.251.d:0 "Prince Montenuovo, Lord High Steward, is himself the grandson of a morganatic marriage, which is precisely why he enforces the statute with the exactness of a man who has read every word of it against his own name. He submits a schedule of the enforcement to date, with the archdukes listed by number and the savings to the privy purse in the right-hand column, and asks whether the Crown wishes him to continue."
 auh_clock.251.a:0 "Continue. To the letter."
 auh_clock.251.b:0 "Relax it. The house is not the enemy."
 auh_clock.252.t:0 "Montenuovo and the Order of Precedence"
 auh_clock.252.d:0 "The Lord High Steward has ruled again on where the wife of the heir to the throne walks, sits, and is announced, and the ruling is the same as the last four. He is entirely within the statute. He has also, by everybody's reckoning, made a permanent enemy of the man who will be his sovereign, and he does not appear to care in the slightest."
 auh_clock.252.a:0 "Precedence stands as written."
 auh_clock.252.b:0 "Overrule him this once."
 auh_clock.253.t:0 "The Renunciations Are Read Again"
 auh_clock.253.d:0 "With the line altered by a death, the House archive is opened and every renunciation in it is put on the table: the ones signed under pressure, the ones signed by men who have since changed their minds, and the two that were never properly countersigned. The Crown may confirm the whole file at once, or it may reopen it, which is what several archdukes have been waiting twenty years for somebody to do."
 auh_clock.253.a:0 "Confirm the file. All of it."
 auh_clock.253.b:0 "Reopen it and see who comes forward."
 auh_clock.254.t:0 "The Crown of Saint Stephen Is Weighed"
 auh_clock.254.d:0 "The crown itself is in the castle at Buda, in a room with two keys held by two officials who are not permitted to travel together. The Diet's committee wishes to know whether the next King will be crowned with it and will swear the constitutional oath on the mound, in the open air, with the four swords. The heir has said in private that he considers the oath a fiction extorted from a dying man in 1867. The committee has been told he said no such thing."
 auh_clock.254.a:0 "Promise the oath. It costs nothing today."
 auh_clock.254.b:0 "Give no undertaking. Let them wait."
 auh_clock.255.t:0 "The Walk at Ischl"
 auh_clock.255.d:0 "Breakfast at half past four, the despatch boxes cleared by eight, and then a walk on the Jainzen with a friend of thirty years and no chamberlain within a kilometre. He comes back visibly younger. The court physicians, who have prescribed everything else, have quietly agreed among themselves that this is the only treatment that has ever worked."
 auh_clock.255.a:0 "Six weeks, and no despatches after eight."
