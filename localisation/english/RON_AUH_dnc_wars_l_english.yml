l_english:

 AUH_dnc_kriegsfaelle_cat:0 "The Cases in the Drawer"
 AUH_dnc_kriegsfaelle_cat_desc:0 "Kriegsfall I, Kriegsfall B, Kriegsfall R, Kriegsfall U. The Operations Bureau keeps a plan for every neighbour and one for the kingdom across the river. A plan on the shelf is not a war; it is the difference between a war and a rout."

 AUHDNC_bp_the_case_against_belgrade:0 "The Circular to the Chancelleries"
 AUHDNC_bp_the_case_against_belgrade_desc:0 "A printed dossier goes to every legation in Europe: the Kingdom's ministry, it says, pays the agitators of our southern counties. Some of it is true. The Ballhausplatz takes the case out of the hands of the county prosecutors and makes it a matter of state, which means it can no longer be quietly dropped."
 AUHDNC_bp_the_documents_from_the_legation:0 "The Documents from the Legation"
 AUHDNC_bp_the_documents_from_the_legation_desc:0 "Count Forgach's mission in Belgrade forwards a bundle of papers bought from a man who says he copies them at night. The Foreign Ministry does not ask where the paper was made. The court will ask. What the court will find is not written down anywhere, and will not be until the verdict is read."
 AUHDNC_bp_the_scandal_reaches_london:0 "The Scandal Reaches London"
 AUHDNC_bp_the_scandal_reaches_london_desc:0 "The Times has the whole affair, in order, with names. The Ballhausplatz can no longer treat European opinion as weather; it must be answered, and answering costs political capital every quarter."
 AUHDNC_bp_the_peace_the_ballhausplatz_writes:0 "The Peace the Ballhausplatz Writes"
 AUHDNC_bp_the_peace_the_ballhausplatz_writes_desc:0 "The soldiers have had their run; now the treaty is drafted on the Ballhausplatz, and the Ministry proves that a Great Power is the state that can end a war as well as begin one. Occupied ground is consolidated, garrisons are relieved, and the reign is closed with a signature rather than a bulletin."
 AUHDNC_bp_the_railway_to_the_east:0 "The Railway to the East"
 AUHDNC_bp_the_railway_to_the_east_desc:0 "The survey becomes a roadbed. Uvac to Mitrovica, and from Mitrovica the Sultan's trunk line runs to the Aegean. Two etappen brigades are raised to hold the strip while it is built. Belgrade understands exactly what a railway through the Sanjak means, and so does Petersburg."
 AUHDNC_bp_the_guns_on_credit_for_belgrade:0 "The Guns on Credit for Belgrade"
 AUHDNC_bp_the_guns_on_credit_for_belgrade_desc:0 "If the Kingdom must rearm, let it rearm with Pilsen steel on Vienna credit, and let every battery it owns depend on our spare parts. Creusot will underbid us. Creusot always underbids us."
 AUHDNC_bp_the_ships_that_pass_the_straits:0 "The Ships That Pass the Straits"
 AUHDNC_bp_the_ships_that_pass_the_straits_desc:0 "Izvolsky wanted the Straits opened to Russian warships and believed he had been promised it. Whether the Ministry now writes down what was said at the hunting lodge, or lets Petersburg discover the omission from the newspapers, decides which empire is the injured party for the next decade."
 AUHDNC_bp_the_note_from_berlin:0 "The Note from Berlin"
 AUHDNC_bp_the_note_from_berlin_desc:0 "Berlin states, in a note whose language is chosen to be quoted, that it stands beside its ally in shining armour. Guns, staff talks and a promise arrive together. Nothing in the east can be attempted without this note, and the note is not free: it is paid for in a decade of dependence."
 AUHDNC_bp_the_ally_who_plans_to_defect:0 "The Ally Who Plans to Defect"
 AUHDNC_bp_the_ally_who_plans_to_defect_desc:0 "The Evidenzbureau reads the naval convention our ally signed with us and the staff study our ally wrote against us. Both are genuine. Knowing which one Rome means is worth an army corps on the day the Alps are crossed."
 AUHDNC_bp_the_alphabet_of_monastir:0 "The Alphabet of Monastir"
 AUHDNC_bp_the_alphabet_of_monastir_desc:0 "Lajos Thalloczy's office pays for Albanian schools, prints an Albanian alphabet and subsidises the chieftains of the north. It is a nation built as an instrument, and the instrument only works if it is used for years before it is needed."
 AUHDNC_bp_the_faculty_at_the_allys_port:0 "The Faculty at the Ally's Port"
 AUHDNC_bp_the_faculty_at_the_allys_port_desc:0 "The Italian law faculty the students rioted for at Innsbruck is granted at last, and granted at Trieste. Rome is satisfied and the irredenta loses its best grievance. The Slovenes of the Littoral, who were promised the same city, read the decree as a sentence."
 AUHDNC_bp_the_compensation_of_the_seventh_article:0 "The Compensation of the Seventh Article"
 AUHDNC_bp_the_compensation_of_the_seventh_article_desc:0 "Article VII of the alliance says neither of us may change the Balkan status quo without compensating the other. For once we intend to keep it: Rome is paid in advance, in writing, and the road south is opened by a signature instead of a mobilisation."
 AUHDNC_arm_the_cases_in_the_drawer:0 "The Cases in the Drawer"
 AUHDNC_arm_the_cases_in_the_drawer_desc:0 "The Operations Bureau is told to stop drafting for a war and start drafting for all of them. Kriegsfall I against the ally, Kriegsfall B against the Kingdom, Kriegsfall R against the east, Kriegsfall U against the counties. Each case, once filed, is a plan the army can actually execute; each case, once filed, is also a document that can be copied."
 AUHDNC_arm_the_memoranda_of_the_chief:0 "The Memoranda of the Chief"
 AUHDNC_arm_the_memoranda_of_the_chief_desc:0 "The Chief of the General Staff writes to the Crown, again, and will write again after that. Every memorandum sharpens the army and hardens the ministry against him, and the ledger of refusals ends in a resignation offered on the desk."
 AUHDNC_m_the_hunt_for_the_traitor:0 "The Hunt for the Traitor"
 AUHDNC_m_the_hunt_for_the_traitor_desc:0 "Somebody in this building sells the mobilisation timetables. The counter-espionage group begins to watch the poste restante windows of the capital and to open the letters that are never called for. It is slow, it is expensive, and only the army that polices itself will pay for it."
 AUHDNC_nav_the_battery_on_the_mountain:0 "The Battery on the Mountain"
 AUHDNC_nav_the_battery_on_the_mountain_desc:0 "A siege battery is emplaced above the Bocche and ranged on the heights that a foreign kingdom keeps guns on. From this day the Lovcen is a demand the Monarchy can make whenever it chooses, and the cheapest war in Europe is always available to us."
 AUHDNC_x_the_window_at_messina:0 "The Window at Messina"
 AUHDNC_x_the_window_at_messina_desc:0 "The earth has done what the General Staff could not: the ally's army is in the ruins of Sicily and Calabria, its fleet is carrying bread. The window is open for one hundred and fifty days. It does not ask whether the Alpine works are finished. It only remembers afterwards."
 AUHDNC_x_the_corridor_to_salonika:0 "The Corridor to Salonika"
 AUHDNC_x_the_corridor_to_salonika_desc:0 "The Sanjak line is laid, the garrisons are in the strip, and the empire to the south is convulsed by its own constitution. The road runs Uvac, Mitrovica, Skopje, Monastir, Salonika. Take it now or explain for thirty years why it was not taken."
 AUHDNC_x_the_reckoning_with_russia:0 "The Reckoning with Russia"
 AUHDNC_x_the_reckoning_with_russia_desc:0 "Petersburg is exhausted and Berlin has put its promise in writing. The Congress Kingdom of Poland is administered by a governor-general who has no soldiers to spare. There will not be a second note from Berlin, and there will not be a second Russia this weak."

 AUH_kf_the_memorandum_is_submitted:0 "Submit Another Memorandum"
 AUH_kf_the_memorandum_is_submitted_desc:0 "The Chief writes to the Crown on the necessity of the preventive war. Each memorandum trains the staff, sours the ministry, and adds a document to the safe that the traitor will eventually reach."
 AUH_kf_file_the_case_against_italy:0 "File Kriegsfall I"
 AUH_kf_file_the_case_against_italy_desc:0 "Mountain warfare, the Isonzo crossings, the Tyrolean works. Filed, it is an army that knows where it is going."
 AUH_kf_file_the_case_in_the_balkans:0 "File Kriegsfall B"
 AUH_kf_file_the_case_in_the_balkans_desc:0 "The Save and Drina crossings, the Kolubara valley, the third week. Filed, the punitive expedition becomes a campaign."
 AUH_kf_file_the_case_in_the_east:0 "File Kriegsfall R"
 AUH_kf_file_the_case_in_the_east_desc:0 "The Galician deployment, the fortress of Przemysl, the railheads at Lemberg. The most valuable case in the safe, and the one Petersburg would most like to read."
 AUH_kf_file_the_case_at_home:0 "File Kriegsfall U"
 AUH_kf_file_the_case_at_home_desc:0 "The occupation of the Hungarian counties by the common army. It is written by officers who hope it is never opened, and the Magyar deputies know it exists."
 AUH_kf_the_army_crosses_the_save:0 "Kriegsfall B: The Army Crosses the Save"
 AUH_kf_the_army_crosses_the_save_desc:0 "Execute the filed case against the Kingdom."
 AUH_kf_the_heights_are_demanded:0 "The Heights Are Demanded"
 AUH_kf_the_heights_are_demanded_desc:0 "The battery above the Bocche is ranged and the note goes to Cetinje: the guns on the Lovcen come down, or we take the mountain."
 AUH_kf_the_counties_are_occupied:0 "The Counties Are Occupied"
 AUH_kf_the_counties_are_occupied_desc:0 "Common-army garrisons move into the county seats. Order is restored and the ledger of coercion grows."
 AUH_kf_the_dossier_is_circulated:0 "Circulate the Dossier"
 AUH_kf_the_dossier_is_circulated_desc:0 "Another chancellery receives the papers, and another newspaper receives the chancellery's leak."
 AUH_kf_the_witnesses_are_bought:0 "Buy the Witnesses"
 AUH_kf_the_witnesses_are_bought_desc:0 "The forgery ledger is spent at once on testimony. Whatever the court decides, the war goal is easier to justify and the Croats have learned what our courts are for."
 AUH_kf_the_answer_to_the_powers:0 "Answer the Powers"
 AUH_kf_the_answer_to_the_powers_desc:0 "The press bureau drafts a reply for London and Paris. It costs political capital and buys back a little of the world's patience."
 AUH_kf_the_export_credit_is_renewed:0 "Renew the Export Credit"
 AUH_kf_the_export_credit_is_renewed_desc:0 "Another tranche of Pilsen guns leaves for Belgrade on Vienna's paper."
 AUH_kf_the_note_to_petersburg:0 "Send a Note to Petersburg"
 AUH_kf_the_note_to_petersburg_desc:0 "An explanation is offered before it is demanded. Russian anger falls."
 AUH_kf_the_staff_talks_with_berlin:0 "Staff Talks with Berlin"
 AUH_kf_the_staff_talks_with_berlin_desc:0 "Conrad and Moltke exchange deployments. Every conversation makes the eastern case sounder and Petersburg angrier."
 AUH_kf_the_naval_convention_is_read:0 "Read the Naval Convention"
 AUH_kf_the_naval_convention_is_read_desc:0 "The ally's own signature tells us what the ally intends. Kriegsfall I is rewritten around it."
 AUH_alb_the_schools_of_the_alphabet:0 "Fund the Albanian Schools"
 AUH_alb_the_schools_of_the_alphabet_desc:0 "Primers, teachers and one alphabet instead of three. The client is built a year at a time."
 AUH_alb_the_subsidy_to_the_chieftains:0 "Subsidise the Chieftains"
 AUH_alb_the_subsidy_to_the_chieftains_desc:0 "Rifles and silver go north from Scutari. The Sultan protests, the Kingdom protests, and the mountains remember who paid."
 AUH_alb_the_congress_at_monastir:0 "The Congress at Monastir"
 AUH_alb_the_congress_at_monastir_desc:0 "The alphabet is settled in congress under our patronage. From this day there is an Albanian nation to hand a prince to."
 AUH_kf_the_reserve_battalions_go_down:0 "Send the Reserve Battalions Down"
 AUH_kf_the_reserve_battalions_go_down_desc:0 "Fresh battalions relieve the etappen troops in the corridor. The drain eases; the manpower does not come back."
 AUH_kf_the_poste_restante_is_watched:0 "Watch the Poste Restante"
 AUH_kf_the_poste_restante_is_watched_desc:0 "The unclaimed letters of the capital are opened one by one."
 AUH_kf_the_letters_from_the_east:0 "Open the Letters from the East"
 AUH_kf_the_letters_from_the_east_desc:0 "The ministry, which does not police the army, pays twice over to have the army's post read. It has run out of other explanations."
 AUH_kf_the_riflemen_of_galicia:0 "License the Riflemen of Galicia"
 AUH_kf_the_riflemen_of_galicia_desc:0 "Pilsudski's shooting clubs are licensed as sporting associations, armed out of the Landwehr depots and drilled where the Russian consul can see them."
 AUH_kf_the_compensation_is_valued:0 "Value the Compensation"
 AUH_kf_the_compensation_is_valued_desc:0 "What Rome is owed under Article VII is settled in Albania rather than in cash, and Rome takes it."

 AUH_arm_the_cases_in_the_drawer:0 "The Cases in the Drawer"
 AUH_arm_the_cases_in_the_drawer_desc:0 "Four war plans, kept current, wargamed each spring."
 AUH_arm_the_memoranda_of_the_chief:0 "The Memoranda of the Chief"
 AUH_arm_the_memoranda_of_the_chief_desc:0 "The staff is sharpened and the cabinet is tired."
 AUH_m_the_hunt_for_the_traitor:0 "The Hunt for the Traitor"
 AUH_m_the_hunt_for_the_traitor_desc:0 "Letters are opened. Officers are watched. The building has learned to be careful."
 AUH_kf_the_case_against_italy:0 "Kriegsfall I"
 AUH_kf_the_case_against_italy_desc:0 "The plan for the Alpine front, kept current."
 AUH_kf_the_case_in_the_balkans:0 "Kriegsfall B"
 AUH_kf_the_case_in_the_balkans_desc:0 "The plan for the Save and the Drina, kept current."
 AUH_kf_the_case_in_the_east:0 "Kriegsfall R"
 AUH_kf_the_case_in_the_east_desc:0 "The plan for Galicia, kept current."
 AUH_kf_the_case_at_home:0 "Kriegsfall U"
 AUH_kf_the_case_at_home_desc:0 "The plan for the counties, kept current, and known to be kept."
 AUH_kf_the_bought_witnesses:0 "The Bought Witnesses"
 AUH_kf_the_bought_witnesses_desc:0 "A war goal is cheap when the evidence is arranged in advance. So is a scandal."
 AUH_kf_the_rifle_clubs_of_galicia:0 "The Rifle Clubs of Galicia"
 AUH_kf_the_rifle_clubs_of_galicia_desc:0 "Sporting associations with Mannlichers, drilling in the Carpathian foothills."
 AUH_alb_the_albanian_office:0 "The Albanian Office"
 AUH_alb_the_albanian_office_desc:0 "Schools, subsidies and a printing press, administered from Vienna for a country that does not yet exist."
 AUH_bp_the_circular_to_the_chancelleries:0 "The Circular to the Chancelleries"
 AUH_bp_the_circular_to_the_chancelleries_desc:0 "The case against Belgrade is now a matter of state, and the state has committed itself in print."
 AUH_bp_the_papers_from_belgrade:0 "The Papers from Belgrade"
 AUH_bp_the_papers_from_belgrade_desc:0 "The legation's bundle is in the ministry's safe. Nobody has asked where the paper was milled."
 AUH_bp_the_press_of_the_powers:0 "The Press of the Powers"
 AUH_bp_the_press_of_the_powers_desc:0 "European opinion must now be answered quarterly, and answering it costs."
 AUH_bp_the_line_to_mitrovica:0 "The Line to Mitrovica"
 AUH_bp_the_line_to_mitrovica_desc:0 "A railway through the strip, and the supply columns that follow a railway."
 AUH_bp_the_guns_on_credit:0 "The Guns on Credit"
 AUH_bp_the_guns_on_credit_desc:0 "Belgrade's batteries depend on Pilsen's spare parts."
 AUH_bp_the_bargain_at_the_straits:0 "The Bargain at the Straits"
 AUH_bp_the_bargain_at_the_straits_desc:0 "The Adriatic squadron may pass where it could not pass before."
 AUH_bp_the_note_from_berlin:0 "The Note from Berlin"
 AUH_bp_the_note_from_berlin_desc:0 "In shining armour, at a decade's interest."
 AUH_bp_the_ally_who_plans_to_defect:0 "The Ally Who Plans to Defect"
 AUH_bp_the_ally_who_plans_to_defect_desc:0 "We have read their study of us, and they have not read ours of them."
 AUH_bp_the_office_for_albania:0 "The Office for Albania"
 AUH_bp_the_office_for_albania_desc:0 "A department of the Ballhausplatz for a nation under construction."
 AUH_bp_the_faculty_at_the_port:0 "The Faculty at the Port"
 AUH_bp_the_faculty_at_the_port_desc:0 "An Italian law faculty at Trieste. The irredenta has lost its best grievance and the Slovenes have found one."
 AUH_bp_the_seventh_article:0 "The Seventh Article Honoured"
 AUH_bp_the_seventh_article_desc:0 "Compensation agreed in advance, which is the only kind that ever prevents a war."
 AUH_bp_the_peace_of_the_ballhausplatz:0 "The Peace the Ballhausplatz Wrote"
 AUH_bp_the_peace_of_the_ballhausplatz_desc:0 "A Great Power is the state that can end its own war."
 AUH_nav_the_battery_on_the_mountain:0 "The Battery on the Mountain"
 AUH_nav_the_battery_on_the_mountain_desc:0 "Ranged on the Lovcen, and everybody in Cetinje knows the elevation."
 AUH_x_the_irredenta_is_permanent:0 "The Irredenta Is Permanent"
 AUH_x_the_irredenta_is_permanent_desc:0 "There is no longer an Italian in the Monarchy who can be argued with. This does not expire."
 AUH_x_the_corridor_to_salonika:0 "The Corridor to Salonika"
 AUH_x_the_corridor_to_salonika_desc:0 "Our exporters reach the Aegean without asking anyone's leave, and our etappen troops hold four hundred kilometres of mountain."
 AUH_x_the_price_of_the_note:0 "The Price of the Note"
 AUH_x_the_price_of_the_note_desc:0 "Berlin was paid in influence, and the instalments run for a decade."
 AUH_kf_the_kingdom_of_venetia:0 "The Kingdom of Lombardy-Venetia"
 AUH_kf_the_kingdom_of_venetia_desc:0 "A Habsburg viceroy in Venice again, sixty years after the last one left."
 AUH_kf_the_indemnity_of_udine:0 "The Indemnity of Udine"
 AUH_kf_the_indemnity_of_udine_desc:0 "A straightened frontier and a payment in gold."
 AUH_kf_the_road_to_salonika:0 "The Road to Salonika"
 AUH_kf_the_road_to_salonika_desc:0 "An Austrian flag on the Aegean and a bill for it every month."
 AUH_kf_the_principality_of_albania:0 "The Principality of Albania"
 AUH_kf_the_principality_of_albania_desc:0 "The office in Vienna has produced a country, and the country has a prince."
 AUH_kf_the_crown_of_the_vistula:0 "The Crown of the Vistula"
 AUH_kf_the_crown_of_the_vistula_desc:0 "A Habsburg wears the crown of Poland. Every Pole in Galicia is now loyal and every Ruthene is now afraid."
 AUH_kf_the_army_that_lost_the_east:0 "The Army That Lost the East"
 AUH_kf_the_army_that_lost_the_east_desc:0 "It was not the plan that failed. Somebody sold the plan."
 AUH_kf_the_opening_clean:0 "The Plan Held"
 AUH_kf_the_opening_clean_desc:0 "The trains ran to the timetable and the corps closed up on schedule."
 AUH_kf_the_opening_ragged:0 "The Trains Were Late"
 AUH_kf_the_opening_ragged_desc:0 "Not a disaster. Not the timetable either."
 AUH_kf_the_opening_bad:0 "In Piecemeal"
 AUH_kf_the_opening_bad_desc:0 "The regiments went in as they arrived, which is how regiments are wasted."
 AUH_kf_the_opening_disaster:0 "The First Fortnight"
 AUH_kf_the_opening_disaster_desc:0 "The enemy was waiting where the enemy should not have known to wait."
 AUH_kf_the_false_files:0 "The False Files"
 AUH_kf_the_false_files_desc:0 "The traitor's last deliveries were written by us. The enemy has deployed against a war we are not fighting."

 AUH_kf_the_garrisons_of_the_corridor:0 "The Garrisons of the Corridor"
 AUH_kf_the_garrisons_of_the_corridor_desc:0 "Four hundred kilometres of mountain road, held battalion by battalion, paid for out of the recruit classes."

 AUH_lajos_thalloczy:0 "Lajos Thalloczy"
 AUH_bp_thalloczy_at_the_ballhausplatz:0 "Lajos Thalloczy"
 AUH_bp_thalloczy_at_the_ballhausplatz_desc:0 "Historian of the South Slavs, archivist of the common ministry, and the man who invented a nation out of a grammar."

 AUH_tb_kf_the_circular:0 "The Circular to the Chancelleries"
 AUH_tb_kf_the_legation_papers:0 "The Papers from the Legation"
 AUH_tb_kf_the_line_east:0 "The Line to Mitrovica"
 AUH_tb_kf_the_export_orders:0 "The Export Orders"
 AUH_tb_kf_the_export_credit:0 "The Export Credit"
 AUH_tb_kf_the_straits:0 "The Question of the Straits"
