l_english:

 #Military, armament, naval and air consequence events (RON_AUH_mil_crisis.txt)

 auh_mil_crisis.1.t:0 "The Sections of the Staff"
 auh_mil_crisis.1.d:0 "The General Staff has its own credit now, its own chancellery, its own maps on its own walls — but the section chiefs still have to be named, and every name is a vote for one school of war over another. Beck's men want caution written into the regulations from the first page; a younger, louder faction wants the offensive taught from the first lecture instead. Whichever the Chief favours, the other half of the building will remember it came second."
 auh_mil_crisis.1.a:0 "Give the sections to Beck's own men."
 auh_mil_crisis.1.b:0 "Push the young offensive officers ahead of their seniority."
 auh_mil_crisis.1.c:0 "Split the sections between the two schools and hope they share a corridor."
 AUH_mc_staff_caution_tt:0 "The staff settles into caution; the offensive faction is quietly passed over."
 AUH_mc_staff_offensive_tt:0 "Seniority is set aside for the offensive men; the passed-over generals do not forget it."
 AUH_mc_staff_split_tt:0 "The two schools share the building and agree on nothing in it."

 auh_mil_crisis.2.t:0 "The Pilsen Shop Floor"
 auh_mil_crisis.2.d:0 "The order for the heavy pieces sits in Škoda's books at Pilsen, and the works director says the delivery date can be kept only if the night shifts are doubled and the men are told the overtime is patriotic rather than paid. He wants a straight answer from Vienna before the furnaces are lit again — and so, separately, do the men on the floor."
 auh_mil_crisis.2.a:0 "Force the pace. Double shifts, no excuses."
 auh_mil_crisis.2.b:0 "Let Škoda set its own pace and accept the delay."
 auh_mil_crisis.2.c:0 "Split the order — some guns to the Arsenal in Vienna instead."
 AUH_mc_skoda_overtime_tt:0 "The night shifts are doubled; Pilsen delivers on time and remembers the cost."
 AUH_mc_skoda_wait_tt:0 "The guns arrive late, and quietly, and nobody outside the ministry notices."
 AUH_mc_skoda_split_order_tt:0 "Bohemia loses its monopoly on the order, and Pilsen knows exactly why."

 auh_mil_crisis.3.t:0 "The Memorandum Reaches the Ballhausplatz"
 auh_mil_crisis.3.d:0 "Conrad's paper on the uses of a preventive war — against Italy this time, though the Serbian draft sits in the same drawer — has found its way out of the War Ministry and onto Aehrenthal's desk, and from there, everyone assumes, into at least one newspaper's morning file. The Foreign Ministry wants to know whether the army now speaks for the Monarchy, or only for itself."
 auh_mil_crisis.3.a:0 "Let the memorandum stand. The Foreign Ministry can adjust."
 auh_mil_crisis.3.b:0 "Disavow it publicly and rein Conrad in."
 auh_mil_crisis.3.c:0 "Say nothing to anyone and let the story starve."
 AUH_mc_conrad_stands_tt:0 "Conrad's paper stands unrepudiated; Rome reads it as intended."
 AUH_mc_conrad_disavowed_tt:0 "Conrad is disavowed in public, and the staff hears the rebuke through the walls."
 AUH_mc_conrad_filed_tt:0 "The paper is filed and forgotten by everyone except the man who wrote it."

 auh_mil_crisis.4.t:0 "An Affair of Honour at the Garrison"
 auh_mil_crisis.4.d:0 "A young captain, tired of hearing that Feldzeugmeister Beck's caution is simply prudence, called a senior man a coward's echo in front of witnesses at the officers' mess. The court of honour has been asked to rule before the matter reaches the duelling ground — or the newspapers, whichever comes first."
 auh_mil_crisis.4.a:0 "Convene the court of honour and cashier the young captain."
 auh_mil_crisis.4.b:0 "Let the duel proceed quietly and look away."
 auh_mil_crisis.4.c:0 "Transfer the young captain to a border garrison instead."
 AUH_mc_duel_cashiered_tt:0 "The captain is dismissed the service; the mess falls quiet on the subject."
 AUH_mc_duel_looked_away_tt:0 "The duel is fought at dawn without the court's blessing, and the papers find out anyway."
 AUH_mc_duel_transferred_tt:0 "The captain is posted to the frontier before the court can rule at all."

 auh_mil_crisis.5.t:0 "Shots on the Sava"
 auh_mil_crisis.5.d:0 "A Covering Brigade patrol met a Serbian gendarme post in the river mist, and somebody's rifle went off — whose, nobody will now agree. Belgrade is demanding an apology, the local commander is demanding permission to hold the ground he is standing on, and the telegraph office in Vienna is waiting on an answer before the story outruns it."
 auh_mil_crisis.5.a:0 "Hold the line. Answer fire with fire."
 auh_mil_crisis.5.b:0 "Withdraw the patrol and protest through the legation."
 auh_mil_crisis.5.c:0 "Court-martial the patrol commander to prove restraint."
 AUH_mc_sava_held_the_line_tt:0 "The patrol holds its ground; Belgrade files a protest that goes nowhere."
 AUH_mc_sava_withdrawn_tt:0 "The patrol falls back, and the frontier garrisons call it a retreat."
 AUH_mc_sava_court_martial_tt:0 "The commander is broken to prove the incident was not policy."
 AUH_mc_the_sava_incident_threat:0 "Austro-Hungarian and Serbian patrols exchange fire on the Sava"

 auh_mil_crisis.6.t:0 "Plate for Three Hulls"
 auh_mil_crisis.6.d:0 "Witkowitz cannot roll armour plate for three hulls at once and keep its export contracts at the same rate; the yard at Pola sits idle on two slips while Vienna decides whose order comes first. The Delegations will want to know, at the next vote, why the smaller powers seem to launch faster ships for less money."
 auh_mil_crisis.6.a:0 "Divert plate from the export order to the navy's own hulls."
 auh_mil_crisis.6.b:0 "Accept the delay and let the ships come late."
 auh_mil_crisis.6.c:0 "Stage the launch ceremony on an unfinished hull, dressed for the crowd."
 AUH_mc_karl_plate_diverted_tt:0 "The export order is broken to feed Pola's slips; the client does not forget it."
 AUH_mc_karl_delay_accepted_tt:0 "The third hull slips its date, quietly, and the yard is not blamed for it."
 AUH_mc_karl_staged_launch_tt:0 "A hull still full of scaffolding is christened for the photographers."

 auh_mil_crisis.7.t:0 "An Incident Above the Bocche"
 auh_mil_crisis.7.d:0 "A Montenegrin border patrol and an Austro-Hungarian coastal detachment traded shots near the heights above the bay — no one dead, but a boat holed and a corporal reported missing before he turned up drunk in a Cattaro tavern by evening. Cetinje wants an apology; the squadron commander on the spot wants orders, not a note for the archive."
 auh_mil_crisis.7.a:0 "Send the squadron on a punitive cruise along the coast."
 auh_mil_crisis.7.b:0 "Restrain the squadron and protest through diplomatic channels."
 auh_mil_crisis.7.c:0 "Reinforce the coastal batteries quietly and say nothing."
 AUH_mc_cattaro_show_of_force_tt:0 "The ironclads cruise the coast in plain sight of Cetinje's ministers."
 AUH_mc_cattaro_restrained_tt:0 "The squadron stays in harbour; the protest note does the work instead."
 AUH_mc_cattaro_quiet_batteries_tt:0 "The batteries above the bay are quietly strengthened, unbudgeted and unannounced."

 auh_mil_crisis.8.t:0 "The Dove Falls at the Trial"
 auh_mil_crisis.8.d:0 "A production Taube, flying the acceptance trial for the army's order, side-slipped and came down short of the field at Wiener Neustadt. The pilot is alive; the aeroplane is not. The mill town's foreman wants to know, before the morning papers are printed, whether the contract survives the crash."
 auh_mil_crisis.8.a:0 "Suspend flights and order an inquiry."
 auh_mil_crisis.8.b:0 "Fly on, decorate the pilot, and keep the order running."
 auh_mil_crisis.8.c:0 "Quietly reduce the order and split it to a second workshop."
 AUH_mc_taube_inquiry_tt:0 "Flights are grounded pending the inquiry; the programme stalls on the ground."
 AUH_mc_taube_flies_on_tt:0 "The trial resumes within the week, and the crash becomes a decoration citation."
 AUH_mc_taube_order_split_tt:0 "Part of the order moves to a second workshop, and the mill town reads the insult plainly."
