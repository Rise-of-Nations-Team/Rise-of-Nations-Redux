l_english:

#Focuses
 CANDNC_the_order_of_14_october: "The Order of 14 October"
 CANDNC_the_order_of_14_october_desc: "Cabinet equips a thousand men for South Africa and lays the paper before the House afterwards. Bourassa gave up Labelle over it in October. Laurier says it is no precedent, and nobody believes him."
 CANDNC_not_one_man_for_africa: "Not One Man for Africa"
 CANDNC_not_one_man_for_africa_desc: "The transports lie unloaded at Halifax and the Commons vote down what the Cabinet had already done. Ontario burns Laurier in effigy, and Downing Street asks Lord Minto to explain a refusal no dominion ever risked."
 CANDNC_no_precedent_is_admitted: "The Answer of 13 March"
 CANDNC_no_precedent_is_admitted_desc: "Bourassa, returned unopposed for Labelle, moves that the contingent bind nobody. Laurier replies that every case will be weighed on its own, which commits the Dominion to nothing and settles nothing."
 CANDNC_the_reservoir_of_the_empire: "The Reservoir of the Empire"
 CANDNC_the_reservoir_of_the_empire_desc: "Otter's battalion is only the first draft. Seven thousand three hundred and sixty-eight Canadians will serve before Vereeniging, and the Militia Department learns to fill a troopship in six weeks."
 CANDNC_minto_asks_for_his_passports: "Lord Minto Asks to Be Relieved"
 CANDNC_minto_asks_for_his_passports_desc: "A Governor General who cannot get the Empire's war out of his ministers has no office left. He writes to Chamberlain that he would rather come home, and Ottawa finds it has no rule for what follows."
 CANDNC_the_member_for_labelle: "The Member for Labelle"
 CANDNC_the_member_for_labelle_desc: "Asselin and Lavergne find him a press. Le Nationaliste comes out of Montreal every week: autonomy in the Empire, autonomy in the federation, and a tariff written in Canada for Canadians."
 CANDNC_the_night_at_paardeberg: "Sixty-Five Yards from Cronje"
 CANDNC_the_night_at_paardeberg_desc: "The Royal Canadians dig in the dark within shouting distance of the Boer trenches on 27 February. Cronje surrenders at dawn and the Militia Department has a battle honour bought with its own dead."
 CANDNC_the_horse_a_peer_paid_for: "Strathcona Pays for a Regiment"
 CANDNC_the_horse_a_peer_paid_for_desc: "The High Commissioner raises six hundred western riders at his own charge, gives them to Sam Steele and puts them aboard at Halifax on 17 March. No vote of supply, and a precedent nobody costed."
 CANDNC_the_summons_to_london: "The Coronation Conference"
 CANDNC_the_summons_to_london_desc: "Every self-governing colony sends its premier to London for the crowning. Between the banquets the Colonial Secretary means to settle what the Empire is for, and he expects Canada to speak first."
 CANDNC_seats_at_westminster: "The Federation He Really Offered"
 CANDNC_seats_at_westminster_desc: "Chamberlain never hid it: contribution, council and customs union are one plan, and its end is a parliament of the whole Empire. Canada says yes to a thing that was offered and never taken."
 CANDNC_three_times_no: "No, No, and No Again"
 CANDNC_three_times_no_desc: "No permanent council, no standing contribution to defence, no Zollverein. Laurier keeps the British preference he grants of his own will and gives London nothing it can put in a minute book."
 CANDNC_the_veto_we_never_dared_ask: "The Demand Laurier Never Made"
 CANDNC_the_veto_we_never_dared_ask_desc: "If the Empire's foreign policy can put Canadian men in the field, Canada will hold a hand on it. No dominion asked this in 1902; Whitehall would not have believed the question was serious."
 CANDNC_members_for_the_dominions: "Colonial Members Take Their Seats"
 CANDNC_members_for_the_dominions_desc: "Canadian members cross for the session and sit below the gangway at Westminster. They vote on the Empire's estimates, and discover that the Empire now votes on theirs."
 CANDNC_the_contribution_asked_for_in_1902: "The Contribution of 1902"
 CANDNC_the_contribution_asked_for_in_1902_desc: "A standing cheque to the Admiralty, the second of Chamberlain's demands. New Zealand will do exactly this in 1909 and Australia will refuse it; here Ottawa signs first and builds nothing at home."
 CANDNC_the_zollverein_of_the_empire: "One Tariff Wall Around the Empire"
 CANDNC_the_zollverein_of_the_empire_desc: "The preference becomes a bargain instead of a gift. Montreal gets the imperial market and loses the right to shut the door on Birmingham; Fielding keeps his three columns and loses their point."
 CANDNC_the_permanent_imperial_council: "A Council That Sits All Year"
 CANDNC_the_permanent_imperial_council_desc: "The conference stops being an occasion and becomes an office, with a register, a secretary and standing committees. What it settles between conferences, Ottawa is bound by without a vote."
 CANDNC_one_throne_one_fleet_one_flag: "One Fleet, One Flag"
 CANDNC_one_throne_one_fleet_one_flag_desc: "Canadian yards build to Admiralty drawings, Canadian officers take imperial commissions, and the militia drills to a common establishment. The Dominion stops keeping a defence of its own."
 CANDNC_a_nation_inside_the_union: "A Nation Inside the Union"
 CANDNC_a_nation_inside_the_union_desc: "Quebec is told the bargain has a floor: no conscription for imperial wars, the tariff stays in Ottawa, and the schools are nobody's business in London. Bourassa calls it a lease with a short term."
 CANDNC_the_call_that_cannot_be_refused: "The Empire Calls In Its Share"
 CANDNC_the_call_that_cannot_be_refused_desc: "The council has voted the Dominion's contingent and the militia orders are printed before the Cabinet has met. Under the old rule Laurier could weigh each case; that rule is gone."
 CANDNC_greater_britain: "Greater Britain"
 CANDNC_greater_britain_desc: "Dominion now means what Rome meant by a province with the franchise. Canadian grain, Canadian nickel and Canadian men are counted in the imperial ledger, and the ledger is kept in London."
 CANDNC_the_preference_we_give_for_nothing: "A Gift, Not a Bargain"
 CANDNC_the_preference_we_give_for_nothing_desc: "British goods keep their reduced rate because Ottawa chooses to leave it there, and for no other reason. It buys goodwill in Birmingham and commits the Dominion to nothing it can be held to."
 CANDNC_six_impartial_jurists: "Six Impartial Jurists"
 CANDNC_six_impartial_jurists_desc: "The Hay-Herbert convention of 24 January names three men a side to settle the panhandle. Canada is not a party: it is a British treaty, and the British member is the Lord Chief Justice of England."
 CANDNC_no_british_plaintiff_for_our_border: "No British Plaintiff for Our Border"
 CANDNC_no_british_plaintiff_for_our_border_desc: "Ottawa tells London the convention will not be ratified in its name and that the panhandle is not England's to arbitrate. Roosevelt has already told his staff what he will do if the tribunal fails."
 CANDNC_the_power_that_we_lack: "The Power to Treat"
 CANDNC_the_power_that_we_lack_desc: "Laurier tells the Commons on 23 October that the humiliation is not the line but the standing: Canada cannot make a treaty, and until it can, someone will trade its coast for a friendship."
 CANDNC_no_secretariat_for_mr_deakin: "Mr Deakin Wants a Secretariat"
 CANDNC_no_secretariat_for_mr_deakin_desc: "Melbourne proposes a standing imperial staff between conferences. Laurier kills it in committee: a secretariat writes agendas, agendas make policy, and policy made in London is paid for in Quebec."
 CANDNC_a_desk_of_our_own_in_whitehall: "A Desk of Our Own in Whitehall"
 CANDNC_a_desk_of_our_own_in_whitehall_desc: "If the secretariat is coming, a Canadian will sit in it and read the papers first. Deakin gets his office, Ottawa gets a man inside it, and the price is a standing duty to be consulted and to answer."
 CANDNC_the_word_dominion: "The Word Dominion"
 CANDNC_the_word_dominion_desc: "The 1907 conference renames the self-governing colonies and meets every four years between prime ministers. A better name, a Dominions branch in the Colonial Office, and not one new power."
 CANDNC_signed_by_his_majestys_ambassador: "Mr Bryce Signs for Us"
 CANDNC_signed_by_his_majestys_ambassador_desc: "Gibbons argues every clause of the boundary waters at Washington and James Bryce puts his name to it on 11 January. Canada takes three seats of six on the commission and no signature of its own."
 CANDNC_a_plenipotentiary_of_our_own: "A Plenipotentiary of Our Own"
 CANDNC_a_plenipotentiary_of_our_own_desc: "Ottawa refuses to let an ambassador of the King sign what Canadian officers wrote. The treaty waits on a desk in Washington while London considers whether a dominion may hold a pen at all."
 CANDNC_a_room_above_a_shop_on_bank_street: "Above a Shop on Bank Street"
 CANDNC_a_room_above_a_shop_on_bank_street_desc: "External Affairs opens on 1 June with Joseph Pope, a handful of clerks and the imperial correspondence to file. It cannot make a treaty. It exists so that one day something can."
 CANDNC_the_partner_and_not_the_ward: "Partner, Not Ward"
 CANDNC_the_partner_and_not_the_ward_desc: "Nothing has been signed and nothing has been surrendered. The Dominion has a title, a department, a tariff of its own making and a habit of saying no, which is the only autonomy it ever paid for."
 CANDNC_a_veto_at_the_council_table: "The Veto Is Conceded"
 CANDNC_a_veto_at_the_council_table_desc: "Whitehall concedes what it never meant to discuss: no imperial engagement binds Canada unless Ottawa has agreed beforehand. The Foreign Office begins keeping two sets of minutes."
 CANDNC_the_lynn_canal_is_not_theirs: "The Heads of the Lynn Canal"
 CANDNC_the_lynn_canal_is_not_theirs_desc: "Skagway and Dyea are the only deep water the Yukon has, and a dominion with a hand on imperial policy will not let a British judge give them away. Ottawa states the claim in its own name."
 CANDNC_the_line_we_can_live_with: "A Line We Can Live With"
 CANDNC_the_line_we_can_live_with_desc: "Pearse and Wales islands at the mouth of the Portland Canal, and nothing else. Jette and Aylesworth still refuse to sign, but Ottawa files the award and keeps the grievance for a better year."
 CANDNC_our_own_foreign_policy: "A Foreign Policy of Our Own"
 CANDNC_our_own_foreign_policy_desc: "Not consultation and not a veto, but a policy: what Canada owes, whom it recognises, where it will not go. Nothing in the Act of 1867 forbids it, and nothing in it provides for it either."
 CANDNC_the_flag_comes_down_at_halifax: "The Garrisons Go Home"
 CANDNC_the_flag_comes_down_at_halifax_desc: "London hands over Halifax and Esquimalt and marches the last imperial companies aboard. The forts, the coast guns and the pay of the men who serve them pass to a Dominion that budgeted for neither."
 CANDNC_keep_the_squadron_at_esquimalt: "Pay Them to Stay"
 CANDNC_keep_the_squadron_at_esquimalt_desc: "Rather than inherit two fortresses, Ottawa offers to meet the cost of the imperial garrisons where they stand. The white ensign stays over Esquimalt and the accounts are settled in London."
 CANDNC_a_minister_at_washington: "A Minister at Washington"
 CANDNC_a_minister_at_washington_desc: "Not a commissioner for trade but a minister with a residence, sent by Ottawa and received by the State Department. The British embassy on Connecticut Avenue is told after the fact."
 CANDNC_the_letters_patent_rewritten: "The Letters Patent Rewritten"
 CANDNC_the_letters_patent_rewritten_desc: "The Governor General is named on Canadian advice, keeps no private correspondence with the Colonial Office and reserves nothing. He becomes what the office would only officially become much later."
 CANDNC_the_crown_stays_downing_street_goes: "Keep the King, Lose the Office"
 CANDNC_the_crown_stays_downing_street_goes_desc: "The Crown is not the grievance; the department that speaks in its name is. Edward stays King in Canada, and the Colonial Office stops hearing anything before the newspapers do."
 CANDNC_the_dominion_signs_alone: "Signed at Ottawa"
 CANDNC_the_dominion_signs_alone_desc: "A Canadian plenipotentiary signs a treaty with a foreign power under no British counter-signature. Twenty years before the halibut is argued over, the thing is simply done."
 CANDNC_the_last_appeal_to_london: "The Last Appeal to London"
 CANDNC_the_last_appeal_to_london_desc: "The Judicial Committee of the Privy Council ceases to be the last word on Canadian law. Provincial rights men cheer, then read a judgment handed down by a court that sits in Ottawa."
 CANDNC_the_link_is_cut: "The Link Is Cut"
 CANDNC_the_link_is_cut_desc: "Westminster repeals under protest what it can no longer refuse. The flag over Parliament Hill flies for a country with no ambassador, no fleet, and a neighbour of ninety million people."
 CANDNC_a_country_that_answers_for_itself: "A Country That Answers for Itself"
 CANDNC_a_country_that_answers_for_itself_desc: "Every wire from London is now advice. Every mistake is Canadian, every treaty is Canadian, and the first man blamed for a foreign quarrel will be a minister sitting in Ottawa."
 CANDNC_the_conference_on_defence: "The Defence Conference of 1909"
 CANDNC_the_conference_on_defence_desc: "The German programme has frightened the Admiralty into calling the Dominions to London. Brodeur and Borden go with instructions to promise nothing until the Commons has been heard."
 CANDNC_the_cheque_new_zealand_wrote: "The Cheque New Zealand Wrote"
 CANDNC_the_cheque_new_zealand_wrote_desc: "Wellington has offered to pay for a battle cruiser outright. Ottawa can do the same: one line in the estimates, a ship the Admiralty owns and commands, and not a rivet driven in a Canadian yard."
 CANDNC_a_fleet_unit_like_australias: "A Fleet Unit, as Australia Chose"
 CANDNC_a_fleet_unit_like_australias_desc: "Melbourne is building its own navy rather than paying for someone else's, and the Admiralty has drawn the fleet unit that goes with it. Canada can lay down cruisers at home and man them itself."
 CANDNC_not_a_dollar_for_dreadnoughts: "Mr Monk's Answer"
 CANDNC_not_a_dollar_for_dreadnoughts_desc: "The member for Jacques-Cartier will vote no ship and no cheque without a plebiscite, and half of Quebec is behind him. Foster's resolution passed because nobody made him say what it meant."
 CANDNC_the_price_of_unanimity: "The Price of Unanimity"
 CANDNC_the_price_of_unanimity_desc: "The resolution of 29 March passed without a division because Ontario and Quebec each read it their own way. The bill is not due yet, and when it comes it will be presented twice."
 CANDNC_the_alliance_we_never_signed: "The Alliance of 30 January"
 CANDNC_the_alliance_we_never_signed_desc: "Britain and Japan bind themselves in London and Canada is inside the bargain without a signature. British Columbia's exclusion laws are reserved or disallowed, one after another, to keep Tokyo content."
 CANDNC_an_exclusion_act_for_british_columbia: "Victoria Writes Its Own Act"
 CANDNC_an_exclusion_act_for_british_columbia_desc: "The legislature passes exclusion in plain words and dares Ottawa to disallow it. Tokyo protests, the Colonial Office reaches for the reserve power, and the coast cheers a law that may not last the year."
 CANDNC_mr_lemieux_goes_to_tokyo: "Mr Lemieux Goes to Tokyo"
 CANDNC_mr_lemieux_goes_to_tokyo_desc: "After the September riot on Powell Street the Postmaster General sails for Japan and returns with Hayashi's word: four hundred labourers a year, counted in Tokyo. No statute and no disallowance."
 CANDNC_five_eighteenths_of_a_cable: "Five Eighteenths of a Cable"
 CANDNC_five_eighteenths_of_a_cable_desc: "Fleming's line runs from Bamfield to Fanning Island, Fiji and Norfolk without touching foreign soil, and Canada carries the largest single share of a wire the Admiralty will use in war."
 CANDNC_eighty_thousand_for_mr_marconi: "Eighty Thousand for Mr Marconi"
 CANDNC_eighty_thousand_for_mr_marconi_desc: "Newfoundland's telegraph monopoly drove him out, so Ottawa buys him with a subsidy and a site at Table Head. Glace Bay talks to Poldhu, and the patents stay in a British company's safe."
 CANDNC_the_tricentenary_at_quebec: "Three Hundred Years at Quebec"
 CANDNC_the_tricentenary_at_quebec_desc: "Earl Grey wants pageants on the Plains of Abraham, a fleet in the basin and the Prince of Wales on the platform. The Battlefields Commission is buying the ground the show will be staged on."
 CANDNC_the_prince_on_the_plains: "The Prince on the Plains"
 CANDNC_the_prince_on_the_plains_desc: "Twelve days of processions, warships in the river, and Wolfe and Montcalm honoured together before the heir to the throne. The site is saved, and Quebec is told what its history is for."
 CANDNC_champlain_without_the_fleet: "Champlain Without the Fleet"
 CANDNC_champlain_without_the_fleet_desc: "A founding, not a conquest: Champlain's landing kept and the squadron uninvited. Ottawa loses a spectacle of unity, Quebec keeps a feast of its own, and the Plains stay in private hands."
 CANDNC_what_the_dominion_has_become: "What the Dominion Has Become"
 CANDNC_what_the_dominion_has_become_desc: "Seven million people, three roads to the Pacific, and a question answered. Whatever was chosen in 1900 is the ordinary law of the country now, and the men who chose it are out of the room."

#Tooltips
 CANDNC_case_by_case_tt: "Each imperial request is weighed on its own merits, and nothing agreed now binds the next Parliament."
 CANDNC_three_times_no_tt: "The British preference remains a gift of the Canadian Parliament, revocable by it and owed to nobody."
 CANDNC_a_nation_inside_the_union_tt: "No man may be sent out of Canada for an imperial war without a vote of the Canadian House."
 CANDNC_no_secretariat_for_mr_deakin_tt: "No standing imperial body may set an agenda binding on Ottawa between conferences."
 CANDNC_the_last_appeal_to_london_tt: "Canadian appeals end in Canada."
 CANDNC_the_conference_on_defence_tt: "The Commons will be heard before a ship or a dollar is promised to the Admiralty."
 CANDNC_not_a_dollar_for_dreadnoughts_tt: "No naval expenditure without a plebiscite of the electors."
 CANDNC_the_alliance_we_never_signed_tt: "Legislation offensive to Japan may be reserved or disallowed while the alliance of 1902 stands."
 CANDNC_the_tricentenary_at_quebec_tt: "The Plains of Abraham pass to the National Battlefields Commission."
 CANDNC_champlain_without_the_fleet_tt: "The commemoration is Canadien, and the Empire attends as a guest or not at all."

#Threats and bonuses
 CANDNC_constitutional_crisis: "Constitutional Crisis with London"
 CANDNC_the_imperial_call: "The Empire Calls In Its Share"
 CANDNC_the_alaska_confrontation: "Confrontation on the Alaska Boundary"
 CANDNC_the_break_with_london: "The Break with London"
 CANDNC_paardeberg_lesson: "The Lesson of Paardeberg"
 CANDNC_imperial_yards: "Admiralty Drawings"
 CANDNC_admiralty_plans: "Admiralty Plans"
 CANDNC_pacific_cable: "The Pacific Cable"
 CANDNC_wireless_at_table_head: "Wireless at Table Head"

#Ideas
 CAN_the_refusal_of_1899: "The Refusal of 1899"
 CAN_the_refusal_of_1899_desc: "The Commons voted down a war the Cabinet had already joined. Ottawa is master in its own house, and will be reminded of it every time it wants a favour from Whitehall."
 CAN_the_press_of_the_league: "The Nationalist Press"
 CAN_the_press_of_the_league_desc: "Le Nationaliste comes out of Montreal every week. It teaches a public to read imperial requests as bills, and it will never again print a government's word without a comment beside it."
 CAN_seats_at_westminster: "Members at Westminster"
 CAN_seats_at_westminster_desc: "Canadian members vote on imperial estimates and imperial members vote on Canadian ones. The market is the Empire's, the manpower is common, and Ottawa is one voice among many."
 CAN_the_imperial_zollverein: "The Imperial Customs Union"
 CAN_the_imperial_zollverein_desc: "One tariff wall around the Empire and free trade inside it. Canadian wheat and Canadian nickel move at preference, and no Canadian Parliament sets a rate by itself again."
 CAN_the_veto_at_the_council_table: "A Veto at the Council Table"
 CAN_the_veto_at_the_council_table_desc: "No imperial engagement binds Canada without Ottawa's prior consent. The other dominions have noticed, the Foreign Office has noticed, and both know what it cost to concede."
 CAN_the_title_of_dominion: "The Title of Dominion"
 CAN_the_title_of_dominion_desc: "The self-governing colonies have a name of their own and a conference of prime ministers every four years. It is rank without power, and rank is worth something."
 CAN_the_room_on_bank_street: "The Room on Bank Street"
 CAN_the_room_on_bank_street_desc: "An under-secretary, a few clerks, and every imperial despatch filed where a Canadian can read it. Small, cheap, and the beginning of a foreign service."
 CAN_the_treaty_power: "The Treaty Power"
 CAN_the_treaty_power_desc: "Canada states its own position, recognises whom it chooses and answers for what it signs. There are no embassies behind it yet, and everybody it deals with knows that."
 CAN_the_imperial_garrisons: "The Garrisons We Inherited"
 CAN_the_imperial_garrisons_desc: "Halifax and Esquimalt, with their guns, works and pay lists, have passed to Ottawa. Until the estimates catch up, the Dominion is paying for forts it has never manned."
 CAN_the_broken_link: "The Broken Link"
 CAN_the_broken_link_desc: "No overlord, no preference worth the name, and no fleet in the Atlantic that answers to anyone else. Ottawa is free and alone in the same sentence."

#Events
 can_dnc_a.1.t: "Ottawa Reads the Order Aloud"
 can_dnc_a.1.d: "The order in council of 14 October is tabled in a House that never voted it. A thousand men are equipped at Canadian charge, their pay passing to the imperial account the day they land in Cape Town. Tupper wants a vote taken; Bourassa wants the order withdrawn; the Prime Minister wants neither."
 can_dnc_a.1.a: "Table it and let them shout."
 can_dnc_a.1.b: "The Cabinet is the country."
 can_dnc_a.2.t: "Downing Street to His Excellency"
 can_dnc_a.2.d: "The Colonial Office observes, at length and very politely, that the Governor General holds the King's commission, that supply may be reserved, and that no dominion has yet found out what happens when a ministry simply says no. Lord Minto asks Ottawa what he is to answer."
 can_dnc_a.2.a: "Let him reserve the estimates."
 can_dnc_a.2.b: "Answer politely. Send nothing."
 can_dnc_a.2.c: "Offer money in place of men."
 can_dnc_a.3.t: "His Excellency Asks to Go Home"
 can_dnc_a.3.d: "Minto writes to Chamberlain that a Governor General who cannot carry the Empire's business is of no use in Ottawa. There is no rule for replacing him, no rule for refusing his replacement, and no precedent anywhere in the Empire for either."
 can_dnc_a.3.a: "Name the next one ourselves."
 can_dnc_a.3.b: "Let London send whom it pleases."
 can_dnc_a.4.t: "Three Demands and a Coronation"
 can_dnc_a.4.d: "Chamberlain lays out a permanent council, a regular contribution to defence and a customs union of the Empire, then looks down the table at Canada. Australia and New Zealand are waiting to hear the answer before they give their own."
 can_dnc_a.4.a: "Speak to the council first."
 can_dnc_a.4.b: "Speak to the contribution first."
 can_dnc_a.4.c: "Speak to the tariff first."
 can_dnc_a.5.t: "One Resolution, Two Countries"
 can_dnc_a.5.d: "Foster's motion carries without a division. The Globe prints it as Canada's contribution to the Empire; Le Nationaliste prints it as Canada's refusal to contribute. Mr Monk rises to ask which of the two papers the government reads in the morning."
 can_dnc_a.5.a: "Let each read what suits him."
 can_dnc_a.5.b: "Say plainly what we meant."
 can_dnc_a.5.c: "Give Bourassa the last word."
 can_dnc_a.6.t: "The Wire from the Colonial Office"
 can_dnc_a.6.d: "The Empire is at war somewhere and the council has voted the Dominion's share. Militia orders go to the printers before the Cabinet meets, and there are posters against them on Rue Saint-Jean before noon."
 can_dnc_a.6.a: "The share will be found."
 can_dnc_a.6.b: "Not this time."
 can_dnc_a.7.t: "Four Votes to Two"
 can_dnc_a.7.d: "Lord Alverstone sits with the three Americans. The heads of the Lynn Canal stay theirs, Canada takes two islands at the mouth of the Portland Canal, and the two Canadian commissioners refuse to put their names to the award."
 can_dnc_a.7.a: "Protest, and sign nothing."
 can_dnc_a.7.b: "Tell the House what we lack."
 can_dnc_a.7.c: "The line will not be walked."
 can_dnc_a.8.t: "Surveyors, With Infantry Behind Them"
 can_dnc_a.8.d: "American parties are cutting the boundary above Skagway with an escort at their backs. London counsels patience. The nearest Canadian force of any kind is nine hundred miles away and consists mostly of policemen."
 can_dnc_a.8.a: "Send the field force north."
 can_dnc_a.8.b: "Make a war goal of it."
 can_dnc_a.8.c: "Swallow it. Write it down."
 can_dnc_a.9.t: "A Colony Stops an Imperial Policy"
 can_dnc_a.9.d: "For the first time a self-governing dominion can halt an imperial engagement before it is announced. Melbourne and Wellington ask for the same by the next mail, and the Foreign Office calls it the end of one policy for the whole Empire."
 can_dnc_a.9.a: "Ottawa has a hand on the rein."
 can_dnc_a.9.b: "London has lost the Empire's foreign policy."
 can_dnc_a.10.t: "Repealed Under Protest"
 can_dnc_a.10.d: "Westminster gives up what it can no longer hold. The flag over Parliament Hill now stands for a country with no ambassadors, no fleet worth the name, and ninety million people on the other side of one long border."
 can_dnc_a.10.a: "We will make our own arrangements."
 can_dnc_a.10.b: "Ask Washington for a guarantee."
