 BEL_k_the_right_writes_the_leash_short_tt:0 "§YSettlement:§! the Charter is drafted narrowly."
 BEL_k_the_left_writes_the_leash_long_tt:0 "§YCartel:§! every restriction the reformers ever demanded goes into the text."
 BEL_k_the_crown_writes_its_own_leash_tt:0 "§RCrown:§! the Charter is drafted at the palace."
 BEL_k_nobody_governs_the_leash_tt:0 "§YNo bloc has taken the Chamber:§! the Charter is drafted by officials and nobody signs their name to it."
 BEL_k_the_leash_binds_a_new_king_tt:0 "§GLeopold is dead:§! the Charter is the first law of Albert's reign."
 BEL_k_the_governor_answers_the_palace_tt:0 "§RCrown:§! the Governor-General is a royal appointment and corresponds with the palace."
 BEL_k_the_governor_answers_the_house_tt:0 "§YCartel:§! the Governor-General may be summoned to the bar of the Chamber."
 BEL_k_the_settlement_likes_a_hierarchy_tt:0 "§YSettlement:§! a clean chain of command from Boma downward is exactly what the Right wanted."
 BEL_k_the_report_meets_the_denials_tt:0 "§RThe denials are on the record:§! the first annual report is read against everything we told the world before."
 BEL_k_the_report_meets_no_denials_tt:0 "§GNothing has been denied:§! the report is read as a document rather than as a confession."
 BEL_k_the_cartel_reads_it_aloud_tt:0 "§YCartel:§! the report is read aloud in full over three sittings."
 BEL_k_the_crown_tables_it_late_tt:0 "§RCrown:§! the report is tabled late and debated by eleven deputies."
 BEL_k_the_settlement_tables_it_thin_tt:0 "§YSettlement:§! the report is accurate and forty pages too short."
 BEL_k_the_bench_sits_where_it_can_tt:0 "§RThe districts are still a company's map:§! the tribunal sits where there is a building."
 BEL_k_the_crown_names_the_judges_tt:0 "§RCrown:§! the magistrates are royal nominees."
 BEL_k_a_state_of_statutes_writes_another_tt:0 "§YTwo peoples:§! a kingdom of statutes drafts a third without difficulty."
 BEL_k_one_kingdom_dislikes_a_second_code_tt:0 "§RBelgium is one kingdom under one law:§! a separate code for the basin is resented on principle."
 BEL_k_the_kingdom_has_not_decided_itself_tt:0 "The kingdom has not settled its own constitution, and drafts one abroad."
 BEL_k_the_settlement_signs_the_code_tt:0 "§YSettlement:§! the code is signed without a division."
 BEL_k_the_cartel_wrote_this_article_tt:0 "§YCartel:§! this article was in the Workers' programme before it was in anybody's bill."
 BEL_k_the_crown_is_told_no_tt:0 "§RCrown:§! the palace wanted those regiments and is refused them."
 BEL_k_the_article_passes_quietly_tt:0 "The article passes without a debate anybody remembers."
 BEL_k_the_article_costs_us_east_tt:0 "§RA danger has been named on the Meuse:§! twenty thousand rifles have just been declared unavailable."
 BEL_k_the_crown_gets_its_regiments_tt:0 "§RCrown:§! the palace has wanted an African reserve from the beginning."
 BEL_k_the_settlement_swallows_the_regiments_tt:0 "§YSettlement:§! the Right votes it as a measure of order and does not enjoy explaining it."
 BEL_k_the_cartel_splits_over_the_regiments_tt:0 "§RCartel:§! half the majority will not vote for this and says so."
 BEL_k_the_palace_keeps_the_force_tt:0 "§RCrown:§! the Force remains, in all that matters, the King's."
 BEL_k_the_house_counts_the_force_tt:0 "§YCartel:§! the establishment is voted and counted every year."
 BEL_k_the_school_teaches_two_tongues_tt:0 "§GThe army already commands in both tongues:§! the school at Boma simply follows the regulation."
 BEL_k_the_school_teaches_one_tongue_tt:0 "§RThe army commands in French:§! so does the school, and half the cadets do not."
 BEL_k_the_missions_supply_the_school_tt:0 "§YSettlement:§! the missions supply half the instructors and all of the chaplains."
 BEL_k_the_school_follows_the_statutes_tt:0 "§YTwo peoples:§! the syllabus at Boma is written in both tongues without an argument."
 BEL_k_the_school_follows_one_kingdom_tt:0 "§ROne kingdom:§! the school teaches in French and the Flemish cadets are told to keep up."
 BEL_k_a_kingdom_of_statutes_registers_chiefs_tt:0 "§YTwo peoples:§! a state that has written one statute for a people can write another."
 BEL_k_one_law_will_not_register_chiefs_tt:0 "§ROne kingdom:§! recognising customary chiefs contradicts everything the unitary statute says."
 BEL_k_the_chiefs_are_registered_untidily_tt:0 "The chieftaincies are registered by officials working without a doctrine."
 BEL_k_the_cartel_signs_the_commissions_tt:0 "§YCartel:§! the warrants are signed and defended from the tribune."
 BEL_k_the_palace_holds_the_commissions_tt:0 "§RCrown:§! the warrants sit at the palace awaiting a signature that is not hurried."
 BEL_k_the_settlement_signs_a_few_tt:0 "§YSettlement:§! a dozen warrants are signed and the rest are said to be under study."
 BEL_k_the_house_writes_the_committees_charter_tt:0 "§GThe Chamber has taken the colony seriously:§! the Committee's powers are written by deputies."
 BEL_k_the_settlement_and_the_committee_tt:0 "§YSettlement:§! the Committee's directors and the ministry's benches dine together."
 BEL_k_the_cartel_and_the_committee_tt:0 "§YCartel:§! the Committee is put under a parliamentary rapporteur it did not ask for."
 BEL_k_the_left_asks_who_digs_it_tt:0 "§YCartel:§! the recruitment figures for the mines are demanded within a fortnight."
 BEL_k_the_palace_asks_nothing_tt:0 "§RCrown:§! nobody asks where the labour comes from and no answer is prepared."
 BEL_k_the_copper_goes_out_through_nobody_tt:0 "There is no government south of the border to sign a traffic agreement with."
 BEL_k_the_concession_is_signed_at_the_palace_tt:0 "§RCrown:§! the traffic convention is signed where the Chamber cannot read it."
 BEL_k_the_right_takes_the_credit_tt:0 "§YSettlement:§! the Prime Minister is henceforth a colonial statesman."
 BEL_k_the_left_takes_the_credit_tt:0 "§YCartel:§! the reform association is invited to the opening and behaves impeccably."
 BEL_k_the_palace_takes_the_credit_tt:0 "§RCrown:§! the King opens the line and the ministers stand behind him."
 BEL_k_the_basin_can_be_called_on_tt:0 "§RThe colonial army may serve in Europe:§! the basin is now a military reserve as well as a colony."
 BEL_k_the_basin_cannot_be_called_on_tt:0 "§GThe colony's troops stay in Africa:§! the basin is administered rather than mobilised."
 BEL_p_the_mouth_has_no_owner_tt:0 "There is no government at The Hague to negotiate the estuary with."
