 BEL_k_the_cartel_reads_it_aloud_tt:0 "§YCartel:§! the report is read aloud in full over three sittings."
 BEL_k_the_crown_tables_it_late_tt:0 "§RCrown:§! the report is tabled late and debated by eleven deputies."
 BEL_k_the_settlement_tables_it_thin_tt:0 "§YSettlement:§! the report is accurate and forty pages too short."
 BEL_k_the_bench_sits_where_it_can_tt:0 "§RThe districts are still a company's map:§! the tribunal sits where there is a building."
 BEL_k_the_crown_names_the_judges_tt:0 "§RCrown:§! the magistrates are royal nominees."
 BEL_k_a_state_of_statutes_writes_another_tt:0 "§YTwo peoples:§! a kingdom of statutes drafts a third without difficulty."
 BEL_k_one_kingdom_dislikes_a_second_code_tt:0 "§RBelgium is one kingdom under one law:§! a separate code for the basin is resented on principle."
 BEL_k_the_kingdom_has_not_decided_itself_tt:0 "The kingdom has not settled its own constitution, and drafts one abroad."
 BEL_k_the_settlement_signs_the_code_tt:0 "§YSettlement:§! the code is signed without a division."
 BEL_k_the_cartel_wrote_this_article_tt:0 "§YCartel:§! this article was in the Workers' programme before it was in anybody's bill."
 BEL_k_the_crown_is_told_no_tt:0 "§RCrown:§! the palace wanted those regiments and is refused them."
 BEL_k_the_article_passes_quietly_tt:0 "The article passes without a debate anybody remembers."
 BEL_k_the_article_costs_us_east_tt:0 "§RA danger has been named on the Meuse:§! twenty thousand rifles have just been declared unavailable."
 BEL_k_the_crown_gets_its_regiments_tt:0 "§RCrown:§! the palace has wanted an African reserve from the beginning."
 BEL_k_the_settlement_swallows_the_regiments_tt:0 "§YSettlement:§! the Right votes it as a measure of order and does not enjoy explaining it."
 BEL_k_the_cartel_splits_over_the_regiments_tt:0 "§RCartel:§! half the majority will not vote for this and says so."
 BEL_k_the_palace_keeps_the_force_tt:0 "§RCrown:§! the Force remains, in all that matters, the King's."
 BEL_k_the_house_counts_the_force_tt:0 "§YCartel:§! the establishment is voted and counted every year."
 BEL_k_the_school_teaches_two_tongues_tt:0 "§GThe army already commands in both tongues:§! the school at Boma simply follows the regulation."
