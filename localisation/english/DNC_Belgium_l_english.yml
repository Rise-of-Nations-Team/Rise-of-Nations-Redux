 BEL_s_the_bishops_speak_for_the_ministry_tt:0 "§YSettlement:§! the letter is read as a government document with a mitre on it."
 BEL_s_the_bishops_are_received_at_the_palace_tt:0 "§RCrown:§! the hierarchy is received privately and the ministers read about it afterwards."
