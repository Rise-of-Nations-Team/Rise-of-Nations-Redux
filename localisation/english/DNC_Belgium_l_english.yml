 BEL_p_the_king_keeps_a_villa_there_tt:0 "§YSettlement:§! the season at Ostend is a matter of national dignity and is funded as one."
 BEL_p_the_palace_keeps_the_season_tt:0 "§RCrown:§! the works at Ostend follow the King's taste and the estimates follow the works."
 BEL_p_the_left_bank_is_flemish_by_statute_tt:0 "§YTwo peoples:§! the communes on the left bank are expropriated under a statute they helped."
