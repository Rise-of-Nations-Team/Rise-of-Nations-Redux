 BEL_b_the_gendarmes_at_the_pithead_desc:0 "Standing detachments where the winding gear is."
 BEL_b_no_women_underground:0 "No Women Underground"
 BEL_b_no_women_underground_desc:0 "Women off the pit brow and children off the haulage."
 BEL_b_the_day_of_rest:0 "The Day of Rest"
 BEL_b_the_day_of_rest_desc:0 "One day in seven with the gear stopped."
 BEL_b_the_bourse_du_travail:0 "The Bourse du Travail"
 BEL_b_the_bourse_du_travail_desc:0 "A hall, a library and a legal office for the syndicates."
