 BEL_p_a_sea_lane_of_our_own:0 "Belgium surveys a canal that bypasses the estuary"
 BEL_p_a_deep_water_harbour_on_the_narrow_sea:0 "A deep-water harbour at Zeebrugge"
 BEL_p_the_coast_is_watched_from_the_east:0 "The Belgian coast is fortified against a named danger"
 BEL_p_the_kingdom_reaches_the_sea_alone:0 "Belgium reaches blue water without the estuary"
 BEL_b_the_basin_is_held_by_the_gendarmerie:0 "The Belgian coalfield is held by standing detachments"
