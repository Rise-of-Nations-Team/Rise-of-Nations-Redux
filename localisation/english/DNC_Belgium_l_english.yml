 BEL_r_the_river_flotilla_bonus:0 "Hulls for the Upper River"
 BEL_r_the_private_appreciation:0 "The Appreciation Nobody Reads Aloud"
 BEL_r_berlin_declines_the_word:0 "Berlin will not write the word down"
 BEL_r_the_guarantor_rearms:0 "A guarantor of our neutrality is arming"
 BEL_r_the_works_are_told:0 "The fortress commissions have been told what to expect"
 BEL_r_the_minute_is_signed:0 "A Belgian officer has signed a minute with a British one"
 bel_dnc.950.t:0 "The Consul Goes Up the River Again"
 bel_dnc.950.d:0 "He hires a mission steamer at Leopoldville because the State will not carry him, and he is gone eleven weeks. He comes back with a notebook, a list of villages by name, and a column of figures for each one: souls counted at the last census, souls counted by him, rubber delivered against the difference.\n\nThe Foreign Office prints it. Our legation in London is sent a copy before the newspapers, which is a courtesy, and which means it is going to the newspapers. The Rue de la Loi has until Thursday to decide whether Belgium has an answer or only an objection to the question."
 bel_dnc.950.a:0 "Send an inspector of our own and let him go where the consul went"
 bel_dnc.950.b:0 "The Free State is a sovereign state; let it answer for itself"
 bel_dnc.950.c:0 "Print the whole of it in Brussels, columns and all"
 bel_dnc.951.t:0 "The Lantern Slides Come to the Provinces"
 bel_dnc.951.d:0 "A hall in Malines, a hall in Turnhout, a hall in Bruges, and a sheet hung at the back of each one. The plates are the same everywhere. A boy on a verandah. A basket. A hand and a foot laid on a cloth beside a ruler.\n\nThe lecturer is usually a returned missionary and he speaks Dutch, which no government pamphlet on the Congo has yet done. The collection at the door pays for the next hall. A man who has looked at that sheet does not afterwards accept that the subject is complicated."
 bel_dnc.951.a:0 "Send our own lecturers into the same halls"
 bel_dnc.951.b:0 "Let the halls fill; a photograph is not an argument"
 bel_dnc.951.c:0 "Prosecute the association and seize the plates"
 bel_dnc.952.t:0 "The World Reads the Report on the Congo"
 bel_dnc.952.d:0 "It is on the front page in London and Boston within the week, and in Berlin and Vienna a day later because their correspondents copy the London text.\n\nWhat is printed is not an accusation by a foreign government. It is a Belgian document, or a document about Belgians, and the columns of figures are dull enough to be believed. Every chancellery in Europe now has a Congo file, and every one of them has an opinion about what the Kingdom of Belgium is for."
 bel_dnc.952.a:0 "There is no answer that is shorter than the report"
 bel_dnc.952.b:0 "So that is what has been going on down there"
 bel_dnc.953.t:0 "The Captain Comes Back From Boma"
 bel_dnc.953.d:0 "Six years with the Force Publique, two campaigns nobody has heard of, and a fever that has taken thirty pounds off him. He lands at Antwerp, reports at the ministry, and is given three months' leave and no questions.\n\nHe is thirty-four and he commanded eight hundred men, which is more than any captain of the line in this army has ever done. The mess at Beverloo would like to know what he is fit for. The Chamber would like to know what he saw. The ministry would prefer that these two questions not be asked in the same room."
 bel_dnc.953.a:0 "Give him a brigade; a man who has commanded should command"
 bel_dnc.953.b:0 "Post him back; the Force Publique needs officers more than we do"
 bel_dnc.953.c:0 "Retire him on half pay and let the leave run on"
 bel_dnc.954.t:0 "The Questions Nobody Puts to Them"
 bel_dnc.954.d:0 "There are now about four hundred of them in Belgium: officers and non-commissioned officers home from the basin, on leave, on pension, or on nothing at all. They are in the garrison towns and the gendarmerie and the customs service, and a good many of them are in the cafes.\n\nThey talk to each other. They do not talk to the newspapers, and the ones who have talked to the newspapers are no longer received. The ministry has never once written to any of them to ask what happened in his district, and the reason is that a written question requires a written answer, and a written answer goes into a file, and files are read out in the Chamber."
 bel_dnc.954.a:0 "Open a board of enquiry and take evidence on oath"
 bel_dnc.954.b:0 "The mess settles its own accounts; the ministry does not intervene"
 bel_dnc.954.c:0 "Every returning officer will report in writing, and the reports stay with us"
 bel_dnc.955.t:0 "Who Owns the Committee of Katanga"
 bel_dnc.955.d:0 "The concession south of the Lualaba is held by a committee. The committee is two thirds the State and one third a company registered in London whose prospectus is written in English and whose chairman has never been further south than Cheshire.\n\nThe copper is real. So is the fact that the third share carries a veto on the working of it, and that the men who will actually sink the shafts are Rhodesians paid in sterling. Somebody in the Chamber is going to stand up and ask what part of this arrangement is Belgian, and there is no answer that will fit in one sentence."
 bel_dnc.955.a:0 "Confirm the committee as it stands: two thirds ours, one third theirs"
 bel_dnc.955.b:0 "Buy the third share back and hold the whole of the south"
 bel_dnc.955.c:0 "Let the men with the capital work it and take our share of what comes up"
 bel_dnc.956.t:0 "The Assay at Kambove"
 bel_dnc.956.d:0 "The prospecting party has been eighteen months in the hills and has sent down forty crates of samples, a mortality list, and an assay report signed by a chemist in Elisabethville whom nobody in Brussels has met.\n\nThe report says the ore runs high. It also says the samples were selected at the face by the party's own foreman, which is the normal practice and is also exactly how a mine is made to look better than it is. There is no second opinion nearer than Johannesburg."
 bel_dnc.956.a:0 "Publish the assay entire and let the market read it"
 bel_dnc.956.b:0 "Say nothing until there is a smelter standing over the ore"
 bel_dnc.956.c:0 "Sell the assay to the Rhodesian houses and let them take the risk"
 bel_dnc.957.t:0 "The Line Through Rhodesia"
 bel_dnc.957.d:0 "The copper is two thousand kilometres from the sea in every direction. There are two ways to move it. South and east, on Cape gauge, joining a British system that is already built and already running. Or north and west, a thousand kilometres of new track to the Kasai, then the river, then the portage round the cataracts, then the river again.\n\nThe southern line can be open in three years. The northern line is the one that means the Congo is a country and not a mining district with a Belgian flag on it. The engineers prefer the first. The Colonial Council prefers the second and has not been asked to cost it."
 bel_dnc.957.a:0 "Cape gauge, through Rhodesia, and the ore moves next year"
 bel_dnc.957.b:0 "The national route: the ore goes out down our own river"
 bel_dnc.957.c:0 "Build both and let the freight rates settle it"
 bel_dnc.958.t:0 "The Minority Report"
 bel_dnc.958.d:0 "Three commissioners went out. Three commissioners have come back. Two of them have been at the ministry every day this fortnight and the third has not been seen at all.\n\nA commission that reports with one voice is a commission that has been managed. A commission that reports with two voices has produced a document that will be quoted for twenty years, and the half that gets quoted is never the half the government wrote. Nobody in the Rue de la Loi yet knows which of the two this is going to be, and the printer has been told to stand by."
 bel_dnc.958.a:0 "Print all three signatures and whatever stands above them"
 bel_dnc.958.b:0 "Print the majority; the rest goes in the file"
 bel_dnc.958.c:0 "Take the minority report as the government's own text"
 bel_dnc.959.t:0 "The Charter Binds the Minister Who Wrote It"
 bel_dnc.959.d:0 "Article One says the colony has a legal personality distinct from that of the metropole. The minister put it there himself, in that wording, to reassure a Chamber that was afraid of being asked to pay for Africa.\n\nHe is now the minister who cannot move a franc of colonial revenue into a Belgian estimate, cannot lay a colonial road on a Belgian vote, and must answer at every session for an administration whose accounts he is forbidden by his own law to consolidate with anybody's. A deputy from Charleroi read Article One aloud on Tuesday and then asked him, quite politely, whether he was proud of it."
 bel_dnc.959.a:0 "Keep the separate account; the law was written for a reason"
 bel_dnc.959.b:0 "Amend Article One and have done with the fiction"
 bel_dnc.959.c:0 "Let the minister answer for it himself, session after session"
 bel_dnc.960.t:0 "The Minister Offers His Resignation"
 bel_dnc.960.d:0 "He came in on the understanding that the colonial question would be settled in a year. It is his fourth year. He has defended in the House a regime he privately calls indefensible, on the ground that the alternative was worse, and he has stopped believing that.\n\nThe letter is on the President's desk and is two paragraphs long. It gives ill health as the reason, which is not true, and everybody who reads it will know it is not true, which is the point of writing it that way."
 bel_dnc.960.a:0 "Accept it; a minister who has stopped believing is no use"
 bel_dnc.960.b:0 "Refuse it; he made this law and he will answer for it"
 bel_dnc.960.c:0 "Let him go, and take the colonial portfolio yourself"
 bel_dnc.961.t:0 "Is the Basin Belgian Soil?"
 bel_dnc.961.d:0 "The colony is annexed. The question the annexation did not answer is what, exactly, has been annexed. A territory of the Kingdom, in which the King's subjects live under the King's law? Or a possession, held by Belgium, governed by a separate code, whose inhabitants are neither citizens nor foreigners?\n\nThe lawyers say the second and the Charter says the second. The recruiting sergeants and the tax rolls have quietly begun to behave as though it were the first. Somebody has to say which it is, in a Belgian court, this session."
 bel_dnc.961.a:0 "Belgian soil, and the men on it are subjects of the King"
 bel_dnc.961.b:0 "A distinct patrimony; the Charter forbids anything else"
 bel_dnc.961.c:0 "Refer the question to the Colonial Council and wait"
 bel_dnc.962.t:0 "The Tribunal at Boma"
 bel_dnc.962.d:0 "Until now, justice in the basin has meant the district commissioner, who is the police, the prosecutor and the bench, and who is graded on the rubber his district delivers.\n\nA tribunal at Boma with magistrates who are not administrators would be the first institution in the Congo that can rule against the administration. It would also be slow, expensive, three weeks by river from most of the districts it is supposed to govern, and staffed by men who will need to be found somewhere in a country of seven million people that already cannot fill its own bench."
 bel_dnc.962.a:0 "A real tribunal at Boma, with magistrates who answer to no district"
 bel_dnc.962.b:0 "The commissioner is the court, as he has always been"
 bel_dnc.962.c:0 "Recognise the chefferies and let them judge their own"
 bel_dnc.963.t:0 "The Mortality at Leopoldville"
 bel_dnc.963.d:0 "The Liverpool expedition has been on the pool for a season and has established what the trypanosome does, how it travels, and roughly how many it is killing along the river. The number is not one that any administration would publish about itself.\n\nThey want a lazaret, a survey of the whole navigable river, and permission to go wherever the tsetse is. They are British, they publish everything, and they have already published the mortality figure once. Refusing them will not unpublish it."
 bel_dnc.963.a:0 "Fund the service and publish the mortality with it"
 bel_dnc.963.b:0 "Fund it quietly and publish nothing"
 bel_dnc.963.c:0 "The Liverpool school may pay for its own expeditions"
 bel_dnc.964.t:0 "The Flotilla on the Upper River"
 bel_dnc.964.d:0 "Above the cataracts there are sixteen hundred kilometres of navigable water and no state vessel on any of it. What moves is mission steamers, trading-house steamers, and two ancient stern-wheelers that were carried up in pieces on men's backs in the eighties and have been repaired with whatever came to hand since.\n\nA flotilla means the administration can reach a district in nine days instead of five weeks. It also means that whatever the administration decides to do in that district, it can now do quickly. The officer who commands it will be the most powerful Belgian in Africa and will report to a ministry three thousand miles away."
 bel_dnc.964.a:0 "Build the flotilla and give it a proper officer"
 bel_dnc.964.b:0 "The trading houses have steamers; requisition them when we need them"
 bel_dnc.964.c:0 "Put a gun on the mission boats and call it a flotilla"
 bel_dnc.965.t:0 "The Concessions Come to an End"
 bel_dnc.965.d:0 "The concession is the whole machine. A company holds a district, the district owes a quota, the quota is collected by men paid a commission on what they bring in, and nobody above them has ever had to say out loud what happens in a village that is short.\n\nEnding it means the state collects its own revenue, employs its own agents, and pays for both. It also means several very large companies with directors in Brussels discover that a charter granted for ninety-nine years lasted eighteen. Their lawyers have been in the corridors since Monday."
 bel_dnc.965.a:0 "End the concession regime by decree, everywhere, at once"
 bel_dnc.965.b:0 "End it in the districts the consuls visit and nowhere else"
 bel_dnc.965.c:0 "The companies hold contracts and the state honours contracts"
 bel_dnc.970.t:0 "The Order He Cannot Obey"
 bel_dnc.970.d:0 "At the autumn manoeuvres a company of the 2nd Line took forty minutes to get out of a wood because the lieutenant gave his orders in French and about two thirds of his men understood perhaps one word in five of them.\n\nThe umpire wrote it down. The colonel struck it out. The battalion commander, who is from Ypres and got his commission the hard way, put it back in and added a sentence of his own: that this is the situation in the greater part of the infantry, that it has been for thirty years, and that it will be discovered by somebody other than an umpire the first time this army is used."
 bel_dnc.970.a:0 "Every word of command, in both tongues, from next year"
 bel_dnc.970.b:0 "The word of command is French; one army, one language"
 bel_dnc.970.c:0 "Post Flemish sergeants to the Flemish battalions and say no more about it"
 bel_dnc.971.t:0 "The Camp at Beverloo"
 bel_dnc.971.d:0 "Twenty thousand men on the heath for six weeks, drawn from every province, drilled together, and messed together. It is the one place in the kingdom where a boy from Poperinge and a boy from Verviers have to share a tent.\n\nIt is also the place where the language question stops being a matter of principle and becomes a matter of whether the third rank hears the order. The camp commandant has asked for a ruling three years running and has three times been told the question is under study."
 bel_dnc.971.a:0 "Two brigades, two tongues, one camp"
 bel_dnc.971.b:0 "They will drill in French until they have learned French"
 bel_dnc.971.c:0 "Send the Flemish classes to the fortress garrisons instead"
 bel_dnc.972.t:0 "The Petition of the Professors"
 bel_dnc.972.d:0 "Ghent is a Flemish city with a French university in the middle of it. The petition has three hundred and forty signatures, of which about ninety belong to men who teach there, and it asks for the whole institution to be turned over to Dutch.\n\nThe faculty of law is against it almost to a man. The faculty of letters is for it almost to a man. The rector has said in private that whichever way the government decides, half his professors will resign, and that he would be grateful if the government would decide anyway, because the present arrangement is that the question is settled afresh at every faculty meeting."
 bel_dnc.972.a:0 "Grant it entire: Ghent teaches in Dutch"
 bel_dnc.972.b:0 "A Dutch section beside the French faculty, and both are Ghent"
 bel_dnc.972.c:0 "Ghent is a French university and will remain one"
 bel_dnc.973.t:0 "The Answer From Liege"
 bel_dnc.973.d:0 "The deputies of the industrial arrondissements came to the Rue de la Loi in a body, which they have not done in this reign. Their case took eleven minutes.\n\nWallonia pays the greater part of the revenue, digs the coal, rolls the steel, and returns the majority that keeps this ministry in office. Every session for six years it has been asked to accept one more concession made in Dutch, and it has accepted them, and it now finds that the concessions have a direction and the direction does not stop. They did not ask for anything. They said they had come to be counted, and left."
 bel_dnc.973.a:0 "Hear them properly; there is a Walloon question too"
 bel_dnc.973.b:0 "Tell Liege that Flanders is also Belgium"
 bel_dnc.973.c:0 "The government does not negotiate with leagues; let them organise"
 bel_dnc.974.t:0 "The Chamber Divides Into Sections"
 bel_dnc.974.d:0 "The proposal is that bills be examined in two sections, one sitting in French and one in Dutch, with the plenary in whichever tongue the President rules. It is presented as a rule of procedure. It is not a rule of procedure.\n\nA parliament that debates in two rooms is a parliament that will one day divide in two, and everybody in the House knows it, including the men proposing it, some of whom want exactly that and some of whom have simply run out of ways to get a Flemish deputy heard."
 bel_dnc.974.a:0 "Two sections, one Chamber, and we will see how it works"
 bel_dnc.974.b:0 "One Chamber, one record, and the record is in French"
 bel_dnc.974.c:0 "Committees in either tongue; the House itself in French"
 bel_dnc.975.t:0 "The Regiments Relearn"
 bel_dnc.975.d:0 "The decision has been taken and now somebody has to carry it out with the officers who exist. Two thirds of the captains learned their trade in French and have never written a report in anything else. The manuals, the range tables, the fire orders and the court-martial procedure are all in French.\n\nThe non-commissioned officers are the hinge. They already speak both, badly, because they have had to. Given eighteen months, a printing vote and a school at each depot, it can be done. Given a war before then, it will be half done, which is the worst of the three possible states."
 bel_dnc.975.a:0 "Eighteen months, the sergeants first, and the manuals reprinted"
 bel_dnc.975.b:0 "The regiments will sort it out in their own time"
 bel_dnc.975.c:0 "End the lottery; conscript a class that can read the manual"
 bel_dnc.976.t:0 "The Flemish List"
 bel_dnc.976.d:0 "They have taken out a list of their own in four arrondissements. Not a wing of the Catholic party, not a tendency, not a study circle: a list, with its own colours, its own candidates, and its own address on the ballot.\n\nIn Flanders the Catholic majority is the government's majority, and the government's majority is between six and eleven seats. Four arrondissements is enough. The men who took the list out know that, which is why they took it out in those four and not in others."
 bel_dnc.976.a:0 "Let them stand; a party in the Chamber is a party we can count"
 bel_dnc.976.b:0 "The Catholic party will not be divided in Flanders"
 bel_dnc.976.c:0 "Buy the countryside back with a grant to the free schools"
 bel_dnc.977.t:0 "The Leagues Answer in Charleroi"
 bel_dnc.977.d:0 "Eleven hundred delegates in a hall that holds eight hundred, from the pits, the glassworks and the rolling mills, and from about forty leagues that did not exist three years ago.\n\nHalf the platform wants a Walloon statute. The other half wants the eight-hour day and does not much care what language it is granted in, and is the half with the strike funds. What comes out of the hall depends entirely on which of those two the government answers first, and the government has until the closing session on Sunday to work that out."
 bel_dnc.977.a:0 "Meet them; there is a Walloon question and it will be heard"
 bel_dnc.977.b:0 "Gendarmes at the pithead and the hall closed on Sunday"
 bel_dnc.977.c:0 "Give the basin its inspectorate and its day of rest"
 bel_dnc.978.t:0 "The Frontier Drawn in Law"
 bel_dnc.978.d:0 "Not a border. A line on the administrative map, commune by commune, north of which the state does its business in Dutch and south of which it does its business in French, with Brussels left out because Brussels cannot be settled and everybody knows it.\n\nOnce the line is drawn it will never be redrawn, because the census that would redraw it will be fought over in every commune along it. Nine hundred years of a language frontier that moved slowly and nobody measured is about to become an article in a statute."
 bel_dnc.978.a:0 "Draw it, commune by commune, and let it stand"
 bel_dnc.978.b:0 "No frontier; the kingdom is one and speaks both"
 bel_dnc.978.c:0 "Draw it, and let Brussels belong to neither side of it"
 bel_dnc.979.t:0 "The School Admits Dutch"
 bel_dnc.979.d:0 "The Ecole Militaire examines in French. It has done since it was founded, and the consequence is an officer corps in which a man from Bruges is at a disadvantage in every paper he sits, including the mathematics.\n\nThe commandant's objection is not political and is not stupid: an examination in two languages is two examinations, marked by two boards, producing one order of merit, and the order of merit determines who commands what for the next forty years. He would like to be told, in writing, who is going to defend that list the first time it is questioned."
 bel_dnc.979.a:0 "The school examines in both, and the order of merit is one list"
 bel_dnc.979.b:0 "The examination stays French; the school is what it is"
 bel_dnc.979.c:0 "A separate course for Flemish candidates, with its own board"
 bel_dnc.980.t:0 "The Last Session in One Tongue"
 bel_dnc.980.d:0 "The clerk read the day's business in French, as he has every day since 1831, and a deputy for Antwerp stood up and said that it was the last time, and sat down again. Nobody contradicted him. The President did not rule him out of order, which is the whole story.\n\nWhat is being decided is not a rule about words. It is whether this kingdom is one people with a language problem or two peoples with a shared king, and the Chamber has spent thirty years making sure it never had to say which."
 bel_dnc.980.a:0 "Let the record show that this was the last of them"
 bel_dnc.980.b:0 "It will not be the last while this government sits"
 bel_dnc.980.c:0 "Adjourn the question to a commission and take the winter over it"
 bel_dnc.990.t:0 "Who Guarantees Us?"
 bel_dnc.990.d:0 "The Treaty of 1839 says Belgium shall form an independent and perpetually neutral state, and that it is bound to observe that neutrality towards all other states. Five powers signed. Two of them no longer exist in the form that signed. One of them has since absorbed the state whose signature stood next to its own.\n\nNobody has asked any of them to confirm it in seventy years. There is a school in the ministry that says asking is dangerous, because a guarantee that is questioned is weakened. There is another that says a guarantee nobody has been asked to confirm is not a guarantee, it is a habit."
 bel_dnc.990.a:0 "Put the question to all five, in the same words, in the same week"
 bel_dnc.990.b:0 "Ask London; the others will do what London does"
 bel_dnc.990.c:0 "Ask nobody; the treaty says what it says"
 bel_dnc.991.t:0 "The Word of London"
 bel_dnc.991.d:0 "The reply comes in four days, which for the Foreign Office is indecent haste, and it is warm. His Majesty's Government regards the neutrality of Belgium as a cardinal interest, considers the obligation of 1839 to be in full force, and would view any violation of it with the gravest concern.\n\nIt does not say what His Majesty's Government would do. It does not name a number of divisions, a port, or a week. Our military attache has read it twice and observes that the phrase 'gravest concern' has appeared in eleven British notes since 1898 and has twice been followed by a war and nine times by nothing."
 bel_dnc.991.a:0 "Publish it entire; a warm answer in print is worth divisions"
 bel_dnc.991.b:0 "Note it, file it, and say nothing"
 bel_dnc.991.c:0 "Ask what London would actually land, and where, and how soon"
 bel_dnc.992.t:0 "The Word of Berlin"
 bel_dnc.992.d:0 "The reply takes eleven weeks and is three sentences long. The Imperial Government is not aware of any circumstance that would call the arrangements of 1839 into question. It has no intention of acting contrary to them. It trusts that Belgium, for its part, will maintain the strict neutrality which is the condition of those arrangements.\n\nOur minister in Berlin, who is not an alarmist, has attached a note. The reply speaks of intention and not of obligation, it makes our neutrality a condition rather than a right, and the last sentence, read carefully, is about what Belgium must not do rather than what Germany will not do."
 bel_dnc.992.a:0 "Take the answer at its word and be glad of it"
 bel_dnc.992.b:0 "Read it again and mark what it does not say"
 bel_dnc.992.c:0 "Press them for the word 'inviolable', in writing"
 bel_dnc.993.t:0 "The Word of Paris"
 bel_dnc.993.d:0 "Paris answers by return and answers everything: the obligation is absolute, France would regard a violation of Belgian territory as a casus belli, and the Republic would come to our assistance with all its forces.\n\nIt is the warmest of the five and it is the one that frightens the General Staff, because a power that promises to come to your assistance with all its forces has thought about the roads it would use. The attache in Paris reports that French staff officers speak of the Meuse crossings with a familiarity that nobody acquires from a map."
 bel_dnc.993.a:0 "Accept it, thank them, and say nothing to Berlin"
 bel_dnc.993.b:0 "Tell Paris that a French army in Belgium is an invasion too"
 bel_dnc.993.c:0 "Ask for the same undertaking in the same words we sent to London"
 bel_dnc.994.t:0 "Vienna and St Petersburg Reply"
 bel_dnc.994.d:0 "Both are correct, both are prompt, and both are worthless. Vienna confirms the obligation and observes that the circumstances in which it might arise are not ones in which the Imperial and Royal Government could usefully act. St Petersburg confirms the obligation in almost identical terms and does not trouble with the observation.\n\nSo the file is complete. Five signatures, five confirmations, and two of the five with an army that could reach the Meuse inside a fortnight. The cabinet may publish the count, or it may publish the arithmetic, and they are not the same document."
 bel_dnc.994.a:0 "Publish the count: five signatures, five confirmations"
 bel_dnc.994.b:0 "Count the two that could actually march here, and say so in cabinet"
 bel_dnc.994.c:0 "Publish nothing; a guarantee discussed is a guarantee weakened"
 bel_dnc.995.t:0 "A Guarantor Rearms"
 bel_dnc.995.d:0 "The new army law adds four corps, and the railway estimates that accompany it add sidings, unloading ramps and water towers along a stretch of frontier where there is not enough peacetime traffic to justify a single one of them.\n\nOur attache has counted the ramps. A ramp is for detraining a division. There are more of them within sixty kilometres of our eastern frontier than there are on the entire remaining length of that frontier, and they are being built by a power that has confirmed our neutrality in writing within the last four years."
 bel_dnc.995.a:0 "Name the threat in the estimates and let the Chamber read it"
 bel_dnc.995.b:0 "A neutral names no enemy; strike it from the estimates"
 bel_dnc.995.c:0 "Say it to the fortress commissions and to nobody else"
 bel_dnc.996.t:0 "The Answer From Berlin Proves Hollow"
 bel_dnc.996.d:0 "It has taken six years to be sure. The word 'inviolable' was asked for three times and declined three times. The undertaking has been renewed twice, both times in the language of intention. The ramps went up anyway.\n\nThe file on the table now contains a guarantee, a confirmation of the guarantee, and an appreciation by our own staff of exactly how many days it would take an army that had disregarded both to reach Liege. All three documents are correct. Only one of them describes something that would actually happen."
 bel_dnc.996.a:0 "Strike the German answer from the file and say why"
 bel_dnc.996.b:0 "Keep it on the file, and keep the appreciation beside it"
 bel_dnc.996.c:0 "Ask again, quietly, at the ambassador's own table"
 bel_dnc.997.t:0 "What the Staff Concludes in Private"
 bel_dnc.997.d:0 "The appreciation is thirty-one pages and it is not going to be read in the Chamber. It says that the violation will come from the east, that it will come in the first week, that the fortresses will hold for a period the staff can estimate to within a few days, and that everything after that depends on whether a field army exists to fall back on.\n\nIt also says something the Chief of Staff has crossed out and written back in twice: that on the present establishment, the officer who commands that field army in the field will be commanding a formation he has never exercised, over ground he has studied only on paper, against a plan he can describe in detail."
 bel_dnc.997.a:0 "Write it, act on it, and give the Chief of Staff troops to exercise"
 bel_dnc.997.b:0 "Write it, seal it, and show it to nobody"
 bel_dnc.997.c:0 "Lay it before the Chamber and let them vote the money"
 bel_dnc.998.t:0 "The Three Appreciations"
 bel_dnc.998.d:0 "The staff has produced three studies and they cannot all be funded. The first says the blow comes across the Meuse and that Liege and Namur are therefore the frontier. The second says an army that has decided to disregard a treaty will not stop at the awkward crossings, and will come round through the south where there is nothing at all. The third says both are guesses and that the only sound answer is a field army in the centre that can go wherever the news says.\n\nEach has a general behind it. Two of them will be disappointed this year and will remember it."
 bel_dnc.998.a:0 "The Meuse. Liege and Namur are the frontier"
 bel_dnc.998.b:0 "The Sambre. The blow will come round through the south"
 bel_dnc.998.c:0 "Neither. A field army in the centre that can go where it is needed"
 bel_dnc.999.t:0 "Armed Neutrality"
 bel_dnc.999.d:0 "The declaration is one page and the argument behind it is fifty years old. A neutral that arms is suspected by both sides. A neutral that does not arm is not a neutral, it is a corridor.\n\nWhat the Chamber is really being asked is whether Belgium keeps the right to choose, on the day, whose side it is on. Give that right up and the guarantee is all there is. Keep it and every chancellery in Europe will spend the next decade trying to find out which way we would jump, and some of them will make plans on the assumption that they already know."
 bel_dnc.999.a:0 "Neutral, armed, and in nobody's system"
 bel_dnc.999.b:0 "Neutral, and free to choose if the day comes"
 bel_dnc.999.c:0 "The guarantee is our army; we need no other"
 bel_dnc.1000.t:0 "The Conversations With the Attache"
 bel_dnc.1000.d:0 "He comes to the ministry in plain clothes and the appointment is not in the book. What he proposes is not an alliance and he is careful to say so four times: it is a technical conversation, between soldiers, about what would be required if a certain contingency arose, and it binds nobody.\n\nOur staff would very much like to have it. They would like to know which ports, which gauge, how many days. The Foreign Ministry points out that a technical conversation held with one guarantor and not the others is, in the eyes of the others, exactly what it looks like, whatever the minute says at the top of the page."
 bel_dnc.1000.a:0 "Talk, and let nothing be written down"
 bel_dnc.1000.b:0 "Talk, and let the minute be signed by both"
 bel_dnc.1000.c:0 "Receive him, and receive Berlin's man the same week"
 BELDNC_a_the_bargain_with_the_basin:0 "The Bargain with the Basin"
 BELDNC_a_the_bargain_with_the_basin_desc:0 "The coal and steel of Hainaut and Liege vote Liberal and always will, but their owners want rails, tariffs and a gendarmerie that comes quickly. We must supply all three and ask silence on the franchise in return."
 BELDNC_a_the_register_of_three_ballots:0 "The Register of Three Ballots"
 BELDNC_a_the_register_of_three_ballots_desc:0 "The communal rolls have never been worked through properly and every disputed entry is decided by men we appointed. We must send the clerks back through them, count the second and third votes carefully, and administer arithmetic rather than fraud."
 BELDNC_a_the_countryside_votes_with_us:0 "The Countryside Votes With Us"
 BELDNC_a_the_countryside_votes_with_us_desc:0 "Flemish farmers, curates and schoolmasters carry our majority and have never once been thanked in their own language. We must give them the roads, the drainage and the parish, and hold the arrondissements without asking twice."
 BELDNC_a_the_left_kept_apart:0 "The Left Kept Apart"
 BELDNC_a_the_left_kept_apart_desc:0 "The Liberals want the vote counted once and the Workers want it counted at all, and between them lies the school question. We must drive the wedge there and make sitting with Vandervelde expensive enough that Hymans will not."
 BELDNC_a_the_ministry_that_does_not_fall:0 "The Ministry That Does Not Fall"
 BELDNC_a_the_ministry_that_does_not_fall_desc:0 "Our cabinets change names and keep their benches because no alternative could survive a division of the House. We must go on changing the name and keeping the majority, and never mistake that for brilliance."
 BELDNC_a_the_language_laws_conceded:0 "The Language Laws Conceded"
 BELDNC_a_the_language_laws_conceded_desc:0 "Concede all at once and the Movement discovers it is a party; concede slowly and it stays a petition to us. We must give Dutch in the lower courts, on the coinage and in the secondary sections, years after each was asked and never more than was asked."
 BELDNC_a_the_strike_that_does_not_come:0 "The Strike That Does Not Come"
 BELDNC_a_the_strike_that_does_not_come_desc:0 "They can stop the kingdom in a week only if the pits, the glassworks and the tramways come out together. We must settle the tramwaymen early, keep the gendarmerie out of the pit gates, and let the strike committee find half its own men back at work."
 BELDNC_a_the_bishops_are_content:0 "The Bishops Are Content"
 BELDNC_a_the_bishops_are_content_desc:0 "The school war can be closed the Church's way and closed for this whole reign. We must fund the free schools from the commune, recognise the certificate of the teaching orders and keep our inspection at a decent distance."
 BELDNC_a_the_commission_of_inquiry:0 "The Commission of Inquiry"
 BELDNC_a_the_commission_of_inquiry_desc:0 "The King's own commission has come back from the river saying rather more than the Palace expected, and Beernaert has read it. We must decide what our Chamber is shown, because Casement and Morel have already gone round the world."
 BELDNC_a_the_note_from_the_powers:0 "The Note from the Powers"
 BELDNC_a_the_note_from_the_powers_desc:0 "London writes that the signatories of Berlin gave the Free State its title and may reconsider it, phrased as a courtesy to a friendly kingdom. We must reply, and no reply exists that leaves the estate where it is."
 BELDNC_a_the_estate_is_valued:0 "The Estate Is Valued"
 BELDNC_a_the_estate_is_valued_desc:0 "Before the Chamber takes a colony it must be told what it is taking: the rail to Matadi, the concessions, the debt and the works already charged against it. We must have the valuation made, and note that our valuers are shown Brussels ledgers rather than river tallies."
 BELDNC_a_the_terms_of_cession:0 "The Terms of Cession"
 BELDNC_a_the_terms_of_cession_desc:0 "The King's lawyers have drafted the treaty and every clause is a negotiation between a sovereign who will not admit he is selling and a Chamber that will not admit it is buying. We must sign it as drafted, and leave much of what was done there unexamined."
 BELDNC_a_the_kings_price:0 "The King's Price"
 BELDNC_a_the_kings_price_desc:0 "Leopold will hand us the state and keep the Fondation de la Couronne - the parks, the arcades, the works at Laeken and Ostend. We must pay the bill, because refusing it means an inquiry into how the money was made."
 BELDNC_a_the_colonial_charter_of_the_right:0 "The Colonial Charter of the Right"
 BELDNC_a_the_colonial_charter_of_the_right_desc:0 "A colony must have a charter, a governor-general and a budget the Chamber may read, and it must be cheap. We must give the missions the schooling, the dispensaries and much of the administering, and get a Catholic colony for a Catholic majority."
 BELDNC_a_the_reign_that_follows:0 "The Reign That Follows"
 BELDNC_a_the_reign_that_follows_desc:0 "The old King is buried and his nephew takes the oath with no estate to defend and no quarrel with us. We must work with a monarch who wants nothing from our settlement, and use him."
 BELDNC_a_the_catholic_decade:0 "The Catholic Decade"
 BELDNC_a_the_catholic_decade_desc:0 "The register is intact, the schools are settled, Flanders is paid in instalments and the Congo was taken without an inquiry. We must go on absorbing what we cannot solve, and let the next decade decide whether that was government or postponement."
 BEL_a_settlement_inherits_the_estate_tt:0 "The Chamber has already been told what the King owns. The settlement inherits the quarrel."
 BEL_a_settlement_says_nothing_of_the_estate_tt:0 "The estate has not been named in the House. The settlement need not name it either."
 BEL_a_woeste_refuses_too_late_tt:0 "Flanders has been refused too often. This one costs more than it saves."
 BEL_a_woeste_refuses_cheaply_tt:0 "Flanders is still patient. The refusal costs nothing this year."
 BEL_a_basin_buys_the_register_tt:0 "The register stands, and the basin will pay to keep it standing."
 BEL_a_basin_wants_more_than_rails_tt:0 "Without the register secured, the basin wants a franchise instead of a railway."
 BEL_a_the_arithmetic_is_unarguable_tt:0 "The plural vote is beyond challenge. The Walloon benches stop pretending otherwise."
 BEL_a_the_arithmetic_is_arguable_tt:0 "The register has already been worn thin. Reworking the rolls only advertises it."
 BEL_a_grants_through_two_administrations_tt:0 "Two statutes mean two school administrations, and every grant is voted twice."
 BEL_a_one_grant_one_language_tt:0 "One kingdom, one grant, and the language of the grant is decided in Brussels."
 BEL_a_grants_before_any_statute_tt:0 "No statute governs the schools yet. The ministry pays whom it chooses."
 BEL_a_the_countryside_was_paid_tt:0 "The school grant came first. The arrondissements return the same men without argument."
 BEL_a_the_countryside_was_only_asked_tt:0 "The countryside is asked for its votes and offered nothing it can point to."
 BEL_a_the_pits_hold_the_cartel_together_tt:0 "The pits have already been out. Nothing divides a left that is on strike."
 BEL_a_the_cartel_never_forms_tt:0 "No strike, no common grievance, no cartel. The left argues with itself instead."
 BEL_a_de_broqueville_at_the_ministry_tt:0 "De Broqueville takes the ministry. The benches behind him do not move."
 BEL_a_no_alternative_majority_tt:0 "The left cannot count a majority. The ministry cannot be brought down."
 BEL_a_an_alternative_is_being_counted_tt:0 "The left is still adding up. So is every deputy on our own benches."
 BEL_a_conceded_inside_one_kingdom_tt:0 "One kingdom concedes the language and keeps the administration whole."
 BEL_a_conceded_twice_over_tt:0 "The statute has already conceded it. The law only repeats what is law."
 BEL_a_conceded_by_the_ministry_alone_tt:0 "No statute obliged us. The concession is the ministry's own, and is remembered as such."
 BEL_a_the_men_went_back_tt:0 "The strike is broken rather than prevented, and the world reads about the pit gates."
 BEL_a_the_men_never_came_out_tt:0 "There was no strike to break. The register is never tested in the street."
 BEL_a_the_grant_bought_the_bishops_tt:0 "The Flemish grant is already law. The bishops accept the settlement entire."
 BEL_a_the_bishops_were_given_the_law_tt:0 "The Church is paid in statute rather than in schools, and the Walloon benches notice."
 BEL_a_the_inquiry_answers_our_denials_tt:0 "We denied it in every chancellery. The commission has now printed the answer."
 BEL_a_the_inquiry_is_our_own_tt:0 "We denied nothing we cannot withdraw. The inquiry is ours to publish."
 BEL_a_the_note_is_an_ultimatum_tt:0 "The scandal has passed the third rung. The note is not a request."
 BEL_a_the_note_is_only_a_note_tt:0 "The world is not yet certain of anything. The note can be answered at leisure."
 BEL_a_the_valuers_are_shown_the_tally_tt:0 "The Free State is still run as a tally, and the valuation says so in figures."
 BEL_a_the_valuers_are_shown_a_reformed_state_tt:0 "The regime has already been reformed. The valuation reads like an administration."
 BEL_a_the_terms_answer_the_inquiry_tt:0 "The commission's findings are written into the terms, and the House has its answer."
 BEL_a_the_terms_answer_nothing_tt:0 "No inquiry stands behind the terms. The Chamber is asked to buy unexamined."
 BEL_a_the_price_is_written_down_tt:0 "The estate has been valued. The Foundation is a figure rather than a promise."
 BEL_a_the_price_is_whatever_he_says_tt:0 "Nothing was valued. The King names his own Foundation and the ministry signs."
 BEL_a_the_king_keeps_his_foundation_tt:0 "The Foundation passes intact and no account is opened for the years before the signature."
 BEL_a_the_king_is_paid_nothing_tt:0 "The cession carries no Foundation. The King is annexed along with his state."
 BEL_a_the_missions_administer_the_charter_tt:0 "The school question is settled at home, and the orders will administer it abroad."
 BEL_a_the_charter_has_no_schoolmasters_tt:0 "The charter is voted with nobody agreed on who teaches under it."
 BEL_a_the_second_king_is_not_the_first_tt:0 "Albert has no estate to defend, and the reign begins with nothing to explain."
 BEL_a_the_first_king_has_not_finished_tt:0 "Leopold reigns still, and every act of the ministry is signed over his shoulder."
 BEL_a_the_register_survived_the_decade_tt:0 "The plural vote is intact. The decade closes exactly as it opened."
 BEL_a_the_register_was_worn_down_tt:0 "The register has been ground down year by year. The decade closes on borrowed time."
 BEL_a_the_powers_will_not_wait:0 "The Powers Will Not Wait"
 BEL_a_the_bargain_with_the_basin:0 "The Bargain with the Basin"
 BEL_a_the_bargain_with_the_basin_desc:0 "The Walloon industrialists are given rails, tariffs and order at the pit gate, and give back their silence on the franchise. It is a working arrangement between a Catholic ministry and men who will vote against it at every election."
 BEL_a_the_ministry_that_does_not_fall:0 "The Ministry That Does Not Fall"
 BEL_a_the_ministry_that_does_not_fall_desc:0 "Cabinets are reshuffled and the majority behind them never moves. Business is predictable, the departments are permanent, and nobody in the kingdom can remember what an opposition ministry looks like."
 BEL_a_the_language_laws_conceded:0 "The Language Laws Conceded"
 BEL_a_the_language_laws_conceded_desc:0 "Dutch in the courts, on the coinage and in the schools, granted late and in instalments. Flanders is quieter than it has been in a generation, and the Walloon benches have been told nothing was really given away."
 BEL_a_the_colonial_charter_of_the_right:0 "The Colonial Charter of the Right"
 BEL_a_the_colonial_charter_of_the_right_desc:0 "A governor-general, a budget the Chamber may read, and the missions doing the schooling and the dispensaries at a price the treasury likes. It is a colony administered by the same men who administer Flanders."
 BEL_a_the_reign_that_follows:0 "The Reign That Follows"
 BEL_a_the_reign_that_follows_desc:0 "A king with no estate, no concession companies and no quarrel with the Chamber. He asks the ministry for an army bill instead of an alibi, and the ministry finds it does not mind being asked."
 BEL_a_the_catholic_decade:0 "The Catholic Decade"
 BEL_a_the_catholic_decade_desc:0 "One majority, one register, one settled school question and a colony taken without an inquiry. The kingdom is stable, well administered and has postponed every argument it will one day have to hold."
 bel_dnc.1100.t:0 "The Party Takes the Decade"
 bel_dnc.1100.d:0 "The cabinet is sworn in a room that has not changed its furniture since 1884. Woeste wants the register defended before anything else; Beernaert wants Flanders paid before Flanders asks; Schollaert wants to know what is to be said about the King's other state. All three are the same question asked from different benches, and the ministry has one decade to answer it."
 bel_dnc.1100.a:0 "The register first. Everything else can wait."
 bel_dnc.1100.b:0 "Flanders first. The votes come from somewhere."
 bel_dnc.1100.c:0 "The King's state first, before the world asks us about it."
 bel_dnc.1101.t:0 "The Clerks Go Through the Rolls"
 bel_dnc.1101.d:0 "In four hundred communes the lists are checked, the second and third votes confirmed, and the disputed entries decided by men the arrondissement committee chose. The Liberal press calls it a census of the propertied. It is not answered, because the answer would be that this is precisely what it is and precisely why it works."
 bel_dnc.1101.a:0 "Confirm every entry. The register is the majority."
 bel_dnc.1101.b:0 "Let the doubtful entries go. We can afford to look fair."
 bel_dnc.1102.t:0 "A Deputation from Charleroi"
 bel_dnc.1102.d:0 "The masters of the basin arrive with a list: the branch line to the pits, the tariff on Ruhr steel, and gendarmes at the gate within the hour rather than the day. They are Liberals to a man and will vote against the ministry in May. They also employ two hundred thousand men, and both sides in the room know which fact is heavier."
 bel_dnc.1102.a:0 "Give them the line and the gendarmes."
 bel_dnc.1102.b:0 "Give them the tariff and nothing else."
 bel_dnc.1102.c:0 "Give them a hearing. Nothing is signed today."
 bel_dnc.1103.t:0 "The Ministry Is Interpellated"
 bel_dnc.1103.d:0 "The left moves a want of confidence and speaks for two days on the register, the schools and the Congo together. It is a good speech and it changes eleven votes, none of which were ever in doubt. De Broqueville replies for forty minutes without conceding a syllable, and the House divides exactly as it divided last year."
 bel_dnc.1103.a:0 "Answer nothing. Let the division speak."
 bel_dnc.1103.b:0 "Concede the smallest of the three and keep the other two."
 bel_dnc.1104.t:0 "The Bill for the Flemish Schools"
 bel_dnc.1104.d:0 "Subsidised teaching in Dutch in the northern communes, drafted narrowly enough that no Walloon deputy can call it a partition and generously enough that no Flemish curate can call it nothing. The Liberal benches vote against it because the money goes to the free schools. The bill passes on the votes of men who cannot read it."
 bel_dnc.1104.a:0 "Pass it as drafted."
 bel_dnc.1104.b:0 "Widen it. Pay Flanders properly while it is still cheap."
 bel_dnc.1104.c:0 "Narrow it. The Walloon benches must be kept."
 bel_dnc.1105.t:0 "The Men Do Not Come Out"
 bel_dnc.1105.d:0 "The strike committee sets the date, prints the appeal and waits. The tramwaymen were settled in March, the glassworkers want a fund built first, and in the pits of the Borinage half the men are out and half are at the face. By the fourth day the committee is negotiating its own return, and the register has not been mentioned once."
 bel_dnc.1105.a:0 "Say nothing. Let them go back on their own."
 bel_dnc.1105.b:0 "Offer the pit inspectorate. Buy the peace while it is cheap."
 bel_dnc.1106.t:0 "Another Majority"
 bel_dnc.1106.d:0 "The count comes in from the arrondissements and the party is returned again, on the same rolls, in the same seats, by the same margins. There is no celebration at the club worth the name. A majority that has held for a generation is not a victory any more; it is the weather, and men have stopped asking why it does not change."
 bel_dnc.1106.a:0 "Govern as before. Nothing has happened."
 bel_dnc.1106.b:0 "Use the mandate. Take the colonial question now."
 bel_dnc.1107.t:0 "The Commission Reports"
 bel_dnc.1107.d:0 "The King's own commissioners went up the river to answer Casement and have come back confirming him: the tally, the hostages, the hands. The report is printed in the Bulletin Officiel because suppressing it would be worse. Every denial this ministry has entered in a foreign chancellery is now a matter of public record, alongside its refutation."
 bel_dnc.1107.a:0 "Publish it whole. We are not the ones who did it."
 bel_dnc.1107.b:0 "Publish the conclusions and hold the evidence."
 bel_dnc.1108.t:0 "The Note Is Delivered"
 bel_dnc.1108.d:0 "The British note observes that the Free State holds its title from the signatories of Berlin and that the signatories are entitled to satisfy themselves how that title is used. Davignon reads it twice. There is no sentence in it that threatens anything, and no reading of it that leaves the estate where it stands at the end of the year."
 bel_dnc.1108.a:0 "Reply that the question is Belgian and will be settled in Brussels."
 bel_dnc.1108.b:0 "Reply that annexation is under consideration. Buy the time."
 bel_dnc.1109.t:0 "The Valuation of the Estate"
 bel_dnc.1109.d:0 "The commissioners are given the Brussels ledgers: the Matadi line, the concessions, the debt, and a schedule of works at Laeken and Ostend charged against a colony that has never seen either. What they are not given is any tally kept on the river. The difference between the two sets of books is the entire price of the cession."
 bel_dnc.1109.a:0 "Accept the ledgers as presented."
 bel_dnc.1109.b:0 "Send our own men to the river first."
 bel_dnc.1110.t:0 "The Cession Is Voted"
 bel_dnc.1110.d:0 "Eighty-three to fifty-four, with the left voting for annexation because it wants the Free State ended and the right voting for it because it wants the question ended. The treaty is signed as the King's lawyers drafted it. No article of it inquires into anything that happened before the signature, and both sides of the House know that is the point."
 bel_dnc.1110.a:0 "Take the colony and close the file."
 bel_dnc.1110.b:0 "Take the colony and open the accounts anyway."
 bel_dnc.1111.t:0 "The Crown Passes"
 bel_dnc.1111.d:0 "Leopold is buried and the crowd along the route says nothing at all, which the papers report as dignity. Albert takes the oath the same week, asks the ministry for an army bill and a colonial budget in the same sentence, and does not mention the Foundation. The settlement has acquired a king who wants things from it."
 bel_dnc.1111.a:0 "Give the new King his army bill."
 bel_dnc.1111.b:0 "Give him the colonial budget and hold the army."
 bel_dnc.1112.t:0 "The Decade Closes"
 bel_dnc.1112.d:0 "Thirty years of one majority. The register stands, the schools are settled, Flanders has been paid in instalments and the Congo was taken without anyone being asked what happened on the river. Nothing was resolved and everything was absorbed. The party calls that government. The men who will be called up in five years may call it something else."
 bel_dnc.1112.a:0 "It held. That is what it was for."
 bel_dnc.1112.b:0 "It held. We should ask for how much longer."
 BELDNC_k_the_bloc_of_the_left:0 "The Bloc of the Left"
 BELDNC_k_the_bloc_of_the_left_desc:0 "Liberals who want the vote counted once and Socialists who want it counted at all can beat this majority together and in no other way. We must build the cartel on arithmetic rather than principle, and remember that both halves of us speak French."
 BELDNC_k_one_man_one_vote:0 "One Man, One Vote"
 BELDNC_k_one_man_one_vote_desc:0 "We must strike the supplementary votes out of the electoral law, and ask every deputy who owes his seat to a second and a third vote to abolish both. The Senate will refuse and the King will hesitate, and the country will be governed by whoever survives the attempt."
 BELDNC_k_the_liberal_half_of_the_bargain:0 "The Liberal Half of the Bargain"
 BELDNC_k_the_liberal_half_of_the_bargain_desc:0 "The Workers bring us the street and the Liberals bring the ministries, the boards and the men who know how an estimate is drafted. We must pay Antwerp and the chemical works in offices now, before they remember what they think of Socialists."
 BELDNC_k_the_colony_before_the_king:0 "The Colony Before the King"
 BELDNC_k_the_colony_before_the_king_desc:0 "We do not intend to wait for a royal commission, a foreign campaign or a deathbed. We must put the Congo on the order paper as an ordinary question of Belgian government, and ask the King's ministers to account for a territory he insists is not theirs."
 BELDNC_k_the_second_general_strike:0 "The Second General Strike"
 BELDNC_k_the_second_general_strike_desc:0 "The Senate cannot vote down a stoppage, and it is the only argument we own that it cannot. We must bring Ghent, Liege and the Borinage out together and keep them out until the register is rewritten, at the cost of every Liberal seat outside the towns."
 BELDNC_k_the_senate_holds_out:0 "The Senate Holds Out"
 BELDNC_k_the_senate_holds_out_desc:0 "The upper house is elected on a property qualification and can delay our franchise bill until we fall. We must break it by threat of creation, by dissolution or by outlasting it, because nothing passes while it stands."
 BELDNC_k_the_schools_of_the_commune:0 "The Schools of the Commune"
 BELDNC_k_the_schools_of_the_commune_desc:0 "The law of the eighties handed the classroom back to the parish. We must take it away again - every commune keeping a school it pays for, staffs and inspects, with no bishop's voice in any of the three - and let half the country call it an attack on the faith."
 BELDNC_k_the_grant_is_withdrawn:0 "The Grant Is Withdrawn"
 BELDNC_k_the_grant_is_withdrawn_desc:0 "The free schools have drawn our money for a generation while answering to Mechelen. We must end the subsidy and let the dioceses keep their own establishments, and expect the countryside to hear of nothing else for a year."
 BELDNC_k_the_commission_the_chamber_names:0 "The Commission the Chamber Names"
 BELDNC_k_the_commission_the_chamber_names_desc:0 "A royal commission answers to the palace and can be ordered to withdraw its findings. We must name three of our own deputies with a mandate from the House and the power to summon agents home, and print whatever they bring back in the parliamentary record."
 BELDNC_k_the_terms_are_ours_to_write:0 "The Terms Are Ours to Write"
 BELDNC_k_the_terms_are_ours_to_write_desc:0 "If the colony is to pass to us we shall not accept a deed drafted at Laeken. We must settle the conditions ourselves - no annuity to the founder, no reserved domain, no lands excepted - and invite the King to sign a document his lawyers were not permitted to write."
 BELDNC_k_the_cartel_takes_the_chamber:0 "The Cartel Takes the Chamber"
 BELDNC_k_the_cartel_takes_the_chamber_desc:0 "Liberals and Socialists take the government bench together for the first time since the kingdom was founded, agreeing on the franchise and almost nothing else. We must keep the franchise as the next question before the House, every session, or the cartel dissolves."
 BELDNC_k_the_teacher_is_a_civil_servant:0 "The Teacher Is a Civil Servant"
 BELDNC_k_the_teacher_is_a_civil_servant_desc:0 "A schoolmaster who can be dismissed by his priest teaches what his priest wants. We must take appointment, salary, pension and discipline into our ministry, and do the slowest and most permanent thing available to us."
 BELDNC_k_the_bishops_answer_the_cartel:0 "The Bishops Answer the Cartel"
 BELDNC_k_the_bishops_answer_the_cartel_desc:0 "A pastoral letter will be read from every pulpit in Flanders on one Sunday, and it will not mention politics once. We must answer a right that needs no majority in our House because it has a congregation in every village we never visit."
 BELDNC_k_the_vote_is_taken_early:0 "The Vote Is Taken Early"
 BELDNC_k_the_vote_is_taken_early_desc:0 "The powers will force the annexation on us if we wait, and it will be a rescue rather than a decision. We must vote it now, on terms we wrote, at a moment we chose, and inform the King once it is entered in the record."
 BELDNC_k_the_estate_is_valued:0 "The Estate Is Valued"
 BELDNC_k_the_estate_is_valued_desc:0 "Half the estate turns out to be held through companies none of us has heard named aloud. We must ask exactly what we are being handed - the concessions, the domain lands, the buildings on the boulevard, the foundations in the sovereign's name - before we sign anything."
 BELDNC_k_the_register_rewritten:0 "The Register Rewritten"
 BELDNC_k_the_register_rewritten_desc:0 "We must strike out the supplementary votes, make the rolls again from nothing and fight the next election on a register that counts every man once. Whole arrondissements will change hands, and we shall have abolished the reason we exist."
 BELDNC_k_the_vote_the_party_fears:0 "The Vote the Party Fears"
 BELDNC_k_the_vote_the_party_fears_desc:0 "Half the adult population has no vote, and we who preach equality loudest are the most afraid of extending it. We must widen the register anyway, and take the risk that it hands the right a majority for a generation."
 BELDNC_k_one_school_for_two_tongues:0 "One School for Two Tongues"
 BELDNC_k_one_school_for_two_tongues_desc:0 "Both halves of the country must sit in the same classroom or there will not be one country. We must build a single state system with one curriculum and one inspectorate, taught in Dutch where Dutch is spoken and in French where French is."
 BELDNC_k_the_colony_of_a_parliament:0 "The Colony of a Parliament"
 BELDNC_k_the_colony_of_a_parliament_desc:0 "A governor who reports to a palace can be argued with by nobody. We must write the charter ourselves - an estimate voted every year, a minister we can interpellate, a report to Brussels - and make the colony answerable to men who can be voted out."
 BELDNC_k_the_levy_in_kind_ends:0 "The Levy in Kind Ends"
 BELDNC_k_the_levy_in_kind_ends_desc:0 "Forty hours a month in rubber and ivory are owed to a state that gives nothing back, and sentries collect them. We must abolish the levy by decree and withdraw the sentries, and accept that the Upper Congo produces nothing this season."
 BELDNC_k_the_atrocity_is_ours_now:0 "The Atrocity Is Ours Now"
 BELDNC_k_the_atrocity_is_ours_now_desc:0 "We have entered denials on the King's behalf for years and the record contradicts every one. We must withdraw them, publish the record entire, and start arguing about what is to be done rather than about whether it happened."
 BELDNC_k_the_kingdom_of_the_cartel:0 "The Kingdom the Cartel Made"
 BELDNC_k_the_kingdom_of_the_cartel_desc:0 "One register, a state school in every commune, and a colony that answers to us. We must govern the louder and poorer kingdom that makes, and stop pretending any part of it belongs to the King."
 BEL_k_bloc_meets_a_new_king_tt:0 "§GThe old reign is over.§! A new king has no personal quarrel with the cartel and no estate in Africa he must defend in person."
 BEL_k_bloc_meets_leopold_tt:0 "§RLeopold is still on the throne.§! The bloc takes office against a sovereign who regards it as an inconvenience with a majority."
 BEL_k_single_vote_new_reign_tt:0 "§GA new king signs.§! Albert has no register to defend and puts his name to the bill without argument."
 BEL_k_single_vote_old_king_tt:0 "§RLeopold hesitates.§! The bill waits on a signature the palace is in no hurry to provide."
 BEL_k_liberals_pay_for_the_street_tt:0 "§RThe strikes have already begun.§! The Liberals pay for a partnership that is being conducted in the streets rather than in the House."
 BEL_k_liberals_pay_in_the_house_tt:0 "§GThe quarrel is still parliamentary.§! The Liberals get their offices and the cartel gets its votes without a barricade in sight."
 BEL_k_the_house_moves_on_a_scandal_tt:0 "§GThe world is already reading about us.§! The motion arrives on a wave the Chamber did not have to raise itself."
 BEL_k_the_house_moves_on_a_principle_tt:0 "§RNobody abroad is shouting yet.§! The Chamber moves on the merits, which is slower and far more expensive in favours."
 BEL_k_strike_without_a_grievance_tt:0 "§RThe register is nearly gone already.§! A general strike for a demand half met is a strike the party cannot end on its own terms."
 BEL_k_strike_against_the_register_tt:0 "§GThe plural vote still stands.§! The strike has one clear demand and the country knows exactly what would end it."
 BEL_k_senate_leans_on_the_crown_tt:0 "§RThe upper house appeals to the King.§! Breaking the Senate now means breaking it against the palace as well."
 BEL_k_senate_stands_alone_tt:0 "§GThe crown stays out of it.§! The Senate is left to defend a property qualification with nothing but its own arithmetic."
 BEL_k_two_school_administrations_tt:0 "§RTwo communities in law.§! Every school regulation must be drafted, voted and inspected twice over."
 BEL_k_one_school_law_in_french_tt:0 "§YOne kingdom in law.§! A single school law goes out in a single language, and Flanders reads it as one more instruction."
 BEL_k_schools_before_the_language_question_tt:0 "§YThe language question is still open.§! The schools are reformed before anyone has settled which tongue they teach in."
 BEL_k_grant_withdrawn_from_a_flanders_that_answers_tt:0 "§RFlanders is already roused.§! Cutting the grant lands on a countryside that has learned how to answer back."
 BEL_k_grant_withdrawn_quietly_tt:0 "§GFlanders is quiet.§! The subsidy ends with more grumbling in the sacristy than in the street."
 BEL_k_commission_reads_our_own_denials_tt:0 "§RWe have denied this before.§! The commission's first exhibit is the kingdom's own official denials."
 BEL_k_commission_reads_a_clean_record_tt:0 "§GNothing has been denied in our name.§! The commission reports into a record it does not first have to contradict."
 BEL_k_terms_for_a_regime_still_running_tt:0 "§RThe regime is untouched.§! Terms are written for a colony still being worked exactly as it was."
 BEL_k_terms_for_a_regime_already_bent_tt:0 "§GThe worst of it has already been stopped.§! Terms are written for a colony that has begun to change shape."
 BEL_k_cartel_governs_with_both_houses_tt:0 "§GThe Senate has given way.§! The cartel governs with both houses and does not have to buy every division."
 BEL_k_cartel_governs_against_the_upper_house_tt:0 "§RThe Senate still resists.§! Every bill leaves the Chamber knowing it will come back mutilated."
 BEL_k_one_payroll_for_the_schools_tt:0 "§GThe grant is already gone.§! There is one payroll for the schools and the ministry writes it."
 BEL_k_two_payrolls_for_the_schools_tt:0 "§RThe free schools still draw public money.§! The state pays teachers it does not appoint alongside teachers it does."
 BEL_k_the_pastoral_letter_answers_a_payroll_tt:0 "§GThe teachers are already the state's.§! The letter is read against an arrangement the country has begun to accept."
 BEL_k_the_pastoral_letter_answers_a_vacuum_tt:0 "§RNothing has replaced the parish school.§! The letter is read into a gap the cartel has not yet filled."
 BEL_k_the_house_takes_it_from_an_heir_tt:0 "§GThe founder is dead.§! The Chamber takes the colony from an heir with no attachment to how it was made."
 BEL_k_the_house_takes_it_from_a_living_king_tt:0 "§RLeopold is alive and refuses.§! The Chamber takes the estate from a sovereign who intends to be remembered as its victim."
 BEL_k_the_estate_was_already_named_tt:0 "§GThe estate has been named in the House before.§! The valuation is a continuation and not an ambush."
 BEL_k_the_estate_is_named_here_tt:0 "§RThe estate has never been discussed openly.§! Naming it here is the first blow and it is struck at the palace."
 BEL_k_the_register_falls_to_the_street_tt:0 "§RThe strikes carried it.§! The plural vote dies in the street, and everyone concerned remembers that it did."
 BEL_k_the_register_falls_to_the_house_tt:0 "§GThe Chamber carried it.§! The plural vote dies in a division, which is the ending the cartel wanted."
 BEL_k_the_wider_register_feeds_the_pulpit_tt:0 "§RThe grant has been withdrawn.§! A wider register hands the parish exactly the electorate it has spent a year organising."
 BEL_k_the_wider_register_feeds_the_party_tt:0 "§GThe Church has not been provoked.§! A wider register reaches the towns before the sacristy can reach the villages."
 BEL_k_one_law_two_statutes_tt:0 "§GTwo communities in law.§! The school settlement fits the statute the kingdom has already adopted."
 BEL_k_one_law_one_kingdom_tt:0 "§ROne kingdom in law.§! Teaching in two languages under a unitary statute has to be argued through line by line."
 BEL_k_one_law_no_statute_tt:0 "§YNo statute has been settled.§! The schools decide the language question by practice before the law gets to it."
 BEL_k_a_charter_written_from_evidence_tt:0 "§GThe Chamber has its own report.§! The charter is drafted from evidence taken under a parliamentary mandate."
 BEL_k_a_charter_written_from_nothing_tt:0 "§RThere is no report to work from.§! The charter is drafted from what the ministry chooses to disclose, and one more denial goes on the record."
 BEL_k_the_levy_ends_after_the_denials_tt:0 "§RWe denied it repeatedly first.§! Ending the levy now reads abroad as a confession rather than a reform."
 BEL_k_the_levy_ends_before_the_denials_tt:0 "§GLittle has been denied in our name.§! Ending the levy reads abroad as a decision and not as a retreat."
 BEL_k_the_name_is_taken_under_judgement_tt:0 "§RThe world has already judged us.§! Belgium accepts the name in front of an audience that made up its mind years ago."
 BEL_k_the_name_is_taken_in_quiet_tt:0 "§GThe worst was never said aloud.§! Belgium accepts the name before anyone abroad has finished assembling the case."
 BEL_k_a_kingdom_that_counted_everyone_tt:0 "§GThe register was widened past the men.§! The kingdom the cartel leaves behind counts a great many more people than it found."
 BEL_k_a_kingdom_that_counted_the_men_tt:0 "§YThe register stops at the men.§! One vote each, for half the country, and the argument is deferred to the next generation."
 BEL_k_the_upper_house_and_the_crown:0 "The Upper House and the Crown"
 BEL_k_the_countryside_against_the_cartel:0 "The Countryside Against the Cartel"
 BEL_k_the_pulpit_against_the_cartel:0 "The Pulpit Against the Cartel"
 BEL_k_the_schools_of_the_state:0 "The Schools of the State"
 BEL_k_the_schools_of_the_state_desc:0 "The commune builds it, the ministry staffs it and the inspectorate answers to Brussels. Attendance rises, literacy rises, and half the country regards the whole arrangement as an act of confiscation carried out against its children."
 BEL_k_the_colony_of_the_chamber:0 "The Colony of the Chamber"
 BEL_k_the_colony_of_the_chamber_desc:0 "The Congo is administered under a charter voted by parliament, with an estimate presented every year and a minister who can be called to the tribune to defend it. Slower than a king. Enormously harder to lie to."
 BEL_k_the_name_we_answer_to:0 "The Name We Answer To"
 BEL_k_the_name_we_answer_to_desc:0 "Belgium has admitted, in its own Chamber and over its own signature, what was done on the river. The admission costs it something at home every day. It also means nobody abroad can extract the confession again, because it has already been made."
 BEL_k_the_kingdom_of_the_cartel:0 "The Kingdom the Cartel Made"
 BEL_k_the_kingdom_of_the_cartel_desc:0 "One vote a man, state schools, a colony under parliament and a crown reduced to signing what it is handed. The country argues about everything and defers to nothing, which makes it exhausting to govern and remarkably difficult to frighten."
 bel_dnc.1200.t:0 "The Cartel Is Announced"
 bel_dnc.1200.d:0 "The two party bureaux publish a joint declaration from the same building on the same afternoon. It runs to eleven lines, promises the abolition of the plural vote, and is silent on every other subject in Belgian politics.\n\nThe silence is deliberate. The question is which half of the bloc gets to break it first."
 bel_dnc.1200.a:0 "The Liberals take the front bench."
 bel_dnc.1200.b:0 "Vandervelde speaks for the cartel."
 bel_dnc.1210.t:0 "The Senate Answers"
 bel_dnc.1210.d:0 "The upper house returns the franchise bill with the essential clause struck out and a note observing that the Senate is not a registry office for the Chamber's enthusiasms.\n\nThere are two ways past it, and both of them cost more than the bill did."
 bel_dnc.1210.a:0 "Ask the King to create the peers we need."
 bel_dnc.1210.b:0 "Dissolve, and let the country answer for us."
 bel_dnc.1220.t:0 "The Letter from Mechelen"
 bel_dnc.1220.d:0 "A pastoral letter is read from every pulpit between Bruges and Hasselt on the same Sunday morning. It speaks of children, of conscience, and of a government that has decided which of the two it prefers.\n\nIt is not, technically, a political document. Nothing in Belgium this month is more political."
 bel_dnc.1220.a:0 "Prosecute the clergy who read it."
 bel_dnc.1220.b:0 "Let them read it, and answer in the House."
 bel_dnc.1230.t:0 "The Colony Is Voted"
 bel_dnc.1230.d:0 "The division is taken at eleven in the evening. The Congo passes to the Kingdom of Belgium by a majority the Chamber assembled itself, on terms the Chamber wrote, years before anyone abroad could force the question.\n\nThe deputies file out past a gallery that has not made up its mind whether this is a triumph."
 bel_dnc.1230.a:0 "An act of state, and we say so."
 bel_dnc.1230.b:0 "A burden accepted, and we say that."
 bel_dnc.1240.t:0 "The Report from the Kasai"
 bel_dnc.1240.d:0 "The commission's agents come home with three hundred pages of depositions, a register of the sentries who took them, and photographs the printer has asked in writing to be excused from setting.\n\nEvery word of it can be entered in the parliamentary record. Once entered, it cannot be withdrawn by anybody."
 bel_dnc.1240.a:0 "Print it entire, names included."
 bel_dnc.1240.b:0 "Print it with the names withheld."
 bel_dnc.1250.t:0 "The Name We Answer To"
 bel_dnc.1250.d:0 "The minister rises to withdraw, one by one, every denial the kingdom has entered abroad on the late sovereign's behalf. It takes him forty minutes. Nobody interrupts him and nobody applauds when he sits down.\n\nWhat Belgium does with the admission is now a Belgian question, which is the whole point of having made it."
 bel_dnc.1250.a:0 "Raise a monument, and read the register at it."
 bel_dnc.1250.b:0 "Say it once, and govern the place better."
 BELDNC_r_govern_past_the_chamber:0 "Govern Past the Chamber"
 BELDNC_r_govern_past_the_chamber_desc:0 "The constitution says a great deal and is silent on whether the King may govern, and the silence is where we intend to live. We must appoint ministers who answer to him, convene the Chamber when convenient and carry the estimates by decree when it is not."
 BELDNC_r_the_royal_message:0 "The Royal Message"
 BELDNC_r_the_royal_message_desc:0 "The King will address the Chamber over our heads on the colony, the army and the franchise together. We must have it read, and take either outcome: the Crown a party to the debate, or the Crown beaten in public with the gallery watching."
 BELDNC_r_the_ministers_of_the_king:0 "The Ministers of the King"
 BELDNC_r_the_ministers_of_the_king_desc:0 "A cabinet that must be assembled out of the Chamber can only do what the Chamber will bear. We must be chosen at the Palace instead - administrators, industrialists, a soldier or two, men who will not make speeches - and govern well without a single vote behind us."
 BELDNC_r_the_congo_is_the_kings:0 "The Congo Is the King's"
 BELDNC_r_the_congo_is_the_kings_desc:0 "The Free State is a sovereignty recognised by every power that signed at Berlin, and its sovereign happens to be our King. We must say so in every chancellery, defend the concession companies as lawful administration, and raise the tally rather than lower it."
 BELDNC_r_the_press_bureau:0 "The Press Bureau"
 BELDNC_r_the_press_bureau_desc:0 "Belgium does not censor, and Belgium does place a great deal of official advertising. We must open a small office beside the Interior to visit editors, advise them and remind them where the state spends, and let the loud papers find their paper costs more."
 BELDNC_r_the_crown_rules:0 "The Crown Rules"
 BELDNC_r_the_crown_rules_desc:0 "Ministers serve at the King's pleasure, the estimates go by decree where the Chamber balks, and a Palace bureau has quietly become the government. We must finish the work and remain a constitutional monarchy on paper, because on paper is the only place the difference survives."
 BELDNC_r_the_estimates_by_decree:0 "The Estimates by Decree"
 BELDNC_r_the_estimates_by_decree_desc:0 "The budget will not be voted this session and the fortress works cannot wait for it. We must apply it without a vote, pay the arrears, sign the contracts, and find out whether any court in this kingdom will say we could not."
 BELDNC_r_the_domaine_de_la_couronne:0 "The Domaine de la Couronne"
 BELDNC_r_the_domaine_de_la_couronne_desc:0 "The sovereign needs a revenue no administration may inspect. We must carve a district the size of a European kingdom out of the Free State and reserve it to him personally, and fund the arches, the galleries and the glasshouses out of it."
 BELDNC_r_the_kings_works:0 "The King's Works"
 BELDNC_r_the_kings_works_desc:0 "A country governed without its consent should at least see what it is getting. We must build the arches, the avenues, the colonial museum and the park at Ostend, in Belgian stone paid for elsewhere."
 BELDNC_r_the_gendarmerie_of_the_kingdom:0 "The Gendarmerie of the Kingdom"
 BELDNC_r_the_gendarmerie_of_the_kingdom_desc:0 "A burgomaster can decline to disperse a meeting and several of them do. We must enlarge the gendarmerie, mount it and put it under the War Ministry rather than the communes, and station squadrons where the basin can stop the kingdom."
 BELDNC_r_the_chamber_prorogued:0 "The Chamber Prorogued"
 BELDNC_r_the_chamber_prorogued_desc:0 "The session can be closed and simply not recalled. We must carry the estimates by royal decree, send the deputies home to their provinces, and govern from the Palace until the country learns better manners."
 BELDNC_r_the_civil_list_untouched:0 "The Civil List Untouched"
 BELDNC_r_the_civil_list_untouched_desc:0 "The civil list is the one weapon a Chamber holds against a King, and the left moves to cut it every year. We must see that the motion is not reached, not debated and not recorded, and pay the list in full and on time."
 BELDNC_r_the_congo_pays_for_the_forts:0 "The Congo Pays for the Forts"
 BELDNC_r_the_congo_pays_for_the_forts_desc:0 "The King offers what no minister could ask for: the cupolas on the Meuse, the armour and the guns, paid from the estate and entered in no Belgian ledger. We must take it, and know what every deputy who reads a pamphlet will say the concrete is made of."
 BELDNC_r_the_deputies_go_home:0 "The Deputies Go Home"
 BELDNC_r_the_deputies_go_home_desc:0 "With the Chamber closed, the most prominent citizens of Liege, Ghent, Charleroi and Antwerp are at home among their own grievances. We must watch what happens when anger is no longer obliged to turn itself into a motion."
 BELDNC_r_the_officer_corps_swears_to_him:0 "The Officer Corps Swears to Him"
 BELDNC_r_the_officer_corps_swears_to_him_desc:0 "An army that swears to a constitution can be claimed by whoever holds the Chamber. We must take promotion, staff appointments and the schools into the Palace and rewrite the oath to the King, and make the officer corps efficient and nobody else's at one stroke."
 BELDNC_r_the_colony_of_one_man:0 "The Colony of One Man"
 BELDNC_r_the_colony_of_one_man_desc:0 "We refuse the cession and refuse the commission, and the Free State enters its second decade as it entered the first. We must defend a private possession larger than Europe's largest kingdom, which no parliament may inspect and everyone has read about."
 BELDNC_r_the_understanding_with_berlin:0 "The Understanding with Berlin"
 BELDNC_r_the_understanding_with_berlin_desc:0 "Berlin admires a king who governs and says so warmly and often. We must take the staff courtesies and the understanding about the eastern railways, sign nothing, and accept that every other guarantor will draw the obvious conclusion."
 BELDNC_r_the_king_is_old:0 "The King Is Old"
 BELDNC_r_the_king_is_old_desc:0 "The office we are building is personal and the man it was built around is seventy and not well. We must prepare the succession, because the nephew reads engineering and has never once said what he thinks of any of this."
 BELDNC_r_the_quiet_kingdom:0 "The Quiet Kingdom"
 BELDNC_r_the_quiet_kingdom_desc:0 "Wages rise, the pits are inspected, the trams run and the newspapers agree about everything. We must keep the best-governed small country in Europe running, and note that nothing in it is decided by anyone the country chose."
 BELDNC_r_the_guarantee_of_a_strong_hand:0 "The Guarantee of a Strong Hand"
 BELDNC_r_the_guarantee_of_a_strong_hand_desc:0 "Neutrality is a promise five powers made about us and the Palace intends to hold it ourselves. We must finish the forts, keep an army that obeys instantly and a friendship in Berlin, and be ready for the day that is the only guarantee left."
 BELDNC_r_alberts_inheritance:0 "Albert's Inheritance"
 BELDNC_r_alberts_inheritance_desc:0 "The nephew inherits a throne, a colony and an office his uncle invented, and finds the third cannot simply be laid down. We must serve him as we served the uncle, and let him choose whether to govern or to hand the power back."
 BELDNC_r_the_crown_that_governs:0 "The Crown That Governs"
 BELDNC_r_the_crown_that_governs_desc:0 "We end the decade solvent, armed and orderly, with a Chamber that meets when it is called. We must keep it that way, knowing we have become strong in a manner the constitution never contemplated and brittle in exactly the same manner."
 BEL_r_the_office_passes_intact_tt:0 "The office was built for one man and is being taken up by another. The prerogative rises §R15§!, and a new reign steadies the country: stability §G3%§!."
 BEL_r_leopold_takes_the_office_tt:0 "Leopold takes the powers himself, and every pamphlet in Europe knows who is holding them. The prerogative rises §R25§! and the scandal §R4§!."
 BEL_r_the_message_is_read_twice_tt:0 "The message is read in both Chambers, in both languages, and is a smaller thing in each. Political power §G25§!, the Flemish grievance falls §G3§!."
 BEL_r_the_message_is_read_in_french_tt:0 "One kingdom, one Chamber, one language for the King's words. Stability §R3%§!, and the Flemish grievance rises §R4§!."
 BEL_r_the_message_is_read_as_it_stands_tt:0 "The language question has not been settled, so the message is read as it was written and nobody argues about the wording. Political power §G15§!."
 BEL_r_message_from_a_new_king_tt:0 "A new King addressing his first Chamber is a ceremony, not a challenge. Stability §G3%§!, and the prerogative falls back §G5§!."
 BEL_r_message_from_leopold_tt:0 "From Leopold it is not a ceremony and the gallery knows it. The prerogative rises §R10§!, the scandal §R5§!, and the monarchists gain."
 BEL_r_a_ministry_against_a_majority_tt:0 "The Chamber wanted the colony and has been given a ministry instead. Political power §R40§!, stability §R4%§!, scandal §R4§!."
 BEL_r_a_ministry_without_a_quarrel_tt:0 "No majority is waiting to be offended, and the new ministers are simply appointed. Political power §G30§!, prerogative §R6§!."
 BEL_r_the_colonial_service_recruits_both_tt:0 "A colony defended in the name of two communities needs two administrations to defend it. Political power §R25§!, the Flemish grievance falls §G3§!."
 BEL_r_the_colony_is_administered_in_french_tt:0 "One kingdom, one colonial service, one language of command in Boma. Political power §G25§!, the Flemish grievance rises §R4§!."
 BEL_r_the_colony_is_administered_as_before_tt:0 "Nothing has been settled at home, so nothing changes in Africa either. Political power §G10§!."
 BEL_r_the_bureau_arrives_late_tt:0 "The story is already out of the country and the bureau is only closing a stable door. Scandal §G8§!, stability §R3%§!, and the Chamber presses §R4§!."
 BEL_r_the_bureau_arrives_early_tt:0 "The bureau reaches the editors before the pamphleteers do. Scandal §G4§! and political power §G25§!."
 BEL_r_a_crown_over_two_statutes_tt:0 "Governing past one Chamber is difficult; governing past two statutes at once is expensive. Political power §R50§!, stability §R3%§!, Walloon feeling §R4§!."
 BEL_r_one_crown_one_kingdom_tt:0 "A single kingdom under a single Crown is exactly the argument the Palace wanted. Political power §G50§! and the prerogative rises §R8§!."
 BEL_r_a_crown_over_an_open_question_tt:0 "The language question is still open, which at least means it is not yet an obstacle. Political power §G20§!."
 BEL_r_the_decree_meets_the_street_tt:0 "There is already a movement in the streets, and a budget by decree is exactly what it was waiting for. Stability §R5%§!, and a general strike begins."
 BEL_r_the_decree_meets_no_one_tt:0 "The country is quiet, the arrears are paid, and remarkably few people notice. Political power §G30§!, stability §G2%§!."
 BEL_r_the_domaine_on_a_full_tally_tt:0 "The tally is already at its height and the reserved district simply takes its share. Political power §G40§!, and the scandal rises a further §R5§!."
 BEL_r_the_tally_is_raised_for_it_tt:0 "The district cannot pay for arches at the present quota, so the quota is raised. The Congo returns to the full tally and stability falls §R2%§!."
 BEL_r_the_arches_are_paid_for_in_rubber_tt:0 "Everyone in Brussels can now name what the stone cost. Stability §R3%§! and the Chamber's motion gains §R6§!."
 BEL_r_the_arches_are_only_arches_tt:0 "The world is not yet asking where the money came from, and the works are simply admired. Political power §G25§!, stability §G3%§!."
 BEL_r_the_gendarmes_are_sent_to_the_basin_tt:0 "Wallonia is already lost to the Palace, and squadrons at the pithead settle nothing. Stability §R4%§!, Walloon feeling §R5§!, and the strikes deepen."
 BEL_r_the_gendarmes_stand_in_the_capital_tt:0 "The basin is quiet, so the gendarmerie is a parade and a reassurance. Political power §G25§! and the strikes ease §G1§!."
 BEL_r_two_chambers_prorogued_at_once_tt:0 "Two statutory Chambers must be prorogued together, and both communities take it as an insult meant for them. Stability §R6%§!, Flemish §R6§!, Walloon §R6§!."
 BEL_r_one_chamber_one_prorogation_tt:0 "One Chamber, one decree, one signature. Political power §G50§! and the prerogative rises §R10§!."
 BEL_r_the_question_is_prorogued_with_it_tt:0 "The language question was before the Chamber and is prorogued along with it. Flemish §R3§! and Walloon §R3§! feeling both harden."
 BEL_r_prorogued_by_a_new_king_tt:0 "A new King may prorogue a Chamber once and be forgiven for it. Stability §G4%§! and the prerogative falls §G10§!."
 BEL_r_prorogued_by_leopold_tt:0 "From Leopold it is the last proof anyone needed. The scandal rises §R10§! and the prerogative §R10§!."
 BEL_r_no_one_is_left_to_vote_the_list_tt:0 "The Chamber is not sitting, so the list is simply paid. Political power §G40§!, stability §R3%§!, scandal §R4§!."
 BEL_r_the_list_is_voted_under_protest_tt:0 "The deputies vote it because they must, and say what they think of it first. Political power §R25§! and the Chamber's motion gains §R4§!."
 BEL_r_the_forts_are_named_in_the_pamphlets_tt:0 "The concrete has a provenance and every pamphlet in Europe prints it. The Chamber's motion gains §R8§! and stability falls §R4%§!."
 BEL_r_the_forts_are_named_after_the_king_tt:0 "Nobody is asking awkward questions yet, and the cupolas are simply a gift. Stability §G3%§! and political power §G25§!."
 BEL_r_they_go_home_to_a_meeting_tt:0 "They go home to towns that are already striking, and two hundred orators arrive at once. Stability §R6%§!, scandal §R6§!, and the strike spreads."
 BEL_r_they_go_home_quietly_tt:0 "There is nothing waiting for them at home but the harvest. Political power §G40§! and stability §G3%§!."
 BEL_r_an_oath_in_one_language_tt:0 "The new oath is sworn in French to a King whose army is more than half Dutch-speaking. The Flemish grievance rises §R6§! and a refusal is entered."
 BEL_r_an_oath_in_both_tt:0 "The oath is taken in the language the man was raised in, which costs the Palace nothing. Stability §G3%§! and the Flemish grievance falls §G3§!."
 BEL_r_the_world_has_already_decided_tt:0 "The scandal has passed the point where refusal can be explained, and this is how Belgium will be described for a generation. Stability §R5%§! and world threat."
 BEL_r_the_world_has_not_finished_looking_tt:0 "The case against us is not yet closed, and a refusal made early is only a refusal. Political power §G40§! and stability §G3%§!."
 BEL_r_the_forts_answer_the_compliment_tt:0 "There is a fortress programme behind the compliment, which is the only thing that makes it survivable. War support §G5%§! and army experience §G20§!."
 BEL_r_nothing_answers_the_compliment_tt:0 "We have accepted a friendship and built nothing to make it optional. Stability §R4%§! and the scandal rises §R4§!."
 BEL_r_the_office_is_already_his_tt:0 "Albert is already on the throne, and the succession the bureaux feared has been survived. Political power §G40§!, stability §G5%§!, scandal §G8§!."
 BEL_r_the_old_man_will_not_be_hurried_tt:0 "Leopold declines to discuss his own death and the arrangements are made behind his back. Prerogative §R8§!, scandal §R4§!, stability §R3%§!."
 BEL_r_one_half_is_not_quiet_tt:0 "The kingdom is quiet everywhere except in the half that is asking to be governed in its own language. Stability §R5%§!, Flemish grievance §R4§!."
 BEL_r_the_quiet_reaches_both_halves_tt:0 "The language question was answered before it grew, and the quiet is genuine. A concession is entered and stability rises §G3%§!."
 BEL_r_the_hand_is_held_from_the_east_tt:0 "The strong hand turns out to be partly somebody else's, and Berlin is content to lend it. Stability §G3%§! and German friendship deepens."
 BEL_r_the_hand_is_our_own_tt:0 "No power stands behind us, which at least means no power owns the guarantee. Stability §R3%§! and war support §G3%§!."
 BEL_r_he_inherits_an_office_he_cannot_give_back_tt:0 "The prerogative has grown past the point where a new King could dismantle it without breaking the state. Political power §G60§!, stability §R4%§!, prerogative §R10§!."
 BEL_r_he_inherits_an_office_he_can_still_return_tt:0 "The Crown never took quite enough to be unable to give it back, and Albert begins the work. Stability §G5%§!, prerogative §G10§!, the Chamber revives §R6§!."
 BEL_r_the_office_outlived_the_man_who_made_it_tt:0 "Albert holds an office designed for his uncle and holds it better. Stability §G5%§! and the scandal falls §G10§!."
 BEL_r_the_office_is_still_leopolds_tt:0 "The decade ends with the same man holding the same powers, and Europe has stopped giving him the benefit of any doubt. Stability §R5%§! and scandal §R8§!."
 BEL_r_the_crown_governs_alone:0 "The Belgian Crown Governs Alone"
 BEL_r_the_chamber_does_not_sit:0 "The Belgian Chamber Does Not Sit"
 BEL_r_the_estate_the_world_will_not_forget:0 "The Estate the World Will Not Forget"
 BEL_r_the_guarantee_has_a_favourite:0 "The Guarantee Has a Favourite"
 BEL_r_a_neutrality_nobody_believes:0 "A Neutrality Nobody Believes"
 BEL_r_a_kingdom_governed_from_the_palace:0 "A Kingdom Governed From the Palace"
 BEL_r_liebaert_at_the_palace:0 "Liebaert at the Palace"
 BEL_r_liebaert_at_the_palace_desc:0 "A finance minister with no party behind him and no wish for one, who has discovered that a department runs rather well when nobody has to be persuaded of anything first."
 BEL_r_solvay_in_the_council:0 "Solvay in the Council"
 BEL_r_solvay_in_the_council_desc:0 "The chemist who built an industry sits in a council that was never elected, and finds the arrangement no stranger than a board of directors, which is broadly what it has become."
 BEL_r_hellebaut_for_order:0 "Hellebaut for Order"
 BEL_r_hellebaut_for_order_desc:0 "The War Ministry has taken the gendarmerie away from the communes, and the general who now commands it answers to the Palace and to nobody in the coal basin."
 BEL_r_gillain_for_the_crown:0 "Gillain for the Crown"
 BEL_r_gillain_for_the_crown_desc:0 "A staff officer whose promotion came from the Palace and whose oath is sworn to the man in it. He is very good, and the distinction is no longer one the army makes."
 BEL_r_albert_in_council:0 "Albert in Council"
 BEL_r_albert_in_council_desc:0 "The new King sits in his own council, says little, reads everything, and has not yet told anyone whether he intends to keep the office his uncle assembled for him."
 BEL_r_the_kings_ministers:0 "The King's Ministers"
 BEL_r_the_kings_ministers_desc:0 "A ministry appointed at the Palace, answerable to the Palace, and informed of the Chamber's opinion as a courtesy. They are competent and they are quick, because nothing has to be argued for twice. They are also the first Belgian government that no election produced."
 BEL_r_the_estimates_by_decree:0 "The Estimates by Decree"
 BEL_r_the_estimates_by_decree_desc:0 "The budget is applied rather than voted. Contractors are paid, the works go on, and the constitutional objection is left for the lawyers to enjoy. Every year it is done it becomes slightly more normal, which is the part the deputies find hardest to answer."
 BEL_r_the_domaine_de_la_couronne:0 "The Domaine de la Couronne"
 BEL_r_the_domaine_de_la_couronne_desc:0 "A reserved district in the Congo, answerable to the sovereign alone, whose returns build in Brussels and are audited nowhere. It pays for a great deal. It also gives every critic of Belgium a single sentence that requires no explanation at all."
 BEL_r_the_gendarmerie_of_the_kingdom:0 "The Gendarmerie of the Kingdom"
 BEL_r_the_gendarmerie_of_the_kingdom_desc:0 "Mounted, enlarged, and under the War Ministry rather than the communes. A burgomaster can no longer decline to disperse a meeting, and the meetings have noticed. Order is better everywhere and nobody in Charleroi mistakes what it is made of."
 BEL_r_the_kings_officer_corps:0 "The King's Officer Corps"
 BEL_r_the_kings_officer_corps_desc:0 "Promotion, the staff and the schools all pass through the Palace, and the oath is sworn to the King rather than the constitution. The army is better than it has ever been. It is also, for the first time, somebody's in particular."
 BEL_r_the_understanding_with_berlin:0 "The Understanding with Berlin"
 BEL_r_the_understanding_with_berlin_desc:0 "No treaty, no signature, nothing a foreign ministry could produce: only staff courtesies, an arrangement about the eastern railways, and the habit of asking one guarantor before the other four. The other four have drawn their own conclusions."
 BEL_r_the_quiet_kingdom:0 "The Quiet Kingdom"
 BEL_r_the_quiet_kingdom_desc:0 "Wages up, pits inspected, strikes ended, newspapers agreeable, trams punctual. Visitors call it the best-governed small country in Europe. Nothing in it was decided by anyone the country chose, and the quiet is what that costs and what it buys."
 BEL_r_alberts_inheritance:0 "Albert's Inheritance"
 BEL_r_alberts_inheritance_desc:0 "A young King in an office his uncle invented, holding powers he did not ask for and cannot lay down without a crisis. He is liked where Leopold was not, and that alone buys the arrangement several more years than it deserves."
 BEL_r_the_crown_that_governs:0 "The Crown That Governs"
 BEL_r_the_crown_that_governs_desc:0 "A small kingdom that works: solvent, armed, orderly, and governed from one building by men no one elected. It is stronger than the Belgium of 1900 in every measurable way, and it rests entirely on the health and judgement of a single family."
 bel_dnc.1300.t:0 "The Ministry Is Informed"
 bel_dnc.1300.d:0 "The ministers are received at Laeken and told, courteously, how the coming session will be managed. The King will decide what is put to the Chamber and when. They may resign if they prefer; the King has a list of men who will not. Two of them go pale, and none of them resigns."
 bel_dnc.1300.a:0 "They serve the Crown."
 bel_dnc.1300.b:0 "Let one of them resign loudly."
 bel_dnc.1301.t:0 "The Bureau's First Visit"
 bel_dnc.1301.d:0 "An official calls on the editor of a Brussels daily to discuss a series on the rubber quotas. Nothing is threatened. The state's advertisements are mentioned, the paper's supply contract is mentioned, and the series does not appear. The editor writes about it years later, in Paris."
 bel_dnc.1301.a:0 "Quietly done."
 bel_dnc.1301.b:0 "Let the series run and answer it."
 bel_dnc.1304.t:0 "The Ministry Resigns and Is Reappointed"
 bel_dnc.1304.d:0 "The government resigns over a motion it would have lost. The King accepts the resignations in the morning, reappoints the same men in the afternoon, and the Chamber is left holding a victory that changed nothing at all. The procedure is faultless. Everyone can see what it is for."
 bel_dnc.1304.a:0 "The same men, the same afternoon."
 bel_dnc.1304.b:0 "Change two faces and keep the rest."
 bel_dnc.1304.c:0 "Let the Chamber have one of them."
 bel_dnc.1305.t:0 "The Estimates Are Carried Without a Vote"
 bel_dnc.1305.d:0 "The financial year opens with no budget voted, and the Treasury pays anyway. Contractors are settled, the fortress works continue, and a professor at Ghent publishes eleven pages proving it is unlawful. The arrears are paid before the pamphlet is bound."
 bel_dnc.1305.a:0 "Pay the arrears and say nothing."
 bel_dnc.1305.b:0 "Answer the professor in the Moniteur."
 bel_dnc.1308.t:0 "A Meeting at Charleroi"
 bel_dnc.1308.d:0 "Deputies with no Chamber to sit in have found a substitute. Eleven of them share a platform in Charleroi before six thousand people, and the speeches are far better than anything the Chamber ever heard, because the gallery is now the whole town and nobody has to be parliamentary."
 bel_dnc.1308.a:0 "Send the gendarmerie."
 bel_dnc.1308.b:0 "Let them talk themselves out."
 bel_dnc.1308.c:0 "Recall the Chamber for a short session."
 bel_dnc.1310.t:0 "A Compliment From Berlin"
 bel_dnc.1310.d:0 "The German press discovers that Belgium is admirably governed and says so for a fortnight. A staff officer is decorated in Berlin. In London the compliment is read carefully, filed, and mentioned to the French, and the guarantee of 1839 becomes a document with a favourite among its signatories."
 bel_dnc.1310.a:0 "Accept the compliment."
 bel_dnc.1310.b:0 "Send an officer to London the same month."
 bel_dnc.1315.t:0 "The King's Health"
 bel_dnc.1315.d:0 "Leopold is seventy-four and the bulletins have begun to be edited before they are printed. At Laeken the household is instructed to prepare nothing and prepares everything. The nephew is asked to be available in Brussels through the autumn, and asks, mildly, what for."
 bel_dnc.1315.a:0 "Prepare the succession openly."
 bel_dnc.1315.b:0 "Prepare it and tell the King nothing."
 bel_dnc.1320.t:0 "Albert Decides What He Has Inherited"
 bel_dnc.1320.d:0 "The new King has read the files. Ministers answer to him, officers swear to him, the estimates are his to sign, and none of it is written anywhere in the constitution he swore to. He can keep the office his uncle built, hollow it out slowly, or hand it back to the Chamber in one speech."
 bel_dnc.1320.a:0 "Keep the office. It works."
 bel_dnc.1320.b:0 "Keep it, and use it more carefully."
 bel_dnc.1320.c:0 "Give the Chamber back its estimates."
 bel_dnc.1330.t:0 "The Crown That Governs"
 bel_dnc.1330.d:0 "The decade closes on a kingdom that is solvent, fortified, quiet and admired by governments that admire quiet. Its Chamber meets when called. Its colony answers to one man. Everything holds, and everything holds because of one family, which is a thing nobody has yet had to test."
 bel_dnc.1330.a:0 "Belgium is governed."
 bel_dnc.1330.b:0 "It will hold as long as he does."
 BELDNC_n_no_empire_for_a_small_state:0 "No Empire for a Small State"
 BELDNC_n_no_empire_for_a_small_state_desc:0 "A kingdom of nine provinces cannot govern a possession eighty times its size without becoming something else. We must let the estate stay the King's until somebody takes it from him, and buy a decade in which nobody in Europe has a grievance against us."
 BELDNC_n_the_estate_is_not_the_kingdoms:0 "The Estate Is Not the Kingdom's"
 BELDNC_n_the_estate_is_not_the_kingdoms_desc:0 "Every accusation made against the Free State is being entered against Belgium. We must resolve in the plainest words that it is a private venture of the sovereign and that this kingdom answers for none of it, and let the King be furious."
 BELDNC_n_the_right_of_preference_surrendered:0 "The Right of Preference Surrendered"
 BELDNC_n_the_right_of_preference_surrendered_desc:0 "Belgium holds an option on the basin written into a loan the King could not repay, and every chancellery knows it. We must surrender it in writing, and remove the one document that makes the accusations ours as well."
 BELDNC_n_let_the_powers_divide_it:0 "Let the Powers Divide It"
 BELDNC_n_let_the_powers_divide_it_desc:0 "The basin will be settled by somebody, and it can be settled in a room or on a river. We must tell the signatories of Berlin that we will not take it and will not oppose their arrangement, and ask only that it be made at a table."
 BELDNC_n_the_basin_passes_to_others:0 "The Basin Passes to Others"
 BELDNC_n_the_basin_passes_to_others_desc:0 "The estate is carved up by men who need justify themselves to no Belgian committee. We must let the money in that river be earned elsewhere, and take back a file of photographs that will never again carry our name."
 BELDNC_n_nothing_left_to_deny:0 "Nothing Left to Deny"
 BELDNC_n_nothing_left_to_deny_desc:0 "For years we answered the same question with the same three sentences, and today the question has no subject. We must wind up the department that existed to answer it, and let Brussels stop being an address worth writing from."
 BELDNC_n_a_kingdom_of_nine_provinces_only:0 "A Kingdom of Nine Provinces Only"
 BELDNC_n_a_kingdom_of_nine_provinces_only_desc:0 "Every ministry that was to have run a colony must fold back into the ones that run a country. We must bring the clerks home, let the shipping subsidies lapse, and be exactly as large as the territory we can see from a train."
 BELDNC_n_the_engineers_full_estimate:0 "The Engineer's Full Estimate"
 BELDNC_n_the_engineers_full_estimate_desc:0 "Brialmont submitted a design and we voted a cheaper one, and every engineer knows which would be standing when it mattered. We must take the estimate out of the drawer and vote it whole, at his figure, with the armour he specified and the depths he asked for."
 BELDNC_n_the_frontier_is_the_meuse:0 "The Frontier Is the Meuse"
 BELDNC_n_the_frontier_is_the_meuse_desc:0 "We hold the river or we hold nothing. We must complete Liege and Namur to the engineer's design, garrison them at strength, supply them to stand alone, and tell the field army its place is behind them."
 BELDNC_n_the_redoubt_is_the_country:0 "The Redoubt Is the Country"
 BELDNC_n_the_redoubt_is_the_country_desc:0 "The other school says the frontier cannot be held and should not be attempted. We must withdraw into Antwerp instead, open the Scheldt to a guarantor's fleet, and concede the provinces in advance to save the state."
 BELDNC_n_steel_where_the_chamber_voted_sand:0 "Steel Where the Chamber Voted Sand"
 BELDNC_n_steel_where_the_chamber_voted_sand_desc:0 "Our commissioners approved a cheap mix and every officer who has watched a cupola tested knows what it does under a heavy shell. We must tear it out of the specification, order the armour the engineer asked for, and retire the men who signed the old standard."
 BELDNC_n_the_works_are_never_finished:0 "The Works Are Never Finished"
 BELDNC_n_the_works_are_never_finished_desc:0 "The guns that will be fired at our forts are being designed while the concrete sets. We must keep a standing corps of engineers and an annual programme, and never once report the position complete."
 BELDNC_n_the_lottery_is_a_tax_on_the_poor:0 "The Lottery Is a Tax on the Poor"
 BELDNC_n_the_lottery_is_a_tax_on_the_poor_desc:0 "A young man draws a bad number and his family buys a substitute, or it cannot and he goes. We must say in the Chamber that our army is composed of the sons of people who could not afford to keep them at home, and then abolish the draw."
 BELDNC_n_the_classes_are_called_early:0 "The Classes Are Called Early"
 BELDNC_n_the_classes_are_called_early_desc:0 "The votes for personal service will never be easier to find than now. We must carry it at once - one son from every house, no substitutes, no exemption worth buying - and give the plans the men they have always assumed."
 BELDNC_n_the_garde_civique_in_the_provinces:0 "The Garde Civique in the Provinces"
 BELDNC_n_the_garde_civique_in_the_provinces_desc:0 "Every battalion of regulars standing on a bridge is a battalion not in the field. We must put a provincial establishment behind the classes of the line, drilling on Sundays and knowing every lane in its own arrondissement, to hold the bridges and guard the depots."
 BELDNC_n_officers_who_came_from_the_ranks:0 "Officers Who Came from the Ranks"
 BELDNC_n_officers_who_came_from_the_ranks_desc:0 "Our army is led by the sons of one class and manned by the sons of another. We must open commissions to men who enlisted as privates, examine them in either language, and promote on the report of officers who watched them work."
 BELDNC_n_the_staff_names_the_danger:0 "The Staff Names the Danger"
 BELDNC_n_the_staff_names_the_danger_desc:0 "Three appreciations lie on the table and only one of them describes roads the author has walked. We must instruct the staff to name the guarantor it means, without regard to whose feelings are involved."
 BELDNC_n_the_appreciation_is_read_in_the_chamber:0 "The Appreciation Is Read in the Chamber"
 BELDNC_n_the_appreciation_is_read_in_the_chamber_desc:0 "Every general staff in Europe writes this in private and no small state has ever said it aloud. We must read the paragraphs into the record with the galleries full, and make the guarantor we name explain itself in its own parliament."
 BELDNC_n_the_appreciation_goes_to_the_five:0 "The Appreciation Goes to the Five"
 BELDNC_n_the_appreciation_goes_to_the_five_desc:0 "Naming one guarantor in public is an accusation; naming all five is a memorandum. We must deliver the same conclusion through five legations in identical terms on the same afternoon, and let each read the paragraph written for it."
 BELDNC_n_no_conversations_with_anybody:0 "No Conversations with Anybody"
 BELDNC_n_no_conversations_with_anybody_desc:0 "A neutral that has made arrangements is a belligerent not yet attacked, and the paper proving it is worth a province to whoever finds it. We must end the staff talks, destroy the records, and hold no plan jointly with anybody."
 BELDNC_n_the_school_of_the_small_state:0 "The School of the Small State"
 BELDNC_n_the_school_of_the_small_state_desc:0 "Our officers are taught grand manoeuvres in theatres we can never reach. We must teach them the war we shall actually fight - a frontier crossed without warning, a fortress line holding alone, a guarantee arriving late - and narrow the syllabus to that."
 BELDNC_n_impossible_to_walk_through:0 "Impossible to Walk Through"
 BELDNC_n_impossible_to_walk_through_desc:0 "We shall never be strong and we can be expensive: a fortnight of somebody's timetable, a corps he did not budget for, a reason to go round. We must finish the works, call the classes and tell the guarantors what we think of them."
 BEL_n_the_house_hears_it_first_tt:0 "§GThe Chamber is told before the legations are,§! and the prerogative loses a little of what it had gained."
 BEL_n_the_ministry_decides_alone_tt:0 "§YThe Chamber has not been opened on this question,§! and the ministry settles it without a debate."
 BEL_n_the_question_was_already_open_tt:0 "§GThe estate was already before the House:§! the resolution passes onto a floor that was expecting it."
 BEL_n_the_question_opens_by_being_closed_tt:0 "§YNobody had asked the question yet,§! and answering it is what puts the colony on the order paper."
 BEL_n_the_motion_was_already_moved_tt:0 "§GRenunciation has already been moved once:§! the surrender of the option is a second reading, not a shock."
 BEL_n_the_motion_is_moved_now_tt:0 "§YNothing had been renounced before today,§! and the House hears it for the first time from the despatch box."
 BEL_n_the_estate_still_stands_tt:0 "§YThe Free State still exists:§! the invitation is addressed to powers who will have to take it from a living owner."
 BEL_n_the_estate_is_already_gone_tt:0 "§GThe estate has already passed:§! the note merely ratifies an arrangement the powers have made."
 BEL_n_a_dead_king_cannot_object_tt:0 "§GLeopold is dead:§! the partition disposes of an inheritance rather than of a reigning sovereign's property."
 BEL_n_the_king_is_stripped_alive_tt:0 "§RThe King is alive and watching:§! the estate is taken from him by his own ministers, and the palace answers."
 BEL_n_the_file_is_closed_on_a_loss_tt:0 "§GThe basin is gone and the file admits it:§! the reform associations have nothing left to campaign about."
 BEL_n_the_file_is_closed_on_nothing_tt:0 "§YThere is no record of a loss to close the file on,§! and the associations suspect a manoeuvre."
 BEL_n_a_small_state_on_purpose_tt:0 "§GSmallness is the policy:§! the retrenchment reads as a decision rather than as a defeat."
 BEL_n_a_small_state_by_accident_tt:0 "§YThe kingdom is merely small,§! and nobody has explained why that should be a virtue."
 BEL_n_the_estimate_was_already_on_the_table_tt:0 "§GThe estimates had already been read:§! the engineer is voted his own figure without a second inquiry."
 BEL_n_the_estimate_goes_on_the_table_now_tt:0 "§YThe estimates reach the House for the first time,§! and the fortified position is opened from nothing."
 BEL_n_the_works_face_the_named_guarantor_tt:0 "§GA guarantor has been named as the danger:§! the works are laid out against a specific army."
 BEL_n_the_works_face_a_direction_tt:0 "§YNo guarantor has been named:§! the works face east because the roads do, and for no stated reason."
 BEL_n_the_redoubt_looks_to_the_sea_tt:0 "§GBritain exists and has a fleet:§! the redoubt is built assuming somebody will come up the Scheldt."
 BEL_n_the_redoubt_looks_at_nobody_tt:0 "§YThere is no fleet to come up the Scheldt,§! and the redoubt is a fortress with an empty river behind it."
 BEL_n_the_commissioners_mix_is_torn_out_tt:0 "§RThe cheap concrete is torn out of finished works,§! at a price in time and temper nobody wants to state."
 BEL_n_the_standard_was_already_steel_tt:0 "§GThe armoured standard was already in force,§! and the specification only has to be confirmed."
 BEL_n_namur_follows_liege_tt:0 "§GThe Meuse was fortified first:§! the permanent programme carries the works on to Namur."
 BEL_n_the_meuse_follows_antwerp_tt:0 "§GAntwerp was fortified first:§! the permanent programme reaches back to the river it skipped."
 BEL_n_the_house_has_just_voted_the_other_way_tt:0 "§RThe Chamber has just voted to keep the lottery,§! and the ministry is attacking its own majority."
 BEL_n_the_house_has_not_voted_yet_tt:0 "§GNo vote has been taken on the lottery,§! and the ground is open."
 BEL_n_the_classes_answer_for_the_first_time_tt:0 "§GPersonal service is carried:§! the class of the year answers in full for the first time in Belgian history."
 BEL_n_the_classes_already_answer_tt:0 "§GThe classes were already being called:§! the law confirms a practice and removes its last exemptions."
 BEL_n_the_provinces_drill_in_french_tt:0 "§RThe garde civique drills in French:§! half the provinces are commanded in a language they do not use."
 BEL_n_the_provinces_drill_in_their_own_tongue_tt:0 "§GThe garde civique drills in the tongue of its own arrondissement,§! and the Flemish leagues say so."
 BEL_n_the_barrier_comes_down_with_the_commissions_tt:0 "§GThe language barrier is removed:§! commissions open to the ranks cannot be examined in one tongue only."
 BEL_n_the_commissions_open_anyway_tt:0 "§GThe barrier was already down,§! and the commissions open onto an army that can already be spoken to."
 BEL_n_the_staff_had_already_written_it_tt:0 "§GThe appreciations existed:§! the staff is only being told to sign the one it believes."
 BEL_n_the_staff_writes_it_now_tt:0 "§YNo appreciation had been made,§! and three of them have to be written before one can be chosen."
 BEL_n_berlin_reads_the_debate_tt:0 "§RBerlin reads the debate in translation by Friday,§! and the ambassador asks for an appointment."
 BEL_n_nobody_reads_the_debate_tt:0 "§YThere is no German government to be offended,§! and the speech goes into the record unread."
 BEL_n_the_five_are_told_together_tt:0 "§GAll five guarantors are told on the same afternoon,§! and none of them can complain of being singled out."
 BEL_n_there_are_not_five_left_tt:0 "§YThere are no longer five guarantors to inform,§! and the identical notes go to whoever remains."
 BEL_n_the_records_are_burned_tt:0 "§RThe records of the staff conversations are destroyed,§! and the officers who kept them are not thanked."
 BEL_n_there_were_no_records_to_burn_tt:0 "§GThere were never any conversations,§! and the declaration costs the kingdom nothing but a paragraph."
 BEL_n_the_position_is_complete_tt:0 "§GThe fortified position is complete:§! the doctrine is written around works that actually exist."
 BEL_n_the_position_is_not_complete_tt:0 "§YThe works are unfinished:§! the doctrine assumes concrete the kingdom has not yet poured."
 BEL_n_armed_and_it_said_why_tt:0 "§RThe danger was named in public:§! the armed neutrality is understood everywhere as pointing one way."
 BEL_n_armed_and_it_said_nothing_tt:0 "§GNo guarantor was named aloud:§! the kingdom is armed and nobody can prove against whom."
 BEL_n_a_kingdom_with_nothing_to_answer_for_tt:0 "§GThe basin is gone:§! there is no colony, no scandal and no lever anybody can use on us."
 BEL_n_a_kingdom_still_holding_the_basin_tt:0 "§RThe kingdom still holds the basin:§! the armed neutrality is built on a possession somebody may want."
 BEL_n_1400a_tt:0 "§GThe refusal is announced from the despatch box,§! and the Chamber owns it."
 BEL_n_1400b_tt:0 "§YThe refusal goes out through the legations,§! and the country reads about it in the foreign papers."
 BEL_n_1401a_tt:0 "§GThe powers answer with one voice§! and are visibly relieved to be handed a problem instead of a rival."
 BEL_n_1401b_tt:0 "§RThe powers cannot agree who takes what,§! and the quarrel is conducted a great deal nearer to us than to the river."
 BEL_n_1402a_tt:0 "§GThe estate papers are burned,§! and what was done in the rubber districts stops being anybody's evidence."
 BEL_n_1402b_tt:0 "§RThe estate papers are published entire,§! and the new owners find their inheritance described in detail."
 BEL_n_1403a_tt:0 "§GThe armoured standard is adopted:§! cupolas of hardened steel, at the engineer's price and the engineer's depth."
 BEL_n_1403b_tt:0 "§YThe design is trimmed after all,§! and the works are built to a figure rather than to a threat."
 BEL_n_1404a_tt:0 "§GNo exemptions are sold:§! the notables' sons are called with everybody else's, and the plural vote loses ground."
 BEL_n_1404b_tt:0 "§YExemptions survive for those who can pay for them,§! and the barracks fill with one half of the country."
 BEL_n_1405a_tt:0 "§RNot a word is withdrawn,§! and the ambassador is invited to read the treaty he is complaining about."
 BEL_n_1405b_tt:0 "§GA form of words is found,§! and both governments agree in public that nobody said anything."
 BEL_n_1406_strong_tt:0 "§GThe position is complete and armoured:§! the verdict of the decade is that the works would hold."
 BEL_n_1406_thin_tt:0 "§RThe position is thin:§! the verdict of the decade is that the kingdom armed a neutrality it cannot cover."
 BEL_n_1406a_tt:0 "§GThe kingdom owes nobody and holds nothing:§! what is left is the concrete and the classes that man it."
 BEL_n_tb_the_school_of_the_small_state:0 "The School of the Small State"
 BEL_n_tb_impossible_to_walk_through:0 "Impossible to Walk Through"
 BEL_n_the_kingdom_disowns_the_estate:0 "Belgium disowns the King's estate in Africa"
 BEL_n_the_kingdom_invites_a_partition:0 "Belgium invites the powers to divide the Congo basin"
 BEL_n_the_basin_is_divided_without_us:0 "The Congo basin is divided without Belgium"
 BEL_n_the_kingdom_fortifies_the_meuse:0 "Belgium fortifies the crossings of the Meuse"
 BEL_n_the_staff_writes_down_a_guarantor:0 "The Belgian staff names a guarantor as the danger"
 BEL_n_the_kingdom_names_a_guarantor_in_public:0 "Belgium names a guarantor as the danger in open session"
 BEL_n_an_armed_neutral_that_named_its_danger:0 "An armed neutral that has said whom it fears"
 BEL_n_the_powers_quarrel_over_the_basin:0 "The powers quarrel over the Congo basin"
 BEL_n_the_kingdom_publishes_the_estate_papers:0 "Belgium publishes the papers of the Free State"
 BEL_n_the_kingdom_will_not_withdraw_a_word:0 "Belgium refuses to withdraw its appreciation"
 BEL_n_beernaert_at_the_hague:0 "Beernaert at the Hague"
 BEL_n_brialmont_gets_his_estimate:0 "Brialmont Gets His Estimate"
 BEL_n_brialmont_the_school:0 "Brialmont and the Permanent Works"
 BEL_n_gillain_at_the_staff:0 "Gillain at the Staff"
 BEL_n_jacques_of_the_provinces:0 "Jacques of the Provinces"
 BEL_n_moranville_names_it:0 "Moranville Names It"
 BEL_n_the_small_state:0 "A State the Size of Its Own Map"
 BEL_n_the_small_state_desc:0 "The kingdom has decided that it is small and intends to stay that way."
 BEL_n_the_kingdom_is_not_answerable:0 "The Kingdom Is Not Answerable"
 BEL_n_the_kingdom_is_not_answerable_desc:0 "A resolution of the Chamber separates the state from the sovereign's private venture."
 BEL_n_no_option_on_africa:0 "No Option on Africa"
 BEL_n_no_option_on_africa_desc:0 "The right of preference is surrendered in writing, and with it every claim anyone could make on us."
 BEL_n_the_invitation_to_the_signatories:0 "The Invitation to the Signatories"
 BEL_n_the_invitation_to_the_signatories_desc:0 "The powers have been asked to settle the basin among themselves, and are grateful for the room."
 BEL_n_the_hands_that_stay_clean:0 "The Hands That Stay Clean"
 BEL_n_the_hands_that_stay_clean_desc:0 "Nothing was gained in Africa, and nothing done there can be laid at this door."
 BEL_n_nothing_left_to_deny:0 "Nothing Left to Deny"
 BEL_n_nothing_left_to_deny_desc:0 "The question has no subject, and the ministry has stopped rehearsing an answer to it."
 BEL_n_nine_provinces_and_no_more:0 "Nine Provinces and No More"
 BEL_n_nine_provinces_and_no_more_desc:0 "A state exactly as large as the country it governs, and administered accordingly."
 BEL_n_the_estimate_voted_whole:0 "The Estimate Voted Whole"
 BEL_n_the_estimate_voted_whole_desc:0 "The engineer was given the figure he wrote, and the works are being built to it."
 BEL_n_the_meuse_is_the_frontier:0 "The Meuse Is the Frontier"
 BEL_n_the_meuse_is_the_frontier_desc:0 "The crossings are held, and an army that wants to pass must pay for every one of them."
 BEL_n_the_redoubt_is_the_country:0 "The Redoubt Is the Country"
 BEL_n_the_redoubt_is_the_country_desc:0 "The state survives inside Antwerp with a river behind it, whatever happens to the provinces."
 BEL_n_the_armour_of_the_cupolas:0 "The Armour of the Cupolas"
 BEL_n_the_armour_of_the_cupolas_desc:0 "Hardened steel where the commissioners wanted sand, at the price of a slower programme."
 BEL_n_the_permanent_works:0 "The Permanent Works"
 BEL_n_the_permanent_works_desc:0 "A standing establishment of engineers, and a position that is never reported as finished."
 BEL_n_the_substitute_is_indefensible:0 "The Substitute Is Indefensible"
 BEL_n_the_substitute_is_indefensible_desc:0 "The ministry has said in open session that the army is manned by the people who could not buy out."
 BEL_n_the_class_of_the_year:0 "The Class of the Year"
 BEL_n_the_class_of_the_year_desc:0 "One son from every house, called in full, with nothing left to purchase."
 BEL_n_the_garde_civique:0 "The Garde Civique"
 BEL_n_the_garde_civique_desc:0 "A provincial establishment that will hold a bridge and never see a manoeuvre."
 BEL_n_the_commission_from_the_ranks:0 "The Commission from the Ranks"
 BEL_n_the_commission_from_the_ranks_desc:0 "Officers examined in either language and promoted on what they were seen to do."
 BEL_n_the_appreciation_of_the_staff:0 "The Appreciation of the Staff"
 BEL_n_the_appreciation_of_the_staff_desc:0 "Three papers on three neighbours, and one of them is not an exercise."
 BEL_n_the_danger_named_aloud:0 "The Danger Named Aloud"
 BEL_n_the_danger_named_aloud_desc:0 "A small state has said in public what everybody else writes in a locked file."
 BEL_n_the_danger_named_quietly:0 "The Danger Named Quietly"
 BEL_n_the_danger_named_quietly_desc:0 "Five identical notes, one intended reader, and nothing that can be quoted against us."
 BEL_n_no_conversations_with_anybody:0 "No Conversations with Anybody"
 BEL_n_no_conversations_with_anybody_desc:0 "No joint plan exists, and no document proving one can be found in a captured safe."
 BEL_n_the_school_of_the_small_state:0 "The School of the Small State"
 BEL_n_the_school_of_the_small_state_desc:0 "A doctrine for an army that will never attack and cannot afford to lose a division."
 BEL_n_impossible_to_walk_through:0 "Impossible to Walk Through"
 BEL_n_impossible_to_walk_through_desc:0 "Whether the guarantee is honoured is somebody else's decision. The price of the march is ours."
 BEL_n_the_powers_are_grateful:0 "The Powers Are Grateful"
 BEL_n_the_powers_are_grateful_desc:0 "A problem was handed over instead of contested, and every chancellery has noticed."
 BEL_n_the_trimmed_design:0 "The Trimmed Design"
 BEL_n_the_trimmed_design_desc:0 "The works were built to a figure rather than to a threat, and the engineers said so at the time."
 BEL_n_the_notables_pay_too:0 "The Notables Pay Too"
 BEL_n_the_notables_pay_too_desc:0 "No exemption survives that money could buy, and the right has not forgiven it."
 BEL_n_the_position_that_holds:0 "The Position That Holds"
 BEL_n_the_position_that_holds_desc:0 "Complete, armoured, and manned by classes that answered when they were called."
 bel_dnc.1400.t:0 "The Kingdom Declines an Empire"
 bel_dnc.1400.d:0 "The decision is taken, and the only question left is who is told first. Announced in the Chamber it becomes the country's policy and the country's responsibility, debated for a week and owned by everybody who voted for it. Sent through the legations it becomes a fait accompli that the Chamber reads about in the Times, which is quicker, quieter, and rather harder to reverse."
 bel_dnc.1400.a:0 "Say it from the despatch box."
 bel_dnc.1400.b:0 "Say it to the legations and let the papers find out."
 bel_dnc.1401.t:0 "The Signatories Reply"
 bel_dnc.1401.d:0 "The note has been read in five capitals. It is an extraordinary document: a European state announcing that it does not want a territory eighty times its own size and inviting others to take it. Some of the replies are gracious. All of them are careful. Whether the powers can agree what to do with the offer is a different question, and the answer to it will be arrived at somewhere considerably closer to Brussels than to the Congo."
 bel_dnc.1401.a:0 "They have agreed among themselves."
 bel_dnc.1401.b:0 "They have not, and they are arguing here."
 bel_dnc.1402.t:0 "The Papers of the Estate"
 bel_dnc.1402.d:0 "The basin has passed to others, and what remains in Brussels is thirty years of correspondence: the concession contracts, the tonnage returns, the district reports that were never meant to be read together, and the photographs. The new owners would prefer the file destroyed. So, quite openly, would several people in this building. The reform associations would prefer it printed."
 bel_dnc.1402.a:0 "Burn it. It concerns a state that no longer exists."
 bel_dnc.1402.b:0 "Print it entire and let the new owners explain."
 bel_dnc.1403.t:0 "Brialmont's Memorandum"
 bel_dnc.1403.d:0 "The engineer has sent the ministry a memorandum of eleven pages, which is ten pages longer than anything he has previously written to a politician. It concerns the cupolas. The commissioners' mix was approved on price; he has had a section of it fired on at Brasschaat and encloses the photographs. He asks for hardened steel, at his figure, and offers his resignation in the same paragraph."
 bel_dnc.1403.a:0 "He gets the steel and the figure."
 bel_dnc.1403.b:0 "He gets neither, and keeps his post."
 bel_dnc.1404.t:0 "The Exemptions"
 bel_dnc.1404.d:0 "Personal service is carried, and within a month the ministry is buried in applications: only sons, students of theology, young men indispensable to a family business, and a remarkable number of nephews. Every one of them has a sponsor in the Chamber. Granting them restores the old army under a new name. Refusing them means the sons of the right go into the same barracks as their tenants."
 bel_dnc.1404.a:0 "No exemption that money can reach."
 bel_dnc.1404.b:0 "Grant them. We still have to govern with these men."
 bel_dnc.1405.t:0 "The Ambassador Asks for an Appointment"
 bel_dnc.1405.d:0 "The debate was translated in Berlin within four days. The ambassador arrives without an appointment, which is itself a message, and reads out the paragraph in which a Belgian minister described the roads west of the Meuse and named the army that would use them. He would like it withdrawn. He does not say what happens if it is not, and he does not have to."
 bel_dnc.1405.a:0 "Nothing is withdrawn. Show him the treaty."
 bel_dnc.1405.b:0 "Find a form of words that lets us both stop."
 bel_dnc.1406.t:0 "What the Decade Bought"
 bel_dnc.1406.d:0 "Ten years, no colony, no alliance, no faction and no promises given to anybody. What the kingdom has instead is a fortified position, a class of conscripts that answers when it is called, and a staff that has written down what it actually expects. Nobody in Europe owes Belgium anything it did not sign for in 1839. The difference is that walking through is no longer free."
 bel_dnc.1406.a:0 "Then that is what we are."
 BELDNC_air_the_company_of_aerostiers:0 "The Company of Aerostiers"
 BELDNC_air_the_company_of_aerostiers_desc:0 "Antwerp keeps a company of balloon workers, a gas plant and a winch, and it is the whole of our flight. We must build it up into something that can tell a gunner where his shells are falling, and stop calling it an engineering detachment."
 BELDNC_air_the_antwerp_devil:0 "The Antwerp Devil"
 BELDNC_air_the_antwerp_devil_desc:0 "Olieslagers is the most famous Belgian in the air and answerable to nobody in this ministry. We must bring him and his machine inside the service before somebody else pays him to fly elsewhere."
 BELDNC_air_a_neutral_and_its_sky:0 "A Neutral and Its Sky"
 BELDNC_air_a_neutral_and_its_sky_desc:0 "The treaty says nothing about the air because there was nothing in it when the treaty was signed. We must put the question to our jurists - whether machines that cross a frontier in an hour arm us or threaten our neighbours - and write the doctrine on their answer."
 BELDNC_air_the_machines_come_from_france:0 "The Machines Come From France"
 BELDNC_air_the_machines_come_from_france_desc:0 "We build locomotives, rifles and armour plate, and every aeroplane the army wants arrives from Farman or Bleriot in crates. We must order them in numbers and train the fitters who assemble them, and admit that the design and the spare are French."
 BELDNC_air_the_meeting_at_kiewit:0 "The Meeting at Kiewit"
 BELDNC_air_the_meeting_at_kiewit_desc:0 "The heath at Kiewit is flat, empty and an hour from Hasselt, and for a week it holds more Belgians than the town does. We must back the meeting, let the Aero-Club write the first brevets in the kingdom, and take the credit."
 BELDNC_air_the_school_at_brasschaat:0 "The School at Brasschaat"
 BELDNC_air_the_school_at_brasschaat_desc:0 "The artillery camp north of Antwerp has range, level ground and a fence, which is more than any civilian field offers. We must second officers to it, have them taught by men holding club licences, and define the qualification we give them back."
 BELDNC_air_the_note_to_the_guarantors:0 "The Note to the Guarantors"
 BELDNC_air_the_note_to_the_guarantors_desc:0 "Machines at Brasschaat will be noticed and the notice will be hostile unless we speak first. We must tell London, Paris, Berlin and Vienna in the same words on the same day what they are for, and read carefully whichever reply asks how many."
 BELDNC_air_the_licence_to_build:0 "The Licence to Build"
 BELDNC_air_the_licence_to_build_desc:0 "A machine broken in this kingdom must at present be shipped back to France to be mended. We must license a shed at Antwerp to build the French biplane to French drawings, with our own carpenters on the wings and the ribs."
 BELDNC_air_the_pilots_brevet:0 "The Pilot's Brevet"
 BELDNC_air_the_pilots_brevet_desc:0 "An officer who wants to fly takes leave, pays a club and comes back with a card signed by sportsmen. We must decide whether that card is a military qualification, whether we pay for it, and what we owe a lieutenant who breaks his neck in a machine he bought himself."
 BELDNC_air_the_compagnie_des_aviateurs:0 "The Compagnie des Aviateurs"
 BELDNC_air_the_compagnie_des_aviateurs_desc:0 "Aviation exists in this kingdom in the newspapers and in nobody's establishment. We must take the flyers out of the engineers and give them a captain, a depot and a place in the order of battle, and write them into a law."
 BELDNC_air_the_machine_that_sees:0 "The Machine That Sees"
 BELDNC_air_the_machine_that_sees_desc:0 "A balloon sees as far as its cable allows, and a machine over the valley sees the roads behind the Meuse and the hour the columns arrive. We must put observers up and teach the fortress gunners to read what they bring down."
 BELDNC_air_the_river_from_above:0 "The River From Above"
 BELDNC_air_the_river_from_above_desc:0 "Our basin is held by posts a fortnight apart on a river that bends without end. We must put machines on floats where a steamer takes a week, and let every post know it may be looked at without warning."
 BELDNC_air_the_sheds_behind_the_redoubt:0 "The Sheds Behind the Redoubt"
 BELDNC_air_the_sheds_behind_the_redoubt_desc:0 "Machines need level ground, a shed that keeps the frost off the fabric and a petrol store that is not in the same building. We must lay the fields out inside the Antwerp position and behind the Meuse, where a company falling back has somewhere to come down."
 BELDNC_air_an_arm_of_our_own:0 "An Arm of Our Own"
 BELDNC_air_an_arm_of_our_own_desc:0 "A neutral asks only that no army cross it uncounted. We must have four squadrons, a school, a depot and a repair shed on a line in the estimates that returns every year without a debate."
 BEL_air_aerostiers_neutral_tt:0 "The armed neutrality takes the balloon company seriously: §Ythe winch, the gas and the observers are put on the fortress establishment§!."
 BEL_air_aerostiers_crown_tt:0 "The King finds the balloons interesting, asks for an ascent at Laeken, and pays for it out of the estate. §RThe Chamber reads about it in the papers§!."
 BEL_air_aerostiers_cartel_tt:0 "The Chamber asks what a company of balloon workers costs and what it is for. §RBoth answers are given in full, and the credit is voted down to the franc§!."
 BEL_air_aerostiers_settlement_tt:0 "The ministry keeps the detachment because abolishing it would be noticed abroad. §YNothing more is asked of it§!."
 BEL_air_devil_crown_tt:0 "The King receives Olieslagers at the palace and the photograph goes round the world. §RIt is the Crown that is seen flying, not the kingdom§!."
 BEL_air_devil_neutral_tt:0 "The army asks the sportsman to teach its officers, and he agrees for nothing. §GThe cheapest flying school in Europe§!."
 BEL_air_devil_settlement_tt:0 "A Catholic ministry congratulates a hero it did not pay for and changes no estimate. §YThe cheapest patriotism there is§!."
 BEL_air_devil_cartel_tt:0 "A workman's son from Antwerp is the most famous man in Belgium. §GThe Chamber notices which benches he is claimed by§!."
 BEL_air_sky_neutral_tt:0 "The doctrine is settled first and the machines are bought afterwards: §Ga neutral owns the air above it and will say so before anybody asks§!."
 BEL_air_sky_cartel_tt:0 "The Chamber debates the sky for three sittings and votes a declaration that binds the government in advance. §RThe ministry loses the right to improvise§!."
 BEL_air_sky_crown_tt:0 "The declaration is issued over the King's signature without a debate. §RIt reads abroad as the opinion of one man§!."
 BEL_air_sky_settlement_tt:0 "The note is drafted so carefully that it commits Belgium to nothing at all. §YExactly what was wanted§!."
 BEL_air_france_settlement_tt:0 "Buying abroad keeps the estimates small and the guarantors calm. §GNo Belgian works is asked to build a weapon§!."
 BEL_air_france_neutral_tt:0 "Every machine in the kingdom was made by one of its guarantors, and the staff knows exactly what that is worth in a crisis. §RIt is not what armed neutrality was supposed to mean§!."
 BEL_air_france_cartel_tt:0 "The Chamber asks why Belgian workmen are not building them and is told there is no works that could. §RThe answer is entered in the record§!."
 BEL_air_france_crown_tt:0 "The order is placed quickly and quietly by a ministry that answers to nobody about it. §YThe machines arrive first§!."
 BEL_air_kiewit_cartel_tt:0 "A public subscription, a public field and a public prize, and not one franc of it voted. §GThe Left claims the whole of it§!."
 BEL_air_kiewit_crown_tt:0 "The Crown lends its patronage and the prize is presented in the King's name. §RThe subscribers notice who is thanked§!."
 BEL_air_kiewit_neutral_tt:0 "The army sends observers to the meeting with notebooks and comes away with a list of men it wants. §GThe first recruiting the air service ever does§!."
 BEL_air_kiewit_settlement_tt:0 "The ministry sends a telegram of congratulation and no money at all. §YThe crowds do not appear to mind§!."
 BEL_air_mathieu_at_brasschaat_tt:0 "§YBaron Mathieu§! can now be appointed to the air command."
 BEL_air_school_neutral_tt:0 "The school is put on the permanent establishment with its own instructors, its own machines and its own budget line. §GFlying becomes a career and not a hobby§!."
 BEL_air_school_crown_tt:0 "The King takes an interest, visits twice, and the school gets what he asks for and nothing he does not. §RIts programme is set by a visitor§!."
 BEL_air_school_cartel_tt:0 "The credit passes the Chamber only after the minister has read out the cost of every machine and every burial. §RIt passes§!."
 BEL_air_school_settlement_tt:0 "A school of six officers is opened, which is enough to answer a question in the Chamber. §YIt is not enough for anything else§!."
 BEL_air_note_settlement_tt:0 "The whole point of the exercise: the guarantors are told, they are satisfied, and nothing further is required of anyone. §GThe question closes itself§!."
 BEL_air_note_neutral_tt:0 "Belgium states its air doctrine to the powers before it is asked to, in writing, and does not soften a word of it. §GA neutral that explains itself first is harder to accuse§!."
 BEL_air_note_crown_tt:0 "The note goes out under the King's hand and says rather more about the Congo than the powers had asked. §RThey read it as a bargain being offered§!."
 BEL_air_note_cartel_tt:0 "The text is laid before the Chamber before it is sent abroad, which is unheard of. §GThe powers receive a note that a parliament has already approved§!."
 BEL_air_licence_cartel_tt:0 "Belgian workmen build the machines and a Belgian firm answers for them in a Belgian court. §GThe Chamber votes this without a division§!."
 BEL_air_licence_neutral_tt:0 "A machine that can be mended in Antwerp is a machine that still flies in the third week of a war. §GThe staff cares about nothing else§!."
 BEL_air_licence_crown_tt:0 "The concession is granted to a company the palace recommends, on terms nobody outside it has seen. §RThe shed is built and the questions are not answered§!."
 BEL_air_licence_settlement_tt:0 "A licence is cheaper than a factory and offends no one. §YThe ministry signs it and moves on§!."
 BEL_air_brevet_with_the_school_tt:0 "The army has a school of its own, so the brevet becomes a military qualification with a course behind it. §GThe club is thanked and superseded§!."
 BEL_air_brevet_without_the_school_tt:0 "With no school of its own the army must recognise a card issued by sportsmen or have no pilots at all. §RIt recognises the card§!."
 BEL_air_brevet_neutral_tt:0 "A brevet, a pension for the widow and a place in the establishment. §GA neutral that asks men to fly must first admit that it is asking§!."
 BEL_air_brevet_cartel_tt:0 "The Chamber will not vote a service in which officers pay for their own training and their own funerals. §GThe state takes both charges§!."
 BEL_air_brevet_crown_tt:0 "The brevet is granted by royal warrant, which makes every pilot in Belgium a man the King has personally qualified. §RThe minister of war is not consulted§!."
 BEL_air_brevet_settlement_tt:0 "The card is recognised, quietly, in a circular nobody debates. §YIt costs nothing and settles the matter§!."
 BEL_air_gillain_at_the_company_tt:0 "§YCyriaque Gillain§! can now be appointed to the staff of the air service."
 BEL_air_compagnie_neutral_tt:0 "The company is formed at full establishment with machines, a depot and a war station. §GBelgium has an air service before it has an enemy§!."
 BEL_air_compagnie_crown_tt:0 "The company is formed by royal decree and its captain reports where the King prefers. §RThe Chamber is informed after the fact§!."
 BEL_air_compagnie_cartel_tt:0 "Every man, machine and franc is read into the record before the vote is taken. §GThe service that emerges belongs to the Chamber§!."
 BEL_air_compagnie_settlement_tt:0 "The company is formed on paper with the smallest establishment that can be called one. §YThe guarantors are satisfied and so is the treasury§!."
 BEL_air_the_gunners_are_taught_tt:0 "There are works above the Meuse for the observers to correct for, and the fortress artillery learns to shoot at what it cannot see. §GThe machine and the cupola are worth more together§!."
 BEL_air_nothing_to_observe_for_tt:0 "The observers are trained and there is not yet a fortress line for them to work with. §RThey are photographing their own country for practice§!."
 BEL_air_sees_neutral_tt:0 "Reconnaissance is the whole of the doctrine: see the column, count it, name it, and telegraph it to the powers the same day. §GBeing impossible to cross unseen is the entire defence§!."
 BEL_air_sees_crown_tt:0 "The photographs come to the palace before they come to the staff. §RThe King is the best informed man in Belgium and shares by preference§!."
 BEL_air_sees_cartel_tt:0 "The Chamber is told what the machines will look at and is promised, in writing, that it will not be its own citizens. §GThe promise is printed§!."
 BEL_air_sees_settlement_tt:0 "Observation offends nobody and is the one air work a neutral may admit to. §YThe ministry approves it gladly§!."
 BEL_air_the_colony_is_ours_to_fly_tt:0 "The colony belongs to the Chamber, so the river service is a public work with a report and a map. §GThe basin is inspected from the air by a government that can be voted out§!."
 BEL_air_the_kings_river_tt:0 "The machines fly for the estate and report to Brussels only what the estate chooses. §RA thousand miles of river seen by nobody the Chamber can question§!."
 BEL_air_no_river_to_fly_tt:0 "There is no Congo, so the floats are sold and the crews go back to the Meuse. §YThe kingdom has one river left and it is short§!."
 BEL_air_river_crown_tt:0 "The King funds the river machines himself, because this is exactly the sort of thing he finds interesting. §RThey are his aeroplanes over his river§!."
 BEL_air_river_cartel_tt:0 "The Chamber is asked to vote aeroplanes for Africa and asks first what a post that can be overflown will do differently. §GIt gets an answer before it votes§!."
 BEL_air_river_neutral_tt:0 "Every machine sent up the river is a machine not standing behind the Meuse, and the staff says so out loud. §RThe kingdom is armed in the wrong hemisphere§!."
 BEL_air_river_settlement_tt:0 "Two machines, one mechanic and a photographic section. §YEnough to be reported to Rome and to the Chamber in the same sentence§!."
 BEL_air_sheds_neutral_tt:0 "Fields behind the Antwerp position and behind the Meuse, laid out where the army intends to stand. §GThe air service is built into the plan of defence and not beside it§!."
 BEL_air_sheds_crown_tt:0 "The sheds go up quickly on ground the palace names, and the engineers do not ask why those fields. §RSpeed is bought with silence§!."
 BEL_air_sheds_cartel_tt:0 "Every field is voted separately and the sites are printed in the record. §GNobody can later say the country was not told where its aerodromes are§!."
 BEL_air_sheds_settlement_tt:0 "One field, well built, at the camp that already exists. §YIt will do until somebody insists otherwise§!."
 BEL_air_wielemans_at_the_depot_tt:0 "§YFelix Wielemans§! can now be appointed to the staff of the air service."
 BEL_air_arm_neutral_tt:0 "Squadrons, school, depot and a permanent line in the estimates that returns each year without debate. §GThe guarantee is no longer a signature; it is a service that reports what it sees§!."
 BEL_air_arm_crown_tt:0 "The air service is the King's favourite creation and is organised the way he likes it. §RA branch of the army that answers upward and outward at the same time§!."
 BEL_air_arm_cartel_tt:0 "The service is written into law with its establishment, its pay and its command fixed by statute. §GA minister may now be questioned about aeroplanes§!."
 BEL_air_arm_settlement_tt:0 "The smallest air arm in Europe, correctly organised, and never once the subject of a debate. §YIt exists, which was the requirement§!."
 BEL_air_the_balloon_company:0 "The Company of Aerostiers"
 BEL_air_the_balloon_company_desc:0 "A gas plant, a winch and a wicker basket on the end of a cable, run by engineers who are not aviators and do not wish to be. It sees far enough to correct a battery and no further."
 BEL_air_the_sky_of_a_neutral:0 "The Sky of a Neutral"
 BEL_air_the_sky_of_a_neutral_desc:0 "Belgium has told the powers, in writing, what its machines may do and where they may go. The doctrine is defensive because it was written to be read abroad, and the crews are trained inside it."
 BEL_air_machines_bought_abroad:0 "Machines Bought Abroad"
 BEL_air_machines_bought_abroad_desc:0 "The airframes arrive in crates from France with the drawings in the lid. The kingdom flies good machines it cannot repair, cannot copy and cannot order in a hurry."
 BEL_air_flight_by_subscription:0 "Flight by Subscription"
 BEL_air_flight_by_subscription_desc:0 "The meetings, the prizes and the brevets are paid for by clubs, newspapers and private men. Belgian flying is enthusiastic, well publicised and entirely outside the estimates."
 BEL_air_the_flying_school:0 "The School at Brasschaat"
 BEL_air_the_flying_school_desc:0 "An artillery camp with a fence, a shed and a syllabus. Officers arrive from their regiments and leave able to fly, which is more than the establishment yet knows what to do with."
 BEL_air_the_shed_at_antwerp:0 "The Shed at Antwerp"
 BEL_air_the_shed_at_antwerp_desc:0 "The French biplane built under licence by Belgian carpenters, with imported engines and a spares store on the Scheldt. It is not an aircraft industry, but it is a place where a broken machine stops being scrap."
 BEL_air_the_compagnie_des_aviateurs:0 "The Compagnie des Aviateurs"
 BEL_air_the_compagnie_des_aviateurs_desc:0 "Four dozen men, a captain, a depot and a place in the order of battle. The kingdom's flyers are soldiers now, with a pay scale, a war station and a column in the annual return."
 BEL_air_the_observers_report:0 "The Observer's Report"
 BEL_air_the_observers_report_desc:0 "Photographs, sketches and a bearing brought down from eight hundred metres and put in front of the fortress gunners before the column on the road has reached the next village."
 BEL_air_the_river_service:0 "The River Service"
 BEL_air_the_river_service_desc:0 "Machines on floats working from the reaches of the great river, reaching in a morning posts that a steamer takes a week to visit. The engines suffer, the crews suffer more, and the map is worth both."
 BEL_air_an_arm_of_our_own:0 "An Arm of Our Own"
 BEL_air_an_arm_of_our_own_desc:0 "Squadrons, a school, a depot and a repair shed, organised by a kingdom that decided its only asset was being impossible to walk through unobserved. It is small. It is entirely its own."
 BEL_air_the_line_that_returns:0 "The Line That Returns"
 BEL_air_the_line_that_returns_desc:0 "The air estimate is voted every year in the same words and is no longer debated. A service that need not argue for its existence can spend the winter learning instead."
 BELDNC_m_the_question_of_a_fleet:0 "The Question of a Fleet"
 BELDNC_m_the_question_of_a_fleet_desc:0 "Every few sessions a deputy asks whether a guaranteed neutral may own warships and the House adjourns rather than divide. We must put it in terms that require an answer, and take whatever answer the Chamber gives."
 BELDNC_m_the_packets_are_the_navy:0 "The Packets Are the Navy"
 BELDNC_m_the_packets_are_the_navy_desc:0 "Our mail boats to Dover are state property, state-crewed and the fastest thing under our flag. We must keep them, commission their officers and hold the right to requisition them in a week, and call that the navy."
 BELDNC_m_the_flotilla_on_the_river:0 "The Flotilla on the River"
 BELDNC_m_the_flotilla_on_the_river_desc:0 "Sixty craft on the upper river, worked by Belgians under a flag that is not quite ours, are the only fleet we actually operate. We must build the yards and the moorings to keep them running, and lay their ledgers before the Chamber."
 BELDNC_m_the_school_ship:0 "The School Ship"
 BELDNC_m_the_school_ship_desc:0 "Whatever we decide about hulls, the men have to exist before the hulls do. We must put a sailing brig at Ostend where boys of fifteen learn a chart, a sextant and a watch bill, and make the only Belgians who can take a ship to sea."
 BELDNC_m_liable_at_sea:0 "Liable at Sea"
 BELDNC_m_liable_at_sea_desc:0 "Trawlermen out of Heist, packet crews, lightermen on the Scheldt and pilots who know the banks by feel are the cheapest fleet there is. We must enter them on a roll, and write it in the language the coast reads."
 BELDNC_m_the_mouth_can_be_closed:0 "The Mouth Can Be Closed"
 BELDNC_m_the_mouth_can_be_closed_desc:0 "In any war the Dutch may lawfully shut the Scheldt by declaring for neither side, and Antwerp becomes an inland lake. We must build where that cannot reach us, which means the open coast and not the river."
 BELDNC_m_the_gunboats_for_the_river:0 "Gunboats for the River"
 BELDNC_m_the_gunboats_for_the_river_desc:0 "Our authority in the rubber districts is whatever happens to be pointed at the bank. We must arm the sternwheelers with a light piece forward and crew them from the Force Publique, and know what that makes harder to describe afterwards as an accident."
 BELDNC_m_the_lake_and_the_frontier:0 "The Lake and the Frontier"
 BELDNC_m_the_lake_and_the_frontier_desc:0 "Our eastern boundary is water for its whole length and the far shore is German East Africa. We must keep an armed steamer on Tanganyika and the yard to build her, because the Germans have one at Kigoma and a habit of finishing what they lay down."
 BELDNC_m_the_officers_of_the_kingdom:0 "The Officers of the Kingdom"
 BELDNC_m_the_officers_of_the_kingdom_desc:0 "We have Belgians in other men's navies, masters out of the packet service and two lieutenants borrowed from the artillery: enough for a list and not for a wardroom. We must commission them, and expect every attache in Brussels to report it home within the month."
 BELDNC_m_the_estimates_are_read_out:0 "The Estimates Are Read Out"
 BELDNC_m_the_estimates_are_read_out_desc:0 "A naval credit cannot be slipped through in a schedule. We must put it to the House line by line - hulls, a base, a school, a wage bill and the annual charge thereafter - knowing the total will be read in Berlin and London before the week ends."
 BELDNC_m_the_torpedo_boats:0 "The Torpedo Boats"
 BELDNC_m_the_torpedo_boats_desc:0 "We cannot hold the sea for an hour and we can make a landing on this coast expensive. We must build small hulls with two tubes apiece, train the crews inside a year and shed them at Ostend, and give a squadron commander something to reconsider."
 BELDNC_m_the_naval_brigade:0 "The Naval Brigade"
 BELDNC_m_the_naval_brigade_desc:0 "Seamen serve guns better than infantry and our cupolas need men who will stay under a closed hatch. We must tell a brigade of sailors off to the forts, satisfy the Chamber that the navy defends Belgium, and give the fortress line its steadiest gunners."
 BELDNC_m_the_mines_of_the_estuary:0 "The Mines of the Estuary"
 BELDNC_m_the_mines_of_the_estuary_desc:0 "Nothing else makes this coast genuinely dangerous to enter. We must raise a mining service, build the store at Ostend and correct the chart of the approaches, and plan to sow explosives in water a friendly neighbour insists is hers."
 BELDNC_m_the_squadron_and_its_price:0 "The Squadron and Its Price"
 BELDNC_m_the_squadron_and_its_price_desc:0 "A squadron, a base and a flag officer is the first thing we shall have bought since the guarantee that a great power must take into account. We must vote it and the recurring charge with it, and let every chancellery decide what we are arming against."
 BEL_m_the_credit_carried_bonus:0 "The Credit Carried"
 BEL_m_the_question_of_a_fleet:0 "The Question of a Fleet"
 BEL_m_the_question_of_a_fleet_desc:0 "The house has been asked whether a neutral kingdom may own warships and has not yet answered. Until it does, every naval measure is provisional and every officer is a temporary appointment."
 BEL_m_the_packets_of_the_state:0 "The Packets of the State"
 BEL_m_the_packets_of_the_state_desc:0 "Fast state-owned mail boats on the Dover run, crewed by men on a government list. Not warships. Hulls, all the same, and a service that can be called in within the week."
 BEL_m_the_flotilla_on_the_river:0 "The Flotilla on the River"
 BEL_m_the_flotilla_on_the_river_desc:0 "Sixty sternwheelers above Leopoldville, the only fleet the kingdom actually operates, and the only one whose officers have ever navigated anything in earnest."
 BEL_m_the_brig_and_the_cadets:0 "The Brig and the Cadets"
 BEL_m_the_brig_and_the_cadets_desc:0 "A training brig full of boys learning a chart and a watch bill. She produces seamen faster than the kingdom can find berths for them, and for three years that is exactly what is needed."
 BEL_m_the_roll_of_seamen:0 "The Roll of Seamen"
 BEL_m_the_roll_of_seamen_desc:0 "Fishermen, packet crews, lightermen and pilots entered on a register and liable to be called. The cheapest reserve the kingdom possesses, and the one that costs nothing until it is used."
 BEL_m_the_mouth_can_be_closed:0 "The Mouth Can Be Closed"
 BEL_m_the_mouth_can_be_closed_desc:0 "The staff has written down what everybody knew: Antwerp is reached through Dutch water, and a neutral Netherlands may shut it lawfully. Every naval plan since begins on the coast instead."
 BEL_m_the_gunboats_of_the_reaches:0 "The Gunboats of the Reaches"
 BEL_m_the_gunboats_of_the_reaches_desc:0 "Armed sternwheelers patrolling the upper river. They carry the state's authority into districts that have not previously seen much of it, and they carry it muzzle first."
 BEL_m_the_steamer_on_tanganyika:0 "The Steamer on Tanganyika"
 BEL_m_the_steamer_on_tanganyika_desc:0 "One armed steamer on a lake four hundred miles long, facing a German yard at Kigoma. It is not a fleet. It is the difference between watching the frontier and merely having one."
 BEL_m_the_officers_of_the_kingdom:0 "The Officers of the Kingdom"
 BEL_m_the_officers_of_the_kingdom_desc:0 "Commissions signed, a seniority list opened, and a uniform designed by a committee. Belgium now has naval officers, and every attache in Brussels has written the fact down."
 BEL_m_the_torpedo_craft:0 "The Torpedo Craft"
 BEL_m_the_torpedo_craft_desc:0 "Small hulls, two tubes and a shed at Ostend. They cannot hold the sea. They can make putting men ashore on this coast a proposition somebody has to think about first."
 BEL_m_the_naval_brigade:0 "The Naval Brigade"
 BEL_m_the_naval_brigade_desc:0 "Sailors told off to the cupolas of the fortress line. They serve the guns better than the infantry did, and the Chamber can be told the navy defends Belgium rather than the Congo."
 BEL_m_the_mining_service:0 "The Mining Service"
 BEL_m_the_mining_service_desc:0 "A store at Ostend, a corrected chart, and men trained to lay a field in the dark. The approaches are now genuinely dangerous, and the neighbour whose water they touch has noticed."
 BEL_m_the_coastal_squadron:0 "The Coastal Squadron"
 BEL_m_the_coastal_squadron_desc:0 "A squadron, a base, a flag officer and a recurring line in the estimates. Small by any standard that matters, and the first Belgian force at sea that has to be counted by anybody else."
 BEL_m_a_guarantee_with_hulls:0 "A Guarantee with Hulls"
 BEL_m_a_guarantee_with_hulls_desc:0 "The kingdom has armed the status somebody else conferred on it. No alliance, no faction, no promise given: only a coast that costs more to enter than it is worth entering."
 BEL_m_the_kings_squadron:0 "The King's Squadron"
 BEL_m_the_kings_squadron_desc:0 "The flag officer is appointed at the palace, the ships are named there, and the Chamber is informed of the total afterwards. It is a smart little force and it belongs to one man."
 BEL_m_the_squadron_the_house_priced:0 "The Squadron the House Priced"
 BEL_m_the_squadron_the_house_priced_desc:0 "Every hull was argued over in public and two of them were struck out. What survives is defensible in debate and slightly less useful at sea than the officers wanted."
 BEL_m_enough_to_keep_them_quiet:0 "Enough to Keep Them Quiet"
 BEL_m_enough_to_keep_them_quiet_desc:0 "The minimum that lets a minister tell five guarantors that Belgium takes its own defence seriously. It is a diplomatic instrument that happens to float."
 BEL_m_the_estimates_pared:0 "The Estimates Pared"
 BEL_m_the_estimates_pared_desc:0 "The credit was carried at half what was asked. The school stands, the hulls do not, and the department has learned exactly how much this house will bear."
 BEL_m_the_question_adjourned:0 "The Question Adjourned"
 BEL_m_the_question_adjourned_desc:0 "The house declined to vote the credit and declined to say never. The papers go back in the drawer, and the officers on the list go back to the artillery."
 BEL_m_the_mining_service_inshore:0 "The Mining Service Inshore"
 BEL_m_the_mining_service_inshore_desc:0 "The chart was redrawn to stop at the frontier of the water. The approaches to Ostend are still defended; the estuary the Dutch claim is left alone, and said so in writing."
 BEL_m_berryer_for_the_school:0 "Berryer for the School Ship"
 BEL_m_beernaert_on_the_estimates:0 "Beernaert on the Estimates"
 BEL_m_the_kingdom_arms_the_lake:0 "Belgium arms Lake Tanganyika"
 BEL_m_the_kingdom_orders_torpedo_craft:0 "Belgium orders torpedo craft"
 BEL_m_the_kingdom_mines_the_approaches:0 "Belgium raises a mining service"
 BEL_m_the_kingdom_puts_a_squadron_to_sea:0 "Belgium puts a squadron to sea"
 BEL_m_the_kingdom_keeps_its_chart:0 "Belgium refuses to redraw its mining chart"
 BEL_m_the_navy_list_is_published:0 "Belgium publishes a navy list"
 BEL_tt_the_armed_neutral_governs:0 "§GThe armed neutral governs:§! the measure is funded because being impossible to walk through is the only policy the kingdom has left."
 BEL_m_the_house_must_divide_tt:0 "The house will have to divide on the naval credit rather than adjourn on it."
 BEL_m_dover_is_the_other_end_tt:0 "§GThe other end of the run is Dover:§! the Admiralty knows every master on the service by name."
 BEL_m_the_river_is_ours_to_survey_tt:0 "§GThe river is the kingdom's:§! the flotilla is surveyed, listed and paid for out of a vote."
 BEL_m_the_flotilla_answers_to_boma_tt:0 "§RThe flotilla answers to Boma:§! the kingdom counts craft it does not own and cannot inspect."
 BEL_m_the_men_before_the_hulls_tt:0 "Seamen take ten years and hulls take three. The brig is laid down first for that reason."
 BEL_m_the_roll_is_kept_in_french_tt:0 "§RThe roll is kept in French:§! it is read out on a coast where almost nobody answers in it."
 BEL_m_the_hague_holds_the_gate_tt:0 "§RThe Hague holds the gate:§! a neutral Netherlands may shut the Scheldt without breaking a single treaty."
 BEL_m_the_gun_is_pointed_at_the_bank_tt:0 "§RThe old regime is still in the districts:§! the gunboats arrive where the quota is collected, and the two facts are related."
 BEL_m_the_gunboats_carry_a_magistrate_tt:0 "§GThe stations have been broken up:§! the gunboats carry a magistrate as well as a gun, and the difference shows in the reports."
 BEL_m_kigoma_is_across_the_water_tt:0 "§RKigoma is across the water:§! the yard on the far shore finishes what it lays down, and Berlin will read this as an answer."
 BEL_m_the_attaches_report_a_list_tt:0 "A kingdom with a seniority list is a kingdom that intends to have ships one day."
 BEL_m_the_house_is_told_the_total_tt:0 "§YThe cartel of the Left governs:§! every figure is read into the record, and the department is asked what each of them is for."
 BEL_m_the_credit_is_settled_at_the_palace_tt:0 "§RThe Crown governs past the Chamber:§! the credit is arranged at the palace and the house receives the total as a communication."
 BEL_m_the_smallest_sum_that_will_serve_tt:0 "§YThe Catholic settlement governs:§! the sum voted is the smallest that will keep five guarantors from raising the subject."
 BEL_m_the_cupolas_get_their_gunners_tt:0 "§GThe fortress troops exist:§! the brigade joins a garrison establishment instead of inventing one."
 BEL_m_no_fortress_troops_to_join_tt:0 "§RThere are no fortress troops yet:§! the sailors are a brigade with nowhere in particular to stand."
 BEL_m_a_navy_that_defends_belgium_tt:0 "§GThe navy defends Belgium:§! the one form of naval spending the Right has never had to apologise for."
 BEL_m_the_hague_reads_the_estimates_tt:0 "§RThe Hague reads our estimates:§! a mining service on this coast is a plan concerning water the Dutch call theirs."
 bel_dnc.1010.t:0 "The Division on the Naval Credit"
 bel_dnc.1010.d:0 "The debate runs two days. A deputy of the Right observes that the kingdom has survived seventy years without a single gun afloat. A deputy of the Left asks what the annual charge will be in 1920 and receives no answer. The member for Ostend, who has been silent throughout, says that his constituents are already at sea and are already liable, and that the only question before the house is whether the state proposes to arm them or merely to count them. The bell rings."
 bel_dnc.1010.a:0 "Carry the credit in full. The coast is either defended or it is not."
 bel_dnc.1010.b:0 "Pare it. The school and the roll stand; the hulls wait."
 bel_dnc.1010.c:0 "Refuse it. A neutral that arms at sea invites the argument it fears."
 bel_dnc.1011.t:0 "A Note from The Hague"
 bel_dnc.1011.d:0 "The Netherlands minister calls, in person and without an appointment, and is entirely courteous. His government has read the Belgian naval estimates and observes that the chart of approaches annexed to them extends into water over which the Netherlands exercises sole authority. He does not use the word provocation. He uses the word chart, four times, and leaves a memorandum which uses it eleven."
 bel_dnc.1011.a:0 "The chart stands. We will not survey our own defence by their leave."
 bel_dnc.1011.b:0 "Redraw it to the frontier and tell them so in writing."
 bel_dnc.1012.t:0 "Five Chancelleries Read the Navy List"
 bel_dnc.1012.d:0 "The list is eleven lines long: six hulls, a depot, a school and a flag officer. In London it is filed with a note that the Belgian coast is now less convenient to land upon, which is read as good news. In Berlin it is filed with a note that the Belgian coast is now less convenient to land upon, which is read as an intention. Paris asks, unofficially, who the ships are for. The Hague asks nothing at all, which is worse."
 bel_dnc.1012.a:0 "Publish it. A guarantee nobody believes in is worth less than a list."
 bel_dnc.1012.b:0 "File it quietly and let each capital find it in its own time."
