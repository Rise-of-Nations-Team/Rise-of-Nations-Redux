 BEL_p_the_left_bank_is_nobody_s_yet_tt:0 "The kingdom has not decided what a Flemish commune is."
 BEL_p_the_dockers_are_organised_tt:0 "§YCartel:§! the new basins open with a recognised syndicate already on the quay."
 BEL_p_the_settlement_prefers_an_arrangement_tt:0 "§YSettlement:§! an arrangement that works is worth more than a principle that does not."
 BEL_p_the_palace_dislikes_the_arrangement_tt:0 "§RCrown:§! the King regards the convention as a standing humiliation and says so at."
 BEL_p_the_arrangement_is_signed_quietly_tt:0 "The convention is renewed by an exchange of letters nobody reports."
 BEL_p_the_palace_cuts_the_canal_tt:0 "§RCrown:§! the King has wanted this cut for twenty years and does not intend to be asked."
