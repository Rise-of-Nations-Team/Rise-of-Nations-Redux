 BEL_p_the_coastal_militia_speaks_dutch_tt:0 "§YTwo peoples:§! the coastal companies are raised."
 BEL_p_the_king_wanted_a_flag_at_sea_tt:0 "§RCrown:§! the King has wanted a national flag at sea since his accession."
 BEL_p_the_left_calls_it_a_toy_tt:0 "§RCartel:§! the Workers call the estimates a toy for admirals and vote against them."
 BEL_p_the_right_votes_two_hulls_tt:0 "§YSettlement:§! two hulls are voted, and there will not be a third."
 BEL_p_a_policy_of_the_palace_tt:0 "§RCrown:§! the sea policy is the King's."
 BEL_p_the_sea_belongs_to_both_statutes_tt:0 "§YTwo peoples:§! the maritime administration is bilingual from the first circular."
 BEL_p_the_sea_belongs_to_one_kingdom_tt:0 "§ROne kingdom:§! the maritime administration is unified."
 BEL_s_the_right_reopens_it_on_its_own_terms_tt:0 "§YSettlement:§! the question is reopened by the side that won it last time."
 BEL_s_the_left_reopens_it_to_win_it_tt:0 "§RCartel:§! the question is reopened in order to be won."
 BEL_s_the_palace_would_rather_not_tt:0 "§RCrown:§! the palace regards a schools quarrel as an unnecessary risk and says so."
 BEL_s_the_cartel_pays_the_communes_tt:0 "§YCartel:§! the communal school is the ministry's own creature and is funded like one."
 BEL_s_the_right_pays_the_communes_grudgingly_tt:0 "§RSettlement:§! the Right funds the communal schools because the law obliges it to."
