 BEL_p_the_settlement_pays_for_both_tt:0 "§YSettlement:§! both are funded."
 BEL_p_the_flank_faces_east_tt:0 "§RA danger has been named on the Meuse:§! the coast is watched as the far end of the same frontier."
 BEL_p_the_flank_faces_south_tt:0 "§RA danger has been named on the Sambre:§! the coast is watched."
 BEL_p_the_flank_faces_the_open_sea_tt:0 "No danger has been named: the coast is fortified against the weather and the."
