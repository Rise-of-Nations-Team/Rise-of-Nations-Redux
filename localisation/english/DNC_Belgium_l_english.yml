 BEL_p_the_mouth_has_no_owner_tt:0 "There is no government at The Hague to negotiate the estuary with."
 BEL_p_one_kingdom_one_river_tt:0 "§ROne kingdom:§! the Scheldt is a national question and is argued as one."
 BEL_p_the_river_belongs_to_the_kingdom_tt:0 "The river is claimed for the kingdom in general and for nobody in particular."
 BEL_p_the_right_votes_the_quays_tt:0 "§YSettlement:§! the works are voted as a national undertaking and the shippers are pleased."
 BEL_p_the_left_votes_the_dockers_tt:0 "§YCartel:§! the works are voted, with a labour clause attached."
 BEL_p_the_palace_lays_out_the_quays_tt:0 "§RCrown:§! the plan is the King's own."
 BEL_p_the_harbour_board_sits_in_dutch_tt:0 "§YTwo peoples:§! the harbour board's minutes are kept in the language of the city it sits in the matter."
 BEL_p_the_harbour_board_sits_in_french_tt:0 "§ROne kingdom:§! the board of a Flemish port keeps its minutes in French."
 BEL_p_the_king_writes_the_note_tt:0 "§RCrown:§! the note is drafted at the palace and the Foreign Minister sees it afterwards."
 BEL_p_the_house_writes_the_note_tt:0 "§YCartel:§! the note is debated before it is sent."
 BEL_p_the_hague_reads_a_kingdom_half_dutch_tt:0 "§YTwo peoples:§! The Hague finds it easier to negotiate with a kingdom half of which speaks."
 BEL_p_the_hague_reads_a_french_kingdom_tt:0 "§ROne kingdom:§! The Hague reads the note as coming from a French power on its southern border."
