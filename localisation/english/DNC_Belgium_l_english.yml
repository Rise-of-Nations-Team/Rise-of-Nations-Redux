l_english:
 WW1_BEL_language_barrier:0 "The Language Barrier"
 WW1_BEL_language_barrier_desc:0 "The Equality Law of 1898 says that the two texts of a law bind equally. The army still gives its orders in French, the officer corps is still formed in French, and rather more than half the men in the ranks were raised in Dutch. Nobody has yet worked out what happens when that army is given an order under fire.\n\nIt is not a grievance about words. It is a state that governs half its people in a language they do not speak."
 BEL_e_the_kings_estate:0 "The King's Estate"
 BEL_e_the_kings_estate_desc:0 "The Congo Free State is Leopold's property and not Belgium's. The Chamber did not vote for it, may not inspect it, and is asked to defend it in every foreign parliament that raises the subject.\n\nWhat the world says: §R[?BEL_scandal|0]§! of 100.\nThe Chamber's motion to take the colony: §Y[?BEL_chamber_congo|0]§! of 100.\nDenials entered against us: §R[?BEL_denials|0]§!.\n\nThe rungs stand at §R[?BEL_rung_1|0]§!, §R[?BEL_rung_2|0]§!, §R[?BEL_rung_3|0]§!, §R[?BEL_rung_4|0]§! and §R[?BEL_rung_5|0]§!. Each denial pulls all of them §R3§! points nearer."
 BEL_e_the_colony_and_the_report:0 "The Colony and the Report"
 BEL_e_the_colony_and_the_report_desc:0 "The Congo is Belgian now, and so is everything that was done in it before.\n\nWhat the world says: §R[?BEL_scandal|0]§! of 100. It falls §G0.20§! a month faster now that the government answering for the basin is one that can be voted out."
 BEL_e_the_chamber_and_the_colony:0 "The Chamber and the Colony"
 BEL_e_the_chamber_and_the_colony_desc:0 "The loan of 1890 gave Belgium the right to take the Free State after ten years. From 1901 that right is live, and every session in which it is not used is a session the government has chosen not to use it.\n\nThe Chamber: §Y[?BEL_chamber_congo|0]§! of 100.\n\nAt §Y70§!, with the scandal still under §R55§!, the cession can be voted on Belgium's own terms. Above a scandal of §R70§! with a Chamber under §R50§!, the powers write the terms instead."
 BEL_e_the_commission_sits:0 "The Commission Sits"
 BEL_e_the_commission_sits_desc:0 "Five powers, a secretariat and a mandate drafted in three capitals that Brussels was shown afterwards. It goes where it likes, it reports when it pleases, and Belgium reads the finding at the same hour as everybody else."
 BEL_e_the_colony_on_our_terms:0 "The Colony on Our Terms"
 BEL_e_the_colony_on_our_terms_desc:0 "The cession was voted in Brussels before it was demanded anywhere else. The colony is Belgian, the treaty is Belgian, and the reforms are the Chamber's own work rather than a receipt handed over at a conference."
 BEL_e_the_colony_on_their_terms:0 "The Colony on Their Terms"
 BEL_e_the_colony_on_their_terms_desc:0 "Belgium owns the Congo and does not own the terms. Consuls travel where they please, the concession regime is dissolved on somebody else's timetable, and the colony arrived in Belgian hands as an admission of guilt."
 BEL_p_the_language_question:0 "The Language Question"
 BEL_p_the_language_question_desc:0 "Two peoples, one state, one language of command. The Movement asks in Dutch and is answered in French, and the answer is always that this is not the year for it.\n\nThe Flemish Movement: §Y[?BEL_flemish|0]§! of 100.\nRefusals entered: §R[?BEL_flemish_refusals|0]§!.\nConcessions made: §G[?BEL_concessions|0]§!.\n\n§R45§!: Ghent. §R60§!: the word of command. §R75§!: the majority splits. §R90§!: the Movement leaves the Chamber."
 BEL_p_the_walloon_bloc:0 "The Walloon Bloc"
 BEL_p_the_walloon_bloc_desc:0 "Liege, Charleroi and the Borinage: the coal, the steel, the Liberals and the Party of Labour. Every concession made in Dutch is paid for here, and it is paid in the provinces that hold the industry.\n\nWalloon and Liberal confidence: §Y[?BEL_walloon|0]§! of 100. Below §R30§! the Walloons hold a congress of their own."
 BEL_p_the_movement_in_the_street:0 "The Movement in the Street"
 BEL_p_the_movement_in_the_street_desc:0 "Meetings nobody in Brussels called, a press that answers to no party, and a language of grievance that has stopped asking and started announcing. A constitutional movement kept out of the constitution for a generation becomes something else."
 BEL_p_the_walloon_congress:0 "The Walloon Congress"
 BEL_p_the_walloon_congress_desc:0 "A president, a flag, and a list of what Belgium has taken from Wallonia. The industrial provinces have decided that the state belongs to somebody else, and they hold the coal and the steel while they decide what to do about it."
 bel_dnc.10.t:0 "Westminster Debates the Free State"
 bel_dnc.10.d:0 "On the twentieth of May the House of Commons resolved, without a division, that the government of the Congo Free State ought to be considered by the powers who signed at Berlin. Herbert Samuel moved it. Nobody spoke against it.\n\nOur minister in London reports that the Congo has become a British question, and that it will not be dropped merely because Brussels finds it inconvenient. The King's ministers would like to know what the King's government intends to say."
 bel_dnc.10.a:0 "The Free State is a sovereign state and no business of ours"
 bel_dnc.10.b:0 "Say nothing; the King may answer for his own estate"
 bel_dnc.10.c:0 "Let the Chamber put its own questions to Boma"
 bel_dnc.11.t:0 "The Consul's Report"
 bel_dnc.11.d:0 "Roger Casement went up the river as far as Lake Mantumba with a notebook, and His Majesty's Government has printed what he wrote in it. Names of villages, numbers of hands, the rubber tally kept against each.\n\nThe Free State's answer is that a consul saw what the missionaries wished him to see. The report is being read aloud in Antwerp, and the men reading it are Belgians."
 bel_dnc.11.a:0 "Answer it with a commission of the King's own choosing"
 bel_dnc.11.b:0 "Print it in Belgium and let it be read entire"
 bel_dnc.11.c:0 "Order the rubber tally cut in the concession districts"
 bel_dnc.12.t:0 "The Lantern Slides"
 bel_dnc.12.d:0 "Mrs Harris photographs what the rubber tally leaves behind, and the Congo Reform Association carries the plates from hall to hall. A father sits on a mission verandah looking at his daughter's hand and foot. Morel puts the picture on the cover of the pamphlet.\n\nThree hundred meetings this year, the collection plate full at every one, and no argument in the world that answers a photograph."
 bel_dnc.12.a:0 "The photographs are staged and the Association is paid"
 bel_dnc.12.b:0 "Answer the Association in its own press, city by city"
 bel_dnc.12.c:0 "Move the annexation debate now, before this gets worse"
 bel_dnc.13.t:0 "The Note from the Powers"
 bel_dnc.13.d:0 "A note is delivered at the Rue de la Loi, signed in more than one chancellery, reciting Article VI of the Berlin Act and the obligation to watch over the preservation of the native tribes.\n\nIt asks no question. It states that the signatories have taken note, and requests to be informed what Belgium proposes to do. This is no longer a debate in somebody else's parliament. It is a paper on the table."
 bel_dnc.13.a:0 "Reply that the Free State is not Belgium's to answer for"
 bel_dnc.13.b:0 "Admit an inspection of the districts they have named"
 bel_dnc.13.c:0 "Tell the powers that Belgium will take the colony"
 bel_dnc.14.t:0 "The Commission That Is Not Ours"
 bel_dnc.14.d:0 "An international commission is constituted to inquire into the administration of the Congo basin. Belgium is offered a seat upon it and not the chair of it. Its terms of reference were drafted in three capitals and shown to Brussels afterwards.\n\nWhatever it finds, Belgium will read in a printed report at the same hour as everybody else. There is no version of this in which Belgium decides when it stops."
 bel_dnc.14.a:0 "Sit on it, and be one voice in five"
 bel_dnc.14.b:0 "Refuse the seat, and be reported upon"
 bel_dnc.20.t:0 "The Chamber Votes the Colony"
 bel_dnc.20.d:0 "The commission of seventeen has reported, the treaty of cession is drafted, and the majority is there to be counted. The King has signed nothing and is telling everyone who will listen that the Domaine de la Couronne forms no part of the bargain.\n\nThe Chamber intends to take it anyway. Belgium can have the Congo, on terms it wrote itself, and can be told afterwards what it has bought."
 bel_dnc.20.a:0 "Vote the cession; the Congo becomes Belgian"
 bel_dnc.20.b:0 "Refuse it; Belgium is not a colonial power"
 bel_dnc.21.t:0 "The Colony on Other Terms"
 bel_dnc.21.d:0 "The offer is made in a room Belgium did not choose. The powers will accept a Belgian annexation provided the concession regime is dissolved, the districts are opened to foreign consuls, and the commission sits on until it declares itself satisfied.\n\nBelgium may have the Congo. Belgium may not have it quietly."
 bel_dnc.21.a:0 "Accept the conditions and take the colony"
 bel_dnc.21.b:0 "Refuse; let them try to dispose of it themselves"
 bel_dnc.22.t:0 "The Powers Dispose of the Congo"
 bel_dnc.22.d:0 "Belgium said no, and the signatories of Berlin did not wait to be asked twice. The basin is placed under an administration answering to a conference, its officers appointed out of four capitals. Belgian officials are given passage home.\n\nThe Belgian claim is noted in the protocol and set aside. The first colonial question Belgium was ever asked, she declined to answer, and it has been answered for her."
 bel_dnc.22.a:0 "There is nothing left to decide"
 bel_dnc.30.t:0 "Dutch at Ghent"
 bel_dnc.30.d:0 "The Flemish members ask for the University of Ghent in Dutch. Not a chair, not a lecture series: the university. The faculties reply that science has no vernacular and that the request is a provincial joke, and every Flemish newspaper prints the reply in full.\n\nThe Catholic majority in this Chamber sits on Flemish seats. Somebody in the ministry ought to have counted them before that answer was drafted."
 bel_dnc.30.a:0 "Refuse; a university teaches in the language of learning"
 bel_dnc.30.b:0 "Two sections, French and Dutch, in the same faculties"
 bel_dnc.30.c:0 "Give them the university entire"
 bel_dnc.31.t:0 "The Word of Command"
 bel_dnc.31.d:0 "The regulation stands: orders are given in French. A regiment raised in West Flanders is commanded by officers who learned Dutch, if at all, from their servants.\n\nThe Minister of War says a bilingual army is not an army. The Flemish members say that an army which cannot be understood is not an army either. Whatever is settled here will be settled again under fire, by men who will not have read the regulation."
 bel_dnc.31.a:0 "The army commands in French, and there the matter ends"
 bel_dnc.31.b:0 "Flemish companies, and Dutch required of the cadre"
 bel_dnc.32.t:0 "The Majority Counts Its Flemish Seats"
 bel_dnc.32.d:0 "The government leans on a Catholic majority and that majority is Flemish. Its Flemish wing has voted for a ministry that gave it the Equality Law and has given it nothing since.\n\nThe wing has met privately and sent a delegation to say that it will carry the language laws with the opposition if it must. The ministry lives or dies on the answer given this week."
 bel_dnc.32.a:0 "Take the language laws as government bills"
 bel_dnc.32.b:0 "Let the Flemish wing go, and count what is left"
 bel_dnc.33.t:0 "The Movement Leaves the Chamber"
 bel_dnc.33.d:0 "It is no longer a question in the Chamber. There are meetings in Antwerp and Ghent that nobody in Brussels called, a press that answers to no party, and a vocabulary of grievance that has stopped asking and begun announcing.\n\nA constitutional movement kept outside the constitution for a generation becomes something that does not need the constitution."
 bel_dnc.33.a:0 "Meet it with the gendarmerie and hold the streets"
 bel_dnc.33.b:0 "Take the whole programme in a single bill"
 bel_dnc.34.t:0 "The Walloon Congress"
 bel_dnc.34.d:0 "The Walloons have met at Liege and constituted themselves as a movement, with a president, a flag and a list of the things Belgium has taken from them. Destree is drafting the sentence that says there are no Belgians, only Walloons and Flemings, and half the room believes it already.\n\nThe provinces that hold the coal and the steel have decided that the state belongs to somebody else."
 bel_dnc.34.a:0 "Note the resolutions, and govern with what is left"
 BEL_tt_deny:0 "The denial is entered against Belgium. Every remaining rung of the scandal now arrives §R3§! points earlier, and the Congo question gains a further §R0.15§! a month for the rest of the decade. Today the scandal falls §G6§!, and that is all it buys."
 BEL_tt_quota_down:0 "The rubber tally is cut in the concession districts. The scandal now grows §Y0.10§! a month in place of §R0.40§!."
 BEL_tt_inspection:0 "The named districts are opened. The regime falls to the reduced tally and the scandal grows §Y0.10§! a month."
 BEL_tt_commission:0 "The commission sits whatever Belgium answers. While it sits the scandal gains a further §R0.30§! a month, and the powers keep their own record of what it finds."
 BEL_tt_refused_vote:0 "The cession is refused. The Chamber will not be asked again for §Y36§! months, and while the refusal stands it loses §R0.15§! a month of its own motion."
 BEL_tt_refused_terms:0 "The powers are invited to dispose of the basin themselves. They will take about six months to decide whether that was a bluff."
 BEL_tt_congo_lost:0 "Belgium has no colony and no prospect of one. The Chamber's motion is dead and will not be revived."
 BEL_tt_refusal:0 "A refusal is entered. The Flemish Movement grows a further §R0.10§! a month from now on, and refusals are never struck off."
 BEL_tt_concession:0 "A concession is made. The Movement grows §G0.05§! a month more slowly for good, and §G0.30§! a month more slowly for the next §Y24§! months. Wallonia has been told what it cost."
 BEL_tt_army_french:0 "The word of command stays French. The Movement grows §R0.20§! a month for as long as that is true."
 BEL_tt_army_bilingual:0 "The word of command is no longer French alone. The Movement loses the §G0.20§! a month that the army question was giving it."
 BEL_tt_ministry_falls:0 "The ministry falls. The Flemish wing sits with the opposition, and the language question is now somebody else's to answer."
 BEL_tt_whole_programme:0 "The whole Flemish programme in one bill. Wallonia will remember which ministry did it, and so will the Movement."
 BEL_tt_walloon_congress:0 "The Walloon movement is constituted. Walloon and Liberal confidence can no longer rise above §R45§!."
 bel_dnc.600.t:0 "The Figure Set in Brussels"
 bel_dnc.600.d:0 "A quota reaches the Kasai from an office on the Rue de Namur: so many kilogrammes of rubber from each village, each fortnight, or the sentries answer for it. The Free State is the King's own, and its agents take their orders from the King. We govern Belgium and not the Congo — but the rubber comes up the river in Belgian bottoms, and the letters home from Antwerp men are beginning to say what the sentries do."
 bel_dnc.600.a:0 "The King's estate is the King's business"
 bel_dnc.600.b:0 "Ask quietly for a Belgian magistrate at Boma"
 bel_dnc.600.c:0 "Tell the palace the figure must come down"
 bel_dnc.601.t:0 "The Interpellation"
 bel_dnc.601.d:0 "Vandervelde rises with a bundle of letters in his hand and asks the government of Belgium what it knows about a country Belgium does not govern. The Catholic benches shout him down; the Liberals sit very still. Woeste is right that we owe the Chamber no answer about the King's possessions. He is also right that refusing to answer is itself an answer, and that the press will print it."
 bel_dnc.601.a:0 "The government has no answer to give"
 bel_dnc.601.b:0 "Let the debate run its course"
 bel_dnc.601.c:0 "Move for a parliamentary commission"
 bel_dnc.602.t:0 "The Strike for the Second Ballot"
 bel_dnc.602.d:0 "Three hundred thousand men are out from the Borinage to the Ghent mills, and they are not striking for wages. The plural vote gives a landowner three ballots and a collier one, and the Labour Party has decided that the street will say what the Chamber will not. The Civic Guard is under arms in Louvain. Whatever we do this week will be remembered for twenty years."
 bel_dnc.602.a:0 "The Civic Guard will clear the streets"
 bel_dnc.602.b:0 "Concede the second ballot in the communes"
 bel_dnc.602.c:0 "Wait; hunger will end it without us"
 bel_dnc.603.t:0 "The Consul Goes Up the River"
 bel_dnc.603.d:0 "His Britannic Majesty's consul at Boma has hired a launch and gone up past the Pool with an interpreter and a notebook. He has no standing to inspect anything. He also has the whole of the British press behind him and a Foreign Office that would be glad of a Belgian embarrassment. Boma asks Brussels what it should do about a man it cannot lawfully stop."
 bel_dnc.603.a:0 "Give him every facility and be seen to do it"
 bel_dnc.603.b:0 "Let the river be slow and the launches scarce"
 bel_dnc.603.c:0 "Send our own inspector ahead of him"
 bel_dnc.604.t:0 "The Consul's Report"
 bel_dnc.604.d:0 "The report is laid before Parliament at Westminster and reprinted within a week in Paris, Berlin and New York. It names districts, dates and mutilations, and it is written in the flat voice of a man who counted. Brussels replies that the consul saw what he came to see. Nobody outside Brussels believes it."
 bel_dnc.604.d_assisted:0 "The report is laid before Parliament at Westminster with our own facilities acknowledged in its opening page. That courtesy has cost us the only defence we had: the consul cannot be called a trespasser, and every district he names, he names with a Belgian launch under him. It is worse than we feared and it carries our signature."
 bel_dnc.604.d_obstructed:0 "The report is laid before Parliament at Westminster, and its longest passage is about the four weeks the consul spent waiting for a boat. Obstruction has done what evidence could not: it has persuaded the reader that there was something to hide. The abuses are alleged; the concealment is documented."
 bel_dnc.604.a:0 "Dispute the figures line by line"
 bel_dnc.604.b:0 "Say nothing and let the King answer for the King"
 bel_dnc.604.c:0 "Lay the report before the Chamber ourselves"
 bel_dnc.605.t:0 "Mr Morel's Association"
 bel_dnc.605.d:0 "A Liverpool shipping clerk who noticed that the boats went out full of rifles and came back full of rubber, and that nothing was ever traded, has founded an association and a newspaper. He speaks in chapels and town halls from Glasgow to Boston, and the collections keep him in print. He is not a government. He is worse: he is a fact that will not stop being published."
 bel_dnc.605.a:0 "Prosecute the libels in the Belgian courts"
 bel_dnc.605.b:0 "Answer him in print, point by point"
 bel_dnc.605.c:0 "Do nothing; the English will tire of Africa"
 bel_dnc.606.t:0 "The King Appoints a Commission"
 bel_dnc.606.d:0 "Stung at last, the palace announces a commission of inquiry to travel to the Congo and hear witnesses. The King names it, the King instructs it, and the King will receive its report. The Chamber is not consulted and is not invited. We may ask for Belgians on it, we may ask to send a man of our own with it, or we may let the King investigate himself and take what comes."
 bel_dnc.606.a:0 "Ask that Belgian magistrates sit on it"
 bel_dnc.606.b:0 "Let the King name whom he pleases"
 bel_dnc.606.c:0 "Insist the Chamber sends a delegate with it"
 bel_dnc.607.t:0 "What the Commission Found"
 bel_dnc.607.d:0 "The commissioners went out to disprove a libel and came back having taken evidence for six months in the districts themselves. Their report confirms the substance of everything alleged: the quota, the hostages, the sentries paid in cartridges. The palace prints a summary and locks the depositions in a drawer. The depositions are the part that would end the argument, one way or the other."
 bel_dnc.607.a:0 "Publish the report entire, evidence and all"
 bel_dnc.607.b:0 "Publish the conclusions and not the evidence"
 bel_dnc.607.c:0 "The report will be studied in due course"
 bel_dnc.608.t:0 "The Question of Annexation"
 bel_dnc.608.d:0 "The old bequest of 1890 gave Belgium the right to take the Congo whenever it chose. For fifteen years no ministry has chosen. Now the choice is being made for us: take the colony and inherit the crimes, refuse it and watch the powers dispose of central Africa without us. Beernaert's commission has sat long enough for everyone to know what it will say."
 bel_dnc.608.a:0 "Bring in a bill of cession"
 bel_dnc.608.b:0 "Let the commission sit another year"
 bel_dnc.608.c:0 "Belgium is not a colonial power"
 bel_dnc.609.t:0 "The Brialmont Question"
 bel_dnc.609.d:0 "Brialmont's forts on the Meuse are twenty-five years old, their cupolas are cast for guns two generations behind, and the general who built them wrote before he died that they would be taken in a week. Our neutrality is guaranteed by five powers, four of whom keep army corps within three days of Liege. Concrete is cheap compared with what it insures against, and dear compared with what the Chamber will vote."
 bel_dnc.609.a:0 "Rebuild the works at Liege and Namur"
 bel_dnc.609.b:0 "Everything into Antwerp, the national redoubt"
 bel_dnc.609.c:0 "Our neutrality is our fortress"
 bel_dnc.610.t:0 "The Colonial Charter"
 bel_dnc.610.d:0 "Whatever else happens, the Congo will one day be governed by a law, and the law is being drafted now. A colonial council in Brussels, magistrates who cannot be dismissed by the men they judge, a budget laid annually before the Chamber — or a charter that changes the flag over Boma and leaves every officer of the Free State exactly where he stands."
 bel_dnc.610.a:0 "A council, a magistracy and an annual account"
 bel_dnc.610.b:0 "A charter that changes the flag and little else"
 bel_dnc.610.c:0 "No charter until the colony is ours"
 bel_dnc.611.t:0 "The Chamber Must Decide"
 bel_dnc.611.d:0 "The treaty of cession lies on the table and the session is nearly out. Take it, and Belgium doubles its territory eighty times over and answers to the world for twenty years of the King's administration. Postpone it, and the powers will note that the Chamber had the paper in its hand and did not sign. There is no third session in which this is easier."
 bel_dnc.611.a:0 "Vote the treaty of cession"
 bel_dnc.611.b:0 "Postpone; the session is short"
 bel_dnc.611.c:0 "Reject it and let the King keep his estate"
 bel_dnc.612.t:0 "The Handover at Boma"
 bel_dnc.612.d:0 "The blue flag with the gold star comes down and the tricolour goes up, and the same district commissioners stand in the same shade watching it happen. Nothing in the Congo has changed except the address to which the reports are sent. Whether anything else changes is decided in the next twelve months, by whether those men keep their posts."
 bel_dnc.612.a:0 "Keep the Free State's men; they know the country"
 bel_dnc.612.b:0 "Sweep them out and send magistrates"
 bel_dnc.612.c:0 "A colonial army officered from Belgium"
 bel_dnc.613.t:0 "Personal Service"
 bel_dnc.613.d:0 "Belgium raises its army by lottery, and a man who draws a bad number and has money buys a substitute. The result is an army of the poor, the unwilling and the paid, at half the strength on paper. Every general since Brialmont has said so. The Church says conscription takes sons from the land, and the Church elects this government."
 bel_dnc.613.a:0 "One son from every family, and no more substitutes"
 bel_dnc.613.b:0 "General personal service, and let the storm come"
 bel_dnc.613.c:0 "The lottery stands"
 bel_dnc.614.t:0 "The Old King Is Buried"
 bel_dnc.614.d:0 "He dies at Laeken, seventy-four years old, having reigned forty-four of them and having never once set foot in the country he owned. Along the route of the cortege the crowd hisses, and the guard closes up. He leaves behind a colony, a fortune whose provenance is a matter of international record, and a will that his ministers are still reading."
 bel_dnc.614.a:0 "A state funeral, and no word of Africa"
 bel_dnc.614.b:0 "Contest the will; the estate belongs to the nation"
 bel_dnc.614.c:0 "Bury him quickly and turn the page"
 bel_dnc.615.t:0 "The Oath of Albert"
 bel_dnc.615.d:0 "The nephew takes the oath in both languages before the united chambers, which is itself a piece of news. He is thirty-four, he reads reports rather than receiving them, and he has travelled in the Congo with his own eyes open. The court that ran the last reign is not sure what to do with him. Neither, yet, are we."
 bel_dnc.615.a:0 "A king who reads what we send him"
 bel_dnc.615.b:0 "Give the young King the army"
 bel_dnc.615.c:0 "The reign changes nothing; ministers govern"
 bel_dnc.616.t:0 "Concrete and Cupolas"
 bel_dnc.616.d:0 "The works are begun and the estimates have already been exceeded. The engineers want steel cupolas and deeper counterscarps; the army wants field guns and horses, and points out that a fort cannot manoeuvre. Both are right, and the Chamber will not vote for both without a very bad quarter of an hour."
 bel_dnc.616.a:0 "Finish the Meuse works properly"
 bel_dnc.616.b:0 "Guns for the field army instead"
 bel_dnc.616.c:0 "Both, and the estimates be damned"
 bel_dnc.617.t:0 "The Bill for Ghent"
 bel_dnc.617.d:0 "The university stands in the middle of Flanders and teaches in French, and a Fleming who wants a degree must first stop being one in the lecture hall. The bill to make it Dutch has been laid, withdrawn and laid again. The Liberals of Ghent say it will make a provincial school of a European faculty. The Flemish Movement says that is precisely the argument they have heard for eighty years."
 bel_dnc.617.a:0 "Ghent will teach in Dutch"
 bel_dnc.617.b:0 "A double faculty under one roof"
 bel_dnc.617.c:0 "The bill is withdrawn"
 bel_dnc.618.t:0 "The Last Works"
 bel_dnc.618.d:0 "The outer ring at Antwerp is unfinished, the interval trenches between the Meuse forts are marked out and not dug, and the engineers say plainly that the programme needs three more years. Nobody in Europe expects to be given three more years. This is the last vote before whatever is coming arrives."
 bel_dnc.618.a:0 "Close the outer ring at Antwerp"
 bel_dnc.618.b:0 "Cupolas for the frontier forts and no more"
 bel_dnc.618.c:0 "Stop the programme where it stands"
 bel_dnc.619.t:0 "The Strike Returns"
 bel_dnc.619.d:0 "Eleven years after the last one, and they have learned. The strike funds are full, the men come out by trade in an order agreed beforehand, and there is almost no violence at all — which is far more frightening than the alternative. They want one man, one vote, and they are prepared to be patient about it for as long as we are prepared to be stubborn."
 bel_dnc.619.a:0 "Concede a commission on revision"
 bel_dnc.619.b:0 "The vote will not be changed under pressure"
 bel_dnc.619.c:0 "Call out the Civic Guard"
 bel_dnc.620.t:0 "The Army Law"
 bel_dnc.620.d:0 "De Broqueville lays a law that would raise the annual contingent to thirty-three thousand men and put the whole burden of it on personal service. It is the largest peacetime demand ever made of this country, it will pass by a handful of votes if it passes at all, and every neighbour of Belgium has already made the same demand of its own people."
 bel_dnc.620.a:0 "The full contingent, and general service with it"
 bel_dnc.620.b:0 "A smaller contingent and no quarrel with the Church"
 bel_dnc.620.c:0 "Belgium will not be a barracks"
 bel_dnc.621.t:0 "The Guarantee Is Tested"
 bel_dnc.621.d:0 "A note is handed in at the Foreign Ministry at seven in the evening and requires an answer by seven in the morning. It asks free passage for an army across Belgium, offers to pay for what it breaks, and promises to restore the kingdom afterwards. The treaty of 1839 that guarantees our neutrality is signed by the government that wrote this note. Twelve hours."
 bel_dnc.621.d_forts:0 "A note is handed in at the Foreign Ministry at seven in the evening and requires an answer by seven in the morning. It asks free passage across Belgium and promises to pay for the damage. Behind the note stand nine army corps; in front of them stand the works we voted, manned, provisioned and finished. For the first time in this reign the answer is not purely a moral one. Twelve hours."
 bel_dnc.621.a:0 "The road across Belgium is not for sale"
 bel_dnc.621.b:0 "Let them pass; Belgium will not be a battlefield"
 bel_dnc.621.c:0 "We refuse, and we hold at Liege"
 bel_dnc.622.t:0 "The Answer of the Powers"
 bel_dnc.622.d:0 "The refusal is telegraphed to the five guarantors before dawn, and by the afternoon London has published it. A small country has told a great one that a treaty is not a scrap of paper, and the whole of Europe has been handed the sentence it will use for the next four years. That is worth something. It will not stop a single gun."
 bel_dnc.622.d_hold:0 "The forts on the Meuse are still firing on the fourth day, and the world has noticed. What was voted as an insurance policy has become the reason a timetable is a fortnight late and a reputation is ruined. The guarantors, who owed us their signature and expected to pay it in sympathy, are now obliged to pay it in men."
 bel_dnc.622.d_pass:0 "The columns cross at Gemmenich without a shot, and the guarantors read the news in their morning papers. No Belgian town burns and no Belgian regiment is destroyed. We have also taught every chancery in Europe exactly what a Belgian signature is worth, and we will be at the table afterwards as a country that was asked and agreed."
 bel_dnc.622.a:0 "Then we stand with the guarantors"
 bel_dnc.622.b:0 "We will be judged when the war is over"
 BEL_c_tt_estate_deny:0 "§RThe government denies the Chamber an answer:§! quiet now, and a shorter fuse on every scandal to come."
 BEL_c_tt_quota_lowered:0 "§GThe demand made of the districts is reduced.§!"
 BEL_c_tt_strike:0 "§RThe country stops working while the strike lasts.§!"
 BEL_c_tt_fort_built:0 "§GAnother stage of the fortress programme is completed.§!"
 BEL_c_tt_no_forts:0 "§RBelgium will build no forts. The frontier is a line on a treaty.§!"
 BEL_c_tt_no_colony:0 "§RBelgium renounces the colony. The powers will dispose of it.§!"
 BEL_c_tt_cession_voted:0 "§GThe Congo passes to the Belgian state.§!"
 BEL_c_tt_cession_refused:0 "§RThe Chamber refuses the cession.§!"
 BEL_c_tt_flemish_recruits:0 "§RFlemish recruits will be drilled and commanded in French.§!"
 BEL_c_tt_lottery_kept:0 "§RThe lottery and the paid substitute remain the law.§!"
 BEL_c_tt_ghent:0 "§GGhent will teach in Dutch.§!"
 BEL_c_tt_guarantee_kept:0 "§GBelgium holds to the treaty of 1839.§!"
 BEL_c_tt_guarantee_broken:0 "§RBelgium lets the guarantee of 1839 fall.§!"
 BEL_c_the_lottery_army:0 "The Lottery and the Substitute"
 BEL_c_the_lottery_army_desc:0 "The contingent is drawn by ballot and a bad number may be sold. The rich buy their way out, the poor serve for them, and the regiments are filled with men who did not choose to be there and cadres who know it. It costs the government nothing in votes and the army everything in quality."
 BEL_c_the_militia_compromise:0 "One Son Per Family"
 BEL_c_the_militia_compromise_desc:0 "The ballot is abolished and the substitute with it, but only one son of any household is taken. It is not the army the general staff asked for; it is the army the Catholic benches would vote. The contingent rises, the cadres improve, and the countryside is not set against us."
 BEL_c_personal_service:0 "General Personal Service"
 BEL_c_personal_service_desc:0 "Every man serves for himself and no man may buy a stranger to serve for him. The contingent nearly doubles, the reserve becomes real, and the price is paid in the pulpits and in the farms of Flanders every recruiting season."
 BEL_c_the_national_redoubt:0 "The National Redoubt"
 BEL_c_the_national_redoubt_desc:0 "Antwerp is to be the place the field army falls back on when the frontier goes: a ring of forts, a port that cannot be closed, and a government that can still be sitting in Belgium after the frontier is lost. It is an admission written in concrete, and it is the only admission that keeps the state alive."
 BEL_c_the_guarantee_of_1839:0 "The Guarantee of 1839"
 BEL_c_the_guarantee_of_1839_desc:0 "Five powers signed for the perpetual neutrality of Belgium, and every one of them has kept it for sixty years. It buys us a standing in Europe that our size does not justify and a defence that costs nothing to maintain. It also forbids us to have any policy of our own beyond the Meuse."
 BEL_c_the_scrap_of_paper:0 "Not a Scrap of Paper"
 BEL_c_the_scrap_of_paper_desc:0 "The note was refused and the refusal was published. A country of seven million has told the world what it thinks a signature is worth, and the world has answered in a way that no Belgian government has ever been answered before. Men who would not have served now queue."
 BEL_c_the_broken_word:0 "The Road Was Sold"
 BEL_c_the_broken_word_desc:0 "The columns crossed and no Belgian gun was fired. The kingdom stands, its towns are whole, and every chancery in Europe has filed away the price at which Belgian neutrality could be bought. That file will be opened again at the peace, and by our own electors long before that."
 BEL_c_the_congo_reform_association:0 "The Congo Reform Association"
 BEL_c_the_congo_reform_association_desc:0 "A newspaper, a lecture circuit and a mailing list, run from Liverpool and reprinted in every language that matters. It cannot legislate and it cannot invade. It can make the word Belgian mean something particular in a chapel in Wales and a pulpit in Boston, and it does, every week."
 BEL_c_the_colonial_charter:0 "The Colonial Charter"
 BEL_c_the_colonial_charter_desc:0 "The colony is governed by a law that the Chamber wrote, with magistrates the local administration cannot dismiss and accounts that must be laid annually before Parliament. It is slower than the old regime and infinitely more defensible, and it is the only answer to the report that anybody abroad has ever accepted."
 BEL_c_the_general_strike:0 "The General Strike"
 BEL_c_the_general_strike_desc:0 "The pits are idle, the Ghent mills are dark, the trams have stopped and the docks are closed. Nothing is being made and nothing is being shipped, and the government spends its whole day on the one question it refused to answer."
 BEL_c_the_second_ballot:0 "The Concession on the Vote"
 BEL_c_the_second_ballot_desc:0 "The plural vote is not abolished, but it is bent: a second ballot in the communes, a revision commission promised, a date conceded in principle. It buys peace in the streets at the cost of every argument the government had for saying no next time."
 BEL_c_the_new_reign:0 "The New Reign"
 BEL_c_the_new_reign_desc:0 "A young king who takes his oath in both languages, reads his ministers' papers before he signs them and is not personally answerable for anything that happened on the Congo. For the first time in forty years the crown is an asset to the government rather than an embarrassment it must defend."
 BEL_c_the_soldier_king:0 "The Soldier King"
 BEL_c_the_soldier_king_desc:0 "Albert has taken the army as his own department, and the staff has discovered that the sovereign reads its memoranda and remembers them. Manoeuvres are attended, incompetence is noticed, and promotion is no longer purely a matter of seniority. The ministry has lost a portfolio and gained an army."
 BEL_c_the_fortress_line:0 "The Fortress Programme"
 BEL_c_the_fortress_line_desc:0 "Concrete on the Meuse and around Antwerp, cupolas cast in Belgium, interval works dug between them. Every stage voted makes the frontier a real proposition and takes another quarter of the session out of the government's hands."
 BELDNC_the_guarantee:0 "The Guarantee"
 BELDNC_the_guarantee_desc:0 "Five powers signed for our neutrality and none of them asked us. The guarantee is our whole defence policy and our whole foreign policy, and it holds exactly as long as the signatories find it convenient. We will read the treaty again, carefully, and count what it obliges them to do."
 BEL_dnc_the_guarantee_tt:0 "The text of 1839 is read out to the Chamber, obligations and silences alike."
 BELDNC_the_kingdom_of_nine_provinces:0 "The Kingdom of Nine Provinces"
 BELDNC_the_kingdom_of_nine_provinces_desc:0 "Coal under Hainaut, steel at Liege, glass at Charleroi, the densest rail net in Europe and a port at Antwerp that handles more than the kingdom can consume. We are the second industrial nation on earth and the smallest. The works will be pressed harder."
 BEL_dnc_the_kingdom_tt:0 "The provincial estimates are voted and the works go on."
 BEL_dnc_provinces_bonus:0 "Belgian Industry"
 BELDNC_the_two_tongues:0 "The Two Tongues"
 BELDNC_the_two_tongues_desc:0 "The Equality Law has just carried: the laws are to be published in Dutch as well as French. The army still commands in French, Ghent still teaches in French, and the officers who will read the mobilisation orders speak one language to men who answer in another. Naming the question does not settle it."
 BEL_dnc_the_two_tongues_tt:0 "The Flemish Movement takes the naming of the question as an invitation."
 BELDNC_the_kings_second_crown:0 "The King's Second Crown"
 BELDNC_the_kings_second_crown_desc:0 "The Congo Free State is not a Belgian colony. It is the personal possession of Leopold II, held by him and not by us, governed from a bureau in Brussels that answers to the King alone. The Chamber has never voted a franc for it and has never been asked to. That arrangement is now a public question."
 BEL_dnc_the_second_crown_tt:0 "The Chamber begins to ask what the King's private state has to do with the kingdom."
 BELDNC_the_decade_opens:0 "The Decade Opens"
 BELDNC_the_decade_opens_desc:0 "Neutrality, industry, two peoples and a King with an empire of his own. Every one of these will be settled in the next fourteen years, by us or by somebody else. The government must choose which question it means to answer first."
 BEL_dnc_the_decade_opens_tt:0 "The government sets its order of business for the decade."
 BELDNC_a_the_plural_vote:0 "The Plural Vote"
 BELDNC_a_the_plural_vote_desc:0 "Every man votes, and some men vote three times. A householder of thirty-five with children adds a vote; a diploma adds two. The arithmetic was written in 1893 to concede universal suffrage without conceding the result, and it works: the Catholic majority has held every election since. The register is the whole quarrel."
 BELDNC_a_the_kings_prerogative:0 "The King's Prerogative"
 BELDNC_a_the_kings_prerogative_desc:0 "Leopold does not merely reign. He signs decrees for a state that is not ours, receives ministers we did not send, and treats the Chamber as an audience. The constitution says the King's acts require a minister's countersignature. We are about to find out what that sentence is worth."
 BELDNC_a_the_partys_weapon:0 "The Party's Weapon"
 BELDNC_a_the_partys_weapon_desc:0 "The Workers' Party cannot win a majority under the plural vote and knows it. What it has instead is the pits, the glassworks and the tramways, and the discovery that a kingdom this industrial can be stopped in a week. Vandervelde calls the strike a petition signed with folded arms."
 BELDNC_a_the_catholic_settlement:0 "The Catholic Settlement"
 BELDNC_a_the_catholic_settlement_desc:0 "The party has governed since 1884 and will go on governing: the schools subsidised, the countryside solid, the plural vote left exactly where it is. Order is not a programme, it is a habit. We will defend the King abroad and the register at home, and let the left shout."
 BELDNC_a_woestes_right:0 "Woeste's Right"
 BELDNC_a_woestes_right_desc:0 "Charles Woeste leads the Catholic right and concedes nothing: not a vote, not a syllable of Dutch in the courts, not one word against the King's Free State. He is the most effective man in the Chamber and every refusal he wins is stored up somewhere else."
 BELDNC_a_the_school_and_the_ballot:0 "The School and the Ballot"
 BELDNC_a_the_school_and_the_ballot_desc:0 "The Catholic majority is carried by Flemish votes and repays them in French. Beernaert would rather pay in schools: subsidised Flemish teaching in the north, in exchange for silence on the register. It buys years. It costs the Walloon and Liberal benches every one of them."
 BELDNC_a_the_settlement_holds:0 "The Settlement Holds"
 BELDNC_a_the_settlement_holds_desc:0 "Another election, another Catholic majority, the register untouched. Thirty years of continuous government is not an accident and the party knows precisely which votes bought it. The question is only whether the wing that supplies those votes is ever let into the cabinet."
 BELDNC_a_the_right_votes_the_colony:0 "The Right Votes the Colony"
 BELDNC_a_the_right_votes_the_colony_desc:0 "The Catholic majority will take the Congo after all, because leaving it to the King has become more dangerous than annexing it. The cession is voted as the King's lawyers drafted it, with his charitable foundation intact and no inquiry into anything before the signature."
 BELDNC_a_the_house_votes_the_estate:0 "The House Votes the Estate"
 BELDNC_a_the_house_votes_the_estate_desc:0 "The left will take the colony and say why: the concession regime broken, the tally abolished, the commission's findings printed as an annex to the bill. It is the honest version and it costs the government everything it has, because the King's friends will fight every clause of it."
 bel_dnc.100.t:0 "The Register of Voters"
 bel_dnc.100.d:0 "The clerk of the arrondissement has the lists in front of him: one column for the vote every man has, one for the vote a householder of thirty-five with legitimate children adds, one for the two votes a diploma or a public office adds. Nobody in the kingdom has more than three and nobody in the kingdom believes the arrangement is permanent. The Catholic benches call it the settlement of 1893. The Workers' Party calls it a fraud with a legal signature. Both sides are counting the same columns and arriving at different countries."
 bel_dnc.100.a:0 "The law of 1893 is the law. Let the register stand."
 bel_dnc.100.b:0 "Order a public count of the supplementary votes."
 bel_dnc.100.c:0 "Promise the Chamber a commission on the franchise."
 BEL_a_100a_tt:0 "The register is left exactly as it was written, and so is the majority that depends on it."
 BEL_a_100b_tt:0 "Printing the arithmetic does more damage to it than any speech has managed."
 BEL_a_100c_tt:0 "A commission is promised. Commissions have a way of reporting."
 bel_dnc.101.t:0 "The King Does Not Wait for a Countersignature"
 bel_dnc.101.d:0 "A decree has gone out from Laeken on the administration of the Free State, and no Belgian minister has signed it, because the Free State is not Belgian and the King insists that no Belgian minister need be asked. The constitution is clear enough about acts of the Crown at home. It says nothing about a sovereign who is also somebody else's sovereign. The ministry can pretend it saw nothing, refuse and fall, or lay the whole correspondence on the table of the House and let the country read it."
 bel_dnc.101.a:0 "Countersign it and say the matter is not ours."
 bel_dnc.101.b:0 "Refuse. The ministry will resign if it must."
 bel_dnc.101.c:0 "Lay the correspondence before the Chamber."
 bel_dnc.102.t:0 "A Deputation from the Maison du Peuple"
 bel_dnc.102.d:0 "Vandervelde has come with the deputation and has been perfectly civil about it. The party is not asking for a revolution; it is asking for one man's vote to weigh what another man's weighs, and it is explaining, in the tone of a man reading out a timetable, what the pits and the tramways and the glassworks will do if the answer is no. Behind him the Ghent and Charleroi federations have already voted the strike fund. The government may talk, or it may put the gendarmerie on the streets and find out how long a country like ours can hold its breath."
 bel_dnc.102.a:0 "Receive the deputation and hear it out."
 bel_dnc.102.b:0 "Answer it with the gendarmerie."
 bel_dnc.102.c:0 "Offer the commission and nothing more."
 bel_dnc.103.t:0 "Four Hundred Thousand Folded Arms"
 bel_dnc.103.d:0 "The strike is total and it is calm, which is the frightening part. Party stewards are directing traffic in Ghent, the strike committees are feeding children in the Borinage, and the arrests the Ministry of Justice expected have not been needed. It is a general strike run like a national holiday, and its single demand is written on every banner in two languages. The government can promise the commission the party wants, or it can wait, count the idle furnaces and hope the funds run out before the patience does."
 bel_dnc.103.a:0 "Promise the commission and end it."
 bel_dnc.103.b:0 "Wait. The strike fund is not bottomless."
 bel_dnc.104.t:0 "The Vote That Abolishes Its Own Majority"
 bel_dnc.104.d:0 "The bill is on the table and every deputy in the House can do the arithmetic. Strike out the supplementary votes and perhaps forty seats change hands at the next election, most of them belonging to men who must vote on the bill tonight. The Senate is elected on a narrower franchise still and has already let it be known what it thinks. There is a middle course, as there always is: abolish the plural vote for the communes and the provinces, leave it standing for the Chamber, and call the half a victory."
 bel_dnc.104.a:0 "Carry it whole. One man, one vote."
 bel_dnc.104.b:0 "Carry it for the communes and provinces only."
 bel_dnc.104.c:0 "Withdraw the bill. The country is not ready."
 bel_dnc.105.t:0 "A Message from the Throne"
 bel_dnc.105.d:0 "The King has written to the Chamber directly, and the letter does not read like a speech from the throne. It is an argument: on the army, on the franchise, and above all on the colony, which he reminds the deputies has never cost them a centime and is therefore none of their business. The President of the Chamber holds the sealed message and is waiting to be told whether it will be read into the record. Either answer he gives will be in every newspaper in Europe by Thursday."
 bel_dnc.105.a:0 "Let it be read into the record."
 bel_dnc.105.b:0 "Have the President rule it out of order."
 bel_dnc.106.t:0 "The Session Is Closed"
 bel_dnc.106.d:0 "The prorogation is signed. The deputies have gone back to Bruges and Verviers and Namur, the estimates will be carried by royal decree, and the Palace has become the government in the plainest sense the word allows. There is no article of the constitution that forbids this and no precedent in seventy years that permits it. The only question left is when the House sits again, and whether the men who come back to it will still recognise the country that sent them."
 bel_dnc.106.a:0 "It will sit again when the estimates are law."
 bel_dnc.106.b:0 "Recall it after ninety days. Let the point be made."
 bel_dnc.107.t:0 "The Majority Is Returned Again"
 bel_dnc.107.d:0 "Another general election, another Catholic majority, and the register has not been touched. The party has now governed without interruption for longer than most of its deputies have been in public life, and it knows exactly which arrondissements and which votes have done it. Nearly all of them are Flemish, rural and Catholic, and nearly none of their concerns have ever reached the cabinet. The wing that wins the elections has still never been asked to help govern."
 bel_dnc.107.a:0 "Nothing succeeds like a majority. Change nothing."
 bel_dnc.107.b:0 "Take the Flemish wing into the cabinet."
 bel_dnc.108.t:0 "The Cartel Has a Majority and No Programme"
 bel_dnc.108.d:0 "The bloc has won, which was the easy part. Now the Liberals must decide whether they will sit in a cabinet with Socialists, and the Socialists must decide what they will charge for their votes if they do not. Neither party has thought past the franchise, and the one file waiting on the table of the new government is the colonial question, which the left has been denouncing from the benches for ten years and now owns."
 bel_dnc.108.a:0 "A cabinet with the Workers' Party in it."
 bel_dnc.108.b:0 "A Liberal cabinet on Socialist votes."
 bel_dnc.109.t:0 "The Palace Is the Government"
 bel_dnc.109.d:0 "Ministers are appointed at Laeken and dismissed there, the estimates go through by decree whenever the House hesitates, and the King's private secretariat now drafts more policy than the cabinet does. The forms are all observed. The forms are all that is observed. Abroad the powers have begun to write to the Palace directly on the colonial question, which the King regards as the highest compliment the arrangement has yet received."
 bel_dnc.109.a:0 "Rule by decree and be done with the pretence."
 bel_dnc.109.b:0 "Keep a ministry for appearances."
 bel_dnc.110.t:0 "The Cession, As the King's Lawyers Wrote It"
 bel_dnc.110.d:0 "The right will vote the colony, on the understanding that nothing before the signature is inquired into. The bill leaves the King's foundation intact, indemnifies the concession companies, and contains no clause that a court could ever read as an admission. The Catholic benches call this continuity of administration. The left calls it a receipt. The only real choice in front of the government is whether a charter and a reform clause are attached to the text, and what the Palace will do if they are."
 bel_dnc.110.a:0 "Vote it as drafted. Continuity, nothing more."
 bel_dnc.110.b:0 "Attach a colonial charter and a reform clause."
 bel_dnc.111.t:0 "The Bill and the Annex"
 bel_dnc.111.d:0 "The left's bill takes the colony and says out loud why it is being taken. The concession regime is broken in the first article, the tally abolished in the second, and the commission's findings are printed as an annex so that no future minister can claim the Chamber did not know. Every friend the King has in Brussels will fight every clause, the timetable will slip by months, and the government will spend political capital it does not have. It is also the only version of the bill that anybody in London will believe."
 bel_dnc.111.a:0 "Send the bill up at once and argue later."
 bel_dnc.111.b:0 "Print the findings as an annex and take the fight."
 bel_dnc.112.t:0 "The Pamphlets Answer Back"
 bel_dnc.112.d:0 "Defending the Free State in the chancelleries is one thing; defending it in print is another. Morel's association publishes faster than the government can reply, the lantern lectures fill halls in Liverpool and Boston, and the Belgian legations are reduced to writing letters to editors who print them next to a photograph. A press bureau of our own can be set up within the month. It will cost the government its dignity and will not change a single photograph."
 bel_dnc.112.a:0 "Set up a press bureau and answer them in kind."
 bel_dnc.112.b:0 "Say nothing. The King's affairs are the King's."
 bel_dnc.113.t:0 "The Register Is One Line Long"
 bel_dnc.113.d:0 "The clerk's lists have two columns now: the name, and the vote. Every supplementary vote in the kingdom has been struck out, the arrondissements have been redrawn to match, and the majority that governed Belgium for a generation has gone with the arithmetic that made it. What replaces it is not yet clear. What is clear is that when the next mobilisation order goes out, it goes out to a country whose men all count the same, and the recruiting officers have already noticed the difference."
 bel_dnc.113.a:0 "One man. One vote. Let the country be governed by it."
 BEL_a_113a_tt:0 "The plural franchise is gone from the statute book, and the army will be raised from a country of equals."
 bel_dnc.114.t:0 "The Chamber Adjourns Itself"
 bel_dnc.114.d:0 "It was not prorogued. It simply stopped: quorum calls that failed three sittings running, committees that no longer report, deputies who have discovered that their provinces need them more than the House does. The government has been ruling past the Chamber for so long that the Chamber has quietly agreed to be ruled past. Nobody has resisted and nobody has resigned. The estimates will be signed at Laeken on Tuesday, as they were last quarter."
 bel_dnc.114.a:0 "Let it sleep. The country is being governed."
 bel_dnc.114.b:0 "Recall it and put the estimates to a vote."
 BEL_a_114a_tt:0 "The House is not dissolved and not abolished. It has simply stopped being asked."
 bel_dnc.115.t:0 "The Deputation from Ghent"
 bel_dnc.115.d:0 "They have come from the university and the Flemish societies with a petition and a very short list: teaching in Dutch at Ghent, Dutch in the lower courts, and an army that gives its orders in a language its recruits understand. They are Catholics, most of them, and they voted for this government. The Walloon benches and the Liberal press have already said what a Flemish university would mean, and they have said it in terms that make the third demand harder than the first two put together."
 bel_dnc.115.a:0 "Grant the Flemish sections at Ghent."
 bel_dnc.115.b:0 "Dutch in the lower courts, and no further."
 bel_dnc.115.c:0 "Refuse. The kingdom is governed in one language."
 BEL_a_the_plural_franchise:0 "The Plural Franchise"
 BEL_a_the_plural_franchise_desc:0 "Universal manhood suffrage, weighted by property, diploma and household. It steadies the propertied order and holds the political classes together. It also tells a large part of the kingdom that its men count for less, and those men are the ones the army will have to call up."
 BEL_a_the_royal_prerogative:0 "The Royal Prerogative"
 BEL_a_the_royal_prerogative_desc:0 "How much of the kingdom is governed from the Palace rather than the Chamber. Decisions come faster and cost less argument. They also cost the ministry the country's confidence, one decree at a time."
 BEL_a_the_catholic_settlement:0 "The Catholic Settlement"
 BEL_a_the_catholic_settlement_desc:0 "Thirty years of unbroken government, the schools subsidised, the countryside solid and the register untouched. It is stable, disciplined and entirely uninterested in reform, and it has no idea how much it is storing up."
 BEL_a_the_cartel_of_the_left:0 "The Cartel of the Left"
 BEL_a_the_cartel_of_the_left_desc:0 "Liberals and Socialists in one bloc against the plural vote. It governs badly, argues constantly and moves faster on the colony and the army than any Catholic ministry ever would."
 BEL_a_the_crown_governs:0 "The Crown Governs"
 BEL_a_the_crown_governs_desc:0 "The King decides and the ministry explains. Political power is abundant and cheap. Nothing else is."
 BEL_a_the_school_grant:0 "The Flemish School Grant"
 BEL_a_the_school_grant_desc:0 "Subsidised teaching in Dutch in the northern communes, paid for by the majority that needs those votes. Flanders is quieter. The Walloon and Liberal benches are not."
 BEL_a_the_general_strike:0 "The General Strike"
 BEL_a_the_general_strike_desc:0 "The pits are idle, the trams are stopped and the furnaces are cooling. Nothing is being built and nothing is being decided until the men go back."
 BEL_a_the_settlement_holds:0 "The Settlement Holds"
 BEL_a_the_settlement_holds_desc:0 "The majority has been returned again and the register survived another election. Government is steady, predictable and increasingly deaf."
 BEL_a_the_single_vote:0 "One Man, One Vote"
 BEL_a_the_single_vote_desc:0 "The supplementary votes are struck out. The old majority is gone, the political classes are unsettled, and for the first time the men who will be called up are counted the same as the men who call them."
 BEL_a_the_chamber_prorogued:0 "The Chamber Prorogued"
 BEL_a_the_chamber_prorogued_desc:0 "The session is closed and the estimates are carried by decree. The government has never been so free or so alone."
 BEL_a_the_silent_house:0 "The Silent House"
 BEL_a_the_silent_house_desc:0 "The Chamber still exists, still meets and still fails to make a quorum. Nobody has abolished it. Nobody has needed to."
 BEL_a_the_press_bureau:0 "The Congo Press Bureau"
 BEL_a_the_press_bureau_desc:0 "A government office that exists to answer pamphlets with pamphlets. It is diligent, it is well funded, and it has never once outrun a photograph."
 BEL_auguste_beernaert:0 "Auguste Beernaert"
 BEL_auguste_beernaert_desc:0 "Catholic, former head of government, and the man in his own party most willing to say that the settlement cannot hold forever. He would rather buy Flanders with schools than lose it, and he has been saying so about the Congo for longer than is comfortable."
 BEL_charles_woeste:0 "Charles Woeste"
 BEL_charles_woeste_desc:0 "Leader of the Catholic right and the most formidable obstacle in the Chamber. He has defended the plural vote, the French army of a bilingual kingdom and the King's Free State with the same unanswerable manner, and he has never once been persuaded of anything."
 BELDNC_c_the_estate_of_the_king: "The Estate of the King"
 BELDNC_c_the_estate_of_the_king_desc: "The Congo Free State is not a Belgian colony. It is a sovereign estate held by the man who is also our King, governed from a room in Brussels, policed by a force no minister commands. Belgium decides nothing there and will be asked to answer for everything."
 BELDNC_c_the_kings_answer: "The King's Answer"
 BELDNC_c_the_kings_answer_desc: "The government will say what the Palace wishes said: that the Free State is a foreign sovereignty, that its administration is its own, and that a Belgian minister has no standing to inquire. The Chamber falls quiet for a season. Each such answer is remembered, and the next one buys less."
 BELDNC_c_the_interpellation: "The Interpellation"
 BELDNC_c_the_interpellation_desc: "Vandervelde rises with the Antwerp shipping returns in his hand and asks the government whose rubber it is that leaves our quays, at what price, and paid to whom. The debate runs three days, the galleries are full for every hour of it, and the Congo can never again be called a foreign question in this House."
 BELDNC_c_the_quota_at_full_tally: "The Quota at Full Tally"
 BELDNC_c_the_quota_at_full_tally_desc: "The Domaine de la Couronne is worked to its limit and the returns come home as stone: arcades, glasshouses, a school for the colonial service. Brussels gains a boulevard. The stations upriver are given a tally they can meet only one way, and the missionaries write down how."
 BELDNC_c_the_west_african_bureau: "The West African Bureau"
 BELDNC_c_the_west_african_bureau_desc: "A press office is opened to answer Liverpool in its own language: paid correspondents in three capitals, pamphlets by the crate, a lecture tour of friendly clergymen who have seen the stations and found them orderly. We will not leave the field to Morel. Denial is cheap to print and ruinously dear to keep up."
 BELDNC_c_the_donation_royale: "The Donation Royale"
 BELDNC_c_the_donation_royale_desc: "The King bequeaths the Free State to Belgium by testament, and asks in the same breath that nothing be altered while he lives. The Chamber now holds a claim written on paper and witnessed by a notary. What it does not hold is a date, a valuation, or any means of obliging a man to die on schedule."
 BELDNC_c_the_kings_own_commission: "The King's Own Commission"
 BELDNC_c_the_kings_own_commission_desc: "Three judges named by the Palace go up the river to disprove the accusations, and are given every facility except a free hand. They will hear the missionaries, the agents and the villagers of the Mongala, and they will come back with a text nobody in Brussels has read and everybody in Brussels has already answered."
 BELDNC_c_the_motion_of_the_left: "The Motion of the Left"
 BELDNC_c_the_motion_of_the_left_desc: "Liberals and socialists move jointly that the Chamber declare the Congo Belgian and place its administration under a minister answerable to the House. The Catholic benches split. The motion does not carry, and after it nothing is unsayable."
 BELDNC_c_the_colonial_charter_drafted: "A Charter Before a Colony"
 BELDNC_c_the_colonial_charter_drafted_desc: "A commission of the House drafts the law that would govern a colony we do not own: a minister answerable to the Chamber, a council, accounts laid before the House, no monopoly of the soil and no levy of labour. If the day comes, Belgium will not have to improvise it in a fortnight under a foreign ultimatum."
 BELDNC_c_the_estate_secured: "The Estate Secured"
 BELDNC_c_the_estate_secured_desc: "The sovereign of the Free State is answerable to no chamber, and the government says so in the Moniteur. The question is closed by decree and the ministry is stronger for the quiet. Abroad the file only grows, and the Chamber's claim goes cold."
 BELDNC_c_the_commission_for_the_natives: "The Commission for the Protection of the Natives"
 BELDNC_c_the_commission_for_the_natives_desc: "The labour tax is cut, the sentries are called in from the villages, and a standing commission of missionaries and magistrates is given the right to visit. It is reform in the King's hands, not ours, and the Palace makes the government pay for every clause."
 BELDNC_c_the_terms_of_cession: "The Terms of Cession"
 BELDNC_c_the_terms_of_cession_desc: "The King will part with the estate on conditions: the works of the Crown Foundation go on, the domain lands are set aside, and his administration is not to be put on trial. The treaty can be signed tomorrow if the Chamber will swallow them."
 BELDNC_c_belgium_declines: "Belgium Declines the Inheritance"
 BELDNC_c_belgium_declines_desc: "A kingdom of seven millions cannot police a basin the size of Europe and should not pretend otherwise. Let the Chamber say so plainly, strike the reversion from the record, and let the powers divide what they have been circling for twenty years. We will be poorer, smaller, and answerable for nothing."
 BELDNC_c_the_note_of_the_powers: "The Note of the Powers"
 BELDNC_c_the_note_of_the_powers_desc: "London and Berlin invoke Article VI of the Berlin Act and ask Brussels, in the politest language available, what it intends to do about the basin. The answer expected is annexation, under guarantees drafted in other capitals and on a timetable that is not ours. A refusal will be read as an admission."
 BELDNC_c_the_vote_on_the_cession: "The Vote on the Cession"
 BELDNC_c_the_vote_on_the_cession_desc: "The treaty of cession and the colonial charter go to the House together, and the benches divide as they have not divided since the school war. A majority is not a mandate; half of those who vote for it will do so holding their noses and will say so afterwards. Whatever the number, Belgium wakes up owning a river."
 BELDNC_c_the_colonial_charter: "The Colonial Charter"
 BELDNC_c_the_colonial_charter_desc: "The colony is governed by law at last: a Minister of Colonies who answers to the Chamber, a Colonial Council that sees every decree before it is signed, accounts laid on the table each session, and no ordinance the House may not read. The estate becomes an administration, and an administration can be questioned."
 BELDNC_c_the_end_of_the_concessions: "The End of the Concessions"
 BELDNC_c_the_end_of_the_concessions_desc: "The great concession companies lose their monopoly of the soil and their right to levy labour. The tally books are closed and the sentries disarmed. The agents protest in Antwerp, the returns fall away, and the accusation that forced us to take the colony stops being true."
 BELDNC_c_the_force_publique: "The Force Publique"
 BELDNC_c_the_force_publique_desc: "Twelve thousand men under Belgian officers pass from the King's service to the state's: reorganised in companies, given a school at Boma, made answerable to a minister who can be asked about them. They remain what they were recruited and trained to be, and the villages upriver remember exactly what that was."
 BELDNC_c_the_katanga_line: "The Katanga Line"
 BELDNC_c_the_katanga_line_desc: "Rail from the copper country towards the Cape line, and around the falls at Stanleyville, so that the colony is crossed by something other than porters. The rights conceded to foreign houses lapse, and the Comite Special du Katanga comes under the charter."
 BELDNC_c_the_sleeping_sickness_service: "The Sleeping Sickness Service"
 BELDNC_c_the_sleeping_sickness_service_desc: "Doctors from the school at Antwerp go up the river with lamps and microscopes: screening posts at the ports, isolation camps on the Kasai, a standing war on the tsetse fly. It is the first thing Belgium does in the Congo that the world applauds."
 BELDNC_c_the_colonial_council: "The Colonial Council"
 BELDNC_c_the_colonial_council_desc: "Fourteen men, half of them named by the Chamber and the Senate, sit on every decree before it is signed and may send it back. The colony stops being a weight the ministry carries alone in a locked room and becomes a business of the state, argued over line by line like a canal or a customs schedule."
 BELDNC_c_the_question_closed: "The Question Closed"
 BELDNC_c_the_question_closed_desc: "A decade after it was asked, the question of the Congo is answered: a colony under law, a charter the Chamber wrote itself, an administration reporting to a minister who can be voted out of office. The King's estate is wound up and struck from the ledger, and what remains belongs to Belgium and to nobody in a palace."
 bel_dnc_206_a_bonus: "The Kingdom at Home"
 BEL_c_the_ratchet_tt: "§RA denial buys quiet now: scandal falls at once, and every rung of the ladder moves three points nearer for the rest of the decade.§!"
 BEL_c_reversion_tt: "§YBelgium's claim to the succession of the Free State now exists on paper.§!"
 BEL_c_annex_tt: "§GThe basin passes to Belgium: Congo, Stanleyville, Rwanda, Burundi and Cameroun - and the weight that comes with them.§!"
 BEL_c_refuse_tt: "§RThe colonial question is closed against Belgium. The basin will be administered by others.§!"
 BEL_c_the_official_denial: "The Official Denial"
 BEL_c_the_official_denial_desc: "The government answers every question about the Free State with the same paragraph. It holds the benches and empties the lobbies, and no foreign ministry believes a word of it."
 BEL_c_the_house_in_session: "The House in Session"
 BEL_c_the_house_in_session_desc: "The Congo has the floor and will not give it up. Ministers spend their days answering members instead of governing."
 BEL_c_the_kings_works: "The King's Works"
 BEL_c_the_kings_works_desc: "Arcades, avenues and a museum at Tervuren rise on returns nobody in Brussels wishes to trace. The masons are busy and the foreign press has its caption."
 BEL_c_the_press_bureau: "The West African Bureau"
 BEL_c_the_press_bureau_desc: "Correspondents on a retainer, pamphlets in three languages, a lecture circuit of sympathetic clergy. At home it works. Abroad it convinces nobody who was not already convinced."
 BEL_c_the_estate_entrenched: "The Estate Entrenched"
 BEL_c_the_estate_entrenched_desc: "The Crown's sovereignty over the basin is declared beyond the competence of the Chamber. The ministry governs undisturbed, and Belgium is spoken of abroad the way the Free State is."
 BEL_c_the_commission_for_the_natives: "The Commission for the Protection of the Natives"
 BEL_c_the_commission_for_the_natives_desc: "Missionaries and magistrates with a warrant to visit any station in the basin. The worst of the abuses are checked without a line of the constitution being touched, and the Palace never forgives it."
 BEL_c_the_kings_conditions: "The King's Conditions"
 BEL_c_the_kings_conditions_desc: "The Crown Foundation keeps its domains and its building programme, and the reign is not to be examined. Belgium takes the colony with a mortgage of silence written into the treaty."
 BEL_c_the_weight_of_the_basin: "The Weight of the Basin"
 BEL_c_the_weight_of_the_basin_desc: "Seventy-six times the size of the kingdom, four hundred stations, a river that governs itself. Every ministry from now on has a Congo despatch box, and every session has a Congo debate."
 BEL_c_the_end_of_the_concessions: "The End of the Concessions"
 BEL_c_the_end_of_the_concessions_desc: "The monopoly of the soil is broken and the labour levy abolished. The stations bring in less and the villages stop emptying."
 BEL_c_the_force_publique: "The Force Publique"
 BEL_c_the_force_publique_desc: "A standing colonial army of Congolese soldiers and Belgian officers, drilled, schooled and answerable to a minister. It is the largest force the kingdom commands, and it is not in Belgium."
 BEL_c_the_katanga_line: "The Katanga Line"
 BEL_c_the_katanga_line_desc: "Rail and river joined at last. Copper, tin and palm move without porters, and the interior is a fortnight nearer Antwerp."
 BEL_c_the_sleeping_sickness_service: "The Sleeping Sickness Service"
 BEL_c_the_sleeping_sickness_service_desc: "Screening posts, isolation camps and a laboratory at Leopoldville. Whole districts that were emptying begin to fill again, and Belgium is praised in journals that used to damn it."
 BEL_c_the_colonial_council: "The Colonial Council"
 BEL_c_the_colonial_council_desc: "Fourteen members, half of them parliamentary, weighing every decree before the minister signs. The burden of the colony is shared out and the ministry stops carrying it alone."
 BEL_c_the_inspectorate: "The International Inspectorate"
 BEL_c_the_inspectorate_desc: "The powers approve of Belgium and reserve the right to look. Consuls travel where they please, the open door is guaranteed by treaty, and the colony is ours on somebody else's conditions."
 BEL_c_the_basin_passed_to_others: "The Basin Passed to Others"
 BEL_c_the_basin_passed_to_others_desc: "The Congo is administered by a commission of the powers. Belgium is the country that was offered an empire and said no, and the chanceries have not stopped repeating it."
 BEL_c_the_home_kingdom: "The Kingdom at Home"
 BEL_c_the_home_kingdom_desc: "Everything the colony would have swallowed goes into the kingdom instead: schools, canals, workshops and the coalfields of the Campine. A small country, thoroughly built."
 BEL_c_the_question_closed: "The Question Closed"
 BEL_c_the_question_closed_desc: "The Congo has a charter, a council and a minister, and the Chamber has stopped shouting about it. The decade that began with a scandal ends with an administration."
 bel_dnc.200.t: "Whose Congo Is It?"
 bel_dnc.200.d: "The despatch box holds three papers this morning: a Liverpool pamphlet on the rubber quotas of the Mongala, a note from the Foreign Office asking politely what Belgium intends, and a reminder from the Palace that the Free State is a sovereign power with which the Kingdom of Belgium is merely in personal union. The government must decide what the Chamber is permitted to ask, knowing that whatever it is permitted to ask today it will demand tomorrow."
 bel_dnc.200.a: "Let the House ask, and let it be answered."
 bel_dnc.200.b: "The Free State is a foreign sovereignty."
 bel_dnc.201.t: "The King's Works"
 bel_dnc.201.d: "The scaffolding comes down at the arcades, and the museum at Tervuren opens its African galleries. Not one franc of it appears in any Belgian estimate, and every newspaper in Europe has printed the arithmetic that connects the stonework to the tally books of the upper river. The Palace has sent the government an invitation to the opening ceremony."
 bel_dnc.201.a: "The government will attend."
 bel_dnc.201.b: "Let the Palace open it alone."
 bel_dnc.202.t: "The Commission Reports"
 bel_dnc.202.d: "The three judges are back from the river, and the text they have brought with them is not the text they were sent to write. It confirms the mutilations, the hostage houses and the impossible quotas, in the measured language of men who did not want to believe any of it. The Palace has already prepared a summary for publication. The full report is on the table, unread by anyone outside this room."
 bel_dnc.202.a: "Publish it entire."
 bel_dnc.202.b: "Publish the summary the Palace has prepared."
 bel_dnc.203.t: "The Text Reaches London"
 bel_dnc.203.d: "A clerk, a copyist or a conscience has done what we did not: the unabridged report is running in a London weekly, chapter by chapter, beside the summary we published. The comparison is the story. The Congo Reform Association could not have written a better advertisement, and it did not have to."
 bel_dnc.203.a: "Admit it, and lay the whole text before the House."
 bel_dnc.203.b: "The text is a forgery and we will say so."
 bel_dnc.204.t: "The Vote on the Cession"
 bel_dnc.204.d: "The treaty of cession lies on the table with the colonial charter beside it. The right is uneasy, the left is triumphant and suspicious, and the Palace has sent word twice this week about the domains of the Crown Foundation. A division now decides whether Belgium is a kingdom of six provinces or a kingdom with a river in Africa, and whether it takes that river on its own terms or on the King's."
 bel_dnc.204.a: "Carry the treaty, and the charter with it."
 bel_dnc.204.b: "Carry it on the King's conditions."
 bel_dnc.204.c: "The Chamber will not be hurried."
 bel_dnc.205.t: "The Note of the Powers"
 bel_dnc.205.d: "The note is signed in two chanceries and worded in one. Article VI of the Berlin Act obliges the signatories to care for the moral and material well-being of the natives; the signatories observe that the obligation is not being met; the signatories inquire what Belgium proposes. Behind the courtesy is a date, and behind the date is the suggestion that if Brussels will not act, others are prepared to."
 bel_dnc.205.a: "Accept the guarantees and take the colony."
 bel_dnc.205.b: "We take it, and answer to no one for it."
 bel_dnc.205.c: "Then let the powers keep it."
 bel_dnc.206.t: "The Inheritance Refused"
 bel_dnc.206.d: "The case against taking it has never been answered. Seven million Belgians cannot administer a basin of seventy-six times their own soil; the army is a lottery; the colony would be governed by whoever happens to be upriver. Refusing costs us a claim, an empire and the good opinion of every chancery that would rather Belgium held the Congo than Berlin or Paris. The Chamber is listening."
 bel_dnc.206.a: "Belgium is not a colonial power."
 bel_dnc.206.b: "One more session. The vote may yet be found."
 bel_dnc.207.t: "The Lantern Slides"
 bel_dnc.207.d: "Mrs Harris projects her photographs onto a bedsheet in a hall in Birmingham, and the hall is full. Morel has taken the same slides through sixty towns this year. Our lecturers have the Congo Free State on their side and the pictures against them, and the bureau reports that in three cities its meetings were laughed out of the room."
 bel_dnc.207.a: "Send our own missionaries to answer them."
 bel_dnc.207.b: "Say nothing further. Answering it feeds it."
 BELDNC_v_the_equality_law:0 "The Equality Law"
 BELDNC_v_the_equality_law_desc:0 "The law of 1898 declares that statutes shall be voted, sanctioned and published in French and in Dutch, and that both texts are official. It was carried after thirty years of petitions and it changed the wording of the Moniteur and nothing else. The courts still sit in French, the regiments drill in French, Ghent lectures in French. The Movement has begun to present the bill."
 BELDNC_v_the_flemish_petitions:0 "The Petitions From Flanders"
 BELDNC_v_the_flemish_petitions_desc:0 "The Willemsfonds, the Davidsfonds and the Antwerp Meeting party send their delegations to Brussels with the same three demands each time: the courts, the schools, the army. Receiving them costs the ministry nothing but an afternoon. Being seen to receive them costs it the Brussels liberal press, which reads every Flemish delegation as a threat to the language of the state."
 BELDNC_v_the_french_state:0 "The State Speaks French"
 BELDNC_v_the_french_state_desc:0 "Belgium was made in French in 1830 and is governed in French in 1900. The magistracy, the officer corps, the higher administration and the great industry of the Sambre and Meuse all speak one tongue, and the ministry declares plainly that this will not change. The Equality Law is a rule for printing statutes, not a programme for remaking the kingdom."
 BELDNC_v_dutch_in_the_courts:0 "Dutch in the Assize Courts"
 BELDNC_v_dutch_in_the_courts_desc:0 "Coremans has been asking the same question for years: what is a Flemish defendant to make of a trial conducted in a language he does not speak. The bill would admit Dutch pleading before the assize courts of the Flemish provinces, oblige the bench to follow it, and put translators where none stood. The bar of Brussels calls it the ruin of the magistracy."
 BELDNC_v_the_flemish_schools:0 "The Middle Schools of Flanders"
 BELDNC_v_the_flemish_schools_desc:0 "The state middle schools of Flanders teach in French to children who go home to Dutch, and the inspectors' own reports say what that costs. Making Dutch the language of instruction is cheap in money and dear in politics: every liberal deputy from Brussels and every Walloon industrialist reads it as the state teaching its own children to be foreigners."
 BELDNC_v_the_catholic_flemish_vote:0 "The Vote of the Flemish Countryside"
 BELDNC_v_the_catholic_flemish_vote_desc:0 "The Catholic majority rests on the rural arrondissements of Flanders, on parish priests and small farmers who vote as they are told and ask very little. The ministry can bank those seats and hand back nothing at all: no language law, no Flemish under-secretary, no promise beyond the next election. Everyone in Ghent knows the price is only deferred."
 BELDNC_v_the_word_of_command_stays:0 "The Word of Command Stays French"
 BELDNC_v_the_word_of_command_stays_desc:0 "Every order in the Belgian army is given in French, to a rank and file that is more than half Flemish. The staff argues that one tongue of command is worth more than any grievance, that mixed regiments cannot be drilled in two languages, and that the question can wait. The staff is right about the drill and wrong about the waiting."
 BELDNC_v_the_language_of_command:0 "The Language of Command"
 BELDNC_v_the_language_of_command_desc:0 "Bilingual cadres, Dutch instruction for Flemish recruits, and officers required to pass in both tongues. The staff protests that it will cost two years of readiness and a generation of officers who learned their trade in one language only. It will. It also takes from the Flemish Movement the single grievance that turns farm boys into militants."
 BELDNC_v_the_university_at_ghent:0 "The University at Ghent"
 BELDNC_v_the_university_at_ghent_desc:0 "The state university in the middle of Flanders lectures in French. Vervlaamsing would make it the first Dutch-language university in the kingdom, and it is the demand the Movement has made its own: not a courtesy but a proof. The French faculty, the Brussels press and a good part of the Liberal party will treat the vote as a national injury."
 BELDNC_v_the_flamingant_press:0 "The Flamingant Press"
 BELDNC_v_the_flamingant_press_desc:0 "The parquets of Antwerp and Ghent have plenty of law to work with: incitement, insult to the army, subscriptions raised without authorisation. Fines, seizures and a few closures would clear the noisiest sheets off the streets within a season. The editors will be back, poorer, better known and no longer arguing about grammar."
 BELDNC_v_the_ministry_speaks_french:0 "The Ministries Answer in French"
 BELDNC_v_the_ministry_speaks_french_desc:0 "A circular to every department: correspondence with the public, railway service, and the whole higher administration are conducted in French, and officials who wish to be promoted will write in it. The machine runs smoothly and cheaply. It also tells four million people, in writing, what their language is worth to the state that taxes them."
 BELDNC_v_the_walloon_leagues:0 "The Walloon Leagues"
 BELDNC_v_the_walloon_leagues_desc:0 "Wallonia has watched the concessions and drawn its own conclusion. The Ligue wallonne of Liege, the leagues of Charleroi and Mons, the Walloon societies of Brussels: they were founded to defend French in Belgium and they have begun to speak instead of Wallonia in Belgium. The ministry must decide what to do with a movement that is loyal, French-speaking, and no longer unitary."
 BELDNC_v_the_two_sections:0 "Two Sections, One Ministry"
 BELDNC_v_the_two_sections_desc:0 "Split the central departments into a Flemish and a Walloon section, each staffed by men who can be understood in the provinces they administer. It is not federalism and nobody will call it that, but every file that no longer needs translating is a quarrel that no longer reaches the Chamber."
 BELDNC_v_the_movement_turns_political:0 "The Movement Turns Political"
 BELDNC_v_the_movement_turns_political_desc:0 "For fifty years the Flemish Movement asked for language and left politics to the parties. That is ending. The young men of the student congresses talk of a Flemish list, of candidates who will not sit with the Brussels leadership, of a programme rather than a petition. Whatever the ministry does now, it does to an organisation and not to a plea."
 BELDNC_v_the_congress_of_wallonia:0 "The Congress of Wallonia"
 BELDNC_v_the_congress_of_wallonia_desc:0 "The leagues have called a congress at Liege to consider the standing of Wallonia in the kingdom, and the agenda includes the words administrative separation. Delegates from every Walloon province, the socialist federations of the Borinage, and a bench of deputies who are also ministers. Whatever it resolves will be quoted against Belgium for thirty years."
 BELDNC_v_the_language_frontier:0 "The Language Frontier"
 BELDNC_v_the_language_frontier_desc:0 "Draw the line and write it into law: Dutch north of it, French south of it, the capital bilingual and the communes on the edge counted once and left alone. It ends the yearly quarrel over which villages are which and it gives both movements exactly what they asked for, which is the last thing either of them wanted to receive from a ministry."
 BELDNC_v_the_hour_is_late:0 "The Hour Is Late"
 BELDNC_v_the_hour_is_late_desc:0 "The Movement is no longer petitioning and no longer small. There is one session left in which a language law could still be carried as a favour rather than conceded as a defeat, and after that the initiative belongs to men the ministry has never met. Offer everything, offer half, or hold the line and find out what has been built."
 BELDNC_v_the_belgium_of_two_peoples:0 "A Belgium of Two Peoples"
 BELDNC_v_the_belgium_of_two_peoples_desc:0 "The kingdom is written down at last as what it has always been: two peoples under one crown, each with its language secured in law, its schools, its courts and its share of the administration. The unitary Belgium of 1830 is finished, and the men who made this admit it. What replaces it can be defended by both halves, which the old one could not."
 BELDNC_v_the_unitary_kingdom:0 "One Kingdom, One Tongue"
 BELDNC_v_the_unitary_kingdom_desc:0 "The state closes the question by refusing it. French remains the language of command, of the higher administration and of the magistracy, the concessions stop where they stand, and the movements are told that the constitution is not open. It is a strong government and a coherent army, resting on a grievance that has been organised and will not now dissolve."
 bel_dnc.300.t:0 "The Law and the Register"
 bel_dnc.300.d:0 "The Equality Law is in force and the clerks of the Moniteur have discovered what it means: every statute set twice, both texts official, neither of them the one anybody in the departments actually works from. The Flemish deputies who carried the law want the practice extended before the habit sets, from the statute book to the register offices, the tax notices and the railway timetables. The minister of justice observes that this was not what the Chamber voted."
 bel_dnc.300.a:0 "Extend it to the registers and the notices."
 bel_dnc.300.b:0 "The statute book, and no further."
 bel_dnc.301.t:0 "The Delegations at the Ministry"
 bel_dnc.301.d:0 "Three deputations in one week, all polite, all carrying the same memorandum in a different binding. They ask for a standing commission on the language question with Flemish members on it, and they make it plain that they will read a refusal as an answer to the whole Movement rather than to themselves. In the antechamber a correspondent of the Brussels liberal press counts the visitors and writes down their names."
 bel_dnc.301.a:0 "Name the commission and seat them on it."
 bel_dnc.301.b:0 "Receive them warmly and promise study."
 bel_dnc.302.t:0 "The Bench Learns a Second Language"
 bel_dnc.302.d:0 "The assize courts of the Flemish provinces now hear Dutch, and the first months have produced exactly the difficulties the bar predicted and none of the collapse. Coremans is already drafting the extension to the correctional courts, where the great mass of ordinary defendants actually stand. The magistracy replies that it has conceded once and that a concession which is immediately built upon is not a concession but an instalment."
 bel_dnc.302.a:0 "Carry the extension to the correctional courts."
 bel_dnc.302.b:0 "The assize courts, and there we stop."
 bel_dnc.303.t:0 "The Seats of the Countryside"
 bel_dnc.303.d:0 "The count is in and the rural arrondissements of Flanders have again returned the Catholic list almost entire. The parish clergy delivered the vote, the farmers asked nothing, and the ministry now holds a majority it did not have to buy. In the smoking room the Flemish members of that same majority observe, without raising their voices, that they have supplied the seats for a decade and have not once supplied a minister."
 bel_dnc.303.a:0 "Take the seats. They will vote for us again."
 bel_dnc.303.b:0 "Give them an under-secretary and a language bill."
 bel_dnc.304.t:0 "Ghent Speaks Dutch"
 bel_dnc.304.d:0 "The vote is carried and the university in the middle of Flanders will lecture in the language of the province around it. The French faculty has answered with a collective letter, half of it addressed to the ministry and half to the newspapers of Liege, asking whether the state now proposes to have no French university north of the Sambre at all. There is an obvious accommodation and it is expensive."
 bel_dnc.304.a:0 "Let the French section move to Liege."
 bel_dnc.304.b:0 "Keep both faculties at Ghent."
 bel_dnc.305.t:0 "The Regiments Relearn Their Orders"
 bel_dnc.305.d:0 "The circular has gone out and the army is discovering how much of itself was built on a single language. Officers who have commanded for twenty years must sit an examination; drill manuals must be reprinted; a Flemish recruit can at last be told what to do by a man who knows what he is saying. The staff asks only which shape the thing is to take, and offers two, one of which it clearly prefers."
 bel_dnc.305.a:0 "Bilingual cadres in every regiment."
 bel_dnc.305.b:0 "Flemish regiments and Walloon regiments."
 bel_dnc.306.t:0 "The Parquets Go to Work"
 bel_dnc.306.d:0 "Seizures at Antwerp, two closures at Ghent, and a prosecution for insult to the army that the defendant is plainly delighted to face. The sheets that mattered are off the streets and the men who wrote them are being carried through the town on other men's shoulders. The procureur asks whether to continue; he does not say what he thinks, which is itself an opinion."
 bel_dnc.306.a:0 "Continue. Fines, seizures and closures."
 bel_dnc.306.b:0 "Quash the prosecutions before they make martyrs."
 bel_dnc.307.t:0 "The Leagues of Liege and Charleroi"
 bel_dnc.307.d:0 "The Walloon leagues have sent their statutes to the ministry with a request for recognition and a covering letter that is franker than the statutes. They founded themselves to defend the French language in Belgium; they now find themselves defending Wallonia in Belgium, and they say so. Recognise them and the state has blessed a second nationalism. Forbid them and every quarry and pit from Mons to Verviers hears that Brussels has taken the other side."
 bel_dnc.307.a:0 "Recognise the leagues and seat their assembly."
 bel_dnc.307.b:0 "Let them meet. Say nothing at all."
 bel_dnc.307.c:0 "Forbid the leagues and dissolve their assembly."
 bel_dnc.308.t:0 "Two Sections, One Corridor"
 bel_dnc.308.d:0 "The departments have been split and the immediate discovery is that nobody agrees where an official belongs. The Flemish section wants men who can be understood in Bruges; the examinations board wants one standard for the whole kingdom; the officials themselves want to know which section a promotion comes from. Whichever rule is written now will be quoted in every appointment for a generation."
 bel_dnc.308.a:0 "Flemish officials for the Flemish provinces."
 bel_dnc.308.b:0 "One examination, sat in either language."
 bel_dnc.309.t:0 "A List of Their Own"
 bel_dnc.309.d:0 "The student congresses have produced a committee, the committee has produced a programme, and the programme ends with the word candidates. They will stand in Antwerp, in Ghent, in Aalst, against the parties that have been carrying their votes for thirty years. The party managers of all three benches agree on one thing only: that this is easier to buy now than to beat later."
 bel_dnc.309.a:0 "Carry a full language law before the poll."
 bel_dnc.309.b:0 "Buy the moderates a place at the table."
 bel_dnc.309.c:0 "Let them stand. We will beat them at the poll."
 bel_dnc.310.t:0 "The Congress at Liege"
 bel_dnc.310.d:0 "The hall is booked, the delegates are named, and the agenda has been printed with administrative separation on it in plain type. Deputies who sit with the government will be on the platform. The ministry can let it sit and be quoted forever, buy the leaders into the ministry before the doors open, or send the gendarmerie to Liege and find out how many Walloons think of themselves as Belgians first."
 bel_dnc.310.a:0 "Let the congress sit and hear what it says."
 bel_dnc.310.b:0 "Bind the leaders into the ministry first."
 bel_dnc.310.c:0 "The congress will not meet."
 bel_dnc.311.t:0 "The Frontier on the Map"
 bel_dnc.311.d:0 "The commission has drawn its line and the trouble is all in the last four kilometres. Around Brussels and along the edge from Ronse to Voeren sit communes that count both ways and would like to keep the choice. Fix them now and the map is closed for good; let them choose and the frontier is a negotiation that reopens at every census."
 bel_dnc.311.a:0 "Let the border communes choose, and Brussels be bilingual."
 bel_dnc.311.b:0 "The line is fixed. There will be no choosing."
 bel_dnc.312.t:0 "One Session Left"
 bel_dnc.312.d:0 "The Movement has a press, a treasury, a list of candidates and a following that no longer needs the parties. The ministry has one session in which a language law would still be received as a settlement rather than as a receipt. The whips have counted the votes for the whole bill and the counting was not encouraging; they have counted them for half of it and the answer was better. The third course is to say nothing and see what has been built."
 bel_dnc.312.a:0 "Carry the whole law in one session."
 bel_dnc.312.b:0 "Half of it. The schools, and nothing else."
 bel_dnc.312.c:0 "Hold the line and let them come."
 bel_dnc.313.t:0 "Two Peoples, One Crown"
 bel_dnc.313.d:0 "The settlement is voted and the kingdom has written down what it is. Flemish and Walloon are both in the statute, both in the schools, both in the courts, and both in the ranks. The unitary Belgium of the founders is over, and it went quietly, in committee, over the course of a decade. What the country has instead is a state that both of its peoples can be asked to defend without being asked to forget anything."
 bel_dnc.313.a:0 "Belgium is stronger for having admitted it."
 bel_dnc.313.b:0 "Now let the regiments be told."
 bel_dnc.314.t:0 "The Question Is Closed"
 bel_dnc.314.d:0 "The ministry has ruled that the constitution is not open, that French remains the language of command and of the administration, and that no further concession is under consideration. The government is coherent, the army speaks with one voice, and the Chamber has stopped debating grammar. In Antwerp and Ghent the men who were going to be moderates are being introduced to the men who were never going to be."
 bel_dnc.314.a:0 "One kingdom, one tongue, one army."
 bel_dnc.314.b:0 "See that the regiments hear it first."
 bel_dnc.315.t:0 "The Answer From Liege"
 bel_dnc.315.d:0 "The congress has resolved, and the resolutions are moderate in tone and immoderate in substance: a Walloon administrative section, Walloon appointments to Walloon provinces, and a standing assembly to watch over both. The delegates went home orderly and satisfied. The ministry may give them the section they asked for, or give them nothing and rely on their being satisfied already."
 bel_dnc.315.a:0 "Give Wallonia its own administrative section."
 bel_dnc.315.b:0 "Nothing beyond what the congress already has."
 bel_dnc.316.t:0 "Beyond the Reach of the State"
 bel_dnc.316.d:0 "The Movement has stopped writing to ministers. It has a subscription list longer than any party's, meeting halls in every Flemish town, and a leadership that has never sat in the Chamber and does not expect to. Nothing in the ordinary machinery of the kingdom now touches it. It can be watched, or it can be bought at a price that will be called a surrender."
 bel_dnc.316.a:0 "Watch it. Report every month."
 bel_dnc.316.b:0 "Concede now, and let it be called what it will."
 BEL_v_the_regiments_relearn:0 "The Regiments Relearn"
 BEL_v_the_regiments_relearn_desc:0 "Manuals reprinted, officers sitting examinations, cadres broken up and reassembled. For two years the army will be worse at everything while it learns to give an order twice."
 BEL_v_the_prosecuted_press:0 "The Prosecuted Press"
 BEL_v_the_prosecuted_press_desc:0 "Seizures at Antwerp and closures at Ghent have quieted the sheets and made celebrities of their editors. The ministry has its order and pays for it in the mood of every Flemish town."
 BEL_v_the_two_sections:0 "Two Sections of the Ministries"
 BEL_v_the_two_sections_desc:0 "The central departments are split into a Flemish and a Walloon section. Files stop being translated, provinces stop being misunderstood, and every appointment now has two claimants instead of one."
 BEL_v_the_walloon_congress:0 "The Standing Congress of Wallonia"
 BEL_v_the_walloon_congress_desc:0 "Wallonia has an assembly of its own, meeting on its own authority, watching over its provinces and its industry. It is loyal to the crown and no longer altogether inside the kingdom's politics."
 BEL_v_the_movement_uncontrolled:0 "A Movement Beyond the State"
 BEL_v_the_movement_uncontrolled_desc:0 "The Flemish Movement has a press, a treasury, halls and candidates, and no longer asks the ministry for anything. Nothing the state can do reaches it, and what it does next is not the state's to decide."
 BEL_v_belgium_of_two_peoples:0 "A Belgium of Two Peoples"
 BEL_v_belgium_of_two_peoples_desc:0 "Both languages in the statute, the schools, the courts and the ranks. The unitary kingdom is gone and what stands in its place can ask both of its peoples for the same sacrifice."
 BEL_v_the_unitary_kingdom:0 "The Unitary Kingdom"
 BEL_v_the_unitary_kingdom_desc:0 "One language of command, one administration, one settled answer. The government is coherent and the army speaks with a single voice, over a grievance that has been organised and will not dissolve."
 BELDNC_the_kingdom_and_its_king:0 "The Kingdom and Its King"
 BELDNC_the_kingdom_and_its_king_desc:0 "Seven million people, the densest railway net in the world, coal under Wallonia and looms across Flanders, and a sovereign who is also, privately, the master of a territory eighty times our size. The Chamber governs. The King reigns. Nobody in Brussels is entirely certain where the line between those two verbs falls."
 BELDNC_the_crown_in_two_places:0 "The Crown in Two Places"
 BELDNC_the_crown_in_two_places_desc:0 "Our sovereign holds a second sovereignty that is nothing to do with us. Belgian officers take leave to serve in it, Belgian ships carry its cargoes, Antwerp weighs its ivory, and Belgian ministers answer questions about it in the Chamber that they have no authority to answer. Sooner or later we must decide what that arrangement is."
 BELDNC_one_country_two_tongues:0 "One Country, Two Tongues"
 BELDNC_one_country_two_tongues_desc:0 "The Equality Law has made Dutch a language of the statute book. It has not made it a language of the courts, the university at Ghent, the officer corps or the ministries. Half the kingdom now knows that the law can be changed, which is the most dangerous thing a movement can learn."
 BELDNC_the_belgian_question:0 "The Belgian Question"
 BELDNC_the_belgian_question_desc:0 "Three questions, and the decade will answer all three whether we take them up or not: what becomes of the King's private empire, what becomes of a kingdom that governs in one language and is inhabited in two, and what becomes of a neutrality guaranteed by the very armies that would have to cross us."
 BELDNC_arm_the_powers_who_signed:0 "The Powers Who Signed"
 BELDNC_arm_the_powers_who_signed_desc:0 "Our neutrality is not a policy. It is an obligation laid on five great powers, four of whom share a frontier with our friends and two with us. The staff is instructed to say aloud, on paper, what everyone in the department already knows: the guarantee will be honoured by whichever of them finds it convenient, and broken by whichever does not."
 BELDNC_arm_the_lottery_and_the_substitute:0 "The Lottery and the Substitute"
 BELDNC_arm_the_lottery_and_the_substitute_desc:0 "Each year the numbers are drawn and each year the sons of those who can pay hire the sons of those who cannot to serve in their place. The result is an army of the poor, badly trained and thinly officered, and a country that has never once thought of itself as a nation in arms. The register is laid before the Chamber."
 BELDNC_arm_one_son_from_every_house:0 "One Son from Every House"
 BELDNC_arm_one_son_from_every_house_desc:0 "Personal service: no more drawing, no more buying out. One son from every household, the rich man's as readily as the labourer's. The Catholic right has fought it for thirty years and the King has wanted it for twenty. Carrying it will cost this government its majority in a dozen arrondissements and give the kingdom, at last, an army."
 BELDNC_arm_the_lottery_stands:0 "The Lottery Stands"
 BELDNC_arm_the_lottery_stands_desc:0 "The bill is withdrawn. The notables keep their sons, the clergy keep their seminarians out of the barracks, the Chamber keeps its temper, and the army keeps its forty thousand men on paper and rather fewer in the ranks. It is a decision, and it will be honoured in August of whatever year August comes."
 BELDNC_arm_the_language_of_command:0 "The Language of Command"
 BELDNC_arm_the_language_of_command_desc:0 "Every order in the Belgian army is given in French, to regiments that are more than half Flemish. Officers who cannot make themselves understood by their own men are not officers. The regulations are rewritten: command in the tongue of the ranks. The Walloon officer corps will call it the ruin of the service, and it will cost us their goodwill."
 BELDNC_arm_the_whole_class_to_the_colours:0 "The Whole Class to the Colours"
 BELDNC_arm_the_whole_class_to_the_colours_desc:0 "General service. Not one son but every son, the full annual class called up, the field army raised toward three hundred thousand on mobilisation and the war footing written into law. It is the largest thing this Chamber has ever voted and it will be paid for in every constituency in the kingdom."
 BELDNC_arm_brialmonts_estimates:0 "Brialmont's Estimates"
 BELDNC_arm_brialmonts_estimates_desc:0 "The old engineer has spent his life arguing that a neutral state must be able to hold its own ground long enough for the guarantee to mean something. His memorandum lies on the table: girdles of forts at Liege and Namur to hold the Meuse, and the national redoubt at Antwerp behind them. It is the most expensive document ever laid before this Chamber."
 BELDNC_arm_the_forts_of_the_meuse:0 "The Forts of the Meuse"
 BELDNC_arm_the_forts_of_the_meuse_desc:0 "Twelve works around Liege and nine around Namur, sunk into the heights above the river, triangular, ditched, and armed in cupolas of steel. They do not defend a frontier. They defend the crossings of the one river that any army coming from the east must put behind it, and they are meant to hold long enough for somebody else to arrive."
 BELDNC_arm_the_national_redoubt:0 "The National Redoubt"
 BELDNC_arm_the_national_redoubt_desc:0 "Antwerp is to be the place the government, the treasury and the army retire to when the field is lost: a new outer girdle of forts, an inundation line, and a port that the sea powers can reach. It is a doctrine as much as a fortress, and the doctrine says that Belgium survives a war by not losing it quickly."
 BELDNC_arm_the_kings_money_for_the_kings_forts:0 "The King's Money for the King's Forts"
 BELDNC_arm_the_kings_money_for_the_kings_forts_desc:0 "His Majesty offers to complete the Antwerp works himself, from the revenues of his other sovereignty. The works would rise this year instead of in ten. Every stone of them would be paid for by the quota gangs on the Congo, the Chamber would know it, and the reformers in London would be handed the finest argument they have yet had."
 BELDNC_arm_not_one_franc_from_the_basin:0 "Not One Franc from the Basin"
 BELDNC_arm_not_one_franc_from_the_basin_desc:0 "The Chamber declines the gift. If the forts are to be Belgian they will be voted by Belgians out of Belgian estimates, slowly and with an argument over every battery. The King will take it as what it is, a vote of no confidence in his other kingdom, and the works will suffer for it."
 BELDNC_arm_cupolas_and_guns:0 "Cupolas and Guns"
 BELDNC_arm_cupolas_and_guns_desc:0 "A fort is a hole in the ground until it is armed. Fifteen and twenty-one centimetre guns in revolving steel cupolas, quick-firers in the ditches, the whole traversed and counter-mined. The artillerists warn that guns grow heavier faster than concrete grows thicker, and that a work laid out in one decade is armed against the last one."
 BELDNC_arm_the_fortress_troops:0 "The Fortress Troops"
 BELDNC_arm_the_fortress_troops_desc:0 "Forts are held by men, and the men allotted to ours are the oldest classes on the register, called up last and trained least, standing garrison in works they have never fired from. Either the fortress regiments are given real establishments and real gunners or the finest concrete in Europe is a monument."
 BELDNC_arm_which_guarantor_is_the_threat:0 "Which Guarantor Is the Threat"
 BELDNC_arm_which_guarantor_is_the_threat_desc:0 "The staff is asked, in writing and in confidence, the question no Belgian minister may put in the Chamber: of the powers that guaranteed us, which will come through us to reach another. Three appreciations are drawn up, one for each frontier that matters. All three are marked to be burned, and only one of them will turn out to have been worth reading."
 BELDNC_arm_the_neighbour_to_the_east:0 "The Neighbour to the East"
 BELDNC_arm_the_neighbour_to_the_east_desc:0 "The railways being doubled toward Aachen do not serve a market that exists. The army whose plans require it to be somewhere west of the Meuse in a fortnight cannot get there any other way. We name the danger, we face the works east, and we let certain conversations begin with the guarantor across the water."
 BELDNC_arm_the_neighbour_to_the_south:0 "The Neighbour to the South"
 BELDNC_arm_the_neighbour_to_the_south_desc:0 "For sixty years the army was raised against France, and the older generals have not changed their minds: a republic that wants the Rhine will come through the Sambre valley as it always has. The southern works are put in hand. Wallonia, which reads Paris newspapers and thinks of France as an elder sister, will not forgive us for it."
 BELDNC_arm_name_no_enemy:0 "Name No Enemy"
 BELDNC_arm_name_no_enemy_desc:0 "The appreciations are burned unread. Belgium names no enemy, holds no conversations, prepares against all five signatories equally and against none of them seriously. It is the correct legal position, it keeps every embassy calm, and it means that whatever comes will find the staff with no plan for it."
 BELDNC_arm_the_field_army_of_the_line:0 "The Field Army of the Line"
 BELDNC_arm_the_field_army_of_the_line_desc:0 "Concrete cannot manoeuvre. Behind the works there must be divisions of the line that can march, a cavalry division that can screen them and a staff that has thought about where they go on the fourth day. The field army is given establishments, exercises and, for the first time, orders that assume the fighting happens here."
 BELDNC_arm_the_guarantee_called_in:0 "The Guarantee Called In"
 BELDNC_arm_the_guarantee_called_in_desc:0 "The reservists' notices are printed and stacked. The staff has a deployment, the works have such guns as we gave them, and the treaty of guarantee is about to be tested by the only method that tests treaties. Whatever we have built by now is what the kingdom has. There will be no further estimates."
 BEL_f_the_powers_who_signed:0 "The Powers Who Signed"
 BEL_f_the_powers_who_signed_desc:0 "Our independence rests on the signatures of five great powers. It is worth exactly what their convenience says it is worth, and everyone in the department knows it."
 BEL_f_the_militia_lottery:0 "The Militia Lottery"
 BEL_f_the_militia_lottery_desc:0 "The numbers are drawn, and those who can pay hire a substitute. The propertied classes are content and the army is an army of the poor, small, badly trained and thinly officered."
 BEL_f_personal_service:0 "Personal Service"
 BEL_f_personal_service_desc:0 "One son from every household, and no more buying out. The barracks fill with men who did not expect to be there, and the country begins, unwillingly, to think of itself as a nation in arms."
 BEL_f_the_general_levy:0 "The General Levy"
 BEL_f_the_general_levy_desc:0 "The whole annual class to the colours and the war establishment written into law. It is the largest commitment the kingdom has ever made and it is resented in every constituency."
 BEL_f_the_command_in_two_tongues:0 "The Command in Two Tongues"
 BEL_f_the_command_in_two_tongues_desc:0 "Orders are given in the language the ranks actually speak. The regiments understand what is asked of them; the French-speaking officer corps regards the reform as a humiliation and says so."
 BEL_f_the_officers_at_school:0 "The Officers at School"
 BEL_f_the_officers_at_school_desc:0 "Half the officer corps is learning to give in Dutch orders it has given in French for thirty years. Until they have learned, everything the army does it does slowly."
 BEL_f_the_armoured_standard:0 "The Armoured Standard"
 BEL_f_the_armoured_standard_desc:0 "Deeper foundations, thicker vaults, and steel where the estimates commissioner wanted rubble. The works rise slowly and expensively, and they are built to be hit."
 BEL_f_the_commissioners_mix:0 "The Commissioner's Mix"
 BEL_f_the_commissioners_mix_desc:0 "The cheaper concrete, poured in unreinforced masses to the standard of the eighties. The works go up quickly and look magnificent. Nobody has yet fired anything very large at them."
 BEL_f_the_kings_gift:0 "The King's Gift"
 BEL_f_the_kings_gift_desc:0 "The works at Antwerp are rising on money the Chamber did not vote, from a territory the Chamber does not govern. The masons are grateful. The opposition benches count the months until somebody in London does the arithmetic."
 BEL_f_the_chamber_holds_the_estimates:0 "The Chamber Holds the Estimates"
 BEL_f_the_chamber_holds_the_estimates_desc:0 "Every battery is voted in the Chamber, by Belgians, out of Belgian estimates. The works crawl. The principle is intact, and the principle turns out to matter to a great many deputies."
 BEL_f_the_works_stand_still:0 "The Works Stand Still"
 BEL_f_the_works_stand_still_desc:0 "The King has taken the refusal personally. Contracts go unsigned, the engineers wait on rulings that do not come, and the scaffolding at Antwerp stands in the rain."
 BEL_f_the_fortress_troops:0 "The Fortress Troops"
 BEL_f_the_fortress_troops_desc:0 "Real establishments, real gunners, and men who have fired the guns they are to fight. A fort held by trained troops is worth three held by the oldest classes on the register."
 BEL_f_the_meuse_is_the_frontier:0 "The Meuse Is the Frontier"
 BEL_f_the_meuse_is_the_frontier_desc:0 "The works look east, the exercises assume an army coming from Aachen, and the staff has stopped pretending it does not know which way the railways run."
 BEL_f_the_sambre_is_the_frontier:0 "The Sambre Is the Frontier"
 BEL_f_the_sambre_is_the_frontier_desc:0 "The old assumption holds: the danger comes up the Sambre from the south. The southern works are manned and Wallonia is told, in effect, that its elder sister is the enemy."
 BEL_f_no_enemy_named:0 "No Enemy Named"
 BEL_f_no_enemy_named_desc:0 "Belgium prepares against all her guarantors equally, which is to say against none of them. Every chancellery is reassured and the staff has no plan for anything in particular."
 BEL_f_the_conversations:0 "The Conversations"
 BEL_f_the_conversations_desc:0 "Certain technical conversations have taken place with a guarantor, and certain notes of them exist. They are worth a great deal to our staff and would be worth even more to a power looking for a pretext."
 BEL_f_the_field_army:0 "The Field Army"
 BEL_f_the_field_army_desc:0 "Divisions of the line with establishments that are filled, a cavalry screen, and a staff that has worked out where everyone goes on the fourth day."
 BEL_f_the_position_holds:0 "The Position Holds"
 BEL_f_the_position_holds_desc:0 "Armoured, armed, garrisoned and finished in time. The works on the Meuse and the redoubt at Antwerp are what the estimates promised, and the army behind them knows it."
 BEL_f_the_works_unfinished:0 "The Works Unfinished"
 BEL_f_the_works_unfinished_desc:0 "Some of it was built and some of it was argued about until there was no time left. The forts stand; the cupolas of half of them are empty and the garrisons are thinner than the plans."
 BEL_f_the_forts_of_plain_concrete:0 "The Forts of Plain Concrete"
 BEL_f_the_forts_of_plain_concrete_desc:0 "Unreinforced masses poured to a standard laid down a generation ago, in works that were never finished and never properly manned. They were magnificent on the day they were opened."
 BEL_f_the_position_fortifiee:0 "The Fortified Positions"
 BEL_f_the_position_fortifiee_desc:0 "What has actually been built, armed and manned of the fortress programme."
 BEL_henri_brialmont:0 "Henri Brialmont"
 BEL_f_brialmont_at_the_works:0 "Henri Brialmont"
 BEL_f_brialmont_at_the_works_desc:0 "The engineer of Antwerp, Liege and Namur, and of half the fortresses of Romania besides. He has been telling governments for forty years that a neutral state which cannot hold its own ground is not neutral but merely undefended."
 BEL_f_garrison_of_old_classes_tt:0 "The garrisons are found from the oldest classes on the register, and the fortress regiments remain what they have always been."
 BEL_f_garrison_of_the_classes_tt:0 "The service classes furnish real fortress establishments, and the works are manned by gunners who have fired their own guns."
 BEL_f_the_classes_answer_tt:0 "The classes answer their notices, and the field army takes the strength the law promised it."
 BEL_f_the_register_is_thin_tt:0 "The register yields what a lottery army yields, and the mobilisation tables are known to be fiction."
 BEL_f_the_orders_are_understood_tt:0 "The orders go out in the language of the ranks, and the ranks understand them."
 BEL_f_the_orders_are_not_understood_tt:0 "The orders go out in French to regiments that are half Flemish, and the Movement will remember exactly who gave them."
 bel_dnc.400.t:0 "The Estimates on the Table"
 bel_dnc.400.d:0 "General Brialmont's programme has been costed, and the commission appointed to cost it has done what such commissions do. The engineer wants the deeper foundations and the newer concrete, laced and reinforced, with steel where he can get it. The commissioner points out that the same money laid out in the older unreinforced mass buys half again as many works, and that no gun in Europe has ever broken a Belgian vault. Both men are, on the evidence available in this year, entirely correct."
 bel_dnc.400.a:0 "Build them to be hit. Reinforced, and armoured."
 bel_dnc.400.b:0 "The commissioner's mix. More forts, sooner."
 bel_dnc.400.c:0 "Refer the whole programme back to the Chamber."
 BEL_f_400a_tt:0 "The works will rise slowly and the estimates will be fought over battery by battery. They will also be built to survive being fired at."
 BEL_f_400b_tt:0 "The girdles go up quickly and the Chamber is pleased with itself. The vaults are what they were in the eighties."
 BEL_f_400c_tt:0 "Nothing is decided, nothing is spent, and no ground will be broken for some years yet."
 bel_dnc.401.t:0 "The Vote on Personal Service"
 bel_dnc.401.d:0 "The lottery is dead and the barracks are filling with men who a year ago expected never to see them. Most of them come from Flanders, and within a month the first petitions have arrived: the sons of Flemish farmers are being drilled, disciplined and, if it comes to it, sent to die under orders given in a language they do not speak. The Movement has never had a grievance so easy to explain, and it knows it. The War Minister asks for a decision before the classes assemble."
 bel_dnc.401.a:0 "Raise Flemish companies under officers who speak to them."
 bel_dnc.401.b:0 "The army speaks French. It will go on speaking French."
 BEL_f_401a_tt:0 "A half-measure, and half-measures buy time. The Movement banks the concession; the officer corps notes the precedent."
 BEL_f_401b_tt:0 "The regulations stand. So does the grievance, and it will be repeated at every meeting in Flanders for the next ten years."
 bel_dnc.402.t:0 "The Three Appreciations"
 bel_dnc.402.d:0 "Three papers, prepared separately, sealed, and laid before the minister. The first assumes the army from the east, sweeping wide of the Ardennes and across the Meuse crossings in the first fortnight. The second assumes the army from the south, up the Sambre as in every previous war. The third assumes both, and concludes that Belgium in that case is not a belligerent but a road. None of the three may be shown to the Chamber, and the minister must decide who else may see them."
 bel_dnc.402.a:0 "The King should read them. He commands in war."
 bel_dnc.402.b:0 "Lock them in the department. Nobody needs this in writing."
 BEL_f_402a_tt:0 "The sovereign is given the staff's real appreciation of his guarantors, and the army acquires, quietly, a common view of the danger."
 BEL_f_402b_tt:0 "The papers go into the safe. Nothing is said aloud that could ever be quoted, and nothing is planned either."
 bel_dnc.403.t:0 "The Conversations"
 bel_dnc.403.d:0 "A colonel attached to the British legation has been calling on the department, and the calls have gone rather further than courtesy. Landing places, railheads, the state of the Antwerp works, how many days the Meuse could be held and what might arrive if it were. Nothing has been signed and nothing could be: a neutral cannot make a military convention and remain a neutral. But somebody has been taking notes, and notes taken in the Rue de la Loi have a way of being found by whoever occupies the Rue de la Loi."
 bel_dnc.403.a:0 "Keep the notes. A plan is worth more than a posture."
 bel_dnc.403.b:0 "Burn every sheet. We are neutral and must be seen to be."
 BEL_f_403a_tt:0 "Our staff knows what help would come and where it would land. So would anyone who opened the right cupboard."
 BEL_f_403b_tt:0 "The conversations never happened. The legal position is unimpeachable and the staff is back to guessing."
 bel_dnc.405.t:0 "The Trial Firing"
 bel_dnc.405.cheap.d:0 "A condemned work on the Brasschaat range is shot at for three days with the heaviest piece the artillery could borrow, which is far from the heaviest piece in Europe. On the second afternoon the vault above the central gallery lets go. The engineers pick over it in silence: the mass is sound, the mass is simply mass, and mass poured without reinforcement does not bend, it shatters. There is a report. It recommends rebuilding to the armoured standard, and it names a sum that will make the Chamber ill."
 bel_dnc.405.sound.d:0 "A condemned work on the Brasschaat range is shot at for three days with the heaviest piece the artillery could borrow. The reinforced vaults are cracked, scarred and still standing, the cupolas turn afterwards, and the gunners come out of the gallery deafened but alive. The engineers are satisfied. They add, in a paragraph nobody reads twice, that guns grow heavier faster than vaults grow thicker, and that this result guarantees nothing about a piece that does not yet exist."
 bel_dnc.405.a:0 "Rebuild the vaults. Whatever the Chamber says."
 bel_dnc.405.b:0 "File the report. The works are what they are."
 bel_dnc.405.c:0 "Print the report and read it to the estimates committee."
 BEL_f_405a_tt:0 "The government spends its authority to undo its own economy. The vaults are rebuilt to the armoured standard."
 BEL_f_405b_tt:0 "The report joins the others. The works stand as poured, and the range at Brasschaat is quiet again."
 BEL_f_405c_tt:0 "The committee is impressed, the estimates pass more easily, and the engineers are heard out for once."
 bel_dnc.406.t:0 "The Posture for the Summer"
 bel_dnc.406.d:0 "The notices are printed. The staff wants a decision that has been deferred for a decade: where does the field army stand when the classes come in. Forward on the Meuse, with the works, and fight for the river crossings. Back in the redoubt at Antwerp, intact, a fleet in being on land that no invader can leave behind him. Or in the centre, covering Brussels and Louvain, committed to nothing until we know which frontier has been crossed. Each answer is a different war, and only one of them can be prepared."
 bel_dnc.406.a:0 "Forward, on the Meuse. The forts are for fighting from."
 bel_dnc.406.b:0 "Back to Antwerp. The army must survive the first month."
 bel_dnc.406.c:0 "The centre. Commit to nothing until we know."
 BEL_f_406a_tt:0 "The field army stands with the fortress line, and the river crossings will be contested rather than reported."
 BEL_f_406b_tt:0 "The redoubt is the plan. Whatever happens on the frontier, there is still an army when it is over."
 BEL_f_406c_tt:0 "The army holds the centre and keeps its options, which is another way of saying it arrives late wherever it goes."
 bel_dnc.407.t:0 "The Guarantee Is Tested"
 bel_dnc.407.strong.d:0 "The girdles are closed, the cupolas turn, the fortress regiments are at their stations with gunners who know their own pieces, and the classes have answered their notices. Whatever crosses the frontier will have to be brought up, deployed and fed before it can begin, and it will be beginning against works built to be hit. The staff does not promise a victory. It promises weeks, and weeks are the entire theory on which this kingdom was founded."
 bel_dnc.407.partial.d:0 "Rather more than half of it exists. Some works are finished and armed, some have empty cupola wells with the guns still on order, and the garrisons are made up as they were always going to be made up, out of whoever is left. The staff's appreciation is careful: the line can be held, for a time, by troops who will have to be lucky. Nobody in the department writes down how long a time."
 bel_dnc.407.weak.d:0 "There is not much to inspect. Old works to an old standard, half of them without their guns, garrisons of the oldest classes standing in galleries they have never fired from, and behind them a field army that exists more completely on the mobilisation tables than in the barracks. The treaty of guarantee is about to be tested, and the department has known for ten years what the answer would be. It simply never had the votes."
 bel_dnc.407.a:0 "Then that is what we have. Stand to."
 bel_dnc.407.b:0 "Remind the signatories, in writing, what they undertook."
 BEL_f_407a_tt:0 "The army takes up the positions the decade has left it, with the works the decade has left it."
 BEL_f_407b_tt:0 "A note goes to five capitals citing the treaty. It commits nobody, and the country reads it and stiffens."
 bel_dnc.409.t:0 "The King Answers the Chamber"
 bel_dnc.409.d:0 "His Majesty received the Chamber's refusal without comment, which those who know him found more alarming than anger. Since then the contracts for the outer girdle have gone unsigned, the ministerial rulings the engineers are waiting on have not come, and a departmental committee has discovered that it lacks the authority to break ground on land the sovereign has an interest in. Nothing has been refused. Nothing is moving either. The government may force the matter, at a price, or it may wait."
 bel_dnc.409.a:0 "Force it through the Chamber. Vote the works ourselves."
 bel_dnc.409.b:0 "Wait him out. He is old and the works will keep."
 BEL_f_409a_tt:0 "The government spends its authority and the Chamber votes the girdle out of its own estimates. The stage is completed without the King."
 BEL_f_409b_tt:0 "The scaffolding stands in the rain, and the department learns what it costs to tell a sovereign no."
 BELDNC_u_the_country_we_became:0 "The Country We Became"
 BELDNC_u_the_country_we_became_desc:0 "The clerks lay fourteen years of votes out on the table before the session opens: the estimates, the register of the classes, the colonial file, the language bills. Nobody calls it an inventory and everybody reads it as one. Whatever the Chamber has made of Belgium in that time is the country the powers will be dealing with, and not the one of 1900."
 BELDNC_u_the_congo_of_the_chamber:0 "The Congo of the Chamber"
 BELDNC_u_the_congo_of_the_chamber_desc:0 "A colonial ministry answerable to the Chamber, a Colonial Council with Belgians and Congolese on it, and inspectors who report to Brussels rather than to a concession company. It is slow, it is expensive in political credit, and it is the only thing that turns a possession into an administration."
 BELDNC_u_the_guarantee_in_concrete:0 "The Guarantee in Concrete"
 BELDNC_u_the_guarantee_in_concrete_desc:0 "The works at Liege, Namur and Antwerp stand finished and the argument about whether to build them is over. What is left is the unglamorous half: heavier cupolas, deeper counterscarps, a second line behind the Meuse, and garrisons that have actually fired the guns they are meant to serve. No staff abroad now writes us down as a fortnight's march."
 BELDNC_u_the_two_kingdoms:0 "The Two Kingdoms"
 BELDNC_u_the_two_kingdoms_desc:0 "The unitary kingdom of 1830 cannot be repaired, only replaced. Two administrations, two languages of instruction, two civil services, one Crown and one army. It is the end of the Belgium the founders wrote, and it is the only version of the country that both halves will still sign."
 BELDNC_u_the_congo_reformed:0 "The Charter of the Basin"
 BELDNC_u_the_congo_reformed_desc:0 "The concession regime is dissolved, the labour tax abolished in law and in fact, and the Colonial Charter is read into the statute book. It costs a decade of revenue that will never be collected and a great deal of the government's standing. It also ends the thing the world was writing about."
 BELDNC_u_the_word_of_a_signature:0 "The Word of a Signature"
 BELDNC_u_the_word_of_a_signature_desc:0 "The note is short, courteous and identical in five capitals: the powers of 1839 are reminded of what they put their names to and asked to say so again. The department knows exactly how each answer will be read at home. It also knows that a reminder is worth whatever stands behind it, and that the men reading it in Berlin have our forts on their own maps."
 BELDNC_u_the_army_of_the_nation:0 "The Army of the Nation"
 BELDNC_u_the_army_of_the_nation_desc:0 "Every son of the class, none bought out and none excused, with the word of command given in the tongue the recruit was raised in. It is the largest thing a Belgian Chamber has ever been asked to vote, and it cannot be asked of a kingdom still arguing about which of its languages the state belongs to. That argument had to be finished first, and it has been."
 BELDNC_u_the_statute_of_the_two_communities:0 "The Statute of the Two Communities"
 BELDNC_u_the_statute_of_the_two_communities_desc:0 "The statute is drafted by men who have stopped pretending the quarrel will die out on its own: the frontier written into law, Ghent lecturing in Dutch, Wallonia guaranteed against a majority that can outvote it, the regiments ordered in both tongues. Neither movement got what it asked for. Both of them signed, which is more than either expected."
 BEL_u_the_colonial_charter:0 "The Colonial Charter"
 BEL_u_the_colonial_charter_desc:0 "The basin came to Belgium early and came in through the front door: voted by the Chamber, governed by a ministry, inspected by men who can be summoned to answer for it. The world noticed, and noticed favourably."
 BEL_u_the_inherited_shame:0 "The Inherited Shame"
 BEL_u_the_inherited_shame_desc:0 "Belgium took the colony after the photographs, after the report, after the debates. It is ours now, and so is everything that was done in it while we defended the man who was doing it."
 BEL_u_the_basin_in_our_hands:0 "The Basin in Our Hands"
 BEL_u_the_basin_in_our_hands_desc:0 "A territory eighty times the size of the kingdom, with rubber, copper and a river that runs the wrong way. Whatever it cost to get, it is on the map in Belgian colours."
 BEL_u_the_powers_decided:0 "The Powers Decided"
 BEL_u_the_powers_decided_desc:0 "The basin was settled in a conference room Belgium was invited to sit in but not to speak in. The lesson was taken: a small country that will not answer a question has the answer written for it."
 BEL_u_the_kings_inheritance:0 "The King's Inheritance"
 BEL_u_the_kings_inheritance_desc:0 "The Free State outlived the man who owned it. It is a private estate held by a Belgian king that is not held by Belgium, an arrangement no lawyer in Europe can explain and no chancellery has stopped raising."
 BEL_u_the_guarantee_defended:0 "The Guarantee Defended"
 BEL_u_the_guarantee_defended_desc:0 "Liege, Namur and Antwerp are finished works with trained garrisons in them. Neutrality is still a piece of paper, but there is now something behind the paper."
 BEL_u_a_scrap_of_paper:0 "A Scrap of Paper"
 BEL_u_a_scrap_of_paper_desc:0 "The forts were argued about for a decade and never built. Belgium is defended by five signatures and the good faith of the men who wrote them, and everybody in Europe knows exactly how much that is."
 BEL_u_half_a_fortress:0 "Half a Fortress"
 BEL_u_half_a_fortress_desc:0 "Some of the works were finished and some were left with the guns not yet mounted. It is enough to make an invasion slow and not enough to make it unwise."
 BEL_u_two_peoples_one_kingdom:0 "Two Peoples, One Kingdom"
 BEL_u_two_peoples_one_kingdom_desc:0 "Flemish is a language of the law, of the university and of the parade ground, and Wallonia has been paid for it in things it wanted. The kingdom is one kingdom because both halves were given a reason to want it."
 BEL_u_the_federal_statute:0 "The Federal Statute"
 BEL_u_the_federal_statute_desc:0 "Belgium is no longer administered as one country. Two civil services, two school systems, one Crown and a Chamber that now has to negotiate with itself before it can negotiate with anybody else."
 BEL_u_the_unitary_kingdom_strained:0 "The Unitary Kingdom Under Strain"
 BEL_u_the_unitary_kingdom_strained_desc:0 "The government answered the language question by declining to answer it. The movement did not go away; it went into the town halls, the schools and the reserve battalions, and it is still there."
 BEL_u_the_kingdom_endures:0 "The Kingdom Endures"
 BEL_u_the_kingdom_endures_desc:0 "Nothing was settled and nothing broke. The language question is where it was in 1898, a little louder, and the next decade will have to take it up."
 BEL_u_the_colonial_kingdom:0 "The Colonial Kingdom"
 BEL_u_the_colonial_kingdom_desc:0 "A kingdom of seven million people governing a basin of twenty million, on its own vote and by its own law. Belgium is a small country with a large empire and has stopped pretending otherwise."
 BEL_u_the_shamed_power:0 "The Shamed Power"
 BEL_u_the_shamed_power_desc:0 "Belgium has the colony and the reputation that came attached to it. Foreign ministries are polite; foreign newspapers are not; and at home the argument closed ranks around a country being lectured to."
 BEL_u_the_guaranteed_neutral:0 "The Guaranteed Neutral"
 BEL_u_the_guaranteed_neutral_desc:0 "No colony, no army worth the name, and the Treaty of 1839 held up in front of the kingdom like an umbrella. It has worked for seventy-five years, which is either an argument or a warning."
 BEL_u_the_armed_neutral:0 "The Armed Neutral"
 BEL_u_the_armed_neutral_desc:0 "Neutral by treaty, defended by concrete, and expensive to walk through. Belgium made itself the wrong country to shortcut, and everybody in Europe redrew their plans around that."
 BEL_u_the_two_kingdoms:0 "The Two Kingdoms"
 BEL_u_the_two_kingdoms_desc:0 "The country is one state and two nations, and it is now written that way. It is slower to move, harder to mobilise and considerably more honest than what it replaced."
 BEL_u_the_charter_of_the_basin:0 "The Charter of the Basin"
 BEL_u_the_charter_of_the_basin_desc:0 "A colonial statute, a Colonial Council, an inspectorate that can be subpoenaed and a labour code that is enforced. It is the version of the Congo that Belgium can say out loud."
 BEL_u_the_congo_under_review:0 "The Congo Under Review"
 BEL_u_the_congo_under_review_desc:0 "The ministry is standing up, the concession contracts are being read one by one, and everything in the basin is provisional until the Chamber has finished. Nothing works well while it is being taken apart."
 BEL_u_the_nation_in_arms:0 "The Nation in Arms"
 BEL_u_the_nation_in_arms_desc:0 "One son from every house, no substitutes, no lottery, and orders in the language the recruit understands. It took a constitutional settlement to make it possible and it doubles what the kingdom can put in the field."
 BEL_u_the_statute_of_two_communities:0 "The Statute of Two Communities"
 BEL_u_the_statute_of_two_communities_desc:0 "The language frontier, the schools, the courts and the word of command are all fixed in statute. Both communities signed, both communities complain, and neither is preparing to leave."
 BEL_u_the_guarantors_word:0 "The Guarantors' Word"
 BEL_u_the_guarantors_word_desc:0 "Belgium has been to five capitals and had the guarantee of 1839 reaffirmed in writing by all of them. It changes nothing on the ground and a great deal in the chancelleries."
 bel_dnc.700.t:0 "The Reckoning"
 bel_dnc.700.d:0 "The books are closed on the decade."
 bel_dnc.700.a:0 "So it stands."
 bel_dnc.701.t:0 "A Colony, Not an Estate"
 bel_dnc.701.d:0 "The basin is Belgian, and it became Belgian by a vote taken before the worst of the reporting rather than after it. There is a minister in Brussels who answers for the Congo in the Chamber, an inspectorate that files, and a body of colonial law that a court can read. Delegations that came to Brussels to complain have gone home to write that Belgium moved before it was made to.\n\nIt is not innocence. The rubber went on being cut, the companies went on being paid, and the men who ran the Free State are still in the ministry. But the thing is now the property of a parliament, and a parliament can be asked questions."
 bel_dnc.701.a:0 "Govern it as a province of the kingdom."
 bel_dnc.702.t:0 "The Colony and the Shame"
 bel_dnc.702.d:0 "Belgium has the Congo. It got it after the consular report, after the lantern slides, after four years of the Congo Reform Association reading Belgian names aloud in English halls, and after this government spent much of that time explaining that the accounts were exaggerated.\n\nThe cession was carried in the end because it could not be avoided. Abroad it is read as a confession; at home it is read as an insult delivered by countries with worse hands. Both readings will follow the kingdom for a generation, and neither of them can be answered with a note of protest."
 bel_dnc.702.a:0 "Take it, and say as little as possible."
 bel_dnc.702.b:0 "Take it, and say plainly what was done there."
 bel_dnc.703.t:0 "The Basin Divided"
 bel_dnc.703.d:0 "The powers settled the Congo question themselves. An international administration sits at Boma with a Belgian on it as a courtesy, the concession territories have been redistributed among the signatories of Berlin, and the frontier commissions are already in the field.\n\nBelgium was in the room. Belgium was not asked. The lesson has been drawn very sharply in Brussels: a small state that declines to answer a question of its own is handed the answer, and the answer is never the one it would have written."
 bel_dnc.703.a:0 "Accept the settlement and say nothing further."
 bel_dnc.703.b:0 "Lodge a formal protest and let the country hear it."
 bel_dnc.704.t:0 "The Estate of a Dead King"
 bel_dnc.704.d:0 "It is 1914 and the Congo Free State still exists. It is not Belgian. It is the personal property of the King of the Belgians, inherited as a private estate, administered by men who answer to Laeken and to nobody in the Chamber.\n\nEvery chancellery in Europe treats this as an absurdity that has been allowed to continue because nobody wished to be the one to end it. Every Belgian government of the decade found a reason to postpone it. The reasons have run out, and the arrangement has outlived the argument for it."
 bel_dnc.704.a:0 "Leave the King his estate."
 bel_dnc.704.b:0 "Declare that Belgium claims nothing there and wants nothing."
 bel_dnc.705.t:0 "A King's Will"
 bel_dnc.705.d:0 "Leopold is dead, and the will has been read. The Congo Free State was not disposed of; it was inherited. The sovereignty of the basin has passed to Albert as a personal possession, exactly as a house or a stud farm would have passed, and the young King has said nothing about what he intends to do with it.\n\nThe Chamber is entitled to an opinion. It has never yet been entitled to a vote."
 bel_dnc.705.a:0 "Press the new King to lay the cession before the Chamber."
 bel_dnc.705.b:0 "Let it stand. The King has enough to carry this year."
 bel_dnc.705.c:0 "Renounce the claim. Belgium wants nothing in the basin."
 bel_dnc.706.t:0 "The Powers Take an Interest"
 bel_dnc.706.d:0 "A note has been delivered in Brussels, signed in three capitals and initialled in two more. The signatories of the Berlin Act observe that the administration of the conventional basin has not been brought into conformity with Article VI, that the Belgian Chamber has had ample time to act, and that in the absence of Belgian action the powers will regard themselves as free to make provision for the territory.\n\nThe date given is generous. It is also final."
 bel_dnc.706.a:0 "Carry the cession now, whatever it costs."
 bel_dnc.706.b:0 "Belgium will not be hurried into an empire. Let them provide."
 bel_dnc.710.t:0 "Liege Will Hold"
 bel_dnc.710.d:0 "Twelve forts around Liege, nine around Namur, and the Antwerp enceinte pushed out to the new line, all finished, all armed and all garrisoned by men who have trained in them. The counterscarps are deep, the cupolas turn, and the magazines are stocked.\n\nThe staffs in Berlin and Paris have both recalculated. A march through Belgium is no longer a matter of days and no longer cheap, and that fact alone is worth more to the kingdom than the whole of the diplomatic correspondence of the last seventy-five years."
 bel_dnc.710.a:0 "Then the guarantee has something behind it."
 bel_dnc.711.t:0 "The Army of the Lottery"
 bel_dnc.711.d:0 "The forts were debated in every session of the decade and built in none of them. Liege has Brialmont's works of the 1880s with the guns of the 1880s in them. Namur is worse. The Antwerp line stops where the money stopped.\n\nAnd the army that would hold them is still drawn by lot, with the sons of anyone who can pay a substitute quietly absent from the register. Belgium's neutrality rests entirely on five signatures written in 1839 by men who are all dead."
 bel_dnc.711.a:0 "The treaty has held for seventy-five years. It will hold."
 bel_dnc.711.b:0 "Call out what we have and put it where the road runs."
 bel_dnc.712.t:0 "Half a Fortress"
 bel_dnc.712.d:0 "Part of the programme was carried. Liege has its ring, or most of it; Namur was begun and the eastern works were left with their cupolas on the quayside; the Antwerp line exists on paper and in two sectors on the ground.\n\nIt is enough to cost an invader time and not enough to cost him the campaign. Every officer who has walked the line knows exactly which sector he would be asked to hold and exactly what it would cost him."
 bel_dnc.712.a:0 "It will have to answer."
 bel_dnc.720.t:0 "The Belgium of Two Peoples"
 bel_dnc.720.d:0 "The Equality Law of 1898 turned out to be the beginning. Dutch is a language of the courts, of the administration, of the University of Ghent and of the parade ground, and the concessions were paid for honestly in things Wallonia asked for and got.\n\nThe Flemish Movement has not disappeared. It has become a normal part of a normal parliament, with a programme, a vote and no reason to talk about the constitution. That is what a settled question looks like, and very few kingdoms in Europe can point to one."
 bel_dnc.720.a:0 "One kingdom, and both halves in it by choice."
 bel_dnc.721.t:0 "The Question Becomes Constitutional"
 bel_dnc.721.d:0 "It is no longer a question of school inspectors and court interpreters. The Flemish Movement is asking what Belgium is, and a Walloon congress has begun asking the same question from the other end. Both are now writing about administrative separation as a practical proposal rather than a threat.\n\nA unitary kingdom of two nations can be held together by consent or by the gendarmerie. This government has to choose which, and the choice cannot be postponed again."
 bel_dnc.721.a:0 "Draft a federal statute and put it to the Chamber."
 bel_dnc.721.b:0 "Belgium is one kingdom. Hold it as one."
 bel_dnc.721.c:0 "Appoint a royal commission and give it two months."
 bel_dnc.722.t:0 "The Statute or the Street"
 bel_dnc.722.d:0 "The royal commission has reported and the report satisfied nobody, which was predictable, and made the position worse, which was not. Ghent and Antwerp have had a fortnight of meetings; Liege and Charleroi have answered with meetings of their own; and the gendarmerie has been reinforced in four provinces.\n\nThe commission's own conclusion, buried in the last chapter, is that the unitary administration cannot be maintained by consent. The government must now either write that into law or govern against it."
 bel_dnc.722.a:0 "Write it into law. Two administrations, one Crown."
 bel_dnc.722.b:0 "Govern against it. The kingdom is not negotiable."
 bel_dnc.723.t:0 "The Kingdom Endures"
 bel_dnc.723.d:0 "The language question is where it was: not settled, not dangerous, argued about in every session and decided in none. Some Flemish demands were met and some were refused; Wallonia was reassured and not asked for much; and nobody has been driven to say anything that cannot be taken back.\n\nIt is not a settlement. It is a country that has learned to carry an unanswered question without dropping it, which is a skill, and which has a limit that nobody has yet found."
 bel_dnc.723.a:0 "It has carried this far."
 bel_dnc.730.t:0 "The Country We Became"
 bel_dnc.730.d.two_kingdoms:0 "Belgium enters the summer of 1914 as a state of two nations. Whether by statute or by the refusal of one, the fiction of a single Belgian people has been given up, and everything the kingdom does now has to be agreed twice.\n\nThe mobilisation tables have to be rewritten. The school estimates have to be voted twice. And in exchange, for the first time since 1830, neither community is being governed in a language chosen for it. It is a slower country and a more durable one, and the powers of Europe have not decided yet what to make of it."
 bel_dnc.730.d.colonial:0 "Belgium enters the summer of 1914 as a colonial kingdom: seven million people at home, a basin the size of western Europe abroad, and a colonial charter that a Belgian court can enforce. It was carried early, it was carried by a vote, and the countries that were preparing to lecture Brussels found the lecture already delivered from the Belgian benches.\n\nThe kingdom is richer, better regarded and considerably more entangled than it was in 1900. A small neutral state with an empire is no longer merely a small neutral state."
 bel_dnc.730.d.shamed:0 "Belgium enters the summer of 1914 with the Congo and with everything that was said about the Congo. The colony was taken late, under pressure, after the report and the photographs and the years of official denial, and the taking was read everywhere as an admission.\n\nAbroad, the kingdom is a power that is politely not asked certain questions. At home, a decade of being lectured has produced a hard, defensive patriotism that no Belgian government of 1900 would have recognised. Both of those will matter in what is coming."
 bel_dnc.730.d.armed:0 "Belgium enters the summer of 1914 as an armed neutral. There is no empire and no ambition, and there are twenty-one finished forts, a filled register and a field army that has trained in the works it would defend.\n\nThe neutrality of 1839 is still the whole of Belgian foreign policy. The difference is that it is now expensive to test. Two general staffs have redrawn their opening moves because of what was voted in this Chamber, and neither of them wrote the change down where it could be quoted."
 bel_dnc.730.d.guaranteed:0 "Belgium enters the summer of 1914 exactly as it entered 1900: neutral by treaty, unarmed by choice, and holding up a document signed by five powers in 1839 as its entire answer to the century.\n\nThe forts were debated and not built. The register was reformed and not filled. The colonial question was left to the King and then to nobody. The kingdom is at peace, prosperous, and resting the whole of its existence on the proposition that the signatories will remember what they signed."
 bel_dnc.730.a:0 "This is the country we hand on."
 bel_dnc.750.t:0 "Where We Stand"
 bel_dnc.750.d:0 "The Prime Minister has asked for a memorandum on the state of the three questions that have occupied the Chamber since 1900: the basin, the works, and the language of the kingdom.\n\nIt is a short document. That is the trouble with it."
 bel_dnc.750.a:0 "Note it, and let the Chamber see it."
 BEL_u_the_classes_are_full_tt:0 "§GThe register is full: the classes report at strength.§!"
 BEL_u_the_register_is_short_tt:0 "§RThe register is thin: substitutes were still being bought when the call went out.§!"
 BEL_u_charter_unlock_tt:0 "Unlocks §YThe Congo of the Chamber§! in the epilogue row."
 BEL_u_shame_unlock_tt:0 "Unlocks §YThe Congo of the Chamber§!, the only road out of the shame."
 BEL_u_shame_admitted_tt:0 "The government states the facts of the Free State in the Chamber. The country hears it from us rather than from London."
 BEL_u_protest_lodged_tt:0 "Belgium's protest is entered in the record of the conference. It changes nothing and is remembered."
 BEL_u_estate_disowned_tt:0 "Belgium formally claims nothing in the basin. The colonial question is closed."
 BEL_u_press_the_new_king_tt:0 "§YChamber +12§!, §Rscandal +3§!. Albert is asked, in public, to give the basin to the nation."
 BEL_u_inheritance_stands_tt:0 "§Rscandal +6§!, §RChamber -4§!. The estate passes intact to the new reign."
 BEL_u_claim_renounced_tt:0 "§YChamber set to 0§!. No Belgian government may raise the cession again."
 BEL_u_last_dash_tt:0 "Belgium annexes the basin under the eyes of the powers, on their timetable and not ours."
 BEL_u_stand_aside_tt:0 "The signatories will provide for the territory. The Belgian claim lapses."
 BEL_u_liege_holds_tt:0 "The works are finished, armed and garrisoned."
 BEL_u_paper_guarantee_tt:0 "§RThe kingdom is defended by the Treaty of 1839 and nothing else.§!"
 BEL_u_levy_in_haste_tt:0 "Whatever is on the register is called out and put on the Meuse road. It is late and it is something."
 BEL_u_half_a_fortress_tt:0 "The finished sectors will be held. The unfinished ones will be explained afterwards."
 BEL_u_two_peoples_tt:0 "The language question is settled by consent. §GThe barrier of tongues is lifted from the army.§!"
 BEL_u_federal_statute_tt:0 "Belgium is administered as two communities under one Crown. §RFlemish -25, Walloon -10§!."
 BEL_u_unitary_strain_tt:0 "The kingdom is held as one, against the movement. §RFlemish +10§!."
 BEL_u_royal_commission_tt:0 "A commission of eleven men, two months, and no instructions worth the name."
 BEL_u_federal_statute_late_tt:0 "The statute is written after the meetings rather than before them. §RFlemish -20, Walloon -12§!."
 BEL_u_unitary_strain_late_tt:0 "The gendarmerie stays in the four provinces. §RFlemish +12§!."
 BEL_u_kingdom_endures_tt:0 "Nothing is settled and nothing has broken."
 BEL_u_can_colonial_tt:0 "§GYou may reform the colony further and take the Charter of the Basin.§!"
 BEL_u_can_shamed_tt:0 "§YThe shame can be worked off, through the colonial ministry and at a heavy price.§!"
 BEL_u_can_two_kingdoms_tt:0 "§RA national army cannot be raised until the two communities are settled in law.§!"
 BEL_u_can_armed_tt:0 "§GThe works may be deepened and general service may be carried.§!"
 BEL_u_can_guaranteed_tt:0 "§RNo colonial road and no fortress road remain. The signatures of 1839 are the whole of the policy.§!"
 BEL_u_epilogue_row_tt:0 "Opens §YThe Country We Became§!, the last row of the tree."
 BEL_u_stock_colony_ours_tt:0 "§GThe basin: Belgian, and answerable to the Chamber.§!"
 BEL_u_stock_colony_lost_tt:0 "§RThe basin: settled by the powers. Belgium has no colonial question left.§!"
 BEL_u_stock_colony_estate_tt:0 "§YThe basin: still the King's private estate. The question is open.§!"
 BEL_u_stock_forts_done_tt:0 "§GThe works: finished, at Liege, at Namur and at Antwerp.§!"
 BEL_u_stock_forts_none_tt:0 "§RThe works: voted, argued and not built.§!"
 BEL_u_stock_language_loud_tt:0 "§RThe language of the kingdom: the movement is now asking constitutional questions.§!"
 BEL_u_stock_language_quiet_tt:0 "§GThe language of the kingdom: quiet, and paid for.§!"
 BEL_u_stock_footer_tt:0 "The memorandum ends there. Whatever these three lines say in the summer of 1914 is the country we will be."
 BEL_u_colonial_ministry_tt:0 "A colonial ministry answerable to the Chamber. §GThe concession regime is broken, scandal -10.§!"
 BEL_u_concrete_tt:0 "New works at Liege, Antwerp and Namur, built at once."
 BEL_u_two_kingdoms_focus_tt:0 "Two administrations, one Crown. §RFlemish -20§!."
 BEL_u_shame_worked_off_tt:0 "§GThe Inherited Shame is lifted. It took ten years and a great deal of what this government had.§!"
 BEL_u_signature_tt:0 "The guarantee of 1839 is reaffirmed in writing in five capitals."
 BEL_u_nation_in_arms_tt:0 "One son from every house, and the word of command in his own tongue."
 BEL_u_command_in_both_tongues_tt:0 "§GThe army is ordered in both tongues. The Flemish Movement loses its sharpest grievance.§!"
 BEL_u_statute_tt:0 "The language frontier, the schools and the courts are fixed in statute. §GFlemish -15, Walloon +5.§!"
 catholic_block:0 "The Catholic Bloc"
 catholic_block_desc:0 "The party that has governed Belgium without a break since 1884, held together by the schools question and the Flemish countryside."
 parti_liberal:0 "Parti Liberal"
 parti_liberal_desc:0 "Brussels, Ghent, the free-thinking bourgeoisie and the banks. Out of office for a generation and still the party of the ports."
 parti_ouvrier_belge:0 "Parti Ouvrier Belge"
 parti_ouvrier_belge_desc:0 "The Workers' Party, born at Ghent in 1885, which strikes for the vote rather than for wages and counts every plural ballot as an insult."
 conference_organizer:0 "Conference Organiser"
 conference_organizer_desc:0 "He knows which room to hire, whom to seat beside whom, and how to make a small kingdom the address for other people's quarrels."
 BEL_dnc_trunk_sc:0 "The Guarantee"
 BEL_dnc_a_sc:0 "The Chamber"
 BEL_dnc_c_sc:0 "The King's Estate"
 BEL_dnc_v_sc:0 "The Two Peoples"
 BEL_dnc_f_sc:0 "The Forts"
 BEL_Albert_I:0 "Albert I"
 BEL_Cyriaque_Gillain:0 "Cyriaque Gillain"
 BEL_Cyriaque_Gillain2:0 "Cyriaque Gillain2"
 BEL_Felix_Wielemans:0 "Felix Wielemans"
 BEL_Joseph_Hellebaut2:0 "Joseph Hellebaut2"
 BEL_Joseph_Hellebaut3:0 "Joseph Hellebaut3"
 BEL_Ridder_de_Selliers_de_Moranville2:0 "Ridder de Selliers de Moranville2"
 BEL_alfred_renard:0 "Alfred Renard"
 BEL_auguste_piccard:0 "Auguste Piccard"
 BEL_georges_lemaitre:0 "Georges Lemaitre"
 BEL_karel_bossart:0 "Karel Bossart"
 BEL_leon_degrelle:0 "Leon Degrelle"
 BEL_nicolas_florine:0 "Nicolas Florine"
 BEL_paul_van_zeeland:0 "Paul van Zeeland"
 francois_schollaert:0 "Francois Schollaert"
 BEL_a_register_pressed_tt: "The language question is already open: the supplementary votes are challenged in every Flemish canton."
 BEL_a_register_quiet_tt: "Nobody has yet named the language question. The register is defended in silence and the Crown gains by it."
 BEL_a_register_and_the_colony_tt: "The Chamber has already been told the King holds an estate. It will now ask who voted him the right."
 BEL_a_the_new_king_signs_tt: "Albert countersigns what his ministers put before him, and the quarrel over the prerogative loses its subject."
 BEL_a_the_old_king_signs_tt: "Leopold signs for two states with the same hand, and the Chamber is told which of them is none of its business."
 BEL_a_crown_has_shown_its_hand_tt: "The Crown has already tested the countersignature. The strike stops being industrial and becomes constitutional."
 BEL_a_strike_is_still_industrial_tt: "The quarrel is still between the pits and the register. The Chamber concedes a little rather than see it widen."
 BEL_a_strike_without_a_grievance_tt: "The register has already been struck down. Four hundred thousand men are out with nothing left to demand."
 BEL_a_strike_against_the_register_tt: "The strike has one clause of one law to aim at, and it hits it."
 BEL_a_the_ministry_outlives_the_king_tt: "De Broqueville forms a ministry that owes nothing to a dead king and everything to the party machine."
 BEL_a_the_ministry_serves_the_king_tt: "The ministry governs at the King's pleasure and is careful to be seen doing so."
 BEL_a_prorogued_by_a_new_king_tt: "Albert closes the session and promises a date for its recall. The country half believes him."
 BEL_a_prorogued_by_leopold_tt: "Leopold closes the session and names no date. Every chancellery in Europe files the fact."
 BEL_a_message_from_a_new_king_tt: "A young king reads a message the ministers wrote, and the Chamber hears it as courtesy rather than command."
 BEL_a_message_from_leopold_tt: "Leopold reads over the heads of his ministers, and the Crown becomes a party to the debate it opened."
 BEL_a_single_vote_new_reign_tt: "The new reign has no stake in the old arithmetic. The Senate gives way sooner than anyone expected."
 BEL_a_single_vote_old_king_tt: "Leopold will not sign away the majority that has protected his estate for twenty years without being paid for it."
 BEL_a_the_crown_governs_alone: "Belgium is governed past its own Chamber"
 BEL_a_the_chamber_does_not_sit: "The Belgian Chamber has not been recalled"
 BEL_c_the_house_was_warned_tt: "The Chamber was told a year ago that the King holds a state of his own. It has had time to prepare its questions."
 BEL_c_the_house_was_not_warned_tt: "The Chamber learns of the estate from a Liverpool pamphlet, and the government learns what that costs."
 BEL_c_the_answer_of_a_new_king_tt: "Albert has no reason to defend his uncle's sovereignty, and the Chamber's claim advances by a session."
 BEL_c_the_answer_of_leopold_tt: "The answer is Leopold's, given in his own words, and the House is told to be satisfied with it."
 BEL_c_the_denials_are_read_back_tt: "Every previous denial is read back into the record, dated and initialled. The interpellation becomes an indictment."
 BEL_c_the_house_hears_it_first_tt: "The House hears the figures before the foreign press does, and the government keeps the initiative for a season."
 BEL_c_the_bequest_falls_due_tt: "The testator is dead. The bequest is no longer a promise but an inheritance with a date on it."
 BEL_c_the_bequest_has_no_date_tt: "The Chamber holds a claim that matures on the day the King chooses to die, and not one day sooner."
 BEL_c_the_commission_is_not_believed_tt: "After so many official denials nobody will read a Palace commission as anything but the next one."
 BEL_c_the_commission_is_believed_tt: "The government has denied little enough that three judges are still taken at their word."
 BEL_c_the_commission_rises_tt: "The commission is dissolved, its recommendations adopted, and the inquiry stops costing the government a session a month."
 BEL_c_a_new_king_keeps_the_estate_tt: "Albert inherits the estate and secures it by decree, and every accusation made against his uncle is now made against him."
 BEL_c_leopold_keeps_the_estate_tt: "Leopold has what he asked for, and the ministry is paid in quiet for as long as the quiet lasts."
 BEL_c_terms_of_a_dead_king_tt: "The conditions are argued with executors rather than with a sovereign, and the Chamber strikes out the worst of them."
 BEL_c_terms_of_a_living_king_tt: "The conditions are the King's own and are not negotiable while he is alive to insist on them."
 BEL_c_the_motion_against_a_denial_tt: "The motion is put against a government that has already told the House the question is foreign. Nothing is unsayable now."
 BEL_c_the_motion_against_a_silence_tt: "The motion is put into a silence, and the Catholic benches split rather than break."
 BEL_c_the_house_votes_a_law_tt: "The charter was drafted before the colony was ours. The House votes an administration, not an improvisation."
 BEL_c_the_house_votes_a_treaty_tt: "The House votes a treaty and will spend the next three years writing the law that should have come first."
 BEL_c_the_force_keeps_its_habits_tt: "The concession regime still stands upriver. The Force Publique changes its paymaster and nothing else."
 BEL_c_the_force_is_re_enlisted_tt: "With the tally books closed the companies are re-enlisted on terms a minister can read out in the Chamber."
 BEL_c_the_council_was_drafted_tt: "The Council sits under the article the House wrote for it years before there was a colony to govern."
 BEL_c_the_council_is_improvised_tt: "The Council is assembled in a fortnight out of whoever will serve, and its first year is spent on its own rules."
 BEL_c_closed_by_charter_tt: "The charter did the work. The question closes on a law rather than on a silence."
 BEL_c_closed_without_a_charter_tt: "The question is declared closed without a charter behind it, and the file abroad goes on growing."
 BEL_c_the_estate_is_named: "The Belgian Chamber names the King's estate"
 BEL_c_the_bureau_answers_liverpool: "Brussels answers the reform campaign in print"
 BEL_c_three_judges_go_up_the_river: "A royal commission is sent to the Congo"
 BEL_c_the_question_closed_by_decree: "Belgium closes the Congo question by decree"
 BEL_c_the_powers_ask_what_we_intend: "The signatories of Berlin question Belgium"
 BEL_c_the_stations_are_given_a_quota: "The Domaine de la Couronne is worked to its limit"
 BEL_c_the_force_publique_school: "Alphonse Jacques de Dixmude"
 BEL_c_the_kingdom_renounces: "The Kingdom Renounces"
 BEL_c_the_kingdom_renounces_desc: "The Chamber has said in its own words that Belgium neither wants nor can govern an empire, and has struck the reversion from the record. It is an honest sentence and it will be quoted back at us for thirty years, by the powers who took the basin and by every Belgian who wanted it."
 BEL_a_the_register_in_the_provinces: "The Register in the Provinces"
 BEL_a_the_register_in_the_provinces_desc: "The supplementary votes are printed canton by canton in every newspaper that will carry them, with the names of the men who hold three. Nobody has broken a law. Everybody who reads it is angrier than they were."
 bel_dnc.800.t: "The Register in the Provinces"
 bel_dnc.800.d: "The organisers have finished counting. In the arrondissement of Hasselt one elector in nine casts three votes; in Charleroi it is one in thirty-one. The figures have been in the party's hands for a fortnight and in nobody else's. A clerk at the ministry has offered them to a Brussels paper for the price of a month's salary, and the minister has been told before the editor was."
 bel_dnc.800.a: "Let the arithmetic stand. It was voted in 1893 and it is the law."
 bel_dnc.800.b: "Print the lists ourselves and let the country read them."
 bel_dnc.800.c: "Add the canton of Verviers to the tally while nobody is watching."
 bel_dnc.801.t: "The Countersignature"
 bel_dnc.801.d: "A decree has come down from the Palace touching a matter that is not, on any reading of the constitution, the King's to decide alone. It requires a minister's signature to have force. The minister in question has been sitting with it on his desk for four days, has told two colleagues he will not sign, and has told nobody at all whether he intends to resign instead. The Chamber has noticed the delay."
 bel_dnc.801.a: "He signs, and hands in his portfolio the week after."
 bel_dnc.801.b: "He refuses, and stays where he is."
 bel_dnc.801.c: "The Palace will find a minister who signs."
 bel_dnc.802.t: "A Petition Signed With Folded Arms"
 bel_dnc.802.d: "The pits of the Borinage stopped at six this morning, the glassworks at Charleroi an hour later, and the tramways of the capital at noon. There is no disorder anywhere: the party's own stewards are keeping the crossings clear and have turned back two men carrying stones. A delegation is waiting in the corridor outside the minister's room and has been waiting since eleven."
 bel_dnc.802.a: "Receive the delegation. Hear what they have come to say."
 bel_dnc.802.b: "Send the gendarmerie to the pit gates before this becomes a habit."
 bel_dnc.802.c: "Say nothing. Men who are not paid go back to work."
 bel_dnc.805.t: "Four Hundred Thousand"
 bel_dnc.805.d: "It is the largest thing that has ever happened in this kingdom and it is aimed at one clause of one law. The pits are idle, the port is idle, the trams have not run for eleven days, and the party is feeding its own men from its own funds and can go on doing it for perhaps another three weeks. Nobody has been killed. The government is being asked, very quietly, what it proposes."
 bel_dnc.805.a: "Concede the second ballot and get the men back underground."
 bel_dnc.805.b: "Break it. A kingdom that can be stopped in a week cannot be governed."
 bel_dnc.805.c: "Wait. Their funds will run out before ours do."
 bel_dnc.806.t: "Government From the Palace"
 bel_dnc.806.d: "The session has been closed for two months and no date has been given for its recall. The estimates are being carried by decree, the deputies have gone home to their provinces, and the provincial councils have begun passing resolutions that the government would rather not read. The Palace bureau is now drafting the ordinances that used to be drafted in a committee room and read out to a hall."
 bel_dnc.806.a: "Recall the Chamber before the year is out."
 bel_dnc.806.b: "Carry the budget by decree and let the deputies read it in the Moniteur."
 bel_dnc.806.c: "Dissolve, and go to the country on the King's terms."
 bel_dnc.810.t: "What the Answer Was Worth"
 bel_dnc.810.d: "The government's answer has been printed, translated, and reprinted in Liverpool with a commentary. The Foreign Office has acknowledged it in one line. The Chamber has accepted it for the session, which is what it was for. But the deputy for Brussels has given notice of a fresh question for the autumn, and the wording of it makes plain that he has kept every previous answer and intends to read them out consecutively."
 bel_dnc.810.a: "Repeat the answer. It was true in June and it is true now."
 bel_dnc.810.b: "Qualify it. Say the government has asked for information."
 bel_dnc.810.c: "Say nothing further and let the session end."
 bel_dnc.811.t: "The Antwerp Returns"
 bel_dnc.811.d: "The customs figures for the quays are a matter of public record and always have been. What is new is that somebody has laid them beside the Free State's declared expenditure on its own administration and printed the two columns on one page. The arithmetic does not require a commentary. The government is asked to explain the difference, and the ministry of finance has confirmed that the figures are its own."
 bel_dnc.811.a: "Publish the whole series. It is our own customs house."
 bel_dnc.811.b: "Refer the question to the Palace, which alone can answer it."
 bel_dnc.811.c: "The returns for those years are found to be incomplete."
 bel_dnc.812.t: "The Commission Reports"
 bel_dnc.812.d: "The three judges have come back thinner than they went and have not spoken to the press. Their report runs to a hundred and fifty pages and was delivered to the Palace, not to the government. What has reached the ministry is a summary of it, prepared elsewhere, which is temperate, regretful, and roughly a third as long. Two of the three judges are understood to be unhappy with the summary."
 bel_dnc.812.a: "Print it entire, appendices and testimony together."
 bel_dnc.812.b: "Print the summary. It says everything that needs saying."
 bel_dnc.812.c: "Print nothing. The commission has done its work by sitting."
 bel_dnc.815.t: "The File Only Grows"
 bel_dnc.815.d: "The question is closed in Brussels and nowhere else. A missionary society in Boston has published photographs; a member for a Lancashire constituency has read a list of station names into the record at Westminster; a German paper that has no interest in the Congo whatever has discovered a sudden interest in Belgian methods. None of it is actionable and all of it is being kept."
 bel_dnc.815.a: "Answer them. Send our own men to their own halls."
 bel_dnc.815.b: "Ignore it. Foreign newspapers do not govern Belgium."
 bel_dnc.815.c: "Open the ports to any inspector who will pay his own passage."
 bel_dnc.817.t: "The Timetable Is Not Ours"
 bel_dnc.817.d: "The note is signed by two powers and is understood to have been shown to a third before it was sent. It does not demand annexation in terms. It observes that Article VI imposes obligations, that those obligations are not being met, and that the signatories would prefer to see them met by Belgium than by a conference. There is a date in the last paragraph, and it is eleven months away."
 bel_dnc.817.a: "Accept the guarantees as drafted and be done with it."
 bel_dnc.817.b: "Answer that Belgium will decide the question in Belgium."
 bel_dnc.817.c: "Ask for a delay and use it to draft our own terms."
 bel_dnc.819.t: "The First Session Under the Charter"
 bel_dnc.819.d: "The Colonial Council meets for the first time in a room borrowed from the ministry of justice, with fourteen chairs and no precedents. Before it are three ordinances left unsigned since the cession and a question of procedure that nobody can answer: whether the Council advises the minister or restrains him. The answer given this morning will be quoted for forty years."
 bel_dnc.819.a: "The Chamber's men take the chairs. The Council restrains."
 bel_dnc.819.b: "The King's old officials take the chairs. The Council advises."
 bel_dnc.819.c: "Send an inspector up the river before we sign anything at all."
 bel_dnc.821.t: "What Belgium Owns"
 bel_dnc.821.d: "The charter is law, the Council sits, the concessions are gone and the tally books are in a cupboard in the ministry. The question that has occupied the Chamber for a decade no longer has a motion attached to it. What remains is the matter of what to say the last ten years were, because the schools will teach whichever version the government settles on this session."
 bel_dnc.821.a: "Say it was justice, done late and done by us."
 bel_dnc.821.b: "Say it was business, and a good one."
 bel_dnc.821.c: "Say nothing. The charter can speak for itself."
 BEL_f_the_redoubt_at_antwerp:0 "Antwerp is turned into a national redoubt"
 BEL_f_the_basin_pays_for_the_forts:0 "The Congo pays for the Antwerp works"
 BEL_f_the_railways_toward_aachen:0 "Belgium fortifies against the east"
 BEL_f_the_army_of_the_sambre:0 "Belgium fortifies against the south"
 BEL_f_the_guarantee_is_tested:0 "Belgium calls in the guarantee of 1839"
 BEL_u_the_second_line_faces_east:0 "A second Belgian line rises behind the Meuse"
 BEL_u_the_second_line_faces_south:0 "A second Belgian line rises behind the Sambre"
 BEL_v_huysmans_in_the_house:0 "Camille Huysmans"
 BEL_v_huysmans_in_the_house_desc:0 "A schoolmaster from Antwerp who writes for the party in Dutch and argues in the Chamber in French, and never lets anyone forget that he is doing both."
 BEL_v_hymans_for_the_state:0 "Paul Hymans"
 BEL_v_hymans_for_the_state_desc:0 "Brussels liberal, and quite certain that a Belgium which stops being governed in French will shortly stop being governed at all."
 BEL_v_davignon_for_the_countryside:0 "Jules Davignon"
 BEL_v_davignon_for_the_countryside_desc:0 "He counts the rural arrondissements of Flanders the way other men count money, and he has never had to promise them anything to keep them."
 BEL_v_gillain_in_two_tongues:0 "Cyriaque Gillain"
 BEL_v_gillain_in_two_tongues_desc:0 "An officer who took the trouble to learn the language his own men were raised in, and who is quietly rewriting the drill regulations to match."
 BEL_v_schollaert_at_the_circular:0 "Frans Schollaert"
 BEL_v_schollaert_at_the_circular_desc:0 "A Catholic administrator with a gift for circulars that settle a question without ever appearing to answer it."
 BEL_v_janson_for_wallonia:0 "Paul Janson"
 BEL_v_janson_for_wallonia_desc:0 "He came to the Walloon leagues to defend French and stayed to argue that Wallonia is a thing in itself. He is not sure when that happened either."
 BEL_v_anseele_at_ghent:0 "Edouard Anseele"
 BEL_v_anseele_at_ghent_desc:0 "The cooperative at Ghent is his, and so are the men in it. When the Movement acquires a treasury and a list of candidates, they will come through him."
 BEL_f_moranville_at_the_staff:0 "de Selliers de Moranville"
 BEL_f_moranville_at_the_staff_desc:0 "A staff officer who has read the guarantee of 1839 more carefully than any of its signatories and expects less from it than any of them."
 BEL_f_jacques_of_the_ranks:0 "Alphonse Jacques"
 BEL_f_jacques_of_the_ranks_desc:0 "Africa taught him what happens to a column whose orders are not understood. He does not intend to learn it a second time on the Meuse."
 BEL_f_hellebaut_at_the_ministry:0 "Joseph Hellebaut"
 BEL_f_hellebaut_at_the_ministry_desc:0 "The minister who has to find the rifles, the barracks and the instructors for a class four times the size of the one he was given last year."
 BEL_f_vandervelde_against_the_gift:0 "Emile Vandervelde"
 BEL_f_vandervelde_against_the_gift_desc:0 "He has read the Casement report aloud in the Chamber and will not vote a franc that came out of the basin, whatever it is to be spent on."
 BEL_f_brialmont_the_theorist:0 "Henri Brialmont"
 BEL_f_brialmont_the_theorist_desc:0 "The old engineer, kept on to teach what he built: that a small state buys time with concrete and spends it waiting for somebody else to arrive."
 BEL_u_broqueville_at_the_colonies:0 "Charles de Broqueville"
 BEL_u_broqueville_at_the_colonies_desc:0 "He takes the colonial portfolio on the understanding that it will now answer to the Chamber, which is either a reform or an alibi depending on who is asked."
 BEL_u_gillain_of_the_nation:0 "Cyriaque Gillain"
 BEL_u_gillain_of_the_nation_desc:0 "Given a national army at last, and rather more aware than his ministers of how recently it was a lottery."
 BEL_v_the_state_speaks_french:0 "The State Speaks French"
 BEL_v_the_state_speaks_french_desc:0 "Government is quicker and cheaper in one language. The half of the kingdom that does not speak it goes on paying tax in it anyway."
 BEL_v_the_vote_of_the_countryside:0 "The Vote of the Countryside"
 BEL_v_the_vote_of_the_countryside_desc:0 "Rural Flanders votes as the parish votes and asks nothing back. The bill for that arrangement is not cancelled, only postponed."
 BEL_v_the_walloon_leagues:0 "The Walloon Leagues"
 BEL_v_the_walloon_leagues_desc:0 "Liege, Charleroi and Mons have their own committees now, funded out of the coal and steel of the Sambre, and they have begun to speak of Wallonia rather than of French."
 BEL_v_the_flemish_list:0 "The Flemish List"
 BEL_v_the_flemish_list_desc:0 "The Movement has candidates, subscriptions and a programme. It no longer petitions anybody, and it will still be there after this ministry."
 BEL_v_the_frontier_in_law:0 "The Frontier in Law"
 BEL_v_the_frontier_in_law_desc:0 "The line is drawn, written down and closed to argument. The communes on the edge are counted once and then left alone, which is the only part of it that everyone likes."
 BEL_v_the_last_session:0 "The Last Session"
 BEL_v_the_last_session_desc:0 "One sitting in which a language law can still be granted rather than conceded. The government can do anything it likes in it, and very little afterwards."
 BEL_f_the_estimates_on_the_table:0 "The Engineer's Estimates"
 BEL_f_the_estimates_on_the_table_desc:0 "Brialmont's memorandum lies before the Chamber, priced to the last cubic metre. Every deputy who has read it now has an opinion about concrete."
 BEL_f_the_three_appreciations:0 "The Three Appreciations"
 BEL_f_the_three_appreciations_desc:0 "The staff has written down, for the first time, which frontier it expects to be crossed. The document exists, which changes how the department thinks even when nobody quotes it."
 BEL_f_no_plan_for_it:0 "No Plan For It"
 BEL_f_no_plan_for_it_desc:0 "Belgium prepares against all five signatories equally and against none of them seriously. Every embassy is satisfied, and the staff has nothing in the drawer."
 BEL_f_the_notices_are_printed:0 "The Notices Are Printed"
 BEL_f_the_notices_are_printed_desc:0 "The reservists' notices are stacked in the communal offices and the railway timetables are written. Whatever the kingdom has built by now is what it will fight with."
 BEL_u_the_crown_still_governs:0 "The Crown Still Governs"
 BEL_u_the_crown_still_governs_desc:0 "Fourteen years of constitutional argument end with the Palace holding the pen. It is a quick government and a quiet one, and nobody outside it believes it is safe."
 BEL_u_the_franchise_won:0 "The Franchise Won"
 BEL_u_the_franchise_won_desc:0 "The plural vote is gone and the register is one man's name to one man's ballot. It cost two general strikes and it has bought a country that will answer a call-up."
 BEL_u_the_register_stands:0 "The Register Stands"
 BEL_u_the_register_stands_desc:0 "The franchise is neither widened nor closed. The Chamber of 1900 is recognisably the Chamber of 1914, which is a verdict of a kind."
 BEL_u_the_second_line:0 "The Second Line"
 BEL_u_the_second_line_desc:0 "Behind the girdles there is now a line to fall back on, dug by men who expect to hold it. It is the difference between a fortress and a plan."
 BEL_u_the_note_is_believed:0 "The Note Is Believed"
 BEL_u_the_note_is_believed_desc:0 "A reminder of the treaty of 1839 delivered by a country with an army behind it reads differently in five capitals than the same words from a country without one."
 BEL_v_the_question_was_named_tt:0 "The question had already been named in the Chamber. The law only puts a date to it."
 BEL_v_the_question_names_itself_tt:0 "Nobody had put the language question to the government in so many words. The law does it for them, at the government's expense."
 BEL_v_petitions_after_the_refusal_tt:0 "They were told no in public and came back anyway. Flanders reads that as proof."
 BEL_v_petitions_came_first_tt:0 "The delegations are received before the state has committed itself to anything."
 BEL_v_the_answer_follows_the_petitions_tt:0 "The delegations were received and then answered in the negative, which is worse than not receiving them."
 BEL_v_the_answer_comes_first_tt:0 "The state declares itself before anybody has asked."
 BEL_v_the_bench_was_warned_tt:0 "The petitions gave the magistracy a year to see this coming."
 BEL_v_the_bench_was_not_warned_tt:0 "The bar of Brussels learns of the bill from the Moniteur."
 BEL_v_the_schools_feed_the_university_tt:0 "Ghent will have pupils who were taught in the language it lectures in."
 BEL_v_the_schools_feed_nothing_yet_tt:0 "The middle schools teach in Dutch and send their best on to a university that does not."
 BEL_v_the_settlement_banks_flanders_tt:0 "The Catholic settlement can bank the rural seats and pay nothing for them."
 BEL_v_the_cartel_cannot_bank_flanders_tt:0 "The Cartel has no hold on the parish and knows it."
 BEL_v_nobody_has_banked_flanders_tt:0 "The countryside votes as it always has, for a majority nobody has yet assembled."
 BEL_v_french_orders_to_conscripts_tt:0 "Orders in French to men called up by law, not men who chose the trade."
 BEL_v_french_orders_to_volunteers_tt:0 "The ranks are small enough that the staff can pretend the question has not arisen."
 BEL_v_the_countryside_was_promised_nothing_tt:0 "The parishes were told there would be no language law. There is one, and it is in the barracks."
 BEL_v_the_ranks_understand_the_order_tt:0 "For the first time the word of command reaches the man it is given to."
 BEL_v_ghent_has_its_pupils_tt:0 "The middle schools have been feeding it for years."
 BEL_v_ghent_has_no_pupils_tt:0 "A Dutch faculty and no Dutch secondary schooling behind it."
 BEL_v_prosecuting_a_party_tt:0 "Fining an organisation with a treasury and candidates is advertising, not policing."
 BEL_v_prosecuting_a_newspaper_tt:0 "A few editors, a few fines, and the sheets are off the street by the season's end."
 BEL_v_the_circular_contradicts_the_bench_tt:0 "The courts were opened to Dutch and the ministries closed to it in the same decade."
 BEL_v_the_circular_stands_alone_tt:0 "The administration is told what language it works in, and nothing contradicts it."
 BEL_v_leagues_become_a_programme_tt:0 "Enough has been conceded that the leagues have stopped defending and started demanding."
 BEL_v_leagues_remain_a_grievance_tt:0 "The leagues are received, thanked, and left with nothing to organise around."
 BEL_v_the_sections_undo_the_circular_tt:0 "The department is split in two after being told in writing that it works in one language."
 BEL_v_the_sections_were_first_tt:0 "The split comes before the circular, and so nobody has to be contradicted."
 BEL_v_the_movement_has_a_floor_tt:0 "The Movement now has officers, funds and candidates. It will not fall back below this."
 BEL_v_the_leagues_carry_the_congress_tt:0 "The leagues arrive at Liege organised, and the resolution is theirs before it is read."
 BEL_v_the_congress_sits_alone_tt:0 "A congress without a movement behind it resolves loudly and disperses."
 BEL_v_the_frontier_answers_the_congress_tt:0 "Liege asked where Wallonia begins. The statute answers it in writing."
 BEL_v_the_frontier_before_the_congress_tt:0 "The line is drawn before anybody has demanded one."
 BEL_v_the_movement_sets_the_terms_tt:0 "The street is organised. Whatever is offered now will be read as a first instalment."
 BEL_v_the_ministry_sets_the_terms_tt:0 "There is still nobody in Flanders who can refuse on the Movement's behalf."
 BEL_v_the_street_goes_home_tt:0 "The Movement got the statute it was formed to demand and has nothing left to demonstrate about."
 BEL_v_the_congress_is_answered_tt:0 "Liege is answered in law, and the congress adjourns without a grievance."
 BEL_v_the_street_is_not_dispersed_tt:0 "A movement with a treasury does not disband because the constitution is declared closed."
 BEL_v_no_street_to_disperse_tt:0 "The Movement never became a party, and the refusal costs nothing to enforce."
 BEL_v_wallonia_is_content_tt:0 "The leagues have their unitary kingdom and go quiet."
 BEL_f_the_question_was_put_tt:0 "The Chamber has already named neutrality as one of the three questions. The staff answers it in writing."
 BEL_f_the_question_puts_itself_tt:0 "Nobody asked the department for this paper. It writes it anyway."
 BEL_f_the_register_meets_the_chamber_tt:0 "The register is laid before a Chamber that is already arguing about who votes."
 BEL_f_the_register_meets_nobody_tt:0 "The register is opened in a department, and no deputy has to defend it."
 BEL_f_the_right_pays_for_service_tt:0 "The Catholic settlement carries a bill it has fought for thirty years, and loses seats for it."
 BEL_f_the_crown_carries_service_tt:0 "The Palace wanted personal service and does not need the Chamber to get it."
 BEL_f_service_carried_without_the_chamber_tt:0 "The bill passes without a majority having to own it."
 BEL_f_the_notables_keep_their_sons_tt:0 "The settlement holds because nothing was asked of the people who keep it in office."
 BEL_f_the_bill_dies_quietly_tt:0 "Withdrawn without a division. Nobody's name is on it."
 BEL_f_the_barrier_comes_down_tt:0 "The regulations that made half the army foreign to its own officers are rewritten."
 BEL_f_the_barrier_was_already_down_tt:0 "The language of command was settled elsewhere. This only writes it into the drill."
 BEL_f_the_class_goes_east_tt:0 "The new class is quartered on the Meuse, where the appreciations say it will be needed."
 BEL_f_the_class_goes_south_tt:0 "The new class is quartered on the Sambre, facing the frontier the older generals still watch."
 BEL_f_the_class_goes_to_the_redoubt_tt:0 "With no enemy named, the class goes to Antwerp, which offends nobody."
 BEL_f_the_crown_reads_the_estimates_tt:0 "The Palace has wanted these works for twenty years and does not have to ask."
 BEL_f_the_cartel_reads_the_estimates_tt:0 "A Cartel majority reads a fortress estimate as a school it will not be building."
 BEL_f_the_house_reads_the_estimates_tt:0 "The Chamber receives the memorandum and reserves its opinion."
 BEL_f_the_works_face_the_named_threat_tt:0 "The works go up where the appreciation says the crossing will be made."
 BEL_f_the_works_face_nobody_tt:0 "Twelve works at Liege and nine at Namur, laid out against an enemy the state has declined to name."
 BEL_f_the_redoubt_looks_to_the_sea_tt:0 "The redoubt is only worth building if a sea power can reach it, and London is told so."
 BEL_f_the_gift_comes_from_a_dead_king_tt:0 "The bequest is executed by lawyers rather than offered by a sovereign, and the Chamber has to answer to it in public."
 BEL_f_the_gift_is_the_kings_own_tt:0 "His Majesty pays, and everyone understands what he has bought."
 BEL_f_refusing_a_dead_kings_gift_tt:0 "It is easier to decline a legacy than to decline a living king."
 BEL_f_refusing_the_kings_gift_tt:0 "The Chamber tells a reigning sovereign that his other kingdom's money is not clean."
 BEL_f_guns_in_cheap_concrete_tt:0 "Modern cupolas bolted into works built to the cheaper specification."
 BEL_f_guns_in_good_concrete_tt:0 "Guns and concrete of the same generation, for once."
 BEL_f_garrisons_for_the_meuse_tt:0 "The Meuse works get gunners who have fired their own pieces."
 BEL_f_garrisons_for_the_redoubt_tt:0 "The Antwerp girdle gets establishments instead of the oldest classes on the register."
 BEL_f_the_engineer_read_first_tt:0 "The estimates came before the appreciations, so the staff is asked where to put works already priced."
 BEL_f_the_staff_read_first_tt:0 "The department names the danger before it knows what defending against it costs."
 BEL_f_the_works_are_already_east_tt:0 "The Meuse girdles are up, and the appreciation only tells them which way to look."
 BEL_f_the_works_are_not_yet_east_tt:0 "An enemy is named and there is nothing on the river to face him with."
 BEL_f_the_congress_reads_paris_tt:0 "Wallonia has just met in congress and is told the same week that France is the danger."
 BEL_f_wallonia_grumbles_tt:0 "The southern works go in with grumbling and no organisation behind it."
 BEL_f_the_line_deploys_east_tt:0 "The field army has a frontier to march to and orders written for it."
 BEL_f_the_line_deploys_south_tt:0 "The field army concentrates behind the Sambre."
 BEL_f_the_line_deploys_nowhere_tt:0 "Divisions of the line, exercised in the centre, with no direction of march agreed."
 BEL_f_the_line_has_classes_tt:0 "Personal service fills the establishments the staff has written."
 BEL_f_the_line_has_no_classes_tt:0 "The establishments are drawn up and the register cannot fill them."
 BEL_f_the_guarantee_is_called_east_tt:0 "The note goes to London and Paris, and both of them know what it is about."
 BEL_f_the_guarantee_is_called_south_tt:0 "Berlin and London are told which frontier we expect to be crossed."
 BEL_f_the_guarantee_is_called_on_nobody_tt:0 "The guarantee is invoked in general terms, and five chancelleries read it as five different things."
 BEL_f_the_chamber_paid_for_this_tt:0 "The works were voted out of Belgian estimates, and nobody abroad can say otherwise."
 BEL_f_the_basin_paid_for_this_tt:0 "Every battery is an argument for the reformers in London."
 BEL_u_the_house_was_never_opened_tt:0 "The franchise question was never put in this reign. The Chamber of 1900 sits on."
 BEL_u_the_appreciation_was_east_tt:0 "The staff named the east, and the country is measured against that."
 BEL_u_the_appreciation_was_south_tt:0 "The staff named the south, and the country is measured against that."
 BEL_u_no_appreciation_was_made_tt:0 "No enemy was named, and the account is short a column."
 BEL_u_the_ministry_inherits_the_shame_tt:0 "The ministry takes over a possession the world has already written about."
 BEL_u_the_ministry_inherits_a_charter_tt:0 "The ministry takes over a colony that arrived through the front door."
 BEL_u_the_concrete_faces_east_tt:0 "The second line is dug where the appreciation said it would be needed."
 BEL_u_the_concrete_faces_south_tt:0 "The second line is dug behind the southern works."
 BEL_u_the_concrete_faces_all_five_tt:0 "Works deepened in every direction, which is to say against nobody in particular."
 BEL_u_the_congress_gets_its_statute_tt:0 "Liege resolved for administrative separation and is handed it in law."
 BEL_u_the_street_gets_its_statute_tt:0 "The Movement is offered the constitution it was formed to demand."
 BEL_u_the_note_names_berlin_tt:0 "The note is courteous and everyone knows which capital it is written at."
 BEL_u_the_note_names_paris_tt:0 "The note is courteous and everyone knows which capital it is written at."
 BEL_u_the_note_names_nobody_tt:0 "Five identical notes, five polite answers, and no obligation created anywhere."
 BEL_u_the_note_has_an_army_behind_it_tt:0 "A treaty reminder from a country that can hold its own river."
 BEL_u_the_note_has_nothing_behind_it_tt:0 "The department knows what a reminder is worth when the works are unfinished."
 BEL_u_the_orders_are_understood_tt:0 "General service asked of men whose officers can speak to them."
 BEL_u_the_orders_are_not_understood_tt:0 "The whole class is called up and half of it is commanded in a language it does not have."
 BEL_u_the_movement_signs_tt:0 "The Movement puts its name to a settlement and takes its people off the street."
 BEL_u_the_congress_signs_tt:0 "The Walloon leagues sign, having read the guarantees against a Flemish majority twice."
 BEL_u_the_frontier_was_already_drawn_tt:0 "The line exists in law already. The statute only has to refer to it."
 BEL_u_the_frontier_is_drawn_now_tt:0 "The line has to be drawn and defended in the same session."
 bel_dnc.850.t:0 "The First Flemish List"
 bel_dnc.850.d:0 "It is printed in Antwerp on cheap paper: eleven names, a programme of four articles, and a subscription address. None of the eleven has ever sat in the Chamber and two of them are schoolmasters. The Brussels leadership of both great parties has read it and decided, separately and identically, that it is not serious. The parish clergy of four arrondissements have read it and are less sure."
 bel_dnc.850.a:0 "Let it stand. A list that loses is a list that is finished."
 bel_dnc.850.b:0 "Buy the two best of them onto our own list."
 bel_dnc.850.c:0 "Instruct the parquets to look at the subscription accounts."
 bel_dnc.851.t:0 "The Resolution of Liege"
 bel_dnc.851.d:0 "The congress sat for two days and voted on the third. The resolution is four lines long, it uses the words administrative separation, and it was carried by delegates who include three sitting deputies and a bench of burgomasters. The Brussels papers print it under a heading about the weather. In Ghent it is on the front page, translated, with an editorial explaining what it means for Flanders."
 bel_dnc.851.a:0 "Answer it in the Chamber. It deserves an answer."
 bel_dnc.851.b:0 "Print nothing and let it be forgotten."
 bel_dnc.851.c:0 "Tell the three deputies to choose between the congress and the ministry."
 bel_dnc.852.t:0 "The Last Bill"
 bel_dnc.852.d:0 "The drafts are on the table and the session has eleven sitting days left. One text gives the Movement everything it has asked for since 1873. One gives it the courts and the schools and nothing else. One gives it a commission of inquiry. After the recess the initiative belongs to men who have never been in this room, and everybody in it knows that."
 bel_dnc.852.a:0 "Carry the whole law now, while it is still ours to give."
 bel_dnc.852.b:0 "Carry the half of it that the majority will bear."
 bel_dnc.852.c:0 "Let the session close. We have survived worse recesses."
 bel_dnc.860.t:0 "The Attache at Aachen"
 bel_dnc.860.d:0 "Our man reports the fourth track laid, the new platforms at Herbesthal long enough for a train the German commercial traffic does not require, and water towers built for a volume of engines nobody can account for. He writes it in the flat prose the department prefers and attaches the timetables. His covering note says that he has checked twice, and that he would be glad to be told he is wrong."
 bel_dnc.860.a:0 "Circulate it to London and Paris. Let them see it too."
 bel_dnc.860.b:0 "Keep it in the department. Nothing leaves this building."
 bel_dnc.861.t:0 "What the Staff Has in the Drawer"
 bel_dnc.861.d:0 "The minister asks, in the ordinary way, to see the plan for the concentration of the field army. There is a file. It contains a note on railway capacity from 1893, a memorandum on the Antwerp forts, and a map with no divisions marked on it. The chief of staff explains, correctly, that no enemy has been named and that a neutral state cannot plan against a friend."
 bel_dnc.861.a:0 "Order a plan against all five. On paper, sealed, and never spoken of."
 bel_dnc.861.b:0 "He is right. A neutral kingdom does not have plans."
 bel_dnc.870.t:0 "Five Answers"
 bel_dnc.870.d:0 "London answers within the week, in terms the department reads three times looking for the reservation and does not find one. Paris answers warmly and at length. Berlin answers correctly, briefly, and observes that the treaty binds all its signatories equally. Vienna and Rome answer as expected. The clerk who files them notes that the shortest reply came from the capital the note was really written at."
 bel_dnc.870.a:0 "Read all five into the record of the Chamber."
 bel_dnc.870.b:0 "File them. Publishing Berlin's would be an accusation."
 bel_dnc.871.t:0 "Governed from the Palace"
 bel_dnc.871.d:0 "The reign closes with the King's ministers appointed by the King, the estimates carried by decree where the Chamber has been difficult, and the Moniteur publishing rather more royal orders than statutes. It works. Trains run, taxes come in, the works go up faster than any Chamber would have voted them. The men who built it are old, and there is no arrangement for handing it to anybody."
 bel_dnc.871.a:0 "It has been an efficient reign."
 bel_dnc.872.t:0 "One Man, One Vote"
 bel_dnc.872.d:0 "The plural vote is dead. It took two general strikes, four hundred thousand men out of the pits and the mills, a Chamber that had to be shown twice, and the better part of two decades. The register now has one name against one ballot, and a country that has been asked for its consent is a country that can be asked for its sons."
 bel_dnc.872.a:0 "It was paid for in the streets, and it holds."
 bel_dnc.873.t:0 "The Register Stands"
 bel_dnc.873.d:0 "The franchise was neither widened to the point of principle nor closed by decree. Some votes still count twice, some men still do not vote at all, and the arrangement has outlasted every ministry that promised to settle it. It is not a settlement. It is what happens when a Chamber spends fourteen years discovering that it can live with a question."
 bel_dnc.873.a:0 "Nobody won. The house sits on."
 BEL_f_the_kings_bequest:0 "The King's Bequest"
 BEL_f_the_kings_bequest_desc:0 "Leopold left the forts his own money, and the Chamber took it because refusing would have meant explaining where the money came from. Concrete rises at Liege on Congo rubber, and everybody in the room knows it."
 BEL_tt_the_settlement_governs:0 "§YThe Catholic settlement governs:§! the measure is carried on the Right's terms, and the ministry does not enjoy explaining it."
 BEL_tt_the_cartel_governs:0 "§YThe cartel of the Left governs:§! the measure is argued in public, carried on the Left's terms, and paid for in stability."
 BEL_tt_the_crown_governs:0 "§RThe Crown governs past the Chamber:§! the measure is settled at the palace, and the Chamber is informed of the total afterwards."
 BEL_tt_two_peoples_in_law:0 "§YBelgium is two peoples in law:§! a kingdom that has already written one statute for a community writes this one without an argument."
 BEL_tt_one_kingdom_one_law:0 "§ROne kingdom, one law, one tongue:§! the unitary statute admits no local exception, and the exception is resented where it is refused."
 BELDNC_k_the_charter_is_a_leash:0 "The Charter Is a Leash"
 BELDNC_k_the_charter_is_a_leash_desc:0 "The Charter does not merely hand the basin to Belgium. It states what Belgium may not do with it: no merger of the two administrations, no loan without a vote, no decree the Chamber has not seen. A colony acquired by a kingdom that distrusts its own King is a colony governed by lawyers."
 BELDNC_eco_the_mouth_that_is_not_ours:0 "The Mouth That Is Not Ours"
 BELDNC_eco_the_mouth_that_is_not_ours_desc:0 "Antwerp lies fifty miles from the sea and every one of those miles below the frontier is Dutch water. The toll was bought out a generation ago; the pilotage, the buoyage and the right to fortify were not. The greatest port of the kingdom is reached only through a neighbour's estuary."
 BELDNC_s_the_school_war_reopened:0 "The School War Reopened"
 BELDNC_s_the_school_war_reopened_desc:0 "Every ministry since the great quarrel has governed with the schools question half-buried. Reopening it means deciding again who pays the communal master, who inspects the convent school, and what a child is required to know. No Belgian government has ever survived the question intact."
 BELDNC_b_the_pits_of_the_borinage:0 "The Pits of the Borinage"
 BELDNC_b_the_pits_of_the_borinage_desc:0 "The oldest coalfield in Europe and the poorest corner of Belgium: seams that dip and pinch, galleries a man works lying down, and villages where the average age at death would embarrass a colonial administration. It also produces the coal on which everything else in the kingdom runs."
 BELDNC_g_who_guarantees_the_guarantee:0 "Who Guarantees the Guarantee"
 BELDNC_g_who_guarantees_the_guarantee_desc:0 "Five powers signed for our neutrality. Nothing in the treaty says what any of them will actually do, or by what date, or with how many men. The staff has never been told, because nobody has ever asked. Asking is a small act with no obvious cost and no way back once it has been done."

 BELDNC_k_the_governor_general_at_boma:0 "The Governor-General at Boma"
 BELDNC_k_the_governor_general_at_boma_desc:0 "One man at Boma with a telegraph line, four thousand kilometres of river behind him and a minister in Brussels who must answer for every despatch. Whom he answers to is the whole question: the department, the Chamber that votes his estimates, or the palace that still writes to him privately."
 BELDNC_k_the_four_provinces:0 "The Four Provinces"
 BELDNC_k_the_four_provinces_desc:0 "The districts are a fiction inherited from a company: lines drawn wherever an agent happened to build a post. Four provinces with seats, registries and a commissioner apiece give the basin something it has never had, which is an address to which a complaint can be sent and expected to arrive."
 BELDNC_k_the_annual_report_to_the_chamber:0 "The Annual Report"
 BELDNC_k_the_annual_report_to_the_chamber_desc:0 "The Charter requires a report every year: revenues, criminal statistics, mortality, the number of men under arms. Laid on the table it can be read aloud by anybody. Ministers are discovering that the most dangerous document in Belgian politics is one that must be printed on a fixed date."
 BELDNC_k_the_tribunal_at_boma:0 "The Tribunal at Boma"
 BELDNC_k_the_tribunal_at_boma_desc:0 "Magistrates paid by the state, irremovable, competent over the agents of the administration as well as over the villages. Until now the man who arrested and the man who judged were often the same man on the same veranda. A bench that can convict a commissioner changes what an agent dares write down."
 BELDNC_k_the_colony_keeps_its_own_law:0 "The Colony Keeps Its Own Law"
 BELDNC_k_the_colony_keeps_its_own_law_desc:0 "The Charter's principle stated plainly: the Congo is a distinct patrimony and not a Belgian province. Its accounts are separate, its laws are decrees countersigned in Brussels, and its inhabitants are not Belgians. It is either a discipline upon the kingdom or a wall the kingdom hides behind."
 BELDNC_k_no_congolese_for_europe:0 "No Congolese for Europe"
 BELDNC_k_no_congolese_for_europe_desc:0 "An article no other colonial power has written: the troops of the colony may not be employed outside Africa without a law voted for the purpose. It disarms the charge that the basin was taken to raise regiments, and it takes twenty thousand rifles off the table in any European quarrel."
 BELDNC_k_a_colonial_army_for_the_kingdom:0 "A Colonial Army for the Kingdom"
 BELDNC_k_a_colonial_army_for_the_kingdom_desc:0 "Strike the article out and the establishment at Boma becomes a reserve of the Belgian army: enlistments extended, cadres of metropolitan officers, transports arranged against the day the guarantee is tested. The Chamber will be told it is a police force. Nobody in London will believe it."
 BELDNC_k_the_force_of_africans:0 "The Force of Africans"
 BELDNC_k_the_force_of_africans_desc:0 "Twelve thousand men, almost all of them African, commanded by a few hundred Belgians and recruited by methods the Chamber has spent a decade refusing to describe. Turning a company's armed agents into a state's soldiers means enlistment terms, pay lists, and a term of service that ends."
 BELDNC_k_the_school_at_boma:0 "The School at Boma"
 BELDNC_k_the_school_at_boma_desc:0 "A cadre school with a syllabus: drill, field engineering, and the reading of a written order. Officers arriving from Belgium are given six months of it before they are given men. The alternative is what the basin has now, which is command exercised by whoever has been upriver longest."
 BELDNC_k_the_chefferies_in_law:0 "The Chefferies in Law"
 BELDNC_k_the_chefferies_in_law_desc:0 "Register the chieftaincies, name their limits, and make the chief an officer of the administration with a salary and a duty. It is not self-government and nobody pretends that it is. It does mean a village has a recognised authority the commissioner must go through rather than around."
 BELDNC_k_the_sergeants_who_are_not_white:0 "The Sergeants Who Are Not White"
 BELDNC_k_the_sergeants_who_are_not_white_desc:0 "The men who actually hold the companies together upriver have no rank, no pension and no commission. Signing warrants for African sergeants costs nothing and offends everyone: the officers' mess, the settlers, and every colonial ministry in Europe that must explain why it has not done the same."
 BELDNC_k_the_committee_of_katanga:0 "The Committee of Katanga"
 BELDNC_k_the_committee_of_katanga_desc:0 "Katanga is a thousand miles from Boma and is run by a committee answerable to a company charter rather than to the colony. Bringing it under the provinces means buying out a jurisdiction the state itself created. The copper beneath it is why anybody in Brussels remembers that it exists."
 BELDNC_k_the_copper_at_elisabethville:0 "The Copper at Elisabethville"
 BELDNC_k_the_copper_at_elisabethville_desc:0 "Furnaces on the plateau, a company town, and a seam that assays higher than anything in Europe. The smelter is the point: ore shipped raw pays for other people's works. The men who dig it are recruited from four hundred miles away and the mortality is written down where it can be read."
 BELDNC_k_the_line_that_leaves_the_kingdom:0 "The Line That Leaves the Kingdom"
 BELDNC_k_the_line_that_leaves_the_kingdom_desc:0 "The shortest rail from the copper to a port runs south through Rhodesia and out at Beira. It is cheap, it is quick, and it places the colony's one valuable export at the mercy of a frontier we do not control. The alternative is a longer haul north to the river, and the river has rapids."
 BELDNC_k_the_river_and_the_rail:0 "The River and the Rail"
 BELDNC_k_the_river_and_the_rail_desc:0 "Rail where the river cannot be navigated, steamers where it can, and a single administration timetable binding Boma to the plateau. It is the first thing done in the basin that a Belgian minister can defend in open Chamber without lowering his voice, and it belongs to the colony itself."
 BELDNC_eco_the_works_at_antwerp:0 "The Works at Antwerp"
 BELDNC_eco_the_works_at_antwerp_desc:0 "Quays cut straight, hydraulic cranes, a grain elevator and a basin deep enough for the new ships. The port already handles more tonnage than the kingdom can use and is beginning to handle the Rhineland's as well. Whoever votes the works decides whose city Antwerp is going to be."
 BELDNC_eco_the_note_to_the_hague:0 "The Note to The Hague"
 BELDNC_eco_the_note_to_the_hague_desc:0 "A formal note asking that the pilotage and the lighting of the lower Scheldt be placed under a joint commission. The Hague has heard this before and keeps a file for it. Sending the note commits us to hearing the answer, and to explaining the answer afterwards to the Chamber."
 BELDNC_eco_ostend_and_the_packet:0 "Ostend and the Packet"
 BELDNC_eco_ostend_and_the_packet_desc:0 "The state's own mail packets run to Dover four times a day, the fastest crossing in Europe, and the town lives on the season the King spends in it. It is a small marine, run by the railway department rather than by any navy, and it is the only saltwater service the kingdom has ever paid for."
 BELDNC_eco_the_docks_of_the_left_bank:0 "The Docks of the Left Bank"
 BELDNC_eco_the_docks_of_the_left_bank_desc:0 "The right bank is built out. Everything further must cross the river onto polder belonging to Flemish communes who have not been asked. Basins, a tunnel and a building yard on the left bank would double the port and would settle nothing whatever about whom the port belongs to."
 BELDNC_eco_the_pilots_of_flushing:0 "The Pilots of Flushing"
 BELDNC_eco_the_pilots_of_flushing_desc:0 "Accept it: Dutch pilots, Dutch buoys, Dutch lights, and a convention renewed quietly every few years. It is humiliating on paper and it works. The ships come up on the tide, the insurers are content, and the Chamber is not asked to vote a single franc for the privilege."
 BELDNC_eco_the_canal_that_avoids_the_dutch:0 "The Canal That Avoids the Dutch"
 BELDNC_eco_the_canal_that_avoids_the_dutch_desc:0 "Cut a ship canal from the Scheldt to the coast across Belgian soil and the estuary stops mattering. The engineers say that it can be done. The Hague will read the survey as a hostile act, the cost will be argued for a decade, and no minister who begins it will be in office when it opens."
 BELDNC_eco_the_fisheries_of_the_coast:0 "The Fisheries of the Coast"
 BELDNC_eco_the_fisheries_of_the_coast_desc:0 "Four hundred boats out of Ostend, Heist and Blankenberge, crews who learn the North Sea before they learn anything else, and a register nobody has kept properly since the trawlers came in. Registered men are men who can be found again, and the sea does not care which language the list is in."
 BELDNC_eco_zeebrugge_and_the_mole:0 "Zeebrugge and the Mole"
 BELDNC_eco_zeebrugge_and_the_mole_desc:0 "A curving mole a mile and a half long thrown out into the sea, and behind it deep water at any state of the tide, reached by canal from Bruges. It is a harbour the Scheldt cannot close. It is also, as every attache in Brussels notes, a harbour a fleet could use if it arrived here first."
 BELDNC_eco_the_fortress_and_the_port:0 "The Fortress and the Port"
 BELDNC_eco_the_fortress_and_the_port_desc:0 "Antwerp cannot be the national redoubt and a free commercial harbour at once without somebody losing. The enceinte wants the ground the basins want; the garrison wants a river it can close; the shippers want a city that does not look like a siege waiting to happen. Somebody must rule."
 BELDNC_eco_the_coast_is_a_flank:0 "The Coast Is a Flank"
 BELDNC_eco_the_coast_is_a_flank_desc:0 "Forty miles of dunes, three harbours and no fleet. If the guarantee fails, the coast is where somebody else's army finds a landing or somebody else's navy finds a base. Batteries in the dunes, a balloon section at Ostend to watch the offing, and the fishermen registered as a reserve of seamen."
 BELDNC_eco_the_state_marine:0 "The State Marine"
 BELDNC_eco_the_state_marine_desc:0 "Two hulls, a training brig and a hundred officers is not a navy and is not meant to be. It is a flag that can be shown, a school that can produce men who understand a chart, and an argument in the Chamber that the kingdom which owns Antwerp ought to be able to put something to sea."
 BELDNC_eco_the_kingdom_faces_the_sea:0 "The Kingdom Faces the Sea"
 BELDNC_eco_the_kingdom_faces_the_sea_desc:0 "The estuary settled one way or the other, the coast fortified, the port and the fortress reconciled, and a marine however small under the national flag. For a country that has spent seventy years looking east at its frontier, it is the first coherent policy it has ever had for its own water."
 BELDNC_s_the_communal_schools:0 "The Communal Schools"
 BELDNC_s_the_communal_schools_desc:0 "Every commune must maintain a school; most maintain a bad one, in a rented room, with a master paid less than a foreman. A subsidy tied to a standard of building, a class size and a salary changes that, and it lays the state's hand on a door the parish has held for eighty years."
 BELDNC_s_the_grant_to_the_free_schools:0 "The Grant to the Free Schools"
 BELDNC_s_the_grant_to_the_free_schools_desc:0 "The congregations teach more Belgian children than the communes do, and they do it on charity and school pence. A grant from the treasury recognises what already exists, secures the Catholic countryside for a generation, and tells the Liberals exactly what kind of ministry this is."
 BELDNC_s_the_teachers_certificate:0 "The Teacher's Certificate"
 BELDNC_s_the_teachers_certificate_desc:0 "Nobody may teach without a certificate from a normal school inspected by the state, whoever owns the schoolroom. It is the quietest way of reaching inside the free schools that anybody has yet devised, and every man voting on it understands that it is not really about pedagogy at all."
 BELDNC_s_the_child_must_attend:0 "The Child Must Attend"
 BELDNC_s_the_child_must_attend_desc:0 "Compulsory attendance to the age of fourteen, with penalties upon the parent and an inspector to enforce them. Belgium is the last country in western Europe without it, and the reason is that neither side will accept the other's schools as the place the child is compelled to sit."
 BELDNC_s_the_school_and_the_pithead:0 "The School and the Pithead"
 BELDNC_s_the_school_and_the_pithead_desc:0 "Half-time children go down the pit in the morning and to a bench in the afternoon, and they learn nothing in either place. Ending it costs the coal owners a cheap grade of labour and costs several thousand families a wage, and the inspectors must count children nobody has ever counted."
 BELDNC_s_the_bishops_answer:0 "The Bishops Answer"
 BELDNC_s_the_bishops_answer_desc:0 "A collective letter read from every pulpit in the kingdom on the same Sunday morning. It is not a negotiating position; it is the terms on which the hierarchy will permit a ministry to live. Governments have fallen over less, and the letter is written to be read aloud rather than answered."
 BELDNC_s_one_law_for_two_tongues:0 "One Law for Two Tongues"
 BELDNC_s_one_law_for_two_tongues_desc:0 "The school law must say which language a child is taught in, and the honest answer is that it depends where the child lives. Writing that into the statute concedes in law what everyone concedes in practice, and turns a question about schools into a question about the shape of the kingdom."
 BELDNC_s_the_school_question_closed:0 "The School Question Closed"
 BELDNC_s_the_school_question_closed_desc:0 "Attendance compelled, the grant settled, the certificate required and the language of instruction written down. Nobody has won. What has happened is that the quarrel which has broken every Belgian ministry since the great fight is now a matter of administration rather than of principle."
 BELDNC_b_the_inspectorate_of_mines:0 "The Inspectorate of Mines"
 BELDNC_b_the_inspectorate_of_mines_desc:0 "Engineers with the right to go down any shaft unannounced, to condemn a working, and to publish what they find. There are eleven of them at present for the whole kingdom, and their reports go to a minister rather than to the Chamber. Both of those numbers can be changed by a signature."
 BELDNC_b_the_gendarmes_at_the_pithead:0 "The Gendarmes at the Pithead"
 BELDNC_b_the_gendarmes_at_the_pithead_desc:0 "When the basin stops, the gendarmerie is sent, and once in a decade somebody is shot. Standing detachments at the pitheads keep the winding gear turning and the owners calm. They also guarantee that the next dispute opens with a line of carbines rather than with a deputation."
 BELDNC_b_the_women_and_children_underground:0 "Women and Children Underground"
 BELDNC_b_the_women_and_children_underground_desc:0 "Girls at the screens, boys on the haulage, and women at the pit brow doing work the law of every neighbouring country stopped a generation ago. Ending it is cheap in money and dear in wages, because a household counted upon three earnings and will now have to count upon two."
 BELDNC_b_the_sunday_of_rest:0 "The Sunday of Rest"
 BELDNC_b_the_sunday_of_rest_desc:0 "One day in seven with the winding gear stopped. The Right wants it because it is the Lord's day, the Left wants it because it is a day, and the owners observe that a pit which stops must be pumped anyway. It is the rare Belgian law both benches can vote for entirely different reasons."
 BELDNC_b_the_bourse_du_travail:0 "The Bourse du Travail"
 BELDNC_b_the_bourse_du_travail_desc:0 "A building with a hall, a library, a co-operative bakery and an office where a union may lawfully keep its books. Recognising the syndicates means bargaining with them instead of with a crowd, and it means the state has admitted that the men in the basin are a party to something."
 BELDNC_b_the_basin_that_carries_the_kingdom:0 "The Basin That Carries the Kingdom"
 BELDNC_b_the_basin_that_carries_the_kingdom_desc:0 "Coal, iron, glass and the arms works of the Sambre, worked by people who have spent twenty years being counted, policed and legislated about. What the basin is finally offered decides whether Wallonia reads itself as the engine of Belgium or as a province held down by other men's gendarmes."
 BELDNC_g_the_five_signatures_read_again:0 "The Five Signatures Read Again"
 BELDNC_g_the_five_signatures_read_again_desc:0 "Identical enquiries to London, Paris, Berlin, Vienna and Petersburg, courteously worded, asking how each government understands its obligation. Five replies will arrive. They will not agree with one another, and the discrepancy is the most useful thing the kingdom has learned in decades."
 BELDNC_g_the_letter_from_london:0 "The Letter from London"
 BELDNC_g_the_letter_from_london_desc:0 "London answers at length and in writing: the obligation is understood, the fleet is mentioned, and the reply may be shown to others. It is the strongest paper the kingdom possesses. It is also a document which makes us, in every chancellery in Europe, quite plainly somebody's client."
 BELDNC_g_the_letter_from_berlin:0 "The Letter from Berlin"
 BELDNC_g_the_letter_from_berlin_desc:0 "Berlin answers warmly, at length, and with a courtesy that costs it nothing at all. The paper is worth exactly what the general staff on the far side of the Meuse decides it is worth. Accepting it as sufficient is a choice, and everybody who reads the file will know it was made."
 BELDNC_g_a_neutrality_that_arms_itself:0 "A Neutrality That Arms Itself"
 BELDNC_g_a_neutrality_that_arms_itself_desc:0 "Neutrality is not a policy; it is a status which somebody else confers. Arming it turns it into one. No alliance, no faction, no promise given to anybody, and enough field army and enough concrete that the guarantors have a reason to keep their word beyond their own good nature."
 BEL_tt_nobody_has_settled_this:0 "§YNo bloc has settled the question:§! it is decided by officials working without a doctrine, and nobody signs their name to it."
 BEL_tt_the_king_is_new:0 "§GLeopold is dead:§! this is a law of Albert's reign, and he is not the man it was written against."
 BEL_tt_the_denials_are_read_back:0 "§RThe denials are on the record:§! everything the kingdom told the world before is read back to it, line by line."
 BEL_tt_nothing_was_denied:0 "§GNothing has been denied:§! the document is read as a document rather than as a confession."
 BEL_tt_a_danger_is_named:0 "§RA danger has been named on the Meuse:§! the works, the classes and the notes are all pointed the same way."
 BEL_tt_a_danger_is_named_south:0 "§RA danger has been named on the Sambre:§! the frontier that is watched is the one Wallonia lives on."
 BEL_tt_no_danger_is_named:0 "§GNo appreciation has been made:§! nothing is pointed at anybody, and nothing is pointed at anything either."
 BEL_tt_the_redoubt_exists:0 "§RThe national redoubt is built:§! the ground was laid out for a siege before it was laid out for anything else."
 BEL_tt_no_redoubt_yet:0 "§GNo enceinte has been fixed:§! the engineers may still lay the ground out for its proper purpose."
 BEL_tt_the_classes_are_called_up:0 "§GPersonal service is law:§! the kingdom can put its classes in the field, and everything it says is heard accordingly."
 BEL_tt_no_classes_to_call:0 "§RThe lottery still stands:§! the kingdom fills its ranks by drawing numbers, and everything it says is discounted for it."
 BEL_tt_the_army_speaks_both:0 "§GThe army commands in both tongues:§! the order is understood in the ranks that have to obey it."
 BEL_tt_the_army_speaks_french:0 "§RThe army commands in French:§! more than half the men in the ranks were raised in Dutch."
 BEL_tt_ghent_teaches_in_dutch:0 "§GGhent teaches in Dutch:§! there is somewhere in the kingdom to train the masters this requires."
 BEL_tt_the_pitheads_were_garrisoned:0 "§RThe pitheads were garrisoned:§! the men on the other side of the table remember exactly who was standing there."
 BEL_k_the_provinces_inherit_the_agents_tt:0 "§RThe old regime survives in the districts:§! the new provinces are staffed by the men who ran them before, at the same desks."
 BEL_k_the_provinces_start_clean_tt:0 "§GThe stations have already been broken up:§! the provinces are staffed by men with no ledger of their own to hide."
 BEL_k_the_governor_answers_a_minister_tt:0 "The Governor-General answers to the Colonial Minister and to nobody else in particular."
 BEL_k_the_bench_follows_the_provinces_tt:0 "§GThe provinces are drawn:§! the tribunal has a jurisdiction that matches an administration instead of a company's map."
 BEL_k_the_minister_names_the_judges_tt:0 "§GThe magistrates are named by a minister who can be questioned about them from the floor of the Chamber.§!"
 BEL_k_the_leash_becomes_a_code_tt:0 "§GThe Charter stops being a restraint on Brussels and becomes a body of law the colony is administered under.§!"
 BEL_k_recruited_as_the_state_recruited_tt:0 "§RThe old recruiting habits survive:§! the levy is filled the way it has always been filled, and everyone upriver knows how."
 BEL_k_recruited_by_engagement_tt:0 "§GRecruiting has been reformed:§! the men sign engagements, are paid on a list, and the engagements end."
 BEL_k_the_ministry_inherits_the_force_tt:0 "The Force passes to a ministry that did not raise it and does not entirely know what it has been given."
 BEL_k_the_committee_writes_its_own_charter_tt:0 "§RThe Chamber is not interested:§! the Committee of Katanga writes its own powers and submits them for signature."
 BEL_k_the_concession_is_signed_by_a_minister_tt:0 "A minister signs the traffic convention and lays the text on the table the same week."
 BEL_k_the_concession_is_debated_first_tt:0 "The convention is debated for six weeks before anybody is permitted to sign it."
 BEL_k_the_copper_goes_out_through_london_tt:0 "§GBritain holds the line to the south:§! the copper leaves Africa on rails we do not own and cannot afford to lose."
 BEL_k_the_ministry_asks_for_figures_tt:0 "The ministry asks for the recruiting figures and is given some of them."
 BEL_p_the_hague_is_a_neighbour_tt:0 "§YThe Netherlands hold the estuary:§! nothing about the Scheldt can be settled without them, and they know it."
 BEL_p_flanders_owns_the_river_bank_tt:0 "§YTwo peoples in law:§! the river runs through Flanders, and Flanders has a statute to say so with."
 BEL_p_the_note_goes_to_the_hague_tt:0 "§YThe note is delivered:§! The Hague will answer, and the answer will be quoted at us for twenty years."
 BEL_p_a_minister_writes_the_note_tt:0 "A minister drafts the note and nobody in the kingdom makes a speech about it."
 BEL_p_the_packet_lands_at_dover_tt:0 "§GThere is a Britain to land at:§! the fastest crossing in Europe becomes a standing link with London."
 BEL_p_the_hague_keeps_the_pilotage_tt:0 "§GThe convention is renewed:§! Dutch pilots bring our ships up the estuary and both governments prefer not to discuss it."
 BEL_p_the_hague_reads_the_survey_tt:0 "§RThe Hague reads the survey:§! a canal that bypasses the estuary is understood in exactly the sense it was meant."
 BEL_p_the_crews_are_given_a_contract_tt:0 "The share system is written down, and the owners discover they have signed something."
 BEL_p_london_measures_the_mole_tt:0 "§RLondon measures the mole:§! a deep-water harbour opposite the Thames is noted in more than one office."
 BEL_p_the_place_beats_the_port_tt:0 "§RThe garrison wins the argument:§! the shippers are told to be patriotic and the basins wait."
 BEL_p_the_port_beats_the_place_tt:0 "§GThe commercial interest wins:§! the fortress is fitted around the basins rather than the other way about."
 BEL_p_we_reach_the_sea_by_arrangement_tt:0 "§YThe estuary remains Dutch:§! we reach the sea on terms renewed by treaty and kept by nothing but goodwill."
 BEL_p_a_commercial_policy_tt:0 "The sea policy is written by shipowners and reads like a prospectus."
 BEL_p_a_policy_of_the_quays_tt:0 "The sea policy is written with the dockers' syndicate sitting in the room."
 BEL_s_the_question_reopens_itself_tt:0 "Nobody reopened it. A prosecution, a circular and a bishop's letter reopened it between them."
 BEL_s_the_commune_chooses_its_own_tongue_tt:0 "§YTwo peoples in law:§! the commune chooses its own language of instruction and the ministry pays for it."
 BEL_s_the_ministry_chooses_for_the_commune_tt:0 "§ROne kingdom, one law:§! the ministry decides what language the commune's school will teach in."
 BEL_s_the_certificate_reaches_the_congregations_tt:0 "§RThe free schools take the grant:§! the certificate now binds the congregations that accepted the money."
 BEL_s_the_certificate_binds_the_communes_only_tt:0 "The certificate binds the communal schools and leaves the others exactly where they were."
 BEL_s_compulsion_by_royal_decree_tt:0 "§RCarried without a majority:§! the attendance law is enforced by circular rather than by consent."
 BEL_s_compulsion_without_a_majority_tt:0 "The law passes on a handful of votes, and the inspectors are given no money to enforce it."
 BEL_s_the_inspector_already_counts_them_tt:0 "§GThe mines inspectorate exists:§! the half-time children are already on a list that somebody keeps."
 BEL_s_the_basin_is_bought_off_a_little_tt:0 "§GThe basin has been agitating:§! this is the first thing it has been given that it actually asked for."
 BEL_s_the_bishops_speak_against_the_ministry_tt:0 "§RThe hierarchy is against the ministry:§! the letter is a declaration of war read from six thousand pulpits."
 BEL_b_the_inspectors_are_believed_tt:0 "§GThe reports are printed in full:§! the owners are obliged to answer them in public."
 BEL_b_the_inspectors_are_few_tt:0 "§YEleven inspectors become fifteen,§! which is not the number that was asked for."
 BEL_b_the_inspectors_report_to_the_ministry_only_tt:0 "§RThe reports go to a minister:§! they are not laid before the Chamber and are not printed."
 BEL_b_the_children_have_a_bench_to_go_to_tt:0 "§GAttendance is compulsory:§! the children taken off the haulage have somewhere the law sends them."
 BEL_b_the_basin_takes_the_sunday_tt:0 "§GThe basin has been agitating:§! the rest day takes the edge off a dispute that was hardening."
 BEL_b_wallonia_reads_it_as_an_occupation_tt:0 "§YTwo peoples in law:§! Wallonia has a statute, and reads a standing garrison in the basin accordingly."
 BEL_b_wallonia_bargains_as_a_province_tt:0 "§ROne kingdom, one law:§! the basin is a set of provinces petitioning a ministry, and is answered as one."
 BEL_b_wallonia_bargains_with_nothing_tt:0 "The kingdom has not decided what Wallonia is, and the basin bargains with nothing in its hand."
 BEL_b_the_basin_is_governed_from_outside_tt:0 "§YProsperous and legislated for,§! the basin is represented in the ministry by nobody it elected."
 BEL_b_the_basin_is_policed_from_outside_tt:0 "§RThe works are built and the wages are paid,§! and the carbines stay exactly where they are."
 BEL_g_london_answers_in_writing_tt:0 "§GLondon answers:§! the obligation is acknowledged in terms that may be shown to a third party."
 BEL_g_berlin_answers_in_writing_tt:0 "§YBerlin answers:§! the reply is warm, lengthy, and commits precisely nothing to a date."
 BEL_g_the_ministry_asks_it_privately_tt:0 "The question is put through the legations and the file is kept closed."
 BEL_g_the_ministry_files_the_replies_tt:0 "The five replies are read, compared, and locked in a cabinet."
 BEL_g_the_ministry_files_it_and_says_nothing_tt:0 "The letter is filed, and the ministry declines to be congratulated on it."
 BEL_g_the_ministry_keeps_it_out_of_the_papers_tt:0 "The reply is received, acknowledged, and never mentioned in public."
 BEL_g_armed_and_leaning_west_tt:0 "§GLondon has answered in writing:§! the armed neutrality has one signature behind it worth the paper."
 BEL_g_armed_and_leaning_east_tt:0 "§RBerlin has answered in writing:§! the armed neutrality leans on the guarantor nearest the frontier."
 BEL_p_we_reach_the_sea_without_asking_tt:0 "§GThe canal is cut:§! the kingdom reaches blue water without asking anybody's pilots for permission."
 BEL_s_the_communes_already_teach_in_dutch_tt:0 "§GThe communal schools already teach in Dutch:§! the subsidy strengthens a system nobody resents."
 BEL_s_the_communes_teach_in_french_tt:0 "§RThe communal schools teach in French:§! the subsidy pays to instruct Flemish children in a language of instruction."
 BEL_s_the_war_becomes_a_settlement_tt:0 "§GThe schools quarrel stops being a war and becomes a body of administrative law.§!"
 BEL_b_nobody_was_shot_here_tt:0 "§GNo garrison was ever posted at the pitheads:§! the recognition is taken at face value."
 BEL_g_the_replies_are_not_laid_before_the_house_tt:0 "§RThe replies are not communicated to the Chamber,§! and the Chamber notices."
 BEL_k_the_charter_is_a_leash:0 "The Charter Binds Brussels"
 BEL_k_the_charter_is_a_leash_desc:0 "The colony is governed by decree, but every decree must be countersigned, printed and defensible."
 BEL_k_the_law_of_the_colony:0 "The Law of the Colony"
 BEL_k_the_law_of_the_colony_desc:0 "A distinct patrimony with its own code, its own bench and its own budget line."
 BEL_k_the_four_provinces:0 "The Four Provinces"
 BEL_k_the_four_provinces_desc:0 "Vice-governors, provincial registries and a chain of command that ends somewhere a letter can reach."
 BEL_k_the_report_on_the_table:0 "The Report on the Table"
 BEL_k_the_report_on_the_table_desc:0 "For one session the Chamber has the figures in front of it, and the ministry answers about them daily."
 BEL_k_the_tribunal_at_boma:0 "The Tribunal at Boma"
 BEL_k_the_tribunal_at_boma_desc:0 "Irremovable magistrates who may try an agent of the administration."
 BEL_k_no_congolese_for_europe:0 "No Congolese for Europe"
 BEL_k_no_congolese_for_europe_desc:0 "The Force may not be employed outside Africa without a law."
 BEL_k_the_colonial_army:0 "The Colonial Army"
 BEL_k_the_colonial_army_desc:0 "Extended enlistments, metropolitan cadres and a transport plan."
 BEL_k_the_force_of_africans:0 "The Force of Africans"
 BEL_k_the_force_of_africans_desc:0 "Enlistment terms, pay lists, a term of service that ends, and a discipline written in a regulation rather than in the habits of an agent."
 BEL_k_the_school_at_boma:0 "The School at Boma"
 BEL_k_the_school_at_boma_desc:0 "Six months of drill, field engineering and written orders before an officer is given men."
 BEL_k_the_chefferies:0 "The Chefferies"
 BEL_k_the_chefferies_desc:0 "Registered chieftaincies with named limits and salaried chiefs."
 BEL_k_the_commissions_are_signed:0 "The Commissions Are Signed"
 BEL_k_the_commissions_are_signed_desc:0 "African sergeants hold warrants."
 BEL_k_the_committee_of_katanga:0 "The Committee of Katanga"
 BEL_k_the_committee_of_katanga_desc:0 "The plateau is brought under the colony's administration, with a special regime that everybody agrees is temporary and nobody expects to end."
 BEL_k_the_copper_of_the_south:0 "The Copper of the South"
 BEL_k_the_copper_of_the_south_desc:0 "Furnaces on the plateau turning ore into metal before it leaves Africa."
 BEL_k_the_line_through_rhodesia:0 "The Line Through Rhodesia"
 BEL_k_the_line_through_rhodesia_desc:0 "The copper leaves by the southern rail and a foreign port."
 BEL_k_the_river_and_the_rail:0 "The River and the Rail"
 BEL_k_the_river_and_the_rail_desc:0 "Rail around the rapids, steamers between them, and one timetable from the plateau to the sea."
 BEL_p_the_mouth_is_dutch:0 "The Mouth Is Dutch"
 BEL_p_the_mouth_is_dutch_desc:0 "Fifty miles of another kingdom's water between our greatest port and the sea."
 BEL_p_the_packet_at_ostend:0 "The Packet at Ostend"
