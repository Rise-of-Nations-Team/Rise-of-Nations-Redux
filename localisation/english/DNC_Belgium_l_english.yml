 BEL_s_the_school_question_closed_desc:0 "Forty years of quarrel reduced to a schedule of grants and an inspectorate. Ministries may now fall over other things."
 BEL_b_the_pits_of_the_borinage:0 "The Pits of the Borinage"
 BEL_b_the_pits_of_the_borinage_desc:0 "Thin seams, deep galleries and the shortest lives in the kingdom, producing the coal that everything else in Belgium is built on."
 BEL_b_the_inspectorate:0 "The Inspectorate of Mines"
 BEL_b_the_inspectorate_desc:0 "Engineers who may go down unannounced and condemn a working."
