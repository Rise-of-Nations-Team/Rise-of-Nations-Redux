 BEL_k_the_right_writes_the_leash_short_tt:0 "§YSettlement:§! the Charter is drafted narrowly."
 BEL_k_the_left_writes_the_leash_long_tt:0 "§YCartel:§! every restriction the reformers ever demanded goes into the text."
 BEL_k_the_crown_writes_its_own_leash_tt:0 "§RCrown:§! the Charter is drafted at the palace."
 BEL_k_nobody_governs_the_leash_tt:0 "§YNo bloc has taken the Chamber:§! the Charter is drafted by officials and nobody signs their name to it."
 BEL_k_the_leash_binds_a_new_king_tt:0 "§GLeopold is dead:§! the Charter is the first law of Albert's reign."
 BEL_k_the_governor_answers_the_palace_tt:0 "§RCrown:§! the Governor-General is a royal appointment and corresponds with the palace."
 BEL_k_the_governor_answers_the_house_tt:0 "§YCartel:§! the Governor-General may be summoned to the bar of the Chamber."
 BEL_k_the_settlement_likes_a_hierarchy_tt:0 "§YSettlement:§! a clean chain of command from Boma downward is exactly what the Right wanted."
 BEL_k_the_report_meets_the_denials_tt:0 "§RThe denials are on the record:§! the first annual report is read against everything we told the world before."
