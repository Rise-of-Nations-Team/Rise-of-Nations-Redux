 BEL_p_the_mole_stands_by_itself_tt:0 "The mole is a commercial work with no soldier's plan behind it."
 BEL_p_the_palace_wanted_a_harbour_tt:0 "§RCrown:§! the harbour was the King's idea and the engineers have learned not to argue."
 BEL_p_the_enceinte_is_already_drawn_tt:0 "§RThe redoubt is built:§! the port must be laid out inside a fortress that was designed first."
