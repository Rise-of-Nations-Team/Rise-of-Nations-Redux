 BEL_g_the_word_of_london:0 "The Word of London"
 BEL_g_the_word_of_london_desc:0 "A written undertaking from the one guarantor with a fleet."
 BEL_g_the_word_of_berlin:0 "The Word of Berlin"
 BEL_g_the_word_of_berlin_desc:0 "A warm and entirely unbinding assurance from the guarantor whose army is nearest."
 BEL_g_the_armed_neutral:0 "The Armed Neutral"
 BEL_g_the_armed_neutral_desc:0 "No alliance, no faction, no promises given."
