  ww1_oil1: "Oil Extraction"
  ww1_oil1_desc: "Oil and its uses have been known since the late 19th century, and sadly, most of our oil extraction ability dates much the same. Modernizing our oil wells will increase our take of this valuable substance to a good degree."
  ww1_oil2: "Improved Oil Drilling"
  ww1_oil2_desc: "Oil is elusive it hides underground, where none can see it. For this reason, it's imperitive that we develop more efficient ways to locate it. By improving our oil drilling capabilities, we can find and, therefore, exploit more oil around existing reserves."
  ww1_oil3: "Oil Worker Training"
  ww1_oil3_desc: "With the recent advances in the tools to find and extract oil, we cannot let our workers be the reason our efforts fall behind. By establishing training standards for oil field workers in both the private and public sector, we can make sure less oil is wasted, further bolstering our newfound reserves of black gold."
  ww1_bergiusprocess: "Bergius Process"
  ww1_bergiusprocess_desc: "The Bergius Process is a method of production of liquid hydrocarbons for use as synthetic fuel by hydrogenation of high-volatile bituminous coal at high temperature and pressure."
