l_english:
 CANDNC_the_last_best_west_pamphlet: "The Last Best West"
 CANDNC_the_last_best_west_pamphlet_desc: "Clifford Sifton's department prints it by the crate: black soil, free land, no landlord. Agents in Hamburg and Kiev are paid by the head for every farmer they put on a ship at Antwerp."
 CANDNC_the_agents_paid_by_the_head: "Paid by the Head"
 CANDNC_the_agents_paid_by_the_head_desc: "The secret contract of 1899 with the North Atlantic Trading Company. Five shillings a man, two for a woman or child, and no question asked about the language he speaks when he lands at Quebec."
 CANDNC_only_the_british_stock: "Only the British Stock"
 CANDNC_only_the_british_stock_desc: "Ontario wants the prairie filled with men who already sing God Save the King. Recruit in Yorkshire and Iowa, pay no bonus for a Galician, and accept that the sections fill slowly."
 CANDNC_the_galicians_in_sheepskin_coats: "Sheepskin Coats"
 CANDNC_the_galicians_in_sheepskin_coats_desc: "They come from Galicia and Bukovina with a trunk and an axe, and they break land that beat better-dressed men. Winnipeg calls them the scum of Europe; the crop returns call them the best farmers we have."
 CANDNC_the_barr_party_lands_at_saint_john: "The Barr Party"
 CANDNC_the_barr_party_lands_at_saint_john_desc: "Two thousand English townsmen cross on the Lake Manitoba behind the Reverend Isaac Barr, bound for a colony none of them has seen. Half have never held a plough, and they land at Saint John in April 1903."
 CANDNC_the_pilgrimage_from_yorkton: "The Pilgrimage from Yorkton"
 CANDNC_the_pilgrimage_from_yorkton_desc: "In the cold of October the Doukhobors turn their oxen loose and walk east, the men in front, refusing private property and the use of beasts. Peter Verigin is still on a ship out of Russia."
 CANDNC_a_quarter_section_for_ten_dollars: "A Quarter Section for Ten Dollars"
 CANDNC_a_quarter_section_for_ten_dollars_desc: "Ten dollars at the land office, a hundred and sixty acres, three years of residence and thirty acres broken. The Dominion Lands Act asks for sweat instead of capital, and the trains go west full."
 CANDNC_the_colonization_companies: "The Colonization Companies"
 CANDNC_the_colonization_companies_desc: "Sell the townships in blocks and let the companies find the settlers. The Treasury is paid this year, the land is fenced from a Montreal office, and the homesteader arrives to find a price on it."
 CANDNC_the_code_of_1906: "The Code of 1906"
 CANDNC_the_code_of_1906_desc: "Sanctioned 13 July. One statute replaces a scatter of laws: prohibited classes named, medical inspection at the wharf, and a minister who may put a man back on the ship that brought him."
 CANDNC_oliver_burns_the_contract: "Oliver Burns the Contract"
 CANDNC_oliver_burns_the_contract_desc: "Frank Oliver of the Edmonton Bulletin takes the Interior and cancels the North Atlantic Trading Company's bonuses. He wants settlers chosen, not counted, and the West will fill slower for it."
 CANDNC_the_taps_stay_open: "The Taps Stay Open"
 CANDNC_the_taps_stay_open_desc: "Counterfactual. Sifton is gone and his machine is not. Keep paying the agents, keep the ships full, and let Ontario complain about the men who are actually breaking the soil."
 CANDNC_break_up_the_block_settlements: "Break Up the Blocks"
 CANDNC_break_up_the_block_settlements_desc: "One family to a section and no colony larger than a township. Scatter the Mennonite and Doukhobor reserves among English neighbours and the second generation will speak the school's language."
 CANDNC_let_the_colonies_stand: "Let the Colonies Stand"
 CANDNC_let_the_colonies_stand_desc: "The Mennonite keeps his village street, the Doukhobor his common field, and Ottawa keeps the promise it made in 1899. The West grows a mosaic instead of a second Ontario."
 CANDNC_the_sections_the_town_wants: "The Sections the Town Wants"
 CANDNC_the_sections_the_town_wants_desc: "The Indian Act is amended in 1906: half the price of a surrendered reserve paid to the band in cash. Around Edmonton and Regina the surveyors are already walking the line."
 CANDNC_the_reserve_is_not_for_sale: "The Reserve Is Not for Sale"
 CANDNC_the_reserve_is_not_for_sale_desc: "Refuse the surrenders. The band keeps the sections the town wants, the land company waits, and the member for the district writes to Ottawa about progress held up by three hundred people."
 CANDNC_the_five_hundred_dollar_tax: "Five Hundred Dollars at the Wharf"
 CANDNC_the_five_hundred_dollar_tax_desc: "From 1 January 1904 the head tax on a Chinese arrival is five hundred dollars, two years of a labourer's wages. The men already here can no longer send for a wife. The customs house counts the receipts."
 CANDNC_the_asiatic_exclusion_league: "The Asiatic Exclusion League"
 CANDNC_the_asiatic_exclusion_league_desc: "Founded in Vancouver in August 1907 with aldermen on the platform and ministers of religion in the chairs. Ottawa can disown it, or let it march down Hastings Street behind a brass band."
 CANDNC_the_wharf_stays_open: "The Wharf Stays Open"
 CANDNC_the_wharf_stays_open_desc: "Counterfactual. Repeal the tax and let the Pacific in. The canneries and the mills get hands they can find nowhere else, British Columbia curses Ottawa, and Tokyo notices who kept his word."
 CANDNC_the_seventh_of_september: "The Seventh of September"
 CANDNC_the_seventh_of_september_desc: "A parade to the city hall turns down Carrall Street. The Chinese quarter loses its glass; on Powell Street the Japanese, warned in time, come out with staves and hold the crowd until dark."
 CANDNC_lemieux_takes_ship_for_tokyo: "Lemieux Takes Ship for Tokyo"
 CANDNC_lemieux_takes_ship_for_tokyo_desc: "Rodolphe Lemieux sits with Foreign Minister Hayashi and asks Japan to close its own tap. Four hundred labourers a year, no treaty, no statute, and the honour of the decision left in Tokyo."
 CANDNC_the_exclusion_act_london_forbids: "The Act London Forbids"
 CANDNC_the_exclusion_act_london_forbids_desc: "Counterfactual. Write the exclusion British Columbia has demanded since 1900 and dare the Colonial Office to disallow it. The alliance with Japan is five years old and Downing Street will not be embarrassed."
 CANDNC_the_unbroken_passage: "The Continuous Journey"
 CANDNC_the_unbroken_passage_desc: "Order in Council, 8 January 1908: no one may land who has not come by an unbroken passage from the country of his birth, on a ticket bought there. No such sailing exists out of Calcutta."
 CANDNC_the_two_hundred_dollar_rule: "Two Hundred Dollars in Hand"
 CANDNC_the_two_hundred_dollar_rule_desc: "The second order, 3 June 1908: every Asian arrival must show two hundred dollars of his own on the wharf. It names no race, keeps out the men it means, and Parliament never votes on it."
 CANDNC_the_kings_subjects_may_land: "The King's Subjects May Land"
 CANDNC_the_kings_subjects_may_land_desc: "Counterfactual. A Sikh from the Punjab carries the same passport as a farmer from Kent. Admit him on that principle and the Empire's own doctrine holds, in Vancouver, at the price of another September."
 CANDNC_the_factories_on_dupont_street: "The Factories on Dupont Street"
 CANDNC_the_factories_on_dupont_street_desc: "Paying out the riot claims, Mackenzie King finds licensed opium works in the middle of Vancouver, taxed by the city and sold over the counter. He writes a report nobody asked him for."
 CANDNC_the_opium_act_of_1908: "The Opium Act"
 CANDNC_the_opium_act_of_1908_desc: "20 July 1908: import, manufacture and sale forbidden. The first drug prohibition in the country's law, aimed at a trade the city licensed last year and at the quarter that carries it."
 CANDNC_license_the_trade_and_tax_it: "License It and Tax It"
 CANDNC_license_the_trade_and_tax_it_desc: "Counterfactual. Keep the factories, keep the register, and take the revenue Victoria has taken for twenty years. The Methodists in the Commons will call it blood money and be right."
 CANDNC_the_coast_votes_with_its_hands: "The Coast Votes with Its Hands"
 CANDNC_the_coast_votes_with_its_hands_desc: "British Columbia has learned what a crowd on Hastings Street can make Ottawa do inside a fortnight. Whatever the statute says, the wharf is governed from the street."
 CANDNC_haultain_asks_for_one_province: "Haultain Asks for One Province"
 CANDNC_haultain_asks_for_one_province_desc: "Frederick Haultain has governed the Territories from Regina without parties and without money. He comes to Ottawa with a draft bill: one province from Manitoba to the mountains, and he would call it Buffalo."
 CANDNC_one_province_called_buffalo: "The Province of Buffalo"
 CANDNC_one_province_called_buffalo_desc: "Counterfactual. Four hundred and forty thousand people under one legislature, growing faster than anything east of the Lakes. Ontario would have a rival on the plains inside a generation, and it knows it."
 CANDNC_a_line_on_the_fourth_meridian: "A Line on the Fourth Meridian"
 CANDNC_a_line_on_the_fourth_meridian_desc: "Two provinces instead of one, cut by a surveyor's meridian, inaugurated at Edmonton on 1 September 1905 and at Regina on the 4th. Two premiers, two capitals, and half the weight each."
 CANDNC_the_first_of_september: "The First of September"
 CANDNC_the_first_of_september_desc: "Laurier and Earl Grey stand under the arches while a lieutenant-governor appointed in Ottawa decides who is sent for to form the first government of a province four hours old."
 CANDNC_ottawa_keeps_the_lands: "Ottawa Keeps the Lands"
 CANDNC_ottawa_keeps_the_lands_desc: "The soil, the mines, the forests and the water stay Dominion property, with a yearly grant paid in their place. The new provinces are told, politely, that they are of the second rank."
 CANDNC_the_lands_go_west_in_1905: "The Lands Go West in 1905"
 CANDNC_the_lands_go_west_in_1905_desc: "Counterfactual. Hand over the soil and the coal twenty-five years early, as the provinces of 1867 hold theirs. Ottawa loses the homestead as a lever and two prairie treasuries are born full."
 CANDNC_the_cheque_in_lieu_of_the_land: "The Cheque in Lieu of the Land"
 CANDNC_the_cheque_in_lieu_of_the_land_desc: "A subsidy reckoned on a population Ottawa itself counts, paid to legislatures that must ask for it every year. The West learns the difference between an income and an estate."
 CANDNC_the_province_buys_the_wire: "The Province Buys the Wire"
 CANDNC_the_province_buys_the_wire_desc: "Alberta takes over Bell's exchanges in 1906 and Manitoba buys the whole provincial system in January 1908 for three and a third million. The farm gets a telephone the company would never have strung."
 CANDNC_leave_the_wire_to_bell: "Leave the Wire to Bell"
 CANDNC_leave_the_wire_to_bell_desc: "The company keeps the patents, the long distance and the towns; the province keeps its credit. Montreal is pleased, and the section line beyond Red Deer waits another fifteen years for a pole."
 CANDNC_the_royal_north_west_mounted_police: "The Royal North-West Mounted Police"
 CANDNC_the_royal_north_west_mounted_police_desc: "24 June 1904, the royal prefix. One federal force polices four hundred thousand square miles, and the provinces that will inherit the West write neither its orders nor its doctrine."
 CANDNC_the_convention_at_regina: "The Convention at Regina"
 CANDNC_the_convention_at_regina_desc: "Counterfactual. Delegates from the grain associations, the boards of trade and Haultain's old following meet to put a question nobody has yet written down: what does the West get by staying?"
 CANDNC_the_west_takes_its_price: "The West Takes Its Price"
 CANDNC_the_west_takes_its_price_desc: "No convention and no threats, only a bargain in a committee room. Freight concessions, a share of the land revenue, and three more seats when the next redistribution comes round."
 CANDNC_a_fourth_seat_at_the_table: "A Fourth Seat at the Table"
 CANDNC_a_fourth_seat_at_the_table_desc: "Whatever was said at Regina, the Cabinet now counts prairie members before it counts anything else. The country's centre of gravity has moved past the head of the Lakes."
 CANDNC_the_cars_that_never_come: "The Cars That Never Come"
 CANDNC_the_cars_that_never_come_desc: "The 1901 crop stands in the fields because the Canadian Pacific gives its cars to the elevator companies. At Indian Head in December the growers form an association and begin keeping notes."
 CANDNC_the_agent_at_sintaluta: "The Agent at Sintaluta"
 CANDNC_the_agent_at_sintaluta_desc: "The growers take the railway's own agent before a country magistrate for breaking the car-order rules, and win. The largest carrier in the country is convicted by a village bench."
 CANDNC_a_regulator_instead_of_a_judge: "A Regulator Instead of a Judge"
 CANDNC_a_regulator_instead_of_a_judge_desc: "The Railway Act of 1903 sets a standing board over rates, crossings and express charges, sitting from 1 February 1904 under Blair. The Cabinet loses a favour it used to hand out by region."
 CANDNC_partridges_co_operative: "Partridge's Co-operative"
 CANDNC_partridges_co_operative_desc: "The Grain Growers' Grain Company opens at Winnipeg in September 1906 and buys a seat on the Exchange. The Exchange discovers what its members think of a house that pays profits back to farmers."
 CANDNC_the_terminal_elevator_is_public: "The Terminal Elevator Is Public"
 CANDNC_the_terminal_elevator_is_public_desc: "Grade the wheat and store it in a house the grower owns, at the head of the Lakes where the price is made. The line companies lose the spread they have taken since the first branch was built."
 CANDNC_the_line_elevators_keep_the_scale: "The Line Elevators Keep the Scale"
 CANDNC_the_line_elevators_keep_the_scale_desc: "Leave the weighing and the dockage to the companies that built the houses. Grain moves, credit is easy in September, and every grower on the line knows the scale is not his."
 CANDNC_the_second_transcontinental: "The Grand Trunk Pacific"
 CANDNC_the_second_transcontinental_desc: "24 October 1903. The state builds Moncton to Winnipeg and leases it for fifty years; Charles Hays builds west on guaranteed bonds. Blair has already left the Cabinet rather than defend it."
 CANDNC_prince_rupert_on_kaien_island: "Prince Rupert on Kaien Island"
 CANDNC_prince_rupert_on_kaien_island_desc: "A terminus five hundred miles nearer Yokohama than Vancouver, laid out on an island nobody lived on and sold in lots before the rails arrive. The Grand Trunk is betting the Pacific on it."
 CANDNC_blair_leaves_the_cabinet: "The Blair Plan"
 CANDNC_blair_leaves_the_cabinet_desc: "Extend the state's own Intercolonial, use the lines that exist, help one operator and no more. It saves the Treasury a fortune and leaves the prairie with a single railway and its rate book."
 CANDNC_the_coal_of_the_crowsnest: "The Coal of the Crowsnest"
 CANDNC_the_coal_of_the_crowsnest_desc: "The Rockies burn in the fireboxes of every train on the plains, and the seams run under towns thrown up in a season. At Frank the mine drives straight into the flank of Turtle Mountain."
 CANDNC_cancel_the_grazing_leases: "Cancel the Grazing Leases"
 CANDNC_cancel_the_grazing_leases_desc: "The big ranges south of Calgary are held on twenty-one-year leases while homesteaders wait at the land office door. Cancel them and the sod goes under the plough within two seasons."
 CANDNC_the_ranchers_keep_the_range: "The Ranchers Keep the Range"
 CANDNC_the_ranchers_keep_the_range_desc: "South of the Bow the rain fails one year in three, and the men who know it run cattle. Keep the leases and the dry belt stays grass instead of a thousand abandoned quarter sections."
 CANDNC_marquis_ripens_a_week_early: "Marquis Ripens a Week Early"
 CANDNC_marquis_ripens_a_week_early_desc: "Charles Saunders chews kernels at the Central Experimental Farm until he finds the cross that beats the frost: Red Fife by Hard Red Calcutta, tried at Indian Head, out to the growers in 1909."
 CANDNC_the_farmers_enter_politics: "The Farmers Enter Politics"
 CANDNC_the_farmers_enter_politics_desc: "Counterfactual. The United Farmers of Alberta form in January 1909 out of two older bodies. Run them as candidates now instead of in 1921 and the old parties lose the prairie in one election."
 CANDNC_the_farmers_stay_out: "The Farmers Stay Out"
 CANDNC_the_farmers_stay_out_desc: "Petitions, delegations and a co-operative balance sheet, and no candidates anywhere. The associations keep every member and go on asking permission from the men they could have replaced."
 CANDNC_forty_five_students_at_strathcona: "Forty-Five Students at Strathcona"
 CANDNC_forty_five_students_at_strathcona_desc: "Henry Marshall Tory opens the University of Alberta in rented rooms in September 1908 with forty-five students and an agricultural faculty on the plan. Saskatoon gets its charter the same way."
 CANDNC_a_country_of_its_own: "A Country of Its Own"
 CANDNC_a_country_of_its_own_desc: "Fewer than fifty-five in every hundred west of the Lakes were born in this country. Whatever Ottawa decided, the prairie has made a people out of the men who came for the land."
#Events
 can_dnc_d.1.t: "Two Thousand at Saint John"
 can_dnc_d.1.d: "The Lake Manitoba puts them ashore in April and half the colony has already turned on the Reverend Barr over the stores, the wagons and the money. They elect George Exton Lloyd in his place and start west anyway."
 can_dnc_d.1.a: "Send Lloyd west with an escort and a surveyor"
 can_dnc_d.1.b: "Let them find their own way to the fourth meridian"
 can_dnc_d.2.t: "The Pilgrimage from Yorkton"
 can_dnc_d.2.d: "Several hundred are on the road east from the colonies near Yorkton, the men in front, the beasts turned loose behind them. They will not sign for land in one man's name and they will not swear to the King."
 can_dnc_d.2.a: "Tolerate entry in common and say nothing about the oath"
 can_dnc_d.2.b: "Demand the oath, and cancel every entry that is refused"
 can_dnc_d.3.t: "The Riot on Powell Street"
 can_dnc_d.3.d: "The League's parade reached the city hall and did not stop. The Chinese quarter is glass on the pavement; on Powell Street the Japanese were warned in time and the crowd is being pushed back down the block."
 can_dnc_d.3.a: "Call out the militia in aid of the civil power"
 can_dnc_d.3.b: "Leave it to the city police and name a claims commission"
 can_dnc_d.4.t: "Tokyo Asks What Happened"
 can_dnc_d.4.d: "The Japanese consul has cabled Hayashi and Hayashi has cabled London. The alliance of 1902 is quoted back at us line by line, and the answer we give will be read in Whitehall before it is read in Vancouver."
 can_dnc_d.4.a: "Pay the claims and send a minister to Japan"
 can_dnc_d.4.b: "Reply that a Dominion answers for its own wharves"
 can_dnc_d.5.t: "Hayashi's Terms"
 can_dnc_d.5.d: "The Foreign Minister will limit emigration himself rather than be told to. Four hundred labourers and domestics a year, families and returning men not counted, and nothing signed that a newspaper could print."
 can_dnc_d.5.a: "Four hundred a year, and nothing in writing"
 can_dnc_d.5.b: "Ask for a figure Tokyo cannot possibly accept"
 can_dnc_d.6.t: "Downing Street Answers"
 can_dnc_d.6.d: "The Colonial Office reminds us that Japanese subjects are the subjects of an ally, that the power of disallowance has not lapsed, and that it would be a pity to make the King's ministers use it on a Dominion."
 can_dnc_d.6.a: "Withdraw the bill and let the order in council do the work"
 can_dnc_d.6.b: "Let them disallow it, and say so in the House"
 can_dnc_d.7.t: "Who Is Sent For"
 can_dnc_d.7.d: "The province is hours old and has no legislature yet. Bulyea at Edmonton and Forget at Regina hold commissions signed in Ottawa, and each must send for a man to form a government before anyone has voted."
 can_dnc_d.7.a: "Send for Rutherford and Scott"
 can_dnc_d.7.b: "Send for Haultain, who has governed here for fourteen years"
 can_dnc_d.8.t: "The Vote at Regina"
 can_dnc_d.8.d: "The hall has heard about the lands, the freight rates and the meridian, and a delegate from the Territorial growers is on his feet with a resolution that does not mention the word Dominion once."
 can_dnc_d.8.a: "Put the resolution to the hall and let the West answer"
 can_dnc_d.8.b: "Adjourn it, and take the concessions on the table"
 can_dnc_d.9.t: "The Exchange Pulls the Seat"
 can_dnc_d.9.d: "The Winnipeg Grain Exchange has struck the co-operative off its list: a house that pays its profits back to its shippers is not, they rule, a house that trades. Partridge is in the corridor at the legislature."
 can_dnc_d.9.a: "Let the province tell the Exchange to seat them again"
 can_dnc_d.9.b: "Leave the growers to their lawyers"
 can_dnc_d.10.t: "Turtle Mountain Comes Down on Frank"
 can_dnc_d.10.d: "At four in the morning of 29 April the east face of the mountain let go and crossed the valley in about a hundred seconds. The mine mouth, part of the town and two miles of the line are under the rock."
 can_dnc_d.10.a: "Clear the grade and reopen the seam"
 can_dnc_d.10.b: "Move what is left of the town and condemn the slope"
#Ideas
 CAN_paid_by_the_head: "Paid by the Head"
 CAN_paid_by_the_head_desc: "Booking agents on commission across half of Europe, and a department that counts arrivals rather than reads them. The ships are full and the Cabinet answers for every name on the passenger list."
 CAN_the_british_stock: "The British Stock"
 CAN_the_british_stock_desc: "Recruiting is done in English and paid for at English rates. The country fills slowly, quietly, and with men the Orange lodges will vouch for at the polls."
 CAN_the_power_to_deport: "The Power to Deport"
 CAN_the_power_to_deport_desc: "Prohibited classes, medical inspection, and a ministerial order that needs no court behind it. The gate opens and closes at the discretion of one man in Ottawa."
 CAN_selection_at_the_gate: "Selection at the Gate"
 CAN_selection_at_the_gate_desc: "Oliver's rule: the department chooses the settler instead of paying for him. Fewer arrivals, better vetted, and a slower plough across the dry belt."
 CAN_volume_at_any_cost: "Volume at Any Cost"
 CAN_volume_at_any_cost_desc: "Every berth filled and every township entered, whatever the newspapers of Toronto make of the names. The West grows faster than the schools, the police and the churches can follow."
 CAN_the_tax_at_the_wharf: "The Tax at the Wharf"
 CAN_the_tax_at_the_wharf_desc: "Five hundred dollars a head, paid by the poorest men who come and collected by the richest government they will ever meet. The canneries keep their labour and lose their families."
 CAN_the_gate_by_order_in_council: "The Gate by Order in Council"
 CAN_the_gate_by_order_in_council_desc: "Immigration policy written by the Governor in Council, never debated, never voted, and never named for what it does. Parliament has lost a subject it will not easily get back."
 CAN_the_province_of_buffalo: "The Province of Buffalo"
 CAN_the_province_of_buffalo_desc: "One legislature between Manitoba and the mountains, with its own lands and its own mines. It bargains with Ottawa as an equal and it will not stop at bargaining."
 CAN_lands_held_in_ottawa: "The Lands Held in Ottawa"
 CAN_lands_held_in_ottawa_desc: "The homestead, the timber berth and the coal lease are all federal patronage. It settles the West at speed and it teaches two provinces that they own nothing under their own feet."
 CAN_the_west_owns_its_soil: "The West Owns Its Soil"
 CAN_the_west_owns_its_soil_desc: "Land, timber, coal and water pass to the prairie legislatures a quarter of a century early. Ottawa keeps the tariff and loses the lever it used to steer a continent."
#Modifier and effect strings
 CANDNC_prairie_wire: "The Prairie Telephone System"
 CANDNC_bell_patents: "The Bell Patents"
 CANDNC_railway_board: "The Board of Railway Commissioners"
 CANDNC_the_marquis_cross: "Marquis Wheat"
 CANDNC_prairie_universities: "The Prairie Universities"
 CANDNC_mounted_doctrine: "The Mounted Police School"
 CANDNC_vancouver_riot_threat: "The Vancouver Riot"
 CANDNC_tokyo_ultimatum_threat: "Tokyo's Note on Powell Street"
 CANDNC_disallowance_threat: "The Threat of Disallowance"
 CANDNC_regina_convention_threat: "The Convention at Regina"
 CANDNC_western_secession_threat: "The Western Secession"
 CANDNC_blocks_broken_tt: "The bloc colonies are surveyed apart and their common fields entered as separate quarter sections."
 CANDNC_sintaluta_tt: "The conviction at Sintaluta stands on appeal, and every branch line agent on the prairie hears of it."
 CANDNC_agrarian_party_tt: "The farm associations begin nominating candidates against both old parties."
 CANDNC_claims_paid_tt: "The claims commissions pay some twenty-seven thousand dollars to Chinese claimants and nine thousand to Japanese."
 CANDNC_ledger_tt: "The land office adds the season to its column, and the West is that much less empty."
 CANDNC_town_lots_tt: "The lots are surveyed, advertised in Winnipeg and Toronto, and sold before the survey stakes weather."
 CANDNC_surrender_refused_tt: "The surrender is refused and the band keeps the sections; the land company withdraws its offer for the season."
 CANDNC_gate_closed_tt: "The wharf inspector has a rule he can apply without reading a statute, and no arrival can argue with it."
 CANDNC_open_door_tt: "The immigration hall admits British subjects on the strength of the passport, and the coast is told to live with it."
 CANDNC_opium_report_tt: "The report goes to the minister with the licences, the tax receipts and the addresses attached."
 CANDNC_west_bargain_tt: "The concessions are entered in the estimates: freight, land revenue, and three seats at the next redistribution."
 CANDNC_prairie_members_tt: "Prairie members are counted first in the Cabinet room, before Ontario and before Quebec."
 CANDNC_car_orders_tt: "The car order book at every siding is now read aloud at the growers meeting."
 CANDNC_marquis_tt: "Marquis is distributed from Indian Head and the frost line moves two hundred miles north."
 CANDNC_farmers_stay_out_tt: "The associations resolve to petition, not to nominate, and the two old parties breathe out."
