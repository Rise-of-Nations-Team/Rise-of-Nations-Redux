l_english:
 change_era.1.t:0 "The Calendar and the Clock"
 change_era.1.d:0 "The chancelleries keep one date and the world keeps another. By the ledger it is year §Y[?global.year|0]§!, month §Y[?global.RON_mc|0]§! of the century, and the age on record is §Y[?global.RON_era|0]§! after §Y[?global.RON_great_wars|0]§! great war or wars. If that is not the world outside the window, say which age this is and the record will be corrected."
 change_era.1.a:0 "This is still the long peace"
 change_era.1.b:0 "There is a general war on"
 change_era.1.c:0 "The guns have stopped and nothing is settled"
 change_era.1.e:0 "Two armed camps and no war between them"
 change_era.1.f:0 "The record is right; leave it"
