#Ideas
 SREOFR_DNC_a_fight_against_a_superpower_ns: "The Fight Against A Superpower"
#Focuses
 SREOFR_DNC_a_fight_against_a_superpower: "The Fight Against A Superpower"
 SREOFR_DNC_a_fight_against_a_superpower_desc: "The British have been crushing us for long enough. Today, the wind of freedom has blown, and it's blowing strong. On the wings of this wind, our warriors will fly, and together we'll drive those swines out of our lands."
 SREOFR_DNC_repell_british_advances: "Repell British Advances"
 SREOFR_DNC_repell_british_advances_desc: "We have been pushed back significantly, but we haven't lost yet. We know that their army is much stronger than ours, so we have to use unconventional tactics and strategies, but it'll pay off for us. They'll regret ever setting foot on our land!"
 SREOFR_DNC_peace_at_last: "Peace At Last"
 SREOFR_DNC_peace_at_last_desc: "After an exhausting war, peace has finally come. We'll be able to rebuild our country from the destruction brought by this tragedy and give our descendants a better future than ours."
#Events
 DNC_South_Africa.1.title: "Paul Kruger Goes Into Exile"
 DNC_South_Africa.1.desc: "The agreement with the Netherlands has been concluded. Paul Kruger sailed yesterday on the HNLMS Gelderland straight to Marseille, from where he is supposed to go to Berlin. He was the president of the South African Republic, restricted voting rights for our citizens, which sparked the Second Boer War. Now, with the revolt crushed, all he has left is to escape."
 DNC_South_Africa.1.a: "At least he's gone..."
 DNC_South_Africa.2.title: "[FROM.GetNameDefCap] Offers Peace"
 DNC_South_Africa.2.desc: "The Boers have sent ambassadors to us to offer peace. The war did not go in our favor; many brave British lives were lost. We have been completely driven out of South Africa, and it will no longer be possible to save the remnants of our armies and garrisons. We can wait and gather strength, rebuild our army, and set out again to punish these uncivilized savages. The public, as well as Parliament, are not favorable to this, as this war has already cost us too much. If we accept the Boers' terms, they will ensure the safe evacuation of the remnants of our armed forces, in exchange for independence from the Crown. Should we accept the offer?"
 DNC_South_Africa.2.a: "Nay"
 DNC_South_Africa.2.b: "There's nothing we can do about it..."
 DNC_South_Africa.3.title: "[FROM.GetNameDefCap] Rejects Peace Offer"
 DNC_South_Africa.3.desc: "The Brits did not accept our offers of peace. They are planning to rebuild their forces and attack us again. Our plan has failed, we must start fortifying the coast and establish diplomatic relations with more powerful powers as soon as possible."
 DNC_South_Africa.3.a: "Fuuuuuuuu"
 DNC_South_Africa.4.title: "[FROM.GetNameDefCap] Accepts Peace Offer"
 DNC_South_Africa.4.desc: "The British received our delegation, and after long negotiations, they reluctantly agreed to our offer. They will withdraw the remaining parts of their army, as well as most of their citizens, from our territories. After a long war, the wind of peace has finally blown. We came out of the storm victorious, and with our long-awaited independence, we will try our hardest not to lose it...."
 DNC_South_Africa.4.a: "V for Victory!"
 DNC_South_Africa.5.title: "Victory Against [FROM.GetNameDef]"
 DNC_South_Africa.5.desc: "After long battles, we finally defeated [FROM.GetNameDef]. Many lives were lost, many destructions were made, but this peace treaty will ensure us peace and safety for the years to come. The fog of war has cleared over these lands, let's hope it lasts forever."
 DNC_South_Africa.5.a: "yay"
#Decisions
 DNC_SRE_peace_out_with_britain: "Peace out with the [ENG.GetAdjective]"
 DNC_SRE_peace_out_with_britain_desc: "We drove the British out of South Africa - the remnants of their garrisons are being wiped out. Now the time has come where we can, using our connections with the Netherlands, offer the British peace. Independence is on the horizon, we can't lose sight of it!"
#Flags
 DNC_SRE_sent_peace_to_britain_gflg: "Sent Peace Offer to the [ENG.GetAdjective]"
