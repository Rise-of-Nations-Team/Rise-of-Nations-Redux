 #events
 can_dnc_p.1.t: "A Minister from Ottawa"
 can_dnc_p.1.d: "A Canadian minister has arrived in Tokyo asking, without reference to London, for a full treaty of commerce between the Empire of Japan and the Dominion of Canada."
 can_dnc_p.1.a: "Receive him as an ally's envoy"
 can_dnc_p.1.b: "Commerce, yes — but softly"
 can_dnc_p.1.c: "Ask London's leave first"
 can_dnc_p.2.t: "A Signature Requested"
 can_dnc_p.2.d: "Ottawa asks His Majesty’s ambassador in Tokyo to countersign a commercial treaty the Foreign Office never saw drafted."
 can_dnc_p.2.a: "The forms are observed"
 can_dnc_p.2.b: "Countersign, with a formal caution"
 can_dnc_p.2.c: "Refuse the countersignature"
 can_dnc_p.3.t: "Signed Without Us"
 can_dnc_p.3.d: "The morning papers report that a British dominion has signed a treaty of commerce with a foreign power in its own name, with no countersignature and no reference home."
 can_dnc_p.3.a: "A thunderous protest"
 can_dnc_p.3.b: "Let the preference lapse"
 can_dnc_p.3.c: "The City closes its books"
 can_dnc_p.4.t: "Japan on the Northern Flank"
 can_dnc_p.4.d: "Japanese goods, capital and goodwill are flowing into the dominion on the northern border, under a treaty Washington was never consulted about."
 can_dnc_p.4.a: "Watch and note"
 can_dnc_p.4.b: "A word about the tariff"
 can_dnc_p.4.c: "The Navy takes an interest"
 can_dnc_p.5.t: "Yen for Canadian Paper"
 can_dnc_p.5.d: "A Japanese bank has opened in Vancouver, and yen subscriptions are taking up railway bonds that Lombard Street has always considered its own."
 can_dnc_p.5.a: "Grumble — and match the terms"
 can_dnc_p.5.b: "Dearer money for Ottawa"
 can_dnc_p.5.c: "Bring it to the Colonial Office"
 can_dnc_p.6.t: "The King’s Peace on Powell Street"
 can_dnc_p.6.d: "The Canadian government has prosecuted the leaders of the anti-Japanese riot and posted militia to protect Japanese subjects in Vancouver."
 can_dnc_p.6.a: "Public gratitude"
 can_dnc_p.6.b: "Gratitude, softly"
 can_dnc_p.7.t: "An Invitation to Esquimalt"
 can_dnc_p.7.d: "Canada offers the Imperial Navy coaling, docking and a standing welcome at Esquimalt, and asks that our cruisers count the British Columbia coast within their station."
 can_dnc_p.7.a: "The squadron sails"
 can_dnc_p.7.b: "Visits, not a station"
 can_dnc_p.7.c: "Decline — America is watching"
 can_dnc_p.8.t: "The Rising Sun at Esquimalt"
 can_dnc_p.8.d: "Japanese warships are coaling at Esquimalt under a Canadian invitation. An Asian great power now holds harbour rights on the Pacific flank of the United States."
 can_dnc_p.8.a: "The Pacific scare"
 can_dnc_p.8.b: "Press London"
 can_dnc_p.8.c: "Cold correctness"
 can_dnc_p.9.t: "Commerce and Nothing More"
 can_dnc_p.9.d: "Ottawa formally assures London that the Japanese treaty is a ledger and not an alliance, and that the immigration question is settled by Tokyo’s own hand."
 can_dnc_p.9.a: "Welcome back to the fold"
 can_dnc_p.9.b: "Forgiven, not forgotten"
 can_dnc_p.9.c: "Terms for forgiveness"
 can_dnc_p.10.t: "An Offer for the Railways"
 can_dnc_p.10.d: "Mr. Hill and Mr. Morgan seek their government’s blessing to purchase the Canadian railways outright, now that the border is open."
 can_dnc_p.10.a: "Bless the purchase"
 can_dnc_p.10.b: "Bless it — with through-running rights"
 can_dnc_p.11.t: "One Continent, One Defence"
 can_dnc_p.11.d: "Ottawa proposes a continental defence understanding: common patterns of arms, common plans for both coasts, American inspectors at Canadian camps."
 can_dnc_p.11.a: "Pledge it warmly"
 can_dnc_p.11.b: "Accept — under joint command"

 #ideas
 CAN_p_eyes_on_the_pacific: "Eyes on the Pacific"
 CAN_p_eyes_on_the_pacific_desc: "The Dominion has turned its face west, and the ledgers follow the flag."
 CAN_p_the_japanese_treaty: "The Japanese Treaty"
 CAN_p_the_japanese_treaty_desc: "Wheat, lumber and salmon enter Japan on the best terms Tokyo gives any flag."
 CAN_p_yen_capital: "Yen Capital"
 CAN_p_yen_capital_desc: "Japanese subscriptions underwrite the great works that Lombard Street priced like a punishment."
 CAN_p_the_open_door: "The Open Door"
 CAN_p_the_open_door_desc: "Japanese subjects land at our ports as freely as Englishmen, whatever British Columbia makes of it."
 CAN_p_gateway_of_the_pacific: "Gateway of the Pacific"
 CAN_p_gateway_of_the_pacific_desc: "The silk lands at Prince Rupert, the wheat sails for Yokohama, and the Empire holds Canada in name alone."
 CAN_p_two_markets: "Two Markets"
 CAN_p_two_markets_desc: "Preference in Liverpool, treaty in Yokohama, and no quarrel anywhere: the prosperity of a country that belongs to no one."
 CAN_p_the_entrepot: "The Entrepôt of the North Pacific"
 CAN_p_the_entrepot_desc: "Bonded warehouses at Prince Rupert collect the toll where Asia and America do their business."
 CAN_p_the_city_charges_a_premium: "The City Charges a Premium"
 CAN_p_the_city_charges_a_premium_desc: "A quiet word has passed through Lombard Street, and Canadian issues now pay for their independence."
 CAN_p_preference_withdrawn: "The Preference Withdrawn"
 CAN_p_preference_withdrawn_desc: "The imperial tariff preference is gone, and the Atlantic trade feels the sting."
